 BIOSHIP_SENSOR_1: "Radiolocalización"
 BIOSHIP_SENSOR_1_DESC: "Estos órganos sensoriales usan un equivalente biológico al RADAR para funcionar en el espacio profundo. Esto permite que las naves dispongan de una capacidad básica de detección y seguimiento."
 BIOSHIP_SENSOR_2: "Sensores gravitacionales"
 BIOSHIP_SENSOR_2_DESC: "Estos órganos sensoriales han sido desarrollados para detectar cambios gravitacionales en el espacio, como aquellos que se producen por la presencia de una nave espacial."
