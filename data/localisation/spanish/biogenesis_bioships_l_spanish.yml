 #Unique components
 MAULER_PURSUIT_1: "Reciclador metabólico"
 MAULER_PURSUIT_1_DESC: "El reciclaje de residuos químicos producidos por los órganos motores de la nave aumenta su aguante."
 MAULER_PURSUIT_2: "Reciclador energético"
 MAULER_PURSUIT_2_DESC: "El aguante de la nave aumenta más aún al incorporar motas volátiles a sus sistemas de reciclaje."
 MAULER_BITER_1: "Fluidos corrosivos"
 MAULER_BITER_1_DESC: "Glándulas implantadas modifican los fluidos corporales de nuestros $mauler_class_plural_cap$, lo que los vuelve corrosivos y aumenta su potencial de destrucción."
 MAULER_BITER_2: "Fluidos cáusticos"
 MAULER_BITER_2_DESC: "La incorporación de motas volátiles en los fluidos de nuestros $mauler_class_plural_cap$ aumenta más aún el daño que infligen, especialmente al blindaje de las naves enemigas."
 weapon_type_mandible: "§YMandíbula§!"
 mod_weapon_type_mandible_weapon_damage_mult: "Daño por armas de mandíbula"
 APPLIED_MODIFIERS_SUPPORT_TITLE: "Modificadores de armas de apoyo aplicados:"
 WEAVER_GROWTH_AURA_1: "Feromonas de desarrollo"
 WEAVER_GROWTH_AURA_1_DESC: "Los tejedores exudan toda una serie compleja de señales bioquímicas que estimulan la maduración de los seres orgánicos que hay cerca. Estas feromonas de desarrollo aceleran el crecimiento de las flotas y las vuelven más adaptables, de manera que no tardan en evolucionar para hacer frente a cualquier desafío."
 WEAVER_GROWTH_AURA_2: "Feromonas de desarrollo exóticas"
 WEAVER_GROWTH_AURA_2_DESC: "Mediante bioingeniería de última generación, estas feromonas ven incrementada su potencia, lo que acelera en gran medida el crecimiento y la optimización de las naves biológicas aliadas. Con esta aura mejorada, la flota opera a pleno rendimiento y con una velocidad asombrosa, incluso en el fragor de la batalla."
 GROWTH_AURA: "$WEAVER_GROWTH_AURA_1$"
 GROWTH_AURA_TT: "§PEsta aura solo se aplica a naves biológicas capaces de crecer.§!"
 WEAVER_BOOSTER_1: "Amplificador simbiótico básico"
 WEAVER_BOOSTER_1_DESC: "Este dispositivo orgánico fortalece los vínculos entre naves biológicas, agilizando la circulación de energía y la coordinación en la flota. Su inclusión en la misma garantiza una mayor eficiencia en combate y una logística de recursos superior."
 WEAVER_BOOSTER_2: "Amplificador simbiótico mejorado"
 WEAVER_BOOSTER_2_DESC: "Este dispositivo es una versión más avanzada del amplificador simbiótico que se ajusta de forma dinámica a las necesidades de la flota, potenciando su eficiencia y capacidad de reacción. Optimiza las capacidades de toda la flota, garantizando una adaptabilidad perfecta durante las operaciones."
 HARBINGER_INCUBATOR_1: "Matriz de incubación"
 HARBINGER_INCUBATOR_1_DESC: "Esta matriz celular se forma en torno a los huevos de naves de ataque en proceso de maduración y funciona como una incubadora de bioingeniería."
 HARBINGER_INCUBATOR_2: "$HARBINGER_INCUBATOR_1$ veloz"
 HARBINGER_INCUBATOR_2_DESC: "La exposición a gases exóticos durante el periodo de incubación estimula la maduración rápida de las naves de ataque de esta nave."
 HARBINGER_CHITIN_1: "Reguladores de crecimiento quitinosos"
 HARBINGER_CHITIN_1_DESC: "Las secreciones de los hangares estimulan el crecimiento quitinoso en las naves de ataque en desarrollo, lo que refuerza su durabilidad."
 HARBINGER_CHITIN_2: "Reguladores de crecimiento cristalinos"
 HARBINGER_CHITIN_2_DESC: "Engarzar cristales raros en los exoesqueletos quitinosos de nuestra nave de ataque aporta una resistencia al daño aún mayor."
 STINGER_RANGE_1: "Grupo telemétrico"
 STINGER_RANGE_1_DESC: "Un grupo neuronal secundario cuya función es procesar datos sensoriales."
 STINGER_RANGE_2: "$STINGER_RANGE_1$ mejorada"
 STINGER_RANGE_2_DESC: "Los cristales raros incrustados en las vainas de las vías neuronales sirven para mejorar el procesamiento de objetivos."
 STINGER_FIRE_RATE_1: "Espiráculos de escape térmico"
 STINGER_FIRE_RATE_1_DESC: "Una serie de escapes térmicos repartidos por el tórax de esta nave le permiten expulsar al espacio gases comprimidos a temperaturas altas, lo que mejora la cadencia de fuego de sus armas."
 STINGER_FIRE_RATE_2: "Espiráculos volátiles"
 STINGER_FIRE_RATE_2_DESC: "El uso de motas volátiles como medio de intercambio de calor precisa de una matriz celular específica que impida explosiones no deseadas."
 #Armor/Carapace
 tech_bio_ship_armor_1: "$tech_ship_armor_1$"
 BIO_ARMOR_1: "$NANOCOMPOSITE_CARAPACE$"
 BIO_ARMOR_1_DESC: "Este blindaje biológico avanzada integra tejidos orgánicos resistentes con materiales nanoestructurados, creando un caparazón vivo capaz de soportar impactos extremos. El caparazón se adapta por sí solo al daño sufrido, regenerándose con rapidez y procurando a la nave una protección sin igual."
 SMALL_BIO_ARMOR_1: "$BIO_ARMOR_1$ pequeña"
 MEDIUM_BIO_ARMOR_1: "$BIO_ARMOR_1$ mediana"
 LARGE_BIO_ARMOR_1: "$BIO_ARMOR_1$ grande"
 tech_bio_ship_armor_2: "$tech_ship_armor_2$"
 BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$"
 BIO_ARMOR_2_DESC: "Gracias a sus capas de quitina reforzadas con compuestos cerámicos, este blindaje biológico posee un aguante excepcional y un buen aislamiento térmico. Su estructura en capas ofrece una protección robusta al tiempo que conserva la flexibilidad necesaria para las naves orgánicas."
 SMALL_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ pequeña"
 MEDIUM_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ mediana"
 LARGE_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ grande"
 tech_bio_ship_armor_3: "$tech_ship_armor_3$"
 BIO_ARMOR_3: "$PLASTEEL_CARAPACE$"
 BIO_ARMOR_3_DESC: "Este blindaje biológico combina resistentes tejidos orgánicos con refuerzos de plastiacero, logrando así un equilibrio portentoso entre fuerza y flexibilidad. La estructura híbrida brinda una protección superior contra ataques cinéticos y de energía, por lo que se trata de una opción idónea en naves biológicas."
 SMALL_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ pequeña"
 MEDIUM_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ mediana"
 LARGE_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ grande"
 tech_bio_ship_armor_4: "$tech_ship_armor_4$"
 BIO_ARMOR_4: "Caparazón de duracero"
 BIO_ARMOR_4_DESC: "Este blindaje biológico, infundido con compuestos orgánicos duraderos, proporciona una resistencia excepcional al daño sostenido. Su configuración híbrida da lugar a un aguante admirable sin comprometer la flexibilidad de las naves vivas."
 SMALL_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ pequeña"
 MEDIUM_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ mediana"
 LARGE_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ grande"
 tech_bio_ship_armor_5: "$tech_ship_armor_5$"
 BIO_ARMOR_5: "Caparazón de neutronio"
 BIO_ARMOR_5_DESC: "Este caparazón, todo un portento de la bioingeniería, incorpora en su tejido orgánico filamentos de neutronio que conforman un blindaje prácticamente impenetrable. Su composición densa a la par que adaptable brinda una protección inigualable incluso ante las fuerzas más destructivas."
 SMALL_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ pequeña"
 MEDIUM_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ mediana"
 LARGE_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ grande"
 tech_bio_dragon_armor: "$tech_dragon_armor$"
 DRAGON_BIO_ARMOR: "$DRACONIC_CARAPACE$"
 DRAGON_BIO_ARMOR_DESC: "Este caparazón, el pináculo de la evolución del blindaje biológico, está inspirado en los antiguos superdepredadores. Su estructura estratificada combina materia orgánica regeneradora con bioaleaciones prácticamente indestructibles, procurando así una protección tan feroz y tenaz como las criaturas que inspiraron su diseño."
 SMALL_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ pequeña"
 MEDIUM_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ mediana"
 LARGE_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ grande"
 tech_bio_archaeoarmor: "$tech_archaeoarmor$"
 BIO_ARCHAEO_ARMOR: "Caparazón de pulsos"
 BIO_ARCHAEO_ARMOR_DESC: "Los estratos ionizados que componen el caparazón generan una carga reactiva que distribuye la energía de los impactos recibidos por campos proyectados y de repulsión magnética."
