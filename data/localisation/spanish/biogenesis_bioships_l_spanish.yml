 bio_ship_unique_components: "Órganos suplementarios"
 bio_ship_unique_components_DESC: "Criados dentro de cascos vivientes o bien incrustados en ellos, estos órganos suplementarios refinan los atributos idiosincráticos de las naves biológicas."
 MAULER_STAGE_1_GROWTH_1: "Glándula de crecimiento de $ship_growth_stage_1$"
 MAULER_STAGE_1_GROWTH_1_DESC: "Las glándulas implantadas secretan una potente mezcla de hormonas y esteroides, lo que obliga a esta nave a avanzar a la siguiente etapa de crecimiento."
 MAULER_STAGE_1_GROWTH_2: "Glándula de crecimiento acelerado de $ship_growth_stage_1$"
 MAULER_STAGE_1_GROWTH_2_DESC: "Este órgano integra gases exóticos en sus secreciones ricas en hormonas y esteroides, acelerando así el crecimiento de las naves biológicas."
 MAULER_STAGE_2_GROWTH_1: "Glándula de crecimiento de $ship_growth_stage_2$"
