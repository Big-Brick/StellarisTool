 #Combat Computers
 BIO_COMBAT_COMPUTER_DEFAULT: "Instinto de combate"
 BIO_COMBAT_COMPUTER_DEFAULT_DESC: "Todas las naves biológicas poseen un instinto de combate rudimentario que les permite efectuar maniobras evasivas y cálculos de puntería."
 BIO_COMBAT_COMPUTER_BASIC: "Implantes neurales"
 BIO_COMBAT_COMPUTER_BASIC_DESC: "Estos implantes se acoplan directamente a los sistemas orgánicos de la nave, agilizando la toma de decisiones y perfeccionando su coordinación táctica. Como si de un ordenador de combate viviente se tratasen, aumentan la percepción de peligros y el rendimiento de la nave en combate."
 BIO_COMBAT_COMPUTER_ADVANCED: "Implantes neurales avanzados"
 BIO_COMBAT_COMPUTER_ADVANCED_DESC: "Estos sistemas son una versión desarrollada de los implantes neurales básicos y aumentan el procesamiento táctico y la velocidad de toma de decisiones. Redoblan la eficacia y la coordinación de las naves biológicas, de manera que pueden responder con inmediatez a cambios en las condiciones del campo de batalla."
 BIO_COMBAT_COMPUTER_SAPIENT: "Implantes neurales inteligentes"
 BIO_COMBAT_COMPUTER_SAPIENT_DESC: "Estos implantes están dotados de una inteligencia biosapiente capaz de proyectar estrategias de manera independiente. Una combinación de instinto orgánico y razonamiento estratégico permite a las naves biológicas adaptarse dinámicamente a situaciones de combate complejas, presentando una capacidad de tomar decisiones que raya en el pensamiento autónomo."
 BIO_COMBAT_COMPUTER_AUTONOMOUS: "Implantes neurales autónomos"
 BIO_COMBAT_COMPUTER_AUTONOMOUS_DESC: "Estos sistemas operan con plena autonomía. Dotados de una inteligencia biológica con conciencia propia, brindan a las naves la posibilidad de analizar, plantear estrategias y ejecutar decisiones sin intervención externa, logrando así una efectividad incomparable en combate."
 BIO_COMBAT_COMPUTER_PRECOG: "Instinto de combate precognitivo"
 BIO_COMBAT_COMPUTER_PRECOG_DESC: "Estos implantes emplean energía psiónica para dotar a las naves biológicas de percepción precognitiva, de manera que pueden anticiparse a las acciones del enemigo antes de que este las ejecute. Esta capacidad, que roza lo sobrenatural, confiere a las flotas una ventaja decisiva que les permite reaccionar a las amenazas más complejas en cuestión de milisegundos."
