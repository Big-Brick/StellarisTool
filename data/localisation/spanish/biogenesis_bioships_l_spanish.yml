 tech_maulers: "$mauler_class_plural_cap$"
 tech_maulers_desc: "Los avances en bioingeniería han permitido el crecimiento de naves espaciales con capacidad UL y aplicaciones militares."
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_1$"
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_DESC: "§H$mauler_stage_1$§!\nEl $mauler_class_cap$ es la nave militar más básica. Cuenta con armas de corto alcance y un grueso blindaje de caparazón."
 tech_mauler_build_speed: "Incubación de maceros estandarizados"
 tech_mauler_build_speed_desc: "Estas cámaras de incubación aceleran la gestación de naves de guerra embrionarias con biocápsulas cargadas de nutrientes. Pese a su carácter rudimentario, suponen un primer paso hacia una flota que se cría en lugar de construirse."
 tech_mauler_build_speed_effect: "$mod_ship_mauler_cost_mult$: §G-5%§!\n$mauler_class_cap$ Velocidad de construcción: §G+25%§!"
 tech_mauler_growth_1: "Desarrollo de maceros mejorados"
 tech_mauler_growth_1_desc: "Gracias al refinamiento de los procesos de incubación, el tiempo de maduración se abrevia y mejora la integridad estructural de las naves orgánicas. Los sistemas mejorados de suministro de nutrientes y el ajuste genético garantizan que las naves sean rápidas y resistentes."
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_2$"
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_DESC: "§H$mauler_stage_2$§!\nSe ha propiciado de forma selectiva el desarrollo de un $mauler_class_cap$ $ship_growth_stage_2$ para lograr mayor potencia de fuego y blindaje."
 gateway_bio_ships: "§HSenda de naves biológicas§!\n§EEsta tecnología dará pie a avances ulteriores que incrementarán el poder de nuestras naves biológicas.§!"
 tech_mauler_growth_2: "Desarrollo de maceros avanzados"
 tech_mauler_growth_2_desc: "Estas instalaciones dan lugar a naves de vigor incomparable y gran capacidad de adaptación. Sus matrices genéticas optimizadas y sistemas de apoyo biotecnológico la dotan de una desenvoltura incomparable en el vacío."
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_3$"
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_DESC: "§H$mauler_stage_3$§!\nUn $mauler_class_cap$ $ship_growth_stage_3$ es el pináculo de las naves tipo $mauler_class_cap$. Cuenta con un buen blindaje y con una gran cantidad de armas de corto alcance."
 #Weaver Technologies
 tech_weavers: "$weaver_class_plural_cap$"
 tech_weavers_desc: "Los tejedores cimentan su anatomía en los fundamentos primigenios de la bioingeniería, aunando agilidad y funciones de combate mejoradas."
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_1$"
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_DESC: "§H$weaver_stage_1$§!\nEl $weaver_class_cap$ es una nave biológica de tamaño medio y gran versatilidad concebida para aventajar a enemigos de mayor envergadura y respaldar las maniobras ofensivas de flotas enteras."
 tech_weaver_build_speed: "Incubación de tejedores estandarizados"
 tech_weaver_build_speed_desc: "Estas instalaciones nutren naves biológicas de tamaño mediano en biocápsulas refinadas, empleando un mejor suministro de nutrientes y optimización genética para producir naves ágiles y adaptables para la flota."
 tech_weaver_build_speed_effect: "$mod_ship_weaver_cost_mult$: §G-5%§!\nVelocidad de construcción de $weaver_class_cap$: §G+25%§!"
 tech_weaver_growth_1: "Desarrollo de tejedores mejorados"
 tech_weaver_growth_1_desc: "Estas instalaciones emplean técnicas mejoradas de bioingeniería para acelerar los ciclos de crecimiento y mejorar la adaptabilidad de las naves. Las matrices genéticas mejoradas y los entornos optimizados garantizan que estas naves biológicas sean duraderas y con una gran capacidad de respuesta en combate."
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_2$"
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_DESC: "§H$weaver_stage_2$§!\nSe ha propiciado de forma selectiva el desarrollo de un $weaver_class_cap$ $ship_growth_stage_2$ con el fin de aumentar su movilidad y adaptabilidad en las operaciones de la flota."
 tech_weaver_growth_2: "Desarrollo de tejedores avanzados"
 tech_weaver_growth_2_desc: "En estas instalaciones se producen naves biológicas cuya precisión y versatilidad no tienen rival. Las técnicas de crecimiento revolucionarias y las mejoras genéticas adaptativas dan lugar a naves que prosperan incluso en las situaciones tácticas más exigentes."
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_3$"
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_DESC: "§H$weaver_stage_3$§!\nSe ha propiciado con gran meticulosidad el desarrollo de un $weaver_class_cap$ $ship_growth_stage_3$ con el fin de dotarlo de una agilidad y una versatilidad táctica superiores."
 #Harbinger Technologies
 tech_harbingers: "$harbinger_class_plural_cap$"
 tech_harbingers_desc: "El heraldo supone un antes y un después en materia de bioingeniería bélica, pues combina una formidable potencia de fuego con la resiliencia de la tecnología viva. Estas naves constituyen la espina dorsal de la flota."
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_1$"
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_DESC: "§H$harbinger_stage_1$§!\nEl $harbinger_class_cap$ engendra naves de ataque que engrosan su flota."
 tech_harbinger_build_speed: "Incubación de heraldos estandarizados"
 tech_harbinger_build_speed_desc: "Estas instalaciones nutren grandes naves biológicas, alimentándolas mediante una infusión avanzada de nutrientes para garantizar su resiliencia y preparación para el combate."
 tech_harbinger_build_speed_effect: "$mod_ship_harbinger_cost_mult$: §G-5%§!\nVelocidad de construcción de $harbinger_class_cap$: §G+25%§!"
 tech_harbinger_growth_1: "Desarrollo de heraldos mejorados"
 tech_harbinger_growth_1_desc: "Las instalaciones refinadas emplean sofisticadas técnicas de bioingeniería para acelerar el crecimiento y mejorar la integridad estructural. El resultado: naves con resistencia y eficiencia de combate superiores."
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_2$"
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_DESC: "§H$harbinger_stage_2$§!\nLas técnicas de crecimiento mejorado producen naves más fuertes y fiables."
 tech_harbinger_growth_2: "Desarrollo de heraldos avanzados"
 tech_harbinger_growth_2_desc: "Los sistemas de incubación avanzada producen naves biológicas dotadas de resistencia y armamento excepcionales. El ajuste genético y unos entornos de crecimiento superiores dan lugar a naves capaces de dominar el campo de batalla con una resiliencia inigualable."
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_3$"
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_DESC: "§H$harbinger_stage_3$§!\nConcebido para ostentar una fuerza sin parangón y ejercer una superioridad aplastante."
 #Stinger Technologies
 tech_stingers: "$stinger_class_plural_cap$"
 tech_stingers_desc: "Los aguijones están diseñados para asestar golpes devastadores contra objetivos de capital importancia. Su especialidad es aprovechar las vulnerabilidades en las defensas enemigas."
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_1$"
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_DESC: "§H$stinger_stage_1$§!\nUna nave biológica veloz y mortífera, criada para asestar ataques de precisión y abrumar al enemigo con su superioridad táctica."
 tech_stinger_build_speed: "Incubación de aguijones estandarizados"
 tech_stinger_build_speed_desc: "En estas instalaciones se desarrollan naves biológicas ágiles y elegantes, diseñadas para lograr precisión y velocidad. Mediante avanzadas biocápsulas y soluciones de nutrientes especializadas, se producen naves idóneas para ejecutar ataques precisos con suma eficiencia."
 tech_stinger_build_speed_effect: "$mod_ship_stinger_cost_mult$: §G-5%§!\nVelocidad de construcción de $stinger_class_cap$: §G+25%§!"
 tech_stinger_growth_1: "Desarrollo de aguijones mejorados"
 tech_stinger_growth_1_desc: "Unas instalaciones refinadas aceleran los ciclos de crecimiento y mejoran la precisión de la bioingeniería, lo que da lugar a naves con maniobrabilidad y precisión superiores. Estas mejoras convierten al aguijón en una fuerza devastadora en enfrentamientos tácticos."
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_2$"
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_DESC: "§H$stinger_stage_2$§!\nSe ha perfeccionado para aumentar su velocidad y precisión en operaciones tácticas."
 tech_stinger_growth_2: "Desarrollo de aguijones avanzados"
 tech_stinger_growth_2_desc: "Como cúspide de la tecnología de crecimiento de naves biológicas, estas instalaciones avanzadas producen aguijones de una velocidad y letalidad inigualables. Mediante el uso de plantillas genéticas optimizadas e innovadoras técnicas de incubación, se logran naves rápidas y mortíferas capaces de imponerse en cualquier tesitura."
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_3$"
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_DESC: "§H$stinger_stage_3$§!\nSu cría está orientada a lograr la velocidad, precisión y supremacía definitivas."
