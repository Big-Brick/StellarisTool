 BIOSHIP_SENSOR_3: "Sensores subespaciales"
 BIOSHIP_SENSOR_3_DESC: "Órganos sensoriales que detectan las fluctuaciones subespaciales que dejan a su paso las naves especiales. La sensibilidad y el alcance superan a cualquier órgano sensorial anterior que se desarrollara para el espacio profundo."
