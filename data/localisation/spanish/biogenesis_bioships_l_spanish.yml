 #Graphical Cultures #
 ######################
 BIOGENESIS_CAT: "BioGenesis"
 BIOGENESIS_01: "Espinóvoro"
 BIOGENESIS_02: "Artesanía de casco"
 graphical_culture_tooltip_not_biological: "No posee un conjunto de naves ['concept_biological_ship', biológicas]"
 graphical_culture_tooltip_biological: "Debe poseer un conjunto de naves ['concept_biological_ship', biológicas]"
 concept_biological_ship: "$bio_ship$"
 concept_biological_ships: "$concept_biological_ship$"
 concept_biological_ship_desc: "- Las naves biológicas se catalogan por clases de combate, cada cual con funciones bien definidas y tres etapas de crecimiento. $NEW_LINE$- Los costes de construcción, por lo general, consisten en $i_food$ en lugar de $i_alloys$ $NEW_LINE$- Los costes de mantenimiento, por lo general, consisten en $i_food$ en lugar de $i_energy$. $NEW_LINE$- Dependen de tecnologías de §Y£society£biología§! en lugar de tecnologías de §Y£engineering£arte del vacío§!. $NEW_LINE$$h_line$§LLas naves vivas compuestas de enormes fibras musculares onduladas llenas de orgánulos bioluminiscentes liberan compuestos ricos en energía para producir ráfagas de luz y calor para la propulsión.§!"
 default_ship: "Naves mecánicas"
 bio_ship: "Naves biológicas"
 #Shipset Descriptions
 biogenesis_01_shipset_desc: "§HTipo de conjunto de naves: ['concept_biological_ship', biológicas]§!\nMás engendradas que construidas, estas naves de guerra orgánicas son el epítome de la superdepredación. Su biomasa semisintiente se adapta, caza y ataca con voracidad insaciable."
 biogenesis_02_shipset_desc: "§HTipo de conjunto de naves: ['concept_biological_ship', biológicas]§!\nCultivadas para los más audaces, estas naves de robusta coraza no existen para servir sin más, sino que resisten y crecen junto a los intrépidos exploradores que las llaman hogar."
 humanoid_01_shipset_desc: "Recias y denodadas, estas naves están concebidas para sobrevivir a las inclemencias del espacio profundo. Diseñadas para conquistar lo desconocido, llevan las esperanzas y los sueños de sus creadores a las estrellas más lejanas."
 synthetics_01_shipset_desc: "Estos diseños reflejan la pureza de mentes infatigables. Los serpentines térmicos de sus cascos dispersan la energía de la unidad central, de manera que el organismo opera en su totalidad con la eficiencia más absoluta."
 mammalian_01_shipset_desc: "Creadas para durar, estas naves formidables dan testimonio de la entereza de sus artífices. Sus densos cascos aíslan y protegen, mientras que sus sistemas redundantes garantizan su supervivencia en los ambientes más inhóspitos."
 reptilian_01_shipset_desc: "Este diseño práctico a la vez que tosco evoca la resistencia de un depredador. La presencia de esta nave en el vacío constituye un testamento de la tenacidad inmisericorde de quienes la concibieron."
 avian_01_shipset_desc: "Gráciles y refinadas, estas versátiles naves rinden homenaje a la belleza del vuelo. Cada curva y cada contorno es digno de una especie que no entiende el espacio como un escollo, sino como una prolongación del cielo."
 arthropoid_01_shipset_desc: "Quitina o acero, forma o utilidad... No existe distinción. Estas naves se concibieron más para resistir que para sobrecoger, y su casco estratificado pone de manifiesto una filosofía cuyo epicentro es la supervivencia más aséptica."
 molluscoid_01_shipset_desc: "Estas naves, elegantes pero duraderas, son al mismo tiempo refugio y lanza. Bajo su dura coraza, complejos sistemas regulan el trasiego de energía y los ciclos de nutrientes con silenciosa eficiencia."
 fungoid_01_shipset_desc: "Estas naves bulbosas evocan la belleza de los brotes fúngicos. Concebidas con la autosuficiencia como máxima, sus sistemas especializados forman intrincadas redes internas, a semejanza de los patrones lógicos de un micelio."
 plantoid_01_shipset_desc: "Estas naves frondosas no solo viajan por las estrellas, sino que también echan raíces entre ellas. Sus góndolas fotosintéticas velan por el equilibrio de los biomas de a bordo."
 lithoid_01_shipset_desc: "Forjadas por el tiempo y la presión, estas naves de aspecto rocoso son un paradigma de permanencia. Matrices de silicatos cristalizados blindan los sistemas principales, extrayendo su energía de las mismísimas fuerzas que dan forma a los mundos."
 necroid_01_shipset_desc: "Oscuras e infaustas, estas catedrales flotantes son monumentos a la muerte y el renacer. Sus núcleos entrópicos y diseños rituales aluden a poderes del vacío y una ambición perpetua."
 nemesis_01_shipset_desc: "Estos colosos imponentes conminan a someterse ante ellos. Sus superestructuras reforzadas y sistemas redundantes proyectan un aura de dominio inigualable."
 aquatic_01_shipset_desc: "Volubles, pero no por ello menos firmes, estas naves canalizan un poder oceánico. Su interior acuático y su hidrodinámico contorno son fiel reflejo de la gracilidad de sus creadores."
 toxoid_01_shipset_desc: "Estas naves emiten gases, traquetean precarias y desafían a toda regla. Pero funcionan. Nutriéndose de residuos y apuntaladas por un ingenio obstinado, perduran donde otras fracasan."
 cybernetics_01_shipset_desc: "Los exteriores cromados, el siseo de los circuitos y los reflejos metálicos están ya desfasados. Con enlaces neurales directos, no hay retardos ni límites; tan solo una intachable precisión de altísimo octanaje."
