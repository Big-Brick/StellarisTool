 #Shields/Musculature
 tech_bio_shields_1: "$tech_shields_1$"
 BIO_SHIELD_1: "Musculatura deflectora"
 BIO_SHIELD_1_DESC: "El tejido muscular especializado genera un campo de energía que forma un escudo deflector protector. Aunque su capacidad de absorción de daño es limitada, se regenera con rapidez."
 SMALL_BIO_SHIELD_1: "$BIO_SHIELD_1$ pequeña"
 MEDIUM_BIO_SHIELD_1: "$BIO_SHIELD_1$ mediana"
 LARGE_BIO_SHIELD_1: "$BIO_SHIELD_1$ grande"
 tech_bio_shields_2: "$tech_shields_2$"
 BIO_SHIELD_2: "Musculatura deflectora mejorada"
 BIO_SHIELD_2_DESC: "Tejidos musculares avanzados canalizan energía de forma más eficiente a fin de fortalecer los escudos deflectores. Estos sistemas mejorados absorben más daño y tardan menos en recargarse, lo que ofrece una protección mayor en combates prolongados."
 SMALL_BIO_SHIELD_2: "$BIO_SHIELD_2$ pequeña"
 MEDIUM_BIO_SHIELD_2: "$BIO_SHIELD_2$ mediana"
 LARGE_BIO_SHIELD_2: "$BIO_SHIELD_2$ grande"
 tech_bio_shields_3: "$tech_shields_3$"
 BIO_SHIELD_3: "Musculatura de blindaje"
 BIO_SHIELD_3_DESC: "Esta avanzada tecnología de blindaje biológico integra sólidos tejidos con propiedades de conducción de energía y capacidades de protección mejoradas. Ofrece una fuerte resistencia contra ataques tanto energéticos como cinéticos, lo que garantiza una defensa adaptable para las naves biológicas en diversas situaciones de combate."
 SMALL_BIO_SHIELD_3: "$BIO_SHIELD_3$ pequeña"
 MEDIUM_BIO_SHIELD_3: "$BIO_SHIELD_3$ mediana"
 LARGE_BIO_SHIELD_3: "$BIO_SHIELD_3$ grande"
 tech_bio_shields_4: "$tech_shields_4$"
 BIO_SHIELD_4: "Musculatura de blindaje avanzada"
 BIO_SHIELD_4_DESC: "Esta musculatura reforzada, el pináculo de la tecnología de escudo biológico, conduce la energía de manera más efectiva, lo que mejora la fuerza del escudo. Ofrece buena protección ante ataques energéticos y cinéticos, lo que garantiza una defensa versátil en combate."
 SMALL_BIO_SHIELD_4: "$BIO_SHIELD_4$ pequeña"
 MEDIUM_BIO_SHIELD_4: "$BIO_SHIELD_4$ mediana"
 LARGE_BIO_SHIELD_4: "$BIO_SHIELD_4$ grande"
 tech_bio_shields_5: "$tech_shields_5$"
 BIO_SHIELD_5: "Musculatura de hiperblindaje"
 BIO_SHIELD_5_DESC: "Los tejidos hiperadaptativos canalizan inmensos flujos de energía, lo que crea una defensa casi impenetrable. Este avanzado sistema se regenera con rapidez, de manera que la nave biológica permanece protegida aun cuando le llueven ataques sin cuartel."
 SMALL_BIO_SHIELD_5: "$BIO_SHIELD_5$ pequeña"
 MEDIUM_BIO_SHIELD_5: "$BIO_SHIELD_5$ mediana"
 LARGE_BIO_SHIELD_5: "$BIO_SHIELD_5$ grande"
 tech_bio_dark_matter_deflector: "$tech_dark_matter_deflector$"
 DARK_MATTER_BIO_DEFLECTOR: "Musculatura con infusión de materia oscura"
 DARK_MATTER_BIO_DEFLECTOR_DESC: "Este blindaje biológico lleva incorporada materia oscura en sus tejidos orgánicos, lo que aumenta drásticamente la conductividad de energía y las capacidades defensivas. La infusión de esta exótica sustancia permite que la musculatura genere escudos de una fuerza inigualable, capaces de soportar niveles extraordinarios de daño."
 SMALL_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ pequeña"
 MEDIUM_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ mediana"
 LARGE_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ grande"
 tech_bio_psionic_barrier: "$tech_psionic_barrier$"
 PSI_BIO_SHIELD: "Musculatura con infusión de zro"
 PSI_BIO_SHIELD_DESC: "Esta avanzada musculatura lleva infundido zro, una sustancia reactiva a las energías psiónicas, y así genera escudos cuya precisión y adaptabilidad no tienen rival. Sus propiedades exclusivas aumentan la resistencia y la capacidad de regeneración del escudo biológico, que gracias a ello alcanza cotas de defensa cuasi preternaturales."
 SMALL_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ pequeña"
 MEDIUM_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ mediana"
 LARGE_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ grande"
 tech_bio_psionic_shield: "$tech_psionic_shield$"
 PSI_BIO_BARRIER: "Tejido psicorresonante"
 PSI_BIO_BARRIER_DESC: "Este extraordinario blindaje biológico aprovecha la energía psiónica a través de tejidos especialmente cultivados, creando defensas que se adaptan a las amenazas con una precisión asombrosa. La resonancia amplifica la fuerza del escudo y acelera la regeneración, lo que lo convierte en una potente protección incluso contra los ataques más impredecibles."
 SMALL_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ pequeña"
 MEDIUM_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ mediana"
 LARGE_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ grande"
 tech_bio_archaeoshield: "$tech_archaeoshield$"
 BIO_ARCHAEO_SHIELD: "Tejido de campo de suspensión"
 BIO_ARCHAEO_SHIELD_DESC: "Al cultivar tejidos de proyección de escudos alrededor de nódulos de artefactos antiguos, esta tecnología genera campos de suspensión que ralentizan el tiempo en el punto de impacto. Este desfase permite al escudo disipar la energía de los ataques recibidos, lo que aumenta de manera sustancial su capacidad defensiva."
 SMALL_BIO_ARCHAEO_SHIELD: "$BIO_ARCHAEO_SHIELD$ pequeña"
 MEDIUM_BIO_ARCHAEO_SHIELD: "$BIO_ARCHAEO_SHIELD$ mediana"
 LARGE_BIO_ARCHAEO_SHIELD: "$BIO_ARCHAEO_SHIELD$ grande"
 #Reactors
 tech_bio_fission_power: "$BIO_FISSION_REACTOR$"
 BIO_FISSION_REACTOR: "Metabolismo de fisión"
 BIO_FISSION_REACTOR_DESC: "Mediante bioingeniería avanzada, se puede lograr que un tracto digestivo actúe como un reactor nuclear biológico que da lugar a un metabolismo basado en la fisión inducida y produce tanto energía como desechos nucleares dañinos."
 tech_bio_fusion_power: "$BIO_FUSION_REACTOR$"
 BIO_FUSION_REACTOR: "Metabolismo de fusión"
 BIO_FUSION_REACTOR_DESC: "Este sistema integra microfauna capaz de provocar fusiones nucleares en el bioma visceral de las naves biológicas, generando así una potencia inmensa a la vez que evita multitud de peligros derivados de las fuentes de energía de fisión."
