 BIO_EMPTY_DRIVE_DESC: "$EMPTY_DRIVE_DESC$"
 BIO_HYPER_DRIVE_1: "Campo de biohipervía I"
 BIO_HYPER_DRIVE_1_DESC: "Empujar constantemente contra el hiperespacio permite que una nave se cuele por los estrechos pasos de las hipervías interestelares."
 BIO_HYPER_DRIVE_2: "Campo de biohipervía II"
 BIO_HYPER_DRIVE_2_DESC: "$BIO_HYPER_DRIVE_1_DESC$"
 BIO_HYPER_DRIVE_3: "Campo de biohipervía III"
 BIO_HYPER_DRIVE_3_DESC: "$BIO_HYPER_DRIVE_1_DESC$"
 BIO_JUMP_DRIVE_1: "Órgano de salto"
 BIO_JUMP_DRIVE_1_DESC: "El órgano de salto abre agujeros del tamaño de una nave en el mismo tejido de la realidad, lo que permite el movimiento prácticamente instantáneo entre los sistemas. Todavía no entendemos del todo la naturaleza del espacio que recorre la nave en este viaje."
 BIO_PSI_JUMP_DRIVE_1: "Órgano de salto psiónico"
 BIO_PSI_JUMP_DRIVE_1_DESC: "El órgano de salto psiónico funciona como un punto de concentración para el potencial psiónico de la nave y de la tripulación para curvar el continuo espacio-tiempo local, eliminando la distancia entre el punto de origen y el destino. Supuestamente."
 tech_bio_hyper_drive_1: "Viaje por hiperespacio"
 tech_bio_hyper_drive_1_desc: "Como las hebras de una telaraña, el reino extradimensional del hiperespacio recorre los pozos de gravedad de todas las estrellas. En teoría, el viaje ultralumínico es posible a través de estas hipervías.\n\n"
 tech_bio_hyper_drive_2: "Fisuras en hipervías"
 tech_bio_hyper_drive_2_desc: "Hemos comprobado la existencia de lugares donde una nave gasta menos energía por adentrarse en una hipervía. Esto conllevará una nueva generación de hiperimpulsores.\n\n"
 tech_bio_hyper_drive_3: "Estelas hiperespeciales"
 tech_bio_hyper_drive_3_desc: "Una nueva generación de hiperimpulsores capaces de acceder a estelas subespaciales. Esto conlleva un rendimiento espectacularmente mayor de los motores."
 tech_bio_jump_drive_1: "$BIO_JUMP_DRIVE_1$"
 tech_bio_jump_drive_1_desc: "El revolucionario $BIO_JUMP_DRIVE_1$ manipula el continuo espacio-tiempo local a nivel cuántico, reestructurándolo para que coincida con el destino objetivo. Gracias a este proceso, las naves pueden \"saltar\" entre sistemas de manera casi instantánea."
