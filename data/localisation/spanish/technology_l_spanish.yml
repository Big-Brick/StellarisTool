 tech_destroyer_hull_2: "Cascos de destructor avanzados"
 tech_destroyer_hull_2_desc: "La última generación de cascos de destructor incorpora mamparas mejoradas y campos de integridad estructural optimizados."
 tech_destroyer_build_speed: "Patrones de destructor estandarizados"
 tech_destroyer_build_speed_desc: "Establecer nuevos estándares para el diseño y construcción de los destructores mejora mucho la eficiencia de su producción."
 tech_destroyer_hull_effect: "$mod_shipsize_destroyer_hull_mult$: §G+10%§!"
