 #####################################
 tech_curator_lab: "Lab. de exploración de los Cuidadores"
 tech_curator_lab_desc: "Los laboratorios de a bordo cuentan con tecnologías avanzadas de la antigua orden de los Cuidadores que aumentan la velocidad de sondeo."
 tech_archeology_lab: "Lab. de arqueología de los Cuidadores"
 tech_archeology_lab_desc: "Un laboratorio de a bordo con equipo tecnológico avanzado que incorpora una gran base de datos proporcionada por la orden de los Cuidadores en la que se pueden contrastar fácilmente los nuevos descubrimientos."
 tech_archeology_lab_ancrel: "$tech_archeology_lab$"
 tech_archeology_lab_ancrel_desc: "$tech_archeology_lab_desc$"
 #####################################
 #Machine Empire Techs
 #####################################
 tech_probability_theory: "Teoría de la probabilidad orgánica"
 tech_probability_theory_desc: "Gracias a unas simulaciones matemáticas lo suficientemente avanzadas, puede que sea posible predecir las economías fluctuantes de la sociedad orgánica, aunque con limitaciones. Esto nos permitiría manipular sus mercados de divisas a nuestro favor."
 tech_binary_motivators: "Motivadores binarios"
 tech_binary_motivators_desc: "Estos motivadores avanzados son más pequeños y ligeros que las versiones anteriores, lo que permite que las unidades robóticas asignen espacio adicional para los sistemas secundarios."
 tech_nanite_assemblers: "Ensambladores de nanorrobots"
 tech_nanite_assemblers_desc: "El uso de nanorrobots programables para ayudar a la construcción de nuevas unidades robóticas permitirá crear modelos más avanzados equipados con una variedad aún mayor de sistemas secundarios."
 tech_adaptive_combat_algorithms: "Algoritmos de combate adaptativo"
 tech_adaptive_combat_algorithms_desc: "Los orgánicos a menudo utilizan tácticas ilógicas e impredecibles que pueden ser difícil de contrarrestar. Las tácticas adaptativas y las nuevas formas de guerra con mayor capacidad de maniobra deberían suponer una ventaja decisiva."
 tech_biomechanics: "Biomecánica"
 tech_biomechanics_desc: "En ocasiones, a través de la simple persistencia, millones de años de evolución orgánica producen soluciones elegantes que también puede aplicarse a diseños de máquinas."
 tech_singularity_core: "Núcleo Singularidad"
 tech_singularity_core_desc: "Un agujero negro preso que estudiar en un entorno controlado sería un objeto de estudio increíble.\""
 tech_micro_replicators: "Microrreplicadores"
 tech_micro_replicators_desc: "Herramientas microscópicas que ayudan a las unidades de replicación a crear los circuitos más complejos que se necesitan para los drones nuevos."
 tech_self_assembling_components: "Componentes automontantes"
 tech_self_assembling_components_desc: "Estos intelectos microscópicos, modelados a partir de ADN orgánico, son capaces de montar de manera autónoma todos los componentes que se necesitan para los drones nuevos."
