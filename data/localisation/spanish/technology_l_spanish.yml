 tech_cruiser_hull_1: "Cascos de crucero mejorados"
 tech_cruiser_hull_1_desc: "Los avances en las técnicas de construcción nos permitirán construir cruceros más sólidos y resistentes."
 tech_cruiser_hull_2: "Cascos de crucero avanzados"
 tech_cruiser_hull_2_desc: "La última generación de cascos de crucero incorpora mamparas mejoradas y campos de integridad estructural optimizados."
 tech_cruiser_build_speed: "Patrones de crucero estandarizados"
 tech_cruiser_build_speed_desc: "Establecer nuevos estándares para el diseño y construcción de los cruceros mejora mucho la eficiencia de su producción."
 tech_cruiser_hull_effect: "$mod_shipsize_cruiser_hull_mult$: §G+10%§!"
 tech_cruiser_build_speed_effect: "$mod_ship_cruiser_cost_mult$: §G-5%§!\n$mod_shipsize_cruiser_build_speed_mult$: §G+25%§!"
 tech_battleship_hull_1: "Cascos de acorazado mejorados"
 tech_battleship_hull_1_desc: "Los avances en las técnicas de construcción nos permitirán construir acorazados más sólidos y resistentes."
 tech_battleship_hull_2: "Cascos de acorazado avanzados"
 tech_battleship_hull_2_desc: "La última generación de cascos de acorazado incorpora mamparas mejoradas y campos de integridad estructural optimizados."
 tech_battleship_build_speed: "Patrones de acorazado estandarizados"
 tech_battleship_build_speed_desc: "Establecer nuevos estándares para el diseño y construcción de grandes acorazados mejora mucho la velocidad a la que podemos montarlos."
 tech_battleship_hull_effect: "$mod_shipsize_battleship_hull_mult$: §G+10%§!"
 tech_battleship_build_speed_effect: "$mod_ship_battleship_cost_mult$: §G-5%§!\n$mod_shipsize_battleship_build_speed_mult$: §G+25%§!"
 tech_titan_hull_1: "Cascos de titán mejorados"
 tech_titan_hull_1_desc: "Los avances en las técnicas de construcción nos permitirán construir titanes más sólidos y resistentes."
 tech_titan_hull_2: "Cascos de titán avanzados"
 tech_titan_hull_2_desc: "La última generación de cascos de titán incorpora mamparas mejoradas y campos de integridad estructural optimizados."
 #no titan is the same... they dont have a build speed tech!
 #Starbases
 tech_starbase_1: "Construcción de base estelar"
 tech_starbase_1_desc: "Se necesita una instalación espacial centralizada construida en la órbita del sistema para aprovechar al máximo sus recursos."
 tech_starbase_2: "Puerto estelar"
 tech_starbase_2_desc: "Las primeras bases estelares eran poco más que puestos de avanzada improvisados. Los puertos estelares permanentes nos permitirán mantener un control más firme sobre los sistemas estelares."
 tech_starbase_3: "Bastión estelar"
 tech_starbase_3_desc: "A medida que el tráfico cósmico aumenta, se necesitan bases estelares más grandes para mantener el control de las vías espaciales del sistema."
 tech_starbase_4: "Fortaleza estelar"
 tech_starbase_4_desc: "Estos poderosos fuertes espaciales proporcionan un punto de referencia a toda la actividad militar en un sistema espacial, y su presencia disuade a cualquiera, salvo a los atacantes más obcecados."
 tech_starbase_5: "Ciudadela"
 tech_starbase_5_desc: "Hay planes de construir una inmensa estación de combate capaz de enfrentarse a varias flotas de ataque. Una vez edificadas, estas ciudadelas se convertirán tanto en monumentos a la grandeza como en ejes del sistema."
 tech_modular_engineering: "Ingeniería modular"
 tech_modular_engineering_desc: "La simplificación de los procesos de construcción con diseños modulares reducirá el coste y el tiempo de construcción actuales."
 tech_defense_platform_hull_1: "Integridad estructural mejorada"
 tech_defense_platform_hull_1_desc: "Un armazón reforzado y escudos con mayor absorción de impacto garantizan la integridad estructural de la plataforma incluso bajo una inmensa presión."
 #Spaceport Modules
 #tech_corvette_assembly: "Advanced Corvette Designs"
 #tech_corvette_assembly_desc: "Unused" # TEMP
 #tech_destroyer_assembly: "Advanced Destroyer Designs"
 #tech_destroyer_assembly_desc: "Unused" # TEMP
 tech_solar_panel_network: "Conversión de energía orbital"
 tech_solar_panel_network_desc: "Los avances en la tecnología de paneles solares podrían reducir los costes operativos de las bases estelares. Sin embargo, los paneles requerirán un módulo entero de la base estelar para generar suficiente energía."
 tech_mining_terminal: "Gremios de minería"
 tech_mining_terminal_desc: "Estos gremios supervisan toda la extracción de recursos de un sistema. Esto supone una eficiencia mayor, ya que los mineros independientes clandestinos quedan sometidos.\n\n"
 tech_zero_gravity_assembly_sequence: "Bastidores para gravedad 0"
 tech_zero_gravity_assembly_sequence_desc: "Vienen con multitud de herramientas útiles que permiten a los obreros desplazarse con rapidez y seguridad por las obras orbitales. Las misiones extravehiculares en el espacio nunca han sido tan fáciles.\n\n"
 #Strike Craft
 tech_strike_craft_1: "Operaciones de portanaves"
 tech_strike_craft_1_desc: "Estas naves de ataque tripuladas de corto alcance se lanzan desde una nave nodriza y dependen de su velocidad y pequeño tamaño para sobrevivir y atravesar las defensas enemigas.\n\n"
 tech_strike_craft_2: "Nave de ataque mejorada"
 tech_strike_craft_2_desc: "La nueva generación de naves de ataque con electrónica mejorada, más manejabilidad y un armamento más potente.\n\n"
 tech_strike_craft_3: "Nave de ataque avanzada"
 tech_strike_craft_3_desc: "Estos cazas y bombarderos avanzados suponen un mayor refinamiento en el diseño de naves de ataque. Su rendimiento excede con mucho el de modelos anteriores.\n\n"
 #Armies and Attachments - Engineering
 tech_planetary_defenses: "Defensas planetarias"
 tech_planetary_defenses_desc: "Puede que llegue el día en que intelectos vastos, fríos y hostiles, vean nuestros mundos con envidia y hagan planes contra nosotros. Debemos prepararnos."
 tech_assault_armies: "Fuerzas expedicionarias interplanetarias"
 tech_assault_armies_desc: "La invasión de otros mundos es una enorme empresa. Hay grandes dificultades logísticas que debemos superar antes de poder reunir nuestros primeros ejércitos interplanetarios.\n\n"
 tech_drop_pod: "Cápsulas de descenso orbital"
 tech_drop_pod_desc: "Las cápsulas desechables disminuirán nuestra dependencia de las vulnerables naves de desembarco y permitirán desplegar fuerzas terrestres ligeras en cualquier planeta.\n\n"
 #Ship Armor Components
 tech_ship_armor_1: "Materiales nanocompuestos"
 tech_ship_armor_1_desc: "Las planchas de casco de nanocompuestos reforzadas ofrecen una capa más de protección que puede suponer la diferencia entre la vida y la muerte en un combate.\n\n"
 tech_ship_armor_2: "Materiales cerámico-metálicos"
 tech_ship_armor_2_desc: "Una combinación de distintos metales y cerámicas que da como resultado un blindaje fuerte sin sacrificar flexibilidad.\n\n"
 tech_ship_armor_3: "Materiales de plastiacero"
 tech_ship_armor_3_desc: "El plastiacero es un material elástico que combina muchas cualidades del plástico y del metal. Es barato de producir y se puede usar para aumentar el blindaje de las naves.\n\n"
 tech_ship_armor_4: "Materiales de duracero"
 tech_ship_armor_4_desc: "Este material fuerte pero flexible es capaz de aguantar castigos severos. Sirve bien como blindaje de naves.\n\n"
 tech_ship_armor_5: "Materiales de neutronio"
 tech_ship_armor_5_desc: "Este material increíblemente denso y fuerte resiste una potencia de fuego que convertiría en chatarra otros blindajes.\n\n"
 tech_crystal_armor_1: "Blindaje imbuido de cristales"
 tech_crystal_armor_1_desc: "Al emplear materia cristalina en el blindaje podemos aumentar la durabilidad de los cascos protectores de nuestras naves.\n\n"
 tech_crystal_armor_2: "Blindaje forjado con cristales"
 tech_crystal_armor_2_desc: "Introducir materia cristalina en el proceso de forja mejora las cualidades ultraduras de los metales imbuidos de cristales.\n\n"
 tech_dragon_armor: "Escamas artificiales"
 tech_dragon_armor_desc: "Las escamas del dragón del éter constan de diversas capas de nanoestructuras de minerales únicos. Unas técnicas de fabricación poco ortodoxas nos permiten emular estas estructuras autorreparables."
 tech_armor_hardeners_1: "Fortalecimiento de blindaje"
 tech_armor_hardeners_1_desc: "$ARMOR_HARDENER_1_DESC$"
 tech_armor_hardeners_2: "Fortalecimiento de blindaje adaptativo"
 tech_armor_hardeners_2_desc: "$ARMOR_HARDENER_2_DESC$"
 #Thruster Components
 tech_thrusters_1: "Propulsores químicos"
 tech_thrusters_1_desc: "Propulsores simples pero de eficacia moderada que dependen de un propelente combustible para funcionar.\n\n"
 tech_thrusters_2: "Propulsores de iones"
 tech_thrusters_2_desc: "Propulsores eléctricos que usan rayones de iones para generar impulso sin necesidad de propelentes.\n\n"
 tech_thrusters_3: "Propulsores de plasma"
 tech_thrusters_3_desc: "Es una forma avanzada de propulsión eléctrica que da a las naves más velocidad sublumínica y maniobrabilidad.\n\n"
 tech_thrusters_4: "Propulsores de impulso"
 tech_thrusters_4_desc: "Estos propulsores de fusión muy avanzados dan a las naves una maniobrabilidad y una velocidad sin igual en condiciones sublumínicas.\n\n"
 tech_afterburners_1: "Postquemadores"
 tech_afterburners_1_desc: "Estos potentes propulsores dan más velocidad de combate, pero consumen mucha energía."
 tech_afterburners_2: "Postquemadores avanzados"
 tech_afterburners_2_desc: "Esta versión avanzada mejora aún más la velocidad de combate de una nave."
 #Military Stations
 tech_space_defense_station_1: "Defensas en el espacio profundo"
 tech_space_defense_station_1_desc: "Esto permitirá construir plataformas de defensa en el espacio profundo para proteger nuestras bases estelares."
 tech_space_defense_station_2: "Estaciones en el espacio profundo"
 tech_space_defense_station_2_desc: "Nuevos métodos permitirán construir estaciones militares todavía más grandes en las profundidades del espacio.\n\n"
 tech_space_defense_station_3: "Instalaciones en el espacio profundo"
 tech_space_defense_station_3_desc: "Estas enormes instalaciones son como ciudades flotantes en el espacio. Pueden alojar miles de tripulantes y suelen tener una potencia de fuego que rivaliza con la de una flota.\n\n"
 tech_space_defense_station_improvement: "Cuerpo de ingenieros"
 tech_space_defense_station_improvement_desc: "La creación de un cuerpo de ingenieros navales será muy beneficioso para las plataformas de defensa en el espacio profundo al disminuir los costes y aumentar la durabilidad.\n\n"
 tech_space_defense_station_improvement_machine_intelligence: "Construcción de estación optimizada"
 tech_space_defense_station_improvement_desc_machine_intelligence: "Una extensiva evaluación de los métodos de construcción de estaciones militares actuales ha detectado varios puntos que podrían mejorarse."
 #Industry and Robotics
 tech_housing_1: "Sistemas de control del clima"
 tech_housing_1_desc: "La habilidad de alterar los patrones climáticos de un planeta para suprimir los fenómenos meteorológicos destructivos hará que sea más fácil mantener los edificios residenciales y abrirá nuevas zonas para vivir."
 tech_housing_2: "Ingeniería antigravedad"
 tech_housing_2_desc: "Gracias a la tecnología de gravedad direccional, los edificios de la superficie de los planetas pueden llegar más alto que nunca sin sufrir derrumbes estructurales. ¡El cielo es el límite!"
 tech_housing_agrarian_idyll: "Utopías agrarias"
 tech_housing_agrarian_idyll_desc: "Podemos albergar a una población más grande sin renunciar a nuestro modo de vida agrícola mediante el establecimiento de comunas rurales controladas con el clima."
 tech_mechanized_mining: "Minería mecanizada"
 tech_mechanized_mining_desc: "La aplicación de ingeniería mecánica a la extracción de minerales es un requisito fundamental para cualquier sociedad industrial."
 tech_basic_industry: "Base industrial"
 tech_basic_industry_desc: "La infraestructura industrial básica que se necesita para convertirse en una civilización espacial.\n\n"
 tech_powered_exoskeletons: "Exoesqueletos autopropulsados"
 tech_powered_exoskeletons_desc: "Llevar uno de ellos aumenta la fuerza y la velocidad del usuario. Las aplicaciones militares son obvias, pero también aumenta la eficiencia laboral.\n\n"
 tech_powered_exoskeletons_machine_intelligence: "Servomotores mejorados"
 tech_powered_exoskeletons_desc_machine_intelligence: "Unos servomotores más potentes aumentarán el peso que pueden soportar las unidades robóticas. Las unidades mineras pueden transportar más minerales para ser procesados y las máquinas de guerra pueden utilizar armamentos más pesados."
 tech_mining_1: "Fracking geotérmico"
 tech_mining_1_desc: "Las nuevas tecnologías de fracking nos permitirán aprovechar bolsas de recursos geotérmicos previamente inalcanzables bajo la superficie del planeta."
 tech_mining_2: "Minería en núcleo profundo"
 tech_mining_2_desc: "Estos taladros gigantes dan acceso a los ricos depósitos de minerales que a menudo se encuentran cerca del núcleo de un planeta."
 tech_mining_3: "Aislamiento mineral"
 tech_mining_3_desc: "La espectrometría avanzada se combina con las técnicas de descarga química y fracking para explotar depósitos a escasa y media profundidad."
 #tech_mining_network_5: "Pure Matter Extraction"
 #tech_mining_network_5_desc: ""
 tech_synchronized_work_patterns: "Pautas de trabajo sincronizadas"
 tech_synchronized_work_patterns_desc: "Al sincronizar las pautas de trabajo de las redes mineras, su rendimiento puede ser todavía mayor.\n\n"
 tech_engineering_1: "Nanomecánica"
 tech_engineering_1_desc: "Los nuevos avances en ingeniería mecánica nos han hecho descender hasta la escala nanométrica. Ahora somos capaces de manipular sistemas físicos de maneras nunca vistas."
 tech_engineering_2: "Circuitos autoconectados"
 tech_engineering_2_desc: "Igual que las neuronas orgánicas generan nuevos axones para recrear las conexiones perdidas, estos circuitos pueden autorrenovarse. Ahora se espera que hasta el sistema informático más simple evolucione durante su uso."
 tech_engineering_3: "Materiales supersólidos"
 tech_engineering_3_desc: "Las propiedades cuánticas de estos materiales tienen la clave de los estados de superposición, un avance revolucionario para la ciencia industrial y de materiales."
 #tech_engineering_4: "Zero-Resistance Architecture"
 #tech_engineering_4_desc: "These advanced materials, absent of any frictional constraints, permit mechanical longevity on an unprecedented scale. With the removal of the previously required lubricant our structures can function within extreme temperature ranges."
 tech_robotic_workers: "Mano de obra artificial"
 tech_robotic_workers_desc: "Estas unidades de trabajo artificiales son perfectas para las labores duras. Son muy trabajadoras y capaces de seguir instrucciones vocales simples, pero incapaces de subir escaleras."
 tech_droid_workers: "Especialistas artificiales"
 tech_droid_workers_desc: "Estas unidades artificiales mejoradas tienen un alcance de movimiento ampliado, igual al de la mayoría de orgánicos. Sus procesadores neurales también han mejorado mucho."
 tech_synthetic_workers: "Administración artificial"
 tech_synthetic_workers_desc: "Son unidades muy avanzadas, mucho más fuertes, rápidas y duraderas que la mayoría de orgánicos. Con sus procesadores neurales mejorados, son completamente capaces de realizar operaciones independientes."
 #tech_enhanced_combat_software: "Combat Software 2.0"
 #tech_enhanced_combat_software_desc: ""
 tech_synthetic_leaders: "Matriz de personalidad artificial"
 tech_synthetic_leaders_desc: "Dotados de personalidad, los sintéticos podrán interactuar socialmente en igualdad de condiciones con el resto de nuestros ciudadanos. Algunas unidades hasta pueden asumir cometidos de liderato.\n\n"
 tech_integrated_cybernetics: "Cibernética integrada"
 tech_integrated_cybernetics_desc: "Al mejorar nuestros trajes básicos de exoesqueleto, estos implantes cibernéticos integrados vuelven al usuario más resistente a los efectos perjudiciales del entorno."
 tech_integrated_cybernetics_machine_intelligence: "Cibernética adaptativa"
 tech_integrated_cybernetics_desc_machine_intelligence: "Instalar implantes cibernéticos que se adapten al entorno local mejorará la eficiencia de nuestros drones."
 tech_mineral_purification_1: "Purificación mineral"
 tech_mineral_purification_1_desc: "El procesamiento óptimo de los minerales extraídos nos permite ser más eficientes."
 tech_mineral_purification_2: "Purificación mineral avanzada"
 tech_mineral_purification_2_desc: "El procesado de segunda fase de los minerales pseudo refinados permite un almacenaje y transporte más eficiente."
 tech_assembly_pattern: "Patrones de ensamblado"
 tech_assembly_pattern_desc: "Una iteración rápida en las simulaciones de construcción determina las pautas óptimas de montaje de componentes antes de cada proyecto de edificación."
 tech_construction_templates: "Plantillas de construcción"
 tech_construction_templates_desc: "Las plantillas prefabricadas estandarizadas reducen enormemente los tiempos de construcción in situ de las instalaciones."
 tech_robomodding: "Sistema de plantilla de máquina"
 tech_construction_templates_effect: "Capacidad $building_resource_silo$: §G+5000§!"
 tech_robomodding_desc: "Las plantillas de montaje modificables permiten crear diseños de robots a medida."
 tech_robomodding_m: "Sistema de plantilla de máquina"
 tech_robomodding_m_desc: "La estandarización de plantillas de montaje permite una mayor especialización de la población de máquinas."
 tech_robomodding_points_1: "Normalización entre modelos"
 tech_robomodding_points_1_desc: "Las prácticas de producción mejoradas permiten mayores alteraciones en los robots sin comprometer la funcionalidad básica."
 #tech_robomodding_points_1_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 #TEMP
 tech_robomodding_points_2: "Cableado fungible"
 tech_robomodding_points_2_desc: "Las prácticas de producción mejoradas permiten cambios fundamentales en los robots sin comprometer la funcionalidad básica."
 #tech_robomodding_points_2_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 #TEMP
 tech_matter_generator: "Generación de materia"
 tech_matter_generator_desc: "Al usar vastas cantidades de energía, podemos convertir luz en materia a partir de la aparente nada."
 tech_mega_assembly: "Sistemas de supermontaje"
 tech_mega_assembly_desc: "Las plantillas avanzadas nos permiten aumentar drásticamente el montaje de nuevas unidades."
 tech_robot_assembly_complex: "Sistemas montaje robótico"
 tech_robot_assembly_complex_desc: "Las plantillas avanzadas nos permiten aumentar drásticamente el montaje de nuevos robots."
 #Space Mining
 tech_space_construction: "Construcción espacial"
 tech_space_construction_desc: "La construcción en el espacio ofrece a los ingenieros nuevos desafíos de diseño que deben resolverse para poder construir estaciones orbitales sobre otros mundos.\n\n"
 #tech_mine_rare_resources_t1: "Zero-Gravity Refining"
 #tech_mine_rare_resources_t1_desc: "New refining techniques are necessary in order to process the many exotic materials we are finding as we explore the galaxy."
 #tech_mine_rare_resources_t3: "Nanoparticle Extraction"
 #tech_mine_rare_resources_t3_desc: "An efficient way of extracting nanoparticles will allow us to exploit new strategic resources that were previously beyond our reach."
 tech_mining_station_improvement_1: "Procesamiento in situ"
 tech_mining_station_improvement_1_desc: "Al procesar los minerales directamente sobre el mundo donde se extraen, la eficiencia de la minería mejora sustancialmente.\n\n"
 tech_mining_station_improvement_2: "Operaciones mineras autónomas"
 tech_mining_station_improvement_2_desc: "Al confiar extensamente en drones automatizados, las estaciones mineras pueden funcionar con una tripulación mínima. Esto reduce el coste.\n\n"
 tech_mine_satramene: "Refinamiento de satrameno"
 tech_mine_satramene_desc: "Este gas es un psicoactivo de origen natural que se encuentra en algunos mundos. Tiene un efecto balsámico en muchos seres y se utiliza para pacificar sin violencia a individuos hostiles."
 tech_mine_garanthium: "Extracción de garantio"
 tech_mine_garanthium_desc: "Establecer canteras de garantio plantea muchas dificultades, ya que las cualidades maleables del mineral lo hacen tan difícil de extraer como atractivo."
 tech_mine_orillium: "Extracción de orilio"
 tech_mine_orillium_desc: "Las vigas de estabilización permiten una extracción relativamente segura del volátil mineral de orilio.\n\n"
 tech_mine_living_metal: "Metal vivo"
 tech_mine_living_metal_desc: "Extraer y procesar metales vivos es difícil en extremo, pero su aplicación en aleaciones mutables ofrece ventajas incomparables."
 tech_mine_betharian: "Refinamiento de bethario"
 tech_mine_betharian_desc: "Los minerales de bethario parecen provenir de una sola fuente, pero se diseminaron por la galaxia hace milenios. Suelen encontrarse como formaciones del tamaño de un guijarro y son muy inflamables."
 tech_mine_rare_crystals: "Extracción de cristales raros"
 tech_mine_rare_crystals_desc: "Extraer estos cristales sin dañarlos ni destruirlos es un proceso sumamente delicado. Se necesita un equipo avanzado con una precisión milimétrica."
 #Aura Components
 tech_aura_nanobot: "Nanobots montadores"
 #tech_aura_nanobot_desc: ""
 tech_aura_minefield: "Minas de proximidad"
 #tech_aura_minefield_desc: ""
 #Megastructures
 tech_mega_engineering: "Megaingeniería"
 tech_mega_engineering_desc: "Para completar la construcción de proyectos a escala colosal, debemos comprender tanto los requisitos de almacenamiento de recursos como la ingeniería de tales megaestructuras."
 ####################################
 #Engineering - Weapons
 ####################################
 #Mass Driver Branch
 tech_mass_drivers_1: "Impulsores de masa"
 tech_mass_drivers_1_desc: "Estos lanzadores de proyectiles electromagnéticos usan imanes para acelerar las balas perforantes contra su objetivo a gran velocidad.\n\n"
 tech_mass_drivers_2: "Cañones de bobina"
 tech_mass_drivers_2_desc: "Son versiones más potentes de los primeros impulsores de masa y usan bobinas electromagnéticas para acelerar los proyectiles contra su objetivo.\n\n"
 tech_mass_drivers_3: "Cañones de riel"
 tech_mass_drivers_3_desc: "El último grito en aceleradores electromagnéticos. Usan dos rieles en paralelo para disparar proyectiles a velocidad increíble.\n\n"
 tech_mass_drivers_4: "Cañones de riel avanzado"
 tech_mass_drivers_4_desc: "Una nueva versión de este venerable cañón, con rieles más resistentes y una alimentación aumentada. Estas armas son todavía más potentes y precisas que sus predecesoras.\n\n"
 tech_mass_drivers_5: "Cañones de Gauss"
 tech_mass_drivers_5_desc: "Esta versión mejorada del viejo diseño del cañón de riel es todavía más destructiva que los últimos diseños. Es capaz de lanzar proyectiles con una velocidad y una precisión increíbles.\n\n"
 tech_kinetic_artillery_1: "Batería cinética"
 tech_kinetic_artillery_1_desc: "Artillería de muy largo alcance capaz de lanzar balas potentes a través de grandes distancias con un alto grado de precisión.\n\n"
 tech_kinetic_artillery_2: "Artillería cinética"
 tech_kinetic_artillery_2_desc: "Artillería todavía más potente y con más alcance que va montada en una nave y cuenta con un cañón nuevo y un ordenador de disparo mejorado.\n\n"
 tech_mass_accelerator_1: "Megacañón"
 tech_mass_accelerator_1_desc: "Un enorme cañón acelerador de masa que solo se puede poner en una montura vertebral y dispara balas muy potentes a distancias increíbles.\n\n"
 tech_mass_accelerator_2: "Gigacañón"
 tech_mass_accelerator_2_desc: "Un cañón acelerador de masa más potente aún que puede atravesar hasta los escudos más recios.\n\n"
 #Auto-Cannon Branch
 tech_autocannons_1: "Cañones automáticos"
 tech_autocannons_1_desc: "Armas balísticas de gran calibre que disparan balas explosivas. La principal ventaja de estos cañones es su gran cadencia de fuego.\n\n"
 tech_autocannons_2: "Cañones trituradores"
 tech_autocannons_2_desc: "Este cañón rotativo mejorado cuenta con sistemas superiores de seguimiento y de control del disparo que le permite mantener una cadencia de fuego más alta.\n\n"
 tech_autocannons_3: "Cañones \"tormenta de fuego\""
 tech_autocannons_3_desc: "Cañones rotativos automáticos avanzados que escupen nubes de balas muy explosivas contra un objetivo."
 tech_flak_batteries_1: "Batería antiaérea"
 tech_flak_batteries_1_desc: "Baterías de cañones que disparan metralla a corta distancia. Son muy letales contra las naves de ataque enemigas, pero también pueden defender contra los misiles."
 tech_flak_batteries_2: "Cañones antiaéreos"
 tech_flak_batteries_2_desc: "Baterías antiaéreas mejoradas con cargas de metralla nuevas y más potentes."
 tech_flak_batteries_3: "Artillería antiaérea"
 tech_flak_batteries_3_desc: "Los algoritmos de predicción y sus cargas todavía más potentes hacen que estas baterías sean increíblemente letales contra las naves de ataque."
 #Missile Branch
 tech_missiles_1: "Misiles atómicos"
 tech_missiles_1_desc: "Son misiles espacio-espacio equipados con ojivas nucleares de alto rendimiento. Aunque se basan en una tecnología preespacial, estas toscas armas pueden ser sorprendentemente efectivas a distancia.\n\n"
 tech_missiles_2: "Misiles de fusión"
 tech_missiles_2_desc: "Estos misiles espacio-espacio mejorados tienen potentes ojivas de fusión y unas cualidades de vuelo superiores.\n\n"
 tech_missiles_3: "Misiles de antimateria"
 tech_missiles_3_desc: "Son misiles avanzados que cuentan con ojivas de antimateria muy potentes. Un sistema de guiado nuevo y mejorado les da más posibilidades de encontrar a sus objetivos.\n\n"
 tech_missiles_4: "Misiles cuánticos"
 tech_missiles_4_desc: "Esta variedad mejorada, última versión del misil espacio-espacio, cuenta con una ojiva de una potencia inmensa que saca su energía del punto cero.\n\n"
 tech_missiles_5: "Misiles merodeadores"
 tech_missiles_5_desc: "Estos misiles tan avanzados van equipados con pilotos de IA limitada que mejoran sustancialmente su rendimiento y su capacidad de seguir objetivos.\n\n"
 tech_swarmer_missiles_1: "Misiles de enjambre"
 tech_swarmer_missiles_1_desc: "Estos misiles, más pequeños, se disparan en andanadas y se han diseñado específicamente para superar las defensas de precisión enemigas.\n\n"
 tech_swarmer_missiles_2: "Misiles de remolino"
 tech_swarmer_missiles_2_desc: "Las nuevas técnicas de miniaturización nos permiten equipar a los misiles de enjambre con ojivas más potentes y mejorar sus cualidades de vuelo.\n\n"
 #Torpedo Branch
 tech_torpedoes_1: "Torpedos espaciales"
 tech_torpedoes_1_desc: "Son misiles enormes que se mueven muy lentamente. Cuentan con ojivas potentes y moduladores de escudo que les permiten deslizarse sin verse afectados por las pantallas de energía.\n\n"
 tech_torpedoes_2: "Torpedos blindados"
 tech_torpedoes_2_desc: "Son torpedos espaciales mejorados cubiertos de blindaje para resistir mejor las defensas de precisión. El blindaje se rompe en fragmentos que infligen daño adicional cuando detona el torpedo.\n\n"
 tech_torpedoes_3: "Torpedos devastadores"
 tech_torpedoes_3_desc: "Son torpedos avanzados con ojivas muy potentes. Tienen un diseño más estilizado, motores más rápidos y moduladores de escudo mejores para traspasar las pantallas de energía.\n\n"
 ####################################
 #Physics
 ####################################
 #Science Ship Actions
 tech_deep_scan: "Instrumentos escaneo en espacio profundo"
 tech_deep_scan_desc: "Sin usar" #TEMP
 tech_databank_uplinks: "Enlaces de bancos de datos"
 tech_databank_uplinks_desc: "Las bandas cuánticas de gran capacidad aplicadas a los bancos de datos hacen posible operaciones de búsqueda prácticamente sincrónicas a grandes distancias."
 tech_improved_databank_uplinks: "Miniaturización de enlaces"
 tech_improved_databank_uplinks_desc: "La miniaturización de los transmisores de los extremos permite instalarlos en grupo, lo que aumenta el ancho de banda."
 #Physics Lab & related
 tech_basic_science_lab_1: "Método científico"
 tech_basic_science_lab_1_desc: "Predicciones comprobables de fenómenos observables."
 tech_basic_science_lab_2: "Laboratorios de materiales exóticos"
 tech_basic_science_lab_2_desc: "A medida que exploramos la galaxia, nos encontramos con sustancias y materiales desconocidos. Necesitaremos nuevas instalaciones para catalogar y analizar esos descubrimientos."
 tech_basic_science_lab_3: "Estudios multidimensionales"
 tech_basic_science_lab_3_desc: "Para ampliar nuestra base de conocimiento, debemos tener en cuenta todos los niveles de la existencia. ¡Nos espera un nuevo campo científico!"
 tech_physics_1: "Informática cuántica"
 tech_physics_1_desc: "El potencial de los ordenadores cuánticos, con velocidades de procesamiento que desafían los límites clásicos, es ilimitado. Esta tecnología revolucionaria anuncia un gran salto hacia regiones desconocidas de la solución de problemas."
 tech_physics_2: "Teoría unificada de campos"
 tech_physics_2_desc: "Se puede intervenir en las fuerzas fundamentales del universo mediante campos físicos. Dominar este proceso nos permite actuar como dioses, al menos entre las paredes del laboratorio."
 tech_physics_3: "Ondas gravitacionales cuánticas"
 tech_physics_3_desc: "Desde mucho antes de llegar a las estrellas, sabíamos que la gravedad y el tiempo estaban relacionados. Ahora, nuestra comprensión de esta relación única ha alcanzado un punto de inflexión y podemos manipular las fuerzas a una escala nunca vista."
 #tech_physics_4: "Thesis of Everything"
 #tech_physics_4_desc: ""... therefore we postulate that the meaning of existence, and the origin and purpose of all creation can be summed up as a simple formula as follows...""
 tech_administrative_ai: "IA gestora"
 tech_administrative_ai_desc: "Redireccionamiento fervoroso del circuito organizativo."
 tech_administrative_ai_machine_intelligence: "Optimización académica"
 tech_administrative_ai_desc_machine_intelligence: "Las nuevas rutinas secundarias afinarán la atención de nuestras unidades de investigación y acabarán con la ineficiencia."
 tech_self_aware_logic: "Lógica autoevolutiva"
 tech_self_aware_logic_desc: "Priorización introspectiva."
 tech_sapient_ai: "IA positrónica"
 tech_sapient_ai_desc: "Los intelectos artificiales en evolución están abriendo la puerta a la posibilidad de una auténtica inteligencia sintética."
 tech_administrative_ai_hive_mind: "Mejoradores sinápticos"
 tech_administrative_ai_desc_hive_mind: "Pensar antes de actuar. Nuestra mente evolucionará a límites insospechados."
 tech_self_aware_logic_hive_mind: "Sinapsis autónomas"
 tech_self_aware_logic_desc_hive_mind: "Unidad indivisible."
 tech_positronic_implants: "Implantes positrónicos"
 tech_positronic_implants_desc: "Ampliando las posibilidades con la aplicación de la cibernética limitada."
 tech_positronic_implants_machine_intelligence: "Procesadores positrónicos"
 tech_positronic_implants_desc_machine_intelligence: "Abriendo nuevas vías de pensamiento sintético."
 tech_combat_computers_1: "Ordenadores especializados en combate"
 tech_combat_computers_1_desc: "Las matrices activas adaptadas al combate aumentan mucho la eficiencia en los enfrentamientos." #The development of active combat personalities allows combat-AI to specialize heavily in specific tasks.
 tech_combat_computers_2: "Algoritmos de combate ampliados"
 tech_combat_computers_2_desc: "Los avances en algoritmos de predicción permiten una mejor toma de decisiones tácticas en el campo de batalla."
 tech_combat_computers_3: "Simulaciones de combate inteligentes"
 tech_combat_computers_3_desc: "Usar IA en simulaciones de combate de gran intensidad da una comprensión valiosa de optimizaciones posibles para las técnicas de evaluación de riesgos." #The effectiveness of Ship-AIs have proved far greater with the sensation of a fear of death.
 tech_combat_computers_autonomous: "Intelectos de nave autónomos"
 tech_combat_computers_autonomous_desc: "Otorgar a nuestras naves sus propios intelectos semiautónomos aumentará mucho su grado de reacción en combate."
 tech_pd_tracking_1: "Contramedidas activas"
 tech_pd_tracking_1_desc: "La mejor defensa es un buen ataque."
 tech_pd_tracking_2: "Sistemas de apoyo enlazados"
 tech_pd_tracking_2_desc: "Estas baterías defensivas son mucho más eficaces que las contramedidas independientes."
 tech_pd_tracking_3: "Algoritmos de predicción"
 tech_pd_tracking_3_desc: "La predicción avanzada aumenta mucho la precisión de los sistemas de contramedidas activas."
 tech_synchronized_defences: "Defensas sincronizadas"
 tech_synchronized_defences_desc: "Alinear los paradigmas de ejecución de ramas de ataque y defensa permite una eficiencia mayor."
 tech_global_research_initiative: "Iniciativa de investigación interplanetaria"
 tech_global_research_initiative_desc: "Una apuesta por reservas de recursos interplanetarias y becas de investigación más flexibles."
 tech_neuro_quantum_links: "Neuroenlaces cuánticos"
 tech_neuro_quantum_links_desc: "Los implantes neurológicos avanzados conectados a clústeres de informática cuántica posibilitan los pensamientos multihilo."
 tech_cryostasis_1: "Naves colonia automatizadas"
 tech_cryostasis_1_desc: "Al dar el control de una nave colonia a un ordenador de a bordo, la tripulación y los colonos pueden quedar en animación suspendida."
 tech_cryostasis_1_wilderness: "Incubación de semillero"
 tech_cryostasis_1_wilderness_desc: "Si incubamos primero nuestros nuevos semilleros en la tierra nativa de las nuevas colonias, podremos acelerar el proceso de aclimatación."
 tech_cryostasis_1_machine_intelligence: "Drones de fabricación de colonias"
 tech_cryostasis_1_desc_machine_intelligence: "Flotas de pequeños pero eficientes drones de construcción almacenados en los muelles de carga de las naves colonia. Cuando se activan en una superficie planetaria, aceleran significativamente el proceso de asentamiento inicial."
 tech_cryostasis_2: "Naves colonia conscientes"
 tech_cryostasis_2_desc: "Los sistemas avanzados pueden optimizarse a sí mismos si se les hace lo suficientemente conscientes del propósito para el que fueron creados."
 tech_cryostasis_2_wilderness: "Incubación permanente"
 tech_cryostasis_2_wilderness_desc: "Si conseguimos que los semilleros especializados sean capaces de sobrevivir a cualquier tipo de clima de forma constante, se reducirá bastante el tiempo que tardamos en crear nuevos mundos."
 tech_automated_exploration: "Protocolos de exploración automatizada"
 tech_automated_exploration_desc: "Una IA avanzada ayudará a los científicos en su tarea de exploración de mundos desconocidos, descubrimiento de nuevas vidas y de nuevas civilizaciones, hasta alcanzar lugares donde ningún blorg ha podido llegar. La nave científica explorará la galaxia con ayuda de una IA."
 tech_automated_exploration_machine_intelligence: "Algoritmos de exploración autónoma"
 tech_automated_exploration_desc_machine_intelligence: "Los algoritmos actualizados y más avanzados no solo agilizarán la exploración, sino que también permitirán que nuestros activos de exploración pasen más tiempo en las profundidades del espacio sin recibir continuamente instrucciones de la inteligencia artificial central."
 tech_auxiliary_fire_control: "Control de fuego auxiliar"
 tech_auxiliary_fire_control_desc: "$FIRE_CONTROL_1_DESC$"
 #Resources
 tech_exotic_gases: "Refinado de gases exóticos"
 tech_exotic_gases_desc: "Los gases exóticos pueden producirse artificialmente, pero es un proceso difícil que requiere equipo avanzado de refinería."
 tech_volatile_motes: "Plantas de material volátil"
 tech_volatile_motes_desc: "Aparte de los problemas de seguridad más obvios, la creación artificial de motas volátiles es un proceso sumamente delicado y complejo para el que se necesita un equipo muy especializado."
 tech_rare_crystals: "Fabricación de cristales raros"
 tech_rare_crystals_desc: "El proceso de cristalización es complicado, pero los cristales sintéticos se pueden fabricar con plantas industriales especializadas."
 tech_mine_neutronium: "Extracción de neutronio"
 tech_mine_neutronium_desc: "Es una sustancia superdensa compuesta de neutrones que se puede forjar para hacer blindajes extremadamente resistentes y duraderos."
 tech_mine_dark_matter: "Extracción de materia oscura"
 tech_mine_dark_matter_desc: "Este polvo exótico tiene sustancias que parecen desafiar las leyes de la física. Las concentraciones aprovechables se encuentran cerca de los agujeros negros de ciertas nebulosas."
 #Ship Reactor Components
 tech_fission_power: "Energía de fisión"
 tech_fission_power_desc: "Esta fuente genera energía para naves mediante la fisión inducida, pero también residuos nucleares nocivos."
 tech_fusion_power: "Energía de fusión"
 tech_fusion_power_desc: "Los procesos de fusión nuclear generan una gran cantidad de energía para naves, pero sin los riesgos asociados a la fisión."
 tech_cold_fusion_power: "Energía de fusión en frío"
 tech_cold_fusion_power_desc: "La capacidad de sostener una reacción de fusión a temperaturas relativamente bajas comporta una nueva generación de reactores para nuestras naves."
 tech_antimatter_power: "Energía de antimateria"
 tech_antimatter_power_desc: "Al aprovechar las aniquilaciones materia-antimateria, nuestra eficiencia en la producción de energía para naves será muchos órdenes de magnitud superior a la fusión."
 tech_zero_point_power: "Energía de punto cero"
 tech_zero_point_power_desc: "Estos generadores extraen energía del vacío y proporcionan una fuente casi ilimitada. No hay manera más eficiente de generar energía para naves."
 tech_dark_matter_power_core: "Energía de materia oscura"
 tech_dark_matter_power_core_desc: "Parece que estos generadores extraen la energía directamente de la materia oscura y proporcionan más energía para naves de la que sería posible según las leyes de la física."
 tech_dark_matter_propulsion: "Propulsión de materia oscura"
 tech_dark_matter_propulsion_desc: "$SHIP_THRUSTER_5_DESC$"
 tech_reactor_boosters_1: "Potenciadores de reactor"
 tech_reactor_boosters_1_desc: "$REACTOR_BOOSTER_1_DESC$"
 tech_reactor_boosters_2: "Potenciadores de reactor mejorados"
 tech_reactor_boosters_2_desc: "$REACTOR_BOOSTER_2_DESC$"
 tech_reactor_boosters_3: "Potenciadores de reactor avanzados"
 tech_reactor_boosters_3_desc: "$REACTOR_BOOSTER_3_DESC$"
 #Shield Components
 tech_shields_1: "Deflectores"
 tech_shields_1_desc: "Pantallas deflectoras que pueden detener una cantidad limitada de disparos enemigos antes de sobrecargarse. Su desventaja es que consumen gran cantidad de energía.\n\n"
 tech_shields_2: "Deflectores mejorados"
 tech_shields_2_desc: "Estas pantallas deflectoras mejoradas son capaces de absorber más disparos todavía antes de sobrecargarse.\n\n"
 tech_shields_3: "Escudos"
 tech_shields_3_desc: "Representan la nueva generación de pantallas de energía y sustituyen a la antigua tecnología de deflectores. Ofrecen una protección bastante mejor.\n\n"
 tech_shields_4: "Escudos avanzados"
 tech_shields_4_desc: "Un generador de escudos que produce un campo de energía más fuerte incluso. Solo el fuego enemigo sostenido puede atravesar esta barrera.\n\n"
 tech_shields_5: "Hiperescudos"
 tech_shields_5_desc: "Estos escudos de energía reforzados y endurecidos son increíblemente potentes. La protección que ofrecen no tiene igual.\n\n"
 tech_shield_rechargers_1: "Condensadores de escudos"
 tech_shield_rechargers_1_desc: "Estos condensadores almacenan el excedente de energía que se puede transferir rápidamente para reforzar los escudos de las naves."
 tech_shield_hardeners_1: "Fortalecimiento de escudo"
 tech_shield_hardeners_1_desc: "$SHIELD_HARDENER_1_DESC$"
 tech_shield_hardeners_2: "Fortalecimiento de escudo avanzado"
 tech_shield_hardeners_2_desc: "$SHIELD_HARDENER_2_DESC$"
 tech_planetary_shield_generator: "Escudos planetarios"
 tech_planetary_shield_generator_desc: "Generar un escudo de energía fuerte en la atmósfera de un planeta es más difícil que en el vacío del espacio, pero ofrece una defensa potente contra el bombardeo orbital."
 tech_dark_matter_deflector: "Deflectores de materia oscura"
 tech_dark_matter_deflector_desc: "Estos deflectores utilizan la materia oscura para desviar los proyectiles enemigos de un modo que parece desafiar las leyes de la naturaleza."
 tech_psionic_shield: "Escudos psiónicos"
 tech_psionic_shield_desc: "$tech_psionic_shield_desc.1$ $INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_desc.1: "Estos escudos, extremadamente potentes, los genera con pura energía psiónica un grupo de"
 tech_psionic_shield_desc.2: ". Un sistema de emisores psíquicos aumenta su potencia."
 tech_psionic_shield_desc.shroud_forged.shared: "se materializaron al canalizar la energía psiónica pura del Velo."
 tech_psionic_shield_gestalt: "$tech_psionic_shield$"
 tech_psionic_shield_gestalt_desc: "$tech_psionic_shield_desc.1$ $GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_shroud_forged: "$tech_psionic_shield$"
 tech_psionic_shield_shroud_forged_desc: "Estos escudos extremadamente potentes $tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_shield_desc.2$"
 tech_psionic_barrier: "Barrera psiónica"
 tech_psionic_barrier_desc: "$tech_psionic_barrier_desc.1$ $INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_desc.1: "Estas barreras son generadas con pura energía psiónica por un grupo de"
 tech_psionic_barrier_desc.2: ". Pueden detener los disparos enemigos, igual que nuestros sistemas deflectores, pero sin el prohibitivo consumo de energía."
 tech_psionic_barrier_gestalt: "$tech_psionic_barrier$"
 tech_psionic_barrier_gestalt_desc: "$tech_psionic_barrier_desc.1$ $GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_shroud_forged: "$tech_psionic_barrier$"
 tech_psionic_barrier_shroud_forged_desc: "Estas barreras $tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_barrier_desc.2$"
 #Sensor Components
 tech_sensors_2: "Sensores gravitacionales"
 tech_sensors_2_desc: "Estos sensores se han ajustado para buscar todos los cambios gravitacionales en el espacio, como los que produce el paso de una nave espacial.\n\n"
 tech_sensors_3: "Sensores subespaciales"
 tech_sensors_3_desc: "Sensores que detectan las fluctuaciones subespaciales que dejan a su paso las naves espaciales. Su sensibilidad y alcance son superiores a los de los sensores gravitacionales.\n\n"
 tech_sensors_4: "Sensores de taquiones"
 tech_sensors_4_desc: "Utilizan rayos rotarios de taquiones para detectar movimientos de las naves incluso a distancias extremas.\n\n"
 tech_orbital_sensor_array: "Antenas de sensores orbitales"
 tech_orbital_sensor_array_desc: "Estas potentes antenas se pueden añadir a la estructura de los puertos espaciales orbitales. Dan una cobertura excelente de la región espacial circundante.\n\n"
 #Power Plants
 tech_power_plant_1: "Condensadores de gran energía"
 tech_power_plant_1_desc: "Son capaces de acumular gran cantidad de energía y son las piedras de toque de cualquier civilización moderna."
 tech_power_plant_2: "Modulación de campos"
 tech_power_plant_2_desc: "Los campos modulados permiten más producción y un mejor rendimiento de energía."
 tech_power_plant_3: "Estados de energía cuánticos"
 tech_power_plant_3_desc: "Los principios del entrelazamiento cuántico aplicados a la generación de energía mejoran mucho su rendimiento."
 tech_power_plant_4: "Manipulación de campos cuánticos"
 tech_power_plant_4_desc: "Superposición cuántica de bobinas energéticas, que se cargan y descargan simultáneamente."
 #tech_power_plant_5: "Matter to Energy Conversion"
 #tech_power_plant_5_desc: ""
 tech_stellar_absorption: "Absorción estelar"
 #tech_stellar_absorption_desc: "Unused" # TEMP
 tech_power_hub_1: "Gestión de energía global"
 tech_power_hub_1_desc: "Unas instalaciones de equilibro de carga que pueden mejorar en gran medida la estabilidad de las redes locales y devolver el exceso de energía a condensadores centralizados."
 tech_power_hub_2: "Red de energía planetaria"
 tech_power_hub_2_desc: "Una red unificada y rediseñada que reduce las pérdidas de energía por la distancia."
 #Warp Drives
 tech_wormhole_generation_1: "Agujeros de gusano subespaciales"
 tech_wormhole_generation_1_desc: "Abriendo túneles directamente por el subespacio se puede establecer un conducto entre dos puntos distintos del espacio normal. El viaje entre ellos será casi instantáneo.\n\n"
 tech_wormhole_generation_2: "Matriz calibradora de ags. de gusano"
 tech_wormhole_generation_2_desc: "La creación de un agujero de gusano estable precisa tiempo y grandes cantidades de energía, pero el proceso se puede perfeccionar con calibradores especiales.\n\n"
 tech_wormhole_generation_3: "Campos de contención de ags. de gusano"
 tech_wormhole_generation_3_desc: "Estos campos de contención permiten crear agujeros de gusano más potentes sin el peligro de desencadenar una súbita cascada de energía subespacial.\n\n"
 tech_hyper_drive_1: "Viaje por hiperespacio"
 tech_hyper_drive_1_desc: "Como las hebras de una telaraña, el reino extradimensional del hiperespacio recorre los pozos de gravedad de todas las estrellas. En teoría, el viaje ultralumínico es posible a través de estas hipervías.\n\n"
 tech_hyper_drive_2: "Fisuras en hipervías"
 tech_hyper_drive_2_desc: "Hemos comprobado la existencia de lugares donde una nave gasta menos energía por adentrarse en una hipervía. Esto conllevará una nueva generación de hiperimpulsores.\n\n"
 tech_hyper_drive_3: "Estelas hiperespeciales"
 tech_hyper_drive_3_desc: "Una nueva generación de hiperimpulsores capaces de acceder a las estelas subespaciales que hay en el hiperespacio. Esto conlleva un rendimiento espectacularmente mayor de los motores.\n\n"
 tech_hyperlane_mapping: "Cartografía de hipervías"
 tech_hyperlane_mapping_desc: "Aunque no viajemos por el hiperespacio, cartografiar la extensa red de hipervías de la galaxia nos dará una clara ventaja respecto a los que sí lo hacen.\n\n"
 tech_warp_drive_1: "Viaje por curvatura"
 tech_warp_drive_1_desc: "Al envolver una nave en un campo de curvatura y formar una burbuja especial en torno a ella, es posible alcanzar velocidades superiores a la de la luz, en teoría.\n\n"
 tech_warp_drive_2: "Estabilizadores de curvatura"
 tech_warp_drive_2_desc: "Las técnicas mejoradas de estabilización de campos de curvatura harán que nuestras naves lleguen más lejos gastando menos energía.\n\n"
 tech_warp_drive_3: "Colectores de curvatura"
 tech_warp_drive_3_desc: "Estos revolucionarios colectores se montan en los motores de curvatura y recogen las partículas, reponiendo el combustible de la nave.\n\n"
 tech_jump_drive_1: "Motor de salto"
 tech_jump_drive_1_desc: "El motor de salto es una maravilla tecnológica revolucionaria. Desgarra el continuo espacio-temporal local y lo reorganiza a nivel cuántico para que sea idéntico al del destino elegido. Así la nave parece \"saltar\" casi al instante de sistema a sistema.\n\n"
 tech_psi_jump_drive_1: "Motor de salto psi"
 tech_psi_jump_drive_1_desc: "El motor de salto psi aprovecha las energías psiónicas emitidas por la tripulación para impulsar la nave por el mismo tejido de la realidad, \"saltando\" al instante largas distancias.\n\n"
 tech_wormhole_stabilization: "Estación de agujeros de gusano"
 tech_wormhole_stabilization_desc: "Un agujero de gusano surgido de manera natural en el subespacio es algo inestable, y la fluctuación de sus niveles de energía hace imposible viajar de manera segura entre sus portales vinculados. Pero se puede estabilizar su matriz temporalmente."
 tech_gateway_activation: "Activación de portales"
 tech_gateway_activation_desc: "La habilidad de reactivar las estaciones portal abandonadas que hay dispersas por la galaxia tiene el potencial de acortar la duración de los viajes de forma espectacular."
 tech_gateway_construction: "Construcción de portal"
 tech_gateway_construction_desc: "La construcción de nuevas estaciones portal nos permite crear una red de transporte rápido que podría revolucionar el viaje interestelar."
 #Aura Components
 tech_shield_recharge_aura_1: "Campos de condensadores"
 tech_shield_recharge_aura_1_desc: "Los campos localizados de partículas cargadas pueden impulsar los condensadores de escudos agotados.\n\n"
 tech_aura_shield_dampener: "Depresores de escudos"
 #tech_aura_shield_dampener_desc: ""
 tech_aura_quantum_destabilizer: "Desestabilizador cuántico"
 tech_aura_quantum_destabilizer_desc: "Los desestabilizadores cuánticos agitan el campo cuántico, interfiriendo con el sensible equipo de apuntado de las naves enemigas.\n\n"
 tech_enigmatic_disruption_field: "Campo de disrupción enigmático"
 tech_enigmatic_disruption_field_desc: "Inundando un área localizada con suaves pulsos electromagnéticos modulados aleatoriamente se pueden interrumpir parcialmente el escudo y las armas del enemigo."
 #Aux
 tech_enigmatic_encoder: "Codificador enigmático"
 tech_enigmatic_encoder_desc: "El codificador enigmático encripta los datos de las rutas de vuelo según un diseño indeterminable antes de remitirlo al mando de la flota."
 tech_enigmatic_decoder: "Decodificador enigmático"
 tech_enigmatic_decoder_desc: "Aunque en las pruebas normales ofrece resultados medios, la precisión de los algoritmos de predicción del decodificador enigmático parece aumentar cuanto más irregular es la ruta de vuelo del objetivo."
 #Ascension perk
 tech_ascension_theory: "Teoría de la ascensión"
 tech_ascension_theory_desc: "Nuestra historia es un ciclo de espectaculares saltos tecnológicos, políticos y culturales que se repite; estos saltos a menudo son precedidos por periodos de convulsión y seguidos de una relativa estabilidad. Al identificar las premisas recurrentes de estos saltos, podemos cortocircuitar el ciclo en nuestro propio beneficio."
 tech_ascension_theory_apoc: "$tech_ascension_theory$"
 tech_ascension_theory_apoc_desc: "$tech_ascension_theory_desc$"
 ####################################
 #Physics - Weapons
 ####################################
 #Laser Branch
 tech_lasers_1: "Láseres rojos"
 tech_lasers_1_desc: "Las armas láser disparan rayos concentrados de luz contra los objetivos y causan daño generando un calor intenso.\n\n"
 tech_lasers_2: "Láseres azules"
 tech_lasers_2_desc: "Estas variantes azules de láser, más potentes, emiten radiaciones electromagnéticas en una longitud de onda que parece azul o violeta a todos los orgánicos.\n\n"
 tech_lasers_3: "Láseres UV"
 tech_lasers_3_desc: "Los láseres ultravioletas son una versión mejorada y más potente de sus predecesores azules. Estas armas, precisas y destructivas, son capaces de infligir un gran daño.\n\n"
 tech_lasers_4: "Láseres de rayos X"
 tech_lasers_4_desc: "Tienen una longitud de onda más corta que el armamento láser basado en UV, pero son todavía más destructivos.\n\n"
 tech_lasers_5: "Láseres gamma"
 tech_lasers_5_desc: "La radiación electromagnética que emiten los láseres gamma es de una frecuencia alta en extremo. Su potencial destructivo no tiene igual en el campo de las armas láser.\n\n"
 tech_energy_lance_1: "Lanzas de partículas"
 tech_energy_lance_1_desc: "Estas armas pesadas disparan rayos concentrados de partículas que causan un daño enorme. El tamaño de las baterías de emisores obliga a montarlas en acorazados y titanes."
 tech_energy_lance_2: "Lanzas de taquiones"
 tech_energy_lance_2_desc: "Esta arma, una versión más potente de la lanza de partículas, dispara un rayo de taquiones de un poder inmenso. Como su predecesora, queda limitada a acorazados y titanes."
 tech_perdition_beam: "Rayo de disipación"
 tech_perdition_beam_desc: "Un enorme sistema de conductos de amplificación de energía vinculados que disparan un rayo de potencia sin precedentes. Su tamaño lo limita a naves de clase titán."
 #Plasma Weapons
 tech_plasma_1: "Lanzadores de plasma"
 tech_plasma_1_desc: "Lanzan bolas destructivas de plasma de gran energía contra los objetivos. Estos proyectiles de plasma son muy efectivos para destruir el blindaje de las naves.\n\n"
 tech_plasma_2: "Aceleradores de plasma"
 tech_plasma_2_desc: "Estos nuevos aceleradores lanzan proyectiles de plasma de gran energía con campos de contención mejorados. Esto comporta menos pérdida de energía mientras el proyectil recorre el espacio hacia su objetivo.\n\n"
 tech_plasma_3: "Cañones de plasma"
 tech_plasma_3_desc: "Es la cúspide del armamento de plasma, versiones completamente militarizadas de los anteriores lanzadores de plasma, algo improvisados. Sus proyectiles son más mortíferos todavía.\n\n"
 tech_arc_emitter_1: "Emisores de arcos"
 tech_arc_emitter_1_desc: "Armas potentes que lanzan un arco de rayos de energía caótica a los objetivos, capaz de ignorar en parte blindaje y escudos.\n\n"
 tech_arc_emitter_2: "Emisores de arcos concentrados"
 tech_arc_emitter_2_desc: "Estos emisores mejorados cuentan con lentes de enfoque superiores, lo cual comporta una descarga más potente de energía.\n\n"
 #Disruptor Weapons
 tech_disruptors_1: "Disruptores"
 tech_disruptors_1_desc: "Disparan proyectiles de gran energía que debilitan y destruyen los enlaces moleculares que unen los átomos que componen el objetivo. Son capaces de atravesar escudos y blindajes para causar estragos en el casco y la tripulación."
 tech_disruptors_2: "Disruptores de iones"
 tech_disruptors_2_desc: "Estos disruptores mejorados disparan proyectiles de partículas de iones más destructivos.\n\n"
 tech_disruptors_3: "Disruptores de fase"
 tech_disruptors_3_desc: "Tienen un rendimiento extremo y disparan cargas de energía cuántica que infligen un daño increíble a los desafortunados que se crucen en su camino."
 tech_energy_torpedoes_1: "Lanzadores de protones"
 tech_energy_torpedoes_1_desc: "Estos proyectiles de energía se componen de protones ultraconcentrados capaces de causar un daño inmenso al casco de las naves enemigas."
 tech_energy_torpedoes_2: "Lanzadores de neutrones"
 tech_energy_torpedoes_2_desc: "Proyectiles de energía mejorados que cuentan con neutrones en vez de protones para causar destrucción."
 null_void_beam: "Rayo de Vacío nulo"
 null_void_beam_desc: "Al aprovechar la naturaleza entrópica del Vacío nulo, este rayo puede, de hecho, destruir energía."
 #Critter Weapons
 tech_extradimensional_weapon_1: "Armamento extradimensional"
 tech_extradimensional_weapon_1_desc: "Al aplicar los principios de manipulación de energía de la quinta dimensión en los planos dimensionales inferiores podemos crear poderosas armas energéticas.\n\n"
 tech_mining_drone_weapon_1: "Láseres de dron minero"
 tech_mining_drone_weapon_1_desc: "Usar lentes de gran concentración con una frecuencia de disparo oscilante ayuda a crear láseres lo bastante potentes como para extraer minerales de los asteroides o abatir a enemigos."
 tech_space_cloud_weapon_1: "Conductos de nube de rayos"
 tech_space_cloud_weapon_1_desc: "Las nubes de vacío usan cargas eléctricas generadas por los densos gases que forman la mayor parte de su núcleo para liberar rayos de plasma ardiente. Usando la misma composición de gas con un conducto especializado podemos crear una potente arma de rayos.\n\n"
 tech_blue_crystal_weapon_1: "Condensadores de cristal azul"
 tech_blue_crystal_weapon_1_desc: "Las entidades cristalinas almacenan radiación estelar dentro de sus cuerpos prismáticos para luego concentrarla en rayos a modo de láser. Usando el diseño prismático de las de tipo zafiro como base, podemos construir condensadores láser que producen energía en una longitud de onda similar.\n\n"
 tech_green_crystal_weapon_1: "Condensadores de cristal verde"
 tech_green_crystal_weapon_1_desc: "Las entidades cristalinas almacenan radiación estelar dentro de sus cuerpos prismáticos para concentrarla en rayos a modo de láser. Usando el diseño prismático de las de tipo esmeralda como base, podemos construir condensadores láser que producen energía en una longitud de onda similar.\n\n"
 tech_yellow_crystal_weapon_1: "Condensadores de cristal amarillo"
 tech_yellow_crystal_weapon_1_desc: "Las entidades cristalinas almacenan radiación estelar dentro de sus cuerpos prismáticos para concentrarla en rayos a modo de láser. Usando el diseño prismático de las de tipo topacio como base, podemos construir condensadores láser que producen energía en una longitud de onda similar.\n\n"
 tech_red_crystal_weapon_1: "Condensadores de cristal rojo"
 tech_red_crystal_weapon_1_desc: "Las entidades cristalinas almacenan radiación estelar dentro de sus cuerpos prismáticos para concentrarla en rayos a modo de láser. Usando el diseño prismático de las de tipo rubí como base, podemos construir condensadores láser que producen energía en una longitud de onda similar.\n\n"
 ####################################
 #Society
 ####################################
 #Farming
 tech_hydroponics: "Simulación de ecos"
 tech_hydroponics_desc: "Las técnicas hidropónicas pueden desarrollarse más creando granjas con atmósferas exclusivas que simulan ecosistemas diferentes. Esto permite producir comida de mayor grado nutritivo.\n\n"
 tech_industrial_farming: "Agricultura industrial"
 tech_industrial_farming_desc: "La producción de las granjas industriales de gran escala permite a una civilización multiplicar su población."
 tech_eco_simulation: "Simulación de ecos"
 tech_eco_simulation_desc: "Las técnicas agrícolas pueden perfeccionarse mediante simulaciones informáticas de diversos entornos y patrones meteorológicos. Con esto se obtienen cosechas más predecibles."
 tech_gene_crops: "Cosechas genéticas"
 tech_gene_crops_desc: "La sofisticada ingeniería genética de las cosechas ayuda a aumentar la producción y mejora más los niveles de sabor y nutrición.\n\n"
 tech_nano_vitality_crops: "Cosechas nanovitales"
 tech_nano_vitality_crops_desc: "Usar pequeñas cantidades de nanomáquinas en las cosechas ayuda a crear un tipo de verdura ultrarresistente, cuya composición química puede ser alterada y rediseñada en toda su duración.\n\n"
 #tech_pure_seed_farming: "Pure-seed Farming"
 #tech_pure_seed_farming_desc: ""
 tech_nutrient_replication: "Replicación de nutrientes"
 tech_nutrient_replication_desc: "El proceso de replicar cosechas sintéticamente requiere gran cantidad de residuos para crear pequeñas cantidades de verdura, pero en todo caso proporciona un aumento significativo del rendimiento agrícola.\n\n"
 #Resources
 tech_engos_vapor: "Refinamiento de vapor de engos"
 tech_engos_vapor_desc: "Un estimulante natural que ayuda a las formas de vida a adaptarse y evolucionar. También puede usarse como potente conductor de las armas de energía.\n\n"
 tech_pitharan_dust: "Refinamiento de polvo pitharano"
 tech_pitharan_dust_desc: "Este polvillo es un psicoactivo de origen natural que se encuentra en algunos mundos. Tiene un efecto balsámico en muchos seres y se utiliza para pacificar sin violencia a individuos hostiles.\n\n"
 tech_mine_zro: "Destilación de zro"
 tech_mine_zro_desc: "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $individuals_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_desc.1: "Un aerosol extremadamente raro de partículas exóticas. Se ha depositado en varios mundos debido al impacto de meteoritos, pero su verdadero origen es un misterio."
 tech_mine_zro_desc.2: "con dotes psiónicas"
 tech_mine_zro_desc.3: "el zro funciona como una muy potente (y adictiva)"
 tech_mine_zro_desc.4: "que aumenta las capacidades psiónicas."
 tech_mine_zro_machine_gestalt: "$tech_mine_zro$"
 tech_mine_zro_machine_gestalt_desc: "$tech_mine_zro_desc.1$ $MACHINE_INGESTED$ $tech_mine_zro_desc.2$ $units_key$$tech_mine_zro_desc.3$ $MACHINE_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_machine_non_gestalt: "$tech_mine_zro$"
 tech_mine_zro_machine_non_gestalt_desc: "$tech_mine_zro_desc.1$ $MACHINE_INGESTED$ $tech_mine_zro_desc.2$ $individuals_key$$tech_mine_zro_desc.3$ $MACHINE_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_hive: "$tech_mine_zro$"
 tech_mine_zro_hive_desc: "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $drones_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_wilderness: "$tech_mine_zro$"
 tech_mine_zro_wilderness_desc: "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $symbionts_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"
 tech_society_1: "Xenobiología"
 tech_society_1_desc: "El estudio de la vida alienígena va más allá de catalogarla. Al examinar las estructuras y estrategias de supervivencia de organismos que evolucionaron bajo otras estrellas, abrimos nuevas puertas en medicina, adaptación y diseño."
 tech_society_2: "Tejido neuronal"
 tech_society_2_desc: "Hemos desarrollado métodos para reconocer la topología electroquímica de la materia consciente por medio de un andamiaje axonal recursivo y la reticulación sináptica. Las neuronas no se limitan a transmitir, sino que se entretejen, se organizan y recuerdan, y ahora lo hacen según nuestro diseño."
 tech_society_3: "Síntesis bioestructural"
 tech_society_3_desc: "La vida, con toda su pasmosa variedad, está compuesta por patrones repetitivos y estructuras modulares. Tras decodificarlos y reproducirlos a todas las escalas, ahora contamos con un plano holístico de la biología. Apenas queda nada en la naturaleza que no comprendamos, y menos aún que no podamos recrear."
 #tech_society_1: "Standardized Interstellar Timekeeping"
 #tech_society_1_desc: "In an era where interstellar travel is commonplace, the adoption of a unified temporal framework serves as a linchpin for progress. Whether for organizing galactic commutes or facilitating astrophysical observations, standard time represents a visionary stride towards unity and precision."
 #tech_society_2: "Xenobiology"
 #tech_society_2_desc: "The study of xenobiology invites us to explore the possibility of life beyond conventional paradigms, thriving in environments far removed from our own. Every new biosphere allows for parallels to be drawn and the origins of life itself to become clearer."
 #tech_society_3: "Exoplanetary Logistics"
 #tech_society_3_desc: "Comprehensive logistical systems optimize the movement of people, resources, and information across interstellar distances. This paradigm not only promotes cohesion between core world and colony, but serves as a testament to our adaptability and resilience in the face of large-scale challenges."
 #tech_society_4: "Origins of Sapience"
 #tech_society_4_desc: "By deciphering the neural and cognitive mechanisms that underpin sapience, researchers can now delineate its boundaries and constraints."
 tech_alien_life_studies: "Xenología"
 tech_alien_life_studies_desc: "Al estudiar la fauna de otros mundos comprendemos mejor los comportamientos alienígenas, lo que nos permite identificar y domesticar entidades dóciles.\n\n"
 tech_xeno_zoo: "Xenozoo"
 tech_xeno_zoo_desc: "Tras estudiar varias formas de vida alienígena y desarrollar un claro entendimiento de los riesgos potenciales de contenerlas, podemos capturar especímenes vivos y conservarlos en exhibición.\n\n"
 tech_colonization_1: "Protocolo de nuevos mundos"
 tech_colonization_1_desc: "Calcular los recursos y el equipo necesarios para establecer una colonia planetaria nos permite transportar valientes pioneros en grandes \"naves arca\", con la seguridad de que sobrevivirán al largo viaje por las estrellas hasta un nuevo hogar.\n\n"
 tech_colonization_2: "Filtrado atmosférico"
 tech_colonization_2_desc: "Al ajustar el filtrado atmosférico según el lugar podemos filtrar mejor los elementos indeseables y avanzar las condiciones de vida de la colonia.\n\n"
 tech_colonization_3: "Adaptación a entornos hostiles"
 tech_colonization_3_desc: "Estudiar más a fondo los entornos peligrosos hallados en otros planetas ayuda a reducir las dificultades que los colonos encuentran en su día a día en mundos alienígenas.\n\n"
 tech_colonization_4: "Enriquecimiento del suelo extranjero"
 tech_colonization_4_desc: "Un análisis exhaustivo de los diferentes tipos de suelos y su capacidad para soportar cultivos ayudará a mejorar las condiciones de vida de nuestros colonos en otros mundos."
 tech_colonization_5: "Estudios de ecointegración"
 tech_colonization_5_desc: "Un estudio más profundo de los climas planetarios permitirá a nuestra población colonizar mundos que antes resultaban demasiado hostiles."
 tech_tomb_world_adaption: "Adaptación al mundo tumba"
 tech_tomb_world_adaption_desc: "El estudio exhaustivo de entornos irradiados permitirá que nuestra población colonice mundos devastados por una guerra nuclear."
 tech_free_enterprises: "Empresas libres"
 #tech_free_enterprises_desc: ""
 tech_frontier_initiatives: "Iniciativas fronterizas"
 tech_frontier_initiatives_desc: "Gestionar las conexiones entre el sector privado y el gobierno, otorgando subvenciones a los inversores adecuados, permite las iniciativas privadas en la colonización."
 tech_frontier_traditions: "Tradiciones fronterizas"
 tech_frontier_traditions_desc: "Un cierto espíritu pionero se manifiesta en las prioridades de construcción orbital.\n\n"
 tech_frontier_collectives: "Colectivos fronterizos"
 tech_frontier_collectives_desc: "La historia ha demostrado que los colectivos son la estructura social más eficaz para los enclaves de colonos.\n\n"
 tech_frontier_commissars: "Comisarios fronterizos"
 tech_frontier_commissars_desc: "Los estudios indican que un control social estricto podría ser fundamental para la supervivencia de las colonias jóvenes.\n\n"
 tech_cryostasis: "Criogenización"
 #tech_cryostasis_desc: ""
 tech_xeno_ecology_1: "Subyugación de xenoecologías"
 #tech_xeno_ecology_1_desc: ""
 tech_xeno_ecology_2: "Control medioambiental"
 #tech_xeno_ecology_2_desc: ""
 tech_reveal_luxuries_1: "Economía interestelar"
 #tech_reveal_luxuries_1_desc: ""
 tech_reveal_luxuries_2: "Mercados galácticos"
 #tech_reveal_luxuries_2_desc: ""
 tech_orbital_hydroponics: "Acuicultura orbital"
 tech_orbital_hydroponics_desc: "Los desafíos inherentes a las cosechas en gravedad 0 son bastante peculiares, pero no insuperables.\n\n"
 tech_arctic_colonization: "Colonización del ártico"
 tech_arctic_colonization_desc: "Los refugios especializados y los sistemas de soporte vital adaptativos permiten la colonización de climas alienígenas.\n\n"
 tech_tundra_colonization: "Colonización de la tundra"
 tech_tundra_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_ocean_colonization: "Colonización del océano"
 tech_ocean_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_arid_colonization: "Colonización de tierras áridas"
 tech_arid_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_tropical_colonization: "Colonización de tierras tropicales"
 tech_tropical_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_desert_colonization: "Colonización de desiertos"
 tech_desert_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_continental_colonization: "Colonización de continentes"
 tech_continental_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_basic_health: "Atención médica"
 tech_basic_health_desc: "$job_healthcare_desc$"
 tech_frontier_health: "Sanidad genética"
 tech_frontier_health_desc: "La colonización de los mundos alienígenas ha abierto un nuevo campo de investigación biomédica.\n\n"
 tech_frontier_health_machine_intelligence: "Componentes modulares"
 tech_frontier_health_desc_machine_intelligence: "El uso de partes modulares al montar las nuevas unidades mecánicas optimizará el proceso y simplificará las reparaciones futuras."
 tech_frontier_hospital: "Citorrevitalización"
 tech_frontier_hospital_desc: "A medida que nuestro imperio crece, también lo hace nuestra comprensión de la biología. Los tratamientos médicos avanzados a nivel celular han permitido importantes avances en la salud de la población biológica."
 tech_frontier_hospital_machine_intelligence: "Fábricas inteligentes"
 tech_frontier_hospital_desc_machine_intelligence: "Estas fábricas son básicamente unas entidades con conciencia propia que se optimizan continuamente con una aportación mínima por parte de la inteligencia artificial central."
 tech_modular_components: "$tech_frontier_health_machine_intelligence$"
 tech_modular_components_desc: "$tech_frontier_health_desc_machine_intelligence$"
 tech_intelligent_factories: "$tech_frontier_hospital_machine_intelligence$"
 tech_intelligent_factories_desc: "$tech_frontier_hospital_desc_machine_intelligence$"
 tech_mountain_range: "Reestructuración planetaria"
 tech_mountain_range_desc: "Con la llegada de las tecnologías de fusión limpia, automatización y compresión de materia, era solo cuestión de tiempo que pudiésemos aplanar cordilleras enteras."
 tech_volcano: "Ingeniería de profundidad"
 tech_volcano_desc: "Los avances en tecnología material y las técnicas de extracción profunda permiten la geoingeniería a profundidades y temperaturas antes impensables. Las bolsas de magma pueden explotarse, suprimirse o incluso trasladarse."
 tech_dangerous_wildlife: "Quitar vida salvaje peligrosa"
 tech_dangerous_wildlife_desc: "La disrupción táctica de hábitats naturales, combinada con patrones convergentes de búsqueda y destrucción, pueden eliminar de manera eficaz la fauna hostil en muy poco tiempo."
 tech_dense_jungle: "Defoliantes selectivos"
 tech_dense_jungle_desc: "Mediante la catalogación, la secuenciación genética y el modelado informático de los ecosistemas exobotánicos, junto a la modificación de genes y los mecanismos de dispersión, podremos reformar a nuestro gusto las comunidades vegetales alienígenas."
 tech_quicksand_basin: "Enriquecimiento de la tierra"
 tech_quicksand_basin_desc: "El proceso de deposición geológica normalmente lleva millones de años. Mediante tecnologías de gestión hidráulica, fracking avanzado e ingeniería química, incluso los sustratos más estériles pueden volverse tierra fértil."
 tech_noxious_swamp: "Dominio xeno hidráulico"
 tech_noxious_swamp_desc: "Los seres inteligentes han recuperado terreno cenagoso durante milenios. Un proceso coordinado de acueductos modulares, estaciones de bombeo, orugas de reparación química y compactadores de tierra automáticos puede hacerlo a gran velocidad."
 tech_massive_glacier: "Red de control meteorológico"
 tech_massive_glacier_desc: "Bien gestionados, los sistemas orbitales de espejos y sombras pueden tener efectos espectaculares en el clima planetario."
 tech_toxic_kelp: "Gestión de ecología oceánica"
 tech_toxic_kelp_desc: "Con suficiente poder de procesamiento, sensores en red y estaciones distribuidas, incluso las corrientes oceánicas pueden gestionarse con precisión."
 tech_deep_sinkhole: "Colonización subterránea"
 tech_deep_sinkhole_desc: "Muchos planetas tienen extensos vacíos bajo la superficie. Con exploración subterránea, explotación y técnicas de construcción se puede aumentar mucho la zona habitable de algunos mundos."
 #Trade
 tech_space_trading: "Compañías de comercio extraterrestre"
 tech_space_trading_desc: "El comercio a lo largo de distancias interestelares presenta nuevos retos. Debemos transferir las mercancías entre sistemas puntualmente y, sobre todo, sin incurrir en gastos ineficientes."
 #Terraforming
 tech_terrestrial_sculpting: "Escultura terrestre"
 tech_terrestrial_sculpting_desc: "El problema de reformar a gran escala la corteza planetaria no tiene una solución sencilla. Únicamente taladros desplegados desde la órbita y excavadoras más grandes.\n\n"
 tech_atmospheric_manipulation: "Manipulación de atmósferas"
 tech_atmospheric_manipulation_desc: "Los reguladores de humedad y las unidades de dispersión de químicos son el primer paso para una alteración fundamental de la atmósfera.\n\n"
 tech_ecological_adaptation: "Adaptación ecológica"
 tech_ecological_adaptation_desc: "Al adaptar ecosistemas planetarios a cambios medioambientales de gran escala podemos hacer que la terraformación sea un proceso menos perjudicial."
 tech_climate_restoration: "Reparación de clima"
 tech_climate_restoration_desc: "Al entender mejor la manipulación atmosférica, podremos terraformar incluso mundos ecológicamente devastados.\n\n"
 tech_gaia_creation: "Creación Gaia"
 tech_gaia_creation_desc: "La creación de planetas Gaia, mundos adecuados para todas las formas de vida, es la prueba definitiva del dominio de las especies en el arte de la terraformación.\n\n"
 #Genetics
 tech_genome_mapping: "Mapa de genomas"
 tech_genome_mapping_desc: "Cartografiar el genoma de un individuo mediante la secuenciación de su ADN abre paso a nuevos tratamientos médicos y terapias.\n\n"
 tech_epigenetic_triggers: "Activadores epigenéticos"
 tech_epigenetic_triggers_desc: "Las técnicas avanzadas de metilación del ADN permiten hacer alteraciones funcionales significativas en genomas arbitrarios.\n\n"
 TECH_UNLOCK_EPIGENETICS_TITLE: "§HDesbloquea la función:§! activadores epigenéticos"
 TECH_UNLOCK_EPIGENETICS_DESC: "Nos permite eliminar rasgos presapientes de las especies biológicas mediante la modificación."
 tech_cloning: "Clonación"
 tech_cloning_desc: "Los avances en enucleación y tecnología de útero artificial permiten la producción en masa de individuos según una plantilla genética común.\n\n"
 tech_gene_banks: "Bancos genéticos"
 tech_gene_banks_desc: "Los bancos genéticos filtran y ordenan los genomas disponibles para su aplicación en clones.\n\n"
 tech_glandular_acclimation: "Aclimatación glandular"
 tech_glandular_acclimation_desc: "Mediante la modificación biológica de las glándulas podemos cambiar la tolerancia de una especie al entorno para adaptarla a nuestras necesidades."
 tech_gene_seed_purification: "Purificación de semillas genéticas"
 tech_gene_seed_purification_desc: "Las técnicas de purificación de los nucleótidos permiten el aislamiento y refinado de rasgos genéticos especialmente deseables.\n\n"
 tech_morphogenetic_field_mastery: "Dominio de campos morfogenéticos"
 tech_morphogenetic_field_mastery_desc: "Desde sus orígenes como una empresa puramente farmacéutica, los avances en el campo de la morfogenética han dado lugar a interfaces directas y subconscientes con unidades orgánicas.\n\n"
 tech_gene_tailoring: "Confección genética"
 tech_gene_tailoring_desc: "Extender la disponibilidad de las herramientas de genoedición tendrá sin duda una repercusión positiva en nuestro desarrollo como especie.\n\n"
 tech_gene_tailoring_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 tech_gene_tailoring_overtuned: "$tech_gene_tailoring$"
 tech_gene_tailoring_overtuned_desc: "$tech_gene_tailoring_desc$"
 tech_gene_expressions: "Expresiones de \"gene targeting\""
 tech_gene_expressions_desc: "Un control más estricto del ARN y la producción de proteínas a nivel celular.\n\n"
 #tech_gene_expressions_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 TECH_UNLOCK_GENE_EXPRESSIONS_TITLE: "§HDesbloquea el rasgo:§! $trait_auto_mod_biological$"
 TECH_UNLOCK_GENE_EXPRESSIONS_DESC: "Nos permite añadir §Y$trait_auto_mod_biological$§! a las especies orgánicas mediante la modificación."
 TECH_UNLOCK_VOCATIONAL_GENES_TITLE: "§HDesbloquea la modificación de especie:§! Edición vocacional"
 TECH_UNLOCK_VOCATIONAL_GENES_DESC: "Se pueden §Yeliminar§! ['concept_vocational_traits'] mediante modificación de especies"
 tech_selected_lineages: "Linajes seleccionados"
 tech_selected_lineages_desc: "La cuidadosa planificación reproductiva debería incentivarse para no malgastar valiosos legados genéticos.\n\n"
 tech_capacity_boosters: "Potenciadores de capacidad"
 tech_capacity_boosters_desc: "No dejamos nada al azar, cueste lo que cueste. Al custodiar rigurosamente los bancos de ADN construimos los líderes del mañana.\n\n"
 tech_regenerative_hull_tissue: "Tejido regenerador de casco"
 tech_regenerative_hull_tissue_desc: "Una versión de bacterias de silicona alteradas genéticamente que podría manipularse para regenerar materiales no orgánicos.\n\n"
 tech_vitality_boosters: "Potenciadores de vitalidad"
 tech_vitality_boosters_desc: "Cuando el cuerpo falla, la ciencia interviene."
 tech_lithoid_transgenesis: "Transgénesis de silicato"
 tech_lithoid_transgenesis_desc: "Las similitudes entre las formas de vida basadas en silicio y las basadas en carbono nos permiten sintetizar rasgos evolutivos litoideos en especies basadas en el carbono."
 TECH_UNLOCK_LITHOID_GENETICS_TITLE: "§HDesbloquea la función:§! transgénesis litoidea"
 TECH_UNLOCK_LITHOID_GENETICS_DESC: "Nos permite añadir rasgos litoideos a las especies biológicas mediante la modificación."
 tech_plantoid_transgenesis: "Transgénesis botánica"
 tech_plantoid_transgenesis_desc: "Con los estímulos artificiales adecuados, las adaptaciones evolutivas halladas en las especies botánicas pueden replicarse en otras formas de vida."
 TECH_UNLOCK_PLANTOID_GENETICS_TITLE: "§HDesbloquea la función:§! transgénesis botánica"
 TECH_UNLOCK_PLANTOID_GENETICS_DESC: "Nos permite añadir rasgos botánicos a las especies orgánicas mediante la modificación."
 tech_leviathan_transgenesis: "Transgénesis de leviatán"
 tech_leviathan_transgenesis_desc: "En la fauna galáctica hay adaptaciones impresionantes a la vida en el espacio interestelar. Nuestro éxito en la genética pasa por el dominio de estos rasgos."
 TECH_UNLOCK_LEVIATHAN_GENETICS_TITLE: "§HDesbloquea la función:§! transgénesis de leviatán"
 TECH_UNLOCK_LEVIATHAN_GENETICS_DESC: "Nos permite añadir rasgos de leviatán a las especies orgánicas mediante la modificación."
 #Fleet Organization
 tech_doctrine_fleet_size_1: "Doctrina: combate espacial"
 tech_doctrine_fleet_size_1_desc: "La adaptación gradual a las realidades del combate en el espacio profundo nos permite coordinar de forma eficaz maniobras de mayor envergadura.\n\n"
 tech_doctrine_fleet_size_2: "Doctrina: formaciones reactivas"
 tech_doctrine_fleet_size_2_desc: "La adaptación gradual a las realidades del combate en el espacio profundo nos permite coordinar de forma eficaz maniobras de mayor envergadura.\n\n"
 tech_doctrine_fleet_size_3: "Doctrina: guerra interestelar"
 tech_doctrine_fleet_size_3_desc: "La adaptación gradual a las realidades del combate en el espacio profundo nos permite coordinar de forma eficaz maniobras de mayor envergadura.\n\n"
 tech_doctrine_fleet_size_4: "Doctrina: plantillas de flotas fluidas"
 tech_doctrine_fleet_size_4_desc: "La adaptación gradual a las realidades del combate en el espacio profundo nos permite coordinar de forma eficaz maniobras de mayor envergadura.\n\n"
 tech_doctrine_fleet_size_5: "Doctrina: formación de combate de armadas"
 tech_doctrine_fleet_size_5_desc: "La adaptación gradual a las realidades del combate en el espacio profundo nos permite coordinar de forma eficaz maniobras de mayor envergadura.\n\n"
 tech_interstellar_fleet_traditions: "Tradiciones de la flota interestelar"
 tech_interstellar_fleet_traditions_desc: "Una obra de conocimientos sobre los comportamientos de combate es inútil sin un fuerte código que gobierne su uso.\n\n"
 tech_command_matrix: "Matriz de mando"
 tech_command_matrix_desc: "Reestructurar la cadena de mando y decidir cuáles son las interdependencias entre los oficiales hace que las flotas respondan mejor y sean más eficientes."
 tech_doctrine_navy_size_1: "Doctrina: apoyo a flotas"
 tech_doctrine_navy_size_1_desc: "A medida que las expediciones extrasolares se hacen más comunes, es importante proporcionar ayuda planetaria a las flotas que regresan."
 tech_doctrine_navy_size_2: "Doctrina: naves de apoyo"
 tech_doctrine_navy_size_2_desc: "Una flota no funciona solo con fervor. Para garantizar un acceso estable a suministros críticos, debemos organizar nuestros cuerpos logísticos en naves de apoyo."
 tech_doctrine_navy_size_3: "Doctrina: logística interestelar"
 tech_doctrine_navy_size_3_desc: "Los aficionados hablan de tácticas, los profesionales estudian la logística. Si garantizamos el suministro eficaz de nuestras flotas, podemos aumentar el número de naves que somos capaces de mantener."
 tech_doctrine_navy_size_4: "Doctrina: enlaces de flotas"
 tech_doctrine_navy_size_4_desc: "Si mantenemos un cuerpo profesional como enlaces de flotas, podemos mejorar las comunicaciones y el flujo de las órdenes en una cadena de mando."
 tech_refit_standards: "Reajuste de estándares"
 tech_refit_standards_desc: "Estandarizar las dinámicas de trabajo para mejorar y readaptar los componentes de las naves puede mejorar muchísimo la eficacia."
 #Army Organization
 tech_centralized_command_hive_mind: "Centros de mando de drones"
 tech_centralized_command_desc_hive_mind: "Al establecer instalaciones de entrenamiento donde los drones autónomos puedan aprender a dirigir a sus inferiores, conseguiremos una flexibilidad y eficacia mucho mayores en el campo de batalla."
 tech_centralized_command: "Mando centralizado"
 tech_centralized_command_desc: "Crear cuarteles generales especializados para todos los niveles de las operaciones militares mejora la eficacia de la flota y los cimientos del futuro entrenamiento del ejército.\n\n"
 tech_centralized_command_machine_intelligence: "Mando de mantenimiento"
 tech_centralized_command_desc_machine_intelligence: "Todas las máquinas necesitan mantenimiento, en especial las formas de guerra. Un cuerpo de mantenimiento especializado mantendrá los fallos por erosión a unos niveles mínimos y reducirá los costes de reparación."
 tech_combat_training: "Entrenamiento de combate"
 tech_combat_training_desc: "Un programa más extenso de entrenamiento para los nuevos reclutas, con escenarios de combate realistas incluidos, los prepara para la acción.\n\n"
 tech_combat_training_machine_intelligence: "Reparaciones de campo"
 tech_combat_training_desc_machine_intelligence: "Al equipar a nuestras unidades de combate en tierra con bases de datos técnicas, podrán realizar diagnósticos y autorrepararse hasta cierto punto sobre el terreno."
 tech_ground_defense_planning: "Planificación de defensa terrestre"
 tech_ground_defense_planning_desc: "Hay muchos imperios alienígenas que querrían arrebatarnos nuestros mundos. Debemos estar preparados en caso de que llegue lo peor."
 tech_global_defense_grid: "Red de defensa global"
 tech_global_defense_grid_desc: "El valor estratégico de una buena defensa es tan relevante hoy como lo fue para nuestros ancestros en el pasado lejano. La tecnología no vuelve obsoletas las fortificaciones. Solo cambia sus requisitos."
 #Psionics
 tech_psionic_theory: "Teoría de psiónicas"
 tech_psionic_theory_desc: "A menudo, la mente es un reflejo del propio universo, un microcosmos. Quizá no todos los seres lleguen a comprender esto, pero sus mentes son herramientas superiores a cualquier otra."
 tech_telepathy: "Telepatía"
 tech_telepathy_desc: "$tech_telepathy_desc.1$, la mente puede conectarse con otros individuos para convertirse en algo superior."
 tech_telepathy_desc.1: "Una vez plenamente adaptada a los fundamentos psiónicos,"
 tech_telepathy_machine_gestalt: "$tech_telepathy$"
 tech_telepathy_machine_gestalt_desc: "$tech_telepathy_desc.1$, nuestro/a $getbrainname_machine$ puede extenderse más allá de la red colectiva."
 tech_telepathy_hive: "$tech_telepathy$"
 tech_telepathy_hive_desc: "$tech_telepathy_desc.1$, nuestro/a $getbrainname_hive$ puede extenderse más allá de la red colectiva."
 tech_telepathy_wilderness: "$tech_telepathy$"
 tech_telepathy_wilderness_desc: "$tech_telepathy_desc.1$, nuestro/a $getbrainname_wilderness$ puede extenderse más allá de la red colectiva."
 #tech_transcendent_thought_desc: ""
 tech_precognition_interface: "Interfaz de precognición"
 tech_precognition_interface_desc: "Los avances en el campo psiónico sugieren la posibilidad de crear equipos capaces de leer y analizar los impulsos de los operarios telepáticos antes de que se procesen de forma consciente.\n\n"
 tech_psi_jump_drives: "Motores de salto psi"
 tech_psi_jump_drives_desc: "El motor de salto psi aprovecha las energías psiónicas emitidas por la tripulación para impulsar la nave por el mismo tejido de la realidad, \"saltando\" al instante largas distancias.\n\n"
 #Trade and Diplomacy
 tech_xeno_outreach: "Xenoextensión"
 tech_xeno_outreach_desc: "Las complejidades del comercio interestelar son parecidas a las de cualquier otra transacción, pero su escala eclipsa toda la historia comercial de la mayoría de las civilizaciones previas a la velocidad ultralumínica.\n\n"
 tech_xeno_relations: "Xenorrelaciones"
 tech_xeno_relations_desc: "Las complejidades de la diplomacia estelar requieren formar vínculos con potencias extranjeras para impulsar los objetivos propios.\n\n"
 tech_xeno_supremacy: "Xenosupremacía"
 tech_xeno_supremacy_desc: "Caminamos por un campo de minas de dinámicas de potencias galácticas con un solo propósito: dominar."
 tech_xeno_diplomacy: "Xenodiplomacia"
 tech_xeno_diplomacy_desc: "Avanzar en la comprensión de las interacciones con los xenos (y cómo manipularlos) es un paso necesario en la formación de alianzas interestelares más permanentes.\n\n"
 tech_federation_code: "Código de federación"
 tech_federation_code_desc: "Una federación tiene que ser mucho más que buena fe y una ambición común. Este código sienta las bases de un orden interestelar unificado que asegura la cooperación y la estabilidad entre sus miembros."
 tech_federation_code_effect: "§HDesbloquea diplomacia:§! Formar federación"
 tech_galactic_ambitions: "Expansión estelar"
 tech_galactic_ambitions_desc: "Nuestro futuro está en las estrellas."
 tech_manifest_destiny: "Destino manifiesto"
 tech_manifest_destiny_desc: "Debemos tener el valor de alcanzar nuestro destino y convertirnos en lo que debemos ser.\n\nReduce mucho el coste de exigencias de cesión de planetas y ests. militares."
 tech_interstellar_campaigns: "Campañas interestelares"
 tech_interstellar_campaigns_desc: "Una máquina bien engrasada es clave para ejercer influencia a escala galáctica. Apoyados por el poder de nuestro ejército, podemos hacernos con casi todo lo que queramos."
 tech_galactic_campaigns: "Campañas galácticas"
 tech_galactic_campaigns_desc: "Las mejoras de la administración otorgan una proyección de poder más amplia sobre las estrellas, y la fuerza militar necesaria para imponer nuestras exigencias."
 tech_existential_campaigns: "Campañas existenciales"
 tech_existential_campaigns_desc: "Cuando la propia supervivencia es lo que está en juego, el concepto de la guerra pierde el sentido. Estas campañas no se desarrollan con fines de dominación, sino como forma de garantizar que nuestra civilización siga existiendo."
 tech_existential_campaigns_effect: "§HDesbloquea el casus belli:§! Expulsión existencial"
 #Empire Management
 tech_planetary_government: "Gobierno planetario"
 tech_planetary_government_desc: "Cuando una colonia se ha establecido firmemente y los pioneros se han convertido en ciudadanos, la necesidad de un gobierno local fuerte que proporcione estabilidad supera la necesidad de flexibilidad de la colonia.\n\n"
 tech_planetary_government_machine_intelligence: "Instanciación planetaria"
 tech_planetary_government_desc_machine_intelligence: "Nuestras colonias jamás gozarían de estabilidad operativa sin una infraestructura dedicada a nuestra propia red."
 tech_planetary_government_hive_mind: "Plexo planetario"
 tech_planetary_government_desc_hive_mind: "Nuestras colonias se marchitarían en la nada sin una proyección estable de nuestro lado colectivo. Una presencia sencilla hará prosperar la colmena."
 tech_planetary_unification: "Unificación planetaria"
 tech_planetary_unification_desc: "Antiguas tribus en guerra, naciones históricas en conflicto, ahora unidas en un imperio. No podemos ni debemos caer.\n\n" #We have progressed from warring tribes, from conflicting nations, to a unified Empire, a single will ready to grasp the stars.
 tech_planetary_unification_machine_intelligence: "Estándares de datos uniformes"
 tech_planetary_unification_desc_machine_intelligence: "Las desviaciones no se tolerarán."
 tech_planetary_unification_hive_mind: "Convergencia evolutiva"
 tech_planetary_unification_desc_hive_mind: "El crisol ecológico en el que luchamos por sobrevivir ha grabado surcos recios en nuestra memoria genética. Somos la unión sin par de todo lo que nos precedió."
 tech_planetary_unification_effect: "Concede una pequeña cantidad de $r_unity$"
 tech_adaptive_bureaucracy: "Burocracia adaptativa"
 tech_adaptive_bureaucracy_desc: "Los avances que hacemos piden una nueva forma de administración que nos ayude a conseguir nuestras metas en vez de ponernos trabas.\n\n" #The leaps/progress/discoveries we have made demand a new form of administrative system, one that can be shaped by opportunity rather than limit it.
 tech_adaptive_bureaucracy_machine_intelligence: "CPU positrónicas"
 tech_adaptive_bureaucracy_desc_machine_intelligence: "Las CPU positrónicas son más baratas y más rápidas de producir que los modelos anteriores, lo que nos permite poner en servicio unidades líderes adicionales."
 tech_effective_bureaucracy: "Burocracia efectiva"
 tech_effective_bureaucracy_desc: "Los algoritmos mejorados para procesar y organizar grandes volúmenes de datos han agilizado el proceso de toma de decisiones y de intercambio de información en todo el imperio."
 tech_colonial_bureaucracy: "Burocracia colonial"
 tech_colonial_bureaucracy_desc: "El desarrollo administrativo local nos permite supervisar de cerca los asuntos coloniales sin sobrecargar la toma de decisiones central."
 tech_galactic_bureaucracy: "Burocracia galáctica"
 tech_galactic_bureaucracy_desc: "Solo la información más vital emerge desde los diversos estratos administrativos a los niveles superiores del gobierno."
 tech_colonial_centralization: "Centralización colonial"
 tech_colonial_centralization_desc: "Estructuras sólidas de gobierno creadas caso por caso para satisfacer las necesidades de cada colonia.\n\n"
 tech_galactic_administration: "Administración galáctica"
 tech_galactic_administration_desc: "Las necesidades administrativas de un imperio estelar son numerosas y complejas. Estaremos a la altura."
 tech_living_state: "El estado viviente"
 tech_living_state_desc: "El imperio vive y respira. Puede que nosotros conformemos su cuerpo, pero no le corresponde a la mano izquierda saber lo que hace la derecha.\n\n" #Our Empire is a living thing, all of us vital organs in its future well-being. OR At some point the system took on a purpose of its own.
 tech_autonomous_agents: "Agentes autónomos"
 tech_autonomous_agents_desc: "Las unidades semiindependientes han demostrado ser críticas para el éxito en general."
 tech_collective_self: "El yo colectivo"
 tech_collective_self_desc: "Encontrar aspectos del yo dentro del grupo es natural e inevitable. Tarde o temprano, esos aspectos compartidos pueden ser más valiosos que los entes individuales.\n\n"
 tech_embodied_dynamism: "Dinamismo personificado"
 tech_embodied_dynamism_desc: "La iniciativa y un poco de ambición deben promocionarse entre nuestras unidades líderes autónomas, pero asegurándonos de que no se alejen demasiado de las directrices de la inteligencia central."
 tech_ethical_equations: "Ecuaciones éticas"
 tech_ethical_equations_desc: "Limitar la libertad ajena mientras se preserva la propia requiere acrobacias mentales inusuales. Una hazaña para la que ahora estamos mejor equipados.\n\n" #At some point the decision must be made whether to keep to antiquated values or do what is necessary to prosper in a new future/world.
 tech_neural_implants: "Implantes neurales"
 tech_neural_implants_desc: "El saber solo es el procesamiento de los inputs sensoriales. Se puede cambiar."
 #Free will is nothing more than a sensory illusion.
 tech_global_production_strategy: "Estrategia de producción global"
 tech_global_production_strategy_desc: "Los planetas son enormes y los centros de producción suelen estar separados por grandes distancias. Se necesita una estrategia coherente para asegurarse de que todo el mundo va en la misma dirección."
 tech_hyper_entertainment_forum: "Foro de hiperocio"
 tech_hyper_entertainment_forum_desc: "$building_hyper_entertainment_forum_desc$"
 tech_virtual_combat_arena: "Simulaciones de combate virtual"
 tech_virtual_combat_arena_desc: "La llegada de emuladores de dolor precisos desdibujará por fin la división entre lo virtual y lo real."
 tech_purity_campaigns: "Campañas de pureza"
 tech_purity_campaigns_desc: "Una celebración de la pureza, quizá la espiritual o la corporal o la de intenciones... según lo que tengamos en mente."
 tech_galactic_markets: "Mercados galácticos"
 tech_galactic_markets_desc: "$building_galactic_stock_exchange_desc$"
 tech_symbol_unity: "Símbolos de unidad"
 tech_symbol_unity_desc: "A medida que exploramos la galaxia y sus maravillas, cada vez es más importante reafirmar nuestras creencias y unificar a nuestra gente bajo un único símbolo."
 tech_visitor_center: "Centros de visitantes alienígenas"
 tech_visitor_center_desc: "Ahora que sabemos que no estamos solos en el espacio, deberíamos hacer los preparativos para recibir a nuestros nuevos amigos."
 tech_subdermal_stimulation: "Estimulación subcutánea"
 tech_subdermal_stimulation_desc: "Los implantes profundos de los tejidos son la última innovación en la revolucionaria superposición de ingeniería sensorial y experiencias de ocio. \"¡Adonde vamos, no necesitaremos piel para sentir!\""
 tech_paradise_dome: "Arquitectura idílica"
 tech_paradise_dome_desc: "Construiremos las casas del futuro con los últimos avances en arquitectura, paisajismo y tecnología holográfica."
 #Social Engineering
 tech_artificial_moral_codes: "Códigos de moral artificial"
 tech_artificial_moral_codes_desc: "Son las circunstancias lo que dictan lo que es moral. Define las circunstancias y la ética será como arcilla en tus manos."
 #The opinion of the group shape the actions/decisions of the individual.
 tech_synthetic_thought_patterns: "Patrones de pensamiento sintético"
 tech_synthetic_thought_patterns_desc: "Pensar fuera de los encorsetamientos solo te pone en un corsé más grande."
 #There is really no such thing as thinking outside the box OR Thinking outside the box is merely thinking inside another, bigger, box.
 edict_will_to_power: "Ambición: voluntad de poder"
 edict_will_to_power_desc: "Como el poder es imponer tu voluntad a los demás, la voluntad de poder es una profecía que se cumple por sí misma."
 #Seeking control over ones environment is inherent in all beings. We have simply mastered it/we are simply the most effective.
 tech_unity_of_purpose: "Unidad de propósito"
 tech_unity_of_purpose_desc: "El propósito de uno es el propósito de todos. Juntos somos más grandes que la suma de nuestras partes."
 tech_collective_production_methods: "Métodos de producción colectiva"
 tech_collective_production_methods_desc: "Juntos, construimos el futuro."
 tech_resource_processing_algorithms: "Algoritmos de procesamiento de recursos"
 tech_resource_processing_algorithms_desc: "Eficiencia en todas las cosas."
 #Other
 tech_xeno_integration: "Xenointegración"
 tech_xeno_integration_desc: "A partir de componentes dispares construimos algo más grande que la suma de sus partes.\n\n"
 #A whole that is/can be greater than the sum of its parts.
 #Unity
 tech_cultural_heritage: "Historia sociocultural"
 tech_cultural_heritage_desc: "Se necesita comprender un pasado compartido para realizar avances significativos en el futuro."
 tech_heritage_site: "Sitios del pasado"
 tech_heritage_site_desc: "Los recuerdos físicos de lo lejos que hemos llegado inculcan respeto por logros pasados y alimentan ambiciones para el futuro."
 tech_heritage_site_corporate: "Gestión de consideración"
 tech_heritage_site_desc_corporate: "La invención de la consideración subconsciente ha mejorado la eficacia en nuestros departamentos de marketing y ventas. Si aplicamos estos métodos a los departamentos de gestión de recursos inteligentes, conseguiremos un nuevo paradigma en gestión corporativa."
 tech_heritage_site_machine_intelligence: "Comunicaciones planetarias"
 tech_heritage_site_desc_machine_intelligence: "La transferencia prácticamente instantánea de información e instrucciones entre unidades es de suma importancia."
 tech_hypercomms_forum: "Hipercomunicación local"
 tech_hypercomms_forum_desc: "No todas las investigaciones de canales ultralumínicos producen resultados útiles, pero algunas pueden servir para unir a nuestra gente."
 tech_hypercomms_forum_corporate: "Creación de sinergia posrelativista"
 tech_hypercomms_forum_desc_corporate: "Atrás quedaron los días en los que solo podíamos conseguir sinergia corporativa a una velocidad sublumínica. Ahora estamos en una época en la que la economía es más rápida que la velocidad de la luz, y nuestra cultura corporativa debe adaptarse para superar sus limitaciones relativistas desfasadas."
 tech_autocurating_vault: "Algoritmos custodios automáticos"
 tech_autocurating_vault_desc: "Un análisis continuo y asíncrono de datos dispares permite modelar de manera precisa fluctuaciones antaño impredecibles de las corrientes sociales."
 tech_autocurating_vault_corporate: "Cámara de adquisiciones"
 tech_autocurating_vault_desc_corporate: "Una cámara enorme de exhibición pública de las diversas adquisiciones gloriosas de nuestra corporación permitirá que los empleados se inspiren en las buenas adquisiciones y tomen nota de lo que ocurre cuando las empresas adquiridas no consiguen encajar en nuestra amplia estrategia empresarial."
 tech_autocurating_vault_machine_intelligence: "Concentrador alfa"
 tech_autocurating_vault_desc_machine_intelligence: "Todas las rutas informativas llevan al núcleo, donde la inteligencia artificial principal puede analizar e interpretar los datos a su antojo."
 tech_holographic_rituals: "Rituales holográficos"
 tech_holographic_rituals_desc: "Ver es creer, y las creencias generan realidades."
 tech_consecration_fields: "Campos de consagración"
 tech_consecration_fields_desc: "Gracias a nuestros conocimientos sobre manipulación de campos y física, todo el mundo podrá ver y sentir nuestros lugares sagrados."
 tech_transcendent_faith: "Fe metacognitiva"
 tech_transcendent_faith_desc: "Salir de nuestra cuna planetaria nos facilitó llegar a un nuevo entendimiento de la fe y su sitio en un contexto más amplio."
 tech_alien_sanctuary: "Adaptación xeno"
 tech_alien_sanctuary_desc: "La introducción de centros de adaptación avanzados garantiza que cualquier recién llegado a nuestro imperio esté bien equipado para dirigir a su sociedad adoptiva, preservando sus puntos fuertes de origen."
 ####################################
 #Society - Weapons
 ####################################
 tech_amoeba_strike_craft_1: "Flagelos como arma"
 tech_amoeba_strike_craft_1_desc: "Al alterar el proceso de reproducción de las amebas espaciales, podemos programar sus flagelos simbióticos para que ejerzan de cazas en nuestra armada."
 tech_swarm_strike_craft_1: "Criaderos de enjambres"
 tech_swarm_strike_craft_1_desc: "Recoger especímenes de prethoryn derrotados nos permite clonarlos y programarlos genéticamente para nuestro ejército.\n\n"
 tech_scourge_missile_1: "Misiles azote"
 tech_scourge_missile_1_desc: "Al analizar el armamento biológico empleado por el Enjambre podemos crear misiles con la misma capacidad de destrucción atroz.\n\n"
 tech_space_whale_weapon_1: "Ajuste de frecuencia"
 tech_space_whale_weapon_1_desc: "Al adaptar el método tiyanki de extracción de energía de la materia gaseosa, podemos construir armas que absorban energía de las naves enemigas.\n\n"
 ####################################
 #Repeatable techs
 ####################################
 #Engineering
 tech_repeatable_improved_tile_mineral_output: "Pautas de extracción"
 tech_repeatable_improved_tile_mineral_output_desc: "Al cambiar cómo se evalúan los depósitos de minerales entre sí, las perforaciones son más eficientes.\n\n"
 tech_repeatable_improved_military_station_damage: "Pautas de disparo sincronizado"
 tech_repeatable_improved_military_station_damage_desc: "Vincular los sistemas de armas para disparar andanadas escalonadas mejora con el paso del tiempo el daño infligido por las estaciones militares.\n\n"
 tech_repeatable_improved_military_station_health: "Estratos de núcleos fortificados"
 tech_repeatable_improved_military_station_health_desc: "Las capas de blindaje adicional dentro de la propia estructura mejoran la resistencia de las estaciones militares.\n\n"
 tech_repeatable_improved_ship_health: "Integridad del casco"
 tech_repeatable_improved_ship_health_desc: "Aumentar la compartimentación de los espacios de las naves les permite soportar más daño antes de que la integridad del casco llegue a niveles demasiado bajos.\n\n"
 tech_repeatable_improved_armor_output: "Compresión de la materia"
 tech_repeatable_improved_armor_output_desc: "Prensar materiales adecuados en formas ultradensas es una forma barata y eficaz de mejorar su habilidad para absorber los disparos de las armas.\n\n"
 tech_repeatable_weapon_type_explosive_damage: "Control de rendimiento termodinámico"
 tech_repeatable_weapon_type_explosive_damage_desc: "Unos microprocesadores en el misil controlan la reacción química de las detonaciones de las ojivas para maximizar el efecto en el momento del impacto según las condiciones locales.\n\n"
 tech_repeatable_weapon_type_explosive_fire_rate: "Preespoletas miniaturizadas"
 tech_repeatable_weapon_type_explosive_fire_rate_desc: "Los avances en miniaturización permiten cargar y disparar misiles más deprisa.\n\n"
 tech_repeatable_weapon_type_kinetic_damage: "Munición de gran densidad"
 tech_repeatable_weapon_type_kinetic_damage_desc: "Los proyectiles ultradensos pueden atravesar incluso fuertes escudos de energía.\n\n"
 tech_repeatable_weapon_type_kinetic_fire_rate: "Eficiencia de cargadores"
 tech_repeatable_weapon_type_kinetic_fire_rate_desc: "Los avances técnicos menores se combinan con rutinas de nave mejoradas de gestión de munición para aumentar significativamente la cadencia de fuego.\n\n"
 #Physics
 tech_repeatable_improved_tile_energy_output: "Superconductividad aplicada"
 tech_repeatable_improved_tile_energy_output_desc: "Las mejoras menores en la eficacia de transmisión se suman para reducir considerablemente la pérdida general de energía.\n\n"
 tech_repeatable_improved_shield_output: "Armónicos de escudos"
 tech_repeatable_improved_shield_output_desc: "El funcionamiento básico de los escudos de las naves es complejo, pero puede ajustarse y mejorarse de diversos modos.\n\n"
 tech_repeatable_weapon_type_energy_damage: "Concentradores"
 tech_repeatable_weapon_type_energy_damage_desc: "Perfeccionar la cadencia de fuego de las armas láser es una tarea que podría mantener ocupados a los ingenieros de élite de cualquier planeta durante siglos.\n\n"
 tech_repeatable_weapon_type_energy_fire_rate: "Refrigerante superveloz"
 tech_repeatable_weapon_type_energy_fire_rate_desc: "Continuamente aparecen novedades en la tecnología de enfriamiento, que mejora la estabilidad y eficacia de nuestros sistemas de armas e impide que estallen en las naves que los llevan.\n\n"
 tech_repeatable_weapon_type_strike_craft_fire_damage: "Interceptores de sinapsis"
 tech_repeatable_weapon_type_strike_craft_fire_damage_desc: "Aumentar la velocidad a la que los pilotos de los cazas procesan y actúan sobre los datos de posición del enemigo otorga considerables ventajas de combate.\n\n"
 tech_repeatable_weapon_type_strike_craft_fire_rate: "Entrenamiento de piloto iterativo"
 tech_repeatable_weapon_type_strike_craft_fire_rate_desc: "Al recopilar y analizar los datos de rendimiento de los pilotos que nos precedieron, hemos mejorado exponencialmente nuestros métodos de entrenamiento para pilotos. Cada uno será más rápido que el anterior."
 tech_repeatable_improved_planet_sensor_range: "Potenciadores de señales planetarias"
 tech_repeatable_improved_planet_sensor_range_desc: "A medida que nuestras flotas se aventuran más lejos de nuestro hogar, nuestra tecnología de sensores supera cada vez más sus límites.\n\n"
 tech_repeatable_reduced_building_cost: "Análisis gravitacional"
 tech_repeatable_reduced_building_cost_desc: "Los paradigmas de cálculo cada vez más potentes nos permiten adaptar proyectos de construcción individuales a condiciones planetarias y gravitatorias ultra locales.\n\n" #by adapting each construction-project to local gravitational conditions we can save on materials used
 tech_repeatable_reduced_building_time: "Algoritmos de montaje"
 tech_repeatable_reduced_building_time_desc: "La aplicación de la teoría del puzle y el juego podría optimizar en gran medida el ensamblado modular y la construcción.\n\n" #through the use of advanced puzzle-logic we can make sure each building is assembled in the optimal order and pattern
 #Society:
 tech_repeatable_improved_tile_food_output: "Cosechas transgénicas"
 tech_repeatable_improved_tile_food_output_desc: "Las cosechas transgénicas ofrecen los elementos nutritivos de varios tipos de cultivo en uno solo.\n\n"
 tech_repeatable_improved_sector_cap: "Protocolos de comunicación"
 tech_repeatable_improved_sector_cap_desc: "Los canales de comunicación UL mejorados ofrecen una dirección administrativa más coherente.\n\n"
 tech_repeatable_improved_core_system_cap: "Eficiencia administrativa"
 tech_repeatable_improved_core_system_cap_desc: "Reestructurar la red de gestión que vincula los mundos principales con la capital puede ayudar a aliviar el estrés administrativo y los cuellos de botella de información propios de un imperio incipiente.\n\n"
 tech_repeatable_improved_leader_cap: "Gestión de recursos consciente"
 tech_repeatable_improved_leader_cap_desc: "El concepto de gestionar a los individuos como recursos en los grandes sistemas de producción debe, por necesidad, hacerse más flexible a medida que se multiplican las naturalezas potenciales de los individuos gestionados.\n\n"
 tech_repeatable_reduced_leader_cost: "Adquisición de talentos"
 tech_repeatable_reduced_leader_cost_desc: "La propaganda y la manipulación sutil de los libros de contabilidad hacen bajar el coste de fichar a líderes de máximo nivel."
 tech_repeatable_reduced_leader_cost_machine_intelligence: "Salvaguardas de personalidad"
 tech_repeatable_reduced_leader_cost_desc_machine_intelligence: "Una matriz de personalidad recién cargada siempre corre el riesgo de volverse loca o de caer en obsesiones poco productivas, lo que provoca unas redacciones de código caras y lentas. Cuanto mejores son las salvaguardas, menor es el riesgo."
 tech_repeatable_improved_edict_length: "Retransmisiones de proclamación"
 tech_repeatable_improved_edict_length_desc: "Campañas de información más agresivas mejoran la receptividad de la población a los edictos.\n\n"
 tech_repeatable_improved_army_damage: "Condicionamiento agresivo"
 tech_repeatable_improved_army_damage_desc: "Repetir el régimen de condicionamiento estándar de las tropas terrestres ha demostrado hacerlas más efectivas en el combate directo.\n\n"
 tech_repeatable_improved_army_health: "Depresores nerviosos"
 tech_repeatable_improved_army_health_desc: "Al ajustar con cuidado los receptores de dolor, los soldados pueden seguir luchando a pesar de recibir heridas debilitantes.\n\n"
 tech_repeatable_improved_leader_life_span: "Revitalización celular"
 tech_repeatable_improved_leader_life_span_desc: "Los tratamientos periódicos de revitalización de células mantienen a los líderes ágiles y activos más allá de su tradicional vida útil.\n\n"
 tech_repeatable_improved_starbase_capacity: "Expansión interestelar"
 tech_repeatable_improved_starbase_capacity_desc: "Se pueden seguir desarrollando las inmensas redes de apoyo logístico necesarias para mantener una base estelar mejorada y así podríamos tener más de ellas."
 tech_repeatable_improved_slave_mineral_output: "Dieta estimulante"
 tech_repeatable_improved_slave_mineral_output_desc: "Optimizar químicamente las dietas de los trabajadores forzosos les permite rendir más de lo esperado."
 tech_repeatable_naval_cap: "Procesos de gestión de flotas"
 tech_repeatable_naval_cap_desc: "Los procesos de gestión de flotas mejorados liberarán recursos para mantener una flota más grande."
 tech_repeatable_command_limit: "Personal de apoyo al almirantazgo"
 tech_repeatable_command_limit_desc: "Mejorar el personal de apoyo disponible para nuestros comandantes aumentará la cantidad de naves que pueden liderar en una sola flota."
