 #Ship sizes
 tech_space_exploration: "Exploración espacial"
 tech_space_exploration_desc: "El viaje más rápido que la velocidad de la luz es un nuevo amanecer para la exploración espacial. Las misiones tripuladas a otros sistemas estelares ahora no son solo posibles, sino necesarias."
 tech_corvettes: "Corbetas"
 tech_corvettes_desc: "El descubrimiento del viaje UL permitió aplicar los armazones tradicionales de las lanzaderas superficie-espacio a fines militares y por fin crear naves pequeñas, rápidas y maniobrables con potencia de fuego limitada."
 tech_destroyers: "Destructores"
 tech_destroyers_desc: "Si bien son más grandes que las corbetas, las configuraciones de casco de los destructores siguen siendo ágiles en comparación."
 tech_cruisers: "Cruceros"
 tech_cruisers_desc: "Originalmente concebidos como una configuración de casco experimental para naves colonia de nueva generación. Los amplios dispositivos de anclaje del diseño lo hacen ideal para la instalación de armas pesadas."
 tech_battleships: "Acorazados"
 tech_battleships_desc: "Las más grandes de las naves militares estándar. Suelen contar con un pesado blindaje y varias baterías de cañones."
 tech_titans: "Titanes"
 tech_titans_desc: "Diseñar naves a esta escala permite una combinación letal de potencia de fuego y apoyo auxiliar de vanguardia. Las configuraciones Titán pueden servir como naves insignia muy versátiles, capaces también de reforzar las naves circundantes o de atrapar a los hostiles."
 tech_colossus: "Colosos"
 tech_colossus_desc: "Los avances en megaingeniería, que han dado lugar a las naves militares de tipo Coloso, difuminan las líneas entre la realidad y la fantasía. Estas inmensas plataformas con una única arma son capaces de alterar radicalmente o destruir mundos enteros con solo pulsar un botón."
 #Ships upgrades
 tech_corvette_hull_1: "Cascos de corbeta mejorados"
 tech_corvette_hull_1_desc: "Los avances en las técnicas de construcción nos permitirán construir corbetas más sólidas y resistentes."
 tech_corvette_hull_2: "Cascos de corbeta avanzados"
 tech_corvette_hull_2_desc: "La última generación de cascos de corbeta incorpora mamparas mejoradas y campos de integridad estructural optimizados."
 tech_corvette_build_speed: "Patrones de corbeta estandarizados"
 tech_corvette_build_speed_desc: "Establecer nuevos estándares para el diseño y construcción de las corbetas mejora mucho la eficiencia de su producción."
