 mineral_planet_chain_title: "Cibles de grande valeur"
 mineral_planet_chain_desc: "Grâce aux techniques dérivées des systèmes d'évaluation des anciens drones miniers, nous avons identifié quelques corps célestes probablement très riches en minéraux."
 systems_visited: "Gisements explorés"
 mineral_planet_poi_title: "Richesses minérales"
 mineral_planet_poi_desc: "Grâce aux techniques dérivées des systèmes d'évaluation des anciens drones miniers, nous avons identifié quelques systèmes stellaires qui abritent probablement des planètes très riches en minéraux."
 cloud_chain_title: "Nuages dérivants"
 cloud_chain_desc: "L'intrication quantique des Nuages spatiaux les rend tous indissociables les uns des autres ; les énergies qui animent chacun des spécimens ne sont peut-être que des répliques d'une même entité sous-jacente.\n\nL'étude approfondie d'un Nuage spatial nous a permis de localiser un certain nombre de systèmes susceptibles d'abriter d'autres Nuages."
 clouds_watched: "Nuages observés"
 cloud_poi_title: "Système de Nuages spatiaux"
 cloud_poi_desc: "L'intrication quantique montre que ce système abrite un Nuage spatial."
 ### Anomalies
 find_sol_chain_title: "Coordonnées solaires"
 find_sol_chain_desc: "Un objet alien révèle les coordonnées d'un système particulier."
 sol_1_poi: "Le soleil"
 sol_1_desc_neutral: "Nous ignorons qui a envoyé cet objet dans l'espace, mais il semble originaire d'ici. Mieux vaut essayer d'en savoir plus."
 found: "Système alien découvert"
 old_gods_shrine_poi_1: "Premier autel potentiel"
 old_gods_shrine_poi_1_desc: "Les relevés radiométriques indiquent la présence probable d'un objet semblable à l'autel dédié à l'Indicible en orbite autour de cette étoile."
 old_gods_shrine_poi_2: "Deuxième autel potentiel"
 old_gods_shrine_poi_2_desc: "Les relevés radiométriques indiquent la présence probable d'un autre objet semblable à l'autel dédié à l'Indicible en orbite autour de cette étoile."
 old_gods_shrine_poi_3: "Troisième autel potentiel"
 old_gods_shrine_poi_3_desc: "Les relevés radiométriques indiquent la présence probable d'un troisième objet semblable à l'autel dédié à l'Indicible en orbite autour de cette étoile."
 shrine_object: "Autel stellaire"
 shrine_object_tooltip: "Autel dédié à l'une des anciennes divinités de notre peuple, perdu dans l'espace."
 shrine_object_desc: "Autel dédié à l'une des anciennes divinités de notre peuple, perdu dans l'espace."
 old_gods_chain_title: "Autels dédiés aux Divinités anciennes"
 old_gods_chain_desc: "Après la découverte du mystérieux astéroïde-autel dédié à l'Indicible, des scientifiques de renom se sont dit qu'il y avait peut-être d'autres autels de notre panthéon (ou du moins du panthéon que nous pensions être les seuls à vénérer) dans les systèmes voisins."
 shrines_searched: "Autels recherchés"
 ransomeer_chain_title: "Les Rançonneux"
 ransomeer_chain_desc: "Une bande de pirates, qui se fait appeler « les Rançonneux », a enlevé l'équipage d'un vaisseau de transport privé de la [Root.GetName].\n\nNous sommes bien décidés à libérer les captifs avant que les pirates aient le temps de réclamer une rançon."
 captive_crew_rescued: "Équipage enlevé sauvé"
 ransomeer_poi_title: "Base des Rançonneux"
 ransomeer_poi_desc: "Les Rançonneux sont établis sur une station minière alien abandonnée."
 wrecked_fleet_chain_title: "Champ de bataille à la dérive"
 wrecked_fleet_chain_desc: "Il y a plusieurs milliers d'années, un acte de trahison a poussé des vaisseaux alliés à se retourner les uns contre les autres. Quelques frappes précises sur les systèmes critiques et sur les points faibles des coques ont suffi à balayer les équipages anciennement alliés, tout en préservant probablement les coques dépressurisées des vaisseaux.\n\nNous avons glané suffisamment d'informations pour modéliser ce cimetière de vaisseaux qui dérive lentement à travers le cosmos."
 wrecked_fleet_poi_title: "Position projetée"
 wrecked_fleet_poi_desc: "Nous avons calculé la position actuelle du champ de bataille à la dérive et pensons qu'il se trouve quelque part dans le système indiqué. Nous devrions aller sur place pour en avoir le coeur net."
 battlefield_located: "Champ de bataille fouillé"
 ### Starting Event - Wanderlust
 rogue_scientist_1_chain_title: "Soif de nouveaux horizons : scientifique rebelle"
 rogue_scientist_1_chain_desc: "Le président du Conseil des sciences abstraites du [Root.GetName] s'est volatilisé avec un prototype de vaisseau scientifique.\n\nLes coordonnées actuelles du vaisseau ont été réduites à trois possibilités. Nous allons donc procéder par élimination."
 likely_locations_searched: "Positions possibles vérifiées"
 rogue_scientist_2_chain_title: "Soif de nouveaux horizons : poursuite"
 rogue_scientist_2_chain_desc: "Le président s'est à nouveau volatilisé, mais cette fois, nous avons retrouvé sa trace."
 scientist_pursued: "Scientifique poursuivi"
 rogue_scientist_3_chain_title: "Soif de nouveaux horizons : confrontation"
 rogue_scientist_3_chain_desc: "Quelles que soient ses motivations, le président doit être ramené à [Root.Capital.GetName].\n\nReste à savoir s'il rédigera une thèse révolutionnaire ou s'il fera simplement l'objet d'une sanction disciplinaire."
 scientist_apprehended: "Scientifique appréhendé"
 scientist_poi_1: "Dernière situation connue"
 scientist_poi_1_desc: "La dernière situation connue du vaisseau scientifique du président, en dehors des limites du système [Root.Capital.GetStarName]."
 scientist_poi_2: "Dernière destination connue"
 scientist_poi_2_desc: "Destination du président, d'après le dernier message qu'il a envoyé à [Root.Capital.GetName]."
 scientist_poi_3: "Sortie PRL projetée"
 scientist_poi_3_desc: "Le hasard faisant bien les choses, un ensemble de capteurs longue distance de [Root.Capital.GetName] a détecté de faibles signatures énergétiques qui pourraient bien être celles d'un vaisseau voyageant à une vitesse supra-luminique.\n\nLa trajectoire ne correspond à aucune trajectoire de vol connue, ce qui permet de suspecter qu'il s'agit de celle du président."
 scientist_poi_4: "La chasse continue"
 scientist_poi_4_desc: "Après avoir déchiffré les signatures énergétiques du prototype de vaisseau scientifique et effectué quelques calculs complexes, nous savons maintenant vers quel système le président s'est enfui."
 scientist_poi_5: "La Fenêtre"
 scientist_poi_5_desc: "Le président semble sur le point d'atteindre sa destination finale."
 ### Starting Event - Mass Extinction
 mass_extinction_chain_title: "Extinctions de masse à travers les âges"
 mass_extinction_chain_desc: "Pour éviter une éventuelle apocalypse sur [Root.Capital.GetName], nous devrions étudier les conséquences produites par les catastrophes majeures ayant frappé d'autres planètes."
 massex_analyzed: "Extinctions de masse étudiées "
 massex_poi_1: "Une planète détruite"
 massex_poi_1_desc: "Seule preuve d'un cataclysme majeur, une ceinture d'astéroïdes tourne autour d'une étoile."
 massex_poi_2: "Une planète brûlée"
 massex_poi_2_desc: "Des feux dignes de l'enfer ne cessent de ravager cette planète."
 massex_poi_3: "Une planète désolée"
 massex_poi_3_desc: "Cette planète est totalement stérile, alors même que toutes les conditions sont réunies pour que la vie s'y développe."
 massex_poi_4: "Une planète toxique"
 massex_poi_4_desc: "Il semble que les gaz toxiques qui saturent aujourd'hui l'atmosphère de cette planète sont apparus assez récemment et de façon soudaine."
 massex_poi_5: "Une planète glaciale"
 massex_poi_5_desc: "Les enregistrements astronomiques indiquent que cette planète n'a pas toujours été un désert de glace."
 ####################################
 #Uplift Events
 ####################################
 UPLIFT_SNAKEOID_CAT: "Glissement"
 UPLIFT_SNAKEOID_CAT_DESC: "Quelque chose bouge sous le sable de [Root.GetName]..."
 UPLIFT_GENERIC_CAT: "Relation vaguement apparentée"
 UPLIFT_GENERIC_CAT_DESC: "Quelque chose bouge sur [Root.GetName]..."
 UPLIFT_OCEAN_CAT: "La vie aquatique"
 UPLIFT_OCEAN_CAT_DESC: "Des signes incontestables de vie sont visibles dans les mers de [Root.GetName] et à proximité."
 UPLIFT_ARID_CAT: "Traces de vie"
 UPLIFT_ARID_CAT_DESC: "Des traces d'activité biologique sont nettement visibles à la surface de [Root.GetName], même avec des systèmes optiques de base."
 UPLIFT_CONTINENTAL_CAT: "Entre terre et mer"
 UPLIFT_CONTINENTAL_CAT_DESC: "Apparemment, la vie s'est développée sur cette planète partagée entre deux milieux extrêmes : des sols rocailleux et des mers liquides."
 UPLIFT_TROPICAL_CAT: "Humidité relative"
 UPLIFT_TROPICAL_CAT_DESC: "Les conditions qui règnent sur [Root.GetName] sont propices au développement de la vie microbienne - et peut-être même plus."
 UPLIFT_TUNDRA_CAT: "Biologie cryostatique"
 UPLIFT_TUNDRA_CAT_DESC: "[Root.GetName] est une planète glacée sur laquelle les instruments optiques ne détectent rien, mais les signatures thermiques révèlent une activité sous la surface."
 UPLIFT_ARCTIC_CAT: "Sur la glace épaisse"
 UPLIFT_ARCTIC_CAT_DESC: "Quelque part sous les tempêtes de glace et au-dessus du permafrost de [Root.GetName], il y a du mouvement."
 UPLIFT_DESERT_CAT: "Sable tourbillonnant"
 UPLIFT_DESERT_CAT_DESC: "Avec sa surface recouverte de particules de silicate, [Root.GetName] ne semble guère propice à la vie. Et pourtant..."
 UPLIFT_ROACHOID_CAT: "Rampants en surface"
 UPLIFT_ROACHOID_CAT_DESC: "Des troupeaux d'arthropodes se déplacent avec aisance à la surface désolée de [Root.GetName]."
 ####################################
 #Anomaly Failure & Critical Failure Events
 ####################################
 #ROOT = SHIP SCOPE
 #FROM.FROM = PLANET SCOPE (if triggered from anomaly category)
 anomaly_failure.2500.desc: "Au terme d'une inspection plus poussée, l'astéroïde [From.From.GetName] s'est révélé silencieux. L'un des assistants de [Root.GetLeaderName] a fini par admettre qu'il avait peut-être mal lu les instruments."
 anomaly_failure.2501.desc: "Le [Root.GetName] a prudemment traversé le champ de débris qui entoure [From.From.GetName]. Mais à l'arrivée de [Root.GetLeaderName] et de son équipage, il n'y avait plus aucune trace de ce qu'avait repéré les capteurs."
 anomaly_failure.2502.desc: "Les sondes du [Root.GetName] ont balayé plusieurs fois la surface de [From.From.GetName], en vain. L'officier scientifique [Root.GetLeaderName] a fini par présenter ses excuses, honteux d'avoir ainsi fait perdre du temps et des ressources à tout le monde."
 anomaly_failure.2503.desc: "Ce qui avait été pris depuis l'espace pour d'impressionnantes structures s'est révélé très décevant. Le [Root.GetName] est resté quelque temps en orbite de [From.GetName] pour en étudier les schémas météorologiques, après quoi l'officier scientifique [Root.GetLeaderName] a pu confirmer que ces structures planétaires sont dues à des facteurs météorologiques ordinaires, et non pas à l'intervention d'une forme de vie intelligente."
 anomaly_failure.2504.desc: "Avant que l'équipage du [Root.GetName] ait le temps de procéder à une triangulation efficace du signal de détresse détecté à la surface surchauffée de [From.From.GetName], celui-ci avait disparu. Faute de pouvoir se concentrer sur un point géographique précis, l'officier scientifique [Root.GetLeaderName] a jugé qu'il était trop dangereux de lancer une opération de sauvetage."
 anomaly_failure.2535.desc: "L'officier scientifique du [Root.GetName], [Root.GetLeaderName], considère que les structures découvertes à la surface de [From.From.GetName] n'ont aucun intérêt et que son équipage serait mieux employé ailleurs."
 anomaly_failure.2540.desc: "L'équipage du [Root.GetName] indique que l'astéroïde, sculpté en forme d'un temple quelconque, est vraiment magnifique.\n\nRien d'autre."
 anomaly_failure.2545.desc: "Selon [Root.GetLeaderName] et l'équipage du [Root.GetName], les sons particuliers émis par [From.From.GetName] viennent des chants aliens qu'entonnent à l'unisson la faune et la flore de la planète.\n\nIls n'ont pas jugé approprié d'approfondir leurs recherches."
 anomaly_failure.2550.desc: "Le [Root.GetName] n'a prélevé aucun échantillon intéressant sur la géante de glaces [From.From.GetName]."
 anomaly_failure.2555.desc: "La sonde d'exploration du [Root.GetName] a découvert un engin alien de fortune. Malheureusement, en tentant de l'activer, l'officier scientifique [Root.GetLeaderName] a déclenché sa destruction."
 anomaly_failure.2560.desc: "L'officier scientifique [Root.GetLeaderName] a rédigé un rapport dans lequel il se montre très critique envers l'ordre reçu d'étudier [From.From.GetName], où rien d'intéressant n'a été découvert."
 anomaly_failure.2600.desc: "Le [Root.GetName] était en orbite de [From.GetName] depuis quelque temps, afin de surveiller les émissions de radiations, lorsque l'officier scientifique [Root.GetName] a décidé d'enfiler une combinaison spatiale pour se rendre sur l'astéroïde et y prélever quelques échantillons de minéraux.\n\nAlors qu'il venait de se poser à sa surface, l'intensité des émissions radio de [From.From.GetName] a brusquement augmenté. [Root.GetLeaderName] est mort en quelques minutes, brûlé vif par les micro-ondes."
 anomaly_failure.2601.desc: "Nous avons perdu la trace du [Root.GetName] peu après son entrée dans le champ de débris qui entoure [From.From.GetName].\n\nQuelques jours plus tard, nous avons récupéré une capsule de sauvetage à la lisière de ce champ ; l'officier scientifique [Root.GetName] a survécu, mais ignore ce que le [Root.GetName] ou son équipage sont devenus."
 anomaly_failure.2602.desc: "Les sondages à l'emporte-pièce de [From.GetName] qu'a fait réaliser l'officier scientifique [Root.GetLeaderName] ont mis en colère deux gros §Ytiyanki§! orbitant autour de la planète. Ces créatures constituent une grave menace pour le [Root.GetName]."
 anomaly_failure.2603.desc: "Ces curieuses formations découvertes sur [From.From.GetName] n'étaient en fait qu'un piège. Avant même d'avoir pu se poser, le [Root.GetName] a été attaqué par d'anciens drones de combat."
 anomaly_failure.2604.desc: "Le [Root.GetName] s'est retrouvé pris dans une soudaine éruption de magma qui a jailli de [From.From.GetName] alors que le vaisseau survolait sa surface pour tenter de localiser le signal de détresse.\n\nIl n'y a aucun survivant."
 anomaly_failure.2635.desc: "Selon les rapports parvenus du [Root.GetName], le seul intérêt de [From.From.GetName] était autrefois une sorte de parc dédié à la détente et à l'amusement. Nous ne savons toutefois pas de quelle époque il date exactement, ni même pourquoi il a été établi là.\n\nLes membres de l'équipage du [Root.GetName] ont aussi rapporté, avec beaucoup de tristesse, que l'officier scientifique [Root.GetLeaderName] est décédé, écrasé par une structure qui s'est renversée et qu'ils ont identifiée de façon assez vague comme « la grande roue »."
 anomaly_failure.2640.desc: "L'officier scientifique [Root.GetLeaderName] nous assure avec obstination que l'équipage du [Root.GetName] n'a rien trouvé dans la structure excavée et sculptée de l'astéroïde [From.From.GetName].\n\nMais quelque chose a changé chez lui..."
 anomaly_failure.2645.desc: "Dans son dernier message, l'équipage du [Root.GetName] a signalé un pic d'activité sonore à l'approche de [From.From.GetName]. Peu après, les communications ont été coupées et le vaisseau a disparu. Les membres d'équipage sont probablement morts."
 anomaly_failure.2650.desc: "Pour tenter de prélever un maximum d'échantillons, l'officier scientifique [Root.GetLeaderName] a laissé le [Root.GetName] descendre sous l'altitude de sécurité. Malheureusement, de dangereux fluides atmosphériques se sont infiltrés dans les propulseurs arrière et le vaisseau s'est écrasé.\n\nIl n'y a aucun survivant."
 anomaly_failure.2655.desc: "Alors que le [Root.GetName] s'approchait de [From.From.GetName], des vaisseaux de contrebande hostiles l'ont intercepté. Ceux-ci ont braqué leurs armes sur l'astéroïde, détruisant toutes les preuves liées aux activités qu'ils menaient sur place. Et le [Root.GetName] semble être leur prochaine cible."
 anomaly_failure.2660.desc: "D'après l'équipage du [Root.GetName], l'officier scientifique [Root.GetLeaderName] s'intéressait de près aux pluies qui arrosent §Y[From.From.GetName]§!. Selon ses propres termes, celles-ci seraient « vaguement pourpres ».\n\nHélas, les échantillons de précipitations prélevés se sont avérés extrêmement volatiles et, lorsqu'ils ont été ouverts dans le laboratoire du [Root.GetName], le liquide s'est violemment enflammé, tuant instantanément [Root.GetLeaderName]."
 anomaly_failure.2665.desc: "Dans son dernier message, l'équipage du [Root.GetName] a signalé un pic d'activité sur [From.From.GetName] alors qu'il s'en approchait. Peu après, les communications ont été coupées et le vaisseau a disparu. Les membres de l'équipage n'ont pas donné signe de vie par la suite, et sont très certainement morts."
 anomaly_failure.2670.desc: "Les travaux enthousiastes de l'équipage du [Root.GetName] sur les systèmes de l'ancienne station orbitale de §Y[From.From.GetName]§! ont connu un... raté.\n\nAvant que ses anciens circuits ne fondent, l'équipage est parvenu à rallumer les propulseurs positionnels de la station orbitale. Elle a alors aussitôt quitté son orbite pour se diriger vers le puits gravitationnel de l'étoile. L'issue malheureuse de la mission a grandement affecté [Root.GetLeaderName], qui a malgré tout beaucoup appris de cette expérience."
 anomaly_failure.2670.a: "[Root.GetLeaderName]... l'a propulsée vers le soleil ?"
 anomaly_failure.2670.a.tooltip: "L'§Yusine ancienne§! est détruite.\n"
 ####################################
 #Colony Events
 ####################################
 ### Old Civ Drones
 colony.1500.name: "Un prélude"
 colony.1500.desc: "Quelque chose bouge sur la lune de [Root.GetName].\n\nÀ première vue, une technologie ancienne s'est réveillée, peut-être en réaction à nos tentatives de colonisation.\n\nPlusieurs de nos meilleurs scientifiques, impatients d'en savoir plus sur cette lune, ont lancé un projet de recherche spécial."
 colony.1500.a: "Ils ont bien fait."
 colony.1501.name: "Anciens drones : découverte"
 colony.1501.desc: "Ces drones sont totalement imprévisibles.\n\nNous avons rapidement oublié notre déception en découvrant qu'ils nous avaient attribués une classification IFF erronée : ils nous prennent pour une race affiliée à leurs anciens maîtres ! Notre arrivée les a apparemment beaucoup énervés, si tant est que de vieux automates dotés d'une intelligence artificielle puissent s'énerver. Hélas, peu après, ces drones se sont rendormis et nous n'avons pas réussi à les réveiller.\n\nNi à les démonter, d'ailleurs."
 colony.1501.a: "Surveillez-les."
 colony.1502.name: "Anciens drones : réveil"
 colony.1502.desc: "Les drones se sont réveillés et sont descendus à la surface de [Root.GetName]. Nos tentatives de communication avec eux se sont soldées par un refus poli alors qu'ils se mettaient à terraformer une petite portion de la planète. Nous ignorons la nature des ordres anciens auxquels ils obéissent, mais ils ne semblent pas nuire à la colonie."
 colony.1502.a: "Eh bien, tant que leurs activités sont bénéfiques pour nous..."
 colony.1502.a.tooltip: "Les drones déblaient un £blocker£ §Ybloqueur de tuile§! aléatoire à la surface, sans toucher au reste de la planète.\n"
 colony.1503.name: "Anciens drones : technologie spatiale ancienne"
 colony.1503.desc: "Les anciens drones en sommeil sur la lune de §Y[Root.GetName]§! se sont à nouveau réveillés et remis au travail.\n\nSous le couvert de la nuit, ils ont érigé la charpente d'une gigantesque structure non loin de notre principale colonie. Les ingénieurs sont convaincus qu'ils construisent un « ascenseur spatial », un concept archaïque qui était probablement très courant à une époque antérieure à celle où les [Root.Owner.GetSpeciesNamePlural] se sont élancés vers les étoiles pour la première fois. Il faudra tôt ou tard le raser, car il entrave les projets d'expansion de la colonie, et son démantèlement prendra du temps. Mais les ingénieurs se font déjà une joie d'étudier cet engin de près."
 colony.1503.a: "Tant mieux pour eux."
 colony.1504.name: "Anciens drones : générosité spontanée"
 colony.1504.desc: "Après s'être à nouveau réveillés, les drones ont brièvement disparu de nos écrans. Lorsqu'ils sont réapparus, ils tractaient une énorme cargaison de minéraux d'origine inconnue. Ils l'ont déchargée à la surface de [Root.GetName] après avoir envoyé un signal corrompu indiquant qu'ils avaient obéi à un ordre de réquisition.\n\nIls sont ensuite revenus sur la lune."
 colony.1504.a: "Minéraux gratuits ! On ne va pas s'en plaindre."
 colony.1505.name: "Anciens drones : exhumation d'un vieux satellite"
 colony.1505.desc: "D'intenses signaux en provenance de la lune nous ont avertis que les drones de [Root.GetPlanetMoon] s'étaient à nouveau réveillés. Cette fois, ils nous rapportent un butin intéressant puisqu'ils ont en partie réparé un ancien satellite qu'ils venaient d'exhumer des profondeurs de leur lune. Nous ignorons comment ce satellite a atterri là, ni pourquoi les drones l'avaient jusque-là ignoré. Quoi qu'il en soit, si nous parvenons à récupérer ne serait-ce qu'un fragment de ses banques de données, nous en saurons plus sur la vie quotidienne des habitants des empires que les drones servaient autrefois."
 colony.1506.name: "Anciens drones : débâcle des drones"
 colony.1506.desc: "Le comportement imprévisible des drones narcoleptiques a pris une violente tournure. Quelques-uns d'entre eux se sont réveillés et sont entrés dans l'atmosphère de [Root.GetName], comme à leur habitude, mais au lieu de se poser tranquillement à la surface de la planète, ils l'ont percutée à pleine vitesse.\n\nCertains même à plusieurs reprises.\n\nLes dégâts sur la colonie sont négligeables mais ces drones que l'on croyait invulnérables se sont fracassés en formant des gerbes d'étincelles bleues, ce qui atteste d'une force considérable et d'une volonté d'autodestruction."
 colony.1506.a: "Saurons-nous un jour ce qui ne tournait pas rond chez eux ?"
 colony.1507.name: "Anciens drones : recherche de drones"
 colony.1507.desc: "Les drones qui n'ont pas participé au suicide collectif ont disparu. Les férus d'histoire de [Root.GetName] sont convaincus qu'ils sont encore dans les parages, dissimulés par une technologie antique, mais leur prochaine période d'activation est déjà passée.\n\nL'analyse des restes des drones détruits prend du temps, mais nous nous attendons à faire prochainement une découverte intéressante."
 colony.1507.a: "Tenez-moi au courant."
 colony.1508.name: "Anciens drones : à la recherche d'or"
 colony.1508.desc: "Les restes éparpillés des drones ont été très longs à trier, car ils étaient tous basés sur des modèles légèrement différents et assemblés avec des pièces disparates. Mais une fois ce fait établi, nous nous sommes rendu compte que les pièces étaient identiques. Séparées de l'ensemble, ces pièces sont indéniablement modernes, qu'elles soient ou non de fabrication alien. Contrairement à nous, il n'est pas impossible que quelqu'un ait réussi à trafiquer ces drones."
 colony.1508.a: "De plus amples investigations vont être nécessaires."
 colony.1509.name: "Anciens drones : alien d'origine alien"
 colony.1509.desc: "Après avoir été assemblées, les pièces étrangères qui constituaient les drones détruits ont été identifiées par nos experts comme des émetteurs unidirectionnels. Comme ils n'ont pas été conçus pour recevoir des informations, on peut en déduire que ces drones n'agissaient pas sur ordre d'un tiers, mais qu'une entité surveillait leurs activités."
 colony.1509.a: "Continuons de surveiller tout cela de près"
 colony.1510.name: "Anciens drones : réponses"
 colony.1510.desc: "Nous avons découvert que les drones encore intacts dérivaient sur l'orbite de [Root.GetPlanetMoon]. Nous savons maintenant qu'ils servaient involontairement un plan élaboré mis en oeuvre par une faction inconnue.\n\nCompte tenu du modus operandi de cette opération, cette faction est très probablement une organisation pirate ancienne particulièrement astucieuse. Ils ont dû trouver ces drones à la dérive dans l'espace et, contrairement à nous, ont réussi à les modifier. Bien qu'ils se soient contentés d'y introduire une technologie alien autonome, ces pirates aliens possèdent néanmoins un savoir-faire technologique bien supérieur au nôtre, du moins dans certains domaines. Après avoir installé leurs systèmes de communication dans les drones, les pirates les ont laissés dériver dans l'espace, en sachant qu'ils étaient programmés pour servir les colons de leurs maîtres d'origine et qu'ils auraient probablement du mal à les identifier après tout ce temps. Les drones servent notre colonie pendant que les pirates attendent le bon moment pour frapper.\n\nNos analystes militaires pensent qu'ils frapperont dans les deux ans qui viennent."
 colony.1510.a: "Qu'ils viennent !"
 colony.1510.b: "Capturez ces drones et envoyez-les détruire leurs soi-disant maîtres."
 colony.1510.c: "Nous devons empêcher cela. Démantelez les drones."
 colony.1511.name: "Anciens drones : un dernier adieu"
 colony.1511.desc: "Nous avons capturé les drones pour les équiper de charges explosives. Leur reprogrammation s'est révélée relativement simple maintenant que nous savons les ouvrir, et nous les avons programmés pour qu'ils rejoignent la position estimée de la flotte pirate. Les meilleurs scientifiques [Root.Owner.GetSpeciesName] y ont implémenté notre propre technologie IFF pour les empêcher d'attaquer des innocents."
 colony.1511.a: "Laissez-les partir."
 colony.1512.name: "Anciens drones : blessés et volatiles"
 colony.1512.desc: "La flotte pirate arrive, plus tôt que prévu. Grâce à notre frappe préventive, nous avons apparemment réussi à les provoquer et à endommager leur flotte, car celle-ci comprend environ 30 % de vaisseaux en moins que prévu."
 colony.1513.name: "Anciens drones : ils sont partout"
 colony.1513.desc: "La flotte pirate est arrivée, un peu plus tard que prévu. Compte tenu de la composition de la flotte et des formations employées, ils ont dû rallier leurs alliés pour piller et brûler [Root.GetName] aussi rapidement et aussi efficacement que possible."
 colony.1513.a: "Ils n'en auront pas l'occasion."
 colony.1514.name: "Anciens drones : confrontation"
 colony.1514.desc: "Le moment est venu, et l'armada des pirates arrive à point nommé."
 colony.1514.a: "On attendait ce combat depuis longtemps."
 ### Mharin Kharin Aphrodisiac Pollen
 colony.1520.name: "Le mharin kharin : fascination florale"
 colony.1520.desc: "Différentes plantes originaires de [Root.GetName], où nous avons récemment implanté une colonie, libèrent de grandes quantités de pollen dont la complexité chimique est stupéfiante.\n\nUn projet de recherche spécial a été lancé pour étudier plus en détail cette flore."
 colony.1521.name: "Le mharin kharin : stimulation olfactive"
 colony.1521.desc: "Une exposition prolongée au pollen naturellement présent dans l'atmosphère de [Root.GetName] a sur les récepteurs de phéromones des colons un effet légèrement aphrodisiaque, accompagné de la sensation - à peine perceptible - de « planer ». La plante produisant le pollen le plus puissant est une fleur commune à toutes les régions de la planète, classée par les scientifiques de [Root.GetName] dans une obscure niche taxonomique. Les [Root.Owner.GetSpeciesNamePlural] locaux l'appellent quant à eux « mharin kharin »."
 colony.1521.b: "Non aux particules psychotropes dans l'atmosphère !"
 colony.1521.c: "Nous n'avons pas les moyens d'exterminer la plante"
 colony.1522.name: "Le mharin kharin : chasse aux pétales"
 colony.1522.desc: "Les rapports nous parvenant de [Root.GetName] indiquent que la productivité des travailleurs a récemment décliné, avant de se stabiliser à un taux bien inférieur à la moyenne [Root.Owner.GetSpeciesAdj].\n\nCette baisse peut - ou pas - s'expliquer par les effets stimulants du pollen présent sur la planète.\n\nC'est sans doute le cas.\n\nUn §Yprojet spécial§! a été monté, qui permettrait d'accroître la production pour compenser cette baisse de productivité."
 colony.1522.a: "Nous allons réfléchir à tout cela"
 colony.1523.name: "Le mharin kharin : pas de fleurs au travail"
 colony.1523.desc: "Les modifications radicales qui ont été apportées aux principes de l'organisation du temps de travail et de la délégation des responsabilités dans tous les domaines de production et dans les autres tâches accomplies sur [Root.GetName] ont donné de bons résultats.\n\nLa population locale avait certes clairement exprimé son désir de rester à proximité de la flore indigène ; les observateurs extérieurs, quant à eux, parleraient plus volontiers d'un phénomène de manque, pur et simple.\n\nMais une planification intelligente et des contrôles poussés ont été mis en place. La productivité est certes restée faible, mais au moins est-elle repassée au-dessus de la limite basse de ce qui est considéré comme acceptable."
 colony.1523.a: "Beau travail"
 colony.1524.name: "Le mharin kharin : enracinement"
 colony.1524.desc: "Une étude récente indique que les habitants de [Root.GetName] sont beaucoup moins enclins à migrer vers d'autres planètes que leurs concitoyens de la [Root.Owner.GetName].\n\nL'étude n'indique pas, en revanche, si cela pourrait s'expliquer par une quelconque forme de dépendance psychologique que provoquerait le mharin kharin et les plantes de la même famille."
 colony.1525.name: "Le mharin kharin : problèmes de communication"
 colony.1525.desc: "La productivité de [Root.GetName] a cessé de baisser, mais les communications entre la colonie et la capitale s'espacent. Les plus hautes autorités sur place se montrent de plus en plus distantes, et les membres de l'administration, sur [Root.Owner.Capital.GetName], qui sont chargés de transmettre les directives à la colonie commencent à parler d'une « véritable corvée »."
 colony.1525.a: "... soupir ..."
 colony.1525.b: "Envoyons-y des inspecteurs administratifs, code mauve"
 colony.1526.name: "Le mharin kharin : trahison des inspecteurs"
 colony.1526.desc: "Il semble bien que l'équipe d'inspection administrative envoyée sur [Root.GetName] pour remettre de l'ordre nous a trahis. Heureusement, leur complot visant à en faire le moins possible a été rapidement découvert tant il était mal ficelé. Des têtes vont tomber - métaphoriquement parlant, bien sûr - car notre dernier recours est de destituer les autorités locales et de placer la colonie sous tutelle directe de la capitale."
 colony.1526.a: "Ils vont voir ce qu'ils vont voir !"
 colony.1527.name: "Le mharin kharin : une main de fer dans un gant lointain"
 colony.1527.desc: "L'administration à distance de [Root.GetName] est désormais bien ancrée. Elle a réussi à rencontrer quelques succès en parvenant à limiter la prolifération du mharin kharin et en faisant prendre conscience à la communauté locale qu'elle ne devait pas se laisser aller à « en prendre ». Ce n'est déjà pas rien, quand on sait que cela consiste simplement à humer une fleur."
 colony.1528.name: "Le mharin kharin : brûlis"
 colony.1528.desc: "L'administration à distance de [Root.GetName] continue d'être une solution malcommode mais relativement efficace. Le Conseil chargé de la colonie affirme avoir réussi à s'assurer de la loyauté d'une partie des forces armées présentes sur planète, qui semble préférer rester enfermée plutôt que de sortir respirer le pollen de mharin kharin. L'administration à distance souhaite donc utiliser ces troupes pour mener une offensive contre la fleur, en leur faisant ériger des purificateurs atmosphériques et en éradiquant la plante de toutes les zones urbaines."
 colony.1528.a: "Cela devrait être fait depuis longtemps"
 colony.1528.a.tooltip: "La plante responsable de l'intoxication fait l'objet d'un contrôle très strict et est tenue à l'écart des zones peuplées, permettant le retrait de tous les modificateurs qui lui étaient associés.\n"
 colony.1529.name: "Le mharin kharin : culte du pollen"
 colony.1529.desc: "Sur [Root.GetName], des extrémistes se sont regroupés pour former une organisation quasi religieuse, dont l'objectif est de contrôler tout ce qui concerne le mharin kharin et sa culture. Le leader du mouvement du « Temple des fleurs », qu'ils appellent le « hiérophante vert », prétend s'exprimer au nom de l'ensemble de la faune et de la flore de [Root.GetName] et exige le contrôle exclusif des droits commerciaux liés à la plante.\n\nCeci est non seulement totalement inacceptable, mais en plus impossible, car la flore indigène de [Root.GetName] n'a aucune valeur réelle au niveau stratégique ou économique, et ne peut donc pas être légalement exportée.\n\nHélas, ils ne semblent pas disposés à entendre raison."
 colony.1530.name: "Le mharin kharin : début de la fin du pollen"
 colony.1530.desc: "Le Temple des fleurs et ses disciples forment désormais une minorité non négligeable de la population de [Root.GetName], et les rapports évoquent un changement inquiétant au sein de ce mouvement. Leurs tentatives futiles pour tenter de pratiquer la contrebande du mharin kharin vers les mondes extérieurs font de moins en moins d'émules, le Temple des fleurs semblant peu à peu se transformer en une sorte de culte millénariste. Un lien est sans doute à faire avec les relevés récents des capteurs atmosphériques, qui indiquent des changements dans la composition chimique du pollen de mharin kharin.\n\nUn §Yprojet spécial§! a été lancé pour évaluer les risques que représentent ces changements. Mieux vaudrait le boucler avant que les choses ne tournent mal."
 colony.1530.a: "Entendu"
 colony.1531.name: "Le mharin kharin : désastre évité"
 colony.1531.desc: "Une intervention rapide et efficace a permis d'identifier les risques liés aux rapides changements de composition du pollen de [Root.GetName] et de prendre les mesures qui s'imposaient.\n\nLa planète a été entièrement évacuée et bombardée de pesticides pour traiter le mharin kharin et les plantes de la même famille.\n\nCelles-ci étaient en pleine mutation et leur pollen, s'il n'avait pas été détruit, aurait rapidement commencé à libérer une puissante neurotoxine, très nocive pour le système olfactif de l'ensemble des êtres intelligents de [Root.GetName].\n\nLes scientifiques du Conseil de colonisation pensent que ce phénomène s'inscrit dans un cycle naturel propre à [Root.GetName] et que les effets indésirables du pollen sur nous - une administration locale proche de l'effondrement, l'ascension du culte du Temple des fleurs puis enfin la toxicité du pollen - étaient des effets secondaires dus au hasard et non le produit d'un mécanisme sinistre d'autodéfense de la plante.\n\nQuoi qu'il en soit, il ne reste plus aucune trace de la fleur à la surface de la planète, et les colons sont aujourd'hui libérés de l'influence de son pollen."
 colony.1531.a: "Tout est bien qui finit bien"
 colony.1531.a.tooltip: "La dangereuse fleur a été éradiquée de la planète, permettant le retrait de tous les modificateurs qui lui étaient associés.\n"
 colony.1532.name: "Le mharin kharin : le pollen a eu raison de nous"
 colony.1532.desc: "Rien ne s'est passé comme prévu. Toutes les fleurs de mharin kharin ont muté à l'unisson, avant de se propager comme un feu de forêt et de transformer leur pollen en une substance toxique. Nous n'avons pas pu intervenir à temps.\n\nNos tentatives d'évacuation et de neutralisation du pollen se sont révélées insuffisantes, et ce sont les habitants de [Root.GetName] ont payé le prix fort.\n\nLa végétation de [Root.GetName] a toutefois remporté une victoire à la Pyrrhus, même s'il ne s'agit que d'une maigre consolation : l'ensemble de la famille du mharin kharin a elle-même payé sa rapide prolifération, le sol ne contient plus les nutriments nécessaires à ces plantes pollinisatrices. Aussi, lorsque les derniers spécimens encore en vie mourront, ce qui ne saurait tarder, il faudra beaucoup de temps à cette flore pour se réimplanter dans l'écosystème, si elle y parvient un jour.\n\nLes habitants de [Root.GetName] sont morts, et l'atmosphère de la planète restera encore toxique un moment à cause des émissions polluantes."
 colony.1532.a: "Nous n'oublierons jamais cette tragédie"
 colony.1533.name: "Le mharin kharin : nouveau départ"
 colony.1533.desc: "Une équipe de surveillance planétaire signale que les miasmes toxiques qui depuis deux ans ont enveloppé la planète, après avoir provoqué la destruction de notre colonie, se sont dissipés. Ce monde est bien différent maintenant, transformé en désert par la violente prolifération du mharin kharin et par la saturation en pollen de son atmosphère.\n\nIl faudra encore bien plus de deux ans pour que la [Root.Owner.GetName] puisse oublier la mort tragique de tous ceux qui vivaient là ; mais la planète elle-même n'est plus considérée comme hostile à la vie intelligente."
 colony.1533.a: "Nous en tiendrons compte"
 pheromonefrenzy.revived.tooltip: "Notre ancienne colonie est devenue une planète désertique, mais avec les technologies appropriées elle devrait pouvoir à nouveau être colonisée."
 colony.1534.name: "Le mharin kharin : pas la fine fleur"
 colony.1534.desc: "Un examen approfondi a montré que les plantes de [Root.GetName] ne présentent finalement que guère d'intérêt. Le pollen que libèrent certaines d'entre elles a un effet légèrement stimulant, et elles ont une certaine propension à muter rapidement. Rien de tout cela ne suffit pas à en faire une ressource stratégique ou de luxe."
 ####################################
 #Spread of communications
 ####################################
 communications_spread.1.name: "Communication interceptée"
 communications_spread.1.desc: "L'interception d'un message adressé à la [CommSpreader.GetName] nous a permis d'apprendre qu'elle communique régulièrement avec un autre empire spatial dont nous ignorions l'existence. En remontant jusqu'à la source de ce message, nous avons pu à notre tour établir un canal de communication avec cet acteur jusque-là inconnu sur la scène galactique."
 communications_spread.1.a: "Intéressant..."
 communications_spread.1.tooltip: "Communication établie avec la [contact_empire.GetName]."
 communications_spread.2.name: "Nouveau contact"
 communications_spread.2.desc: "Nous avons reçu un communiqué d'un empire spatial jusque-là inconnu, qui se fait appeler « §Y[From.GetName]§! ». Les auteurs de ce message disent avoir appris notre existence en écoutant les communications d'un empire avec lequel nous sommes en contact."
 communications_spread.2.a: "Intéressant..."
 communications_spread.2.tooltip: "Communication établie avec la [From.GetName]."
 fallen_empires.2.name: "[From.GetName] a assassiné le [Root.GetRulerTitle] !"
 fallen_empires.2.desc: "Comme pour nous punir d'avoir fait la guerre à l'Empire stagnant du [From.GetName], pour finalement accepter la défaite, des agents [From.GetAdj] ont fait leur apparition aux côtés du [Root.GetRulerTitle] [rulername.GetName] à l'issue des négociations de paix.\n\nAvec une extrême violence et des armes invisibles, ils ont tué notre [Root.GetRulerTitle] avant de se volatiliser."
 fallen_empires.2.a: "Nous avons été vaincus et humiliés, mais nous renaîtrons de nos cendres."
 fallen_empires.2.a.tooltip: "Le §Y[Root.GetRulerTitle] [rulername.GetName] §Rest mort§!.§!"
 fallen_empires.4.name: "Message de la §H[From.GetName]§!"
 fallen_empires.4.desc: "Misérables arrogants ! Pensiez-vous que la présence de [Root.GetSpeciesNamePlural] sur nos sites sacrés passerait inaperçue ? Quittez immédiatement nos mondes ou vous devrez faire face à toute la puissance de nos flottes !"
 fallen_empires.4.a: "Nous n'avons pas le choix, nous devons accepter..."
 fallen_empires.4.b: "Le [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.5.name: "Message de la §H[From.GetName]§!"
 fallen_empires.5.desc: "[Root.GetSpeciesNamePlural], nous avons bien noté vos tentatives maladroites de créer une intelligence artificielle et en sommes venus à la conclusion que vous suivez un chemin qui vous mènera à votre perte spirituelle. Renoncez à ces folles entreprises immédiatement, ou nous saurons vous y CONTRAINDRE."
 fallen_empires.5.a: "Nous n'avons pas le choix, nous devons accepter..."
 fallen_empires.5.b: "Le [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.5.a.tooltip: "La politique §H$policy_artificial_intelligence_policy$§! sera définie sur : §H$ai_outlawed$§!."
 fallen_empires.6.name: "Message de la §H[From.GetName]§!"
 fallen_empires.6.desc: "[Root.GetSpeciesNamePlural] barbares ! Vos crimes ne sont pas passés inaperçus. L'asservissement de populations entières et les massacres gratuits que vous perpétrez menacent l'avenir de toute la galaxie. Voici donc le seul choix que nous vous laissons : soit vous cessez immédiatement vos pratiques barbares, soit vous devrez vous préparer à affronter nos forces."
 fallen_empires.6.a: "Nous n'avons pas le choix, nous devons accepter..."
 fallen_empires.6.b: "Le [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.6.a.tooltip: "La politique §H$policy_slavery$§! sera définie sur §H$slavery_not_allowed$§!.\nLa politique §H$policy_purge$§! sera définie sur : §H$purge_not_allowed$§!."
 fallen_empires.7.name: "Message de la §H[From.GetName]§!"
 fallen_empires.7.desc: "Immondes [From.GetSpeciesNamePluralInsult] ! C'est la dernière fois que vous envahissez notre espace ! Retirez-vous immédiatement ou nous éradiquerons votre espèce de l'univers."
 fallen_empires.7.a: "Nous n'avons pas le choix, nous devons accepter..."
 fallen_empires.7.b: "Le [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.8.name: "Message de la §H[From.GetName]§!"
 fallen_empires.8.desc: "Stupides [Root.GetSpeciesNamePlural]. Votre manque de respect envers vos aînés causera votre perte. Prosternez-vous devant nous, implorez notre pardon. Alors, peut-être, déciderons-nous d'épargner votre misérable petit empire."
 fallen_empires.8.desc.control: "[Root.GetSpeciesNamePlural] rebelles. Ne voyez-vous pas qu'en semant le chaos, vous nous obligez à agir ? Rentrez dans le rang ou nous vous y forcerons."
 fallen_empires.8.desc.growth: "[Root.GetSpeciesNamePlural] fainéants, votre refus d'évoluer est une insulte à la vie. Adoptez nos enseignements ou nous déracinerons votre échec et sèmerons nous-mêmes les graines du progrès."
 fallen_empires.8.desc.war: "Lâches [Root.GetSpeciesNamePlural]. Votre empire est l'incarnation de la faiblesse. Reconnaissez votre fragilité, excusez-vous et préparez-vous à relever notre défi. Sinon, nous vous réduirons en pièces et vous remplacerons par plus méritant."
 fallen_empires.8.a: "Nous n'avons pas le choix, nous devons accepter..."
 fallen_empires.8.a.tooltip: "Met un terme à la rivalité avec la [fallen_empire_humiliator.GetName].\nLa [Root.GetName] perd toute revendication sur les systèmes de la [fallen_empire_humiliator.GetName]."
 fallen_empires.8.b: "Le [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.9.name: "Message de la §H[From.GetName]§!"
 fallen_empires.9.desc: "[Root.GetSpeciesNamePlural] blasphémateurs ! Vous arpentez négligemment les salles des morts, foulant aux pieds l'histoire, sans aucune pensée pour les esprits dont vous dérangez le repos. C'en est assez ! Laissez les morts reposer en paix, ou vous aurez à en répondre devant les vivants - devant nous !"
 fallen_empires.9.a: "Nous n'avons d'autre choix que d'accepter..."
 fallen_empires.9.b: "La [Root.GetName] ne se laissera pas intimider !"
 fallen_empires.100.name: "Découverte d'un monde sacré" #Holy World
 fallen_empires.100.A.desc: "Nous ne sommes pas les premiers à visiter §Y[From.GetName]§!, dans le système de [From.solar_system.GetName]. Cette [From.GetPlanetMoon] [From.GetClassAdj] est remarquable par elle-même, non seulement par l'abondance des ressources inexploitées dont elle regorge, mais aussi par une balise ancienne et richement décorée présente en orbite haute. Il s'agit à l'évidence d'un marqueur laissé là par une civilisation spatiale antique, mais aucune preuve n'a pu être trouvée que ce monde a été peuplé, ou même prospecté.\n\nDe nombreuses théories ont déjà été émises, mais les preuves laissent à penser que cette civilisation antique révérait autrefois ce monde paradisiaque. Sa localisation ne peut être qu'envisagée de manière très approximative, si l'on suppose qu'elle existe encore aujourd'hui." #'from' = planet; 'GetClassAdj' = planet class, i.e. 'ideal'
 fallen_empires.100.desc.spi_intro: "§Y[From.GetName]§!, dans le système de [From.solar_system.GetName], semble avoir été touchée par le Divin. Les chercheurs à bord du [Root.GetName] indiquent qu'une aura sacrée entoure la [From.GetPlanetMoon], d'autant qu'a été découverte en orbite haute une balise ancienne et richement ornementée." #'from' = planet; 'root' = ship; 'GetClassAdj' = planet class, i.e. 'ideal'
 fallen_empires.100.A.desc.spi: "$fallen_empires.100.desc.spi_intro$\n\nIl semblerait que ce monde a autrefois été révéré comme une divinité, ou à tout le moins comme un monde sacré. Nous ne savons pas encore par qui, mais les théories les plus consensuelles suggèrent qu'il s'agissait d'une civilisation spiritualiste, qui aurait depuis lors décliné." #'from' = planet
 fallen_empires.100.A.desc.gestalt: "La reconnaissance de §Y[From.GetName]§! suggère que ce monde généreux, dans le système de [From.solar_system.GetName], était autrefois monde intéressant particulièrement une forme de vie encore inconnue. Une ancienne balise de navigation, en orbite haute, prouve le passage de visiteurs aliens par le passé, mais aucune preuve n'a pu être trouvée indiquant le moindre débarquement à la surface ou la moindre tentative de colonisation au cours des siècles passés. Au contraire, il semblerait que quelqu'un ou quelque chose a préservé cette [From.GetPlanetMoon] [From.GetClassAdj]. Aucun élément indiquant ce qu'il a pu advenir de cette entité hypothétique n'a pu être trouvé." #'from' = planet; 'GetClassAdj' = planet class, i.e. 'ideal'
 fallen_empires.100.B.desc: "Il est probable que §Y[From.GetName]§! est plus qu'un monde riche de ressources et d'une écosphère parfaitement naturelle. Cette [From.GetPlanetMoon] [From.GetClassAdj] du système de [From.solar_system.GetName] est étrangement vierge, à l'exception d'une ancienne balise brillant en orbite haute. Des motifs très ornementés et stylisés ont été gravés dans la coque extérieure de l'appareillage, et si nous ne pouvons en être certains il est tout à fait vraisemblable que cette oeuvre d'art est originaire de la §H[spi_fallen_empire.GetName]§! toute proche.\n\nL'attitude de celle-ci à notre égard est indéchiffrable, aussi ne pouvons-nous qu'émettre des hypothèses sur sa volonté concernant ce monde. En tout cas, rien ne montre pour l'instant qu'elle se considère offensée par l'intérêt dont nous avons témoigné pour cette [From.GetPlanetMoon]..." #'from' = planet; 'GetClassAdj' = planet class, i.e. 'ideal'
 fallen_empires.100.B.desc.spi: "$fallen_empires.100.desc.spi_intro$\n\nIl semblerait que ce monde a autrefois été révéré comme une divinité, ou à tout le moins comme un monde sacré. Les décorations stylisées gravées sur la coque extérieure de la balise suggèrent qu'elle pourrait avoir été laissée là par la §H[spi_fallen_empire.GetName]§!, qui vénérait autrefois ce monde. Rien ne permet d'affirmer, cependant, si c'est toujours le cas ou non."
 fallen_empires.100.B.desc.gestalt: "La reconnaissance de §Y[From.GetName]§! suggère que ce monde généreux, dans le système de [From.solar_system.GetName] était autrefois un monde intéressant particulièrement une forme de vie encore inconnue, et surtout particulièrement sentimentale. Une balise de navigation en orbite haute, depuis longtemps hors d'usage, a été décorée de motifs stylisés et très ornementés gravés sur sa coque extérieure, du même style que ceux affichés par la §H[spi_fallen_empire.GetName]§!.\n\nIl semblerait donc que les [spi_fallen_empire.GetSpeciesNamePlural] ont autrefois cherché à préserver cette [From.GetPlanetMoon] [From.GetClassAdj]. Rien n'indique toutefois si c'est toujours le cas."
 fallen_empires.100.a: "À notre tour d'honorer ce lieu"
 fallen_empires.100.b: "Ce monde est désormais nôtre"
 fallen_empires.100.c: "Nous pourrions prospérer ici"
 fallen_empires.100.d: "Ces [spi_fallen_empire.GetSpeciesNamePluralInsult] décadents..." #returns e.g. 'parasites', 'weeds' - see 'PLANT_insult_plural_01'
 fallen_empires.100.e: "Ces mécréants arrogants..."
 origin.12.desc: "Un message prioritaire a été transmis par l'équipage du [From.GetName], depuis le système de [From.From.solar_system.GetName] : il a découvert §Y[From.From.GetName]§!.\n\n[From.From.GetName]... Ce nom est entouré de légendes, dont bon nombre se retrouvent dans les écrits de la [Root.Overlord.GetName]. De nombreux [Root.GetSpeciesNamePlural] savent que ce monde est un véritable paradis, un symbole d'un espoir intangible, et si l'équipage peut voir que la [From.From.GetPlanetMoon] est effectivement d'essence divine, nous devons aussi prendre en considération un fait très simple : ce lieu mythique et sacré existe bel et bien.\n\nLa [Root.Overlord.GetName] ne s'est pas encore prononcée sur le fait que nous avons découvert sa localisation, mais tout porte à croire qu'elle surveille ce monde de très près. Elle sait donc que nous sommes là ; mais comment son silence doit-il être interprété ?" #from = Science ship, fromfrom = planet
 origin.12.a: "C'est assez étrange..."
 origin.12.b: "Nos tuteurs ont confiance en nous" #'elders' as in respected guardians or mentors, not literal ancestors
 scion_found_holy_world: "Révélation d'un monde sacré"
 scion_found_holy_world_desc: "Les religieux spécialisés tout autant que les profanes se réjouissent de la découverte récente d'un monde sacré, que l'on pensait encore il y a peu n'être qu'une simple légende."
 scion_suspicious_holy_world: "Suspicions à propos d'un monde sacré"
 scion_suspicious_holy_world_desc: "L'empire a bien compris que ses tuteurs lui cachent certaines vérités, l'une d'entre elles, et pas des moindres, étant l'existence avérée d'un monde sacré."
 origin.13.desc.intro: "§Y[From.From.GetName]§! est bien davantage qu'une [From.From.GetPlanetMoon] [From.From.GetClassAdj] riche en ressources et dotée d'une atmosphère parfaitement pure. Située dans le système de [From.From.solar_system.GetName], elle est restée parfaitement vierge, à la notable exception d'une antique balise, scintillant dans son orbite haute." #'fromfrom' = planet; 'GetClassAdj' = planet class, i.e. 'ideal'
 origin.13.hasmet.desc: "$origin.13.desc.intro$\n\nLa sophistication pure de ce dispositif ressemble beaucoup à un produit de la technologie [Root.Overlord.GetSpeciesName]. Il y a donc tout lieu de croire qu'elle a été laissée là par la [spi_fallen_empire.GetName], toute proche. Quant à son but, il est quelque peu mystérieux. Il ne paraît toutefois pas invraisemblable que les [spi_fallen_empire.GetSpeciesNamePlural] considèrent ce monde comme sacré."
 origin.13.notmet.desc: "$origin.13.desc.intro$\n\nLa sophistication pure de ce dispositif ressemble beaucoup à un produit de la technologie [Root.Overlord.GetSpeciesName], même si sa conception est indéniablement différente. Nous devons donc en déduire que ce marqueur appartient à quelque empire contemporain, actuel ou disparu. Et, à en juger par les divers symboles gravés sur la coque de la balise, elle pourrait avoir pour usage de marquer la localisation d'un site sacré."
 origin.13.a: "Tout cela est absolument ridicule"
 fallen_empire_refuse_tooltip: "La §H[From.GetName]§! va être très mécontente et pourrait même décider de nous attaquer."
 fallen_empire_happy_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! sera satisfaite et pourrait bien nous témoigner sa gratitude à l'avenir."
 fallen_empire_unhappy_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! va être mécontente."
 fallen_empire_maybe_unhappy_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait être mécontente."
 fallen_empire_angry_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! va être très mécontente, et pourrait même décider de nous donner une leçon."
 fallen_empire_enigmatic_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait réagir à notre refus - ou pas."
 fe_gift_ship: "Vaisseau offert"
 gave_up_pop: "Nous avons cédé un échantillon de notre population"
 gave_up_pop_xenophobe: "Nous avons cédé un échantillon de notre population"
 gave_up_scientist_xenophobe: "Nos avons cédé un scientifique"
 gave_up_pop_xenophile: "Nous avons cédé un échantillon de notre population"
 pol_ai_outlawed: "Inhibiteurs de positrons"
 pol_ai_servitude: "Protocoles de servitude"
 pol_ai_full_rights: "Droits des synthétiques"
