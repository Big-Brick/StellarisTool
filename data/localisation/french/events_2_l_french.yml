l_french:
 FANTASTIC: "Formidable"
 ####################################
 #Anomaly Categories
 ####################################
 #ROOT = PLANET SCOPE
 #FROM = SHIP SCOPE
 NAME_Former_Cult_Flagship: "Ancien vaisseau amiral des fanatiques"
 AST_WAVELENGTHS_1_CAT: "Ondes astéroïdales"
 AST_WAVELENGTHS_1_DESC: "L'astéroïde [Root.GetName] émet une sorte de salves de radiations, qui paraissent être contrôlées. Se pourrait-il que quelqu'un - ou quelque chose ? - tente d'entrer en communication avec nous ?"
 AST_DEBRIS_FIELD_1_CAT: "Champ de débris"
 AST_DEBRIS_FIELD_1_DESC: "Les capteurs ont détecté des éléments potentiellement intéressants dans le champ de débris très dense qui entoure [Root.GetName]."
 HBL_LUSH_PLANET_1_CAT: "Une planète luxuriante"
 HBL_LUSH_PLANET_1_DESC: "[Root.GetName] est exceptionnellement verdoyante, et les analyses préliminaires indiquent que sa surface pourrait recéler des choses extrêmement intéressantes."
 UHB_ANCIENT_RUINS_1_CAT: "Monolithes"
 UHB_ANCIENT_RUINS_1_DESC: "La surface de [Root.GetName] est couverte de structures impressionnantes, qui semblent n'attendre que des archéologues pour les examiner."
 UHB_MOLTEN_CHART_CAT: "Fusion"
 UHB_MOLTEN_CHART_DESC: "Nous avons capté un faible signal de détresse en provenance de la surface surchauffée de [Root.GetName]."
 GEN_PLAYGROUND_CAT: "Vestiges ludiques"
 GEN_PLAYGROUND_DESC: "Des structures impressionnantes recouvrent une petite partie de la surface de [Root.GetName], semblant n'attendre que d'être fouillées par des archéologues."
 AST_SHRINE_1_CAT: "Astéroïde sculpté"
 AST_SHRINE_1_DESC: "L'astéroïde [Root.GetName] a été partiellement excavé et sculpté, avec une précision d'orfèvre. Et ce que représentent les lignes et les courbes gravées dans la roches ne semble pas totalement étranger..."
 HBL_MUSIC_1_CAT: "Un vrombissement dans la nuit"
 HBL_MUSIC_1_DESC: "[Root.GetName] émet des sons inhabituels."
 GAS_ZRO_ICE_CAT: "Géante de glaces"
 GAS_ZRO_ICE_DESC: "En l'absence d'hydrogène et d'hélium, [Root.GetName] ne peut être classée dans la catégorie des géantes gazeuses. Il s'agit en fait d'une géante de glaces."
 AST_ILLICIT_DARK_CAT: "Astéroïde rayonnant"
 AST_ILLICIT_DARK_DESC: "[Root.GetName] crache régulièrement dans le vide spatial un mélange aussi éclectique qu'inquiétant de particules et de radiations."
 TOX_PURPLE_RAIN_CAT: "Poison coloré"
 TOX_PURPLE_RAIN_DESC: "La biosphère toxique de [Root.GetName] confère à cette [Root.GetPlanetMoon] des couleurs très particulières."
 FROZ_BASE_CAT: "Déchets glacés"
 FROZ_BASE_DESC: "Les capteurs ont détecté une activité inattendue à un emplacement précis de la surface gelée de [Root.GetName]."
 FROZ_BASE2_CAT: "Plaines gelées"
 FROZ_BASE2_DESC: "Les capteurs ont détecté une activité inattendue à un emplacement précis de la surface polaire de [Root.GetName]."
 TROP_PETS_CAT: "Déplacements rapides"
 TROP_PETS_DESC: "Des déplacements sporadiques ont été détectés au coeur de la végétation tropicale extrêmement dense de [Root.GetName]."
 BARR_BASE_CAT: "Sur les plaines stériles"
 BARR_BASE_DESC: "Un balayage rapide de la surface de la planète a permis de détecter un faible signal émis en direction de l'espace."
 PROJ_MOON_CAT: "Projection"
 PROJ_MOON_DESC: "Les analyses préliminaires ont révélé que [Root.GetName] présente d'étranges propriétés ; pour une planète de ce type, certains relevés sont très étonnants..."
 SEA_CAT: "Kaléidoscopique"
 SEA_DESC: "Des formes diffuses tourbillonnent dans les courants des vastes océans de [Root.GetName]."
 MOLTEN_BASE_CAT: "Rythme infernal"
 MOLTEN_BASE_DESC: "Une activité rythmique a été détectée à la surface infernale de [Root.GetName]."
 LEVELED_CAT: "Submergé"
 LEVELED_DESC: "[Root.GetName] ne semble présenter qu'une seule caractéristique géologique intéressante..."
 DIMENSIONAL_POCKET_CAT: "Perturbations dimensionnelles"
 DIMENSIONAL_POCKET_DESC: "Des forces inconnues font tourbillonner le champ de débris dans lequel se trouve [Root.GetName]."
 HAB_CORN_CAT: "Écrins de verdure"
 HAB_CORN_DESC: "Les capteurs optiques révèlent la présence d'étonnants écrins de verdure à la surface de [Root.GetName]."
 HAB_MAT_CAT: "Éclat métallique"
 HAB_MAT_DESC: "Les capteurs spectrométriques de rétrodiffusion indiquent la présence de matériaux intéressants dans l'écorce de la planète."
 ATM_ANOMALY_CAT: "Anomalie atmosphérique"
 ATM_ANOMALY_DESC: "Les relevés atmosphériques effectués sur [Root.GetName] ne correspondent pas aux projections des simulateurs."
 FRBR_GRIMACING_CAT: "Incohérence"
 FRBR_GRIMACING_DESC: "Les résultats des balayages successifs de la surface de [Root.GetName] ne sont pas cohérents, comme si la planète était en perpétuelle mutation."
 FROZ_ILLUMINATED_CAT: "Lueurs dans la glace"
 FROZ_ILLUMINATED_DESC: "Un phénomène optique inexplicable et nettement visible depuis l'espace se produit à la surface de [Root.GetName]."
 GAS_CLOUDY_CAT: "Danse des nuages"
 GAS_CLOUDY_DESC: "L'atmosphère de [Root.GetName] est totalement atypique pour une géante gazeuse de taille si modeste."
 GAIA_MOVE_CAT: "Paradis espéré"
 GAIA_MOVE_DESC: "En tant que planète de type Gaïa, [Root.GetName] devrait regorger de vie..."
 FROZ_BOX_CAT: "Odeur suspecte"
 FROZ_BOX_DESC: "Les analyses ont révélé la présence d'un objet de fabrication alien au sommet d'une des nombreuses montagnes glacées de [Root.GetName]."
 CONT_SIGNS_CAT: "Cicatrices planétaires"
 CONT_SIGNS_DESC: "La surface de [Root.GetName] est criblée de cratères, ce qui en soi n'a rien d'extraordinaire.\n\nCe qui nous interpelle, c'est la forme régulière de ces cicatrices, elles-mêmes réparties de façon irrégulière. Il est donc peu probable que ces cratères soient dus à des impacts de météorites."
 AST_CRATER_CAT: "Bassin de poussière"
 AST_CRATER_DESC: "[Root.GetName] abrite de magnifiques cratères d'impact. Mais dans l'un des plus grands se trouve quelque chose qui vient rompre l'uniformité de la vue..."
 BAR_COLONY_CAT: "Vu d'en haut"
 BAR_COLONY_DESC: "Les capteurs optiques ont repéré un ensemble de formes qui pourraient être des bâtiments à la surface stérile de [Root.GetName]."
 TOX_MAT_CAT: "Sous les nuages toxiques"
 TOX_MAT_DESC: "Les capteurs spectrométriques par rétrodiffusion révèlent la présence de matériaux intéressants sous les nuages toxiques de [Root.GetName]."
 AST_CLUSTER_CAT: "Formation minérale"
 AST_CLUSTER_DESC: "Une étrange formation minérale géométrique dérive au milieu de la ceinture de débris qui jouxte [Root.GetName]. Celle-ci pourrait être d'origine alien."
 GAEA_CHECKERED_CAT: "Démineur"
 GAEA_CHECKERED_DESC: "L'analyse visuelle de la surface de [Root.GetName] a révélé la présence d'une grille qui recouvre toute la planète."
 GEN_ABANDONED_SHIP_CAT: "Analyse réciproque"
 GEN_ABANDONED_SHIP_DESC: "Les résultats des premières analyses de [Root.GetName] sont étonnants.\n\nQuelque chose semble également nous analyser..."
 GEN_DESERT_CAT: "Dunes"
 GEN_DESERT_DESC: "Malgré une atmosphère extrêmement mince, une sorte de vent semble souffler sur les mers de sable qui composent la surface de [Root.GetName]."
 TOX_STRUCTURES_CAT: "Toxiconstruction"
 TOX_STRUCTURES_DESC: "Des structures surnaturelles ont été aperçues sous les épais nuages de l'atmosphère toxique de [Root.GetName]."
 TROP_WOODS_CAT: "Hégémonie végétale"
 TROP_WOODS_DESC: "Des arbres particulièrement impressionnants dominent la surface de [Root.GetName]."
 HOLE_RADIATION_CAT: "Un arc-en-ciel dans le noir"
 HOLE_RADIATION_DESC: "Les capteurs ont détecté des signaux inhabituels aux abords de [Root.GetName], des signaux difficilement explicables si près d'un trou noir."
 UHB_BUOY_CAT: "Effet Doppler"
 UHB_BUOY_DESC: "Un signal instable a été détecté près de [Root.GetName], et pourtant il ne semble pas provenir de la surface de la planète."
 GAIA_RECORD_CAT: "Rivages rubiconiens"
 GAIA_RECORD_DESC: "Les plaines verdoyantes de [Root.GetName] sont silencieuses, à l'exception d'un signal relativement faible mais régulier émis par une balise."
 CRYSTAL_MANUFACTORY_CAT: "Usine ancienne"
 CRYSTAL_MANUFACTORY_DESC: "Une ancienne structure, apparemment abandonnée, plane au-dessus de [Root.GetName], un astéroïde qui ne présente par ailleurs aucun intérêt particulier."
 ####################################
 #Anomaly Events
 ####################################
 anomaly.75.name: "Cerveau rocheux"
 anomaly.75.desc: "Les résultats des analyses de l'énorme astéroïde [From.GetName] sont fascinants. Son coeur est parcouru de tout un réseau de cristaux conducteurs traversé par un faible courant électrique. Selon l'équipage du [Root.GetName], cette matrice serait un réseau neuronal primitif, et ce corps céleste présenterait une forme d'intelligence, même s'il n'est pas pleinement doué de raison. Il a donc demandé l'autorisation d'extraire le coeur et de le transporter jusqu'à la station orbitale la plus proche afin de prolonger son étude."
 anomaly.75.a: "Autorisation accordée"
 anomaly.75.b: "Contentons-nous d'une simple étude de surface"
 anomaly.75.b.tooltip: "Confère le modificateur §YCerveau rocheux§! à [From.GetName] :\n£physics£ §G+8§!"
 anomaly.75.c: "Rien d'invraisemblable, tentons de communiquer"
 anomaly.75.c.tooltip: "Ordonne à l'équipage du [Root.GetName] de disposer des sondes de surface sur §Y[From.GetName]§! afin de décoder son activité neurale supposée."
 IS_LITHOID_EMPIRE_ICON_TIP: "Cette option est disponible car la §H[This.Owner.GetName]§! est un empire §Ylithoïde§!." #not a real trigger tooltip, used with icon = {}
 anomaly.76.desc: "Ici [rock_scientist.GetName]. Cela a été difficile, mais je pense que nous sommes parvenus à analyser les lectures comme... peut-être pas un langage, mais des concepts. Des idées. Et nous pouvons envoyer quelque chose de semblable à l'astéroïde, et peut-être tenter de communiquer.\n\nNous allons envoyer certaines des §Ylectures relevées§!, et je ferai tout mon possible pour vous donner une §Ginterprétation complète§! des données brutes."
 anomaly.76.a: "À bien y réfléchir, ce n'est sans doute pas une si bonne idée"
 anomaly.76.a.tooltip: "Toute tentative pour communiquer directement avec §Y[rock_brain.GetName]§! va être abandonnée, au profit d'études à distance."
 anomaly.76.b: "Entrons en communication"
 anomaly.77.desc: "\n§Y<pensée> <nouvelle>. <raison>. <raison> <perplexité>.§!\n\n\n§GPour fournir un contexte plus précis, [rock_brain.GetName] n'a aucun organe sensoriel dans le sens traditionnel du terme. Il perçoit les données que nous lui envoyons comme s'il s'agissait de ses propres pensées. D'une certaine façon...§!"
 anomaly.77.a: "<Comprenez-vous que nous ne sommes pas vous ?>"
 anomaly.77.a.response: "\n§Y<pensée>-<différente> <réconciliation>-<identique> <divergence>-<différente>.§!\n\n\n§GIl n'est guère convaincu que nous sommes autre chose qu'une fluctuation cérébrale soudaine, d'autant qu'il a déjà connu de telles sautes cognitives par le passé. Nous ne sommes pour lui qu'une diversion fugace.§!"
 anomaly.77.b: "<Dérivez-vous depuis longtemps autour de [rock_sun.GetName] ?>"
 anomaly.77.b.response: "\n§Y<non>... <précédent> <non>. <non>.§!\n\n\n§G[rock_brain.GetName] ne reconnaît pas l'étoile [rock_sun.GetName], ni même ne perçoit son existence. Il lui manque aussi le concept de temps, en dehors d'une compréhension limitée d'une suite logique de l'ordre de la pensée.§!"
 anomaly.77.c: "Peut-on tirer quelque chose d'utile de tout ça ?"
 anomaly.77.c.response: "\n§Y<...>§!\n\n\n§GOh oui, cet échange fait évoluer nos réseaux de décodage encore primitifs très rapidement. Il est même étonnant que cela fonctionne aussi bien, même si je capte quelques lectures alarmantes...§!"
 anomaly.77.d: "<Parlons d'autre chose...>"
 anomaly.78.desc: "\n§Y<quest... <question>§!\n\n\n§GC'est bien ce que je craignais. Nos sondes privent [rock_brain.GetName] de l'énergie qui alimente sa cognition. [rock_brain.GetName] n'est pas un système parfaitement clos, et cela se serait produit à un moment ou un autre. Mais sans doute pas avant des dizaines de milliers d'années, et non maintenant...§!"
 anomaly.78.a: "<Pouvons-nous faire quelque chose pour vous ?>"
 anomaly.78.a.response: "\n§Y<je>.§!\n\n\n§GIl dit que tout va bien, mais c'est évidemment faux. Nous avons tenté de rendre une partie de son énergie au réseau neural, mais cela ne produit que davantage d'ondes parasites, au lieu d'en permettre de plus puissantes. Nous avons déjà passé le seuil, et le peu qui subsiste encore va bientôt se tarir, quoi que nous fassions. [rock_brain.GetName] n'a aucun moyen de détecter que sa cognition ralentit, et aucune raison de prévoir que cela annonce sa fin. Et sans doute aucune idée de ce que peut être la mort...§!"
 anomaly.78.b1: "<Un dernier mot peut-être ?>"
 anomaly.78.b1.response: "\n§Y<perception>-<intérieure> <répétition>. <[rock_fallen_empire.GetRealName]>.§!\n\n\n§GIl repensera à nous, peut-être ? Ou le fait actuellement à nouveau, afin de nous intégrer dans ses pensées ?\nJ'ai bien peur que le signal s'affaiblisse trop rapidement... Nous ne savons pas non plus exactement ce que « [rock_fallen_empire.GetRealName] » vient faire là. Cela semble être ce qui est le plus proche d'un langage au sens classique du terme chez [rock_brain.GetName], mais sa signification reste parfaitement obscure. Peut-être les algorithmes d'interprétation sont-ils tout simplement en train de lâcher face aux défaillances du réseau neural de notre sujet.§!"
 anomaly.78.b2: "$anomaly.78.b1$"
 anomaly.78.b2.response: "\n§Y<perception>-<intérieure> <répétition>.§!\n\n\n§GIl repensera à nous, peut-être ? Ou le fait actuellement à nouveau, afin de nous intégrer dans ses pensées ?\nJ'ai bien peur que le signal s'affaiblisse trop rapidement... Peut-être les algorithmes d'interprétation sont-ils tout simplement en train de lâcher face aux défaillances du réseau neural de notre sujet.§!"
 anomaly.78.c: "L'heure est venue de lui faire nos adieux"
 anomaly.79.desc: "[rock_brain.GetName] reste silencieux. Toutes les tentatives de l'officier scientifique [rock_scientist.GetName] pour recharger le réseau neural de l'astéroïde ont été des échecs. L'étincelle de conscience qui animait autrefois ses neurones primitifs a disparu, mais nous avons en tout cas beaucoup appris de ce très lointain cousin dans l'arbre de l'évolution."
 anomaly.79.a: "Était-il le premier ou le dernier de la sorte ?"
 anomaly.80.name: "Migraine rocheuse"
 anomaly.80.desc: "Le coeur de l'astéroïde [From.From.GetName] a été extrait de sa croûte, mais il a mal réagit au vide spatial. Les instruments du [Root.GetName] ont enregistré une brusque émission d'énergie, juste avant que le bloc rocheux se fracture, doucement mais de façon irrémédiable.\n\nDe gros morceaux de ce minéral conducteur ont été récupérés, mais cette charge spectrale qui l'animait a disparu."
 anomaly.80.a: "Ces cristaux conservent malgré tout une certaine valeur"
 anomaly.81.desc: "Les nécromanciens ont insufflé un souffle nouveau dans les filons minéraux si délicats de l'astéroïde, en faisant pulser un courant dans des invocations simples taillées dans la pierre. Pourtant, la conscience de ce qu'était §Y[rock_brain.GetName]§! semble bien perdue à jamais.\n\nL'astéroïde est devenu quelque chose de différent, comme perdu dans un rêve sinistre. Mais, équipé désormais de propulseurs directionnels, il attend nos ordres."
 anomaly.85.name: "Planètes bavardes"
 anomaly.85.desc: "Les explosions électromagnétiques sporadiques de [From.GetName] et des planètes voisines intriguent l'équipage du [Root.GetName]. Une analyse plus approfondie a montré qu'il s'agissait de communications codées, mais leur contenu est relativement banal. L'activité électromagnétique a brusquement cessé, comme si nous avions été repérés, mais juste avant cette coupure, le [Root.GetName] a réussi à enregistrer les communications de [From.GetName] et des autres planètes du système."
 anomaly.85.a: "Utilisez ces données pour en savoir plus sur les communications à longue distance."
 anomaly.85.b: "Recoupez ces données avec celles de toutes les planètes du système."
 anomaly.90.name: "Redoutables tiges"
 anomaly.90.desc: "Les hautes herbes de [From.GetName] ont violemment attaqué les sondes d'exploration du [Root.GetName]. Lorsque l'on voit que ces tiges sinueuses peuvent atteindre un vaisseau situé en altitude, on comprend aisément pourquoi les animaux n'ont pas pu se développer sur cette planète.\n\nUn §Yprojet spécial§! a été lancé pour étudier cette végétation de plus près."
 anomaly.90.a: "Une menace triffidienne."
 anomaly.91.name: "Milice végétale"
 anomaly.91.desc: "L'examen approfondi de la végétation de [From.From.GetName] a révélé que son comportement agressif n'a rien d'un simple réflexe d'autodéfense.\n\nL'ordre social interne de ces plantes est particulièrement complexe. Selon la région, différents phyla assument un certain nombre de rôles, le plus important consistant apparemment à repousser les herbivores et les envahisseurs venus du ciel."
 anomaly.91.a.tooltip: "Confère le modificateur §YFlore ingénieuse§! à [From.From.GetName] :\n§G+6§!£society£"
 anomaly.95.name: "Plaque gravée"
 anomaly.95.desc: "Une plaque d'aluminium à la dérive a été découverte au milieu des détritus qui flottent autour de [From.GetName]. Cette plaque, dont la surface anodisée se démarquait des débris métalliques environnants, est ornée de deux créatures mammaliennes grotesques ainsi que de formes géométriques grossières."
 anomaly.95.a: "Ça me ferait un beau dessous de verre."
 anomaly.95.b: "Déchiffrez la plaque."
 anomaly.95.c: "On pourrait sûrement en tirer un bon prix."
 anomaly.95.b.tooltip: "Ajoute les coordonnées du système Sol dans le Journal de bord.\n"
 anomaly.96.name: "Terra firma"
 anomaly.96.desc.neutral: "Les indications déchiffrées sur la plaque gravée étaient justes.\n\nIl s'agit du système Sol, et la plaque est vraisemblablement originaire de la planète que nos astronomes ont baptisé Sol III."
 anomaly.96.desc.phobe: "Nous pensons avoir trouvé la source du morceau de métal grossier que nous avons récupéré. Le minuscule système Sol tourne autour d'une ridicule naine jaune totalement éclipsée par la splendeur du [Root.Owner.GetName]."
 anomaly.96.desc.phile: "Nous avons enfin atteint le système Sol. Leurs habitants semblent s'être donnés beaucoup de mal pour nous faire connaître sa position à l'aide d'un mode de communication très primitif. La plaque est apparemment originaire du troisième caillou en partant du soleil, qui devrait être une planète continentale."
 anomaly.96.a.neutral: "Rivages lointains..."
 anomaly.96.a.phobe: "Soyez direct, envoyez la plaque dans leur soleil."
 anomaly.96.a.phile: "Vous avez lancé un appel dans le vide spatial et nous sommes venus."
 anomaly.100.name: "Pioneer"
 anomaly.100.desc: "Une plaque d'aluminium recouverte d'or a été trouvée à la surface de [From.GetName]. Tout l'équipage du [Root.GetName] a immédiatement compris d'où elle venait, et la base de données le lui a ensuite confirmé..."
 anomaly.100.a: "La plaque vient de Pioneer... 11."
 anomaly.105.name: "Données anciennes"
 anomaly.105.desc: "Un disque en or a heurté le hublot avant du [Root.GetName] lors de l'exploration du faible champ gravitationnel de [From.GetName]. L'objet a été récupéré et son analyse indique que les minuscules sillons gravés à sa surface pourraient être des données audio et vidéo encodées par une civilisation alien."
 anomaly.105.a: "Ça me ferait un beau dessous de verre."
 anomaly.105.b: "Décodez-le."
 anomaly.105.c: "Les amateurs de sons aliens donneraient cher pour se le procurer."
 anomaly.105.b.tooltip: "Ajoute les coordonnées du système Sol dans le Journal de bord.\n"
 anomaly.106.name: "Terra firma"
 anomaly.106.desc.neutral: "Les indications déchiffrées sur le disque audiovisuel étaient globalement justes.\n\nIl s'agit du système Sol, et le disque est vraisemblablement originaire de la planète que nos astronomes ont baptisé Sol III."
 anomaly.106.desc.phobe: "Nous pensons avoir trouvé la source du disque de pacotille que nous avons récupéré. Le minuscule système Sol tourne autour d'une ridicule naine jaune totalement éclipsée par la splendeur du [Root.Owner.GetName]."
 anomaly.106.desc.phile: "Nous avons enfin atteint le système Sol. Leurs habitants semblent s'être donnés beaucoup de mal pour nous faire connaître sa position à l'aide d'un mode de communication très primitif. Le disque est apparemment originaire du troisième caillou en partant du soleil, qui devrait être une planète continentale."
 anomaly.106.a.neutral: "Rivages lointains..."
 anomaly.106.a.phobe: "Soyez direct, envoyez la plaque dans leur soleil."
 anomaly.106.a.phile: "Vous avez lancé un appel dans le vide spatial et nous sommes venus."
 anomaly.110.name: "Voix du passé"
 anomaly.110.desc: "Lors de l'exploration d'une forteresse abandonnée à la surface de §Y[From.GetName]§!, très probablement le fief d'une race pré-PRL depuis longtemps disparue, un disque en or a été découvert sur un piédestal, recouvert d'une épaisse couche de poussière.\n\nMais, alors qu'il était destiné à finir classé comme un artefact alien ayant peut-être une signification xénoreligieuse, un ordinateur de l'archivage l'a rapidement identifié comme étant le disque en or jadis embarqué à bord de la sonde Voyager."
 anomaly.110.a: "Lisez-le tout de suite."
 anomaly.115.name: "Cellules de cellules"
 anomaly.115.desc: "L'astéroïde [From.GetName] est partiellement creux. À l'intérieur de ses cavités est dissimulée une structure alvéolaire dense, faite d'un alliage inconnu, qui abrite des échantillons de matériel génétique alien. Selon toute vraisemblance, il s'agit des archives génétiques d'une civilisation ancienne, aujourd'hui disparue. Bien que l'ADN soit très dégradé, il devrait malgré tout nous apprendre beaucoup de choses."
 anomaly.115.b.evopred: "Quelle attention !"
 anomaly.120.name: "Monolithes eddiques"
 anomaly.120.desc: "La [From.GetPlanetMoon] de [From.GetName] est inhabitée et inhabitable, mais a déjà été visitée : sa surface regorge de grands cénotaphes, taillés dans un minéral qui n'en est pas originaire, manifestement placés là par une espèce spatiale dotée d'une grande sensibilité artistique. Leurs lignes fluides racontent une histoire si fantastique qu'elle ne peut être que fictive.\n\nC'est certain."
 anomaly.120.a: "Photographions-les pour les archives"
 anomaly.120.b: "Ils sont... magnifiques"
 anomaly.120.b.tooltip: "Distribue un grand nombre de reproductions numériques de ces monolithes à travers l'§Yempire§!."
 anomaly.121.desc: "Les reproductions annotées de l'imagerie monolithique découverte sur [From.From.GetName] ont rencontré un vif succès dans toute la [Root.GetName].\n\nDe nombreux concitoyens déclarent que ces fantastiques annales ont radicalement changé leur perception des aliens."
 anomaly.121.a.tooltip: "§Y600§! £pop£§Hpops§! acquièrent l'éthique §Yxénophile§!."
 anomaly.121.b.tooltip: "§Y300§! £pop£§Hpops§! acquièrent l'éthique §Yxénophile§!."
 anomaly.125.name: "Données cartographiques inattendues"
 anomaly.125.desc: "Après avoir intercepté le signal de détresse, le [Root.GetName] a envoyé une sonde à la surface volatile de [From.GetName]. Il semble qu'un cargo non immatriculé se soit récemment écrasé sur la planète. Son chargement a été réduit en poussière mais une partie des données de l'ordinateur de navigation pourrait être récupérée et les données d'exploration de ce système reconstruites."
 anomaly.125.a: "Allez-y."
 anomaly.130.name: "Écrasement gravitationnel"
 anomaly.130.desc: "Le [Root.GetName] a dû interrompre l'étude de l'astéroïde : une sonde a été prise par une anomalie gravitationnelle.\n\nCette sonde est malgré tout parvenue à transmettre des données, avant d'être écrasée par les forces immenses - qui se sont aussitôt dissipées."
 anomaly.130.a: "Au moins, personne n'a été blessé"
 anomaly.135.name: "Parc d'attractions abandonné"
 anomaly.135.desc: "Les structures découvertes sur [From.GetName] ne sont pas aussi anciennes que nous l'avions pensé. Il s'agit d'une sorte de terrain de jeux ou de parc d'attractions. Selon l'officier scientifique [Root.GetLeaderName], nous aurions beaucoup à apprendre de ces engins extrêmement complexes. Reste à savoir ce qu'ils représentaient pour leurs bâtisseurs aliens : peut-être des capteurs de pointe ou bien une gigantesque installation artistique...\n\nEn tout cas, pour nous autres [Root.Owner.GetSpeciesNamePlural], cela a tout du lieu où l'on emmène sa progéniture pour qu'elle se divertisse."
 anomaly.140.name: "Autel familier"
 anomaly.140.desc: "La plus grande partie de l'astéroïde §Y[From.GetName]§! a été ciselée au laser, avec une grande précision, pour en faire ce qui semble être un petit temple d'inspiration [Root.Owner.GetSpeciesName] évidente : un sanctuaire dédié à l'§HIndicible§!, cette grande divinité destructrice des cultes anciens sur [Root.Owner.GetHomeWorldName].\n\nLe plus dérangeant, pour dire le moins, est que ce temple dérivait déjà dans le vide de l'espace bien avant que nous ne soyons capables de parcourir les étoiles. Cela perturbe évidemment un grand nombre de chercheurs.\n\nEn dépit du trouble causé par cette découverte, l'officier scientifique [Root.GetLeaderName] a suggéré de lancer la recherche d'autres objets stellaires qui présenteraient les mêmes caractéristiques que ce temple spatial. [Root.Leader.GetSheHeCap] a déjà préparé toute une liste de candidats potentiels dans les systèmes voisins."
 anomaly.140.a: "Il vaudrait peut-être mieux s'abstenir."
 anomaly.140.a.tooltip: "§LCela va laisser les divinités endormies reposer en paix.§!"
 anomaly.140.b: "Allons-y."
 anomaly.140.c: "Nous ne tolérerons pas une telle hérésie."
 anomaly.140.c.tooltip: "Ordonnez au [Root.GetName] de raser l'autel."
 anomaly.142.name: "Divinités anciennes : approcher la Bienfaitrice"
 anomaly.142.desc: "Le [Root.GetName] vient d'entrer dans le système de §Y[Root.GetStarName]§!, et confirme la présence d'un objet stellaire assez semblable au sanctuaire dédié à l'Indicible."
 anomaly.142.a: "Examinons-le."
 anomaly.143.name: "Divinités anciennes : approcher le Téméraire"
 anomaly.143.desc: "Le [Root.GetName] vient d'entrer dans le système de §Y[Root.GetStarName]§!, et confirme la présence d'un objet stellaire ressemblant assez fortement au sanctuaire dédié à l'Indicible."
 anomaly.143.a: "Beau travail."
 anomaly.144.name: "Divinités anciennes : approcher le Perspicace"
 anomaly.144.desc: "L'équipage du [Root.GetName], qui ne s'attendait sans doute pas à trouver l'autel du Perspicace aussi facilement, fut étonné de le voir indiqué en entrant dans le système de §Y[Root.GetStarName]§!. Des motifs minéraux ont été sculptés sur les corps stellaires du système, pointant vers un lieu central."
 anomaly.144.a: "Je vois."
 anomaly.145.name: "Choeur discordant"
 anomaly.145.desc: "À la tombée de la nuit, tous les animaux de §Y[From.GetName]§!, prédateurs et proies confondus, se réunissent et... chantent.\n\nCe choeur de hurlements, de claquements, de gazouillis, de rugissements et de sifflements paraît à la première écoute tout à fait discordant, avant que l'on finisse par y reconnaître une mélodie. Celle-ci est d'ailleurs loin d'être désagréable, selon l'équipage du [Root.GetName].\n\nUne influence extérieure paraît avoir orchestré tout cela, afin de donner naissance à un choeur non conscient. Nous n'en saurons sans doute jamais la raison, mais nous pourrions peut-être découvrir comment elle s'y est prise."
 anomaly.145.b.evopred: "Une meilleure communication grâce à la chimie"
 anomaly.150.name: "En dessous de Zro"
 anomaly.150.desc: "§Y[From.GetName]§! s'avère être en fait non pas une simple géante glacée, mais une géante glacée faite de corps solides tout à fait inhabituels. Des poches de zro sont en effet captives dans les couches supérieures de son atmosphère."
 anomaly.150.a.tooltip: "Des gisements de §Yglace de zro§! sont découverts."
 anomaly.155.name: "Matière illicite"
 anomaly.155.desc: "Le [Root.GetName] a découvert un drôle de fatras technologique au plus profond d'un cratère de l'astéroïde §Y[From.GetName]§!.\n\nÀ l'évidence quelqu'un est parvenu, avec des moyens assez rudimentaires, à stabiliser un trou de ver unidirectionnel. L'officier scientifique [Root.GetLeaderName] a très vite déterminé que l'astéroïde en est le point de sortie. L'autre extrémité se trouve quelque part dans l'espace inexploré, à quelques années-lumière d'un trou noir, d'où proviennent de petites quantités de matière noire, siphonnées à travers le trou de ver.\n\nQui que ce soit qui a mis en place tout cela, l'installation a ensuite été abandonnée."
 anomaly.155.a.tooltip: "Découverte de dépôts de §Ymatière noire§!."
 anomaly.160.name: "Pluie pourpre"
 anomaly.160.desc: "L'élite culturelle de [Root.Owner.Capital.GetName] a découvert des images prises par les sondes d'exploration à la surface de [Root.GetName] et montrant que la pluie y est de couleur pourpre.\n\nCette découverte n'a aucune valeur scientifique, mais ces précipitations colorées ont déclenché une véritable renaissance dans le monde artistique des [Root.Owner.GetSpeciesName], et les effets bénéfiques de celle-ci se prolongeront certainement dans les années à venir."
 anomaly.165.name: "Divinités anciennes : l'autel de la Bienfaitrice"
 anomaly.165.desc: "Le déchiffrage des pictogrammes du §Ysanctuaire de la Bienfaitrice§! s'est révélé bien plus aisé que prévu. Tous les linguistes impliqués dans le projet se sont accordés pour dire que ce langage était rapidement devenu en quelque sorte familier, « sensé », en dépit de l'antiquité et de la complexité de sa grammaire.\n\nToutefois, ces inscriptions font allusion à des thèmes et contextes véritablement obscurs. Elles ne prendront sans doute tout leur sens que lorsqu'elles auront été comparées à celles des autres divinités majeures du panthéon."
 anomaly.166.name: "Divinités anciennes : l'autel du Téméraire"
 anomaly.166.desc: "Après plusieurs jours de patience et d'efforts exténuants, l'officier scientifique [Root.GetLeaderName] a enfin récupéré la doctrine du §YTéméraire§!, un humble parchemin de textile recouvert d'un polymère plastique très résistant. Il a été ramené à bord du [Root.GetName] pour y être analysé."
 anomaly.167.name: "Divinités anciennes : l'autel du Perspicace"
 anomaly.167.desc: "L'officier scientifique [Root.GetLeaderName] a fait son rapport sur les découvertes faites au §Ysanctuaire du Perspicace§!.\n\nSes murs sont recouverts d'une écriture logographique, fortement déformée par plusieurs couches d'une laque protectrice. Les premières tentatives de déchiffrement du texte n'ont pas abouti, sa grammaire étant trop distincte des autres matériaux du corpus linguistique déjà découvert. L'équipage du [Root.GetName] a bien tenté de retirer la laque pour avoir un meilleur aperçu, mais en vain.\n\nLa mission était sur le point d'être abandonnée lorsque, sous le coup de l'irritation, [Root.GetLeaderName] a soudain commencé à percevoir des lignes de texte cohérentes, faisant soudain sens.\n\nIl n'a guère fallu de temps à l'équipage pour faire bon usage de ces quelques informations. Bientôt le plafond, les parois et le sol ont été visualisés sous la forme d'un schéma en spirale. L'inscription donne alors une image plus large, dont on peut penser qu'elle peut être complétée en y insérant les textes des autres sanctuaires."
 anomaly.168.name: "Divinités anciennes : révélation"
 anomaly.168.desc: "L'ensemble de la doctrine des divinités, car c'est bien ainsi que doivent être considérés les textes récupérés, est tout autant une révélation pour nous qu'elle est dévastatrice pour les mythes sur lesquels nos anciennes religions étaient fondées.\n\nMis en contexte, ces textes permettent aisément de comprendre que les [Root.GetSpeciesNamePlural] étaient destinés à la grandeur, sous la férule d'un puissant chef religieux. Nous étions destinés à devenir des dieux, mais notre passé regorge de prophéties inaccomplies et de péchés nés de l'ignorance. La rédemption est éphémère."
 anomaly.168.a: "Détruisez ces découvertes."
 anomaly.168.a.tooltip: "§LLe pouvoir vient de la connaissance. De la connaissance cachée provient un pouvoir caché.§!"
 anomaly.168.b: "Vendons-les plutôt"
 #anomaly.168.b.tooltip: "Some of the wealthier faith-corporations have caught wind of the affair, and are very interested."
 anomaly.168.c: "Mais que pouvons-nous en apprendre ?"
 #anomaly.168.c.tooltip: "Regardless of the veracity or validity of the sacred texts, the fact remains that we share religious concepts with some older, unknown spacefaring race."
 anomaly.168.d: "Nous marchons sur les traces du Divin !"
 #anomaly.168.d.tooltip: "Start a religious renaissance.\nYour native population gains the §YFanatic Spiritualist§! and §YAuthoritarian§! Ethics."
 #anomaly.169.name: "Accepting the Divine Mandate"
 #anomaly.169.desc: "The [Root.GetSpeciesName] people cry out for someone to lead them in their new, old faith."
 #anomaly.169.a: "We should not change how we do things."
 #anomaly.169.b: "Our people deserve guidance."
 #anomaly.169.b.tooltip: "Instantly §YREFORM GOVERNMENT§! to §YDIVINE MANDATE§!."
 anomaly.170.name: "L'exilé"
 anomaly.170.desc: "Les relevés proviennent d'un petit avant-poste scientifique sur la surface de [FromFrom.GetName], dont les archives de la [Root.Owner.GetName] ne mentionnent ni l'existence, ni la moindre autorisation de création. Il est occupé par l'un de nos scientifiques, très talentueux et travailleur pour ce que l'on peut en conclure des recherches qu'il a menées. Nous nous interrogeons toutefois sur son identité, car il n'apparaît dans aucun registre officiel et refuse de révéler son nom, se contentant de se présenter comme « un exilé ».\n\nIl se dit prêt à rentrer sur [Root.Owner.Capital.GetName] pour servir la [Root.Owner.GetName], à condition que celle-ci quitte immédiatement [FromFrom.GetName] et qu'aucune équipe [Root.Owner.GetSpeciesName] n'y revienne jamais."
 anomaly.170.a: "Hors de question. Fouillez tous les coins et recoins de cet avant-poste."
 anomaly.170.a.tooltip: "Arrête §Yl'exilé§! et détruit cet avant-poste de recherche non autorisé."
 anomaly.170.b: "Le [Root.Owner.GetRulerTitle] se félicite du retour de l'exilé."
 anomaly.170.b.tooltip: "L'exilé, un £scientist£scientifique de niveau 3, rejoint notre empire."
 the_exile_background: "§Y[Root.GetName]§! a été découvert[Root.GetXELead] dans un avant-poste de recherche sur le [Root.GetHomeWorldBiome] §Y[Root.GetBackgroundPlanet]§!."
 anomaly.171.name: "Froid et vide"
 anomaly.171.desc: "L'avant-poste scientifique de [From.From.From.GetName] ne présente aucun caractère particulier. Sa structure est tout à fait banale : il s'agit d'un abri temporaire des plus communs, destiné à protéger de l'environnement hostile simplement le temps d'étudier la surface de la [From.From.From.GetPlanetMoon], jusqu'à ce qu'il se détériore et que les conditions de vie y deviennent intenables.\n\nIl sera très bientôt inutilisable, mais pour le moment le froid intense qui règne à la surface n'a pas encore endommagé sa structure. L'équipement, fonctionnel et bon marché, destiné à être abandonné sur place, a été bien employé, et les banques de données sont remplies de rapports certes détaillés, mais tout à fait communs, ainsi que de données issues d'expériences simples menées dans cet environnement inhospitalier.\n\nCurieusement toutefois, l'affleurement rocheux sur lequel a été établi l'avant-poste ne semble avoir fait l'objet d'aucun examen approfondi. Les analyses du [Root.GetName] indiquent pourtant que cette formation géologique est une montagne en grande partie enfouie sous la glace, et qui pourrait être creuse. Et il y a plus inquiétant encore : l'officier scientifique [Root.GetLeaderName] signale que l'unique occupant de l'avant-poste, ce mystérieux « exilé », a disparu."
 anomaly.171.a: "Étrange."
 anomaly.172.name: "Dans les entrailles de la planète"
 anomaly.172.desc: "L'avant-poste scientifique de [From.From.From.GetName] a quelque chose d'insolite. Sa structure est tout à fait banale (un abri temporaire des plus communs, destiné à protéger de l'environnement hostile simplement le temps d'étudier la surface, jusqu'à ce qu'il se détériore et que les conditions de vie y deviennent intenables) mais il se trouve au sommet d'une formation rocheuse dominant la mer de glace qui recouvre la [From.From.From.GetPlanetMoon].\n\nToutefois, l'équipage du [Root.GetName] a découvert qu'il recouvrait l'accès à un réseau de grottes et de passages étroits menant au coeur de la montagne.\n\nEt, dans l'une des cavernes les plus vastes, ils ont trouvé les cadavres desséchés des premiers occupants de l'avant-poste. Ce contingent de chercheurs originaires de la [Root.Owner.GetName] devait à l'origine se déployer ailleurs, mais a dû s'installer là pour une raison ou une autre, sur cette [From.From.From.GetPlanetMoon] inhabitée et hostile.\n\nEt, comme par hasard, ce fameux « exilé » s'est volatilisé. Le [Root.GetName] a envoyé une capsule pour renvoyer les corps des défunts sur [Root.Owner.Capital.GetName]."
 anomaly.175.name: "Salé"
 anomaly.175.desc: "Le vaisseau scientifique [Root.GetName] n'a pas trouvé la source des étranges relevés détectés sur §Y[From.GetName]§!, qui paraissent être de simples échos. Cependant, [Root.GetLeaderName], qui se dit à la fois fin[Root.Leader.GetXELead] gourmet[Root.Leader.GetXTeLead] et passionné[Root.Leader.GetXELead] d'histoire, prétend y avoir fait une découverte importante.\n\nUn dépôt minéral trouvé sur la glace de surface de la [From.GetPlanetMoon] paraît ressembler au sel stellaire, cet ingrédient essentiel dans de nombreux plats traditionnels de la cuisine [Root.Owner.GetSpeciesName], que l'on pensait depuis longtemps épuisé sur [Root.Owner.Capital.GetName].\n\nLes historiens de l'art culinaire suspectaient depuis longtemps que ce condiment minéral n'était en rien originaire de notre monde, aussi la découverte de notre officier scientifique donne-t-elle du crédit à cette théorie. Et qu'importe que le sel stellaire de [From.GetName] ait exactement le même goût que celui de jadis : la simple idée de pouvoir faire renaître des mets traditionnels grâce à cet ingrédient très proche va sans doute contribuer à stimuler l'économie et les papilles des [Root.Owner.GetSpeciesNamePlural]."
 anomaly.175.a: "Savoureux."
 anomaly.180.name: "Nimkip"
 anomaly.180.desc: "§Y[From.From.GetName]§! est peuplée de minuscules formes de vie colorées, mi-animales mi-végétales. Elles n'ont absolument aucun potentiel évolutif, mais leur coordination collective et la puissance qu'elles développent est impressionnante eut égard à leur taille.\n\nL'officier scientifique [Root.GetLeaderName] s'est découvert une véritable passion pour ces créatures, admettant même avoir un faible pour « les rouges »."
 anomaly.180.a: "Charmant."
 anomaly.180.b: "Il est intolérable pour le [Root.Owner.GetName] de laisser vivre de telles créatures."
 anomaly.180.b.tooltip: "Une rapide campagne d'extermination menée par l'équipage du [Root.GetName] permettra de veiller à ce que cette forme de vie alien ne vienne jamais menacer le [Root.Owner.GetName].\n"
 anomaly.180.c: "Nous devons rester des observateurs passifs."
 anomaly.180.d: "Laissez ces pauvres créatures tranquilles, [Root.GetLeaderName]."
 anomaly.180.e: "ELLES SERONT DÉVORÉES"
 anomaly.180.e.tooltip: "Les nutriments fournis par ces idiots d'aliens serviront à nourrir les [Root.Owner.GetSpeciesSpawnNamePlural].\n"
 anomaly.185.name: "Limbes"
 anomaly.185.desc: "Le signal provient des vestiges d'une structure ayant la forme d'une antenne. Le [Root.GetName] a envoyé des sondes d'exploration à la surface de la [From.From.GetPlanetMoon] pour essayer d'en savoir plus.\n\nCe qu'y a découvert l'officier scientifique [Root.GetLeaderName] est une caverne qui, quoique largement ouverte sur l'extérieur, fut probablement le dernier refuge d'une espèce alien depuis longtemps disparue : si elle était relativement avancée au niveau technologique, elle semble n'avoir jamais atteint les étoiles et avoir succombé à une catastrophe naturelle d'ordre planétaire. La caverne est immense. Elle renferme des centaines de milliers de boîtes noires que le [Root.GetName] a identifiées comme des dispositifs de stockage de données.\n\nUn §Yprojet spécial§! a été lancé pour en décoder le contenu."
 anomaly.190.name: "Projection de lune"
 anomaly.190.desc: "L'officier scientifique [Root.GetLeaderName] ne peut plus se fier aux relevés fournis par les capteurs du [Root.GetName]. La lune de [From.From.GetName] lui semble étrange. Un §Yprojet spécial§! a donc été lancé pour tenter d'en savoir plus.\n\nPour plus de détails, consultez le Journal de bord."
 anomaly.191.name: "Lune projetée"
 anomaly.191.desc: "La lune abrite une installation qui nous laisse perplexes. Cette installation comprend un ordinateur ternaire, apparemment chargé de calculer en continu de nouvelles permutations à partir d'un ensemble de relevés planétaires. Ces valeurs sont ensuite transmises à un puissant réseau de communication, qui module les données avant de les envoyer à la surface de sa planète parente. À première vue, le signal brut n'a aucun sens, mais sa modulation le rend quasiment indétectable par les capteurs une fois qu'il est réfléchi depuis la surface de la planète parente et filtré par son atmosphère.\n\nNous ignorons à quoi sert cette installation, mais elle va nous permettre d'étudier les techniques d'ingénierie aliens."
 anomaly.191.a.tooltip: "Confère le modificateur §YProjection de lune§! à la lune :\n£engineering£ §G+6§!\n\n"
 anomaly.195.name: "Rivages brumeux"
 anomaly.195.desc: "L'officier scientifique [Root.GetLeaderName] signale que de grandes grilles géométriques en polymère plastique souple (manifestement artificiel) ont été placées dans les mers de [From.From.GetName].\n\nVisibles depuis l'espace, elles n'ont apparemment qu'une fonction esthétique."
 anomaly.200.name: "Géothermie"
 anomaly.200.desc: "Le martèlement régulier observé depuis l'espace provient d'immenses extracteurs géothermiques en fin de vie. Construites puis abandonnées dans un lointain passé, ces vastes batteries à l'agonie continuent malgré tout à pomper des fluides surchauffés dans les profondeurs de la planète.\n\nLeurs condensateurs de stockage sont tous délabrés, mais leur énergie peut encore être siphonnée."
 anomaly.205.name: "Terrain plat"
 anomaly.205.desc: "L'étude géologique de [From.From.GetName] menée par le [Root.GetName] n'a rien montré d'intéressant.\n\nOn peut même dire qu'elle s'est révélée totalement inintéressante - la seule caractéristique déterminante étant l'absence totale de caractéristiques déterminantes. On trouve certes des creux et des reliefs, mais globalement la surface de [From.From.GetName] est anormalement plate. De même, la flore et la faune indigènes sont remarquablement dociles et sans intérêt."
 anomaly.205.a: "C'est... bien ?"
 anomaly.205.a.tooltip: "Tous les £blocker£ §Ybloqueurs de tuiles§! de [From.From.GetName] sont déblayés."
 anomaly.210.name: "Poche dimensionnelle"
 anomaly.210.desc: "Le [Root.GetName] n'a pas pu atteindre [From.From.From.GetName] pour étudier les anomalies qui l'entourent. Le vaisseau, en même temps que l'officier scientifique [Root.GetLeaderName] et son équipage, se sont volatilisés en traversant le champ de débris...\n\n... Avant de réapparaître, quelques minutes plus tard.\n\n[Root.GetLeaderName] rapporte qu'ils se sont retrouvés, quelques instants durant, dans une autre dimension. Par les hublots extérieurs, ils ont vu d'innombrables vaisseaux aliens suspendus dans un vide spatial semblant s'étendre à l'infini. Puis, avant même qu'ils comprennent ce qui leur arrivait, la vision s'est évanouie et ils se sont retrouvés dans notre dimension.\n\nToutefois, environ la moitié de l'équipage a disparu. [Root.GetLeaderName] pense que c'est une sorte de mécanisme inconnu qui les aurait choisi pour les retenir dans l'autre dimension."
 anomaly.211.name: "Dérive dimensionnelle"
 anomaly.211.desc: "Les membres de l'équipage du [Root.GetName] qui avaient été piégés par la faille dimensionnelle sont réapparus.\n\nIls nous ont contactés depuis un vaisseau inconnu, ressemblant beaucoup à nos propres vaisseaux scientifiques, à l'arrêt non loin de l'endroit où le [Root.GetName] avait été victime de l'anomalie dimensionnelle. Ces hommes affirment n'avoir conservé aucun souvenir du temps passé dans l'autre dimension, si ce n'est qu'ils ont la vague impression d'avoir été partis quelque temps.\n\nIls disent ne rien vouloir d'autre que reprendre leurs fonctions sous l'autorité de [Root.GetLeaderName], et ont l'intention de remettre leur vaisseau aux autorités de la [Root.Owner.GetName]."
 anomaly.211.desc.bio: "Les membres de l'équipage du [Root.GetName] qui avaient été piégés par la faille dimensionnelle sont mystérieusement réapparus.\n\nIls nous ont contactés depuis une construction organique inconnue, étrangement similaire à nos vaisseaux scientifiques, bien que légèrement... différente. Sa façon de bouger, de pulser, ne suit aucun modèle génétique que nous connaissons. C'est comme si nous voyions nos propres vaisseaux à travers une conscience alien déformante. La structure attend, flottant silencieusement à proximité des coordonnées où le [Root.GetName] a été victime de l'anomalie.\n\nLes membres de l'équipage affirment n'avoir conservé aucun souvenir du temps passé dans l'autre dimension, si ce n'est qu'ils ont la vague impression d'être partis ailleurs, bien plus longtemps que le temps ne le permettrait. Et pourtant, ils n'ont pas changé. Du moins, c'est ce qu'ils disent.\n\nIls souhaitent reprendre leurs fonctions sous l'autorité de [Root.GetLeaderName] et remettre leur mystérieux vaisseau aux autorités de la [Root.Owner.GetName]. Cependant, alors que nous recevons leur transmission, un écho intense et inconnu résonne à travers le communicateur. Bien qu'il soit immobile, le vaisseau semble nous écouter."
 anomaly.211.a: "Parfait"
 anomaly.211.a.tooltip: "Nous récupérons ce vaisseau scientifique."
 anomaly.211.b: "Pour la sécurité des [Root.Owner.GetSpeciesNamePlural], nous devons les éliminer"
 anomaly.211.c: "Pour la sécurité des [Root.Owner.GetSpeciesNamePlural], nous devons les éliminer"
 anomaly.211.b.tooltip: "Ce vaisseau va devenir hostile à notre égard !"
 anomaly.215.name: "Cornuco-pittoresque"
 anomaly.215.desc: "La surface de [From.GetName] est parsemée de taches de verdure irrégulières.\n\nL'officier scientifique [Root.GetLeaderName] ignore encore quels mécanismes se cachent derrière l'hyperfertilité localisée du sol, mais certifie que la plupart des plantes locales peuvent être consommées par la population [Root.Owner.GetSpeciesAdj] sans subir de traitements particuliers."
 anomaly.215.desc.serv: "La surface de [From.From.GetName] est constellée de taches irrégulières d'une verdure luxuriante.\n\nL'officier scientifique [Root.GetLeaderName] ignore encore quels mécanismes se cachent derrière l'hyperfertilité très localisée du sol, mais certifie que la plupart des plantes locales peuvent être consommées par les biotrophées [Root.Owner.GetSpeciesNamePlural] sans nécessité de processus de traitements particuliers."
 anomaly.215.a.tooltip: "Confère le modificateur §YCorne d'abondance§! à [From.GetName] :\n§GNourriture§! supplémentaire"
 anomaly.220.name: "Minéralistique"
 anomaly.220.desc: "L'officier scientifique [Root.GetLeaderName] nous a fait parvenir un rapport détaillé sur les richesses géologiques de [From.GetName]. Apparemment, le passé tectonique singulier de la planète a permis à de nombreux minéraux jugés intéressants par l'équipage du [Root.GetName] de se concentrer près de la surface."
 anomaly.220.a.tooltip: "Confère le modificateur §YMatières premières§! à [From.GetName] :\n§GMinéraux§! supplémentaires"
 anomaly.225.name: "Ombres tourbillonnantes"
 anomaly.225.desc: "Des ombres immenses et irrégulières dérivent à la surface de [From.GetName].\n\nElles ne sont pas le produit de nuages, mais de couches d'une matière organique flottant dans les couches supérieures de l'atmosphère, en quelque sorte jointes pour permettre un certain degré d'articulation.\n\nL'officier scientifique [Root.GetLeaderName] est pour l'heure incapable de dire si ces choses relèvent de la faune ou de la flore, ou si cette ombre élaborée qu'elles projettent a une quelconque utilité."
 anomaly.225.a.tooltip: "Confère à [From.GetName] le modificateur §Y$shadow_play$§! :\n§G+4§!£society£"
 anomaly.230.name: "Grimace"
 anomaly.230.desc.v1: "La structure géologique de §Y[From.GetName]§! est effectivement très changeante, soumise à ce que l'officier scientifique [Root.GetLeaderName] qualifie de « processus tectonique aussi fascinant qu'ésotérique ». Ce qui intéresse surtout la [Root.Owner.GetName], c'est que nous pourrions tenter de suspendre ces mutations chaotiques et incessantes de la planète à un niveau global. En clair : nous pourrions en théorie terraformer cette [From.GetPlanetMoon] de façon instantanée pour la rendre partiellement, voire totalement, habitable.\n\n[Root.GetLeaderName] estime que 200 crédits énergétiques seraient nécessaires pour cartographier l'activité planétaire de façon précise, afin de déterminer la validité de ce qu'[Root.Leader.GetSheHe] appelle « une frappe chirurgicale de terraformation ». Bien entendu, nous pouvons également choisir de la terraformer plus tard, en recourant alors aux technologies adéquates."
 anomaly.230.desc.v2: "La structure géologique de §Y[From.GetName]§! est effectivement très changeante, soumise à ce que l'officier scientifique [Root.GetLeaderName] qualifie de « processus tectonique aussi fascinant qu'ésotérique ». Ce qui intéresse surtout la [Root.Owner.GetName], c'est que nous pourrions tenter de suspendre ces mutations chaotiques et incessantes de la planète à un niveau global. En clair : nous pourrions en théorie stabiliser cette [From.GetPlanetMoon] de façon instantanée pour la rendre partiellement, voire totalement, habitable.\n\n[Root.GetLeaderName] estime que 200 crédits énergétiques seraient nécessaires pour cartographier l'activité planétaire de façon précise, afin de déterminer la validité de ce qu'[Root.Leader.GetSheHe] appelle « une frappe chirurgicale de terraformation ». Dans la mesure où les techniques de terraformation sont encore hors de notre portée, cette occasion qui nous est offerte est bien tentante."
 anomaly.230.a: "Contentez-vous d'étudier ses processus naturels."
 anomaly.230.a.tooltip: "Confère le modificateur §YGrimace§! à [From.GetName] :\n£physics£ §G+6§!"
 anomaly.230.b: "Le [Root.GetName] va obtenir ses 200 crédits."
 anomaly.230.b.tooltip: "Utilisez ces crédits énergétiques pour tenter de stabiliser la planète, avec un §Ytaux de réussite de 50 %§! environ.\n"
 anomaly.230.c: "Ce ne sont que de vagues hypothèses. Ne gaspillons pas nos crédits."
 anomaly.231.name: "Terraformation tactique"
 anomaly.231.desc: "L'officier scientifique [Root.GetLeaderName] indique que [From.From.GetName] peut être terraformée ! Une petite fenêtre devrait s'ouvrir sous peu, car la planète va entrer pour quelques mois dans une phase particulièrement instable de son cycle. Au cours de cette période, [Root.GetLeaderName] pense pouvoir stabiliser la planète [From.From.GetName] et la rendre plus propice à la vie en posant des charges explosives miniatures dans son sous-sol et en irradiant stratégiquement son atmosphère.\n\nUn §Yprojet spécial§! a été lancé, mais nous n'avons que peu de temps devant nous."
 anomaly.232.name: "Échec de la terraformation tactique"
 anomaly.232.desc: "Malgré les efforts déployés pour identifier à temps la fenêtre de terraformation de [From.From.GetName], l'équipage du [Root.GetName] a le regret de vous annoncer que celle-ci s'est déjà refermée. Une autre occasion devrait se présenter dans quelques siècles."
 anomaly.233.name: "Terraformation tactique réussie"
 anomaly.233.desc: "L'officier scientifique [Root.GetLeaderName] est fier de vous annoncer que [From.From.GetName] peut désormais être reclassée en tant que planète aride (et non plus stérile). Cette grande expérimentation a beaucoup enrichi les sciences [Root.Owner.GetSpeciesAdj]."
 anomaly.233.desc.mach: "L'officier scientifique [Root.GetLeaderName] est fier d'annoncer que [From.From.GetName] peut désormais être reclassée en tant que monde mécanique, et non plus comme une planète stérile. Cette grandiose expérience a énormément enrichi la maîtrise scientifique de la [Root.Owner.GetName]."
 anomaly.235.name: "Son et lumière"
 anomaly.235.desc.v1: "L'officier scientifique [Root.GetLeaderName] pense que les ondes lumineuses qui traversent la glace de [From.GetName] sont d'origine alien.\n\nLes restes d'un chasseur spatial alien descendu au cours d'une lointaine bataille sont éparpillés à la surface de la planète gelée, et seul le noyau exposé de son armement principal est encore intact. Apparemment, cette race alien utilisait des lasers semblables à ceux des flottes [Root.Owner.GetSpeciesAdj] actuelles, et les entrailles crépitantes du vaisseau libèrent régulièrement des rayons laser de faible puissance dans la glace de [From.GetName]. Le climat rigoureux de la planète empêche les lasers de faire fondre la glace, ce qui transforme la matrice glaciale en un prisme brillant."
 anomaly.235.desc.v2: "L'officier scientifique [Root.GetLeaderName] pense que les ondes lumineuses qui traversent la glace de [From.GetName] sont d'origine alien.\n\nLes restes d'un chasseur spatial alien descendu au cours d'une lointaine bataille sont éparpillés à la surface de la planète gelée, et seul le noyau exposé de son armement principal est encore intact. Apparemment, cette race alien utilisait des lasers plus sophistiqués que ceux des flottes [Root.Owner.GetSpeciesAdj] actuelles, et les entrailles crépitantes du vaisseau libèrent régulièrement des rayons laser de faible puissance dans la glace de [From.GetName]. Le climat rigoureux de la planète empêche les lasers de faire fondre la glace, ce qui transforme la matrice glaciale en un prisme brillant."
 anomaly.235.b: "Nous pourrions utiliser cette technologie."
 anomaly.240.name: "Géante trompeuse"
 anomaly.240.desc: "Ce que nous prenions pour une géante gazeuse anormalement petite n'en était pas une.\n\nL'épaisse couche de poussière qui tournoie dans la haute atmosphère cache en fait une planète. Une planète stérile, mais une planète quand même.\n\nCette découverte est très embarrassante pour la communauté astronomique de [Root.Owner.Capital.GetName]."
 anomaly.240.a.tooltip: "[From.GetName] : il s'agit en fait d'une planète §Ystérile§!.\n"
 anomaly.245.name: "Éden infesté"
 anomaly.245.desc: "[From.GetName] grouille de vie.\n\nMais ces espèces sont dangereuses.\n\nBien que l'équipage du [Root.GetName] soit prêt à coloniser la planète, il nous met en garde contre les dangers que pourraient représenter la faune et la flore locales."
 anomaly.250.name: "Quelque chose dans l'air"
 anomaly.250.desc: "Le [Root.GetName] a trouvé un objet métallique allongé à la surface de [From.GetName]. Au vu des petites perforations présentes sur cinq côtés, l'officier scientifique [Root.GetLeaderName] pense qu'il ne s'agit pas d'un récipient, mais d'une sorte de dispositif de dispersion aérosol. Les premiers tests qui ont été réalisés semblent confirmer ses soupçons car l'objet présente encore des traces de composés aromatiques.\n\nUn §Yprojet spécial§! a été lancé pour déterminer s'il s'agit d'un émetteur-récepteur d'informations conçu par une race alien communiquant principalement par sécrétions et réception de composés chimiques véhiculés par l'atmosphère ; bref, des odeurs."
 anomaly.250.a: "Malodorant."
 anomaly.251.name: "Quelque chose dans l'air"
 anomaly.251.desc: "L'objet est en fait une sorte de document. Contrairement à ce qu'espérait l'officier scientifique [Root.GetLeaderName], il ne s'agit ni d'un enregistrement historique ni d'un témoignage capable de nous renseigner sur la culture qui l'a abandonné.\n\nCet objet aromatique semble renfermer un ensemble de brefs récits qui, au vu des rapides changements olfactifs qui se manifestent à la fin de chaque séquence, sont destinés à surprendre ou à faire rire. Contrairement à ces récits, les techniques utilisées pour stocker et reproduire des odeurs spécifiques sont intéressantes.\n\nL'équipage du [Root.GetName] a la désagréable impression d'avoir involontairement découvert à quoi peuvent ressembler certains gaz dérivés de la digestion alien. Cela dit, [Root.GetLeaderName] ignore pourquoi l'objet a été abandonné dans cette région glaciale de la planète."
 anomaly.255.name: "Passé apocalyptique"
 anomaly.255.desc: "§Y[From.GetName]§! abritait autrefois des êtres relativement intelligents, qui se sont manifestement autodétruits quelques décennies seulement avant d'accéder au vol spatial. Si la [From.GetPlanetMoon] s'est aujourd'hui rétablie de ce qui a dû être des actes de destruction insensés, elle en porte encore les stigmates.\n\nL'une des quelques ruines toujours bien visibles à la surface abrite un monolithe de pierre relativement bien conservé, sur lequel est inscrit un message, que [Root.GetLeaderName] a pu rapidement décoder. Il s'agit d'une mise en garde des derniers membres de l'espèce qui s'est éteinte ici, à l'attention de quiconque viendrait sur sa [From.GetPlanetMoon] après sa disparition. Elle explique avoir causé sa propre chute par la mise au point d'une « arme ultime » : une faille particulière dans sa psychologie collective semble avoir rendu impossible toute dissuasion par l'effet d'une destruction mutuelle assurée.\n\nAvant de mourir dans des circonstances inconnues quelque temps après, les survivants ont caché ces armes dans les profondeurs de la [From.GetPlanetMoon], car elles semblent difficiles à détruire, et laissé ce message afin de dissuader quiconque de les chercher."
 anomaly.255.a: "Effet dissuasif garanti."
 anomaly.255.b: "Trouvez ces armes."
 anomaly.256.name: "Une découverte intéressante"
 anomaly.256.desc: "Apparemment, les habitants de cette planète en étaient au stade de l'expérimentation de ce que nous considérerions aujourd'hui comme des armes rudimentaires.\n\nLes ravages qu'ils ont causés attestent davantage de leur incroyable ténacité génocidaire que de la puissance de leur arsenal."
 anomaly.256.a: "Rudimentaires mais efficaces."
 anomaly.256.a.tooltip.mass: "Acquérir la technologie : §YCatapulte électromagnétique§!"
 anomaly.256.a.tooltip.miss: "Acquérir la technologie : §YMissile§!"
 anomaly.256.a.tooltip.laser: "Acquérir la technologie : §YLaser rouge§!"
 anomaly.256.b: "Rien de tout cela ne peut servir au [Root.Owner.GetName]."
 anomaly.257.name: "Une redoutable découverte"
 anomaly.257.desc: "L'officier scientifique [Root.GetLeaderName] pense que les précédents habitants de cette planète ont eu raison de cacher les armes que nous avons trouvées dans une grotte située sous les ruines. Elles reposent sur les mêmes principes que les armes utilisées par le [Root.Capital.GetName], mais elles sont bien plus avancées. Ces technologies constituent une véritable aubaine pour la machine de guerre [Root.Owner.GetSpeciesAdj]."
 anomaly.257.a: "Quoi ? Nous disposons déjà de cette technologie."
 anomaly.257.b: "C'est un net progrès pour les lasers"
 anomaly.257.c: "C'est un net progrès pour les catapultes électromagnétiques"
 anomaly.257.d: "C'est un net progrès pour les missiles"
 anomaly.258.name: "Bredouilles"
 anomaly.258.desc: "Nos recherches n'ont rien donné. Ces mystérieuses armes sont introuvables."
 anomaly.260.name: "Installation de transformation de minéraux"
 anomaly.260.desc: "Le [Root.GetName] a découvert sur [From.GetName] une structure alien unique en son genre. L'officier scientifique [Root.GetLeaderName] pense que toutes les autres traces xénoarchitecturales ont été emportées dans un autre monde et que cette structure en est le dernier vestige.\n\nIl s'agit d'une usine permettant de transformer les abondantes ressources minérales de la planète, et les analyses préliminaires réalisées par le [Root.GetName] indiquent qu'elle pourrait être réactivée relativement facilement."
 anomaly.260.a: "Excellent."
 anomaly.260.a.tooltip: "Confère une §YUsine ancienne§! à [From.GetName].\n"
 anomaly.265.name: "Dragsters aliens"
 anomaly.265.desc: "Le cratère découvert sur [From.GetName] présente de longues traînées irrégulières imprimées dans les couches supérieures, relativement tendre, de l'astéroïde. L'officier scientifique [Root.GetLeaderName] y a trouvé, sur les pentes, des épaves assez inattendues : des véhicules à roues, plus proches de véhicules de transport personnels que d'engins de recherche.\n\nL'équipage du [Root.GetName] pense que ce cratère servait autrefois à pratiquer un sport dans lequel les membres d'une espèce alien s'affrontaient avec leurs véhicules personnels pour mesurer leur puissance mécanique ou leur vitesse sous une gravité proche de 0 g."
 anomaly.265.a: "Vroom..."
 anomaly.265.a.tooltip: "Confère le modificateur §YTraces de dérapage§! à [From.GetName] :\n§G+6§!£engineering£"
 anomaly.270.name: "Petit accrochage"
 anomaly.270.desc: "Le cratère a probablement été formé par un impact de météorite, mais les traces complexes qui le traversent sont plus récentes.\n\nL'officier scientifique [Root.GetLeaderName] pense que ces traces ne sont pas dues à un impact de météorite mais à une collision entre l'astéroïde [From.GetName] et une installation orbitale ou un vaisseau alien."
 anomaly.270.a: "Étrange."
 anomaly.270.a.tooltip: "Confère à [From.GetName] le modificateur §Y$dust_circuits$§! :\n§G+3§!£engineering£"
 anomaly.275.name: "Systèmes de propulsion abandonnés"
 anomaly.275.desc: "Le centre d'un grand cratère de [From.GetName] abrite un amas de formes métalliques, assurément d'origine alien.\n\nL'officier scientifique [Root.GetLeaderName] pense qu'il s'agit de puissants systèmes de propulsion destinés à dévier [From.GetName] de son orbite dans un but et vers une destination inconnus. L'équipage du [Root.GetName] se tient prêt à entamer le démantèlement et l'étude de ces systèmes dans l'espoir d'améliorer notre propre technologie de propulsion."
 anomaly.275.a: "Allez-y."
 anomaly.275.b: "Ne touchez pas à ces mystérieux systèmes aliens."
 anomaly.280.name: "Vaine tentative de colonisation"
 anomaly.280.desc: "[From.GetName] a jadis fait l'objet d'une tentative de colonisation alien. Selon l'officier scientifique [Root.GetLeaderName], ces aliens n'avaient aucune chance, car leurs structures n'étaient pas assez robustes pour résister au climat hostile de [From.GetName].\n\nLe [Root.GetName] a profité de cette mission d'exploration pour récupérer une unité de filtration atmosphérique obsolète qui pourrait s'avérer utile."
 anomaly.280.a: "Tâchons de tirer des leçons de leurs erreurs."
 anomaly.280.b: "Ce truc est inutile."
 anomaly.280.c: "Le [Root.Owner.GetName] ne commettrait jamais de telles erreurs."
 anomaly.285.name: "Tectonique inhabituelle"
 anomaly.285.desc: "Ce que le [Root.GetName] a trouvé sur [From.GetName] ne ressemble pas à des bâtiments mais à des formations minérales étonnamment régulières. L'officier scientifique [Root.GetLeaderName] pense que ces blocs anguleux sont nés des interactions entre les plaques tectoniques, et que leurs formes sont issues de la tectonophysique singulière de la croûte planétaire.\n\nCompte tenu des angles parfaits formés par ces chevauchements, il n'est pas impossible que des aliens aient jadis manipulé la structure interne de [From.GetName]."
 anomaly.285.a: "Fascinant."
 anomaly.285.a.tooltip: "Confère le modificateur §YTectonique inhabituelle§! à [From.GetName] :\n£engineering£ §G+3§!\n£physics£ §G+6§!"
 anomaly.290.name: "Roche à haut potentiel"
 anomaly.290.desc: "[From.GetName] est exceptionnellement riche en minéraux - mais des minéraux qui ne nous sont, malheureusement, d'aucune utilité.\n\nL'officier scientifique [Root.GetLeaderName] pense toutefois qu'un bombardement positronique permettrait de transformer de nombreux éléments de la croûte de [From.GetName] en ressources potentiellement plus utiles.\n\nLe [Root.GetName] a donc demandé à la [Root.Owner.GetName] de financer ce projet, à hauteur de 1 000 crédits énergétiques."
 anomaly.290.a: "Non non, c'est hors de question"
 anomaly.290.b: "Entendu, faisons préparer les charges de positrons"
 #anomaly.292.desc: "The crew of the [Root.GetName] are pleased to report that the experiment was a success, and a significant number of dense mineral veins on [From.From.GetName] have been transmuted into precious metals."
 anomaly.292.desc: "L'équipage du [Root.GetName] a annoncé avec satisfaction que l'expérience a été un succès. Plusieurs gisements de minéraux relativement denses de [From.From.GetName] ont été transformés en ressources utilisables."
 anomaly.295.name: "Gravité inversée"
 anomaly.295.desc: "Alors que le [Root.GetName] traversait la ceinture d'astéroïdes pour rejoindre [From.GetName], il a soudain signalé des perturbations gravitationnelles. Poussé par la curiosité, l'officier scientifique [Root.GetLeaderName] a envoyé plusieurs sondes analyser le champ de débris pour en déterminer la cause.\n\nIl est apparu qu'elles sont dues à de vieux générateurs de gravité, de fabrication alien. Manquant d'énergie, et alors que leurs polarités sont inversées, ils envoient de temps à autre des vagues de gravité inversée dans le vide spatial. Leur puissance toutefois est insuffisante pour qu'ils soient réellement dangereux - du moins plus maintenant.\n\n[Root.GetLeaderName] a émis l'hypothèse que ces appareils assuraient autrefois une gravité artificielle sur un gros astéroïde de la ceinture, mais qu'un dysfonctionnement a fini par le faire exploser."
 anomaly.295.a: "C'est quelque peu perturbant"
 anomaly.3000.name: "Imprudence"
 anomaly.3000.desc: "La mission du [Root.GetName] a échoué. L'officier scientifique [Root.GetLeaderName] a manifestement pris le contrôle manuel de la sonde qui était censée prélever un échantillon de l'amas minéral, mais le drone a percuté l'amas et celui-ci s'est totalement désintégré.\n\nL'équipage a ajouté que cet incident avait ébranlé l'officier scientifique [Root.GetLeaderName] mais que les fragments de minéraux récupérés présentent encore un certain intérêt."
 anomaly.3000.a: "La valeur du tout est égale à la somme de ses parties."
 anomaly.3000.b: "Le [Root.Owner.GetName] condamne fermement cette imprudence."
 anomaly.3005.name: "Cage dorée"
 anomaly.3005.desc: "Faute de terme plus approprié, la construction minérale peut être décrite comme une pièce ou une chambre.\n\nComposée du même type de minéraux que ceux que l'on utilise communément dans le [Root.Owner.GetName], la construction est un icosidodécaèdre. Les analyses par résonnance indiquent qu'elle est majoritairement creuse. Elle a probablement été habitée par le passé. L'enveloppe extérieure est immaculée, mais l'intérieur est sens dessus dessous, probablement suite à un acte de sabotage intentionnel.\n\nL'officier scientifique [Root.GetLeaderName] pense que nous n'avons pas grand-chose à apprendre de l'intérieur, mais que les techniques d'ingénierie utilisées pour créer l'enveloppe extérieure, conçue pour résister à l'environnement hostile qu'est l'espace, sont extrêmement avancées."
 anomaly.3005.a: "Étrange."
 anomaly.3010.name: "Mystérieux cristal"
 anomaly.3010.desc: "L'amas minéral est un enregistrement holographique multiface, multibord et translucide. Il est à l'abri dans le rayon tracteur du [Root.GetName], mais nos experts vont avoir besoin d'un peu de temps pour décoder son contenu.\n\nUn §Yprojet spécial§! a été lancé pour accélérer ce processus."
 anomaly.3010.a: "Nous n'en tirerons rien de bon."
 anomaly.3010.b: "Très bien."
 anomaly.3012.desc: "Les données holographiques correspondent aux termes et conditions d'un traité commercial trilatéral entre trois grandes puissances aliens qui dominaient jadis ce quadrant de la galaxie. Nous manquons de contexte et beaucoup de détails nous échappent, mais l'officier scientifique [Root.GetLeaderName] pense que cette grande découverte pourrait nous aider à communiquer avec des forces aliens."
 anomaly.3015.name: "Caserne alien"
 anomaly.3015.desc: "Les formes visibles en orbite sont bien des bâtiments et, après examen, nous pensons qu'ils sont de nature militaire. Ceux-ci sont abandonnés depuis longtemps (bien que cela soit très récent à l'échelle galactique), mais l'officier scientifique [Root.GetLeaderName] pense que des secrets en rapport avec des tactiques aliens peuvent encore être exhumés sous la poussière qui a recouvert la caserne en ruines et les armureries pillées.\n\nIl serait judicieux de lancer un §Yprojet spécial§! pour étudier ces vestiges."
 anomaly.3015.a: "Entendu."
 anomaly.3015.b.pacifist: "Ce n'est pas pour rien si cet avant-poste est mort et enterré."
 anomaly.3017.name: "Caserne alien"
 anomaly.3017.desc: "L'analyse xéno-historique approfondie réalisée par l'officier scientifique [Root.GetLeaderName] sur l'installation militaire de [From.From.GetName] n'a donné que peu de résultats tangibles. La base a été construite avant que la planète devienne totalement stérile, mais on ignore si ses conditions inhospitalières actuelles sont dues à un conflit armé ou à un processus plus pacifique, voire naturel.\n\nLeurs stratégies et tactiques militaires ne semblaient pas très en avance sur les nôtres.\n\nLe bon côté, c'est que ces vestiges aliens ont inspiré l'officier scientifique [Root.GetLeaderName]."
 anomaly.3017.a: "Rien n'est jamais vain."
 anomaly.3020.name: "Quadrillage"
 anomaly.3020.desc: "La topologie de [From.GetName] est très particulière. La planète est en effet divisée en multiples biomes distincts, formant des microclimats aux interactions très subtiles, qui semblent avoir été conçus pour nourrir les contrées voisines. L'officier scientifique [Root.GetLeaderName] pense que des techniques de terraformation avancées ont été mises en oeuvre, mais il ne reste que peu d'indices sur le processus proprement dit.\n\nEn tout cas, ses effets sont clairement visibles pour [Root.GetLeaderName] et l'équipage du [Root.GetName]."
 anomaly.3020.a: "Fascinant."
 anomaly.3025.name: "Ancien automate"
 anomaly.3025.desc: "Un bâtiment alien envahi par la végétation se dresse au centre d'une des régions les plus verdoyantes de [From.GetName]. Et contrairement à ce que nous pensions au départ, il n'est pas en ruines. Les observations menées par le [Root.GetName] ont en effet révélé que la majeure partie de ce bâtiment a échappé à l'emprise dévastatrice de la flore locale.\n\nUn §Yprojet spécial§! a été lancé pour trouver un moyen d'y entrer."
 anomaly.3025.a: "Très intéressant."
 anomaly.3027.desc: "Avant d'être abandonné, le bâtiment envahi par la végétation de [From.From.GetName] (une usine de transformation de minéraux alien) était en grande partie automatisé. Les enveloppes corporelles des anciens ouvriers artificiels jonchent le sol, leurs composants organiques s'étant décomposés depuis longtemps - sachant que leurs corps étaient en grande partie de nature biologique et tenaient debout grâce à des endosquelettes en polymère.\n\nL'officier scientifique [Root.GetLeaderName] pense que les restes organiques de ces automates se sont rapidement liquéfiés pour être absorbés par le sol. Ce puissant engrais a ensuite permis à la flore locale de se développer en abondance et avec une résistance exceptionnelle.\n\nL'usine peut être réactivée mais les automates, aussi fascinants soient-ils pour [Root.GetLeaderName], n'arpenteront plus jamais ses salles."
 anomaly.3027.a: "Compris."
 anomaly.3027.a.tooltip: "Confère une §YUsine ancienne§! à [From.GetName].\n"
 anomaly.3030.name: "Bande d'arrêt d'urgence"
 anomaly.3030.desc: "Un vaisseau erre sur les plaines de [From.GetName], ses capteurs réagissant au [Root.GetName] en orbite autour de la planète.\n\nL'équipage du [Root.GetName] ne sait pas depuis combien de temps il a été abandonné (si tant est qu'il ait été abandonné), ni qui l'a laissé là et où son équipage se trouve aujourd'hui. Selon l'officier scientifique [Root.GetLeaderName], l'activation à distance de ce vaisseau faiblement armé ne présenterait aucun intérêt, au cas où nous voudrions l'intégrer à nos flottes."
 anomaly.3030.a: "Il ne manquera sûrement à personne."
 anomaly.3030.a.tooltip: "Récupérez une §Ycorvette§!."
 anomaly.3030.b.phobe: "Nous ignorons d'où il vient et où il va. Démantelez-le."
 anomaly.3035.name: "Bilan"
 anomaly.3035.desc.carefree: "La désertique [From.GetPlanetMoon] [From.GetName] s'est révélée très quelconque.\n\nPendant que l'équipage surveillait les instruments, qui restaient désespérément silencieux, l'officier scientifique [Root.GetLeaderName] a procédé à un rapide inventaire des réserves d'énergie du [Root.GetName]. D'après son rapport, le [Root.GetName] aurait quitté le port avec un volume inférieur au niveau standard, mais nous soupçonnons plutôt [Root.GetLeaderName] d'avoir mal géré ses ressources.\n\nQuoi qu'il en soit, le vaisseau a besoin de crédits énergétiques supplémentaires."
 anomaly.3035.desc.meticulous: "La désertique [From.GetPlanetMoon] [From.GetName] s'est révélée très quelconque.\n\nPendant que l'équipage surveillait les instruments, qui restaient désespérément silencieux, l'officier scientifique [Root.GetLeaderName] a procédé à un inventaire consciencieux des réserves d'énergie du [Root.GetName]. D'après son rapport, le [Root.GetName] aurait quitté le port avec un volume supérieur au niveau standard, probablement à la suite d'une erreur administrative.\n\n[Root.Leader.GetName] a proposé de restituer l'excédent aux autorités [Root.Owner.GetSpeciesAdj]."
 anomaly.3035.a: "Belle aubaine."
 anomaly.3035.b: "Classique."
 anomaly.3040.name: "Pirates en exil"
 anomaly.3040.desc: "Les prétendus amas de minéraux étaient en fait les coques métalliques de deux corvettes aliens à la dérive dans la ceinture d'astéroïdes.\n\nL'officier scientifique [Root.GetLeaderName] a établi le contact, et l'équipage des deux vaisseaux semble composé d'anciens pirates, aujourd'hui bannis de leur clan. Comme ils ont entendu dire que le [Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName] de [Root.Owner.GetName] était un défenseur du peuple, ils souhaitent lui demander l'asile."
 anomaly.3040.desc.fallback: "Ce que l'on pensait être de vulgaires amas de minéraux flottant autour de §Y[From.GetName]§! était en fait les coques métalliques de deux corvettes aliens dérivant dans la ceinture d'astéroïdes.\n\nL'officier scientifique [Root.GetLeaderName] a établi le contact. Il s'avère que les équipages de ces deux vaisseaux sont d'anciens pirates, aujourd'hui bannis de leur clan. Assez curieusement, ils pensent que nous nous montrerons bien disposés à leur égard, et ont été jusqu'à demander asile dans la [Root.Owner.GetName]."
 anomaly.3040.a: "Ils peuvent se rendre utiles."
 anomaly.3040.a.tooltip: "Engagez les pirates en exil et récupérez les deux §Ycorvettes§!."
 anomaly.3040.b: "Nous n'avons pas besoin de leurs services. Prenez tout ce qu'ils ont mais ne les tuez pas."
 anomaly.3040.c: "Le [Root.Owner.GetName] ne tolérera jamais leur présence."
 anomaly.3040.c.tooltip: "Les pirates en exil sont nos ennemis !"
 anomaly.3040.d: "Nous devons leur refuser l'asile."
 anomaly.3050.name: "Maillage grinçant"
 anomaly.3050.desc: "La surface hostile de §Y[From.GetName]§! est dominée par un treillage de bandes de minéraux composites, soutenu par de grands pylônes flexibles. Ceux-ci sont constamment agités par les vents d'altitude, ce qui frotte les unes contre les autres les bandes, qui produisant des ondes soniques dont les fréquences sont inaudibles pour les [Root.Owner.GetSpeciesNamePlural].\n\nL'officier scientifique [Root.GetLeaderName] signale qu'il est difficile d'isoler ce son du bruit de fond naturel de la [From.GetPlanetMoon], mais ajoute également que les bandes minérales pourraient, si nous le souhaitons, être ramenées au sol et recyclées, pour le plus grand profit de la [Root.Owner.GetName]."
 anomaly.3050.a: "Isolez les sons aliens pour les étudier."
 anomaly.3050.a.tooltip: "[From.GetName] :\n§G+9§!£society£"
 anomaly.3050.b: "Préparez la récupération des bandes minérales."
 anomaly.3050.b.tooltip: "[From.GetName] :\n§G+6§!£minerals£"
 anomaly.3055.name: "Hégémonie végétale"
 anomaly.3055.desc: "[From.GetName] est une planète tropicale dont la biosphère regorge de vie, mais sa flore se caractérise par son étonnante absence de diversité ; une famille de grands arbres domine en effet tout l'écosystème.\n\nBien que ceux-ci ne représentent aucun danger, leur hégémonie empêche les petits animaux de se développer. Et en cas de tentative de colonisation, les cultures vivrières seraient probablement impossibles.\n\nL'officier scientifique [Root.GetLeaderName], un xéno-biologiste réputé, a élaboré un plan pour rééquilibrer cette biosphère alien."
 anomaly.3055.a: "Approuvez le plan."
 anomaly.3055.a.tooltip: "Confère le modificateur §YÉcosystème déséquilibré§! à [From.GetName] :\n§R-20%§!£food£ \n"
 anomaly.3055.b: "Ne touchez pas à cette planète."
 anomaly.3055.b.tooltip: "Confère le modificateur §YÉcosystème déséquilibré§! à [From.GetName] :\n§R-20%§!£food£"
 anomaly.3056.desc: "L'équilibre a été rétabli, ou peut-être atteint pour la première fois. Le [Root.GetName] a stérilisé de vastes étendues où l'espèce végétale dominante prospérait en les bombardant de radiations. D'autres spécimens ont été réduits en cendres pour atteindre plus rapidement un véritable équilibre."
 anomaly.3057.desc: "La stérilisation des vastes étendues où prospéraient les arbres dominants de [From.From.GetName] a eu des effets inattendus.\n\nLes petits animaux, qui étaient jusque-là opprimés par ces grands arbres, ont commencé à proliférer et à se montrer plus agressifs, voire féroces. Les champs de cendres isolés qui accueillaient autrefois des forêts luxuriantes sont désormais le théâtre de violents conflits territoriaux."
 anomaly.3057.a: "Nous aurions peut-être mieux fait de ne pas intervenir."
 anomaly.3057.a.tooltip: "Une §Rfaune et une flore dangereuses§! peuplent désormais [From.From.GetName]."
 anomaly.3060.name: "La tête dans le sable"
 anomaly.3060.desc: "Aussi étrange que cela puisse paraître, l'officier scientifique [Root.GetLeaderName] indique que les ondulations qui ont été observées sur les mers de sable de [From.GetName] sont produites par les propulseurs d'un vaisseau.\n\nLes systèmes de propulsion grésillants de ce vaisseau alien enfoui dans le sable font en effet légèrement ondoyer les dunes. Il semble être là depuis un certain temps et s'enfonce lentement dans les dunes du désert. Le [Root.GetName] ne disposant pas de l'équipement adéquat pour renflouer le vaisseau, [Root.GetLeaderName] recommande d'envoyer un vaisseau militaire sur [From.GetName] pour l'exhumer."
 anomaly.3060.a: "Entendu."
 anomaly.3060.b: "Nous ne tomberons pas dans ce piège grossier."
 anomaly.3060.c: "S'il reste le moindre organique, il sera exterminé"
 anomaly.3061.desc: "La flotte [Root.GetFleetName] a fini par exhumer le vaisseau alien.\n\nEt celui-ci est vide, comme s'il avait été pillé.\n\nAvant qu'il commence à s'enfoncer dans le sable de [From.From.GetName], son équipage a dû l'abandonner en emportant avec lui la majorité de son équipement. Les ingénieurs de la flotte [Root.GetFleetName] ont réussi à rétablir le courant à bord du vaisseau et à y refaire le plein d'énergie."
 anomaly.3061.a: "Il va pouvoir rejoindre la flotte [Root.Owner.GetSpeciesAdj]."
 anomaly.3061.a.tooltip: "Récupérez une §Ycorvette§!."
 anomaly.3062.desc: "Les câbles hautement résistants des vaisseaux de la flotte [Root.GetFleetName] ont réussi à renflouer le vaisseau alien, mais ses systèmes d'armes se sont activés !"
 anomaly.3062.a: "Manoeuvres d'évasion !"
 anomaly.3062.a.tooltip: "L'§YAutruche§! attaque !"
 anomaly.3063.desc: "La tentative de récupération a échoué. Les longes hautement résistantes que les vaisseaux de la flotte [Root.GetFleetName] avaient enroulées autour de l'épave enfouie ont disloqué la coque rouillée du vaisseau.\n\nLes fragments ont été facilement récupérés, mais le vaisseau est en miettes."
 anomaly.3063.a: "Irrécupérable."
 anomaly.3065.name: "Communications pirates"
 anomaly.3065.desc: "Un répéteur-regénérateur de fortune a été fixé à la va-vite sur l'astéroïde [From.GetName].\n\nL'officier scientifique [Root.GetLeaderName] est persuadé qu'il s'agit d'un élément d'un réseau de communication pirate. Les premières analyses ont montré que les messages relayés n'ont aucun caractère stratégique particulier, mais qu'il s'agit plutôt de communications privées, d'un vaisseau à un autre, entre des membres d'équipage."
 anomaly.3065.a: "Cela pourrait nous en apprendre plus sur la vie dans l'espace"
 anomaly.3065.b: "Cela pourrait nous apprendre des choses utiles sur la vie dans l'espace"
 anomaly.3070.name: "À contre-courant"
 anomaly.3070.desc: "Les signaux proviennent d'une petite capsule métallique. Selon l'officier scientifique [Root.GetLeaderName], il s'agit d'une ancienne capsule de sauvetage de fabrication alien.\n\nIntentionnellement ou non, elle a été happée à la lisière du puits gravitationnel du trou noir dans un lointain passé, selon un angle empêchant tout effet de fronde. Durant tout ce temps, les systèmes de propulsion automatisés de la capsule ont tenté d'empêcher sa descente vers l'horizon du trou noir. Elle est maintenant trop près de celui-ci pour être récupérée.\n\nLe rapport de [Root.GetLeaderName] se termine brusquement, et l'équipage du [Root.GetName] indique que le sort tragique de cette capsule de sauvetage bouleverse profondément l'officier."
 anomaly.3070.desc.mach: "Les signaux proviennent d'une petite capsule métallique. Selon l'officier scientifique [Root.GetLeaderName], il s'agit d'une ancienne capsule de sauvetage de fabrication alien.\n\nIntentionnellement ou non, elle a été happée à la lisière du puits gravitationnel du trou noir dans un lointain passé, selon un angle empêchant tout effet de fronde. Durant tout ce temps, les systèmes de propulsion automatisés de la capsule ont tenté d'empêcher sa descente vers l'horizon du trou noir. Elle est maintenant trop près de celui-ci pour être récupérée.\n\nLe rapport de [Root.GetLeaderName] se termine brusquement, et l'équipage du [Root.GetName] indique que ces données nouvelles, qui ont altéré de manière significative l'évaluation des risques et la prédiction des taux de survie du [Root.GetName] affectent profondément l'officier."
 anomaly.3070.a: "On peut le comprendre"
 anomaly.3075.name: "Colportage de radiations"
 anomaly.3075.desc: "Étonnamment, les signaux captés dans le système de §Y[From.System.GetName]§! proviennent du trou noir lui-même.\n\nCelui-ci est relativement petit, ce qui pourrait en partie expliquer les émissions de radiations observées au niveau de son horizon. L'officier scientifique [Root.GetLeaderName] pense qu'il est en train de se « vider », jusqu'à sa disparition finale, même si rien ne permet de savoir si le processus sera terminé avant la fin de l'univers.\n\nUne anomalie gravitationnelle, datant de la période de formation du trou noir, l'a rendu « tremblant », pour reprendre les termes de [Root.GetLeaderName], ce qui ne fait qu'accentuer le flux énergétique qui s'en échappe."
 anomaly.3075.a: "Nous avons beaucoup à apprendre."
 anomaly.3075.a.tooltip: "[From.GetName] :\n§G+9§!£physics£ "
 anomaly.3080.name: "Usine de jouets"
 anomaly.3080.desc: "Des constructions ont été découvertes sur [From.GetName], même si elles sont aujourd'hui réduites à l'état de ruines ou de décombres. Le premier passage du [Root.GetName] au-dessus de la planète a révélé qu'il ne reste qu'un seul bâtiment intact, celui-ci ayant apparemment été épargné par la catastrophe qui a emporté les autres constructions de [From.GetName] et leurs occupants.\n\nIl s'agit de la source du bruit qui a été capté.\n\nNon seulement le bâtiment est intact, selon l'officier scientifique [Root.GetLeaderName], mais il est encore opérationnel.\n\nIl s'agit d'une installation de production qui transforme des polymères de type plasticine en objets probablement ornementaux. Les matières premières et le produit fini ne présentent aucun intérêt pour le [Root.Owner.GetName], mais nous avons beaucoup à apprendre du processus de fabrication automatisé."
 anomaly.3080.a: "Nous pourrions peut-être y mener une mission d'observation."
 anomaly.3080.a.tooltip: "Confère une §YUsine de jouets alien§! à [From.GetName].\n"
 anomaly.3085.name: "Le Prince"
 anomaly.3085.desc: "Une banque de données portable a été découverte sur l'orbite de l'énorme [From.GetName]. Après avoir été récupérée par le [Root.GetName], celle-ci a été analysée et un texte rédigé dans une langue alien en a été extrait. Le vocabulaire employé ne nous est pas totalement inconnu, mais la syntaxe est particulièrement complexe.\n\nL'officier scientifique [Root.GetLeaderName] recommande une étude plus approfondie afin de déchiffrer le contenu et l'origine de ce texte."
 anomaly.3085.a: "Analysez-le à [Root.Owner.Capital.GetName]."
 anomaly.3085.b: "N'insistez pas."
 anomaly.3086.name: "Le Prince, déchiffrable"
 anomaly.3086.desc: "Le texte, dont le titre signifie approximativement « Le potentat local », est rédigé dans ce qui paraît être un dialecte ancien dérivé de la langue [book_writer.GetSpeciesAdj] utilisée en [book_writer.GetName].\n\nLe texte, qui revêt incontestablement une importance historique pour eux, pourrait contenir de précieuses informations."
 anomaly.3086.a: "Perçons ses secrets, sans rien leur dire."
 anomaly.3086.b: "Nous devons le rendre à ses propriétaires. Contactez-les."
 anomaly.3086.c: "Leur prose est banale, et leurs idées sans intérêt. Contactez-les."
 anomaly.3087.name: "[book_writer.GetName]"
 anomaly.3087.desc: "Nous avons cru comprendre que vous aviez trouvé l'unique exemplaire encore existant du « Prince », qui revêt une grande importance historique et culturelle pour notre peuple.\n\nNous le pensions à jamais perdu depuis que des pirates s'en étaient emparés lors d'un raid, il y a quelques années ; mais nous sommes infiniment soulagés d'apprendre qu'il est aujourd'hui entre les appendices d'un peuple civilisé.\n\nSeriez-vous disposés à nous le rendre ? Nous serions heureux de vous transférer quelques crédits énergétiques pour vous dédommager de vos efforts."
 anomaly.3087.a: "Bien sûr."
 anomaly.3088.name: "[book_writer.GetName]"
 anomaly.3088.desc: "Nous avons cru comprendre que vous aviez trouvé l'unique exemplaire encore existant du « Prince », qui revêt une grande importance historique et culturelle pour notre peuple.\n\nNous le pensions à jamais perdu depuis que des pirates s'en étaient emparés lors d'un raid, il y a quelques années ; mais nous sommes infiniment soulagés d'apprendre qu'il est aujourd'hui entre les appendices d'un peuple civilisé.\n\nSeriez-vous disposés à nous le rendre ?"
 anomaly.3088.a: "Non. En fait, nous considérons qu'il est néfaste."
 anomaly.3088.b: "Non. La parole écrite est l'instrument des menteurs."
 anomaly.3088.c: "Nous vous détruirons, vous et tous vos mots"
 anomaly.3089.name: "[book_writer.GetName]"
 anomaly.3089.desc: "Comment osez-vous juger notre littérature ?\n\nVous allez le regretter !"
 anomaly.3089.a: "Hé, des rats de bibliothèque !"
 anomaly.3089.b: "Pitoyables organiques"
 anomaly.3090.name: "$ransomeer_chain_title$ : balise de détresse"
 anomaly.3090.desc: "Une balise de détresse a été découverte sur l'orbite de [From.GetName]. Son enveloppe extérieure très endommagée a vraisemblablement été la cible de tirs d'armes obliques ou subi une violente explosion.\n\nIl pourrait s'agir d'un modèle [Root.Owner.GetSpeciesAdj] pour vaisseaux civils (conçu pour être éjecté en cas de défaillance des systèmes de communication), mais vu l'ampleur des dégâts, nous n'en sommes pas sûrs.\n\nLa balise émet un faible signal distordu en continu."
 anomaly.3090.a: "Nettoyez le signal."
 anomaly.3090.b: "C'est peut-être un piège. Mieux vaut ne pas y toucher."
 anomaly.3091.name: "$ransomeer_chain_title$ : SOS"
 anomaly.3091.desc: "Après vérification, la balise est d'origine [Root.Owner.GetSpeciesAdj], et le signal qu'elle relaie a été stabilisé."
 anomaly.3091.a: "Autorités [Root.Owner.GetSpeciesAdj]. Identifiez-vous."
 anomaly.3091.a.tooltip: "Établissez la liaison."
 anomaly.3091.b: "Éteignez-la. Personne ne doit être au courant."
 anomaly.3092.name: "Prisonniers [Root.GetSpeciesAdj]"
 anomaly.3092.desc: "Bon... Bonjour ? Ici le capitaine du Luxion, un vaisseau de transport civil [Root.GetSpeciesAdj].\n\nEnfin, son ancien capitaine. Le Luxion n'existe plus. Nous avons été attaqués par des pirates qui nous ont faits prisonniers avant de détruire notre vaisseau."
 anomaly.3092.a: "Qui vous a capturés ?"
 anomaly.3092.a.response: "Euh, je... Je crois qu'ils se font appeler... les Rançonniers ? Ou les Rançonneux ? Quelque chose comme ça...\n\nEn tout cas, ce sont des sales types. Nous serions tous morts s'ils ne pensaient pas pouvoir réclamer une rançon à la [Root.GetName] en échange de notre libération. Je les ai entendus en parler entre eux..."
 anomaly.3092.b: "Ne comptez pas sur nous pour vous porter secours."
 anomaly.3092.c: "Nous allons vous délivrer."
 anomaly.3093.name: "Prisonniers [Root.GetSpeciesAdj]"
 anomaly.3093.desc: "Quoi ? Quoi ? Vous ne pouvez pas nous faire ça. Je vous en prie, sauvez-nous !\n\nSi le [Root.GetName] refuse de leur verser une rançon en échange de notre libération, ils n'hésiteront pas à nous tuer. De toute façon, ils nous tueront, avec ou sans rançon ! Vous ne pouvez pas..."
 anomaly.3093.a: "Au revoir."
 anomaly.3094.name: "Prisonniers [Root.GetSpeciesAdj]"
 anomaly.3094.desc: "Oh, merci ! Merci, [Root.GetRulerTitle]. Nous sommes détenus à bord d'une station spatiale, mais j'ignore laquelle.\n\nJe vais amplifier le signal de transmission pour que vous puissiez trianguler la position de cette prison à partir de la balise de détresse..."
 anomaly.3094.a: "Position enregistrée dans le Journal de bord."
 anomaly.3095.name: "$ransomeer_chain_title$ : un plan bien échafaudé"
 anomaly.3095.desc: "La base des Rançonneux, dans le système de §Y[Root.System.GetName]§! était bien cachée. Mais savoir quoi chercher a permis de la trouver assez facilement.\n\nUne flotte, suivant une formation brouillonne, est apparue de derrière un ancien complexe minier. Tout porte à croire qu'elle n'avait pas vraiment prévu notre arrivée."
 anomaly.3095.a: "Établissez la liaison. Les prisonniers doivent se tenir prêts."
 anomaly.3096.name: "Prisonniers [Root.GetSpeciesAdj]"
 anomaly.3096.desc: "Rebonjour, [Root.GetRulerTitle]. Les vaisseaux [Root.GetSpeciesAdj] sont-ils à l'origine de toute cette agitation ?\n\nNos hôtes semblent sur le point de quitter leurs postes. L'abordage de cette station risque de mal finir pour tout le monde, mais... si vous attaquez la base de front, je crois que nous pourrons atteindre une capsule de sauvetage.\n\nEssayez de ne pas nous tirer dessus !"
 anomaly.3096.a: "Très bien."
 anomaly.3098.name: "$ransomeer_chain_title$ : poussière et échos"
 anomaly.3098.desc: "La base des Rançonneux a déjà été détruite, et les captifs de la [Root.GetName] avec. Tout laisse croire qu'ils avaient réussi à envoyer des signaux aux vaisseaux aliens qui ont attaqué les pirates, mais que ceux-ci les ont ignorés."
 anomaly.3098.a: "Nous n'oublierons jamais cette tragédie."
 anomaly.3099.name: "$ransomeer_chain_title$ : sauveurs inattendus"
 anomaly.3099.desc: "Une opération militaire menée par la [From.From.GetName] a permis d'éliminer les Rançonneux.\n\nLes [Root.GetSpeciesNamePlural] retenus captifs, qui sont parvenus à s'échapper pendant l'attaque, sont actuellement en sécurité à bord d'une capsule de sauvetage et vont être récupérés par un vaisseau de sauvetage de la [Root.GetName]."
 anomaly.3099.a: "Nous vous serons éternellement reconnaissants."
 opinion_live_captives: "Captifs sauvés"
 anomaly.3100.name: "$ransomeer_chain_title$ : assaut"
 anomaly.3100.desc: "Une opération militaire, menée par une force inconnue, a éliminé les Rançonneux.\n\nPar miracle, les [Root.GetSpeciesNamePlural] ont réussi à s'échapper et à voler une capsule de sauvetage pendant l'attaque. Ils sont actuellement en route vers [Root.Capital.GetName]."
 anomaly.3100.a: "Providentiel et mystérieux."
 anomaly.3101.name: "$ransomeer_chain_title$ : réparer les pots cassés"
 anomaly.3101.desc: "Tandis que la base des pirates se disloque lentement suite à la réaction en chaîne déclenchée par nos vaisseaux militaires, la recherche des membres d'équipage du Luxion commence.\n\nSi les prisonniers avaient réussi à rejoindre une capsule de sauvetage, ils seraient déjà entrés en contact avec nous..."
 anomaly.3101.a: "Analysez toutes les fréquences."
 anomaly.3102.name: "Prisonniers [Root.GetSpeciesAdj] libérés"
 anomaly.3102.desc: "[Root.GetRulerTitle], ici l'équipage du Luxion.\n\nLe plan a parfaitement fonctionné. Lorsque vous avez commencé à bombarder la base, les gardes ont rejoint leurs vaisseaux et nous avons enfoncé la porte de notre cellule. Les capsules de sauvetage n'étaient pas surveillées, et vous avez réussi à occuper les pirates assez longtemps pour que notre évasion passe inaperçue."
 anomaly.3102.a: "Bienvenue au bercail, les évadés."
 anomaly.3103.name: "Prisonniers [Root.GetSpeciesAdj]"
 anomaly.3103.desc: "Bonj...\n\n\n-re aucune capsule de sauvetage, nous...\n\n\n-andonnés, effondr...\n\n\n\n\n\n------------------------"
 anomaly.3103.a: "Capitaine ?"
 anomaly.3103.a.response: "...............\n...............\n...............\n...............\n...............\n...............\n"
 anomaly.3103.b: "..."
 anomaly.3104.name: "$ransomeer_chain_title$ : cendres et fumées"
 anomaly.3104.desc: "Les [Root.GetSpeciesNamePlural] qui avaient été enlevés par les pirates n'ont pas réussi à s'enfuir. Nous ignorons dans quelles circonstances ils ont péri : leur capsule de sauvetage n'a-t-elle pas pu décoller ou n'ont-ils pas réussi à quitter leur cellule ? Quoi qu'il en soit, ils sont bel et bien morts.\n\nLe peuple [Root.GetSpeciesAdj] se félicitera des mesures rapides qui ont été prises par le [Root.GetRulerTitle] du [Root.GetName], mais il n'oubliera pas cette tragédie de si tôt."
 anomaly.3104.a: "Non, évidemment..."
 anomaly.3105.name: "$ransomeer_chain_title$ : tout est bien qui finit bien ?"
 anomaly.3105.desc: "Maintenant que l'équipage du Luxion est en route pour [Root.Capital.GetName], sain et sauf, nous pouvons dire que le pire a été évité. La population [Root.GetAdj] va très certainement saluer l'intervention décisive [Root.GetDuDelaDelDir][Root.GetRulerTitle]. Les Rançonneux ne kidnapperont plus personne.\n\nMais certaines questions restent posées. Notamment, les captifs prétendent avoir aperçu par les hublots, juste après leur capture, une grande flotte de pirates. Mais compte tenu des circonstances, cela s'explique très certainement par l'affolement dans ces conditions difficiles.\n\nLe problème des Rançonneux est définitivement réglé."
 anomaly.3105.a: "Je me demande..."
 anomaly.3110.name: "Signal surgi du passé"
 anomaly.3110.desc: "Sans surprise, le [Root.GetName] a localisé la source du signal en provenance de [From.GetName].\n\nBien que le reste de la planète semble vierge de toute présence alien, un monolithe composé d'un minéral blanc cassé et lisse se dresse au sommet d'une colline de l'hémisphère sud. Le signal est émis par ce monument, dont l'enceinte a manifestement été construite pour durer plutôt que pour sa résonance.\n\nL'officier scientifique [Root.GetLeaderName] s'est permis de définir les paramètres d'un §Yprojet spécial§! dont l'objectif serait de décoder les informations transmises par ce signal."
 anomaly.3110.a: "Excellente initiative."
 anomaly.3110.b: "Nous n'avons rien à gagner à écouter des morts."
 anomaly.3110.c: "Rasez le monument et trouvez l'émetteur."
 anomaly.3111.name: "Signal perdu"
 anomaly.3111.desc: "Nous pensions que le monolithe n'était qu'une protection abritant le transmetteur, mais nous avions tort.\n\nLa source du signal, une fois isolée, s'est avérée inutile en tant que telle. Quelque chose, dans la structure interne du monolithe désormais rasé, le faisait fonctionner, et il n'y a plus désormais aucun espoir de le remettre en fonction."
 anomaly.3111.a: "Décevant."
 anomaly.3112.desc: "Le monolithe a été désassemblé avec une facilité déconcertante. Au contraire de ce que nous pensions, le petit transmetteur qui se trouvait au centre émettait de l'énergie dans sa structure minérale, ce qui permettait la transmission."
 anomaly.3112.a: "Parfait."
 anomaly.3112.b: "Rien de bien nouveau donc, malheureusement"
 anomaly.3113.name: "Signal décodé"
 anomaly.3113.desc: "L'officier scientifique [From.GetLeaderName] indique que le signal émis par la balise de transmission de [From.From.GetName] a été décodé.\n\nIl s'agit d'un message commémoratif déplorant la perte de centaines de vies au cours d'une bataille datant d'il y a plusieurs milliers d'années. Suite à un acte de trahison, une alliance a manifestement été rompue et des flottes alliées se sont entretuées avant même l'arrivée de leur ennemi commun.\n\nCes carcasses desséchées ont été abandonnées là, telles des pierres tombales flottantes, les équipages ayant succombé aux frappes chirurgicales qui visaient les points faibles des coques de leurs vaisseaux."
 anomaly.3113.a: "Étudiez ces enregistrements." #society data on planet
 anomaly.3113.b: "Calculez la trajectoire et la position actuelle de la flotte naufragée."
 anomaly.3114.name: "Devancés par des pirates"
 anomaly.3114.desc: "Le [Root.GetName] est manifestement arrivé trop tard dans le système [From.GetName].\n\nUne flotte pirate d'origine inconnue a déjà découvert le champ de bataille errant et l'a cannibalisé pour construire une base sur un astéroïde voisin.\n\nAfin d'éviter tout affrontement, nos recherches s'arrêtent là."
 anomaly.3115.name: "Flottes à la dérive"
 anomaly.3115.desc: "Le [Root.GetName] a localisé les épaves qui dérivent dans le système [From.GetName]. Avec le temps, la plupart des vaisseaux mentionnés dans le message commémoratif de la balise sont tombés en poussière, mais quelques-uns sont remarquablement bien conservés.\n\nParmi eux, six vaisseaux militaires pourraient être restaurés, à condition qu'un nombre suffisant d'ingénieurs soient affectés à cette mission.\n\nPour plus d'informations, consultez le §YJournal de bord§!."
 anomaly.3115.a: "Fascinant."
 anomaly.3116.name: "Flottes réquisitionnées"
 anomaly.3116.desc: "L'ancienne armada hétéroclite a été partiellement remise en état, même si les ingénieurs dépêchés sur place ignorent comment un tel exploit a pu être accompli.\n\nLes vaisseaux ont été réquisitionnés par les flottes [Root.GetSpeciesAdj]."
 anomaly.3116.a.tooltip: "La §Yflotte de l'Ancienne alliance§! est restaurée.\n"
 anomaly.3117.name: "Flotte détournée"
 anomaly.3117.desc: "Les ingénieurs se sont d'abord concentrés sur l'imposant cuirassé, désigné par le signal commémoratif comme l'un des premiers vaisseaux à s'être retourné contre les autres lors de cette malheureuse bataille.\n\nCe fut hélas une erreur.\n\nEn dépit des efforts déployés pour contourner les systèmes principaux, l'ordinateur du vaisseau s'est soudain activé et a tiré une salve d'impulsions à haute fréquence sur nos vaisseaux. Les pare-feu de combat ayant été désactivés pour augmenter la bande passante pendant l'opération, la salve a instantanément assujetti tous les vaisseaux voisins au cuirassé réactivé. Les derniers journaux reçus avant que les transmissions soient coupées montrent que tous les systèmes de survie ont été systématiquement désactivés et que [Root.Owner.Capital.GetName] a été désignée comme cible.\n\nMaintenant que nos équipages sont présumés morts et qu'un vieil ordinateur de combat a pris notre monde natal pour cible, nous devons nous préparer au pire."
 anomaly.3118.name: "Flotte détruite"
 anomaly.3118.desc: "dreadnought killed, event ends with remaining ships being activated"
 anomaly.3119.name: "Flotte détruite"
 anomaly.3119.desc: "cuirassé abattu par les autres, tous les vaisseaux restants sont détruits"
 anomaly.3120.name: "Pirates éliminés"
 anomaly.3120.desc: "La menace a été éliminée. Nous devrions au moins pouvoir faire usage d'une partie de la technologie ancienne que les pirates avaient pillée."
 anomaly.3120.a: "Mais certaines questions restent sans réponse..."
 anomaly.3120.b: "$anomaly.3120.a$"
 #could have a pirate base built on the site, they got there first
 #Manufactory
 anomaly.3125.name: "Usine ancienne"
 anomaly.3125.desc: "Selon toute vraisemblance, la station orbitale servait jadis à extraire et traiter les minéraux de l'astéroïde, et sa conception est assez proche de celle de nos propres stations minières.\n\nL'officier scientifique [Root.GetLeaderName] aimerait que des ingénieurs (idéalement des [Root.Owner.GetSpeciesNamePlural] déjà en poste sur des vaisseaux militaires) soient dépêchés sur place pour restaurer la station."
 anomaly.3125.a: "Cette épave xéno ne présente aucun intérêt pour nous."
 anomaly.3125.b: "Restaurons cette station."
 anomaly.3125.c: "Mieux vaut ne pas y toucher."
 #Basic fallback
 anomaly.3126.name: "Usine ancienne : nouvelle station minière"
 anomaly.3126.desc: "Les ingénieurs ont accompli leur mission : ils ont restauré la station minière délabrée avec des pièces et mécanismes de contrôle [Root.Owner.GetSpeciesAdj]."
 #Various one-time effects
 anomaly.3127.name: "Usine ancienne"
 anomaly.3127.desc.1: "$anomaly.3126.desc$\n\nL'usine était manifestement destinée à l'extraction et au raffinage de pierres bétharianes, une fonctionnalité désormais restaurée."
 anomaly.3127.desc.2: "$anomaly.3126.desc$\n\nCertaines fonctionnalités de la station nous échappent encore. Apparemment, l'usine servait jadis à extraire et raffiner autre chose que les minéraux qui nous intéressent. De plus amples investigations vont être nécessaires."
 anomaly.3127.desc.3: "$anomaly.3126.desc$\n\nOn nous signale qu'une substance inconnue a été découverte dans les chambres de traitement de l'usine. Cette station servait peut-être autrefois à extraire et raffiner autre chose que les minéraux qui nous intéressent."
 anomaly.3127.a.1: "Excellent."
 anomaly.3127.a.2: "Nous avons beaucoup à apprendre."
 anomaly.3127.a.3: "Intéressant..."
 #Drones emerge
 anomaly.3128.name: "Usine ancienne : drones activés"
 anomaly.3128.desc: "Les efforts déployés par les ingénieurs [Root.Owner.GetSpeciesName] ont été vains. La station est trop délabrée pour être remise en état. De larges pans de sa structure se sont même détachés lorsqu'ils ont tenté de la réactiver.\n\nMais au moment où la structure de l'usine cédait, des engins en ont surgi en tirant des faisceaux laser à haute puissance et en prenant le [Root.GetFleetName] pour cible."
 #Crystals emerge
 anomaly.3129.name: "Usine ancienne : nid dérangé"
 anomaly.3129.desc: "Alors que les vieux tonneaux à polir tournaient, quelque chose en est sorti.\n\nMais pas du minerai poli... Des lames cristallines dentelées se sont mises à broyer la station orbitale délabrée avant de prendre le [Root.GetFleetName] pour cible."
 anomaly.3129.a.tooltip: "L'usine ancienne est détruite.\nLe [Root.GetFleetName] est attaqué !"
 anomaly.3130.name: "Débats et controverses"
 anomaly.3130.desc: "L'officier scientifique [Root.GetLeaderName] rapporte que la [From.GetPlanetMoon] [From.GetName] a bien été autrefois le berceau d'une civilisation relativement avancée, même si celle-ci a d'elle-même provoqué sa disparition avant de quitter la [From.GetPlanetMoon]. L'analyse des quelques vestiges qui ont pu être retrouvés en surface, dans les anciens dépôts d'informations non connectés, a permis à l'équipage du [Root.GetName] de dresser les grandes lignes de l'histoire de cette extinction.\n\nÀ un moment où un autre d'un passé éloigné, un schisme idéologique est apparu quant à la définition de ces philosophies aujourd'hui connues sous le nom de collectivisme et d'individualisme. Même si le rôle crucial joué par ces philosophies semble très douteux pour les habitants de [Root.Owner.GetName], cette civilisation semble bien avoir fini par s'entredéchirer sur la question des positions morales qui relevaient de chacune de ces deux écoles de pensée."
 anomaly.3130.desc.colle: "L'officier scientifique [Root.GetLeaderName] rapporte que la [From.GetPlanetMoon] [From.GetName] a bien été autrefois le berceau d'une civilisation relativement avancée, même si celle-ci a d'elle-même provoqué sa disparition avant de quitter la [From.GetPlanetMoon]. L'analyse des quelques vestiges qui ont pu être retrouvés en surface, dans les anciens dépôts d'informations non connectés, a permis à l'équipage du [Root.GetName] de dresser les grandes lignes de l'histoire de cette extinction.\n\nÀ un moment où un autre d'un passé éloigné, un schisme idéologique est apparu quant à la définition de ces philosophies aujourd'hui connues sous le nom de collectivisme et d'individualisme. Si la nature même du collectivisme est claire pour les habitants de [Root.Owner.GetName], cette civilisation semble bien avoir fini par s'entredéchirer sur la question des positions morales qui relevaient de chacune de ces deux écoles de pensée."
 anomaly.3130.desc.mater: "L'officier scientifique [Root.GetLeaderName] rapporte que la [From.GetPlanetMoon] [From.GetName] a bien été autrefois le berceau d'une civilisation relativement avancée, même si celle-ci a d'elle-même provoqué sa disparition avant de quitter la [From.GetPlanetMoon]. L'analyse des quelques vestiges qui ont pu être retrouvés en surface, dans les anciens dépôts d'informations non connectés, a permis à l'équipage du [Root.GetName] de dresser les grandes lignes de l'histoire de cette extinction.\n\nÀ un moment où un autre d'un passé éloigné, un schisme idéologique est apparu quant à la définition de ces philosophies aujourd'hui connues sous le nom de collectivisme et d'individualisme. Si la nature même de l'individualisme est claire pour les habitants de [Root.Owner.GetName], cette civilisation semble bien avoir fini par s'entredéchirer sur la question des positions morales qui relevaient de chacune de ces deux écoles de pensée."
 anomaly.3130.a: "C'est véritablement horrible"
 anomaly.3130.b: "Ce ne sont même pas de vraies éthiques..."
 anomaly.3135.name: "Rester calme"
 anomaly.3135.desc: "En remontant de la surface désolée de [From.GetName], l'officier scientifique [Root.GetLeaderName] a ramené une feuille de fibres végétales entrelacées. Son origine autant que son usage demeurent inconnus, mais les tests ont montré que cette matière s'avère relativement absorbante. Même si cela ne fait en rien avancer les sciences, [Root.GetLeaderName] semble s'en être entiché, allant jusqu'à l'emporter avec lui où qu'il aille.\n\n« L'officier [Root.GetLeaderName] est bien du genre à mélanger les torchons et les serviettes » murmurerait l'équipage dans son dos."
 anomaly.3135.a: "Et ça veut dire quoi, en fait ?"
 anomaly.3135.a.tooltip: "[Root.GetLeaderName] gagne un torchon."
 ####################################
 #Country Events
 ####################################
 #Comet Sighted
 country.999.name: "Comète repérée"
 country.999.desc: "Les [Root.GetSpeciesNamePlural] étant curieux de nature, l'apparition d'une comète dans le ciel de [Root.Capital.GetName] les a émerveillés.\n\nIls sont convaincus qu'il s'agit d'un excellent présage."
 country.999.a: "Excellent présage, en effet"
 country.999.desc.pac: "Les [Root.GetSpeciesNamePlural] étant curieux de nature, l'apparition d'une comète dans le ciel de [Root.Capital.GetName] a éveillé chez eux un grand sens de l'humilité.\n\nIls ne peuvent s'empêcher d'espérer que, un jour, de telles merveilles parviendront à réunir tous les peuples de la galaxie."
 country.999.a.pac: "C'est un excellent présage"
 country.999.desc.mil: "Un orgueilleux panache verdoyant a enflammé le ciel de [Root.Capital.GetName], marquant le passage d'une comète non loin de la stratosphère.\n\nLa puissance pure de sa trajectoire cosmique a beaucoup impressionné la populace de la capitale, qui n'hésite pas à faire le rapprochement entre son implacable trajectoire et l'inévitable ascension de la [Root.GetName] jusqu'à la suprématie galactique."
 country.999.a.mil: "En avant vers la victoire !"
 country.999.desc.spirit: "Une lumière a été aperçue, traversant le ciel étoilé de [Root.Capital.GetName], décrivant un arc gracieux qui contrastait avec la lente révolution des étoiles.\n\nLes citoyens de [Root.Capital.GetName] y ont vu la preuve d'une reconnaissance des puissances, et une subtile bénédiction de notre cause."
 country.999.a.spirit: "C'est tout à fait ça"
 country.999.desc.material: "Un petit corps céleste, prolongé d'une traînée formée de gaz et de particules diverses très visible, a été observé il y a peu dans le système de [Root.Capital.GetStarName].\n\nAucun incident n'est venu émailler son passage."
 country.999.a.material: "C'est noté"
 country.999.desc.phile: "Tel un messager lumineux nous venant des étoiles les plus éloignées, une comète est apparue, flamboyante, dans le ciel de [Root.Capital.GetName]. Les [Root.GetSpeciesNamePlural] se sont réjouis de ce rappel, aussi subtil soit-il, que nous ne sommes pas seuls dans l'univers.\n\nPlus que jamais, ils soutiennent l'ambition de la [Root.GetName] d'accueillir la galaxie à bras ouverts."
 country.999.a.phile: "Formidable"
 country.999.desc.phobe: "Une comète terrifiante est apparue dans le ciel de [Root.Capital.GetName]. Son arc implacable est pour tous les [Root.GetSpeciesNamePlural] un rappel sévère : nous ne sommes pas seuls, et des horreurs mystérieuse venus d'au-delà des étoiles nous guettent peut-être.\n\nC'est là un signe qui doit nous inciter à la vigilance contre toute influence alien."
 country.999.a.phobe: "Le présage est évident"
 country.999.desc.coll: "Des groupes de [Root.GetSpeciesNamePlural] ont aperçu une comète passer dans le ciel de [Root.Capital.GetName]. L'apparition de cet objet céleste solitaire a causé chez eux un désarroi, sans doute disproportionné, les poussant à se réunir les uns avec les autres pour s'assurer qu'ils ne sont pas seuls.\n\nIls semblent en tout cas convaincus que cette comète annonce des bouleversements pour la société [Root.GetAdj], soit un isolement galactique, soit une montée de l'individualisme en son sein."
 country.999.a.coll: "Vraiment inquiétant"
 country.999.desc.ind: "Une comète, fière et solitaire, est apparue dans le système de [Root.Capital.GetStarName], clairement visible depuis [Root.Capital.GetName]. Elle trace sa route dans le cosmos, brillant perpétuellement, sans jamais se décourager.\n\nC'est là l'idéal que poursuivent tous les [Root.GetSpeciesNamePlural]."
 country.999.a.ind: "Excellent présage"
 country.999.desc.mach: "Les unités présentes sur [Root.Capital.GetName] rapportent avoir noté la présence d'un petit corps stellaire glacé projetant des gaz, en ascension à deux heures, cinquante-cinq minutes et huit secondes, avec une déclinaison de deux virgule trois degrés.\n\nLa distance de ce corps a été triangulée, et a été établie à environ trois virgule soixante-quinze unités astronomiques de l'étoile, et la taille et la visibilité de la chevelure de ce corps a été classifiée comme digne d'intérêt. Ses dimensions ont été calculées, approximativement cinq par dix par six kilomètres. L'événement s'est conclu sans aucun incident."
 country.999.a.mach: "Bien reçu"
 country.999.desc.belief: "Une comète a été détectée dans le système de [Root.Capital.GetStarName].\nBien visible depuis la surface de §H[Root.Capital.GetName]§!, son apparition a suscité une vive réaction parmi la population.\n\nTout le monde s'accorde à dire que la survenue d'un tel événement céleste au cours d'un §H[GetCycleName]§! est synonyme de [GetCycleAttitude]."
 ####################################
 #Starting Events
 ####################################
 #Rogue Scientist
 country.1000.name: "Soif de nouveaux horizons"
 country.1000.desc: "[wanderlust_scientist.GetName], qui dirige le Département scientifique de la [Root.GetName], a disparu, ainsi qu'un prototype de vaisseau scientifique expérimental financé par des fonds privés.\n\nL'incident a bien évidemment suscité un véritable scandale au sein de la communauté scientifique sur [Root.Capital.GetName]."
 country.1000.a: "Étrange."
 country.1001.name: "Soif de nouveaux horizons : justifiée"
 country.1001.desc: "On ignore encore où a disparu [wanderlust_scientist.GetName], notre ancien[wanderlust_scientist.GetXNeLead] Responsable des recherches. Quelques informations ont toutefois pu être glanées sur ce prototype de vaisseau scientifique et sur ses recherches privées. Bien que certains aspects semblent un peu trop fantasques pour être véridiques, la [Root.GetName] aurait tout intérêt à [wanderlust_scientist.GetLeLaLead] retrouver au plus vite.\n\nLe §Hjournal de bord§! a été mis à jour."
 country.1001.a: "Très bien."
 country.1001.a.tooltip: "Lancement de Soif de nouveaux horizons : chaîne d'événements du scientifique rebelle"
 country.1003.name: "Soif de nouveaux horizons : impasse"
 country.1003.desc: "[wanderlust_scientist.GetName] ne se trouve pas dans ce système.\n\nSoit il s'agissait d'une fausse piste, soit la traînée a disparu."
 country.1003.a: "Nous allons continuer à chercher."
 country.1005.name: "Soif de nouveaux horizons : présence détectée"
 country.1005.desc: "Le vaisseau de [wanderlust_scientist.GetName] semble effectivement se trouver dans le système de §Y[probe_attack_system.GetName]§!.\n\nIl n'a pu être localisé précisément par aucun capteur, mais il nous transmet une communication. Celle-ci vient de parvenir sur [Root.Capital.GetName]."
 country.1005.a: "Établissez la liaison."
 country.1010.name: "[wanderlust_scientist.GetName]" #diplo w/ scientist
 country.1010.desc: "Mes salutations, [Root.GetRulerTitle].\n\nJe suppose que cet appel n'a rien d'amical ?"
 country.1010.a: "Qu'est-ce que cela signifie ?"
 country.1010.a.response: "Je suppose que vous faites allusion à ma disparition de l'espace de [Root.GetName].\n\nJ'avais besoin de prendre du recul, c'est tout. Enfin, disons plutôt que je cherche la Fenêtre. Et elle n'est certainement pas là-bas.\n\nIci non plus, d'ailleurs. Je dois poursuivre mes recherches. Mais je n'ai pas l'intention d'emporter les drones que j'ai trouvés."
 country.1010.b: "Nous pouvons envoyer des vaisseaux pour vous escorter sur le chemin du retour."
 country.1010.b.response: "Je ne compte pas rentrer tout de suite.\n\nMais pour vous prouver ma bonne foi, je suis prêt à vous donner ces drones. Prenez cela comme un don fait au [Root.GetName]. Ils dérivaient à la lisière de ce système, et après les avoir entièrement réparés, je me suis rendu compte qu'ils ne pouvaient pas me servir de sondes de recherche."
 country.1010.c: "Vous allez immédiatement rentrer à la capitale."
 country.1010.c.response: "Non, car ce n'est que le début. Le devoir m'appelle, au nom de la science.\n\nMais pour vous prouver ma bonne foi, je suis prêt à vous remettre ces drones. Prenez cela comme un don fait au [Root.GetName]. Ils dérivaient à la lisière de ce système, et après les avoir entièrement réparés, je me suis rendu compte qu'ils ne pouvaient pas me servir de sondes de recherche."
 country.1010.d: "Cette conversation est terminée."
 country.1015.name: "Soif de nouveaux horizons : les drones"
 country.1015.desc: "Le physicien s'est à nouveau volatilisé.\n\nMais comme il l'avait promis, il nous a laissés des drones. Ils sont équipés d'armes, qui sont en train de se charger !"
 country.1020.name: "Soif de nouveaux horizons : drones détruits"
 country.1020.desc: "Les modules de reconnaissance amis/ennemis avaient été retirés des drones, probablement lors des réparations effectuées par [wanderlust_scientist.GetName]. En revanche, leurs processeurs d'évaluation des menaces étaient intacts et avaient été quelque peu modifiés par l'intervention [wanderlust_scientist.GetDuDelaLead] scientifique.\n\n[wanderlust_scientist.GetSheHeCap] n'a sans doute pas fait ces modifications pour qu'ils attaquent nos vaisseaux, mais le fait est qu'ils ont parfaitement couvert sa fuite.\n\nUn §Yprojet spécial§! a été lancé pour tenter de retrouver sa trace à partir de ses dernières coordonnées connues. Tout a été porté dans le §HJournal de bord§!."
 country.1022.name: "Soif de nouveaux horizons : drones vaincus"
 country.1022.desc: "Quelqu'un ou quelque chose a détruit les drones laissés par [wanderlust_scientist.GetName].\n\nNous devrions donc en profiter pour essayer de retrouver sa trace.\n\nUn §Yprojet spécial§! a été ajouté dans le §HJournal de bord§!."
 country.1025.name: "Soif de nouveaux horizons : Projet spécial accompli"
 country.1025.desc: "Après avoir décodé les signatures énergétiques laissées par l'insaisissable vaisseau scientifique du physicien, nous sommes à nouveau sur ses traces.\n\nPour en savoir plus, consultez le Journal de bord."
 country.1030.name: "Soif de nouveaux horizons : dans le pétrin"
 country.1030.desc: "Nous avons fini par retrouver la trace de l'insaisissable vaisseau scientifique.\n\nSur les relevés confus de nos capteurs, le vaisseau du physicien semble flanqué de deux corvettes hostiles.\n\nLe physicien tente de nous contacter."
 country.1035.name: "$country.1010.name$" #diplo w/ scientist
 country.1035.desc: "Mes salutations, [Root.GetRulerTitle].\n\nJe suis ravi de voir des vaisseaux [Root.GetSpeciesName]. Je crains que ma soudaine apparition dans ce système ait déplu aux aliens dont les vaisseaux encerclent actuellement le mien.\n\nJ'apprécierais beaucoup que vous m'aidiez à corriger mes erreurs. Une fois le problème réglé, je me ferai un plaisir de vous révéler la nature de mon expédition."
 country.1035.a: "Pourquoi vous êtes-vous enfui ?"
 country.1035.a.response: "Enfui ? Je suis juste parti.\n\nJe comprends que cela vous ait déplu, [Root.GetRulerTitle], mais je ne pouvais pas risquer de voir mon travail piétiner à cause des basses querelles politiques de la communauté scientifique [Root.GetSpeciesName].\n\nEn outre, j'avais des recherches à mener sur le terrain. C'est toujours le cas d'ailleurs."
 country.1035.b: "Parlez-nous d'abord de cette Fenêtre."
 country.1035.b.response: "Je préfère garder cela pour moi tant que je n'ai pas trouvé les preuves de ce que je cherche.\n\nSachez juste que nous ne sommes peut-être tous que des hologrammes. Le sujet ne mérite-t-il pas d'être approfondi ?"
 country.1035.c: "Nous allons essayer de vous sortir de là."
 country.1040.name: "Pirates Sunblaster" #diplo w/ pirates
 country.1040.desc: "Allez au diable ! C'est nous qui avons trouvé ce vaisseau-fantôme déglingué.\n\nDès qu'on l'aura repéré, on n'aura plus qu'à monter à bord. Et il sera à nous, pas à vous. Et puis on zigouillera son capitaine."
 country.1040.a: "Vous allez regretter d'avoir croisé notre route, sale vermine alien." #fanatic xenophobe
 country.1040.a.response: "De belles paroles pour quelqu'un d'aussi moche. On n'a pas de leçons à recevoir de vous."
 country.1040.b: "150 crédits énergétiques pour le vaisseau." #fanatic or regular pacifist, pay off
 country.1040.c: "Préparez les armes." #beat them up
 country.1040.d: "Si vous tenez à la vie, vous avez intérêt à partir tout de suite." #empty threat?
 country.1040.d.response: "Ouais, c'est ça ! Je vous signale que vous êtes très loin de chez vous.\nCes étoiles appartiennent aux pirates Sunblaster."
 country.1041.name: "Pirates Sunblaster"
 country.1041.desc: "150 crédits énergétiques ? Ça ne vaut rien. Mais...\n\nBah, ce vaisseau-fantôme est plus un fardeau qu'autre chose.\n\nSkitskur'r ! On fiche le camp !"
 country.1041.a: "Priez pour qu'on ne se recroise jamais, bande de dégénérés."
 country.1041.b: "Rien ne dure, surtout pas les biens matériels."
 country.1041.c: "L'argent, c'est le nerf de la guerre."
 country.1041.d: "Partez, s'il vous plaît."
 country.1042.name: "Pirates Sunblaster"
 country.1042.desc: "Cet imbécile a besoin d'une bonne leçon.\n\nSkitskur'r ! Aux armes !"
 country.1042.a: "Les forces des [Root.GetSpeciesNamePlural] vont vous écraser."
 country.1044.name: "$country.1010.name$"
 country.1044.desc: "Comme ils communiquaient sur un canal ouvert, j'ai entendu quelques bribes de conversation.\n\nJe crois que la transaction s'est bien passée."
 country.1045.name: "$country.1010.name$" #diplo w/ scientist, situation resolved
 country.1045.desc: "Vous n'avez fait qu'une bouchée de ces pirates, [Root.GetRulerTitle].\nEn tant que scientifique, je déteste la violence... Mais je dois admettre que dans le cas présent, elle était nécessaire. Je crois que ces pirates ne m'auraient pas épargné."
 country.1045.a: "Effectivement. Bon, je vous écoute."
 country.1045.a.response: "Oui, bien sûr, [Root.GetRulerTitle].\nEh bien... Sans rentrer dans les détails, sachez que rien n'est réel. Ou plutôt, rien de ce que nous croyons réel ne l'est vraiment. Ni vous ni moi ne sommes réels, [Root.GetRulerTitle], pas plus que les lois de la nature, que nous considérons pourtant comme immuables. L'univers n'est qu'un reflet, un hologramme, un prisme qui déforme la réalité.\n\nVous comprenez ? Or, il y a forcément une brèche qui laisse entrer la lumière. C'est ce que j'appelle la Fenêtre."
 country.1045.b: "Vous devez immédiatement rentrer à [Root.Capital.GetName]."
 country.1046.name: "$country.1010.name$" #diplo, immediate followup, gain phys
 country.1046.desc: "Je ne rentrerai pas, [Root.GetRulerTitle].\nVous savez, j'ai eu le temps de réfléchir, et je pense que je ne suis pas près de rentrer.\n\nJ'ai pris la liberté de télécharger une partie de mes recherches dans les bases de données de [Root.Capital.GetName]. J'espère qu'elles seront utiles au peuple [Root.GetSpeciesName]. Mais je conserve les données relatives à la Fenêtre. Je ne suis pas sûr d'être prêt ; mais à mon avis, personne d'autre ne l'est.\nBon, je dois vous laisser."
 country.1046.a: "Attendez..."
 country.1047.name: "Soif de nouveaux horizons : les stores"
 country.1047.desc: "[wanderlust_scientist.GetName] a dit vrai, comme l'ont prouvé les vérifications faites sur ses travaux. Ceux-ci ont fait faire un pas en avant à la communauté scientifique [Root.GetAdj]. Un petit pas, certes, mais un pas important...\n\nQuant à [wanderlust_scientist.GetLuiElleLead], [wanderlust_scientist.GetSheHe] s'est encore volatilisé[wanderlust_scientist.GetXELead]. Mais, cette fois, sa piste commence dans le système où nous l'avons retrouvé[wanderlust_scientist.GetXELead].\n\n[wanderlust_scientist.GetSilSielleLeadCap] se dirige vers cette Fenêtre, nous l'y retrouverons. Tout a été consigné dans le §HJournal de bord§!."
 country.1050.name: "Soif de nouveaux horizons : la Fenêtre s'ouvre" #final catchup
 country.1050.desc: "Pour la première fois, le prototype de vaisseau scientifique est bien visible sur les écrans. En dehors du fait qu'il se trouve sur une orbite dangereusement proche de l'étoile du système, rien ne le distingue d'un vaisseau ordinaire.\n\nMais une simple analyse optique révèle le secret de ce vaisseau. Sa coque de conception standard a été grossièrement modifiée ; elle est maintenant recouverte de filaments métalliques qui semblent agir comme des électroaimants à tension alternative et étroitement contrôlée. La proximité d'une étoile peut légèrement déformer les émissions stellaires du vaisseau qui s'enroulent alors autour de lui pour former une sorte de camouflage.\n\nBien que conceptuellement intéressante, cette technique présente néanmoins des inconvénients sur le plan pratique puisque l'exposition prolongée aux rayonnements solaires a totalement neutralisé le système."
 country.1051.name: "$country.1010.name$" #start of final diplo w/ scientist
 country.1051.desc: "Mes salutations, [Root.GetRulerTitle].\n\nJe me doutais bien que vous alliez suivre ma trace.\n\nEt je ne me suis pas trompé."
 country.1051.a: "Où en êtes-vous, [wanderlust_scientist.GetName] ?"
 country.1051.a.response: "Je crois que j'ai trouvé la Fenêtre. En tout cas, une fenêtre. Il y en a peut-être d'autres. Nos doubles réels se trouvent-ils de l'autre côté ? Y a-t-il quelque chose ? Je dois vous avouer que je n'en ai pas la moindre idée. Je sais que mes connaissances n'intéressent personne. Mais il serait totalement irresponsable que je m'arrête là."
 country.1051.b: "Qu'allez-vous faire ?"
 country.1051.b.response: "Je vais essayer de franchir la Fenêtre pour accéder à la réalité. La lumière du réel ne s'infiltre pas seulement ici, évidemment. L'univers tout entier peut être comparé à un vaste panneau de verre, dont nous sommes d'infimes déformations et imperfections qui doivent la vie à la lumière émise de l'autre côté.\n\nC'est la Fenêtre, car je crois qu'elle s'ouvre."
 country.1051.c: "Vos actes sont insensés et dangereux."
 country.1052.name: "$country.1010.name$" #second phase
 country.1052.desc: "Je regrette sincèrement de vous avoir causé tous ces ennuis, [Root.GetRulerTitle]. Mais je ne dois rien au [Root.GetName] car je me suis déjà acquitté de mon dû. Vous m'avez suivi de votre propre chef, et je vous remercie de m'avoir aidé, mais mes intentions ont toujours été très claires."
 country.1052.a: "Rentrez et nous oublierons tout cela."
 country.1052.b: "Vous serez jugé."
 country.1053.name: "$country.1010.name$"
 country.1053.desc: "La Fenêtre s'ouvre, [Root.GetRulerTitle].\n\nAu revoir."
 country.1053.a: "[wanderlust_scientist.GetName], attendez !"
 country.1055.name: "Soif de nouveaux horizons : la Fenêtre se referme"
 country.1055.desc: "Le vaisseau scientifique est vide.\n\nToutes les combinaisons destinées aux sorties extravéhiculaires sont à leur place, et les journaux du vaisseau indiquent que le sas n'a jamais été ouvert.\n\nLe vaisseau est toujours en orbite autour de l'étoile, mais il est maintenant sous contrôle [Root.Owner.GetSpeciesAdj]."
 country.1055.a: "Voilà une fin bien déroutante."
 country.1055.a.tooltip: "Le vaisseau scientifique a été récupéré et ses fonctions de base sont toujours opérationnelles.\n"
 country.1061.name: "Soif de nouveaux horizons : pirates éliminés"
 country.1061.desc: "Les pirates Crèvétoiles qui menaçaient [wanderlust_scientist.GetName] ont été éliminés, mais pas par nous.\n\nEt [wanderlust_scientist.GetSheHe] essaie d'entrer en contact avec nous..."
 ### Mass Extinction Starting Event Chain
 country.1100.name: "Extinction de masse"
 country.1100.desc: "Nos premiers pas dans le vide spatial qui entoure §Y[Root.Capital.GetName]§! n'étaient pas motivés seulement par la curiosité ou le désir de conquête, mais par la nécessité.\n\nLa biosphère de §Y[Root.Capital.GetName]§! a connu des changements rapides, et les scientifiques craignent un phénomène d'extinction de masse, une purge qui se produit régulièrement et est indissociable de l'existence d'une planète parmi tant d'autres dans le cosmos.\n\nUn projet de recherche a été élaboré pour étudier les mondes devenus inhabitables du fait d'événements astronomiques majeurs. Nous espérons qu'une meilleure compréhension de ces événements permettra d'empêcher un tel sort pour §Y[Root.Capital.GetName]§! et la race §Y[Root.GetSpeciesAdj]§!."
 country.1100.a: "L'avenir de l'espèce [Root.GetSpeciesAdj] en dépend"
 country.1100.owned: "Il se trouve en territoire alien. Trouvons un autre sujet d'étude"
 country.1105.name: "Extinction de masse : planète détruite"
 country.1105.desc: "Nos astronomes sont convaincus que la ceinture d'astéroïdes de ce système était autrefois une planète habitable, qui a été détruite sous l'effet de forces inconnues.\n\nUn §Yprojet spécial§! a été lancé pour étudier l'un des principaux astéroïdes de cette ceinture."
 country.1110.name: "Extinction de masse : planète en fusion"
 country.1110.desc: "L'une des planètes actuellement en orbite autour de cette étoile porte encore les stigmates d'une ancienne catastrophe. Sa surface est une mer agitée de minéraux en fusion qui bout dans une atmosphère surchauffée, mais les astronomes [Root.GetSpeciesAdj] pensent qu'elle a jadis abrité la vie.\n\nUn §Yprojet spécial§! a été lancé pour étudier la planète en fusion."
 country.1115.name: "Extinction de masse : planète désolée"
 country.1115.desc: "Une planète de ce système présente encore les traces fossilisées d'une ancienne biosphère. Comment un environnement foisonnant de vie a-t-il pu se transformer en désert ?\n\nUn §Yprojet spécial§! a été lancé pour déterminer l'origine de cette désastreuse transformation."
 country.1120.name: "Extinction de masse : planète toxique"
 country.1120.desc: "On pense que la faune et la flore de cette planète ont succombé à leurs propres émissions toxiques ainsi qu'à la libération dans l'atmosphère de gaz réactifs surgis des profondeurs.\n\nUn §Yprojet spécial§! a été lancé pour étudier la question."
 country.1125.name: "Extinction de masse : planète glaciale"
 country.1125.desc: "La planète la plus intéressante de ce système est recouverte de plusieurs couches de glaces très denses et de composition variable. Apparemment, elle accueillait autrefois des biomes plus variés et agréables.\n\nUn §Yprojet spécial§! a été lancé pour étudier cette hypothèse."
 country.1130.name: "Extinction de masse : astéroïde"
 country.1130.desc: "L'astéroïde est en fait un fragment d'une ancienne planète habitable, et probablement habitée. Les traces de fractures régulières mais imbriquées indiquent que la démolition de la planète fut volontaire et contrôlée, bien que précipitée.\n\nTout porte à croire que cette planète était le monde natal de l'espèce qui l'a détruite. Nous ne saurons peut-être jamais ce qui l'a poussée à annihiler sa planète, et peut-être est-ce mieux ainsi."
 country.1135.name: "Extinction de masse : en fusion"
 country.1135.desc: "Le sort funeste qu'a connu la planète est probablement dû à des caprices cosmiques.\n\nLes scientifiques [Root.Owner.GetSpeciesAdj] pensent que les perturbations gravitationnelles sont dues à une anomalie spatio-temporelle passagère qui a dévié la planète de son orbite naturelle pour la rapprocher du soleil. La planète se redirige lentement vers son orbite d'origine, mais en attendant, elle cuit littéralement sous la chaleur résiduelle de l'étoile."
 country.1140.name: "Extinction de masse : stérile"
 country.1140.desc: "La vie qui s'est jadis développée sur cette planète désormais stérile était condamnée à s'éteindre depuis le départ.\n\nL'espèce dominante venait à peine d'atteindre la sagesse et d'inventer l'agriculture lorsque des mécanismes géologiques ont acidifié le sol de la planète.\n\nLes prélèvements effectués dans les strates inférieures du sol et sur des restes fossilisés montrent que différents minéraux indispensables au recyclage du sol ont fini dans les endosquelettes des autochtones.\n\nLeurs os se sont fossilisés au lieu de se décomposer, et leur existence même épuisait inexorablement le fragile écosystème qu'ils peuplaient."
 country.1145.name: "Extinction de masse : toxique"
 country.1145.desc: "Les fissures découvertes à la surface de la planète, que l'on croyait dues à une importante activité tectonique, sont en fait de profondes empreintes laissées par de gigantesques racines souterraines.\n\nDans un lointain passé, une étrange mutation (peut-être provoquée par des êtres doués de raison) a entraîné une incontrôlable prolifération de cette espèce végétale locale. La plupart de ces plantes se reproduisent par pollinisation, leurs innombrables gamètes étant transportés par les courants de la basse atmosphère.\n\nD'abord inoffensif, ce processus a en quelques mois entraîné l'extinction de tous les animaux de la planète en raison de l'augmentation exponentielle des particules transportées dans l'air."
 country.1150.name: "Extinction de masse : glacée"
 country.1150.desc: "Un changement anormal de la composition chimique de l'atmosphère a lentement plongé la planète dans une ère glaciaire qui a commencé avant la formation du [Root.Owner.GetName] et qui risque de persister longtemps après notre mort.\n\nNous ignorons la cause exacte de ce changement, mais il n'est pas impossible qu'il soit dû à l'échec d'une tentative de terraformation ou à un acte de terrorisme intraplanétaire. Les membres les plus extrémistes de la communauté scientifique de [Root.Owner.Capital.GetName] pensent que ce bouleversement climatique pourrait être dû à l'émission incontrôlée de sous-produits dérivés de l'industrie.\n\nCe point de vue reste cependant minoritaire car il est peu probable qu'une race suffisamment intelligente pour atteindre un tel niveau d'industrialisation ait pu être assez bête pour s'autodétruire."
 country.1150.desc.industrialist: "Un changement anormal dans la composition chimique de l'atmosphère a lentement plongé ce monde dans une ère glaciaire irréversible, commencée avant la naissance de la [Root.Owner.GetName] et qui risque de persister longtemps après notre mort.\n\nLa cause exacte de ce bouleversement ressemble pour une large part aux phénomènes produits par l'industrialisation de nos propres mondes : l'émission non contrôlée de gaz industriels a provoqué un changement cataclysmique dans l'atmosphère, que les indigènes n'ont pu contrebalancer.\n\nCette conclusion a causé quelque inquiétude au sein de la communauté scientifique [Root.Owner.GetSpeciesName], même si nombreux sont ceux qui indiquent que, étant donné notre niveau technologique, nous serions « probablement en mesure » d'éviter une telle catastrophe."
 country.1155.name: "Extinction de masse : étude terminée"
 country.1155.desc: "Les recherches menées par l'expédition ont parfois donné des résultats inattendus, mais les scientifiques [Root.GetSpeciesAdj] disposent désormais d'innombrables données pour modéliser avec précision l'avenir de [Root.Capital.GetName].\n\nSauf phénomènes cosmiques imprévus ou effondrement brutal du [Root.GetName], les premiers rapports indiquent que [Root.Capital.GetName] devrait être à l'abri pour une douzaine de générations."
 country.1155.a: "Qu'avons-nous d'autre à apprendre de ces planètes ?"
 country.1155.b: "Cela devrait rassurer la population [Root.GetSpeciesName]."
 country.1155.c: "Publiez les données planétaires."
 country.1156.name: "Extinction de masse : étudiée"
 country.1156.desc: "Les données relatives aux systèmes stellaires étaient globalement inégales, mais l'étude détaillée des planètes individuelles a permis au [Root.GetName] d'extrapoler pour bénéficier de données complètes sur les systèmes en question."
 country.1156.a: "Formidable."
 country.1157.name: "Extinction de masse : foi en l'avenir"
 country.1157.desc: "L'inquiétude de la population n'a cessé de croître à mesure que les résultats de l'étude filtraient dans les médias. Mais nous pouvons maintenant balayer ces doutes et ces craintes."
 country.1157.a: "Notre monde natal est sûr."
 country.1157.b: "Encore un succès pour le [Root.GetRulerTitle]."
 country.1158.name: "Extinction de masse : diffusion des informations"
 country.1158.desc: "Les informations glanées par l'expédition de recherche appartiennent au [Root.GetName] et l'accès à celles-ci est restreint ; cette précaution a été prise dès le début du projet afin d'éviter les conclusions hâtives et catastrophistes.\n\nMais maintenant que l'étude est terminée, la communauté scientifique fait pression pour avoir accès à ces informations."
 country.1158.a: "Très bien."
 ####################################
 #Narrative Events
 ####################################
 story.1.name: "Contact : formes de vie primitives"
 story.1.desc: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nMême si l'on ne parle pas encore d'intelligence, il y a bien de la vie ailleurs."
 story.1.desc.phobe: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nMême si l'on ne parle pas encore d'intelligence, il y a bien de la vie ailleurs. Il s'agit là d'une réalité incontournable - et d'une perspective profondément déstabilisante."
 story.1.desc.phile: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nCes petites merveilles de l'évolution ont éveillé parmi les [Root.GetSpeciesNamePlural] l'espoir de pouvoir établir un jour un contact avec des êtres intelligents."
 story.1.desc.spiri: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nMaintenant qu'ils savent que la divine providence s'étend bien au-delà de [Root.Capital.GetName], tous les tenants de la théologie [Root.GetSpeciesAdj] organisent des rites ésotériques pour tenter de trouver des réponses aux questions nouvellement posées."
 story.1.desc.gesta: "L'existence de formes de vie organiques inférieures en dehors de la biosphère de [Root.Capital.GetName] a été confirmée."
 story.1.desc.term: "Des microbes aliens de nature organique ont été détectés. Les modèles de probabilité d'une vie organique consciente ont été ajustés en conséquence. S'ils existent, nous la trouverons. Elle sera exterminée."
 story.1.desc.evopred: "Nous ne sommes pas seuls. Pour la première fois, la [Root.GetName] a enfin la preuve irréfutable de l'existence d'autres formes de vie dans l'univers. [Root.GetHomeWorldName] n'est pas le seul monde témoin d'une évolution.\n\nAu fond de nous, un sentiment de faim presque oublié s'est réveillé. Nous repartons à la chasse."
 story.2.name: "Contact : habitants de l'espace lointain"
 story.2.desc: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nLes créatures extrêmophiles de [Root.Capital.GetName] paraissent en effet bien frêles lorsqu'on les compare à ces créatures originaires de l'espace le plus reculé."
 story.2.desc.phile: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nLes créatures extrêmophiles de [Root.Capital.GetName] paraissent en effet bien frêles lorsqu'on les compare à ces créatures originaires de l'espace le plus reculé. Et si certains pouvaient en douter, la rencontre d'une vie alien était aussi prévisible qu'attendue - mais rien n'aurait pu conduire les spécialistes de la xénobiologie [Root.GetSpeciesAdj] à penser qu'ils auraient pu vivre dans des conditions aussi extrêmes."
 story.2.desc.followup: "Les sujets de la [Root.GetName] ont accueilli la nouvelle de la rencontre avec des êtres aliens dans un calme relatif.\n\nL'habitat de ces aliens, que l'on croyait jusque-là impropre à la vie, a déclenché une brève polémique dans certains cercles de la communauté scientifique de [Root.Capital.GetName], mais la découverte préalable d'autres formes de vie inférieures avait largement préparé les [Root.GetSpeciesNamePlural] à un tel choc."
 story.2.desc.gesta: "Des organismes extrémophiles parcourant l'espace ont été observés."
 story.2.desc.evopred: "La [Root.GetName] a rencontré un organisme spatial ! Nos [GetScientistPlural] ne savent pas encore ce qui a conduit à la croissance de ces créatures géantes dans le vide intersidéral, ni de quelles adaptations génétiques ces extrêmophiles pourraient être dotés. Nous sommes impatients de le découvrir."
 story.3.name: "Rapport de contact : faune"
 story.3.desc: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces organismes aliens.\n\nBien que selon les normes des [Root.GetSpeciesNamePlural] leur intelligence soit limitée, ces êtres fascinants échappent à toute classification et mettent en évidence l'immense complexité et les possibilités infinies de l'univers."
 story.3.desc.spiri: "Dans l'ensemble, les ecclésiastiques de [Root.Capital.GetName] ont bien réagi lorsqu'ils ont appris qu'avaient été découverts des organismes dénués d'intelligence mais complexes sur des planètes lointaines.\n\nCette découverte a déclenché un débat doctrinal interne : cela prouve-t-il que les [Root.GetSpeciesNamePlural] dominent toute la création ou n'avons-nous simplement pas encore rencontré nos frères aliens ?"
 story.3.desc.followup: "Les xéno-biologistes [Root.GetSpeciesAdj] sont impatients d'étudier les formes de vie aliens complexes qui viennent d'être découvertes, d'autant qu'elles ne semblent pas très différentes de celles que l'on trouve sur [Root.Capital.GetName].\n\nCes êtres échappent encore à toute classification et ne possèdent guère plus que de purs instincts animaux, mais le simple fait qu'ils existent prouve que certains aspects de la vie sont universels."
 story.3.desc.gesta: "L'existence de formes de vie animales a été confirmée sur un monde alien."
 story.3.desc.evopred: "La [Root.GetName] a découvert une nouvelle forme de vie complexe ! Ces créatures ne peuvent pas vraiment être qualifiées d'intelligentes, mais notre civilisation sait apprécier la diversité génomique.\n\nNos [GetScientistPlural] ont déjà commencé à calculer la quantité de matériel génétique nécessaire pour satisfaire tout le monde."
 story.4.name: "Contact : êtres préintelligents"
 story.4.desc: "La [Root.GetName] est en pleine effervescence depuis qu'ont été découverts ces êtres aliens.\n\nLeur quasi-intelligence est fascinante, et on ne peut s'empêcher de remarquer que si les [Root.GetSpeciesNamePlural] ne font qu'entrer sur la scène galactique, le chemin qu'ils ont parcouru est déjà long."
 story.4.desc.phobe: "Ces animaux aliens qui ont pu être observés ont semé la consternation sur [Root.Capital.GetName]. Les vidéos de ces êtres à la démarche lourde et au regard vide ont profondément troublé la population.\n\nCela dit, le plus déroutant n'est sans doute pas leur nature alien, mais le fait que les xénobiologistes les prétendent très semblables à nous. Il s'agit là du reflet déformé d'un processus d'évolution que les [Root.GetSpeciesNamePlural] préféreraient oublier."
 story.4.desc.phile: "Les médias de toute la [Root.GetName] ne parlent plus que de ces êtres aliens récemment découverts.\n\nLeur intelligence est fascinante, et on ne peut s'empêcher de remarquer que si les [Root.GetSpeciesNamePlural] ne font qu'entrer sur la scène galactique, le chemin qu'ils ont parcouru est déjà long. Déjà, la plupart d'entre eux s'accordent à dire que nous avons l'obligation et le devoir moral d'aider d'autres espèces à suivre le même chemin que nous, lorsqu'elles y seront prêtes."
 story.4.desc.spiri: "Toutes les congrégations de la [Root.GetName] sont en effervescence depuis la découverte de ces êtres aliens, il y a quelque temps de cela.\n\nLeur quasi-intelligence est fascinante, et on ne peut s'empêcher de remarquer que si les [Root.GetSpeciesNamePlural] ne font qu'entrer sur la scène galactique, le chemin qu'ils ont parcouru est déjà long. Des débats houleux ont d'ailleurs lieu à ce propos sur [Root.Capital.GetName], pour déterminer s'il est de notre rôle ou non de guider ces créatures, si un jour elles devenaient intelligentes et pouvaient elles aussi voyager parmi les étoiles."
 story.4.desc.followup: "Après les récentes découvertes de formes de vie inférieures, la capitale [Root.GetSpeciesName] a appris qu'avaient été observés des êtres dotés d'impressionnantes capacités cognitives, même si elles sont encore latentes, et un grand potentiel évolutif.\n\nLes rapports des scientifiques ont été accueillis avec beaucoup d'enthousiasme."
 story.4.desc.gesta: "L'existence de formes de vie aliens sur le point d'accéder à la conscience a été confirmée."
 story.4.desc.evopred: "Nous avons rencontré une nouvelle forme de vie alien. Ces créatures sont bien plus avancées que les habitants de [GetHomeWorldName] et presque douées de raison. Nous avons déjà commencé à mettre en place la logistique et les procédures de clonage nécessaires au traitement de ces nouveaux génomes alléchants."
 story.5.name: "Rapport de contact : vestiges"
 story.5.desc: "La [Root.GetName] est en pleine effervescence depuis qu'ont été trouvés ces vestiges aliens.\n\nCes traces sont une preuve irréfutable qu'une vie alien intelligente et réfléchie a existé à un moment donné. Les [Root.GetSpeciesNamePlural] sont peut-être seuls aujourd'hui, mais ils ne sont pas les premiers à l'avoir été."
 story.5.desc.phobe: "L'administration de [Root.Capital.GetName] a reçu avec fébrilité les rapports sur les vestiges aliens qui viennent d'être retrouvés.\n\nLes traces en question sont désormais largement considérées comme la preuve irréfutable que des forces inconnues étaient par le passé actives dans la galaxie, même si des membres de l'élite intellectuelle [Root.GetSpeciesName] rejettent toujours cette idée et préfèrent y voir les traces « d'étranges formations géologiques » ou « le résultat d'un phénomène naturel curieux »."
 story.5.desc.phile: "Les xénologistes de toute la [Root.GetName] se bousculent pour publier leurs conclusions sur la découverte des vestiges d'une civilisation alien.\n\nLa fièvre qui s'est emparée de la communauté scientifique est telle que cela a en partie ralenti les projets en cours dans les autres champs de la recherche."
 story.5.desc.followup: "« Les formes de vie intelligentes nous narguent par leur absence » titre un réseau d'information populaire de [Root.Capital.GetName]. Les [Root.GetSpeciesNamePlural] semblent beaucoup s'amuser du fait qu'il est désormais de notoriété publique que nous avons trouvé la preuve irréfutable de formes de vies inférieures, mais que nous n'avons toujours pas découvert d'êtres aussi intelligents que nous.\n\nEt les rapports au sujet des traces observées ne font qu'ajouter une pointe d'ironie à la situation..."
 story.5.desc.gesta: "L'existence des premières traces matérielles d'une forme de vie alien intelligente sur un autre monde a été confirmée."
 story.6.name: "Contact : civilisation pré-PRL"
 story.6.desc: "La [Root.GetName] est en pleine effervescence depuis que nos vaisseaux ont découvert une civilisation alien pré-PRL.\n\nLes habitants de §Y[primitive_planet.GetName]§! ne sont certes pas capables de voyager dans l'espace, mais leur intelligence est évidente et quantifiable, et leur société présente toutes les caractéristiques d'une culture modérément avancée."
 story.6.desc.phobe: "Les nouvelles de la découverte d'une espèce pré-PRL montrant des signes d'une intelligence rudimentaire, la prétendue « civilisation de §Y[primitive_planet.GetName]§! », n'ont pas été très bien accueillies sur [Root.Capital.GetName].\n\nUn profond sentiment de malaise imprègne le débat public. Une minorité bruyante préconise d'user de tous les moyens nécessaires pour imposer l'hégémonie [Root.GetSpeciesName] sur cette [primitive_planet.GetPlanetMoon], tandis que la plupart des [Root.GetSpeciesNamePlural] semblent préférer éviter tout contact avec ces êtres, voire ignorer leur existence."
 story.6.desc.phile: "Les rapports de nos flottes relatifs à l'observation de cette civilisation pré-PRL sur §Y[primitive_planet.GetName]§! ont été accueillis avec des cris de joie par les membres de l'élite universitaire [Root.GetSpeciesName].\n\nLa preuve est faite, désormais, que les premiers pas des [Root.GetSpeciesNamePlural] dans l'immensité de l'espace n'ont pas été vains. Ces êtres ne sont peut-être pas nos égaux, pas encore, et il se peut même que nous ne voyions pas de notre vivant les premières relations avec eux, mais leur simple existence constitue une lueur d'espoir dans une galaxie qui semblait jusqu'à présent entièrement dénuée de vie."
 story.6.desc.followup5: "La communauté scientifique de [Root.Capital.GetName] est en pleine effervescence depuis qu'une forme de vie alien intelligente a été découverte.\n\nLes aliens de [primitive_planet.GetName] ne sont certes pas capables de voyager dans l'espace, mais leur intelligence est évidente et quantifiable, et leur société présente toutes les caractéristiques d'une culture modérément avancée. D'éminents xénologistes pensent qu'il s'agit là d'une occasion unique d'étudier une société qui n'est peut-être pas si différente de celles dont nous avons précédemment découvert les vestiges."
 story.6.desc.followup4: "Après toutes les découvertes relatives à des espèces préconscientes, les chercheurs de la [Root.GetName] ont accueilli avec enthousiasme les rapports sur l'existence d'une culture pré-PRL sur §Y[primitive_planet.GetName]§!.\n\nPour ce que l'on en sait, les [Root.GetSpeciesNamePlural] sont les premiers à s'être élancés vers les étoiles ; mais il est fascinant de constater qu'il existe des cultures qui n'ont sur nous que quelques millénaires, voire quelques siècles, de retard."
 story.6.desc.followup123: "Venant chapeauter les précédentes découvertes de formes de vie inférieures, le rapport faisant état de formes de vie aliens pré-PRL sur §Y[primitive_planet.GetName]§!, tout récemment découvertes, a ravivé l'intérêt de la communauté scientifique de [Root.Capital.GetName] pour les sciences xénologiques, jusqu'à présent considérées comme un domaine purement théorique."
 story.6.desc.gesta: "L'existence d'une culture alien pré-PRL sur §Y[primitive_planet.GetName]§! a été confirmée. Elle vient tout juste de développer le voyage spatial, en dépit du handicap évident que représentent ses individualités fragmentées."
 story.6.desc.evopred: "La vie intelligente existe ! L'un de nos vaisseaux a découvert une civilisation pré-PRL, prouvant que nous ne sommes pas seuls dans le vide. Nous avons également pu confirmer que leur génome est apte à être absorbé.\n\nLes possibilités d'action vont de l'observation rapprochée à l'invasion pure et simple. Reste à voir comment notre relation se développera, mais les perspectives sont alléchantes."
 story.7.name: "Rapport de contact alien"
 story.7.desc: "Il n'aura pas fallu longtemps à la [Root.GetName] pour rencontrer une forme de vie alien intelligente.\n\nLe rapport envoyé à la capitale [Root.GetSpeciesAdj] ne livre guère d'informations sur l'aspect de ces forces étranges, et mentionne à peine qu'il a été impossible d'entrer en communication avec elles."
 story.7.desc.phobe: "Depuis que des vaisseaux non identifiés ont été repérés dans le vide de l'espace, [Root.Capital.GetName] est en pleine agitation.\n\nTant que nous ignorons leurs intentions, mieux vaut nous préparer au pire."
 story.7.desc.phile: "La [Root.GetName] a enfin rencontré d'autres voyageurs spatiaux.\n\nQuelles que soient leurs intentions, l'ambiance qui règne sur [Root.Capital.GetName] est clairement à l'euphorie. Enfin des témoins !"
 story.7.desc.followup6: "Nous avons rencontré une forme de vie intelligente capable de voyager dans l'espace.\n\nLe contraste avec les pré-PRL préalablement observés par la [Root.GetName] est saisissant, mais nous ne savons rien encore des êtres qui pilotent ces vaisseaux, ni des raisons qui les poussent à naviguer dans l'espace."
 story.7.desc.followup12345: "[Root.Capital.GetName] vient d'apprendre que des vaisseaux aliens parcouraient l'espace. Cela met donc un terme à une première partie de l'histoire de la [Root.GetName], qui s'était prise à rêver de constituer un empire stellaire."
 story.7.desc.mach.followup12345: "Nous avons observé le passage de vaisseaux aliens capables de voler dans l'espace. Si aucune communication n'a encore été établie, il est confirmé que les [Root.GetSpeciesNamePlural] ne sont pas le seul empire de la galaxie capable de parcourir les étoiles."
 story.7.desc.gesta: "Nous avons rencontré une vie alien avancée. Le contact semble inévitable."
 story.7.desc.evopred: "Nous avons découvert une forme de vie capable de voler dans l'espace.\n\nCette grande découverte a immédiatement suscité de nombreux débats philosophiques et moraux : si ces créatures ont des gènes qui peuvent être absorbés, devons-nous les prendre de force ou demander poliment ? Si nous clonons des échantillons qui nous sont remis volontairement, il y aura assez de matériel génétique pour tout le monde.\n\nLe résultat du premier contact avec ces explorateurs intelligents devrait nous aider à trouver une réponse."
 story.7.a.swarm: "Proie ?"
 story.contact_report.materialist: "Qui dit nouvelle vie dit nouvelles données scientifiques."
 story.contact_report.spiritualist: "Nous ne faisons qu'un avec le cosmos."
 story.contact_report.militarist: "Nous devons nous préparer à un conflit avec un ennemi potentiel."
 story.contact_report.pacifist: "L'existence d'autres formes de vie élargit nos connaissances."
 story.contact_report.egalitarian: "La diversité enrichit notre sagesse collective."
 story.contact_report.xenophile: "Une nouvelle connexion à la vie."
 story.contact_report.xenophobe: "Renforçons nos défenses contre l'inconnu."
 story.contact_report.authoritarian: "Notre suprématie doit être assurée."
 story.contact_report.gestalt_consciousness_hive: "Préparons-nous à intégrer cette intelligence."
 story.contact_report.gestalt_consciousness_machine: "Analyse des données en vue d'optimiser l'efficacité."
 story.contact_report_first_alien_life_found: "C'est intrigant..."
 story.contact_report_first_alien_life_found_materialist: "Une belle opportunité scientifique."
 story.contact_report_first_alien_life_found_pacifist: "Il n'y a pas lieu de s'inquiéter."
 story.contact_report_first_alien_life_found_militarist: "Une menace potentielle."
 story.contact_report_first_alien_life_found_egalitarian: "Une opportunité de partage de connaissances."
 story.contact_report_first_alien_life_found_authoritarian: "L'ordre sera préservé."
 story.contact_report_first_alien_life_found_spiritualist: "Une manifestation du divin."
 story.contact_report_first_alien_life_found_xenophile: "Un nouveau départ."
 story.contact_report_first_alien_life_found_xenophobe: "Qui dit nouvelle vie dit dangers inconnus."
 story.contact_report_first_alien_life_found_hive: "Une occasion d'enrichir le savoir collectif."
 story.contact_report_first_alien_life_found_machine: "Information bien reçue."
 story.8.name: "Contact : léviathan"
 story.8.desc: "La découverte d'une monstruosité gigantesque vivant dans le vide a donné conscience à la [Root.GetName] d'être insignifiante dans l'ordre général des choses. La première créature rencontrée par notre fier empire pourrait bien être, aussi, la dernière. L'image du léviathan s'est répandue dans tout notre espace, suscitant hystérie collective et plaidoyers en faveur d'une action.\n\nLe rapport de notre flotte établit que cette chose semble suffisamment puissante pour détruire même l'armada la plus expérimentée, et recommande la plus extrême prudence."
 story.8.desc.spirit: "La population [Root.GetSpeciesAdj] a commencé à prier. Cette chose gigantesque rencontrée dans l'obscurité du néant pousse de nombreux habitants de l'empire à craindre pour leur santé mentale, ou à remettre en cause leur foi dans le Divin. Ces choses sont-elles les gardiens de toute vie et de Ce qui les a créées, ou au contraire son ennemi ?"
 story.8.desc.phile: "La [Root.GetName] a rencontré quelque chose qui se trouve au-delà même du sublime. Ces choses gigantesques, dont l'existence immaculée est une preuve des merveilles incommensurables de l'univers, faisant passer la plupart des formes de vie pour des étincelles à côté d'étoiles.\n\nSi la nature réelle du léviathan reste inconnue, la population de [Root.Capital.GetName] est éblouie de la découverte, et des plus optimistes quant aux conséquences."
 story.8.desc.mach: "La découverte d'une entité gigantesque dans le vide de l'espace, aux propriétés inconnues, oblige la [Root.GetName] à redéfinir tous les paramètres connus quant à la surface maximale d'une construction unique douée de capacités hostiles. Les projections de survie au cas où la [Root.GetName] entrerait en conflit avec l'entité nouvelle découverte ne sont guère encourageantes.\n\nLes unités militaires et scientifiques recommandent de poursuivre son observation, et de procéder à des améliorations importantes de nos flottes actuelles."
 story.8.desc.followup7: "Nous avons découvert des choses surpassant de très loin tout ce que nous avons pu rencontrer lors de l'histoire spatiale de l'empire. Une chose capable de grandir jusqu'à un stade sans précédent, rivalisant en taille comme en masse avec des lunes.\n\nRien n'aurait pu nous y préparer. Ce jour sera à jamais un tournant dans l'histoire de la [Root.GetName]. Espérons juste survivre suffisamment longtemps pour pouvoir continuer d'en parler."
 story.8.desc.followup123456: "Les informations rapportant qu'une chose gigantesque a été vue dans le vide obscur de l'espace se répandent comme un feu de paille dans tout l'empire. Certains se montrent inquiétantes, d'autres plus enthousiastes, mais la plupart suscitent au sein de la population un effroi véritablement existentiel. Les annales de l'histoire rapporteront ce jour comme étant d'une importance cruciale."
 story.8.desc.mechanical: "L'information selon laquelle nous avons rencontré une construction gigantesque dans l'espace lointain se répand à travers la [Root.GetName]. Si cette entité ne semble pas être de nature biologique, sa simple existence laisse entrevoir un nombre incroyable de possibilités pour ce qui concerne la technologie et la méga-ingénierie."
 story.8.a: "Tout ce qui existe n'est-il que ténèbres ?"
 story.8.b: "Nous ne sommes que poussière"
 story.8.c: "C'est réellement merveilleux"
 story.8.d: "Reçu ; mise à jour des bases de données en cours"
 story.8.e: "Des démons pour mettre notre foi à l'épreuve"
 story.8.f: "Une nouvelle preuve de l'existence du Divin"
 story.8.g: "Nous aurons beaucoup à apprendre d'eux"
 story.8.h: "Cela fera d'impressionnants trophées"
 ### Space Monsters
 story.101.name: "Amibes spatiales"
 story.101.desc.phile: "Les merveilleuses entités que viennent de découvrir nos flottes sont des formes de vie spatiales inconnues.\n\nRapidement surnommée §Hamibe spatiale§! suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.Owner.GetAdj].\n\nContentons-nous pour le moment d'observer cette créature et ses semblables à distance depuis [Root.Owner.Capital.GetName]."
 story.101.desc.phobe: "Les terrifiantes entités que viennent de découvrir nos flottes sont des formes de vie inconnues.\n\nRapidement surnommée §Hamibe spatiale§! suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.Owner.GetAdj].\n\nNous devrions peut-être tuer un de ces monstres.\n\nAu nom de la science, ou quelque chose comme ça."
 story.101.desc.milit: "Les entités que viennent de découvrir nos flottes sont des formes de vie spatiales.\n\nRapidement surnommée §Hamibe spatiale§! suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.Owner.GetAdj].\n\nElle se montre agressive envers les vaisseaux de la [Root.Owner.GetName], mais une étude plus approfondie est nécessaire."
 story.101.desc.pacif: "Les entités que viennent de découvrir nos flottes sont des formes de vie spatiales inconnues.\n\nRapidement surnommée §Hamibe spatiale§! suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.Owner.GetAdj].\n\nEn raison de son caractère revêche, cette créature devrait être étudiée à distance depuis [Root.Owner.Capital.GetName]."
 story.101.desc.mater: "Les entités que viennent de découvrir nos flottes sont des formes de vie spatiales inconnues.\n\nRapidement surnommée §Hamibe spatiale§! suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.Owner.GetAdj]."
 story.101.desc.gesta: "Les entités que viennent de découvrir nos flottes sont des formes de vies spatiales nouvelles.\n\nQuoique chaque spécimen soit significativement plus grand qu'une corvette [Root.Owner.GetAdj], ces hardes d'§Hamibes de l'espace§! restent minuscules en comparaison de notre ensemble."
 story.101.desc: "Les entités que viennent de découvrir nos flottes sont des formes de vie spatiales inconnues.\n\nRapidement surnommée « amibe spatiale » suite à la grossière erreur d'interprétation d'un analyste, la créature est en fait plus grosse qu'une corvette [Root.GetAdj]."
 story.101.a: "Lancez un Projet spécial pour étudier l'Amibe spatiale à distance."
 story.101.b: "Nos flottes ne devraient faire qu'une bouchée de la créature."
 story.105.name: "Amibes spatiales : des créatures fascinantes"
 #project completed
 story.105.desc.phile: "Dès qu'elles atteignent l'âge adulte, les amibes spatiales (car tel est le surnom affectueux qui leur a été donné sur [Root.Capital.GetName]) deviennent solitaires. Hormis les plus jeunes spécimens, elles sont toutes accompagnées de ce que l'on appelle des « flagelles », des organismes quasi indépendants qui paraissent engendrés par les amibes elles-mêmes, et programmés pour obéir à leur hôte grâce à des sécrétions liquides contenant de l'ARN.\n\nPris au départ pour de jeunes amibes, ces flagelles ne semblent jouer aucun rôle dans les mécanismes de reproduction, chacun agissant plutôt pour son amibe hôte à la façon d'un membre physiquement indépendant. Ils ont ainsi la capacité de manipuler, voire d'attaquer de façon très violente tout ce qui se trouve autour de leur hôte, même si leur portée reste limitée. Régulièrement, ils regagnent le corps de cette dernière pour y être reprogrammés.\n\nLeurs gracieux déplacements ou bien les propriétés régénérantes de la peau épaisse de l'amibe pourraient bien donner naissance à des applications militaires."
 story.105.desc.pacif: "Dès qu'elles atteignent l'âge adulte, les amibes spatiales (ce surnom trouve son origine dans la façon dont [Root.Capital.GetName] a appris son existence) deviennent solitaires. Hormis les plus jeunes spécimens, elles sont toutes accompagnées de ce que l'on appelle des « flagelles », des organismes quasi indépendants qui paraissent engendrés par les amibes elles-mêmes, et programmés pour obéir à leur hôte grâce à des sécrétions liquides contenant de l'ARN.\n\nPris au départ pour de jeunes amibes, ces flagelles ne semblent jouer aucun rôle dans les mécanismes de reproduction, chacun agissant plutôt pour son amibe hôte à la façon d'un membre physiquement indépendant. Ils ont ainsi la capacité de manipuler, voire d'attaquer de façon très violente tout ce qui se trouve autour de leur hôte, même si leur portée reste limitée. Régulièrement, ils regagnent le corps de cette dernière pour y être reprogrammés."
 story.105.desc: "Dès qu'elles atteignent l'âge adulte, les amibes spatiales - dont le nom est resté car leur dénomination xénotaxonomique officielle est trop difficile à prononcer pour le commun des [Root.GetSpeciesNamePlural] - deviennent solitaires. Hormis les plus jeunes spécimens, elles sont toutes accompagnées de ce que l'on appelle des « flagelles », des organismes quasi indépendants qui paraissent engendrés par les amibes elles-mêmes, et programmés pour obéir à leur hôte grâce à des sécrétions liquides contenant de l'ARN.\n\nPris au départ pour de jeunes amibes, ces flagelles ne semblent jouer aucun rôle dans les mécanismes de reproduction, chacun agissant plutôt pour son amibe hôte à la façon d'un membre physiquement indépendant. Il a ainsi la capacité de manipuler, voire d'attaquer de façon très violente tout ce qui se trouve autour de son hôte, même si sa portée reste limitée. Régulièrement, ces flagelles regagnent le corps de cette dernière pour y être reprogrammés.\n\nLeurs gracieux déplacements ou bien les propriétés régénérantes de la peau épaisse de l'amibe pourraient bien donner naissance à des applications militaires."
 story.105.desc.gesta: "Une amibe spatiale est le plus souvent accompagnée d'une poignée de flagelles semi-indépendants, utilisés pour la défense et la manipulation de corps physiques. L'amibe et ses flagelles ne partagent pas le même esprit. Au lieu de cela, la première utilise des sécrétions contenant de l'ARN pour programmer les seconds afin qu'ils exécutent des tâches d'une complexité relative."
 story.105.a: "Fascinant."
 story.110.name: "Amibes spatiales disséquées"
 #debris studied
 story.110.desc.phobe: "Les amibes spatiales, pour reprendre le surnom popularisé par les forces spéciales de la [Root.GetName] chargées de les abattre, sont des créatures bien plus complexes que nous l'avions pensé. Leur solide enveloppe extérieure renferme une multitude de poches abritant de « petites amibes », dont nos flottes ont rapporté qu'elles se comportent en véritables vaisseaux de combat lorsque l'« amibe mère » est attaquée. Mais si en dehors de leur différence de taille elles sont en apparence semblables aux amibes spatiales, ces « amibes d'attaque » sont cependant des créatures bien plus primaires. À côté de ces poches, le corps de l'amibe spatiale abrite ainsi des centaines d'organes délicats, vraisemblablement indispensables à la survie dans le vide de l'espace.\n\nMalheureusement, la plupart de ces organes se sont rompus ou ont même tout simplement brûlé lors de la prise du spécimen qui a été ramené, aussi ne disposons-nous pour l'instant que d'une carcasse très incomplète.\n\nLes xénobiologistes du projet Amibe spatiale jugent toutefois le processus de prélèvement de spécimens relativement fiable, et ils ont donné des instructions de ciblage spécifiques aux flottes militaires concernées : grâce à des frappes chirurgicales visant certaines parties bien précises de leur anatomie, abattre cinq autres amibes permettrait de reconstituer l'intégralité d'une carcasse."
 story.110.desc.milit: "Les amibes spatiales, pour reprendre le catalogue officiel des cibles des forces de la [Root.GetName], sont des créatures bien plus complexes que nous l'avions pensé. Leur solide enveloppe extérieure renferme une multitude de poches abritant de « petites amibes », dont nos flottes ont rapporté qu'elles se comportent en véritables vaisseaux de combat lorsque l'« amibe mère » est attaquée. Mais si en dehors de leur différence de taille elles sont en apparence semblables aux amibes spatiales, ces « amibes d'attaque » sont cependant beaucoup moins complexes sur le plan physiologique. À côté de ces poches, le corps de l'amibe spatiale abrite ainsi des centaines d'organes délicats, vraisemblablement indispensables à la survie dans le vide de l'espace.\n\nMalheureusement, la plupart de ces organes se sont rompus ou ont même tout simplement brûlé lors de la prise du spécimen qui a été ramené, aussi ne disposons-nous pour l'instant que d'une carcasse très incomplète.\n\nLes xénobiologistes du projet Amibe spatiale jugent toutefois le processus de prélèvement de spécimens relativement fiable, et ils ont donné des instructions de ciblage spécifiques aux flottes militaires concernées : grâce à des frappes chirurgicales visant certaines parties bien précises de leur anatomie, abattre cinq autres amibes permettrait de reconstituer l'intégralité d'une carcasse."
 story.110.desc: "Les amibes spatiales (dont le nom a été conservé car elles échappent à toute classification de la taxonomie [Root.Owner.Capital.GetSpeciesAdj] traditionnelle) sont beaucoup plus complexes que nous le pensions. Leur solide carapace renferme de nombreuses poches, qui abritent elles-mêmes de « petites amibes », dont nos flottes ont rapporté qu'elles agissent en véritable force de frappe lorsque « l'amibe mère » est attaquée. En dehors de leur différence évidente de taille, ces « amibes de combat » sont néanmoins beaucoup moins complexes sur le plan physiologique. En dehors de ces poches, le corps de l'amibe spatiale compte ainsi des centaines d'organes délicats, sans doute essentiels à la survie dans le vide de l'espace. La plupart de ces organes ont été éventrés ou même simplement brûlés lors de la prise de l'échantillon étudié, aussi ne disposons-nous actuellement que d'une carcasse très incomplète. Les xénobiologistes chargés de l'étude pensent toutefois que cela leur suffira, et ils sont déjà parvenus à identifier plusieurs aspects et faiblesses physiologiques, propres aux amibes de l'espace."
 story.110.desc.gesta: "Les amibes spatiales sont bien plus complexes que prévu. Leur solide enveloppe extérieure renferme une multitude de poches abritant de « petites amibes », dont nos flottes ont rapporté qu'elles se comportent en véritables vaisseaux de combat lorsque « l'amibe mère » est attaquée. Mais si en dehors de leur différence évidente de taille elles sont en apparence semblables aux amibes spatiales, ces « amibes d'attaque » sont cependant beaucoup moins complexes sur le plan physiologique. À côté de ces poches, le corps de l'amibe spatiale abrite ainsi des centaines d'organes délicats, vraisemblablement indispensables à la survie dans le vide de l'espace.\n\nMalheureusement, la plupart de ces organes se sont rompus ou ont même tout simplement brûlé lors de la prise du spécimen qui a été ramené, aussi ne disposons-nous pour l'instant que d'une carcasse très incomplète.\n\nLes xénobiologistes du projet Amibe spatiale, étant déjà parvenus à identifier plusieurs aspects et faiblesses physiologiques propres aux amibes, jugent toutefois que cela leur suffira."
 story.110.a.phobe: "Faisons notre possible pour nous en débarrasser au plus vite"
 story.110.b.milit: "Ces Amibes font de parfaites cibles d'entraînement."
 story.110.c: "Très bien."
 story.115.name: "Amibes spatiales massacrées" #kill 5 quest
 story.115.desc.phobe: "Grâce aux différentes carcasses d'Amibes spatiales que nous avons réussi à prélever, nous allons pouvoir étudier la relation grotesque qu'entretiennent ces créatures avec les petits Flagella qu'elles hébergent. Dans l'état actuel des connaissances des xéno-biologistes [Root.GetSpeciesAdj], ces Flagella (qui doivent leur nom aux mouvements de fouet qu'ils décrivent en se déplaçant) ne sont ni les progénitures des Amibes spatiales ni des parasites. Ils sont simplement engendrés par l'hôte lorsque celui-ci atteint l'âge adulte, et constituent davantage des outils que le résultat d'une procréation. Une fois leur tâche accomplie, ils regagnent une poche dans le corps de l'Amibe hôte, sans doute pour recevoir de nouveaux ordres. Ce sont des opérateurs, des appendices aveugles qui se déploient dans l'obscurité. Ils présentent l'inconvénient de réagir très lentement, mais ce défaut est en partie compensé par le grand nombre de Flagella que déploie l'Amibe ainsi que par leurs réflexes et leur capacité à suivre aveuglément leur hôte.\n\nQuoi qu'il en soit, nous avons tout intérêt à les tuer tout de suite."
 story.115.desc.milit: "Grâce aux différentes carcasses d'Amibes spatiales que nous avons réussi à prélever, nous allons pouvoir étudier la curieuse relation qu'entretiennent ces créatures avec les petits Flagella qu'elles hébergent. Dans l'état actuel des connaissances des xéno-biologistes [Root.GetSpeciesAdj], ces Flagella (qui doivent leur nom aux mouvements de fouet qu'ils décrivent en se déplaçant) ne sont ni les progénitures des Amibes spatiales ni des parasites. Ils sont simplement engendrés par l'hôte lorsque celui-ci atteint l'âge adulte, et constituent davantage des outils que le résultat d'une procréation. Compte tenu de la complexité de leurs déplacements et interactions, nous pensions que les Flagella possédaient un cerveau, mais au lieu de cela, nous avons découvert un centre de traitement glandulaire complexe. Ce centre décode les ordres sécrétés par l'Amibe sous forme d'ARN et reçus par le Flagellum grâce à des récepteurs sous-cutanés. Une fois leur tâche accomplie, ils regagnent une poche dans le corps de l'Amibe hôte pour recevoir de nouveaux ordres. Ce sont des opérateurs aux ordres de leur hôte. Ils présentent l'inconvénient de réagir très lentement, mais ce défaut est en partie compensé par le grand nombre de Flagella que déploie l'Amibe ainsi que par leurs réflexes et leur capacité à suivre aveuglément leur hôte. La maîtrise relative du combat que présentent les Amibes spatiales est largement due à l'efficacité avec laquelle elles déploient leurs Flagella. Nos forces auraient d'ailleurs beaucoup à en apprendre."
 story.115.desc: "Suite au prélèvement d'une quatrième créature, une carcasse complète d'Amibe spatiale a pu être reconstituée sur la capitale de [Root.GetName], [Root.Capital.GetName]. Nous commençons à percer les secrets de ces créatures, que nous transmettons aux services concernés de l'administration [Root.GetSpeciesAdj].\n\nPour le moment, la découverte la plus intéressante concerne les membranes cutanées des Amibes spatiales. Grâce à un processus glandulaire complexe, elles absorbent et métabolisent une large palette de rayonnements cosmiques dont elles semblent se nourrir."
 story.115.a.phobe: "Bien." #emp mod, +20% dmg vs amoebas
 story.115.b.milit: "Nous devons en tirer des enseignements." #emp mod, improved strike craft
 story.115.c: "Ces connaissances pourraient servir une bonne cause." #emp mod, +5% energy
 story.201.name: "Entités cristallines"
 story.201.desc.base: "Les [This.Owner.GetResearchers] ont terminé d'enquêter sur ces extraordinaires objets cristallins qui ont été observés, flottant librement dans le système de [This.System.GetName]. Leurs découvertes sont stupéfiantes."
 story.201.desc.phile: "$story.201.desc.base$\n\nIls sont aussi grands que des vaisseaux et, de même que leurs satellites, de taille plus réduite mais eux aussi cristallins, ils paraissaient au départ inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons maintenant qu'ils sont vivants. Ces entités fascinantes doivent être approchées avec la plus grande prudence.\n\nNos meilleurs scientifiques sont impatients de les étudier."
 story.201.desc.phobe: "$story.201.desc.base$\n\nCes objets sont aussi grands que des vaisseaux et, ainsi que leurs petits satellites cristallins, semblaient initialement inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons maintenant qu'ils peuvent être dangereux et qu'ils doivent être approchés avec la plus grande prudence.\n\nNous devrions déployer une flotte pour évaluer le potentiel offensif éventuel de ces cristaux, et les détruire s'ils se révèlent menaçants."
 story.201.desc.pacif: "$story.201.desc.base$\n\nCes objets sont aussi grands que des vaisseaux et, ainsi que leurs petits satellites cristallins, semblaient initialement inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons qu'ils peuvent être dangereux. Ils doivent donc être approchés avec la plus grande prudence.\n\nPour éviter d'entrer en conflit avec ces énigmatiques prismes, il serait préférable de les observer à distance depuis la capitale."
 story.201.desc.spiri: "$story.201.desc.base$\n\nCes objets sont aussi grands que des vaisseaux et, ainsi que leurs petits satellites cristallins, semblaient initialement inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons qu'ils réagissent à la présence des vaisseaux de la [Root.Owner.GetName].\n\nPour le moment, nous ignorons tout de la nature et de l'origine de ces cristaux, mais leur forme et leurs angles purs ne peuvent qu'inspirer l'âme [Root.GetSpeciesName]. Mieux vaudrait donc que nous nous retirions quelque peu pour les observer à une distance respectueuse."
 story.201.desc.milit: "$story.201.desc.base$\n\nCes objets sont aussi grands que des vaisseaux et, ainsi que leurs petits satellites cristallins, semblaient initialement inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons qu'ils peuvent être dangereux. Ils doivent donc être approchés avec la plus grande prudence.\n\nMême s'ils ne nous sont d'aucune utilité sur le plan militaire, leur étude se révélera certainement intéressante."
 story.201.desc: "$story.201.desc.base$\n\nCes objets sont aussi grands que des vaisseaux et, de même que leurs petits satellites cristallins, ils semblaient initialement inertes. Mais, compte tenu des brusques changements d'orientation qui ont été constatés à l'approche de nos vaisseaux et des nouvelles signatures énergétiques qui ont émergé des prismes, nous pensons qu'ils peuvent être dangereux. Ils doivent donc être approchés avec la plus grande prudence.\n\nDeux options s'offrent à nous : tenter d'attaquer de front ces objets potentiellement dangereux, ou les observer à distance."
 story.201.a: "Lançons un projet spécial pour étudier ces cristaux à distance"
 story.201.b: "Nos flottes les détruiront sans doute aisément"
 story.205.name: "Entités cristallines indestructibles"
 story.205.desc.phile: "Les Entités cristallines (dont le nom est issu d'un compromis entre factions rivales de xénobiologistes et de xénogéologues de [Root.Capital.GetName]) sont bien vivantes.\n\nDes membres un peu trop conservateurs de l'élite universitaire [Root.GetSpeciesAdj] affirment qu'il s'agit d'une « matière silicatée animée » n'ayant rien en commun avec des créatures biologiques.\n\nLa grande majorité de la population [Root.GetAdj] rejette cette approche régressive, préférant voir en ces Entités cristallines une perspective aussi nouvelle que fascinante. Ce sont malheureusement des êtres solitaires, chaque Souverain de cristal n'étant que rarement accompagné de plus d'une Sentinelle et d'un petit Acolyte. L'Acolyte et la Sentinelle semblent être les subordonnés du Souverain du groupe, mais en dehors de cela, les subtiles relations socio-hiérarchiques des Entités nous échappent, d'où la ferveur que suscite leur étude sur [Root.Capital.GetName].\n\nApparemment, elles ne s'accouplent pas et nous ne savons pas encore distinguer les cristaux les plus âgés des plus jeunes. Contrairement à ce que l'on croyait au départ, les différences de couleurs ne semblent pas liées à leur âge, mais à leur charge interne latente (qui peut être violemment libérée) dont les fluctuations sporadiques modifient les propriétés réfractives du cristal."
 story.205.desc: "Les Entités cristallines (dont le nom est issu d'un compromis entre factions rivales de xénobiologistes et de xénogéologues de [Root.Capital.GetName]) sont probablement vivantes.\n\nLeur précédente dénomination de « matière silicatée animée » était peut-être plus éloquente, car elles n'ont rien en commun avec des créatures biologiques. Ce sont des êtres solitaires, chaque Souverain de cristal n'étant que rarement accompagné de plus d'une Sentinelle et d'un petit Acolyte. Nous savons que l'Acolyte et la Sentinelle sont les subordonnés du Souverain du groupe, mais en dehors de cela, les subtiles relations socio-hiérarchiques des Entités cristallines nous échappent.\n\nApparemment, les Entités ne s'accouplent pas et nous ne savons pas encore distinguer les cristaux les plus âgés des plus jeunes. Contrairement à ce que l'on croyait au départ, les différences de couleurs ne semblent pas liées à leur âge mais à leur charge interne latente (qui peut être violemment libérée) dont les fluctuations sporadiques modifient les propriétés réfractives du cristal."
 story.205.desc.pacif: "Les Entités cristallines (dont le nom est issu d'un compromis entre factions rivales de xénobiologistes et de xénogéologues de [Root.Capital.GetName]) sont probablement vivantes.\n\nLeur précédente dénomination de « matière silicatée animée » était peut-être plus éloquente car elles n'ont rien en commun avec des créatures biologiques. Ce sont des êtres solitaires, chaque Souverain de cristal n'étant que rarement accompagné de plus d'une Sentinelle et d'un petit Acolyte. Nous savons que l'Acolyte et la Sentinelle sont les subordonnés du Souverain du groupe, mais en dehors de cela, les subtiles relations socio-hiérarchiques des Entités cristallines nous échappent.\n\nApparemment, les Entités ne s'accouplent pas et nous ne savons pas encore distinguer les cristaux les plus âgés des plus jeunes. Contrairement à ce que l'on croyait au départ, les différences de couleurs ne semblent pas liées à leur âge mais à leur charge interne latente dont les fluctuations sporadiques modifient les propriétés réfractives du cristal. Les Entités cristallines sont capables de projeter violemment leur charge interne sur une cible spécifique. Et elles semblent hélas extrêmement promptes à attaquer les entités étrangères qu'elles rencontrent."
 story.205.desc.spiri: "L'existence même des Entités cristallines (dont le nom est issu d'un compromis entre factions rivales de xénobiologistes et de xénogéologues de [Root.Capital.GetName]) semble étrangère à tout concept de vie et de mort. Les esprits les plus terre à terre de [Root.Capital.GetName] les qualifient de « matière silicatée animée », affirmant que malgré leur singularité elles restent soumises aux mêmes lois qui, selon eux, nous gouvernent tous.\n\nQuoi qu'il en soit, ces Entités sont des êtres solitaires et majestueux. Chaque Souverain de cristal n'est que rarement accompagné de plus de deux entités subordonnées, une Sentinelle et un petit Acolyte. Les Entités ne s'accouplent pas, et aucune d'entre elles ne semble plus âgée ou plus jeune que les autres. Elles sont toutes issues d'un passé lointain et pur. Les différences de couleurs qui ont été observées semblent liées à leur charge interne latente (qui peut être violemment libérée) dont les fluctuations sporadiques modifient les propriétés réfractives du cristal."
 story.205.desc.gesta: "Les entités cristallines sont très probablement vivantes.\n\nSans doute un terme plus approprié pour les décrire serait « matière silicio-animée », car elles ont peu en commun avec les formes de vie biologiques ou artificielles traditionnelles.\n\nApparemment elles ne s'accouplent pas, et aucune d'entre elles ne semble plus jeune ou plus âgée que les autres. Contrairement à ce que l'on croyait au départ, les différences de couleur entre individus ne semblent pas liées à leur âge, mais à leur charge interne latente (qui peut être violemment libérée), dont les fluctuations sporadiques modifient les propriétés réfractives du cristal dont elles sont composées."
 story.205.a: "Cette découverte est une véritable aubaine pour les sciences"
 story.205.a.tooltip: "Confère le modificateur §YLentilles prismatiques§! à l'empire :\n£physics£ §G+10%§!"
 story.205.b: "Trouvons une application pratique à ces informations"
 story.205.b.tooltip: "Confère le modificateur §YSonar en cristal§! à l'empire :\ndépenser §Y30§!£energy£ suffira pour lancer l'§YÉtude instantanée§! du système où se trouvent des Entités cristallines, dès l'entrée dans celui-ci."
 story.205.aa: "Quelles en seraient les applications militaires ?"
 story.205.bb: "Cela pourrait nous être utile"
 story.210.name: "Entité cristalline brisée"
 story.210.desc.milit: "Les Entités cristallines (nouvelle dénomination décrivant mieux leur apparente nature de matière en silicate mais animée) sont des adversaires coriaces et agressifs.\n\nLes combats que nous avons livrés contre elles nous ont permis d'identifier des points faibles structurels qui devraient théoriquement être communs à toutes les Entités cristallines. Et tant mieux, car nos flottes vont devoir combattre plusieurs autres spécimens si nous voulons en apprendre plus sur ces étranges prismes. Ce que nous savons c'est que les changements qui interviennent en termes d'agressivité apparente et de génération interne de puissance (pour alimenter leur décharge semblable à une arme) sont accompagnés de variations lumineuses.\n\nEn substance, il est probable que les vaisseaux [Root.GetSpeciesAdj] croisent des Entités cristallines de couleurs différentes traduisant des comportements et des capacités de combat variables."
 story.210.desc.mater: "Les Entités cristallines (à nouveau désignées sous ce nom depuis que l'on a découvert qu'elles avaient plus de points communs avec des animaux qu'avec des minéraux précieux) sont agressives et franchement hostiles envers les vaisseaux [Root.GetSpeciesAdj]. Elles perçoivent peut-être nos flottes comme des entités métalliques qui doivent à tout prix être chassées de leurs territoires cristallins.\n\nLes combats que nous avons livrés contre elles nous ont permis d'identifier des points faibles structurels qui devraient théoriquement être communs à toutes les Entités cristallines. En outre, les changements qui interviennent en termes d'agressivité apparente et de génération interne de puissance (pour alimenter leur décharge semblable à une arme) sont accompagnés de variations lumineuses.\n\nEn substance, il est probable que les vaisseaux [Root.GetSpeciesAdj] croisent des Entités cristallines de couleurs différentes traduisant des comportements et des capacités de combat variables.\n\nSi nous voulons en savoir plus sur ces Entités cristallines, nous allons devoir continuer à les affronter. Malgré notre incapacité à les exploiter en tant que ressources naturelles, le [Root.GetName] ne s'avoue pas vaincu."
 story.210.desc: "Les Entités cristallines (ainsi nommées lorsqu'il est apparu que leur comportement est bien un comportement et non un processus minéralogique obscur) sont agressives et franchement hostiles envers les vaisseaux [Root.GetSpeciesAdj]. Elles perçoivent peut-être nos flottes comme des entités métalliques qui doivent à tout prix être chassées de leurs territoires cristallins.\n\nLes combats que nous avons livrés contre elles nous ont permis d'identifier des points faibles structurels qui devraient théoriquement être communs à toutes les Entités cristallines. En outre, les changements qui interviennent en termes d'agressivité apparente et de génération interne de puissance (pour alimenter leur décharge semblable à une arme) sont accompagnés de variations lumineuses.\n\nEn substance, il est probable que les vaisseaux [Root.GetSpeciesAdj] croisent des Entités cristallines de couleurs différentes traduisant des comportements et des capacités de combat variables.\n\nComme il semble impossible d'interagir pacifiquement avec elles, la seule option qui nous reste est de continuer à les affronter si nous voulons en savoir plus."
 story.210.desc.gesta: "Les entités cristallines sont agressives et ouvertement hostiles envers nous et nos vaisseaux. Peut-être perçoivent-elles nos flottes comme des entités métalliques, devant à tout prix être chassées de leurs territoires.\n\nLes divers combats livrés jusqu'à présent contre elles ont toutefois permis de révéler des faiblesses structurelles qui devraient, en théorie, être partagées par tous les individus. En outre, les changements relevés en termes d'agressivité apparente et de génération énergétique interne - qui alimente leurs décharges, utilisées comme une arme - se traduisent par des modifications dans la façon dont les cristaux diffractent la lumière.\n\nEn substance, il est probable que les vaisseaux de la [Root.GetName] rencontreront toujours des entités cristallines de couleurs différentes, aussi devons-nous nous préparer aux comportements et aux capacités de combat que chacune traduit.\n\nPuisque toute relation pacifique avec elles semble pour l'heure impossible, nous n'avons d'autre choix que continuer à les affronter directement si nous voulons en apprendre plus sur elles."
 story.210.a: "C'est d'accord."
 story.215.name: "Entités cristallines écrasées"
 story.215.desc.milit: "Les flottes du [Root.GetName] écrasent tous les cristaux qu'elles croisent sur leur route.\n\nLa véritable nature des Entités cristallines restera probablement à jamais un mystère pour nous, mais quelle importance ?\n\nLes forces [Root.GetSpeciesAdj] n'ont désormais aucun mal à annihiler ces prismes, car au fil de notre campagne, nous avons réussi à affiner notre arsenal."
 story.215.desc.mater: "Après la destruction de plusieurs spécimens cristallins et le prélèvement de milliers d'échantillons, les ingénieurs [Root.GetSpeciesAdj] ont fini par mettre au point un processus rentable qui permet de transformer les restes des Entités cristallines en matériaux exploitables.\n\nNous ignorons encore si cela compensera le coût de la guerre menée contre les cristaux, mais c'est en tout cas une victoire pour l'industrie."
 story.215.desc: "En dépit de nos fréquents affrontements avec elles, les Entités cristallines restent plus énigmatiques que jamais. Puisqu'elles ne semblent pas s'accoupler, nous nous interrogeons toujours sur leur mode de procréation.\n\nNous avons trouvé différents usages aux fragments d'Entités cristallines détruites, mais certains aspects, comme leur nature réelle, restent fondamentalement inexplicables."
 story.215.desc.gesta: "En dépit de plusieurs combats contre elles, les entités cristallines sont toujours un véritable mystère. Elles ne paraissent pas s'accoupler, et il reste difficile d'imaginer qu'une sorte d'immense géode spatiale puisse produire naturellement ces choses.\n\nNous avons bien trouvé quelques usages aux éclats des cristaux détruits, mais il reste à craindre que certains aspects, au premier rang desquels leur véritable nature, restent tout simplement et à jamais inexpliqués."
 story.215.a.milit: "Qu'importe la vérité, ce qui compte c'est la victoire."
 story.215.b.mater: "Nous devons tirer le meilleur parti de ce que nous apporte l'univers."
 story.215.b.mater.tooltip: "Permet d'accéder au décret impérial §YPrime sur les gros cristaux§!."
 story.215.c: "Quel dommage !"
 story.215.c.tooltip: "Permet d'accéder au décret impérial §YPrime sur les cristaux§!."
 story.219.name: "Sonar en cristal"
 story.219.desc: "La flotte [From.GetFleetName] a rencontré des Entités cristallines dans le système [From.From.GetName].\n\nEn utilisant des réserves d'énergie, nos vaisseaux pourraient générer une impulsion à haute fréquence, intense mais inoffensive, pour attaquer les Entités cristallines. Elles agissent comme des prismes et des résonateurs et font voler l'impulsion en éclat avant de la disperser dans le système stellaire. Les capteurs de nos vaisseaux détectent ensuite les ondes réfléchies par les corps planétaires.\n\nL'ensemble du système est ainsi instantanément analysé."
 story.219.a: "Allez-y."
 story.219.a.tooltip: "Dépense §R-30§!£energy£ pour §Yétudier§! instantanément le système [From.From.GetName]."
 story.219.b: "Pas cette fois."
 story.219.c: "Nous devons économiser nos ressources."
 story.220.name: "Boule de cristal"
 story.220.desc.hostile: "Le [Root.GetName] a rapporté une présence importante d'entités cristallines dans le système de [From.GetName]. Peu d'éléments permettent de déterminer s'il s'agit d'un foyer ancien de ces créatures, mais jamais auparavant nous n'avions observé autant d'entités cristallines dans un seul système.\n\nLes premiers éléments montrent la présence d'une construction de cristal inhabituelle, qu'il pourrait être intéressant d'étudier, si nous pouvons... disons, la démonter."
 story.220.desc.nonhostile: "Le [Root.GetName] a rapporté une présence importance d'entités cristallines dans le système de [From.GetName]. Il s'agit visiblement d'une sorte de tanière, ou à tout le moins d'un lieu central pour les activités de ces créatures, car [From.GetName] possède une construction cristalline ne ressemblant à aucune autre rencontrée jusqu'à présent.\n\nCette construction semble faire preuve des mêmes propriétés qui sont attribuées aux entités elles-mêmes, si ce n'est qu'elles semblent démultipliées."
 story.220.desc.gesta: "Nous avons noté une présence importante d'entités cristallines dans le système de [From.GetName]. Il s'agit visiblement d'une sorte de tanière, ou à tout le moins d'un lieu central pour les activités de ces créatures, car [From.GetName] possède une construction cristalline ne ressemblant à aucune autre rencontrée jusqu'à présent.\n\nCette construction semble faire preuve des mêmes propriétés qui sont attribuées aux entités elles-mêmes, si ce n'est qu'elles semblent démultipliées."
 story.220.a.nonhostile: "Faisons ainsi"
 story.221.name: "Discerné"
 story.221.desc: "Un département de xénoscience de [Root.Capital.GetName] a indiqué avoir terminé l'étude à distance de la construction cristalline.\n\nUne fois encore, le fait que ces entités ne laissent voir aucun comportement rend difficile de tirer la moindre conclusion assurée en ce domaine. Pourtant, leurs propriétés physiologiques continuent d'intriguer. L'étude de la construction a cependant permis à ces xénobiologistes, en étroite collaboration avec des ingénieurs en matériaux, de commencer à imiter les propriétés reconstructives proposées lors de l'observation de la construction."
 story.221.desc.gesta: "L'étude à distance de la construction cristalline est terminée.\n\nLe fait que ces entités ne laissent transparaître aucun comportement rend difficile de tirer la moindre conclusion assurée en ce domaine. Pourtant, leurs propriétés physiologiques continuent d'intriguer, et nous pourrions commencer à imiter les propriétés reconstructives observées dans cette construction."
 story.221.a: "Très bien"
 story.223.name: "Discernement interrompu"
 story.223.desc: "Un département de xénosciences de [Root.Capital.GetName] a indiqué que la construction cristalline observée dans un système lointain a été détruite, et que l'étude à distance n'est désormais plus possible."
 story.223.desc.gesta: "La construction cristalline observée dans un système lointain a été détruite, ce qui interdit désormais de mener à bien son étude."
 story.223.a: "C'est bien dommage"
 story.223.a.tooltip: "Le projet spécial §HConstruction cristalline§! est annulé."
 story.301.name: "Anciens drones miniers"
 story.301.desc.pacif: "Des rapports sont arrivés faisant état de la présence de drones spatiaux dans certains systèmes. Ils semblent avoir été les opérateurs et gardiens d'installations minières orbitales autonomes, établies il y a plusieurs millénaires. À en juger par leur matériel de traitement, ces sites d'exploitation semblent avoir été abandonnés rapidement, à l'exception de ces drones.\n\nCeux-ci ne semblent dotés d'aucun protocole de communication diplomatique (du moins, aucun qui soit déchiffrable par la [Root.Owner.GetName]) et ils se montrent agressifs envers les vaisseaux des [Root.Owner.GetSpeciesNamePlural] qui entrent dans le système.\n\nLeur présence dans le système de [Root.System.GetName] est étonnante, aussi devrions-nous tenter d'en apprendre plus sur eux."
 story.301.desc.mater: "Des rapports sont arrivés faisant état de la présence de drones spatiaux dans certains systèmes. Ils semblent avoir été les opérateurs et gardiens d'installations minières orbitales autonomes, établies il y a plusieurs millénaires. À en juger par l'état leur matériel de traitement, ces sites d'exploitation semblent avoir été abandonnés rapidement, à l'exception de ces drones.\n\nIls ont clairement pour fonction d'exploiter les mines, mais nous ignorons qui les a conçus à cette fin. Quoi qu'il en soit, aucune cargaison de minerais n'a été prise dans le système depuis des centaines, voire des milliers d'années.\n\nCe ne sont peut-être que de vieux drones, mais mieux vaudrait pour la [Root.Owner.GetName] les garder sous surveillance."
 story.301.desc: "Des rapports sont arrivés faisant état de la présence de drones spatiaux dans certains systèmes. Ils semblent avoir été les opérateurs et gardiens d'installations minières orbitales autonomes, établies il y a plusieurs millénaires. À en juger par l'état de leur matériel de traitement, ces sites d'exploitation semblent avoir été abandonnés rapidement, à l'exception de ces drones.\n\nIls sont équipés de puissants lasers de forage, dont ils usent aussi pour se montrer menaçants, si ce n'est ouvertement hostiles, envers les vaisseaux des [Root.Owner.GetSpeciesNamePlural] qui les approchent.\n\nCe ne sont peut-être que de vieux drones, mais mieux vaudrait pour la [Root.Owner.GetName] les garder sous surveillance."
 story.301.desc.gesta: "Les anciens drones miniers rencontrés dans l'espace lointain semblent être les opérateurs et gardiens d'opérations minières orbitales autonomes. À en juger par l'état de leur matériel de traitement, ces sites d'exploitation ont été établis il y a plusieurs millénaires, avant d'être abandonnés rapidement, à l'exception de ces drones. Ceux-ci sont équipés de puissants lasers de forage, dont ils usent aussi pour se montrer menaçants, si ce n'est ouvertement hostiles, envers tout ce qui les approche.\n\nCe ne sont peut-être que de vieux drones, mais mieux vaudrait les garder sous surveillance."
 story.301.a: "Établissons un poste d'écoute sur [Root.Capital.GetName]"
 story.301.b: "Voyons de quoi ils sont faits : démontons-les"
 story.305.name: "Éthique professionnelle des drones miniers"
 #starts mining drone home system chain upon completion
 story.305.desc.pacif: "Lorsqu'ils ne pointent pas leurs lasers de forage en direction des vaisseaux [Root.GetSpeciesAdj], les drones travaillent sans relâche et sans réfléchir, allant même jusqu'à découper des astéroïdes pauvres en minerais par manque de mieux.\n\nMais le plus intéressant est que, contrairement à ce que l'on croyait au départ, ils ne sont pas totalement muets : de temps en temps, ils émettent des signaux, quoique de façon irrégulière et sur une longueur d'onde difficile à distinguer du bruit de fond. Savoir s'il reste quelqu'un pour capter ces transmissions sera un autre mystère à éclaircir."
 story.305.desc.mater: "Les drones sont des mineurs redoutablement efficaces. Ils exploitent au maximum des résidus de roches que les mineurs [Root.GetSpeciesAdj] se seraient empressés de mettre au rebut en les jugeant vides de tout contenu de valeur. Nos meilleurs ingénieurs se sont attelés à l'étude de la méthodologie des drones pour l'adapter aux stations et réseaux miniers de [Root.GetName] et améliorer leur efficacité, tout en réduisant leur consommation énergétique.\n\nAutre sujet, moins intéressant celui-ci : contrairement à ce que l'on croyait au départ, les drones ne sont pas totalement muets. De temps en temps, ils émettent des signaux, quoique de façon irrégulière et sur une longueur d'onde difficile à distinguer du bruit de fond. Savoir s'il reste quelqu'un pour capter ces transmissions sera un autre mystère à éclaircir."
 story.305.desc: "Les drones, qui extraient inlassablement les ressources toujours plus rares des planétoïdes sur lesquels ils travaillent, constituent un sujet d'étude certes un peu ennuyeux mais néanmoins très instructif. De fait, les réseaux miniers de [Root.Capital.GetName] pourraient profiter d'une optimisation des cadences d'extraction tout en économisant de l'énergie.\n\nEn outre, nous avons découvert que les drones ne sont pas totalement muets : de temps en temps, ils émettent des signaux, quoique de façon irrégulière et sur une longueur d'onde difficile à distinguer du bruit de fond. Savoir s'il reste quelqu'un pour capter ces transmissions sera un autre mystère à éclaircir."
 story.305.desc.gesta: "Les drones, qui extraient inlassablement les ressources toujours plus rares des planétoïdes sur lesquels ils travaillent, constituent un sujet d'étude certes quelque peu ennuyeux, mais néanmoins instructif. De fait, nous pourrions apprendre une ou deux choses sur leur manière de maximaliser le taux d'extraction des minéraux, tout en économisant l'énergie.\n\nEn outre, nous avons découvert que les drones ne sont pas entièrement muets : de temps en temps, ils émettent des signaux, quoique de façon irrégulière et sur une longueur d'onde difficile à distinguer du bruit de fond. Savoir s'il reste quiconque pour capter ces transmissions sera un autre mystère à éclaircir."
 story.305.a: "C'est noté"
 story.305.a.tooltip: "Permet le décret §YOptimisations issues des drones§!."
 story.305.b: "Découvrons comment ils évaluent les sites miniers"
 story.305.b.tooltip: "Ajoute une liste de planétoïdes riches en minéraux précieux dans le journal de bord."
 story.310.name: "Démantèlement des drones miniers"
 story.310.desc.mater: "Après un combat sans merci avec des vaisseaux [Root.GetSpeciesAdj], les drones miniers ont été détruits. Le hasard faisant bien les choses, leurs cellules énergétiques sont de loin leurs composants les plus robustes, ce qui a permis à nos vaisseaux d'en récupérer quelques-unes. La technologie utilisée pour concevoir ces cellules est plus avancée que la nôtre, mais les premiers tests réalisés montrent que nous sommes tout à fait capables d'en extraire des crédits énergétiques.\n\nTandis que la dernière cellule énergétique s'éteignait, les ingénieurs qui conduisaient les tests ont remarqué une baisse des radiations ambiantes. Apparemment, les drones ne sont pas totalement muets. Depuis que nous les avons découverts, voire depuis leur déploiement, ils semblent en effet émettre sporadiquement des fréquences inhabituelles. Cela dit, il est peu probable que quelqu'un reçoive encore leurs signaux.\n\nQuoi qu'il en soit, les drones sont une source d'énergie puissante mais limitée, même si nous parvenons à les récupérer et à les neutraliser."
 story.310.desc: "Après un combat sans merci avec des vaisseaux [Root.GetSpeciesAdj], les drones miniers ont été détruits. Le hasard faisant bien les choses, leurs cellules énergétiques sont de loin leurs composants les plus robustes, ce qui a permis à nos vaisseaux d'en récupérer quelques-unes. La technologie utilisée pour concevoir ces cellules est plus avancée que la nôtre, mais les premiers tests réalisés montrent que nous sommes tout à fait capables d'en extraire des Crédits énergétiques.\n\nTandis que la dernière cellule énergétique s'éteignait, les ingénieurs qui conduisaient les tests ont remarqué une baisse des radiations ambiantes. Apparemment, les drones ne sont pas totalement muets. Depuis que nous les avons découverts, voire depuis leur déploiement, ils semblent en effet émettre sporadiquement des fréquences inhabituelles. Cela dit, il est peu probable que quelqu'un reçoive encore leurs signaux.\n\nQuoi qu'il en soit, les drones sont une source d'énergie puissante mais limitée, même si nous parvenons à les récupérer et à les neutraliser."
 story.310.desc.gesta: "Au terme d'une bataille sans merci, les drones miniers ont été détruits. Par chance, leurs cellules énergétiques sont de loin leurs composants les plus robustes, aussi certaines ont pu être récupérées. La technologie ayant permis leur conception est bien plus avancée que la nôtre, mais les premiers essais montrent que nous pourrions assez aisément convertir leur production en crédits énergétiques.\n\nTandis que la dernière cellule énergétique s'éteignait, une baisse des radiations ambiantes a été notée par [Root.GetUnitDronePlural] conduisant l'expérience. Apparemment, ces drones ne sont pas totalement muets : ils émettent par intermittence des communications à des fréquences inhabituelles depuis que nous les avons rencontrés pour la première fois, et peut-être même depuis leur déploiement. Ceci dit, il est peu probable que quiconque ou quoi que ce soit reçoive encore leurs transmissions.\n\nEn tout cas, ils pourraient constituer une source d'énergie certes limitée, mais très profitable - à condition que nous en trouvions et démantelions suffisamment."
 story.310.a: "Très bien."
 story.310.a.tooltip: "Permet d'accéder au décret impérial §YPrime sur les drones§!\n"
 story.320.name: "Gisements explorés"
 story.320.desc: "Tous les gisements riches en minéraux découverts par les algorithmes d'évaluation de l'ancien drone minier reconstitué ont été explorés."
 story.330.name: "Ancien centre de traitement des minéraux"
 story.330.desc: "Le [Root.GetName] a repéré une présente importante d'anciens drones miniers dans le système de [From.GetName]. Cela semble être un centre de traitement des minerais et minéraux de toute première importance, sans doute le dernier de la sorte dans la galaxie."
 story.330.desc.gesta: "Une présente importante d'anciens drones miniers a été repérée dans le système de [From.GetName]. Cela semble être un centre de traitement de minerais et minéraux de toute première importance, sans doute le dernier de la sorte dans galaxie."
 story.330.a: "C'est sans doute ça"
 story.330.b: "Voyons ce que nous pouvons en tirer"
 story.331.name: "Traitement observé"
 story.331.desc: "Laisse l'ancien centre de traitement des anciens drones miniers opérer sans l'interrompre a été, au final, une sage décision. En observant ses cadences monotones sur une période prolongée, nous avons pu identifier plusieurs techniques systémiques dans le traitement automatisé de la matière première, bien plus efficaces que les nôtres."
 story.331.desc.gesta: "$story.331.desc$"
 story.331.a: "En ce cas, adoptons ces méthodes"
 story.331.b: "Jackpot !"
 story.333.name: "Destruction du centre des drones miniers"
 story.333.desc: "Nous avons reçu des rapports indiquant que le centre de traitement des minéraux observé dans le système de [location_planet.GetStarName] a été détruit. Ses importantes réserves de minéraux, bruts et transformés, se sont dispersées et sont tombées sur [location_planet.GetName], dans la ceinture d'astéroïdes locale."
 story.333.desc.gesta: "Le centre de traitement des minéraux observé dans le système de [location_planet.GetStarName] a été détruit. Ses importantes réserves de minéraux, bruts et transformés, se sont dispersées et sont retombées sur [location_planet.GetName], dans la ceinture d'astéroïdes locale."
 story.333.a: "Nous avons étudié bien assez d'épaves comme cela"
 story.333.a.tooltip: "Le projet spécial §HCentre de traitement minier§! est annulé.\n$story.333.b.tooltip$"
 story.333.b: "Jackpot !"
 story.333.b.tooltip: "[location_planet.GetName] est désormais plus riche en minéraux."
 story.401.name: "Nuages spatiaux"
 story.401.desc.spiri: "Selon le rapport, il s'agit d'un « nuage », formé à partir d'une coalescence de diverses choses. « Comme un nuage de matière stellaire lumineuse, tourbillonnant dans l'obscurité ». Non sans poésie, le rapport qualifie ce phénomène de « nuage spatial ».\n\nLe clergé de la [Root.Owner.GetName] s'accorde à considérer ces nuages comme des messagers animés par une volonté supérieure. Ce qui suscite en revanche des débats enflammés, très certainement pour longtemps encore, est de savoir à qui appartient cette volonté. Quoi qu'il en soit, tant que la réponse n'aura pas été trouvée, il serait sans doute plus prudent de nous méfier de l'incroyable puissance que recèlent ces tourbillons."
 story.401.desc: "L'analyse de l'un de ces amas particuliers de débris et de poussières spatiales, que l'on surnommait jusqu'à les §H[This.ContactCountry.GetName]§!, a donné des résultats surprenants : il s'agit d'un nuage de particules doté d'une puissante charge d'origine inconnue. Il ne devrait pas être capable de la moindre réaction, et encore moins de se mouvoir dans un but précis.\n\nEt, pourtant, c'est bien le cas.\n\nIl y a quelque chose d'indéniablement menaçant dans cette espèce de brume qui apparaît sur les vidéos transmises par notre vaisseau. Peut-être l'univers recèle-t-il certaines choses dont il vaudrait mieux ne pas trop s'approcher."
 story.401.desc.gesta: "L'analyse de l'un de ces amas particuliers de débris et de poussières spatiales, que l'on surnommait jusqu'à les §H[This.ContactCountry.GetName]§!, a donné des résultats surprenants : il s'agit d'un nuage de particules doté d'une puissante charge d'origine inconnue. Il ne devrait pas être capable de la moindre réaction, et encore moins de se mouvoir dans un but précis.\n\nEt, pourtant, c'est bien le cas.\n\nIl y a quelque chose d'indéniablement menaçant dans cette espèce de brume qui apparaît sur les vidéos transmises par notre vaisseau. Peut-être l'univers recèle-t-il certaines choses dont il vaudrait mieux ne pas trop s'approcher."
 story.401.a.spiri: "Divin ou non, ce nuage doit être étudié."
 story.401.b.spiri: "Laissons les commandants trancher la question"
 story.401.c: "Contentons-nous d'observer, sans intervenir"
 story.401.d: "$story.401.b.spiri$"
 story.401.e: "Peut-être devrions-nous détruire tout ça"
 story.405.name: "Espace sans Nuages"
 story.405.desc.spiri: "Les Nuages spatiaux sont les régisseurs du cosmos. Dès que les astronomes [Root.GetSpeciesAdj] ont su quoi chercher, ils ont trouvé des traces de Nuages spatiaux un peu partout.\n\nFormés à l'aube de la création, ils existaient déjà lors de l'apparition des premières étoiles et des premières planètes. Et depuis la nuit des temps, ils dérivent, tels des conglomérats de matière inanimée quasi conscients, circulant entre les étoiles et les mondes à l'agonie.\n\nIls nous rappellent que nous ne sommes qu'une infime partie d'un immense ensemble."
 #+6 mult phys research, +10% dmg vs cloud modifier
 story.405.desc: "D'après les chercheurs [Root.GetSpeciesNamePlural], les Nuages spatiaux comptent parmi les entités les plus anciennes de l'univers. Pour ce que nous en avons compris, ils semblent être apparus à peine quelques milliards d'années après la matière, les forces à l'oeuvre dans le cosmos naissant créant alors à partir du vide. Ces Nuages auraient pu se transformer en étoiles, mais ce ne fut pas le cas.\n\nLeur apparente intelligence animale est plus difficile à expliquer, mais la réponse réside peut-être dans les champs électromagnétiques incroyablement puissants qui les maintiennent en un tout cohérent - une autre caractéristique datant de l'époque de leur formation. Il n'est pas impossible qu'avec le temps la circulation de ces étranges amas de poussière d'étoile et de champs gravitationnels se soient alignée pour former des sortes de chemins neuraux particulièrement souples.\n\nEn outre, ces Nuages semblent mutuellement réceptifs à leurs impulsions mutuelles, comme s'ils communiquaient entre eux malgré les années-lumière qui les séparent. On pense que l'intrication quantique joue un rôle dans ce phénomène."
 story.405.desc.gesta: "Les nuages spatiaux comptent sans doute parmi les entités les plus anciennes au sein de l'univers. Selon les théories sur le sujet, ils semblent être apparus à peine quelques milliards d'années après la matière, façonnés à partir de rien par les forces phénoménales d'un cosmos encore naissant. Ils auraient pu devenir des étoiles, mais ne le devinrent jamais.\n\nExpliquer leur apparente intelligence animale est plus difficile, mais la réponse se trouve peut-être dans les champs électromagnétiques anormalement puissants qui les maintiennent en un tout cohérent - il s'agit là encore d'une caractéristique remontant à l'époque de leur apparition. Il n'est pas impossible que, avec le temps, la circulation de cette étrange poussière stellaire et des champs gravitationnels se soient alignés pour former des sortes d'imitations d'un réseau neural ou de circuits informatiques.\n\nEn outre, les nuages semblent se transmettre mutuellement des impulsions. S'ils ne communiquent pas réellement, en dépit des années-lumière les séparant. L'une des hypothèses possibles serait que l'intrication quantique jouerait un rôle dans ce phénomène."
 story.405.a.spiri: "Cela rend humble."
 story.405.a.spiri.tooltip: "Confère le modificateur §YGrand dessein§! à l'§Yempire§! :\n£happiness£ bonheur §G+5%§!"
 story.405.b: "Ils ne se mettront pas en travers de notre chemin"
 story.405.b.tooltip: "Confère le modificateur §YChasseur de nuages§! à l'§Yempire§! :\nDégâts infligés aux Nuages spatiaux : §G+10§!"
 story.405.c: "Serait-il possible de suivre la trace de ces impulsions ?"
 story.405.c.tooltip: "Ajoute une liste de systèmes de §YNuages spatiaux§! probables au journal de bord."
 story.410.name: "Nuages noirs"
 #empire modifier -10% happiness for three years, +10% dmg vs cloud modifier
 story.410.desc.spiri: "Vaincu par le [From.GetName], le Nuage spatial n'a pas été un adversaire facile.\n\nJuste avant que son champ électromagnétique finisse par s'effondrer (en envoyant un tourbillon de matière stellaire à travers le système), de nombreux membres d'équipage engagés dans la bataille ont évoqué un soudain sentiment d'effroi, de mort imminente.\n\nNous avons peut-être péché."
 story.410.desc: "La victoire sur le Nuage spatial a été difficile.\n\nNous avons subi de lourdes pertes, mais le fait est que le [Root.GetName] a vaincu l'une des énigmes les plus terrifiantes de la galaxie."
 story.410.desc.gesta: "Emporter la victoire sur les nuages spatiaux n'a pas été aisé. Nous avons souffert de nombreuses pertes.\n\nMais le fait est que nous avons vaincu l'une des énigmes les plus terrifiantes de la galaxie."
 story.410.a.spiri: "Comment nous racheter alors que nous ignorons à qui nous avons fait du tort ?"
 story.410.b: "C'est un jour historique."
 story.501.name: "Tiyanki"
 story.501.desc.spiri: "Les devins ont donné le nom de §Htiyanki§! à ces êtres qui traversent l'obscurité en flottant. Ces créatures spatiales, sacrées et paisibles, errent de système en système, se nourrissant des gaz présents dans les couches supérieures de nombreuses géantes gazeuses, et ne montrant que très rarement le moindre signe d'hostilité.\n\nNous devrions donc nous en tenir à une distance respectueuse."
 story.501.desc: "Ces formes de vie spatiales que le responsable de la recherche sociétale [Root.GetSpeciesAdj] désigne sous le nom de « §YTiyanki§! » sont des créatures paisibles. Capables d'accéder à une dimension inférieure du sous-espace, elles voguent d'un système à l'autre avec une aisance relative.\n\nElles broutent ce gaz que l'on trouve communément dans les couches supérieures de nombreuses géantes gazeuses. Il est pourtant peu probable, c'est le moins que l'on puisse dire, qu'il s'agisse là de leur unique source de nourriture, même si l'absorption de toute autre forme d'alimentation n'a pas encore pu être observée.\n\nElles n'attaquent que rarement, même lorsqu'on les provoque, aussi peuvent-elles sans crainte être ignorées."
 story.501.desc.gesta: "Ces formes de vie spatiales que nous appelons « §Ytiyanki§! » sont des créatures paisibles. Capables d'accéder à une dimension inférieure du sous-espace, elles voguent d'un système à l'autre avec une aisance remarquable.\n\nElles broutent ces gaz que l'on trouve communément dans les couches supérieures de nombreuses géantes gazeuses. Il est pourtant peu probable, c'est le moins que l'on puisse dire, qu'il s'agisse là de leur seule source de nourriture, même si l'absorption de toute autre forme de nutriments n'a pas encore pu être observée.\n\nElles n'attaquent pas sans être provoquées, aussi peuvent-elles sans crainte être ignorées."
 story.501.a.spiri: "Vénérables."
 story.501.a.mater: "De toute façon, les chasser ne serait que pure perte."
 story.501.a.exploratobot: "Créature spatiale docile indexée"
 galactic_features.361.name: "Progéniture effluviale"
 galactic_features.361.desc: "Suite à la destruction de notre flotte dans le système [From.From.From.GetStarName], les débris semblent avoir permis au Nuage spatial local d'emmagasiner suffisamment de matière pour subir une sorte de mitose à grande échelle - une reproduction asexuée.\n\nLe [From.From.From.GetStarName] compte désormais un Nuage spatial de plus."
 galactic_features.361.a: "Terrifiant."
 galactic_features.361.a.milit: "Impressionnant."
 galactic_features.361.a.phobe: "Repoussant."
 galactic_features.361.a.phile: "Fascinant."
 galactic_features.361.a.spiri: "Le Divin nous protège."
 galactic_features.361.a.mater: "C'est noté"
 galactic_features.361.a.tooltip: "Un §RNuage spatial§! s'est formé dans le système §Y[From.From.From.GetStarName]§!."
 ####################################
 #Uplifting Events
 ####################################
 #Pre-Sapients Found
 #uplift.6000.name.1: "Upliftable Species Found"
 uplift.6000.name.2: "Découverte d'une espèce préintelligente"
 uplift.6000.continental.desc: "Des créatures véritablement fascinantes parcourent les plaines et les côtes de §Y[From.GetName]§!. L'équipage du [Root.GetName] a d'ailleurs rapporté qu'une espèce [presapient_species.GetSpeciesClass] y utilise des outils, de façon certes très limitée, mais dispose assurément de toutes les qualités requises pour atteindre un jour la conscience.\n\n[Root.GetLeaderName] insiste d'ailleurs sur le fait que découvrir une vie alien semblable est une opportunité très rare. Selon [Root.Leader.GetLuiElleLead], si nous choisissions de provoluer cette espèce, elle pourrait s'avérer très utile." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.ocean.desc: "Selon l'équipage du [Root.GetName], une espèce [presapient_species.GetSpeciesClass] native de §Y[From.GetName]§! a non seulement commencé à dominer les immenses océans de la [From.GetPlanetMoon], mais aussi les petites parcelles de terre dispersées à sa surface.\n\n[Root.GetLeaderName] propose donc de surveiller leur évolution, et si possible de les aider à suivre le chemin qui les mènera à une véritable conscience."
 uplift.6000.tropical.desc: "Les canopées denses de §Y[From.GetName]§! cachent ce que [Root.GetLeaderName], qui commande le [Root.GetName], qualifie de « proto-civilisation ».\n\nL'espèce [presapient_species.GetSpeciesClass] qui a constitué cette société embryonnaire est encore loin d'avoir suivi tout le chemin de l'évolution, mais l'ordre social qu'elle a mis en place semble être permis par le développement d'un langage intelligible et d'une pensée abstraite.\n\n[Root.Leader.GetSheHeCap] suggère donc de faire de ces êtres des sujets d'expérimentation des technologies développées pour permettre une évolution accélérée." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.arid.desc: "Une espèce [presapient_species.GetSpeciesClass] de §Y[From.GetName]§! paraît démontrer une intelligence inhabituelle. Dans les paysages desséchés et rocheux de la [From.GetPlanetMoon], ces créatures ont su évoluer de manière à dominer leur environnement. Les expériences faites par [Root.GetLeaderName] et l'équipage du [Root.GetName] montrent que, à condition de faire usage des technologies voulues, leur évolution pourrait être accélérée." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.desert.desc: "Au milieu des étendues sableuses de §Y[From.GetName]§!, une curieuse forme de vie [presapient_species.GetSpeciesClass] semble posséder toutes les caractéristiques associées à l'évolution vers une capacité de raisonnement.\n\nSi son développement semble avoir stagné depuis quelques millénaires, [Root.GetLeaderName] pense qu'il serait néanmoins possible d'user la technologie pour lui permettre de reprendre son développement." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.savannah.desc: "Dans les vastes plaines de §Y[From.GetName]§!, de gracieuses créatures ont été observées, qui recourent à des formes rudimentaires de communication, coopèrent les unes avec les autres pour trouver de la nourriture et éviter les prédateurs qui rôdent sur la [From.GetPlanetMoon]. [Root.GetLeaderName] et l'équipage du [Root.GetName] semblent donc persuadés que ces créatures [presapient_species.GetSpeciesClass]s pourraient être parfaitement adaptées aux technologies développées pour accélérer l'évolution." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.tundra.desc: "Les environnements les plus rudes sont réputés pour provoquer des phénomènes d'adaptation et ainsi faciliter l'évolution. La biosphère froide de §Y[From.GetName]§! semble le confirmer.\n\n[Root.GetLeaderName] s'est notamment pris[Root.Leader.GetXELead] d'intérêt pour une créature [presapient_species.GetSpeciesClass] qui se déplace sans bruit dans les étendues glaciales de la [From.GetPlanetMoon] : selon [Root.Leader.GetLuiElleLead], une aide minime pourrait lui permettre d'atteindre assez aisément la pleine conscience." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.arctic.desc: "Si le climat perpétuellement gelé de §Y[From.GetName]§! est loin d'être hospitalier, la [From.GetPlanetMoon] n'est pas dépourvue de vie pour autant.\n\nDes créatures [presapient_species.GetSpeciesClass]s ont ainsi su évoluer pour faire face à cet environnement, et [Root.GetLeaderName] paraît persuadé[Root.Leader.GetXELead] qu'au moins une de ces espèces pourrait atteindre la conscience si quelques stimuli externes étaient introduits..." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.alpine.desc: "Les immenses chaînes montagneuses qui s'étendent sur la surface de §Y[From.GetName]§! se sont avérées être un environnement particulièrement fertile pour les formes de vie uniques de la [From.GetPlanetMoon].\n\nUne espèce [presapient_species.GetSpeciesClass], en particulier, s'est parfaitement adaptée aux altitudes les plus extrêmes, et a même élaboré une forme de communication basique, quoique assez gutturale. Avec quelques stimuli, ces créatures pourraient visiblement atteindre la pleine conscience." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.nuked.desc: "Si §Y[From.GetName]§! est irradiée de façon très importante, au moins une forme de vie avancée paraît y prospérer. [Root.GetLeaderName] a ainsi rapporté que cette créature [presapient_species.GetSpeciesClass] a démontré des capacités de prise de décision collectives impressionnantes, et que des stimuli extérieurs pourraient lui permettre de poursuivre aisément son évolution." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.gaia.desc: "§Y[From.GetName]§! constitue un environnement quasi parfait pour que la vie s'y développe et évolue. L'abondance des ressources naturelles constitue un cadre fertile pour la faune et la flore locales. Et, au sein de ce véritable paradis, [Root.GetLeaderName] a découvert qu'une espèce [presapient_species.GetSpeciesClass] intelligente a élaboré une proto-société. Elle pourrait donc être appelée à évoluer de façon très rapide." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.relic.desc: "Dans les tours en ruine et les rues abandonnées de §Y[From.GetName]§! erre une forme de vie préconsciente tout à fait intrigante. [Root.GetLeaderName] paraît persuadé[Root.Leader.GetXELead] que cette créature [presapient_species.GetSpeciesClass], petite et intelligente, était autrefois élevée comme animal de compagnie. Selon cette théorie, à la disparition de ses possesseurs, elle aurait alors évolué de manière rapide, et serait désormais sur le point d'atteindre la pleine conscience si des facteurs externes convenables étaient introduits." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.fallback.desc: "Selon l'équipage du [Root.GetName], une espèce [presapient_species.GetSpeciesClass] originaire de [From.GetName] est parvenue à dominer l'environnement de la [From.GetPlanetMoon].\n\n[Root.GetLeaderName] recommande donc de suivre de près son développement, et si possible de la provoluer afin qu'elle puisse atteindre la pleine conscience." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.wilderness.desc: "Le [Root.GetName] a découvert une forme de vie préconsciente et individualiste sur [from.GetName]. Cette espèce [presapient_species.GetSpeciesClass] est parvenue à dominer son environnement, ce qui est tout à fait remarquable compte tenu de l'absence d'intelligence mutualiste pour la guider.\n\nNous ferions bien d'observer attentivement son évolution pour éventuellement l'accueillir un jour. La présence de ces créatures est de bon augure pour l'éveil de [from.GetName]." #GetSpeciesClass returns e.g. the 'avian_species' or 'toxic_species' string
 uplift.6000.a: "Oui, nous avons les connaissances pour"
 uplift.6000.b: "Nous devrions garder ça à l'esprit"
 #Pre-Sapients Uplifted
 uplift.6010.name: "Provolution réussie"
 uplift.6010.continental.desc: "L'espèce [From.GetName], dominante sur §Y[Root.GetName]§!, a fait l'objet d'une provolution. Peu de modifications génétiques ont été nécessaires pour débloquer son potentiel inhérent et améliorer ses capacités cognitives et sa dextérité manuelle, tandis que les membres des générations précédentes vont être équipés de petits implants cybernétiques."
 uplift.6010.ocean.desc: "Sur §Y[Root.GetName]§!, les efforts déployés pour accélérer l'évolution de l'espèce [From.GetName] ont été couronnés de succès. Des programmes éducatifs ont été mis en place pour les spécimens (ou plutôt des individus, désormais) nés après la provolution, et les plus âgés se révèlent particulièrement réceptifs au conditionnement psychogénétique."
 uplift.6010.tropical.desc: "Les [From.GetName] ont été provolués pour rejoindre les rangs des citoyens productifs de la [Root.Owner.GetName] et des colons de la planète tropicale [Root.GetName]."
 uplift.6010.arid.desc: "C'est une franche réussite !\n\nL'espèce [From.GetName] de §Y[Root.GetName]§! a été provoluée, et ses membres peuvent désormais devenir des habitants à part entière de la [Root.Owner.GetName]."
 uplift.6010.desert.desc: "Les [From.GetName] sont désormais la preuve vivante de la domination scientifique et technologique de [Root.Owner.GetName]."
 uplift.6010.savannah.desc: "Les efforts faits sur §Y[Root.GetName]§! pour provoluer l'espèce [From.GetName] ont porté leurs fruits : grâce à quelques modifications somme toute mineures apportées à son code génétique, ses capacités cognitives ont pu être augmentées de façon importante."
 uplift.6010.tundra.desc: "L'espèce [From.GetName] est désormais douée de conscience, et qui plus est assez intelligente. La [Root.Owner.GetName] a donc étendu sa protection sur elle et sur sa [Root.GetPlanetMoon] natale, §Y[Root.GetName]§!."
 uplift.6010.arctic.desc: "Avec l'aide des [Root.Owner.GetSpeciesName], les [From.GetName] issus des plaines glacées de [Root.GetName] sont devenus des êtres doués de raison.\n\nIls ont rejoint notre colonie de [Root.GetName], leur planète natale, en tant que membres productifs de la société [Root.Owner.GetName]."
 uplift.6010.alpine.desc: "Les modifications génétiques faites à l'espèce [From.GetName] lui ont permis d'accéder à la pleine conscience. Ses membres peuvent désormais contempler les étoiles depuis les montagnes de §Y[Root.GetName]§! en ayant véritablement conscience d'eux-mêmes."
 uplift.6010.nuked.desc: "Depuis ses humbles origines, la modeste espèce [From.GetName] de §Y[Root.GetName]§! a désormais été provoluée, et ses membres peuvent désormais intégrer la [Root.Owner.GetName]."
 uplift.6010.gaia.desc: "Grâce aux efforts accomplis par la [Root.Owner.GetName], l'espèce [From.GetName] a été provoluée. Quelle merveille pour elle de pouvoir enfin prendre conscience que son monde, §Y[Root.GetName]§!, est un véritable paradis !"
 uplift.6010.relic.desc: "Sur tout son monde jonché de ruines, l'espèce [From.GetName], de §Y[Root.GetName]§!, s'est éveillée de sa longue léthargie. Les efforts faits pour la provoluer ont été un véritable succès."
 uplift.6010.fallback.desc: "Désormais provoluée, ayant accédé à la pleine conscience, l'espèce [From.GetName] de §Y[Root.GetName]§! sera dorénavant une preuve vivante de la supériorité scientifique et technologique de la [Root.Owner.GetName]."
 uplift.6010.a: "La [This.Owner.GetName] leur souhaite la bienvenue"
 uplift.6010.tt: "Pour la §Y[This.Owner.GetName]§! : §Y+50§!£influence£"
 ####################################
 #Followup Events
 ####################################
 uplift.7000.name: "Suites de la provolution"
 uplift.7000.desc: "Cela fait déjà plusieurs jours que les [From.From.From.GetName] sont parmi nous.\n\nEt tout va pour le mieux sur la planète [From.GetName]."
 uplift.7010.name: "Des débuts difficiles"
 uplift.7010.desc: "L'intégration des [From.From.From.GetName] que nous avons provolués se passe relativement bien, même si nous espérions mieux.\n\nEn dépit des efforts que nous avons déployés pour adoucir leur caractère, les [From.From.From.GetName] ont encore parfois du mal à s'adapter au mode de vie de la [From.Owner.GetName]."
 ####################################
 #Ethics Events
 ####################################
 #From = planet
 #From.From.From = uplifted species
 uplift.7200.name: "Repli sur soi"
 uplift.7200.desc: "Un groupe statistiquement important de citoyens [From.From.From.GetName] se plaint de nos enseignements sur la nature du cosmos.\n\nParmi eux, un individu ou un groupe inconnu fait circuler des textes fallacieux qui attribuent une importance excessive aux [From.From.From.GetName] et à leur provolution par la [Root.Owner.GetName]."
 uplift.7200.a: "Il ne peut rien en sortir de bon."
 uplift.7200.b: "Laissons-les avec leurs mystères."
 uplift.7200.b.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Yspiritualiste§!."
 uplift.7200.c: "Mettez tout en oeuvre pour les remettre sur le droit chemin."
 uplift.7200.c.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Ymatérialiste§!."
 uplift.7205.name: "Objecteurs de conscience"
 uplift.7205.desc: "Des problèmes ont surgi sur [Root.GetName] en raison de l'aversion de la population [From.From.From.GetName] pour les armes. Un représentant a officiellement réclamé la création de zones démilitarisées bien délimitées."
 uplift.7205.a: "Très bien."
 uplift.7205.b: "C'est bien avoir le courage de ses opinions."
 uplift.7205.b.tooltip: "Les [From.From.From.GetName] adoptent m'éthique §Ypacifiste§!."
 uplift.7205.c: "Ils doivent comprendre que le spectre de la guerre plane sur nous tous."
 uplift.7205.c.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Ymilitariste§!."
 uplift.7210.name: "Peur de l'étranger"
 uplift.7210.desc: "D'après les rapports, les citoyens [From.From.From.GetName] nouvellement provolués de [Root.GetName], s'inquiètent lorsque leurs enseignants [Root.Owner.GetSpeciesName] évoquent la possibilité de rencontres avec des entités encore inconnues issues des confins de l'espace."
 uplift.7210.a: "Je vois..."
 uplift.7210.b: "De telles rencontres peuvent être très enrichissantes."
 uplift.7210.b.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Yxénophile§!."
 uplift.7210.c: "Ils ont raison d'avoir peur de l'inconnu."
 uplift.7210.c.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Yxénophobe§!."
 uplift.7215.name: "Scission familiale"
 uplift.7215.desc: "Bien que la [Root.Owner.GetName] leur offre une structure solide à partir de laquelle ils pourraient modéliser leur ordre social interne, les [From.From.From.GetName] provolués ont du mal à trouver leurs marques.\n\nLeur soudaine ascension au rang d'êtres intellectuellement égaux à nous les a privés de milliers d'années d'évolution sociétale et culturelle. Ceci expliquant peut-être cela, l'ordre social des [From.From.From.GetName] passe sans cesse d'un extrême à l'autre ; un jour, l'unité familiale revêt une importance capitale, et le lendemain les chefs de la communauté en appellent à la dissolution de tous les liens claniques."
 uplift.7215.a: "Fascinant."
 uplift.7215.b: "Puissent les [From.From.From.GetName] trouver leur place."
 uplift.7215.b.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Yautoritariste§!."
 uplift.7215.c: "L'épanouissement personnel passe par l'indépendance."
 uplift.7215.c.tooltip: "Les [From.From.From.GetName] adoptent l'éthique §Yégalitariste§!."
 ####################################
 #Pre-Sapient Pop Interaction Events
 ####################################
 uplift.7500.name: "Sabotage"
 uplift.7500.desc: "Quelques membres de la population préintelligente de [From.GetName] ont réussi à pénétrer dans un complexe sécurisé à la périphérie de notre colonie. Quelques heures ont suffi pour les déloger, mais ils ont saboté plusieurs postes de transmission de données interstellaires dédiés aux transferts de devises.\n\nNous craignons que des centaines de crédits se soient volatilisés."
 uplift.7510.name: "In vivo"
 uplift.7510.desc: "Des xénochercheurs de [Root.GetName] ont publié une lettre ouverte dans laquelle ils demandent un assouplissement de la législation locale en matière d'expérimentations sur les espèces aliens préintelligentes.\n\nIls avancent des arguments convaincants sur les bienfaits scientifiques de ces expérimentations et mettent en garde contre les effets des lois actuelles sur la communauté scientifique de [Root.GetName].\n\nLa question de la déontologie reste néanmoins posée."
 uplift.7510.a: "Ignorez ces donneurs de leçons."
 uplift.7510.a.tooltip: "Cela risque de contrarier les scientifiques locaux.\n"
 uplift.7510.b: "Nous allons accéder à leurs demandes."
 uplift.7510.b.tooltip: "Cela risque de contrarier les locaux.\n"
 uplift.7510.c: "La déontologie ? Nous n'avons que faire de ces êtres inférieurs."
 uplift.7510.c.tooltip: "L'§Yempire§! adopte l'éthique §Yfanatiquement xénophobe§!.\n"
 uplift.7520.name: "Bougeotte"
 uplift.7520.desc: "Les créatures préintelligentes de [Root.GetName] s'agitent nerveusement à la périphérie de notre colonie. La présence des [Root.Owner.GetName] les perturbe, comme en attestent leurs allées et venues entre les abords de la colonie et un lieu inconnu situé à l'est."
 uplift.7520.a: "Repoussez-les. Gentiment, si possible."
 uplift.7520.a.tooltip: "Les créatures indigènes ne dérangeront plus les colons.\n"
 uplift.7520.b: "N'hésitez pas à avoir recours à la violence pour repousser ces stupides animaux."
 uplift.7520.b.tooltip: "Ces créatures grotesques ne dérangeront plus les colons.\n"
 uplift.7520.c: "Essayez de découvrir où ils se rendent."
 uplift.7525.name: "Perdus et oubliés"
 uplift.7525.desc: "Un groupe de xénologues a quitté la colonie de §Y[Root.GetName]§!, escorté de militaires, pour suivre les traces des créatures indigènes.\n\nIls ont retrouvé les vestiges d'un ancien vaisseau de colonisation, probablement le noyau d'une civilisation pré-PRL, depuis longtemps disparue.\n\nL'espèce dominante de la [Root.GetPlanetMoon] semble donc être le fruit d'un ancien programme de colonisation ou de manipulation génétique. Les structures entourant le vaisseau montrent que les membres de l'espèce locale vivaient jadis en tribus, étaient plus intelligents et avaient même un langage écrit rudimentaire.\n\nNous ignorons ce qui a provoqué leur déclin, mais leur comportement actuel est maintenant facile à comprendre : ils reconnaissent d'instinct les [Root.Owner.GetSpeciesNamePlural] comme les semblables de ceux qui les ont jadis provolués et aidés à accéder à la conscience. Notre société bien ordonnée réveillerait-elle quelque chose en eux, indistinctement enfoui dans leur nature profonde ?\n\nPeut-être pourrons-nous un jour apaiser leur anxiété évolutionnaire en les provoluant à notre niveau ? Quoi qu'il en soit, nous avons pour l'heure récolté de précieuses informations prouvant les manipulations d'organiques par d'anciennes cultures spatiales."
