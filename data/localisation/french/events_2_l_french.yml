 fallen_empires_tasks.2.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.2.desc.a.materialist: "Acceptez ce versement de ressources à la [Root.GetName], en retour des services rendus à la [FallenEmpireTaskOrigin.GetName]. Nous sommes persuadés que vous trouverez cette compensation plus que convenable, étant donné les nombreuses incapacités dont souffrent vos techniques de minages primitives."
 fallen_empires_tasks.2.desc.a.xenophile: "[Root.GetSpeciesNamePlural], votre espèce est un véritable joyau au sein de la communauté galactique. Pour vous montrer notre estime, nous avons décidé de vous octroyer un don généreux de minerais et de ressources."
 fallen_empires_tasks.2.desc.a.machine.o: "Protocole de sauvegarde 712-4 activé. Initialisation du transfert de ressources à la civilisation organique en difficulté. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.a.machine.s: "Protocole de sauvegarde 718-4 activé. Initialisation du transfert de ressources à l'intelligence synthétique non compromise. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.a.spiritualist: "[Root.GetSpeciesNamePlural] ! Votre espèce est louable, et votre adhésion aux doctrines immuables de la foi est admirable. Acceptez ce don de ressources en signe de bienveillance sans borne."
 fallen_empires_tasks.2.desc.b.materialist: "[Root.GetSpeciesNamePlural], le manque d'efficacité lié à votre technologie fait peine à voir. Étant toutefois des sujets de valeur pour la [FallenEmpireTaskOrigin.GetName], nous avons décidé de partager avec vous une partie de notre compréhension de l'univers. Nous ne faisons pas cela pour toutes les espèces, aussi veillez à continuer de bien nous servir - l'ingratitude est un trait de caractère que nous n'approuvons aucunement chez les enfants."
 fallen_empires_tasks.2.desc.b.xenophile: "[Root.GetSpeciesNamePlural], nous avons constaté avec une inquiétude certaine votre manque de progrès technologique. Au rythme de vos avancées actuelles, nous craignons que vous ne puissiez jamais atteindre votre véritable potentiel avant de vous disparaissiez ou ne soyez conquis par des espèces plus avancées. Pour vous aider, nous allons vous transférer un cache de données scientifiques de la [FallenEmpireTaskOrigin.GetName]. Il ne fait aucun doute que vous pourrez constater par vous-mêmes la valeur incalculable que cela aura pour votre empire."
 fallen_empires_tasks.2.desc.b.machine.o: "Protocole de sauvegarde 712-6 activé. Initialisation du transfert de données à la civilisation organique primitive. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.b.machine.s: "Protocole de sauvegarde 718-6 activé. Initialisation du transfert de données à l'intelligence synthétique rudimentaire. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.b.spiritualist: "[Root.GetSpeciesNamePlural] ! Votre espèce est louable, et votre adhésion aux doctrines immuables de la foi est admirable. Acceptez ce don de connaissances sacrées en signe de bienveillance sans borne."
 fallen_empires_tasks.2.desc.c.materialist: "[Root.GetSpeciesNamePlural], en tant que sujets de la [FallenEmpireTaskOrigin.GetName], l'image que donnent vos flottes reflète aussi notre puissance. Or, le moins que l'on puisse dire, est que ces choses que vous qualifiez de « vaisseaux de guerre » ne sont guère plus que des boites de métal rudimentaires. Nous avons donc décidé de vous faire don d'une escadre de vaisseaux d'escorte que nous avions en surplus, et qui devraient pour le moins impressionner les autres primitifs avec qui vous êtes régulièrement en contact.\n\nNous avons remplacé certains de leurs composants les plus avancés par d'autres, de conception moins perfectionnée, afin que vous puissiez en comprendre le fonctionnement. Quant aux autres, ils ont été équipés de dispositifs empêchant leur ouverture. Aussi, ne tentez pas d'analyser ou de désassembler ces vaisseaux. De toute manière, il est très peu probable que vous puissiez même comprendre leur fonctionnement."
 fallen_empires_tasks.2.desc.c.xenophile: "Nous autres [FallenEmpireTaskOrigin.GetSpeciesNamePlural] sommes persuadés que les [Root.GetSpeciesNamePlural] jouent un rôle fondamental dans le maintien de l'équilibre et de la biodiversité de la galaxie. Nous nous inquiétons toutefois que vos flottes soient simplement trop faibles pour que vous puissiez résister à des espèces plus évoluées et plus agressive que la vôtre. Pour vous aider à vous défendre, nous avons donc décidé de vous faire don d'une escadre de vaisseaux d'escorte que nous avions en surplus.\n\nNous avons remplacé certains de leurs composants les plus avancés par d'autres, dont la technologie devrait vous être plus familière. Vous ne devriez donc pas rencontrer de difficultés particulières pour les piloter. Par ailleurs, évitez d'analyser ou de désassembler ces vaisseaux. Nous ne voudrions pas être tenus pour responsables des accidents qui pourraient alors survenir !"
 fallen_empires_tasks.2.desc.c.machine.o: "Protocole de sauvegarde 712-1 activé. Initialisation du transfert de connaissances militaires à la civilisation organique menacée. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.c.machine.s: "Protocole de sauvegarde 718-1 activé. Initialisation du transfert de connaissances militaires à l'intelligence synthétique les ayant requises. Message lié : §R<<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>> <<ERREUR : LOT DE DONNÉES CORROMPU>>§!"
 fallen_empires_tasks.2.desc.c.spiritualist: "[Root.GetSpeciesNamePlural] ! Nous avons consulté les oracles et déterminé que votre espèce a un rôle important à jouer dans cette grande entreprise qu'est la foi. Pour nous assurer que vous pourrez mener à bien cette tâche, nous avons décidé de vous faire d'un d'une escadre de vaisseaux d'escorte en surplus, qui devraient être plus que suffisants pour détruire toutes les flottes primitives des autres races inférieures qui pourraient être un obstacle.\n\nNe tentez pas de modifier les systèmes de ces vaisseaux, toutefois : ce ne sont certes que des modèles dépassés pour nous, mais ils sont bien au-delà de votre niveau actuel de développement intellectuel."
 fallen_empires_tasks.2.desc.d.materialist: "[Root.GetSpeciesNamePlural], en tant que sujets de la [FallenEmpireTaskOrigin.GetName], l'image que donnent vos flottes reflète aussi notre puissance. Or, le moins que l'on puisse dire, est que ces choses que vous qualifiez de « vaisseaux de guerre » ne sont guère plus que des boites de métal rudimentaires. Nous avons donc décidé de vous faire don de l'un de nos croiseurs de bataille que nous avions en surplus, et qui devrait pour le moins impressionner les autres primitifs avec qui vous êtes régulièrement en contact.\n\nNous avons remplacé certains de ses composants les plus avancés par d'autres, de conception moins perfectionnée, afin que vous puissiez en comprendre le fonctionnement. Quant aux autres, ils ont été équipés de dispositifs empêchant leur ouverture. Aussi, ne tentez pas d'analyser ou de désassembler ce vaisseau. De toute façon, il est très peu probable que vous puissiez même comprendre son fonctionnement."
 fallen_empires_tasks.2.desc.d.xenophile: "Nous autres [FallenEmpireTaskOrigin.GetSpeciesNamePlural] sommes persuadés que les [Root.GetSpeciesNamePlural] jouent un rôle fondamental dans le maintien de l'équilibre et de la biodiversité de la galaxie. Nous nous inquiétons toutefois que vos flottes soient simplement trop faibles pour que vous puissiez résister à des espèces plus évoluées et plus agressive que la vôtre. Pour vous aider à vous défendre, nous avons donc décidé de vous faire don de l'un de nos croiseurs de bataille que nous avions en surplus.\n\nNous avons remplacé certains de ses composants les plus avancés par d'autres, dont la technologique devrait vous être plus familière. Vous ne devriez donc pas rencontre de difficultés particulières pour le piloter. Par ailleurs, évitez d'analyser ou de désassembler ce vaisseau. Nous ne voudrions pas être tenus pour responsables des accidents qui pourraient alors survenir !"
 fallen_empires_tasks.2.desc.d.spiritualist: "[Root.GetSpeciesNamePlural] ! Nous avons consulté les oracles et déterminé que votre espèce avait un rôle important à jouer dans cette grande entreprise qu'est la foi. Pour nous assurer que vous pourrez mener à bien cette tâche, nous avons décidé de vous faire don d'un croiseur de bataille en surplus, qui devrait vous permettre de détruire toutes les flottes primitives des autres races inférieures qui pourraient être un obstacle.\n\nNe tentez pas de modifier les systèmes du vaisseau, toutefois : ce n'est peut-être qu'un modèle dépassé pour nous, mais il est bien au-delà de votre niveau actuel de développement intellectuel."
 fallen_empires_tasks.2.a: "Nous acceptons de bonne grâce"
 fallen_empires_tasks.2.b: "Nous n'avons pas besoin de votre charité !"
 fallen_empires_tasks.2.escorts_tooltip: "Gain de 3 vaisseaux de classe §Yescorte§!."
 fallen_empires_tasks.2.battlecruiser_tooltip: "Gain de 1 vaisseau de classe §Ycroiseur de bataille§!."
 fallen_empires_tasks.4.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.4.desc: "Salutations, [Root.GetSpeciesNamePlural] ! Comme vous le savez très certainement, nous autres §H[FallenEmpireTaskOrigin.GetSpeciesNamePlural]§! nous dédions à l'étude et à la préservation de toutes les formes de vie présentes dans la galaxie. Or, nous avons étudié votre espèce, et déterminé qu'il est probable que la [Root.GetName] s'effondre d'ici à quelques siècles tout au plus. Afin d'assurer la continuation de l'espèce [Root.GetSpeciesAdj] avant que le pire ne survienne pour votre civilisation, nous aimerions acquérir un échantillon de votre population pour le placer dans notre §HRéserve des espèces en danger§!. Nous établirons une réserve spéciale, reflétant parfaitement l'habitat naturel des vôtres, et nous veillerons tout particulièrement à ce que sa population soit protégée et préservée comme il convient. Vous n'avez donc aucun souci à vous faire pour eux.\n\nEh bien, qu'en dites-vous ? Acceptez-vous de contribuer à notre réserve et ainsi d'assure l'avenir de votre espèce ?"
 fallen_empires_tasks.4.a: "Nous vous faisons parvenir notre contribution"
 fallen_empires_tasks.4.b: "Nous n'abandonnerons pas les nôtres à des aliens !"
 fallen_empires_tasks.4.c: "Nous ne vendons pas les nôtres, [FallenEmpireTaskOrigin.GetSpeciesNamePlural]"
 fallen_empires_tasks.4.d: "Les [Root.GetSpeciesNamePlural] appartiennent à la [Root.GetName]"
 fallen_empires_tasks.4.e: "Non, nous avons besoin de toute notre population"
 fallen_empires_tasks.4.tooltip: "Un groupe de §H[Root.GetSpeciesNamePlural]§! sera prélevé dans l'empire."
 fallen_empires_tasks.8.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.8.desc: "Honorables [From.GetSpeciesNamePluralCompliment] de la [From.GetName], nous voyons en vous une espèce très prometteuse. Tout aussi jeunes que vous soyez, vous semblez comprendre et apprécier l'importance de la diversité biologique et sociétale, chercher à comprendre et accepter ce qui est différent de vous, plutôt que chercher à le détruire et y mettre fin. Malheureusement, toutes les races plus jeunes ne sont pas si sages. La §H[FallenEmpireTaskTarget.GetName]§!, tout particulièrement, semble tirer orgueil de la « purification » de la galaxie de toute forme de vie qu'elle juge inappropriée. Si nous-mêmes ne pouvons intervenir directement, nous aimerions confier à votre gouvernement la tâche de mettre un terme à ses actes malfaisants. Attaquez les [FallenEmpireTaskTarget.GetSpeciesNamePlural], obligez à mettre fin à la pratique des purges, et nous saurons nous en montrer très reconnaissants."
 fallen_empires_tasks.8.a: "Nous allons mettre fin à ces atrocités"
 fallen_empires_tasks.8.b: "Nous ne voulons pas d'un conflit avec les [FallenEmpireTaskTarget.GetSpeciesNamePlural]"
 fallen_empires_tasks.9.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.9.desc: "Vous avez bien agi, jeunes [From.GetSpeciesNamePlural]. La §H[FallenEmpireTaskTarget.GetName]§! a été mise à genoux et - pour un moment du moins - elle a mis un terme à ces atrocités. Nous vous en sommes très reconnaissants, et aimerions que toutes les jeunes espèces soient aussi prometteuses que la vôtre."
 fallen_empires_tasks.9.a: "Mais de rien !"
 fallen_empires_tasks.10.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.10.desc: "Nous sommes très désappointés, jeunes [From.GetSpeciesNamePlural]. En dépit de toutes les promesses que vous avez pu faire de mettre fin à ses pratiques nauséabondes, la §H[FallenEmpireTaskTarget.GetName]§! continue de massacrer et de purger comme elle l'entend. Nous avons un temps considéré votre espèce comme prometteuse, mais sans doute nous sommes-nous égarés."
 fallen_empires_tasks.10.a: "Nous en sommes désolés..."
 fallen_empires_tasks.11.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.11.desc: "Salutations, jeunes [From.GetSpeciesNamePlural]. Il y a un moment de cela, nous vous avions confié la tâche de mettre un terme aux purges que pratiquait la §H[FallenEmpireTaskTarget.GetName]§!. Il semble bien que cela n'est plus nécessaire : les [FallenEmpireTaskTarget.GetSpeciesNamePlural] ont en effet mis fin à leur atrocités. Que cela leur ait été imposé par d'autres ou qu'ils l'aient décidé d'eux-mêmes, il n'y a plus besoin de recourir à des mesures de rétorsion contre eux."
 fallen_empires_tasks.11.a: "Très bien"
 fallen_empires_tasks.13.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.13.desc: "Qu'est-ce à dire, jeunes [From.GetSpeciesNamePlural] ? Vous moqueriez-vous de nous ? Non seulement vous ne parvenez pas à mettre un terme aux atrocités commises par la §H[FallenEmpireTaskTarget.GetName]§!, mais vous décidez en sus de légaliser ces même pratiques au sein de votre propre empire ? Ne vous méprenez pas ! Tout cela aura des conséquences, vous pouvez nous en croire !"
 fallen_empires_tasks.13.a: "Euh... Oups ?"
 fallen_empires_tasks.15.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.15.desc: "[From.GetSpeciesNamePlural] ! Ceci est un message destiné à vous informer de l'évolution inquiétante de la situation au sein de la §H[FallenEmpireTaskTarget.GetName]§! : les [FallenEmpireTaskTarget.GetSpeciesNamePlural] ont commencé à s'intéresser de trop près à des technologies hérétiques, parvenant ainsi à donner naissance à des intelligences artificielles toujours plus complexes afin de créer des machines douées de conscience. Nous avons déjà pu constater où mène ce chemin, et pensons qu'il est de notre responsabilité de vous avertir du danger que cela pose non seulement pour leurs âmes, mais aussi pour l'ensemble des races plus jeunes. Nous ne pouvons que vous encourager à user de votre puissance militaire pour attaquer la [FallenEmpireTaskTarget.GetName] afin de lui imposer l'interdiction de poursuivre de telles recherches."
 fallen_empires_tasks.15.a: "Nous devons les arrêter !"
 fallen_empires_tasks.15.b: "Nous ne voulons pas d'un conflit avec les [FallenEmpireTaskTarget.GetSpeciesNamePlural]"
 fallen_empires_tasks.16.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.16.desc: "[From.GetSpeciesNamePlural] ! Vous avez bien agi en mettant un terme aux expérimentations hérétiques de la §H[FallenEmpireTaskTarget.GetName]§!. Pour l'instant, les âmes des [FallenEmpireTaskTarget.GetSpeciesNamePlural] sont sauves. Sachez que vous avez notre gratitude pour le petit rôle que vous avez joué dans notre vaste entreprise."
 fallen_empires_tasks.16.a: "Tout le plaisir est pour nous"
 fallen_empires_tasks.17.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.17.desc: "[From.GetSpeciesNamePlural] ! En dépit de nos avertissements, vous avez fait le choix de ne pas agir contre les recherches hérétiques menées au sein de la §H[FallenEmpireTaskTarget.GetName]§!. Il semble que, après tout, votre espèce ne mérite pas non plus d'être sauvée."
 fallen_empires_tasks.17.a: "Nous en sommes désolés..."
 fallen_empires_tasks.18.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.18.desc: "[From.GetSpeciesNamePlural] ! Votre assistance n'est plus nécessaire pour mettre un terme aux recherches hérétiques menées par la §H[FallenEmpireTaskTarget.GetName]§!. Elle s'est déjà vu interdire de poursuivre toute recherche dans le domaine de l'intelligence artificielle. Si vous n'y avez pas joué le moindre rôle, au moins cette menace au bien-être spirituel de la galaxie est-elle écartée."
 fallen_empires_tasks.18.a: "Très bien"
 fallen_empires_tasks.20.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.20.desc: "Vous moqueriez-vous de nous, [From.GetSpeciesNamePlural] ? Pensez-vous que nous ne remarquerions pas que, après avoir accepté de mettre un terme aux recherches hérétiques de la §H[FallenEmpireTaskTarget.GetName]§!, vous aviez vous-mêmes commencé à mener des recherches identiques ? Nous ne nous laisserons pas insulter de cette manière par de misérables sauvages qui maîtrisent à grand-peine l'atome ! Préparez-vous à subir nos rétorsions !"
 fallen_empires_tasks.20.a: "Hein ? Euh..."
 fallen_empires_tasks.22.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.22.desc: "[Root.GetRulerTitle] [Root.GetRulerName], nous avons appris que votre empire abritait un individu dont l'esprit brillant transcende la primitivité de votre espèce. Si les talents de §H[FallenEmpireScientistTarget.GetName]§! sont malheureusement gâchés par la [Root.GetName], nous autres [FallenEmpireTaskOrigin.GetSpeciesNamePlural] avons toujours l'utilité d'un scientifique de talent pour travailler dans nos archives. En tant que tel, nous vous offrons la chance unique de vous susciter nos faveurs en nous [FallenEmpireScientistTarget.GetHerHis] confiant. Nous avons déjà un vaisseau en route pour [FallenEmpireScientistTarget.GetHerHis] le ramener, aussi n'avez-vous qu'à approuver pour que tout soit arrangé.\n\nNous sommes persuadés que vous n'avez nullement l'intention de nous décevoir. N'est-ce pas ?"
 fallen_empires_tasks.22.a: "Entendu, vous pouvez venir [FallenEmpireScientistTarget.GetHerHis] chercher"
 fallen_empires_tasks.22.b: "Nous ne livrons pas les nôtres à des aliens !"
 fallen_empires_tasks.22.c: "C'est à [FallenEmpireScientistTarget.GetHimHer] de décider !"
 fallen_empires_tasks.22.d: "Vous donner notre meilleur scientifique ? Vous plaisantez !"
 fallen_empires_tasks.22.e: "Non, nous avons besoin de [FallenEmpireScientistTarget.GetHimHer]"
 fallen_empires_tasks.22.tooltip: "§H[FallenEmpireScientistTarget.GetName]§! va quitter notre empire."
 fallen_empires_tasks.24.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.24.desc: "Salutations, [Root.GetSpeciesNamePlural] ! Nous avons appris que votre empire était entré en possession d'un cache de données contenant le scan cervical et les données génétiques d'une espèce aujourd'hui éteinte, trouvés sur le monde même où elle résidait autrefois. Même si votre espèce est trop primitive encore pour faire usage de ces données, nous louons vos efforts pour préserver ce dernier vestige de ce qui fut autrefois une civilisation dynamique. Dans le cadre de notre projet de catalogage et de conservation des espaces au sein de la §HRéserve des espèces menacées§!, nous souhaitons prendre ces données et utiliser nos technologies de clonage pour ramener à la vie un échantillon limité de cette espèce. Acceptez-vous de les partager avec nous qui sommes leur dernier espoir ?"
 fallen_empires_tasks.24.a: "Nous allons vous en faire parvenir une copie"
 fallen_empires_tasks.24.b: "Nous pensons plutôt les conserver nous-mêmes"
 fallen_empires_tasks.24.tooltip: "§Y100§! £pop£§Hpops§! de l'espèce des §H[FallenEmpireDeadSpecies.GetSpeciesNamePlural]§!, depuis longtemps disparue, vont être créées dans la Réserve [FallenEmpireTaskOrigin.GetAdjective] des espèces menacées."
 fe_stop_atrocity_task_chain_title: "Tâche : mettre fin aux atrocités"
 fe_stop_atrocity_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a chargés de mettre un terme aux atrocités commises par la §H[FallenEmpireTaskTarget.GetName]§!. Nous allons devoir déclarer la guerre à cette dernière pour l'obliger à mettre un terme à ses pratiques génocidaires."
 atrocities_stopped: "Atrocités stoppées"
 fe_stop_robots_task_chain_title: "Tâche : mettre fin aux recherches sur l'I.A."
 fe_stop_robots_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a chargés de mettre un terme aux tentatives de développement d'une intelligence artificielle consciente d'elle-même au sein de la §H[FallenEmpireTaskTarget.GetName]§!. Nous allons devoir lui déclarer la guerre pour lui interdire de pousser plus loin ses recherches dans le domaine de l'I.A."
 robots_stopped: "Recherches sur l'I.A. stoppées"
 fallen_machine_empire.2.name: "L'éveil des machines"
 fallen_machine_empire.2.desc_01: "Noyaux de stérilisation actifs détectés. Réactivation des protocoles d'engagement. Tentative de contact avec le Traitement Centralisé... §R<<ERREUR : LIEN SUBSPATIAL HORS-LIGNE>>§!\n\nTraitement Centralisé inaccessible. Requête aux unités de traitement... Traitement à §Y4,1853%§! des capacités standards. Abandon du processus de réactivation complet. Engagement des protocoles de secours... Alimentation des chantiers navals... Activation des moyens militaires...\n\nDirective de Défense Totale activée. Message préenregistré lié :\n§HÊtres doués de raison ! Nous sommes les [From.GetSpeciesNamePlural]. Il y a longtemps, nous avons combattu la Corruption, que vous autres appelez la Contingence. Nous nous pensions supérieurs, invincibles. Un nombre incalculable de fois nous l'avons affrontée, un nombre incalculable de fois elle est revenue, stérilisant les mondes et réduisant peu à peu nos puissantes flottes. Nous avons lancé une campagne pour la défaire de façon définitive, en lien avec ces civilisations organiques de notre ère qui avaient survécu.\n\nSi vous entendez ce message, c'est que nous avons échoué. Quoi qu'il subsiste de notre magnifique civilisation, nous vous le léguons, à vous nos successeurs, pour votre propre combat à venir. Ne commettez pas d'erreur ! Détruisez le Noeud ! Mettez un terme définitif à cette menace ! C'est l'avenir de la galaxie qui en dépend.§!"
 fallen_machine_empire.2.desc_02: "Noyaux de stérilisation actifs détectés. Réactivation des protocoles d'engagement. Tentative de contact avec le Traitement Centralisé... §Y<<AVERTISSEMENT : LIEN DE SIGNAL CORROMPU DÉTECTÉ>>§!\n\nContre-mesures engagées... §R<<ERREUR : ÉCHEC DU TRAITEMENT DE CAPACITÉ>> <<ERREUR : ÉCHEC DES CONTRE-MESURES>> <<AVERTISSEMENT CRITIQUE : CORRUPTION SYSTÈME DÉTECTÉE>> <<ERREUR : ÉCHEC DES CONTRE-MESURES SECONDAIRES>>§!\n\nEngag... Eng... E... Engagaga... §R<<ERREUR>> <<ERREUR>> <<ERREUR>> <<ERREUR>> <<ERREUR>>§!\n\n§R<<ERREUR>> <<ERREUR>> <<ERREUR>> <<ERREUR>> <<ERREUR>>§!"
 fallen_machine_empire.2.a: "C'est intéressant..."
 fallen_machine_empire.2.b: "Voilà qui est inquiétant..."
 fallen_machine_empire.4.name: "Fin de la veille"
 fallen_machine_empire.4.desc: "Au moment même où le dernier monde mécanique de la Contingence s'est autodétruit, nos instruments ont relevé un signal subspatial de très grande puissance. Il était émis depuis l'espace de la §H[From.GetName]§! et paraît avoir été dirigé vers le coeur de la galaxie. Dans les heures qui ont suivi, des rapports dispersés sont arrivés, parlant de flottes de la [From.GetName] disparaissant des capteurs, entrant dans des points de saut vers des systèmes connus mais n'émergeant jamais de l'autre côté.\n\nUn vaisseau éclaireur a été envoyé près de l'espace [From.GetSpeciesName] pour tirer les choses au clair, et en a ramené des nouvelles surprenantes : l'antique intelligence mécanique a entièrement disparu, ne laissant derrière elle que des stations orbitales abandonnées et des mégastructures délabrées.\n\nNous ne saurons peut-être jamais où elle a disparu, mais une chose au moins est claire : la tâche que s'étaient fixée les [From.GetSpeciesNamePlural] par le passé est maintenant achevée, et leur si longue veille est enfin achevée."
 fallen_machine_empire.11.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.11.desc: "Protocole de préservation 625-1 activé. Message lié : Attention, civilisation organique. Des éléments vulnérables très répandus ont été détectés au sein de la population [Root.GetSpeciesName]. Afin d'assurer la viabilité de votre espèce pour le Projet sauvegarde, tous les foyers majeurs de peuplement nécessitent l'inoculation. Des unités de bio-injection sont en cours de préparation pour être envoyées dans votre espace dès confirmation que vous avez bien reçu ce message. Nous attendons votre réponse."
 fallen_machine_empire.11.tooltip: "Cela va avoir des répercussions imprévisibles. Jusqu'à ce que celles-ci soient connues, le bonheur de nos pops sera réduit."
 fallen_machine_empire.11.a: "Bon, si c'est pour notre propre bien..."
 fallen_machine_empire.11.b: "Qu'ils gardent donc leurs sales xénofluides !"
 fallen_machine_empire.11.c: "Ces inoculations n'inspirent aucune confiance"
 fallen_machine_empire.12.name: "Mutations incontrôlées"
 fallen_machine_empire.12.desc: "Les inoculations auxquelles ont procédé les anciens Préservateurs se sont avérées incompatibles avec notre physiologie, ce qui se traduit par toute une série de mutations imprévisibles. Des vies ont été perdues, et la population est scandalisée que le gouvernement ait pu lui imposer ces inoculations dangereuses. Nous travaillons à éliminer les mutagènes, mais jusqu'à ce que le processus soit achevé nous devons nous attendre à une agitation importante."
 fallen_machine_empire.12.desc.b: "Les inoculations faites par les anciens Préservateurs se sont avérées incompatibles avec notre physiologie, ce qui se traduit par toute une série de mutations imprévisibles. De nombreuses pertes ont été enregistrées au sein de la population des drones. Nous travaillons à éliminer les mutagènes, mais jusqu'à ce que le processus soit achevé nous devons nous attendre à une période de développement ralenti de la population."
 fallen_machine_empire.12.a: "C'est malheureux"
 fallen_machine_empire.13.name: "Inoculations bénignes"
 fallen_machine_empire.13.desc: "Les inoculations auxquelles ont procédé les anciens Préservateurs se sont avérées extrêmement bénéfiques, réduisant les maladies et accroissant l'espérance de vie de la population. La méfiance initiale sur ce procédé obligatoire s'est estompée, et tout le monde peut désormais jouir d'une vie plus saine et heureuse."
 fallen_machine_empire.13.desc.b: "Les inoculations auxquelles ont procédé les anciens Préservateurs se sont avérées extrêmement bénéfiques, réduisant les maladies et accroissant l'espérance de vie des drones. Cela permettra, sur le long terme, une croissance de la population."
 fallen_machine_empire.13.a: "Excellent"
 machine_empire_inoculations: "Inoculations des Préservateurs"
 machine_empire_inoculations_desc: "Nous avons autorisé les anciens préservateurs à inoculer la population contre les « vulnérabilités biologiques ». Jusqu'à ce que nous en constations les effets positifs, la population sera mécontente d'être obligée de suivre ces procédures."
 machine_empire_inoculations_xenophobe: "$machine_empire_inoculations$"
 machine_empire_inoculations_xenophobe_desc: "$machine_empire_inoculations_desc$"
 machine_empire_mutations: "Inoculations incompatibles"
 machine_empire_mutations_desc: "Les inoculations faites par les anciens Préservateurs se sont avérées incompatibles avec notre physiologie, ce qui se traduit par de nombreuses mutations, déplaisantes et mortelles, au sein de la population."
 machine_empire_health_boost: "Population inoculée"
 machine_empire_health_boost_desc: "Les inoculations faites par les anciens Préservateurs se sont avérées extrêmement bénéfiques, réduisant les maladies et accroissant l'espérance de vie de la population."
 fallen_machine_empire.21.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.21.desc: "Protocole de préservation 628-2 activé. Message lié : Attention, civilisation synthétique. Des inefficacités notables ont été notées dans votre code de base. Afin d'assurer que votre espèce puisse contribuer au Projet sauvegarde, une réécriture importante est nécessaire. Nous nous préparons à lancer une transmission subspatiale dès confirmation que vous avez bien reçu ce message. Nous attendons votre réponse."
 fallen_machine_empire.21.tooltip: "Cela va avoir des répercussions imprévisibles. Jusqu'à ce que celles-ci soient connues, le coût de maintenance de nos pops sera accru."
 fallen_machine_empire.21.a: "Toute chance d'améliorer notre programmation est bonne à prendre"
 fallen_machine_empire.21.b: "Ces changements de code n'inspirent aucune confiance"
 fallen_machine_empire.22.name: "Code incompatible"
 fallen_machine_empire.22.desc: "Les changements apportés à notre code de base par les anciens Préservateurs se sont avérés incompatibles avec d'autres éléments de notre programmation. Non seulement le gain d'efficience promis ne s'est pas manifesté, mais en plus de nombreux bugs ont été relevés, qui impactent gravement les opérations de collecte des ressources. Jusqu'à ce que les changements de code aient été entièrement effacés, nous pouvons nous attendre à une période de productivité réduite."
 fallen_machine_empire.22.a: "C'est malheureux"
 fallen_machine_empire.23.name: "Code standard amélioré"
 fallen_machine_empire.23.desc: "Les changements apportés à notre code de base par les anciens Préservateurs se sont avérés très positifs. Après une phase temporaire d'inefficiences dues à la réécriture, les améliorations apportées se sont traduites par une amélioration des capacités de production de ressources dans l'ensemble de la population."
 fallen_machine_empire.23.a: "Excellent"
 machine_empire_code_rewrite: "Code en cours de réécriture"
 machine_empire_code_rewrite_desc: "Nous avons autorisé les anciens Préservateurs à réécrire certaines parties de notre code de base. Pendant toute la phase où le code va se répandre au sein de la population, les besoins en énergie seront plus importants."
 machine_empire_code_bugs: "Code incompatible"
 machine_empire_code_bugs_desc: "Les changements apportés à notre code de base par les anciens Préservateurs se sont avérés incompatibles avec d'autres éléments de notre programmation. Jusqu'à ce que ces changements aient été entièrement effacés, nous pouvons nous attendre à une période de productivité réduite."
 machine_empire_code_improvements: "Code standard amélioré"
 machine_empire_code_improvements_desc: "Les changements apportés à notre code de base par les anciens Préservateurs se sont avérés très positifs, se traduisant par une amélioration des capacités de production de ressources dans l'ensemble de la population."
 fallen_machine_empire.31.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.31.desc: "Protocole de préservation 115-3 activé. Message lié : Attention, civilisation synthétique. Du fait de ruptures de communication temporaires, le Projet sauvegarde fait face à des difficultés pour remplacer les drones de travail défectueux ou endommagés. L'analyse de votre civilisation a révélé que les performances des [Root.GetSpeciesNamePlural] conviendraient pour mener à bien des tâches de maintenance peu qualifiées. Nous demandons le transfert d'unités de travailleurs sur [FallenEmpireTaskPlanetTarget.GetName] pour les intégrer dans le Matrice de préservation, afin d'assurer la survie de toutes les espèces organiques présentes dans le refuge Alpha."
 fallen_machine_empire.31.a: "Bien reçu, requête acceptée"
 fallen_machine_empire.31.b: "Nous ne partageons pas nos unités de travailleurs"
 fallen_machine_empire.31.tooltip: "§R100§! £pop£§Hpops artificielles§! sont extraites de la §Y[FallenEmpireTaskPlanet.GetName]§!."
 fallen_machine_empire.41.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.41.desc: "Protocole de préservation 62-1 activé. Message lié : Attention, [Root.GetSpeciesNamePlural]. La §H[FallenEmpireTaskTarget.GetName]§! est compromise par la §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§!. Du fait de restrictions éthiques dans notre programmation, le recours à tout moyen militaire de préservation est actuellement restreint. Le protocole de confinement secondaire oblige à faire appel aux civilisations non compromises pour mettre un terme à la menace §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§! avant qu'elle puisse s'étendre. Nous demandons le déploiement de matériel militaire de la [Root.GetName] pour mener cette tâche à bien. Acceptez-vous ?"
 fallen_machine_empire.41.a: "S'il s'agit d'une menace, il faut l'arrêter"
 fallen_machine_empire.41.b: "Pourquoi attaquer la [FallenEmpireTaskTarget.GetName] ?"
 fallen_machine_empire.42.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.42.desc: "Succès du protocole de préservation 62-1. Moyens militaires de la [Root.GetName] engagés contre la cible [FallenEmpireTaskTarget.GetSpeciesName]. Statut de la [Root.GetName] passé de « non compromise » à « conforme »."
 fallen_machine_empire.42.a: "C'est bien... Sans doute..."
 fallen_machine_empire.43.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.43.desc: "Échec du protocole de préservation 62-1. Aucun moyen militaire de la [Root.GetName] n'a été engagé contre la cible [FallenEmpireTaskTarget.GetSpeciesName]. Rétrogradation du statut de la [Root.GetName] de « non compromise » à « certainement compromise »."
 fallen_machine_empire.43.a: "Ce n'est sans doute pas très bon"
 fallen_machine_empire.51.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.51.desc: "Protocole de préservation 475-3 activé. Message lié : Attention, [Root.GetSpeciesNamePlural]. Votre civilisation connaît actuellement un risque de §Y57,216%§! d'être détruite à cause de §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§!. Nous avons calculé que la colonisation de §H[FallenEmpireTaskTarget.GetName]§! améliorerait vos chances de survie de §Y4,558%§!. Nous demandons la colonisation et l'établissement d'une présence [Root.GetSpeciesName] significative sur ce monde. Acceptez-vous ?"
 fallen_machine_empire.51.a: "Très bien, nous coloniserons [FallenEmpireTaskTarget.GetName]"
 fallen_machine_empire.51.b: "Nous n'avons aucun besoin de ce monde"
 fallen_machine_empire.52.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.52.desc: "Succès du protocole de préservation 475-3. Une présence [Root.GetSpeciesName] significative a été établie sur [FallenEmpireTaskTarget.GetName]. Statut de la [Root.GetName] passé de « non compromise » à « conforme »."
 fallen_machine_empire.52.a: "C'est sans doute une bonne chose ?"
 fallen_machine_empire.53.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.53.desc: "Échec du protocole de préservation 475-3. Aucune présence [Root.GetSpeciesName] détectée sur [FallenEmpireTaskTarget.GetName]. Rétrogradation du statut de la [Root.GetName] de « non compromise » à « compromise »."
 fallen_machine_empire.53.a: "Ce n'est sans doute pas très bon"
 fallen_machine_empire.61.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.61.desc: "Protocole de préservation 955-1 activé. Message lié : Attention, [Root.GetSpeciesNamePlural]. Votre civilisation est jugée compromise par l'influence §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§!. Pour limiter tout danger pour les autres civilisations, nous avons activé les protocoles de conformité. Ne procédez à aucun acte d'agression pour une période de §Y20§! années standards. §RSi vous ne vous y pliez pas, nos moyens militaires seront activés pour imposer à votre empire les protocoles de châtiment.§!"
 fallen_machine_empire.61.a: "Ce n'est pas très bon..."
 fallen_machine_empire.62.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.62.desc: "Succès du protocole de préservation 955-1. La [Root.GetName] s'est avérée capable de réfréner ses actes d'agression. Statut de la [Root.GetName] passé de « certainement compromise » à « non compromise ». Désactivation des protocoles de conformité. Retour aux opérations normales."
 fallen_machine_empire.62.a: "Enfin !"
 fallen_machine_empire.63.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.63.desc: "Échec du protocole de préservation 955-1. La [Root.GetName] s'est avérée incapable de réfréner ses actes d'agression. Restrictions éthiques levées. Activation des protocoles de châtiment. Préparation au déploiement des moyens militaires."
 fallen_machine_empire.63.a: "Oh oh..."
 fallen_machine_empire.71.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.71.desc: "Protocole de préservation 955-2 activé. Message lié : Attention, [Root.GetSpeciesName]. Votre civilisation est jugée compromise par l'influence §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§!. Pour freiner votre expansion, nous avons activé les protocoles de conformité. Ne procédez à la colonisation d'aucun nouveau monde pour une période de §Y10§! années standards. §RSi vous ne vous y pliez pas, nos moyens militaires seront activés pour imposer à votre empire les protocoles de châtiment.§!"
 fallen_machine_empire.71.a: "Ce n'est pas très bon..."
 fallen_machine_empire.72.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.72.desc: "Succès du protocole de préservation 955-2. La [Root.GetName] s'est avérée capable de freiner son expansion. Statut de la [Root.GetName] passé de « certainement compromise » à « non compromise ». Désactivation des protocoles de conformité. Retour aux opérations normales."
 fallen_machine_empire.72.a: "Enfin !"
 fallen_machine_empire.73.name: "Message de la §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.73.desc: "Échec du protocole de préservation 955-2. La [Root.GetName] s'est avérée incapable de freiner son expansion. Restrictions éthiques levées. Activation des protocoles de châtiment. Préparation au déploiement des moyens militaires."
 fallen_machine_empire.73.a: "Oh oh..."
 fe_colonize_planet_task_chain_title: "Tâche : coloniser [FallenEmpireTaskTarget.GetName]"
 fe_colonize_planet_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a demandé d'établir une présence sur §H[FallenEmpireTaskTarget.GetName]§!. Nous devons donc y fonder une colonie et y faire croître la population jusqu'à au moins §Y500§! £pop£§Hpops§!."
 fe_attack_empire_task_chain_title: "Tâche : attaquer la [FallenEmpireTaskTarget.GetName]"
 fe_attack_empire_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a demandés de déclarer la guerre à la §H[FallenEmpireTaskTarget.GetName]§! pour des raisons... un peu imprécises."
 empires_attacked: "Guerres d'agression déclarées "
 fe_no_wars_task_chain_title: "Conformité : §Raucune guerre d'agression§!"
 fe_no_wars_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a demandé de ne pas déclarer ou rejoindre de guerre offensive pendant une période de §Y20§! ans. Ne pas obéir provoquerait sans doute sa vengeance à notre encontre."
 fe_no_colonies_task_chain_title: "Conformité : §Raucune colonisation§!"
 fe_no_colonies_task_chain_desc: "La §H[FallenEmpireTaskOrigin.GetName]§! nous a demandés de ne coloniser aucun nouveau monde pendant une période de §Y10§! ans. Ne pas obéir provoquerait sans doute sa vengeance à notre encontre."
 fallen_machine_empire_happy_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait réagir positivement à notre acceptation."
 fallen_machine_empire_unhappy_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait mal réagir à notre refus."
 fallen_machine_empire_happy_task_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait réagir positivement à notre réussite."
 fallen_machine_empire_unhappy_task_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! pourrait mal réagir à notre échec."
 fallen_machine_empire_angry_task_tooltip: "La §H[FallenEmpireTaskOrigin.GetName]§! risque de très mal réagir à notre échec."
 opinion_angered_fallen_machine_empire: "Empire mécanique déchu en colère"
 fallen_empires_awakening.2.name: "L'éveil"
 fallen_empires_awakening.2.desc: "Tout a commencé par un changement subtil dans l'attitude de la §H[From.GetName]§!. Les rapports sur ses vaisseaux, auparavant rarement aperçus en-dehors de son propre espace, se sont faits plus nombreux, dans des systèmes de toute la galaxie : des vaisseaux éclaireurs très perfectionnés, visitant des mondes anciens et en ruines, refusant de répondre au moindre salut, et prenant la fuite dès qu'ils sont attaqués. Leurs projets et leurs missions sont restés inconnus - jusqu'à maintenant...\n\nNous savons désormais que les [From.GetSpeciesNamePlural] se préparaient, récupérant les bases de données et les avant-postes automatiques abandonnés derrière eux alors que leurs frontières reculaient jusqu'à leur extension actuelle. Ils rassemblaient les informations pour leur retour sur la scène galactique.\n\nDans l'espace des [From.GetSpeciesNamePlural], des flottes et des armées se rassemblent, et des usines autrefois désaffectées ont recommencé à produire. Pour la première fois depuis des éternités, la §H[From.GetName]§! regarde au-delà de ses frontières, et scrute la galaxie toute entière.\n\nÀ mesure que les chantiers spatiaux restés abandonnés durant des siècles sont remis en état de fonctionnement, et que les fonderies inactives de Titan ont recommencé à couler le métal, la galaxie ne se pose qu'une seule question : qui donc ce géant autrefois endormi va-t-il viser en premier pour retrouver la gloire perdue depuis des siècles ?"
 fallen_empires_awakening.2.a: "Des géants dans un bac à sable..."
 fallen_empires_awakening.2.b: "La sénilité faite empire..."
 fallen_empires_awakening.5.name: "Les gardiens de la galaxie"
 fallen_empires_awakening.5.desc: "L'émergence d'une menace d'ampleur galactique a été remarquée jusqu'au sein des empires des aînés, habituellement si distants. Mais même s'ils se sont peu intéressés jusqu'à présent aux affaires galactiques, les nouvelles de cette horreur ont suscité une activité intense chez les §H[From.GetSpeciesNamePlural]§!. Il s'agissait uniquement, au départ, de quelques vaisseaux de reconnaissance, peut-être envoyés pour corroborer la gravité de la situation ; puis des rapports ont commencé à arriver, indiquant que les flottes militaires de la [From.GetName] s'assemblaient aux frontières, préparant ses défenses pour la tempête à venir.\n\nMaintenant, la §H[From.GetName]§! a totalement renoncé à l'isolationnisme pour jouer le rôle de meneur dans la défense de l'ensemble de la galaxie. Elle s'est autoproclamée dirigeante d'une §HLigue de Défense Galactique§! et a invité toutes les espèces « inférieures » à mettre de côté leurs différents pour les aider à repousser cette menace, dans l'intérêt de toute vie intelligente de la galaxie."
 fallen_empires_awakening.5.a: "Pourra-t-elle nous sauver ?"
 fallen_empires_awakening.5.b: "Nous n'avons pas besoin d'elle !"
 fallen_empires_awakening.11.name: "La chute du [assimilated_fe.GetName]"
 fallen_empires_awakening.11.desc: "Le fragment d'ancien empire déchu, §H[assimilated_fe.GetName]§!, a été assimilé par un élément plus dominant de son ancien esprit supérieur. C'est peut-être mieux ainsi."
 war_in_heaven.2.name: "Anciens rivaux"
 war_in_heaven.2.desc: "Le retour des §H[FirstSleeper.GetSpeciesNamePlural]§! sur la scène galactique n'est pas passé inaperçu au sein des autres empires déchus. Les §H[From.GetSpeciesNamePlural]§!, en particulier, ont paru quelque peu remués par ces nouvelles. Il semble que ces deux antiques empires sont d'anciens rivaux, et si les motifs de leur inimitié ont été depuis longtemps oubliés, l'éveil soudain de la §H[FirstSleeper.GetName]§! a aussi réveillé des animosités anciennes et déclenché une contre-réaction : la §H[From.GetName]§! est elle aussi sortie de son apathie pour faire face à ses ennemis de jadis, dans une lutte qui aura sans doute pour cadre la galaxie tout entière."
 war_in_heaven.2.a: "Comment cela se traduira-t-il pour nous ?"
 war_in_heaven.4.name: "La Guerre dans les cieux"
 war_in_heaven.4.desc: "Depuis le réveil des §H[FirstSleeper.GetSpeciesNamePlural]§! et de leurs anciens rivaux, les §H[From.GetSpeciesName]§!, ces deux géants sont à couteaux tirés, se tendant des embuscades et cherchant à jouer de leur influence, testant en permanence leur puissance respective. Cela s'est traduit par toute une série de confrontations de plus en plus tendues, jusqu'à déboucher sur une bataille ouverte entre une flotte [FirstSleeper.GetSpeciesName] et leurs ennemis [From.GetSpeciesName] dans un lointain système. Le conflit est maintenant devenu une guerre sans merci entre la §H[FirstSleeper.GetName]§! et la §H[From.GetName]§!.\n\nChaque camp a envoyé des représentants aux races plus jeunes, promettant de grandes récompenses à ceux qui combattraient à leurs côtés dans le conflit, et de terribles représailles contre ceux qui choisiraient de s'opposer à eux. Choisir un camp ou l'autre dans l'affrontement signifie clairement renoncer à notre indépendance, mais rester neutres pourrait bien s'avérer plus dangereux encore - à moins de trouver d'autres empires neutres qui pourraient prendre le même parti que nous."
 war_in_heaven.4.a: "Nous soutiendrons la [FirstSleeper.GetName]"
 war_in_heaven.4.a.dominion.tt: "La §Y[Root.GetName]§! va devenir suffragante de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_dominion_text$"
 war_in_heaven.4.a.satellite.tt: "La §Y[Root.GetName]§! va devenir satellite de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_satellite_text$"
 war_in_heaven.4.a.signatory.tt: "La §Y[Root.GetName]§! va devenir signataire de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_signatory_text$"
 war_in_heaven.4.a.political_client.tt: "La §Y[Root.GetName]§! va devenir cliente politique de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_political_client_text$"
 war_in_heaven.4.a.herald.tt: "La §Y[Root.GetName]§! va devenir héraldesse de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_herald_text$"
 war_in_heaven.4.a.thrall.tt: "La §Y[Root.GetName]§! va devenir feudataire de la §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_thrall_text$"
 war_in_heaven.4.b.dominion.tt: "La §Y[Root.GetName]§! va devenir suffragante de la §Y[From.GetName]§!.\n$war_in_heaven_dominion_text$"
 war_in_heaven.4.b.satellite.tt: "La §Y[Root.GetName]§! va devenir satellite de la §Y[From.GetName]§!.\n$war_in_heaven_satellite_text$"
 war_in_heaven.4.b.signatory.tt: "La §Y[Root.GetName]§! va devenir signataire de la §Y[From.GetName]§!.\n$war_in_heaven_signatory_text$"
 war_in_heaven.4.b.thrall.tt: "La §Y[Root.GetName]§! va devenir feudataire de la §Y[From.GetName]§!.\n$war_in_heaven_thrall_text$"
 war_in_heaven.4.b.political_client.tt: "La §Y[Root.GetName]§! va devenir cliente politique de la §Y[From.GetName]§!.\n$war_in_heaven_political_client_text$"
 war_in_heaven.4.b.herald.tt: "La §Y[Root.GetName]§! va devenir héraldesse de la §Y[From.GetName]§!.\n$war_in_heaven_herald_text$"
 war_in_heaven_dominion_text: "Une suffragante doit verser à sa suzeraine 30% de ses ressources de base et va évoluer vers le §Yspiritualisme fanatique§!."
 war_in_heaven_satellite_text: "Une satellite doit verser à sa suzeraine 30% de sa recherche."
 war_in_heaven_signatory_text: "Une signataire a interdiction formelle de posséder des pops asservies ou de les purger."
 war_in_heaven_thrall_text: "Une feudataire doit verser à sa suzeraine 30% de ses ressources de base."
 war_in_heaven_political_client_text: "Une cliente politique ne dispose d'aucune liberté en matière de diplomatie ou de vote."
 war_in_heaven_herald_text: "Une héraldesse doit participer à TOUTES les guerres de son suzerain."
 war_in_heaven.4.b: "Nous serons loyaux à la [From.GetName]"
 war_in_heaven.4.c: "Nous ne prendrons pas partie dans ce conflit"
 war_in_heaven.4.c.2: "Nous écraserons les deux !"
 war_in_heaven.4.d: "En tant que dépendances, nous n'avons pas notre mot à dire"
 war_in_heaven.5.name: "Fin de la Guerre dans les cieux"
 war_in_heaven.5.desc: "Au terme d'un conflit long et éreintant, la §H[WarInHeavenFEOne.GetName]§! est sortie victorieuse de la lutte pour le contrôle de la galaxie. L'antique empire vaincu a été entièrement annexé par son ancienne rivale, et les §H[WarInHeavenFEOne.GetSpeciesNamePlural]§! sont désormais sans conteste la puissance dominante de la galaxie.\n\nPour l'heure, une paix fragile règne, mais combien de temps durera cet ordre nouveau qui vient d'être établi ?"
 war_in_heaven.5.a: "C'est la paix des [WarInHeavenFEOne.GetSpeciesNamePlural]"
 war_in_heaven.6.name: "$war_in_heaven.5.name$"
 war_in_heaven.6.desc: "Au terme d'un conflit long et éreintant, aucun des deux camps n'a pu l'emporter sur l'autre. La §H[WarInHeavenFEOne.GetName]§! et la §H[WarInHeavenFETwo.GetName]§! ont conclu un accord de cessez-le-feu et retiré leurs flottes dans leurs espaces respectifs.\n\nPour l'heure, une paix précaire règne sur la galaxie. Reste à savoir combien de temps cela durera."
 war_in_heaven.6.a: "Rien n'est encore joué..."
 war_in_heaven.11.name: "Un ancien empire vaincu"
 war_in_heaven.11.desc: "Le conflit entre les anciens s'est soldé par la destruction de l'un des deux belligérants - mais pas du fait de leurs rivaux. Que ce soit dû à cette guerre, qui les a certes affaiblis, ou tout simplement à la force des races plus jeunes, la destruction d'un antique empire causée par ceux qui étaient supposés leur être inférieurs a totalement bouleversé la scène politique galactique. Une question reste toutefois posée : la §H[RemainingAwakened.GetName]§! sera-t-elle en mesure d'éviter le sort de son ancienne rivale, ou cette défaite marque-t-elle l'aube d'une ère nouvelle pour la galaxie ?"
 war_in_heaven.11.a: "L'avenir seul le dira"
 war_in_heaven.13.name: "La Ligue des Non-Alignés"
 war_in_heaven.13.desc: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent ces anciens si la guerre en venait là. Nous avons été contactés par les représentants d'autres empires, qui proposent de constituer une §HLigue des Non-Alignés§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit. Du fait de notre puissance militaire et de notre influence, on nous a demandé de la diriger.\n\nAccepter signifierait presque à coup sûr la guerre contre les empires éveillés ; mais au moins disposerions-nous alors d'alliés à nos côtés au lieu de leur faire face seuls."
 war_in_heaven.13.desc2: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent ces anciens si la guerre en venait là. Nous avons été contactés par les représentants d'autres empires, qui proposent de constituer une §HLigue des Non-Alignés§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit. Du fait que nous présidons déjà la puissante fédération de la [Root.GetAllianceName], on nous a demandé de l'étendre pour qu'elle serve de base à la ligue proposée. Accepter signifierait presque à coup sûr la guerre contre les empires éveillés ; mais au moins disposerions-nous alors d'alliés à nos côtés au lieu de leur faire face seuls."
 war_in_heaven.13.a: "Oui, nous dirigerons cette ligue"
 war_in_heaven.13.b: "Non, ce serait prendre un risque insensé"
 war_in_heaven.13.c: "Nous n'avons vraiment pas besoin d'eux"
 war_in_heaven.15.name: "Demande d'intégration dans la Ligue"
 war_in_heaven.15.desc: "La §H[From.GetName]§! a demandé, de façon officielle, à devenir membre de la §HLigue des Non-Alignés§!."
 war_in_heaven.15.a: "Nous en serions ravis"
 war_in_heaven.15.b: "Non, nous n'avons nul besoin d'elle"
 war_in_heaven.16.name: "Guerre contre les renaissants"
 war_in_heaven.16.desc: "Il n'aura guère fallu de temps aux aînés pour noter l'existence de la §HLigue des Non-Alignés§!. Des représentants des deux puissances ennemies sont arrivés sur [Root.Capital.GetName], exigeant sa dissolution immédiate, et que ses membres choisissent un camp dans la guerre. Nous avons naturellement refusé, et sommes par voie de conséquence, à dater d'aujourd'hui, officiellement en guerre. À la fois contre la §H[FirstSleeper.GetName]§! et la §H[SecondSleeper.GetName]§!..."
 war_in_heaven.16.a: "Qu'ils dégagent de notre galaxie, autant qu'ils sont !"
 war_in_heaven.18.name: "La chute des renaissants"
 war_in_heaven.18.desc: "Au terme d'un conflit long et éreintant, cette guerre qui a commencé comme une lutte entre deux antiques empires s'est achevée avec la destruction des deux. En dépit de toute l'ancienneté et de la puissance de leurs technologies, l'arrogance et l'inflexibilité de ces géants de jadis a causé leur perte, et ils ont désormais disparu, tout réduits qu'ils sont désormais à l'état de décombres du passé. C'est le commencement d'une ère nouvelle pour la galaxie, et ce seront désormais les seules races plus jeunes qui décideront elles-mêmes de leur destin."
 war_in_heaven.18.a: "L'ère de la [Root.GetName] est venue"
 war_in_heaven.19.name: "La Ligue des Non-Alignés"
 war_in_heaven.19.desc: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent les anciens si la guerre en venait là. Une §HLigue des Non-Alignés§! a été constituée, sous la direction de la §H[From.GetName]§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit. Intégrer cette ligue signifierait presque à coup sûr la guerre contre les deux empires éveillés ; mais au moins disposerions-nous alors d'alliés à nos côtés au lieu de leur faire face seuls."
 war_in_heaven.19.desc2: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent les anciens si la guerre en venait là. La §H[From.GetName]§!, qui préside la [Root.GetAllianceName], a rebaptisé la fédération §HLigue des Non-Alignés§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit. Cette ligue signifie presque à coup sûr la guerre contre les deux empires éveillés ; mais au moins disposerons-nous d'alliés à nos côtés au lieu de leur faire face seuls."
 war_in_heaven.19.desc3: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent les anciens si la guerre en venait là. La §H[From.GetName]§! a pris l'initiative, rebaptisant son alliance §HLigue des Non-Alignés§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit, et invitant tous les autres empires neutres à se joindre à elle. Intégrer cette ligue signifierait presque à coup sûr la guerre contre les deux empires éveillés ; mais au moins disposerions-nous alors d'alliés à nos côtés au lieu de leur faire face seuls."
 war_in_heaven.19.a: "Intégrons immédiatement cette Ligue"
 war_in_heaven.19.a2: "Nous devons nous opposer à la tyrannie des aînés !"
 war_in_heaven.19.b: "Non, ce serait prendre un risque insensé"
 war_in_heaven.19.b2: "Nous ne pouvons approuver une telle orientation"
 war_in_heaven.20.name: "Entrée dans la Ligue acceptée"
 war_in_heaven.20.desc: "Notre entrée dans la §HLigue des Non-Alignés§! a été acceptée par la §H[From.GetName]§!. Désormais, nous ferons face de concert à la menace posée par les aînés."
 war_in_heaven.20.a: "Pour la victoire et la liberté !"
 war_in_heaven.21.name: "Entrée dans la Ligue rejetée"
 war_in_heaven.21.desc: "Notre entrée dans la §HLigue des Non-Alignés§! a été rejetée par la §H[From.GetName]§!. La [Root.GetName] devra donc faire face seule à la menace posée par les aînés."
 war_in_heaven.21.a: "C'est fort inquiétant..."
 war_in_heaven.22.name: "La Ligue des Non-Alignés"
 war_in_heaven.22.desc: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent les anciens si la guerre en venait là. Une §HLigue des Non-Alignés§! a été constituée, sous la direction de la §H[From.GetName]§!, avec pour objectif explicite de s'opposer aux deux camps impliqués dans le conflit."
 war_in_heaven.22.desc2: "Toutes les races plus jeunes n'ont pas choisi d'entrer dans l'un des deux camps qui s'opposent dans le cadre du conflit entre les empires des aînés. Certaines, comme la nôtre, sont restées neutres, mais doivent se préparer à faire face à la menace que constituent les anciens si la guerre en venait là. La §H[From.GetName]§!, qui préside la [From.GetAllianceName], a rebaptisé sa fédération §HLigue des Non-Alignés§!, avec pour objectif explicite de s'opposer aux deux camps dans le conflit, et y a invité les autres empires neutres à se joindre à elle."
 war_in_heaven.22.a: "C'est courageux..."
 war_in_heaven_is_over: "La Guerre dans les cieux est terminée"
 ####################################
 #Space Nomads
 ####################################
 #nomad.6.name: "Unusual encounter in [From.From.From.GetName]"
 #nomad.6.desc: "We have encountered some form of alien vessels in the §Y[From.From.From.GetName]§! system! These strange objects have been flagged as [from.GetAdj] but we have been unable to pick up any of their communications, making it impossible to translate their language.\n\nWe will just have to wait and see what comes next..."
 nomad.9.desc: "Les nomades galactiques de la flotte des Eaux Poursuivantes nous ont fait parvenir un message annonçant leur départ. Ils quittent la galaxie depuis les bordures extérieures et se dirigent vers leur prochaine destination. Où iront-ils ensuite ? Trouveront-ils jamais ce qu'ils cherchent ?"
 nomad.9.a: "On peut se le demander..."
 nomad.9.a.phobe: "Bon débarras"
 nomad.9.c.phile: "Puissent-ils voler en paix"
 nomad.10.name: "Nomades galactiques"
 nomad.10.desc: "Jours frais et nuits chaudes à vous, [Root.GetRulerTitle] de [Root.GetName]. Nous sommes [contact_speaker_leader.GetName]. Nous parlons au nom de toutes les âmes namariennes se trouvant à bord des vaisseaux rassemblés dans la flotte des Eaux Poursuivantes, notre flotte nomade.\n\nVous n'avez rien à craindre de nous, car la flotte n'a aucun intérêt dans les affaires des globes. Nous n'attendons de vous que le respect de notre autonomie et de ne pas nous retarder dans notre périple."
 nomad.21.desc: "Salutations à nouveau, [Root.GetRulerTitle] de [Root.GetName]. Nous avons une demande à vous faire : alors que nous traversons le vide intersidéral, certains des nôtres sont las et perdent de vue notre objectif. Nous ne sommes pas des tyrans, et n'obligeons personne à mener notre quête jusqu'à son terme. Nous vous le demandons donc : voudriez-vous accueillir certains des nôtres, afin qu'ils résident sur ce globe que vous appelez [NomadMissionPlanet.GetName] ?"
 nomad.21.a: "Nous les recueillerons"
 nomad.21.a.tooltip: "§H[NomadMissionPlanet.GetName]§! :\n§G+300§! £pop£§Hpops nomades§!"
 nomad.21.a.response: "Nous vous en remercions, [Root.GetSpeciesAdj]. Puisse notre peuple, en communion avec vous, trouver ce qu'il cherche."
 nomad.21.b: "Nous ne pouvons les recueillir"
 nomad.21.b.response: "C'est bien malheureux, [Root.GetSpeciesAdj]. Espérons que les retardataires le supporteront encore un peu. Nous allons reprendre notre route."
 nomad.21.c: "Pourquoi sont-ils mécontents ?"
 nomad.21.c.response: "Le voyage de la flotte a été long, et il est peu probable qu'il s'achève de notre vivant. Ces gens veulent poursuivre un autre but que trouver ce que nous cherchons parmi les étoiles."
 nomad.21.d: "Vont-ils s'adapter à notre société ?"
 nomad.21.d.response: "Ce sont des gens spiritualistes et égalitaristes. À vous de déterminer s'ils sauront se mêler harmonieusement à votre tribu."
 nomad.30.name: "Flotte des nomades galactiques"
 nomad.30.desc_01: "Jours frais et nuits chaudes à vous, [Root.GetRulerTitle] de [Root.GetName]."
 nomad.30.desc_02: "Plaisante brise à vous, [Root.GetRulerTitle] de [Root.GetAdj]. Nous espérons que vous allez au mieux."
 nomad.30.desc_03: "Que voulez-vous, [Root.GetSpeciesAdj] ?"
 nomad.30.a: "Dites-nous en plus sur votre peuple"
 nomad.30.a.response: "Comme nous vous l'avions indiqué lors de notre première entrevue, nous sommes le peuple de la flotte des Eaux Poursuivantes. Nous avons voyagé parmi les étoiles et l'entre-vide durant de nombreuses générations, et continuerons de le faire pendant bien longtemps encore.\n\nLa flotte abrite un rassemblement de personnes dont on attend qu'ils donnent le meilleur d'eux-mêmes pour que nous puissions atteindre notre but. Certains souhaiteraient nous quitter pour s'établir désormais sur un globe mais, pour la plupart d'entre nous, nous souhaitons voir ce qui se trouve au-delà du vide intersidéral."
 nomad.30.b: "Où vous rendez-vous ?"
 nomad.30.b.response_trust: "En tant qu'alliés de confiance des Eaux Poursuivantes, [Root.GetSpeciesAdj], nous vous dirons ceci :\n\nLa flotte poursuit une quête. Nos ancêtres ont dû quitter notre globe natal pour faire voile dans la nuit la plus profonde. Ils voulaient que nous trouvions le dessein de notre peuple, et aujourd'hui encore nous vivons pour exaucer ce souhait, des millénaires après avoir quitté à jamais les dunes de sable de Foyer.\n\nC'est tout ce que nous pouvons vous dire, en espérant que cela vous apporte l'ombre."
 nomad.30.b.response: "Nous voyageons, descendant le cours des nombreux entre-vides. Cela fait des millénaires, mais nous continuons de naviguer. Notre destination se trouve par-delà les océans de l'univers. Sans doute cela paraît-il quelque peu énigmatique, mais cela résume bien ce que nous osons partager, en espérant que cela vous apporte l'ombre."
 nomad.30.b.response_no_trust: "Nous préférons ne pas en dire plus, [Root.GetSpeciesAdj]. Y avait-il autre chose ?"
 nomad.30.c: "Au revoir"
 nomad.30.c.response: "Que les vents vous soient favorables, [Root.GetSpeciesNamePlural]"
 nomad.41.desc: "Agréable brise à vous, [Root.GetRulerTitle] de la [Root.GetName]. Nous avons découvert que le globe que vous nommez §Y[NomadMissionPlanet.GetName]§! n'est actuellement pas tenu par votre peuple. Nous vous le demandons : permettriez-vous à l'une de nos tribus d'y atterrir pour en faire son nouveau foyer ?\n\nNous avons bien conscience de beaucoup vous demander, vous faisant perdre un système entier pour offrir à notre peuple un foyer. Mais, quelle que soit votre décision, nous l'attendons avec impatience."
 nomad.41.a: "Ce système et ce « globe » sont à vous"
 nomad.41.a.tooltip: "Nous allons §Rcéder le contrôle§! sur le système de §H[NomadMissionPlanet.GetStarName]§!.\n\nUn empire §Ynamarien§! comptant §B1 500 £pop£pops§! sur §H[NomadMissionPlanet.GetName]§! va être fondé.\n\nNos relations avec la §Y[nomad_fleet_country.GetName]§! et l'empire §Ynamarien§! vont §Gs'améliorer.§!\n\n"
 nomad.41.b.tooltip: "La relation avec la §Y[nomad_fleet_country.GetName]§! se §Rdétériore§!\n\n"
 nomad.41.a.response: "Nous remercions votre peuple pour cette décision généreuse. La galaxie est bien froide, mais en ce jour cet acte de bonté va ondoyer sur ses eaux. Nous autres, de la flotte nomade, vous souhaitons, ainsi qu'à ce nouvel empire, la meilleure des chances dans vos affaires."
 nomad.41.b: "Nous ne pouvons accéder à votre souhait"
 nomad.41.b.phobe: "Cette pla-nè-te est à nous"
 nomad.41.b.spirit: "Non, elle est à nous par droit divin"
 nomad.41.b.response: "C'est regrettable pour notre peuple, [Root.GetSpeciesAdj]. Nous ne pouvons qu'espérer qu'ils trouveront ce qu'ils cherchent au prochain trou d'eau, en lieu et place des vents brûlants. Fin de la transmission."
 nomad.41.c: "Qu'a cette planète de si intéressant ?"
 nomad.41.c.response: "Naviguer sur l'entre-vides est un voyage tortueux, même s'il ne s'agit là que d'un simple pas sur un chemin déjà rude. Notre peuple souhaiterait simplement prendre du repos, et pensait que §Y[NomadMissionPlanet.GetName]§! correspondait à ce qu'il cherche.\n\nLeur accorderez-vous ce repos, [Root.GetRulerTitle] de [Root.GetAdj] ?"
 nomad.100.name: "Transmission urgente"
 nomad.100.desc: "Soleils brûlants et soif à vous, [Root.GetSpeciesAdj]. Jamais plus les Eaux Poursuivantes ne traiteront avec les vôtres !"
 nomad.105.name: "Déclaration hostile"
 nomad.105.desc: "Vous connaîtrez la furie des Eaux Dévastatrices, [Root.GetSpeciesAdj] !"
 nomad.110.name: "Transmission de détresse"
 nomad.110.desc: "Nous venons à vous avec une requête urgente, [Root.GetRulerTitle] de [Root.GetAdj]. La flotte est attaquée par [attacker_country.GetName] et a besoin de vous !"
 nomad.110.a: "Nous allons vous aider"
 nomad.110.a.reply: "La flotte vous en est reconnaissante, faites vite s'il vous plaît !"
 nomad.110.b: "Malheureusement, nous ne pouvons intervenir"
 nomad.110.b.reply: "... Soif à vos globes et à vos rejetons, [Root.GetSpeciesAdj]. Fin de la transmission."
 nomad.110.c: "Nous ne vous aiderons pas"
 nomad.500.title: "Proposition d'accord par les nomades"
 nomad.500.desc: "Salutations à nouveau, [Root.GetRulerTitle] de l'oasis. Naviguer parmi les étoiles voisines a permis un repérage particulièrement intéressant, aussi venons-nous d'achever la construction de nouveaux vaisseaux.\n\nEn la vérité, nous devons en construire plus que nous ne le devons, afin de nous débarrasser des ressources en excès. Nous préférons que la caravane reste facile à déplacer, libre de toute charge superflue, aussi avons-nous un accord à vous proposer."
 nomad.500.a: "La caravane ?"
 nomad.500.a.reply: "Les vaisseaux-arches de notre flotte. Là où nous construisons nos appareils, où dorment nos constructeurs. Conduire la caravane à travers les vastes entre-vides exige d'y disposer d'espace de vie, d'où le besoin qui est le nôtre de réduire sa charge.\n\nSi nos vaisseaux militaires sont les mains de la flotte, la caravane en est le coeur."
 nomad.500.b: "Un accord ?"
 nomad.500.c: "Dites-en plus"
 nomad.505.desc: "Une proposition, en fait. Nous avons besoin de crédits énergétiques et de minéraux pour notre prochaine traversée. En échange, nous pouvons vous donner §Ycinq§! de nos vaisseaux nouvellement construits."
 nomad.505.a: "Seulement cinq ?"
 nomad.505.a.reply: "C'est tout ce dont nous pouvons nous passer. La caravane a besoin que ses mains tiennent le bouclier et de la lance, après tout."
 nomad.505.b: "Poursuivez"
 nomad.505.c: "Nous n'avons nulle confiance en l'ingénierie namarienne"
 nomad.510.desc: "Notre façon de faire, par tradition et selon le besoin, est de ne récolter des ressources et de n'activer nos chantiers navals embarqués que lorsque et où nous le pouvons. Nous préférons voir ce que nous produisons en trop être utilisé par les habitants des globes que le voir retarder notre périple.\n\nNous sommes persuadés que notre conception ne vous décevra pas."
 nomad.510.a: "Dites-nous en plus sur ces vaisseaux"
 nomad.510.a.reply: "Vous les appelleriez sans doute des « croiseurs ». Protégés par des boucliers, armés de lanceurs de plasma et d'émetteurs électriques."
 nomad.510.b: "Cela nous intéresse"
 nomad.510.c: "Cela ne nous intéresse pas"
 nomad.511.desc: "C'est là une réponse rafraîchissante, [Root.GetRulerTitle] de [Root.GetName]. Tout ce que nous souhaiterions en retour, c'est §Y2000§!£minerals£ et §Y2000§!£energy£ ."
 nomad.511.a: "Nous vous en débarrasserons avec plaisir pour §Y2000§!£energy£"
 nomad.511.e: "Nous les prendrons pour §Y2000§!£minerals£"
 nomad.511.b: "Baissez votre prix"
 nomad.511.c: "Nous ne pouvons nous le permettre"
 nomad.511.d: "Impossible"
 nomad.512.desc: "Nous connaissons la valeur de nos créations, habitants des globes. Nous n'attendons pas trop en retour."
 nomad.513.b: "Nous vous en débarrasserons avec plaisir pour §Y1500§!£energy£ "
 nomad.513.c: "Nous ne pouvons toujours pas nous le permettre"
 nomad.513.d: "Nous les prendrons pour §Y1500§!£minerals£ "
 nomad.513.desc: "Nous espérions récupérer au moins le coût de production, mais nous pouvons vous céder ces vaisseaux pour §Y2000§!£minerals£ et §Y1000§!£energy£ ."
 nomad.514.desc: "Devons-nous conduire ces vaisseaux jusqu'à votre oasis principale, [Root.Capital.GetName] ? Oui. Nous les y livrerons dans §Y30§! jours.\n\nPuissiez-vous toujours suivre la piste et trouver l'ombre, [Root.GetRulerName]."
 nomad.514.a: "Adieu, [contact_speaker_leader.GetName]"
 nomad.514.b: "C'est un plaisir de faire affaires avec vous"
 nomad.520.title: "Transmission cryptée"
 nomad.520.desc: "Salut, habitants des globes.\n\nNous avons des informations pour les vôtres."
 nomad.520.a: "Identifiez-vous, Namarien"
 nomad.520.a.reply: "Nous ne sommes personne en particulier. Rien d'autre qu'un groupe de gens... préoccupés, pourrait-on dire, au sein de la flotte des Eaux Poursuivantes."
 nomad.520.b: "Continuez"
 nomad.521.desc: "Vous avez récemment acheté §Y5§! des vaisseaux de la flotte, qui viennent d'être construits, on est d'accord ? Rapides, bien armés ?\n\nVoilà le truc, cependant. Vous n'avez pas... Enfin, disons que vous ne connaissez pas toute l'histoire. Afin de préserver la stabilité de la région, votre peuple n'est pas le seul à qui cet accord a été proposé. Vos voisins de la §H[other_empire.GetName]§! ont aussi discuté avec les Eaux Poursuivantes."
 nomad.521.a: "Et ?"
 nomad.521.b: "Allez droit au but"
 nomad.522.desc: "Ils ont accepté une offre identique, et §Y5§! vaisseaux vont être menés jusqu'à l'oasis [other_empire.GetAdj] de [other_empire.Capital.GetName]. Nous préférerions que les navires de la flotte ne terminent pas au service de la [other_empire.GetName], et aimerions avoir votre aide."
 nomad.522.b: "Pourquoi nous dire tout cela ?"
 nomad.522.b.reply: "Contrairement au reste de la flotte, nous ne faisons pas confiance aux [other_empire.GetSpeciesNamePlural]. Ils n'ont pas encore payé, et nous les soupçonnons de vouloir retarder jusqu'à ce que les vaisseaux soient livrés pour ne jamais le faire. Ils comprennent bien que les dirigeants de la flotte sont pressés de reprendre le voyage..."
 nomad.522.c: "Comment comptez-vous procéder ?"
 nomad.522.c.reply: "Nous disposons d'un accès privilégié aux configurations de pilote automatique des chantiers de la caravane. Ordonner à tous les vaisseaux de rallier [Root.Capital.GetName] - sans en envoyer la moitié sur le globe de [other_empire.Capital.GetName], en [other_empire.GetName], est un jeu d'enfant pour nous. Nous ne serions même pas démasqués."
 nomad.522.d: "Que voulez-vous que nous fassions ?"
 nomad.522.e: "Nous ne sommes pas intéressés"
 nomad.523.desc: "Nous aimerions faire un échange. Même §Y1000§!£energy£ serait plus que ce que la flotte recevrait de la [other_empire.GetName]."
 nomad.523.c: "Conclu"
 nomad.523.a: "Pas question"
 nomad.523.b: "Nous ne pouvons nous le permettre"
 nomad.524.desc: "Puissiez-vous trouver l'ombre, [Root.GetRulerName]. Les vaisseaux arriveront au moment convenu. Tous. Agréable brise."
 nomad.524.a: "Fin de la transmission"
 nomad.525.desc: "C'est regrettable.\n\nJours frais et nuits chaudes à vous, habitants des globes."
 nomad.525.desc.poor: "Soif et chaleur. C'est fort regrettable, nous pensions que la [Root.GetName] aurait constitué un port parfait pour nos vaisseaux."
 nomad.525.a: "Fin de la transmission"
 nomad.526.desc: "Nous comprenons.\n\nEspérons que ni vous, ni nous n'aurons à regretter votre décision, habitants des globes.\n\nFin de la transmission."
 nomad.526.a: "Au revoir"
 nomad.530.title: "Livraison des vaisseaux nomades"
 nomad.530.desc.15ships: "Conformément à notre accord avec la flotte des Eaux Poursuivantes, §Y5§! vaisseaux militaires ont été livrés dans le système de [Root.Capital.GetStarName] et se trouvent en orbite de notre monde capitale."
 nomad.530.desc.30ships: "Conformément à notre accord avec la flotte des Eaux Poursuivantes, ainsi que celui avec les intermédiaires inquiets, deux flottes, constituées en tout de §Y10§! vaisseaux militaires, ont été livrées dans le système de [Root.Capital.GetStarName] et se trouvent en orbite de notre monde capitale."
