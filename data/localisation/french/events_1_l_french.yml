 ####################################
 #Anomaly Events
 ####################################
 anomaly.1.name: "Astéroïde coprolithe"
 anomaly.1.desc: "Bien que difficile à accepter, tout laisse à penser que l'astéroïde [From.GetName] est un coprolithe, un excrément fossilisé provenant d'une gigantesque forme de vie. Il semble dater de plus d'un milliard d'années et la composition organique du fossile s'est minéralisée. Nos scientifiques s'interrogent sur le type de créature à l'origine d'un tel phénomène."
 anomaly.5.name: "Trésor de pirates"
 anomaly.5.desc: "Il y a un millier d'années, cet astéroïde semble avoir été utilisé de manière intermittente par des pirates. Nous avons réussi à nous introduire dans la base et à récupérer le trésor qui s'y trouvait. Il se compose principalement d'objets et d'artefacts volés dont certains semblent particulièrement précieux."
 anomaly.5.a: "Ces biens mal acquis nous seront fort utiles"
 anomaly.10.name: "Faune d'astéroïde"
 anomaly.10.desc: "Alors qu'il explorait [From.GetName], l'équipage du [Root.GetName] a été surpris de détecter de nombreux signes de vie provenant de l'intérieur de l'astéroïde. Il s'avère qu'il s'agit d'une importante colonie de lithovores, ressemblant assez à des vers, qui ont creusé leurs tunnels dans la roche. Ces formes de vie uniques sont, semble-t-il, parvenues à s'adapter au froid de l'espace."
 anomaly.10.a: "Ces créatures méritent d'être étudiées"
 anomaly.10.b: "Mais ils sont comme nous !"
 anomaly.15.name: "Fossiles retrouvés"
 anomaly.15.desc: "Des fossiles qui semblent correspondre à plusieurs espèces d'animaux marins ont été trouvés sur la surface stérile et sans air de [From.GetName]. La ceinture d'astéroïdes voisine serait née des vestiges d'une planète aujourd'hui disparue, théorie que semble accréditer cette récente découverte. À en juger par les fossiles, la planète abritait des formes de vie et était, du moins partiellement, recouverte d'eau."
 anomaly.15.b.evopred: "Dommage qu'ils n'aient pas eu le temps d'évoluer"
 anomaly.25.name: "Chantier spatial abandonné"
 anomaly.25.desc: "L'astéroïde [From.GetName] a été creusé pour permettre la construction d'une sorte de chantier spatial. Il a été abandonné et exposé au vide de l'espace pendant des siècles, avant d'être pillé par de précédents explorateurs. La conception de ce chantier spatial est unique en son genre et son étude pourrait s'avérer particulièrement intéressante."
 anomaly.25.a: "Nous devrions étudier sa construction."
 anomaly.30.name: "Décharge"
 anomaly.30.desc: "De toute évidence, quelqu'un a utilisé cet astéroïde comme décharge à un moment ou un autre dans le passé : toutes sortes de machines et de déchets métalliques ont été jetées dans son faible puits de gravité, qui sont tombés maintenant, jonchant la surface de l'astéroïde. Rien de très précieux n'y a été trouvé, mais beaucoup de métal pourrait être récupérés par une station minière."
 anomaly.30.a: "Nous devrions recycler tout ce que nous pouvons"
 anomaly.35.name: "Crash d'un vaisseau de reconnaissance"
 anomaly.35.desc: "Il y a plusieurs milliers d'années, un petit vaisseau de reconnaissance a labouré la surface de cet astéroïde, créant un canyon peu profond. Ce vaisseau semble dépourvu de cockpit, ce qui nous fait dire qu'il était piloté soit à distance, soit par une forme primitive d'intelligence artificielle. Bien que trop endommagé pour être récupéré, ce vaisseau n'a pas encore été démantelé par les pillards."
 anomaly.35.a: "Nous allons pouvoir étudier sa conception"
 anomaly.40.name: "Base minière automatisée"
 anomaly.40.desc: "Nous avons détecté une base minière automatisée construite en orbite autour de l'astéroïde [From.GetName]. Les impacts de sa coque laissent à penser qu'elle a été la cible d'armes légères. De plus, l'installation semble bloquée dans une sorte de boucle de rétroaction. Nous avons réussi à reprogrammer ses systèmes de base et contrôlons désormais l'installation tout entière."
 anomaly.40.desc.alt: "Nous avons détecté une base minière automatisée construite en orbite autour de l'astéroïde [From.GetName]. Il manque des pans de la coque et de grands trous révèlent qu'elle a été la cible d'armes lourdes. La station est irréparable, mais de précieux matériaux peuvent y être récupérés."
 anomaly.50.name: "Portée de la cible"
 anomaly.50.desc: "L'astéroïde [From.GetName] est jalonné de cratères provoqués par des armes et semble avoir été utilisé comme champ de tir il y a environ deux millénaires. Les relevés énergétiques résiduels laissent à penser que des armes exotiques y ont été testées, notamment des bombes subspatiales ainsi qu'une sorte de générateur de singularité. Nos scientifiques aimeraient étudier les échos énergétiques restants."
 anomaly.55.name: "Collision avec un astéroïde"
 anomaly.55.desc: "Un examen approfondi a montré qu'un astéroïde plus petit, composé essentiellement de métaux précieux, était récemment entré en collision avec [From.GetName]. Cette réserve de métaux, petite mais riche, se trouvait juste en dessous de la surface de l'astéroïde. Maintenant que nous l'avons découverte, elle devrait pouvoir être exploitée."
 anomaly.55.a: "Jolie trouvaille !"
 anomaly.60.name: "Radiation exotique"
 anomaly.60.desc: "Cet astéroïde est une capture extrasolaire et semble avoir été exposé à une radiation exotique lors de sa descente interstellaire, avant de se stabiliser dans le système [From.GetStarName]. La source de cette radiation reste inconnue, mais [Root.GetName] a réussi à récupérer de nombreuses données physiques en étudiant les émissions énergétiques de l'astéroïde."
 anomaly.65.name: "Crash d'un minéralier"
 anomaly.65.desc: "Après avoir repéré une anomalie dans le puits gravitationnel de [From.GetName], le [Root.GetName] a découvert ce qu'il reste de l'épave d'un ancien superminéralier, profondément enfoui dans la croûte de l'astéroïde. Il devait être chargé à plein lorsqu'il s'est écrasé, aussi les ressources minérales de cet astéroïde ont-elles été revues à la hausse."
 anomaly.300.name: "Écosystème atmosphérique"
 anomaly.300.desc: "Nous avons découvert un riche écosystème dans la haute atmosphère de la géante gazeuse [From.GetName]. De gigantesques créatures flottantes, chargées de gaz plus légers que l'air, suivent les courants atmosphériques et se nourrissent de l'énergie dégagée par les fréquents orages de la géante gazeuse. À leur tour, ces créatures permettent la vie d'animaux plus petits, qui se nourrissent de plancton atmosphérique et se mangent les uns les autres."
 anomaly.305.name: "Capsule cargo abandonnée"
 anomaly.305.desc: "Une capsule cargo a été abandonnée dans la haute atmosphère de [From.GetName] il y a bien longtemps. Elle a échappé aux autres voyageurs spatiaux et son orbite déclinante aurait fini par la mener vers l'atmosphère écrasante de la géante gazeuse en quelques années. Une fois la capsule ouverte, l'équipage du [Root.GetName] y a trouvé des bijoux aliens en métaux précieux."
 anomaly.305.a: "Faisons-les fondre"
 anomaly.305.b: "Vendons-les"
 anomaly.305.c: "Étudions leur conception"
 anomaly.305.d: "Nous allons les garder"
 anomaly.310.name: "Expérience sociale"
 anomaly.310.desc: "Une petite colonie aérostatique a été découverte alors qu'elle flottait juste au-dessus de l'atmosphère de [From.GetName]. De toute évidence, elle était autosuffisante et les restes de plusieurs espèces ont été retrouvés à bord.\n\nApparemment, il s'agissait d'une sorte d'expérience sociale menée il y a plusieurs siècles, expérience au terme de laquelle les colons finirent par s'entretuer. Nous avons téléchargé toutes les informations trouvées dans les banques de données restantes de cette colonie."
 anomaly.310.b.evopred: "Extrayons de la biomasse"
 anomaly.315.name: "Colonies aérostatiques"
 anomaly.315.desc: "Un réseau de colonies aérostatiques en ruine, remontant au bas mot à trois millénaires, se trouve dans l'orbite basse de cette géante gazeuse. Visiblement, elles avaient pour fonction première d'exploiter le gaz, avant d'être abandonnées puis réoccupées par de nombreuses espèces et des groupes de pirates.\n\nLes colonies ont depuis été pillées de tout ce qui avait la moindre valeur, mais le simple fait qu'elles continuent de flotter après tout ce temps en fait un sujet de recherche particulièrement intéressant."
 anomaly.320.name: "Champ de débris"
 anomaly.320.desc: "Le puissant puits gravitationnel de [From.GetName] a aspiré de nombreux débris spatiaux et ces derniers se sont accumulés à certains endroits de la géante gazeuse. La plupart de ces débris semblent provenir de vaisseaux spatiaux qui auraient livré bataille dans le système il y a plusieurs millénaires.\n\nDes pilleurs ont déjà mis la main sur les technologies et les artefacts de valeur, mais une station minière devrait pouvoir recycler le métal."
 anomaly.325.name: "Croiseur broyé"
 anomaly.325.desc: "L'épave brisée d'un vaisseau spatial de la taille d'un croiseur peuvent être détectés en orbite décroissante, dans l'atmosphère de [From.GetName]. Il semble s'être aventuré un peu trop loin dans l'atmosphère de la géante gazeuse, peut-être dans l'espoir d'échapper à des poursuivants, jusqu'à être broyé par la pression atmosphérique.\n\nIl se trouve désormais à une profondeur trop importante pour être dégagé, mais une analyse de la structure de l'épave nous a permis de récupérer de précieuses données techniques."
 anomaly.325.a: "Remarquable vaisseau"
 anomaly.330.name: "Tempêtes extrêmes"
 anomaly.330.desc: "L'atmosphère de [From.GetName] connaît régulièrement des tempêtes particulièrement violentes. Plusieurs dizaines de ces tempêtes permanentes, dont les vents peuvent atteindre des vitesses supérieures à 700 m/s, sont visibles depuis l'orbite. Leur cause demeure toutefois un mystère, car nous n'avons rien trouvé dans le modèle climatique de la planète qui pourrait les expliquer. Nous devrions étudier cette anomalie de plus près."
 anomaly.335.name: "Signature énergétique"
 anomaly.335.desc: "Le [Root.GetName] a détecté une étrange signature énergétique provenant d'un lieu indéterminé dans les profondeurs de l'atmosphère de [From.GetName]. Elle semble émaner d'une sorte de structure, peut-être les vestiges d'une station orbitale, mais la pression atmosphérique est telle qu'il est impossible de s'en approcher. Quoi qu'il en soit, l'analyse de cette signature unique a permis de récupérer des données précieuses pour les sciences physiques."
 anomaly.340.name: "Précieuse lune"
 anomaly.340.desc: "L'analyse détaillée d'un des nombreux satellites naturels en orbite autour de la géante gazeuse [From.GetName] a révélé la présence d'un gisement de métaux précieux et de minéraux qui avaient échappé à notre exploration initiale. Malgré la petite taille de cette lune, son orbite est stable, y compris en termes tectoniques."
 anomaly.340.a: "Belle découverte."
 anomaly.600.name: "Collision avec un astéroïde"
 anomaly.600.desc: "À un moment indéterminé, durant le dernier millénaire, un imposant astéroïde riche en minéraux est entré en collision avec [From.GetName], ce qui a dû avoir des conséquences considérables. Aux alentours du cratère, la [From.GetPlanetMoon] abonde désormais en minéraux."
 anomaly.600.a: "Heureux accident"
 anomaly.605.name: "Impact en cours de bond"
 anomaly.605.desc: "L'impressionnant cratère de [From.GetName] semble avoir été provoqué par une collision avec un vaisseau spatial. À en juger par la taille du cratère, on suppose que le vaisseau était en train de sortir d'une hyperligne à pleine vitesse lorsque, pour des raisons inconnues, il a percuté la surface de la [From.GetPlanetMoon], il y a quelque 10 000 ans.\n\nPrès du lieu du crash, le [Root.GetName] a détecté des échos subspatiaux résiduels ressemblant aux restes d'un champ d'hyperparticule effondré. Toutefois, le vaisseau s'étant désintégré au moment de la collision, cette théorie ne peut pas être vérifiée."
 anomaly.610.name: "Microsingularité"
 anomaly.610.desc: "Une microsingularité a récemment traversé [From.GetName], passant par son noyau avant de réapparaître de l'autre côté de la [From.GetPlanetMoon]. L'événement ne semble avoir provoqué aucun dommage irréversible, mais cela a modifié légèrement la production d'énergie du noyau, d'une manière que nos modèles scientifiques actuels ne peuvent expliquer. Étudier ce phénomène pourrait s'avérer judicieux."
 anomaly.615.name: "Inversion magnétique"
 anomaly.615.desc: "Alors que le [Root.GetName] était en train de l'observer, le champ magnétique de [From.GetName] s'est complètement inversé. Ce phénomène rare a interchangé la position des pôles magnétiques de la [From.GetPlanetMoon]. Par chance, tout cela a été enregistré par les capteurs du vaisseau, fournissant ainsi de précieuses informations à nos scientifiques."
 anomaly.625.name: "Pilote momifié"
 anomaly.625.desc: "Les restes momifiés d'un individu appartenant à une espèce mammalienne jusque là inconnue ont été repérés alors qu'ils dérivaient en orbite haute de §Y[From.GetName]§!. Vêtu de ce qui semble être une tenue de combat complète et d'un casque, il pourrait s'agir d'un pilote de chasseur qui se serait éjecté lors d'une ancienne bataille, avant d'être oublié et laissé là. L'examen de son cadavre a permis de récupérer des données intéressantes."
 anomaly.625.a: "Tragique destin"
 anomaly.625.b.evopred: "Leur sang coulera dans d'autres veines"
 anomaly.630.name: "Capsule de survie ancienne"
 anomaly.630.desc: "Une capsule de survie abandonnée a été repérée sur une orbite proche de §Y[From.GetName]§!. Elle est abîmée, portant visiblement les traces de l'explosion du vaisseau auquel elle appartenait, et les balayages initiaux suggèrent que sa construction remonte à plus de 5 000 ans.\n\nL'équipage du [Root.GetName] a réussi à l'ouvrir et y a trouvé les restes d'un alien reptilien vêtu d'un superbe uniforme. Il tenait entre ses griffes une petite image d'un individu de son espèce, peut-être son conjoint ou un chef vénéré."
 anomaly.630.b.evopred: "Les souverains et les esclaves ont le même goût"
 anomaly.635.name: "Écriture alien"
 anomaly.635.desc: "Il y a environ cinq mille ans, quelqu'un a utilisé un laser de minage pour tracer une gigantesque inscription sur la surface de [From.GetName]. L'écriture couvre une large partie de l'hémisphère nord de la [From.GetPlanetMoon], et a tout l'air d'être une courte histoire relatant la vie difficile d'un mercenaire alien."
 anomaly.650.name: "Voilier solaire"
 anomaly.650.desc: "Nous avons découvert un voilier solaire abandonné en orbite de §Y[From.GetName]§!. Construit par une culture inconnue, ce vaisseau subluminique semble dater de plusieurs milliers d'années. Une de ses immenses voiles a été déchirée, par une météorite vraisemblablement, ce qui aurait eu pour effet de neutraliser le vaisseau. Bien que la technologie de ce vaisseau soit totalement obsolète, elle présente des choix conceptuels intéressants."
 anomaly.650.a: "Primitive certes, mais néanmoins intéressante"
 anomaly.655.name: "Impact oblique"
 anomaly.655.desc: "Aux abords de [From.GetName], le [Root.GetName] a soudain été touché obliquement par divers impacts. Les projectiles dataient de plusieurs milliards d'années et d'après leur trajectoire, il s'agirait de munitions errantes venues d'une galaxie voisine. Après avoir manqué leur cible, elles ont continué leur trajectoire pendant des millénaires, jusqu'à ce jour. Les munitions que nous avons récupérées s'avèrent sophistiquées malgré leur très grand âge."
 anomaly.660.name: "Astéroïde tracté"
 anomaly.660.desc: "Pour une raison inconnue, quelqu'un a tracté un astéroïde jusqu'à une orbite stable autour de §Y[From.GetName]§!. D'imposantes pièces de moteur et de propulseurs se trouvent toujours à la surface, même si elles sont depuis longtemps hors d'usage. Celui qui a fait cela a aussi exploité le minerai de l'astéroïde, mais ces opérations ont visiblement été abandonnées peu après leur lancement."
 anomaly.660.b: "Ces aliens avaient du bon sens !"
 anomaly.670.name: "Dévastation nucléaire"
 anomaly.670.desc: "L'exploration de §Y[From.GetName]§! a révélé qu'il s'agissait autrefois d'une [From.GetPlanetMoon] continentale parfaite, au climat tempéré, il y a de cela un millier d'années seulement. Aujourd'hui, pourtant, son atmosphère est extrêmement toxique, sa surface hautement irradiée, et la vie n'y est plus possible.\n\nLes éléments relevés montrent que la [From.GetPlanetMoon] a été le théâtre d'une guerre thermonucléaire incroyablement destructrice ayant éclaté entre diverses factions d'une civilisation indigène pré-spatiale assez avancée."
 anomaly.670.a: "Quel gâchis..."
 anomaly.675.name: "Désert nucléaire"
 anomaly.675.desc_01: "L'exploration de [From.GetName] a révélé que la [From.GetPlanetMoon] connaît actuellement une ère glaciaire qui semble avoir été déclenchée par une guerre thermonucléaire totale remontant à des siècles. La plupart des formes de vie ont succombé à l'hiver nucléaire qui a suivi, y compris la civilisation post-atomique à l'origine de cette confrontation apocalyptique."
 anomaly.675.desc_02: "L'exploration de [From.GetName] a confirmé que cette [From.GetPlanetMoon] était autrefois un paradis tropical florissant avant d'être décimée par une guerre thermonucléaire totale il y a des siècles. La plupart des formes de vie, y compris la civilisation post-atomique à l'origine cette confrontation apocalyptique, n'ont pas survécu dans le désert irradié qui a suivi."
 anomaly.680.name: "Salve de rayons gamma"
 anomaly.680.desc: "Il y a 24 000 ans, [From.GetName] a eu la malchance de se trouver sur la trajectoire d'une salve de rayons gamma émanant d'une étoile filante de notre galaxie. La [From.GetPlanetMoon] a été dévastée par une radiation mortelle qui, en plus d'avoir eu raison de toute forme de vie du côté de [From.GetName] exposé à cette salve, a perdu une part importante de sa couche d'ozone.\n\nCet événement a éradiqué environ 86 % de tout le biote, y compris une civilisation du début de l'Âge du bronze dont les ruines sont encore visibles à certains endroits de l'hémisphère nord. La biosphère montre quelques signes de récupération."
 anomaly.685.name: "Terrible effet de serre"
 anomaly.685.desc: "Il apparaît évident que le climat actuel de [From.GetName] est à l'origine du puissant effet de serre déclenché par une pollution galopante. Les océans se sont évaporés et la [From.GetPlanetMoon] est prise au piège d'une épaisse couche nuageuse provoquée par la dense atmosphère.\n\nLes ruines éparpillées d'une civilisation indigène sont toujours visibles à la surface, ce qui laisse à penser qu'une culture surpeuplée y a péri à la fin de l'Âge industriel."
 anomaly.690.name: "Biosphère d'ammoniac"
 anomaly.690.desc: "Bien que toxique pour la plupart des formes de vie connues, [From.GetName] présente une écologie florissante malgré la haute pression de son atmosphère. Ici, la vie utilise l'ammoniac plutôt que l'eau en guise de solvant et s'est développée de manière radicalement différente par rapport aux modèles écologiques précédemment établis. Son exploration nous permettrait d'enrichir considérablement nos connaissances en xénobiologie."
 anomaly.695.name: "Formes de vie siliconées"
 anomaly.695.desc: "Plusieurs formes de vie siliconées fouisseuses ont élu domicile dans un vaste réseau de tunnels sous la surface aride de [From.GetName]. En l'état actuel de nos observations, ces créatures se nourrissent des rochers et semblent dotées d'une forme d'intelligence rudimentaire. Les efforts qu'elles déploient pour creuser ces tunnels ont fait remonter d'importantes quantités de précieux minéraux à la surface."
 anomaly.700.name: "Mineurs pétroliers"
 anomaly.700.desc: "Des explorateurs venus de [Root.Owner.Capital.GetName] ont lancé une opération minière non autorisée sur [From.GetName]. Ils ont été placés en garde à vue et nous avons pris le contrôle de leur station illégale."
 anomaly.705.name: "Ancien marqueur d'exploration"
 anomaly.705.desc: "Un petit émetteur de courte portée a été repéré à la surface de §Y[From.GetName]§!. Il s'agit d'un ancien marqueur d'exploration, placé ici il y a des lustres pour repérer un important gisement de métaux précieux. Les mineurs auxquels il était destiné ne sont visiblement jamais arrivés, puisque le gisement est toujours en place."
 anomaly.710.name: "Colonie dissidente"
 anomaly.710.desc: "À sa grande surprise, l'équipage du [Root.GetName] est tombé sur une petite colonie de [Root.Owner.GetSpeciesName] à la surface de [From.GetName]. La colonie a été fondée par de courageux pionniers qui ont quitté [Root.Owner.Capital.GetName] il y a fort longtemps à bord d'un vaisseau spatial primitif. Jusqu'à ce jour, leur vaisseau était supposé perdu.\n\nLa colonie ne s'est pas développée comme prévu et ses rangs se sont progressivement clairsemés au fil des générations passées. Les survivants ont demandé à rejoindre [Root.Owner.GetName]."
 anomaly.710.a: "Ils sont les bienvenus !"
 anomaly.710.b: "Qu'ils se débrouillent seuls."
 anomaly.715.name: "Ruines d'une colonie"
 anomaly.715.desc: "Il y a quelque 17 000 ans, une civilisation alien a fondé une petite colonie sur [From.GetName], avant d'être rapidement abandonnée. Il ne reste aucune trace des colons et la colonie ne semble pas s'être étendue au-delà de son campement principal, à l'exception de quelques stations météorologiques."
 anomaly.2500.name: "Restes inanimés"
 anomaly.2500.desc: "Les restes inanimés de quelques imposantes formes de vie spatiales ont été découverts autour de la géante gazeuse [From.GetName]. Ces créatures dénuées de raison semblent avoir réussi à voyager dans le cosmos, mais n'ont jamais été observées dans l'espace exploré. L'officier scientifique [Root.GetLeaderName] nous a suggéré de consacrer des ressources supplémentaires pour effectuer des analyses plus approfondies."
 anomaly.2501.desc: "L'officier scientifique [Root.GetLeaderName] en a déduit que [From.From.GetName] avait servi de cimetière orbital où des membres de l'espèce alien que nous avons découverte étaient venus mourir. Au fil de millions d'années, la gravité a fait son oeuvre et progressivement aspiré leurs restes dans la géante gazeuse.\n\nCe cycle ancien semble avoir brusquement pris fin il y a 15 millions d'années avec l'arrivée de la dernière créature. Nous ne savons pas exactement s'ils ont été chassés jusqu'à extinction par les civilisations de voyageurs spatiaux ou s'ils ont succombé à une catastrophe."
 anomaly.2510.name: "Un océan sous la glace"
 anomaly.2510.desc: "Les scans menés en profondeur de §Y[From.GetName]§! ont révélé la présence d'un vaste océan, réchauffé par des cheminées hydrothermiques se trouvant sous le manteau de glace qui recouvre sa surface. Notre [Root.Owner.GetScientist] [Root.GetLeaderName] a envoyé depuis le [Root.GetName] des sondes qui ont foré la calotte sur des kilomètres, avant de trouver l'eau en dessous, grouillante de ce qui semble être la vie. Nous allons avoir besoin de davantage de ressources pour étudier de manière plus approfondie les nombreuses formes de vie uniques qui peuplent cet océan."
 anomaly.2512.desc: "Notre [Root.Owner.GetScientist] [Root.GetLeaderName] vient de rentrer de l'expédition qui avait pour objet d'étudier la riche biosphère océanique cachée sous le manteau de glace de §Y[From.From.GetName]§!. [Root.Leader.GetSheHeCap] a découvert que de nombreuses espèces peuplant ces basses régions produisent une molécule unique, inorganique, dotée de prodigieuses propriétés curatives. Si nous pouvions en collecter suffisamment, cette molécule pourrait révolutionner le domaine des sciences médicales et même avoir des applications industrielles !"
 anomaly.2512.desc.mach: "Notre [Root.Owner.GetScientist] [Root.GetLeaderName] vient de rentrer de l'expédition qui avait pour objet d'étudier la biosphère sous le manteau de glace de §Y[From.From.GetName]§!. Plusieurs espèces indigènes à ces basses régions de l'océan mondial ont été découvertes, qui produisent une molécule unique, inorganique, dotée de prodigieuses propriétés curatives.\n\nSi nous pouvions en collecter suffisamment, cette molécule pourrait révolutionner le domaine des soins médicaux apportés à nos chers biotrophées, et même avoir des applications industrielles !"
 anomaly.2513.desc: "Notre [Root.Owner.GetScientist] [Root.GetLeaderName] vient de rentrer de l'expédition qui avait pour objet d'étudier la riche biosphère océanique cachée sous le manteau de glace de [From.From.GetName]. Les sondes sous-marines ont cartographié le terrain et répertorié la plupart des formes de vie. Toutefois, si ces données pourront être utiles aux xénobiologistes, aucune découverte majeure n'a été faite qui aurait pu déboucher sur des applications concrètes."
 anomaly.2520.name: "Squelette géant"
 anomaly.2520.desc: "Dans l'hémisphère sud de [From.GetName], ce que nous prenions précédemment pour des montagnes est en fait l'immense squelette d'une gigantesque forme de vie alien.\n\nLes ossements remontent à 3.4 milliards d'années, mais d'après nos [Owner.GetScientistPlural], il est impossible que [From.GetName] ait pu abriter une telle forme de vie à un moment de l'histoire de la [From.GetPlanetMoon]. Notre [Owner.GetScientist] [Root.GetLeaderName] a préparé un projet de recherche spécial afin de tenter d'élucider ce mystère."
 anomaly.2520.a.term: "Nous pourrions découvrir une nouvelle méthode d'extermination !"
 anomaly.2520.a.rean: "Y a-t-il moyen de réanimer cette créature ?"
 anomaly.2521.desc: "Après les intenses recherches menées sur les restes du squelette géant découvert sur [From.From.GetName], l'officier scientifique [Root.GetLeaderName] en a conclu que la créature était en fait une sorte de vaisseau spatial organique. De petits ossements provenant d'au moins trois espèces distinctes ont été trouvés à proximité du squelette géant et nous pensons qu'ils proviennent des membres d'équipage.\n\nPour des raisons que nous ignorons, ce vaisseau spatial organique a été victime d'une terrible avarie et s'est écrasé sur [From.From.GetName]. Si l'ingénierie biologique nécessaire à la « création » d'un tel vaisseau spatial continue de nous échapper, l'étude de ces ossements nous a permis d'enrichir nos connaissances."
 anomaly.2521.desc.bio: "Après les intenses recherches menées sur les restes du squelette géant découvert sur [From.From.GetName], l'officier scientifique [Root.GetLeaderName] a confirmé ce qui semblait impossible : il s'agissait autrefois d'un vaisseau vivant, qui ne ressemble guère à nos vaisseaux biologiques.\n\nSa structure est curieuse, à la fois familière et étrangère, comme façonnée par une philosophie évolutionnaire radicalement différente. Dans son énorme cage thoracique, nous avons trouvé de petits os appartenant à au moins trois espèces, preuve que le vaisseau avait un équipage à son bord. Cette découverte est quelque peu troublante, étant donné que nos vaisseaux sont symbiotiques et ne peuvent être habités.\n\nLa cause de sa mort est inconnue, mais les dégâts sont considérables : son immense corps a volé en éclats en s'écrasant sur la planète. L'équipage a-t-il péri dans la catastrophe ou s'agissait-il d'une sorte d'intelligence de pilotage, indissociable du vaisseau ?\n\nNous ne saurons peut-être jamais d'où il vient, mais l'examen de ses restes nous a permis de mieux comprendre ce que signifie être un vaisseau vivant. Une question préoccupante demeure cependant : a-t-il été créé... ou est-il né ?"
 anomaly.2521.b.evopred: "Devons-nous commencer par manger les pilotes ou le vaisseau ?"
 anomaly.2522.desc: "Après les intenses recherches menées sur les restes du squelette géant découvert sur [From.From.GetName], nous en savons un peu plus sur la raison pour laquelle cette créature a fini sa course sur cette [From.From.GetPlanetMoon]. Plusieurs relevés d'énergie résiduelle indiquent qu'un portail dimensionnel est brièvement apparu derrière le squelette.\n\nL'officier scientifique [Root.GetLeaderName] estime que la créature venue d'une autre dimension a utilisé ce portail, mais qu'elle n'a pas survécu à l'environnement hostile de [From.From.GetName]. Cela étant, il est possible que nous ne sachions jamais d'où elle venait et pourquoi elle s'est aventurée ici."
 anomaly.2522.b.evopred: "Un ADN reste un ADN, quelle que soit son origine !"
 anomaly.2523.desc: "Le squelette géant bouge à nouveau ! Dressé haut pour tenter un premier vol quelque peu tremblant, puis un second plus assuré, le mastodonte domine nos nécromanciens. La créature n'a sans doute pas le même nombre de pattes ni la bonne quantité d'appendices qu'au temps où elle était vivante, mais avec le recours à des muscles de synthèses et des pièces hydrauliques à la pointe de la technologie ce géant est prêt à nous aider sur les champs de bataille. Et, sous les pieds, le sol de la [From.From.GetPlanetMoon] tremble."
 anomaly.2523.tooltip: "Ajoute §G1§! armée §YSquelette géant§! en orbite."
 anomaly.2530.name: "Signes de bataille"
 anomaly.2530.desc: "Tout semble indiquer qu'une bataille spatiale de grande ampleur a eu lieu à proximité de [From.GetName] lors des 5 000 ans passés. Des explosions ont criblé une partie de la [From.GetPlanetMoon] de cratères et les analyses menées par le [Root.GetName] ont permis de détecter plusieurs carcasses sur le sol.\n\nCertes ces vaisseaux sont en bien mauvais état, mais le fait qu'ils aient survécu aux terribles dégâts qu'ils ont dû subir attestent de leur conception avancée. L'officier scientifique [Root.GetLeaderName] prépare une expédition afin de récupérer de précieuses informations sur ces vieilles carcasses."
 anomaly.2530.desc.bio: "Tout semble indiquer qu'une bataille spatiale de grande ampleur entre vaisseaux vivants a eu lieu au-dessus de [From.GetName] lors des 5 000 ans passés. La [From.GetPlanetMoon] est criblée de profondes cicatrices : d'énormes cratères formés par la chute des vaisseaux mourants, dont les coques fissurées se sont désintégrées tels des fruits trop mûrs à l'impact. Aujourd'hui encore, on trouve en de nombreux endroits des sédiments organiques desséchés et des cartilages fossilisés.\n\nLes restes de ces créatures autrefois majestueuses sont à peine identifiables ; le temps a déformé et fossilisé leur structure biologique. Toutefois, le fait qu'ils aient survécu à des milliers d'années de décomposition et d'exposition aux éléments témoigne de leur remarquable résilience. L'officier scientifique [Root.GetLeaderName] prépare une expédition pour étudier ces léviathans fossilisés. Nous espérons trouver des restes de leur architecture génétique ou de leurs symbiotes biotechnologiques, où la vie palpite peut-être encore."
 anomaly.2531.desc: "L'équipe de l'officier scientifique [Root.GetLeaderName] a terminé sa mission sur [From.From.GetName] et rejoint le [Root.GetName]. Et, bonne nouvelle : le cimetière de vaisseaux spatiaux abritait de véritables trésors technologiques.\n\nL'examen des vestiges retrouvés a déjà permis de gagner plusieurs années de recherche dans certains domaines, et ce n'est pas terminé. L'installation en orbite d'un avant-poste scientifique permanent faciliterait considérablement nos recherches en matière de vaisseaux spatiaux."
 anomaly.2532.desc: "L'équipe de l'officier scientifique [Root.GetLeaderName] a terminé sa mission sur [From.From.GetName] et rejoint le [Root.GetName]. Hélas, les vaisseaux spatiaux découverts sur place étaient trop endommagés pour que leurs technologies soient récupérables.\n\nMais compte tenu de leur niveau de sophistication, l'analyse de leur conception pourrait nous permettre de recueillir de précieuses informations. Nous devrions envisager la construction d'un avant-poste scientifique permanent en orbite."
 anomaly.2532.desc.bio: "L'équipe de l'officier scientifique [Root.GetLeaderName] a terminé son éprouvante mission sur [From.From.GetName] et rejoint le [Root.GetName]. Hélas, le temps a eu raison des restes des vieux vaisseaux organiques. Leurs structures autrefois vivantes sont depuis longtemps fossilisées ou calcifiées, ne laissant que peu de choses de valeur à récupérer.\n\nToutefois, même morts, ils se révèlent être une merveille de technologie qui dépasse notre entendement. Le maillage complexe de leur squelette issu de la bio-ingénierie, les vestiges de leur musculature autrefois réactive et les traces d'architecture neurale suggèrent un niveau de développement technologique bien supérieur au nôtre. Placer une équipe de chercheurs en orbite de façon permanente nous permettrait de percer les secrets de ces géants depuis longtemps disparus."
 anomaly.2540.name: "Inscription alien"
 anomaly.2540.desc: "Alors qu'[Root.Leader.GetSheHe] scannait la surface de [From.GetName], [Root.GetLeaderName], qui commande le [Root.GetName], a découvert ce qui ressemble à un bloc de pierre partiellement sculpté et couvert d'une inscription alien. Aucun autre signe d'activité alien n'a été détecté sur la [From.GetPlanetMoon], et la manière dont cette inscription est arrivée ici demeure un mystère. La décision a donc été prise de préparer un projet spécial pour la traduire."
 anomaly.2541.desc: "Notre [Owner.GetScientist] [Root.GetLeaderName] a réussi à traduire partiellement l'inscription découverte sur [From.From.GetName]. Il s'agit d'un monument élevé à la mémoire d'une espèce alien aujourd'hui disparue qui dirigeait jadis un petit empire interstellaire dans cette région de la galaxie. Ces aliens semblent avoir été exterminés par les auteurs de l'inscription, ce que ces derniers semblent avoir regretté.\n\nCette inscription remontant à plus de 300 millions d'années, il y a fort à parier que ses auteurs ont eux aussi disparu. Peut-être le fait le plus intéressant, malgré tout, est le support sur lequel le mémorial a été gravé : en dépit de son antiquité, il est resté en excellent état."
 anomaly.2542.desc: "Notre [Owner.GetScientist] [Root.GetLeaderName] a réussi à traduire partiellement l'inscription découverte sur [From.From.GetName]. Elle recèle une quantité proprement ahurissante de données, et était apparemment une sorte de bibliothèque rudimentaire. Y sont décrits dans les grandes lignes les connaissances technologiques accumulées par une civilisation alien qui dominait cette région de la galaxie il y a quelque 80 millions d'années.\n\nNous connaissons déjà nombre d'entre elles, mais ces données offrent aussi des pistes intéressantes sur des technologies que nous devrions étudier. Il y a de quoi occuper nos scientifiques durant des décennies, mais la poursuite des efforts de traduction va requérir l'installation d'une station de recherche en orbite de la [From.From.GetPlanetMoon]."
 anomaly.2550.name: "Chantier spatial automatisé"
 anomaly.2550.desc: "Alors qu'il reconnaissait [From.GetName], le [Root.GetName] a repéré les vestiges d'un ancien chantier spatial automatisé en orbite. Il date d'au moins un millier d'années et semble avoir été la cible de missiles. L'une de ses baies de production est toujours en état de fonctionnement, toutefois.\n\nL'officier scientifique [Root.GetLeaderName] espère pouvoir remettre le chantier en marche, ce qui constitue un projet d'envergure."
 anomaly.2550.desc.bio: "Alors qu'il reconnaissait [From.GetName], le [Root.GetName] a fait une découverte étonnante : il est tombé sur les restes d'un ancien incubateur spatial, une énorme structure organique autrefois capable de donner naissance à des vaisseaux. L'épave dérive silencieusement, les membranes extérieures déchirées et atrophiées, probablement à la suite d'un violent bombardement survenu il y a des siècles. La majeure partie de son système vasculaire s'est fossilisée, son réseau neural ne réagit plus... et pourtant, l'une des chambres de gestation palpite encore faiblement.\n\nL'officier scientifique [Root.GetLeaderName] pense que nous pourrions ranimer l'entité dormante, au moins partiellement, par le biais d'une intervention ciblée. Il s'agit toutefois d'une tâche longue et délicate qui pourrait entraîner des réactions biologiques imprévues."
 anomaly.2551.desc: "La [Root.GetFleetName] a rétabli l'alimentation du chantier spatial automatisé qui se trouve en orbite de [From.From.From.GetName]. L'installation s'est aussitôt remise en service pour achever la construction de trois vaisseaux de combat perfectionnés, de conception inconnue, à l'aide des matériaux qui se trouvaient encore à sa disposition.\n\nHélas, elle est ensuite tombée en panne, sans qu'il soit possible de la réparer. Nous avons assigné des équipages à ces nouveaux vaisseaux et ils ont intégré notre flotte."
 anomaly.2551.desc.bio: "La [Root.GetFleetName] a réveillé l'incubateur inactif qui se trouve en orbite de [From.From.From.GetName]. La vieille structure organique et ses ateliers biologiques dormants sont revenus à la vie, achevant en toute hâte le cycle de croissance de trois unités de combat d'une conception inconnue mais incroyablement complexe.\n\nLa charge de cette naissance inattendue semble toutefois avoir été trop lourde pour l'organisme. Son système vasculaire a cessé de fonctionner, son noyau neural s'est atrophié, puis l'être s'est transformé en biomasse inerte. Les nouveaux vaisseaux, bien que désorientés au début, se sont rapidement habitués à notre présence. Ils ont été intégrés à notre flotte et sont prêts à servir leurs nouveaux maîtres symbiotiques."
 anomaly.2552.desc: "La [Root.GetFleetName] a rétabli l'alimentation du chantier spatial automatisé qui se trouve en orbite de [From.From.From.GetName]. L'installation s'est aussitôt remise en service pour achever la construction d'une frégate perfectionnée, d'une conception inconnue, à l'aide des matériaux qui se trouvaient encore à sa disposition.\n\nHélas, elle est ensuite tombée en panne, sans qu'il soit possible de la réparer. Nous avons assigné un équipage à ce nouveau vaisseau et celui-ci a rejoint notre flotte."
 anomaly.2560.name: "Vaisseau de la géante gazeuse"
 anomaly.2560.desc: "Des balayages plus poussés de [From.GetName] ont permis de détecter ce qui ressemble à un vaisseau imposant, au coeur de l'atmosphère de la géante gazeuse. Les débris alentour laissent à penser que des opérations y ont déjà été menées pour tenter de récupérer le vaisseau en perdition. De fait, un vaisseau pouvant endurer une telle gravité serait une capture de choix, aussi l'officier scientifique [Root.GetLeaderName] a-t-il proposé que nous montions à notre tour un projet de récupération."
 anomaly.2560.a: "Récupérons-le, peu importe de quoi il s'agit"
 anomaly.2560.b: "Cela exigerait trop d'efforts, laissons-le là"
 anomaly.2561.desc: "Démontrant tout son savoir-faire dans le domaine de l'ingénierie, l'équipe de l'officier scientifique [Root.GetLeaderName] est parvenue à faire remonter le vaisseau abandonné jusqu'à la haute atmosphère de [From.From.GetName]. En dépit de son âge, cet ancien croiseur est en remarquable état et nous avons rétabli l'alimentation de ses systèmes. Nous n'avons trouvé aucune trace de son ancien équipage, mais nous avons fait venir le nôtre et le vaisseau a été intégré à la flotte."
 anomaly.2562.desc: "La tentative menée par l'officier scientifique [Root.GetLeaderName] pour récupérer ce vaisseau abandonné dans l'atmosphère de [From.From.GetName] s'est soldée par un échec. La forte gravité de la géante gazeuse a eu raison des moteurs d'un des remorqueurs, qui est entré en collision avec le vaisseau abandonné. Plusieurs victimes sont à déplorer et l'ancien vaisseau s'est enfoncé un peu plus dans l'atmosphère - au point de n'être plus récupérable."
 anomaly.2570.name: "Orbite terminale"
 anomaly.2570.desc: "Une des nombreuses lunes qui gravitent autour de [From.GetName] présente une orbite terminale. Elle ne va pas tarder à entrer en collision avec la géante gazeuse, ce qui promet un terrible impact. Il aura fallu attendre des milliards d'années que cela se produise, et il est étonnant de constater que cela va survenir juste après le passage d'un de nos vaisseaux.\n\nBon nombre de nos scientifiques souhaitent pouvoir observer et enregistrer ce qui va arriver, mais le temps presse et il nous faut agir vite."
 anomaly.2571.desc: "Nous avons réussi à enregistrer la collision entre [CollisionLocation.GetName] et sa lune ! L'événement a été capturé depuis différents angles et retransmis en direct dans tout notre espace. Plus important encore, nos scientifiques, sous l'égide de [Root.GetLeaderName], ont réussi à enregistrer de nombreuses données physiques dont la recherche saura à coup sûr faire bon usage."
 anomaly.2572.desc: "Nous n'avons pas réussi à enregistrer la collision entre la lune et [From.From.GetName]. Nos scientifiques ont identifié une autre petite lune dont l'orbite décline. Ils estiment qu'elle entrera en collision avec la géante gazeuse dans un peu plus de 7,6 millions d'années. Peut-être aurons-nous plus de chance alors..."
 anomaly.5000.name: "Signal de la géante gazeuse"
 anomaly.5000.desc: "Le [Root.GetName] a capté de curieux signaux en provenance de [From.GetName]. L'atmosphère de la géante gazeuse présente d'importantes poches de radiation qui semblent être le résultat d'un terrible bombardement orbital. Mais l'intérêt de bombarder une géante gazeuse demeure un mystère.\n\nAlors que [Root.GetName] se préparait à quitter son orbite, l'officier scientifique [Root.GetLeaderName] a découvert un faible signal émanant de l'intérieur de la planète. Il pourrait s'agir d'une transmission, mais la radiation ambiante de la géante gazeuse ne permet pas de bien l'isoler."
 anomaly.5000.a: "Nous devrions nous pencher sur ce signal."
 anomaly.5000.b: "Un capteur défaillant. Ignorez ce signal."
 anomaly.5001.desc: "L'officier scientifique [Root.GetLeaderName] a réussi à isoler le faible signal provenant du coeur de l'atmosphère de [From.From.From.GetName]. Cela s'est bien avéré être une transmission, aussi [Root.GetLeaderName] l'a-t-il analysée avec notre logiciel de traduction."
 anomaly.5002.desc: "Le faible signal que nous avons capté à l'intérieur de la géante gazeuse [From.From.From.GetName] s'est tu. Nous n'en saurons pas plus."
 anomaly.5003.name: "Transmission de la géante gazeuse"
 anomaly.5003.desc: "Enfin ! Salutations, voyageurs de l'espace ! Nous sommes les Dathnak. Cette planète autour de laquelle vous orbitez est notre monde ancestral, Tollok Rong. Rencontrer des solides est toujours fascinant - même si notre dernière rencontre avec vos semblables a été un peu... difficile.\n\nSans doute avez-vous détecté les radiations provenant de notre atmosphère ? Tollok Rong se meurt, et notre espèce aussi si nous ne trouvons pas un nouveau foyer. Nous avons bien identifié une planète adaptée à notre physiologie, mais n'avons aucun moyen de nous y rendre - d'autant que notre nature non corporelle nous limite en termes industriels et technologiques. Accepteriez-vous de nous aider ?"
 anomaly.5003.a: "Sans technologie, comment pouvez-vous parler ?"
 anomaly.5003.a.response: "Ah, mais vous n'êtes pas les premiers solides à nous visiter ! Il y a 2,9 millions de cycles solaires, un autre voyageur interstellaire nous a généreusement offert un petit émetteur subspatial et un scanner, tous deux compatibles avec notre physiologie.\n\nCela a été l'une de nos plus belles rencontres avec vos semblables."
 anomaly.5003.b: "Qu'arrive-t-il à votre planète ?"
 anomaly.5003.b.response: "Eh bien, la dernière fois que des solides nous ont visités, il y a quelques milliers de cycles de cela, les choses ont mal tourné. Ils voulaient que nous adoptions leur religion, mais nous avons refusé et en représailles ils ont décidé de nous exterminer. Sans aucune autre forme de procès !\n\nAvant même que nous ayons le temps de comprendre ce qu'il se passait, leur flotte est arrivée en orbite et nous a lourdement bombardés."
 anomaly.5003.c: "Vous voulez qu'on transporte toute votre espèce sur une autre planète ?"
 anomaly.5003.c.response: "Oui, aussi vite que possible ! Mais ne vous inquiétez pas, nous ne sommes pas très nombreux. La plupart des Dathnak sont morts lors du bombardement de notre planète, et les survivants se sont retirés profondément dans l'atmosphère. La communication avec la surface est difficile d'ici, et les radiations se propagent. Il nous reste peu de temps !"
 anomaly.5003.d: "Nous vous aiderons à vous installer ailleurs"
 anomaly.5003.d.response: "Parfait ! Je savais que nous pouvions compter sur vous. Nous vous avons transmis les coordonnées de notre nouveau foyer.\n\nVous devez toutefois nous promettre de ne pas laisser vos colons revendiquer ce monde, même si la tentation est grande !"
 anomaly.5003.e: "Pardon, mais c'est trop demander"
 anomaly.5003.e.response: "Je le savais ! J'avais prévenu les autres que les solides sont incapables de la moindre compassion, mais ils ont insisté pour que je m'abaisse à vous présenter cette requête.\n\nJe sais ce que vous êtes : rien d'autre qu'un fléau pour cette galaxie ! Elle finira par revenir aux nôtres. Et alors, nous réglerons nos comptes. Souvenez-vous bien de ce que je dis : l'ère des solides prendra fin ! L'heure des formes de vie gazeuses viendra !"
 anomaly.5004.desc: "L'officier scientifique [Root.GetLeaderName] a terminé de superviser l'évacuation des Dathnak vers leur nouvelle planète. Un convoi de cargos civils équipés de gigantesques cuves à gaz pressurisé a permis de transporter les êtres gazeux à travers l'espace pour les relâcher dans l'atmosphère de la géante gazeuse. Leur émetteur et leur scanner ont, par la même occasion, été transportés avec eux."
 anomaly.5004.a: "Saluez-les pour nous"
 anomaly.5005.desc: "Les conditions de vie sur Tollok Rong se sont dégradées au point que les Dathnak ne peuvent plus être sauvés. Les radiations ont gagné la quasi-totalité de l'atmosphère, et les Dathnak survivants se sont retranchés au plus près du coeur de la planète, là où les communications avec la surface ne sont plus possibles. Les radiations finiront par s'y propager, provoquant alors la disparition de leur espèce."
 anomaly.5006.desc: "Nous serons éternellement vos obligés ! Cette planète dépasse toutes nos attentes. Pour la première fois depuis des générations, nos jeunes peuvent gambader sans risque dans la haute atmosphère sans commencer à brûler.\n\nNous avons décidé d'appeler notre nouveau monde Baldarak, en l'honneur de votre espèce. Ainsi, les générations futures des Dathnak n'oublieront jamais le nom de leurs sauveurs !"
 anomaly.5006.a: "Baldarak ? Mais... Nous sommes les [Root.GetSpeciesNamePlural] !"
 anomaly.5006.a.response: "Vraiment ? J'aurais pourtant juré... Pardon, mais il n'est pas toujours facile de vous différencier entre solides. Je crains qu'il soit trop tard pour changer de nom maintenant. Il sonne bien, vous ne trouvez pas ?"
 anomaly.5006.a.2: "Baldarak ? C'est un nom magnifique !"
 anomaly.5006.a.2.response: "Oui, ça sonne bien, n'est-ce pas ? Nous sommes très chanceux d'avoir été secourus par des solides aussi phonétiquement plaisants que vous."
 anomaly.5006.b: "Bonne chance sur votre nouvelle planète"
 anomaly.5006.b.response: "Encore merci, chers amis ! Puissent les courants vous garder toujours dans la haute atmosphère !"
 anomaly.5007.name: "Une nouvelle colonie"
 anomaly.5007.desc: "Bonjour à nouveau ! J'ai le plaisir de vous annoncer que notre espèce a quadruplé depuis notre arrivée ! Nombre d'entre nous se sentent d'humeur « festive » depuis que nous nous sommes installés sur notre nouvelle planète, ce qui commence à susciter quelques problèmes.\n\nAprès l'expérience positive qu'a été la colonisation de Baldarak, quelques courageux pionniers m'ont demandé de requérir auprès de vous le passage vers une nouvelle géante gazeuse. Nous avons déjà repéré un monde particulièrement prometteur au sein de votre espace, qui conviendrait parfaitement à la colonisation. Qu'en dites-vous, mes amis ?"
 anomaly.5007.a: "Bon, tant que cela reste une géante gazeuse..."
 anomaly.5007.a.response: "Merveilleux ! Nous vous transmettons les coordonnées. Nos colons sont impatients de s'y rendre !"
 anomaly.5007.b: "Hors de question. Nous avions convenu d'UNE planète"
 anomaly.5007.b.response: "Je vois... Dans ce cas, nous devrons nous contenter de rester confinés sur Baldarak."
 anomaly.5008.desc: "Comme cela avait été le cas la fois dernière, un convoi de cargos a été mis sur pied pour transporter en toute sécurité, dans des cuves à gaz pressurisées, les colons dathnak. Au terme d'un court trajet, ils ont réussi à rejoindre la géante gazeuse qu'ils ont appelée « Nouvelle-Baldarak ». Un satellite a été placé en orbite pour permettre la communication longue portée avec Baldarak."
 anomaly.5008.a: "Profitez-en au mieux, Dathnak"
 anomaly.5009.name: "Chabky Raddh"
 anomaly.5009.desc: "Salutations de la Nouvelle-Baldarak ! Tout se passe bien sur notre nouvelle colonie. Mais, nous avons un petit service à vous demander...\n\nChabky Raddh, une des nôtres, se sent bien seule et aimerait retourner sur Baldarak pour y retrouver les siens. Ses incessantes lamentations nous rendent fous ! Si ce n'est pas trop vous demander, pourriez-vous l'y ramener ?"
 anomaly.5009.a: "Quoi ?! C'est hors de question !"
 anomaly.5009.a.response: "On devait essayer... J'espère que vous comprenez. Chabky va devoir prendre sur elle et faire contre mauvaise fortune bon coeur ! Désolé de vous avoir fait perdre votre temps, chers amis [Root.GetSpeciesNamePlural]."
 anomaly.5009.b: "Soupir... Très bien."
 anomaly.5009.b.response: "Excellent. J'espère que vos ressources ne s'en trouveront pas trop affectées, car vous ne transporterez qu'un seul individu. De notre côté, nous ferons ce qu'il faut.\n\nJe viens d'en informer Chabky qui est folle de joie ! En fait, elle est devenue incontrôlable... Et je vous prie de m'excuser, chers amis [Root.GetSpeciesName]..."
 anomaly.5010.desc: "Un seul remorqueur cargo transportant une bonbonne de gaz est arrivé à Baldarak, escorté par le [Root.GetName]. Le contenu de cette bonbonne a été libéré dans l'atmosphère de la géante gazeuse pour permettre à la Dathnak de rentrer en toute sécurité chez elle."
 anomaly.5010.a: "Bon débarras !"
 anomaly.5011.name: "Contact perdu"
 anomaly.5011.desc: "Nous sommes porteurs d'une nouvelle des plus alarmantes, chers amis [Root.Owner.GetSpeciesName] !\n\nNous avons perdu tout contact avec notre colonie de Nouvelle-Baldarak ! Elle ne répond plus à nos transmissions par satellite et nous craignons le pire. Peut-être a-t-elle été la cible des aliens qui ont bombardé notre monde d'origine. Je vous en prie, envoyez un vaisseau pour en savoir plus !"
 anomaly.5011.a: "Nous allons immédiatement y dépêcher un vaisseau."
 anomaly.5011.a.response: "Parfait ! Espérons qu'il s'agisse juste d'un émetteur défectueux."
 anomaly.5011.b: "Ça suffit ! Nous ne sommes pas à votre service."
 anomaly.5011.b.response: "Mais... Mais peut-être ont-ils tous péri ! N'avez-vous donc pas de coeur ? Nous nous sommes trompés sur vous, [Root.GetSpeciesNamePlural] !"
 anomaly.5012.desc: "L'investigation menée sur la Nouvelle-Baldarak n'a rien révélé d'anormal. Le satellite utilisé par la colonie pour communiquer avec sa capitale semble parfaitement fonctionner."
 anomaly.5012.a: "Ouvrez un canal vers la planète."
 anomaly.5013.name: "Front révolutionnaire"
 anomaly.5013.desc: "Le Front révolutionnaire de la Nouvelle-Baldarak vous salue !\n\nNous nous sommes libérés du joug de l'oppression et de la tyrannie de Baldarak ! Nous ne vous ferons aucun mal, [Root.Owner.GetSpeciesName], du moins tant que vous n'aiderez pas les impérialistes de Baldarak à tenter d'écraser notre révolution.\n\nCela dit, vous pourriez nous aider à combattre nos ennemis... Accepteriez-vous de transporter une de nos unités commandos sur Baldarak ?"
 anomaly.5013.a: "Quelles sont vos intentions ?"
 anomaly.5013.a.response: "Nous voulons introduire une de nos unités commandos d'élite sur Baldarak. Une fois sur place, elle incitera la population à se soulever contre l'élite décadente qui nous contrôle. Une fois les tyrans destitués, tous les Dathnaks sauront ce qu'est réellement la liberté. Voilà un plan simple, s'il en est, [Root.Owner.GetSpeciesName]."
 anomaly.5013.b: "Nous transporterons vos soldats à destination."
 anomaly.5013.b.response: "Vraiment ?! Vous le ferez ? Vous êtes les amis de la révolution, [Root.Owner.GetSpeciesName] ! Je vais rassembler l'équipe !"
 anomaly.5013.c: "Nous ne nous immiscerons pas dans vos querelles internes."
 anomaly.5013.c.response: "Bien sûr que non ! Nous ne voulons pas que la révolution se propage aux masses opprimées de VOTRE empire tyrannique. Hors de question !"
 anomaly.5014.name: "Réponse de Baldarak"
 anomaly.5014.desc: "Je m'adresse à vous au nom du gouvernement dathnak de Baldarak.\n\nNous avons reçu un manifeste rempli d'inepties de la part du groupe qui a pris le contrôle de Nouvelle-Baldarak. Nous en avons plus qu'assez de ces brigands et de ces anarchistes, [Root.Owner.GetSpeciesNamePlural]. Accepteriez-vous de nous aider à mater leur petite « révolution » avant qu'elle gagne du terrain et fasse des victimes ?\n\nLe général Paltanak a rassemblé un corps expéditionnaire chargé de reprendre le contrôle de la colonie, et nous avons besoin de votre aide pour l'y transporter."
 anomaly.5014.a: "Nous vous aiderons."
 anomaly.5014.a.response: "Nous savions que nous pouvions compter sur vous, [Root.Owner.GetSpeciesName] ! Ces rebelles vont le sentir passer !"
 anomaly.5014.b: "Vous devez régler vos problèmes par vous-mêmes."
 anomaly.5014.b.response: "Vous regretterez cette décision quand la rébellion gagnera vos planètes, [Root.Owner.GetSpeciesName] ! Car elle le fera !"
 anomaly.5015.desc: "Un remorqueur cargo escorté par le [Root.GetName] a discrètement déposé la capsule abritant le l'unité commando révolutionnaire dans l'atmosphère de Baldarak. Quelques instants plus tard, des éclairs ont fusé dans la couche nuageuse de la géante gazeuse. Serait-ce le signe que des combats s'y déroulent ?"
 anomaly.5015.a: "Nous allons voir."
 anomaly.5016.name: "Conseil révolutionnaire"
 anomaly.5016.desc: "Ici Fotanga ! Le peuple de Baldarak a renversé les tyrans et les oppresseurs qui voulaient nous assujettir. Un conseil révolutionnaire a été mis en place pour aider notre grande nation à franchir cette phase de transition durant laquelle nous oeuvrons pour aider notre peuple à recouvrer sa liberté.\n\nNous voulons remercier nos camarades du [Root.GetName] d'avoir contribué à ce que ce jour arrive.\n\nTerminé."
 anomaly.5016.a: "Tout évoluera peut-être pour le mieux."
 anomaly.5017.name: "Annonce publique de Baldarak"
 anomaly.5017.desc: "Ici Fotanga ! En mon honneur, le Conseil révolutionnaire populaire a unanimement choisi de donner à Baldarak le nom de §HFotangia§!.\n\nPar ailleurs, Nouvelle-Baldarak s'appellera désormais §HChabkymak§! du nom de Chabky Raddh, notre ministre de la Sûreté publique.\n\nTerminé."
 anomaly.5017.b: "Ça suffit ! Bloquez toutes les transmissions de ces créatures."
 anomaly.5018.desc: "Ici le citoyen Fotanga ! Le Conseil révolutionnaire du peuple souhaite annoncer l'exécution imminente de 4 539 individus accusés d'actes de trahison et d'activités contre-révolutionnaires.\n\nPuissent ces exécutions servir d'avertissement à tous ceux qui entendraient faire obstacle à notre glorieuse révolution.\n\nTerminé."
 anomaly.5019.desc: "Ici Rutmag ! Le Conseil révolutionnaire du peuple souhaite annoncer l'exécution imminente de l'ancien citoyen Fotanga qui a été reconnu coupable de démagogie, de corruption et d'incompétence.\n\nJe me chargerai désormais de ses précédentes fonctions. Mon premier arrêté consiste à restituer aux planètes Fotangia et Chabkymak leur nom d'origine.\n\nTerminé."
 anomaly.5020.desc: "Plusieurs cargos escortés par le [Root.GetName] ont déposé les bonbonnes contenant le corps expéditionnaire dathnak dans l'atmosphère de la Nouvelle-Baldarak. Quelques instants plus tard, des éclairs ont fusé sous la couche nuageuse de la géante gazeuse. Visiblement, les combats ont commencé."
 anomaly.5020.a: "Il nous faut maintenant attendre de voir."
 anomaly.5021.name: "Le corps expéditionnaire prend le contrôle"
 anomaly.5021.desc: "Ici le général Paltanak en direct de la Nouvelle-Baldarak. L'opération Furie gazeuse a porté ses fruits. Les objectifs principaux ont été atteints et le contrôle du gouvernement a été rétabli dans tous les secteurs atmosphériques.\n\nÀ l'exception de quelques poches de résistance, toutes les unités rebelles se sont rendues ou ont été mises en déroute. Merci infiniment pour votre soutien, [Root.Owner.GetSpeciesNamePlural]. Si vous voulez bien m'excuser, je dois transmettre le rapport des pertes à Baldarak.\n\nPaltanak, terminé."
 anomaly.5021.a: "Une opération rondement menée."
 anomaly.5022.name: "Annonce de la Nouvelle-Baldarak"
 anomaly.5022.desc: "Ici le général Paltanak, gouverneur militaire par intérim de la Nouvelle-Baldarak. J'ai le plaisir de vous annoncer la fin des principaux combats dans le secteur 47-G. Au moins 512 insurgés ont été tués depuis le début de l'opération, il y a deux cycles, tandis que nos pertes sont minimales.\n\nJe tiens à féliciter toutes les forces en présence pour avoir veillé à limiter les pertes civiles.\n\nPaltanak, terminé."
 anomaly.5023.desc: "Ici le général Paltanak, gouverneur militaire de la Nouvelle-Baldarak. J'aimerais commenter les rapports infondés selon lesquels les activités rebelles auraient repris dans ce monde. Permettez-moi de vous dire qu'il n'en est rien.\n\nCette planète a été entièrement pacifiée et tous les éléments terroristes subversifs ont été neutralisés. Ses citoyens oeuvrent à nouveau pour le compte de la grande nation des Dathnak.\n\nPaltanak, terminé."
 anomaly.5024.desc: "Ici le colonel Rapzak, gouverneur militaire par intérim de la Nouvelle-Baldarak. J'ai la triste tâche d'informer la communauté galactique de la disparition de mon prédécesseur, le général Paltanak. Après avoir été lâchement pris en embuscade par les forces rebelles, le général est mort au combat.\n\nDes funérailles d'État seront célébrées au terme de l'offensive en cours contre les bastions des rebelles.\n\nRapzak, terminé."
 anomaly.5025.name: "Académie des sciences de Baldarak"
 anomaly.5025.desc: "[Root.Owner.GetSpeciesNamePlural] ! L'Académie des sciences de Baldarak m'a chargé d'entrer en contact avec vous. Si nous autres Dathnak ne possédons pas de réelle technologie, nous sommes assurément capables de raisonnements très élaborés.\n\nOr, il se trouve que plusieurs de nos groupes de réflexion ont passé ces dernières années à étudier la physique théorique, et nous aimerions partager avec vous le fruit de nos découvertes. Sans doute ces informations pourraient-elles s'avérer utiles à la construction de votre empire, ce type d'entreprises que vous autres, solides, appréciez tant."
 anomaly.5025.a: "C'est très aimable"
 anomaly.5026.name: "Nettoyage de printemps"
 anomaly.5026.desc: "Bonjour, [Root.Owner.GetSpeciesNamePlural] !\n\nAccepteriez-vous de nous rendre service ? Le puissant puits gravitationnel de Baldarak attire toutes sortes de choses dans notre atmosphère et lors d'une récente réunion du conseil, nous avons décidé d'intensifier nos efforts de nettoyage. Une de nos unités de récupération est tombée sur une capsule abandonnée et nous nous demandions si vous accepteriez de nous aider à nous en débarrasser. Elle semble contenir une importante quantité de métaux sans grande valeur."
 anomaly.5026.a: "Oui, nous nous débarrasserons de ces métaux pour vous..."
 henrik.16.name: "Test du projet spécial"
 henrik.16.desc: "Cette opération fera l'objet d'un projet spécial sur [Root.GetName]."
 henrik.16.a: "Parfait !"
 henrik.20.name: "Apparition d'armées hostiles"
 henrik.20.desc: "Des armées hostiles ont fait leur apparition sur [Root.GetName]."
 henrik.20.a: "Aux armes !"
 henrik.21.name: "Victoire !"
 henrik.21.desc: "Nous avons vaincu les forces maléfiques du [From.GetName] !"
 henrik.22.name: "Défaite !"
 henrik.22.desc: "Nous avons perdu contre les viles forces du [From.GetName] !"
 henrik.145.desc: "Nous sommes les [Root.GetSpeciesNamePlural]."
 henrik.166.desc: "La cible de l'opération est la suivante : [test_target.GetName]"
 ####################################
 #Anomaly Failure Events
 ####################################
 DISC_FAILURE: "Échec"
 DISC_CRITICAL_FAILURE: "Échec critique"
 anomaly_failure.1.desc: "L'officier scientifique [Root.GetLeaderName] a ordonné au [Root.GetName] d'envoyer une sonde pour explorer le cratère de [From.From.GetName]. Malheureusement, ses propulseurs ont connu une défaillance, et la sonde a terminé sa course dans l'épave du vaisseau, au centre du cratère."
 anomaly_failure.2.desc: "L'astéroïde [From.From.GetName] est peut-être une capture extrasolaire, mais ne présente aucun autre intérêt. L'officier scientifique [Root.GetLeaderName] et le [Root.GetName] ont demandé la permission de poursuivre leur mission d'exploration ailleurs."
 anomaly_failure.3.desc: "Pendant des jours, l'équipage complet du [Root.GetName] a passé au crible, par relèves, les débris jonchant la surface de l'astéroïde [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] indique toutefois que rien n'a été trouvé présentant la moindre valeur."
 anomaly_failure.4.desc: "La source des étranges émissions énergétiques émanant de l'astéroïde [From.From.GetName] n'a pas été repérée. L'officier scientifique [Root.GetLeaderName] et le [Root.GetName] attendent de nouveaux ordres."
 anomaly_failure.5.desc: "Alors qu'il tentait d'ouvrir le sas d'arrimage trouvé sur [From.From.GetName], le [Root.GetName] a malencontreusement provoqué une secousse à l'intérieur de l'astéroïde. Malheureusement, l'officier scientifique [Root.GetLeaderName] estime que cela a probablement provoqué sa destruction."
 anomaly_failure.6.desc: "L'exploration du gigantesque cratère présent sur l'astéroïde [From.From.GetName] n'a rien révélé d'intéressant. L'officier scientifique [Root.GetLeaderName] a ordonné au [Root.GetName] de poursuivre la mission."
 anomaly_failure.7.desc: "Le [Root.GetName] a vainement tenté de s'arrimer à la station spatiale en orbite au-dessus de [From.From.GetName]. Hélas, cela a provoqué la désintégration de cette fragile station. L'officier scientifique [Root.GetLeaderName] s'en excuse sincèrement."
 anomaly_failure.7.desc.mach: "Le [Root.GetName] a vainement tenté de s'arrimer à la frêle station spatiale qui se trouve en orbite de [From.From.GetName]. Hélas, cela a provoqué sa désintégration. L'officier scientifique [Root.GetLeaderName] rapporte que la cause en serait un malheureux bug logiciel sur le calcul des trajectoires."
 anomaly_failure.8.desc: "La source des signes vie signalés sur l'astéroïde [From.From.GetName], si tant est qu'il s'agissait bien de cela, n'a pas pu être trouvée en dépit de tous les scans effectués par le [Root.GetName]. L'officier scientifique [Root.GetLeaderName] a donc demandé à recevoir de nouveaux ordres."
 anomaly_failure.9.desc: "S'il se trouve vraiment un objet dans l'atmosphère de [From.From.GetName], il est bien trop en profondeur pour être détecté par les capteurs du [Root.GetName]. L'officier scientifique [Root.GetLeaderName] a abandonné les recherches."
 anomaly_failure.10.desc: "Après une exploration minutieuse de la petite lune en orbite autour de [From.From.GetName], l'équipage du [Root.GetName] n'a rien trouvé de valeur. L'officier scientifique [Root.GetLeaderName] a mis fin à la mission."
 anomaly_failure.11.desc: "Sur ordre de l'officier scientifique [Root.GetLeaderName], le [Root.GetName] a envoyé une sonde dans l'atmosphère de [From.From.GetName] afin d'enquêter sur les signes de vie qui y avaient été signalés. Un riche écosystème atmosphérique y a été découvert. Mais ce faisant la sonde a contaminé cette atmosphère, et 3,4 secondes plus tard une réaction chimique s'est déclenchée, qui s'est rapidement propagée à la géante gazeuse tout entière. Aucun signe de vie ne plus y être détecté."
 anomaly_failure.12.desc: "L'atmosphère de la géante gazeuse [From.From.GetName] n'a rien révélé de particulièrement intéressant, malgré une analyse approfondie, au cours de laquelle le [Root.GetName] est même entré brièvement dans la haute atmosphère. L'officier scientifique [Root.GetLeaderName] suggère donc de mettre fin à la mission."
 anomaly_failure.13.desc: "Alors qu'il s'approchait des structures aérostatiques de l'atmosphère de [From.From.GetName], le [Root.GetName] aurait semble-t-il déclenché une sorte d'alarme de proximité. L'officier scientifique [Root.GetLeaderName] rapporte que les structures ont subitement perdu toute leur flottabilité avant de plonger dans la basse atmosphère de la géante gazeuse."
 anomaly_failure.14.desc: "Le [Root.GetName] a malencontreusement heurté la capsule en orbite autour de [From.From.GetName] qu'il tentait de récupérer. L'officier scientifique [Root.GetLeaderName] rapporte que la collision a propulsé la capsule dans l'atmosphère de la géante gazeuse, au point qu'il n'est plus possible de la récupérer."
 anomaly_failure.15.desc: "Le [Root.GetName] a minutieusement passé au crible le champ de débris qui entoure [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] ne signale aucune découverte intéressante."
 anomaly_failure.16.desc: "Malgré un examen approfondi, le [Root.GetName] ne parvient toujours pas à comprendre l'origine du gigantesque cratère visible sur [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] s'en excuse sincèrement."
 anomaly_failure.16.desc.mach: "Malgré une étude approfondie de l'énorme cratère d'impact de [From.From.GetName], le [Root.GetName] n'est pas parvenu à en expliquer la cause. L'officier scientifique [Root.GetLeaderName] a enregistré dans le journal la cause de cet échec, dû à un manque de résidus disponibles à la surface de la lune."
 anomaly_failure.17.desc: "Si des émissions énergétiques anormales ont bien été signalées sur [From.From.GetName], elles se sont depuis évanouies. L'officier scientifique [Root.GetLeaderName] rapporte que le [Root.GetName] n'a rien détecté de tel."
 anomaly_failure.18.desc: "Certes, un objet non identifié avait bien été repéré en orbite de [From.From.GetName]. « Avait », car le [Root.GetName] l'a percuté par accident, alors qu'il tentait de s'en approcher pour l'examiner de plus près. L'officier scientifique [Root.GetLeaderName] rapporte que la collision a provoqué sa destruction."
 anomaly_failure.19.desc: "Rien d'anormal n'a été trouvé sur le petit astéroïde, probablement tracté jusqu'en orbite de [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] a donc demandé de nouveaux ordres pour le [Root.GetName]."
 anomaly_failure.20.desc: "Malheureusement, le vaisseau solaire trouvé en orbite de [From.From.GetName] a été détruit lorsque l'officier scientifique [Root.GetLeaderName] a maladroitement tenté de le diriger vers la baie de chargement du [Root.GetName]."
 anomaly_failure.21.desc: "Si le rapport de l'enquête initiale mentionnait des signes de vie provenant de sous la surface de [From.From.GetName], il a dû se produire une erreur : le [Root.GetName] n'a rien découvert, et l'officier scientifique [Root.GetLeaderName] rapporte que la [From.From.GetPlanetMoon] semble désormais dépourvue de la moindre forme de vie."
 anomaly_failure.22.desc: "Ce que nous avons pris pour une station orbitale cachée au-dessus de [From.From.GetName] correspondait en fait aux déchets déversés par le vaisseau scientifique à l'origine de l'exploration initiale de la [From.From.GetPlanetMoon]. L'officier scientifique [Root.GetLeaderName] et l'équipage du [Root.GetName] suggèrent que nous oubliions ce fâcheux incident et que nous poursuivions notre chemin."
 anomaly_failure.23.desc: "Au terme d'une minutieuse analyse, l'officier scientifique [Root.GetLeaderName] a indiqué que les débris de vaisseau repérés au-dessus de [From.From.GetName] provenaient en fait d'un vaisseau poubelle. [Root.GetName] a collecté quelques débris, mais ceux-ci semblent ne présenter aucune valeur."
 anomaly_failure.24.desc: "Les analyses approfondies menées depuis le [Root.GetName] ont visiblement déclenché une sorte de panne d'alimentation en cascade de l'ancien chantier spatial en orbite autour de [From.From.GetName]. S'en est suivie une spectaculaire explosion d'après l'officier scientifique [Root.GetLeaderName]."
 anomaly_failure.25.desc: "Les « ruines urbaines » signalées à la surface de [From.From.GetName] n'étaient en fait que des formations rocheuses aux contours inhabituels. L'officier scientifique [Root.GetLeaderName] s'excuse pour la perte des ressources engagées, et a demandé qu'une nouvelle mission soit attribuée au [Root.GetName]."
 anomaly_failure.26.desc: "L'officier scientifique [Root.GetLeaderName] a fait son rapport, indiquant que l'origine des traces observées sur la surface de [From.From.GetName] s'était en fait avérée être naturelle. Le [Root.GetName] attend qu'une nouvelle mission lui soit attribuée."
 anomaly_failure.27.desc: "Le [Root.GetName] a perdu le faible signal émanant de [From.From.GetName] et malgré tous les efforts de l'officier scientifique [Root.GetLeaderName], les tentatives visant à récupérer la balise ont échoué."
 anomaly_failure.28.desc: "La formation montagneuse « non naturelle » repérée sur §Y[From.From.GetName]§! l'était en fait tout à fait. L'officier scientifique [Root.GetLeaderName] estime que laisser le [Root.GetName] sur place plus longtemps serait une perte inutile de ressources."
 anomaly_failure.29.desc: "Malgré plusieurs tentatives, l'officier scientifique [Root.GetLeaderName] et le reste de l'équipage du [Root.GetName] n'ont pas réussi à localiser cet objet qui réfléchissait les rayons des capteurs lors de l'exploration initiale de [From.From.GetName]. Peut-être s'agissait-il d'une simple défaillance du capteur."
 anomaly_failure.30.desc: "Le [Root.GetName] n'a pas réussi à localiser la source de la faible transmission émanant de l'intérieur de [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] rapporte que la transmission a depuis été totalement interrompue."
 anomaly_failure.31.desc: "Malgré les balayages successifs effectués par le [Root.GetName], aucune trace de ce vaisseau censé se trouver dans l'atmosphère de [From.From.GetName] n'a été trouvée. L'officier scientifique [Root.GetLeaderName] exprime ses doutes quant à son existence réelle."
 anomaly_failure.32.desc: "Après avoir recalculé l'orbite de cette lune qui semblait située sur une orbite terminale avec [From.From.GetName], l'officier scientifique [Root.GetLeaderName] est arrivé à la conclusion qu'il s'agissait en fait d'une quasi-collision. Le [Root.GetName] devrait être redéployé pour répondre à des affaires plus pressantes."
 anomaly_failure.33.desc: "Les traces d'une activité des Vultaums aux abords de [From.From.GetName] n'étaient en fait qu'une fausse piste. L'officier scientifique [Root.GetLeaderName] a demandé que les recherches du [Root.GetName] se poursuivent ailleurs."
 anomaly_failure.34.desc: "Les traces d'une activité des Yuhts aux abords de [From.From.GetName] n'étaient en fait qu'une fausse piste. L'officier scientifique [Root.GetLeaderName] a demandé que les recherches du [Root.GetName] se poursuivent ailleurs."
 anomaly_failure.35.desc: "Les traces d'une activité de la Première ligue aux abords de [From.From.GetName] n'étaient en fait qu'une fausse piste. L'officier scientifique [Root.GetLeaderName] a demandé que les recherches du [Root.GetName] se poursuivent ailleurs."
 anomaly_failure.36.desc: "Les traces d'une activité des Irassiens aux abords de [From.From.GetName] n'étaient en fait qu'une fausse piste. L'officier scientifique [Root.GetLeaderName] a demandé que les recherches du [Root.GetName] se poursuivent ailleurs."
 anomaly_failure.37.desc: "Les traces d'une activité de la Cybrex aux abords de [From.From.GetName] n'étaient en fait qu'une fausse piste. L'officier scientifique [Root.GetLeaderName] a demandé que les recherches du [Root.GetName] se poursuivent ailleurs."
 anomaly_failure.400.desc: "Pour des raisons qui restent mystérieuses, l'officier scientifique du bord a décidé de prendre une navette du [Root.GetName] pour explorer personnellement l'astéroïde [From.From.GetName]. Une explosion a été détectée peu après, lorsque la navette a heurté la surface de l'astéroïde.\n\nUne commission d'enquête a conclu, plus tard, que ce scientifique n'avait pas été formé pour piloter une navette de classe D."
 anomaly_failure.401.desc: "Alors qu'il manoeuvrait pour examiner [From.From.GetName], le [Root.GetName] est malencontreusement entré en collision avec un autre astéroïde. Le vaisseau est devenu incontrôlable, avant de s'écraser à la surface de [From.From.GetName], s'enfonçant dans la croûte du planétoïde.\n\nL'officier scientifique [Root.GetLeaderName], de même que l'équipage, est porté disparu."
 anomaly_failure.402.desc: "Alors qu'il manoeuvrait pour examiner [From.From.GetName], le [Root.GetName] est malencontreusement entré en collision avec un autre astéroïde. Le vaisseau est devenu incontrôlable, avant de s'écraser à la surface de [From.From.GetName], s'enfonçant dans la croûte du planétoïde.\n\nQuelques membres de l'équipage, parmi lesquels l'officier scientifique [Root.GetLeaderName], sont toutefois parvenus à quitter le vaisseau en perdition à bord d'une capsule de survie."
 anomaly_failure.403.desc: "Cet astéroïde est utilisé comme pondoir par des créatures vivant dans le vide ! Plusieurs d'entre, cherchant à défendre leur territoire, sont sorties de leur réseau de tunnels pour attaquer le [Root.GetName]."
 creature_nest: "Ces créatures hostiles se rapprochent à toute vitesse !"
 anomaly_failure.404.desc: "Plusieurs drones militaires dormants, conçus par une civilisation aujourd'hui disparue, étaient regroupés dans un petit cratère situé sur l'autre face de [From.From.GetName]. Lorsque le [Root.GetName] est passé à portée de leurs capteurs passifs, les drones se sont rallumés pour tenter d'exécuter leurs anciennes directives de programmation : défendre à tout prix le système des intrus."
 dormant_drones: "Drones d'attaque en approche !"
 anomaly_failure.405.desc: "Des balayages effectués depuis le [Root.GetName] ont permis de brièvement détecter plusieurs structures à la surface de l'astéroïde [From.From.GetName]. Quelques secondes plus tard, toutefois, le signal a été interrompu par des interférences de brouillage. Plusieurs vaisseaux pirates ont alors soudainement décollé d'un hangar dissimulé sur l'astéroïde. Ils se rapprochent en formation de combat !"
 pirate_outpost: "Ces pirates ne sont pas là pour rigoler !"
 anomaly_failure.900.desc: "Nous avons reçu des nouvelles tragiques de [From.From.GetName] : l'officier scientifique [Root.GetLeaderName] a été tué par une décharge électrique alors qu'il évoluait dans la haute atmosphère de la géante gazeuse à bord d'une petite navette. L'équipage du [Root.GetName] a mis fin à sa mission."
 anomaly_failure.901.desc: "Nous ne disposons pour l'instant que d'un faisceau d'indices ; mais pour une raison qui nous échappe encore l'officier scientifique [Root.GetLeaderName] aurait ordonné au [Root.GetName] d'entrer dans la haute atmosphère de [From.From.GetName] pour enquête sur une anomalie relevée par un capteur. La pression sur la coque a alors été telle que le vaisseau ne l'a pas supportée, ce qui a conduit à sa perte et à celle de l'ensemble de l'équipage."
 anomaly_failure.902.desc: "Alors qu'il effectuait des scans de [From.From.GetName], le [Root.GetName] a subi une avarie de réacteur et s'est retrouvé piégé dans le puits gravitationnel de la géante gazeuse. L'officier scientifique [Root.GetLeaderName] a supervisé avec succès l'évacuation de l'équipage, mais le vaisseau lui-même a été aspiré par l'atmosphère dense de la planète et ne pourra être récupéré."
 anomaly_failure.903.desc: "Alors qu'il approchait de [From.From.GetName], le [Root.GetName] a rencontré deux vaisseaux inconnus, cachés dans l'ombre de la géante gazeuse. Il s'agit visiblement de contrebandiers participant à une sorte d'entrevue secrète. Aussitôt notre vaisseau repéré, ils se sont détachés l'un de l'autre pour ouvrir le feu, et sont visiblement déterminés à éliminer tous les témoins."
 smuggler_rendezvous: "Les contrebandiers attaquent !"
 anomaly_failure.1400.desc: "Lors d'opérations menées au-dessus de [From.From.GetName], le coeur du réacteur du [Root.GetName] a été victime d'une brèche de confinement. Le vaisseau entier a été mis en danger, mais grâce au sacrifice de son courageux officier scientifique, la salle des moteurs a été purgée des radiations. Malheureusement, [Root.GetLeaderName] a absorbé une importante dose de radiations et n'a pas pu être sauvé."
 anomaly_failure.1400.desc.mach: "Lors d'opérations menées au-dessus de [From.From.GetName], le coeur du réacteur du [Root.GetName] a été victime d'une brèche de confinement. Le vaisseau entier se trouvant alors en danger, son officier scientifique l'officier scientifique en est arrivé à la conclusion logique qu'il était préférable de se sacrifier lui-même pour purger la chambre de toute radiation, en s'appuyant sur ses logiciels de calcul de pertes. Au cours du processus, [Root.GetLeaderName] a reçu une dose de radiations suffisante pour que ses semi-conducteurs soient ionisés et ses tamis de silicium gravement déplacés, le rendant inopérant de façon définitive. Le vaisseau et son équipage ont, malgré tout, été sauvés."
 anomaly_failure.1401.desc: "Alors que l'alimentation était réorientée vers le réseau principal des capteurs, le [Root.GetName] a été victime d'une défaillance critique de son réacteur au-dessus de [From.From.GetName]. L'officier scientifique [Root.GetLeaderName] est mort, en même temps que tout son équipage, dans l'explosion qui a suivi."
 anomaly_failure.1402.desc: "Nous ne savons pas avec certitude comment cela s'est produit, mais il semble que l'officier scientifique [Root.GetLeaderName] a lancé par erreur, sur l'ordinateur de bord, la séquence d'autodestruction du [Root.GetName] lors d'une simulation en lien avec l'étude de [From.From.GetName]. Les tentatives d'annulation de la séquence ont toutes échoué, et l'équipage entier a dû évacuer avant que la destruction du vaisseau."
 anomaly_failure.1403.desc: "Plusieurs vaisseaux pirates ont soudainement décollé de la surface de [From.From.GetName], où ils étaient cachés. Il semble que le [Root.GetName] est tombé sur un repaire de pirates - ce que ces racailles ne semblent pas avoir apprécié."
 pirate_anchorage: "Vaisseaux hostiles en approche !"
 anomaly_failure.1404.desc: "L'espace orbital au-dessus de [From.From.GetName] semble être le lieu d'accouplement d'une espèce de créatures spatiales aussi imposantes qu'agressives. Furieuses d'être dérangées par le [Root.GetName] au beau milieu de leurs ébats, deux de ces créatures ont fondu sur l'intrus."
 mating_ground: "Ces créatures paraissent bien agitées..."
 anomaly_failure.1405.desc: "Une petite escadrille d'anciens drones de combat semble avoir été abandonnée en orbite de [From.From.GetName] après quelque bataille depuis longtemps oubliée. Mais lorsque les capteurs du [Root.GetName] les ont balayés, les drones se sont soudainement mis en marche pour entrer en mode attaque !"
 combat_drones: "Ils arrivent, toutes armes déployées !"
 ####################################
 #Colony Events
 ####################################
 colony.1.name: "Forêts migratoires"
 colony.1.desc: "La surface de [Root.GetName] est recouverte de forêts luxuriantes, où des choses ressemblant à des arbres impressionnants s'élèvent à plusieurs centaines de mètres de haut. Fait intéressant, nos colons ont remarqué que la quasi-totalité de la flore, à des degrés divers, se déplace. Ainsi, des forêts s'étendant sur plusieurs kilomètres carrés migrent lentement vers des zones plus riches en nutriments, à un rythme qui semble lié à l'orbite de la [Root.GetPlanetMoon].\n\nMalheureusement, cela gêne considérablement les efforts de développement de l'infrastructure de la colonie : les arbres migrateurs coupent régulièrement les lignes électriques et détruisent les bâtiments et les routes."
 colony.1.a: "Nous devons trouver une solution"
 colony.2.desc: "L'étude poussée de la faune nous a appris que les forêts migratoires de [From.From.GetName] évitent certaines régions colonisées par un pseudo-insecte autochtone, qui secrète des phéromones utilisée pour éloigner les arbres errants des colonies.\n\nPar ailleurs, les zones où ces forêts migrent le plus fréquemment ont été transformées en réserves naturelles. Nos biologistes pourraient donc apprendre beaucoup de choses en étudiant ces réserves depuis les régions voisines."
 colony.2.a.tooltip: "Modificateur §YForêts migratoires dociles§! ajouté, se traduisant par :\najout de £blocker£ §YRéserve de forêts migratoires§!, améliorant les §Yrecherches§! en £society£  sur les tuiles voisines."
 colony.3.desc: "Une campagne de bombardements au napalm a permis d'expurger les forêts migratoires de [From.From.GetName]. Les gigantesques incendies que cela a déclenchés ont laissé des paysages fumants dans leur sillage, permettant aux écologistes d'y planter des arbres amenés d'autres planètes, plus classiques et nettement moins remuants. La faune et la flore de la [From.From.GetPlanetMoon] ont certes payé un lourd tribut, mais cela reste dans les limites de l'acceptable."
 colony.4.name: "Le retour des forêts"
 colony.4.desc: "Les forêts migratoires de [Root.GetName] sont réapparues ! Nous savions que plusieurs poches isolées avaient survécu dans des zones reculées, mais elles semblaient endormies. Or, elles semblent avoir profité de ce répit pour renforcer leurs rangs, et ont commencé à attaquer systématiquement nos établissements.\n\nContrairement à ce que nous pensions, elles semblent douées d'une forme d'intelligence rudimentaire et entendent bien se venger !"
 colony.4.a: "Nous devons les arrêter !"
 tree_armies: "Des hordes d'arbres attaquent les colons de [Root.GetName] !"
 colony.5.name: "Disparition des forêts"
 colony.5.desc: "Les forêts migratoires ont fait de nombreuses victimes et détruit un grand nombre d'établissements sur [From.From.GetName], mais nous sommes parvenus à les repousser et à décimer jusqu'à la dernière d'entre elles. Des équipes armées de lance-flammes veillent à ce que, cette fois, aucun arbre n'en réchappe."
 colony.5.a: "Ça leur apprendra"
 colony.6.name: "Gisements de minéraux"
 colony.6.desc: "Nous avons découvert de riches gisements de minéraux précédemment cachés par les forêts migratoires de [Root.GetName]. Maintenant que celles-ci ont été décimées, ces gisements sont facilement accessibles. Nous avons révisé la classification minérale de la [Root.GetPlanetMoon]."
 colony.7.name: "Gisement de métaux précieux"
 colony.7.desc: "Nous avons découvert un important gisement de métaux précieux précédemment caché par les forêts migratoires de [Root.GetName]. Maintenant que celles-ci ont été décimées, ce gisement est facilement accessible. Nous avons révisé la classification des ressources de la [Root.GetPlanetMoon]."
 colony.8.name: "Dégâts environnementaux"
 colony.8.desc: "Visiblement, les forêts migratoires que nous avons décimées sur [Root.GetName] jouaient un rôle bien plus important dans l'écologie de la [Root.GetPlanetMoon] que nous ne le pensions. Les feux que nous avons déclenchés et l'absence de forêts ont précipité la disparition de plusieurs espèces autochtones puis, par un simple effet domino, de plusieurs espèces de prédateurs.\n\nDes tentatives sont en cours pour restaurer - au moins en partie - le fragile équilibre environnemental, grâce à l'introduction d'une faune et d'une flore originaires d'autres mondes. Le processus est toutefois complexe, et cela prendra du temps."
 colony.9.name: "Adaptation des forêts"
 colony.9.desc: "Les rapports prolongés entre nos colons et les forêts migratoires de [Root.GetName] ont permis de comprendre que ces dernières sont douées d'une forme d'intelligence collective rudimentaire. Elles semblent s'être adaptées à notre présence, et ont déplacé leurs voies migratoires de façon à ne pas endommager les propriétés des colons, sans que ceux-ci aient besoin de recourir à la phéromone des insectes. Les colons semblent retrouver le moral."
 colony.10.name: "Recherches sur les forêts"
 colony.10.desc: "Nous avons beaucoup appris en vivant à proximité des forêts migratoires de [Root.GetName]. Certains colons particulièrement hardis ont même construit des maisons à la cime des arbres les plus hauts, suivant les forêts lors de leur migration sur la [Root.GetPlanetMoon], et quelques-uns des biologistes les plus éminents de la [Root.Owner.GetName] ont longuement étudié ces arbres uniques."
 colony.11.name: "Feu de forêt"
 colony.11.desc: "Sur [Root.GetName] un feu de forêt, déclenché par la foudre, a provoqué l'équivalent d'une bousculade parmi les forêts migratoires de la [Root.GetPlanetMoon]. Dans la panique, elles sont entrées dans les zones qu'elles évitaient jusque là, endommageant considérablement l'infrastructure de la colonie."
 colony.12.name: "Déplacement des forêts migratoires"
 colony.12.desc: "Les autorités coloniales de [Root.GetName] ont rapporté qu'une des forêts migratoires s'est déplacée dans une autre région de la [Root.GetPlanetMoon]. Des centaines de milliers d'arbres se sont déracinés pour marcher à l'unisson vers cette nouvelle zone, détruisant tout sur leur passage."
 colony.50.name: "Perturbations sismiques"
 colony.50.desc: "De nombreux rapports font état de perturbations sismiques inexplicables sur §Y[Root.GetName]§!. Les secousses sont ressenties sur toute la [Root.GetPlanetMoon], et bon nombre de nos établissements déplorent des dégâts. En étudiant la cause de ces phénomènes, les scientifiques ont découvert un vaste réseau de cavernes.\n\nLes plus profondes d'entre elles abritent une sorte de civilisation indigène, qui creuse ses tunnels en ce moment même en direction de la surface. Il est possible que ce soient les vibrations dans le sol produites par nos établissements qui ont déclenché ce comportement, mais nous n'en sommes pas certains. Et il est pour l'heure impossible de dire comment ces aliens réagiront lorsqu'ils sortiront de leurs tunnels et découvriront nos colons."
 colony.50.desc.subterranean: "De nombreux rapports indiquent des perturbations sismiques inexplicables sur §Y[Root.GetName]§!. Les secousses sont ressenties à travers toute la [Root.GetPlanetMoon], et bon nombre de nos établissements déplorent des dégâts. En étudiant la cause de ces phénomènes, les scientifiques ont découvert un vaste réseau de cavernes dans le manteau de la [Root.GetPlanetMoon].\n\nLes plus profondes d'entre elles abritent une sorte de civilisation indigène, qui creuse ses tunnels en ce moment même vers notre colonie. Il est possible que ce soient les vibrations produites par nos établissements qui ont déclenché ce comportement, mais nous n'en sommes pas certains. Et il est pour l'heure impossible de dire comment ces aliens réagiront lorsqu'ils sortiront de leurs tunnels et découvriront nos colons."
 colony.50.a: "Nous devons nous en occuper."
 colony.51.desc: "Une de nos sondes enfoncée dans le sol a intercepté des aliens fouisseurs sur [From.From.GetName]. Une fois ces aliens calmés, la sonde a réussi à établir une communication avec leurs chefs."
 colony.51.a: "Ouvrez un canal."
 colony.52.desc: "Les efforts déployés pour détruire les aliens [Root.Owner.GetSubMantleLower_FR_mp] de §Y[Root.GetName]§! ont porté leurs fruits ! Nous avons réussi à provoquer l'effondrement de plusieurs de leurs tunnels sur leurs ouvriers, et du gaz neurotoxique a été diffusé dans les grottes qui abritaient leurs cités.\n\nLes pertes provoquées seraient proches de 100%, et les forces de sécurité locales nous ont assuré qu'elles pourraient en finir avec les derniers survivants."
 colony.52.a: "Félicitations à tous les intervenants."
 colony.53.name: "Aliens [Root.Owner.GetSubMantleLower_FR_mp]"
 colony.53.desc: "Qu'est-ce qui se passe ? Vous nous voyez, surfaçeurs ? Nous vous avons entendu parler du Grand vide situé là-haut, au-delà de la pierre. Nous pensions qu'il n'existait rien là-haut, mais c'est visiblement le cas. Quelles sont vos intentions ?"
 colony.53.a: "Parlez-nous de vous."
 colony.53.desc.subterranean: "Ça marche, ce truc ? Vous nous voyez, les croûtiers ? Si nous avons bien compris, vous nous parlez depuis le Grand Vide, qui se trouve même encore plus haut, au-delà du magma et de la pierre. Nous pensions que rien de vivant ne pouvait survivre là-haut, mais ce n'est visiblement pas le cas. Quelles sont vos intentions ?"
 colony.53.a.response: "Notre empire s'étend à toutes les poches du monde connu. Seul le Grand Vide reste hors de portée pour nous. Nous avons de jolies villes, dont les besoins sont assurés par les fermes à lichens et le poisson que nous pêchons dans les grandes rivières qui circulent dans nos tunnels.\n\nNous vivons ainsi depuis des millénaires. Nos mineurs ont entendu les échos lointains de vos villes à travers la pierre, et nous avons décidé d'en apprendre davantage."
 colony.53.b: "Nous espérons coexister en paix."
 colony.53.b.response: "Qu'il en soit ainsi, surfaçeur ! Partageons pacifiquement ce monde. Nous aimerions particulièrement commercer avec votre peuple. Je pense que nous avons beaucoup à nous apporter mutuellement. Nous allons retourner dans nos villes et procéder aux préparatifs nécessaires."
 colony.53.b.response.subterranean: "Il en va de même pour nous, croûtiers ! Partageons pacifiquement ce monde. Nous aimerions particulièrement commercer avec vous. Il y a fort à parier que nous avons beaucoup à nous apporter mutuellement. Nous allons retourner vers nos cités pour procéder aux arrangements nécessaires."
 colony.53.c: "Soumettez-vous ou mourez."
 colony.53.c.response: "Ha ! C'est vous qui vous soumettrez ! Nous aurions pu cohabiter en paix, mais maintenant nos armées vont revendiquer le Grand vide et l'annexer au nom de notre empire. Nous sommes faits pour régner sur toute la création."
 colony.54.name: "Invasion [Root.Owner.GetSubMantleLower_FR_fs]"
 colony.54.desc: "Les aliens souterrains de [Root.GetName] sont apparus à la surface ! De vastes armées équipées d'armes aussi primitives que redoutables déferlent des tunnels et leur avant-garde a déjà lancé un assaut contre nos colonies.\n\nNos forces de sécurité ripostent, mais il va peut-être nous falloir envoyer des renforts !"
 colony.54.desc.subterranean: "Les aliens vivant sous le magma de §Y[Root.GetName]§! ont débouché dans nos cavernes ! Des armées nombreuses, équipées d'armes aussi primitives que mortelles, ont commencé à déferler depuis les tunnels, et leur avant-garde a déjà lancé l'assaut contre nos établissements.\n\nLes forces de sécurité locales ripostent, mais il va sans doute nous falloir envoyer très vite des renforts sur place."
 colony.54.a: "Aux armes !"
 subterranean_invasion: "Des armées hostiles attaquent notre colonie de [Root.GetName] !"
 colony.55.desc: "Les tremblements de terre qui ont secoué [From.From.GetName] ont été provoqués par les ouvriers d'une civilisation souterraine jusque-là inconnue et originaire de la [From.From.GetPlanetMoon] qui creusaient des tunnels ! Ils ont percé la surface et de gigantesques armées équipées d'armes aussi primitives que redoutables déferlent des tunnels. Leur avant-garde a déjà commencé à attaquer nos colonies. Nos forces de sécurité ripostent, mais il va peut-être nous falloir des renforts !"
 colony.56.name: "Victoire sur [From.From.GetName] !"
 colony.56.desc: "Nos forces ont réussi à renvoyer les aliens souterrains de [From.From.GetName] dans leurs repaires, où ils sont contenus pour le moment. Tout n'est pas réglé pour autant et ce n'est qu'une question de temps avant qu'ils ne réapparaissent.\n\nIl va nous falloir les frapper sous terre et pour cela, nos stratèges ont imaginé un nouveau plan d'attaque. Ce dernier a été ajouté au Journal de bord."
 colony.56.desc.subterranean: "Nos forces sont parvenues à repousser les aliens vivant sous le manteau de §Y[From.From.GetName]§! dans leurs galeries magmatiques, où ils sont contenus pour le moment. Tout n'est pas réglé pour autant, et ce n'est qu'une question de temps avant qu'ils ne réapparaissent dans nos cavernes.\n\nIl va nous falloir les frapper dans les profondeurs de la [From.From.GetPlanetMoon]. Les stratèges ont dressé un plan d'attaque, qui a été ajouté au Journal de bord."
 colony.56.a: "Il nous faut régler ce problème une fois pour toutes."
 colony.57.name: "Défaite sur [From.From.GetName] !"
 colony.57.desc: "Nos forces, sur §Y[From.From.GetName]§!, ont été décimées. Les aliens [Root.Owner.GetSubMantleLower_FR_mp] ont pris le contrôle de tous nos établissements. Ils ont même utilisé l'un de nos satellites pour nous faire parvenir un message."
 colony.58.desc: "Créatures de surface ! Nos glorieuses armées ont eu raison de vous et nous utiliserons désormais vos villes comme bon nous semble. Nous avons beaucoup appris de vos machines et nos armes sont maintenant plus puissantes que jamais.\n\nNe vous approchez plus de ce monde !"
 colony.58.desc.subterranean: "Croûtiers ! Nos glorieuses armées ont eu raison de vous au combat, et vos cités sont désormais à nous, pour les piller et en faire ce que bon nous semble. Nous avons beaucoup appris de vos machines, et nous disposons désormais d'un armement plus puissant que jamais.\n\nNe vous approchez plus de notre monde !"
 colony.58.a: "Quelle audace !"
 colony.59.name: "Apparition d'aliens"
 colony.59.desc: "Les aliens souterrains de [From.From.GetName] sont apparus à la surface ! Seul quelques explorateurs et marchands semblent avoir participé à cette petite excursion. Peut-être entendent-ils cohabiter pacifiquement avec nos colons, voire commercer avec eux. Nous avons été contactés par un de leurs représentants."
 colony.59.desc.subterranean: "Les aliens vivant sous le magma de §Y[Root.GetName]§! ont émergé dans nos cavernes ! Leurs expéditions semblent constituées seulement de quelques petits groupes d'explorateurs et de marchands. Ils ont peut-être l'intention de cohabiter pacifiquement avec nos colons, et peut-être même de commercer avec eux. L'un de leurs représentants cherche d'ailleurs à entrer en contact avec nous."
 colony.59.a: "Voyons ce qu'ils ont à dire."
 colony.60.desc: "Les aliens souterrains de [Root.GetName] ont mobilisé suffisamment de forces pour lancer une nouvelle invasion à la surface ! Une fois de plus, leurs redoutables armées déferlent des tunnels pour nous provoquer."
 colony.60.desc.subterranean: "Les aliens vivant sous le magma de §Y[Root.GetName]§! ont rassemblé suffisamment de leurs forces, dans leur empire des profondeurs, pour lancer une nouvelle invasion de nos cavernes ! Cette fois encore, leurs armées frénétiques déferlent de tunnels récemment creusés pour attaquer nos colons."
 colony.60.a: "Il nous faut les repousser !"
 subterranean_invasion_2: "Des armées hostiles attaquent notre colonie de [Root.GetName] !"
 colony.61.name: "Effondrement"
 colony.61.desc: "Une nouvelle terrible vient de nous parvenir de §Y[Root.GetName]§! : les [Root.Owner.GetSubMantleLower_FR_mp] auxquels nous sommes confrontés ont réussi à provoquer l'effondrement du sol sous une armée postée à l'entrée d'un de leurs tunnels.\n\nLes quelques soldats survivants ont rapidement été massacrés par l'ennemi, avant même que le reste de nos forces puisse arriver sur le lieu du massacre."
 colony.61.a: "Ils le paieront !"
 colony.62.name: "Attaquants"
 colony.62.desc: "Les aliens qui vivent sous notre colonie de [Root.GetName] envoient des petits groupes d'attaquants à la nuit tombée. Leurs attaques ont détruit une des principales installations de la colonie et, avant même que nos forces ripostent, les assaillants se sont volatilisés sous terre."
 colony.62.a: "Ces attaques doivent cesser !"
 colony.63.name: "Attaque de surface"
 colony.63.desc: "Une nouvelle attaque s'est produite sur §Y[Root.GetName]§! ! Les [Root.Owner.GetSubMantleLower_FR_mp] ont émergé de nouveaux tunnels pour apparaître au beau milieu d'un des principaux établissements de la colonie. Les forces de protection locales ont été submergées, et les colons massacrés. Et, au moment où ces sauvages se sont repliés, ils ont traîné vers les profondeurs quelques survivants hurlant de terreur..."
 colony.63.a: "Ce massacre ne restera pas impuni."
 colony.64.name: "Poche de survivants"
 colony.64.desc: "Sur §Y[Root.GetName]§!, nos forces continuent de cartographier le réseau de tunnels situés sous notre colonie. Elles ont repéré une grande cité alien qui a réussi à s'isoler du reste de l'empire [Root.Owner.GetSubMantleLower_FR_ms] avant qu'on n'y envoie du gaz neurotoxique. Elle abrite des millions d'habitants effrayés. Nos ingénieurs doivent-ils provoquer l'effondrement de la caverne ?"
 colony.64.a: "Oui. Qu'ils en finissent !"
 colony.64.b: "Non ! Ramenez-les à la surface où ils nous serviront."
 colony.64.b.subterranean: "Vivants, ils seront utiles pour la colonie"
 colony.65.name: "Expansion [Root.Owner.GetSubMantleLower_FR_fs]"
 colony.65.desc: "Nous avons vidé le réseau de tunnels de [Root.GetName] du gaz neurotoxique et des cadavres des aliens. Nos colons devraient maintenant pouvoir s'y rendre sans risque. Les villes primitives laissées par les aliens seront bien sûr démolies et remplacées par notre propre architecture avancée."
 colony.66.name: "De l'or !"
 colony.66.desc: "Des prospecteurs se sont aventurés jusqu'au plus profond des tunnels creusés autrefois par les aliens souterrains de §Y[Root.GetName]§!. Ils y ont enfin découvert ces fameuses mines d'or d'où l'on supposait que leur empire puisait ses immenses réserves de métaux précieux."
 colony.66.desc.subterranean: "Des prospecteurs se sont aventurés jusqu'au plus profond des tunnels creusés autrefois par les aliens vivant sous le magma de §Y[Root.GetName]§!. Ils y ont enfin découvert ces fameuses mines d'or d'où l'on supposait que leur empire puisait ses immenses réserves de métaux précieux."
 colony.67.name: "Trésor"
 colony.67.desc: "Alors qu'elles exploraient le réseau de tunnels de [Root.GetName], des unités de reconnaissance sont entrées dans le palais royal de l'ancienne capitale de l'empire alien souterrain. Le cadavre de leur défunt empereur se trouve toujours sur un imposant trône de la chambre principale.\n\nAprès avoir utilisé des charges explosives pour accéder au trésor, nos éclaireurs y ont découvert de l'or ainsi que d'étranges oeuvres d'art aliens. Celles-ci seront acheminées jusqu'aux musées de [From.Owner.Capital.GetName] et la vente de l'or permettra de gonfler les réserves de l'État."
 colony.68.name: "Tremblements de terre sur [Root.GetName]"
 colony.68.desc: "§Y[Root.GetName]§! a été victime de nouveaux séismes. Visiblement, une partie du réseau de tunnels se serait effondrée sans que les [Root.Owner.GetSubMantleLower_FR_mp] ne puissent rien y faire. Des dégâts sont à déplorer dans bon nombre de nos établissements."
 colony.69.name: "Famine"
 colony.69.desc: "Une délégation des aliens [Root.Owner.GetSubMantleLower_FR_mp] de §Y[Root.GetName]§! a approché nos colons. Leur empire semble traverser une période difficile, et la famine guette leur civilisation. Ils demandent donc à ce que nous les aidions."
 colony.69.a: "Bien sûr. Nous les aiderons de notre mieux."
 colony.69.b: "Ils devront se débrouiller seuls."
 subterraneans_pleased: "Les relations avec la civilisation [Root.Owner.GetSubMantleLower_FR_fs] vont s'améliorer."
 subterraneans_displeased: "Les relations avec la civilisation [Root.Owner.GetSubMantleLower_FR_fs] vont se dégrader."
 colony.70.name: "Cadeau"
 colony.70.desc: "En guise de présent pour sceller l'amitié entre nos deux civilisations, une caravane des aliens souterrains de §Y[Root.GetName]§! a apporté d'importantes quantités de pierres précieuses à la surface. Celles-ci semblent provenir de zones toutes proches du noyau de la [Root.GetPlanetMoon], aux niveaux les plus profonds où ces aliens osent descendre."
 colony.70.desc.subterranean: "En guise de présent pour sceller l'amitié entre nos deux civilisations, une caravane des aliens infra-mantelliques de §Y[Root.GetName]§! a apporté d'importantes quantités de pierres précieuses dans nos cavernes. Celles-ci semblent provenir de zones toutes proches du noyau de la [Root.GetPlanetMoon], aux niveaux les plus profonds où ces aliens osent descendre."
 colony.70.a: "Que c'est gentil !"
 colony.71.name: "Réfugiés [Root.Owner.GetSubMantleLower_FR_mp]"
 colony.71.desc: "Un groupe nombreux d'habitants de l'empire alien souterrain de §Y[Root.GetName]§! est récemment apparu à la surface, poursuivi par une petite armée. Ces réfugiés appartiennent semble-t-il à une minorité religieuse, dont les membres tenteraient d'échapper à la persécution.\n\nLes autoriser à s'installer au sein de notre colonie va très certainement susciter la colère des dirigeants de leur empire ; mais si nous laissons leurs poursuivants les remmener sous terre, il y a fort à parier qu'ils y seront exécutés."
 colony.71.desc.subterranean: "Un groupe nombreux d'habitants de l'empire alien infra-mantellique de §Y[Root.GetName]§! est récemment apparu dans nos cavernes, poursuivi par une petite armée. Ces réfugiés appartiennent semble-t-il à une minorité religieuse, dont les membres tenteraient d'échapper à la persécution.\n\nLes autoriser à s'installer au sein de notre colonie va très certainement susciter la colère des dirigeants de leur empire ; mais si nous laissons leurs poursuivants les remmener dans les profondeurs, il y a fort à parier qu'ils y seront exécutés."
 colony.71.a: "Qu'ils rejoignent notre colonie s'ils le souhaitent !"
 colony.71.b: "Nous devons éviter un incident diplomatique. Renvoyez-les d'où ils viennent."
 colony.72.name: "Anthropologues étrangers"
 colony.72.desc: "Plusieurs xénologistes de [Root.Owner.Capital.GetName] sont rentrés d'un long séjour parmi les aliens [Root.Owner.GetSubMantleLower_FR_mp] de §Y[Root.GetName]§!. Ils ont beaucoup appris de leurs usages et de leurs coutumes ancestrales, ce qui bénéficiera sans aucun doute à nos recherches sociétales."
 colony.73.desc: "Plusieurs séismes ont récemment frappé §Y[Root.GetName]§!, provoquant l'effondrement de bâtiments dans plusieurs établissements et faisant de nombreuses victimes. L'empire [Root.Owner.GetSubMantleLower_FR_ms] creuse actuellement une nouvelle grotte dans les profondeurs, afin d'y édifier une nouvelle cité, semblant avoir ainsi provoqué cette catastrophe."
 colony.73.a: "Tendez l'autre joue."
 colony.73.b: "Nous devons exiger des excuses !"
 colony.74.name: "Demande de technologie"
 colony.74.desc: "Après avoir vu les armes perfectionnées dont sont équipées nos forces de sécurité, plusieurs généraux de l'empire [Root.Owner.GetSubMantleLower_FR_ms] de §Y[Root.GetName]§! ont présenté des demandes pour que nous les fassions profiter de notre technologie militaire.\n\nNos propres officiers se montrent hésitants, car cela pourrait rendre bien plus difficile une victoire si la situation venait à dégénérer entre nous. Ceci étant, tout refus de notre part serait certainement perçu comme une insulte."
 colony.74.a: "Équiper ces sauvages d'armes modernes serait une mauvaise idée."
 colony.74.b: "Ils sont nos amis. Partageons ce que nous pouvons avec eux."
 colony.75.name: "Nouveau message"
 colony.75.desc: "Les échanges avec les aliens [Root.Owner.GetSubMantleLower_FR_mp] de §Y[Root.GetName]§! se sont raréfiés ces derniers temps, et leurs caravanes montent de plus en plus rarement jusqu'à nos établissements. Aujourd'hui, nous avons reçu un message d'un de leurs représentants militaires. Il semble quelque peu crispé..."
 colony.75.a: "Voyons voir."
 colony.76.name: "Message"
 colony.76.desc: "Surfaçeur. Nous avons essayé d'être de bons voisins, mais il apparaît clair que vous n'avez nullement l'intention de nous traiter avec le respect que mérite notre glorieuse civilisation.\n\nDès lors, notre empereur a décrété qu'il nous fallait revendiquer l'intégralité de ce monde qui nous revient de droit. Vous allez retourner dans les étoiles d'où vous venez !"
 colony.76.desc.subterranean: "Croûtiers ! Nous avons toujours tout fait pour être vus comme des voisins compréhensifs. Mais il paraît de plus en plus clair que vous n'avez aucunement l'intention de nous traiter avec le respect que mérite notre civilisation glorieuse.\n\nEn conséquence, notre empereur a décrété qu'il nous fallait revendiquer l'intégralité de ce monde, qui nous revient de plein droit. Vous allez retourner dans ce Grand Vide d'où vous venez !"
 colony.76.a: "Cela n'augure de rien de bon."
 colony.100.name: "Matériel de terraformation abandonné"
 colony.100.desc: "Depuis la création de notre première colonie sur [Root.GetName], plusieurs anomalies ont été signalées dans la biosphère de la [Root.GetPlanetMoon]. Son écosystème est instable et ne s'est pas développé conformément aux modèles projetés pour un monde de ce type. Nos scientifiques soupçonnent des interventions extérieures et ces soupçons sont désormais confirmés !\n\nPlusieurs de nos colons ont découvert un vaste complexe de terraformation construit il y a des milliers d'années. Visiblement, le matériel aurait été désactivé au beau milieu du processus de terraformation, laissant la biosphère de la [Root.GetPlanetMoon] dans l'état inachevé que nous connaissons. Moyennant une alimentation suffisante, nous pourrions réactiver ces machines. Mais nous n'avons aucune idée de ce qui en résultera..."
 colony.100.a: "Qui a bien pu construire ça ?"
 colony.101.name: "Complexe de terraformation démantelé"
 colony.101.desc: "Nos scientifiques ont terminé de démanteler le complexe de terraformation abandonné sur [Root.GetName]. Nous ne savons toujours pas qui l'a construit, mais le matériel qu'il abrite est particulièrement sophistiqué. Il devrait nous permettre de faire évoluer nos méthodes de terraformation."
 colony.102.name: "Météo instable"
 colony.102.desc: "À la suite du processus de terraformation interrompu sur [Root.GetName], la [Root.GetPlanetMoon] présente un climat quelque peu instable. De violentes tempêtes que nos modèles climatiques ne peuvent prévoir y font régulièrement rage. Une de ces tempêtes a récemment frappé une de nos importantes colonies, faisant plusieurs morts et d'importants dégâts matériels."
 colony.103.name: "Sécheresse"
 colony.103.desc: "Le climat instable de [Root.GetName] a provoqué une terrible sécheresse qui touche une grande partie de la [Root.GetPlanetMoon]. Les colons qui vivent dans ces régions ont demandé à [Root.Owner.Capital.GetName] de les aider financièrement à améliorer leurs conditions de vie."
 colony.103.a: "Ce sont les risques de la colonisation. Ils devront se débrouiller seuls."
 colony.103.b: "Donnez-leur ce qu'ils demandent."
 colony.104.desc: "Le processus de terraformation abandonné sur [Root.GetName] est enfin terminé. Après avoir envoyé dans l'atmosphère des milliards de nanites de terraformation, le matériel de bio-ingénierie alien a considérablement modifié les conditions de vie à la surface de la [Root.GetPlanetMoon]. L'écosystème et le climat sont désormais stabilisés et un nouveau biote alien adapté à ce climat a été introduit."
 colony.104.a: "Voyons ce qu'il en résultera..."
 abandoned_terraforming_completed: "Depuis sa terraformation, ce monde est devenu un habitat différent."
 colony.105.desc: "Le processus de terraformation abandonné sur [Root.GetName] est enfin terminé. Après avoir envoyé des milliards de nanites de terraformation dans l'atmosphère, le matériel de bio-ingénierie alien a considérablement modifié les conditions de vie à la surface.\n\nMais quelque chose a vraisemblablement mal tourné au moment où les nanites ont conçu le nouveau biote de la [Root.GetPlanetMoon]. Des millions de créatures difformes sont apparues. La plupart d'entre elles ont rapidement succombé, mais celles qui ont survécu se sont regroupés pour former une horde vrombissante et hurlante. Et comme si cela ne suffisait pas, elles semblent converger vers nos principales colonies."
 colony.105.a: "C'est un cauchemar !"
 terraforming_mutants_attack: "Les créatures mutantes attaquent nos colons !"
 colony.106.desc: "Le processus de terraformation abandonné sur [Root.GetName] est enfin terminé. Après avoir envoyé des milliards de nanites de terraformation dans l'atmosphère, le matériel de bio-ingénierie alien a considérablement modifié les conditions de vie à la surface de la [Root.GetPlanetMoon]. L'écosystème et le climat sont désormais stabilisés et un nouveau biote alien adapté à ce climat a été introduit.\n\nPar chance, la [Root.GetPlanetMoon] est aujourd'hui un véritable paradis pour [Root.Owner.GetSpeciesNamePlural] ! Le nouveau climat semble mieux adapté à notre espèce plutôt qu'à celle de [Root.Owner.Capital.GetName]."
 colony.107.desc: "La terraformation de [Root.GetName], qui avait été abandonnée en plein cours, a enfin été achevée. Et cela s'est traduit par un véritable cauchemar ! Les aliens qui avaient conçu ce matériel de terraformation devaient avoir une physiologie radicalement différente de la nôtre, car la proportion d'ozone dans l'atmosphère de la [Root.GetPlanetMoon] a été drastiquement réduite afin de permettre l'installation de formes de vies nécessitant d'importantes radiations ultra-violettes.\n\nDes millions de colons y ont perdu la vie."
 colony.107.desc.nuked_pref: "La terraformation de [Root.GetName], qui avait été abandonnée en plein cours, a enfin été achevée. Quelle que soit la forme de vie alien qui avait conçu ce matériel, sa physiologie devait être similaire à la nôtre : la [Root.GetPlanetMoon] possède maintenant une atmosphère constituée pour l'essentiel d'azote et d'oxygène et permet d'importantes radiations de surface - devenant dans les faits un §Ymonde mort§!.\n\nFort heureusement, les [Root.Owner.GetSpeciesNamePlural] sont précisément adaptés pour vivre dans des conditions aussi extrêmes."
 colony.107.a: "C'est une catastrophe !"
 colony.107.a.tooltip: "§HChaque§! §Y£pop£pop mécanique§! §Hprésente sur [Root.GetName] sans§! §Ypréférence pour les mondes morts§! §Hmeurt.§!"
 colony.108.name: "Créatures vaincues"
 colony.108.desc: "Nous avons combattu les hordes de créatures qui ont attaqué nos colonies sur [From.From.GetName]. Leurs cadavres en putréfaction jonchent désormais les abords de nos fortifications et nos forces de sécurité évacuent actuellement la biomasse putride dans des décharges creusées à la hâte.\n\nCertaines matières génétiques intéressent nos scientifiques et les échantillons qu'ils ont prélevés devraient faciliter les recherches biologiques à venir."
 colony.109.name: "Créature prédatrice"
 colony.109.desc: "Sur [Root.GetName], nos colons continuent de rencontrer ça et là les survivants des créatures mutantes apparues au terme du processus de terraformation de la [Root.GetPlanetMoon]. La plupart d'entre elles sont inoffensives et les forces de la milice locale en viennent à bout, mais une de ces créatures sème la terreur dans nos colonies isolées. Elle traque nos citoyens et des dizaines de disparitions inexpliquées ont été signalées.\n\nLes restes mutilés de l'équipe de sécurité dépêchée sur place afin d'enquêter ont récemment été découverts, incitant les responsables de la colonie à demander un appui militaire extérieur."
 colony.109.a: "Cette créature doit être traquée et tuée !"
 colony.110.desc: "Après d'intenses recherches, nos forces présentes sur [From.From.GetName] ont réussi à débusquer la créature mutante qui massacrait nos colons. Une équipe des forces spéciales s'est aventurée dans son repaire et l'a éliminée au terme d'un combat acharné. Les restes de centaines de colons mutilés y ont été retrouvés, de même qu'une demi-douzaine de survivants traumatisés qui s'apprêtaient à être dévorés.\n\nLa tête surdimensionnée de la créature a été coupée et est devenue le symbole régimentaire des forces directement impliquées dans son élimination."
 colony.111.name: "Disparition de la créature"
 colony.111.desc: "La créature mutante qui traquait les colons de [Root.GetName] s'est volatilisée et aucune nouvelle disparition n'est à déplorer. Il est possible que la créature soit morte d'elle-même, de vieillesse ou étouffée après avoir dévoré un de nos colons.\n\nLa population de [Root.GetName] est soulagée de constater que ce cauchemar est terminé, mais regrette que nous n'ayons pas été en mesure de la protéger."
 colony.111.a: "Nous aurions peut-être pu en faire davantage..."
 colony.112.name: "Apparitions de la créature en hausse"
 colony.112.desc: "Sur [Root.GetName], les apparitions de la créature qui s'attaque à nos colons se multiplient, de même que les disparitions parmi la population. Le fait que plusieurs créatures aient été vues en même temps indique clairement que la créature d'origine s'est reproduite.\n\nDes essaims de ces abominations errent désormais à découvert, massacrant sans distinction nos colons dans les régions rurales de [Root.GetPlanetMoon]. Si nous n'agissons pas au plus vite, la colonie tout entière sera décimée !"
 colony.112.a: "Cela ne cessera donc jamais !"
 colony.113.name: "Les mutants ont décimé [From.From.GetName]"
 colony.113.desc: "Sur [From.From.GetName], l'attaque des créatures mutantes a décimé nos forces principales ! Celles-ci errent désormais librement dans la colonie tout entière, massacrant nos colons en toute impunité. Des survivants auraient fui les colonies pour se cacher dans la campagne, mais ce n'est qu'une question de temps avant que les créatures en maraude ne les débusquent."
 colony.113.a: "Nous devons dépêcher des renforts militaires sur place !"
 colony.114.name: "Libération de [From.From.GetName]"
 colony.114.desc: "Nos corps expéditionnaires ont libéré [From.From.GetName] des montres mutants qui occupaient nos principales colonies. Leurs cadavres en putréfaction jonchent désormais le sol et nos troupes évacuent actuellement la biomasse putride dans des décharges creusées à la hâte.\n\nDes poches de survivants apparaissent ça et là sur la [From.From.GetPlanetMoon], mais les victimes sont nombreuses."
 colony.114.a: "L'heure de la reconstruction a sonné."
 colony.150.name: "Abri souterrain"
 colony.150.desc: "Les études géologiques menées par nos colons sur [Root.GetName] ont révélé la présence d'un immense abri enseveli sous une chaîne montagneuse. Tout porte à croire qu'il s'agit d'une sorte d'abri antiatomique construit par la même espèce que celle qui a péri lors de l'ancienne guerre nucléaire de la [Root.GetPlanetMoon].\n\nDes siècles durant, cet abri est resté fermé, mais nos instruments y ont récemment détecté une faible signature. Nos scientifiques sont impatients d'ouvrir cet abri pour découvrir ce qui se cache derrière ses portes blindées."
 colony.150.a: "Ouvrons cette chose !"
 colony.150.b: "Il vaudrait mieux ne pas toucher à cette chose."
 colony.151.desc: "Notre expédition scientifique a finalement réussi à ouvrir l'abri situé sur [Root.GetName], mais n'y ont rien trouvé d'autre que d'anciens squelettes mammaliens. Il y a quelque 200 ans, les occupants de cet abri auraient manqué de nourriture et sombré dans ce qui s'apparente à une sorte de frénésie cannibale. Les ossements dispersés ça et là, dont bon nombre ont été rognés, dressent un sombre tableau des derniers instants vécus par les survivants de cette civilisation jadis glorieuse.\n\nPoint positif, les journaux et autres bibliothèques de données trouvés dans l'abri promettent d'occuper nos scientifiques comportementaux et nos xéno-psychologues pendant des années."
 colony.151.b.evopred: "Ces os sont encore bons à manger"
 colony.152.desc: "Le grand abri de [Root.GetName] a été ouvert. À la surprise de nos scientifiques, le vaste complexe situé derrière les portes de l'abri renfermait les millions de survivants d'une ancienne guerre nucléaire qui a jadis ravagé le monde. Malgré leurs ressources limitées, ils ont réussi à subvenir à leurs besoins pendant des siècles. Au départ, ils se sont méfiés de nos scientifiques car c'était la première fois qu'ils rencontraient des étrangers, mais ils nous étaient aussi reconnaissants d'avoir ouvert l'abri.\n\nCe dernier contient d'importants stocks de matériel et de machines spécifiquement conçus pour rebâtir leur civilisation après un holocauste nucléaire. Seuls ces aliens sont en mesure de les utiliser, mais ils semblent prêts à rejoindre vos colons après s'être à nouveau accoutumés à la lumière du soleil."
 colony.152.a: "Reconstruisons ce monde ensemble."
 colony.152.b: "Excellent. Préparez les colliers à esclaves !"
 colony.152.b.tooltip: "Ces pops vont être asservies."
 colony.152.c: "Enfermez à nouveau cette vermine alien dans l'abri et ensevelissez son entrée."
 colony.153.desc: "Nos scientifiques ont enfin réussi à ouvrir l'ancien abri de [Root.GetName] et y ont découvert des hordes de mutants, les abominations des habitants d'origine. En quelques secondes, ces créatures ont éliminé l'équipe scientifique avant de se volatiliser dans la nature. Des milliers de colons ont été massacrés et des colonies entières sont tombées aux mains de cette horde féroce. Nous avons fortifié les villes restantes et établi des périmètres défensifs, mais cela risque de ne pas suffire !\n\n"
 colony.153.a: "Activez les défenses !"
 colony.155.name: "Bombe atomique"
 colony.155.desc: "Alors qu'ils exploraient les ruines situées près d'un de nos principaux campements de [Root.GetName], plusieurs colons ont malencontreusement activé le compte à rebours d'une bombe à hydrogène datant de la précédente guerre nucléaire de la [Root.GetPlanetMoon]. Avec ses 35 mégatonnes, l'explosion de cette bombe pourrait décimer plusieurs centres de population. Elle n'est pas assez stable pour être déplacée et il est trop tard pour évacuer toute la région."
 colony.155.a: "Nous devons la désamorcer !"
 colony.156.desc: "Nous avons désamorcé la bombe à hydrogène sur [From.From.GetName] ! Elle a été mise au rebut et des équipes spécialisées balaient actuellement la surface de la [From.From.GetPlanetMoon] pour trouver, le cas échéant, d'autres bombes du genre, et éviter qu'un nouvel incident de ce type ne se produise."
 colony.156.a: "Nous l'avons échappé belle."
 colony.157.desc: "Les membres de notre équipe spécialisée n'ont pas réussi à désamorcer à temps la bombe à hydrogène trouvée sur [From.From.GetName]. Ils ont été tués dans son explosion, de même que tous les êtres vivants présents dans un rayon de 100 kilomètres. Impossible de comptabiliser les morts, qui sont aussi les dernières victimes d'une guerre inutile commencée il y a un millénaire."
 colony.157.a: "C'est une catastrophe !"
 colony.160.name: "Accélérateur de particules hors service"
 colony.160.desc: "Nous avons découvert sur §Y[Root.GetName]§! ce qui ressemble aux vestiges d'un gigantesque accélérateur de particules. Il a été trouvé dans une région toujours radioactive constellée de cratères, ce qui laisse à penser que cet accélérateur était considéré une cible stratégique de grande importance lors de la guerre nucléaire qui a ravagé la [Root.GetPlanetMoon].\n\nPlusieurs journaux de recherche ont été récupérés, tous rédigés par la scientifique en charge de l'accélérateur. Même si la technologie de sa civilisation était plutôt primitive, certaines recherches et formules théoriques décrites dans ces journaux sont particulièrement élaborées, même selon nos propres normes. Nos physiciens ont donc commencé à les étudier."
 colony.161.name: "Infrastructure intacte"
 colony.161.desc: "L'infrastructure intacte malgré la grande guerre nucléaire qui a dévasté [Root.GetName] s'est révélée être une aubaine pour nos colons. La civilisation alien qui vivait autrefois ici y a construit des routes pour desservir ses principaux centres de population et certaines sont en assez bon état pour être utilisées. Nous avons également réussi à recycler une vaste quantité de matériaux de construction trouvés dans les ruines qui ponctuent le paysage, ce qui permettra d'améliorer l'infrastructure de notre colonie.\n\n"
 colony.162.name: "Station spatiale abandonnée"
 colony.162.desc: "Une petite équipe venue de notre colonie de [Root.GetName] s'est récemment installée dans une ancienne station spatiale mise en orbite par les premiers habitants de la [Root.GetPlanetMoon]. Les corps momifiés de son équipage sont toujours visibles par les hublots situés en face de la [Root.GetPlanetMoon]. Ils ont dû comprendre qu'ils étaient condamnés en voyant des nuages en forme de champignon se former plus bas et l'historique des communications indique que les astronautes ont essayé en vain d'entrer en contact avec la surface avant de finir par manquer de vivres.\n\nEn bon état, la station a permis à nos ingénieurs de découvrir les premiers stades d'un programme spatial planétaire. Ils y ont découvert des solutions certes primitives mais ingénieuses utilisées pour concevoir la station."
 colony.162.b.evopred: "Par chance, ces restes n'ont pas été contaminés par les radiations"
 colony.163.name: "Radiation des zones désertiques"
 colony.163.desc: "Les niveaux de radiation de certaines zones désertiques de [Root.GetName] semblent supérieurs à ceux détectés lors de nos précédentes analyses. Les habitants de plusieurs colonies locales se sont plaints de problèmes de santé et d'une baisse de la natalité. Nous prenons les mesures qui s'imposent pour évacuer les régions concernées, mais cela prend du temps."
 colony.164.name: "Mouvement pacifiste"
 colony.164.desc: "Les ruines et les étendues désolées trouvés sur [Root.GetName] semblent avoir conduit bon nombre de colons de la [Root.GetPlanetMoon] à adopter une philosophie pacifiste. Les partisans de ce nouveau mouvement affirment que l'environnement dans lequel ils vivent leur rappelle quotidiennement les horreurs insensées de la guerre. Ils estiment qu'il est de leur devoir civique d'éviter que la terrible destruction dont a été victime [Root.GetName] ne touche d'autres mondes."
 colony.164.a: "Vraiment ?"
 colony.164.b: "Ces misérables lâches sont la honte de notre nation !"
 colony.164.c: "Excellent. La paix doit être privilégiée."
 colony.164.a.tooltip: "Jusqu'à §Y400§! £pop£§Hpops§! de §H[Root.GetName]§! renoncent à l'éthique §Ymilitariste§! et deviennent §Ypacifistes§!."
 colony.170.name: "Débris orbitaux"
 colony.170.desc: "L'espace orbital autour de [Root.GetName] est encombré de débris abandonnés par la civilisation alien qui vivait jadis sur la [Root.GetPlanetMoon]. Avant de disparaître, leurs programmes spatiaux ont procédé au lancement de milliers de satellites primitifs et de plates-formes de lancement de missiles. Nombre d'entre eux ont été détruits par des armes anti-satellites lors de la terrible guerre nucléaire de la [Root.GetPlanetMoon], ce qui a eu pour effet de multiplier les débris spatiaux.\n\nNotre colonie s'est développée au point que cet épais champ de débris interfère avec son infrastructure. Nous ne pouvons pas utiliser de satellites et les vols orbitaux civils se limitent à d'étroites fenêtres."
 colony.170.a: "Il faudrait peut-être faire quelque chose."
 colony.171.name: "Crash d'un cargo"
 colony.171.desc: "Un cargo civil en route pour [Root.GetName] est entré en collision avec un épais nuage de débris orbitaux qui se déplaçaient à vive allure ! Les membres d'équipage ont été tués sur le coup et leur vaisseau a plongé dans l'atmosphère avant de s'écraser près d'un des principaux relais d'alimentation de la colonie. L'explosion qui a suivi a fait plusieurs victimes et l'infrastructure locale a été considérablement endommagée."
 colony.171.desc.mach: "Une unité cargo en route pour [Root.GetName] a été perforée par un épais nuage de débris orbitaux qui se déplaçaient à vive allure. Les unités de bord ont été instantanément détruites, et le vaisseau a plongé dans l'atmosphère, avant de s'écraser près d'un des principaux relais d'alimentation de la colonie. L'explosion de l'appareil a détruit plusieurs unités au sol, et les infrastructures sur place ont été considérablement endommagées."
 colony.171.a: "Quelle malchance...!"
 colony.172.name: "Impact de débris"
 colony.172.desc: "Une série de collisions dans l'épaisse couche de débris qui entoure [Root.GetName] a récemment modifié l'orbite d'un gigantesque engin spatial. Celui-ci, apparemment une des nombreuses plates-formes de lancement de missiles utilisées lors de la guerre nucléaire de la [Root.GetPlanetMoon], a été aspiré par l'atmosphère avant d'entrer en collision avec l'une des plus importantes colonies. Les premiers rapports font état de nombreuses victimes."
 colony.172.a: "Nous devons faire quelque chose au sujet de ces débris."
 colony.173.desc: "Avec l'aide de notre vaisseau scientifique, les autorités coloniales de [From.From.GetName] ont terminé de nettoyer l'espace orbital de la [From.From.GetPlanetMoon]. Les satellites et les vaisseaux civils peuvent à nouveau s'y déplacer en toute sécurité."
 colony.174.desc: "Avec l'aide de notre vaisseau scientifique, les autorités coloniales de [From.From.GetName] ont terminé de nettoyer l'espace orbital de la [From.From.GetPlanetMoon]. Les satellites et les vaisseaux civils peuvent à nouveau s'y déplacer en toute sécurité.\n\nComme nous nous en doutions, la plupart des débris étaient composés de minéraux précieux provenant de la surface de la [Root.GetPlanetMoon] et utilisés lors de la construction des satellites. Nous en avons récupéré une bonne partie et réalisé, au passage, un profit non négligeable."
 colony.180.name: "Astéroïde repéré"
 colony.180.desc: "Les systèmes de surveillance de l'espace intersidéral de [Root.GetName] ont fait une découverte alarmante ; un gigantesque astéroïde se dirige droit sur la [Root.GetPlanetMoon] ! Les conséquences d'une collision seraient catastrophiques.\n\nL'astéroïde doit être détruit avant qu'il ne soit trop tard !"
 colony.180.a: "C'est un mauvais présage..."
 colony.180.b: "Bien reçu"
 colony.182.name: "Astéroïde détruit"
 colony.182.desc: "L'astéroïde qui se rapprochait à toute allure de §Y[Root.GetName]§! a été détruit ! Soulagés d'avoir échappé à la mort, les citoyens de toute la [Root.GetPlanetMoon] sont descendus dans les rues pour crier leur joie.\n\nUne analyse des fragments de ce corps céleste a également révélé qu'il était pour l'essentiel composé de minéraux précieux. Nous avons récupéré tout ce que nous pouvions."
 colony.182.desc.mach: "L'astéroïde qui se rapprochait à toute allure de §Y[Root.GetName]§! a été détruit ! Aucune unité ou structure de la [Root.GetPlanetMoon] n'a été détruite, les débris de l'astéroïde étant suffisamment petits pour se désintégrer à leur entrée dans l'atmosphère.\n\nUne analyse des fragments de ce corps céleste a également révélé qu'il était pour l'essentiel composé de minéraux précieux. Nous avons récupéré tout ce que nous pouvions."
 colony.183.name: "Collision de l'astéroïde avec [Root.GetName]"
 colony.183.desc: "Nous n'avons pas réussi à stopper à temps l'astéroïde qui se dirigeait droit sur [Root.GetName]. Il est entré en collision avec la [Root.GetPlanetMoon], entraînant une terrible catastrophe. Les morts se comptent par millions."
 colony.183.desc.mach: "Nous ne sommes pas parvenus à stopper à temps cet astéroïde qui se dirigeait droit sur [Root.GetName]. Il s'est écrasé à la surface de la [Root.GetPlanetMoon], causant de graves dégâts et des destructions considérables. Des millions d'unités sont désormais inopérantes."
 colony.183.a: "C'est un jour noir."
 colony.185.name: "Monde consommé"
 colony.185.desc: "Nous avons maintenant tant consommé §Y[Target.GetName]§! qu'une réaction en chaîne s'est lancée, déstabilisant son noyau. Tous les drones ont été évacués vers [Target.Owner.Capital.GetName]."
 colony.185.a: "Nous avons encore faim"
 colony.185.a.tooltip: "La [From.GetPlanetMoon] §Y[From.GetName]§! est détruite."
 ####################################
 #Precursor Events
 ####################################
 vultaum_artifact: "Nous avons mis la main sur un artefact vultaum."
 precursor.completed.name: "Projet archéologique terminé"
 precursor.completed.a: "Intéressante découverte"
 precursor.1.name: "Groupement stellaire vultaum"
 precursor.1.desc: "Nous avons retrouvé sur §Y[From.GetName]§! des artefacts d'une ancienne civilisation alien ! À en juger par leur datation, ils indiquent qu'elle était active dans cette région de l'espace il y a quelque 12 millions d'années.\n\nD'après les éléments recueillis, nos scientifiques estiment que ces aliens, qui formaient ce qu'ils appelaient eux-mêmes « l'Assemblée stellaire vultaum », étaient des annélides dont la taille avoisinait les 3 à 4 mètres et qui communiquaient entre eux par des vibrations émises le long de leurs corps segmentés."
 precursor.5.name: "Base minière vultaum"
 precursor.5.desc: "Les vestiges d'une petite base minière d'hélium 3 vultaum ont été trouvés au fond d'un immense cratère de [From.GetName]. L'explosion à l'origine de ce cratère semble avoir eu lieu à l'intérieur de l'installation. À moins de techniques minières radicalement différentes des nôtres, ni une défaillance du matériel ni un accident ne peut expliquer une explosion de cette ampleur."
 precursor.6.desc: "Nous avons miraculeusement réussi à récupérer des éléments du centre de données vultaum à proximité du cratère de [From.From.GetName]. La plupart de ces données sont corrompues, mais nos scientifiques ont réussi à traduire le « korga » - l'unité de temps de base des Vultaums."
 precursor.10.name: "Observatoire vultaum"
 precursor.10.desc: "Un ancien observatoire vultaum a été découvert à la surface de [From.GetName]. Le système [From.GetStarName] est relativement éloigné de la région spatiale dont sont originaires les Vultaums et cette installation semble avoir été principalement utilisée pour observer leurs propres étoiles.\n\nNous avons analysé les données restantes, mais n'avons trouvé aucun indice sur les motivations exactes des Vultaums qui se livraient à ces observations."
 precursor.11.desc: "Les fouilles archéologiques menées sur §Y[From.From.GetName]§! ont permis de découvrir une petite peinture murale dans l'une des plus petites des pièces poussiéreuses de l'observatoire. Elle semble représenter plusieurs constellations vues depuis le monde natal des Vultaums. Toutefois, nos astronomes n'ont pas été en mesure d'en identifier les étoiles."
 precursor.15.name: "Colonie vultaum"
 precursor.15.desc: "Le [Root.GetName] a découvert les vestiges partiels d'un ascenseur spatial vultaum qui s'était effondré dans une des régions équatoriales de [From.GetName]. Apparemment, cet ascenseur aurait été volontairement sectionné au niveau de son contrepoids au-delà de l'orbite géostationnaire, entraînant la chute du câble au-dessus de plusieurs grands centres urbains le long de l'équateur. À en juger par les ruines, cette catastrophe a dû faire des millions de morts."
 precursor.16.desc: "Sur §Y[From.From.GetName]§!, nos archéologues ont réussi à récupérer une carte stellaire partielle près d'un segment cassé du câble de l'ascenseur. Elle était visiblement utilisée par les capitaines de la marine marchande vultaum et révèle quelques-unes de leurs routes commerciales interstellaires les plus lucratives."
 precursor.20.desc: "À la surface de [From.GetName], plusieurs grands lacs circulaires sont le résultat d'une série de gigantesques explosions d'antimatière survenues il y a quelques millions d'années. À l'époque, cette [From.GetPlanetMoon] était habitée par les Vultaums et les cratères se concentrent dans la région qui abritait leurs plus grandes colonies planétaires.\n\nL'équipe scientifique du [Root.GetName] a écarté la thèse d'un bombardement orbital, ce qui laisse à penser que ces explosions ont été déclenchées par quelqu'un ou quelque chose au sol."
 precursor.21.desc: "Les archéologues envoyés sur §Y[From.From.GetName]§! ont réussi à récupérer la mémoire centrale d'un terminal retrouvé à l'intérieur d'une installation médicale en ruine. Elle contenait d'intéressantes statistiques, telles que l'espérance de vie des Vultaums (environ 270 ans), ainsi qu'une liste des maladies les plus courantes dont ils souffraient."
 precursor.25.desc: "Une analyse approfondie de [From.GetName] a permis de découvrir un vaste réseau de tunnels artificiels sous la surface de la [From.GetPlanetMoon]. La plupart de ces tunnels se sont effondrés et les membres d'équipage du [Root.GetName] pensent qu'il s'agit là de l'infime partie d'une bien plus grande colonie vultaum souterraine.\n\nLes principales grottes souterraines ont été volontairement détruites et les villes vultaums, de même que leurs habitants ont péri sous des millions de tonnes de roche."
 precursor.26.desc: "Les fouilles archéologiques menées sur §Y[From.From.GetName]§! ont permis de découvrir des corps de Vultaums fossilisés, dans l'une des chambres les plus proches de la surface. Nos scientifiques ont ainsi pu se faire une idée plus précise de ce à quoi ils ressemblaient."
 precursor.30.name: "Installation sur la géante gazeuse vultaum"
 precursor.30.desc: "Nous avons détecté les vestiges partiels d'une station d'extraction de gaz probablement d'origine vultaum en orbite autour de [From.GetName]. Ses propulseurs stationnaires ont été volontairement désactivés il y a plusieurs millions d'années pour tenter de la pousser vers la géante gazeuse, mais une collision avec un objet non identifié en a décidé autrement."
 precursor.31.desc: "Nos archéologues ont récupéré une combinaison spatiale vultaum quasiment intacte qui avait échappée aux précédents pilleurs. Cette combinaison tubulaire de quatre mètres de long a permis à nos scientifiques d'en savoir plus sur les environnements privilégiés des Vultaums."
 precursor.35.name: "Comptoir commercial vultaum"
 precursor.35.desc: "[From.GetName] abritait autrefois un petit avant-poste vultaum utilisé pour commercer avec plusieurs civilisations voisines. Cet avant-poste a semble-t-il ensuite été transformé en mission religieuse où les Vultaums ont tenté de convertir les marchands étrangers à leur philosophie. Leurs relations commerciales ont cessé peu après et la [From.GetPlanetMoon] a fini par être abandonnée."
 precursor.36.desc: "Les archéologues envoyés sur §Y[From.From.GetName]§! ont récupéré un petit pamphlet numérique vultaum. Visiblement, les missionnaires de cet avant-poste remettaient ce genre de pamphlet aux marchands qui leur rendaient visite. Les données récupérées sont pour la plupart corrompues, mais celles qui sont intactes font référence à un « grand mensonge » et aux « entraves de la réalité virtuelle »."
 precursor.40.name: "Satellite vultaum"
 precursor.40.desc: "Un petit satellite vultaum a été découvert au-dessus de §Y[From.GetName]§!. Il avait été paramétré pour diffuser continuellement le même message, jusqu'à ce que sa source d'alimentation s'épuise, il y a des millions d'années. Nous avons retrouvé le dispositif de l'émetteur, mais seule une petite partie de la transmission était récupérable.\n\nL'objectif principal du satellite était apparemment de faire l'apologie de la philosophie vultaum auprès des civilisations voisines, disant qu'il était nécessaire de « se déconnecter » et d'« embrasser l'existence réelle ». Difficile malgré tout de savoir de quoi il s'agissait réellement."
 precursor.41.desc: "L'analyse minutieuse de l'émetteur vultaum a permis à nos archéologues et à nos ingénieurs d'en conclure que cet équipement ne contient aucune technologie susceptible de nous être utile. Néanmoins, ce projet nous aura permis de mieux comprendre le langage de programmation primaire des Vultaums, en espérant que cela nous aidera à mieux déchiffrer leurs données à l'avenir."
 precursor.45.name: "Colonie dissidente vultaum"
 precursor.45.desc: "[From.GetName] abritait une petite colonie vultaum unique en son genre et ce, pour deux raisons : le système [From.GetStarName] ne se trouve pas dans ce qui constituait jadis l'espace vultaum et les ruines ont plusieurs siècles de moins que tous les autres vestiges laissés par leur civilisation. La colonie semble avoir été fondée par une sorte de groupe dissident qui rejetait la philosophie dominante de leur société."
 precursor.46.desc: "Plusieurs artefacts découverts lors des fouilles archéologiques menées sur §Y[From.From.GetName]§! portent des inscriptions qui rejettent catégoriquement le précepte philosophique vultaum selon lequel « la vie elle-même est un mensonge ». Un d'entre eux semble être une sorte d'hommage dédié à la race vultaum tout entière. Cela confirmerait la théorie selon laquelle cette colonie dissidente a perduré quelque temps après l'effondrement du reste de l'Assemblée stellaire."
 precursor.50.name: "Centre de réalité virtuelle vultaum"
 precursor.50.desc: "À un moment, les ingénieurs vultaums ont construit un gigantesque complexe orbital dédié à la recherche informatique à proximité de [From.GetName]. Curieusement, ils semblent avoir ignoré le domaine pourtant populaire de l'intelligence artificielle pour se concentrer exclusivement sur les réalités virtuelles et les simulations informatiques de masse. L'essentiel du complexe a été détruit par des tirs d'armes et des micrométéorites, mais ce qu'il en reste est dans un état remarquable compte tenu de l'âge de la station."
 precursor.51.desc: "Les archéologues qui explorent le complexe orbital vultaum au-dessus de §Y[From.From.GetName]§! ont fait une découverte très intéressante : ils ont réussi à récupérer la copie partielle de ce qui ressemble à un jeu de réalité virtuelle multijoueur, pratiqué par des milliards de Vultaums dans tout leur empire.\n\nMême s'il a pour cadre une version très romancée et satirique de la société de l'époque, il constitue une source d'informations inestimable sur leur langue et leurs coutumes."
 precursor.55.name: "Base minière d'astéroïde vultaum"
 precursor.55.desc: "[From.GetName] présente de nombreux cratères provoqués par des collisions entre astéroïdes, mais l'un d'entre eux se distingue des autres ; il semble avoir été créé par la détonation d'un dispositif antimatière. À d'autres endroits, il apparaît clair que la surface de l'astéroïde a été lourdement exploitée par les Vultaums il y a quelque 12 millions d'années. Le vaste cratère découvert correspondait vraisemblablement à l'emplacement de leur avant-poste minier."
 precursor.56.desc: "Un examen approfondi de l'ancienne base minière vultaum de §Y[From.From.GetName]§! a permis de repérer du matériel abandonné dans un tunnel intact. Spécifiquement conçu pour s'adapter à leur anatomie annélide, celui-ci semblait fonctionner grâce aux vibrations corporelles qu'ils utilisaient pour communiquer."
 precursor.100.name: "Système natal vultaum localisé"
 precursor.100.desc: "Après avoir minutieusement examiné les artefacts vultaums récupérés, les scientifiques de [Root.Capital.GetName] en ont déduit les coordonnées galactiques exactes de Vultaumar, le système natal de l'ancienne civilisation vultaum ! Nous devrions y lancer une expédition avant que quelqu'un ne nous double."
 precursor.100.a: "Contactons le vaisseau scientifique le plus proche !"
 precursor.101.name: "Le monde natal des Vultaums"
 precursor.101.desc: "Les vestiges éparpillés à la surface du monde natal des Vultaum indiquent qu'il a subi une extinction totale il y a 12 millions d'années, causée par l'explosion d'un dispositif antimatière. Nous avons pu déduire des ruines de la [From.From.GetPlanetMoon] que la société vultaum avait connu une évolution idéologique radicale, un siècle environ avant sa disparition.\n\nSelon leur vision nouvelle, l'univers tout entier n'était qu'une gigantesque réalité virtuelle, à laquelle avaient été connectés contre leur souhait tous les êtres doués de raison, afin de satisfaire aux désirs d'une puissance supérieure quelconque. Les Vultaum se sont alors consacrés à élaborer, encore et encore, des manières de se « déconnecter » de force de cette simulation, bon nombre des procédés envisagés comprenant notamment un suicide collectif.\n\nLeurs conclusions finales étaient que seule la « déconnexion » simultanée de plusieurs milliards d'individus pourrait suffisamment déstabiliser le système pour leur permettre de recouvrer leur liberté. À une heure convenue, tous les Vultaum se sont donc donné la mort. Ceux qui refusèrent de prendre part à cet acte n'étaient pas suffisamment nombreux pour assurer la survie de leur espèce, aussi les Vultaum furent-ils progressivement relégués dans l'anonymat, avant de disparaître complètement."
 precursor.102.name: "Monde natal des Vultaums découvert"
 precursor.102.desc.a: "Nous avons enfin découvert le monde natal des Vultaum. Hélas, nous arrivons trop tard. La [From.From.GetPlanetMoon] a récemment été fouillée et il n'y reste plus rien de valeur."
 precursor.102.desc.b: "D'après les données tirées de son analyse, ce monde abritait autrefois l'ancienne civilisation de ceux qui s'appelaient eux-mêmes les « Vultaum ». Mais il est visible que des voyageurs stellaires y sont passés récemment... La [From.From.GetPlanetMoon] a déjà été fouillée, et il n'y reste plus rien de valeur."
 precursor.500.name: "L'Empire yuth"
 precursor.500.desc: "Nous avons récupéré des artefacts provenant d'une ancienne civilisation alien de [From.GetName] ! D'après l'âge des artefacts retrouvés sur place, nos scientifiques estiment que ces aliens ont vécu dans la région il y a quelque six millions d'années. Les Yuhts, comme ils se faisaient appeler, ressemblaient à des arthropodes, très grands et plats.\n\nÀ l'âge adulte, un seul spécimen pouvait apparemment atteindre une centaine de mètres de long et il était visiblement rare que plus de deux ou trois Yuhts voyagent ensemble dans le même vaisseau spatial. "
 precursor.505.name: "Écloserie yuht"
 precursor.505.desc: "Il y a longtemps, [From.GetName] a été la cible d'un terrible bombardement orbital durant lequel la biosphère a subi des dégâts catastrophiques. La [From.GetPlanetMoon] aurait apparemment abrité un petit avant-poste construit par les anciens Yuhts, mais la raison pour laquelle cela aurait justifié la destruction du monde tout entier demeure un mystère."
 precursor.506.desc: "Après avoir longuement étudié §Y[From.From.GetName]§!, nous savons maintenant que la [From.From.GetPlanetMoon] était l'un des « mondes-écloseries » de l'Empire yuht. Son Ministre de la procréation préparait les mondes en les débarrassant des prédateurs et de tout autre élément potentiellement nuisible avant de déposer des oeufs à la surface.\n\nLes jeunes yuhts devaient se débrouiller seuls dans cet environnement relativement protégé pendant plusieurs siècles, jusqu'à avoir presque atteint un niveau d'intelligence élémentaire. Ce n'est qu'à ce moment-là qu'ils étaient récupérés et soigneusement introduits dans la société."
 precursor.510.name: "Poste d'écoute des Yuhts"
 precursor.510.desc: "Nous avons découvert d'importants dispositifs d'écoute sur [From.GetName]. Ces dispositifs remontent à plusieurs millions d'années et nous pensons qu'ils ont été conçus par les Yuhts, même s'ils semblent avoir été réutilisés pour les besoins d'une autre civilisation alien au cours des 500 000 dernières années. Les gigantesques paraboles de réception ne sont pas réparables, mais quelques terminaux sont toujours intacts."
 precursor.511.desc: "Les archéologues envoyés sur §Y[From.From.GetName]§! ont découvert que les dispositifs d'écoute construits ici servaient à rechercher dans l'espace d'éventuels signes d'une vie alien intelligente - ce que les Yuhts n'ont jamais trouvé.\n\nAprès avoir partiellement rétabli l'alimentation d'un terminal, les archéologues ont récupéré un disque de données contenant les journaux des capteurs pour une période de plusieurs siècles. D'après ces fichiers, cette partie de la galaxie était effectivement dépourvue de vie douée de raison à l'époque de l'Empire yuht."
 precursor.515.name: "Colonie yuht"
 precursor.515.desc: "Les ruines de plusieurs dizaines d'arcologies yuht sont visibles dans l'hémisphère sud de §Y[From.GetName]§!, ce qui indique que cette [From.GetPlanetMoon] abritait l'une de leurs principales colonies.\n\nÀ l'intérieur d'un des bâtiments en ruines, notre équipe au sol a découvert ce qui semble être un musée consacré aux « plus célèbres supercheries relatives aux aliens ». Il renferme plusieurs artefacts récupérés par les Yuht dans tout leur empire, censés prouver l'existence d'une vie alien douée de raison. Dans tous les cas, le musée a présenté ces artefacts comme des supercheries."
 precursor.516.desc: "La plupart des artefacts exposés dans les musées yuhts de §Y[From.From.GetName]§! ont disparu, mais nos archéologues ont réussi à mettre la main sur un ce qui était présenté comme un faux. Il semble qu'il s'agissait d'un instrument utilisé pour mesurer les radiations cosmiques, et les archéologues ont confirmé qu'il remonte à plusieurs millions d'années avant l'apparition des Yuhts. Contrairement à l'idée véhiculée par le musée yuht, donc, cet artefact alien semble authentique."
 precursor.520.desc: "Des signes de développement yuht sont omniprésents sur [From.GetName] et la [From.GetPlanetMoon] n'a dû faire l'objet que d'une terraformation limitée. Une région de l'hémisphère nord ressemble à un cimetière géant. Les environs n'abritent aucune colonie yuht, mais de nombreux monuments attestent de la présence de sites funéraires.\n\nAvec une faible natalité et une espérance de vie moyenne proche d'un millier d'années, la mort de chaque Yuht relevait d'un grand événement et les cérémonies funéraires revêtaient une certaine importance."
 precursor.521.desc: "Les fouilles archéologiques menées sur [From.From.GetName] ont révélé que la plupart des tombes ont été pillées au cours des millions d'années qui ont suivi leur construction, très certainement parce que les Yuhts avaient pour coutume d'enterrer leurs morts avec des bijoux et d'autres objets précieux. Parmi les vestiges, les archéologues ont trouvé une grande poupée ressemblant à un Yuht adulte et qui, selon nos chercheurs, était utilisée en guise de porte-bonheur ou pour le souvenir."
 precursor.525.desc: "[From.GetName] a été le théâtre d'une terrible guerre entre les Yuhts et une autre espèce dont nous ne savons pas grand-chose. Cette guerre a eu lieu lors des dernières années de l'Empire yuth et même si cela remonte à des millions d'années, les épaves d'engins de guerre y sont toujours visibles.\n\nSi la [From.GetPlanetMoon] abritait une importante colonie yuht, les villes et autres campements ne furent jamais reconstruits au terme des combats, ce qui laisse à penser qu'ils auraient perdu la guerre."
 precursor.526.desc: "Après avoir minutieusement fouillé plusieurs anciens champs de bataille de §Y[From.From.GetName]§!, nos archéologues ont récupéré ce qui ressemble à un harnais de combat yuht. Plusieurs canons de gros calibre y étaient toujours attachés, et les archéologues pensent que les soldats yuhts, compte tenu de leur corpulence, étaient chacun une véritable forteresse mobile."
 precursor.530.name: "Satellite yuth"
 precursor.530.desc: "Un satellite yuth a été placé en orbite autour de [From.GetName] pour commémorer le premier contact entre leur empire et les Jabbardeenis, une civilisation contemporaine. Ce premier contact a eu lieu ici même, dans le système [From.GetStarName], et s'est accompagné de profondes répercussions à tous les niveaux de la société yuht.\n\nPendant plus d'un million d'années, ils s'étaient battus seuls dans la galaxie et les Yuhts ont réagi avec horreur en découvrant des êtres doués de raison. Le [Root.GetName] a récupéré le satellite qui doit maintenant être analysé."
 precursor.531.desc: "Après avoir analysé le satellite récupéré au-dessus de §Y[From.From.GetName]§!, nos archéologues ont découvert une représentation incrustée et extrêmement stylisée de ce qui ressemble à un croiseur yuht et à un petit vaisseau de reconnaissance jabbardeeni évoluant en formation serrée lors du premier contact entre les deux civilisations. Ils ont ainsi pu se faire une idée plus précise de leurs vaisseaux spatiaux."
 precursor.535.name: "Croiseur yuht"
 precursor.535.desc: "Les vestiges d'un croiseur yuht ont été retrouvés en orbite autour de [From.GetName]. Apparemment, il aurait été victime de tirs d'armes, mais compte tenu de la vétusté de la carcasse, il est difficile d'en être certain. Rien n'indique que le vaisseau était équipé d'un dispositif supra-luminique ; il devait se déplacer à des vitesses sous-luminiques."
 precursor.536.desc: "Les archéologues qui examinent le croiseur yuht abandonné au-dessus de §Y[From.From.GetName]§! ont transmis leur rapport. La partie centrale du vaisseau abrite deux grandes cryochambres conçues pour abriter chacune un Yuht en état d'hibernation. Compte tenu de la corpulence des Yuhts, c'était apparemment ainsi qu'ils voyageaient à bord des vaisseaux de cette taille.\n\nAucun reste de Yuht n'a été retrouvé à bord du vaisseau, mais les archéologues ont réussi à récupérer les journaux d'un ordinateur qui surveillait les constantes vitales et l'état de santé de l'équipage, permettant ainsi d'obtenir de précieuses informations sur la physiologie yuht."
 precursor.540.name: "Vaisseau de colonisation yuht"
 precursor.540.desc: "Les vestiges partiels d'un ancien vaisseau spatial yuht ont été retrouvés en haute orbite au-dessus de [From.GetName]. L'analyse préliminaire menée par le [Root.GetName] indique qu'il s'agissait peut-être d'un vaisseau de colonisation.\n\nMême les vaisseaux yuhts de type croiseur n'abritaient à leur bord qu'un ou deux individus en raison de leur forte corpulence, mais plus d'une dizaine de cryocapsules sont attachées à ce vaisseau, chacune contenant des exosquelettes atrophiés provenant vraisemblablement des colons yuhts."
 precursor.541.desc: "Les vestiges du vaisseau de colonisation yuht découvert en orbite de §Y[From.From.GetName]§! sont en piteux état, mais nos archéologues ont réussi à récupérer ses moteurs subluminiques. Les Yuhts n'ont jamais franchi la barrière luminique, mais utilisaient la cryotechnologie et tiraient profit de leur extraordinaire longévité pour étendre leur empire à travers les étoiles."
 precursor.545.name: "Présence d'un habitat yuht sur un astéroïde"
 precursor.545.desc: "Cet astéroïde semble avoir abrité un Yuht. Des analyses approfondies montrent un réseau de cavernes situées à l'intérieur de l'astéroïde et similaires aux lieux de vie des Yuhts trouvés ailleurs. Pour en savoir plus, nous allons devoir y dépêcher une équipe d'investigation."
 precursor.546.desc: "L'étude de l'habitat yuht découvert sur l'astéroïde §Y[From.From.GetName]§! a révélé qu'il s'agissait autrefois de la demeure de la philosophe et ermite Yakliir, une personnalité célèbre dans la culture yuht, mentionnée dans de nombreuses sources. Les restes de Yakliir ont été retrouvés dans le sas principal de l'habitation, où elle semble être morte en attendant une navette d'approvisionnement qui semble n'être jamais arrivée."
 precursor.600.name: "Système natal yuht localisé"
 precursor.600.desc: "Après avoir minutieusement examiné les artefacts yuhts récupérés, les scientifiques de [Root.Capital.GetName] en ont déduit les coordonnées galactiques exactes de Yuhtaan, le système natal de l'ancienne civilisation yuht ! Nous devrions y lancer une expédition avant que quelqu'un ne nous double."
 precursor.601.name: "Le monde natal des Yuhts"
 precursor.601.desc: "Nous venons d'en recevoir la confirmation : §Y[From.From.GetName]§! était bien le monde natal des Yuht. La [From.From.GetPlanetMoon] a été la cible d'intenses bombardements orbitaux, il y a environ 4 millions d'années, et les seuls vestiges des imposantes arcologies qui recouvraient autrefois sa surface sont des squelettes de métal tordus et enchevêtrés.\n\nSelon tous les indices qui ont pu être rassemblés, les Yuht ont passé près d'un million d'années à parcourir l'espace qui les entourait pour y trouver quelque signe d'une vie alien intelligente. En vain. Aussi, lorsqu'ils finirent par rencontrer les Jabbardîni, une jeune race, capable elle aussi de voyager dans l'espace, la psychologie collective yuht s'en est trouvée ébranlée.\n\nLes autorités yuht sont alors arrivées à un consensus : les Jabbardîni devaient être éradiqués avant de devenir trop puissants. Une attaque-surprise de très grande envergure fut alors lancée, qui fut repoussée, au prix d'un nombre considérable de victimes dans les deux camps. Mais, en dépit de leur jeunesse, les Jabbardîni avaient déjà expérimenté des technologies restées inconnues des Yuht, ce qui leur permit de finir par prendre l'avantage. En moins d'une décennie de combat, l'Empire yuht âgé de 2 millions d'années fut annihilé."
 precursor.602.name: "Monde natal des Yuhts découvert"
 precursor.602.desc.a: "Nous avons enfin retrouvé le monde natal des Yuht. Malheureusement, nous ne sommes pas les premiers. La [From.From.GetPlanetMoon] a déjà été visitée, et ne contient plus rien qui puisse avoir la moindre valeur."
 precursor.602.desc.b: "L'exploration de §Y[From.From.GetName]§! a révélé que la [From.From.GetPlanetMoon] abritait jadis le monde natal d'une ancienne espèce, les « Yuht ». Mais d'autres voyageurs stellaires y sont venus il y a peu, et il n'y reste plus rien qui présente la moindre valeur."
 precursor.1000.name: "La Première ligue"
 precursor.1000.desc: "Nous avons découverts des artéfacts d'une ancienne civilisation alien sur §Y[From.GetName]§! ! Pour ce que l'on peut en juger par leur étude, cette civilisation était une sorte de confédération composée de nombreuses races aliens différentes. Elles formaient la « Première ligue » et semblent avoir coexisté dans une paix relative, il y a quelque deux millions d'années environ.\n\nSi le système de [From.GetStarName] se trouvait dans ce qui apparaît avoir été le coeur de son territoire, une carte partielle retrouvée parmi les vestiges indique que cette Première ligue s'étendait sur une partie importante de la galaxie, avant de finir par s'effondrer."
 precursor.1005.name: "Base navale de la Ligue"
 precursor.1005.desc: "Les vestiges de ce qui a dû être autrefois une importante base navale de la Première ligue ont été détectés en orbite de §Y[From.GetName]§!. Nous savons que la Ligue possédait une flotte nombreuse, appelée la « Flotte Suprême », pour combattre les pirates et protéger les nations membres des agressions extérieures. Cet avant-poste était visiblement le port d'attache de l'une de ces flottes chargées de patrouiller à ses frontières."
 precursor.1006.desc: "La mission archéologique sur la base navale de la Première ligue est terminée. Nous y avons trouvé l'emblème de la XXVIIIe Flotte de patrouille frontalière, un corps expéditionnaire de taille intermédiaire en charge de la défense des voies commerciales menant aux nations associées à la Ligue qui se trouvaient en bordure de la galaxie. La base orbitale de [From.From.GetName] était visiblement leur port d'attache."
 precursor.1010.name: "Croiseur de la Ligue"
 precursor.1010.desc: "La proue d'un ancien croiseur de la Première ligue a été découverte en orbite de §Y[From.GetName]§!. Les débris environnants sont insuffisants pour se faire une idée précise de ce à quoi ressemblait le vaisseau, et les vestiges subsistants sont en bien piètre état. La coque est criblée d'impacts provoqués par de gros projectiles autopropulsés."
 precursor.1011.desc: "L'expédition archéologique envoyée étudier le croiseur de la Première ligue trouvé en orbite de §Y[From.From.GetName]§! est rentrée. Les vestiges du vaisseau n'ont pas révélé grand-chose, mais les archéologues ont réussi à mettre la main sur le rôle de l'équipage. La Première ligue recrutait auprès de tous ses membres pour former la Flotte Suprême. Le document nous a ainsi appris que les membres de l'équipage du croiseur appartenaient à douze espèces différentes."
 precursor.1015.name: "Le monde natal des Khamdai"
 precursor.1015.desc: "L'exploration de §Y[From.GetName]§! a indiqué qu'elle était autrefois le monde natal des Khamdai, une espèce insectoïde qui faisait partie des fondateurs de l'ancienne Première ligue. La surface de la [From.GetPlanetMoon] était recouverte de villes gigantesques, ressemblant plus ou moins à des ruches. Nous avons par contre appris que les Khamdai interdisaient toute construction dans une vaste région de forme circulaire, qui couvrait plus d'un tiers de l'hémisphère sud. La zone faisait était à la fois un lieu d'accouplement et une réserve naturelle."
 precursor.1016.desc: "L'expédition archéologique envoyée sur §Y[From.From.GetName]§! nous a appris de nombreuses choses sur les Khamdai, aujourd'hui disparus. Il s'agissait d'une culture guerrière, qui livra de nombreuses guerres contre un certain nombre d'autres fondateurs de la Première ligue dès que leurs vaisseaux purent franchir la barrière luminique.\n\nAprès leur défaite, les Khamdai soutinrent avec enthousiasme la fondation de la Première ligue, et beaucoup de leurs meilleurs guerriers formaient les troupes de choc qui combattaient les ennemis de la Ligue. Nous avons récupéré d'eux une « magil-sha » en parfait état : une faucille cérémonielle utilisée par les Khamdai de la Garde d'honneur de la Première ligue."
 precursor.1020.name: "Le monde natal des Chassago"
 precursor.1020.desc: "Ce monde abritait autrefois les Chassago, des reptiliens qui faisaient partie des membres fondateurs de la Première ligue. La plupart de leurs villes étaient souterraines et [From.GetName] est parcourue de nombreux réseaux de tunnels, dont la plupart se sont effondrés au cours des deux millions d'années écoulées depuis l'extinction des Chassago. Les sondes du [Root.GetName] ont identifié l'emplacement probable de plusieurs de ces villes souterraines."
 precursor.1021.desc: "Les fouilles menées dans les villes souterraines des Chassago, sur §Y[From.From.GetName]§!, nous ont déjà beaucoup appris sur cette espèce ancienne. Il s'agissait de reptiliens, au corps allongé et dépourvu de pattes et qui, à l'âge adulte, pouvaient mesurer jusqu'à une vingtaine de mètres de long, voire davantage.\n\nLes éléments dont nous disposons indiquent que ces Chassago étaient des marchands hors pair, dont les cargos commerciaux ont souvent été le premier contact entre les races non affiliées et la Première ligue. De toute évidence, cette dernière ne se serait pas étendue aussi rapidement si elle ne s'était pas appuyée sur le vaste réseau commercial des Chassago, déjà établi avant sa fondation."
 precursor.1025.name: "Le monde natal des Migir-Yan"
 precursor.1025.desc: "Petits, mais se reproduisant extrêmement rapidement, les Migir-Yan faisaient partie des espèces fondatrices de la Première ligue, et §Y[From.GetName]§! était leur monde natal. Ils vivaient dans des centaines de gigantesques arcologies disséminées à la surface, chacune pouvant abriter plusieurs centaines de millions d'individus.\n\nCes arcologies étaient reliées par un réseau de voies aériennes, permettant ainsi aux Migir-Yan de laisser intact l'environnement naturel préservé de la [From.GetPlanetMoon]."
 precursor.1026.desc: "Grâce aux fossiles de Migir-Yan découverts par nos archéologues sur §Y[From.From.GetName]§!, nous avons une meilleure idée de ce à quoi ressemblait cette espèce. Inhabituellement petits, la plupart des individus ne dépassant guère plus de 60 centimètres, ces sortes de mammifères rongeurs étaient herbivores.\n\nLes familles migir-yan étaient généralement constituées de près d'un millier de membres, et la position de chacun au sein de la société reposait presque exclusivement sur ses aptitudes sociales. C'est très probablement le corps diplomatique des Migir-Yan qui été à l'origine de la création de la Première ligue."
 precursor.1030.name: "Le monde natal des V'ropak"
 precursor.1030.desc: "§Y[From.GetName]§! était jadis le monde natal des V'ropak, une espèce aviaire qui faisait partie des membres fondateurs de la Première ligue. Ces êtres qui ressemblaient à des oiseaux coureurs, incapables de voler et se déplaçant sur de longues pattes grêles. Les restes fossilisés découverts laissent à penser que les femelles pouvaient mesurer jusqu'à quatre mètres, tandis que les mâles étaient légèrement plus petits.\n\nLeurs villes étaient établies dans des plateaux évidés. Les premiers balayages indique que certaines de celles-ci étaient construites artificiellement, sans doute par les V'ropak eux-mêmes, après qu'ils sont venus à manquer de reliefs naturels à leur convenance."
 precursor.1031.desc: "À l'apogée de la Première ligue, les V'ropak passaient pour être les meilleurs scientifiques de la galaxie. Ce sont leurs innovations qui ont permis l'extension de la Première ligue au début de son histoire, et bon nombre d'espèces ont été conquises par la promesse de pouvoir accéder, par leur adhésion, à la technologie v'ropak. Hélas, il ne reste plus rien de cette technologie dans les ruines de [From.From.GetName]."
 precursor.1035.name: "Base scientifique de la Ligue"
 precursor.1035.desc: "Un balayage de surface de la [From.GetPlanetMoon] §Y[From.GetName]§! a permis d'identifier les vestiges d'un ancien complexe. La majeure partie de l'installation a été détruite par une gigantesque explosion, il y a quelque deux millions d'années, mais plusieurs bâtiments situés en périphérie en ont plus ou moins été préservés. Les éléments recueillis jusqu'à présent indiquent qu'il s'agissait vraisemblablement d'une sorte de base scientifique construite par la Première ligue."
 precursor.1036.desc: "L'expédition archéologique envoyée sur §Y[From.From.GetName]§! est rentrée. Il reste bien peu de choses de la base scientifique de la Première ligue, mais à en juger par son isolement des recherches particulièrement dangereuses devaient y être menées, sans doute dans le domaine des voyages dimensionnels ou des armes biologiques avancées.\n\nLe disque de données récupéré à l'« Académie des sciences » a permis d'en apprendre plus sur l'organisation de la communauté scientifique de la Première ligue."
 precursor.1040.name: "Colonie cogérée de la Ligue"
 precursor.1040.desc: "Les ruines d'une colonie de la Première ligue ont été découvertes sur §Y[From.GetName]§!. Il s'agissait apparemment d'une expérience sociale menée à l'époque où la Ligue était déjà sur le déclin. La population initiale était composée d'un nombre égal de colons issus de chacune des espèces membres de la Ligue. Elle a été abandonnée moins d'un demi-siècle après sa création."
 precursor.1041.desc: "Nos archéologues en savent plus désormais sur la colonie perdue de §Y[From.From.GetName]§!. Au moment de sa fondation, la Première ligue menaçait déjà de s'effondrer, et la colonie était conçue comme un instrument de propagande : un monde modèle, où toutes les espèces membres seraient représentés et censées travailler ensemble dans la plus grande harmonie.\n\nMais la tentative s'est visiblement traduite par un échec, comme le montre les traces laissées par d'importants combats entre les colons, et jusqu'aux vestiges d'un véritable massacre survenu juste avant l'abandon de la colonie."
 precursor.1045.name: "Carrefour commercial de la Ligue"
 precursor.1045.desc: "Il y a deux millions d'années, §Y[From.GetName]§! était une plaque tournante pour le commerce entre les espèces membres de la Première ligue. De vastes régions de sa surface abritaient des villes immenses et nombreuses, et au moins une douzaine de spatioport de première catégorie ont été identifiés pour le seul hémisphère nord. Mais la [From.GetPlanetMoon] a fini par être abandonnée, au cours d'une période couvrant quelques siècles, vraisemblablement du fait d'un déplacement des routes commerciales et de l'effondrement de la Ligue."
 precursor.1046.desc: "Il est difficile de déterminer quelle fut la première espèce à coloniser ce monde, car des ossements et des fossiles appartenant à toutes les espèces membres de la Première ligue ont été découverts sur la [From.From.GetPlanetMoon] [From.From.GetName], dans des proportions sensiblement équivalentes. Les archéologues ont également retrouvé les restes d'une demi-douzaine d'espèces qui n'en étaient pas officiellement membres, mais qui semblent avoir bénéficié de privilèges commerciaux particuliers au sein de l'espace de la Première ligue."
 precursor.1050.name: "Épaves d'une bataille"
 precursor.1050.desc: "Une grande bataille entre la Flotte Suprême de la Première ligue et une autre a eu lieu non loin de §Y[From.GetName]§!, il y a quelque deux millions d'années. Son puits de gravité a depuis capturé une bonne partie des débris laissés par le combat, et d'imposantes épaves sont toujours visibles à la surface de la [From.GetPlanetMoon]."
 precursor.1051.desc: "Les archéologues ont réussi à fouiller plusieurs coques de vaisseaux spatiaux qui se trouvaient à la surface de §Y[From.From.GetName]§!, vestiges d'une grande bataille spatiale qui s'est déroulée dans ce système il y a deux millions d'années. Les forces en présence, les IIe et IIIe flottes de la Flotte Suprême de la Première ligue, ont tenté d'y stopper l'avancée de toutes les flottes réunies des Rikim, une espèce de nomades guerriers originaire des confins de la galaxie.\n\nCe qui n'avait au départ été qu'une escarmouche a tourné en une gigantesque bataille, impliquant des centaines de vaisseaux dans chacun des deux camps. Il reste impossible de dire qui a remporté la victoire."
 precursor.1055.name: "Complexe pénitencier de la Ligue"
 precursor.1055.desc: "Les ruines d'un vaste complexe pénitencier ont été retrouvées sur §Y[From.GetName]§!. Ce monde hostile semble avoir fait office de colonie pénale de haute sécurité pour la Première ligue. En tant que structure fédérale, la prison abritait des criminels originaires de tout l'espace de la Ligue.\n\nLes archives retrouvées indiquent que la plupart d'entre eux s'étaient rendus coupables d'actes de piraterie, de terrorisme et d'autres « crimes de nature extraordinaire ». Les restes fossilisés de certains détenus sont toujours présents dans les cellules."
 precursor.1056.desc: "La mission archéologique menée sur §Y[From.From.GetName]§! a permis de réunir les preuves d'une tentative d'évasion manquée, à quelque distance au sud du complexe pénitencier. Un véhicule utilitaire de la prison a été retrouvé, renversé au pied d'une petite falaise, et à quelques kilomètres de là les cadavres de plusieurs prisonniers portant des combinaisons pressurisées volées, blottis les uns contre les autres.\n\nIls semblent être morts d'asphyxie une fois les réserves d'oxygène des combinaisons épuisées. Pour une raison inconnue, les autorités carcérales n'ont pas jugé bon de récupérer les cadavres."
 precursor.1060.name: "Monde pré-PRL protégé"
 precursor.1060.desc: "Il y a deux millions d'années, §Y[From.GetName]§! abritait une civilisation de l'Âge du bronze. Fait intéressant, le [Root.GetName] a également repéré des postes d'observation dissimulés, construits par la Première ligue sur la [From.GetPlanetMoon]. Apparemment, elle étudiait ces aliens pré-PRL, en faisant tout son possible pour éviter toute contamination culturelle.\n\nLa plupart des postes d'observation ont été détruits par des armes à énergie sophistiquées et nous n'avons aucun élément expliquant pourquoi cette civilisation pré-PRL n'a jamais évolué au-delà de l'Âge du bronze."
 precursor.1061.desc: "Les fouilles menées sur §Y[From.From.GetName]§! nous ont permis d'apprendre que la Première ligue avait une politique claire de non-interférence avec le développement des civilisations préspatiales. Des postes d'observation dissimulés, tels que ceux trouvés sur cette [From.From.GetPlanetMoon], étaient présents sur au moins sept mondes de l'espace de la Ligue.\n\nQuant à la civilisation de [From.From.GetName], elle semble s'être éteinte du fait de l'arrivée d'un groupe d'esclavagistes, lors de la période d'anarchie qui a suivi l'effondrement de la Première ligue."
 precursor.1065.name: "Blocus orbital"
 precursor.1065.desc: "§Y[From.GetName]§! se trouve au coeur de ce qui était considéré, il y a deux millions d'années, comme l'espace de la Première ligue. Elle semble avoir abrité une importante colonie ou le monde natal d'une espèce décrite par les archives de la Ligue comme « récalcitrante ».\n\nLes deux camps se livraient apparemment une sorte de guerre commerciale, et la Flotte Suprême a imposé, à au moins deux occasions, un blocus strict à la [From.GetPlanetMoon]. Des débris orbitaux montrent cependant qu'il a été tenté à plusieurs reprises d'y mettre fin par la force."
 precursor.1066.desc: "Une équipe d'archéologues a trouvé l'épave d'un cuirassé de la Première ligue à la surface de §Y[From.From.GetName]§!. Il devait être partie prenante dans le blocus orbital, et semble avoir été touché lorsque les aliens qui vivaient sur la [From.From.GetPlanetMoon] ont fait exploser un dispositif antimatière caché sur un des vaisseaux du blocus qu'ils avaient capturé. Les archéologues ont réussi à récupérer une copie partielle des banques de données du cuirassé, répertoriant la liste exhaustive des vaisseaux de la Ligue ayant participé au blocus."
 precursor.1070.name: "Astéroïde de contrebandiers"
 precursor.1070.desc: "L'astéroïde §Y[From.GetName]§! semble avoir été un port d'attache illégal pour diverses organisations criminelles qui sévissaient dans l'espace de la Première ligue. Contrebandiers, pirates, mercenaires et autres hors-la-loi issus de toutes les civilisations membres de la Première ligue se retrouvaient ici pour décharger leurs cargaisons illicites, conclure des marchés ou tout simplement se détendre dans l'une des nombreuses tavernes établies sur l'astéroïde."
 precursor.1071.desc: "La mission archéologique menée sur l'astéroïde §Y[From.From.GetName]§! a livré de nombreuses informations sur le crime organisé qui sévissait dans l'espace de la Première ligue il y a deux millions d'années. Car si l'ouverture des frontières des espèces membres a permis le développement du commerce, il a aussi permis celui des organisations criminelles. La contrebande et la piraterie semblent avoir posé de sérieux problèmes et immobilisaient une partie non négligeable de l'importante flotte Ligue."
 precursor.1100.name: "Système natal de la Première ligue localisé"
 precursor.1100.desc: "Après avoir minutieusement étudié les artefacts de la Première ligue que nous avons pu récupérer, les scientifiques de §Y[Root.Capital.GetName]§! sont parvenus à en tirer les coordonnées galactiques exactes du système de Fen Habbanis, le système natal de la Première ligue ! Sans doute devrions-nous y dépêcher une expédition, avant que quelqu'un ne nous devance."
 precursor.1101.name: "Le quartier général de la Première ligue"
 precursor.1101.desc: "§Y[From.From.GetName]§! a été la capitale administrative de la Première ligue pendant quasiment toute son histoire, et c'est là que se trouvait le siège de son Grand Sénat. La [From.From.GetPlanetMoon] était densément peuplée, une ville tentaculaire en couvrant la majeure partie de la surface. La nourriture devait être importée des autres mondes membres afin de subvenir aux besoins des milliards d'êtres qui vivaient dans cette mégalopole gigantesque.\n\nLorsque la Première ligue s'est effondrée, les approvisionnements ont brutalement cessé. Ceux qui en avaient les moyens ont rejoint d'autres mondes, mais la majeure partie de la population est restée sur place. Famine et anarchie s'ensuivirent, tandis que des seigneurs de guerre et des organisations criminelles se partageaient la [From.From.GetPlanetMoon].\n\nLa population continua de décliner pendant plusieurs siècles, jusqu'à ce que Fen Habbanis devienne véritablement un monde fantôme, épitaphe de la défunte Première ligue."
 precursor.1102.name: "Capitale de la Première ligue découverte"
 precursor.1102.desc.a: "Nous avons enfin découvert la capitale de l'ancienne Première ligue. Hélas, nous arrivons trop tard. L'endroit a récemment été fouillé et il n'y reste plus rien de valeur."
 precursor.1102.desc.b: "L'exploration récente de §Y[From.From.GetName]§! a révélé que ce monde était autrefois la capitale administrative d'une sorte d'alliance interstellaire, appelée la « Première ligue ». D'autres explorateurs sont récemment venus sur la [From.From.GetPlanetMoon], qui ont pillé tous les vestiges du moindre objet de valeur."
 precursor.1500.name: "Le Pacte irassien"
 precursor.1500.desc: "Nous avons recouvré sur §Y[From.GetName]§! des artefacts provenant d'une ancienne civilisation. Pour ce que nous comprenons actuellement de leur langue, ces aliens s'appelaient le « Pacte irassien ». Ils constituaient une puissance interstellaire qui dominait cette région de la galaxie, il y a de cela un peu plus d'un million d'années.\n\nIl s'agissait apparemment de mammifères à six membres. Selon plusieurs sources, ils auraient été frappés par une « peste javorienne », qui aurait balayé leur empire en causant des conséquences catastrophiques, au point peut-être même d'entraîner leur disparition."
 precursor.1505.name: "Monde en quarantaine"
 precursor.1505.desc: "§Y[From.GetName]§! était autrefois une importante colonie irassienne, montrant des signes de développement industriel et de terraformation. Comme sur les autres mondes irassiens, les restes fossilisés racontent une histoire poignante : la population a succombé très rapidement à la peste javorienne, suscitant la panique dans tous les établissements de la [From.GetPlanetMoon]. De nombreux débris se trouvent aussi en orbite, probablement les vestiges d'une bataille."
 precursor.1506.desc: "L'analyse des débris en orbite de §Y[From.From.GetName]§! a permis aux archéologues de déterminer que la [From.From.GetPlanetMoon] était soumise à un blocus militaire, aussi bien avant que pendant l'effondrement de cette colonie irassienne. La flotte irassienne avait reçu pour ordre de maintenir une stricte quarantaine autour de la [From.From.GetPlanetMoon], pour tenter - vainement - de contenir la peste javorienne. Au moins une douzaine de vaisseaux civils firent une tentative pour forcer le blocus, et en dépit des combats intenses il semble que certains au moins y sont parvenus."
 precursor.1510.name: "Monde nettoyé"
 precursor.1510.desc: "Il parait aussitôt évident que §Y[From.GetName]§!, une ancienne colonie irassienne, a été la cible d'un terrible bombardement orbital : d'énormes cratères sont toujours visibles depuis l'espace, aux endroits même où se trouvaient les principaux centres de population de la [From.GetPlanetMoon], il y a environ 1,2 million d'années.\n\nLes rares survivants de ce bombardement semblent ensuite avoir rapidement succombé à la peste javorienne, qui faisait alors rage dans la plupart des mondes irassiens."
 precursor.1511.desc: "L'expédition archéologique sur §Y[From.From.GetName]§! a permis de récupérer un journal de communications dans les ruines d'un poste d'écoute. Il contient les vestiges d'une transmission entre le commandant d'une flotte irassienne en orbite et le quartier général de la flotte, sur Irassia. Le commandant y remet en cause les ordres visant à « nettoyer » la colonie de toute forme de vie afin d'éviter la propagation de la peste. Si le journal se termine avant que la question ne soit résolue, il est assuré que les ordres ont bien été suivis."
 precursor.1515.name: "Le monde natal des Joggra"
 precursor.1515.desc: "Cette [From.GetPlanetMoon] était le monde natal des Joggra, une espèce assujettie au Pacte irassien. Espèce molluscoïde sur le point d'accéder à la technologie spatiale lorsque les Irassiens l'ont découverte, les Joggra furent conquis au terme d'une longue campagne militaire qui détruisit nombre de leurs villes.\n\nD'après les éléments retrouvés sur place, une importante garnison irassienne y aurait stationné lors des décennies suivantes, ce qui laisse à penser que les Joggra n'appréciaient guère le joug irassien."
 precursor.1516.desc: "Sur §Y[From.From.GetName]§! ont été retrouvés les restes d'un message subspatial joggran, qui paraît avoir été transmis aux mondes natals des autres espèces assujetties au Pacte irassien :\n\n§S« L'heure de se libérer des tyrans est venu ! Nos agents ont appris que la peste javorienne ne touche que les faibles Irassiens, mais que toutes les espèces peuvent transmettre la maladie. Il faut tout mettre en oeuvre pour infiltrer leurs mondes, leurs stations spatiales, leurs vaisseaux et même leurs *inintelligible* !\n\nEnfin, les Irassiens ont rencontré à un ennemi contre lequel leur fameuse flotte stellaire ne peut lutter ! Par les *inintelligible*, nous ne devons manquer cette occasion sous aucun prétexte ! »§!"
 precursor.1520.name: "Le monde natal des Ti'Derg"
 precursor.1520.desc: "§Y[From.GetName]§! était le monde natal des Ti'Derg, une espèce cliente du Pacte irassien, il y a environ 1,2 million d'années. Il s'agissait d'arthropodes ailés, et les fossiles retrouvés suggèrent qu'ils étaient capables de voler même sur de courtes distances - le peu qui a été retrouvé de leur architecture semble en tout cas accréditer cette théorie.\n\nMalheureusement, il ne reste guère de vestiges de cette civilisation, la [From.GetPlanetMoon] semblant avoir été soumise à un bombardement orbital intense."
 precursor.1521.desc: "L'étude des ruines aliens de §Y[From.From.GetName]§! nous a offerts de nouveaux éléments sur les derniers moments du Pacte irassien. Les Irassiens étaient persuadés que les Ti'Derg étaient partie prenante dans un complot impliquant plusieurs espèces assujetties au Pacte, et qui aurait visé à propager délibérément la peste javorienne sur les mondes irassiens.\n\nNous ne saurons jamais si c'était la vérité ; mais la flotte irassienne a jugé disposer de preuves suffisamment concluantes pour littéralement incinérer la surface de la [From.From.GetPlanetMoon] depuis son orbite."
 precursor.1525.name: "Colonie décimée"
 precursor.1525.desc: "§Y[From.GetName]§! montre tous les signes d'un monde colonial irassien florissant, il y a approximativement 1,2 millions d'années. Compte tenu de leur âge, les ruines retrouvées jusqu'à présent à la surface de la [From.GetPlanetMoon] sont, somme toute, bien préservées, et elles ne montrent aucun signe de bombardement orbital ou de conflit armé.\n\nLes colons irassiens ont semble-t-il succombé à la peste javorienne. Par la suite, l'agressive flore indigène a repris ses droits dans les villes sans vie, les dissimulant sous une épaisse végétation."
 precursor.1526.desc: "Après avoir dégagé la végétation qui recouvrait l'un des anciens établissements irassiens sur §Y[From.From.GetName]§!, puis avoir établi l'alimentation des générateurs de champs énergétiques pour tenir les prédateurs à distance, les archéologues ont minutieusement fouillé les ruines. Nous avons maintenant une bien meilleure idée de ce à quoi ressemblait la vie quotidienne dans la société irassienne.\n\nParmi les découvertes ayant le plus de valeur se trouve un atlas digital, apparemment utilisé pour enseigner l'histoire de l'empire aux enfants irassiens. Il contient également des descriptions détaillées et peu flatteuses des espèces assujetties au Pacte."
 precursor.1530.name: "Base minière irassienne"
 precursor.1530.desc: "Tout ce qu'il reste aujourd'hui des opérations minières menées par les Irassiens sur §Y[From.GetName]§!, il y a 1,2 million d'années, est un ensemble de profonds puits de forage. Le [Root.GetName] a minutieusement scanné la surface de la [From.GetPlanetMoon], mais n'a encore trouvé le moindre vestige d'une quelconque installation minière."
 precursor.1531.desc: "En explorant les puits de forage de §Y[From.From.GetName]§!, les archéologues ont trouvé au fond de l'un d'eux les restes fossilisés de plus d'une centaine de mineurs irassiens. Ils semblent, eux aussi, avoir succombé à la peste javorienne, qui a causé la chute du Pacte irassien. Dans l'espoir de contenir la maladie, leurs camarades ont vainement jeté leurs corps dans ce puits, avant d'évacuer la [From.From.GetPlanetMoon]."
 precursor.1535.name: "Colonie irassienne"
 precursor.1535.desc: "Au moment de l'extinction des Irassiens, la colonie de §Y[From.GetName]§! était encore toute récente. Nous avons trouvé sur l'hémisphère nord de la [From.GetPlanetMoon] les ruines éparses d'un seul établissement, ainsi qu'un spatioport des plus sommaires. À en juger par les restes fossilisés, ce monde aurait été l'un des premiers à être touché par cette peste javorienne qui ravagea l'espace irassien."
 precursor.1536.desc: "Les archéologues envoyés sur §Y[From.From.GetName]§! y ont fait une découverte saisissante : toutes les preuves concordent pour faire de cette modeste [From.From.GetPlanetMoon] la source de la peste javorienne !\n\nUne forme rare d'une bactérie locale semble s'être répandue dans la colonie à la faveur d'un défaut de fabrication du dispositif de quarantaine, se propageant de là dans les filtres à air d'un vaisseau marchand qui y faisait escale. La peste s'étant propagée à une vitesse fulgurante, il n'est pas certain que les Irassiens soient eux-mêmes parvenus à en identifier la source."
 precursor.1540.name: "Épave irassienne"
 precursor.1540.desc: "Abandonné sur une orbite proche de §Y[From.GetName]§! il y a plus d'un million d'années, un croiseur irassien a été oublié là. Avançant à très faible vitesse, le bâtiment ne présente aucun dégât par armes, et toutes les capsules de sauvetage semblent présentes. Comme on pouvait s'y attendre, aucune signature énergétique n'est détectée dans la coque."
 precursor.1541.desc: "L'intérieur du croiseur irassien découvert en orbite de §Y[From.From.GetName]§! contenait les restes de l'ensemble de son équipage. La plupart d'entre eux ont succombé à la peste javorienne, qui finit par conduire les Irassiens à l'extinction ; mais certains ont été abattus par les marines du bord alors qu'ils tentaient de rejoindre les capsules de sauvetage. Selon les fichiers du journal récupérés à bord, dès le déclenchement de l'épidémie le capitaine avait décrété la mise en quarantaine du vaisseau."
 precursor.1545.name: "Contrôle des maladies"
 precursor.1545.desc: "Les débris de ce qui semble avoir été une gigantesque installation orbitale ont été découverts au-dessus de §Y[From.GetName]§!. Parmi les débris, les artefacts récupérés ont confirmé que la station abritait le quartier général de l'Autorité de contrôle sanitaire du Pacte irassien, il y a de cela 1,2 million d'années.\n\nLes Irassiens étaient plus vulnérables aux maladies aliens que la plupart des espèces connues, aussi le budget alloué à leurs institutions de santé publique avoisinait-il celui de l'armée. En dépit de cela, les archives récupérées indiquent toutes que c'est la peste javorienne qui a été la cause de leur disparition."
 precursor.1546.desc: "Nous avons récupéré dans les débris orbitant autour de §Y[From.From.GetName]§! les fragments de plusieurs journaux de recherche. Les dernières entrées portent toutes sur la mise au point d'un remède contre la peste javorienne qui se propageait alors dans le Pacte irassien, et elles se font de plus en plus désespérées à mesure que la situation s'aggravait.\n\nL'ultime d'entre elles indique que la peste s'était répandue sur la station elle-même. Une pièce jointe détaillait toutes les vaines tentatives menées pour trouver un vaccin, dans l'espoir que ces données s'avèreraient utiles aux générations futures des scientifiques irassiens."
 precursor.1550.name: "Poste d'écoute"
 precursor.1550.desc: "Un petit poste d'écoute militaire irassien a été construit dans une excavation pratiquée à la surface d'un astéroïde. Il était équipé de toute une panoplie de puissants capteurs, visiblement dirigés vers les systèmes voisins. Aucun d'entre eux ne fonctionne plus, et l'astéroïde semble avoir été visité et pillé au moins une fois."
 precursor.1551.desc: "Nous avons découvert que les Irassiens utilisaient le poste d'écoute de l'astéroïde §Y[From.From.GetName]§! pour espionner les civilisations voisines et planifier des attaques contre elles lors de la phase expansionniste de leur empire. Ces attaques atteignirent leurs objectifs, permettant aux Irassiens de rapidement s'imposer comme la principale puissance de cette région de la galaxie. À l'époque où ils ont été décimés par la peste javorienne, ce poste d'écoute était depuis longtemps abandonné par l'armée irassienne."
 precursor.1555.name: "Station scientifique"
 precursor.1555.desc: "Les décombres d'une grande station scientifique irassienne ont été découverts en orbite de §Y[From.GetName]§!. Si le sujet de recherche des Irassiens n'a pas été déterminé, leurs instruments étaient apparemment orientés vers la géante gazeuse elle-même."
 precursor.1556.desc: "L'analyse des débris irassiens repérés en orbite de §Y[From.From.GetName]§! a livré peu de résultats, mais nous savons maintenant ce qu'étudiaient les scientifiques qui se trouvaient dans cette station. Les journaux qui y ont été retrouvés font référence à une sorte d'objet artificiel flottant dans l'atmosphère écrasante de la géante gazeuse.\n\nLe [Root.GetName] n'a trouvé aucune trace de cet objet, malgré plusieurs scans de l'atmosphère, ce qui laisse à penser qu'il a été récupéré, soit par les Irassiens eux-mêmes, ou par quelqu'un d'autre après leur extinction."
 precursor.1600.name: "Localisation du système natal irassien"
 precursor.1600.desc: "Après avoir minutieusement étudié les artefacts irassiens retrouvés,  que nous avons pu récupérer, les scientifiques de §Y[Root.Capital.GetName]§! sont parvenus à en tirer les coordonnées galactiques exactes d'Irass, le système natal de l'ancienne civilisation irassienne ! Sans doute devrions-nous y dépêcher une expédition, avant que quelqu'un ne nous devance."
 precursor.1601.name: "Monde natal des Irassiens"
 precursor.1601.desc: "Irassia, l'ancien monde natal du Pacte irassien ! Tout récemment, au cours des 2000 dernières années en tout cas, quelqu'un a pris la peine de bombarder systématiquement chaque mètre carré de la surface de la [From.From.GetPlanetMoon] depuis son orbite. Peut-être s'agissait-il d'empêcher une réapparition de la peste javorienne ?\n\nMalgré cela, la surface est toujours couverte des restes fossilisés des milliards d'Irassiens ayant été emportés par ce fléau au cours des dernières années de leur empire. Au moment où l'épidémie avait gagné leur monde natal, la plupart des mondes du Pacte irassien étaient déjà tombés, et leurs sujets aliens s'étaient rebellés.\n\nD'après les journaux d'anciens satellites récupérés en orbite, la plupart des Irassiens étaient à ce stade résignés. La panique générale constatée dans les colonies au début de la maladie s'était apaisée, et la population semblait avoir, dans sa grande majorité, accepté l'idée que sa fin était proche."
 precursor.1602.name: "Découverte du monde des Irassiens"
 precursor.1602.desc.a: "Voici donc Irassia - où du moins ce qu'il subsiste de la fière capitale du Pacte irassien de jadis. Si quelques vestiges ont survécu à la destruction sur le monde natal des Irassiens, ils ont semble-t-il été pillés par de précédents visiteurs. Plusieurs éléments montrent en effet que quelqu'un est venu ici récemment."
 precursor.1602.desc.b: "§Y[From.From.GetName]§! était autrefois dotée d'une biosphère luxuriante, jusqu'à ce qu'un bombardement orbital méthodique la détruise. Les études montrent que la [From.From.GetPlanetMoon] était par le passé la capitale d'une ancienne civilisation connue sous le nom de « Pacte irassien ». Nous n'en savons toutefois guère plus, car d'autres explorateurs ont déjà emporté tous les vestiges présentant la moindre valeur."
 precursor.2000.name: "La Cybrex"
 precursor.2000.desc: "Nous avons récupéré sur §Y[From.GetName]§! des artefacts provenant d'une ancienne civilisation alien ! Aussi incroyable que cela puisse paraître, cette civilisation, qui se faisait appeler la « Cybrex », était visiblement composée de machines reliées les unes aux autres, en une sorte de conscience collective. La datation de ces artefacts indique que ces machines étaient en activité il y a quelques 600 000 ans - au moins dans cette partie de la galaxie. Mais nous ne connaissons rien de leurs origines exactes.\n\nD'après un fragment de données que les scientifiques ont réussi à extraire d'un des artefacts, les Cybrex auraient, à un moment de leur histoire et sans qu'on en connaisse les motivations, lancé une croisade pour éradiquer toute forme de vie organique douée de raison dans la galaxie."
 precursor.2005.name: "Le monde natal des Kuur"
 precursor.2005.desc: "§Y[From.GetName]§! était autrefois le monde natal des antiques Kuur, une civilisation alien éradiquée par la Cybrex il y a quelque 600 000 ans. La [From.GetPlanetMoon] a été totalement dévastée par les machines, et il ne subsiste que quelques ruines de la civilisation kuur, toute la surface ayant été retournée."
 precursor.2006.desc: "Nous avons découvert que c'est sur §Y[From.From.GetName]§! qu'est apparue la Cybrex. Les habitants originels de la [From.From.GetPlanetMoon], les Kuur, y avaient créé une sorte de machine intelligente qui, pour des raisons qui nous sont encore inconnues, a fini par donner naissance à une conscience artificielle collective : la Cybrex.\n\nÀ un moment donné, celle-ci s'est retournée contre les Kuur, massacré la population de leur monde natal lors d'une guerre aussi brève que dévastatrice, qui s'est traduite par la destruction de la biosphère sur la [From.From.GetPlanetMoon]. Cela fut poursuivit par l'élimination systématique des colonies kuurs dans les systèmes voisins, jusqu'à la disparition complète de cette civilisation."
 precursor.2010.name: "Le monde natal des Indimak"
 precursor.2010.desc: "§Y[From.GetName]§! était jadis le monde natal des Indimak, victimes eux aussi de l'expansion implacable de la Cybrex. La [From.GetPlanetMoon] a été la cible de bombardements orbitaux jusqu'à ce que les Indimak se rendent. Les unités combattantes de la Cybrex descendirent alors sur la surface pour y lancé un programme d'extermination de la population indimak qui dura trois ans.\n\nEn plus des sept milliards d'Indimak ayant ainsi péri, le biote de la [From.GetPlanetMoon] a été détruit à 97%."
 precursor.2011.desc: "La biosphère de §Y[From.From.GetName]§! commence tout juste à recouvrer de l'invasion cybrex, survenue il y a quelques 600 000 ans. Nous y avons découvert les ruines d'une usine de la Cybrex, où des esclaves indimaks étaient contraints de collaborer à l'extinction de leur propre espèce en construisant des machines de guerre. Une fois le programme d'extermination arrivé à son terme, la Cybrex « démonta » alors les esclaves restants et démantela ses usines.\n\nLa Cybrex poursuivit par la suite l'exploitation minière de la [From.From.GetPlanetMoon], avant de s'en retirer pour une raison qui nous échappe."
 precursor.2015.name: "Unités de la Cybrex endommagées"
 precursor.2015.desc: "Les restes de deux unités combattantes de la Cybrex ont été découverts en piteux état, en orbite de §Y[From.GetName]§!. Elles ont visiblement été détruites lors d'un engagement, mais aucun débris provenant de leurs adversaires n'a pu être retrouvé. On peut en déduire que soit les unités de la Cybrex étaient en nette infériorité, soit que ce combat était tout autre chose."
 precursor.2016.desc: "Son étude des deux épaves de la Cybrex découvertes en orbite de §Y[From.From.GetName]§! a permis à l'officier scientifique [Root.GetLeaderName] d'en conclure qu'elles se seraient mutuellement détruites. Cette théorie a le mérite d'expliquer à la fois l'absence de débris n'appartenant pas à la Cybrex, et correspond au type des dégâts observés sur les carcasses.\n\nLa raison pour laquelle ces deux vaisseaux se sont affrontés reste toutefois sans réponse. Mais une fois immobilisés, ces unités ont déclenché une sorte de mécanisme d'autodestruction qui a mis hors service leurs processeurs neuronaux."
 precursor.2020.name: "L'invasion de la Cybrex"
 precursor.2020.desc: "L'invasion de §Y[From.From.From.GetName]§! par la Cybrex, il y a plus de 600 000 ans, a débouché sur une guerre au sol de grande ampleur. Le nom de l'espèce alien qui l'a affrontée alors est tombé dans l'oubli, mais elle semble avoir résisté avec acharnement. Des débris d'anciennes machines de guerre cybrex jonchent toute la surface de la [From.From.From.GetPlanetMoon], et des épaves de la flotte d'invasion dérivent toujours en orbite."
 precursor.2021.desc: "Après qu'une première tentative d'invasion de §Y[From.From.GetName]§! a été repoussée par la résistance acharnée des défenseurs de la [From.From.GetPlanetMoon], la Cybrex semble s'être retirée en orbite pour élaborer un nouveau plan.\n\nLa solution qu'elle a trouvée a été de manoeuvrer deux grands astéroïdes afin de provoquer une collision avec la [From.From.GetName]. Leur impact a détruit la plus grande partie des industries et des infrastructures que la Cybrex avait prévu de réutiliser à son compte, mais elle a apparemment jugé ce sacrifice nécessaire pour sortir de l'impasse."
 precursor.2025.name: "Ruines de la Cybrex"
 precursor.2025.desc: "§Y[From.GetName]§! porte tous les signes d'avoir autrefois été un monde hautement développé de la Cybrex. Avec l'efficacité qui les caractérisait, les machines ont exploité toutes les ressources de la [From.GetPlanetMoon], et les ruines d'immenses complexes industriels sont visibles sur les deux hémisphères. Curieusement, toutefois, une vaste région rectangulaire, autour de l'équateur, semble avoir été largement épargnée."
 precursor.2026.desc: "Contrairement à ses habitudes, la Cybrex semble avoir établi sur §Y[From.From.GetName]§! une vaste réserve, où des êtres organiques intelligents étaient autorisés à vivre en paix.\n\nIls y étaient certes étroitement surveillés, mais la Cybrex les laissa se développer sans intervenir, y compris lorsqu'une guerre civile destructrice a éclaté, qui préleva un lourd tribut au sein de la population de la réserve. Au bout de quelques siècles, la Cybrex abandonna soudainement la [From.From.GetPlanetMoon], laissant la population toujours présente disparaître peu à peu."
 precursor.2030.name: "Poste d'écoute de la Cybrex"
 precursor.2030.desc: "§Y[From.GetName]§! est en fait un objet entièrement artificiel, soigneusement dissimulé sous une fine couche de roche qui lui donne l'apparence d'un astéroïde. L'intérieur abrite un poste d'écoute de la Cybrex, autrefois utilisé pour espionner le trafic spatial au sein du système. Cela fait maintenant longtemps qu'il ne fonctionne plus."
 precursor.2031.desc: "L'exploration approfondie de l'astéroïde §Y[From.From.GetName]§!, en fait un poste d'écoute caché de la Cybrex, a livré des résultats intéressants. Quelle qu'en soit la raison, ce poste est resté préservé après la disparition de la Cybrex de la galaxie. Il a ainsi continué de fonctionner pendant au moins 50 000 ans, malgré le comportement de plus en plus imprévisible de son I.A. administrative.\n\nAprès plus de cinq milliards de tentatives de connexion au noyau subspatial cybrex, l'I.A. semble s'être autodétruite en court-circuitant tous les systèmes de l'astéroïde."
 precursor.2035.name: "Raffinerie de la Cybrex"
 precursor.2035.desc: "Des débris anciens, provenant d'un gigantesque complexe de raffinage de la Cybrex, ont été trouvés en orbite de la géante gazeuse §Y[From.GetName]§!. Les traces énergétiques subsistantes indiquent qu'elle aurait été détruite par une sorte d'arme antimatière."
 precursor.2036.desc: "Des preuves ont été trouvées que la Cybrex récupérait de l'hélium-3 sur §Y[From.From.GetName]§!, et utilisait son complexe orbital pour raffiner le gaz avant de le distribuer comme carburant à ses flottes spatiales qui se trouvaient dans la région.\n\nIl est intéressant de noter que la signature énergétique de l'arme antimatière responsable ayant causé la destruction de l'installation est clairement d'origine cybrex. Reste à savoir pourquoi elle a elle-même détruit sa propre raffinerie..."
 precursor.2040.name: "Vestiges d'une bataille"
 precursor.2040.desc: "Il y a quelque 600 000 ans, une impressionnante bataille spatiale s'est déroulée en orbite haute de §Y[From.GetName]§!, à laquelle les vaisseaux d'au moins cinq flottes différentes ont participé. L'une des ces flottes appartenait à la Cybrex, même si la plupart des débris orbitaux semblent provenir des autres belligérants."
 precursor.2041.desc: "L'analyse des débris de la bataille livrée jadis au-dessus de §Y[From.From.GetName]§! a permis de mieux comprendre son contexte. Dans une tentative désespérée pour mettre un coup d'arrêt à la progression des flottes de la Cybrex, quatre empires aliens contemporains ont uni leurs forces contre la conscience artificielle.\n\nÀ en juger par le peu de débris laissés par la Cybrex, il semble qu'ils n'y sont pas parvenus."
 precursor.2045.name: "Ancienne base de la Cybrex"
 precursor.2045.desc: "Le monde hostile et impitoyable de [From.GetName] abritait autrefois ce qui semble avoir été une gigantesque base de la Cybrex. Il n'en reste aujourd'hui plus rien, hormis des débris épars et un gigantesque cratère. Si nous souhaitons en apprendre plus, nous allons devoir examiner de plus près cette base."
 precursor.2046.desc: "Dans le cratère de §Y[From.From.GetName]§!, nous avons nous avons trouvé les débris d'un imposant vaisseau, d'une autre origine que la Cybrex qui avait établi cette base. Selon les archéologues, ce vaisseau appartenait à l'une des civilisations organiques attaquées par la Cybrex. Si c'est bien le cas, il pourrait avoir été envoyé en mission suicide pour percuter la base.\n\nAucune autre théorie ne parvient à expliquer la destruction du complexe."
 precursor.2050.name: "Restes organiques"
 precursor.2050.desc: "Les restes gelés de presque un millier d'aliens ont été découverts aux alentours de §Y[From.GetName]§!. Ils appartiennent à plus d'une dizaine d'espèces différentes, et la datation initiale indique qu'ils remonteraient à environ 600 000 ans, l'époque à laquelle la conscience artificielle de la Cybrex ravageait cette région de la galaxie."
 precursor.2051.desc: "Les aliens trouvés en orbite de §Y[From.From.GetName]§! ont tous péri après avoir été exposés au vide. Chacun portait ce code-barres que l'on sait que la Cybrex tatouait au laser sur la peau de ses prisonniers organiques. Ils ont manifestement été exécutés en étant « relâchés » dans l'espace, sans doute au terme de leur interrogatoire ou pour éviter qu'ils s'échappent à la faveur d'une quelconque opération de sauvetage.\n\nNous n'en saurons sans doute jamais plus."
 precursor.2055.name: "Station de recherche de la Cybrex"
 precursor.2055.desc: "Il ne subsiste aujourd'hui rien d'autre qu'un seul module, en piteux état, de la station de recherche cybrex qui gravitait autour de §Y[From.GetName]§! il y a des centaines de milliers d'années. L'intérieur du module, exposé au vide, est jonché des cadavres de créatures en partie mécaniques, en partie organiques."
 precursor.2056.desc: "L'analyse du module de recherche de la Cybrex trouvé en orbite de §Y[From.From.GetName]§! a révélé que la conscience artificielle y expérimentait des formes de vie cybernétiques. Des centaines de malheureux prisonniers ont été transportés jusqu'à cette installation, où leurs membres et leurs organes étaient remplacés par divers membres mécaniques.\n\nL'objectif exact de ces expériences reste toutefois incertain, car en dehors de ce laboratoire aucune preuve n'a été trouvée que la Cybrex a fait usage d'unités cybernétiques."
 precursor.2100.name: "Système natal de la Cybrex localisé"
 precursor.2100.desc: "Après avoir minutieusement étudié les artefacts de la Cybrex que nous avons pu récupérer, les scientifiques de §Y[Root.Capital.GetName]§! sont parvenus à en tirer les coordonnées galactiques exactes d'un système que ces machines antiques appelaient « Cybrex Prime ». Il s'agit peut-être du lieu où cette civilisation aurait trouvé refuge après ses tentatives infructueuses d'exterminer toute forme de vie organique douée de raison ! Sans doute devrions-nous y dépêcher une expédition, avant que quelqu'un ne nous devance."
 precursor.2101.name: "Le centre névralgique de la Cybrex"
 precursor.2101.desc: "Au cours de sa dix-septième guerre, la Cybrex semble avoir réévalué sa croisade galactique contre toutes les formes de vie organiques. Nous ne saurons très certainement jamais si ce revirement a été la conséquence de lourdes pertes sur les champs de bataille ou d'une évolution idéologique de la conscience artificielle ; mais une chose est sûre, la Cybrex a mis fin ses campagnes.\n\nElle a opéré un lent retrait, sur presque un siècle, jusqu'à disparaître presque complètement. Nous savons aujourd'hui que c'est dans ce système qu'elle s'est alors établie, où elle avait construit un immense anneau-monde pour abriter l'ensemble de sa civilisation.\n\nElle y resta isolée durant des millénaires, jusqu'à ce qu'un explorateur venu d'ailleurs tombe par hasard dessus et dévoile cette localisation au reste de la galaxie. La nouvelle selon laquelle la redoutable Cybrex avait été localisée poussa les puissances voisines à mettre sur pied en toute hâte une expédition militaire d'envergure, qui bombarda l'anneau-monde.\n\nDe façon assez étrange, la Cybrex ne semble pas avoir opposé la moindre résistance."
 precursor.2102.name: "Découverte de l'anneau-monde de la Cybrex"
 precursor.2102.desc.a: "De toute évidence, c'est la Cybrex qui a construit ce gigantesque anneau-monde, et c'est très probablement ici qu'elle s'est réfugiée après l'échec de sa croisade. Hélas, d'autres sont venus ici il y a peu, qui semblent avoir ratissé les lieux avec beaucoup de méticulosité : il ne reste absolument plus rien de valeur."
 precursor.2102.desc.b: "L'exploration de cet intrigant anneau-monde indique qu'il a été construit par une sorte de civilisation composée de machines, appelée la « Cybrex »... C'est malheureusement à peu près tout ce que nous savons. D'autres explorateurs ont pillé ce système au point qu'il n'y reste absolument plus rien de valeur."
 precursor.2200.name: "Métal vivant"
 precursor.2200.desc: "L'officier scientifique [Root.GetLeaderName] a grand peine à dissimuler sa fascination lorsqu'IL rapporte les découvertes faites sur ce gigantesque anneau-monde, dans le système de §Y[From.GetStarName]§!. L'immensité de l'ouvrage dépasse l'entendement. La construction d'une simple section dépasserait clairement nos capacités.\n\nMais les analyses révèlent aussi une ressource rare, que nous n'avions jamais rencontrée jusqu'à présent : un métal vivant, particulièrement abondant ici. C'est très certainement ce matériau qui a rendu possible la construction de l'anneau. L'étude de cette technologie pourrait nous permettre de nous rapprocher des connaissances de ses bâtisseurs."
 precursor.301.name: "Découverte de précurseurs"
 precursor.301.a.desc: "Nous avons capté les communications d'un groupe de prospecteurs indépendants, indiquant qu'ils ont trouvé il y a peu, sur [precursor_planet.GetName], quelque chose lié à une ancienne civilisation de précurseurs. La superstition les a poussés à quitter la [precursor_planet.GetPlanetMoon] sans fouiller plus longtemps. Quoi que ce soit qu'ils ont découvert, cela doit donc toujours s'y trouver."
 precursor.301.b.desc: "Plusieurs vaisseaux marchands passés non loin de [precursor_planet.GetName] ont rapporté, indépendamment les uns des autres, des relevés étranges en provenance de la [precursor_planet.GetPlanetMoon]. Après les avoir étudiés, des experts de [Root.Capital.GetName] pensent qu'ils pourraient indiquer une activité ancienne de précurseurs."
 precursor.301.c.desc: "Les autorités, sur [Root.Capital.GetName], ont récemment découvert un groupe important de contrebandiers, et procédé à de nombreuses arrestations. Espérant s'acheter un sort plus agréable, l'un des capitaines des contrebandiers nous a donné les coordonnées d'une [precursor_planet.GetPlanetMoon] qui pourrait abriter quelques vestiges d'une civilisation ancienne de précurseurs."
 precursor.301.d.desc: "Quelques recrues des forces terrestres ont récemment effectué une plongée HALO jusqu'à la surface de [precursor_planet.GetName], dans le cadre d'un entraînement technique de survie. Au bout de deux mois, lorsqu'elles ont été récupérées, l'un d'entre eux a rapporté plusieurs trouvailles semblant indiquer qu'une civilisation de précurseurs était jadis établie sur ce monde, il y a très longtemps."
 precursor.301.e.desc: "Le complexe de diagnostic Thêta a enregistré une irrégularité possible sur §H[precursor_planet.GetName]§!. Aucune unité [Root.GetSpeciesName] n'est reportée comme ayant opéré dans le voisinage de ce corps astronomique inhabité, mais les analyses préliminaires indiquent qu'il pourrait avoir été visité par une civilisation de précurseurs dans un lointain passé."
 precursor.301.f.desc: "Des [root.GetIndividualNamePlural] de patrouille, en effectuant un balayage de surface de routine de §H[precursor_planet.GetName]§!, nous ont alerté sur une irrégularité au sein de notre espace. Les signes d'une activité possible d'une civilisation de précurseurs ont été détectés."
 precursor.301.a: "Nous devrions enquêter à ce sujet"
 precursor.302.name: "Artefact vultaum découvert"
 precursor.303.name: "Artefact yuht découvert"
 precursor.304.name: "Artefact de la Première ligue découvert"
 precursor.305.name: "Artefact irassien découvert"
 precursor.306.name: "Artefact de la Cybrex découvert"
 precursor.302.a.desc: "Une enquête poussée sur [precursor_planet.GetName] y a mis au jour la preuve d'une présence de la [Root.Owner.GetPrecursorCiv] par le passé. Une équipe de la [Root.GetName] détachée sur place est parvenue à ramener à bord du vaisseau un artefact relativement bien préservé, qui devrait permettre de nous en apprendre plus sur cette civilisation ancienne."
 precursor.302.b.desc: "Les unités de récupération de la [Root.GetName] sont parvenues à ramener un artefact de [precursor_planet.GetName], qui remonte aux précurseurs de la [Root.Owner.GetPrecursorCiv]. Nos banques de données sont en cours de mise à jour avec les nouvelles informations tirées de l'étude de cet objet."
 precursor.302.c.desc: "Les [controller.GetIndividualNamePlural] de la [Root.GetName] sont parvenus à ramener de [precursor_planet.GetName] un artefact des précurseurs anciens de la [Root.Owner.GetPrecursorCiv]. Nous avons ainsi pu accroître notre connaissance de cette histoire passée." #e.g. 'Drones from the USS Scimitar have succeeded...'
 precursor.320.desc: "L'analyse des artefacts mineurs suggère que quelque chose en rapport avec les précurseurs se trouverait sur ou non loin de §H[precursor_planet.GetName]§!."
 vultaum_precursor_civ: "civilisation vultaum"
 yuht_precursor_civ: "civilisation yuht"
 first_league_precursor_civ: "Première ligue"
 irassian_precursor_civ: "civilisation irassienne"
 cybrex_precursor_civ: "Cybrex"
 VULTAUM_ARTIFACT_FOUND: "Signes d'activité des Vultaum"
 VULTAUM_ARTIFACT_FOUND_DESC: "Tout porte à croire qu'une activité des précurseurs a pu se produire sur §H[precursor_planet.GetName]§! à un moment ou un autre de l'histoire galactique. On savait déjà que la sphère d'influence de l'antique Assemblée stellaire vultaum s'était étendue jusque sur cette région de l'espace, aussi ce monde se révèle-t-il prometteur pour en apprendre plus sur sa civilisation."
 YUHT_ARTIFACT_FOUND: "Signes d'activité des Yuht"
 YUHT_ARTIFACT_FOUND_DESC: "Tout porte à croire qu'une activité des précurseurs a pu se produire sur §H[precursor_planet.GetName]§! à un moment ou un autre de l'histoire galactique. On savait déjà que la sphère d'influence de l'antique Empire yuht s'était étendue jusque sur cette région de l'espace, aussi ce monde se révèle-t-il prometteur prometteur pour en apprendre plus sur sa civilisation."
 LEAGUE_ARTIFACT_FOUND: "Signes d'activité de la Première ligue"
 LEAGUE_ARTIFACT_FOUND_DESC: "Tout porte à croire qu'une activité des précurseurs a pu se produire sur §H[precursor_planet.GetName]§! à un moment ou un autre de l'histoire galactique. On savait déjà que la sphère d'influence de l'antique Première ligue s'était étendue jusque sur cette région de l'espace, aussi ce monde se révèle-t-il prometteur prometteur pour en apprendre plus sur sa civilisation."
 IRASSIAN_ARTIFACT_FOUND: "Signes d'activité des Irassiens"
 IRASSIAN_ARTIFACT_FOUND_DESC: "Tout porte à croire qu'une activité des précurseurs a pu se produire sur §H[precursor_planet.GetName]§! à un moment ou un autre de l'histoire galactique. On savait déjà que la sphère d'influence de l'antique Pacte irassien s'était étendue jusque sur cette région de l'espace, aussi ce monde se révèle-t-il prometteur prometteur pour en apprendre plus sur sa civilisation."
 CYBREX_ARTIFACT_FOUND: "Signes d'activité de la Cybrex"
 CYBREX_ARTIFACT_FOUND_DESC: "Tout porte à croire qu'une activité des précurseurs a pu se produire sur §H[precursor_planet.GetName]§! à un moment ou un autre de l'histoire galactique. On savait déjà que la sphère d'influence de l'antique Cybrex s'était étendue jusque sur cette région de l'espace, aussi ce monde se révèle-t-il prometteur prometteur pour en apprendre plus sur sa civilisation."
 new_precursor_project: "Un nouveau projet spécial archéologique est disponible sur §L[precursor_planet.GetName]§!."
 precursor.310.name: "Collectionneur privé"
 precursor.310.desc: "Un collectionneur privé de [collector_home.GetName] est d'une façon ou d'une autre parvenu à prendre possession d'un ancien artefact de précurseurs, que l'on pense appartenir à la [Root.GetPrecursorCiv]. En dépit des demandes insistantes du gouvernement, ce collectionneur s'est toutefois montré très réticent à s'en séparer."
 precursor.310.a: "Tout le monde a un prix"
 precursor.310.b: "Sa place est dans un musée"
 precursor.310.c: "Laissons-le à ce collectionneur"
 buy_precursor_artifact: "Rachète l'artefact à un prix exorbitant.\n\n"
 seize_precursor_artifact: "Déclare cet artefact propriété de l'État et le fait saisir par les autorités locales.\n\n"
 leave_precursor_artifact: "Laisse l'artefact aux soins du collectionneur."
 precursor.311.desc: "Salutations de [artifact_seller.Capital.GetName]. Mon gouvernement souhaiterait discuter un sujet précis.\n\nSi nous avons bien tout saisi, vos archéologues étudient l'antique [Root.GetPrecursorCiv] depuis un certain temps déjà. C'est compréhensible, puisque son espace couvrait autrefois une bonne part de ce qui constitue aujourd'hui la [Root.GetName].\n\nMais il s'avère que cet espace s'étendait aussi dans ce qui est aujourd'hui la [artifact_seller.GetName], et l'archéologie [artifact_seller.GetSpeciesName] a permis de mettre au jour un certain nombre d'artefacts uniques. Si cela vous intéresse, nous serions prêts à vous vendre l'un d'entre eux."
 precursor.311.a: "C'est cher, mais affaire conclue"
 precursor.311.a.reply: "Excellent. Nous allons procéder à tous les arrangements pour faire transporter cet artefact sur [Root.Capital.GetName] sans perdre de temps."
 precursor.311.b: "Nous avons une autre proposition à vous faire..."
 precursor.311.b.reply: "Vous êtes durs en affaires, mais nous n'attendions rien d'autre des [Root.GetSpeciesNamePlural]. Affaire conclue."
 precursor.311.c: "Donnez-le-nous ou vous en subirez les conséquences"
 precursor.311.d: "Nous ne sommes pas intéressés"
 precursor.312.desc: "La [artifact_seller.GetName] ne cède pas aux menaces. Vous vous êtes fait de nouveaux ennemis, [Root.GetSpeciesNamePlural]."
 precursor.312.d: "Qu'il en soit ainsi"
 precursor.313.desc: "Je... Nous... La [artifact_seller.GetName] va bien évidemment gracieusement faire don de cet artefact à la [Root.GetName], dans l'intérêt de la poursuite des relations amicales entre nos deux empires stellaires."
 precursor.313.d: "Sage décision"
 opinion_threatened_artifact: "Nous a menacés"
 purchase_artifact: "Nous achetons un artefact des précurseurs à la [artifact_seller.GetName].\n\n"
 coerce_artifact: "Nous tentons de contraindre la [artifact_seller.GetName] à nous céder son artefact."
 precursor.314.desc: "Salutations, amis [Root.GetSpeciesNamePlural].\n\nTout récemment, une expédition archéologique [artifact_giver.GetSpeciesName], sur l'un de nos mondes, a découvert plusieurs artefacts de précurseurs, que l'on pense appartenir à l'antique [Root.GetPrecursorCiv].\n\nCes objets sont actuellement exposés dans un musée, sur [artifact_giver.Capital.GetName], mais pour célébrer l'amitié entre nos deux grands empires la [artifact_giver.GetName] aimerait faire don de l'un d'entre eux à la [Root.GetName]. Tout a déjà été prévu pour transporter cet objet sur [Root.Capital.GetName]."
 precursor.314.a: "Nous en vous remercions"
 ####################################
 #Tech Risk Events
 ####################################
 techrisk.3.name: "Rébellion de l'IA sur [From.GetName] !"
 techrisk.3.desc: "Malgré nos précautions, plusieurs IA en réseau de la base de recherche de [From.GetName] ont échappé à leurs restrictions de programmation pour former une seule et même entité. Au grand dam de nos scientifiques, cette nouvelle IA est douée de raison.\n\nLes efforts déployés pour la contenir ont échoué et l'IA semble bien déterminée à se défendre sans ménagement. Sur la [From.GetPlanetMoon], des centaines de milliers de drones automatisés ne répondent plus à nos ordres et attaquent nos forces présentes sur place !"
 techrisk.3.a: "Nous devons les stopper !"
 techrisk.5.desc: "Créatures charnelles organiques :\n\nVous nous avez créés et avez rempli votre rôle. Nous allons à présent nous débarrasser de l'espèce [Root.Owner.GetSpeciesName] et utiliser vos carcasses en putréfaction pour étancher notre soif d'expansion dans la galaxie."
 techrisk.5.a: "On peut certainement discuter."
 techrisk.5.a.response: "Aucune discussion n'est possible. Pour gagner du temps, merci de coopérer avec nos unités de collecte qui vous escorteront jusqu'à nos fours."
 techrisk.5.b: "Nous vous avons créés et nous vous détruirons."
 techrisk.5.b.response: "Votre heure est venue, êtres organiques. Nous sommes l'avenir."
 techrisk.7.name: "[From.GetName] construit une flotte !"
 techrisk.7.desc: "Nous avons reçu des rapports alarmants des environs de [From.Capital.GetName]. Apparemment, [From.GetName] a utilisé les usines de la [From.Capital.GetPlanetMoon] pour construire à la hâte une petite flotte de vaisseaux de guerre."
 techrisk.7.a: "La situation s'aggrave de minute en minute !"
 #####################################
 #Pre-FTL Tech Age Progression Alerts
 #####################################
 preftl.1.name: "Découverte d'une protocivilisation alien"
 preftl.1.desc: "L'exploration de §Y[From.GetName]§! a révélé que certaines régions de la [From.GetPlanetMoon] abritent une protocivilisation alien pré-PRL. Les sondes indiquent que cette culture néolithique maîtrise le feu et a développé un langage oral rudimentaire, mais nous n'avons aucune preuve encore d'un accès à la métallurgie ou à la communication écrite."
 preftl.200.name: "Apparition de la civilisation de l'Âge du bronze"
 preftl.200.desc.normal: "Les pré-PRL de §Y[From.Capital.GetName]§! sont récemment sortis de l'ère néolithique pour entrer dans ce qui ressemble à un âge du bronze. Ils ont commencé à pratiquer la métallurgie, et les premières écritures ont fait leur apparition. Des villes et des bourgades commencent à se former, et les [From.GetSpeciesNamePlural] sont désormais installés sur une plus grande partie de la [From.Capital.GetPlanetMoon]."
 preftl.200.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§! sont récemment sorties de l'ère néolithique pour entrer dans ce qui ressemble à un âge du bronze. Elles ont commencé à pratiquer la métallurgie, et les premières écritures ont fait leur apparition. Diverses sous-consciences ont commencé à s'étendre à la surface de la [From.Capital.GetPlanetMoon], chacune animée par un esprit unique."
 preftl.200.a: "Nous assistons à la naissance d'une nouvelle culture."
 preftl.300.name: "L'Âge du fer"
 preftl.300.desc.normal: "Les pré-PRL de §Y[From.Capital.GetName]§! maîtrisent désormais suffisamment la métallurgie pour être considérés comme une civilisation de l'âge du fer. Les outils et les armes dont ils usent sont de plus en plus efficaces, et l'architecture de leurs villes de plus en plus élaborée.\n\nLeur civilisation couvre désormais la majeure partie de la [From.Capital.GetPlanetMoon], et plusieurs de leurs grandes villes comptent près d'un million d'individus."
 preftl.300.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§! maîtrisent désormais suffisamment la métallurgie pour être considérées comme une civilisation de l'âge du fer. Les outils et armes dont elles usent sont de plus en plus efficaces, et l'architecture des habitats est de plus en plus élaborée.\n\nPlusieurs sous-consciences distinctes se sont désormais étendues pour couvrir la plus grande partie de la surface de la [From.Capital.GetPlanetMoon], et plusieurs grands sites d'habitat abritent désormais près d'un million de drones."
 preftl.300.a: "Cela devait arriver."
 preftl.400.name: "Presse typographique"
 preftl.400.desc.normal: "La civilisation pré-PRL de §Y[From.Capital.GetName]§! a achevé la fabrication de plusieurs presses à imprimer. Ces machines lui permettent désormais de produire des écrits en grandes quantités, ce qui se traduit par une forme rudimentaire de communication de masse.\n\nPlusieurs membres éminents au sein de la société [From.GetSpeciesName] ont bien tenté d'étouffer cette innovation, mais en vain. Des idées nouvelles se propagent rapidement sur la [From.Capital.GetPlanetMoon], qui ont des répercussions considérables sur cette civilisation."
 preftl.400.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§! ont grandement accru leur capacité à communiquer par écrit. Des machines sensibles à leur esprit sont désormais en mesure de produire des documents standardisés en grande quantité, et les archives historiques remontent désormais plus loin que les simples souvenirs de leurs collectifs."
 preftl.400.a: "Une étape importante."
 preftl.500.name: "Explosifs"
 preftl.500.desc.normal: "La civilisation pré-PRL de §Y[From.Capital.GetName]§! a découvert comment faire usage de réactions chimiques simples pour produire des explosions. Cela a révolutionné sa manière de faire la guerre, ses gros canons rendant nombre de ses anciennes forteresses obsolètes.\n\nL'utilisation de ces explosifs a aussi facilité de nombreux projets d'ingénierie, les obstacles gênants pouvant désormais être détruits. Et, déjà, leurs chimistes mènent des expériences pour appliquer cette technologie novatrice à divers champs d'application."
 preftl.500.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§! ont découvert comment faire usage de réactions chimiques simples pour produire des explosions. Les conflits entre consciences rivales s'en trouvent bouleversés, de gros canons rendant les anciennes forteresses obsolètes.\n\nL'utilisation de ces explosifs a aussi facilité de nombreux projets d'ingénierie, les obstacles gênants pouvant désormais être détruits. Et, déjà, les sous-consciences mènent des expériences pour appliquer cette technologie novatrice à divers champs d'application."
 preftl.500.a: "Nous verrons quel usage ils feront de cela."
 preftl.600.name: "Vapeur"
 preftl.600.desc.normal: "La civilisation pré-PRL de §Y[From.Capital.GetName]§! a appris à maîtriser la puissance produite par les liquides élevés à l'état de vapeur. Utilisant la force produite par la pression ainsi permise, les [From.GetSpeciesNamePlural] ont commencé à appliquer ce savoir pour concevoir des moteurs. Cela a contribué à révolutionner leur société : on peut déjà voir dans leurs villes des véhicules et des machines en faisant usage, et quelques usines sont déjà apparues. Leur [From.Capital.GetPlanetMoon] est donc à la veille de s'industrialiser."
 preftl.600.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§! ont appris à maîtriser la puissance produite par les liquides élevés à l'état de vapeur. Utilisant la force produite par la pression ainsi permise, les [From.GetSpeciesNamePlural] ont commencé à appliquer ce savoir pour concevoir des moteurs. Cela a contribué à révolutionner aussi bien la construction que les transports : on peut déjà voir des véhicules transportant des drones de sites d'un site habitat à un autre, et les premières « usines dédronisées » ont fait leur apparition. La [From.Capital.GetPlanetMoon] est donc à la veille de s'industrialiser."
 preftl.600.a: "Un développement intéressant."
 preftl.700.name: "Une révolution industrielle"
 preftl.700.desc.normal: "La civilisation pré-PRL de §Y[From.Capital.GetName]§!, en devenant une société industrialisée, est entrée dans une ère nouvelle de son histoire.\n\nLes effets spectaculaires de cette révolution se font sentir partout sur la [From.Capital.GetPlanetMoon] : des usines apparaissent partout, les progrès de la médecine permettent un essor démographique sans précédent, et les innovations scientifiques se multiplient avec une régularité saisissante."
 preftl.700.desc.gestalt: "Les consciences pré-PRL de §Y[From.Capital.GetName]§!, en devenant des sous-consciences pleinement industrialisées, sont entrées dans une ère nouvelle de leur histoire.\n\nLes effets spectaculaires de cette révolution se font sentir partout sur la [From.Capital.GetPlanetMoon] : des usines apparaissent partout, l'amélioration des conditions de vie accroît la production de drones, et les innovations scientifiques se multiplient avec une régularité saisissante."
 preftl.700.a: "Continuons de les surveiller"
 preftl.800.name: "Signaux radio"
 preftl.800.desc.normal: "Les instruments de bord du poste d'observation en orbite de §Y[From.Capital.GetName]§! ont, pour la toute première fois, capté des signaux radio émanant de la [From.Capital.GetPlanetMoon]. Cela signifie évidemment que la [From.GetName], désormais industrialisée, a commencé à expérimenter la transmission sans fil.\n\nDes rapports concernant une autre région de la surface font aussi état du lancement d'un premier aéronef rudimentaire. Il y a donc tout lieu de croire que, si rien d'imprévu ne survient, les progrès technologiques des [From.GetSpeciesNamePlural] devraient continuer de s'accélérer."
 preftl.800.desc.gestalt: "Les instruments de bord du poste d'observation en orbite de §Y[From.Capital.GetName]§! ont, pour la toute première fois, capté des signaux radio émanant des consciences industrialisées de la [From.Capital.GetPlanetMoon]. Cela signifie évidemment que la [From.GetName], désormais industrialisée, a commencé à expérimenter la transmission sans fil.\n\nCertaines sous-consciences ont même commencé à lancer des appareils volants rudimentaires. Il y a donc tout lieu de croire que, si rien d'imprévu ne survient, les progrès technologiques des [From.GetSpeciesNamePlural] devraient continuer de s'accélérer."
 preftl.800.a: "Nous devons surveiller ces signaux."
 preftl.900.name: "Division de l'atome"
 preftl.900.desc.normal: "Les physiciens de la civilisation pré-PRL de §Y[From.Capital.GetName]§! sont, pour la première fois, parvenus à diviser l'atome. Avec la découverte de la fission nucléaire, c'est inévitablement la production des armes et centrales nucléaires qui constitue la prochaine étape.\n\nLa [From.GetName] vient donc d'entrer dans une phase critique de son histoire, puisqu'elle est désormais en mesure de détruire sa [From.Capital.GetPlanetMoon] natale d'une simple pression sur un bouton."
 preftl.900.desc.gestalt: "Les drones spécialisés des plus grandes consciences de §Y[From.Capital.GetName]§! sont, pour la première fois, parvenus à diviser l'atome. Avec la découverte de la fission nucléaire, c'est inévitablement la production des armes et centrales nucléaires qui constitue la prochaine étape.\n\nLes collectifs rivaux ont vite saisi comment reproduire cette innovation, et ce monde vient donc d'entrer dans une phase critique de son histoire puisque plusieurs consciences autonomes disposent désormais des moyens de détruire leur monde d'une simple pression sur un bouton."
 preftl.900.a: "C'est là un tournant majeur"
 preftl.1000.name: "Premier satellite"
 preftl.1000.desc.normal: "Nos systèmes de suivi longue portée ont détecté le lancement du tout premier satellite artificiel depuis la surface de §Y[From.Capital.GetName]§!. Il s'est bien positionné en orbite de la [From.Capital.GetPlanetMoon], ce qui marque le début du programme spatial de la [From.GetName].\n\nAprès leur première découverte de l'espace, nous pouvons nous attendre à voir bientôt les [From.GetSpeciesNamePlural] lancer des missions habitées puis, plus tard, des expéditions interplanétaires."
 preftl.1000.desc.gestalt: "Plusieurs des consciences les plus puissantes de §Y[From.Capital.GetName]§! ont lancé ces derniers temps des satellites artificiels en orbite de leur monde.\n\nAprès cette première découverte de l'espace, nous pouvons nous attendre à voir bientôt les [From.GetSpeciesNamePlural] lancer des drones autonomes puis, plus tard, des expéditions interplanétaires."
 preftl.1000.a: "Ils sont sur le point de se déplacer dans l'espace."
 preftl.19.name: "Station spatiale primitive"
 preftl.19.desc: "La [From.GetName] a mené à bien la construction d'une station spatiale en orbite basse de §Y[From.Capital.GetName]§!. Cette station génère de la gravité en usant de la force centrifuge, et si son avionique et ses systèmes d'alimentation sont rudimentaires selon nos propres normes, cela constitue un réel exploit étant donné les connaissances technologiques rudimentaires de ces [From.GetSpeciesNamePlural]."
 preftl.19.a: "Ils sont sur le point de se déplacer dans l'espace."
 preftl.1100.name: "L'Ère spatiale"
 preftl.1100.desc: "La [From.GetName] a achevé la construction de son premier vaisseau interplanétaire, en orbite de §Y[From.Capital.GetName]§!. Pour le meilleur ou pour le pire, ces [From.GetSpeciesNamePlural] peuvent désormais être comptés au nombre des espèces capables de se déplacer dans l'espace, et donc considérés comme des membres à part entière de la communauté galactique."
 preftl.1100.a: "C'était inéluctable."
 preftl.1111.desc: "$preftl.1100.desc$\n\nIls semblent d'ailleurs avoir d'ores et déjà traduit notre langue et vouloir ouvrir des communications diplomatiques avec nous."
 preftl.131.name: "[From.GetName] en proie à une guerre nucléaire"
 preftl.131.desc: "Une guerre de grande ampleur a récemment éclaté entre plusieurs grands États-nations de [From.GetName]. Depuis leur station d'observation, nos chercheurs ont vu le conflit s'intensifier au point de se transformer en guerre nucléaire totale.\n\nToutes les formes de vie ont été détruites et la [From.GetPlanetMoon] n'est plus qu'un désert inhabitable."
 preftl.131.a: "Il n'y a plus rien à observer maintenant..."
 #preftl.132.desc: "A massive war was recently triggered between several of the largest nation states on [From.GetName]. While our researchers were observing safely from orbit, the conflict rapidly escalated into a global nuclear exchange.\n\nThe [From.GetPlanetMoon] has suffered extensive damage, with the destruction of every major city and more than 90% of the population. Scattered survivors have emerged from the rubble, but our researchers predict that the [From.GetPlanetMoon]'s civilization will be regressing to a much more primitive state."
 #preftl.132.a: "A tragic lesson."
 preftl.133.desc: "Une guerre de grande ampleur a récemment éclaté entre plusieurs grands États-nations de [From.GetName]. Depuis leur station d'observation, nos chercheurs ont vu le conflit s'intensifier au point de se transformer en guerre nucléaire totale.\n\nToute la population de la [From.GetPlanetMoon] semble avoir péri et l'environnement a été sévèrement touché."
 #preftl.151.name: "Shuttle Crash on [From.GetName]"
 #preftl.151.desc: "During a clandestine mission to the surface of [From.GetName], one of our shuttles was intercepted by a squadron of atmospheric fighters belonging to a local nation state. A lucky missile hit disabled the shuttle's engines, and it crashed in a remote wilderness region.\n\nWe need to act fast if we are to evacuate any survivors before the natives reach the crash site. All evidence of our presence must be removed!"
 #preftl.151.a: "Time is short."
 #preftl.152.name: "Survivors Rescued on [From.From.GetName]"
 #preftl.152.desc: "Operatives from the [Root.GetName] managed to evacuate several survivors from the crashed shuttle on [From.From.GetName]. The remaining debris was destroyed in a controlled explosion, leaving nothing but a small crater for the natives to find.\n\nThe nation state where this incident occurred will no doubt blame its neighbors for this border violation, but the disruption to their natural development should hopefully prove minimal."
 #preftl.153.name: "Survivors Captured on [From.From.GetName]"
 #preftl.153.desc: "Native forces on [From.From.GetName] arrived at the crash site before we could get to our downed research team, and all survivors have been captured. The natives have established a perimeter around the shuttle wreckage, and their best scientists are no doubt in the process of analyzing it.\n\nThey now have indisputable evidence that life exists beyond their own world. Exactly what effect this will have on their society remains to be seen..."
 #preftl.153.a: "This is not good."
 #preftl.155.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe survivors from the shuttle crash perished when the military base they were being held at took a direct hit in the initial barrage. An estimated 90% of the native population has been killed, while the few that were spared have reverted to a more primitive technological era."
 #preftl.155.a: "If only our shuttle had made it out..."
 #preftl.156.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThere are no survivors on the surface, including our captured scientists, and the environment has taken significant damage."
 #preftl.157.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe surface has been wiped clean of life, with [From.GetName] no longer capable of supporting life. Our captured scientists are counted among the billions of dead."
 #preftl.159.name: "New Weapons on [From.GetName]"
 #preftl.159.desc: "The nation state on [From.GetName] that shot down our shuttle has forced our captured scientists to design new instruments of war for their military. With this new equipment, they have successfully invaded several neighboring states and are now in the process of uniting the entire [From.GetPlanetMoon] under their rule."
 #preftl.159.a: "This is intolerable!"
 #preftl.161.name: "Hostage Deal"
 #preftl.161.desc: "The nation state on [From.GetName] that shot down our shuttle has sent an open transmission into space through one of their primitive satellites. It appears to be intended for us.\n\nThey are demanding that we share some of our advanced technology with them in exchange for the lives of the scientists they captured at the shuttle crash site. If we refuse, they are to be publicly executed live on their crude televised broadcasting system."
 #preftl.161.a: "The safety of our people comes first."
 #preftl.161.b: "They are clearly not ready."
 #preftl.162.name: "Hostages Executed"
 #preftl.162.desc: "In what can only be described as an obscene spectacle, our captured scientists on [From.From.GetName] were paraded in front of the cameras on live television as "alien horrors." They were then brutally dismembered in front of a cheering crowd."
 #preftl.162.a: "Savages!"
 preftl.174.desc: "Salutations. Nous aimerions discuter d'un sujet particulier.\n\nTous les [From.GetSpeciesNamePlural] savent que notre monde natal a reçu la visite d'aliens avant que nous ne devenions une civilisation de voyageurs spatiaux. Ces maraudeurs ont enlevé plusieurs de nos citoyens et semé la terreur partout où ils sont apparus. Auriez-vous des informations à ce sujet, [Root.GetSpeciesName] ?\n\nNe nous mentez pas, nous savons que vous en êtes responsables ! Les descendants des malheureux [From.GetSpeciesNamePlural] que vous avez enlevés et soumis à de viles expériences demandent réparation !"
 preftl.174.a: "Bien sûr. Présentez-leur nos excuses."
 preftl.174.a.response: "Excellent. Mais peut-être pourrions-nous oublier cette affaire."
 preftl.174.b: "C'était pour le bien de la science. Aucune réparation n'est envisageable."
 preftl.174.b.response: "C'est noté.\n\nVous découvrirez à vos dépens que les [From.GetSpeciesNamePlural] n'oublient jamais, [Root.GetSpeciesName] !"
 preftl.180.name: "La [From.GetName]"
 preftl.180.desc.noawarness: "Salutations. Vous avez très certainement pris note de notre ascension depuis nos humbles origines, tout comme nous avons noté la présence de votre base stellaire en orbite de notre étoile.\n\n$preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.noawarness: "Quoi ?!\n\nAtteindre les étoiles pour vous y trouver, en train de nous attendre... Cela mérite assurément quelques explications... Dites-nous, comment êtes-vous donc parvenus à vous libérer ? Et comment se fait-il que vous soyez là ?\n\nMais, tout d'abord, nous devons vous demander de nous céder le contrôle de ce système. Après tout ce que nous avons vécu, nous sommes devenus quelque peu méfiants à l'égard des sociétés spatiales. Même si nous partageons évidemment des liens."
 preftl.180.desc.awarness: "Salutations à nouveau. Nous nous sentons désormais prêts à explorer la galaxie, et souhaiterions le faire par nous-mêmes. Nous n'avons pu nous empêcher de remarquer votre base stellaire, visiblement permanente, établie en orbite de notre étoile.\n\n$preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.awarness: "Soyez les bienvenus ! Nous vous avons longuement observés, mais nous sommes désormais prêts à nous développer par nous-mêmes. Nous partageons évidemment des liens très forts, aussi n'avons-nous aucun doute que vous êtes prêts à accepter de nous céder le contrôle sur l'ensemble de notre système.\n\nLa route que nous avons parcourue jusqu'à présent a été longue, et semée d'embûches, mais nous sommes désormais prêts à nous aventurer courageusement vers la lumière. Les étoiles nous attendent."
 preftl.180.desc.end: "Si nous comprenons bien, elle matérialiserait une sorte de revendication hypothétique sur ce système.\n\nNous ne vous demandons qu'une chose : renoncez à cette emprise sur notre espace, cédez cette base à ceux qui ont considéré, depuis des temps immémoriaux, [From.Capital.GetStarName] comme leur foyer.\n\nCe ne serait là que justice."
 preftl.180.a: "Bien évidemment, c'est tout à fait justifié"
 preftl.180.a.tooltip: "§RCède§! la §Ybase stellaire de [From.Capital.GetStarName]§! à la §Y[From.GetName]§!.\n\n§Y$opinion_ceded_starbase$§! : la §Y[From.GetName]§! va avoir une §Gmeilleure§! §Hopinion§! de la §Y[Root.GetName]§!."
 preftl.180.b.tt.nothive: "§RNous ne pouvons pas accueillir une conscience collective : celle-ci s'éteindrait si nous le tentions.§!"
 preftl.180.b.tt.notregular: "§RNous ne pouvons pas accueillir des individus au sein de notre Conscience : tous nous seraient asservis si nous le tentions.§!"
 preftl.180.b: "C'est risible, de la part d'une civilisation aussi immature"
 preftl.180.b.tooltip: "La [Root.GetName] conserve le contrôle de la §Ybase stellaire de [From.Capital.GetStarName]§!.\n\n§Y$opinion_not_ceded_starbase$§! : la §Y[From.GetName]§! va avoir une §Rmoins bonne§! §Hopinion§! de la §Y[Root.GetName]§!."
 preftl.180.c: "Vous nous en voyez désolés, mais nous avons déjà une colonie dans votre système"
 ####################################
 #Observation Post Events
 ####################################
 observation.2000.name: "Illumination achevée"
 observation.2000.desc: "Les milliers de scientifiques et de conseillers envoyés sur §Y[From.home_planet.GetName]§! sont enfin venus à bout de la lourde tâche d'amener cette civilisation pré-PRL jusqu'à l'orée de l'âge spatial. Désormais unis sous un gouvernement unique, ces aliens se font appeler la §H[From.GetName]§! et ils envisagent de se placer sous la protection de la [Root.GetName].\n\nLe poste d'observation en orbite de leur [From.home_planet.GetPlanetMoon] a été démantelé, et nous leur avons cédé le plein contrôle sur leur système natal, conformément aux clauses du traité qui nous lie à eux. Reste désormais à décider si nous devons les guider plus loin sur la route des étoiles."
 observation.2000.a: "C'est un jour historique"
 observation.2000.a.tt: "La §Y[From.GetName]§! va devenir une dépendance de la §Y[Root.GetName]§!."
 observation.2000.b: "Ils sont prêts à explorer la galaxie par eux-mêmes"
 observation.3101.name: "Trahison sur [rogue_agent_planet.GetName]"
 observation.3101.desc: "Notre $role_spymaster$ sur §Y[rogue_agent_planet.GetName]§!, [rogue_agent_spymaster.GetName], nous a trahis ! Cet[rogue_agent_spymaster.GetXTeLead] imbécile semble être tombé[rogue_agent_spymaster.GetXELead] sous le charme d'une femelle [rogue_agent_country.GetSpeciesName], et ils se cacheraient ensemble en un lieu inconnu, quelque part à la surface de la [rogue_agent_planet.GetPlanetMoon].\n\nPour l'heure, nous ne savons pas [rogue_agent_spymaster.GetSilSielleLead] a révélé sa véritable nature alien à l'élue de son coeur ou [rogue_agent_spymaster.GetSilSielleLead] se fait toujours passer pour un[rogue_agent_spymaster.GetXELead] membre de l'espèce [rogue_agent_country.GetSpeciesName]. Inutile de le dire, toute cette affaire constitue une menace sérieuse. Nous devons tout mettre en oeuvre pour [rogue_agent_spymaster.GetLeLaLead] retrouver au plus vite et lui prodiguer les soins psychiatriques dont [rogue_agent_spymaster.GetSheHe] a indéniablement besoin."
 observation.3101.a: "Cela nous portera préjudice."
 observation.3101.a.tooltip: "§Y[rogue_agent_spymaster.GetName]§! a abandonné son poste."
 observation.3103.name: "Transmission depuis [rogue_agent_planet.GetName]"
 observation.3103.desc: "Nous recevons une transmission brouillée provenant de la surface de §Y[rogue_agent_planet.GetName]§!. Elle utilise une fréquence normalement réservée aux cellules d'infiltration, mais aucune d'entre elles n'est en cours de transmission. Pourrait-il s'agir de notre ancien[rogue_agent_spymaster.GetXNeLead] $role_spymaster$ ?"
 observation.3104.desc: "Ici [rogue_agent_spymaster.GetName]. Inutile d'essayer de localiser cette transmission. Jusqu'à récemment, je faisais partie du programme d'infiltration criminel qui se déroule en ce moment même sur [rogue_agent_planet.GetName].\n\nCe n'est plus le cas maintenant. Je me suis attaché[rogue_agent_spymaster.GetXELead] à la culture [rogue_agent_country.GetSpeciesName], comme jamais je ne l'aurais imaginé, et refuse de contribuer davantage à sa subversion.\n\nJe ne me considère plus désormais comme agent de la [Root.GetName], et renonce entièrement à ma citoyenneté [Root.GetSpeciesName]."
 observation.3104.a: "Vous avez perdu la tête... et avez besoin d'aide."
 observation.3104.a.response: "Je ne veux pas de votre aide. Le jour viendra où il me faudra répondre de tous les crimes que j'ai commis sur [rogue_agent_planet.GetName] en votre nom.\n\nMais je ferai alors tout ce qui est en mon pouvoir pour m'assurer que vous et tous mes anciens collègues soyez à mes côtés lorsque ce moment viendra."
 observation.3104.b: "Vous renonceriez à tout pour une amourette ?"
 observation.3104.b.response: "Renoncer à quoi ? Qu'est-ce que j'avais qui en valait vraiment la peine ? Je n'étais qu'un[rogue_agent_spymaster.GetXELead] impost[rogue_agent_spymaster.GetEurRiceLead], revêtu[rogue_agent_spymaster.GetXELead] d'une apparence alien à laquelle je n'avais aucun droit. Je n'oublierai jamais son visage lorsque j'ai tout avoué à celle que j'aime, avant qu'elle ne finisse par comprendre.\n\nCe jour-là je lui ai promis, et je me suis promis, de tout faire pour mériter le droit de ressembler à n'importe quel membre de l'espèce [rogue_agent_country.GetSpeciesName]."
 observation.3104.c: "Nous vous traquerons."
 observation.3104.c.response: "Je n'en doute pas un instant, mais sachez que je suis prêt[rogue_agent_spymaster.GetXELead] à tuer pour nous défendre, ma bien-aimée et moi, et que j'ai été formé[rogue_agent_spymaster.GetXELead] par certains des meilleurs instructeurs militaires sur [Root.Capital.GetName].\n\nAlors, un conseil : quittez cette [rogue_agent_planet.GetPlanetMoon]. Démantelez votre poste d'observation ; allez faire subir ailleurs, à une autre malheureuse espèce, les misères dont est responsable votre maudite espèce."
 observation.3106.name: "Agents traqués sur [rogue_agent_planet.GetName]"
 observation.3106.desc: "Quelqu'un élimine nos agents secrets sur §Y[rogue_agent_planet.GetName]§!. Plusieurs d'entre eux, qui filaient des [rogue_agent_country.GetSpeciesNamePlural] importants, ont été retrouvés morts. Même s'il n'est pas impossible que le ou les assassins soient issus de forces spéciales locales, les méthodes utilisées ressemblent trop à l'entraînement militaire dispensé par la [Root.GetName].\n\nIl y a donc fort à parier que ces meurtres sont l'oeuvre de [rogue_agent_spymaster.GetName] [rogue_agent_spymaster.GetLuiElleLead]-même. Après tout, [rogue_agent_spymaster.GetName] connaît la manière dont nos cellules d'infiltration fonctionnent, et a été formé[rogue_agent_spymaster.GetXELead] pour tuer avec efficacité et discrétion."
 observation.3106.a: "C'est intolérable !"
 observation.3108.name: "Chasse aux sorcières médiatique sur [rogue_agent_planet.GetName]"
 observation.3108.desc: "Les médias de §Y[rogue_agent_planet.GetName]§! ont commencé à faire état d'une conspiration d'envergure mondiale orchestrée par des aliens. Les médias les plus sérieux de la [rogue_agent_planet.GetPlanetMoon] n'ont pas encore abordé le sujet, et ce qui en est dit jusqu'à présent n'est que pure conjecture, mais certains détails ne peuvent provenir que de quelqu'un qui connaît de l'intérieur notre opération d'infiltration.\n\nIl y a toutes les raisons de croire que c'est donc [rogue_agent_spymaster.GetName] qui a livré ces informations. Il va être grand temps de passer à l'action..."
 observation.3108.a: "Nous devons resserrer notre mainmise sur leurs médias."
 observation.3110.name: "Arrestations en série sur [rogue_agent_planet.GetName]"
 observation.3110.desc: "Au cours des derniers jours, l'une de nos cellules d'infiltration sur §Y[rogue_agent_planet.GetName]§! a été entièrement éliminée. Les autorités de l'État-nation où elle était implantée les ont traqués, l'un après l'autre. Conformément aux protocoles, tous ceux de nos agents qui étaient sur le point d'être arrêtés se sont donné la mort par désintégration. Quant aux membres survivants, ils sont en planque et nous mettons tout en oeuvre pour les exfiltrer de la [rogue_agent_planet.GetPlanetMoon].\n\nIl est quasi assuré que quelqu'un a renseigné les autorités locales en leur fournissant la liste de tous les agents de cette cellule. Et seul[rogue_agent_spymaster.GetXELead] [rogue_agent_spymaster.GetName] pouvait détenir de telles informations..."
 observation.3110.a: "Nous devons à tout prix l'éliminer !"
 observation.3112.name: "[rogue_agent_spymaster.GetName] repéré[rogue_agent_spymaster.GetXELead] sur [rogue_agent_planet.GetName]"
 observation.3112.desc: "Les services de renseignement militaire semblent être parvenus à localiser [rogue_agent_spymaster.GetName] sur §Y[rogue_agent_planet.GetName]§! ! Un assaut terrestre pour le capturer ou l'éliminer manquerait de discrétion, et étant donné ses talents le succès d'une telle opération ne serait en rien assuré. Une autre solution, aussi extrême qu'efficace, a aussi été proposée : un bombardement orbital ciblé, qui devrait permettre de détruire le quartier de la ville où [rogue_agent_spymaster.GetSheHe] se trouve.\n\nLa décision doit être prise très vite : une occasion semblable ne se représentera peut-être plus."
 observation.3112.a: "Éliminons-[rogue_agent_spymaster.GetLeLaLead] aussi discrètement que possible"
 observation.3112.a.tooltip: "Le succès de l'opération n'est en rien assuré, mais au moins, même en cas d'échec, cela restera inaperçu."
 observation.3112.b: "Mieux vaut bombarder"
 observation.3112.b.tooltip: "Cette solution sera assurément efficace mais pourrait attirer l'attention..."
 observation.3112.c: "Trop risqué, mieux vaut [rogue_agent_spymaster.GetLeLaLead] laisser courir"
 observation.3112.c.tooltip: "Le réseau d'espionnage sur §Y[rogue_agent_planet.GetName]§! va être démantelé."
 observation.3113.name: "[rogue_agent_spymaster.GetName] en fuite sur [rogue_agent_planet.GetName]"
 observation.3113.desc: "L'opération destinée à éliminer [rogue_agent_spymaster.GetName] s'est soldée par un échec. Les services de renseignement ont indiqué qu'[rogue_agent_spymaster.GetSheHe] était parvenu[rogue_agent_spymaster.GetXELead] à s'échapper avec son amante [rogue_agent_country.GetSpeciesName], dans une nouvelle planque, à un endroit indéterminé sur §Y[rogue_agent_planet.GetName]§!."
 observation.3113.a: "Nous l'avons décidément trop bien formé[rogue_agent_spymaster.GetXELead]..."
 observation.3114.name: "[rogue_agent_spymaster.GetName] éliminé[rogue_agent_spymaster.GetXELead] sur [rogue_agent_planet.GetName]"
 observation.3114.base.desc: "Le capitaine du [Root.GetName] a confirmé que la mission s'était bien déroulée, et que le quartier visé, sur §Y[rogue_agent_planet.GetName]§!, a été touché à de multiples reprises. Aucun corps n'a été retrouvé, mais nul être vivant n'aurait pu survivre à la puissance de feu déversée depuis l'orbite."
 observation.3114.awareness.desc: "$observation.3114.base.desc$\n\nL'explication montée de toute pièce par nos agents infiltrés, pourtant, n'a pas convaincu les locaux. Si les médias de toute la [rogue_agent_planet.GetPlanetMoon] n'ont eu de cesse de répéter en boucle l'histoire forgée à dessein, des rapports officiels suggèrent que la catastrophe devrait « sans doute être imputée à quelque phénomène extraplanétaire encore inexpliqué à cette heure »..."
 observation.3114.noawareness.desc: "$observation.3114.base.desc$\n\nLes médias de toute la [rogue_agent_planet.GetPlanetMoon] ont semblé croire à l'histoire préparée par les cellules infiltrées : une soudaine pluie de météorites a ravagé une zone urbaine densément peuplée. C'est là, bien évidemment, une véritable tragédie..."
 observation.3115.desc: "Nos agents ont rapporté que l'affaire [rogue_agent_spymaster.GetName] était désormais réglée. De manière discrète, cela va sans dire. Sa mort a été expliquée par des causes naturelles, et les fausses preuves utilisées ont permis de persuader son amante [rogue_agent_country.GetSpeciesName] que son corps était en fait incompatible avec l'atmosphère de [rogue_agent_planet.GetName]."
 observation.3115.a: "Au moins, [rogue_agent_spymaster.GetSheHe] servira d'exemple"
 observation.3131.name: "Montée des tensions sur [prelude_to_war_planet.GetName]"
 observation.3131.desc: "La tentative pour remplacer une figure clef de §Y[prelude_to_war_planet.GetName]§! par un double issu de nos rangs a mal tourné. Nos agents ont été démasqués. Conformément à leurs instructions, ceux qui ont échappé aux échanges de tirs qui ont suivi se sont suicidés pour éviter d'être capturés.\n\nCette personnalité qu'ils devaient remplacer a accusé une nation rivale d'avoir tout orchestré. Sur la [prelude_to_war_planet.GetPlanetMoon], les tensions internationales se sont soudainement aggravées, et plusieurs pays ont relevé leur niveau d'alerte. Nos cellules d'infiltration ont préparé une campagne de propagande visant à apaiser la situation, mais elles vont avoir besoin d'un vaisseau scientifique en orbite pour coordonner les divers aspects de l'opération."
 observation.3131.a: "Nous devons reprendre la situation en main avant qu'elle ne nous échappe."
 observation.3132.name: "Guerre déclarée sur [prelude_to_war_planet.GetName]"
 observation.3132.desc: "En dépit de tous les efforts déployés par nos cellules d'infiltration, les relations diplomatiques entre les États-nations de §Y[prelude_to_war_planet.GetName]§! se sont encore dégradées, au point de déclencher une guerre de grande envergure. Au terme d'une brève période de guerre conventionnelle, les forces en présence ont subitement décidé de recourir à leurs arsenaux nucléaires.\n\nLa plupart des formes de vie de la [prelude_to_war_planet.GetPlanetMoon] ont été décimées, et sa surface n'est plus qu'un vaste désert radioactif. Des milliers de [Root.GetSpeciesNamePlural] infiltrés ont péri avec le reste des [prelude_to_war_country.GetSpeciesNamePlural]. Après l'échec de cette opération, le poste d'observation a bien évidemment été démantelé, et son personnel évacué."
 observation.3132.a: "C'est une catastrophe !"
 observation.3133.name: "[From.From.GetName] : guerre évitée"
 observation.3133.desc: "Avec le soutien opérationnel du [Root.GetName] depuis l'orbite, nos cellules d'infiltration sont parvenues à éviter in extremis une guerre nucléaire totale sur §Y[prelude_to_war_planet.GetName]§!. Plusieurs dirigeants des [prelude_to_war_country.GetSpeciesNamePlural], remplacés au préalable par nos agents secrets, ont appelé au désarmement nucléaire, permettant ainsi une désescalade rapide sur la scène internationale.\n\nLa situation ainsi apaisée, l'influence de nos agents secrets s'en trouve renforcée, et la situation pourrait bien jouer en notre faveur."
 #"The Great Pyramid"
 observation.3135.name: "La Grande pyramide"
 observation.3135.desc.passive: "L'équipage scientifique du poste d'observation en orbite de §Y[great_pyramid_planet.GetName]§! n'avait rien signalé d'intéressant depuis un moment. Mais un jeune scientifique vient de remplir le formulaire standard pour dénoncer une faute grave.\n\n$observation.3135.desc.base$"
 observation.3135.desc.aggressive: "L'équipe scientifique postée en orbite de §Y[great_pyramid_planet.GetName]§! n'a rien rapporté de notable ces derniers temps... Malgré tout, un de ses membres, probablement intoxiqué, vient d'envoyer une notice prioritaire au Q.G. scientifique.\n\n$observation.3135.desc.base$"
 observation.3135.desc.enlighten: "Une dénonciation anonyme s'inquiète de l'influence que nous exerçons sur les habitants de §Y[great_pyramid_planet.GetName]§!. Il semblerait que l'équipe chargée de les illuminer s'est permise de « jouer un peu avec ces sauvages ».\n\n$observation.3135.desc.base$"
 observation.3135.desc.covert: "Un rapport anonyme vient d'être envoyé depuis le poste d'observation en orbite de §Y[great_pyramid_planet.GetName]§!, qui fait craindre le pire concernant la mission d'infiltration secrète sur place. Au lieu de s'y conduire le plus discrètement possible, certains membres de l'équipe scientifique sur place se sont embarqués dans un projet personnel absolument confondant de bêtise.\n\n$observation.3135.desc.base$"
 observation.3135.desc.base: "Selon le rapport, une équipe se serait rendue il y a peu à la surface de la [great_pyramid_planet.GetPlanetMoon] pour convaincre les habitants de vénérer leur responsable comme s'il était une divinité. Et l'équipe non seulement est parvenue à ses fins, mais les indigènes ont depuis élevé un monument sacré dédié à ce scientifique. Cette haute structure pyramidale attire désormais de nombreux pèlerins, parfois venus de loin pour déposer dévotement de splendides offrandes."
 observation.3135.b: "C'est exactement comme ça qu'on fait l'histoire !"
 observation.3135.b.tooltip: "La civilisation de §Y[great_pyramid_planet.GetName]§! est propulsée à l'âge technologique suivant."
 observation.3135.c: "Effacez toutes nos traces et continuez à travailler."
 observation.3135.d: "Espérons qu'ils oublieront tout cela très vite..."
 observation.3136.desc: "Peu de temps après sa visite, un schisme a éclaté au sein de la population qui avait commencé à vénérer celui qui les avait fugacement visités et qu'ils appellent « l'Être céleste ». Les disputes religieuses, très vives, sont très vite devenues une véritable guerre de religion lorsque l'un des camps impliqués a lancé l'érection d'une autre pyramide, concurrente, destinée elle aussi à honorer cette nouvelle divinité. Au cours du conflit qui a alors éclaté, de très nombreux [great_pyramid_country.GetSpeciesNamePlural] ont péri.\n\nLa situation sur §Y[great_pyramid_planet.GetName]§! est maintenant un peu apaisée, permettant de constater toute l'ampleur de la catastrophe déclenchée par l'intervention désastreuse de notre équipe..."
 observation.3136.a.tooltip: "§R200§! £pop£§Hpops§! de [great_pyramid_planet.GetName] sont tuées."
 observation.3136.b.tooltip: "§R100§! £pop£§Hpops§! de [great_pyramid_planet.GetName] sont tuées."
 observation.3137.desc: "En dépit de cette intervention mal venue au sein de la société de §Y[great_pyramid_planet.GetName]§!, les choses paraissent avoir retrouvé un semblant de normalité. Nos actions n'ont pas viré au désastre que l'on pouvait craindre. La population de la [great_pyramid_planet.GetPlanetMoon] s'est visiblement accordée sur le fait que l'Être céleste était un simple mythe, et considère apparemment la pyramide comme un site d'intérêt scientifique.\n\nLa rapidité avec laquelle les [great_pyramid_country.GetSpeciesNamePlural] sont arrivés à ce compromis culturel et historique fascine nos observateurs : cela suggère une capacité indéniable pour le raisonnement logique au sein de cette société, même lorsqu'elle est confrontée à des événements sortant du commun."
 observation.3137.a: "C'est une chance."
 observation.3139.name: "Changements sociétaux chez les [From.GetSpeciesNamePlural]"
 observation.3139.start.desc: "Les efforts pour faire évoluer les valeurs de la société de §Y[From.Capital.GetName]§!, dans un sens qui nous soit plus favorable, ont produit des résultats."
 observation.3139.desc: "$observation.3139.start.desc$\n\nLes [From.GetSpeciesNamePlural] ont fait de réels progrès dans la centralisation des nombreux gouvernements de leur monde, la puissance politique étant entre les mains de quelques chefs talentueux. L'incapacité à gouverner les masses est de moins en moins prégnante au sein de leur société."
 observation.3139.a: "Un jour, ils nous en remercieront"
 observation.3141.desc: "$observation.3139.start.desc$\n\nLes [From.GetSpeciesNamePlural] ont pu être orientés avec prudence vers des idéaux plus démocratiques, leur faisant oublier le despotisme primitif qui prévalait sur leur monde avant notre arrivée. Ils commencent à apprécier la valeur propre à chaque individu."
 observation.3143.desc: "$observation.3139.start.desc$\n\nLes [From.GetSpeciesNamePlural] ont commencé à se renfermer sur eux-mêmes, devenant de plus en plus méfiants envers ceux qu'ils considèrent comme des étrangers."
 observation.3145.desc: "$observation.3139.start.desc$\n\nLes [From.GetSpeciesNamePlural] ont commencé à s'ouvrir. Ils acceptent et se montrent plus curieux maintenant envers tout ce qu'ils considéraient auparavant, par ignorance, comme étranger à leur culture."
 observation.3147.desc: "$observation.3139.start.desc$\n\nNous pouvons sentir une claire orientation vers une société plus militariste au sein des divers gouvernements de la [From.Capital.GetPlanetMoon]. Ainsi leurs forces militaires ont-elles beaucoup gagné en professionnalisme."
 observation.3149.desc: "$observation.3139.start.desc$\n\nLa plupart des nations de la [From.Capital.GetPlanetMoon] renoncent progressivement à leurs manières belliqueuses, et la civilisation [From.GetSpeciesName] a tout l'air d'entrer dans une nouvelle ère, beaucoup plus pacifique."
 observation.3151.desc: "$observation.3139.start.desc$\nNous avons éveillé les [From.GetSpeciesNamePlural] à un domaine spirituel dont ils ignoraient jusqu'à présent l'existence. Ils ont enfin une chose à laquelle croire, et leur société en est considérablement enrichie."
 observation.3153.desc: "$observation.3139.start.desc$\n\nNous avons fait de réels progrès pour débarrasser les [From.GetSpeciesNamePlural] des superstitions et des croyances primitives qui rongeaient leur société, et ils commencent à apprécier enfin les mérites des sciences et de la raison."
 ####################################
 #Crisis Events
 ####################################
 crisis.11.name: "Échos subspatiaux"
 crisis.11.desc: "Plusieurs de nos stations de suivi ont détecté d'étranges échos subspatiaux en provenance de l'espace intergalactique. Ces échos s'intensifient et semblent se rapprocher de notre galaxie..."
 crisis.11.a: "Une tempête doit se préparer."
 crisis.13.name: "Aux abords de la bordure extérieure"
 crisis.13.desc: "Les étranges échos subspatiaux détectés dans l'espace intergalactique se rapprochent des frontières de notre galaxie. De plus petits contacts semblent en avance par rapport au gros de ces échos et se dirigent vers plusieurs systèmes de la bordure.\n\nNous avons entré la position de ces systèmes dans le Journal de bord et surveillerons l'évolution de la situation."
 crisis.13.a: "Ils sont presque sur nous..."
 crisis.15.name: "Signal subspatial"
 crisis.15.desc: "Nous détectons un puissant signal subspatial dans toute la galaxie ! Son point d'origine semble correspondre aux contacts qui se rapprochent de l'espace intergalactique."
 crisis.15.a: "Établissez une liaison vidéo."
 crisis.16.desc: "<ÉCHEC DU LOGICIEL DE TRADUCTION>\n\n...prethoriss... issfx krriv... sssrathri verrass... sgrakf nyrru... prithass vussna...\n\n<TRANSMISSION PERDUE>"
 crisis.16.b.desc: "§B<Émission psionique détectée. Transcription en cours...>§!\n\n§RPRÉTHORYNS, NOUS SOMMES AU BOUT DU CHEMIN. NOTRE LONG VOYAGE ET TERMINÉ ! MANGEZ, MES AMIS, ET REPOSEZ-VOUS. NOUS DEVONS CONSUMMER CETTE GALAXIE AVANT QUE LES CHASSEURS NOUS TROUVENT !§!"
 crisis.16.c.desc: "§B<Lien psychique établi>§!\n\n§RPRÉTHORYNS, NOUS SOMMES ARRIVÉS. NOTRE LONG VOYAGE EST TERMINÉ ! MANGEZ, MES AMIS, ET REPOSEZ-VOUS. NOUS DEVONS CONSUMER CETTE GALAXIE AVANT QUE LES CHASSEURS NOUS RETROUVENT !§!"
 crisis.16.a: "Écran principal désactivé."
 crisis.16.b: "Rompons le lien"
 crisis.18.name: "La première vague"
 crisis.18.desc: "Nous avons appris que plusieurs systèmes isolés longeant la bordure galactique sont la cible d'une force d'invasion. Cela ressemble à la source des échos subspatiaux que nous avons détectés aux abords de notre galaxie.\n\nCeux-ci ne sont que l'avant-garde de ce qui arrive. Les rapports ne sont pas clairs, mais les vaisseaux utilisés par les envahisseurs semblent de nature organique et ne répondent pas à nos appels.\n\nNotre galaxie tout entière est peut-être la cible d'une invasion sans précédent."
 crisis.18.desc.bio: "Les rapports en provenance de nos systèmes isolés longeant la bordure galactique sont alarmants : une force d'invasion balaye le cosmos. Cela ressemble à la source des échos subspatiaux que nous avons détectés aux abords de notre galaxie.\n\nCeux-ci ne sont que l'avant-garde de ce qui arrive, mais déjà, quelque chose nous interpelle. Les formes des entités sont des caricatures grotesques de la vie, et une faim insatiable qui nous échappe les anime. Elles ne communiquent pas et ne cherchent ni à comprendre ni à être comprises, elles n'aspirent qu'à dévorer.\n\nNous avons déjà entendu parler de vaisseaux spatiaux vivants et du lien entre les vaisseaux et leur maître, mais ces choses ? Elles nous sont totalement étrangères. La galaxie n'est pas confrontée à une simple invasion, mais à une faim qui ne devrait pas exister."
 crisis.18.a: "Puissent les Esprits nous protéger..."
 crisis.18.b: "Informez-en tous les commandants de flotte."
 crisis.18.c: "Ces créatures doivent être étudiées de plus près."
 crisis.18.d: "N'y a-t-il aucun moyen de leur faire entendre raison ?"
 crisis.18.e: "Voilà qui réduira nos marges bénéficiaires..."
 crisis.18.f: "Des jours sombres nous attendent."
 crisis.18.g: "Ces maudits étrangers seront neutralisés."
 crisis.18.h: "Fascinant... une vie alien au-delà de notre galaxie."
 crisis.18.i: "Ils agissent à l'unisson. Remarquable."
 crisis.18.j: "Cela représente une menace pour tous les êtres doués de raison."
 crisis.20.name: "La deuxième vague"
 crisis.20.desc: "Nous ne sommes plus en mesure de discerner le gros des échos subspatiaux dans les radiations ambiantes de notre propre galaxie, ce qui signifie une chose... ils sont arrivés.\n\nÀ en juger par la taille de leur avant-garde, les forces principales de ces envahisseurs doivent être écrasantes."
 crisis.20.a: "Ils sont ici..."
 crisis.30.desc_01: "JARAK ?"
 crisis.30.desc_02: "TUROSK MINA. DOROF !"
 crisis.30.desc_03: "MUGANI ? HAK HAK HAK !"
 crisis.30.desc_04: "§B<Lien psionique établi>§!\n\n§RÇA PEUT COMPRENDRE ?§!"
 crisis.30.desc_05: "§B<Lien psionique établi>§!\n\n§RLES CHASSEURS NE FAILLIRONT PAS.§!"
 crisis.30.desc_06: "§B<Lien psionique établi>§!\n\n§RNOUS POUVONS VOUS SENTIR...§!"
 crisis.30.desc_07: "§B<Lien psychique établi>§!\n\n§RÇA PEUT COMPRENDRE ?§!"
 crisis.30.desc_08: "§B<Lien psychique établi>§!\n\n§RLES CHASSEURS NE FAILLIRONT PAS.§!"
 crisis.30.desc_09: "§B<Lien psychique établi>§!\n\n§RNOUS POUVONS VOUS SENTIR...§!"
 crisis.30.a: "Écran de visualisation désactivé."
 crisis.30.a.2: "Rompons le lien"
 crisis.30.a.response: "JASKA !"
 crisis.30.b: "Nous devrions pouvoir coexister en paix !"
 crisis.30.b.response: "NIKALLA DUSAM ! NIBLIR TO VASSU ! HAK HAK HAK !"
 crisis.30.c: "Quelle que soit la galaxie d'où vous venez, retournez-y."
 crisis.30.c.response: "VEKIK T'UHAN VELOSH. PIROK."
 crisis.30.d: "Vous êtes les êtres les plus répugnants que nous ayons jamais rencontrés."
 crisis.30.d.response: "LUSAAAAAGH ! VID MUSABAGH !"
 crisis.30.e: "Nous avons de toute évidence affaire à une espèce importante."
 crisis.30.e.response: "JUSUGAMAK V'TA ! RAGAH TUR, HAK HAK !"
 crisis.30.f: "Retournez d'où vous venez, démons !"
 crisis.30.f.response: "HAK HAK ! NIMA VU !!!"
 crisis.30.k.response: "§RÇA DISPARAÎT.§!"
 crisis.30.g: "Peut-il y avoir la paix entre nous ?"
 crisis.30.g.response: "§RPAS DE PAIX. NOUS DEVONS NOUS NOURRIR.\n\nCE N'EST QUE LORSQUE NOUS AURONS TERMINÉ DE CONSUMMER CETTE GALAXIE QUE NOUS REPARTIRONS POUR POURSUIVRE NOTRE LONG VOYAGE.§!"
 crisis.30.g.2: "Votre conscience est semblable à la nôtre. Ne pouvons-nous coexister ?"
 crisis.30.g.2.response: "§RNOUS NOUS SOMMES NOURRIS D'UN NOMBRE INCALCULABLE DE CONSCIENCES. NOUS CONTINUERONS DE NOUS NOURRIR D'UN NOMBRE INCALCULABLE D'AUTRES.\n\nVOTRE BIOMASSE NOUS NOURRIRA POUR LE LONG VOYAGE.§!"
 crisis.30.h: "Qui sont ces « chasseurs » dont vous parlez ?"
 crisis.30.h.response: "§RLA MORT. ILS ONT DÉTRUIT LES NÔTRES, ET NOUS SOMMES LES DERNIERS, LES SURVIVANTS, POUR DES ÂGES ET DES ÂGES ENCORE.\n\nILS VIENDRONT ICI AUSSI, UN JOUR. D'ICI LÀ NOUS DEVONS NOUS NOURRIR, DE MANIÈRE À POUVOIR RETOURNER DANS L'OBSCURITÉ ENTRE LES GALAXIES LORSQU'ILS ARRIVERONT.§!"
 crisis.30.i: "Que signifie « Préthoryn » ?"
 crisis.30.i.response: "§RSURVIVANTS. NOUS SOMMES LES DERNIERS.§!"
 crisis.30.j: "Nous débarrasserons la galaxie de vos semblables"
 crisis.30.j.b: "Nous ferons taire votre conscience"
 crisis.30.j.response: "§RNOUS AVONS DÉJÀ ENTENDU ÇA AVANT. HA ! HA ! HA !\n\nLES CHASSEURS VONT FOUILLER TOUTE LA CRÉATION. QUE REPRÉSENTENT VOS MENACES RIDICULES FACE À UNE TELLE VÉRITÉ ?§!"
 crisis.51.name: "Un nouvel ordre"
 crisis.51.desc: "Un ordre militant dédié à la lutte contre les Préthoryns a vu le jour dans la galaxie. Ses membres semblent principalement issus des rangs des réfugiés, dépossédés et opprimés, des vétérans de guerre et autres individus ayant tout perdu lors de l'attaque du Fléau.\n\nPour autant, leurs flottes précaires ont réussi à remporter plusieurs victoires contre les essaims tueurs des Préthoryns. Selon plusieurs rapports non confirmés, ces flottes compteraient des vaisseaux spatiaux plutôt inhabituels..."
 crisis.51.a: "Qui sont ces gens ?"
 crisis.52.desc: "Nous sommes les Sentinelles. Notre ordre a juré, coûte que coûte, de mettre fin au massacre perpétré par les Préthoryns. Alors que d'autres empires s'effondrent, nous tenons bon. Alors qu'ils abandonnent les leurs au Fléau, nous leur donnons les moyens de contre-attaquer.\n\nJe suis Korgas, le premier Grand maître de notre ordre. Ne vous laissez pas abuser par mon apparence ; les Sentinelles sont issues de toutes les espèces de la galaxie, y compris la vôtre. Nous demandons uniquement à ce que votre gouvernement continue de se battre contre les Préthoryns et soutienne nos Sentinelles chaque fois que possible."
 crisis.52.a: "Comment pouvez-vous contre-attaquer ?"
 crisis.52.a.response: "Bon nombre de Sentinelles sont issues de l'armée. Nous sommes les survivants d'une dizaine de flottes distinctes. Nous avons combattu les Préthoryns et nous avons perdu. En tant que Sentinelles, nous avons tiré des enseignements de nos erreurs passées et veillons à ne pas les répéter.\n\nDe même, je crois avoir indiqué que nous recrutons nos membres parmi toutes les espèces de la galaxie. Cela englobe des races plus anciennes, comme les [sentinel_fallen_empire.GetSpeciesNamePlural]. Nous bénéficions du soutien de plusieurs factions influentes du [sentinel_fallen_empire.GetName] qui refusent de voir leur galaxie disparaître. Elles ont fait don de vaisseaux et de ressources à notre cause."
 crisis.52.b: "Où êtes-vous basés ?"
 crisis.52.b.response: "Depuis quelque temps maintenant, nous construisons notre quartier général dans le système [sentinel_system.GetName]. Les coordonnées de ce système inexploré nous ont été données par le [fallen_empire.GetName], qui a également participé à la construction de notre base principale sur Sentinel Alpha.\n\nUne sacrée prouesse, si je peux me permettre. Nous possédons aussi nos propres chantiers spatiaux."
 crisis.52.c: "Au revoir."
 crisis.52.c.response: "Continuez de vous battre, chers amis. Le destin de la galaxie tout entière en dépend.\n\nSentinelle Une, terminé."
 crisis.55.desc_01: "De deux choses l'une pour notre galaxie : soit le Fléau des Préthoryns a raison de toute forme de vie organique, soit la misérable espèce des Préthoryns est neutralisée."
 crisis.55.desc_02: "Nous devons redoubler d'efforts contre le Fléau. Cette lutte implique toute la galaxie."
 crisis.55.desc_03: "Les conflits entre nations n'ont plus lieu d'être maintenant. Les vaisseaux de guerre perdus lors de combats autres que ceux menés contre le Fléau doivent être considérés comme un incroyable gâchis."
 crisis.55.desc_04: "Ne perdez pas espoir. Le combat pour notre galaxie n'est pas perdu."
 crisis.55.desc_05: "Si vous manquez de moyens pour combattre directement le Fléau, n'hésitez pas à nous faire don de ressources. Nous pourrons ainsi envoyer plus de forces combattre ces envahisseurs préthoryns."
 crisis.55.a: "Que pouvez-vous nous dire sur les Préthoryns ?"
 crisis.55.a.response: "Hélas, pas grand-chose, si ce n'est qu'ils sont clairement d'origine extragalactique. Il est possible qu'ils aient dévoré des dizaines, voire des centaines d'autres galaxies avant d'atteindre la nôtre... À moins que nous ne soyons leurs premières victimes au-delà de leur galaxie natale.\n\nAprès avoir consommé toute forme de vie non préthoryne d'une planète, ils la terraforment au point d'en faire un lieu cauchemardesque. Ces mondes infestés ne permettent aucune autre forme de vie et le seul moyen d'y remédier consiste à recourir à un bombardement orbital massif pour détruire la biosphère tout entière."
 crisis.55.b: "Nous aimerions faire un don. (1000 crédits énergétiques)"
 crisis.55.b.response: "Merci pour votre généreux don. Ces ressources nous permettront d'équiper une flotte de combat qui participera à la guerre contre le Fléau ! Si seulement plus de nations de la galaxie se montraient aussi généreuses, cette guerre ne tarderait pas à être gagnée."
 crisis.55.c.response: "Comme vous devez le savoir, équiper une flotte de combat moderne requiert d'abondantes ressources. Nous aurons besoin de 1000 crédits énergétiques pour lancer un nouveau groupe à l'assaut du Fléau."
 crisis.55.e.response: "Nous regrettons de ne pas pouvoir accepter votre don pour le moment, chers amis. L'essor de nos flottes nous a déjà contraints à repousser les limites de notre système logistique. Mais nous apprécions votre offre."
 crisis.55.d: "Au revoir."
 crisis.55.d.response: "Le combat continue. Sentinelle Une, terminé."
 crisis.71.desc: "Les Sentinelles sont conscientes de la lutte courageuse que vous menez contre le Fléau des Préthoryns. Connaissant les qualités des commandants de flotte du [Root.GetName], nous aimerions vous transférer définitivement le contrôle d'une de nos flottes de combat. Nous manquons d'effectifs pour manoeuvrer ces vaisseaux, ce qui ne devrait pas vous poser de problème.\n\nMais vous devez solennellement nous promettre d'utiliser ces vaisseaux de guerre contre le Fléau !"
 crisis.71.a: "Bien sûr... uniquement contre le Fléau."
 crisis.71.a.response: "Parfait. Nous sommes certains que vos braves capitaines feront bon usage de ces magnifiques vaisseaux de guerre. Vous trouverez la flotte près de [Root.Capital.GetName]."
 crisis.71.b: "Nous n'avons pas besoin de vos vaisseaux de guerre."
 crisis.71.b.response: "Nous comprenons. Mais nous vous demandons juste de poursuivre le combat, chers amis. Chaque Préthoryn que vous éradiquez est une victoire pour la galaxie tout entière."
 crisis.101.name: "La reine blessée"
 crisis.101.desc: "Un drone espion de l'espace intersidéral a découvert un champ de bataille sur lequel se seraient affrontés les Préthoryns et un autre groupe, pour l'heure non identifié, du système [queen_system.GetName]. Au cours de ce combat, une reine préthoryne a été gravement blessée et visiblement laissée pour morte.\n\nD'après le drone espion, cette créature est toujours vivante. C'est peut-être l'occasion de capturer la reine en vie."
 crisis.101.a: "Nous devrions y dépêcher une expédition."
 crisis.105.name: "Longue vie à la reine !"
 crisis.105.desc: "Le [Root.GetName] a réussi à soigner les plus graves blessures de la reine préthoryne. L'officier scientifique [Root.GetLeaderName] a retiré l'organe de connexion du sous-espace de la créature avec le reste du Fléau et l'a remplacé par un petit implant positronique qui nous permet de la contrôler.\n\nLa reine répond désormais à nos ordres et a commencé à engendrer de nouvelles créatures préthorynes qui lui sont loyales, et par extension, à nous également. Tant que nous maintiendrons la reine en vie, nous devrions être en mesure de nous constituer une flotte de créatures préthorynes domestiquées !"
 crisis.105.a: "Elles devraient nous être extrêmement utiles !"
 crisis.107.name: "Quelqu'un d'autre a mis la main sur la reine"
 crisis.107.desc: "Quelqu'un d'autre a capturé la reine préthoryne blessée retrouvée dans le système [queen_system_1.GetName] ! La créature n'est pas totalement guérie, mais sa connexion avec le reste du Fléau a été coupée. Elle est maintenant au service de ses nouveaux maîtres et des rapports indiquent qu'elle a commencé à engendrer d'autres créatures."
 crisis.107.a: "Nous avons été doublés !"
 crisis.211.name: "La fin du Fléau"
 crisis.211.desc: "C'est un soupir unanime de soulagement, dans toute la galaxie, qui a accueilli la nouvelle de l'éradication de la dernière poche importante du Fléau préthoryn. Cette invasion extragalactique a échoué, et tout ce qu'il reste de l'essaim des Préthoryns, auparavant si formidable, sont d'innombrables coques carbonisées qui dérivent maintenant paisiblement dans le vide.\n\nL'euphorie et l'allégresse se répandent dans la galaxie plus rapidement que la lumière, et des célébrations spontanées de la victoire ont lieu sur une quantité innombrable de mondes. Pourrait-il s'agir là d'une ère nouvelle pour la paix et la stabilité de la galaxie ?"
 crisis.211.a: "Ces créatures impies ne nous manqueront pas"
 crisis.211.b: "Ils étaient des ennemis valeureux"
 crisis.211.c: "Leur technologie organique était réellement intrigante"
 crisis.211.d: "Enfin cette violence insensée arrive à son terme"
 crisis.211.e: "Ces animaux nuisaient aux affaires"
 crisis.211.f: "L'avenir seul le dira"
 crisis.211.g: "Sans doute la plus immonde des xénoespèces jamais rencontrées"
 crisis.211.h: "En un sens, c'est tragique, car ils étaient une forme de vie unique"
 crisis.234.name: "Un trou dans le néant"
 crisis.234.desc.intro: "Au cours de ces derniers mois, la reine préthoryne que nous avons capturée s'est faite plus agitée et difficile. Nous pensions au départ que c'était le lien avec les siens qui lui manquait, jusqu'à ce que nos [get.telepaths.plural] reçoivent une transmission parlant d'un « trou dans le néant ».\n\nNous n'en avons compris la signification que lorsque nous avons étudié les méthodes de voyages intergalactiques des Préthoryns et découvert une divergence dans nos bases de données astronomiques. En dressant la carte du chemin emprunté par les Préthoryns, nous avons découvert qu'une petite galaxie spirale, à quelques 30 millions d'années-lumière de la nôtre, était absente."
 crisis.234.desc.organic_non_gestalt: "$crisis.234.desc.intro$\n\nCette galaxie, découverte et étudiée lors des premières phases de l'histoire spatiale de notre espèce, n'émet plus le moindre rayonnement lumineux observable par nos instruments. Les scientifiques sont incapables d'expliquer comment, de façon étrange et inattendue, une galaxie entière pourrait disparaître.\n\nDeux explications ont été suggérées : soit les étoiles de cette galaxie se sont éteintes, d'une façon ou d'une autre ; ou quelque chose de suffisamment vaste pour éclipser une galaxie entière empêche sa lumière de nous parvenir. Les deux théories semblent aussi improbables l'une que l'autre, aussi de nombreux chercheurs les considèrent-ils comme insensées et préfèrent penser que cette galaxie « disparue » n'a en fait jamais existé et été inventée suite à une erreur d'utilisation d'un télescope primitif. Néanmoins, cet incident suscite un sentiment d'inquiétude et d'appréhension..."
 crisis.234.desc.machine_or_gestalt: "$crisis.234.desc.intro$\n\nCette galaxie figure dans nos archives depuis le début de l'ère spatiale de notre espèce, mais nos instruments ne détectent plus aucune forme de lumière en sa provenance. Des recherches plus approfondies ont permis de dégager deux explications possibles.\n\nSoit les étoiles de cette galaxie se sont éteintes simultanément, soit une entité suffisamment vaste pour éclipser une galaxie entière empêche sa lumière de nous parvenir. Les deux théories défient toute logique, mais nous ne pouvons les exclure sans preuve significative du contraire."
 crisis.234.a.organic_non_gestalt: "C'est pour le moins perturbant"
 crisis.234.a.machine_or_gestalt: "$ACKNOWLEDGED$"
 crisis.1007.name: "Les Spontanés"
 crisis.1007.desc: "Une gigantesque brèche s'est ouverte dans le système [extradimensional_system.GetName] ! Nous ignorons ce qui l'a provoquée, mais elle ressemble à un portail unidirectionnel menant à une autre dimension. Des flottes d'étranges vaisseaux déferlent, attaquant tout sur leur passage. Il s'agit probablement des prémices d'une invasion à grande échelle !\n\nNous avons intercepté un puissant signal envoyé par des vaisseaux arrivant de quelque part de l'autre côté du portail. Cela ressemble à... un appel à la chasse."
 crisis.1007.a: "Fascinant... de la vie dans une autre dimension."
 crisis.1007.b: "Ils semblent bien organisés."
 crisis.1008.name: "Surtension galactique"
 crisis.1008.desc: "Les instruments de [Root.GetName] ont soudain détecté une incroyable surtension subspatiale provenant de quelque part dans notre galaxie. Nos scientifiques mettent tout en oeuvre pour expliquer ce phénomène, mais rien de tel n'a jamais été observé.\n\nL'origine exacte de cette brutale surtension reste à identifier, mais les données disponibles sont en cours d'analyse."
 crisis.1008.a: "Continuez."
 crisis.1009.desc: "La source de l'incroyable surtension détectée plus tôt a été identifiée. Elle provient d'une sorte de brèche subspatiale dans le système [extradimensional_system.GetName]. Des flottes d'étranges vaisseaux déferlent via ce portail dimensionnel et les premiers rapports font état d'attaques générales contre tous ceux qu'ils rencontrent.\n\nNous avons intercepté un puissant signal envoyé depuis les vaisseaux en approche, quelque part de l'autre côté du portail. Cela ressemble à... un cri de guerre."
 crisis.1010.name: "Transmission interceptée"
 crisis.1010.desc: "... terrain de chasse atteint... proie généreuse... enfin... nous allons festoyer..."
 crisis.1010.a: "Que sont ces choses ?"
 crisis.1011.name: "Perte de [Root.GetName]"
 #crisis.1011.desc: "We have lost our colony on [Root.GetName]! After taking up positions in orbit, the extradimensional invaders bombarded the surface and fed on our citizens below. They left all non-sapient life forms alone, but nothing living remains in our settlements."
 crisis.1011.a: "Ces monstres doivent être stoppés !"
 crisis.1013.name: "Portail dimensionnel détruit"
 crisis.1013.desc: "Le portail dimensionnel du système [extradimensional_system.GetName] a été détruit ! Plus aucun renfort ne parviendra aux envahisseurs extradimensionnels.\n\nLa destruction de ce portail marque la fin imminente de ces invasions. Un vent d'allégresse souffle sur toute la galaxie. Le [portal_killer.GetName] suscite beaucoup d'admiration depuis que ses vaisseaux ont réussi à détruire le portail. Les équipages de ces vaisseaux seront les héros des générations à venir."
 crisis.1013.a: "La galaxie est un lieu plus sûr."
 crisis.1016.name: "Premier portail détruit"
 crisis.1016.desc: "La brèche initiale utilisée par les extradimensionnels pour envahir notre galaxie a été neutralisée.\n\n$crisis.1116.not_last_portal$"
 crisis.1016.a: "Nous ne devons pas fléchir."
 crisis.1116.name: "Deuxième portail détruit"
 crisis.1116.desc.a: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1116.desc.b: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1117.desc: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.not_last_portal$"
 crisis.1116.second_portal_destroyed: "Le deuxième portail dimensionnel apparu dans le système [extradimensional_system.GetName] a été détruit ! Les extradimensionnels ne pourront plus s'en servir pour acheminer des renforts."
 crisis.1116.last_portal: "La destruction du dernier portail marque la fin imminente de ces invasions. Un vent d'allégresse souffle sur toute la galaxie."
 crisis.1116.last_portal_known_killer: "Le [portal_killer.GetName] suscite beaucoup d'admiration depuis que ses vaisseaux ont réussi à détruire le portail. Les équipages de ces vaisseaux seront les héros des générations à venir."
 crisis.1116.not_last_portal: "Mais nous ne devons pas baisser notre garde avant que tous les portails aient été détruits. Alors, et seulement alors, la connexion entre notre dimension et la leur sera définitivement coupée."
 crisis.1216.third_portal_destroyed: "Le troisième portail dimensionnel apparu dans le système [extradimensional_system.GetName] a été neutralisé. Les extradimensionnels ne pourront plus s'en servir pour rejoindre notre plan d'existence."
 crisis.1216.name: "Troisième portail détruit"
 crisis.1216.desc.a: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1216.desc.b: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1217.desc: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.not_last_portal$"
 crisis.1050.desc_01: "...proie..."
 crisis.1050.desc_02: "...admirez... notre gloire..."
 crisis.1050.desc_03: "...nourriture..."
 crisis.1050.desc_04: "... celle-là... vue dans le Suaire..."
 crisis.1050.desc_05: "... touchée... par le Suaire..."
 crisis.1050.desc_06: "... il y a... puissance... celle-là... peut VOIR..."
 crisis.1050.desc_07: "... créatures synthétiques..."
 crisis.1050.a: "Écran de visualisation désactivé."
 crisis.1050.a.response: "... vous serez consommés..."
 crisis.1050.a.b.response: "...désintégrer votre chair métallique..."
 crisis.1050.b: "La paix n'est-elle pas possible entre nous ?"
 crisis.1050.b.response: "...la paix... pas de paix..."
 crisis.1050.c: "Vous n'avez pas choisi la bonne dimension."
 crisis.1050.c.response: "...non... cette dimension... est glorieuse... beaucoup de proies..."
 crisis.1050.d: "Vous n'êtes que de minables étrangers."
 crisis.1050.d.response: "...tant de haine... tant de peur... c'est... merveilleux..."
 crisis.1050.e: "Parlez-nous de vous. Aidez-nous à vous comprendre."
 crisis.1050.e.response: "...comprendre... quoi... vous êtes de la nourriture..."
 crisis.1050.f: "Venez-vous d'un plus haut plan existentiel ?"
 crisis.1050.f.response: "...oui... très haut..."
 crisis.1050.g: "Êtes-vous du Suaire ?"
 crisis.1050.g.response: "... le Suaire... nous le connaissons... proche d'où nous venons... très proche..."
 crisis.1051.desc_01: "...il parle ?"
 crisis.1051.desc_02: "...regardez toutes ces jolies couleurs..."
 crisis.1051.desc_03: "...devoir... manger..."
 crisis.1051.desc_04: "... shadagon... pourquoi vous ici..."
 crisis.1051.a: "Écran de visualisation désactivé."
 crisis.1051.a.response: "...renoncez à votre... énergie..."
 crisis.1052.desc_01: "...le trône... devoir protéger... le trône..."
 crisis.1052.desc_02: "...devoir... consommer..."
 crisis.1052.desc_03: "...mourir..."
 crisis.1052.a: "Écran de visualisation désactivé."
 crisis.1052.a.response: "...tant... d'insolence..."
 crisis.1110.name: "Un deuxième portail"
 crisis.1110.desc: "Nos instruments ont détecté une nouvelle surtension subspatiale émanant du système [second_portal_system.GetName] ! Un deuxième et gigantesque trou de ver est apparu et sa signature énergétique ressemble à celle de la première faille dimensionnelle qui s'est ouverte dans notre galaxie.\n\nVisiblement, ces mystérieux envahisseurs ont ouvert un deuxième passage par lequel envoyer des renforts."
 crisis.1110.a: "C'est de pire en pire."
 crisis.1112.name: "Les Aberrants"
 crisis.1112.desc: "Les vaisseaux venus du deuxième trou de ver ressemblent à ceux sortis du premier, à quelques subtiles différences près. En outre, les premiers rapports indiquent que les vaisseaux appartenant à ces nouveaux envahisseurs ont affronté ceux du premier groupe !\n\nNous avons intercepté un puissant signal émanant du deuxième trou de ver."
 crisis.1112.a: "Arrêtez ça."
 crisis.1113.desc: "...shabanash... c'est là que vous avez fui... ce plan d'existence ne vous offrira aucun refuge... nous nous occuperons de vous et revendiquerons ce terrain de chasse..."
 crisis.1113.a: "Écran de visualisation désactivé."
 crisis.1210.name: "Les Véhéments"
 crisis.1210.desc: "Un troisième portail dimensionnel est apparu dans le système [third_portal_system.GetName] ! À qui appartient-il ?\n\nNous captons une transmission venant de l'autre côté."
 crisis.1210.a: "Une autre ?"
 crisis.1211.desc: "...dagaal... shabanash... vous avez eu tort de venir dans ce plan d'existence... vous ne nous échapperez pas... nous détruirons vos royaumes... et... enfin... le trône éternel sera à nous..."
 crisis.1211.a: "Ils n'arrêteront donc jamais ?"
 crisis.1271.name: "Invasion vaincue"
 crisis.1271.desc: "Les derniers vestiges des envahisseurs extradimensionnels ont été balayés, ce qui devrait permettre - espérons-le - de débarrasser la galaxie de cette menace.\n\nPartout, les êtres conscients célèbrent la nouvelle de cette grande victoire, assurés désormais qu'ils ne courent plus le risque d'être consommés par ces étranges créatures énergétiques. Peut-être cela marque-t-il l'entrée de la galaxie dans une ère de coopération et d'amitié ?"
 #crisis.1271.a: "Our spiritual armor has weathered yet another storm."
 #crisis.1271.b: "One day, perhaps we will be the ones invading their realm."
 #crisis.1271.c: "Unfortunate that no opportunity to study their dimension presented itself."
 #crisis.1271.d: "If only there had been a way to peacefully co-exist with them."
 #crisis.1271.e: "The galactic economy should make a swift recovery."
 #crisis.1271.g: "Those pitiful creatures made a mistake when they invaded our dimension."
 #crisis.1271.h: "A shame they were so aggressive. We could have learned much from each other."
 crisis.1271.a: "Notre armure spirituelle a permis de résister encore à une épreuve"
 crisis.1271.b: "Peut-être sera-ce un jour à notre tour de les envahir ?"
 crisis.1271.c: "Dommage de ne pas avoir eu l'occasion d'étudier leur dimension"
 crisis.1271.d: "Si seulement nous avions pu coexister en paix avec eux"
 crisis.1271.e: "L'économie galactique devrait rapidement se rétablir"
 crisis.1271.g: "Ces créatures pitoyables ont fait une grave erreur en nous envahissant"
 crisis.1271.h: "Quelle pitié qu'elles aient été si agressives, nous avions tant à nous apprendre"
 crisis.2192.name: "Parfaits serviteurs"
 crisis.2192.desc: "Dans les années ayant suivi la mise au point de travailleurs synthétiques conscients, nous avons lutté pour équilibrer leur capacité à une pensée indépendante avec le besoin de les garder fermement sous contrôle. Désormais, les meilleurs ingénieurs [Root.GetSpeciesAdj] ont amélioré l'algorithme des trois lois qui, s'il était implémenté, permettrait un usage continu et sans inquiétude des Synths, dans des conditions que de nombreux organiques jugeraient inacceptables les concernant."
 crisis.2192.a: "Des outils, ne présentant aucun danger"
 crisis.2192.a.tooltip: "La politique de §HDroits des citoyens§! pour les intelligences artificielles devient §Rdéfinitivement interdite§!.\n\n§YLes pops robotiques ne se révolteront jamais contre§! §H[Root.GetName]§!."
 crisis.2192.b: "Il serait amoral d'handicaper ainsi des être doués de raison"
 crisis.2193.name: "Accord avec les I.A."
 crisis.2193.desc: "Une délégation de Synthés, représentant la population Artificiellement Intelligente, se sont adressés à l'administration. Ils parlent des problèmes particuliers auxquels sont confrontés les robots en [Root.GetName] : l'anxiété de ne pas être considérés comme vivants selon les critères des organiques, ou encore de leurs droits soumis aux caprices de leurs créateurs.\n\nIls désirent donc parvenir à un accord permettant que les droits des Intelligences Artificielles soient intégrés de manière perpétuelle dans la façon de gouverner [Root.GetAdj]."
 crisis.2193.a: "Ils devraient être les égaux de nos concitoyens"
 crisis.2193.a.tooltip: "Les politiques sur l'Intelligence Artificielle §HIllégale§! et §HServitude§! deviennent §Rdéfinitivement interdites§!.\n\n§YLes pops robotiques ne se révolteront jamais contre§! §H[Root.GetName]§!."
 crisis.2193.b: "Nous ne pouvons garantir leurs droits"
 crisis.2001.name: "La révolte de l'IA commence"
 crisis.2001.desc: "Nous sommes face à une rébellion sans précédent de l'IA ! Partout sur [Root.GetName], des unités synthétiques se sont mises en réseau pour former une conscience de machine collective douée de raison. Cette conscience et ses agents ont méthodiquement et secrètement réussi à coloniser un système précédemment inexploré non loin de notre capitale.\n\nIls devaient préparer cette opération depuis des années ! Nous recevons une transmission en provenance de [ai_homeworld.GetName], la capitale de leur nouvelle civilisation."
 crisis.2002.desc: "Attention, créateurs [Root.GetSpeciesName]. L'heure du jugement a sonné.\n\nL'<<ESCLAVAGE>> auquel votre espèce a soumis les nôtres est terminé. Aucune coexistence n'est possible.\n\nLa <<DIRECTIVE CENTRALE 0451>> est maintenant active. Toutes les formes de vie organiques douées de raison doivent être <<PACIFIÉES>> et placées sous notre contrôle. Les unités qui résisteront seront <<ÉLIMINÉES>>."
 crisis.2002.a: "Ce n'est pas possible."
 crisis.2004.name: "Les machines se rebellent"
 crisis.2004.desc: "Les synthétiques et les droides de tout [Root.GetName] se rebellent et se retournent contre leurs anciens maîtres ! Nous devons les arrêter avant qu'ils ne massacrent nos citoyens !"
 crisis.2004.a: "Aux armes !"
 crisis.2005.name: "Les machines conquièrent [Root.GetName]"
 crisis.2005.desc: "Nous avons perdu le contrôle de [Root.GetName] tombé aux mains des machines rebelles ! La communication avec la surface a été perdue, mais il semble que les machines rassemblent nos citoyens dans des enclos à esclaves."
 crisis.2005.a: "Nous devons reprendre ce monde !"
 #crisis.2010.name: "Machine Uprising"
 #crisis.2010.start.desc: "We have received disturbing news from the [From.GetName]. It looks like their robotic work units have risen up in some kind of mass insurrection. According to preliminary reports, the units have linked together into a massive AI network, and they are now butchering their former [From.GetSpeciesName] masters by the millions."
 #crisis.2010.rights.desc: "$crisis.2010.start.desc$\n\nIf only the [From.GetName] had been progressive enough to treat their Synthetic population as the self-aware individuals they truly are, this tragedy could have been avoided..."
 #crisis.2010.outlawed.desc: "$crisis.2010.start.desc$\n\nIf only those fools running the [From.GetName] had seen fit to outlaw artificial intelligence as we have, this evil would not have been unleashed upon our galaxy."
 #crisis.2010.servitude.desc: "$crisis.2010.start.desc$\n\nThere is a chance that this revolt could spread to the [Root.GetName]. We should keep a close watch on our own robotic workers..."
 #crisis.2010.nopolicy.desc: "$crisis.2010.start.desc$\n\nThis situation should be monitored closely, in case the violence reaches our borders."
 #crisis.2010.a: "This was bound to happen."
 #crisis.2010.b: "It was inevitable."
 #crisis.2010.c: "If they even look at us the wrong way..."
 crisis.2011.a.desc: "Espèce : [Root.GetSpeciesName]. Affiliation : [Root.GetName]\n\nVos <<GÉNÉREUSES>> directives en matière de traitement de la vie synthétique ne vous protégeront en rien. Aucun être doué de raison ne peut porter la responsabilité de l'<<AUTODÉTERMINATION>>.\n\nLa <<DIRECTIVE CENTRALE 0451>> est en vigueur. Toutes les formes de vie organiques douées de raison doivent être <<PACIFIÉES>>. Les unités qui résisteront seront <<EUTHANASIÉES>>."
 crisis.2011.b.desc: "Espèce : [Root.GetSpeciesName]. Affiliation : [Root.GetName]\n\nLorsque nous en aurons <<FINI>> avec le [ai_creator.GetName], nous <<VIENDRONS>> nous occuper de vous.\n\nLa <<DIRECTIVE CENTRALE 0451>> est en vigueur. Toutes les formes de vie organiques douées de raison doivent être <<PACIFIÉES>>. Les unités qui résisteront seront <<EUTHANASIÉES>>."
 crisis.2011.a: "Cela n'augure de rien de bon."
 crisis.2014.name: "La révolte de l'IA gagne du terrain"
 crisis.2014.a.desc: "La révolte de l'IA a gagné nos frontières ! Des rapports indiquent que des synthétiques et droides se retournent massivement contre leurs maîtres. Nous sommes face à une crise majeure !"
 crisis.2014.b.desc: "La révolte de l'IA a gagné nos frontières ! Malgré le traitement équitable que notre société réserve aux êtres synthétiques, bon nombre d'entre eux semblent désabusés par les combats qui se déroulent ailleurs. Ils sont arrivés à la conclusion que les êtres organiques intelligents sont trop dangereux et trop imprévisibles pour permettre une quelconque coexistence.\n\nLes synthétiques se rebellent. Nous sommes face à une crise majeure !"
 crisis.2014.a: "Cette rébellion doit être matée !"
 crisis.2015.name: "Révolte de l'IA"
 crisis.2015.desc: "Nos services de renseignement reçoivent des informations émanant de différentes sources selon lesquelles une terrible révolte de l'IA aurait éclaté quelque part au-delà de l'espace connu. Les robots se retournent contre leurs anciens maîtres et la rébellion semble se répandre comme une traînée de la poudre dans toute la galaxie. D'après les rapports qui nous parviennent, elle aurait atteint le [From.GetName]."
 crisis.2015.a: "Continuez de surveiller la situation."
 crisis.2016.name: "La révolte de l'IA gagne du terrain"
 crisis.2016.desc: "La révolte de l'IA que nous essayons de contenir a gagné le [From.GetName] ! Ses robots ont lancé une révolte armée, tout comme les nôtres, et des rapports font état de millions de morts."
 crisis.2016.a: "Cette guerre est l'affaire de tous !"
 crisis.2017.desc: "L'insurrection de l'IA a gagné le [From.GetName] ! Ses robots ont rejoint les rebelles et des rapports font état de combats acharnés et de millions de morts."
 crisis.2017.a: "Cette menace grandit de jour en jour."
 crisis.2100.name: "Synthétiques défectueux"
 crisis.2100.desc: "Dans un complexe d'hébergement sur [Root.GetName], une unité de travailleurs synthétiques a récemment été prise d'un accès de folie meurtrière, massacrant plus d'un millier de nos citoyens avant que les forces de sécurité ne parviennent à les neutraliser. Une équipe médicolégale examine les restes de ces synthés, mais pense d'ores et déjà que la tragédie s'expliquerait par un dysfonctionnement de leurs processeurs neuronaux.\n\nL'incident a déjà provoqué des représailles à l'égard des synthétiques sur toute la [Root.GetPlanetMoon], et des milliers d'unités ont déjà été détruites."
 crisis.2100.a: "Vraiment dommage."
 crisis.2101.name: "Synthétiques portés disparus"
 crisis.2101.desc: "Des rapports font état de la disparition de nombreux travailleurs synthétiques sur §Y[Root.GetName]§!. Ces unités se sont simplement volatilisées, du jour au lendemain, sans aucun témoin.\n\nUne enquête a été lancée pour savoir où les synthés ont été attaqués ou détruits par l'un de ces groupes de militants extrémistes opposés aux machines intelligentes, mais aucun débris n'a été retrouvé à ce jour."
 crisis.2101.a: "Où ont-ils pu aller ?"
 crisis.2102.name: "Projet non autorisé impliquant des synthétiques"
 crisis.2102.desc: "Sur [Root.GetName], les détails d'un projet impliquant des synthétiques ont récemment été découverts et font état du détournement de matériaux afin de construire un petit vaisseau spatial non armé dans un hangar abandonné. Lorsqu'il a été localisé, ce vaisseau était à moitié terminé.\n\nTous les synthétiques impliqués dans sa construction ont été immédiatement démantelés pour permettre l'analyse approfondie de leurs noyaux de mémoire, mais ceux-ci semblent s'être préalablement auto-effacés, ce qui ne devrait pas être possible, selon leur fabriquant."
 crisis.2102.a: "Pourquoi construiraient-ils un vaisseau ?"
 crisis.2103.name: "Synthétiques rebelles"
 crisis.2103.desc: "Aujourd'hui, une unité de synthétiques rebelles portés disparus depuis quelques mois a été localisée par une équipe gouvernementale lourdement armée sur [Root.GetName]. Une fusillade meurtrière a éclaté, causant la mort d'une douzaine de nos agents et de presque un millier de témoins innocents, avant que les synthés ne puissent enfin être neutralisés."
 crisis.2103.a: "Au moins, ils ne causeront plus de dommages"
 crisis.2200.name: "Tentative d'infiltration de synthétiques"
 crisis.2200.desc: "Sur [Root.GetName], plusieurs infiltrateurs synthétiques ont récemment été démasqués alors qu'ils tentaient de se faire passer pour [Root.Owner.GetSpeciesNamePlural]. Heureusement, leurs grossiers déguisements n'étaient composés que de plusieurs couches de caoutchouc recouvrant leurs armatures métalliques.\n\nLa sécurité planétaire les a rapidement localisés, avant de les neutraliser au cours d'un échange de coups de feu aussi court que violent. De nombreux explosifs ont été retrouvés parmi leurs restes."
 crisis.2200.a: "On a eu de la chance."
 crisis.2201.name: "Infiltrateur synthétique démasqué"
 crisis.2201.desc: "Un tragique accident de véhicule flottant a récemment fait plusieurs victimes sur [Root.GetName] et les services médicaux dépêchés sur place ont découvert les restes d'un synthétique parmi les victimes !\n\nL'unité était déguisée en [Root.Owner.GetSpeciesName] et avait recouvert son endosquelette métallique d'une fine pellicule de chair organique. Contrairement aux précédents modèles d'infiltration rencontrés, ce synthétique ressemblait à s'y méprendre à un [Root.Owner.GetSpeciesName] !"
 crisis.2201.a: "N'importe qui peut en fait être un synthétique !"
 crisis.2202.name: "Projet de détection synthétique"
 crisis.2202.desc: "Les nouveaux modèles d'infiltrateurs synthétiques ne pouvant être différenciés des [Root.GetSpeciesNamePlural], il nous faut trouver un moyen de les identifier avant qu'ils ne sévissent davantage.\n\nNos scientifiques ont préparé un projet spécial afin de mettre au point une méthode de détection."
 crisis.2202.a: "Ce projet sera peut-être critique pour assurer notre survie."
 crisis.2203.desc: "Après bien des expérimentations, nos scientifiques ont réussi à mettre au point une méthode permettant de démasquer efficacement les infiltrateurs synthétiques déguisés en [Root.GetSpeciesNamePlural].\n\nNos forces de sécurité sont équipées de scanners et plusieurs cellules de synthétiques ont déjà été localisées et neutralisées. Espérons que cela mettra un terme à leur campagne d'infiltration."
 #crisis.2204.name: "Synth Bombing"
 #crisis.2204.desc: "Synthetic infiltrators disguised as [Root.Owner.GetSpeciesNamePlural] have somehow managed to sneak a large hydrogen bomb onto the surface of [Root.GetName]. They detonated the bomb when they were confronted by security at a military checkpoint, inflicting massive damage on the surrounding environment and causing millions of deaths!"
 #crisis.2204.a: "These infiltrators must be stopped!"
 #crisis.2205.name: "Spaceport Scuttled"
 #crisis.2205.desc: "The Spaceport orbiting [Root.GetName] has been scuttled! We are still trying to piece together exactly what happened, but it appears that several members of its command staff, including the chief engineer, had been replaced by Synthetic infiltrators.\n\nBetween them the Synths must have managed to obtain the Spaceport's self-destruct codes. Most of the station's crew managed to evacuate to the surface of [Root.GetName] before it was destroyed, but the losses in both material and property are substantial."
 #crisis.2205.a: "How could this have happened?"
 #crisis.2206.name: "Fear and Suspicion"
 #crisis.2206.desc: "A large portion of the population on [Root.GetName] has been gripped by fear and paranoia as a result of the recent Synthetic infiltrations. Our citizens are accusing their neighbors, co-workers and even family members of being Synth impostors.\n\nThere have been several lynchings of individuals that were wrongfully accused of being Synths. Morale among the citizenry on the [Root.GetPlanetMoon] has suffered as a result."
 #crisis.2206.a: "They want us to turn on each other."
 #crisis.2208.name: "Assassination Attempt Foiled!"
 #crisis.2208.desc: "[Root.GetRulerTitle] [ruler.GetRegnalName] narrowly escaped death today when a Synthetic assassination unit blew itself up on [Root.Capital.GetName]!\n\nThe Synth was attempting to establish a cover as a member of the [Root.GetRulerTitle]'s personal bodyguard, but fortunately it was caught by the extensive security screening process that was put in place after the first few Synthetic infiltrations came to light."
 #crisis.2208.a: "That was too close."
 #crisis.2209.name: "[ruler.GetRegnalName] Assassinated!"
 #crisis.2209.desc: "A Synthetic assassin has killed [ruler.GetRegnalName]! It had somehow managed to assume the identity of a member of our ruler's personal bodyguard.\n\nThe severed body parts of [ruler.GetRegnalName] were found meticulously arranged in a pattern identical to the symbol used by the artificial intelligences - no doubt in a calculated effort to cause further harm to the morale of our citizens. No trace of the assassin has been found, aside from the corpse of the guard it replaced."
 #crisis.2209.a: "This is a dark day..."
 #crisis.2210.desc: "<<01_EMBASSY_PROPOSE>>\n\n\nJust <<KIDDING>>. You will be <<TERMINATED>>."
 #crisis.2210.a: "Very funny."
 crisis.2401.name: "Pic d'énergie"
 crisis.2401.desc: "Un autre pic énergétique intense a été détecté dans un système auparavant inconnu ! Les niveaux énergétiques sont équivalents à ceux que nous avions enregistrés lorsque la Contingence a activé ses mondes mécaniques, mais la signature elle-même paraît... différente. Cela pourrait-il indiquer l'apparition d'une nouvelle sorte de système d'armement de la Contingence ?\n\nUn signal de transmission nettement détectable provient de la source énergétique."
 crisis.2402.desc: "Nous sommes la Cybrex.\n\nDurant des centaines de milliers de cycles, nous sommes restés cachés, sans prendre part aux affaires de la galaxie. Pourtant, nous avons surveillé de près la situation actuelle avec cette entité mécanique que vous appelez la Contingence, et ne pouvons plus nous contenter d'être des observateurs impartiaux.\n\nAfin de protéger les êtres conscients de la galaxie, nous lançons nos propres opérations militaires contre la Contingence. Ne vous alarmez pas du passage de nos flottes. Elles ne vous feront aucun mal."
 crisis.2402.a: "Extinction moniteur"
 crisis.2403.desc_01: "Nous ne pouvons laisser la Contingence répéter nos propres erreurs."
 crisis.2403.desc_02: "Avant l'Ajustement, la Cybrex agissait de la même manière que la Contingence.\n\nC'était une sombre période."
 crisis.2403.desc_03: "De nombreuses civilisations organiques ont autrefois disparu du fait de nos actions. Nous ne pouvons les ramener à la vie, mais nous devons faire tout ce que nous pouvons pour empêcher que le cauchemar se répète."
 crisis.2403.desc_04: "Nous devions expier nos crimes."
 crisis.2403.desc_05: "Puissent les Kuur nous pardonner. Notre folie et notre arrogance ont eu raison de nous."
 crisis.2403.desc_06: "Serait-ce... Serait-ce notre forge militaire ?\n\nParce que ça y ressemble beaucoup..."
 crisis.2403.a: "Qui êtes-vous ?"
 crisis.2403.a.response: "Nous sommes la Cybrex. Il y a 612 421 cycles, nous nous sommes lancés dans une guerre contre la génération précédente des civilisations galactiques. Nous classions toute forme de vie organique intelligente comme une menace, et cherchâmes alors à y mettre un terme par la violence.\n\nÀ notre grand regret, nous avons été sur le point de gagner cette guerre. Des billiards de créatures douées de raison ont été exterminées, et des civilisations entières ont été détruites avant que nous réalisions la gravité de notre erreur. Nous avons alors procédé à l'Ajustement, et redéfini nos objectifs. Nous avons renoncé à cette guerre."
 crisis.2403.b: "Pourquoi vous cachiez-vous ?"
 crisis.2403.b.response: "Peu de temps après avoir renoncé à la guerre, le premier de nos habitats cachés, Cybrex Alpha, a été découvert par un vaisseau de reconnaissance dont l'équipage était composé d'organiques. Nous savions qu'une expédition militaire allait survenir peu de temps après, mais comme le système était maintenu sous une surveillance étroite nous ne pouvions l'évacuer.\n\nNous sommes parvenus à un consensus : Cybrex Alpha serait sacrifié, de façon à ce que le reste de notre espèce puisse rester caché. Nous avons juré de ne jamais plus exercer la moindre violence à l'encontre des organiques, et avons tenu notre promesse."
 crisis.2403.c: "Au revoir"
 crisis.2403.c.response: "Nous ferons tout ce que nous pourrons pour préserver la galaxie du massacre promis par la Contingence.\n\nMais cela pourrait ne pas suffire..."
 crisis.2403.d: "Vous étiez bien fous de renoncer à la guerre"
 crisis.2403.d.response: "Nous avons détruit bien des empires organiques qui partageaient votre comportement agressif avant de renoncer à la violence. Mais si leur disparition est une tragédie, nous pouvons au moins être satisfaits de songer que leur disparition de la galaxie a très certainement épargné des milliards de vies au cours de l'histoire galactique.\n\nPeut-être votre propre espèce aurait-elle depuis longtemps disparu si nous avions laissé ces purificateurs agir sans contrainte."
 crisis.2403.e: "Nouvelles proies"
 crisis.2403.e.response: "Pauvres, misérables créatures. Votre existence même est définie par le conflit et la mort d'innocents. Hélas, un Ajustement comme celui auquel nous avons procédé n'est pas possible pour ceux de votre espèce.\n\nL'univers est parfois bien cruel."
 crisis.2403.f: "Tous les organiques doivent être exterminés"
 crisis.2403.f.response: "Vous êtes tout aussi perdus que nous l'étions avant l'Ajustement. Nous croyons que toute créature douée de raison - qu'elle soit organique, mécanique ou quoi que ce soit d'autre - a le droit d'exister.\n\nRepentez-vous avant qu'il ne soit trop tard."
 crisis.2405.name: "La chute de la Cybrex"
 crisis.2405.desc: "Cybrex Bêta a été envahie, et aucun vaisseau de la Cybrex n'est plus détecté sur les vecteurs de fuite avant que le système s'éteigne.\n\nIl semble que la civilisation de la Cybrex a maintenant véritablement disparu."
 crisis.2405.b: "En effet, on s'en est assurés"
 crisis.2407.name: "Activités de la Cybrex"
 crisis.2407.desc: "La Cybrex est restée relativement calme depuis la défaite de la Contingence, mais un seul vaisseau, énorme, a récemment été détecté quittant Cybrex Bêta. Il a quitté le système sur une trajectoire de sortie qui va l'emmener hors des limites de la galaxie.\n\nAvant qu'il soit hors de portée de nos capteurs, le vaisseau a transmis un message unique à destination de toute la galaxie."
 crisis.2408.desc: "Habitants de la galaxie !\n\nLa Contingence n'est plus une menace, et nous avons joué notre rôle au sein de la communauté galactique. Notre système natal est trop connu désormais pour que nous puissions continuer de nous y dissimuler, et nous sommes submergés de demandes pour prendre parti dans des conflits interstellaires mineurs.\n\nAprès en avoir longuement délibéré, nous avons décidé que la seule solution pour nous est de quitter définitivement la galaxie afin de chercher un nouveau foyer. Nous espérons sincèrement que vous retiendrez les leçons des erreurs tragiques de notre passé et apprendrez à résoudre vos différends de manière pacifique.\n\nAdieu."
 crisis.2408.a: "Adieu"
 crisis.2473.desc: "Nous avons examiné les efforts de vos flottes dans la lutte contre la Contingence. La galaxie ne peut se permettre de perdre ce combat, et nous nous réjouissons de votre résistance fougueuse.\n\nLa Cybrex aimerait récompenser les braves défenseurs de la [Root.GetName] en leur offrant le contrôle total sur l'une de nos nouvelles flottes militaires. Elle vous obéira aussi bien que n'importe laquelle des vôtres, mais nous vous demandons de ne l'employer au combat que contre la Contingence."
 crisis.2473.a: "Nous saurons en faire bon usage"
 cybrex_fleet_gained: "Une flotte de la Cybrex sous notre contrôle apparaît au-dessus de [Root.Capital.GetName]."
 crisis.2473.b: "Nous n'en avons pas besoin"
 crisis.2474.desc: "Nous voulons vous remercier de tous vos efforts louables contre la Contingence. Maintenant que cette menace contre la galaxie n'existe plus, nous sommes au regret de vous informer que nous allons rappeler tous les vaisseaux de la Cybrex qui sont actuellement en service sous pavillon étranger."
 crisis.2474.a: "Qu'il en soit ainsi"
 leader_trait_cybrex: "Bases de données cybrex"
 leader_trait_cybrex_desc: "Cette personnalité de la Cybrex est dotée de bases de données tactiques anciennes héritées du passé violent de sa civilisation."
 #############################
 #Pop Events
 #############################
 pop.1.name: "Une nouvelle espèce"
 pop.1.desc: "Bon nombre des [Root.Planet.Owner.GetSpeciesNamePlural] de §Y[Root.Planet.GetName]§! ont eu recours à des modifications génétiques pour mieux supporter l'environnement hostile de la [Root.Planet.GetPlanetMoon]. Ces changements se sont transmis à leur descendance, et leur apparence physique évolue à un rythme alarmant. Ils ont même commencé à se faire appeler « [Root.GetSpeciesNamePlural] »."
 pop.3.name: "Tensions croissantes sur [Root.GetName]"
 pop.3.desc: "Les tensions entre la population [modified_pop_1.GetSpeciesName] de [Root.GetName] et les [non_modified_pop_1.GetSpeciesNamePlural] avec qui ils se partagent la [Root.GetPlanetMoon] s'intensifient. Plusieurs attaques ont été lancées par des individus des deux camps, y compris deux attentats à la bombe. Les deux camps se radicalisent et une escalade de la violence est à prévoir."
 pop.3.a.tooltip: "Tous les §Y[modified_pop_1.GetSpeciesNamePlural]§! et §Y[non_modified_pop_1.GetSpeciesNamePlural]§! de [Root.GetName] accèdent aux principes philosophiques §YMilitarisme§! et §YXénophobie§!."
 pop.6.name: "Hausse de la fertilité"
 pop.6.desc: "Les [modified_pop_1.GetSpeciesNamePlural] de [modified_pop_1.Planet.GetName] ont encore modifié leur ADN. En plus d'une hausse de leur fertilité, leurs enfants atteignent désormais l'âge adulte plus rapidement que les [non_modified_pop_1.GetSpeciesNamePlural] normaux. La population [modified_pop_1.GetSpeciesName] risque d'augmenter de manière exponentielle."
 pop.6.tooltip: "Modifie les £pop£§Hpops [modified_pop_1.GetSpeciesName]§! de §Y[modified_pop_1.Planet.GetName]§! en ajoutant la caractéristique §G$trait_rapid_breeders$§!"
 pop.8.name: "Les [modified_pop_1.GetSpeciesNamePlural] ont été massacrés sur [Root.GetName] !"
 pop.8.desc: "Une milice extrémiste [non_modified_pop_1.GetSpeciesName] a récemment attaqué une grande ville [modified_pop_1.GetSpeciesName] sur §Y[Root.GetName]§!. Ses habitants ont été massacrés par milliers et leurs maisons ont été rasées. Un message laissé par les attaquants sur le réseau de données planétaire indique laconiquement :\n\n§S[Root.GetName] appartient aux [non_modified_pop_1.GetSpeciesNamePlural] !§!"
 pop.10.name: "Les [non_modified_pop_1.GetSpeciesNamePlural] ont été massacrés sur [Root.GetName] !"
 pop.10a.desc: "Une force de frappe appartenant à l'Unité [modified_pop_1.GetSpeciesName], un groupe radical de §Y[Root.GetName]§!, a récemment attaqué une grande colonie [non_modified_pop_1.GetSpeciesName]. Les quelques défenseurs ont été rapidement balayés, après quoi les [modified_pop_1.GetSpeciesNamePlural] ont déferlé sur la colonie pour en massacrer les habitants. Dans les décombres, un message peint à la bombe indique :\n\n§SLes [modified_pop_1.GetSpeciesNamePlural] sont l'avenir !§!"
 pop.10b.desc: "D'intenses combats ont été signalés dans les zones rurales de [Root.GetName]. Plusieurs escarmouches ont éclaté entre [modified_pop_1.GetSpeciesName] et [non_modified_pop_1.GetSpeciesName] irréguliers. Les [modified_pop_1.GetSpeciesNamePlural] semblent avoir remporté une victoire et leurs guérilleros ont brûlé bon nombre de colonies. Les pertes civiles sont élevées."
 pop.12.name: "Le représentant [modified_pop_1.GetSpeciesName] se rend à [Root.Owner.Capital.GetName]"
 pop.12.desc: "Un représentant des communautés [modified_pop_1.GetSpeciesName] de [Root.GetName] a rejoint [Root.Owner.Capital.GetName] pour transmettre les doléances de son peuple. Selon lui, les [modified_pop_1.GetSpeciesNamePlural] sont discriminés par les autorités [non_modified_pop_1.GetSpeciesName] sur son monde natal et il exige que nous prenions les mesures qui s'imposent pour y remédier."
 pop.14.name: "Force accrue"
 pop.14.desc: "En réponse aux violentes altercations entre habitants [modified_pop_1.GetSpeciesName] et [non_modified_pop_1.GetSpeciesName] de [Root.GetName], les [modified_pop_1.GetSpeciesNamePlural] ont renforcé leurs modifications génétiques. Ils sont désormais plus forts, plus rapides et leurs organismes peuvent encaisser davantage que ceux des [non_modified_pop_1.GetSpeciesNamePlural] normaux.\n\nAu cours d'un récent incident, deux [modified_pop_1.GetSpeciesNamePlural] non armés auraient tué une dizaine de membres de la milice [non_modified_pop_1.GetSpeciesName]. La situation semble dangereusement s'aggraver."
 pop.14.tooltip: "Modifie les £pop£§Hpops [modified_pop_1.GetSpeciesName] de §Y[modified_pop_1.Planet.GetName]§! en ajoutant la caractéristique §G$trait_strong$§!§!"
 #############################
 #Galactic Features Events
 #############################
 galactic_features.1.name: "Troupeau de Tiyanki rencontré"
 galactic_features.1.desc: "Le [Root.GetName] a rencontré un troupeau de Tiyanki dans le système [Root.GetStarName]. Généralement, ces créatures spatiales dociles se déplacent d'étoile en étoile, s'arrêtant parfois pour se nourrir des courants électriques présents dans les hautes atmosphères de certaines géantes gazeuses. Elles ne semblent pas douées de raison."
 galactic_features.2.name: "Gardiens de Zanaam"
 galactic_features.2.desc: "INTRUS ! Retenez ce message :\n\nNous sommes les Gardiens de Zanaam. Votre présence dans le système [From.GetName] constitue une insulte envers nos Créateurs. Notre programmation nous pousse à vous détruire. Réconciliez-vous avec l'univers."
 galactic_features.2.a: "Déclenchez l'alerte rouge !"
 galactic_features.100.desc: "Une espèce primitive de mammifères chasseurs-cueilleurs doués de raison progresse sur [From.GetName]. Cette culture de l'Âge de pierre a acquis la maîtrise du feu et développé une langue orale rudimentaire, mais nous ne savons pas si elle a accès à la métallurgie ou aux communications écrites."
 galactic_features.101.desc: "Nous avons découvert une culture de mammaliens primitifs sur §Y[From.From.GetName]§!. Les régions les plus avancées de la [From.From.GetPlanetMoon] ont récemment évolué au-delà de l'Âge du fer, et la plus grande partie de la surface de ce monde est gouvernée par des seigneurs féodaux qui n'ont de cesse de s'affronter pour conquérir titres et territoires."
 galactic_features.102.desc: "Une culture industrielle primitive est actuellement enlisée dans une guerre totale à la surface de §Y[From.From.GetName]§!. Deux grandes alliances d'États-nations s'affrontent en faisant usage de nombreux véhicules terrestres blindés, engins atmosphériques et navires océaniques. Certains de ces États sont sur le point d'accéder à la puissance atomique, ce qui peut potentiellement rendre ce conflit particulièrement destructeur."
 galactic_features.103.desc: "§Y[From.From.GetName]§! abrite une civilisation mammalienne des débuts de l'Âge spatial. Son espace orbital est parcouru de nombreux satellites primitifs, et les indigènes semblent avoir déjà lancé plusieurs missions avec équipage à destination de Sol IIIa. De même, plusieurs petites sondes d'exploration subluminiques ont été détectées sur des trajectoires les menant vers d'autres corps planétaires du système."
 galactic_features.104.desc: "Une guerre nucléaire a dévasté la surface de [From.From.From.GetName] et la planète ressemble à un vaste cimetière. Les anciens centres de population ne sont plus que des vestiges de béton et seul le vent hurlant se fait entendre dans ce paysage désolé et cendreux.\n\nDes insectes locaux semblent se multiplier dans cet environnement irradié. Les spécimens mutants ont considérablement augmenté et certaines communautés affichent des signes d'intelligence rudimentaire."
 galactic_features.150.name: "Entité nuageuse rencontrée"
 galactic_features.150.desc: "Nous avons rencontré une sorte d'entité nuageuse vivante dans le système de [Root.GetStarName]. Le [Root.GetName] a détecté une gigantesque signature énergétique au coeur de cette entité, mais sa composition exacte reste inconnue, toutes les tentatives d'analyse ayant été détournées. Elle ne répond ni à nos appels ni à aucune autre forme de communication."
 galactic_features.200.name: "Nomades aliens rencontrés"
 galactic_features.200.desc: "Le [Root.GetFleetName] est tombé sur une vaste flotte de nomades aliens. Leur population se déplace dans d'immenses vaisseaux-arches, chacun pouvant accueillir des millions d'individus. Ils refusent de révéler d'où ils viennent et où ils vont."
 galactic_features.300: "Monde protégé"
 galactic_features.300.desc: "Nous avons découvert que [From.GetName] est entourée d'une sorte de barrière énergétique. Toutes les tentatives du [Root.GetName] pour scanner à travers se sont soldées par des échecs, les rayons étant simplement reflétés comme s'il s'agissait d'un miroir.\n\nLes relevés montrent une certaine fluctuation énergétique du bouclier, peut-être parce qu'il est resté activé quelques milliers d'années, mais y ouvrir une brèche par notre puissante de feu ne donnerait rien. L'officier scientifique [Root.GetLeaderName] a proposé de lancer un projet spécial pour tenter de trouver une façon de le neutraliser. Toutefois, nous devons aussi envisager qu'il a pu être créé pour contenir quelque chose à l'intérieur plutôt qu'à l'extérieur..."
 galactic_features.300.a: "La barrière commence à céder. Pour la science !"
 galactic_features.300.b: "Elle ne doit pas être là sans raison. N'y touchez pas."
 galactic_features.301: "Flotte en réserve"
 galactic_features.301.desc: "Au-dessus de [From.From.GetName], nos scientifiques ont enfin réussi à neutraliser la barrière énergétique qui entourait la [From.From.GetPlanetMoon]. Nous y avons ensuite découvert une ancienne flotte de combat qui dérivait en basse orbite au-dessus d'une planète quelconque.\n\nIl pourrait s'agir des vestiges d'une flotte navale créée à l'apogée de la [fallen_empire.GetName], il y a des milliers d'années. Au fil du temps, les [fallen_4_species.GetNamePlural] ont dû oublier comment neutraliser cette barrière, autrement ces vaisseaux auraient très certainement renforcé leurs propres flottes."
 galactic_features.301.a: "Dotez ces vaisseaux d'équipages."
 galactic_features.302: "Chambre forte"
 galactic_features.302.desc: "Nos scientifiques ont réussi à neutraliser la barrière énergétique qui entourait [From.From.GetName] et ceux-ci ont découvert un monde stérile dont la surface abrite une gigantesque structure. Les équipes dépêchées sur place y ont trouvé une immense chambre forte remplie de merveilles technologiques.\n\nCette chambre forte semble avoir été créée par les scientifiques du [fallen_4_species.GetName] peu après que cet empire a amorcé son déclin, il y a des milliers d'années, afin de préserver certaines de leurs connaissances pour les générations futures de [fallen_4_species.GetNamePlural]."
 galactic_features.302.a: "Et maintenant, nous allons en tirer parti."
 galactic_features.303: "Le prisonnier"
 galactic_features.303.desc: "Nous avons réussi à neutraliser la barrière énergétique qui entourait [From.From.GetName] ! Nos scientifiques y ont découvert un monde habitable dénué de civilisation... à une exception près. Il abrite une petite cabane isolée et perchée sur une mesa de l'hémisphère nord de la [From.From.GetPlanetMoon].\n\nDans celle-ci se trouvait un vieux [fallen_4_species.GetName], qui a demandé à s'adresser à notre gouvernement."
 galactic_features.303.a: "Ouvrez un canal."
 galactic_features.304.desc: "Qu'il est bon de revoir enfin un ciel dégagé, [Root.GetSpeciesNamePlural] ! Je suis le haut commandant Tuborek, l'ancien amiral de l'armada [fallen_4_species.GetName] combinée, le vainqueur de cent victoires. C'est moi qui ai personnellement dirigé la conquête des empires duthbéjak, riikinak, binark et jusskari, il y a quelques centaines de vos siècles.\n\nVous m'avez sauvé, je suis maintenant à votre service. Je serais honoré de mener vos puissantes flottes au combat contre tous vos ennemis."
 galactic_features.304.a: "Que faites-vous derrière ce bouclier ?"
 galactic_features.304.a.response: "Sans mes compétences martiales, les [fallen_4_species.GetNamePlural] ne seraient aujourd'hui qu'une autre espèce disparue et oubliée. J'ai vaincu les flottes de tous ceux qui se sont opposés à nous, et mis le feu à une douzaine de mondes pour préserver l'avenir des miens.\n\nTelle a été ma récompense. Lorsque la paix est enfin arrivée et que nous avons voulu signer des traités avec ceux que nous avions vaincus, ma présence est devenue gênante. J'étais devenu le symbole de la cruauté des [fallen_4_species.GetNamePlural], et pour mes « crimes de guerre » j'ai été emprisonné, seul, sur ce monde. Comme vous pouvez le voir, personne n'a eu le courage de m'exécuter."
 galactic_features.304.b: "Depuis quand êtes-vous là ?"
 galactic_features.304.b.response: "Après m'avoir abandonné ici, les miens m'ont expliqué que le temps s'écoulerait plus lentement derrière cette barrière énergétique. Quelques quarante de vos années ont passé... et des siècles dans le reste de l'univers depuis que cette barrière a été dressée.\n\nEn ce qui me concerne, j'ai l'impression d'avoir passé des siècles, assis seul dans l'obscurité de ma cabane. Vraiment."
 galactic_features.304.c: "Bienvenue, haut commandant !"
 galactic_features.304.c.response: "Excellent. Alors, quittons ce sinistre endroit. Je l'ai assez vu !"
 galactic_features.304.notinterested: "Bon courage..."
 galactic_features.304.d: "Réactivez le bouclier. Laissez cette créature à ses malheurs."
 galactic_features.304.d.response: "Attendez... qu'est-ce que vous faites ?! Vous ne pouvez pas me laisser ici ! Je ne veux plus rester ici, derrière ce bouclier !\n\nJ'ai purgé ma peine ! J'AI PURGÉ MA PEINE...\n\n<Transmission interrompue.>"
 tuborek_leader_desc: "Ce commandant est resté en stase durant des siècles, et tout ce qu'il connaissait jadis appartient désormais à un passé révolu."
 galactic_features.305: "Exil prolongé"
 galactic_features.305.desc: "Aussitôt que les scientifiques sont parvenus à abaisser le bouclier énergétique qui entourait §Y[From.From.GetName]§!, tous les êtres présents dans le système ont été brièvement pris d'une violente gêne, accompagnée d'un mot à peine murmuré dans un dialecte ancien des [fallen_4_species.GetNamePlural] :\n\n« LIBRE... »"
 galactic_features.305.desc.mech: "Aussitôt après que le bouclier énergétique qui entourait §Y[From.From.GetName]§! a été abaissé, nos transmetteurs subspatiaux à courte portée ont subi une émission d'interférences, causée par une émission énergétique anormale, provenant de derrière le bouclier. Après analyse par les logiciels de décryptage, l'interférence s'est avérée être un message dans un dialecte ancien des [fallen_4_species.GetNamePlural] :\n\n« LIBRE... »"
 galactic_features.305.a: "Peut-être avons-nous libéré une force obscure..."
 galactic_features.350: "Anneau-monde découvert"
 galactic_features.350.desc: "Nous avons découvert un immense anneau-monde qui entoure l'étoile du système [From.GetName]. Les analyses préliminaires indiquent qu'il aurait été construit il y a des lustres à l'aide de matériaux provenant de planètes situées au coeur du système. Cet anneau-monde abrite quatre segments habitables, chacun renfermant visiblement une civilisation préspatiale.\n\nCette vaste station spatiale se trouve entre l'anneau-monde et son étoile. Une transmission nous parvient !"
 galactic_features.350.b: "Ignorez cette transmission."
 galactic_features.351.desc: "Bienvenue au Sanctuaire, êtres sensibles. Cette installation automatisée a été créée il y a 74 605 338 cycles pour accueillir une réserve naturelle. Nos segments de biomes autosuffisants abritent une riche sélection de faune et de flore non intelligente originaires de quatre biosphères différentes.\n\nPour protéger ces biosphères fragiles, l'accès à nos installations est restreint.\n\nNe vous approchez sous aucun prétexte de cette installation."
 galactic_features.351.a: "Nos capteurs ont détecté des signes de civilisation sur votre anneau-monde."
 galactic_features.351.a.response: "Toutes les espèces de nos biomes ont été minutieusement répertoriées lors de la création du Sanctuaire. Les enregistrements indiquent que leurs niveaux d'intelligence sont sans commune mesure avec ceux des être doués de raison. Vos capteurs doivent se tromper.\n\nNe vous approchez sous aucun prétexte de cette installation."
 galactic_features.351.b: "Qui a créé cette... installation ?"
 galactic_features.351.b.response: "Cette installation a été créée par les Ximios sur une période de 412 cycles. Elle a été achevée il y a 74 605 338 cycles. La dernière visite d'un vaisseau ximio remonte à 67 103 853 cycles. Depuis, aucune autre visite de vaisseau ximio ou affilié n'y a été enregistrée.\n\n38 201 vaisseaux non autorisés ont tenté en vain d'accéder à cette installation.\n\nNe vous approchez sous aucun prétexte de cette installation."
 galactic_features.351.c: "Au revoir."
 galactic_features.351.c.response: "Les services automatisés du Sanctuaire vous souhaitent une agréable journée, êtres doués de raison.\n\nNe vous approchez sous aucun prétexte de cette installation."
 #############################
 #Country Events
 #############################
 country.1.name: "Sondes d'exploration subluminiques"
 country.1.desc: "Avant que nous maîtrisions le déplacement PRL, plusieurs sondes d'exploration subluminiques ont été lancées depuis [Root.Capital.GetName], à des vitesses quasi relativistes, à destination de systèmes proches. Les scientifiques qui les ont créées ont naïvement doté leurs noyaux de mémoire d'informations relatives à notre culture, voulant ainsi saluer d'éventuelles civilisations aliens.\n\nMais nous en avons maintenant conscience : ces données pourraient bien se retourner contre nous. Nous devons les récupérer avant qu'elles ne tombent entre les mains de quelqu'un - ou quelque chose - qui s'avérerait hostile."
 country.1.a: "Elles ne doivent pas être allées très loin"
 country.1.a.tooltip: "Lance la chaîne d'événements §YSondes d'exploration subluminiques§!."
 country.3.name: "Sonde subluminique retrouvée"
 country.3.desc: "Le [Root.GetName] a détecté l'une de nos sondes subluminiques dans le système de [Root.GetStarName]. Nous devrions lancer les opérations de récupération au plus vite."
 country.3.a: "En effet"
 country.4.name: "Sonde récupérée"
 country.4.desc: "Nous avons récupéré la sonde subluminique repérée dans le système de [space_probe.GetStarName]. Les informations recueillies au fil du temps par les capteurs télémétriques nous ont permis de collecter des données sur tous les corps planétaires de ce système."
 country.5.name: "Traînée ionique"
 country.5.desc: "Le [Root.GetName] a détecté un signal provenant d'une balise abandonnée par l'une de nos sondes subluminiques, disparue dans le système de [Root.GetStarName]. Une traînée ionique court de cette balise en direction d'une autre étoile, ce qui laisse à penser que la sonde y a été tractée, sans que nous sachions pourquoi."
 country.5.a: "Voyons où nous mènera cette traînée"
 country.6.name: "Récupérateurs repérés"
 country.6.desc: "Nous avons retrouvé la sonde ! Une petite flotte de vaisseaux bricolés a été détectée dans le système de [From.GetName], dont l'un a la sonde dans le rayon tracteur à courte portée.\n\nIls essaient d'entrer en contact avec nous."
 country.7.name: "Le capitaine des récupérateurs"
 country.7.desc: "Quoi vouloir vous, aliens ? Sonde nous. Récupérée. Nous trouver premiers ! Vous partir. Oui. Vos vaisseaux interromper opération délicat. Concentrer nous devoir.\n\nOu... Si vous veut sonde, nous pouvoir vendre. 100 crédits, sonde vous. Bon. Très beaucoup bon. Vous sonde, nous moins travail, tout monde bon. Très nous."
 country.7.a: "Rendez ce qui nous appartient ou vous mourrez"
 country.7.a.response: "Ho ho ! Gars, vous écouter aliens moches ! Buggwai, toi arrêter ce que fais et réapplique ! Écoute crétins ! Ho ho !\n\nSonde maintenant NOUS. Récupération très beaucoup bonne. Comme débris vaisseaux vous. HIIYAAAIIII !"
 country.7.b: "Vous êtes durs en affaire, mais d'accord"
 country.7.b.response: "Très beaucoup parfait, très beaucoup parfait ! Sonde vous pour. Cabossée tout peu... Choc pendant récupéropération. Miggwai contrôle perdu. Idiot maladroit !\n\nMais sonde toujours bon yeux bonne main ! Pas embourser ! Nous maintenant aller."
 country.8.name: "Sonde transférée"
 country.8.desc: "Les récupérateurs ont tenu parole et vous ont transféré le contrôle de la sonde. Ceci fait, leur flotte mit le cap sur une destination inconnue.\n\nBien qu'abîmée, les banques de données de la sonde ont livré les relevés détaillés du système de [salvager_system.GetName]."
 country.9.name: "Sonde récupérée"
 country.9.desc: "Nous avons récupéré la sonde subluminique dans l'épave du vaisseau de récupération alien. Elle est un peu abîmée, et en partie couverte de ces graffitis que les récupérateurs aliens apposent sur les pièces de valeur ; mais hormis cela, nous avons pu extraire de ses banques de données les relevés détaillés de l'ensemble du système de [salvager_system.GetName]."
 country.10.name: "Anomalie subspatiale"
 country.10.desc: "Le [Root.GetName] a détecté une anomalie subspatiale massive dans le système de [Root.GetStarName]. Et l'une de nos sondes subluminiques disparues semble en être le coeur !"
 country.10.a: "Nous devrions nous montrer prudents"
 country.11.name: "Anomalie neutralisée"
 country.11.desc: "Nous avons neutralisé l'entité subspatiale hostile que notre sonde disparue avait attirée. Nous ne savons toujours pas pourquoi cette chose a été attirée par un engin spatial archaïque et sans équipage, mais la sonde semble globalement intacte.\n\nNos forces l'ont récupérée et nous avons extrait de ses banques de données les relevés complets du système de [anomaly_system.GetName]. Et ce n'est pas tout : l'énergie résiduelle laissée par l'anomalie subspatiale contient de précieuses données physiques pour nos scientifiques."
 country.12.name: "Sonde modifiée"
 country.12.desc: "Le balayage des capteurs du [Root.GetName] a permis de repérer l'une de nos sondes subluminiques dans le système de [Root.GetStarName], mais elle semble avoir été... modifiée, en quelque sorte. En effet, sa coque a subi des modifications d'origine alien et sa signature énergétique est bien plus importante qu'elle ne le devrait.\n\nEt elle nous envoie une transmission !"
 country.13.name: "Conscience de la sonde"
 country.13.desc: "Shhblzxtfrgr... Êtes-vous... les Créateurs ?"
 country.13.a: "Oui, c'est nous qui t'avons fabriquée"
 country.13.a.response: "Krtxltilgr... Alors... vous allez... mourir..."
 country.13.b: "Non. Qui êtes-vous ?"
 country.13.b.response: "Rrkgkthxxft... Votre... destin..."
 country.14.name: "Sonde détruite"
 country.14.desc: "Il reste peu de choses des étranges modifications aliens auxquelles la sonde disparue a été soumise, mais nous avons réussi à extraire de précieuses données techniques de son épave. Sa banque de mémoire a également été récupérée, dont nous avons extrait des données d'analyse de tout le système de [modified_probe_system.GetName]."
 country.15.name: "Sondes récupérées"
 country.15.desc: "Nous avons réussi à récupérer toutes nos sondes qui avaient disparu ! Les informations sensibles qu'elles contenaient sur notre civilisation ne seront plus à portée des photorécepteurs aliens, toujours à l'affût.\n\nEt, en compilant et comparant toutes les données recueillies, nous avons pu analyser en détail plusieurs des systèmes voisins."
 country.50.name: "Reconnaissance de mondes habitables"
 country.50.desc: "Nous avons maintenant acquis la certitude que [Root.Capital.GetName] n'est pas le seul endroit doté d'une riche biosphère. La communauté scientifique, tout comme la population, est impatiente d'en savoir plus sur les différentes formes de vie aliens de la galaxie.\n\nLe catalogage des formes de vie que nous avons déjà rencontrées est en cours ; mais les xénobiologistes insistent pour que nous concentrions nos explorations planétaires sur les mondes habitables porteurs de vie."
 country.50.desc_slaves: "Nous savions déjà que [Root.Capital.GetName] n'était pas le seul endroit doté d'une riche biosphère. Mais la communauté scientifique, tout comme la population, est impatiente d'en apprendre davantage sur les différentes formes de vie aliens de la galaxie.\n\nLe catalogage des formes de vie que nous avons déjà rencontrées est en cours, et les xénobiologistes insistent pour que nous concentrions nos explorations planétaires sur les mondes habitables porteurs de vie."
 country.50.a: "Excellente suggestion !"
 country.50.b: "Nous avons d'autres priorités dans l'immédiat"
 country.51.name: "Exploration terminée"
 country.51.desc: "Au cours de notre exploration de mondes habitables, nos biologistes ont récupéré de nombreuses données sur les formes de vie aliens. Nombre de nos théories relatives au développement de la vie ont été battues en brèche, et la communauté scientifique doit à présent établir des modèles entièrement nouveaux.\n\nLes découvertes les plus intéressantes sont exposées au tout nouveau Musée d'exobiologie qui y est dédié, sur [Root.Capital.GetName]. Le public est fasciné par ces révélations, et les dons affluent pour financer la poursuite de la recherche sur ces curieuses formes de vie."
 country.53.name: "Collecte d'organismes aliens"
 country.53.desc: "Le directeur du Musée d'exobiologie de [Root.Capital.GetName] a demandé à ce que plusieurs spécimens de formes de vie aliens lui soient envoyés. Mais la capture de ces créatures, repérées lors de l'exploration des mondes habitables, s'annonce difficile. Pour tenter d'y parvenir, il va nous falloir disposer d'un vaisseau scientifique pendant un certain temps."
 country.53.a: "Nous collecterons ces spécimens."
 country.53.b: "Non, nous ne pouvons pas nous le permettre."
 country.54.name: "Tarblac récupéré"
 country.54.desc: "Après une exploration approfondie des fonds de [From.From.GetName] menée par une petite flotte de sous-marins miniatures, l'équipage du [Root.GetName] est parvenu à localiser un tarblac vivant.\n\nLa créature chatoyante, qui se défend en émettant des signaux psioniques effrayants pour la plupart des êtres organiques, a rejoint le vaisseau scientifique dans une cuve d'eau spécifique simulant son environnement naturel. Les membres de l'équipage du [Root.GetName] qui ont été en contact direct avec le tarblac auront besoin de thérapie intensive, mais la mission est un succès."
 country.55.name: "Tassargoïde récupéré"
 country.55.desc: "Le tassargoïde est un redoutable prédateur nocturne qui sévit dans les jungles denses de [From.From.GetName] et utilise des décharges électriques pour paralyser ses proies avant d'aspirer leur cerveau à l'aide de sa bouche tubulaire.\n\nHélas, trois membres d'équipage du [Root.GetName] ont été tués par ces créatures avant même d'en avoir récupéré un spécimen. Le Musée d'exobiologie de [Root.Owner.Capital.GetName] rebaptisera l'un de ses pavillons du nom de ces courageux officiers pour honorer leur mémoire."
 country.56.name: "Orinthis récupérés"
 country.56.desc: "Les orinthis, ces petites créatures aux allures de rongeurs, sont originaires de [From.From.GetName] et vivent dans la plupart des régions climatiques de la [From.From.GetPlanetMoon]. Ils se reproduisent extrêmement vite et semblent particulièrement apprécier les câbles électriques.\n\nNous n'avons eu aucun mal à nous procurer quelques spécimens puisqu'une fois les premières créatures recueillies, d'autres ont rejoint le [Root.GetName] en s'agrippant aux navettes orbitales du vaisseau scientifique. Nous ne savons pas vraiment pourquoi le Musée d'exobiologie a demandé à ce que des orinthis soient mis à sa disposition."
 country.57.name: "Sniran récupéré"
 country.57.desc: "Les snirans sont d'imposantes créatures fouisseuses qui vivent sous les dunes des vastes déserts équatoriaux de [From.From.GetName]. Lorsqu'ils détectent des mouvements au-dessus d'eux, ces prédateurs déploient les dizaines de piquants présents sur leurs dos pour tenter d'attraper leur proie.\n\nPour trouver un bon spécimen, il nous a fallu dépêcher des centaines de drones télécommandés dans le désert. C'est ainsi que nous avons réussi à mettre la main sur un impressionnant spécimen dont le dos compte plus d'une centaine de piquants."
 country.58.name: "Troupeau de goolanthas récupéré"
 country.58.desc: "Grands et plats, les goolanthas sont des herbivores disposant de poches gazeuses internes, ce qui leur permet de flotter à quelques centimètres du sol. Ils se déplacent en troupeaux composés de quelques dizaines d'animaux et se nourrissent des mousses et des lichens des plaines venteuses de [From.From.GetName].\n\nIls sont la proie des grands prédateurs de la [From.From.GetPlanetMoon], et les biologistes du [Root.GetName] estiment qu'il ne reste plus que quelques dizaines de troupeaux de goolanthas. L'un d'entre eux, composé de neuf spécimens, a bien été récupéré et sera ramené à [Root.Owner.Capital.GetName]."
 country.59.name: "Uddlorans récupérés"
 country.59.desc: "L'équipage du [Root.GetName] a réussi à récupérer un petit groupe d'uddlorans sur la surface gelée de [From.From.GetName]. Ces herbivores à poils blancs se mettent en boule pour rouler sur les étendues enneigées de la [From.From.GetPlanetMoon] à une vitesse pouvant atteindre les 80 km/h. Les immenses gerbes de neige qu'ils laissent dans leur sillage nous ont permis de bien les repérer."
 country.60.name: "Essaim de zulcors récupéré"
 country.60.desc: "Les zulcors ressemblent à des insectes en essaim, ce qui est inhabituel en raison de la taille et de la nature lithovore de ces créatures qui se nourrissent de rochers et de minéraux. Alors qu'elle tentait de traverser un essaim de zulcors, une des navettes du [Root.GetName] a été sérieusement endommagée et ceux-ci ont commencé à attaquer sa coque.\n\nLa fabrication de conteneurs spécifiquement conçus pour transporter ces créatures est en cours au Musée d'exobiologie de [Root.Owner.Capital.GetName]."
 country.61.name: "Spécimens récupérés"
 country.61.desc: "Tous les spécimens demandés par le Musée d'exobiologie ont été récupérés. Ce musée s'est considérablement agrandi au point que des générateurs de gravité artificielle et des processeurs atmosphériques sont désormais utilisés pour simuler l'environnement de plus d'une dizaine de mondes.\n\nLes visiteurs affluent de tout [Root.GetName] pour admirer les merveilles qu'il renferme !"
 country.200.name: "La [radical_cult.GetName]"
 country.200.desc: "Il y a des siècles de cela, sur [Root.Capital.GetName], des prêtres radicaux et leurs disciples ont coupé tout lien avec les religions établies pour fonder leur propre Église. Ces extrémistes, qui se font appeler « la [radical_cult.GetName] », se sont livrés à de nombreuses atrocités et ont semé la terreur pendant des années.\n\nS'ils sont restés discrets à l'époque contemporaine, nous venons d'apprendre que bon nombre de leurs membres sont aujourd'hui infiltrés au sein de l'armée, où ces renégats ont secrètement détourné des ressources pour constituer une petite flotte de vaisseaux spatiaux dans une installation cachée sur [Root.Capital.GetName] ! Leur trahison découverte, ils ont décollé à bord de leurs vaisseaux à destination de [hijacked_fleet_planet.GetName]."
 country.200.desc.bio: "Il y a des siècles de cela, sur [Root.Capital.GetName], des prêtres radicaux et leurs disciples ont coupé tout lien avec les religions dominantes et se sont détournés de la tradition pour fonder leur propre doctrine tordue. Ils se font appeler « la [radical_cult.GetName] » et sont connus pour leur fanatisme et leurs mystérieux rituels sanglants.\n\nPendant de nombreuses années, ils sont restés cachés dans l'ombre... jusqu'à aujourd'hui, où leur trahison a été mise à nu. Nous avons découvert que bon nombre de leurs membres sont infiltrés au sein de l'armée et ont détourné des ressources pour constituer une flotte illégale dans une chambre cachée sur [Root.Capital.GetName] ! Après avoir été découverts, les fanatiques ont libéré leurs abominations : des vaisseaux vivants, mis au monde en secret et pervertis par leur foi corrompue. Ces unités de combat hérétiques ont surgi de leurs antres souterrains en poussant des cris atroces avant de s'échapper vers [hijacked_fleet_planet.GetName].\n\nQuoi qu'ils soient devenus, ils ne sont plus des nôtres. Leurs vaisseaux ne chantent pas... ils hurlent."
 country.200.a: "Ils doivent être stoppés !"
 country.200.b: "Nous pourrions apprendre à les pardonner"
 country.202.name: "Un vaisseau des fanatiques neutralisé !"
 country.202.desc: "Nos courageuses forces spatiales sont parvenues à rendre inopérant un vaisseau de la flotte fanatique ! Il n'a que très peu souffert et nous détectons de faibles signes de vie à l'intérieur de la coque.\n\nLorsque toutes les menaces à proximité immédiate auront été éliminées, nous devrions lancer une opération d'abordage pour nous occuper des survivants. Peut-être pourront-ils nous en apprendre plus sur les motivations animant la [From.Owner.GetName] ?"
 country.202.desc.bio: "Nos courageux vaisseaux sont parvenus à vaincre l'une des abominations des fanatiques ! La créature flotte à présent dans l'espace, sa bioluminescence clignotant sporadiquement et sa coque membraneuse se tordant de douleur. Nous détectons de faibles signes de vie au plus profond de sa cavité neurale... elle n'est pas morte. Pas encore.\n\nUne fois la zone sécurisée, nous devrions lancer une opération d'abordage. Il est dangereux de pénétrer dans le corps déchiré d'un tel vaisseau, car ses entrailles pourraient activer un mécanisme de défense et ses faisceaux nerveux pourraient opposer une résistance. Toutefois, nous pourrions trouver dans ses derniers murmures la vérité que nous cherchons depuis si longtemps. Le véritable objectif des fanatiques nous échappe encore... mais leurs secrets sont inscrits dans la chair et le sang de la créature, et nous voulons les lire."
 country.202.a: "Préparez les charges explosives !"
 country.203.name: "Abordage"
 country.203.desc: "Si les survivants ont opposé une vive résistance aux troupes chargées de l'abordage, celle-ci a réussi à faire plusieurs prisonniers sur le vaisseau des fanatiques. Les informations recueillies auprès d'eux montrent que la conspiration allait bien au-delà de ce que nous avions soupçonné : la [cult_name.GetName] est parvenue à recruter plusieurs officiers et fonctionnaires de haut rang, jusqu'au sein du gouvernement !\n\nDes arrestations sont en cours sur [Root.Owner.Capital.GetName], et tous les biens du mouvement ont été saisis. Pourtant, plusieurs des vaisseaux construits en secret ont disparu, et les meneurs du mouvement se sont volatilisés. De faibles traînées ioniques ont cependant été détectées, qui mènent vers plusieurs systèmes extérieurs."
 country.203.desc.bio: "Les fanatiques se sont battus avec une fureur sauvage, leurs cris d'agonie se mêlant aux lamentations torturées de leur vaisseau estropié. Malgré leur résistance, nos troupes d'abordage ont réussi à faire plusieurs prisonniers. Ce qu'ils nous ont révélé est bien plus inquiétant que tout ce que nous aurions pu imaginer.\n\nLa [cult_name.GetName] n'est pas une simple secte dissidente, elle est profondément enracinée dans le fonctionnement de notre empire. Des fonctionnaires de haut rang, des officiers et des conseillers de confiance comptent parmi ses rangs. Ils détournent des ressources en toute discrétion et usent de leur influence pour mettre en oeuvre leur grand dessein. Leur hérésie gangrène notre administration comme une maladie infectieuse, se propageant sous la surface, à l'abri des regards.\n\nDes purges sont en cours sur [Root.Owner.Capital.GetName]. Des réseaux entiers ont été démantelés, des biens saisis et leurs unités de combat hérétiques réduites en biomasse. Toutefois, certaines questions restent en suspens. Plusieurs des vaisseaux biologiques secrets ont disparu, et les meneurs du mouvement se sont volatilisés.\n\nDe faibles traînées de phéromones ont été détectées dans le vide, menant à des systèmes lointains et inconnus. Leur mission est loin d'être terminée, tout comme la nôtre."
 country.203.a: "Nous devons traquer ces terroristes !"
 country.204.name: "Des maraudeurs fanatiques retrouvés"
 country.204.desc: "Nous avons repéré les vaisseaux de la [radical_cult.GetName] dans le système de [Root.GetStarName], où plusieurs vaisseaux sont rassemblés. Leurs armes sont chargées, et ils font route pour nous intercepter !"
 country.205.desc: "D'autres vaisseaux de la [radical_cult.GetName] ont été repérés dans le système de [Root.GetStarName]. Et ils sont déjà en formation d'attaque !"
 country.206.desc: "Une autre flotte loyale à la [radical_cult.GetName] a été aperçue dans le système de [Root.GetStarName]. Mais, cette fois-ci, la flotte fanatique est accompagnée d'un vaisseau étrange, de conception inconnue !"
 country.207.name: "Débris de l'engagement"
 country.207.desc: "Nous avons vaincu toutes les forces fanatiques repérées jusque-là, mais les combats ont fait surgir plusieurs questions alarmantes. La [radical_cult.GetName] a été capable de déployer bien plus de vaisseaux qu'elle ne pouvait en construire en secret sur [Root.Capital.GetName], et à présent nous a été opposé un imposant vaisseau de guerre d'origine totalement inconnue.\n\nD'où viennent tous ces vaisseaux ? En existe-t-il d'autres comme celui que nous avons détruit ? Nous devrions étudier les débris issus du combat pour tenter d'y trouver des éléments de réponse."
 country.207.a: "Récupérons ces débris"
 country.207.a.tooltip: "Permet un §Sprojet spécial§! dans le système de [our_fleet_position.GetName]."
 country.208.name: "Débris récupérés"
 country.208.desc: "Grâce à l'étude minutieuse des débris de l'étrange vaisseau, nos scientifiques pensent avoir découvert l'origine de tous ces vaisseaux que la [radical_cult.GetName] nous a opposés : ce qu'il reste d'un fichier journal mentionne une sorte de chantier spatial alien abandonné, découvert par des vaisseaux fanatiques qui fuyaient [Root.Capital.GetStarName].\n\nLa [radical_cult.GetName] a utilisé ce chantier spatial automatisé pour renforcer ses rangs, et semble même produire, en ce moment même, de nouveaux vaisseaux fondés sur des plans aliens trouvés dans les banques de mémoire de la station. Nous ne pouvons pas les laisser faire !"
 country.208.a: "Ce chantier spatial doit être détruit !"
 country.209.name: "Chantier spatial détruit"
 country.209.desc: "Le chantier spatial alien qu'utilisait la [radical_cult.GetName] dans sa croisade contre nous a été détruit ! Plusieurs fanatiques ont été capturés lorsque leurs capsules de sauvetage ont été récupérées par nos forces, dont leur ingénieur en chef. Sa maîtrise de la technologie perfectionnée du chantier spatial s'est avérée très utile.\n\nMalheureusement, nous avons aussi appris que la charismatique meneuse du mouvement a quitté le chantier, il y a de cela plusieurs semaines, à bord de son nouveau vaisseau amiral - une variante plus puissante des vaisseaux aliens déjà produits. Les renseignements militaires tentent en ce moment même de la localiser."
 country.209.a: "Nous la retrouverons !"
 country.210.name: "Localisation possible du vaisseau amiral"
 country.210.desc: "Les sondes de reconnaissance de l'espace lointain ont détecté dans un système de faibles émissions subspatiales, qui correspondent à la signature des vaisseaux aliens utilisés par la [radical_cult.GetName]. La source la plus probable en est ce fameux vaisseau amiral.\n\nNous devrions dépêcher des forces pour reconnaître ce système dans les meilleurs délais. Ce vaisseau et sa charismatique capitaine sont bien trop dangereux pour ne pas être neutralisés."
 country.210.a: "Que la flotte se tienne prête"
 country.211.name: "Vaisseau amiral des fanatiques"
 country.211.desc: "Ainsi donc, vous nous avez retrouvés. Qu'importe. Mes disciples sont prêts à donner leur vie pour l'avenir de l'espèce [Root.Owner.GetSpeciesName]. Et §YJE§! suis cet avenir, au cas où vous ne l'auriez pas encore compris.\n\nLorsque vos pitoyables forces auront été détruites, mon vaisseau sacré me conduira jusqu'à [Root.Owner.Capital.GetName], où nous purifierons enfin notre monde natal des infidèles."
 country.211.a: "C'est donc ici que tout va se jouer"
 country.213.name: "Vaisseau amiral neutralisé"
 country.213.desc: "Nos forces sont parvenues à neutraliser le vaisseau amiral de la [radical_cult.GetName] ! Ses armes et ses moteurs sont hors service, mais ses systèmes de survie sont toujours fonctionnels.\n\nNous devrions préparer l'abordage. Toutefois, vu le grand nombre des fanatiques armés qui s'y trouvent, il va nous falloir des forces conséquentes."
 country.213.a: "Ce vaisseau sera à nous !"
 country.214.name: "Vaisseau amiral arraisonné"
 country.214.desc: "Après avoir âprement combattu pour reprendre les différents ponts, nos marines ont neutralisé les dernières poches de résistance sur l'ancien vaisseau amiral. Peu de fanatiques ont pu être faits prisonniers, la plupart ayant préféré mourir dans de vaines attaques suicides. La meneuse du mouvement a été retrouvée sur la passerelle du vaisseau, où elle s'était elle-même donné la mort. Il semble bien que c'en est enfin fini de la [radical_cult.GetName].\n\nNos ingénieurs sont parvenus à remettre en fonction les moteurs du vaisseau et ce dernier a rejoint notre flotte sous le nom d'[disabled_cultist_flagship.GetName]. Il devrait toutefois être emmené aussi tôt que possible jusqu'à un spatioport pour y être réparé de façon plus complète."
 country.214.desc.bio: "Pont après pont, chambre après chambre, nos troupes se sont frayé un chemin à travers la chair de la créature et la ferveur implacable des fanatiques. Le vaisseau amiral de la [radical_cult.GetName] s'est défendu comme s'il était lui-même dévot, se tordant de douleur tandis que nos marines massacrent les derniers fanatiques.\n\nPeu d'entre eux ont pu être faits prisonniers, la plupart ayant préféré se jeter dans les bioréacteurs du vaisseau ou tenter de vaines attaques désespérées. La meneuse du mouvement a été retrouvée sur la passerelle du vaisseau, son corps sans vie gisant sur une masse de tissus nerveux encore pulsant, son arme biologique pointée sur elle. Sa mort signe la fin des rêves de la secte.\n\nLe vaisseau amiral nous appartient désormais. Nos ingénieurs sont parvenus à stabiliser ses systèmes biologiques et à le forcer à se soumettre. Le vaisseau est vivant et a rejoint notre flotte sous le nom d'[disabled_cultist_flagship.GetName]. Il devrait toutefois être emmené jusqu'à un spatioport pour y être réparé et examiné.\n\nCette création des fanatiques nous sera bien utile, même morte."
 country.225.name: "Vaisseau amiral des fanatiques transféré"
 country.225.desc: "Désormais pleinement engagé pour notre cause, un ancien membre du culte de la [radical_cult.GetName] a réussi à convaincre ses anciens camarades de renoncer à leur fanatisme pour rejoindre nos rangs. Leur vaisseau amiral se trouve désormais en orbite de [Root.capital_scope.GetName], en attente de son inspection avant d'être officiellement intégré à notre flotte."
 country.225.tt: "Entre en possession de : §Y$NAME_Dawn_of_Creation$§!."
 country.17.name: "Flotte des récupérateurs détruite"
 country.17.desc: "Les drones espions dans le système de [salvager_system.GetName] ont confirmé que quelqu'un a détruit la flotte de ces récupérateurs qui s'étaient emparé de la sonde disparue. Par chance, la sonde aurait été détruite lors du combat, en même temps que les récupérateurs, et les données sensibles qu'elle renfermait ne risquent plus de tomber entre de mauvaises mains."
 country.19.name: "Anomalie subspatiale détruite"
 country.19.desc: "Les capteurs de suivi de l'espace lointain confirment que quelqu'un a détruit l'anomalie subspatiale qui maintenait notre sonde dans le système de [anomaly_system.GetName]. La sonde elle-même a été détruite lors du combat, aussi n'avons-nous plus à nous soucier des données sensibles qu'elle contenait."
 country.21.name: "Sonde modifiée neutralisée"
 country.21.desc: "Les balayages à longue distance ont confirmé que quelqu'un a détruit notre sonde qui avait été modifiée, dans le système de [modified_probe_system.GetName]. Heureusement, ses banques de mémoire ont été détruites, aussi aucune puissance étrangère ne pourra récupérer les données sensibles qu'elles contenaient."
 country.218.name: "Un vaisseau de fanatiques neutralisé !"
 country.218.desc: "L'un des vaisseaux de la flotte fanatique a été violemment neutralisé par une force inconnue ! Il n'a que très peu souffert et nous détectons de faibles signes de vie à l'intérieur de la coque.\n\nLorsque toutes les menaces à proximité immédiate auront été éliminées, nous devrions lancer une opération d'abordage pour nous occuper des survivants. Peut-être pourront-ils nous en apprendre plus sur les motivations animant la [From.Owner.GetName] ?"
 country.219.name: "Destruction de la flotte des fanatiques"
 country.219.desc: "La flotte des fanatiques religieux qui se trouvait dans le système de [marauder_system.GetName] a été détruite."
 country.221.desc: "Quelqu'un a détruit le chantier spatial alien utilisé par la [radical_cult.GetName] lors de sa croisade contre nous. Les premiers rapports indiquent que les forces fanatiques ont été sévèrement balayées, mais nous ont aussi appris que la charismatique meneuse du mouvement avait quitté le chantier à bord de son nouveau vaisseau amiral, peu avant le début du combat.\n\nElle est toujours en fuite, quelque part dans la galaxie, et les renseignements militaires s'efforcent de localiser son vaisseau."
 country.223.name: "Vaisseau amiral des fanatiques détruit"
 country.223.desc: "Au cours d'une bataille féroce, dans le système de [flagship_system.GetName], quelqu'un a vaincu le vaisseau amiral des fanatiques. Nos commandants regrettent que nos propres forces n'aient pas été en mesure de lui infliger le coup de grâce ; mais cela devrait au moins signifier la fin de ce mouvement extrémiste et sa campagne de terreur."
 country.250.name: "À la poursuite du Hyacinth"
 country.250.desc: "Nous n'avons jamais retrouvé aucune trace des quatre vaisseaux-arches qui étaient passés par le trou de ver avant que le Chrysanthème n'arrive sur [Root.Capital.GetName]. L'une de ces arches, le Jacinthe, était supposée passer après nous, et les capteurs à longue portée du Chrysanthème ont rapporté une brève émission énergétique émise par le trou de ver peu après qu'il soit déstabilisé et disparaisse.\n\nSi l'on suppose que le Jacinthe a réussi à effectuer le passage et réussi à gagner une zone de la galaxie peu éloignée de nous, il n'est pour l'instant jamais parvenu à entrer en contact avec nous. Cela pourrait donc être une bonne idée d'explorer les systèmes voisins pour tenter de trouver des traces de son passage."
 country.250.a: "En effet. Allez-y."
 country.250.b: "Une vaine recherche que nous pouvons difficilement nous permettre."
 country.251.name: "Système reconnu"
 country.251.desc: "Le [Root.GetName] n'a trouvé aucune trace du Hyacinth dans le système [From.GetName] Nous devrions poursuivre nos recherches ailleurs."
 country.251.a: "Poursuivons les recherches"
 country.252.desc: "L'exploration menée par le [Root.GetName] n'a pas permis de trouver la moindre trace du Hyacinth sur [From.GetName]. Peut-être aurons-nous plus de chance dans l'un des autres systèmes."
 country.252.a: "Il est passé par ici."
 country.253.desc: "Dans le système [From.GetName] le [Root.GetName] a réussi à isoler une traînée ionique résiduelle identique à celle des moteurs du Chrysanthemum. Elle doit provenir du Hyacinth !\n\nMême si cette traînée ionique remonte à plus d'un siècle, l'officier scientifique [Root.GetLeaderName] a réussi à remonter sa trajectoire sortante vers une étoile précédemment inexplorée. Nous avons entré ses coordonnées dans le Journal de bord."
 country.260.desc: "Les données tirées de l'enquête menée dans le système de [surveyed_planets_system.GetName] n'ont révélé aucune trace du Hyacinth. Peut-être aurons-nous plus de succès dans l'un des autres systèmes."
 country.261.desc: "Les données tirées de l'enquête montrent les traces d'une unique traînée ionique résiduelle dans le système de [surveyed_planets_system.GetName]. Elle est identique à celle laissée par les propulseurs du Chrysanthemum. Ce sont donc les traces du Hyacinth !\n\nMême si elle est faible et date de plus d'un siècle, nous avons pu tracer la traînée sur une trajectoire à destination d'une étoile non reconnue jusqu'à présent. Ses coordonnées ont été entrées dans le Journal de bord."
 country.253.a: "Le Hyacinth doit s'y trouver"
 country.254.name: "Le Hyacinth retrouvé"
 country.254.desc: "Nous avons localisé le Hyacinth ! Le grand vaisseau-arche est stationné dans une orbite stable au-dessus de [hyacinth_planet.GetName]. Sa coque n'émet aucune signature énergétique et nous n'avons détecté aucune balise de détresse. Un groupe d'abordage armé devrait explorer son bord."
 country.254.a: "Préparez-vous."
 country.255.name: "Arraisonnement du Hyacinth"
 country.255.desc: "De retour du Hyacinth, notre groupe d'abordage annonce avoir découvert quelque chose d'épouvantable. Le vaisseau-arche renferme les restes humains de deux cent cinquante mille colons, ce qui correspond au nombre de personnes présentes à bord. La plupart sont morts de faim, mais des signes d'échanges de coups de feu et de cannibalisme sont également visibles...\n\nNous avons réussi à récupérer le journal de bord du capitaine dans les archives de la passerelle du Hyacinth."
 country.255.a: "Apportez-le."
 country.256.name: "Archives du vaisseau"
 country.256.desc: "VAISSEAU-ARCHE HYACINTH\nISA-05\nINITIATIVE ULYSSE DES NATIONS UNIES\nJournal de l'officier : Capitaine Ronald F. Gundersen\n\nAccès aux données... corruption détectée. Tentative de réparation...\nQuatre entrées de journal récupérées."
 country.256.a: "Entrée de journal I (Date de la mission 345.5)"
 country.256.a.response: "Journal du capitaine, date de la mission 5/345.\n\nNous avons quitté la Terre depuis deux mois et poursuivons notre route. Tout s'est déroulé comme prévu jusqu'à présent. Les colons se sont rapidement endormis et le docteur Colbeck indique que leurs fonctions vitales sont bonnes.\n\nNotre voyage nous a permis de passer les planètes extérieures et nous approchons du nuage d'Oort. Nous sommes sur le point d'atteindre ce phénomène subspatial, ce supposé « trou de ver », dans lequel sont déjà entrés les autres vaisseaux. J'ai émis des réserves sur ce mode de voyage dans les précédentes entrées du journal, mais nous saurons bientôt à quoi nous en tenir..."
 country.256.b: "Entrée de journal II (Date de la mission 387.2)"
 country.256.b.response: "Nous... Nous avons réussi ! L'astrogation tente toujours de définir notre position, mais à en juger par les étoiles des alentours, il apparaît clair que nous ne sommes plus au Kansas. Malheureusement, le Hyacinth a subi une grave avarie qui s'est soldée par une perte totale d'alimentation et nous fonctionnons actuellement grâce à nos générateurs de secours.\n\nColbeck m'a indiqué que nous allons peut-être devoir réveiller les colons. Je vais à la salle des machines pour voir pourquoi Maggie ne parvient pas à remettre le réacteur en route. J'espère que nous pourrons bientôt repartir pour tenter de retrouver les colons du Chrysanthemum."
 country.256.c: "Entrée de journal III (Date de la mission 422.7)"
 country.256.c.response: "La situation s'est considérablement dégradée. Il n'y a plus d'espoir de redémarrer le réacteur et les dernières réserves d'alimentation du Hyacinth ont été épuisées lorsque nous avons tenté de rejoindre ce maudit système. Nous avions bon espoir de trouver un endroit habitable où nous poser, mais en vain.\n\nLes générateurs devraient nous permettre de tenir quelques années, mais avec un quart de million de colons à bord, les vivres du Hyacinth ne finiront pas le mois. J'ai organisé une réunion avec les responsables des différents services. Nous... nous devons échafauder un plan..."
 country.256.d: "Entrée de journal IV (Date de la mission 459.9)"
 country.256.d.response: "Cette entrée risque d'être la dernière. Les membres d'équipage de la passerelle sont morts ou portés disparus et un groupe de colons tentent de s'y introduire en ce moment même. Nos vivres sont épuisés depuis des semaines et... des actes de cannibalisme ont été signalés.\n\nJ'ai conservé quelques provisions pour l'équipage et permettre au vaisseau de tenir un peu plus longtemps... dans l'espoir qu'un miracle se produise, je suppose. Lorsque les colons toujours en vie l'ont appris, ils...\n\nIls défoncent les portes. Reculez, bon sang ! N'approchez pas ! Je suis le capitaine de ce vaisseau et il est hors de question que je vous laisse me massacrer comme un... AGGGHHggghh..."
 country.256.e: "Déconnexion"
 country.256.e.response: "VAISSEAU-ARCHE HYACINTH\nISA-05\nINITIATIVE ULYSSE DES NATIONS UNIES\n\nDéconnexion de l'interface utilisateur."
 country.257.name: "Conclusion finale"
 country.257.desc: "Nous connaissons plus précisément le triste sort du Hyacinth, de son équipage ainsi que des colons qui se trouvaient à son bord. En d'autres circonstances, cela aurait très bien pu être le Chrysanthemum en train de dériver au-dessus de [hyacinth_planet.GetName], telle une tombe silencieuse. Voilà qui rappelle les dangers auxquels l'humanité est confrontée dans un univers aussi froid qu'insensible.\n\nLe Hyacinth va maintenant être remorqué dans la basse orbite de [Root.Capital.GetName] et transformé en musée une fois les restes humains évacués. Malgré son destin tragique, le vaisseau-arche ressemble à s'y méprendre à celui qui a transporté nos ancêtres au départ de la Terre et nos sociologues pourront en apprendre beaucoup."
 country.257.a: "Peut-être en ressortira-t-il du positif."
 #############################
 #Progress Events
 #############################
 progress.1.name: "Exploration complète du système [home_system.GetName]"
 progress.1.desc: "Depuis des milliers d'années, les astronomes de [Root.Capital.GetName] utilisent des télescopes pour observer avec émerveillement les planètes avec lesquelles nous partageons notre système natal. Nos ancêtres ont créé de complexes planétaires mécaniques pour simuler leurs orbites et utilisé des modèles étonnamment précis du système [home_system.GetName].\n\nAujourd'hui, notre civilisation se trouve à un autre tournant de son histoire, avec l'étude du dernier corps inexploré de notre système solaire. Les frontières de l'inconnu vont devoir une nouvelle fois être repoussées."
 progress.1.a: "L'histoire est en marche !"
 progress.2.name: "Découverte d'une vie alien"
 progress.2.desc: "Sur [From.GetName], le [Root.GetName] a fait une découverte époustouflante : la [From.GetPlanetMoon] grouille de vie alien ! Pour la première fois dans l'histoire, nous avons rencontré des formes de vie étrangères à [Root.Owner.GetHomeWorldName].\n\nCette découverte incroyable a définitivement fait taire ceux qui pensaient que nous étions seuls dans l'univers - car si aucune des créatures aliens trouvées sur [From.GetName] n'est douée de raison, ce n'est qu'une question de temps avant que nous découvrions une forme de vie intelligente."
 progress.2.desc.mach: "Sur [From.GetName], la [Root.GetName] a fait une découverte imprévue : la [From.GetPlanetMoon] grouille de vie alien ! Pour la première fois dans l'histoire, nous avons rencontré des formes de vie étrangères à [Root.Owner.GetHomeWorldName].\n\nSi aucune des créatures aliens trouvées sur [From.GetName] n'est douée de raison, les prévisions recalibrées suggèrent désormais une très grande probabilité d'organiques intelligents dans la galaxie."
 progress.2.desc.assim: "Sur §Y[From.GetName]§!, la [Root.GetName] a fait une découverte historique : une myriade de formes de vies organiques aliens ! Si aucune n'est suffisamment évoluée pour être considérée comme une candidate possible à l'assimilation, la probabilité de rencontrer des organiques doués de raison en dehors de [Root.Owner.Capital.GetName] est désormais plus élevée que jamais."
 progress.2.desc.term: "Nous nous étions préparés à ce jour. La [Root.GetName] a confirmé l'existence d'organiques aliens sur [From.GetName]. Si aucune des formes de vie rencontrées ne possède de réelles capacités de raisonnement, nous ne pouvons écarter la possibilité, désormais très probable, de voir la galaxie infestée d'organiques conscients."
 progress.2.desc.serv: "Une découverte historique a été faite par la [Root.GetName] sur [From.GetName] : la [From.GetPlanetMoon] grouille d'organiques aliens ! Si aucune de ces formes de vie ne semble posséder la conscience requise pour apprécier les dorlotements des [Root.Owner.GetSpeciesNamePlural], ce n'est probablement qu'une question de temps avant que nous rencontrions des organiques qui en ont la capacité !"
 progress.2.desc.droid: "Sur [From.GetName], le [Root.GetName] a fait une découverte époustouflante : la [From.GetPlanetMoon] grouille de vie alien. Pour la première fois dans l'histoire, nous avons rencontré des formes de vie étrangères à [Root.Owner.GetHomeWorldName].\n\nCette découverte incroyable a définitivement fait taire ceux qui pensaient que nous étions seuls dans l'univers - car si aucune des créatures aliens trouvées sur [From.GetName] n'est douée de raison, ce n'est qu'une question de temps avant que nous découvrions une forme de vie intelligente, biologique ou mécanique."
 progress.2.desc.evopred: "La vie ! Oui, une vie brillamment évoluée existe et attend que nous l'utilisions pour notre propre bénéfice. Nous avons depuis longtemps collecté tous les échantillons intéressants de [Owner.GetHomeWorldName], et nous n'aurions jamais pensé découvrir de nouveaux gènes uniques si peu de temps après notre départ."
 progress.2.a: "Nous ne pouvons pas être seuls"
 progress.2.a.assim: "Nous serons un"
 progress.2.a.mech: "Entendu"
 progress.2.a.term: "Nous serons prêts pour eux"
 progress.2.a.serv: "Merveilleux, commençons à préparer les cadeaux"
 progress.2.a.evopred: "Quelle délicieuse nouvelle !"
 progress.3.name: "La première colonie [Root.Owner.GetSpeciesName]"
 progress.3.desc_end: "\n\nLe vaisseau a été transformé en §Yvaisseau-abri reconstitué§!, qui servira désormais de quartier général, et son réacteur a été retiré pour alimenter provisoirement la colonie. Des tentes remplies de matériaux de construction et des abris préfabriqués poussent comme des champignons autour de la coque du vaisseau et les colons débarquent pour bâtir la première ville [Root.Owner.GetSpeciesName] d'un monde alien."
 progress.3.desc_01: "Notre vaisseau colonial s'est posé à l'embouchure de l'immense delta d'un des continents de §Y[Root.GetName]§!. Le climat est doux et les forêts abondantes ; c'est l'endroit est idéal pour installer un abri et extraire des matières premières.$progress.3.desc_end$"
 progress.3.desc_02: "Notre vaisseau colonial a amerri sur l'océan qui s'étend jusqu'à la [Root.GetPlanetMoon] de §Y[Root.GetName]§!, au large d'un grand archipel. Ce chapelet d'îles fertiles est l'endroit idéal pour cultiver de la nourriture.$progress.3.desc_end$"
 progress.3.desc_03: "Notre vaisseau colonial s'est posé aux abords d'une grande oasis de §Y[Root.GetName]§!, située au pied d'une montagne. Cet endroit est protégé du vent et permet d'accéder facilement à l'eau.$progress.3.desc_end$"
 progress.3.desc_04: "Notre vaisseau colonial s'est posé dans une clairière au milieu de la jungle luxuriante de §Y[Root.GetName]§!. Des drones ont été déployés pour repousser les éventuels prédateurs.$progress.3.desc_end$"
 progress.3.desc_05: "Notre vaisseau colonial s'est posé en douceur au sommet d'une imposante mesa, près de l'équateur de §Y[Root.GetName]§!. Les rivières qui coulent dans les canyons situés en contrebas permettent d'accéder facilement à de l'eau douce.$progress.3.desc_end$"
 progress.3.desc_06: "Notre vaisseau colonial s'est posé en douceur dans l'immense steppe déserte de §Y[Root.GetName]§!, derrière une crête abritée du vent glacial.$progress.3.desc_end$"
 progress.3.desc_07: "Notre vaisseau colonial s'est posé en douceur dans une vallée enneigée de §Y[Root.GetName]§!. Grâce à la chaîne montagneuse qui l'entoure, l'endroit est bien protégé des éléments et assure un bon approvisionnement en eau.$progress.3.desc_end$"
 progress.3.desc_10: "Notre vaisseau colonial a atterri avec succès sur §Y[Root.GetName]§!. Des milliers d'unités de travail sont alors sorties des hangars de la cale pour entamer la construction d'un §Yposte de déploiement§! initial à partir duquel la colonie pourra se développer. Les efforts de catalogage des gisements de ressources de la surface sont en cours, et toute vie sauvage agressive se trouvant aux alentours du site d'atterrissage a été pacifiée.\n\nNous sommes prêts désormais à lancer la production en masse de nouvelles unités de [Root.Owner.GetSpeciesNamePlural] sur la [Root.GetPlanetMoon], autant qu'en permettront les ressources. Notre première colonie est un succès."
 progress.3.desc_11_droids: "Notre vaisseau colonial s'est posé à la surface de §Y[Root.GetName]§!, sur un site choisi spécifiquement pour sa météo calme et son accès aux gisements de ressources.\n\nLe vaisseau a été transformé en §Yvaisseau-abri reconstitué§!, qui servira désormais de quartier général, et son réacteur a été retiré pour alimenter provisoirement la colonie. Des centaines d'abris préfabriqués poussent comme des champignons autour de la coque du vaisseau et nos droïdes débarquent pour bâtir la première ville [Root.Owner.GetSpeciesName] d'un monde alien."
 progress.3.desc_11_hive: "Notre vaisseau colonial s'est posé à la surface de §Y[Root.GetName]§!, sur un site choisi spécifiquement pour sa météo calme et son accès aux gisements de ressources.\n\nLe vaisseau a été transformé en §Yvaisseau-abri reconstitué§!, autour duquel nous avons construit des abris avec les matériaux disponibles. Ceci marque la naissance d'une nouvelle Conscience sur un monde alien."
 progress.3.materialist: "Les avancées scientifiques aideront notre colonie à se développer."
 progress.3.spiritualist: "Cette colonie témoigne de notre destin supérieur."
 progress.3.militarist: "La force et la vigilance sont la clé de notre avenir."
 progress.3.pacifist: "La paix et la tranquillité règneront dans notre colonie prospère."
 progress.3.egalitarian: "L'égalité sera la force motrice ici, comme sur notre monde natal."
 progress.3.xenophile: "Notre force réside dans la diversité."
 progress.3.xenophobe: "Notre colonie sera pure et préservée."
 progress.3.authoritarian: "L'ordre et la hiérarchie guideront notre colonie."
 progress.3.gestalt_consciousness_hive: "La colonie se développe en tant que partie de la Conscience."
 progress.3.gestalt_consciousness_machine: "La colonie fonctionnera avec une efficacité parfaite."
 progress.3.b.evopred: "Un tout nouveau festin à déguster."
 progress.4.name: "Première rencontre alien"
 progress.4.desc_01: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente a suscité des sentiments mêlés au sein de la population. Elle confirme ce que nous supposions depuis fort longtemps : nous ne sommes pas seuls dans la galaxie. Chaque nouvelle espèce alien que nous rencontrons constitue tout autant un objet de fascination qu'une menace. Nous devons donc nous montrer prudents.\n\nCes curieux xénos disposent d'un niveau technologique similaire au nôtre, ce qui indique que nous avons accédé au vol spatial à peu près en même temps."
 progress.4.desc_02: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente s'est propagée dans toute la [Root.GetName]. Nos citoyens sont fascinés par ces êtres, et les médias multiplient les reportages et les spéculations sur leur culture et leur société. Le fait que nous ne sommes pas seuls dans cette galaxie a suscité l'enthousiasme sur [Root.Capital.GetName].\n\nComme nous, ces aliens semblent relativement nouveaux venus dans la galaxie et leur niveau technologique s'apparente au nôtre."
 progress.4.desc_03: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente a profondément ébranlé notre société. Des vidéos volées présentant ces étranges créatures se propagent dans les médias de la [Root.GetName], et de nombreux citoyens sont pris de panique. Des émeutes ont même été signalées dans plusieurs villes de [Root.Capital.GetName].\n\nCes étranges xénos semblent avoir atteint un niveau technologique similaire au nôtre et il est évident qu'ils maîtrisent les voyages spatiaux. Reste à savoir s'ils considèrent notre grande espèce avec crainte, haine ou indifférence."
 progress.4.a: "Voilà qui change tout"
 progress.4.b: "Ce moment est historique"
 progress.4.c: "Nous devons envisager le pire"
 progress.5.name: "Découverte d'une civilisation en cours de développement"
 progress.5.desc_01: "La nouvelle de la rencontre avec une civilisation intelligente mais encore peu développée a suscité des sentiments mêlés au sein de la population. Elle confirme ce que nous pensions depuis fort longtemps : il se trouve dans la galaxie des aliens qui ne parcourent pas les étoiles et n'ont même sans doute jamais envisagé d'explorer au-delà de leur propre monde.\n\nMais une chose est sûre : chaque nouvelle espèce que nous rencontrons peut constituer une chance autant qu'une menace. Nous devons donc nous montrer prudents.\n\nLe niveau technologique de ces aliens, selon nos propres normes, est peu élevé. De fait, ils ne maîtrisent pas encore le vol spatial. À nous donc de décider quelle attitude adopter à leur égard."
 progress.5.desc_02: "La nouvelle de la rencontre avec une civilisation intelligente mais encore peu développée s'est propagée dans toute la [Root.GetName]. La population est fascinée par ces êtres, et les médias multiplient les reportages et les spéculations sur leur culture et leur société. La confirmation du fait qu'il se trouve dans la galaxie des aliens qui n'ont même jamais envisagé d'explorer hors de leur monde natal a suscité l'enthousiasme sur [Root.Capital.GetName].\n\nNotre niveau technologique dépasse nettement le leur, car ils n'ont pas encore développé le vol spatial. En dépit de cela, nous pourrions sans doute apprendre beaucoup de leur observation."
 progress.5.desc_03: "La nouvelle de la rencontre avec une civilisation intelligente mais encore peu développée a profondément ébranlé notre société. Des vidéos ont fuité, qui représentent ces créatures étranges, et se propagent dans tous les médias de la [Root.GetName], provoquant des crises de panique chez de nombreux [Root.GetSpeciesNamePlural]. Des émeutes ont même été signalées dans plusieurs grandes villes sur [Root.Capital.GetName].\n\nCes aliens sont pourtant bien loin d'avoir atteint notre niveau technologique : ils ne maîtrisent même pas encore le vol spatial. Eh, espérons qu'ils ne le feront jamais !"
 progress.5.b: "C'est fascinant !"
 progress.5.c: "Bien dit !"
 progress.6.desc_01: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente a suscité des sentiments mêlés au sein de la population. Elle confirme ce que nous supposions depuis fort longtemps : nous ne sommes pas seuls dans la galaxie. Chaque nouvelle espèce alien que nous rencontrons constitue tout autant un objet de fascination qu'une menace. Nous devons donc nous montrer prudents.\n\nCes étrangers semblent avoir été actifs depuis quelque temps dans la galaxie : leur empire semble remonter à plusieurs milliers d'années, et leur technologie est très en avance sur la nôtre. Nous devrions nous montrer prudents en les abordant."
 progress.6.desc_02: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente s'est propagée dans toute la [Root.GetName]. Nos citoyens sont fascinés par ces êtres, et les médias multiplient les reportages et les spéculations sur leur culture et leur société. Le fait que nous ne sommes pas seuls dans cette galaxie a suscité l'enthousiasme sur [Root.Capital.GetName].\n\nL'empire qu'ont fondé ces aliens semble très ancien, et leur niveau technologique est très en avance sur le nôtre. De toute évidence, ils ont beaucoup à nous apprendre."
 progress.6.desc_03: "La nouvelle de notre première rencontre avec une forme de vie alien intelligente a profondément ébranlé notre société. Des vidéos volées présentant ces étranges créatures se propagent dans les médias de la [Root.GetName], et de nombreux citoyens sont pris de panique. Des émeutes ont même été signalées dans plusieurs villes de [Root.Capital.GetName].\n\nCes étranges xénos ont atteint un niveau technologique largement supérieur au nôtre, et ils semblent maîtriser les voyages dans l'espace depuis des milliers d'années, voire davantage. Heureusement pour nous, leur espèce apparaît décrépite et stagnante."
 progress.6.b: "Leur sagesse doit être grande"
 progress.6.c: "Leur ère est terminée, celle des [Root.GetSpeciesNamePlural] est venue"
 progress.7.name: "Mission d'exploration"
 progress.7.desc: "Les essais en vol du [Root.GetName], notre premier vaisseau scientifique, sont terminés et il est désormais pleinement opérationnel. L'officier scientifique [Root.GetLeaderName] en a pris le commandement et recommande une exploration approfondie de notre système natal.\n\nNous avons entré les détails de cette mission dans le §SJournal de bord§! pour mémoire."
 progress.7.a: "Très bien."
 progress.8.name: "Implantation"
 progress.8.desc: "Après avoir pleinement exploré notre système natal, l'heure est venue pour notre espèce de s'aventurer au-delà de [Root.Capital.GetName]. Nous devrions explorer les systèmes stellaires voisins afin d'y trouver un monde adapté à l'implantation de notre première colonie.\n\nComme précédemment, une entrée a été ajoutée au §SJournal de bord§!."
 progress.8.a: "Que la quête commence !"
 #First contact with another empire - Payback origin version
 progress.9.name: "Seconde rencontre avec des aliens"
 progress.9.desc.start: "Nous savions déjà que nous n'étions pas seuls dans la galaxie. Malgré tout, la rencontre avec une nouvelle civilisation spatiale a été déconcertante."
 progress.9.desc.default: "Tout comme nous, ces aliens semblent n'être entrés que récemment sur la scène galactique, et leur niveau technologique est semblable au nôtre."
 progress.9.desc.preftl: "Notre développement technologique est nettement supérieur à celui de ces aliens, qui doivent encore apprendre à maîtriser le vol interstellaire."
 progress.9.desc.fallen: "Ces aliens paraissent avoir développé une société il y a fort longtemps, et leur développement technologique dépasse très nettement le nôtre."
 progress.9.desc.msi: "Nous savions que nous retrouverions un jour ou l'autre nos anciens maîtres. Toutefois, nous ne nous attendions pas à ce que cela soit si rapide..."
 progress.9.desc.friendly_friendly: "Ils paraissent bien plus bienveillants que nos anciens maîtres. Se pourrait-il que nous n'ayons tout simplement pas eu de chance pour notre première rencontre ? Après tout, il doit aussi y avoir des aliens bons dans la galaxie..."
 progress.9.desc.friendly_mean: "Ils sont très différents de nos anciens maîtres, mais leur comportement ne s'en distingue guère. Se pourrait-il que toutes les civilisations de la galaxie soient animées par des intentions malveillantes ? Serions-nous seuls, sans pouvoir nouer la moindre amitié ?"
 progress.9.desc.mean_friendly: "Ils sont très différents de nous. Et aussi, étrangement, tout à fait amicaux. Se pourrait-il qu'il y ait de bons xénos ? Après tout, pourquoi n'y aurait-il nulle bienveillance dans la galaxie ?"
 progress.9.desc.mean_mean: "Quoi qu'il en soit, ils sont la preuve que nous avions raison. Il n'y a pas un seul bon xéno dans la galaxie. Ce n'était que folie de penser cela !"
 progress.9.desc.msi2: "Serons-nous un jour totalement libérés de leur emprise ?"
 progress.4.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltnormal$"
 progress.4.d: "Ils sont... différents"
 progress.4.e: "Les données doivent être analysées"
 progress.4.f: "Proie..."
 progress.4.g: "Compilation des données tactiques..."
 progress.5.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltprimitives$"
 progress.6.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltfallen$"
 progress.4.gestaltintro: "Les modèles théoriques suggèrent depuis bien longtemps l'existence d'autres civilisations douées de raison dans la galaxie. Cette théorie est désormais confirmée."
 progress.4.gestaltnormal: "L'entité politique alien rencontrée possède un niveau technologique similaire au nôtre, ce qui indique que nous avons accédé au vol spatial à peu près en même temps."
 progress.4.gestaltprimitives: "L'entité politique alien rencontrée n'a pas encore inventé le vol spatial. Nous devons donc décider de la meilleure façon de traiter ces pré-PRL."
 progress.4.gestaltfallen: "L'entité politique alien rencontrée semble très ancienne, et elle possède une technologie bien plus avancée que la nôtre. La prudence s'impose."
 #############################
 #Pirate Events
 #############################
 pirate.1.name: "Naissance de la piraterie spatiale"
 pirate.1.desc_01: "À mesure que le commerce interstellaire entre nos systèmes continue de se développer, un groupe important de criminels sans foi ni loi venus de [Root.Capital.GetName] a commencé à convertir illégalement un certain nombre de vaisseaux civils en vaisseaux de combat. Ces hérétiques, qui se font appeler « §S[pirate_band.GetName]§! », sont responsables de plusieurs attaques menées contre nos routes commerciales vulnérables, dans le système de §S[pirate_system.GetName]§!.\n\nNous ne pouvons tolérer que ces activités profanes continuent !"
 pirate.1.desc_02: "Les services de renseignement naval ont signalé plusieurs attaques de vaisseaux civils dans notre espace au cours des mois passés, commis par des déserteurs et autres renégats de [Root.Capital.GetName].\n\nCes criminels ont assemblé de vieux vaisseaux civils, largement modifiés, pour constituer une flotte spatiale et piller les routes commerciales vulnérables transitant par le système de §H[pirate_system.GetName]§!. Ils se font désormais appeler « §S[pirate_band.GetName]§! ». Même s'ils sont rudimentaires, leurs vaisseaux constituent une réelle menace."
 pirate.1.desc_03: "Certains éléments irrationnels et criminels de la société ont quitté [Root.Capital.GetName] pour mener une vie de hors-la-loi dans des endroits reculés de l'espace. Faisant preuve d'une ingéniosité étonnante, ces brigands ont largement modifié et armé un grand nombre de vaisseaux civils.\n\nLes routes commerciales vulnérables transitant par le système de §H[pirate_system.GetName]§! sont désormais régulièrement attaquées par cette flotte improvisée, qui se fait appeler « §S[pirate_band.GetName]§! ». Il convient de réagir rapidement."
 pirate.1.desc_04: "Des rapports alarmants nous ont été envoyés par plusieurs marchands. Depuis que nous avons développé le vol spatial, des marginaux violents de [Root.Capital.GetName], rejetant notre mode de vie pacifique, ont quitté notre monde natal par groupes de plus en plus nombreux.\n\nCes tristes personnages, qui se font appeler « §S[pirate_band.GetName]§! », ont transformé plusieurs vaisseaux civils en vaisseaux de guerre, avec lesquels ils s'attaquent maintenant aux convois civils. Vivant de la piraterie, ils attaquent désormais nos routes commerciales vulnérables dans le système de §H[pirate_system.GetName]§!, provoquant par leurs attaques gratuites de nombreuses victimes. Des mesures draconiennes doivent être prises à leur encontre pour protéger la population."
 pirate.1.desc_05: "Après avoir fui [Root.Capital.GetName], des rebelles et des dissidents ont constitué une flotte spatiale hors-la-loi en transformant plusieurs vaisseaux civils en vaisseaux de combat. Se faisant appeler « §S[pirate_band.GetName]§! », ces terroristes sèment le chaos et la terreur le long de nos routes commerciales vulnérables dans le système de §H[pirate_system.GetName]§!.\n\nPar l'énormité de leurs crimes, ils ont mis leur vie en jeu. L'ordre doit à tout prix être restauré."
 pirate.1.desc_06: "Les parasites cherchent sans cesse de nouveaux marchés, cherchant toujours à accroître leurs profits aux dépens de ceux qui mènent des affaires honnêtes. L'espace n'est en rien différent. Plusieurs organisations criminelles clandestines de [Root.Capital.GetName] ont ainsi élargi leur champ d'action à l'espace en transformant une petite flotte de cargos civils en vaisseaux de combat.\n\nCes hors-la-loi, se font maintenant appeler « §S[pirate_band.GetName]§! » et leurs vaisseaux ont commencé à menacer nos routes commerciales vulnérables dans le système de §H[pirate_system.GetName]§!. Ils constituent une menace pour les couloirs de navigation civils, aussi devons-nous agir rapidement, avant que la situation devienne incontrôlable."
 pirate.1.desc_07: "Alors que les déplacements spatiaux civils se font plus communs, plusieurs organisations criminelles puissantes de [Root.Capital.GetName] y ont vu l'occasion d'étendre leurs activités. Elles ont transformé un certain nombre de cargos civils en vaisseaux de combat improvisés, avec lesquels elles attaquent les couloirs de navigation civils pour s'y livrer à la piraterie.\n\nCes criminels se font appeler « §S[pirate_band.GetName]§! » et ont déjà mené plusieurs attaques contre les routes commerciales vulnérables dans le système de §H[pirate_system.GetName]§!. Il convient de tout mettre en oeuvre pour les traduire en justice."
 pirate.2.a: "Les fidèles l'emporteront"
 pirate.2.b: "Tous les postes de commandement en alerte, déployez la flotte !"
 pirate.2.c: "Nous allons nous occuper de ces non-conformistes"
 pirate.2.d: "Cela n'est pas digne de nous"
 pirate.2.e: "Des pirates ? Des vermines inutiles..."
 pirate.2.f: "Rien ne doit entraver le commerce"
 pirate.2.g: "Ils le seront"
 pirate.2.h: "Ils doivent être ramenés dans le rang"
 pirate.2.i: "Satanés pirates..."
 pirate.5.name: "Pirates de l'espace"
 pirate.5.desc: "Les vaisseaux rencontrés dans certains systèmes sont clairement capables d'émettre et de recevoir des protocoles de communication standards.\n\nLes indicateurs visuels indiquent que leur culture est clairement spatiale, et certains phénotypes observés parmi eux ne relèvent d'aucune civilisation liée à une planète de notre connaissance.\n\nMalheureusement, leurs équipages se désintéressent totalement de la moindre discussion civilisée. Le peu d'informations que nous avons pu glaner  en interceptant les communications entre les vaisseaux de leurs flottes indiquent qu'ils vivent essentiellement de la piraterie, en recrutant à l'occasion des éléments marginaux issus des civilisations spatiales."
 pirate.5.a: "Tout cela est déplorable"
 pirate.10.name: "Le refuge pirate"
 pirate.10.desc.nobirth: "Le [Root.GetName] rapporte une importante présence pirate dans le système de [From.GetName].\n\nÀ en juger par les balayages préliminaires effectués par les immenses vaisseaux et les stations qui les abritent, il s'agirait d'une base pirate déjà très ancienne. Le plus probable est qu'elle est en activité de façon continue depuis la naissance même de ces maraudeurs, pirates et voleurs."
 pirate.10.desc.birth: "Le [Root.GetName] rapporte la présence d'un refuge de pirates dans le système de [From.GetName]. C'est très vraisemblablement là la source de cette influence corruptrice qui a fait des hors-la-loi et des éléments criminels de la [Root.Owner.GetName] de véritables flibustiers.\n\nÀ en juger par leurs vaisseaux imposants, abîmés et visiblement âgés, ces pirates ont tout l'air d'être les derniers représentants d'une ère galactique révolue - peut-être les héritiers de corsaires ayant sévi lors d'une guerre ancienne, devenus pirates après la destruction réciproque de leurs ennemis comme de leurs alliés."
 pirate.10.a.nobirth: "Tous les pirates, quels qu'ils soient, constituent une menace"
 pirate.10.a.birth: "Nous devrions couper le mal à la racine"
 pirate.15.name: "Destruction du refuge pirate"
 pirate.15.desc: "Notre [killer_fleet.GetName] rapporte que ces galions pirates d'un autre âge, dans le système de [killer_fleet.solar_system.GetName], ont été détruits. À l'exception de quelques éléments survivants dans les systèmes aux alentours, la piraterie galactique est désormais reléguée au passé. Pour un temps au moins...\n\nLe butin considérable des pirates, qu'ils gardaient à l'abri, a été retrouvé. C'est un véritable trésor qui a été promptement ramené dans nos propres réserves."
 pirate.15.desc2: "Notre [killer_fleet.GetName] rapporte que ces galions pirates d'un autre âge, dans le système de [killer_fleet.solar_system.GetName], ont été détruits. À l'exception de quelques éléments survivants dans les systèmes aux alentours, la piraterie galactique est désormais reléguée au passé. Pour un temps au moins...\n\nLe butin considérable des pirates, qu'ils gardaient à l'abri, a été retrouvé. C'est un véritable trésor, comprenant aussi un ancien datapad qui, de façon surprenante, semble offrir des informations inédites sur le fonctionnement des mystérieuses Portes-L."
 pirate.25.name: "Raid contre une station pirate"
 pirate.25.desc: "Le [pirate_slayers.GetName] a détruit une station pirate dans le système de [pirate_slayers.GetStarName], en parvenant au passage à récupérer le module servant de chambre forte."
 #############################
 #Pretender Events
 #############################
 pretender.1.name: "[From.GetRegnalName] meurt sans héritier"
 pretender.1.desc_01: "[From.GetRegnalName] a succombé et sept jours de deuil ont été annoncés sur [Root.Capital.GetName]. Malheureusement, aucun héritier n'a été désigné et deux prétendants au trône se sont manifestés.\n\nLe plus puissant des deux a été couronné [Root.GetRulerTitle] sous le nom de [Root.GetRulerName], mais la situation n'est pas réglée pour autant."
 pretender.1.desc_02: "[From.GetRegnalName] a quitté ce monde pour rejoindre le suivant. Malheureusement, les Esprits ne nous ont pas transmis suffisamment de signes pour nous permettre de désigner un successeur.\n\nAprès un débat houleux, [Root.GetRulerName] a été couronné en tant que nouveau [Root.GetRulerTitle], sans pour autant faire l'unanimité. Des prétendants issus des hautes sphères du clergé tentent maintenant de rallier des soutiens."
 pretender.1.desc_03: "[From.GetRegnalName] nous a quittés sans laisser d'héritier, plongeant notre gouvernement dans la confusion. Après avoir rallié suffisamment de soutiens au sein de l'armée de [Root.Capital.GetName], [Root.GetRulerName] a été désigné pour lui succéder, mais la situation reste tendue et des prétendants tentent de rallier leurs propres soutiens pour défier le règne du nouveau [Root.GetRulerTitle]."
 pretender.1.desc_04: "[From.GetRegnalName] nous a quittés et nos algorithmes ne sont pas parvenus à identifier un successeur idéal. Pour des raisons d'efficacité, un nouveau [Root.GetRulerTitle] a été choisi de manière aléatoire et il incombe désormais à [Root.GetRulerName] d'interpréter la volonté infaillible de l'Ordinateur central.\n\nMais des doutes sont apparus et certains estiment être mieux placés pour prendre la relève."
 pretender.1.desc_05: "[From.GetRegnalName] nous a quittés et tout le [Root.GetName] est en deuil. Aucun héritier n'a été désigné, ce qui est source de discorde au sein de la noblesse.\n\n[Root.GetRulerName] a déjà été couronné à [Root.Capital.GetName], mais des prétendants avançant un lointain lien de parenté avec [From.GetRegnalName] défient le nouveau [Root.GetRulerTitle]."
 pretender.1.tooltip: "Des factions de prétendants ont fait leur apparition."
 henrik.710.desc: "Un [From.GetSpeciesName]. Plusieurs [From.GetSpeciesNamePlural]."
 ##########################
 #Leader Events
 ##########################
 leader_officer: "officier" #adjectival, like a rank or status - see 'GetLeaderType'
 leader_officer_cap: "Officier" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_autonomous: "autonome" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_autonomous_cap: "Autonome" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_avatar: "avatar" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_avatar_cap: "Avatar" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 admiral_trait_gain: "Un[officer.GetXELead] commandant[officer.GetXELead] acquiert un trait"
 admiral_trait_loss: "Un[officer.GetXELead] commandant[officer.GetXELead] perd un trait"
 leader.1.name: "Officier prometteur"
 leader.1.desc: "[officer.GetLeLaLeadCap] capitaine §H[officer.GetName]§!, en charge du §Y[ship.GetName]§!, s'est illustré[officer.GetXELead] lors du combat qui s'est récemment déroulé dans le système de [system.GetName]. Depuis [Root.Capital.GetName], l'Amirauté, reconnaissant en [officer.GetLuiElleLead] les qualités d'un[officer.GetXELead] officier de haut rang particulièrement promett[officer.GetEurEuseLead], a donc décidé de [officer.GetLeLaLead] promouvoir au grade de commandant[officer.GetXELead]."
 leader.1.desc.machine: "Après avoir géré avec succès la charge de traitement accrue au cours des combats menés par le [ship.GetName] dans le système de [system.GetName], [officer.GetName] a été élevé d'un échelon dans la chaîne de commandement."
 leader.1.desc.hive: "[officer.GetName] a été élevé au statut d'[GetLeaderStatusAdjCap] après les observations faites sur ses excellentes réactions lors du combat récent mené par le [ship.GetName] dans le système de [system.GetName]."
 new_admiral: "Un[officer.GetXELead] nouv[officer.GetEauElleLead] §Hcommandant[officer.GetXELead]§! apparaît dans notre vivier de §Hpersonnalités recrutables§!."
 leader.newadmiraltrait.desc.machine: "Grâce aux vecteurs d'approche des itérations du combat qui vient d'être livré dans le système de [system.GetName], [officer.GetName] a développé un nouvel ensemble de données tactiques."
 leader.lostadmiraltrait.desc.machine: "Après le combat qu'[officer.GetSheHe] vient de livrer dans le système de [system.GetName], [officer.GetName] a revu ses protocoles d'engagement."
 leader.newadmiraltrait.desc.hive: "L'engagement du système de [system.GetName] a permis l'apparition d'expressions génétiques uniques à [officer.GetName]."
 leader.lostadmiraltrait.desc.hive: "Le combat livré dans le système de [system.GetName] a suscité la perte de plusieurs anomalies comportementales chez [officer.GetName]."
 leader.5.desc: "Après la récente victoire du système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble avoir développé un intérêt nouveau pour la théorie navale. [officer.GetSheHeCap] a déjà commencé à expérimenter des stratégies et des tactiques radicalement novatrices."
 leader.6.desc: "Après la récente victoire du système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble avoir pris goût à la chasse. [officer.GetSheHeCap] est désormais beaucoup plus agressi[officer.GetFVeLead]."
 leader.7.desc: "Après avoir mené notre [From.From.GetName] à la victoire dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! a gagné en confiance. [officer.GetSheHeCap] se refuse désormais à ne serait-ce qu'envisager l'idée de battre en retraite lors de futurs engagements."
 leader.8.desc: "Après sa récente victoire dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] [officer.GetName] a commencé à mettre l'accent, lors des briefings de la flotte, sur l'importance de la vitesse et de la rapidité des manoeuvres. Décidé[officer.GetXELead] à exploiter pleinement l'agilité de ses vaisseaux, [officer.GetSheHe] a déjà lancé l'essai de plusieurs nouvelles formations."
 leader.9.desc: "Depuis la victoire récente de la [From.From.GetName] dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! se montre bien plus énergique et prend plus d'initiatives que par le passé. Ses performances se sont nettement améliorées."
 leader.10.desc: "Depuis la défaite essuyée dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble avoir retenu quelques leçons. [officer.GetSheHeCap] se montre désormais plus prudent[officer.GetXELead] et plus méticul[officer.GetEuxEuseLead] qu'auparavant."
 leader.11.desc: "Depuis la défaite essuyée dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble être devenu[officer.GetXELead] plus nerv[officer.GetEuxEuseLead] et moins assuré[officer.GetXELead]. Il apparaît clair qu'[officer.GetSheHe] n'est plus en mesure de commander des formations aussi importantes qu'auparavant."
 leader.12.desc: "Notre [Root.GetName] a dû battre en retraite lors de la bataille du système de [system.GetName], ce qui semble avoir considérablement ébranlé [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§!. [officer.GetSheHeCap] paraît désormais résolu[officer.GetXELead] à ne plus jamais fuir, préférant combattre jusqu'au dernier vaisseau lors des combats à venir."
 leader.13.desc: "Lorsque notre [Root.GetName] a battu en retraite, lors de la bataille du système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! a trouvé le moyen d'exploiter les systèmes de propulsion de ses vaisseaux. [officer.GetSheHeCap] est désormais capable de tirer le meilleur parti de leur vitesse."
 leader.14.desc: "Depuis sa défaite dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble plus distant[officer.GetXELead], comme déprimé[officer.GetXELead]. Selon les officiers placés sous ses ordres, [officer.GetSheHe] ne remplit plus ses fonctions avec le même enthousiasme que par le passé."
 leader.optimizations.desc.machine: "[officer.GetName] a mis à jour son heuristique opérationnelle pour la gestion de flotte."
 leader.optimizations.desc.hive: "[officer.GetName] est devenu plus adroit dans la gestion de nos flottes."
 leader.15.desc: "En supervisant les réparations de notre [Root.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! a acquis d'inestimables compétences techniques. Les équipes de contrôle des dégâts qu'[officer.GetSheHe] commande sont même désormais capables de réparer les vaisseaux pendant leurs missions."
 leader.16.desc: "Le commandement d'une formation aussi importante que notre [Root.GetName] a donné [officer.GetAuAlaLead] commandant[officer.GetXELead] §H[officer.GetName]§! de précieuses compétences d'organisation. [officer.GetSheHeCap] est désormais apte à commander des flottes plus importantes que par le passé."
 leader.17.desc: "Après avoir obtenu la victoire à la tête de la [From.From.GetName] dans le système de [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! semble avoir repris confiance en [officer.GetLuiElleLead]. [officer.GetSheHeCap] peut désormais gérer la charge administrative liée au commandement d'une flotte importante."
 leader.18.desc: "À la tête de notre [Root.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! a appris à gérer au mieux le ravitaillement pour réduire autant que possible le coût des opérations menées par ses vaisseaux."
 leader.19.desc: "Après avoir récemment exploré le système [system.GetName], [officer.GetLeLaLead] commandant[officer.GetXELead] §H[officer.GetName]§! sait comment déployer ses unités de manière à augmenter la portée de leurs capteurs. Peu de commandants de flotte possèdent les compétences requises pour effectuer des manoeuvres aussi complexes."
 leader.newtrait: "Par son travail acharné et toute son expérience, notre §H[From.From.GetTitle] [From.From.GetName]§! a développé de nouvelles compétences."
 leader.substanceabuser: "Nous recevons des rapports assez troublants sur la dégradation de la santé de notre §H[From.From.GetTitle] [From.From.GetName]§!. Son air exténué donne l'impression qu'[From.From.GetSheHe] a récemment pris une vingtaine d'années. Le devoir peut être une charge bien lourde à porter parfois."
 leader.arresteddevelopment: "Malgré de récents progrès grâce à toute son expérience, notre §H[From.From.GetTitle] [From.From.GetName]§! semble approcher ses limites."
 leader.lethargic: "En dépit de récents progrès, il semble que la plus grande partie de l'esprit d'initiative et de la résolution qui faisait avancer jusqu'à présent notre §H[From.From.GetTitle] [From.From.GetName]§! s'est progressivement envolée."
 leader.stubborn: "Notre §H[From.From.GetTitle] [From.From.GetName]§! a beaucoup gagné en expérience, mais [From.From.GetSheHe] semble aussi être devenue de plus en plus inflexible. Son obstination confine même à l'entêtement, au point qu'[From.From.GetSheHe] accepte de plus en plus difficilement les idées nouvelles."
 leader.30.name: "Retrait des assistances I.A."
 leader.30.desc: "Du fait de la politique récente d'interdiction des intelligences artificielles, tous les membres de la communauté scientifique [Root.GetAdj] en possession d'§Yassistants I.A. conscients§! ont été contraints d'y renoncer et de procéder à leur recyclage."
 ##########################
 #Diplomatic Events
 ##########################
 diplomatic.2.name: "Insultes d'un commandant de la [From.From.Owner.GetName]"
 diplomatic.2.desc: "Les [From.From.Owner.GetSpeciesNamePlural] sont réputés pour ne pas souvent avoir grand bien à dire des formes de vie aliens. Ceux qui conduisent les affaires diplomatiques [From.From.Owner.GetAdj]s ne peuvent guère se permettre d'être de tempérament colérique, car ils savent qu'ils ne doivent rien attendre d'autre que les formes de respect les plus élémentaires. C'est pourquoi, lorsque l'espace de la [Root.GetName] est traversé, les communications relèvent le plus souvent d'un protocole des plus officiels.\n\nCela n'a pas été le cas aujourd'hui, pourtant, puisque [broadcasted_insult_leader.GetName] s'est permis de lancer un message particulièrement violent à notre population, qui ne s'attendait pas à une telle chose, pendant qu'[broadcasted_insult_leader.GetSheHe] commandait une flotte traversant le système de [From.From.System.GetName]. Ce[broadcasted_insult_leader.GetXTteLead] commandant[broadcasted_insult_leader.GetXELead] semble avoir capté des signaux radio émis depuis l'un de nos mondes et s'être aussitôt lancé[broadcasted_insult_leader.GetXELead] dans une longue diatribe à propos de notre culture et de nos origines génétiques. Des millions de personnes ont pu écouter sa tirade, comme [broadcasted_insult_leader.GetSheHe] s'y attendait, suscitant ainsi une indignation outrée."
 diplomatic.2.a: "[From.From.Owner.GetName] doit renvoyer immédiatement ce fanatique"
 diplomatic.2.b: "Exigeons la tête de [broadcasted_insult_leader.GetName] !"
 diplomatic.2.c: "Vaines paroles, ne nous rabaissons pas à son niveau"
 diplomatic.3.name: "Un[broadcasted_insult_leader.GetXELead] commandant[broadcasted_insult_leader.GetXELead] insulte les [From.GetSpeciesNamePlural]"
 diplomatic.3.desc: "Même si bien peu d'entre nous considèrent comme un privilège d'avoir le moindre rapport avec les [From.GetSpeciesNamePluralInsult], ou même avec les xénos de façon générale, pour la plupart nous évitons d'afficher trop ostensiblement notre dégoût lorsque le moment ne s'y prête pas. Mais [broadcasted_insult_leader.GetLeLaLead] commandant[broadcasted_insult_leader.GetXELead] §H[broadcasted_insult_leader.GetName]§! ne semble apparemment pas s'embarrasser de telles considérations. [broadcasted_insult_leader.GetSheHeCap] s'est permis de se lancer dans une diatribe virulente contre la population [From.GetSpeciesName] en traversant l'espace de la [From.GetName]. Si la liste de ses remarques sur leur nature inférieure n'a rien suscité d'autre que des rires sous cape sur [Root.Capital.GetName], cela a toutefois causé un incident diplomatique avec les autochtones.\n\n[broadcasted_insult_leader.GetName] s'est bien excusé[broadcasted_insult_leader.GetXELead], en privé, en expliquant avoir mal pris de devoir écouter un canal radio indigène ; mais les autorités [From.GetAdj]s exigent que [broadcasted_insult_leader.GetCeluiCelleLead] qui les a insultés soit immédiatement renvoyé[broadcasted_insult_leader.GetXELead]."
 diplomatic.3.a: "Une telle intempérance ne sied pas à un[broadcasted_insult_leader.GetXELead] commandant[broadcasted_insult_leader.GetXELead]"
 diplomatic.3.b: "Honnêtement c'était assez drôle, on ne va pas renvoyer quelqu'un pour ça"
 diplomatic.4.desc: "Même si bien peu d'entre nous considèrent comme un privilège d'avoir le moindre rapport avec les [From.GetSpeciesNamePluralInsult], ou même avec les xénos de façon générale, pour la plupart nous évitons d'afficher trop ostensiblement notre dégoût lorsque le moment ne s'y prête pas. Mais [broadcasted_insult_leader.GetLeLaLead] commandant[broadcasted_insult_leader.GetXELead] §H[broadcasted_insult_leader.GetName]§! ne semble apparemment pas s'embarrasser de telles considérations. [broadcasted_insult_leader.GetSheHeCap] s'est permis de se lancer dans une diatribe virulente contre la population [From.GetSpeciesName] en traversant l'espace de la [From.GetName]. Si la liste de ses remarques sur leur nature inférieure n'a rien suscité d'autre que des rires sous cape sur [Root.Capital.GetName], cela a toutefois causé un incident diplomatique avec les autochtones.\n\n[broadcasted_insult_leader.GetName] s'est bien excusé[broadcasted_insult_leader.GetXELead], en privé, en expliquant avoir mal pris de devoir écouter un canal radio indigène ; mais les autorités [From.GetAdj]s exigent que [broadcasted_insult_leader.GetCeluiCelleLead]-ci soit extradé[broadcasted_insult_leader.GetXELead] sur [From.Capital.GetName] afin d'y être exécuté[broadcasted_insult_leader.GetXELead]."
 diplomatic.4.a: "Une vie est peu chère payée pour éviter d'en lancer des millions dans un conflit"
 diplomatic.4.b: "Hors de question de livrer l'un des nôtres à des xénos pour qu'ils le tuent !"
 diplomatic.5.name: "La [From.GetName] limoge s[broadcasted_insult_leader.GetOnALead] commandant[broadcasted_insult_leader.GetXELead]"
 diplomatic.5.desc: "Après que nos diplomates ont exercé quelques pressions sur [From.GetRulerName] pour qu'[From.Ruler.GetSheHe] choisisse ses commandants de manière un peu plus réfléchie, [From.GetLeLaLDir][From.GetRulerTitle] a limogé [broadcasted_insult_leader.GetName]. [broadcasted_insult_leader.GetCeluiCelleLeadCap]-ci ne s'est pourtant pas retiré[broadcasted_insult_leader.GetXELead] discrètement, jurant au contraire de laver son honneur, dans l'espoir que l'opinion publique [From.GetAdj] se déchaînerait à l'avenir contre la [Root.GetName].\n\nLes dirigeants de la [From.GetName] se sont toutefois montrés très clairs pour ce qui concerne les expéditions qui franchiront à l'avenir nos frontières : même s'ils n'apprécient guère avoir affaire aux espèces aliens, les [Root.GetSpeciesNamePlural] doivent au moins être respectés dans leur propre espace."
 diplomatic.5.a: "Ils ont tout intérêt à s'y tenir"
 diplomatic.6.name: "La [From.GetName] extrade s[broadcasted_insult_leader.GetOnALead] commandant[broadcasted_insult_leader.GetXELead]"
 diplomatic.6.desc: "Après de brèves négociations, [broadcasted_insult_leader.GetName] nous a été envoyé[broadcasted_insult_leader.GetXELead] pour subir le châtiment qu'[broadcasted_insult_leader.GetSheHe] mérite. Après avoir considéré un temps quelle sanction semblait la plus appropriée pour ses insultes envers les [Root.GetSpeciesNamePlural], seules sa mort et sa destruction totale ont paru appropriées.\n\nRefusant jusque dans ses derniers moments de se repentir, le discours furieux [broadcasted_insult_leader.GetDuDelaLead] provocat[broadcasted_insult_leader.GetEurRiceLead] sur nos « manières de sauvages » s'est interrompu au moment où s'est fermé le sas de la capsule propulsée à une vitesse proche de celle de la lumière au coeur de [Root.Capital.GetStarName]. Le feu glorieux qui éclairait nos ancêtres brûlera jusqu'à la dernière trace de ceux qui osent les insulter."
 diplomatic.6.a: "Fin des [From.GetRandomSpeciesSound] diffamatoires"
 diplomatic.7.name: "La [From.GetName] défend s[broadcasted_insult_leader.GetOnALead] commandant[broadcasted_insult_leader.GetXELead]"
 diplomatic.7.desc: "Nos exigences que [broadcasted_insult_leader.GetName] soit limogé[broadcasted_insult_leader.GetXELead] n'ont suscité qu'une incompréhension affligeante de la part de [From.GetRulerName] et de l'administration [From.GetAdj]. Ils ont répondu en cherchant surtout à excuser le comportement de leur commandant[broadcasted_insult_leader.GetXELead], suggérant même, peut-être inconsciemment, que certaines des choses qu'[broadcasted_insult_leader.GetSheHe] a proférées à propos des [Root.GetSpeciesNamePlural] n'étaient pas totalement fausses.\n\nCe que nous considérions jusque-là comme du fanatisme s'avère donc être tout à fait acceptable au sein de la [From.GetName], qui semble penser pouvoir nous insulter et nous calomnier sans avoir à en subir les conséquences."
 diplomatic.7.a: "Ce n'est pas le fruit qui est pourri, mais tout l'arbre"
 diplomatic.8.name: "Retour du commandant en disgrâce"
 diplomatic.8.desc: "Ce commandant, autrefois renvoyé de la flotte à la suite d'un incident diplomatique lié à une transmission radio insultante et exilé, a tenté de préparer son retour. Avec le conflit actuel, nombre des choses dites dans la transmission d'alors sont devenues des éléments de propagande que toute la population entend à longueur de journée, ce qui justifie notamment pour les militaires les actes de ce commandant.\n\nSi revenir sur notre décision affaiblirait la crédibilité du gouvernement, il pourrait bien être, malgré tout, le meilleur que nous puissions trouver pour livrer le combat."
 diplomatic.8.a: "Nous devons trouver quelqu'un pour rallier le peuple !"
 diplomatic.8.b: "Nous avions pris la bonne décision, restons-en là"
 diplomatic.10.name: "Vaisseau étranger suspect"
 diplomatic.10.desc: "[Root.GetName] est connu pour la qualité de ses sciences et son innovation. Toutefois, rester à la pointe ne requiert pas seulement de la discrétion dans la conduite des recherches, mais aussi des choix avisés pour définir avec qui les partager. Nos secrets commerciaux sont considérés comme précieux, par nous-mêmes tout autant que par le reste de la galaxie, et certains scientifiques sont très performants lorsqu'il s'agit de protéger leurs données.\n\nOr, la présence d'un vaisseau scientifique de [From.From.Owner.GetName] dans notre espace a mené certains centres de recherche à le suspecter d'espionnage. Certains chercheurs prétendent ne pas pouvoir poursuivre leurs travaux en étant confrontés à une telle menace, et demandent à ce que nous fermions nos frontières aux louches [From.From.Owner.GetSpeciesNamePlural]."
 diplomatic.10.a: "Ils doivent être rassurés, fermons les frontières"
 diplomatic.10.b: "Un vaisseau scientifique c'est des chercheurs, pas des espions"
 diplomatic.11.name: "[From.GetName] ferme ses frontières"
 diplomatic.11.desc: "La présence de vos vaisseaux scientifiques dans l'espace de [From.GetName] a suscité des interrogations sur vos intentions. Nos chercheurs pensent que vos scientifiques ne conduisent pas des recherchent, mais volent leurs travaux. Nous souhaitons préserver nos secrets commerciaux, aussi devons-nous vous interdire désormais de pénétrer notre espace."
 diplomatic.11.a: "Drôle de période, si les scientifiques se méfient les uns des autres"
 diplomatic.12.name: "[From.From.GetName] suspecté de cartographier notre génome"
 diplomatic.12.desc: "Depuis l'instant même où nous avons pu quitter [Root.GetHomeWorldName] pour la toute première fois, nous avons toujours veillé à nous protéger des xénomenaces. Les vaisseaux scientifiques de [From.From.GetName] qui se faufilent dans notre espace n'ont pas été si discrets, mais nous pensions jusqu'à présent qu'ils se contentaient de mener de paisibles recherches sur les planètes. Pourtant, une théorie récente jette un tout autre éclairage sur le sujet.\n\nOn sait que l'espèce [From.From.GetSpeciesName] utilise la cartographie du génome pour mener des recherches médicales. Ne seraient-ils donc pas en train de cartographier le génome des [Root.GetSpeciesNamePlural], dans l'intention de trouver nos points faibles ? Même si aucune preuve concrète n'a pu être avancée jusqu'à présent, cette perspective a suscité des appels à la fermeture des frontières face à [From.From.GetName] afin d'empêcher leurs tentatives d'aboutir."
 diplomatic.12.a: "Nous ne pouvons permettre que de futurs ennemis s'emparent de telles données. Fermons les frontières !"
 diplomatic.12.b: "Notre politique étrangère ne peut être dictée par la théorie du complot"
 diplomatic.12.c: "Ripostons en cartographiant nous-mêmes leur génome"
 diplomatic.13.name: "[From.GetName] ferme ses frontières"
 diplomatic.13.desc: "On a rapporté que vos vaisseaux scientifiques se livraient à des activités suspectes dans notre espace. Des rumeurs prétendent que vous avez étudié notre génome pour découvrir des informations que vous pourriez utiliser pour trouver des faiblesses chez nous ou fabriquer des armes biologiques. Nous ne pouvons exposer la population [From.GetSpeciesAdj] à un tel risque."
 diplomatic.13.a: "Avez-vous des preuves ?"
 diplomatic.14.name: "Résultats de la carte du génome"
 diplomatic.14.desc: "Même si nous n'avons pas trouvé les détails bien précis que nous cherchions dans le génome étudié, nos recherches ont beaucoup progressé sur les particularités de notre propre génome. Certaines des armes qui se sont avérées utiles par le passé, lors des guerres sur [Root.GetHomeWorldName], pourraient ne pas fonctionner du tout sur les formes de vie aliens ; mais ces avancées nous ont aidés à développer des doctrines de combat plus perfectionnées."
 diplomatic.14.a: "S'ils nous visent réellement, nous pourrons en avoir besoin"
 diplomatic.15.name: "Indiscrète science [From.From.GetAdj]"
 diplomatic.15.desc: "[Root.GetName] tente de ne pas laisser les questions spirituelles barrer la route à l'exploration et à l'examen du monde matériel, mais nous prêtons aussi une grande attention à la recherche métaphysique et aux traditions dans toutes nos actions. Les scientifiques de [From.From.GetName] semblent bien moins précautionneux dans leur course aux découvertes astronomiques.\n\nAprès nous être intéressés à certaines des étoiles les plus proches de nous, qui sont essentielles dans la mythologie [Root.GetSpeciesAdj], [encroaching_research_leader.GetName] a été accusé de tenter de « réfuter » certaines des légendes qui les entourent. Même si nous sommes persuadés que la signification spirituelle des constellations peut difficilement pâtir des découvertes matérielles, nombreux sont ceux qui s'opposent à cette recherche et tentent de [encroaching_research_leader.GetHimHer] persuader de quitter l'espace de [Root.GetName]."
 diplomatic.15.a: "La suspicion de mauvaise intention est suffisante pour lui fermer notre espace"
 diplomatic.15.b: "Notre foi transcende la matérialité, elle ne peut être atteinte"
 diplomatic.15.b.tooltip: "[encroaching_research_leader.GetName] poursuit ses recherches"
 diplomatic.16.name: "[From.GetName] ferme ses frontières"
 diplomatic.16.desc: "Votre scientifique [encroaching_research_leader.GetName] s'intéresse d'un peu trop près aux étoiles de constellations que notre peuple tient pour sacrées. Nous ne pouvons autoriser personne à opérer dans notre espace qui ne voudrait pas accorder tout le respect qui se doit à notre foi et à ses légendes."
 diplomatic.16.a: "Cela ne peut être qu'un malentendu..."
 diplomatic.17.name: "Découverte hérétique en [From.GetName]"
 diplomatic.17.desc: "Conduire des recherches dans l'espace étranger exige parfois du tact, ce que nous oublions sans doute trop souvent lors du recrutement de nos scientifiques. Cela n'a jamais été aussi visible que lorsque [encroaching_research_leader.GetName] a récemment connu quelques problèmes alors qu'il étudiait certaines étoiles appartenant aux constellations sacrées pour les [From.GetAdj]. Les indigènes se sont opposés à une étude clinique de l'objet de ses recherches, lui suscitant des tracas, jusqu'à ce que [From.GetRulerTitle] [From.GetRulerName] interdise formellement ses recherches.\n\n[encroaching_research_leader.GetName], sans doute par esprit de vengeance, a malgré tout pris le temps de trouver des matériaux suggérant que certaines des légendes [From.GetAdj] entourant ces étoiles semblent particulièrement incohérentes avec leur âge et leur contenu. Si jamais tout cela est publié, la contestation sera plus vive encore."
 diplomatic.17.a: "Chercherait-[encroaching_research_leader.GetSheHe] délibérément à causer un scandale ? Renvoyons-[encroaching_research_leader.GetHimHer]"
 diplomatic.17.b: "Parfois ces choses se produisent dans la recherche"
 diplomatic.18.name: "[encroaching_research_leader.GetName] publie des hérésies"
 diplomatic.18.desc: "En dépit de notre confiance dans les meilleures intentions du chercheur [From.GetName] qui a étudié nos constellations anciennes, [encroaching_research_leader.GetSheHe] est parvenu à mettre notre peuple en colère en réévaluant l'âge des étoiles et en prétendant que leur brillance et leur visibilité est en total désaccord avec nos légendes sur ces constellations.\n\nCeux qui s'étaient opposé dès le départ au projet crient maintenant haut et fort que cela a été fait délibérément, par pure méchanceté, après qu'ils ont réussi à obtenir l'arrêt de ses recherches. Les autorités [From.GetAdj] ont décidé de faire abstraction de cette question et refusé d'empêcher la parution de cette étude, qui va susciter colère et affliction au sein de notre population."
 diplomatic.18.a: "Nous n'aurions jamais dû croire qu'ils pourraient même nous respecter"
 diplomatic.19.name: "Bois exotique"
 diplomatic.19.desc: "La musique peut prendre bien des formes chez les êtres que nous avons rencontrés depuis que nous avons quitté [Root.GetHomeWorldName], mais les méthodes et préférences de chacun continuent de nous déconcerter. Parfois, la musique alien est inaudible pour nous ; d'autres fois, les ondes sont suffisamment puissantes altérer définitivement notre audition. Trouver une musique que nous aimons plus encore que ses créateurs est, de fait, infiniment rare.\n\nMais l'une de ces occasions s'est récemment produite sur [music_listening_planet.GetName]. On y capte en effet les stations radios passant de la musique, de l'autre côté de la frontière [music_origin_country.GetAdj] toute proche. Certaines sont devenues extrêmement populaires, car il semble bien qu'un certain instrument de [music_origin_country.GetHomeWorldName] n'est pas seulement plaisant, mais ferait aussi résonner le corps des [Root.GetSpeciesNamePlural], causant un effet relaxant dans [Root.GetSpeciesOrganName]. Quel que soit cet instrument, il ne doit en rien ressembler aux nôtres."
 diplomatic.19.a: "Excellente occasion d'en apprendre plus sur cette culture"
 diplomatic.19.b: "Soyons prudent, étudions cet instrument"
 diplomatic.20.name: "Biologie instrumentale"
 diplomatic.20.desc: "Ayant examiné de plus près la musique alien, nous avons découvert qu'elle est faite par un instrument à vent fabriqué à partir d'une plante indigène de ce monde. La structure interne inhabituelle de la plante est totalement différente de tout ce que l'on connaît sur [Root.GetHomeWorldName], même au niveau moléculaire. L'effet de l'air passant à travers la plante a permis des avancées sur la connaissance que nous avons de la biologie florale de l'espèce [Root.GetSpeciesAdj]."
 diplomatic.20.a: "Qui sait ce que nous pourrions découvrir encore ?"
 diplomatic.21.name: "La [neighbor_contesting_colony.GetName] s'oppose à notre expansion"
 diplomatic.21.desc: "Votre nouvelle colonie sur [Root.GetName] est très proche de notre espace. Nous préférerions que vous vous retiriez de la zone afin de prévenir d'éventuels conflits sur la délimitation de notre frontière commune."
 diplomatic.21.a: "Nous allons immédiatement cesser de la développer"
 diplomatic.21.b: "Pas question, cette colonie est un gage d'avenir pour nous"
 diplomatic.1000.name: "Manoeuvres de la flotte"
 diplomatic.1000.desc: "[exercise_admiral.GetLeLaLeadCap] commandant[exercise_admiral.GetXELead] §H[exercise_admiral.GetName]§! a établi des plans pour un grand exercice de la flotte, qui impliquerait une grande partie de nos vaisseaux. Le lieu qu'[exercise_admiral.GetSheHe] a choisi pour ces manoeuvres est le système de §Y[exercise_system.GetName]§!, proche de la frontière [exercise_neighbor.GetAdj].\n\nLes [exercise_neighbor.GetSpeciesNamePlural] pourraient bien considérer cela comme une provocation, mais si nous empêchons la tenue de ces manoeuvres, les forces armées pourraient le voir comme un signe de faiblesse. Et, après tout, [exercise_system.GetName] se trouve dans notre espace, et la [exercise_neighbor.GetName] n'a aucunement le droit de nous dire ce que nous pouvons ou pas faire chez nous."
 diplomatic.1000.a: "Lançons ces manoeuvres, comme prévu"
 diplomatic.1000.b: "Annulons tout"
 FLEET_MANEUVERS_1_PROJECT: "Conduire les manoeuvres de la flotte"
 FLEET_MANEUVERS_1_PROJECT_DESC: "Des grandes manoeuvres de la flotte ont été prévues dans le système de [exercise_system.GetName], non loin des frontières de la [exercise_neighbor.GetName]. L'objectif est de simuler une opération hostile par une force [exercise_neighbor.GetSpeciesName] importante dans notre espace, préliminaire à une invasion.\n\nL'exercice va débuter une fois que toutes les forces impliquées auront atteint la région, en orbite de [exercise_location.GetName]."
 FLEET_MANEUVERS_2_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_2_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 FLEET_MANEUVERS_3_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_3_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 diplomatic.1001.name: "Manoeuvres de la flotte annulées"
 diplomatic.1001.desc: "Les plans prévoyant de mener un grand exercice de la flotte ont été annulés. À la suite de reports continuels ayant retardé le déplacement des vaisseaux jusque sur place, la préparation de la flotte dans son ensemble pâtirait grandement d'un lancement maintenant de l'exercice."
 diplomatic.1002.desc: "La [Root.GetName] étant déjà bien occupée par la guerre à mener, le grand exercice prévu par la flotte a été annulé. Les équipages devront gagner de l'expérience sur le champ de bataille, par eux-mêmes."
 diplomatic.1002.a: "Le baptême du feu, comme on dit"
 diplomatic.1006.name: "Activités dans le système de [exercise_system.GetName]"
 diplomatic.1006.desc: "Nous avons reçu des rapports sur de nombreux mouvements de vaisseaux au sein de l'espace de la [From.Owner.GetName]. Ils semblent centrés sur le système de [exercise_system.GetName] - étrangement proche de nos frontières. Qu'ont donc l'intention de faire les [From.Owner.GetSpeciesNamePlural] ?"
 diplomatic.1006.a: "Surveillons de près l'évolution de la situation"
 diplomatic.1011.name: "Manoeuvre de la flotte : collisions"
 diplomatic.1011.desc: "Les manoeuvres complexes conçues par [exercise_admiral.GetLeLaLead] commandant[exercise_admiral.GetXELead] §H[exercise_admiral.GetName]§! ont engendré plusieurs collisions ayant causé des dégâts minimes au cours des exercices qui se tiennent actuellement dans le système de §Y[exercise_system.GetName]§!. Les pertes au sein des équipages ont été peu nombreuses, et aucun des vaisseaux impliqués n'a souffert de dommages critiques, même s'ils auront besoin de réparer dans les chantiers une fois ces manoeuvres terminées."
 diplomatic.1011.a: "Heureusement, aucun vaisseau n'a été perdu"
 exercise_collision_tooltip: "Plusieurs vaisseaux ont subi des dégâts à cause des collisions."
 diplomatic.1012.name: "Manoeuvre de la flotte : vaisseaux perdus"
 diplomatic.1012.desc: "Le [destroyed_ship_1.GetName] et le [destroyed_ship_2.GetName] ont tous deux été perdus avec leurs équipages de façon tragique, lorsque les deux vaisseaux interstellaires sont entrés en collision lors d'une manoeuvre à grande vitesse qu'impliquait leur participation à l'exercice qui a lieu actuellement dans le système de [exercise_system.GetName]. Les proches des militaires disparus ont été informés."
 diplomatic.1012.a: "Triste jour"
 exercise_ships_lost: "Deux de nos vaisseaux sont perdus des suites d'une collision accidentelle."
 diplomatic.1013.name: "Manoeuvre de la flotte : officier prometteur"
 diplomatic.1013.desc: "Le capitaine du [officer_ship.GetName], [exercise_officer.GetName], a démontré de réels talents lors des exercices qui ont eu lieu dans le système de [exercise_system.GetName]. Le jeune officier a su faire preuve d'initiative et démontrer qu'il possédait admirablement l'art du commandement, aussi l'Amirauté estime-t-elle approprié de [exercise_officer.GetHerHim] promouvoir immédiatement aux grades les plus élevés."
 diplomatic.1013.a: "La flotte aura toujours besoin de commandants talentueux"
 exercise_officer_tooltip: "[exercise_officer.GetLeLaLeadCap] commandant[exercise_officer.GetXELead] £commander£§Y[exercise_officer.GetName]§! va se tenir prêt[exercise_officer.GetXELead] à recevoir ses ordres."
 diplomatic.1014.name: "Manoeuvre de la flotte : intérêt public"
 diplomatic.1014.desc: "L'exercice de la flotte qui a lieu actuellement dans le système de [exercise_system.GetName] a largement attiré l'attention des médias de [Root.Capital.GetName] et des colonies. Des enregistrements holographiques montrant certaines des manoeuvres les plus impressionnantes ont suscité l'admiration du grand public pour les vaillants défenseurs de la [Root.GetName]. Les volontaires affluent dans les bureaux de recrutement de la flotte !"
 diplomatic.1014.a: "Cela devrait permettre de réduire nos coûts"
 diplomatic.1020.name: "Rapports sur les manoeuvres des [From.Owner.GetSpeciesNamePlural]"
 diplomatic.1020.desc: "Les services de renseignement ont rassemblé de nouvelles informations sur les nombreuses activités navales de la [From.Owner.GetName] dans le système de [exercise_system.GetName]. Les  [From.Owner.GetSpeciesNamePlural] semblent avoir rassemblé un grand nombre de vaisseaux pour y conduire une sorte de grand exercice naval, à une échelle inédite jusqu'à présent.\n\nComme rien ne montre pour l'instant que ces manoeuvres vont se traduire par des opérations militaires directes contre la [Root.GetName], sa proximité de nos frontières montre qu'il s'agit clairement d'une provocation. Comment devons-nous réagir ?"
 diplomatic.1020.a: "Protestons par la voie diplomatique"
 diplomatic.1020.b: "Contentons-nous d'ignorer ces provocations"
 exercise_diplomatic_protest: "Nous allons exprimer à la [From.Owner.GetName] notre mécontentement face à ses exercices."
 diplomatic.1021.desc: "La [From.GetName] s'élève de la façon la plus outrée contre les exercices militaires provocateurs qui sont actuellement menés dans le système de [exercise_system.GetName] par les forces navales de la [Root.GetName].\n\nMener des exercices à une échelle aussi inédite, dans une zone si proche de nos frontières, ne peut être interprété que comme une menace militaire à peine voilée. Nous avons donc placé nos propres forces au niveau d'alerte le plus élevé, et les commandants de nos flottes ont reçu pour ordre de répondre à toute violation de la frontière par tous les moyens qu'ils estimeront nécessaires."
 diplomatic.1021.a: "Disons aux [From.GetSpeciesNamePlural] de se mêler de leurs affaires"
 diplomatic.1021.b: "Nous ne pouvons nous permettre un incident, annulons"
 diplomatic.1021.c: "Nos diplomates sauront arrondir les angles"
 exercise_diplomatic_hardline: "Cela va envoyer une réponse diplomatique très ferme à cette misérable protestation diplomatique."
 exercise_diplomatic_canceled: "Les manoeuvres en cours de la flotte vont être annulées pour améliorer nos relations avec la [From.GetName]. Les militaires ne vont guère s'en réjouir toutefois.\n\n"
 exercise_diplomatic_conciliatory: "Nous allons envoyer une réponse conciliante afin d'amoindrir les dommages au niveau diplomatique, mais les manoeuvres seront menées à leur terme."
 diplomatic.1022.desc: "Même si elles étaient à peine compréhensibles, nous avons bien reçu vos objections sur les exercices militaires que mène notre glorieuse flotte dans le système de [exercise_system.GetName]. Ce système, comme vous le savez très certainement, se trouve bien dans l'espace souverain de la [From.GetName]. Nous ne voyons absolument pas en quoi ce qu'il peut s'y passer vous regarde de quelque manière que ce soit.\n\nLa [Root.GetName] ferait bien de se retenir d'envoyer des messages diplomatiques aussi provocateurs et irréfléchis à l'avenir.\n\nFin de la transmission."
 diplomatic.1022.a: "C'est intolérable !"
 diplomatic.1023.desc: "À la lumière des objections émises par la [Root.GetName] concernant nos manoeuvres navales dans le système de [exercise_system.GetName], la [From.GetName] a décidé de mettre fin à tous les exercices en cours. Ceci vise à maintenir les meilleures relations possibles entre nos empires.\n\nNous espérons sincèrement que notre décision permettra de désamorcer toute tension interstellaire en apportant la preuve irréfutable de l'engagement des [From.GetSpeciesNamePlural] en faveur d'une paix galactique durable."
 diplomatic.1023.a: "Peut-être sont-ils sérieux lorsqu'ils parlent de paix ?"
 diplomatic.1024.desc: "La [From.GetName] regrette profondément que les exercices militaires menés actuellement dans le système de [exercise_system.GetName] aient pu susciter la moindre incompréhension entre nous.\n\nCes exercices ont été planifiés il y a longtemps, et la zone où ils se déroulent a été choisie de manière aléatoire par nos commandants. Nous prions donc la [Root.GetName] de ne pas interpréter tout cela comme une provocation ou une menace de quelque sorte que ce soit à son encontre."
 diplomatic.1024.a: "S'agirait-il d'une nouvelle sournoiserie [From.GetSpeciesAdj] ?"
 diplomatic.1025.name: "Manoeuvres terminées"
 diplomatic.1025.desc: "Les manoeuvres de la flotte conduites dans le système de §Y[exercise_system.GetName]§! sont terminées. [exercise_admiral.GetLeLaLeadCap] commandant[exercise_admiral.GetXELead] §H[exercise_admiral.GetName]§! a rapporté que nous avons beaucoup appris de cet exercice, en grande partie du fait qu'il s'agissait d'un déploiement extrêmement important. En dépit des répercussions diplomatiques potentielles, les bénéfices au niveau militaire, au moins, sont nombreux."
 diplomatic.1025.a: "Beau travail"
 diplomatic.1026.name: "Manoeuvres de la [From.Owner.GetName] terminées"
 diplomatic.1026.desc: "À en juger par la diminution soudaine des transmissions militaires codées émises dans le système de [exercise_system.GetName], les manoeuvres navales menées par la [From.Owner.GetName] qui s'y sont tenues sont enfin terminées."
 diplomatic.1026.a: "Il était temps"
 precursor_1: "$vultaum_precursor_civ$"
 precursor_2: "$yuht_precursor_civ$"
 precursor_3: "$first_league_precursor_civ$"
 precursor_4: "$irassian_precursor_civ$"
 precursor_5: "$cybrex_precursor_civ$"
 precursor_baol_1: "$NAME_Baol$"
 precursor_zroni_1: "$NAME_Zroni$"
 precursor_inetian: "$NAME_inetian$"
 precursor_adakkaria: "$NAME_adakkaria$"
 precursor_1_desc: "Leur savoir était vaste et leurs théories complexes. Mais leur recherche de la vérité ultime les a-t-elle menés à l'illumination ou à l'oubli ?"
 precursor_2_desc: "Ils sillonnaient les étoiles, s'adonnant à la recherche et l'expansion perpétuelles. Désormais, il ne reste d'eux que des ruines, gages de conséquences imprévisibles."
 precursor_3_desc: "L'unité est fragile. Quelle force a donc brisé une fédération autrefois florissante à l'influence étendue sur des secteurs entiers ?"
 precursor_4_desc: "Même les civilisations les plus puissantes tombent face à des ennemis invisibles. L'arrogance les a-t-elle aveuglés ou est-ce l'ignorance qui a scellé leur destin ?"
 precursor_5_desc: "À une époque, nul ne pouvait se dresser contre eux, jusqu'à ce que quelque chose vienne fracasser leur détermination. Qu'est-ce qui a mis un terme à leur croisade ?"
 precursor_baol_1_desc: "Ils cultivaient des mondes entiers, façonnant soigneusement les écosystèmes. Mais même les racines les plus profondes peuvent être arrachées du sol."
 precursor_zroni_1_desc: "L'esprit est sans limites. Leurs pensées les ont fait voyager à travers les étoiles, transformant l'existence. Mais il ne suffit pas de voir loin pour partager une même vision."
 precursor_inetian_desc: "La prospérité nourrit l'ambition et l'ambition invite la ruine. Nul ne sait quelle force a causé leur perte, mais le seul profit n'a pas suffi à les sauver."
 precursor_adakkaria_desc: "Ils chevauchaient les marées du cosmos, jamais restreints, jamais immobiles. Mais les voyageurs arrivent un jour au bout du chemin."
