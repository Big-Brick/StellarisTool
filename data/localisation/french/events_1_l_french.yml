 VULTAUMAR: "Vultaumar Prime"
 VULTAUMAR_DESC: "L'ancien monde natal des Vultaums. Il a connu des jours meilleurs."
 YUHTAAN: "Yuhtaan Majoris"
 YUHTAAN_DESC: "Ce monde, qui a servi de capitale à l'ancien Empire yuth, abritait jadis la vie. Mais ce n'est plus le cas."
 FEN_HABBANIS: "Fen Habbanis"
 FEN_HABBANIS_DESC: "Fen Habbanis III, ou simplement « Fen Habbanis » comme l'appelait ses anciens habitants, était la capitale de la Première ligue."
 IRASSIA: "Irassia"
 IRASSIA_DESC: "Quelle qu'elle ait pu être par le passé, la biosphère qu'abritait autrefois ce monde a aujourd'hui disparu."
 CYBREX: "Anneau-monde de la Cybrex"
 CYBREX_DESC: "Le dernier refuge de la Cybrex, un anneau-monde aujourd'hui dévasté."
