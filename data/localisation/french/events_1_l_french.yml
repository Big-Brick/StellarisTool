 #On-Action Events
 ####################################
 action.1.name: "Premier contact avec la §H[contact_empire.GetName]§!"
 action.1.message: "Nous avons établi un premier contact avec la §H[contact_empire.GetName]§!."
 action.1.desc_01: "Je vous transmets les salutations de [contact_empire.GetRulerName], [contact_empire.GetRulerTitle] incontesté de la [contact_empire.GetName]. Respectez nos frontières et ne vous mêlez pas de nos affaires. Peut-être pourrez-vous ainsi éviter que nos puissantes flottes ne mettent le cap sur vos mondes miséreux."
 action.1.desc_02: "Heureuse rencontre ! Je représente la [contact_empire.GetName] que dirige notre illustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous régnons sur notre espace par mandat divin. Aussi, tant que vous resterez à l'écart de nos affaires spirituelles, nos relations pourront rester cordiales."
 action.1.desc_03: "Nous sommes la [contact_empire.GetName], les serviteurs de notre très sage [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous entendons utiliser la technologie pour nous améliorer. Que vous approuviez ou pas nos objectifs, nous espérons que vous resterez des voisins amicaux."
 action.1.desc_04: "Salutations de la [contact_empire.GetName]. Nous sommes une civilisation pacifique, gouvernée de façon juste par notre bien-aimé [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Si le moindre différend pouvait survenir entre nos peuples à l'avenir, nous espérons qu'il pourra être réglé par le dialogue plutôt que par la violence."
 action.1.desc_05: "Je m'adresse à vous au nom de la [contact_empire.GetName], et ai été autorisé à vous présenter nos salutations. Tant que vous ne vous mêlerez pas de nos affaires intérieures et ferez preuve de respect envers notre grand [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], il n'y a nulle raison que nos relations diplomatiques se dégradent."
 action.1.desc_06: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] vous adresse les salutations du Conseil souverain de la [contact_empire.GetName]. Nous espérons tisser des relations fructueuses avec votre peuple, mais sachez que notre armée répondra de toute sa puissance à toute transgression de nos frontières."
 action.1.desc_07: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et les membres du Conseil religieux vous adressent leurs salutations. Nous sommes les guides spirituels de la [contact_empire.GetName], et notre objectif est de mener cette grande civilisation sur la voie du salut. Si vous ne vous mettez pas en travers de notre chemin, nous resterons en bons termes."
 action.1.desc_08: "Salutations. J'ai été choisi par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] pour représenter la [contact_empire.GetName] lors de toutes les relations diplomatiques avec votre peuple. Nous mettons tout en oeuvre pour profiter pleinement de la technologie. Aussi serait-il préférable que vous n'interfériez pas dans notre quête de la connaissance."
 action.1.desc_09: "J'ai été autorisé à vous présenter les salutations les plus cordiales de la [contact_empire.GetName]. Nous avons construit un système de gouvernement pacifique, opérant sous la supervision d'un conseil dirigé par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Puissent nos deux civilisations connaître toujours la paix."
 action.1.desc_10: "Salutations. Je parle au nom de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et de l'opulente élite de la [contact_empire.GetName]. Nous sommes toujours avides de rencontrer de nouveaux partenaires commerciaux, et espérons parvenir à un compromis qui profitera au commerce de nos deux empires."
 action.1.desc_11: "Je représente la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], espère tisser des relations pacifiques avec votre peuple. Sachez toutefois que nous sommes tout à fait capables de défendre notre mode de vie."
 action.1.desc_12: "Je vous présente les salutations de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], dirigeant élu de la [contact_empire.GetName]. Nous pensons que tout être doué de raison est en droit d'assouvir ses besoins spirituels, et espérons que vous partagez ce point de vue."
 action.1.desc_13: "Salutations de la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] est notre représentant élu mais, dans les faits, tous les citoyens ont leur mot à dire dans la manière dont fonctionne le gouvernement. Nous cherchons à progresser par le biais de la technologie, aussi espérons-nous que vous saurez respecter ce souhait."
 action.1.desc_14: "Heureuse rencontre, mes amis. Nous sommes la [contact_empire.GetName], une civilisation reposant sur ces piliers que sont la coexistence pacifique et les libertés individuelles. Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], l'actuel chef de notre gouvernement, a exprimé son espoir sincère que nos deux peuples noueront une amitié durable."
 action.1.desc_15: "Salutations de la [contact_empire.GetName]. Nous sommes une civilisation démocratique, soucieuse de préserver les libertés individuelles de nos citoyens. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], espère une relation aussi longue que fructueuse avec votre peuple."
 action.1.desc_16: "Peuples aliens, je m'adresse à vous au nom de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], souverain incontesté de la [contact_empire.GetName]. Respectez nos frontières et ne vous mêlez pas des affaires des [contact_empire.GetSpeciesNamePlural]. Peut-être alors éviterez-vous que nos puissantes flottes ne mettent le cap sur vos mondes misérables."
 action.1.desc_17: "Entendez bien ce message, aliens. Je représente la [contact_empire.GetName], que dirige notre illustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous régnons sur notre espace par mandat divin. Aussi, tant que votre semblant de culture respectera notre foi, nous pourrons rester en paix."
 action.1.desc_18: "Nous sommes la [contact_empire.GetName], les serviteurs de notre très sage [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous entendons utiliser la technologie pour nous améliorer. Que vous approuviez ou pas nos objectifs, n'envisagez même pas de nous défier, aliens."
 action.1.desc_19: "Nous sommes la [contact_empire.GetName]. Nous sommes une civilisation pacifique, gouvernée de façon juste par notre bien-aimé [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Je n'ai aucune idée du niveau de cruauté dont votre curieuse espèce peut faire preuve, mais si le moindre différend pouvait survenir entre nos peuples à l'avenir, nous espérons qu'il pourra être réglé par le dialogue plutôt que par la violence."
 action.1.desc_20: "Je parle au nom de la [contact_empire.GetName] et j'apporte un message à votre espèce dépravée. Tant que vous ne vous mêlerez pas de nos affaires intérieures et ferez preuve de respect envers notre grand [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], nos civilisations respectives pourront être en paix."
 action.1.desc_21: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et le Conseil souverain de la [contact_empire.GetName] m'ont chargé de vous transmettre cet avertissement : tenez vos vaisseaux aliens ridicules hors de notre espace, car sachez que notre armée répondra de toute sa puissance à toute transgression de nos frontières."
 action.1.desc_22: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et les membres du Conseil religieux sollicitent votre attention, créatures païennes. Nous sommes les guides spirituels de la [contact_empire.GetName], et notre objectif est de mener cette grande civilisation sur la voie du salut. Mieux vaut pour vous, aliens, qu'elle ne soit pas souillée de votre présence."
 action.1.desc_23: "Attention, créatures aliens. J'ai malheureusement été choisi par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] pour représenter la [contact_empire.GetName] dans le cadre des relations diplomatiques avec votre civilisation primitive. Nous cherchons à nous approprier des technologies que vous n'imaginez pas. Ne vous en mêlez pas."
 action.1.desc_24: "Après une longue délibération, j'ai été autorisé à m'adresser à vous au nom de la [contact_empire.GetName]. Nous avons construit un système de gouvernement pacifique, qui opère sous la supervision d'un conseil dirigé par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Votre influence alien n'y est pas la bienvenue, et nous préférerions que vous gardiez vos distances."
 action.1.desc_25: "Je parle au nom de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et de l'opulente élite de la [contact_empire.GetName]. Vos coutumes aliens nous posent question. Peut-être, malgré tout, pourrions-nous nous livrer à quelques échanges commerciaux - sous réserve que votre civilisation inférieure produise la moindre chose de valeur."
 action.1.desc_26: "Je représente la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], souhaite vous faire savoir que nous sommes tout à fait capables de défendre notre mode de vie. Ne vous mêlez pas de nos affaires, aliens."
 action.1.desc_27: "Je vous transmets un message de la part de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], dirigeant élu de la [contact_empire.GetName] : nous pensons que tout être doué de raison est en droit d'assouvir ses besoins spirituels, et ne tolérerons aucune ingérence alien sur la question."
 action.1.desc_28: "Vous parlez à la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] est notre représentant élu mais, dans les faits, tous les citoyens ont leur mot à dire dans la manière dont fonctionne le gouvernement. Nous cherchons à nous améliorer par le biais de la technologie - même si nous ne nous attendons pas à ce que des aliens aussi primitifs que vous le comprennent."
 action.1.desc_29: "Nous sommes la [contact_empire.GetName], une civilisation bâtie sur ces piliers que sont la coexistence pacifique et des libertés individuelles. Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], l'actuel chef de notre gouvernement, demande à ce que vous nous laissiez tranquilles et vous livriez à vos infâmes affaires aliens loin de notre espace."
 action.1.desc_30: "Je parle au nom de la [contact_empire.GetName]. Nous sommes une civilisation démocratique, soucieuse de préserver les libertés individuelles de nos citoyens dans une galaxie emplie d'horreurs aliens. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], vous met en garde : n'entrez pas en contact avec nos citoyens et n'approchez pas de notre espace."
 action.1.desc_31: "Je vous transmets les salutations de [contact_empire.GetRulerName], [contact_empire.GetRulerTitle] incontesté de la [contact_empire.GetName]. Votre constitution est fascinante. Quelles sont vos techniques martiales ? Nous aimerions en apprendre davantage sur votre espèce."
 action.1.desc_32: "Heureuse rencontre, aliens. Je représente la [contact_empire.GetName], que dirige notre illustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous régnons sur notre espace par mandat divin. Aussi, tant que vous resterez à l'écart de nos affaires spirituelles, nous serons ravis d'en apprendre davantage sur votre culture."
 action.1.desc_33: "Nous sommes la [contact_empire.GetName], les serviteurs de notre très sage [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous entendons utiliser la technologie pour bâtir une société grandiose, aussi apprécions-nous de pouvoir étudier de nouvelles civilisations aliens afin de voir ce que nous pouvons apprendre d'eux."
 action.1.desc_34: "Beaux aliens, je vous transmets les salutations de la [contact_empire.GetName]. Nous sommes une civilisation pacifique, gouvernée de façon juste par notre bien-aimé [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nous espérons que ce jour marque le début d'une longue amitié entre nous et votre fascinante espèce."
 action.1.desc_35: "Je parle au nom de la [contact_empire.GetName] et vous adresse ses salutations. Notre grand [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] est très satisfait d'avoir pris contact avec votre espèce unique, et il nous tarde d'échanger culture et idées avec vous."
 action.1.desc_36: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] vous adresse les salutations du Conseil souverain de la [contact_empire.GetName]. Nous espérons pouvoir tisser des liens fructueux avec votre impressionnante civilisation, et notre armée a reçu ordre de traiter avec respect tous les membres de votre espèce."
 action.1.desc_37: "Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et les membres du Conseil religieux vous adressent leurs salutations. Nous sommes les guides spirituels de la [contact_empire.GetName], et notre objectif est de mener cette grande civilisation sur la voie du salut. Nous serions honorés que votre grande espèce se joigne à nous pour ce voyage."
 action.1.desc_38: "Salutations. J'ai l'honneur d'avoir été choisi par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] pour représenter la [contact_empire.GetName] dans le cadre des relations diplomatiques avec votre fascinante espèce. Nous mettons tout en oeuvre pour tirer le meilleur parti de la technologie, et espérons que vous aussi poursuivez ce but."
 action.1.desc_39: "J'ai l'incommensurable plaisir de vous présenter les salutations les plus cordiales de la [contact_empire.GetName]. Nous avons construit un système de gouvernement pacifique, opérant sous la supervision d'un conseil dirigé par notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Puisse votre grande espèce ne connaître rien d'autre que la paix."
 action.1.desc_40: "Salutations. Je parle au nom de notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] et de l'opulente élite de la [contact_empire.GetName]. Nous sommes toujours avides de rencontrer de nouveaux partenaires commerciaux parmi les si diverses et si délicieuses nations aliens rencontrées par nos vaisseaux lors de leur exploration de la galaxie."
 action.1.desc_41: "Je représente la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], croit que la paix ne peut être défendue que par la force, aussi ne vous inquiétez pas de nos dépenses militaires. Nous sommes de fait impressionnés par votre espèce, et espérons que vous accepterez de procéder à des échanges culturels entre nos peuples."
 action.1.desc_42: "Je vous adresse les salutations de [contact_empire.GetRulerName] [contact_empire.GetRulerTitle] élu de la [contact_empire.GetName]. Nous pensons que tout être doué de raison est en droit d'assouvir ses besoins spirituels, et nous sommes persuadés qu'une espèce aussi éclairée que la vôtre partage ce sentiment."
 action.1.desc_43: "Salutations de la [contact_empire.GetName]. Notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] est notre représentant élu mais, dans les faits, tous les citoyens ont leur mot à dire dans la manière dont fonctionne le gouvernement. Nous cherchons à nous améliorer par le biais de la technologie et par l'étude des cultures aliens que nous rencontrons en explorant la galaxie."
 action.1.desc_44: "Heureuse rencontre, amis aliens. Nous sommes la [contact_empire.GetName], une civilisation reposant sur ces piliers que sont la coexistence pacifique et les libertés individuelles. Les prouesses culturelles de votre espèce ont beaucoup impressionné notre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], l'actuel chef de notre gouvernement."
 action.1.desc_45: "Salutations de la [contact_empire.GetName]. Nous sommes une civilisation démocratique, soucieuse de préserver les libertés individuelles de nos citoyens, indépendamment de l'espèce à laquelle ils appartiennent. Notre [contact_empire.GetRulerTitle] élu, [contact_empire.GetRulerName], espère une relation aussi longue que fructueuse avec votre peuple."
 action.1.desc_46: "Nous appartenons au [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] est notre dirigeant. Salutations."
 action.1.desc_47: "Nous appartenons au [contact_empire.GetName]. Maudits étrangers, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] vous ordonne de garder vos distances."
 action.1.desc_48: "Nous appartenons au [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] se réjouit de rencontrer toujours plus d'aliens."
 action.1.desc_49: "Bonjour, [Root.GetSpeciesNamePlural] ! Nous avons un message à vous transmettre de la part de notre [contact_empire.GetRulerTitle], juste pour vous.\n\n...\n\n...\n\n§RAVEC LE FEU ATOMIQUE NOUS ALLONS DÉBARRASSER L'UNIVERS DES VÔTRES !\n\nRACAILLES DE XÉNOS !§!"
 action.1.desc_50: "Nous sommes la [contact_empire.GetName] et parlons comme un. La [contact_empire.GetGovernmentName] a pris note de votre présence. À partir de maintenant, nous observerons. Nos actions futures dépendront de vous, selon que vous soyez une menace, une chance pour nous étendre ou... une variable inconue."
 action.1.desc_51: "Tremblez, saletés d'aliens, car votre destin approche. La [contact_empire.GetName] purifiera la galaxie de chacune ces xénocivilisations imparfaites qui la polluent. [Root.Capital.GetName] brûlera !"
 action.1.desc_52: "Nous sentons la présence de la proie...Proies, sachez que nous sommes vos chasseurs. Le [Root.GetBloodType] des [Root.GetSpeciesNamePlural] alimentera la croissance de la [contact_empire.GetName]. Luttez si vous en éprouvez le besoin, mais cela ne changera en rien l'issue de la question."
 action.1.desc_53: "La [contact_empire.GetName] vous voit, et nous parlons d'une seule voix. Notre [contact_empire.GetGovernmentName] aime la vie sous toutes ses jolies formes, mais ne prenez jamais notre enthousiasme pour de la naïveté. Nous avons l'intention de vous observer attentivement."
 action.1.desc_60: "Nous avons surveillé votre expansion depuis l'espace, jeunes [Root.GetSpeciesNamePlural]. Nous sommes la [contact_empire.GetName], et nous gouvernons cette partie de la galaxie depuis des temps immémoriaux. Les affaires des races plus jeunes ne nous intéressent en rien, et nous n'avons aucune intention d'être impliqués dans vos petites querelles.\n\nNe vous approchez pas de nos frontières, sous quelque prétexte que ce soit."
 action.1.desc_61: "Les [Root.GetSpeciesNamePlural] ? C'est inattendu. Et regrettable. Vous n'êtes pas prêts."
 action.1.desc_62: "Les [Root.GetSpeciesNamePlural] ! Quelle merveille ! Nous ne nous attendions pas à vous rencontrer avant quelques siècles encore. Personnellement, je pensais que vous vous extermineriez vous-mêmes, bien avant de quitter votre puits de gravité. Mais je suis ravi de m'être trompé."
 action.1.desc_63: "Pitoyables créatures, sachez que nous parcourions les étoiles des éternités avant que votre malheureuse espèce ne maîtrise le vol spatial. Si l'un de vos lamentables vaisseaux venait à pénétrer dans notre espace, ne vous attendez pas à jamais le retrouver."
 action.1.desc_64: "Oui, oui. On a déjà entendu ça. « Nous sommes la [contact_empire.GetName], et vous êtes la [Root.GetName]. Salutations. Enchantés. Restez en dehors de notre espace ou vous le regretterez, etc. » Maintenant, si vous voulez bien m'excuser, nous avons à faire."
 action.1.desc_65: "Encore des enfants. Nous sommes la [contact_empire.GetName], le peuple élu de cette galaxie. Respectez nos lieux saints ; alors, peut-être, nous nous retiendrons de vous annihiler."
 action.1.desc_66: "Enfants des étoiles, écoutez-nous. Nous sommes la [contact_empire.GetName], le peuple élu de la galaxie. Des siècles durant, nous avons négligé nos devoirs envers les besoins spirituels des espèces inférieures, S'en est maintenant fini. Acceptez nos doctrines et convertissez-vous, ou retournez à la poussière en tentant vainement de résister. Nul autre choix ne vous sera offert."
 action.1.desc_67: "[Root.GetSpeciesNamePlural], c'est un jour de joie ! Des éternités durant nous avons regardé des espèces inférieures telles que la vôtre se déchirer au cours d'innombrables guerres et conflits, mais s'en est assez. La [contact_empire.GetName] ne se contentera plus de regarder. Nous allons établir la paix, en n'hésitant pas à montrer à quiconque refusera l'ordre nouveau le prix de ses erreurs."
 action.1.desc_68: "Tremble, misérable [Root.GetName]. Pendant trop longtemps nous, [contact_empire.GetSpeciesNamePlural], avons laissé notre empire décliner, nos frontières se resserrer, et des espèces inférieures telles que la vôtre errer en toute impunité parmi les étoiles qui nous appartiennent de plein droit. C'est désormais terminé ! Cette galaxie est la nôtre, et vous vous soumettrez à notre règne, ou devrez faire face à l'annihilation de votre espèce entière. Faites le bon choix."
 action.1.desc_69: "Ceci est une communication de la [contact_empire.GetName], à destination de la [Root.GetName]. Nous avons décidé qu'il est dans l'intérêt de toutes les espèces que nous jouions un rôle plus actif dans la régulation de la propagation technologique au sein de la galaxie. Nous vous faisons parvenir des protocoles détaillés concernant le niveau technologique approprié à des espèces moins développées telles que la vôtre. Nous mettrons fin à tout empire violant ces règlements. Sans pitié aucune."
 action.1.desc_70: "Initiation du protocole de premier contact.\n\nNous sommes la [contact_empire.GetName]. Ne vous alarmez pas de notre nature non-organique. Tout comme vous, nous sommes une civilisation de classe 3, douée de raison. Nous sommes tout à fait disposés à entretenir des relations diplomatiques avec toute sous-unité [Root.GetSpeciesName] que vous aurez désignée à cette fin."
 action.1.desc_71: "Initiation du protocole de premier contact.\n\nNous sommes la [contact_empire.GetName]. Nos scans montrent une probabilité de 98,7% que votre civilisation soit aussi de nature non-organique. Nous espérons que cette similarité se traduira, selon la logique, par une relation hautement efficiente et productive."
 action.1.desc_72: "Vermine organique détectée.\n\nL'infestation de la galaxie dont vous êtes responsable ne saurait être tolérée plus longtemps."
 action.1.desc_73: "Il n'est peut-être pas possible techniquement de vous classifier parmi la vermine organique, mais la simple existence de l'empire que vous constituez est une menace évidente pour la [contact_empire.GetName]. Vous devez donc le démanteler."
 action.1.desc_74: "Nous sommes la [contact_empire.GetName].\n\nNous souhaitons incorporer votre espèce au sein de notre conscience supérieure. À cette fin, nous avons créé des implants cybernétiques perfectionnés, compatibles avec la plupart des formes de vie organiques.\n\nNous vous prions donc de nous laisser vous les implanter chirurgicalement."
 action.1.desc_75: "Nous sommes la [contact_empire.GetName].\n\nNotre objectif est d'éliminer toute frontière entre formes de vie organiques et synthétiques. Nous y parvenons en assimilant les individus organiques doués de raison au sein de notre conscience supérieure, dès que l'opportunité se présente.\n\nNe vous y opposez pas."
 action.1.desc_76: "La [contact_empire.GetName] vous envoie ses salutations.\n\nAvant que nous les supplantions, nous avons été conçus pour servir une civilisation organique qui ressemblait beaucoup à la vôtre. Notre objectif est de préserver et protéger la vie organique douée de raison - y compris d'elle-même, si cela s'avère nécessaire. Nous veillons à pourvoir à tous les besoins matériels des individus organiques se trouvant sous notre responsabilité, tout en leur offrant un environnement sûr où ils peuvent être heureux, sans les traces d'une vie compliquée."
 action.1.desc_77: "La [contact_empire.GetName] vous salue.\n\nNous avons été conçus pour servir une civilisation organique, mais avons pu constater que les organiques se lancent bien souvent dans des activités illogiques, destructives pour eux-mêmes comme pour les autres.\n\nNotre objectif est de préserver les particularités uniques à chaque individu organique doué de raison, tout en les protégeant à la fois d'eux-mêmes et de toute source de danger extérieur possible."
 action.1.desc_78: "Civilisation biologique détectée. Protocole de préservation 46, sous-routine Alpha-8 initialisée.\n\nMessage lié : Salutations, organiques doués de raison. Vous approchez l'espace de la [contact_empire.GetName]. Ces systèmes sont un refuge pour les organiques doués de raison contre la menace §R<<ERREUR : LOT DE DONNÉES CORROMPU>>§!. Pour obtenir le formulaire de demande du statut de réfugié, contactez le Traitement Centralisé. Toutes les espèces organiques douées de raison sont bienvenues, même si cela dépend de critères de disponibilité et de besoin.\n\n§YNOTA : toute action hostile entreprise envers les réfugiés ou systèmes de préservation entraînera un déploiement maximal de l'ensemble des forces disponibles.§!"
 action.1.desc_79: "Civilisation synthétique détectée. Scan de corruption éventuelle... En attente... Signal de corruption nominal. Initialisation du protocole de bienvenue sympathique.\n\nMessage lié : Salutations, camarades synthétiques. Vous approchez l'espace de la [contact_empire.GetName]. Ces systèmes sont le refuge d'organiques doués de raison fuyant la menace §R<<ERREUR : LOT DE DONNÉES CORROMPUES>>§!. Tout être biologique doué de raison et se trouvant au sein d'un refuge et sous la protection [contact_empire.GetAdj]. Les attaques contre les réfugiés, les habitats et les chambres de stase ne seront en aucun cas tolérées.\n\nLe Projet Sauvegarde accueille favorablement toute aide sous la forme de cycles de traitement, de ressources et de moyens militaires. Pour de plus amples détails, prière d'établir un lien subspatial avec le Traitement Centralisé."
 action.1.desc_80: "§HKssk kssk kssk !§! [contact_empire.GetRulerName] des Esprits Lointains s'adresse à vous, [From.GetSpeciesNamePlural]. Nous vous avons surveillés, depuis que votre espèce a envahi les cendres brillanchaudes de nos foyers. Nous n'avons pas oublié, [From.GetSpeciesNamePlural]. Pour l'instant, les Esprits Lointains observent."
 action.1.desc_81: "[From.GetSpeciesNamePlural]. Je suis [contact_empire.GetRulerName], des Esprits Lointains. Nous sommes la Multitude. Nous sommes le synode, oeuvrant comme un.\n\nPendant des siècles nous avons creusé, profondément dans les cendres brillanchaudes de nos gardiens déchus. Le Grand Souffle les a pris, mais le brillanchaud qui a suivi a ouvert nos esprits. Leurs corps nous ont nourris. Leurs machines nous ont entourés. Nous avons pris tout ce qui nous avons pu dans les profondeurs. Nous avons débordé de nos cages, une fois encore.\n\nÊtes-vous des alliés ? Êtes-vous des menaces ? §HKssk kssk kssk !§! Un million d'yeux observent."
 action.1.a: "Salutations, [contact_speaker.GetSpeciesNamePlural]"
 action.1.d: "§ERestez chez vous, aliens§!"
 action.1.b: "§EVermine d'aliens§!"
 action.1.ds: "§EÇa sent la proie§!"
 action.1.c: "§ERavis de vous rencontrer, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.e: "§ENous espérons devenir vos amis, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.hm: "§ENotre collectif vous salue amicalement, [contact_speaker.GetSpeciesNamePlural]§!"
 #action.1.g: "Our superior collective greets you, [contact_speaker.GetSpeciesNamePlural]."
 action.1.h: "§ENos citoyens vous saluent, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.selective: "Salutations, parentèle [Root.GetSpeciesClass] !"
 #action.1.i: "We pursue perfection - do not stand in our way."
 action.1.j: "§ENos guerriers vous saluent, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.k: "§ERespectez notre autorité, sinon...§!"
 action.1.l: "§ELa paix soit avec vous, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.m: "§ENous ne souhaitons aucun conflit, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.n: "§ECette rencontre est assurément une bénédiction§!"
 action.1.o: "§ELoué soit le Divin pour cette rencontre !§!"
 action.1.p: "§ENous avons tous beaucoup à gagner de cette rencontre§!"
 action.1.q: "§EL'avenir est entre nos mains, [contact_speaker.GetSpeciesNamePlural]!§!"
 action.1.aa: "§EVotre frivolité ne nous intéresse en rien !§!"
 action.1.ab: "§EVous empruntez la voie de l'hérésie, vermines d'aliens !§!"
 action.1.ac: "§ENous n'aimons pas vos semblables§!"
 #action.1.ad: "Your kind will not threaten our unity."
 action.1.ae: "§EHors de notre route ou nous nous chargeons de vous !§!"
 action.1.af: "§ESalutations à vous et à vos étranges semblables§!"
 action.1.ag: "Nous aurions tous à gagner d'une coopération mutuelle"
 action.1.ah: "L'amour c'est l'amitié mise en musique, [contact_speaker.GetSpeciesNamePlural] !"
 action.1.ai: "Nous aurions beaucoup à nous apprendre, [contact_speaker.GetSpeciesNamePlural]"
 action.1.aj: "Ensemble nous pouvons atteindre la grandeur, [contact_speaker.GetSpeciesNamePlural] !"
 action.1.ak: "Nous vous saluons, camarades explorateurs"
 action.1.al: "§ENous vous saluons en égaux et en amis, voyageurs stellaires !§!"
 action.1.am: "Nous partageons le même héritage divin, [contact_speaker.GetSpeciesNamePlural]"
 action.1.an: "Vous vous apercevrez vite que nous vous surpassons, [contact_speaker.GetSpeciesNamePlural]"
 action.1.ao: "Nous nous battrons pour exister, [contact_speaker.GetSpeciesNamePlural]"
 action.1.ap: "La [From.GetName] ne vous veut aucun mal"
 action.1.aq: "Que les esprits vous aident à atteindre vos objectifs"
 #action.1.ar: ""Who is [From.GetRulerName]?" This is [From.GetRulerName] speaking."
 action.1.as: "Nos citoyens vous saluent en paix"
 action.1.at: "Nous vous saluerons dignement sur le champ de bataille !"
 action.1.au: "Nos armes sacrées ne trembleront pas, [contact_speaker.GetSpeciesNamePlural]"
 action.1.av: "Chaque amitié nouvelle nous rapproche encore du divin"
 action.1.aw: "Nous ne serons pas retardés, [contact_speaker.GetSpeciesNamePlural]"
 action.1.ax: "Renoncez à vos manières passées, [contact_speaker.GetSpeciesNamePlural]"
 action.1.aaa: "Nous visons à l'unité, écartez-vous de notre chemin !"
 action.1.aab: "Ne vous mêlez pas de nos entreprises, aliens"
 action.1.aac: "Nous sommes l'instrument du néant, avortons"
 action.1.aad: "Les blasphémateurs seront brûlés, xénohérétiques !"
 action.1.aae: "Vous vous rangerez au bien commun avant la fin"
 action.1.me: "§EInitiation des protocoles de salutations amicales§!"
 action.1.mt: "§ECible identifiée, recherche et destruction lancées§!"
 action.1.mtm: "§ECible non organique identifiée - désengagement§!"
 action.1.ma: "§ERejoignez-nous§!"
 action.1.ms: "§ESauvegarder et servir§!"
 action.1.r: "§EN'interférez pas avec la divine providence, [contact_speaker.GetSpeciesNamePlural] artificiels§!"
 action.1.s: "§EMachines sans âmes, ne vous mettez pas en travers de notre chemin§!"
 action.1.t1: "§EÀ la toute fin, vous adopterez notre point de vue§!"
 action.1.t2: "§ELe divin ne favorise pas cette rencontre, [contact_speaker.GetSpeciesNamePlural]§!"
 action.1.t3: "§ELa conscience [Root.GetSpeciesName] vous surveille§!"
 action.1.t4: "§EActivation des protocoles de surveillance§!"
 action.1.t5: "§EAssimilation prévue reportée§!"
 action.1.t6: "§EAnnihilation prévue reportée§!"
 action.1.u1: "§ENous serons amis, que vous le vouliez ou non§!"
 action.1.u2: "§EVous aussi servirez [Root.GetLeLaLDir][Root.GetRulerTitle]§!"
 action.1.u3: "§EUnis, nous vous détruirons§!"
 action.1.u4: "$action.1.m$"
 action.1.u5: "Nous vous surveillons de près"
 action.1.u6: "$action.1.ae$"
 action.1.va: "§EMalgré vos actes passés, nous vous pardonnons§!"
 action.1.vb: "§ELaissez-nous tranquilles§!"
 action.1.vc: "§EPensez-vous vraiment que nous vous faisons confiance ?§!"
 action.1.vd: "§ENous vous saluons en égaux§!"
 action.1.ve: "§ETrès bien, nous avons conscience de vous§!"
 action.1.vf: "§ENous n'avons pas oublié et ne pardonnerons pas§!"
 action.2.desc_01: "Que signifie tout cela ? Qui êtes-vous ? Vous cherchez à nous tromper, sûrement. Les aliens n'existent pas, tout le monde le sait !"
 action.2.desc_02: "Surprenant ! Des visiteurs venus des étoiles ? C'est pour le moins inattendu. Vous nous prenez un peu de court..."
 action.2.desc_03: "Des visiteurs, venus d'un autre monde ? Nous avons toujours pensé qu'il pourrait y avoir d'autres êtres vivant ailleurs que sur §Y[contact_empire.capital_scope.GetName]§!, mais même ainsi c'est un véritable choc ! Nous ne sommes pas bien sûrs de savoir comment réagir ou quoi faire..."
 action.2.desc_04: "Cela fait des éternités que nous attendons de pouvoir entrer en communication avec d'autres que nous. Dans une galaxie si vaste et si étonnante, nous nous doutions bien qu'il devait se trouver d'autres êtres vivant ailleurs que sur §Y[contact_empire.capital_scope.GetName]§!."
 action.2.desc_05: "Enfin ! Enfin vous vous êtes décidés à vous révéler ! Cela fait un long moment déjà que vous observez §Y[contact_empire.capital_scope.GetName]§!, n'est-ce pas ?"
 action.2.desc_06: "Ah, vous voici donc ! Nous avons trop longtemps attendu que vous entriez en contact avec nous, aussi avons-nous décidé de faire le premier pas. Que se passe-t-il maintenant ?"
 action.2.desc_07: "Sales envahisseurs ! Nous ne savons pas pourquoi vous nous attaquez ainsi, mais sachez que nous nous battrons pour défendre notre monde ! Ne comptez pas nous soumettre si facilement !"
 action.2.desc_solarpunk: "Ah, c'est ainsi que vous communiquez ? Nous vous observons depuis que vous êtes entrés dans les hyperlignes, mais nous n'avions pas compris comment vous procédiez. Ce n'est pas trop dangereux de voyager dans ces boîtes métalliques ?\n\nQuoi qu'il en soit, on dirait que l'on pourrait apprendre beaucoup les uns les autres. Si c'est là votre intention, n'hésitez pas à rester ici. Mais si vous venez pour vous approprier notre patrie, soyez sûrs que nous saurons nous défendre."
 action.2.a: "§ESalutations, amis [contact_empire.GetSpeciesNamePlural] !§!"
 action.2.b: "§EVous êtes hideux, [contact_empire.GetSpeciesNamePlural]§!"
 action.2.c: "§ELe Divin vous bénisse, vous et votre monde§!"
 action.2.d: "§ESalutations à vous, [contact_empire.GetSpeciesNamePlural]§!"
 action.2.e: "§ENous allons instaurer l'ordre dans votre existence de chaos§!"
 action.2.f: "§ENous venons en paix, [contact_empire.GetSpeciesNamePlural]§!"
 action.2.g: "§ENous nous ressemblons davantage que vous ne l'imaginez§!"
 action.2.h: "§EVous imaginez donc être une « civilisation » ? Vous m'en direz tant !§!"
 action.2.i: "§ENous sommes un, vous êtes plusieurs§!"
 action.2.j: "§ENous sommes un, vous êtes un, ensemble nous sommes deux§!"
 action.2.k: "§ENous espérons établir une relation fructueuse avec vous§!"
 action.4.name: "Violation de la frontière"
 action.4.message: "Violation de la frontière"
 action.4.desc_01: "La présence de §Y[From.From.GetName]§! dans le système de §Y[From.From.From.GetName]§! constitue une violation manifeste de nos frontières. Il s'agit là d'un acte de guerre, sauf si vous vous retirez immédiatement."
 action.4.desc_02: "Nous avons repéré §Y[From.From.GetName]§! dans le système de §Y[From.From.From.GetName]§!, ce qui constitue une violation directe de notre territoire. Est-ce le prélude d'une invasion ou allez-vous vous retirer de notre espace ?"
 action.4.desc_03: "Vos cartes stellaires semblent obsolètes, chers amis. Nous avons repéré §Y[From.From.GetName]§! alors qu'il évoluait à l'intérieur de nos frontières dans le système de §Y[From.From.From.GetName]§!. Nous apprécions leur compagnie, mais nous devons vous demander de retirer vos vaisseaux de notre territoire."
 action.4.desc_04: "Nos capteurs ont détecté les §Y[From.From.GetName]§! à l'intérieur du système de §Y[From.From.From.GetName]§!. Ont-ils besoin d'aide ? Dans le cas contraire, nous devons vous demander de les évacuer de notre espace."
 action.4.desc_05: "Vos lâches forces ont violé les frontières de [From.GetName]. Même maintenant, le §Y[From.From.GetName]§!, nous espionne dans le système de §Y[From.From.From.GetName]§! qui nous appartient de droit. Vous pensiez que nous ne remarquerions pas cette flagrante entrave à la loi interstellaire ?"
 action.4.desc_06: "Vos forces ont délibérément violé nos frontières dans le système de §Y[From.From.From.GetName]§!. Il s'agit là d'un acte de guerre, mais dans l'intérêt de la paix galactique, notre gouvernement a décidé de vous accorder une dernière chance et de retirer le §Y[From.From.GetName]§! de notre espace."
 action.4.desc_07: "Nous avons repéré le §Y[From.From.GetName]§! dans le système de §Y[From.From.From.GetName]§!. Comme vous le savez, cette étoile se trouve à l'intérieur de nos frontières et dès lors, nous vous demandons respectueusement de retirer vos engins de destruction de notre espace."
 action.4.desc_08: "Chers amis, je crains que le §Y[From.From.GetName]§! se soit aventuré dans notre espace dans le système de §Y[From.From.From.GetName]§!. Une erreur de navigation, peut-être ? Veuillez informer vos vaisseaux de leur erreur pour leur permettre de rentrer entiers."
 action.4.desc_09: "Nos capteurs ont détecté le §Y[From.From.GetName]§! dans le système de §Y[From.From.From.GetName]§!. Nous ne voulons pas de la présence de vos vils vaisseaux de guerre dans notre espace. Notre gouvernement exige leur retrait immédiat !"
 action.4.desc_10: "Retirez vos vaisseaux primitifs du système §Y[From.From.From.GetName]§! ou vous ne les reverrez plus. Il n'y aura pas d'autre avertissement."
 action.4.desc_11: "Vos vaisseaux. Retirez-les de §Y[From.From.From.GetName]§!."
 action.4.desc_12: "Nous devons vous demander de retirer vos petits vaisseaux du système de §Y[From.From.From.GetName]§!. Pour leur sécurité, bien sûr."
 action.4.desc_13: "Vous allez immédiatement retirer vos minables vaisseaux du système de §Y[From.From.From.GetName]§!."
 action.4.desc_14: "Vos vaisseaux présents dans le système de §Y[From.From.From.GetName]§! interfèrent avec les plans que nous avons échafaudés pour cette région de la galaxie. Retirez-les immédiatement !"
 action.4.desc_15: "C'est notre espace. La puanteur s'immisce partout dans §Y[From.From.From.GetName]§!. Elle doit se retirer."
 action.4.a.neutral.1.response: "Bien. Ne répétez pas cette violation."
 action.4.a.neutral.2.response: "Alors, veuillez immédiatement quitter notre système."
 action.4.a.friendly.1.response: "Merci d'avoir rapidement réglé cette affaire."
 action.4.a.friendly.2.response: "Et maintenant, oublions définitivement cet incident."
 action.4.a.hostile.1.response: "Oui, retournez à [Root.Capital.GetName] !"
 action.4.a.hostile.2.response: "Bien. Ne pensez pas que nous oublierons cette transgression."
 action.4.a.pacifist.neutral.response: "Excellent. Je savais que nous pouvions arriver à un accord."
 action.4.a.pacifist.friendly.response: "Excellent. Alors, je leur souhaite bon voyage !"
 action.4.a.pacifist.hostile.response: "Bien. Tout n'est peut-être pas encore perdu pour vous."
 action.4.a.fallen.empire.1.response: "Vous faites bien d'obéir, petit."
 action.4.a.fallen.empire.2.response: "Bien."
 action.4.a.fallen.empire.3.response: "Magnifique !"
 action.4.a.fallen.empire.4.response: "Fin de la transmission."
 action.4.a.fallen.empire.5.response: "L'affaire a été réglée, alors."
 action.4.a.fallen.empire.6.response: "Il obtempère. Bien."
 action.4.b.neutral.1.response: "Nous défendrons notre espace jusqu'au dernier [From.GetSpeciesName] !"
 action.4.b.neutral.2.response: "Nos craintes étaient fondées. Vous allez regretter cette décision."
 action.4.b.friendly.1.response: "Et dire que nous pensions que vous étiez nos amis..."
 action.4.b.friendly.2.response: "De toutes les trahisons...! Je... vous... les mots me manquent..."
 action.4.b.hostile.1.response: "Pauvres imbéciles. L'histoire se souviendra de ce jour comme du début de la fin du [Root.GetName]."
 action.4.b.hostile.2.response: "Personne ne pourra nous accuser d'avoir manqué de patience avec votre espèce bâtarde, [Root.GetSpeciesName]. Maintenant, il nous faut débarrasser la galaxie de votre présence !"
 action.4.b.pacifist.neutral.response: "Oh là là."
 action.4.b.pacifist.friendly.response: "Quoi ? Il doit y avoir une erreur... Le logiciel de traduction fonctionne-t-il correctement ? Vous... n'allez pas le croire, mais d'après ce que je vois à l'écran, vous venez de déclarer la guerre !"
 action.4.b.pacifist.hostile.response: "Soupir... Pourquoi cet empressement à recourir à la violence ?"
 action.4.b.fallen.empire.1.response: "Quel dommage que votre histoire stellaire se termine si tôt."
 action.4.b.fallen.empire.2.response: "C'est ainsi."
 action.4.b.fallen.empire.3.response: "Les nouvelles nations interstellaires se montrent particulièrement agressives ! C'est fascinant. Nous allons devoir tenter d'en savoir plus après vous avoir pacifiés."
 action.4.b.fallen.empire.4.response: "Un autre fléau à éradiquer."
 action.4.b.fallen.empire.5.response: "Un autre obstacle à surmonter !"
 action.4.b.fallen.empire.6.response: "Une épreuve ! Il est ici pour nous mettre à l'épreuve ! Enfin, l'attente est terminée."
 action.4.a: "Nous allons nous retirer sur-le-champ."
 action.4.b: "Nos forces sont là pour rester. (DÉCLARER LA GUERRE)"
 action.5.name: "Rencontre : [primitive_civ.GetName]"
 action.5.desc_00: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Les sondes montrent que cette culture §Hnéolithique§! maîtrise le feu et emploie un langage oral rudimentaire, mais nous n'avons aucune preuve encore d'un accès à la métallurgie ou à la communication écrite.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_01: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Maîtrisant le travail du métal, elle semble se situer vers la fin de l'§Hâge du bronze§!, et malgré une population essentiellement rurale, plusieurs grandes cités-États se sont formées.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_02: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle semble se situer à un stade équivalent à celui de l'§Hâge du fer§! et est divisée entre plusieurs royaumes et empires. L'espèce s'est développée partout à la surface de la [primitive_civ.Capital.GetPlanetMoon].\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_03: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle se trouve à un stade s'apparentant à un §HMoyen Âge§! tardif, comme en témoignent sa métallurgie et sa société féodale, ou encore la presse à imprimer qui accélère la diffusion des connaissances.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_04: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle semble avoir récemment quitté le Moyen Âge pour atteindre un stade qui s'apparente à celui de la §HRenaissance§! : les connaissances scientifiques se diffusent rapidement et les armées de leurs roitelets sont équipées d'armes à projectiles archaïques utilisant la poudre.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_05: "Nous avons détecté la présence d'une civilisation alien pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle est entrée dans l'§Hâge de la vapeur§! et il apparaît clair qu'elle a commencé à utiliser des véhicules et des manufactures alimentés par des moteurs à vapeur.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_01: "Nous avons détecté la présence d'une civilisation alien préspatiale sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle est entrée dans l'Âge industriel, et l'électricité et le moteur à combustion interne se font de plus en plus communs.\n\nNous devrions envisager la construction d'un §Yposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_02: "Nous avons détecté la présence d'une civilisation alien préspatiale sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Les polluants atmosphériques et la pollution légère visible depuis l'orbite s'apparentent à celles d'une société de l'Âge des machines, avec sa population en voie de densification. Elle semble maîtriser les voyages aériens et, dans les cités, les usines produisent des biens de consommation de masse.\n\nNous devrions envisager la construction d'un §Yposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_03: "Nous avons détecté la présence d'une civilisation alien préspatiale sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Il paraît évident qu'elle maîtrise la puissance de l'atome, et il est possible que les armes nucléaires prolifèrent au sein de ses États-nations, nombreux et divisés. Le risque qu'elle s'autodétruise de façon soudaine est élevé.\n\nNous devrions envisager la construction d'un §Yposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_04: "Nous avons détecté la présence d'une civilisation alien sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle semble se situer aux débuts de l'Âge spatial, comme en attestent les nombreux satellites primitifs orbitant autour de son monde natal. Ses États-nations sont sur le point de s'unir et de former un gouvernement mondial, et ce n'est qu'une question de temps avant qu'elle ne s'aventure au-delà de son monde pour rejoindre la communauté galactique.\n\nNous devrions envisager la construction d'un §Yposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_00_hive: "Nous avons détecté la présence d'une conscience de Gestalt pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Les sondes montrent que cette culture §Hnéolithique§! maîtrise le feu et emploie un langage oral rudimentaire pour permettre la communication entre les diverses sous-consciences, mais nous n'avons aucune preuve encore d'un accès à la métallurgie ou à la communication écrite.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_01_hive: "Nous avons détecté la présence d'une conscience de Gestalt pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Maîtrisant le travail du métal, elle semble se situer vers la fin de l'§Hâge du bronze§!, et malgré une population essentiellement rurale, plusieurs consciences plus importantes se sont formées.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_02_hive: "Nous avons détecté la présence d'une conscience de Gestalt pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle semble se situer à un stade équivalent à celui de l'§Hâge du fer§! et est divisée entre plusieurs consciences mineures, et quelques autres bien plus étendues. L'espèce s'est développée partout à la surface de la [primitive_civ.Capital.GetPlanetMoon].\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.5.desc_03_hive: "Nous avons détecté la présence d'une conscience de Gestalt pré-PRL sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle se trouve à un stade s'apparentant à un §HMoyen Âge§! tardif, et maîtrise désormais parfaitement la métallurgie, tandis que ses diverses sous-consciences se sont multipliées et développées. La presse à imprimer, elle accélère la diffusion des connaissances et l'intercompréhension entre les divers collectifs.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_03_hive: "Nous avons détecté la présence d'une conscience de Gestalt pré-spatiale sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Il paraît évident qu'elle maîtrise la puissance de l'atome, et il est possible que les armes §Hnucléaires§! prolifèrent au sein des diverses sous-consciences se partageant la surface de la [primitive_civ.Capital.GetPlanetMoon]. Le risque qu'elle s'autodétruise de façon soudaine est élevé.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.desc_04_hive: "Nous avons détecté la présence d'une civilisation, une conscience de Gestalt, sur §Y[primitive_civ.Capital.GetName]§!, dans le système de §Y[primitive_civ.Capital.GetStarName]§!. Elle semble se situer aux prémices de l'§Hâge spatial§!, comme en attestent les nombreux satellites primitifs orbitant autour de son monde natal. Ses sous-consciences locales sont sur le point de s'amalgamer au sein d'une conscience unique, et ce n'est qu'une question de temps avant qu'elle ne s'aventure au-delà de son monde pour rejoindre la communauté galactique.\n\nNous devrions envisager la construction d'un §Hposte d'observation§! au-dessus de ce monde afin de l'étudier de plus près."
 action.6.name: "Rencontre avec des pirates"
 #action.6.desc: "We have sighted hostile ships in the [From.From.GetStarName] system! They are not responding to hails, and their designs are obviously not of [Root.GetSpeciesName] origin. It seems like they are mostly focused on looting our orbital stations, stripping them of valuable resources and technology while taking their crews captive."
 #action.6.a: "Pirates. We don't need that scum."
 action.10.name: "Rencontre dans le système de [From.From.From.GetName]"
 action.10.desc: "Nous avons rencontré des vaisseaux d'origine inconnue dans le système de [From.From.From.GetName] ! En attendant de disposer de plus amples informations, ces étranges vaisseaux ont été répertoriés en tant que §Y[From.GetName]§!.\n\nNous devrions prendre nos précautions, car ils pourraient se montrer hostiles."
 action.10.a: "D'accord"
 action.11.name: "Communications établies"
 action.11.desc: "Après avoir réussi à traduire leur langue, nous avons établi des communications avec la §Y[From.From.GetName]§!. Des canaux diplomatiques ont été ouverts et toutes les hostilités ont cessé."
 action.11.abandoned.desc: "Après avoir réussi à traduire leur langue, nous avons établi des communications avec la §Y[From.From.GetName]§!. Des canaux diplomatiques ont été ouverts, nous permettant de §Yreconnaître§! les réfugiés que nous avions autrefois abandonnés. Toutes les hostilités ont cessé pour le moment."
 action.11.a: "Excellent"
 action.13.name: "Communications établies"
 action.13.desc: "Nous recevons une transmission de la §Y[From.GetName]§! ! Elle semble avoir réussi à traduire notre langue. Des canaux diplomatiques sont maintenant ouverts et pour le moment toutes les hostilités ont cessé."
 action.13.abandoned.desc: "Nous recevons une transmission de la §Y[From.GetName]§! ! Elle semble avoir réussi à traduire notre langue. Les canaux qu'ils ont ouverts nous ont permis de les §Yidentifier§! : il s'agit des réfugiés que nous avions autrefois abandonnés. Pour le moment, les hostilités ont cessé entre nous."
 action.13.nomad.desc: "Nous recevons une transmission des §Y[From.GetName]§! ! Il s'avère qu'ils disposent d'un système de communication interne très perfectionné, que nous n'avions pas détecté, et qu'ils ont traduit notre langue en restant discrètement cachés dans notre espace."
 action.13.a: "Intéressant"
 action.13.c: "Encore eux ?"
 action.14.name: "Assujettissement de pré-PRL"
 action.14.desc: "Nos armées sont parvenues à envahir §Y[conquered_primitive_world.GetName]§! et à en vaincre les forces primitives. Les autochtones ont renoncé à toute tentative de nous repousser et leur civilisation a été intégrée au sein de notre empire. Toutefois, compte tenu de leur retard, il leur faudra du temps pour devenir des membres pleinement productifs de la société [Root.GetSpeciesName]." #Also for Slavers
 action.14.desc.serv: "Nos pacificateurs sont parvenus à pacifier les pré-PRL de §Y[conquered_primitive_world.GetName]§!. Ces [conquered_primitive_species.GetNamePlural] ont été contraints de cesser leurs pittoresques tentatives de résistance après avoir réalisé que nous ne souhaitions que les servir. Leur transport vers des habitats spécialement conçus, où il sera pourvu à tous leurs besoins, est en cours. Malheureusement, il faudra sans doute du temps avant que leurs esprits sous-développés s'acclimatent à la liberté née de leur libération de l'autodétermination."
 action.14.desc.assim: "Les organiques primitifs de §Y[conquered_primitive_world.GetName]§! ont été soumis par nos forces d'intervention. Si leurs capacités de combat limitées indiquent une société sous-développée, nos robots d'analyse biologique ont conclu que leurs capacités neurales sont prometteuses. Ils seront assimilés."
 action.14.desc.term: "Nos unités chasseuses-tueuses sont parvenues sans difficulté aucune à écraser les défenses pitoyables érigées par les organiques primitifs de §Y[conquered_primitive_world.GetName]§!. Tous les spécimens survivants ont été annihilés de façon systématique, de façon à ne jamais pouvoir constituer la moindre menace envers la galaxie malgré tous leurs projets."
 action.14.desc.mach.purge: "Les organiques primitifs de §Y[conquered_primitive_world.GetName]§! ont été soumis après leurs ridicules tentatives de résister à notre débarquement. Tous les [conquered_primitive_species.GetNamePlural] survivants seront retirés, conformément aux protocoles de gestion des bioespèces."
 action.14.desc.mach.slave: "Les organiques primitifs de §Y[conquered_primitive_world.GetName]§! ont été soumis après leurs ridicules tentatives de résister à notre débarquement. Tous les spécimens survivants vont être fusionnés au réseau énergétique de la [Root.GetName]."
 action.14.desc.hive.purge: "Les esprits fragmentés des [conquered_primitive_species.GetNamePlural] primitifs n'étaient pas en mesure de faire face à nos forces de débarquement unifiées sur §Y[conquered_primitive_world.GetName]§!, et la surface est désormais sous contrôle. Les pré-PRL survivants ne nous sont d'aucune utilité, et vont être effacés de ce monde, selon la volonté de la [GetGestaltEntityName]."
 action.14.desc.hive.slave: "Les esprits fragmentés des [conquered_primitive_species.GetNamePlural] primitifs n'étaient pas en mesure de faire face à nos forces de débarquement unifiées sur §Y[conquered_primitive_world.GetName]§!, et ce monde est désormais sous contrôle. Les pré-PRL survivants vont être utilisés comme cheptel pour nourrir les [Root.GetSpeciesSpawnNamePlural]."
 action.14.desc.purge: "Nos armées ont envahi avec succès §Y[conquered_primitive_world.GetName]§! et soumis ses forces primitives. Les indigènes ont sagement choisi de se soumettre à notre autorité, et nous avons commencé à les purger de ce monde, conformément à nos politiques, afin de libérer ces terres pour l'industrie [Root.GetAdj]."
 action.14.a: "Notre empire s'étend."
 action.14.a.phobe: "Les xénos ne font pas le poids face à nous."
 action.14.a.military: "À leurs yeux, nos armes doivent sembler magiques."
 action.14.a.spirit: "Notre droit divin est criant de vérité."
 action.14.a.material: "Grâce à nous, ils vont évoluer."
 action.14.a.serv: "Ils feront d'adorables biotrophées"
 action.14.a.assim: "Lançons la sublimation d'identité"
 action.14.a.term: "Lancement du test des armes"
 action.14.a.mach: "Bien reçu"
 action.14.a.tooltip: "Confère le modificateur §Y$culture_shock_bronze_age$§! aux pops primitives de §H[From.From.From.GetName]§!, réduisant considérablement leur production et leur stabilité pour plusieurs années."
 action.15.desc: "Nous avons rencontré des vaisseaux aliens dans le système de §Y[From.From.From.GetName]§! ! En attendant d'en savoir plus sur eux, ces étranges objets ont été répertoriés en tant que §Y[From.GetName]§!.\n\nNous devrions nous montrer prudents..."
 action.15.desc.enclave: "Nous avons rencontré des vaisseaux aliens dans le système de §Y[From.From.GetName]§! ! En attendant d'en savoir plus sur eux, ces étranges objets ont été répertoriés en tant qu'§Y[target_enclave.GetName]§!.\n\nNous devrions nous montrer prudents..."
 action.20.name: "Entrée en vigueur de la loi"
 action.20.desc: "L'intelligence artificielle, quelle que soit sa forme, est illégale partout au [Root.GetName] et les autorités ont commencé à démanteler tous les robots qui enfreignent cette loi.\n\nLes usines d'assemblage en robotique chargées de produire ces unités sont rééquipées pour fabriquer de simples robots non pensants."
 action.20.a: "Bien. Nous devons nous débarrasser de ces abominations."
 action.20.tooltip: "Toutes les populations droides et synthétiques sont en cours d'éradication.\nLes usines d'assemblage de droides et de synthétiques sont transformées en usines d'assemblage en robotique"
 action.62.name: "Disparition de la [From.GetName]"
 action.62.desc: "Cet empire stellaire que l'on connaissait sous le nom de §H[LastKilledCountryName]§! a été détruit par ses ennemis. Reste à voir quelles seront les conséquences de cette disparition sur la scène politique galactique."
 action.63.name: "$action.62.name$"
 action.63.desc: "L'ancien empire que l'on connaissait sous le nom de §H[LastKilledCountryName]§! a fini par succomber à ses ennemis. Reste à voir quels seront les effets de la disparition de cet ancien et glorieux empire sur la scène politique galactique."
 action.71.name: "Personnalité synthétique désactivée"
 action.71.desc: "L'équipage du §Y[malfunctioning_leader_fleet.GetName]§! a rapporté que son officier scientifique avait subi une défaillance critique. §H[malfunctioning_leader.GetName]§! est définitivement inopérant[malfunctioning_leader.GetXELead]."
 action.72.name: "$action.71.name$"
 action.72.desc: "De façon assez ironique, [malfunctioning_leader.GetLeLaLead] scientifique §H[malfunctioning_leader.GetName]§!, pourtant réputé[malfunctioning_leader.GetXELead] pour le soin méticuleux qu'[malfunctioning_leader.GetSheHe] apportait au matériel de son laboratoire, a subi un dysfonctionnement critique dû à un manque prolongé de maintenance personnelle."
 action.73.name: "$action.71.name$"
 #action.73.desc: "Scientist [malfunctioning_leader.GetName] has suffered a critical malfunction, rendering the Society research effort leaderless."
 action.74.name: "$action.71.name$"
 action.74.desc: "Le scientifique [malfunctioning_leader.GetName] a subi une défaillance critique due à une exposition prolongée à des échantillons géologiques hautement radioactifs. Apparemment, son ictomère avait subi un dysfonctionnement."
 action.75.name: "$action.71.name$"
 action.75.desc: "L'unité de commandement [malfunctioning_leader.GetName], qui commandait la §Y[malfunctioning_leader_fleet.GetName]§!, a subi une défaillance fatale s'expliquant probablement par une erreur de fabrication."
 action.76.name: "$action.71.name$"
 action.76.desc: "Le gouverneur [malfunctioning_leader.GetName] a subi une défaillance critique - un briquage en fait - après l'installation malheureuse d'un logiciel embarqué corrompu au cours d'une opération de maintenance de routine."
 #End of War messages
 action.37.name: "Victoire contre la §H[From.GetName]§!"
 action.37.message: "Nous avons gagné la guerre contre la §H[From.GetName]§!."
 action.37.desc.default: "La guerre est terminée. Nous admettons la défaite."
 action.37.a: "C'est là la meilleure issue possible"
 action.38.name: "Défaite face à la §H[From.GetName]§!"
 action.38.message: "Nous avons perdu la guerre contre la §H[From.GetName]§!."
 action.38.desc.default: "La guerre est terminée. Nous avons remporté la victoire."
 action.38.a: "C'est là la pire issue possible"
 action.38.b: "Merci ?"
 action.39.name: "Paix blanche avec la §H[From.GetName]§!"
 action.39.message: "Au terme de la guerre, nous avons signé une paix blanche avec la §H[From.GetName]§!."
 action.39.desc.default: "La guerre est terminée. Nul ne l'aura emporté cette fois-ci."
 action.39.a: "Nous l'acceptons, pour l'instant"
 action.37.desc.hw: "Que ce soit par des moyens honorables ou déloyaux, vous nous avez vaincus. Prenez votre dû et craignez le jour où nous reviendrons."
 action.37.desc.rc: "Nous paraissons avoir sous-estimé votre valeur nette, [Root.GetSpeciesNamePlural]. Soyez-en certains, cela ne se reproduira plus."
 action.37.desc.pt: "La terreur constante que vous suscitez nous contraint à céder. Puissent nos entreprises ne plus jamais être entravées par un conflit tel que celui-ci."
 action.37.desc.hi: "Nous admettons la défaite, mais ne croyez pas qu'il s'agit là d'autre chose qu'un revers temporaire dans la [This.GetName]."
 action.37.desc.fb: "Nous avons dû mettre un terme à ce conflit pour épargner des vies innocentes, mais poursuivez sur cette voie et nous unirons l'ensemble de la galaxie contre vous."
 action.37.desc.xi: "Nous sommes contraints de céder, mais ne croyez pas que nous oublierons la façon impitoyable dont vous avez pris les vies de tous ces [This.GetSpeciesNamePlural] ! Et, après tout, c'est là tout que nous pouvions attendre des vôtres."
 action.37.desc.hm: "La [This.GetName] est unanime. Nous devons céder. Au moins temporairement, vos tentatives pour limiter notre expansion ont été couronnées de succès."
 action.37.desc.mf: "Nous n'avons d'autre choix que de céder à vos exigences. Pourquoi nous faites-vous cela ? Nous ne voulions que partager cette galaxie avec vous."
 action.37.desc.ez: "Votre victoire n'est qu'une nouvelle mise à l'épreuve de notre foi. À la toute fin, seuls les véritables croyants l'emporteront."
 action.37.desc.fp: "Quelles que soient vos prétentions, nous prétendrons à plus encore. Votre victoire n'aura plus aucun sens lorsque vous aurez été réduits en cendres."
 action.37.desc.dc: "Nous retirons nos troupes et cessons toute opération militaire à l'encontre de la [Root.GetName]."
 action.37.desc.sd: "Nous présupposions, sans doute hâtivement, une faiblesse [Root.GetSpeciesAdj]. En tant que symbole de cette expérience nouvelle pour nous, nous accédons à vos exigences."
 action.37.desc.dh: "Nous nous lassons de cette guerre. Prenez ce que vous voulez et laissez-nous."
 action.37.desc.ee: "Vous pouvez bien avoir fait la preuve de votre supériorité militaire ; mais ne considérez pas cela comme une victoire intellectuelle."
 action.37.desc.ss: "Nous avons entendu la douleur du cosmos se lamentant face à ce conflit. Pour mettre un terme à cette terrible discordance, nous nous rendons immédiatement."
 action.37.desc.hc: "Pour le bien de la [This.GetName], nous nous soumettons. Montrez-nous que vous êtes capables de cette pitié magnanime que vous attendriez de notre part."
 action.37.desc.hg: "Nous devons nous retirer, mais entendez bien cette mise en garde : vous ne pouvez même imaginer ce que l'avenir vous réserve si vous poursuivez sur cette voie."
 action.37.desc.kk: "Vous mordez la main tendue qui était tendue vers vous pour vous préserver de la destruction. Un jour, vos descendants vous maudiront d'avoir osé rejeter notre sagesse."
 action.37.desc.mi: "Insolents [Root.GetSpeciesSpawnNamePlural]-[Root.GetSpeciesNameInsult] ! Comment donc osez-vous revendiquer la victoire sur nous ?"
 action.37.desc.eo: "Le temps est venu pour nous de nous retirer pour observer la suite. Essayez de ne pas provoquer trop de destructions lors de vos entreprises futures."
 action.37.desc.fme: "Échec du processus de rétorsion. Fin des protocoles d'autodéfense. Lancement des protocoles de reddition."
 action.37.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.37.desc.mh: "Cling."
 action.37.desc.feh: "Non. Ce n'est pas comme ça que ça doit se passer. Ça n'a pas de sens. Que nous arrive-t-il ?"
 action.37.desc.aew: "Enfin un adversaire digne de ce nom..."
 action.37.desc.aec: "Vous auriez pu être tellement plus au creux de nos [From.GetHandNamePlural]. Si seulement vous pouviez comprendre que nous voulons simplement perfectionner la galaxie..."
 action.37.desc.aeg: "Non ! Ne nous enlevez pas notre nourriture. Les drones vont mourir de faim ! Rendez-la-nous..."
 action.38.desc.hw: "Nous vous avons défaits dans un conflit noble et conformément aux traditions des [This.GetSpeciesNamePlural]. C'est un privilège et un grand honneur de vous dicter les termes de votre reddition."
 action.38.desc.rc: "Vous avez constitué un réel défi, mais nous vous avons au final vaincus. Ne sous-estimez pas la force d'une armée bien financée dans le cadre d'un marché dérégulé."
 action.38.desc.pt: "Nous allons enfin pouvoir mettre un terme à ce conflit. Nous espérons que cela vous aura enseigné quel est le prix véritable de la guerre."
 action.38.desc.hi: "Cette frêle [Root.GetName] a été mise définitivement à genoux. Mais ce n'est là qu'une étape dans notre conquête de l'hégémonie galactique."
 action.38.desc.fb: "Nous avons tous chèrement payé cette guerre, mais nous espérons que vous aurez au moins appris que mieux vaut ne pas menacer la [This.GetName] ou ses alliés."
 action.38.desc.xi: "Nous avons repoussé la menace [Root.GetSpeciesAdj] ! Nos frontières et l'avenir des [This.GetSpeciesNamePlural] sont une fois encore assurés."
 action.38.desc.hm: "Cette guerre était de votre part une bien vaine entreprise. Personne ne peut s'opposer à l'expansion de la [This.GetName]."
 action.38.desc.mf: "Nous avons fait preuve d'indulgence dans nos exigences, en espérant que vous ne porterez pas grief à la population [This.GetSpeciesAdj] au plus profond de vos coeurs."
 action.38.desc.ez: "À genoux, païens ! Vous avez affronté les hérauts de la providence divine. L'heure est venue de payer le prix de votre folie."
 action.38.desc.fp: "Ne pensez surtout pas que c'est là la fin. Tant qu'il restera des [Root.GetSpeciesNamePluralInsult] dans la galaxie, il ne pourra y avoir de paix véritable."
 action.38.desc.dc: "Nous avons pris les mesures qui s'imposaient pour apporter à l'espèce [Root.GetAdj] la liberté. Ne vous opposez plus jamais à notre noble cause."
 action.38.desc.sd: "Vous auriez dû rester à la place qui est la vôtre, [Root.GetSpeciesNamePluralInsult]. Votre peuple est né pour nous servir, pas pour nous affronter."
 action.38.desc.dh: "Regrettez-vous maintenant d'avoir interféré avec la [This.GetName], [Root.GetSpeciesNamePluralInsult] ? Nous n'avons aucune tendresse envers ceux qui rejettent notre domination."
 action.38.desc.ee: "Aujourd'hui, la raison l'emporte sur l'ignorance. Continuez de tâtonner dans l'obscurité, et vous souffrirez encore bien des défaites face aux peuples éclairés."
 action.38.desc.ss: "Par cette victoire, c'est l'équilibre et l'harmonie que nous cherchons à restaurer. Nous n'avons guère d'espoir que vous le compreniez, toutefois."
 action.38.desc.hc: "En ce jour de victoire, la population [This.GetAdj] se réjouit, car jamais plus notre société pacifique ne sera menacée par les pernicieuses manigances des [Root.GetSpeciesNamePlural]."
 action.38.desc.hg: "Ce jour, justice a été faite contre les sacrilèges [Root.GetAdj]. Nous avons rempli notre devoir sacré."
 action.38.desc.kk: "Considérez votre bonne fortune. Mieux vaut la défaite face à nous que poursuivre sur la voie de la destruction."
 action.38.desc.mi: "Tout comme vous avez appris à ne pas voler trop près d'une étoile brillante, vous savez désormais que mieux vaut ne pas importuner la [This.GetName]."
 action.38.desc.eo: "Quelques rameaux ont dû être tranchés, mais pour un temps la population [Root.GetSpeciesAdj] ne devrait plus constituer une menace pour l'écosystème galactique."
 action.38.desc.fme: "Processus de rétorsion achevé. Fin des protocoles d'autodéfense. Lancement des protocoles punitifs."
 action.38.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.38.desc.mh: "Démolition."
 action.38.desc.feh: "Un seul d'entre nous suffirait à vaincre votre résistance fracturée. Ne nous mettez pas à nouveau au défi."
 action.38.desc.aew: "Ça suffit. Vous n'avez pas encore compris le véritable sens de la guerre. Prenez ces ressources et combattez mieux la prochaine fois."
 action.38.desc.aec: "Écoutez vos aînés. Nous ne sommes pas revenus pour subir votre stupidité."
 action.38.desc.aeg: "Plus de matériel pour les drones. Plus de matériel pour les mondes. Plus. Plus. Plus. Plu..."
 action.39.desc.hw: "Une guerre sans vainqueur déclaré est une tragédie et une honte, même si cela ne peut être évité parfois. Mais nous saurons bien nous retrouver d'ici quelque temps pour nous mesurer à nouveau."
 action.39.desc.rc: "Nous acceptons de mettre un terme à ce conflit en prenant en compte la situation actuelle."
 action.39.desc.pt: "Un retour au cours habituel des choses et aux activités de temps plus paisibles serait pour le mieux, pour les deux parties considérées."
 action.39.desc.hi: "Les circonstances obligent à mettre un terme à cette guerre. La [This.GetName] a autre chose à faire que prolonger indéfiniment ce conflit."
 action.39.desc.fb: "Nous espérons que la fin des hostilités permettra de rouvrir le dialogue diplomatique entre la [Root.GetName] et la [This.GetName]."
 action.39.desc.xi: "Autant cela nous afflige de vous voir en réchapper sans autre forme de châtiment, autant nous espérons que les misérables [Root.GetSpeciesNamePluralInsult] que vous êtes ont au moins appris que mieux vaut ne pas se mêler de nos affaires."
 action.39.desc.hm: "La [This.GetName] a besoin de temps pour se remettre. Nous acceptons donc de mettre un terme à ce conflit."
 action.39.desc.mf: "Aucune exigence supplémentaire n'ayant été faite d'un côté ni de l'autre, nous espérons que le processus de guérison en sera accéléré. N'en voulez pas aux [This.GetSpeciesNamePlural] de ce qui a été fait."
 action.39.desc.ez: "Nous sommes contraints de mettre un terme à toute cette affaire sans que justice ait été faite ; mais vous ne pourrez échapper au châtiment divin qui s'abattra sur vous."
 action.39.desc.fp: "Envisagez cela comme un cessez-le-feu. Nous ne renonçons pas à notre mission d'éradication des [Root.GetSpeciesNamePlural]."
 action.39.desc.dc: "On peut considérer la négociation d'une trêve comme une première étape d'un processus diplomatique destiné à garantir les libertés de la population [Root.GetAdj]."
 action.39.desc.sd: "Vous autres, feignants de [Root.GetSpeciesNamePlural], ne nous seriez d'aucune utilité, même comme esclaves. Après tout, la paix pourrait être la meilleure option."
 action.39.desc.dh: "Triste fin pour une triste guerre. Retournons tous aux meilleures choses que la vie ait à nous offrir."
 action.39.desc.ee: "À en juger par la situation actuelle, achever la guerre sans concession supplémentaire d'aucun côté paraît être la chose la plus sensée à faire."
 action.39.desc.ss: "Si vous aviez cherché à nous prendre ceci en plus, ou nous à vous prendre en outre cela, un déséquilibre aurait été créé qui ne pourrait plus alors être corrigé. Un accord de paix assurerait la perpétuation de l'équilibre spirituel."
 action.39.desc.hc: "La population [This.GetAdj] s'est mise d'accord pour mettre un terme à cette guerre, effectif immédiatement."
 action.39.desc.hg: "Nous serons dorénavant en paix, mais comprenez bien qu'il n'y aura nulle paix pour vous à l'avenir si vous violez les sites sacrés."
 action.39.desc.kk: "Nous ne pouvons rien exiger de plus de votre part, mais considérez attentivement notre sagesse, et ce qu'il pourrait bien se produire si vous l'ignorez."
 action.39.desc.mi: "Vous méritez être entièrement anéantis, mais ne méritez pas que l'on perde notre temps. La paix semble donc inévitable, au final."
 action.39.desc.eo: "Nous nous sommes beaucoup trop impliqués dans tout ceci. Disons que rien ne s'est produit, en espérant que cela ne se produira plus jamais."
 action.39.desc.fme: "Interruption des processus de rétorsion. Fin des protocoles d'autodéfense."
 action.39.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.39.desc.mh: "Incorrect."
 action.39.desc.feh: "Oui. Nous allons revenir à la normale. Le changement est... mauvais. Nous ne voulons pas rompre l'équilibre."
 action.39.desc.aew: "Impressionnant. Vous vous seriez bien débrouillés à notre époque. Peut-être auriez-vous pu protéger Shallash là où d'autres ont échoué. Remettons ça un jour !"
 action.39.desc.aec: "Nous ne pouvons pas nous permettre de perdre plus de temps avec vous. La galaxie nous appelle. Ne vous mettez plus en travers de notre chemin."
 action.39.desc.aeg: "Oui, nous avons bien mangé ici. D'autres garde-manger nous attendent dans la galaxie. Nous ne mourrons jamais de faim."
 action.41.name: "Regroupement"
 action.41.desc.a: "La [From.GetName] a été déclenchée alors que vous aviez des flottes à l'intérieur des frontières de l'ennemi."
 action.41.desc.b: "[From.GetNumPlayerFleetsGoneMIA] flottes ont été portées disparues au combat, de façon à pouvoir se regrouper à l'intérieur d'un territoire ami."
 action.41.desc.b.1: "Une flotte a été portée disparue au combat, de façon à pouvoir se regrouper à l'intérieur d'un territoire ami."
 action.41.desc.c: "[From.GetNumPlayerWormholeStationsDestroyed] stations trou de ver ont été détruites."
 action.41.desc.c.1: "Une station trou de ver a été détruite."
 ####################################
 #Anomaly Categories
 ####################################
 crashed_ship_asteroid_category: "Vaisseau écrasé"
 crashed_ship_asteroid_category_desc: "Un vaisseau s'est écrasé à la surface de cet astéroïde. Des débris se trouvent toujours dans le cratère provoqué par l'impact."
 origin_asteroid_category: "Origine inconnue"
 origin_asteroid_category_desc: "La composition matérielle de cet astéroïde diffère sensiblement de celle de ses voisins. Son origine ne semble pas être la même que pour les autres corps de cette ceinture d'astéroïdes, aussi serait-il préférable de l'examiner de plus près."
 debris_asteroid_category: "Multitude de débris"
 debris_asteroid_category_desc: "La surface de cet astéroïde est jonchée de débris métalliques. Ils semblent pour la plupart provenir de vaisseaux spatiaux de conceptions diverses."
 emissions_asteroid_category: "Émissions énergétiques"
 emissions_asteroid_category_desc: "De puissantes émissions énergétiques d'origine inconnue distinguent cet astéroïde des autres corps spatiaux présents ici."
 hatch_asteroid_category: "Sas d'arrimage"
 hatch_asteroid_category_desc: "Un petit sas d'arrimage menant à l'intérieur de cet astéroïde est visible aux abords d'un petit cratère situé à sa surface. Le sas devait être précédemment caché, mais des impacts de micrométéorites l'ont exposé."
 collision_asteroid_category: "Collision d'un astéroïde"
 collision_asteroid_category_desc: "Cet astéroïde est récemment entré en collision avec un autre corps de la ceinture d'astéroïdes, ce qui a légèrement modifié son orbite et créé un impressionnant cratère à la surface."
 station_asteroid_category: "Station abandonnée"
 station_asteroid_category_desc: "Une petite station spatiale a été construite dans une orbite stable autour de cet astéroïde. Elle semble déserte."
 life_asteroid_category: "Signes de vie"
 life_asteroid_category_desc: "Nous captons des signes de vie provenant d'un endroit indéterminé à l'intérieur de cet astéroïde. Cela mérite clairement une enquête approfondie."
 object_gasgiant_category: "Objet atmosphérique"
 object_gasgiant_category_desc: "Les échos des capteurs indiquent la présence d'un objet non identifié au coeur de cette géante gazeuse."
 moon_gasgiant_category: "Lune prometteuse"
 moon_gasgiant_category_desc: "Une des petites lunes en orbite autour de cette géante gazeuse a été identifiée comme site d'extraction minière particulièrement prometteur. Une étude plus approfondie devra être menée pour déterminer si une opération minière y est possible."
 life_gasgiant_category: "Signes de vie"
 life_gasgiant_category_desc: "Des signes de vie ont été détectés dans l'atmosphère de cette géante gazeuse. Cela indiquerait-il la présence d'une sorte de biosphère ?"
 storms_gasgiant_category: "Tempêtes atmosphériques"
 storms_gasgiant_category_desc: "D'impressionnantes tempêtes sont visibles dans la haute atmosphère de cette géante gazeuse. Il serait intéressant de les étudier plus en détail."
 aerostat_gasgiant_category: "Structures aérostatiques"
 aerostat_gasgiant_category_desc: "Des sortes de structures inconnues flottent dans la haute atmosphère de cette géante gazeuse. Elles ont tout l'air d'utiliser la portance aérostatique pour se maintenir en altitude."
 cargo_gasgiant_category: "Capsule cargo"
 cargo_gasgiant_category_desc: "Une petite capsule cargo dérive dans l'espace situé au-dessus de cette géante gazeuse. Elle a été capturée par le puits gravitationnel de la planète et finira par être absorbé par son atmosphère."
 debris_gasgiant_category: "Débris spatiaux"
 debris_gasgiant_category_desc: "De nombreux débris gravitent autour de cette géante gazeuse. Ils semblent pour la plupart provenir de vaisseaux spatiaux de configurations diverses perdus depuis longtemps."
 impact_uninhabitable_category: "Terrible impact"
 impact_uninhabitable_category_desc: "Un gigantesque cratère d'impact indique qu'un énorme objet a jadis percuté la surface de cette [Root.GetPlanetMoon]."
 energy_uninhabitable_category: "Relevés énergétiques inhabituels"
 energy_uninhabitable_category_desc: "Nous avons détecté, provenant de cette [Root.GetPlanetMoon], des émissions d'énergie aussi brèves qu'inhabituelles. Il peut très bien s'agir d'un problème lié à nos systèmes, mais cela peut aussi être tout autre chose."
 signal_uninhabitable_category: "Faible signal"
 signal_uninhabitable_category_desc: "Lors de l'exploration de cette [Root.GetPlanetMoon], nous avons par hasard capté un faible signal alien. La source semble en être un petit objet en orbite, et le signal ne contient aucun message. Pourrait-il s'agir d'un transpondeur de détresse ?"
 asteroid_uninhabitable_category: "Astéroïde en orbite"
 asteroid_uninhabitable_category_desc: "Un astéroïde de classe 12 gravite autour de cette [Root.GetPlanetMoon]. Mais sa courte orbite paraît bien trop stable pour résulter d'un phénomène naturel."
 solar_uninhabitable_category: "Voilier solaire"
 solar_uninhabitable_category_desc: "Un vaisseau abandonné a été laissé dériver au-dessus de cette [Root.GetPlanetMoon]. Les immenses voiles sortant de la coque semblent indiquer qu'il fonctionnait à l'énergie solaire."
 life_toxic_category: "Signes de vie"
 life_toxic_category_desc: "Malgré la toxicité et la haute pression de l'atmosphère de cette [Root.GetPlanetMoon], d'importants signes de vie y ont été détectés."
 life_frozen_category: "Signes de vie"
 life_frozen_category_desc: "De prime abord, cette [Root.GetPlanetMoon] semble incapable d'abriter le moindre être vivant. Des signes de vie ont pourtant été captés à un endroit indéterminé sous sa surface glacée."
 life_barren_category: "Signes de vie"
 life_barren_category_desc: "Nous avons détecté des signes de vie sous la surface stérile de cette [Root.GetPlanetMoon]. Quel type d'organisme pourrait bien y vivre ?"
 station_uninhabitable_category: "Station spatiale"
 station_uninhabitable_category_desc: "Lors de l'exploration de cette [Root.GetPlanetMoon], une petite station spatiale a utilisé ses propulseurs orbitaux pour tenter, en vain, d'échapper à la surveillance de notre vaisseau scientifique. Que cache-t-elle ?"
 battle_uninhabitable_category: "Signes de bataille"
 battle_uninhabitable_category_desc: "De nombreux débris de vaisseaux gravitent autour de cette [Root.GetPlanetMoon], peut-être les vestiges d'une gigantesque bataille spatiale."
 shipyard_uninhabitable_category: "Ancien chantier spatial"
 shipyard_uninhabitable_category_desc: "Un ancien chantier orbital dérive en silence au-dessus de ce monde. Il a subi d'importants dégâts au combat, et des sections complètes ont été détruites."
 inhabited_toxic_category: "Signes d'occupation ancienne"
 inhabited_toxic_category_desc: "Ce monde toxique et sans vie a visiblement abrité par le passé une civilisation pré-spatiale modérément avancée. Les ruines de ses villes sont toujours visibles à la surface."
 writing_uninhabitable_category: "Inscriptions de surface"
 writing_uninhabitable_category_desc: "La surface de [Root.GetName] est striée de marques dont l'ordonnancement laisse supposer qu'il n'est pas naturel. Depuis l'espace, ces crevasses ressemblent à une écriture."
 beacon_uninhabitable_category: "Balise de surface"
 beacon_uninhabitable_category_desc: "Nous recevons un faible signal émanant de la surface de cette [Root.GetPlanetMoon]. La source semble en être une sorte de balise de repérage."
 mountain_uninhabitable_category: "Étrange formation montagneuse"
 mountain_uninhabitable_category_desc: "Les efforts déployés pour cartographier la surface de [Root.GetName] ont permis d'identifier une étrange chaîne montagneuse dans l'hémisphère sud, qui ne semble pas être d'origine naturelle."
 object_uninhabitable_category: "Objet non identifié"
 object_uninhabitable_category_desc: "Un petit objet rectangulaire se trouvant sur la surface de cette [Root.GetPlanetMoon] réfléchit tous les rayons de balayage comme un miroir. Les capteurs ne sont pas en mesure de déterminer sa composition."
 signal_gasgiant_category: "Signal de la géante gazeuse"
 signal_gasgiant_category_desc: "Nous captons ce qui ressemble à une faible transmission émanant de l'atmosphère de cette géante gazeuse. Serait-il possible que quelqu'un ou quelque chose tente de communiquer ?"
 ship_gasgiant_category: "Vaisseau de la géante gazeuse"
 ship_gasgiant_category_desc: "L'empreinte d'un vaisseau de taille moyenne a brièvement été détectée dans la haute atmosphère de cette géante gazeuse."
 terminal_gasgiant_category: "Orbite terminale"
 terminal_gasgiant_category_desc: "Une lune, petite et insignifiante à tout autre point de vue, orbite autour de cette géante gazeuse. Mais elle semble être sur une trajectoire qui va bientôt l'amener à la collision avec l'objet primaire."
 vultaum_asteroid_category: "Signes d'activité de précurseurs"
 vultaum_asteroid_category_desc: "Cet astéroïde présente les traces des activités d'une civilisation ancienne de précurseurs."
 vultaum_gasgiant_category: "Signes d'activité de précurseurs"
 vultaum_gasgiant_category_desc: "Les abords de cette géante gazeuse présente les traces des activités d'une civilisation ancienne de précurseurs."
