l_french:
 #Ascension Perk name
 ap_become_the_crisis: "Ennemi de la galaxie"
 ap_become_the_crisis_desc: "Toute entreprise ambitieuse nécessite un sacrifice. La galaxie ne le comprend pas, mais elle va devoir l'accepter."
 #Menace name
 menace_name: "$menace$ :"
 #Crisis Path names
 crisis_path_destruction_name: "La voie de la destruction"
 crisis_path_destruction_desc: "L'ordre n'est pas une chose naturelle. La véritable nature de la matière est le chaos.\n\nNous ne détruisons pas l'univers, nous le réparons."
 crisis_path_supremacy_name: "La voie de la suprématie"
 crisis_path_supremacy_desc: "Le droit de gouverner appartient aux seuls vainqueurs. Nous revendiquons ce droit. Quiconque veut prouver que nous avons tort peut chercher à le démontrer s'il le souhaite."
 crisis_path_deception_name: "La voie de la tromperie"
 crisis_path_deception_desc: "Pendant que tout le monde s'intéresse à ces idiots qui attirent l'attention sur eux, il est bien plus facile d'agir dans les ombres."
 #Menacing Actions
 menacing_actions_name: "Actions menaçantes"
 menacing_actions_destruction_title: "$menacing_actions_name$ : la voie de la destruction"
 menacing_actions_supremacy_title: "$menacing_actions_name$ : la voie de la suprématie"
 menacing_actions_deception_title: "$menacing_actions_name$ : la voie de la tromperie"
 #Menacing Actions - Destruction
 ### FIX THIS! - Investigate capitalisation
 crisis_mean_destroy_starbase_name: "Détruire une base stellaire"
 crisis_mean_destroy_starbase_desc: "Détruire une base stellaire ennemie va susciter §H5§! de £menace£menace."
 crisis_mean_conquer_colony_name: "Conquérir une colonie"
 crisis_mean_conquer_colony_desc: "Conquérir une colonie ennemie va susciter §H10§! de £menace£menace."
 crisis_mean_destroy_empire_name: "Détruire un empire"
 crisis_mean_destroy_empire_desc: "Détruire tout un empire va susciter §H100§! de £menace£menace."
 crisis_mean_defeat_fleet_name: "Vaincre une flotte ennemie"
 crisis_mean_defeat_fleet_desc: "Vaincre une flotte ennemie va susciter §H1§! de £menace£menace par point de capacité navale."
 menacing_actions_destruction_destroy_enclave_title: "Détruire une enclave"
 menacing_actions_destruction_destroy_enclave_desc: "Détruire une enclave va susciter §H100§! de £menace£menace."
 #Menacing Actions - Supremacy
 menacing_actions_supremacy_enslave_species_title: "Asservir toute une espèce"
 menacing_actions_supremacy_enslave_species_desc: "Asservir toute une espèce va susciter §H5§! de £menace£menace par an."
 menacing_actions_supremacy_have_vassal_title: "Avoir des vassaux"
 menacing_actions_supremacy_have_vassal_desc: "Avoir des vassaux va susciter §H10§! de £menace£menace par an."
 menacing_actions_supremacy_vassalize_empire_title: "Vassaliser un empire"
 menacing_actions_supremacy_vassalize_empire_desc: "Vassaliser un empire va susciter §H100§! de £menace£menace."
 menacing_actions_supremacy_invade_primitives_title: "Envahir des primitifs"
 menacing_actions_supremacy_invade_primitives_desc: "Envahir des mondes primitifs va susciter §H1§! de £menace£menace par £pop£pop."
 menacing_actions_supremacy_sent_marauders_title: "Envoyer un raid de maraudeurs"
 menacing_actions_supremacy_sent_marauders_desc: "Envoyer un raid de maraudeurs va susciter §H50§! de £menace£menace par £pop£pop."
 #Menacing Actions - Deception
 menacing_actions_deception_force_resolution_title: "Imposer une proposition malgré l'opposition"
 menacing_actions_deception_force_resolution_desc: "Imposer une proposition malgré que la majorité des votants s'y opposent va susciter §H5§! en £menace£menace."
 menacing_actions_deception_council_position_title: "Siéger au Conseil galactique"
 menacing_actions_deception_council_position_desc: "Disposer d'un siège au Conseil galactique va susciter §H10§! de £menace£menace par an."
 menacing_actions_deception_veto_resolution_title: "Droit de veto sur une résolution"
 menacing_actions_deception_veto_resolution_desc: "Appliquer le droit de veto sur une résolution va susciter §H100§! de £menace£menace par résolution."
 menacing_actions_deception_call_in_favor_title: "Se faire retourner des faveurs"
 menacing_actions_deception_call_in_favor_desc: "Se faire retourner des faveurs va susciter §H1§! de £menace£menace par £favor£faveur."
 menacing_actions_deception_win_humiliation_war_title: "Gagner une guerre d'humiliation"
 menacing_actions_deception_win_humiliation_war_desc: "Gagner une guerre d'humiliation va susciter §H200§! de £menace£menace."
 #Crisis Perks
 crisis_perk: "Atout de la crise"
 crisis_perk_plural: "Atouts de la crise"
 crisis_perk_destruction: "$crisis_path_destruction_name$ : $crisis_perks$"
 crisis_perk_supremacy: "$crisis_path_supremacy_name$ : $crisis_perks$"
 crisis_perk_deception: "$crisis_path_deception_name$ : $crisis_perks$"
 crisis_perk_to_unlock: "Pour l'obtenir :"
 crisis_perk_passive_effect: "Effets passifs :"
 crisis_perk_active_effect: "Effets actifs :"
 ### menp_undertaker: "Undertaker"
 ### menp_undertaker_desc: "'Death' is such a strong word. We are merely returning their matter to its initial state."
 ### crisis_perks_destruction_undertaker_unlock: "Purge §Y50§! £pop£ Pops to unlock this $crisis_perk$."
 ### undertaker_passive: "Purging generates £menace£ Menace."
 ### undertaker_active: "Purging speed is greatly increased, and generates £alloy£ Alloys."
 ### menp_ship-chipper: "Ship-chipper"
 ### menp_ship-chipper_desc: "All these metal constructs moving about in orderly fashion... It needs to stop."
 ### crisis_perks_destruction_ship-chipper_unlock: "Destroy 100 ships in order to unlock this $crisis_perk$."
 ### menp_ship-chipper_passive: "Your fleets take -25% damage in combat."
 ### menp_ship-chipper_active: "Your fleets have +50% weapon damage."
 ### menp_death_from_above: "Death From Above"
 ### menp_death_from_above_desc: "No place to run, no place to hide. In fact, no 'place' at all."
 ### crisis_perks_destruction_death_from_above_unlock: "Destroy 10 buildings through bombardment to unlock this $crisis_perk$."
 ### menp_death_from_above_passive: "When bombarding, Planet Devastation is 20% faster."
 ### menp_death_from_above_active: "Unlocks Armageddon Bombardment."
 crisis_perks_supremacy_privateering_title: "Course"
 crisis_perks_supremacy_privateering_desc: "Attaquer nous-mêmes ? Soyons sérieux. D'autres sont prêts à le faire à notre place."
 crisis_perks_supremacy_privateering_unlock: "Pour obtenir cet atout de la crise, recruter au total 4 flottes de maraudeurs."
 crisis_perks_supremacy_privateering_passive: "Les contrats des maraudeurs durent 30% plus longtemps."
 crisis_perks_supremacy_privateering_active: "Les contrats des maraudeurs sont 50% moins coûteux."
 crisis_perks_supremacy_primus_inter_pares_title: "Premiers entre les égaux"
 crisis_perks_supremacy_primus_inter_pares_desc: "Ils sont nos égaux. Et ils sont d'accord avec ça. Sinon..."
 crisis_perks_supremacy_primus_inter_pares_unlock: "Pour obtenir cet atout de la crise, diriger une fédération de type hégémonique d'au moins 3 membres."
 crisis_perks_supremacy_primus_inter_pares_passive: "§G+5§! en capacité navale fédérale par membre de la fédération."
 crisis_perks_supremacy_primus_inter_pares_active: "La cohésion fédérale est accrue de 3."
 crisis_perks_supremacy_support_is_mandatory_title: "Soutien obligatoire"
 crisis_perks_supremacy_support_is_mandatory_desc: "Ils sont, bien évidemment, libres de s'opposer à nos requêtes. Tout comme nous sommes libres de les annihiler."
 crisis_perks_supremacy_support_is_mandatory_unlock: "Pour obtenir cet atout de la crise, l'empire doit avoir au moins 4 vassaux."
 crisis_perks_supremacy_support_is_mandatory_passive: "Chaque vassal verse des contributions mensuelles en £energy£énergie et en £minerals£minéraux accrues de +10%."
 crisis_perks_supremacy_support_is_mandatory_active: "+20 en capacité navale pour chaque vassal de l'empire."
 crisis_perks_deception_lord_of_red_tape_title: "Maîtres de la paperasserie"
 crisis_perks_deception_lord_of_red_tape_desc: "C'est simple ! Remplissez le formulaire fédéral 68-XM, remettez-le au département 11-B le 21 au plus tard, demandez trois copies de..."
 crisis_perks_deception_lord_of_red_tape_unlock: "Pour obtenir cet atout de la crise, proposer 3 sanctions à la Communauté galactique."
 crisis_perks_deception_lord_of_red_tape_passive: "Coût des propositions en £influence£influence réduit de 20%."
 crisis_perks_deception_lord_of_red_tape_active: "Offre l'immunité en cas d'§Rinfraction§! aux lois galactiques."
 crisis_perks_deception_dance_puppets_title: "Faire danser les marionnettes"
 crisis_perks_deception_dance_puppets_desc: "Tous savent comment cela marche. Ils nous grattent le dos, et en échange nous acceptons de ne pas détruire le leur."
 crisis_perks_deception_dance_puppets_unlock: "Pour obtenir cet atout de la crise, se faire retourner 20 £favor£faveurs."
 crisis_perks_deception_dance_puppets_passive: "§R-10% de £diplo_weight£poids diplomatique par £favor£faveur.§!"
 crisis_perks_deception_dance_puppets_active: "Se faire retourner des £favor£faveurs ne coûte rien en £influence£influence."
 crisis_perks_deception_shadowplay_title: "Théâtre d'ombres"
 crisis_perks_deception_shadowplay_desc: "Ce qu'ils savent sur nous, ils le savent parce que nous voulions qu'ils le sachent. Mais nous, nous savons tout sur eux."
 crisis_perks_deception_shadowplay_unlock: "Pour obtenir cet atout de la crise, mener à bien §H10§! opérations."
 crisis_perks_deception_shadowplay_passive: "Les actions d'espionnage sont +20% plus rapides et 20% moins coûteuses."
 crisis_perks_deception_shadowplay_active: "Gain de §G+2§! en renseignements sur les autres empires."
 #Crisis UI
 menace_value: "$VAL|0$£menace£"
 menace_gaining: "Atteignez les §Hobjectifs de crise§! pour cumuler davantage de §Ymenace§!."
 menace_desc: "La menace mesure la résonnance de nos actions avec les dangereuses énergies du Suaire."
 menace_crisis_objective: "Objectifs de crise"
 menace_crisis_objective_gained: "Menace obtenue"
 menace_crisis_objective_reward: "$REWARD$"
 menace_crisis_objective_progress: "Cet objectif de crise nous a octroyé £menace£$AMOUNT$."
 menace_crisis_level_locked: "Nécessaire pour atteindre ce niveau :\n"
 menace_crisis_level_unlocked: "Au niveau $LEVEL$, nous obtiendrons un projet spécial et ces avantages :\n"
 menace_crisis_level_desc: "Permet de progresser dans les niveaux de crise, d'atteindre les objectifs de crise et mener à bien les projets spéciaux de crise disponibles dans le journal de bord"
 menace_crisis_level_unlock: "A une menace de £menace£§Y$CURRENCY$§!"
 menace_current_value: "Valeur actuelle : §Y$VALUE|0$§!"
 menace_crisis_description_title: "Ennemi de la galaxie"
 menace_crisis_description_intro: "Ceux qui, au sein de la Communauté galactique, explorent les tendances de l'histoire galactique ont depuis longtemps postulé une §Rcrise§! à venir, une menace pesant sur l'existence de toutes les formes de vie conscientes, qui ne sera vaincue qu'en achevant une unité de but et des sacrifices sans précédent.\n\nCertains ont pensé qu'une invasion de dévoreurs extragalactiques en était à l'origine, d'autres un soulèvement d'intelligences mécaniques, ou encore une guerre de succession extradimensionnelle impactant notre existence...\n\nMais il est clair aujourd'hui §Rnous seuls§! sommes l'origine de cette crise."
 menace_crisis_description: "$menace_crisis_description_intro$\n\nNos actes ont des répercussions dans une autre dimension possédant une énergie inépuisable. Il nous suffit de trouver un moyen de maîtriser cette puissance pour asservir la galaxie tout entière."
 menace_crisis_howto_title: "Menace et moteur"
 menace_crisis_howto: "Accomplir des §Hobjectifs de crise§! génère de la £menace£§Hmenace§! servant à achever le moteur éthérophasique, une mégastructure qui libérera tout notre pouvoir destructeur sur la galaxie."
