 planet_destruction.101.name: "Fin du monde"
 planet_destruction.102.name: "Fin d'un monde gelé"
 planet_destruction.101.desc: "Alors que le colosse achève sa tâche apocalyptique, le doux balancement du [From.From.GetName] provoqué par le déchirement de la croûte et la désagrégation de la magnétosphère de [From.GetName] s'apaise.\n\nLa violence brute de la mort de ce monde est difficile à appréhender, mais il est indéniable que le refroidissement du noyau de [From.GetName] dans l'espace glacial constitue un spectacle d'une beauté morbide et somptueuse."
 planet_destruction.101.a.purifexter: "Magnifique"
 planet_destruction.301.name: "Balayage neutronique"
 planet_destruction.301.nobots.desc: "Le panache de fumée neutronique du [From.From.GetName] disparaît lentement, après avoir terminé de balayer la surface de [From.GetName]. Les capteurs ne rapportent plus aucun signe de vie consciente ; la flore, si elle est gravement atteinte, recouvrera avec le temps. Certains pourraient considérer l'annihilation pleine et entière de toute vie intelligente, tout en préservant la matière inanimée, de crime de guerre pervers.\n\nMais nous nous contenterons de signaler son efficacité."
 planet_destruction.301.bots.desc: "Le panache de fumée neutronique du [From.From.GetName] disparaît lentement, après avoir terminé de balayer la surface de [From.GetName].\n\nLes capteurs soniques ne rapportent rien d'autre que le vent et les doux cliquetis et vrombissements de la population synthétique survivante. Toute vie organique consciente a été éradiquée."
 planet_destruction.301.infested.desc: "Le panache de fumée neutronique du [From.From.GetName] disparaît lentement, après avoir terminé de balayer la surface de [From.GetName].\n\nDes balayages rapides confirment que tout le paysage infesté, auparavant couvert d'une masse agitée et tourbillonnante d'organismes en activité, est maintenant débarrassé de toute vie. Seuls restent désormais des rochers dénudés."
 planet_destruction.401.name: "Foi imposée"
 planet_destruction.401.desc: "Le bruissement de la spire psionique du [From.From.GetName] s'évanouit, et pendant un instant tout est paisible. En bas, sur [From.GetName], tous les habitants se tiennent bouche bée (ou quelque autre équivalent physionomique local), sous l'extase des puissantes et si personnelles vérités que le rayon psionique a libéré de la toile emmêlée de leurs esprits.\n\nS'ils ne comprenaient pas jusqu'à présent, ils savent désormais au plus profond d'eux-mêmes qu'ils appartiennent à quelque chose de bien plus grand."
 planet_destruction.401.tooltip: "Toutes les £pop£§Hpops§! ayant le trait §Y$trait_mechanical$§!, §Y$trait_machine_unit$§! ou §Y$trait_hive_mind$§! sont §Rdétruites§! par la résonnance psionique.\n\nToutes les £pop£§Hpops biologiques§! restantes adoptent l'éthique §Y$ethic_spiritualist$§!.\n\nAjoute le modificateur §Y$god_rayed$§! à [This.GetName] pour §Y10 ans§! :\nAttractivité de l'éthique spiritualiste : §Y+999%§!."
 planet_destruction.501.name: "Nanobots dispersés"
 planet_destruction.501.desc: "Le [From.From.GetName] a achevé le déploiement de la charge de nanobots d'assimilation, calculée pour être suffisante pour dominer cybernétiquement tous les organismes conscients présents sur [From.GetName].\n\nAucun capteur ou instrument n'a été introduit dans le [From.From.GetName] au moment de sa construction pour mesurer le taux de succès, mais nous savons. Nous ouvrons pour la première fois, là en bas, sur [From.GetName]. Nous nous voyons nous-mêmes, et sommes vus de nous-mêmes.\n\nSur la surface de la [From.GetPlanetMoon], il n'y a plus que nous."
 planet_destruction.501.tooltip: "Toutes les £pop£§Hpops organiques§! acquièrent le trait §Y$trait_cybernetic$§!."
 planet_destruction.701.name: "Monde inondé"
 planet_destruction.701.desc: "Au moment où la gigantesque cascade d'eau tombant du [From.From.GetName] s'interrompt, la surface de §Y[From.GetName]§! est totalement transformée. Là où autrefois se trouvaient de vastes continents quasi dépourvus d'eau, on ne voit plus que l'accueillant scintillement d'un océan d'un bleu pur, prêt à être habité."
 planet_destruction.701.tooltip: "§Y[From.GetName]§! est devenue un §Ymonde océanique§!.\nToutes les pops n'ayant pas le trait §Y$trait_aquatic$§! sont mortes."
 DELUGE_EXHAUSTED_ICE_TITLE: "Source de glace épuisée"
 DELUGE_EXHAUSTED_ICE_DESC: "L'utilisation de l'§Yinondeur§! sur §Y[This.GetName]§! a épuisé les ressources en glace du système de $SYSTEM|Y$. La §Ystation de minage de glace§! qui s'y trouvait a donc été démantelée."
 planet_destruction.801.name: "Monde toxifié"
 planet_destruction.801.desc: "Au moment où l'impressionnant flot de substances vénéneuses du [From.From.GetName] se retire, la surface de §Y[From.GetName]§! est totalement transformée. Là où se trouvait autrefois un écosystème dynamique, ne subsiste plus désormais qu'un monde empoisonné, où bien peu de formes de vie peuvent espérer survivre."
 planet_destruction.610.name: "La [outraged_FE.GetName]"
 planet_destruction.610.desc: "[From.GetName] était un monde sacré.\n\n\nVous ne mesurez pas l'étendue de votre péché.\n\n\nPas encore."
 planet_destruction.610.spiri: "Nous saurons démontrer notre vertu"
 planet_destruction.610.mater: "C'était juste un monde comme un autre"
 planet_destruction.610.milit: "C'est une simple question tactique, rien de personnel"
 planet_destruction.610.pacif: "Simple mesure de précaution"
 planet_destruction.610.autho: "C'était à vous ? Eh bien, ce n'est plus le cas !"
 planet_destruction.610.egali: "Mais ainsi nous sommes plus égaux"
 planet_destruction.610.phile: "Mais on vous aime toujours quand même !"
 planet_destruction.610.phobe: "Rien de ce que vous tenez pour sacré ne survivra"
 planet_destruction.610.gesta: "Mais que représente un simple monde ?"
 planet_destruction.610.devou: "§RHAK HAK HAK !§!"
 planet_destruction.610.termi: "Effacé, comme toute donnée inutile"
 planet_destruction.610.purif: "Les hérésies méritent de finir au bûcher"
 planet_destruction.615.A: "[From.GetName] est bien mieux ainsi"
 planet_destruction.615.spir: "C'est juste un peu d'eau bénite, rien de mal à cela"
 action.87.name: "§RColonie perdue !§!"
 action.87.desc: "Nous avons perdu le contrôle administratif de §Y[From.GetName]§!, au profit de la §Y[new_planet_owner.GetName]§!, qui dispose d'une §Hbase stellaire§! du système de §Y[From.GetStarName]§!."
 action.88.name: "Colonie gagnée !"
 action.88.desc: "Nous avons gagné le contrôle administratif de §Y[From.GetName]§!, qui relevait auparavant de la §H[former_planet_owner.GetName]§!, du fait que nous contrôlons la base stellaire du système de §Y[From.System.GetName]§!."
 apoc.1.name: "Portail abandonné"
 apoc.1.desc: "Ce qui ressemble à une ancienne station spatiale a été localisé en bordure du système de [gateway_system.GetName]. La forte signature subspatiale résiduelle qui l'entoure indique qu'il pourrait s'agir d'une sorte de « §Hportail§! », l'une des stations d'un réseau théorique qui à un moment où un autre aurait permis des voyages quasi instantanés entre différentes régions de la galaxie.\n\nMais s'il s'agit bien d'un portail, son état actuel de délabrement le rend inutilisable. S'il pouvait être restauré et remis en état de fonctionnement, son possesseur pourrait sans doute accéder à d'autres portails dans la galaxie, et aurait ainsi le moyen de parcourir des distances immenses en seulement quelques jours."
 apoc.2.desc: "Nous avons découvert un nouveau portail abandonné, cette fois dans le système de [gateway_system.GetName]. Tout comme pour le premier, vu son état il est impossible de le faire fonctionner."
 apoc.3.desc: "Un ancien portail subspatial a été localisé à proximité de §H[gateway_system.GetName]§!. Il semble avoir été construit entièrement par de microscopiques §Hnanites§! de conception inconnue.\n\nCertains signes suggèrent que ce portail a été altéré après avoir été construit : sa connexion avec le reste du réseau a été coupée, et la seule destination qu'il permet d'atteindre est un groupe d'étoiles non reconnues, se trouvant juste au-delà de la bordure de la galaxie, qui a été désigné par les astronomes sous le nom d'§Hamas-L§!.\n\nSi le portail émet une faible signature énergétique, il a été délibérément verrouillé en étant plongé dans une sorte de cycle de maintenance qui empêche son activation. Jusqu'à ce que nous ayons trouvé un moyen de mettre fin à ce cycle, l'amas-L restera hors de portée pour nous."
 apoc.5.name: "Trou de ver naturel"
 apoc.5.desc: "Une sorte de phénomène subspatial naturel a été détecté en bordure du système de §H[wormhole_system.GetName]§!. Une déchirure dans la trame de l'espace-temps s'est formée ici, créant un « §Htrou de ver§! » qui, selon les [Root.Owner.GetScientistPlural], pourrait constituer une sorte de conduite vers un autre trou de vers situé ailleurs dans la galaxie.\n\nSelon la localisation de cet autre trou de ver, cela pourrait peut-être permettre à nos vaisseaux de voyager d'un bout à l'autre de la galaxie en quelques jours seulement. Malheureusement, ce trou de vers, comme c'est d'ailleurs le cas pour la plupart, est par nature instable. Tout vaisseau suffisamment hardi pour s'y engager serait détruit en quelques secondes."
 apoc.5.a: "Si nous pouvions trouver un moyen de le stabiliser..."
 apoc.10.name: "Portail réactivé"
 apoc.10.desc.1: "$apoc.10.desc.a$\n\n$apoc.10.desc.b$"
 apoc.10.desc.2: "$apoc.10.desc.a$\n\n$apoc.10.desc.c$"
 apoc.10.desc.a: "Les scientifiques sont parvenus à réactiver l'ancien portail du système de [gateway_system.GetName] ! En dépit de son âge, cet appareil a formé une conduite subspatiale stable, que l'on peut traverser."
 apoc.10.desc.b: "Les sondes envoyées à travers ont confirmé que l'activation de ce portail a aussi réactivé le second appareil, identique, se trouvant de l'autre côté. Pour l'instant, seuls ces deux-là nous sont accessibles ; mais d'autres, encore non réactivés, pourront sans doute être trouvés ailleurs. Et rien n'interdit de penser qu'à l'avenir nous pourrions en construire de nouveaux, dans les systèmes que nous aurons nous-mêmes choisis !"
 apoc.10.desc.c: "Les sondes envoyées à travers ont confirmé que l'activation de ce portail a établi un lien puissant avec le reste du réseau. Nos vaisseaux peuvent désormais passer par lui pour gagner d'autres portails en état de fonctionnement, tant que leurs possesseurs ne nous sont pas hostiles ou ne nous ont pas fermé leurs frontières."
 apoc.10.desc.3: "$apoc.10.desc.d$"
 apoc.10.desc.4: "$apoc.10.desc.d$\n\n$apoc.10.desc.e$"
 apoc.10.desc.d: "Le portail abandonné du système de §H[gateway_system.GetName]§! s'est soudainement réactivé ! Son énergie a très certainement été restaurée à distance, peut-être depuis un autre portail. Quoi qu'il en soit, une conduite subspatiale stable, qui semble pouvoir être franchie, s'est formée."
 apoc.10.desc.e: "Malheureusement, nous ne pouvons accéder au portail. Le champ subspatial entourant l'appareil repousse nos vaisseaux dès qu'ils s'en approchent. Avant de pouvoir nous en servir et y faire passer nos vaisseaux, nous allons donc devoir trouver le moyen d'activer ce portail."
 apoc.10.a: "Mais n'importe quoi peut en sortir n'importe quand !"
 apoc.11.name: "Portail construit"
 apoc.11.desc: "Cela ne peut être décrit que comme un triomphe des sciences et de l'ingénierie : nous venons d'achever la construction de notre tout premier portail opérationnel, dans le système de §Y[gateway_system.GetName]§! ! L'appareil a formé une conduite subspatiale stable et établi un lien avec le reste du réseau des portails dans la galaxie."
 apoc.12.desc: "La puissance du portail délabré qui trouve dans le système de §H[gateway_system.GetName]§! a été restaurée. Il a été connecté au reste du réseau et est désormais pleinement opérationnel."
 apoc.13.desc: "La construction du nouveau portail dans le système de §H[gateway_system.GetName]§! est terminée. Une connexion subspatiale stable avec le reste du réseau a été établie et il est désormais pleinement opérationnel."
 apoc.14.name: "Site du portail prêt"
 apoc.14.desc: "Le site de construction pour le portail qui va être érigé dans le système de §H[gateway_system.GetName]§! est désormais en place. La construction du portail en lui-même pourra être lancée aussitôt toutes les ressources nécessaires rassemblées."
 planet_destruction.111.name: "Pontage hyperspatial"
 planet_destruction.111.desc: "Le Conseil de planification hyperspatiale rapporte que le retrait de la troisième planète du système de Sol du puits de gravité a permis la formation d'un trou de ver naturel. Cela devrait ainsi contribuer à décongestionner le trafic PRL dans les hyperlignes avoisinantes."
 planet_destruction.111.a: "Une planète sans intérêt, pas de quoi pleurer"
 planet_destruction.111.a.tooltip: "Un §H$NATURAL_WORMHOLE_GALACTIC$§! se forme dans le système de §Y[sol_sys.GetName]§!."
 planet_destruction.210.name: "Enveloppement de [From.GetName]"
 planet_destruction.210.desc: "Le rayon lumineux de la [From.From.GetName] s'est éteint, et la [From.GetPlanetMoon] [From.GetName] est désormais totalement silencieuse.\n\nPeut-être l'histoire qualifiera-t-elle cet enveloppement, coupant totalement [From.GetName] du reste de l'univers, une mesure extrême et injustifiée. Ou peut-être pas. Mais, dans l'immédiat, le système de [From.GetStarName] dispose d'un nouveau terrarium planétaire."
 planet_destruction.210.desc.alt: "Le rayon lumineux de la [From.From.GetName] s'est éteint, et la [From.GetPlanetMoon] [From.GetName] est désormais totalement silencieuse.\n\nLa vie continue, même si elle est contenue."
 planet_destruction.210.a: "Regardez-les s'agiter quand on tape sur le carreau !"
 planet_destruction.210.b: "C'était malheureusement nécessaire"
 sentinel_station: "Station des Sentinelles"
 sentinel_station_plural: "Stations des Sentinelles"
 crisis.52.2.a.response: "Nombre d'entre nous ont un passé militaire. Nous sommes les survivants d'une douzaine de flottes distinctes qui ont affronté les Préthoryns et ont été vaincues. Mais nous avons beaucoup appris de nos erreurs passées, et en tant que Sentinelles nous faisons tout pour ne pas les répéter.\n\nPar ailleurs, je pense avoir mentionné le fait que nous recrutons parmi toutes les espèces de la galaxie. Nous comptons parmi nous un certain nombre de survivants d'un ancien empire déchu, qui a aujourd'hui disparu. Ils nous ont donné accès à des caches de technologies secrètes et de flottes militaires qui avaient été mises en réserve."
 crisis.52.new.b.response: "Nous avons établi nos quartiers généraux à proximité du système de §H[sentinel_system.GetName]§!. Les coordonnées de ce trou noir, non reconnu jusqu'à présent, nous ont été livrées par la §H[sentinel_fallen_empire.GetName]§!, qui nous a aussi aidés à construire Sentinelle Alpha, notre principale installation spatiale et le premier port d'attache de nos flottes.\n\nSi je puis dire, c'est un véritable succès - d'autant que nous avions peu de temps."
 crisis.52.2.new.b.response: "Nous avons établi nos quartiers généraux à proximité du système de §H[sentinel_system.GetName]§!. Les coordonnées de ce trou noir, non reconnu jusqu'à présent, ont été découvertes par nos agents dans les anciennes bases de données d'un empire déchu depuis longtemps oublié. Nous avons aussi tiré de ces bases des schémas techniques qui nous ont aidés à construire Sentinelle Alpha, notre principale installation spatiale et le premier port d'attache de nos flottes.\n\nSi je puis dire, c'est un véritable succès - d'autant que nous avions peu de temps."
 sentinel_title: "L'ordre des Sentinelles"
 crisis.76.desc: "Contre toute attente, la galaxie a triomphé. Les Préthoryns ont été vaincus. J'ai longtemps cru que ce jour ne viendrait jamais, mais maintenant que nous sommes victorieux, il me reste une dernière tâche à accomplir.\n\nEn tant que Grand Maître des Sentinelles, je dissous notre ordre. Notre seul et unique but était la défaite du Fléau, et maintenant que cela s'est produit il est temps pour les membres de l'ordre de poursuivre leur route, chacun de leur côté. Afin d'empêcher qu'elles soient utilisées à mauvais escient, nos flottes de combat ayant survécu seront démantelées.\n\nPuisse la défaite de cette menace intergalactique être annonciatrice d'une nouvelle ère de paix.\n\nC'était Sentinelle Une, terminé."
 crisis.76.c: "Fin de la transmission"
 crisis.81.name: "La chute des Sentinelles"
 crisis.81.desc: "Des combats acharnés ont été rapportés dans les parages immédiats du système de §H[sentinel_system.GetName]§!. La base des Sentinelles est sur le point de tomber.\n\nNous avons capté des fragments d'une transmission à longue portée de §HSentinelle Alpha§!, la station de combat qui sert de quartier général de l'ordre. Le brouillage et les poches d'énergie résiduelles provenant des décharges énergétiques massives de l'armement se produisant au coeur du système créent des interférences importantes."
 crisis.82.desc: "Ici... Ici Sentinelle Alpha. Nous avons §R###SIGNAL CORROMPU###§! ... des dommages critiques. La coque est en train de céder, et §R###SIGNAL CORROMPU###§! ... mort du Grand Maître confirmée. Ils sont beaucoup trop nombreux !\n\nC'est... C'est fini pour nous. Poursuivez le combat. Pour les générations futures, vous ne devez pas renoncer. Ne rendez pas vain notre sacrifice ! Nous avons... nous... AAAAAAAAAAAAAAAHHHHHHHHHHHHHHHHH---- §R<SIGNAL PERDU>§!"
 crisis.78.desc: "Ici Sentinelle Une. Ce sont des temps désespérés que vit la galaxie, mais je vous contacte pour vous donner de bonnes nouvelles.\n\nGrâce à une expérience du combat intense et à des recherches méticuleuses, les agents des Sentinelles ont compilé un fichier extrêmement détaillé sur l'anatomie des créatures du Fléau préthoryn. Saviez-vous, par exemple que les couvains préthoryns s'enflamment violemment si leurs vésicules biliaires primaire et secondaire sont perforées au même moment ?\n\nNous rendons ces informations disponibles à tout le monde dans la galaxie. En ciblant les points faibles que nous avons découverts, vous devriez vous apercevoir que vos flottes sont beaucoup plus efficaces au combat contre le Fléau."
 crisis.78.c: "Téléchargeons ces données dans les ordinateurs de ciblage"
 sentinel_data: "Données des Sentinelles"
 sentinel_data_desc: "Ces fichiers détaillés sur l'anatomie des Préthoryns nous ont été transmis par les Sentinelles. Grâce à eux, nous avons été capables d'identifier plusieurs points faibles dans les exosquelettes de ces créatures."
 crisis.121.name: "Sauvagerie préthoryne repérée"
 crisis.121.desc: "De nombreuses créatures préthorynes, ayant profité du chaos pour s'échapper dans les régions les plus reculées de l'espace, restent introuvables depuis la défaite du Fléau. Sans conscience collective centrale pour les guider, la plupart ne sont rien d'autre que des bêtes sans conscience, qui finiront par dépérir d'elles-mêmes.\n\nMalgré tout, des observations récentes ont confirmé qu'un grand nombre de ces Préthoryns sauvages ont établi un repère dans le système de §H[feral_prethoryn_system.GetName]§!.\n\nNous risquons, dans les années à venir, d'être confrontés à d'autres nids de ces créatures dans les systèmes inoccupés où le Fléau était autrefois établi. Il est peu probable que cela constitue une menace majeure - ces êtres sauvages ont une tendance à se déchirer eux-mêmes et ne semblent pas faire preuve de la même intelligence calculatrice qui animait le Fléau."
 crisis.121.a: "Diffusons une mise en garde officielle"
 crisis.51.2.name: "Montée en puissance des Sentinelles"
 sentinel_fleet_gift: "Une flotte sentinelle apparaît près de [Root.Capital.GetName] et est placée sous notre contrôle."
 pirate.6.desc: "Une mutation génétique rare, présente dans un nombre restreint de drones, leur a permis de se couper en partie de la connexion à la Conscience sans devenir inconscients. Condamnés à périr s'ils s'aventuraient trop loin de l'influence de la Conscience, ces drones défectueux se sont établis dans le système de §H[pirate_system.GetName]§!, au sein de notre espace.\n\nIls ont l'intention de subvenir à leurs besoins en vivant de la piraterie, utilisant pour cela leur petite flotte de vaisseaux grossiers pour mener des raids contre la route commerciale sensible qui transite par ce système."
 pirate.7.desc: "Un groupe restreint d'unités défaillantes s'est coupé de l'intelligence centrale de la [Root.GetName] pour trouver refuge dans le système de §H[pirate_system.GetName]§!, au sein de notre espace. Ces unités sont irrémédiablement endommagées, et elles font maintenant usage de vaisseaux spatiaux sommaires pour mener des raids sur la route commerciale qui transite par ce système afin d'y trouver des pièces détachées et des ressources."
 pirate.50.name: "Pirates repérés"
 pirate.50.a.desc: "La route commerciale transitant par le système de §H[pirate_system.GetName]§! est mal protégée et passe par ce qui est devenu dans les faits un espace sans foi ni loi. Un nombre croissant de pirates, de contrebandiers et de criminels notoires a commencé à s'y assembler, et ils attaquent maintenant nos vaisseaux en toute impunité."
 pirate.50.b.desc: "La route commerciale non protégée transitant par le système de §H[pirate_system.GetName]§! a attiré l'attention d'une bande de pirates errants. Ces hors-la-loi ont rassemblé une flotte importante, qui intercepte quasiment tout le commerce qui passe par le système."
 pirate.50.c.desc: "Avec la route commerciale qui y transite et est laissée sans protection, le système de §H[pirate_system.GetName]§! a attiré l'attention d'un grand nombre de brigands. Au terme d'une récente lutte de pouvoir en leur sein, ces criminels dégénérés sont désormais suffisamment organisés pour avoir constitué une armada pirate relativement puissante. Ils font usage de cette flotte de bric et de broc pour intercepter tout le commerce transitant par ce système qui passe à leur portée."
 pirate.50.a: "Nous devons nous en occuper"
 pirate.53.name: "Raids de drones défectueux"
 pirate.53.desc: "Une mutation génétique rare, présente dans un nombre restreint de drones, leur a permis de se couper en partie de la connexion à la Conscience sans devenir toutefois inconscients. Condamnés à périr s'ils s'aventuraient trop loin de notre influence, ces drones défectueux ont établi un repère au sein même de notre espace, dans le système de §H[pirate_system.GetName]§!.\n\nCe système n'a pas été choisi au hasard, car l'une de nos routes commerciales les moins bien protégées y transite. Les rebelles ont sans aucun doute l'intention de subvenir à leurs besoins en vivant de la piraterie, en utilisant leur petite flotte de vaisseaux grossiers pour mener des raids contre nos convois."
 pirate.54.name: "Pirates aliens"
 pirate.54.desc: "Un groupe de pirates aliens s'est infiltré et établi dans le système de §H[pirate_system.GetName]§!, au sein de notre espace. Afin de vivre de leurs activités criminelles, ils ont apparemment l'intention d'attaquer la route commerciale non protégée qui transite par ce système."
 pirate.56.name: "Unités défectueuses"
 pirate.56.desc: "Un petit groupe d'unités défectueuses s'est séparé de l'intelligence centrale de la [Root.GetName] pour trouver refuge dans le système de §H[pirate_system.GetName]§!, au sein de notre espace. Ces unités sont irrémédiablement endommagées, et elles font maintenant usage de vaisseaux spatiaux sommaires pour mener des raids contre la route commerciale non protégée du système afin d'y trouver des pièces détachées et des ressources."
 pirate.57.name: "Pirates organiques"
 pirate.57.desc: "Un petit groupe de sous-unités organiques, apparemment des criminels mis au ban de leur société, est parvenu d'une façon ou d'une autre à infiltrer le système de §H[pirate_system.GetName]§!, au sein de nos frontières, pour s'y établir. Ils ont visiblement l'intention de lancer des raids contre la route commerciale non défendue transitant par ce système, faisant peut-être le pari, comme les organiques aiment à le faire, qu'ils sont trop insignifiants pour que nous nous souciions de donner une réponse armée au défi qu'ils nous posent."
 leviathans.509.desc: "L'accord signé entre nous pour vous donner accès à nos bases de données arrive à son terme. Souhaiteriez-vous le prolonger pour dix nouvelles années standards, ou vos chercheurs n'ont-ils plus besoin des informations que nous avons à offrir ?"
 leviathans.509.a: "Nous aimerions prolonger l'accord"
 leviathans.509.a.reply: "Parfait. Les bases de données resteront donc ouvertes à vos scientifiques."
 leviathans.509.e: "Non, nous ne sommes plus intéressés pour l'instant"
 enclave_mineral_trade_1_xur: "Accord commercial avec XuraCorp"
 enclave_mineral_trade_1_xur_desc: "Cet accord commercial stipule un échange mensuel de ressources entre nous et XuraCorp.\n\n§YIl pourra y être mis un terme n'importe quand, à partir de son menu diplomatique.§!"
