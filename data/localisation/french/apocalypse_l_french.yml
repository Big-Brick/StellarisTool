 leviathans.171.name: "Fin de l'accord énergétique"
 leviathans.171.desc: "Nos réserves énergétiques étant épuisées, nous ne pouvons plus remplir notre part des contrats dépendant de cette ressource. Tous ces accords conclus avec les enclaves de Marchands sont donc rompus."
