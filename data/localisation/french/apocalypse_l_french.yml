 leviathans.173.desc: "Nos réserves minérales étant épuisées, nous ne pouvons plus remplir notre part des contrats dépendant de cette ressource. Tous ces accords conclus avec les enclaves de Marchands sont donc rompus."
 enclave_energy_trade_ended: "£energy£§HCrédits énergétiques§! insuffisants pour maintenir l'accord avec les enclaves de Marchands."
 leviathans.175.name: "Fin de l'accord sur la nourriture"
 leviathans.175.desc: "Nos réserves de nourriture étant épuisées, nous ne pouvons plus remplir notre part des contrats dépendant de cette ressource. Tous ces accords conclus avec les enclaves de Marchands sont donc rompus."
