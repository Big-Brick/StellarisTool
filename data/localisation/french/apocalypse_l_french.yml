 apoc.100.name: "Projet Colosse"
 apoc.100.desc: "$COLOSSUS_PROJECT_DESC$"
 apoc.100.desc.pacif: "Maintenant que les doctrines de dissuasion sont de nouveau en vogue parmi les politologues en vue sur [Root.Capital.GetName], le projet Colosse est présenté comme la dissuasion ultime : une arme surpassant même les vaisseaux de classe titan. Dotés de la capacité de prendre à leur bord des charges capables de détruire intégralement un monde, ces vaisseaux colosses pourraient être déployés tout en recourant à des moyens de résolution de conflit moins violents - mais cependant tout aussi terrifiants et permanents.\n\nSi un quelconque ennemi refusait de mettre un terme à ses agressions contre nous ou nos alliés, on le lui ferait tout simplement §Rregretter§!."
 apoc.100.desc.milit: "Alors que le sujet n'était jusqu'à présent abordé qu'à mots couverts, après n'avoir été discuté que de façon secrète au plus profond des laboratoires militaires, le projet Colosse vient d'être officiellement approuvé. Il s'agit sans doute de la plus grande innovation militaire jamais vue dans la galaxie, incluant le développement d'un armement conçu dès les origines comme un §Rtueur de mondes§!, tout autant qu'une configuration de coque de classe colosse capable de le prendre à son bord. Ces vaisseaux auront très certainement besoin d'une escorte, les nécessités liées à l'armement tueur de mondes interdisant tout autre moyen offensif ou défensif.\n\nNéanmoins, le colosse, une fois développé, promet d'être sans doute la force la plus destructrice de toute la galaxie."
 apoc.100.desc.phobe: "Le projet colosse a été salué comme l'avancée la plus importante dans la lutte actuelle contre ces pitoyables aliens qui infestent la galaxie. Selon le projet, un vaisseau de classe colosse est une coque gigantesque, très lourdement blindée, embarquant à son bord une seule arme, de classe §Rtueur de mondes§!. La capacité de cet armement à débarrasser la galaxie de toute planète refusant de se soumettre à nous s'avérera très certainement inestimable, du moins tant qu'il n'aura pas été mis un terme à la xénomenace."
 apoc.100.desc.purif: "Par l'épée et par le feu, les mondes hérétiques vont brûler. Par leurs cendres, la galaxie sera rendue à la pureté."
 apoc.100.desc.termi: "L'atmosphère, les biotopes, la gravité sont souvent pratiques, mais ne s'avèrent véritablement nécessaires que pour ces immondes sacs à viande.\n\nMort aux mondes ! Mort aux organiques !"
 apoc.100.a: "C'est noté"
 apoc.110.name: "Un canon sur la tempe de l'univers"
 apoc.110.desc: "Les meilleurs spécialistes de tous les domaines possibles ont enfin remis leurs propositions pour ce §Rtueur de mondes§! qui équipera bientôt nos premiers vaisseaux de classe colosse. Nous pouvons désormais trancher pour choisir l'une des propositions et lancer les dernières étapes du projet Colosse."
 apoc.110.desc.machine: "Les cycles de calcul non utilisés ont été estimés et se sont avérés suffisants pour développer un (1) armement de classe §Rtueur de mondes§!, coïncidant avec l'achèvement du §Gprojet Colosse§!.\n\nPrioritisation nécessaire."
 apoc.110.desc.hive: "Nous avons exploré une myriade de possibilités, et il apparaît clairement que nous pouvons désormais développer un armement viable de classe §Rtueur de mondes§! pour nos tout premiers vaisseaux de classe colosse. Si les autres options pourront être réétudiées plus tard, nous ne pouvons dans l'immédiat consacrer notre attention au développement que d'une seule arme pour les dernières étapes du projet Colosse."
 apoc.110.cracker.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_CRACKER_DESC$§!"
 apoc.110.shielder.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_SHIELDER_DESC$§!"
 apoc.110.neutron.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_NEUTRON_DESC$§!"
 apoc.110.godray.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_GODRAY_DESC$§!"
 apoc.110.nanobots.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_NANOBOTS_DESC$§!"
 apoc.110.devolution.tooltip: "§RArmement tueur de mondes§! :\n§L$PLANET_KILLER_DEVOLUTION_DESC$§!"
 apoc.120.name: "Projet Colosse achevé"
 apoc.120.desc: "$apoc.120.part.p1$"
 apoc.120.desc.milit: "$apoc.120.part.p1$ $apoc.120.part.milit$"
 apoc.120.desc.pacif: "$apoc.120.part.p1$ $apoc.120.part.pacif$"
 apoc.120.desc.phobe: "$apoc.120.part.p1$ $apoc.120.part.phobe$"
 apoc.120.desc.mater: "$apoc.120.part.p1$ $apoc.120.part.mater$"
 apoc.120.part.p1: "Le projet Colosse, cette tâche monumentale de conception de la plus gigantesque plateforme d'armement dans l'histoire [Root.GetAdj], et du §R[Root.Get1stPlanetKiller]§! embarqué à bord, a donné ses premiers résultats et approche de son terme."
 apoc.120.part.milit: "Si le premier colosse n'a pas encore été construit, ce moment est une charnière dans l'histoire de la [Root.GetName]."
 apoc.120.part.pacif: "Espérons que nous n'aurons jamais à en faire usage."
 apoc.120.part.phobe: "Les xénos peuvent trembler en contemplant notre puissance et notre ingéniosité."
 apoc.120.part.mater: "Ce sera un testament éternel à l'innovation [Root.GetAdj]."
 apoc.120.desc.machine: "Projet Colosse achevé.\n\nNouvelle configuration de coque disponible :\n<<§Gcolosse§!>>\n\nNouveau composant d'armement disponible :\n<<§R[Root.Get1stPlanetKiller]§!>>"
 apoc.120.desc.hive: "La configuration Colosse est désormais pleinement façonnée dans notre esprit, prête à être assemblée. Nous réalisons aussi, avec une certaine gêne, que le cauchemar du §R[Root.Get1stPlanetKiller]§! peut aussi être éveillé."
 apoc.120.a: "Boum"
 apoc.120.a.pacif: "Ce n'est qu'un recours ultime"
 apoc.120.a.gesta: "C'est noté"
 apoc.130.name: "Achèvement du projet Colosse des [From.GetSpeciesNamePlural]"
 apoc.130.desc: "Nous venons d'apprendre que la [From.GetName] a développé toutes les spécifications pour une nouvelle configuration de coque de classe colosse, une plateforme d'armement potentiellement capable de détruire intégralement un monde."
 apoc.130.a.weaker: "C'est pour le moins alarmant"
 apoc.130.a.stronger: "Nous avons donc des concurrents ?"
 apoc.130.a.pacif: "C'est une véritable abomination"
