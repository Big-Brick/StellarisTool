 action.82.name: "Bombardement de [From.GetName]"
 action.82.desc: "Une flotte de la §H[From.From.GetName]§! a massacré les habitants de §H[From.GetName]§! ! Après une campagne de bombardement orbitale massive et impitoyable, tous les foyers de population se trouvant à la surface ont été systématiquement détruits, réduisant la [From.GetPlanetMoon] à l'état de désert irradié, à peine capable d'accueillir la vie."
 action.82.a: "Nous devons venger cette atrocité !"
 action.83.desc: "Nos forces rapportent avoir terminé le bombardement orbital de §H[From.GetName]§!. Tous les foyers de population ont été systématiquement détruits, et la [From.GetPlanetMoon] irradiée ne pourra plus, désormais, abriter des formes de vie qu'à la marge."
