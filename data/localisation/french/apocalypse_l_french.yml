 colossus_victim: "Gravissime crise civique"
 colossus_victim_desc: "Le traumatisme causé par l'attaque du colosse se manifeste dans les changements idéologiques au sein de toutes les catégories de la population."
 decision_make_holy_world: "Sanctification planétaire"
 decision_make_holy_world_desc: "Nous sommes à la recherche d'un §Y$pc_gaia$§! au sein de notre espace afin d'en faire un monde sacré. Tant qu'il ne sera pas souillé par les mortels et se trouvera au sein de notre espace, ce monde consacré nous allouera : £unity£§Y$country_base_unity_produces_mult$§! §G+10%§!."
 apoc.200.name: "Monde sacré possible"
 apoc.200.desc: "En coopération avec les experts en théologie, plusieurs devins ayant eu recours à des méthodes distinctes ont confirmé que §Y[holy_target.GetName]§!, dans le système de [holy_target.GetStarName], est digne d'une vénération particulière.\n\nLa reconnaissance officielle de ce statut est une garantie que la population assurera à sa juste valeur ce monde mystique."
 apoc.200.a: "Sacrée soit [holy_target.GetName] !"
 apoc.200.a.tooltip: "Confère à ce monde le modificateur §Y$holy_player_planet$§!."
 apoc.201.name: "Aucun monde sacré possible découvert"
 apoc.201.desc: "Nos meilleurs devins ont remis leur rapport, établissant qu'aucun noeud spirituel n'avait pu être découvert parmi les mondes relevant de l'empire."
 apoc.201.a.tooltip: "Le coût en £influence£influence£ du décret nous est remboursé."
 holy_player_planet: "Monde consacré"
 holy_player_planet_desc: "Ce monde n'est souillé par aucune vie intelligente et considéré comme sacré."
 has_holy_player_planet: "Vénération de monde"
 has_holy_player_planet_desc: "Nous avons fait d'un monde inhabité se trouvant au sein de nos frontières un site sacré."
 has_world_worship: "$TRIGGER_FAIL$§R Nous avons déjà conçu un§! §Y$holy_player_planet$§!"
 has_holy_world_candidate: "$TRIGGER_FAIL$ §RIl n'y a aucun §Ymonde Gaïa§! au sein de notre espace.§!"
 make_holy_world_effect: "Nous lançons la recherche d'un monde qui pourrait convenir pour le consacrer."
 opinion_cracked_my_uninhabited_world: "A détruit l'un de nos mondes inhabités"
 opinion_cracked_an_uninhabited_world: "A détruit un monde inhabité"
 opinion_worships_our_holy_world: "Révère un monde sacré"
 action.91.name: "Avant-poste reconstruit"
 action.91.desc: "Notre §Y$starbase_outpost$§! a été reconstruit en orbite de §Y[Root.GetStarName]§!. Le système est revenu sous notre contrôle."
 DAILY_PROGRESS: "Chaque jour : $VAL|Y$"
 SHIP_DESIGNER_NAME_USED: "§RUn modèle du même nom existe déjà pour un vaisseau d'une autre classe.§!"
 DESIGN_IS_BUILDING: "§RUn vaisseau de ce modèle est en cours de construction§!"
 DESIGN_BLOCKED_BY_AUTO_BUILD: "§RImpossible de concevoir un vaisseau personnalisé si la conception des modèles est automatisée.§!"
 SHIP_DESIGNER_NAME_USED_BY_ANOTHER_STARBASE: "§RLe nom de ce modèle est déjà utilisé par une base stellaire $NAME|Y$§!"
 opinion_dead_captives: "Captifs tués"
 vultaum_homeworld: "Monde natal des Vultaum"
 vultaum_homeworld_desc: "Ce monde est le monde natal des Vultaum. S'il a été détruit et ne peut plus porter la vie, les vestiges de leurs vastes cités se trouvent toujours à la surface."
 vultaum_minerals: "Débris d'un complexe orbital"
 vultaum_minerals_desc: "Une sorte de gigantesque complexe orbital vultaum s'est écrasé sur ce monde il y a des éternités. La surface en est depuis jonchée de débris."
 vultaum_energy: "Réseau minier aérostatique"
 vultaum_energy_desc: "Cette géante gazeuse disposait autrefois de complexes miniers aérostatiques, dont les Vultaum faisaient usage pour extraire de l'hélium 3."
 yuht_homeworld: "Monde natal des Yuht"
 yuht_homeworld_desc: "Les anciens Yuht étaient originaires de ce monde. Les bombardements orbitaux ont pulvérisé la plupart des structures se trouvant à sa surface, mais des poches d'habitats souterrains abandonnés ont été préservées, qui pourraient être étudiées."
 yuht_minerals: "Riche ceinture astéroïdale"
 yuht_minerals_desc: "Cette riche ceinture astéroïdale a été exploitée de façon intensive par les Yuht, et les minéraux trouvés ici ont permis la lente mais constante expansion de leur empire interstellaire."
 yuht_energy: "Dispositifs de collecte d'énergie"
 yuht_energy_desc: "Plusieurs anciens dispositifs de collecte de l'énergie stellaire avaient été placés en orbite de cette géante gazeuse par les Yuht. Aussi incroyable que ce soit, certains sont toujours en état de fonctionner."
 first_league_homeworld: "Capitale de la Première ligue"
 first_league_homeworld_desc: "Ce monde désolé était autrefois le magnifique centre administratif de la Première ligue. Il ne peut plus abriter la vie désormais, mais les ruines de la cité qui s'étendait autrefois sur toute la surface peuvent être trouvées absolument partout."
 first_league_minerals: "Complexes miniers abandonnés"
 first_league_minerals_desc: "Cette ceinture astéroïdale, à l'apogée de la Première ligue, était densément peuplée. Ces complexes miniers abandonnés peuvent encore être repérés sur des milliers d'astéroïdes."
 first_league_energy: "Plateforme de maintenance"
 first_league_energy_desc: "Plusieurs gigantesques plateformes de maintenance se trouvaient en orbite de cette géante gazeuse, qui alimentaient les milliers de vaisseaux de transport de fret de la marine marchande de la Première ligue. Certains équipements de transfert d'énergie semblent toujours fonctionnels."
 irassian_homeworld: "Monde natal des Irassiens"
 irassian_homeworld_desc: "En dépit des tentatives ultérieures de stériliser sa surface par des bombardements orbitaux, le monde natal des anciens Irassiens abrite toujours une quantité considérable d'objets provenant de leur civilisation avancée."
 irassian_minerals: "Ancien ancrage"
 irassian_minerals_desc: "Autrefois l'un des ports d'attache majeurs de la flotte stellaire irassienne, les chantiers navals parsemant l'orbite de ce monde ont déposé un véritable gisement de ressources minérales à sa surface."
 irassian_energy: "Site de production énergétique"
 irassian_energy_desc: "Cette géante gazeuse était autrefois un site de production énergétique, remontant aux premières phases de l'expansion interstellaire du Pacte irassien. Une ceinture resserrée d'antiques stations de production énergétique entoure toujours cette planète."
