 egg_rifts: "Risse"
 egg_rifts_desc: "Toxischer Schleim und Gase sickern aus den tiefen Gräben der Oberfläche dieses Planeten. Der ganze Planet stinkt dadurch nach faulen Eiern."
 mod_damage_vs_country_type_guardian_hatchling_mult: "Schaden an Todesbrut"
 #TILE BLOCKERS:
 fungoid_extermination: "Toxisches Ödland"
 fungoid_extermination_desc: "Ein giftiger Schlamm aus chemischen Lösungsmitteln und sich auflösenden organischen Substanzen macht diesen Bereich unbewohnbar."
 egg_cracking: "Risse"
 egg_cracking_desc: "Seismologische Phänomene verursachen, dass die Planetenkruste reißt und schwefelähnliche Gase und giftigen Schleim ausspuckt."
