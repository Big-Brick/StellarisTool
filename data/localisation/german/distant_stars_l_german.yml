 d_vast_unity_deposit: "£unity£ +3\n"
 d_vast_unity_deposit_desc: "$d_vast_unity_deposit$"
 trait_bioadaptability: "Bioadaptabilität"
 trait_bioadaptability_desc: "§LDiese Spezies wurde so modifiziert, dass sie anpassungsfähiger ist und nun raure Klimazonen besser ertragen kann.§!"
 trait_social_pheromones: "Sozialpheromone"
 trait_social_pheromones_desc: "§LDiese Spezies wurde so modifiziert, dass sie sozialer ist und überfüllte Bedingungen akzeptiert.§!"
 trait_limited_regeneration: "Begrenzte Regeneration"
 trait_limited_regeneration_desc: "§LDiese Spezies wurde so modifiziert, dass sie schneller heilt. Dies macht sie im Kampf gefährlicher und allgemein etwas langlebiger.§!"
