 action.92.part1: "Die [Root.GetName] hat Spuren der neuen §HStrategischen Ressource§! "
 action.92.part2: "gefunden, als sie [From.GetName] erkundete."
 action.92.generic: "\n\nBei der weiteren Erforschung der Galaxie werden wir sicher noch mehr solcher Ressourcen finden, von denen jede einzigartige Eigenschaften und Anwendungsbereiche aufweist."
 action.92.a: "Klingt potenziell nützlich."
 action.92.name: "§Y[Root.GetName]§!: Neue Ressource entdeckt"
 action.92.garanthium: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die man §HGaranthium-Erz§! nennt. Dieses Erz eignet sich hervorragend für den Bau von Schiffen."
 action.92.lythuric: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HLythurgas§! genannt wird. Kleine Konzentrationen dieses Gases vermischt mit Treibstoff sollten den Schub unserer Antriebe deutlich erhöhen."
 action.92.teldar: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HTeldarkristalle§! genannt wird. Diese extrem haltbaren Kristalle sollten theoretisch die panzerbrechenden Fähigkeiten und das Zerstörungspotenzial unserer Projektilwaffen verbessern."
 action.92.yurantic: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HYurantkristalle§! genannt wird. Diese Kristalle haben seltene reflektierende Eigenschaften, die vorläufigen Scans zufolge die Leistungsabgabe von Energiewaffen erheblich verbessern würde."
 action.92.aldar: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HAldarkristalle§! genannt wird. Durch das Absplittern dieser Kristalle breiten sich die daraus resultierenden Splitter explosionsartig aus und damit es ideal für Splittermatrizen in explosiver Munition geeignet."
 action.92.orillium: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HOrillium-Erz§! genannt wird. Dieses Erz ist ein sehr instabiles Element und kann dazu verwendet werden, um hochfrequente Abschirmungsmodulationen effizienter zu randomisieren, wodurch mögliche defensive Fähigkeiten verbessert werden."
 action.92.pitharan: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HPitharanischer Staub§! genannt wird. Dieser feine und energiereiche Staub dient als hervorragender Dünger. Seine Verwendung sollte unsere Nahrungsmittelproduktion erheblich verbessern."
 action.92.engos: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HEngos-Dampf§! genannt wird. Dieser Dampf ist ein natürlich vorkommendes Stimulanzium, dass allen Lebensformen dabei hilft bei maximaler Kapazität zu arbeiten."
 action.92.neutronium: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HNeutronium§! genannt wird. Neutronium ist eine super-dichte Substanz, die zu äußerst widerstandsfähigen Rümpfen geschmiedet werden kann."
 action.92.zro.common: "Die [Root.GetName] entdeckte eine bisher unbekannte Ressource im §Y[Root.Fleet.GetStarName]§!-System, die man §H$sr_zro$§! nennt."
 action.92.zro: "$action.92.zro.common$ Dieses seltene Aerosol unbekannten Ursprungs verstärkt die Fähigkeiten psionisch begabter [Root.Owner.GetIndividualNamePlural].$action.92.part3$"
 action.92.dark_matter: "Die [Root.GetName] hat eine bisher unbekannte Ressource im §Y[Root.Fleet.GetStarName]§!-System entdeckt, die man §HDunkle Materie§! nennt. Sie scheint mehreren Naturgesetzen zu trotzen und könnte möglicherweise die Wissenschaft revolutionieren."
 action.92.satramene: "Während der Erforschung von [From.GetName] hat die [Root.GetName] eine vorher unbekannte strategische Ressource entdeckt, die §HSatramengas§! genannt wird. Dieses Gas ist ein natürlich vorkommendes Stimulanzium, das eine beruhigende Wirkung auf die meisten Wesen hat und typischerweise die Bildung eines Konsens in Gruppen hervorruft. Es macht möglicherweise süchtig."
 action.92.living_metal: "Die [Root.GetName] hat eine bisher unbekannte Ressource im §Y[Root.Fleet.GetStarName]§!-System entdeckt, die man §HLebendes Metall§! nennt. Dieses zeigt Eigenschaften, die normalerweise nur in biologischen Lebensformen zu finden sind. Es versucht ständig, sich wieder zu jener Form zu regenerieren, in der es stabilisiert wurde."
 action.92.terraform_liquids: "Während der Erforschung von [From.GetName] hat die [Root.GetName] mehrere große Ablagerungen von verschiedenen seltenen §HTerraforming-Flüssigkeiten§! entdeckt. Der Zugang zu diesen Flüssigkeiten verkürzt den Prozess der Terraformung von Planeten erheblich."
 action.92.terraform_gases: "Während der Erforschung von [From.GetName] hat die [Root.GetName] mehrere große Ablagerungen von verschiedenen seltenen §HTerraforming-Gasen§! entdeckt. Mit einer stetigen Zufuhr dieser Gase würde der Prozess der Terraformung eines Planeten weniger teuer sein."
 action.92.has_tech: "\nWir haben die Technologie - wenn wir dieses System kontrollieren, können wir diese Ressource extrahieren.$action.92.generic$"
 action.92.no_tech: "\nWir können diese Ressource zwar zum jetzigen Zeitpunkt noch nicht extrahieren, sollten aber die Kontrolle über das System übernehmen, um sie in Zukunft nutzen zu können.$action.92.generic$"
 action.92.zro.mindwarden: "$action.92.zro.common$\n\nDieses seltene Aerosol weist eine neuroinvasive Wirkung auf und wurde daher als zu kontrollierende Substanz der Klasse Alpha eingestuft. Es könnte jedoch in der Erforschung von Technologien zur Abschirmung gegen mentale Einflüsse nützlich sein.$action.92.generic$"
 action.942.name: "$sr_zro$-Vorkommen entdeckt"
 action.942.desc: "Die [Root.GetName] entdeckte Vorkommen einer strategischen Ressource mit der Bezeichnung \"§H$sr_zro$§! im §H[Root.Fleet.GetStarName]§!-System.\n\nDieses seltene Aerosol besitzt eine Vielzahl von Anwendungsmöglichkeiten. Unsere Analysen zeigten, dass verarbeitete Proben sogar die Fähigkeiten [Owner.GetSpeciesAdj]er Einheiten mit psionischen Eigenschaften wie die Schleiergeschmiedeten verstärken. Dank unserer Technologie in Sachen $tech_mine_zro$ sind wir in der Lage, diese Ressource abzubauen - vorausgesetzt, wir kontrollieren das [Root.Fleet.GetStarName]-System.$action.92.generic$"
 action.942.a: "Eine optimale Entdeckung."
