 sr_distar_nanodust: "Grauer Staub"
 sr_distar_nanodust_desc: "Eine Fülle von Elementen, die zu feinem Staub reduziert wurden. Einmal über einer Welt verteilt, kann der Graue Staub durch Nanomaschinen aktiviert werden und so die Planetenbedingungen schnell verändern."
 sr_distar_nanocrystal: "Graue Kristalle"
 sr_distar_nanocrystal_desc: "Das kristalline Nebenprodukt ist ein Resultat aus bestimmten Aktivitäten von Nanobots und weist eine merkwürdige Wechselwirkung mit anderen nanoskopischen Materialien auf. Es deutet auf eine Wahrheit hin, die jenseits der uns bekannten Planck-Einheiten ist."
 sr_distar_nanoscale: "Graue Schuppen"
 sr_distar_nanoscale_desc: "Konzentrierter Kunstdünger, der zur Wiederbelebung von verwüsteten Biosphären benutzt wird."
 sr_distar_nanoactuator: "Graue Aktoren"
 sr_distar_nanoactuator_desc: "Einfache, aber leistungsfähige Nanoaktoren, die komplexe Manipulationen und Experimente auf mesokopischen Skalen ermöglichen."
