 l_cluster_chain_title: "Das L-Cluster"
 l_cluster_chain_desc: "Wir haben von einem mysteriösen Sternencluster hinter dem äußeren Rand unserer Galaxie erfahren. Es kann nur durch §HL-Tore§!, künstliche Subraumportale die in bestimmten Systemen gefunden werden können, erreicht werden.\n\nDiese Sternentore wurden absichtlich von etwas deaktiviert und momentan fehlen uns die notwendigen Erkentnisse in Subraummechanik, um ihre Sperre aufzuheben."
 clues: "Erkenntnisse über das Enigmatische Tor"
