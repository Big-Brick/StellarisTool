 tech_nanite_repair_system: "Naniten-Reparatursystem"
 tech_nanite_repair_system_desc: "Unter den noch rauchenden Überresten des Sammlers wurde ein hocheffektives System zur Selbstreparatur des Rumpfes gefunden, dass aus Milliarden von mikroskopisch kleiner Nanomaschinen besteht und für unsere eigenen Zwecke wiederverwendet werden konnte. Ob der Sammler dieses System selbst gestohlen hat oder ursprünglich damit gebaut wurde ist unbekannt."
 tech_neuroregeneration: "Neuralgeweberegeneration"
 tech_neuroregeneration_desc: "Wenn es auf das Genom einer Spezies zugeschnitten ist, hat dieses Neuralgewebe intensive neuroregenerative Eigenschaften, die die Entwicklung von Neuronen, Axonen und Synapsen in seinem Empfänger signifikant erhöhen."
 AUTO_REPAIR_2: "$tech_nanite_repair_system$"
 tech_nanite_autocannon: "Naniten-Autokanone"
 tech_nanite_autocannon_desc: "Eine hoch entwickelte Autokanone, die Granaten abschießt, um am Ziel eine Nanitenwolke freizusetzen, die Schilde durchdringen und Rumpfteile durchbohren kann."
