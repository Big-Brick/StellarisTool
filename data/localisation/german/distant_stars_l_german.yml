 distar.10956.name: "L-Cluster zum Greifen nahe"
 distar.10956.desc: "Unsere Spione berichten, dass §H[lgate_warning_country.GetName]§! fast ausreichend Informationen über L-Tore besitzt, um diejenigen zu entschlüsseln, die sie kontrollieren. Sollte dies geschehen, hätten sie Zugang zum L-Cluster und seinen Geheimnissen!\n\nWenn wir zuerst dorthin kommen möchten, müssen wir unsere Anstrengungen verdoppelt und mehr Erkenntnisse über L-Tore finden!"
 distar.10956.a: "Wir werden sehen, wer zuerst ankommen wird."
 graygoo.10.name: "Der Graue Sturm"
 graygoo.10.desc: "Unsere Techniker schafften es die Wartungsschleife des L-Tors in der Nähe von [candidate_gateway_system.GetName] aufzuheben, aber sobald eine permanente Verbindung zum L-Cluster aufgebaut war, wurde eine massive eingehende Subraumwelle entdeckt! Wir waren in der Lage diesen potenziellen Invasionstrupp daran zu hindern, unser Tor zu durchschreiten und konnten dabei den Zugang für uns selbst aufrechterhalten.\n\nBedauerlicherweise wurde die ankommende Welle zu den anderen L-Toren der Galaxie umgeleitet. Seltsame Schiffe die aus Naniten bestehen strömen jetzt durch die vollständig aktiven Toren und greifen alles in Sichtweite an!\n\nJegliche Versuche mit diesen Maschinen zu kommunizieren sind fehlgeschlagen. Im Zuge ihrer Durchreise durch die L-Tore haben wir außerdem eine sich wiederholende Subraumübertragung aus dem L-Cluster erhalten."
 graygoo.10.a: "Bringt die Nachricht auf den Bildschirm."
 graygoo.10.b.desc: "Unsere Techniker schafften es die Wartungsschleife des L-Tors in der Nähe von [candidate_gateway_system.GetName] aufzuheben, aber sobald eine permanente Verbindung zum L-Cluster aufgebaut war, wurde eine massive eingehende Subraumwelle entdeckt!\n\nSeltsame Schiffe, die aus Naniten bestehen, strömen jetzt durch das vollständig aktive Tor und greifen alles in Sichtweite an!\n\nAlle Kommunikationsversuche mit diesen Maschinen sind gescheitert. Im Zuge ihrer Durchreise durch das L-Tor haben wir eine sich wiederholende Subraumübertragung aus dem L-Cluster entdeckt."
 graygoo.11.desc: "Wissenschaftlern aus §H[From.GetName]§! gelang es die Funktionalität des L-Tores in ihrem Reich wiederherzustellen und waren damit schneller als wir. Leider scheint dies eine Invasion unserer Galaxie durch die Bewohner des Clusters ausgelöst zu haben, aggressive Nanomaschinen, die alles in Sichtweite angreifen!\n\nDie Wissenschaftler der [From.GetSpeciesNamePlural] schafften es ihr Tor zu schließen, bevor die Invasionsstreitmacht eintraf, aber dieser Vorgang lenkte sie einfach auf die anderen L-Tore der Galaxie ab, die jetzt auch vollständig aktiv sind!\n\nAlle Versuche mit den eindringenden Naniten zu kommunizieren sind gescheitert. Im Zuge ihrer Durchreise durch die L-Tore haben wir außerdem eine sich wiederholende Subraumübertragung aus dem L-Cluster erhalten."
 graygoo.12.desc: "§YDekodiere sich wiederholende automatische Subraumübertragung...\nEtabliere Übertragungsmatrix...§!\n\n§RWARNUNG:§! §YNachricht ist stark beschädigt.\n\nBeginne mit Wiederherstellung der Nachrichtenfragmente...§!\n§YDrei Nachrichtenfragmente konnten teilweise wiederhergestellt werden.§!"
 graygoo.12.a: "Zugriff auf Fragment I"
 graygoo.12.a.response: "§YDekodiere Fragment I:§!\n\n\"Wir sind die §Y<unverständlich>§!, die Architekten des galaxieweiten Sternennetzwerks. Wenn Ihr diese Nachricht erhaltet, können wir nur §Y<unverständlich>§!, dass es nicht zu spät ist. Vielleicht konnte eine unserer Nachrichtenbojen noch an §Y<unverständlich>§! vorbeikommen und entkam dem Cluster, bevor dieser abgeschottet wurde.\n\nReaktiviert §RAUF KEINEN FALL§! - ich wiederhole - §RAUF KEINEN FALL§! das ruhende Sternentor in unserem Sternencluster. Unter keinen Umständen darf eine stabile Verbindung zwischen §Y<unverständlich>§! und dem Rest der Galaxie hergestellt werden. Zum Schutz aller Zivilisationen muss unser Cluster unter permanenter Quarantäne bleiben."
 graygoo.12.b: "Zugriff auf Fragment II"
 graygoo.12.b.response: "§YDekodiere Fragment II:§!\n\n\"In einer Maßnahme, die unweigerlich unsere Zivilisation zerstören wird, haben wir unser Heimatcluster absichtlich isoliert, um die Ausbreitung der Naar-Di-Shav, dem §HGrauen Sturm§!, zu verhindern. Diese sich selbst replizierenden Nanomaschinen waren maßgeblich für den Aufbau unseres Sternen-Netzwerkes beteiligt, doch als ihre §Y<unverständlich>§! abgeschlossen war, haben wir festgestellt, dass sie unsere Befehle nicht mehr akzeptieren.\n\nMithilfe einer versteckten Hintertür konnte unser §Y<unverständlich>§! die Maschinen in unser Heimatcluster zurückrufen, aber diese Sicherheitslücke wurde seitdem behoben. Als sie anfingen unsere Planeten für Materialien zu ernten, wussten wir, dass es nur eine Frage der Zeit war...\""
 graygoo.12.c: "Zugriff auf Fragment III"
 graygoo.12.c.response: "§YDekodiere Fragment III:§!\n\n\"Die Haupt§Y<unverständlich>§!-Einrichtung ist der Schlüssel. Alle ihre §Y<unverständlich>§! werden durch das dortige Subraumarray geleitet und ohne es können sie nicht funktionieren. Bedauerlicherweise sind alle unser Versuche es zu deaktivieren gescheitert und wir wir können nicht länger die Kräfte aufbringen, um einen weiteren Angriff §Y<unverständlich>§!.\n\nWenn die Quarantäne unseres Clusters fehlgeschlagen ist, MÜSST Ihr diese Einrichtung zerstören. Solange sie §Y<unverständlich>§! bleibt, wird der Graue Sturm ungehindert durch die gesamte Galaxie wüten.\n\nEs... Es tut uns wirklich leid, diesen Horror entfesselt zu haben. In unserer Anmaßung dachten wir...\""
 graygoo.12.d: "Kommunikation beenden."
