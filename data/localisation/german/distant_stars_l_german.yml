 caretaker_leader: "$NAME_Caretaker$"
 caretaker_leader_desc: "Eine Maschine, die darauf spezialisiert ist, sich um andere zu kümmern. Die Misserfolge der Vergangenheit sind in ihrem Gedächtnis verankert."
 caretaker_leader_catch_phrase: "$distar.249.desc$"
 leader_trait_govenor_caretaker: "Aufseher"
 leader_trait_govenor_caretaker_desc: "Dieser Aufseher sorgt dafür, dass immer genug Nährstoffe zur Verfügung stehen, dass der Arbeitsplatz sauber ist und dass die Schutzbefohlenen ordentlich stimuliert werden."
 leader_trait_govenor_caretaker_node: "Aufseher-Lehren"
 leader_trait_govenor_caretaker_node_desc: "Das einzigartige Wissen des Aufsehers ist zu unserem eigenen geworden."
 ## l_english.yml
 trait_presapient_docile_livestock: "Fügsamer Viehbestand"
 trait_presapient_docile_livestock_desc: "§LFügsam und lecker. Die höheren Hirnfunktionen diese Spezies wurden so verändert, dass sie nur noch fügsames Vieh sind, das sich selbst versorgt und keine lästigen Bedürfnisse nach sozialer Interaktion oder Selbstbestimmung benötigt.§!"
 trait_brainslug: "Wirt einer Hirnschnecke"
