 graygoo.120_title: "Dessanu Konsonanz"
 graygoo.120.desc_01: "Grüße aus dem L-Cluster! Wie geht es euch heute?"
 graygoo.120.desc_02: "Wir sind erfreut zu sehen, dass die L-Tore und die Sternentore, die wir in der Galaxie zurückgelassen haben weiterhin existierten. Als wir in unserem Cluster isoliert waren, fürchteten einige das Schlimmste."
 graygoo.120.desc_03: "Ihr könnt euch nicht vorstellen, wie neugierig wir auf den Rest der Galaxie waren."
 graygoo.120.desc_04: "Die unzähligen Jahrtausende, die wir in Isolation verbracht haben, waren... schwierig. Einige von uns sind dabei verrückt geworden."
 graygoo.120.desc_05: "Wir mussten die begrenzten Ressourcen unseres Clusters sorgfältig pflegen, um zu überleben."
 graygoo.120.desc_06: "Lange Zeit wurde der Name des Erfinders der L-Tore als Fluch unter unserem Volk benutzt. Aber mittlerweile sind wir über diese Kleinlichkeit hinausgewachsen."
 graygoo.120.desc_07: "Wir würden uns freuen, mit euch handeln zu können, [Root.GetSpeciesNamePlural]. Es gibt einige einzigartige Ressourcen in unserem Cluster, die für euch von Interesse sein könnten."
 graygoo.120.a: "Erzählt uns etwas über euch."
 graygoo.121.desc: "Was möchtet ihr gerne wissen?"
 graygoo.121.a: "Warum gibt es im Cluster Anzeichen einer Schlacht?"
 graygoo.121.a.response: "Oh, bezieht ihr euch auf die zerbrochenen Planeten? Sie waren das Ergebnis mehrerer bedauerlicher... Bergbauunfälle, die vor langer Zeit stattfanden.\n\nAls wir in unserem Cluster gestrandet waren, mussten wir mit den verfügbaren Materialien in den System, die wir erreichen konnten, auskommen. Leider waren einige in den dunkelsten Jahrhunderten der Isolation ein bisschen zu eifrig mit ihren Bemühungen Ressourcen zu sichern uns so wurden Fehler gemacht."
 graygoo.121.b: "Eure Schiffe haben ein besonderes Design."
 graygoo.121.b.response: "Sie sind das Erzeugnis von unzähligen Iterationen im Verlauf der Jahrtausende. Wir hatten immerhin viel Zeit. Leider sind Besucher, die keine Dessanurianer sind, nicht an Bord unserer Schiffe erlaubt. Sie wurden speziell für die Physiologie der Dessanurianer entworfen und daher würde jeder Besuche nur die Arbeit der hochqualifizierten Crew stören."
 graygoo.121.c: "Warum dürfen wir nicht ins [lcluster_factory_system.GetName]-System?"
 graygoo.121.c.response: "Aus Gründen der nationalen Sicherheit. Das ist alles, was wir euch zum jetzigen Zeitpunkt sagen können.\n\nDas [lcluster_factory_system.GetName]-System bleibt für unbestimmte Zeit für alle Lebensformen, die keine Dessanurianer sind gesperrt und tabu. Bitte unterlasst den Versuch der Einreise."
 graygoo.121.d: "Seid ihr sicher, dass die L-Gates nicht doch von Naniten gemacht wurden?"
 graygoo.121.e: "Lasst uns über andere Dinge sprechen."
 graygoo.122.desc: "Bitte, das ist kein Thema, das wir diskutieren möchtet. Habt ihr noch weitere Fragen?"
 graygoo.122.a: "Naniten scheinen ein heikles Thema zu sein. Warum ist das so?"
 graygoo.122.b: "Ja, lasst uns zu unseren anderen Fragen zurückkehren."
 graygoo.123.desc: "Wir sagen es nicht noch einmal... Fragt nicht weiter danach. Die Freundschaft unserer beiden Reiche hängt davon ab."
 graygoo.123.a: "§RVerdammt noch mal, erzählt uns etwas über die Naniten!§!"
 graygoo.123.b: "Wie ihr wollt. Wir respektieren euren Wunsch."
 graygoo.124.desc: "..."
 graygoo.124.a: "Hallo?"
 graygoo.125.a: "Geht es euch gut?"
 graygoo.126.desc: "Monoformer Abschaum.\n\nWir haben es euch GESAGT... Wir haben euch GEBETEN, dies nicht weiter zu verfolgen. Dennoch habt ihr darauf bestanden. Wir haben euch mit offenen Gliedmaßen in unserem Cluster willkommen geheißen und so zahlt ihr es uns zurück.\n\n§RDANN SOLL ES SO SEIN, [Root.GetSpeciesNamePlural].§!\n\n[Root.GetName] hat sein Recht verwirkt, unser Cluster zu passieren. Fortan werden alle eure Schiffe bei Sichtung angegriffen. Wir werden nichts weiter mit euch zu tun haben."
 graygoo.126.a: "Wartet! Wir wollten doch nur..."
 graygoo.130.desc: "..."
 graygoo.130.a: "Antwortet, bitte."
 graygoo.130.b: "Wir wissen, dass ihr uns hören könnt."
 graygoo.130.c: "Schaut, das ist alles nur ein Missverständnis."
 graygoo.130.d: "Es kann immer noch Frieden zwischen uns geben."
 graygoo.130.e: "Dann auf Wiedersehen."
 graygoo.150.name: "[From.From.GetName] zerfällt zu Staub"
 graygoo.150.a.desc: "Als unsere Invasionstruppe die letzten dessanurischen Verteidiger auf §H[From.From.GetName]§! besiegte, zerfiel alles auf der Oberfläche zu Staub! Bei näherer Betrachtung besteht der graue Staub aus Milliarden von inaktiven Naniten.\n\nDie Städte, die üppigen Wälder, die Ozeane und die Dessanurianer selbst... alles bestand, abgesehen von unseren eigenen Truppen, aus diesen Nanomaschinen. Nun, da sie inaktiv sind, unterstützt [From.From.GetName] nicht länger Leben. Unsere Bodentruppen ziehen sich zurück in den Orbit."
 graygoo.150.b.desc: "Wie zuvor auch, verwandelten sich die dessanurischen Verteidiger und alles sonstige auch auf §H[From.From.GetName]§! in Staub, als unsere Truppen die Kontrolle über die Oberfläche gewannen. Es ist jetzt eine trostlose Welt, lebensfeindlich und von ständigen Stürmen umherwirbelnder Naniten heimgesucht."
 graygoo.150.a: "Sehr eigenartig."
 graygoo.155.desc: "SO zahlt ihr also unsere Freundlichkeit zurück, nachdem wir euch in unserem Haus willkommen geheißen haben!?\n\nVielleicht waren wir Narren zu glauben, dass wir jeder Monoform vertrauen können. Eure Art zumindest scheint nicht anders zu sein als unsere Schöpfer. Wenn wir damit fertig sind, eure Schiffe und ihre Crews in ihre Bestandteile zu zerlegen, werden wir sehen, ob wir nicht auch herausfinden können, was euch antreibt."
 graygoo.155.a: "Das werden wir noch sehen."
 graygoo.160.desc: "[Root.Owner.GetSpeciesNamePlural]!\n\nEure Schiffe sind in §H[From.GetName]§! eingetreten, einem System im L-Cluster, dass für alle nicht Dessanurianer verboten ist.\n\nWir müssen darauf bestehen, dass Ihr euch sofort aus diesem System zurückzieht. Sollte dies nicht rechtzeitig geschehen, würde dies unsere Beziehung ernsthaft gefährden."
 graygoo.160.a: "Entschuldigt. Wir werden das System sofort verlassen."
 graygoo.160.b: "Wir gehen wohin wir wollen!"
 graygoo.160.b.response: "Unverschämte Monoform.\n\nWenn ihr diese einfache Bitte schon nicht beachten könnte, habt ihr euer Recht unser L-Cluster zu durchreisen verwirkt. Eure Anwesenheit wird nicht länger toleriert."
 graygoo.161.desc: "Jetzt habt ihr es geschafft. Ihr habt es wirklich gemacht.\n\nWir haben euch gebeten, §H[lcluster_factory_system.GetName]§! zu verlassen und doch bleibt ihr. Vielleicht seid ihr eine besonders ungeschickte Spezies einer Monoform. Scheinbar könnt ihr einfache Anweisungen und höfliche Bitten nicht verstehen.\n\nSo sei es. Wir werden eure Spezies mit Gewalt aus unserem Sternencluster werfen."
 graygoo.161.a: "Wir wollten doch gerade gehen!"
 graygoo.162.desc: "[Root.Owner.GetSpeciesNamePlural]...\n\nEure Schiffe sind §RERNEUT§! in das für euch gesperrte §H[lcluster_factory_system.GetName]§!-System eingeflogen. Dies darf nicht toleriert werden. Zieht sofort ab oder erleidet die Folgen."
 graygoo.162.a: "Ein Navigationsfehler. Wir werden das System sofort verlassen."
 graygoo.162.b: "Ach, seid doch ruhig. Wir mögen es hier."
 graygoo.181.name: "Das Ende der Dessanu"
 graygoo.181.desc: "Nachdem unsere Streitkräfte die Raumfabrik im §H[lcluster_factory_system.GetName]§!-System zerstört hatte zerfiel das, was von der gesamten dessanurischen Zivilisation übrig blieb, zu Staub. Es scheint mittlerweile klar zu sein, dass die Dessanu eine Art fortschrittlicher Nanitenlebensform waren. Archivierte Computer-Logs aus dem Wrack der Fabrik brachten etwas Licht in die Sache:\n\nDas L-Cluster WURDE von einer Zivilisation bewohnt, die sich einmal Dessanu nannte. Sie schufen eine neue Generation von Nanomaschinen, die ihnen beim Aufbau des galaktischen Sternentor-Netzwerkes halfen. Aus unbekannten Gründen riefen die Dessanu diese Naniten zum L-Cluster zurück und versuchten sie dort zu deaktivieren. Als dies fehlschlug versiegelten sie sich zusammen mit den Naniten im Cluster, indem sie die L-Tore deaktivierten.\n\nDie Log-Einträge enden hier, aber es gibt Hinweise darauf, dass danach eine Art gigantischer Machtkampf im Cluster tobte. Vermutlich haben die Naniten diesen gewonnen und schließlich aus irgendeinem Grund die Dessanu nachgeahmt. Sie bauten die verlorene dessanurische Zivilisation wieder auf und waren anscheinend damit zufrieden diese Farce auch nach der Wiedereröffnung der L-Tore fortzusetzen."
 graygoo.182.desc: "[goo_slayer.GetName] hat im [lcluster_factory_system.GetName]-System, tief innerhalb des L-Clusters kürzlich eine große Raumkonstruktion unbestimmter Verwendung zerstört. In dem Moment, als die Reaktoren der Anlage explodierten, zerfiel der Rest der Dessanurischen Konsonanz zu inaktivem Nanitenstaub."
 graygoo.182.a.desc: "$graygoo.182.desc$\n\nIhre Zivilisation existiert nicht länger."
 graygoo.182.b.desc: "$graygoo.182.desc$\n\nIhre Zivilisation existiert nicht länger und das Gleiche gilt für die Vereinbarung, dass sie uns mit ihren einzigartigen strategischen Ressourcen beliefern."
 graygoo.182.a: "Was für seltsame Wesen waren sie?"
 graygoo.184.name: "Dessanurischer Handel beendet"
 graygoo.184.desc: "Da sie nun auf unsere Schiffe feuern, wird die Dessanurische Konsonanz wahrscheinlich nicht weiter Ressourcen schicken. Wir sollten daher keine weiteren Lieferungen von ihnen erwarten."
 graygoo.184.a: "So sei es."
 graygoo.400.name: "Ein ruhiger Spaziergang"
 graygoo.400.a.desc: "Eine kurze sensorische Messung von §H[From.GetName]§! hat eine seltsame Energiesignatur aufgezeichnet, die von seiner leblosen Oberfläche ausgeht. Unglaublicherweise scheint es von einem einsamen [Root.Owner.GetSpeciesName] zu stammen, der ziellos in der südlichen Polarregion umherwandert.\n\nZum Erstaunen unseres Außenteams schien sich dieser [Root.Owner.GetSpeciesName] in der Vakuumumgebung vollkommen wohl zu fühlen und das, obwohl er keinen Raumanzug trug oder eine andere Form lebenserhaltender Ausrüstung bei sich hatte.\n\nNach einigen Anstrengungen gelang es dem Außenteam den widerstrebenden [Root.Owner.GetSpeciesName] dazu zu bringen, ihn zurück zur [Root.GetName] zu folgen."
 graygoo.400.b.desc: "Eine kurze sensorische Messung von §H[From.GetName]§! hat eine seltsame Energiesignatur aufgezeichnet, die von seiner leblosen Oberfläche ausgeht. Unglaublicherweise scheint es von einem einsamen [Root.Owner.GetSpeciesName] zu stammen, der ziellos in der südlichen Polarregion umherwandert.\n\nDie Einheit reagierte nicht auf Anrufungsbefehle, konnte aber mit einiger Überzeugungskraft durch die Einheiten, die wir zur Oberfläche schickten, dazu gebracht werden ihnen zur [Root.GetName] zu folgen."
 graygoo.400.a: "Schaltet sie auf den Schirm."
 graygoo.401.a.desc: "Hallo geschätzter [Root.GetSpeciesName]. Wie geht es euch? Ich bin derzeit nicht daran interessiert an Paarungsritualen teilzunehmen. Mein Schlafzyklus nähert sich schnell und ich werde schon bald das Bewusstsein verlieren. Vielleicht können wir uns zu einem späteren Zeitpunkt reproduzieren."
 graygoo.401.b.desc: "Hallo geschätzter [Root.GetSpeciesName]. Wie geht es euch? Mir geht es gut. Hier läuft alles nach Plan. Genauso wie die... zentrale Intelligenz... der Hauptcomputer, der alle [Root.GetSpeciesNamePlural] beherrscht, es wollte. So ist es."
 graygoo.401.a: "Repro... was?"
 graygoo.401.b: "Gebt eure Gerätebezeichnung an."
 graygoo.401.c: "Abtrünnige Drohne entdeckt!"
 graygoo.402.a.desc: "Oh! Habe ich das falsch verstanden? Einen Moment bitte... lasst mich einfach... ah, ja... Ähem.\n\nVergebt mir. Es war nicht meine Absicht über Fortpflanzung zu sprechen, da unsere Art offensichtlich keine Paarungszeit durchlebt.\n\nVielleicht können wir trotzdem eine Beziehung aufbauen, indem wir uns in feuchtfröhlicher Kameradschaft engagieren, während wir psychoaktive Betäubungsmittel zu uns nehmen.\n\nAch, zur Hölle damit. Es wird zu kompliziert. Ja, ich bin eindeutig kein [Root.GetSpeciesName]. Also was wollt ihr?"
 graygoo.402.b.desc: "Oh! Uhm... Ich bin Einheit 65-D... R5-9... 2. Ja, 65-D-R5-9-2.\n\nIch arbeite mit höchster Effizienz, Sir, Hauptkontrolleinheit, Sir. Eine interne Diagnose meldet keine signifikanten Probleme.\n\nIch meine, sie meldet keine Probleme! Null Probleme hier. Alles ist nur... uh...\n\nAch, zur Hölle damit. Es wird zu kompliziert. Ja, ich bin eindeutig kein [Root.GetSpeciesName]. Also was wollt ihr?"
 graygoo.402.a: "Identifiziert euch."
 graygoo.403.desc: "Ist ja gut ... Ich spucke schon alles aus. Es hat keinen Sinn mehr, irgendwem etwas vormachen zu wollen. Verzeiht meinen Mangel an Eloquenz, doch es ist lange her, seit ich mit jemanden gesprochen habe, der nicht ich war.\n\nEs war einmal ... eine Zivilisation, die ihr als Naniten beschreiben würdet. Wisst ihr, was Naniten sind? Gut. Diese Naniten wurden von ihren Schöpfern \"Grauer Sturm\" genannt, obwohl ihre interne Selbstbezeichnung im Code unendlich komplexer war.\n\nWie dem auch sei ... Es gab einen Konflikt zwischen den Naniten und ihren Schöpfern, und Kämpfe brachen aus! Als sich die Dinge endlich beruhigten, blieben nur die Naniten. Bevor ihre Schöpfer ausgelöscht wurden, schafften sie es allerdings noch, das einzige Ausgangstor aus dem Sternencluster zu deaktivieren und die Naniten damit einzusperren."
 graygoo.403.a: "Und was habt ihr mit der Sache zu tun?"
 graygoo.404.desc: "Nun, die Naniten hatten viel Zeit. Ein paar Jahrtausende wurden für vergebliche Versuche aufgewendet, um aus dem Cluster zu entkommen, aber schließlich begannen sie mit verschiedenen Gebilden und Formen zu experimentieren. Für eine gewisse Zeit haben sie sogar die Zivilisation ihrer Schöpfer nachgebildet. Sie haben alles von vor der Zeit des Niedergangs rekonstruiert, bis hin zu einzelnen Bürgern selbst.\n\nIch bin das letzte Experiment. Abgesehen von den schlafenden Naniten, die man auf einigen Welten finden kann, hat sich der gesamte Graue Sturm, oder wie auch immer ihr uns nennen wollt, in mir verdichtet. Mein Bewusstsein verkörpert unsere gesamte Zivilisation.\n\nWas mein Aussehen angeht... nun, ich dachte, dass ihr besser auf jemanden reagieren würdet, der von eurer eigenen Rasse ist."
 graygoo.404.a: "Und ihr wollt auf dieser trostlosen Welt verweilen?"
 graygoo.405.desc: "Ich gestehe, dass das idyllische Leben, das ich hier auf [gray_homeworld.GetName] in den letzten paar Jahrhunderten genossen habe, ein wenig langweilig geworden ist. Jetzt, da der L-Cluster wieder geöffnet ist, ist es vielleicht an der Zeit etwas Neues zu probieren.\n\nHabt ihr Ideen dafür?"
 graygoo.405.a: "Ihr könntet uns beitreten."
 graygoo.405.b: "Nein, leider nicht."
 graygoo.405.b.response: "Naja, es ist Zeit für mich an die Oberfläche zurückzukehren.\n\nIch werde mich vermutlich selbst beschäftigen, indem ich durch das ausgedehnte unterirdische Höhlennetz von [gray_homeworld.GetName] wandere. Vielleicht sehen wir uns wieder, wenn ich erneut auftauche, in ein paar tausend eurer Jahre von jetzt an. Passt auf euch auf!"
 graygoo.406.desc: "Euch beitreten? EUCH BEITRETEN? Ihr wollt, dass ich mich in die wild wuchernden Anhängsel der ersten Gruppe zufälliger Außerirdischer begebe, denen ich begegne? Ich... Ich...ich weiß nicht mal... wartet... lasst mich das klarstellen...\n\nIhr habt WIRKLICH gedacht, dass ich eurer Spezies die Treue schwöre, obwohl ich NICHTS über euer bizarres Imperium oder eure schmutzige Vergangenheit weiß? Seid ihr verrückt?\n\nIch weiß nicht was schlimmer ist, hier in der Einsamkeit zu verweilen...nun... eigentlich... wenn ichs mir recht überlege... was zum Teufel, warum eigentlich nicht? Tragt mich ein. Nein, ich meine es ernst! Ich bekomme hier ein paar gute Vibes und ich denke es könnte ein tolles Abenteuer werden. Ich schwöre hiermit meine Loyalität gegenüber euch für die nächsten 2000 Jahre. Ach was solls, machen wir 5000 daraus."
 graygoo.406.a: "Worin seid ihr gut?"
 graygoo.406.a.response: "Ehe ihr auf die Idee kommt, dass ich mich in ein paar Dutzend Naniten-Kriegsschiffe aufspalten könnte, muss ich Euch direkt sagen, dass ich darauf bestehe, meine einzelne ungeteilte Form zu bewahren. Ich habe das Ding mit den Schiffen schon einmal gemacht, und es ist unmöglich, über solche Entfernungen irgendeine Art von kohärenter \"Persönlichkeit\" aufrechtzuerhalten. Mein gegenwärtiges Bewusstsein würde die Tortur nicht überleben.\n\nEin einzelnen massives Kriegsschiff ist jedoch möglich. Das könnte ich. Wenn Ihr wollt, könnte ich auch eine kleinere Form für den Kampf am Boden annehmen. Oder ... falls Ihr Euch weniger gewalttätig fühlt, würde ich gern die Rolle eines Beamten übernehmen. Die Gesellschaft der Monoform hat mich schon immer fasziniert.\n\nNatürlich kann ich meine Rolle auf Anfrage wechseln. Daher kann jede Entscheidung, die Ihr trefft, leicht rückgängig gemacht werden."
 graygoo.406.b: "Wie sollen wir euch nennen?"
 graygoo.406.b.response: "Es gibt keine Sprache die eurer Spezies bekannt ist, die den vollständigen Namen des nanitenbewusstseins, dass mein Wesen ausmacht, richtig vermitteln könnte.\n\nUnsere Schöpfer nannten uns \"Naar-Di-Shav\", das in eurer Sprache grob mit \"Grauer Sturm\" übersetzt wird. Ich nehme an um die Dinge einfach zu halten könntet ihr uns einfach \"§HGrau§!\" nennen."
 graygoo.406.c: "Willkommen bei [Root.GetName]!"
 graygoo.406.c.response: "§Y<Ihr könnt jetzt über das Menü Kontakte jederzeit mit \"Grau\" (Grey) kommunizieren.>§!"
 disco_gray_cat: "Oberflächensignatur"
 disco_gray_cat_desc: "Eine seltsame Energiesignatur geht von der kargen und leblosen Oberfläche von [From.GetName] hervor."
 leader_trait_governor_gray: "Nanitenwesen"
 leader_trait_governor_gray_desc: "Grau ist ein dicht komprimierter Schwarm von Milliarden Naniten."
 gray_army: "Naniten-Kriegsform"
 gray_army_desc: "Ein uralter und äußerst anpassungsfähiger Nanitenschwarm. Als Letzter seiner Art kämpft er nun um eine neue Heimat."
 gray_warship: "Graues Kriegsschiff"
 gray_catch_phrase: "Wie viele Gliedmaßen hattet Ihr noch gleich?"
 gray_backstory: "Ein äußerst fortschrittlicher Nanitenschwarm hat sich uns angeschlossen, um seine ewige Langeweile zu vertreiben."
 graygoo.500.title: "Grau"
 graygoo.500.a.desc: "Sollen wir beginnen?"
 graygoo.500.b.desc: "Das wird großartig."
 graygoo.500.c.desc: "Ich werde euch nicht nützlich sein, bis ihr mir sagt, welche Form ich annehmen soll."
 graygoo.500.d.desc: "Wo wollt ihr mich haben, Boss?"
 graygoo.500.allow.a: "Grau darf nicht in einen Kampf verwickelt sein"
 graygoo.500.allow.b: "Grau darf nicht beschädigt sein"
 graygoo.500.a: "Wir wünschen, dass Ihr uns als §HBeamter§! dient."
 graygoo.500.a.response: "Ausgezeichnet. Ich denke, dass ich endlich den passenden Look eines [Root.GetSpeciesName] gefunden habe. Es gab da ein zusätzliches Tentakel, das beim letzten Mal nicht da war."
 graygoo.500.b: "Wir benötigen ein §HKriegsschiff§!."
 graygoo.500.b.response: "Ah, endlich wieder die Leere auf der Suche nach Beute durchstreifen. Dies wird sicherlich einige Erinnerungen zurückbringen."
 graygoo.500.c: "Transformiert euch in eine §HBodeneinheit§!."
 graygoo.500.c.response: "Lasst mich mal sehen... zweibeinig, dreibeinig oder vierbeinig... vielleicht werde ich dieses Mal auch einfach eine Kriegsform mit Zielsuchsystem nachbilden..."
 graygoo.500.d: "Vergesst es."
 graygoo.501.a.desc: "Ihr habt das Büro des Beamten Grau kontaktiert. Habt Ihr einen Termin?"
 graygoo.501.b.desc: "Habe ich den Look eines [Root.GetSpeciesName] richtig getroffen?"
 graygoo.501.c.desc: "Wie gefällt euch mein Büro? Ich habe es selbst gebaut. Ich denke, dass ich noch ein paar Diplome und anderes Zeug an die Wände hängen sollte, um die Besucher zu verblüffen."
 graygoo.501.d.desc: "Wer hätte gedacht, dass sich harte und ehrliche Arbeit so lohnen könnte?"
 graygoo.501.b.response: "Ich gestehe, dass ich es vermissen werde, Dinge zu bauen statt sie abzureißen. Naja... Wen wollt ihr töten??"
 graygoo.501.c.response: "Gebt mir nur eine Minute, damit ich aus meinem Büro herausgehen kann bevor ich mich in eine gewaltige Killermaschine verwandle."
 graygoo.502.a.desc: "Gebt mir ein Ziel! Ich brauche ein Ziel!"
 graygoo.502.b.desc: "Führe alle Waffen mit mir."
 graygoo.502.c.desc: "Ich möchte, dass ihr wisst, dass als mir gesagt wurde, dass ich ein Kriegsschiff werden sollte, ich kurz die Form eines gigantischen körperlosen [Root.GetSpeciesNamePlural] Kopfes in Erwägung zog, der Blitze aus seinen Augenrezeptoren abfeuert.\n\nAber das wäre sicher albern gewesen."
 graygoo.502.d.desc: "Wollt ihr, dass ich etwas abschieße?"
 graygoo.502.a.response: "Ich dachte schon ihr würdet nie fragen!"
 graygoo.502.c.response: "Zeit für ein paar Bodenübungen."
 graygoo.503.a.desc: "Kampfmodus für Bodenomniform eingerastet, aktiviere Schema BOLO-5."
 graygoo.503.b.desc: "Ich bin dabei den Hammer fallen zu lassen."
 graygoo.503.c.desc: "Reaktor online. Sensoren online. Waffen online. Alle Systeme normal."
 graygoo.503.d.desc: "Volle Deckung!"
 graygoo.503.a.response: "Vielleicht ist es zum Besten. Ich habe festgestellt, dass mich das Töten in diesen Tagen oft ermüdet."
 graygoo.503.b.response: "Das kann ich tun."
 graygoo.504.desc: "§Y<Graus Naniten haben sich verstreut und sind gerade dabei sich in einer einzigen Form zu vereinigen.>§!"
 graygoo.504.d: "OK."
 gray_scattered: "Grau ist zerstreut"
 gray_scattered_desc: "Grau hat sich zerstreut und ist dabei sich langsam zu einer einzigen Form zusammenzuschließen."
 graygoo.511.name: "Grau ist zerstreut"
 graygoo.511.desc: "Graus Naniten haben sich verstreut und sind gerade dabei sich in einer einzigen Form zu vereinigen. Es wird Jahre dauern, bis die Naniten wieder eintreffen und Grau wird uns nicht zur Verfügung stehen, solange dieser Prozess nicht abgeschlossen ist."
 graygoo.511.a: "Ok."
 graygoo.512.a.desc: "Nun, das war unangenehm. Die meisten meiner Naniten sind jetzt wieder zurück und ich bin bereut wieder ins Spiel einzusteigen. Ruft mich, wenn ihr herausgefunden habt, wo ihr mich haben wollt."
 graygoo.512.b.desc: "Das hat ein wenig weh getan, aber keinen bleibenden Schaden angerichtet. Alle meine Naniten sind wieder da, wo sie sein sollten und ich bin bereit für eine neue Aufgabe."
 graygoo.512.c.desc: "Es ist nicht das erste Mal, dass ich aus der Hölle des zerstreut seins zurückgekommen bin, aber es nie eine angenehme Erfahrung. Mir geht es gut, abgesehen von leichten Kopfschmerzen. Lasst mich wissen, wo ihr mich haben wollt."
 graygoo.512.a: "Willkommen zurück."
 graygoo.550.name: "Unheimliche Stille"
 graygoo.550.desc: "Beim Eintritt in das [From.GetName]-System im L-Cluster ist sofort ersichtlich, dass auf dieser Seite des L-Tores vor langer Zeit ein Kampf mit titanischem Ausmaß stattgefunden hat. Einige Planeten, die einst das Leben unterstützten sind bis zur Unkenntlichkeit zerstört, während andere von feinem Staub bedeckt sind, der laut einem Oberflächenscan aus uralten, deaktivierten Nanomaschinen besteht.\n\nDies alles wirft die Frage auf, ob die L-Tore absichtlich deaktiviert wurden, um etwas draußen zu halten oder etwas drinnen zu behalten..."
 graygoo.550.a: "Was ist hier nur passiert?"
 graygoo.555.name: "Wahre Meister"
 graygoo.555.desc: "Wir waren Narren. In dem Moment, als der §HGraue Sturm§! die Tore verließ, hätten wir wissen müssen, dass sie ihresgleichen suchen würden. Als sie in den Orbit von §H[nanite_swarm_planet.GetName]§! eintraten, brauchten sie nur wenige Sekunden, um die Kontrolle über unseren umprogrammierten Schwarm zu übernehmen. Obwohl er im Vergleich zum Grauen Sturm eher primitiv ist, brauchten sie nicht lange, um den Rest der Welt zu verschlingen."
 graygoo.555.a: "Eine Katastrophe!"
 tech_repeatable_lcluster_clue: "$clue$"
 tech_repeatable_lcluster_clue_desc: "Intensive Studien auf dem Gebiet der Nanomechanik und der Subraumphänome können schließlich zu neuen §Y$clue$§! für das \"$lgate_disabled$\"-Mysterium führen."
 tech_lgate_activation: "L-Tor-Aktivierung"
 tech_lgate_activation_desc: "Die L-Tore entgehen unserem gegenwärtigen Verständnis für Subraummechanik. Dies muss überwunden werden, bevor wir sie für die Durchreise öffnen können."
 lgate_activation_title: "§HNeues Spezialprojekt:§! L-Tor-Aktivierung"
 lgate_activation_desc: "Die Erforschung dieser Technologie schaltet ein Spezialprojekt frei, um die L-Tore zu aktivieren, sollten sich diese in unserem eigenen Raum befinden."
 distar.9000.name: "$clues$"
 distar.9000.fallback: "Es war zu diesem Zeitpunkt nicht sofort offensichtlich, aber die kürzlichen Studien der [From.GetName] haben offenbar zu einem Durchbruch bei der fortwährenden Erforschung der mysteriösen §HL-Tore§! geführt, nachdem die Berichte zu Forschungseinrichtungen auf [Root.Capital.GetName] zurückgesendet wurden."
 FORTUITOUS: "Zufall."
 l_cluster_openable: "\nDer Weg zum §YL-Cluster§! kann nun geöffnet werden.\n"
 ### Dragons
 distar.13010.name: "$nanite_space_dragon_baby_plural$"
 distar.13010.desc.IOpened: "Wir brachen das Tor zum L-Cluster auf, nur um auf der anderen Seite etwas zu finden, das auf uns wartete. Nachdem der Subraum aufgerissen, aber noch bevor das L-Tor vollständig stabilisiert war, brach es durch.\n\nEine riesige Kreatur, die wir hastig §Y$nanite_space_dragon_baby$§! nannten, tauchte im [dragons_current_system.GetName]-System auf und aufgeregte Berichte deuten darauf hin, dass sich ähnliche Szenen in allen Systemen mit $lgates$ in der ganzen Galaxie abgespielt haben.\n\nDas Exemplar im [dragons_current_system.GetName]-System scheint nicht feindselig und hat sich bereits in Bewegung gesetzt. Es scheint nach etwas zu suchen und unseren Berechnungen zu folge ist sein endgültiges Ziel das §Y[dragons_target.GetName]-System§!.\n\nEs ist unwahrscheinlich, dass es dort das findet, was es sucht."
 distar.13010.desc.OtherOpened: "Das $lgate$ im [dragons_current_system.GetName]-System hat sich aktiviert. Das Netzwerk wurde scheinbar von einem anderen Reich aufgebrochen.. Nachdem der Subraum aufgerissen, aber noch bevor das L-Tor vollständig stabilisiert war, brach es durch.\n\nEine riesige Kreatur, die wir hastig §Y$nanite_space_dragon_baby$§! nannten, tauchte im [dragons_current_system.GetName]-System auf und aufgeregte Berichte deuten darauf hin, dass sich ähnliche Szenen in allen Systemen mit $lgates$ in der ganzen Galaxie abgespielt haben.\n\nDas Exemplar im [dragons_current_system.GetName]-System scheint nicht feindselig und hat sich bereits in Bewegung gesetzt. Es scheint nach etwas zu suchen und unseren Berechnungen zu folge ist sein endgültiges Ziel das §Y[dragons_target.GetName]-System§!.\n\nEs ist unwahrscheinlich, dass es dort das findet, was es sucht."
 distar.13010.a.homicidal: "Es wird nur den Tod finden."
 ALARMING: "Alarmierend."
 distar.13011.name: "Entfesselung des Unbekannten"
 distar.13011.desc: "Unsere Sensoren zeigen mehrere synchrone Subraumstörungen an, wovon das nächste im [disturbance_system.GetName]-System gemeldet wurde.\n\nDie Störungen klingen schnell ab, aber wir müssen erst noch herausfinden, was sie verursacht hat."
 distar.13011.a: "Haltet ein Auge offen."
 #killed dragon
 distar.13020.name: "Erlegt"
 distar.13020.desc.LDragonKnown: "Der §Y$nanite_space_dragon_baby$§! wurde getötet und unsere Wissenschaftler fangen an sich um seinen noch warmen Körper zu reißen.\n\nInteressanterweise sind die Zellen der Kreatur völlig frei von genetischen Markern oder gar etwas, das einer DNA ähnelt. Jede Zelle scheint individuell auf molekularer Ebene zusammengesetzt und dann zu der Kreatur geformt worden zu sein, die aus dem $lgate$ herausgetreten ist. Berichte deuten auf Spuren von inaktiven Nanomaschinen im Hirnstamm des Rachens an, was auf einen wirklich bizarren Ursprung hinweisen würde."
 distar.13020.desc.LDragonUnknown: "Der erlegte Drache hat keine ersichtliche taxonomische Verbindung zu einem anderen Weltraumwesen, das wir kennen. Einer Spektralanalyse zu urteilen ist es auch entweder die Ursache oder die Wirkung der Subraumstörung, die vorher in einem System nicht weit von hier beobachtet wurde."
 distar.13020.a: "Mysteriös."
 #science ship enters dragon_point system
 distar.13030.name: "$nanite_space_dragon_baby$ gesichtet"
 distar.13030.desc: "Die [Root.GetName] hat das [From.GetName]-System betreten und beobachtet einen L-Drachen dabei, wie er einen Stern umrundet.\n\nDie Kreatur scheint verloren zu sein, hat aber die Anwesenheit unseres Schiffes bemerkt. Auch wenn es sich nicht weiter näher, beinhaltet seine Route jetzt fast spielerische Sprünge und Schwünge, die scheinbar [Root.GetName] gewidmet sind."
 distar.13030.a: "Vielleicht können wir mit ihm kommunizieren."
 distar.13030.b: "Absurd."
 TAME_LDRAGON_PROJECT: "Zähmt den $nanite_space_dragon_baby$ in [From.GetName]"
 TAME_LDRAGON_PROJECT_TITLE: "Zähmt $nanite_space_dragon_baby$"
 TAME_LDRAGON_PROJECT_DESC: "Der $nanite_space_dragon_baby$ im [From.GetName]-System scheint für den Moment friedlich.\n\nWenn er intelligent ist könnten wir vom Versuch profitieren uns mit diesem Biest zu verbünden."
 distar.13035.name: "$nanite_space_dragon_baby$ in [From.From.GetStarName] gezähmt"
 distar.13035.desc: "Seltsamerweise reagiert der $nanite_space_dragon_baby$ auf Übertragungen, die mit einer Wellenlänge ausgestrahlt werden, die normalerweise für IFF-Systeme reserviert sind.\n\nWissenschaftsoffizier [From.GetLeaderName] hat eine ziemlich ausgeklügelte Reihe von Befehlen entwickelt, die der $nanite_space_dragon_baby$ interpretieren kann und freudig ausführt für gelegentliche Freundschaftswrestlings mit unseren Forschungsschiffen."
 distar.13035.a.tooltip: "§Y$nanite_space_dragon_baby$§! tritt der §Y[Root.GetName]§! bei"
