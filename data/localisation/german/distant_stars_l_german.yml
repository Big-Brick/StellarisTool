 distar.56.desc: "Wir haben die Fähigkeit entwickelt, die Grenzen von Raum und Zeit zu überschreiten und schneller als die Lichtgeschwindigkeit zu reisen. Dennoch können wir uns nicht für einen Namen für diese Amöbe entscheiden.\n\nDies ist unsere letzte Chance."
