 ####################################
 mineral_mapping: "Mineralien-Kartierung"
 mineral_mapping_desc: "Ein System mit dem man unterirdisches Gelände und die darin enthaltenen Mineralien schnell kartografieren kann."
 disregard_for_alien_life: "Geringschätzung von Alien-Leben"
 disregard_for_alien_life_desc: "Handelte auf eine Weise, die sich nicht für jemand Xenophilen gebührt, ohne Rücksicht auf außerirdisches Leben und die Artenvielfalt der Galaxie."
 ####################################
