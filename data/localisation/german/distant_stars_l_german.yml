 AMOEBAS_PROJECT: "Studium der Weltraumamöben"
 AMOEBAS_PROJECT_DESC: "$AMOEBAS_1_PROJECT_DESC$"
 AMOEBAS_PACIFICATION_PROJECT: "Befriedung der Amöben"
 AMOEBAS_PACIFICATION_PROJECT_DESC: "Etwas an unseren Flotten scheint die Weltraumamöben zu verärgern. Wenn wir isolieren könnten, was genau es ist, könnten wir die Aggression der Amöben nutzen oder möglicherweise unsere Schiffe vollständig vor ihnen verstecken."
 CLOUDS_PROJECT: "Studium der Wolken"
 CLOUDS_PROJECT_DESC: "$CLOUDS_1_PROJECT_DESC$"
 crystal_hunting_buff: "Kristalljäger"
 crystal_hunting_buff_desc: "Die zerstörten Überreste von Kristallwesen werden automatisch nach dem Kampf geborgen und bringen £minerals£ §G500§! für jede zerstörte Flotte."
 crystal_focus: "Kristallfokus"
 crystal_focus_desc: "Verbesserte Übertragungsmedien, die den einzigartigen Strukturen der Kristallwesen nachempfunden sind, minimieren den Verlust bei der Energieerzeugung und Verteilung durch Widerstände."
 pacified_crystals: "Befriedung der Kristallwesen"
 pacified_crystals_desc: "Kurzwellenübertragungen bei bestimmten Frequenzen tarnen unsere Flotten als Kristallwesen, wodurch diese uns nicht länger als Bedrohung ansehen."
 amoeba_hunting_buff: "Amöben-Jäger"
 amoeba_hunting_buff_desc: "Die Kadaver der Amöben werden nach einer Schlacht geöffnet und ihre inneren Organe nach wertvollen organischen Verbindungen durchsucht, die £energy£ §G1000§! Energie für jede zerstörte Flotte bringen."
 pacified_amoebas: "Befriedung der Amöben"
 pacified_amoebas_desc: "Unsere Flotten regulieren ihren Reaktoraustoß wenn sich Weltraumamöben nähern, wodurch uns die Kreaturen nicht länger als Bedrohung ansehen."
 drone_hunting_buff: "Drohnenzerstörer"
 drone_hunting_buff_desc: "Die Bergbaudrohnen sind offensichtlich in großer Masse produziert. Eine Schwäche, die in einer gefunden wird, kann also in allen gefunden werden."
 drone_mining_techniques: "Technik des Drohnenbergbaus"
 drone_mining_techniques_desc: "Die Verwendung von Techniken, die auch von den Bergbaudrohnen verwendet werden, ermöglichen uns, Mineraladern effizienter zu nutzen, die zuvor nicht die Mühe wert waren."
 cloud_hunting_buff: "Wolkenzerstörer"
 cloud_hunting_buff_desc: "Die Ladungen der Weltraumwolken schwanken in einem schnellen, aber beobachtbaren Zyklus. Wenn wir mit einem präzisen Timing zuschlagen, könnten wir diese destabilisieren."
 void_loops: "Raumschleife"
 void_loops_desc: "Die anomale Natur der Weltraumwolke eröffnet uns neue Möglichkeiten in der Physikforschung."
