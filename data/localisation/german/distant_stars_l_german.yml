 mega_computer: "Bunker-Bot"
 mega-computer_desc: "Ein Bunker-Bot unterstützt unsere Ingenieur-Forschung."
 a_hitchikers_guide_to_the_galaxy_desc: "Ein Außerirdischer Anhalter durch die Galaxie hat die Liebe unseres Volkes zum Unbekannten inspiriert."
