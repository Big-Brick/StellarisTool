 graygoo.2.name: "Der Sturm verschlingt [Root.GetName]"
 graygoo.2.desc: "Die Nanomaschinen des §HGrauen Sturms§! haben die Atmosphäre von §H[Root.GetName]§! wie Gewitterwolken verdunkelt und alle Materialien der Oberfläche zur Selbstreplikation ausgeschöpft. Schon bald bleiben keine Spuren der Bewohner mehr übrig."
 graygoo.2.a: "Eine Katastrophe!"
 graygoo.15.name: "Der Sturm hat sich gelegt"
 graygoo.15.desc: "Unseren Streitkräften ist es gelungen, die Haupteinrichtung des Grauen Sturms zu zerstören! Mit der Neutralisierung ihrer Subraum-Transmitter wurden alle existierenden Nanomaschinen des Sturm deaktiviert. Unfähig, ihre Struktur zu bewahren, haben sich alle ihre Schiffe ins Nichts aufgelöst.\n\nAlle Planeten, die von dem Grauen Sturm bedeckt waren, beherbergen jetzt riesige Staubstürme, die nur aus den deaktivierten Naniten bestehen. Mit der Zeit und Ressourcen könnten diese Welten möglicherweise wieder bewohnbar gemacht werden."
 graygoo.15.a: "Eine weitere Bedrohung wurde abgewehrt."
 graygoo.15.a.tooltip: "§YNaniten-Welten§! können jetzt in jede beliebe normale Planetenklasse §Hterraformiert§! werden, wenn deren technologischen Anforderungen erfüllt sind."
 graygoo.16.desc: "Die Streitkräfte von [goo_slayer.GetName] konnten erfolgreich die Haupteinrichtung des Grauen Sturms zerstören! Mit der Neutralisierung ihrer Subraum-Transmitter wurden alle existierenden Nanomaschinen des Sturm deaktiviert. Unfähig, ihre Struktur zu bewahren, haben sich alle ihre Schiffe ins Nichts aufgelöst.\n\nAlle Planeten, die von dem Grauen Sturm bedeckt waren, beherbergen jetzt riesige Staubstürme, die nur aus den deaktivierten Naniten bestehen. Mit der Zeit und Ressourcen könnten diese Welten möglicherweise wieder bewohnbar gemacht werden."
 graygoo.110.desc: "$distar.10951.desc$ Sobald das L-Tor in Betrieb genommen wurde, erhielten wir eine Übertragung von der anderen Seite."
 graygoo.111.name: "L-Tore aktiviert"
 graygoo.111.desc: "§H[From.GetName]§! hat es geschafft die Sperre der L-Tore unter ihrer Kontrolle zu entfernen!\n\n$graygoo.111.dessanu.desc$"
 graygoo.111.dessanu.desc: "Offensichtlich beherbergt das L-Cluster eine Art fortgeschrittener Raumfahrerzivilisation, die als §HDessanische Konsonanz§! bekannt ist. Jetzt, wo die Verbindung zu ihrem Heimatcluster wiederhergestellt wurde, haben die Dessanurianer Codes zur Reaktivierung aller verbleibender L-Tore in der Galaxie gesendet.\n\nSie senden zusätzlich eine Grußbotschaft auf einem offenen Subraumkanal."
 graygoo.112.desc: "$distar.10954.desc$\n\n$graygoo.111.dessanu.desc$"
 graygoo.115.desc: "Das... das kann nicht sein! Die Tore wurden reaktiviert! Hat die Zeit der Isolation endlich ein Ende?\n\nWir sind die §HDessanu Konsonanz§!, die Architekten der uralten Sternentore und L-Tore, die verteilt in der ganzen Galaxie gefunden werden können. Es war unser Ziel, ein galaktisches Netzwerk von Sternentoren zu schaffen, um die Ausbreitung der galaktischen Zivilisation voranzutreiben und so eine Ära des Friedens und des interstellaren Handels einzuläuten.\n\nEin Programmierfehler hat die L-Tore allerdings deaktiviert und uns in unserem Heimat-Cluster gestrandet zurückgelassen. Da es unmöglich war, den Fehler von unserer Seite aus zu korrigieren, haben wir Äonen darauf gewartet, dass es jemand am anderen Ende repariert. Dank euch ist dieser Tag endlich gekommen!"
 graygoo.115.a: "Ein Programmierfehler?"
 graygoo.115.a.response: "Ja, Ziemlich peinlich. Offensichtlich trat das L-Tor-Netzwerk in einen geplanten Wartungszyklus ein, der nie endete. Die Techniker, die diesen von der anderen Seite überwachen sollten waren bedauerlicherweise auf unserer Seite des Netzwerkes als sie ihn versehentlich auslösten und von hier aus konnte nichts gemacht werden.\n\nGlücklicherweise ist unser Heimat-Cluster autark und unsere Zivilisation hat bis zum heutigen Tag ruhig durchgehalten. Wir wussten immer, dass der Tag kommen würde, an dem wir uns mit dem Rest der Galaxie wiedervereinen würden."
 graygoo.115.b: "Was werdet ihr jetzt tun?"
 graygoo.115.b.response: "Wir haben uns an das Leben in unserem Sternencluster gewöhnt und haben es daher nicht eilig, es zu verlassen. Wir sind aber gespannt auf den Rest der Galaxie! Wie es scheint, es ist ein ziemlich belebter Ort.\n\nUnser Cluster wird für jedermann zugänglich sein. Wir bitte nur darum, dass ihr nicht auf einem unserer bewohnten Planeten landet und Euch vom §H[lcluster_factory_system.GetName]§!-System fernhaltet, das tiefer im Cluster liegt. Dieses ist nur für Dessanurianer."
 graygoo.115.c: "Wurden die L-Tore nicht von Naniten gebaut?"
 graygoo.115.c.response: "Naniten? Das ist keine uns bekannte Technologie. Selbsreplizierende mikroskopische Maschinen, sagt ihr? Ehrlich gesagt klingt das absurd.\n\nDie Sternentore und die L-Tore sowie unsere gesamte Zivilisation wurden durch die Arbeit und den Einfallsreichtum der Dessanurianer realisiert, sonst nichts.\n\nBitte lasst uns dieses Thema nicht weiter diskutieren."
 graygoo.115.d: "Auf Wiedersehen."
 graygoo.115.d.response: "Nicht so schnell! Durch Eure Taten habt Ihr uns endlich die Freiheit gegeben, von der Generationen von Dessanurianern geträumt haben. Wir stehen in Eurer Schuld.\n\nEs ist nur ein armseliges Angebot im Vergleich zu Eurem Geschenk, aber wir möchten Euch dauerhaften Zugang zu mehreren strategischen Ressourcen aus unserem Cluster geben. Wir erwarten keine Gegenleistung und werden Euch diese Ressourcen so lange zur Verfügung stellen, wie es uns möglich ist."
 graygoo.116.desc: "Bewohner der Galaxie Grüße von der Dessanu-Konsonanz!\n\nVor Äonen überwachten wir die Konstruktion der Sternentore und L-Tore, die Ihr vielleicht als zurückgelassen gesehen habt. Unsere Absicht war es, ein galaktisches Netzwerk solcher Apparaturen zu bauen, doch leider machte ein schrecklicher Fehler die L-Tore unbrauchbar und schloss uns in unserem Heimat-Cluster ein.\n\nDie Zeit der Isolation ist dank der cleveren Wissenschaftler von [From.From.GetName] nun endlich zu Ende! Jetzt, da die L-Tore wieder aktiv sind, laden wir alle dazu ein sie zu nutzen und so die galaktische Reisezeit zu verkürzen. Unser Sternencluster ist für alle offen.\n\nNur das §H[lcluster_factory_system.GetName]§!-System ist davon ausgenommen. Unternehmt keine Versuche dorthin zu kommen."
 graygoo.116.d: "Bildschirm abschalten."
