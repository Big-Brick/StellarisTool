 ####################################
 ### Anomaly Events
 ####################################
 ### Trojan Asteroid ###
 distar.3000.name: "Innere Maschine"
 distar.3000.desc: "Wie bereits vermutet enthält der Asteroid [From.GetName] eine große Masse an Metall und versteckt tatsächlich eine Art von Maschine.\n\nDie gesammelten Daten zeigen deutlich, dass seine Bestandteile eine große Menge an gespeicherter Energie enthalten, aber ihr Zweck ist weiterhin unbekannt."
 distar.3000.a: "Geht vorsichtig vor."
 distar.3000.a.tooltip: "Baut den Asteroiden vorsichtig ab."
 distar.3000.b: "Nehmt eine Probe."
 distar.3000.b.tooltip: "Entsendet eine Bohrsonde und nehmt eine Probe."
 distar.3001.desc: "Vorsichtig vorzugehen hat sich bewährt. Versteckt in [trojan_asteroid.GetName] war eine Schaar alter Bergbaudrohnen, die darauf programmiert waren, bei Kontakt anzugreifen.\n\nWissenschaftsoffizier [Root.GetLeaderName] hat dies glücklicherweise früh entdeckt und konnte die Sensoren der Drohnen lange genug blockieren, um sie zu deaktivieren.\n\nDie Kerne der Drohnen sind zwar alt, aber sie enthalten viel Energie."
 distar.3002.desc: "Die erzwungene Entnahme einer Probe durch die [Root.GetName] erwies sich als äußerst bedauerliche Entscheidung. Innerhalb des Asteroiden war eine Menge alter Bergbaudrohnen versteckt, die so programmiert waren, dass sie bei Kontakt angreifen.\n\nDie Drohnen haben die Anwesenheit der [Root.GetName] erkannt und beginnen damit, sich hochzufahren.\n\nEs bleibt vielleicht noch Zeit für ein Ausweichmanöver, wenn die [Root.GetName] rasch handelt."
 distar.3003.desc: "Neuigkeiten bezüglich der Ereignisse die sich am Asteroiden [trojan_asteroid.GetName] abgespielt haben, haben das Netzwerk von [Root.Capital.GetName] erreicht. Wissenschaftler haben mit Neugier reagiert und die Frage gestellt, warum die Drohnen überhaupt in dem Asteroiden deponiert wurden.\n\nHaben sie etwas bewacht?"
 distar.3005.desc: "Wie die Wissenschaftler auf [Root.Owner.Capital.GetName] bereits vermutet haben, versteckten die Drohnen im Asteroiden [trojan_asteroid.GetName] tatsächlich etwas.\n\nDie tapferen Bemühungen der Crew der [Root.GetName] haben reichhaltige Mineralablagerungen im Kern des Asteroiden freigelegt, die zuvor durch die Anwesenheit der Drohnen verdeckt waren."
 ### Impossible Organism ###
 distar.3010.desc: "Die überraschenden Lebenswerte auf [impossible_organism_planet.GetName] wurden einem kleinen Organismus von übermäßiger Zähigkeit zugeordnet. Die Crew der [Root.GetName] ist sich nicht sicher, wie sie die Lebensform klassifizieren soll, aber ihre Fähigkeit scheinbar ohne Nahrung zu überleben ist wirklich erstaunlich. Angesichts des Alters des Planeten ist es nicht ausgeschlossen, dass der Organismus seit Jahrtausenden die Toxizität bekämpft.\n\nWissenschaftsoffizier [Root.GetLeaderName] hat um Erlaubnis gebeten, Proben des unbekanntes Organismus zu nehmen, damit sie untersucht werden können."
 distar.3010.a: "So sei es. Entnehmt eine Probe."
 distar.3010.b: "Nein, untersucht sie aus der Ferne."
 distar.3010.b.tooltip: "Fügt [From.GetName] den Modifikator §YUnmöglicher Organismus§! hinzu:\n£society£ §G+3§!"
 distar.3011.desc: "Studien der mysteriösen Lebensform schreiten gut voran. Die Wissenschaft ist erstaunt über das Wachstumspotenzial. Es ist bereits für das bloße Auge sichtbar, reagiert auf Reize und scheint in der Lage zu sein, Energie und Nahrung von fast allem, egal ob organisch oder nicht, zu absorbieren.\n\nLeider bleiben seine genetischen, zellulären und biochemischen Prozesse jenseits unseres Verständnisses."
 distar.3011.a: "Wir sollten es weiter untersuchen."
 distar.3011.a.phobe: "Eckelhaft! Stoßt es mit einem Stock..."
 distar.3011.b: "Dieser Alien ist zu gefährlich."
 distar.3011.b.tooltip: "Schießt die Lebensform in den Weltraum."
 distar.3012.name: "Unmöglicher Fungoid"
 distar.3012.desc: "Nach den jüngsten Durchbrüchen ist die seltsame Lebensform kein vollständiges Mysterium mehr! Die Wissenschaft auf [Root.Capital.GetName] ist von den Neuigkeiten begeistert\n\nDer Organismus wurde als Fungoid klassifiziert, was auch seine Fähigkeit, Moleküle zur Ernährung aufzunehmen teilweise erklärt. Er ist immens gewachsen, hat jetzt die Größe eines Neugeborenen [Root.GetSpeciesNamePlural] und scheint sowohl wissbegierig als auch intelligent zu sein. Glücklicherweise hat er bis jetzt keine Anzeichen von Aggression gezeigt.\n\nUnsere Wissenschaftler glauben, dass der nächste Schritt erste Kommunikationsversuche sein könnten. Fortschritte diesbezüglich könnten aber noch Monate andauern."
 distar.3012.a: "Versucht weiterhin damit zu kommunizieren."
 distar.3012.a.tooltip: "Studiert die Fungoide weiter.\n\nEs könnte Monate dauern, bis Fortschritte gemeldet werden."
 distar.3012.b: "$distar.172.b$. Werft das Exemplar aus der Luftschleuse."
 distar.3012.b.tooltip: "Schießt den Fungoid in den Weltraum."
 distar.3013.name: "Unmöglicher Fungoid: Erste Worte"
 distar.3013.desc: "Der kleine Fungoid hat kürzlich damit begonnen zu sprechen!\n\nSeine ersten Worte waren ein kehliges \"Nivlac\". Es hatte zwar keinen Zusammenhang, wurde aber leidenschaftlich wiederholt und daher haben die Wissenschaftler den stolzen Fungoiden §Y$NAME_Nivlac$§! genannt. Seither hat sich seine Sprache mit einer spektakulären Geschwindigkeit entwickelt und er ist nun in der Lage die sieben primären Emotionen erfolgreich zu vermitteln und dies oft auch seinen eigenen Nachkommen. Er reproduziert sich, indem er seine Sporen verbreitet und das Laboratorium wird bald nicht mehr ausreichen, um mehr Fungoide aufzunehmen.\n\nDer $NAME_Nivlac$ hat weiterhin keine Anzeichen von Aggressionen gezeigt."
 distar.3013.a.xenophile: "Faszinierend. Jeder [Root.GetSpeciesName] sollte einen haben!"
 distar.3013.a: "Hervorragend. Die [Root.GetAdj]e Gesellschaft kann sie gebrauchen."
 distar.3013.a.swarm: "Die [Root.GetAdj]e könnte sie nutzen... als Nahrung."
 distar.3013.a.serv: "Geschätzte organische Wesen. Wir, [Root.GetSpeciesNamePlural], werden uns um sie kümmern."
 distar.3013.a.assi: "Hervorragend. Sie werden assimiliert."
 distar.3013.a.assi.tooltip: "Bis zu §Y500§! £pop£ §H$NAME_Nivlac$-Bewohner§! werden auf [nivlac_joint_planet.GetName] auftauchen"
 distar.3013.a.tooltip: "Füllt leere Häuser auf [nivlac_joint_planet.GetName] mit £pop£ §H$NAME_Nivlac$-Bewohnern§!"
 distar.3013.b: "Sie sollten eine eigene Heimat haben."
 distar.3013.b.no_room.kill: "Wir haben keinen Platz. Verbrennt sie und vergesst sie."
 distar.3013.b.no_room.kill.tooltip: "Die Fungoide werden vernichtet."
 distar.3013.b.tooltip: "Unsere Wissenschaftler werden die $NAME_Nivlacs$ aus dem Labor auf einen geeigneten Planeten umsiedeln.\n\nEs wird einige Zeit dauern, bis wir mit Fortschritten rechnen können."
 distar.3015.name: "Unmöglicher Organismus: Die $NAME_Nivlac$"
 distar.3015.desc: "Die außerirdische Lebensform, die einst auf dem toxischen Planeten [impossible_organism_planet.GetName] gefunden wurde und später in den Weltraum geschossen wurde, weil sie als zu gefährlich angesehen wurde, scheint einige Zeit darauf auf [nivlac_planet.GetName] gelandet zu sein.\n\nEs hat nicht nur den Aufprall überlebt, sondern hat den neuen Planeten auch zu seiner Heimat gemacht. Es gedeiht, wächst und unterteilt sich in kleinere Populationen bis zu dem Punkt, wo es selbst eine raumfahrende Spezies wird.\n\nSie selbst nennen sich $NAME_Nivlac$ und scheinen sich leider an unsere frühere Tat zu erinnern."
 distar.3016.name: "Die $NAME_Nivlac$"
 distar.3016.desc: "Unsere Wissenschaftler sind erfreut berichten zu können, dass die Umsiedlung der $NAME_Nivlac$ auf einen geeigneten Planeten ein voller Erfolg war.\n\nSeit der Ankunft der jungen Fungoiden auf [nivlac_planet.GetName] hat sich das explosive Wachstum fortgesetzt. Es hat sich nun als kleines Volk etabliert und vor kurzen sogar die ÜL-Technologie entwickelt. Zweifellos durch die Hilfe der Technologie, die wir zurückgelassen haben.\n\nWir sollten ihre Entwicklung mit Spannung weiter beobachten."
 distar.3017.name: "[Root.Owner.GetSpeciesName] und $NAME_Nivlac$"
 distar.3017.desc: "Die Integration der Fungoiden $NAME_Nivlac$ in die [Root.Owner.GetAdj]e Gesellschaft ist in vollem Gange.\n\nInteraktionen zwischen $NAME_Nivlacs$ und [Root.Owner.GetSpeciesNamePlural] sind weiterhin positiv und unsere Spezies scheinen sich zusammen auf einen vielversprechenden Weg begeben zu haben."
 distar.3017.desc.assim: "Die Assimilation der Fungoiden $NAME_Nivlac$ in die [Root.Owner.GetAdj]e Gesellschaft ist in vollem Gange.\n\nObwohl sich die $NAME_Nivlac$ gegen den Prozess wehren, wird ihr Bewusstsein letztendlich in das [Root.GetAdj]e sublimiert werden."
 distar.3017.a.tooltip: "£pop£ §H$NAME_Nivlac$-Bewohner§! tauchen auf [nivlac_joint_planet.GetName] auf"
 distar.3017.a.assi.tooltip: "£pop£ §H$NAME_Nivlac$-Bewohner§! tauchen auf [nivlac_joint_planet.GetName] auf"
 distar.3017.a.serv.tooltip: "£pop£ §H$NAME_Nivlac$-Bewohner§! werden in den frisch gebauten Sanktuarien auf [nivlac_joint_planet.GetName] verwöhnt"
 ### Stranded Scientist ###
 distar.3020.name: "Gestrandeter Wissenschaftler"
 distar.3020.desc: "Das Wrack auf dem Asteroiden [From.GetName] gehört zu den Überresten des Schiffes der nun gestrandeten Wissenschaftlerin [stranded_scientist_leader.GetName], die sich selbst als zur bisher unbekannten [stranded_scientist_species.GetName]-Spezies zugehörend beschreibt.\n\nAus dem Wrack gelang es ihr, [Root.GetLeaderName], den Wissenschaftsoffizier der [Root.GetName] zu kontaktieren, und sie bat darum, gerettet zu werden. Sie erklärte, ihre Kollision sei auf fehlerhafte Navigationssensoren zurückzuführen und dass sie den Asteroiden schon seit mehreren Jahren nicht verlassen konnte.\n\nSie behauptet auch, ihre wissenschaftlichen Kenntnisse wären beispiellos und dass es sich bei ihr um eine wertvolle Unterstützung handle. Als Beweis führt sie ihr bisheriges Überleben an."
 distar.3020.a: "Sie kann sich unserer Sache anschließen."
 distar.3020.a.tooltip: "§Y[stranded_scientist_leader.GetName]§! tritt [Root.Owner.GetName] als $scientist_with_icon$ der Stufe 6 bei und wird ihr technologisches Wissen teilen."
 stranded_scientist_background: "§Y[Root.GetName]§! wurde gestrandet auf §Y[Root.GetBackgroundPlanet]§! ([Root.GetHomeWorldBiome]) gefunden."
 distar.3020.b: "Nein, lasst sie da."
 distar.3020.b.tooltip: "[stranded_scientist_leader.GetName] wird ihrem Schicksal überlassen."
 distar.3021.name: "Geteiltes Wissen"
 distar.3021.desc: "Die neue Wissenschaftlerin [stranded_scientist_leader_clone.GetName] hat ihr Wissen über Technologie gut genutzt. Ihre geteilten Erkenntnisse haben unsere Physikforschung zu neuen Höhen geführt."
 distar.3021.a.tooltip: "Unsere Forschung der £physics£ §YTechnologien§! ist gefördert."
 ### Molluscoid Miners ###
 distar.3030.name: "Molluskoide Minenarbeiter"
 distar.3030.desc: "Genauere Untersuchungen von [molluscoid_miners_planet.GetName] haben gezeigt, dass die hüttenartigen Strukturen die Heimat einer Spezies von Molluskoiden sind. Die Hütten sind die einfachste Form des Unterschlupfs, aufgebaut aus Erde und einer quasi-fäkalen Ausscheidung.\n\nDie Molluskoide scheinen beinahe vernunftbegabt zu sein und von begrenztem Intellekt. Außer dem Überleben dreht sich ihre Gesellschaft um das Ausgraben von Mineralien, die anschließend ausgestellt werden, um den sozialen Status des Finders zu verbessern.\n\nWie sie diese Mineralien finden ist jedoch unklar. Wissenschaftsoffizier [Root.GetLeaderName] zumindest ist verblüfft über ihre Fähigkeit, große Mineralienvorkommen aufzuspüren.\n\nObwohl sie uns technologisch unterlegen sind, könnten diese Molluskoide durchaus unsere Bergbaufähigkeiten verbessern."
 distar.3030.a: "Faszinierend. Studiert sie weiter."
 distar.3030.b: "Baut ihre Mineralien ab."
 distar.3031.desc: "Die Molluskoide, die [molluscoid_miners_planet.GetName] bewohnen, verwenden eine seltsame Methode um ihre begehrten Mineralien zu finden.\n\nOffensichtlich sondern sie ein gallertartiges Sekrete aus ihrer Haut ab, dass dann in den Boden sickert und nach unten rieselt, während sie weiterhin als lange Fäden an ihrer Haut hängen. Das Sekret kartografiert irgendwie den Boden und gibt dem Molluskoiden sensorische Informationen zurück, solange die Verbindung nicht unterbrochen wird. Auf diese Weise sind sie in der Lage überraschend große Teile des unterirdischen Geländes zu kartografieren und jegliche Mineralien zu entdecken, die von ihren Sekreten berührt werden.\n\nWenn wir die Molluskoide in unsere Gesellschaft integrieren oder einfach unsere Produktionsprozesse mit diesem Wissen vorantreiben könnten unsere Bergbauunternehmungen mit Sicherheit stark davon profitieren."
 distar.3031.a: "Gewährt. Beginnt mit der Integration."
 distar.3031.a.evopre: "Die Mineralien interessieren uns nicht. Erntet ihre DNA."
 distar.3031.b: "Ja, wir werden dieses Wissen nutzen."
 distar.3031.c: "Nein, baut ihren Planeten einfach ab."
 distar.3032.name: "Integration der Molluskoide"
 distar.3032.desc: "Die Integration der Molluskoide in die [Root.Owner.GetAdj]e Gesellschaft ist abgeschlossen.\n\nUm die Integration zu erleichtern erhielten sie den Namen §Y[molluscoid_miners_species.GetName]§!. Die [molluscoid_miners_species.GetName] sind gehorsam und fleißig und es konnte bereits eine deutliche Steigerung unserer Mineralienproduktion beobachtet werden."
 distar.3032.a.tooltip: "§Y600§! £pop£ §HBewohner der Spezies [molluscoid_miners_species.GetName]§! tauchen auf §Y[Root.Capital.GetName]§! auf"
 distar.3032.b: "Sie sind hier... Irgendwo."
 distar.3032.b.tooltip: "Aufgrund der hohen Bevölkerungsdichte von [Root.Capital.GetName] ist die [molluscoid_miners_species.GetName]-Spezies statistisch zu unbedeutend und daher weitgehend irrelevant für Bürgerliche."
 distar.3033.name: "Mineralien-Kartierung"
 distar.3033.desc: "Ein System, das es uns ermöglicht, unterirdisches Terrain und die darin enthaltenen Mineralien schnell zu kartieren, wurde eingerichtet.\n\nDurch die Analyse bestimmter Sonnen- und kosmischer Strahlung, die die meisten Mineralien nicht durchdringen, konnten wir Daten über die Menge an Mineralien eines Objekts sammeln. Dies ermöglicht es uns im Wesentlichen einen Zielkörper, sei es Asteroid oder Teil eines Planeten, zu röntgen.\n\nUnsere Wissenschaftler haben es Mineralien-Kartierung genannt und es sollte unsere Mineralienproduktion erheblich erhöhen."
 ### Alien Machine ###
 distar.3040.name: "Alien-Maschine"
 distar.3040.desc: "Weitere Scans deuten darauf hin, dass die Maschine noch funktionsfähig ist, obwohl ihr Zweck völlig unklar ist.\n\nWissenschaftsoffizier [Root.GetLeaderName] hat noch nie etwas Vergleichbares gesehen. Einige seiner Materialien scheinen von vertrauter Art zu sein, aber die meisten sind mysteriös und völlig fremd, ebenso wie die Komponenten und ihre Konstruktion.\n\nDie Maschine hat etwas, das wie eine Konsole aussieht. Ein Gegenstand sticht dabei besonders hervor, ein großer, krummer Hebel aus unbekanntem Material."
 distar.3040.a: "Zieht am Hebel."
 distar.3040.a.tooltip: "Wissenschaftsoffizier [Root.GetLeaderName] zieht an dem mysteriösen Hebel."
 distar.3040.b: "Nehmt es auseinander."
 distar.3040.b.tooltip: "Die Maschine wird demontiert und die Teile wiederverwertet."
 distar.3041.name: "Alien-Maschine"
 distar.3041.desc: "Es ist unklar, was passierte, als der Hebel gezogen wurde.\n\nDie Konsole flackerte kurz, starke Vibrationen wurden ausgestoßen und dann kam eine Energiewelle aus der Maschine heraus und dehnte sich in den Weltraum hinaus aus. Die Wissenschaftler in der Nähe fühlten die Welle an sich vorbeiziehen, konnten aber keine anderen nennenswerten Sensordaten messen.\n\nWissenschaftsoffizier [Root.GetLeaderName] ist sich nicht sicher, welche Erkenntnisse daraus gezogen werden können. Die Maschine selbst kehrte unmittelbar danach in ihren inaktiven Zustand zurück und sondert keine Energiewellen mehr aus."
 distar.3041.a: "Merkwürdig. Nehmt es jetzt auseinander."
 distar.3041.b: "Faszinierend. Erforscht die Maschine."
 distar.3041.b.tooltip: "Fügt [asteroid_target.GetName] den Modifikator §YAlien-Maschine§! hinzu:\n£physics£ §G+7§!"
 distar.3042.name: "Energiespitze"
 distar.3042.desc: "Als unsere Wissenschaftler den Hebel betätigten, stieß die Maschine einen gewaltigen Energiestoß aus, der sich in pulsierenden Schockwellen durch die Leere drehte und ein Wurmloch in §Y[system_one.GetName]§! aufriss.\n\nNachdem die Restenergie verflogen war, beruhigte sich das Wurmloch und die unmittelbare Umgebung scheint jetzt stabil genug für einen sicheren Durchgang zu sein. Über das, was uns auf der anderen Seite erwartet, sind unsere Wissenschaftler sich allerdings nicht so sicher.\n\nDie Maschine selbst ist seitdem in ihren inaktiven Zustand zurückgekehrt und gibt keine ungewöhnlichen Messwerte mehr ab."
 ### Orbital Speed Demon ###
 distar.3050.name: "Orbitaler Geschwindigkeitsdämon"
 distar.3050.desc: "Alle Versuche, das Hochgeschwindigkeitsobjekt in der Umlaufbahn von [From.GetName] zu scannen, sind fehlgeschlagen. Das Objekt bewegt sich zu schnell außer Sicht und die Instrumente unseres Forschungsschiffes können einfach nicht mithalten.\n\nObwohl die Gravitationskraft von [From.GetName] sehr stark ist, erklärt das nicht die extreme Geschwindigkeit des Objekts. Entweder besitzt es selbst außergewöhnliche Eigenschaften oder es handelt sich um ein Gravitationswunder.\n\nDie Geschwindigkeit des Objekts scheint sich sogar allmählich zu erhöhen und Wissenschaftsoffizier [Root.GetLeaderName] vermutet, dass es schon bald aus dem Orbit geworfen werden könnte, auch ohne äußere Einmischung."
 distar.3050.a: "Versucht es zu verlangsamen."
 distar.3050.a.tooltip: "Schickt eine Drohne und versucht sie an das Objekt zu haften, um die Geschwindigkeit zu verlangsamen."
 distar.3050.b: "Versucht es aufzuhalten."
 distar.3050.b.tooltip: "Werft Trümmer aus, die mit dem Objekt kollidieren und haltet so hoffentlich seinen Sprint auf."
 distar.3050.c: "Geht aus seinem Weg."
 distar.3050.c.tooltip: "Geht aus der Gefahrenzone und überlasst das Objekt seinem Schicksal."
 distar.3051.name: "Geschwindigkeitsdämon gestoppt"
 distar.3051.desc: "Die Drohne hat die Umlaufbahn des Objekts erfolgreich abgefangen.\n\nDurch das Anheften an dem Objekt und anschließendem entgegengesetzten Schub war die Drohne in der Lage sie zur [Root.GetName] zu leiten.\n\nDas Objekt scheint eine Art Box aus Alien-Materialien zu sein. Aderähnliche Drähte winden sich um es herum und enden oben in einer Art kugelförmigen Mechanismus. Wir können den Inhalt nur erraten."
 distar.3051.desc.1: "Die ausgestoßenen Trümmer kollidierten erfolgreich mit dem unbekannten Objekt und reduzierten seine Geschwindigkeit, bevor es aus der Umlaufbahn geworfen wurde. Die [Root.GetName] konnte es kurze Zeit später bergen.\n\nDas Objekt scheint eine Art Box aus Alien-Materialien zu sein. Aderähnliche Drähte winden sich um es herum und enden oben in einer Art kugelförmigen Mechanismus. Wir können den Inhalt nur erraten."
 distar.3051.a: "Öffnet es."
 distar.3051.b: "Studiert es."
 distar.3051.c: "Werdet es los."
 distar.3051.c.tooltip: "Schießt die außerirdische Box in den Weltraum."
 distar.3052.name: "Geschwindigkeitsdämon verloren"
 #distar.3052.desc: "The drone successfully latched onto the unknown object, but the added mass of the drone and the change in trajectory soon caused both drone and object to be pulled out of orbit, tumbling into deep space at high speed."
 #distar.3052.desc.1: "The ejected debris successfully collided with the unknown object. Unfortunately, instead of reducing its velocity, the debris knocked the object out of orbit, tumbling into deep space at high speed."
 distar.3055.name: "Außerirdische Box geöffnet"
 distar.3055.desc: "Endlich ist es unseren Wissenschaftlern gelungen, das Material der fremden Box zu durchdringen.\n\nDie Box enthält drei kleine Fläschchen, die mit verschiedenen Flüssigkeiten gefüllt sind. Eine ist §Rrot§!, eine §Bblau§! und eine §Ggrün§!. Die Flüssigkeiten sind weniger fremd als ihr Behälter und unsere Wissenschaftler konnten sie als genmodifizierende Lösungen identifizieren.\n\nAus Gründen, die wir nicht verstehen, verlieren die Lösungen außerhalb ihres fremdartigen Behälters rasch an Wirksamkeit, doch es sollte dennoch genug Zeit bleiben, um zumindest eine davon für unsere Spezies zu synthetisieren und anzuwenden. Es wurde bestätigt, dass die Auswirkungen positiv sein werden, aber es bleibt abzuwarten, wie genau."
 distar.3055.desc.1: "Endlich ist es unseren Wissenschaftlern gelungen, das Material der fremden Box zu durchdringen.\n\nDie Box enthält drei kleine Fläschchen, die in der Tat mit verschiedenen Flüssigkeiten gefüllt sind. Eine ist §Rrot§!, eine §Bblau§! und eine §Ggrün§!. Die Flüssigkeiten sind weniger fremd als ihr Behälter und unsere Wissenschaftler konnten sie als genmodifizierende Lösungen identifizieren.\n\nAus Gründen, die wir nicht verstehen, verlieren die Lösungen außerhalb ihres fremdartigen Behälters rasch an Wirksamkeit, doch es sollte dennoch genug Zeit bleiben, um zumindest eine davon für unsere Spezies zu synthetisieren und anzuwenden. Es wurde bestätigt, dass die Auswirkungen positiv sein werden, aber es bleibt abzuwarten, wie genau."
 distar.3055.a: "Benutzt die §RRote§!."
 distar.3055.a.tooltip: "Modifiziert die [Root.Owner.GetSpeciesName]-Spezies mit dem roten Lösungsmittel."
 distar.3055.b: "Benutzt die §GGrüne§!."
 distar.3055.b.tooltip: "Modifiziert die [Root.Owner.GetSpeciesName]-Spezies mit dem grünen Lösungsmittel."
 distar.3055.c: "Benutzt die §BBlaue§!."
 distar.3055.c.tooltip: "Modifiziert die [Root.Owner.GetSpeciesName]-Spezies mit dem blauen Lösungsmittel."
 distar.3055.d.evopred: "Wir haben keine Zeit für halbe Sachen. Nutzt sie alle!"
 distar.3055.d.evopred.tooltip: "§YEines von 2 Dingen wird passieren:§!\n§Y50%§!-Chance, die Vorteile aller Lösungsmittel zu erhalten\n§Y50%§!-Chance, dass nichts geschieht"
 distar.3055.d: "Verkauft sie."
 distar.3055.d.tooltip: "Verkauft die Fläschchen an den Höchstbietenden."
 distar.3056.name: "Inhalt der außerirdischen Box"
 distar.3056.desc: "Endlich haben es unsere [Root.GetScientistPlural] geschafft, einen Blick in die fremde Box zu werfen, ohne den Behälter selbst dabei zu beschädigen. Durch die Verwendung eines fortschrittlichen Sonars konnte der Inhalt identifiziert werden.\n\nDer Inhalt ist verblüffend oder zumindest unerwartet. Die Box enthält drei kleine Fläschchen, die jeweils mit einer unbekannten Flüssigkeit gefüllt sind.\n\nEs ist sicher, die Box zu öffnen, bedarf aber weiterer Untersuchungen, um zu verstehen, wie."
 distar.3056.a: "Öffnet sie."
 distar.3056.a.tooltip: "\nDie Erforschung der Box hat unser Wissen über die\n£physics£ §YPhysik§! beschleunigt."
 #Above "\n" is intended, to put "Physics"-word and -symbol on the same line
 distar.3056.b: "Verkauft sie."
 distar.3056.b.tooltip: "Verkauft die Box an den Höchstbietenden."
 distar.3056.c: "Bestrahlt sie."
 distar.3056.c.tooltip: "Durch die Neutronenaktivierungsanalyse können wir besser verstehen, welche Materialien für die Herstellung der Box und ihres Inhalts verwendet wurden."
 distar.3057.name: "Genmodifizierung abgeschlossen"
 distar.3057.desc.all: "Da wir die Synthese und den Einsatz einzigartiger Genome perfektioniert haben, stand das Ergebnis nie infrage. Wir haben das §Rrote§!, §Ggrüne§! und §Bblaue§! Lösungsmittel erfolgreich bei der [root.GetSpeciesNamePlural]-Spezies angewandt.\n\nUnsere Spezies ist jetzt sozialer, anpassungsfähiger und langlebiger."
 distar.3057.desc.stronger: "Das §Rrote§! Lösungsmittel zur Genmodifizierung wurde erfolgreich auf die [Root.GetSpeciesNamePlural] angewandt.\n\nBasierend auf den Studien erster Testsubjekte scheint die Lösung uns sozialer zu machen."
 distar.3057.desc.adaptive: "Das §Ggrüne§! Lösungsmittel zur Genmodifizierung wurde erfolgreich auf die [Root.GetSpeciesNamePlural] angewandt.\n\nBasierend auf den Studien erster Testsubjekte scheint die Lösung unsere Anpassungsfähigkeit an unsere Umwelt verbessert zu haben."
 distar.3057.desc.longlived: "Das §Bblaue§! Lösungsmittel zur Genmodifizierung wurde erfolgreich auf die [Root.GetSpeciesNamePlural] angewandt.\n\nBasierend auf den Studien erster Testsubjekte scheint die Lösung unsere potenzielle Lebensspanne erhöht zu haben."
 distar.3057.desc: "Die versuchte Genmodifizierung war leider trotz vielversprechender anfänglicher Ergebnisse ein Misserfolg, da die Lösung mit den [Root.GetSpeciesAdj]en Genomen inkompatibel waren."
 ### Breathing Rift ###
 distar.3060.name: "Atmender Riss"
 distar.3060.desc: "Die Anomalie, die in der Nähe von [breathing_rift_object.GetName] gefunden wurde, ist, wie unwahrscheinlich es auch immer zu sein scheint, eine Art Riss im Raum. Es ist möglich, dass die große Masse von [breathing_rift_object.GetName] irgendwie dazu beigetragen hat, aber genaueres liegt außerhalb unseres Verständnisses.\n\nDer Riss bricht und blockiert nicht nur das Licht, sondern scheint es auch einzufangen und dann wieder hinauszuschieben, als ob es Photonen atmen würde.\n\nEs ist wahrscheinlich, dass die immense Gravitationskraft des Risses auch bereits andere Dinge eingesaugt hat. Wir sollten Vorsicht walten lassen."
 distar.3060.a: "Bleibt wachsam bis wir mehr wissen."
 distar.3060.a.tooltip: "Entsendet die Beobachtungssonde, um den Riss zu überwachen."
 distar.3060.b: "Er kann aus sicherer Entfernung studiert werden."
 distar.3060.c: "Die [Root.GetName] ist gefährdet. Verlasst den Riss sofort."
 distar.3061.name: "Atmender Riss - Mineralien"
 distar.3061.desc: "Viele Monate sind seit der Entdeckung des Risses in der Nähe von [breathing_rift_object.GetName] verstrichen, ohne dass etwas Außergewöhnliches geschehen ist. Jetzt haben wir allerdings Berichte über eine größere Ansammlung mineralhaltiger Steine erhalten.\n\nWir können sie für uns beanspruchen.\n\nDie Beobachtung des Risses wird fortgesetzt."
 distar.3061.desc.repeat: "Erneut hat der Riss in der Nähe von [breathing_rift_object.GetName] eine ansehnliche Sammlung von Gegenständen ausgespuckt. Diesmal sind es Reste von Asteroiden. Viele davon sind mit Mineralien beladen.\n\nWir können sie für uns beanspruchen.\n\nDie Beobachtung des Risses wird fortgesetzt."
 distar.3061.a: "Hervorragend. Sammelt sie schnell ein."
 distar.3062.name: "Atmender Riss - Trümmer"
 distar.3062.desc: "Viele Monate sind seit der Entdeckung des Risses in der Nähe von [breathing_rift_object.GetName] vergangen, ohne dass etwas Außergewöhnliches geschehen ist. Jetzt haben wir allerdings Berichte über eine größere Ansammlung von Trümmern erhalten, die aus ihm herausströmen. Wir können sie für uns beanspruchen.\n\nDie Beobachtung des Risses wird fortgesetzt."
 distar.3062.desc.repeat: "Erneut sondert der Riss in der Nähe von [breathing_rift_object.GetName] etwas ab. Diesmal sind es größtenteils metallreiche Trümmer, die in das Sonnensystem eindringen und aus einer uralten Schlacht stammen könnten. Wir können sie für uns beanspruchen.\n\nDie Beobachtung des Risses wird fortgesetzt."
 distar.3062.a: "Hervorragend. Sammelt sie schnell ein."
 #distar.3063.name: "Breathing Rift - Unknown Creature"
 #distar.3063.desc: "A significant spike in energy levels has been seen in recent readings from the rift near [breathing_rift_object.GetName].\n\nWhat followed immediately after has thrown our scientists into a state of panic. An unknown, colossal creature escaped the rift, drifting into the solar system.\n\nWe should proceed with extreme caution, no matter our course of action."
 distar.3064.name: "Atmender Riss - Geschlossen"
 distar.3064.desc: "Die neusten Berichte der Beobachtungssonde zeigen, dass der Riss verschwunden ist. Nach seinem letzten Atemzug schloss sich der Riss und hinterließ nicht einmal eine Energiespur."
 distar.3064.a: "Bedauerlich."
 distar.3064.a.tooltip: "Die Daten, die wir im Laufe der Zeit gesammelt haben, konnten jedoch unser Wissen über die £physics£ §YPhysik§! verbessern."
