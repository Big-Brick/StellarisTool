 littering_loitering_liability: "Eine versaute herumlungernde Bürde"
 littering_loitering_liability_desc: "Dreckige Alien..."
 ancient_harvesters: "Uralte Erntemaschinen"
 ancient_harvesters_desc: "Alte solarbetriebene Erntemaschinen helfen beim Ernten der Pflanzen auf diesem Planeten."
 seismological_phenomena: "Seismologische Phänomene"
 seismological_phenomena_desc: "Diese Welt leidet unter anomalen seismologischen Phänomenen."
