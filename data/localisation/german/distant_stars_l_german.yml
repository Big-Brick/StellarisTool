 enigmatic_cache: "Sondenwesen"
 enigmatic_cache_plural: "Sondenwesen"
 #TECHNOLOGIES
 tech_gargantuan_evolution: "Gargantanische Evolution"
 tech_gargantuan_evolution_desc: "Die Eier der Todesbrut haben sich so entwickelt, dass sie Energie vom nächst gelegenen Stern absorbieren und konservieren, um den rauen Bedingungen des Weltraums standzuhalten."
 #EVENT CHAINS:
 generation_ship_chain_title: "Die Vechtar Zavonia"
