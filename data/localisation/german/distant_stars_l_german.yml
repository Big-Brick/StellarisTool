 ### Impossible Organism ###
 impossible_organism_project_1: "Unmöglicher Organismus"
 impossible_organism_project_1_DESC: "Die [impossible_organism_science_ship.GetName] hat erfolgreich eine Probe des äußerst robusten Organismus genommen, dass auf der giftigen Oberfläche von [impossible_organism_planet.GetName] gefunden wurde.\n\nUnsere Biologen würden diese gerne genauer untersuchen."
 impossible_organism_project_2: "Unmöglicher Organismus: Fortsetzung"
 impossible_organism_project_2_DESC: "Die auf [impossible_organism_planet.GetName] gefundene Lebensform hat außerordentliches Wachstum in feindlichen Umgebunden gezeigt.\n\nWeitere Studien werden benötigt, damit unsere Biologen die Mysterien ihrer genetischen, zellulären und biochemischen Prozesse entschlüsseln können."
 ### Molluscoid Miners ###
 molluscoid_miners_project_1: "Molluskoide Minenarbeiter"
 molluscoid_miners_project_1_DESC: "Erforscht die Molluskoide und versucht herauszufinden, wie sie mit solcher Leichtigkeit Mineralvorkommen finden."
 molluscoid_miners_project_2: "Integration der Molluskoide"
 molluscoid_miners_project_2_DESC: "Beginnt mit der Integration der Molluskoide Minenarbeiter in die [Root.Owner.GetAdj]e Gesellschaft."
 molluscoid_miners_project_3: "Mineralienproduktion"
 molluscoid_miners_project_3_DESC: "Beginnt mit der Erforschung und Implementierung eines Systems, das in der Lage ist, unterirdisches Terrain schnell zu kartografieren und so die Mineralienproduktion zu verbessern."
 ### Orbital Speed Demon ###
 speed_demon_open_box_project: "Aufbrechen der Alien-Box"
 speed_demon_open_box_project_DESC: "Beginnt damit die außerirdische Box zu öffnen, die im Orbit von [speed_demon_orbit_body.GetName] gefunden wurde."
 speed_demon_learn_more_project: "Erforschung der Alien-Box"
 speed_demon_learn_more_project_DESC: "Erforscht die außerirdische Box, die im Orbit von [speed_demon_orbit_body.GetName] gefunden wurde, um ihren Inhalt festzustellen."
 ### Breathing Rift ###
 breathing_rift_project: "Einatmen, Ausatmen"
 breathing_rift_project_DESC: "Beobachtet den Riss, der in der Nähe von [breathing_rift_object.GetName] entdeckt wurde, und wartet auf das, was auch immer herauskommt - falls denn etwas herauskommt."
 story.101.aa: "$story.201.aa$"
 story.101.bb: "$story.201.bb$"
 story.101.bb.exter: "Eine Studie könnte künftige Vernichtungen beschleunigen."
 story.101.cc: "$story.201.cc$"
 story.101.aa.amoebahunt: "§G+1000§! £energy£ für jede zerstörte Flotte der Weltraumamöben."
 story.105.bb: "Die Flagellen sind faszinierend."
 story.105.aa: "Nehmt ein paar Gewebeproben."
 story.107.name: "Amöben befriedet"
 story.107.desc: "Gelegentlich die Emissionen der Reaktorkerne unserer Schiffe zurückzuhalten, während sie in der Nähe von Weltraumamöben sind, scheint auszureichen, um sie zu beruhigen.\n\nMit diesem neuen Protokoll sind sie keine Bedrohung mehr und wir sind in der Lage, sie aus nächster Nähe zu studieren."
 story.107.a: "Hervorragend."
 story.107.a.tooltip: "Modifikator §Y$pacified_amoebas$§! hinzugefügt, der folgende Auswirkung hat:\nFlotten von §HWeltraumamöben§! sind §Gnicht feindlich§!"
 pacified_amoeba_tt: "Flotten von §HWeltraumamöben§! sind §Gnicht§! länger §Gfeindlich§! gesinnt"
 story.201.aa: "Einfache Beute."
 story.201.aa.crystalhunt: "§G+500§! £minerals£ für jede zerstörte Flotte der Kristallwesen."
 story.201.bb: "Faszinierende Kreaturen."
 story.201.cc: "Wir können lernen zu koexistieren."
 story.207.name: "Kristalle befriedet"
 story.207.desc: "Die kristallien Entitäten scheinen als Reaktion auf etwas zu resonieren, einer ihrer wenigen Wechselwirkungen mit der Umwelt. Die genauere Natur und der mögliche Zweck dieser Wellen muss noch bestimmt werden, aber im Moment können sich unsere Schiffe mit Radiopings annähern und sich damit praktisch selbst als Kristalle tarnen."
 story.207.a: "Resonant."
 story.207.a.tooltip: "Modifikator  §Y$pacified_crystals$§! hinzugefügt, der folgende Auswirkung hat:\nFlotten von §HKristallwesen§! sind §Gnicht feindlich§!"
 #crystal station destroyed
 story.222.name: "Kristall zerstört"
 story.222.desc: "Wir haben das kristalline Konstrukt im [FromFrom.solar_system.GetName]-System zerstört. Es erwies sich als äußerst robust und einige Scherben konnten für weitere Untersuchungen geborgen werden. Wir sollen in der Lage sein, die rekonstruktiven Eigenschaften der Kristallmatrix nachzubilden, die während der Schlacht beobachtet wurde."
 story.305.aa: "$story.201.aa$"
 story.305.bb: "Faszinierende Automaten."
 #drone station destroyed
 story.332.name: "$story.333.name$"
 story.332.desc: "Wir haben die Basis der Bergbaudrohnen zerstört und konnten die meisten ihrer Mineral-Lagerstätten und wertvollen Legierungen zurückgewinnen."
 story.332.a: "Unzählige Reichtümer."
 story.332.b: "...und eine merkwürdige Apparatur ..."
 CRYSTALS_PROJECT: "Kristallines Studium"
 CRYSTALS_PROJECT_DESC: "$CRYSTALS_1_PROJECT_DESC$"
 CRYSTALS_PACIFICATION_PROJECT: "Kristalline Befriedung"
 CRYSTALS_PACIFICATION_PROJECT_DESC: "Die Kristallwesen, die in einigen Systemen beobachtet werden konnten, sind impulsiv und potenziell gefährlich. "
 DRONES_PROJECT: "Drohnenstudium"
