 ####################################
 #FROM = planet scope
 #ROOT = ship scope
 ### Trojan Asteroid ###
 disco_trojan_asteroid_cat: "Unbekannte Innenseite"
 disco_trojan_asteroid_cat_desc: "Erste Scans des Asteroiden [From.GetName] lassen eine dichte Masse aus bearbeiteten Metallen erkennen, die vielleicht Teil einer Maschine oder anderen Technologie sind. Weitere Scans sind erforderlich, um detaillierte Daten zu erhalten."
 ### Impossible Organism ###
 disco_impossible_organism_cat: "Unmöglicher Organismus"
 disco_impossible_organism_cat_desc: "Bei der Untersuchung des toxischen Planeten [From.GetName] wurden unerwartet Lebenszeichen gefunden. Kleine, aber signifikante."
 ### Stranded Scientist ###
 disco_stranded_scientist_cat: "Überreste der Raumfahrt"
 disco_stranded_scientist_cat_desc: "Auf der ganzen Oberfläche von [From.GetName] sind Stücke aus Metall verstreut und umgeben etwas, das wie der Rumpf eines Schiffes aussieht. Das Wrack scheint verlassen, aber Energiewerte sind trotzdem messbar."
 ### Molluscoid Miners ###
 disco_molluscoid_miners_cat: "Mögliche Einwohner"
 disco_molluscoid_miners_cat_desc: "Optische Scans des Planeten [From.GetName] haben eine hüttenähnliche Struktur offenbart, die Teile der Oberfläche abdecken. Es lässt darauf schließen, dass es bewohnt ist."
 ### Alien Machine ###
 disco_alien_machine_cat: "Alien-Maschine"
 disco_alien_machine_cat_desc: "Auf der Oberfläche von [From.GetName] befindet sich eine große Maschine unbekanntem Ursprungs und Zweck."
 ### Orbital Speed Demon ###
 disco_speed_demon_cat: "Orbitaler Geschwindigkeitsdämon"
 disco_speed_demon_cat_desc: "In einer Umlaufbahn um [From.GetName] herum befindet sich ein kleines, unbekanntes Objekt, das sich mit einer so hohen Geschwindigkeit bewegt, dass es fast unmöglich scheint."
 ### Breathing Rift ###
 disco_breathing_rift_cat: "Lichtphänomen"
 disco_breathing_rift_cat_desc: "Ein unbekanntes Phänomen wurde in der Nähe von [From.GetName] entdeckt. Es bewirkt, dass Licht häufig gebrochen und gelegentlich sogar vollständig absorbiert wird."
