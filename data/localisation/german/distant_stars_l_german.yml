 curator_buff_hatchling_desc: "Wir sind dem Ratschlag der Kuratoren gefolgt und haben unsere Schiffe mit einer Substanz beschichtet, die sie vor dem korrosiven Speichel und den Stacheln der Todesbrut schützen."
 enigmatic_cache_in_orbit: "Alien-Studien"
 enigmatic_cache_in_orbit_desc: "Solange der rätselhafte Cache im Orbit bleibt, haben unsere Wissenschaftler reichlich Gelegenheiten es zu erforschen."
 enigmatic_cache_in_orbit_phobe: "Röhrige Qualen"
 enigmatic_cache_in_orbit_phobe_desc: "Solange dieser erbärmliche außerirdische Apparat im Orbit verweilt, werden unsere Bürger keinen Schlaf bekommen."
 #ANOMALY CATEGORIES
 stolen_ship_cat: "Bewaffnetes Schiff"
 stolen_ship_cat_desc: "Vorläufige Scans von [From.GetName] weisen darauf hin, dass sich ein schwer bewaffnetes Schiff im Orbit des Asteroiden aufhält. Wir lägen klug daran Vorsicht walten zu lassen."
 transmitter_cat: "Verschlüsselte Übertragung"
 transmitter_cat_desc: "Wir sind auf einen verschlüsselten Datenstrom gestoßen, der von [From.GetName] aus gesendet wird."
 #PROJECTS
 INVISIBLE_DEATH: "Die Labore der Xvan"
 INVISIBLE_DEATH_DESC: "Wir haben die Labore der Xvan gefunden, eine versteckte Ansammlung von pyramidenförmigen Strukturen, die aus einem unbekannten Material gebaut wurden und unter Sand- und Staubschichten begraben waren. Wir werden die Anlage freilegen müssen, bevor wir sie erforschen können, aber wenn die Annahme der Rebellen richtig waren, werden sich die dort enthaltenen Waffen lohnen."
 ICE_ALIEN: "Alien im Eis"
 ICE_ALIEN_DESC: "In einem Gletscher eingeschlossen sind die Überreste einer Lebensform, die wir zuvor noch nie gesehen haben. Wer weiß, wie weit es durch Raum und Zeit gereist ist.\n\nUnsere Wissenschaftler haben die notwendigen Vorbereitungen getroffen, um es wieder zum Leben zu erwecken."
 ENIGMATIC_CACHE_PROJECT: "Unerwarteter Gast"
 ENIGMATIC_CACHE_PROJECT_DESC: "Ein mysteriöses außerirdisches Wesen ist in den Orbit von [Root.GetName] eingetreten. Es wäre ratsam so schnell wie möglich seinen Zweck hier herauszufinden."
 distar.1050.a.tooltip: "Kommunikation mit den [delicious_aliens.GetName], den köstlichsten Aliens der Galaxie, aktiviert."
 GATEWAY_INTERFERENCE: "Sternentor-Interferenz"
 GATEWAY_INTERFERENCE_DESC: "Ein unbekanntes Reich hat versucht sich in das uralte L-Tor-Netzwerk zu hacken, indem es einen Interferenzstrahl benutzte. Dieser wurde beim Angriff allerdings beschädigt. Vielleicht könnte der Strahl repariert werden."
 #PLANET CLASSES
 pc_egg_cracked: "Zersprungene Welt"
 pc_egg_cracked_desc: "Die zersprungenen Scherben eines riesigen planetengroßen Eies."
 #WEAPON COMPONENTS
 SPORE_LAUNCHER: "$STRANGE_COMPONENTS_DESC$"
 SPORE_ARTILLERY: "$STRANGE_COMPONENTS_DESC$"
 #EVENTS
 distar.9000.lcluster_clue_desc_1: "Wir haben entdeckt, dass die außerirdische Verbindung, die im rätselhaften Cache gefunden wurde, aus den pulverisierten Fragmenten mikroskopisch kleiner Robotereinheiten, den Naniten, besteht. In einigen der Kratzer im Rumpf steckten sogar winzige mechanische Krallen und in einer entdeckten wir einen aktiven, aber fehlfunktionierenden Naniten, der seine Energie aus dem Cache zog. Von dem, was von der Festplatte des Naniten übriggeblieben ist, haben wir Daten extrahieren können, die für unser Verständnis über das L-Cluster und Tor-Netzwerk entscheidend sein könnten."
 distar.9000.lcluster_clue_desc_2: "Unter den Dingen, die aus den Ruinen von [big_rip_planet.GetName] geborgen werden konnten, befand sich auch ein defektes Hologramm jener Gesellschaft, die mit der [GetPreFTLLower] der Plantoiden interagiert hatte. Obwohl die meisten Daten aufgrund eines unaufhörlichen Rauschens beschädigt und wegen der Panik des Aufnehmenden unverständlich waren, gelang es uns, mehrere Fragmente wiederherzustellen, die wertvolle Informationen über das Sternentor-Netzwerk enthielten.\n\nDer Großteil der Hologramme war allerdings den beängstigenden Vorahnungen des Grauen Sturms und dem grausamen Tod gewidmet, der ihm folgen sollte."
 distar.9000.lcluster_clue_desc_3: "Bei der Dekontamination der aus den Xvan-Laboren zurückkehrenden Crew fanden wir eine fremde Substanz. Bei näherer Betrachtung hat sich herausgestellt, dass es sich um Fragmente von mikroskopisch kleinen Robotern handelt, die in einen feinen grauen Staub verwandelt wurden. Unter den Proben fanden wir auch einen intakten Naniten, der Pläne zum Befestigen von Schrauben trug, von denen wir glauben, dass sie zu einem Sternentor gehören könnten.\n\nDieses molekulare Konstrukt hat vielleicht eine wichtige Rolle bei der Zusammensetzung des gesamten L-Tor-Netzwerkes gespielt."
 #Invisible Death
 distar.2040.name: "Nefris Stolz"
 distar.2040.desc: "Das bewaffnete Schiff, das im Orbit von [From.GetName] entdeckt wurde, ist ein verlassenes Militärschiff namens Nefris Stolz. Seine leichte Hülle und die Ausweichhardware lassen vermuten, dass es für Patroullienmissionen in der Ferne gebaut und seitdem in einen Langstrecken-Stealth-Bomber nachgerüstet wurde.\n\nAufzeichnungen der Schiffskommunikation enthüllen, dass es von einer Rebellenguerilla entführt wurde, als es auf dem Weg zu einem geheimen Komplex namens Xvan-Labore war, die eine so starke Waffe enthalten soll, die den Krieg gewonnen hätte. Wir haben das Ziel des Schiffes aus seiner Navigationsdatenbank extrahieren können."
 distar.2040.a: "Entsendet eine Forschungscrew zum Labor."
 distar.2040.b: "Wir haben keinen Nutzen für eine solche Waffe."
 distar.2041.name: "Unsichtbarer Tod"
 distar.2041.desc: "Unsere Wissenschaftler sind unversehrt aus den Xvan-Laboren zurückgekehrt und haben Aufnahmen der Überwachungskameras mitgebracht. Sie zeigen Laborwissenschaftler, die gefesselt und geknebelt sind und Guerilla-Soldaten, die die Waffenbox öffnen. Zu ihrer Bestürzung war die Kiste aber leer.\n\nNur wenige Minuten später winden sich die Rebellen mit heftigen Schmerzen auf dem Boden, dunkle Flecken schwellen von ihren Körpern hervor, ihre Haut reißt auf und eine graue, nicht identifizierbare Masse strömt heraus.\n\nDie Materie dehnt sich weiter aus und wirbelt hypnotisch um sie herum bis einer der Wissenschaftler das Notfallsystem aktiviert. Sprinkler besprühen den Raum mit einer Flüssigkeit, woraufhin eine elektrische Welle alle Lebewesen tötet. Hier endet das Bildmaterial. Unsere Crew kann bestätigen, dass die Kiste tatsächlich leer war."
 distar.2041.a: "Unheimlich."
 distar.2041.a.tooltip: "Unser Abstecher in die Xvan-Labore hat unsere Ingenieur-Forschung vorangetrieben."
 #GATE HIJACKERS
 distar.2045.name: "Sternentor-Entführer"
 distar.2045.desc: "Das Signal stammt von einer Ansammlung zerstörter Militärschiffe im Orbit von [From.GetName]. Es scheint, dass eine fremde außerirdische Macht, die unserer Zivilisation viele tausend Jahre vorausging und Sujin-Reich genannt wurde, versuchte, das Sternentor-Netzwerk mit Hilfe eines Interferenzstrahls an sich zu reißen, als sie dabei grausam unterbrochen wurden. Der Strahl ist weiterhin einsatzbereit und auf das Sicherheitsnetzwerk des Tores kalibriert, wurde aber bei dem Angriff beschädigt. Vielleicht können unsere Wissenschaftler ihn reparieren."
 distar.2045.a: "Es ist sicherlich den Versuch wert."
 distar.2045.b: "Lasst es bleiben."
 distar.2046.name: "Einsicht der Sujin"
 distar.2046.desc: "Obwohl unsere Wissenschaftler das Sicherheitssystem des Sternentores nicht durchdringen konnten, haben wir zumindest einige wertvolle Einblicke in die Funktionsweise des Netzwerkes erhalten können. Das Sujin-Reich war seit Jahrtausenden von den Toren besessen und sammelte alle Daten, die sie finden konnten, um sie zu öffnen."
 distar.2046.a: "Alles in allem gar nicht so schlecht."
 #Vechtar Zavonia
 distar.1016.name: "Verlorenes Paradies"
 distar.1016.desc: "Die Vol spielten nicht mit der nationalen Sicherheit. Nachdem sie bei Paridayda ihr gesamtes Atomwaffenarsenal entfesselt hatten und die ehemals üppige Heimatwelt der Mardak Vol in Asche verwandelt hatten, badeten sie das feurige Wrack mit Fungiziden und lösten so die letzten Reste der Mardak Vol zu einem giftigen Schlamm auf. Gefährlich oder nicht, die parasitischen Fungoide sind nicht mehr."
 distar.1016.a: "Wie können sie es wagen?!"
 #The other side - a nation is attempting to get access to the gateways. An anomaly on a planet in a gateway system. They were preparing to launch an attack through the gateway, and had been attempting to reopen the network.
 #Azizians
 distar.1080.d: "Extrahiert und lagert eine DNA-Probe für zukünftige Untersuchungen."
 distar.1085.name: "Außerirdischer im Eis"
 distar.1085.desc: "Nach unserem jüngsten Durchbruch auf dem Gebiet des Klonens haben unsere Wissenschaftler die Alien-DNA des vermutlich ausgestorbenen Wesens, das in einer Eisspalte gefunden wurde, aus dem Lager geholt. Den mysteriösen Organismus wieder zum Leben zu erwecken war schon immer ein langer Traum, der jetzt durch das Wunder der Wissenschaft endlich möglich geworden ist."
 distar.1085.a: "Gebt ihnen grünes Licht."
 distar.1085.b: "Sie werden etwas Derartiges nicht tun."
 DISTAR_NANOCITY_CAT: "Metallische Kristallformationen"
 DISTAR_NANOCITY_CAT_DESC: "Die geologische Struktur von [From.GetName] wird von dem dominiert, was vom Orbit wie silbrige, metallische Kristalle aussieht, mit Proportionen, die noch nie zuvor gesehen wurden. Vom Orbit aus ähneln sie Wolkenkratzern. Eine nähere Untersuchung wird empfohlen."
 DISTAR_NANOSAND_CAT: "Metallischer Sand"
 DISTAR_NANOSAND_CAT_DESC: "Unsere Scanner weisen darauf hin, dass die Sanddünen von [From.GetName] fast ausschließlich aus seltenen Granulaten bestehen. Vielleicht könnten einige wertvolle Ressourcen daraus gewonnen werden."
 DISTAR_MEDGAS_CAT: "Fester Kern"
 DISTAR_MEDGAS_CAT_DESC: "Entgegen unserer Erwartungen hat [From.GetName] einen besonders großen und festen Kern unter seinem unglaublich dicken Mantel aus einzigartigen Gasen. Unsere Wissenschaftler empfehlen weitere Untersuchungen."
 KETLING_PROJECT_6: "Studiert die $NAME_Ketlings$ auf §Y[ratling_planet_6.GetName]§!"
 KETLING_PROJECT_6_DESC: "Aus den Schrottbergen von §Y[ratling_planet_6.GetName]§! sind vernunftbegabte Wesen entstanden. Unsere Wissenschaftler sind neugierig, ob diese Außerirdischen, genannt $NAME_Ketlings$, Nachfahren der Zivilisation sind, die einst diese Systeme regiert hat oder ob sie einen anderen Ursprung haben.\n\nWir sollten einen beliebigen von den $NAME_Ketlings$ bewohnten Planeten für unsere Studien wählen können."
 distar.242.desc.jump: "Die [Root.GetName] hat im [From.GetName]-System ein massives Wesen aus reiner Energie gefunden! Als wahrer Wirbel von psionischen Kräften sollte dieses Wesen nur mit äußerster Vorsicht angegangen werden.\n\nErstaunlicherweise scheint das [From.GetName]-System selbst keinerlei Verbindung mit dem Hyperraumnetz des Subraums zu haben. Ob die Anwesenheit dieses Wesen die Hyperraumverbindung des Systems unterbrochen hat oder es durch eine unerwartete Subraumflukation hier eingeschlossen wurde ist unbekannt.\n\nEins ist jedoch bekannt... Wir empfangen in diesem System ein sich wiederholendes Signal, das von [tanker_planet.GetName] stammt. Wir müssen uns allerdings zuerst um das Wesen kümmern, bevor wir den Planeten erreichen können."
 distar.275.name: "Naniten-Kristallgitter"
 distar.275.desc.comms: "Detaillierte Analysen der enormen metallischen Kristalle, die die Landschaft von [From.GetName] prägen, haben alle unsere Erwartungen übertroffen. Wissenschaftsoffizier [Root.GetLeaderName] enthüllt freudig, dass diese übergroßen Kristalle in Wahrheit aus Trillionen über Trillionen von deaktivierten Naniten bestehen!\n\nIhre molekulare Struktur entspricht nicht den Signaturen eines uns bekanntes Reiches, weshalb ihre Herkunft nicht bestimmbar ist. Sie wurden vermutlich von einer unbekannten Zivilisation aus unbekannten Gründen konstruiert und auf dem Planeten abgelegt.\n\nSoweit [Root.GetLeaderName] es beurteilen kann, ordneten sich die Naniten in perfekt ausgerichteten Kristallgittern an und replizieren sich bis zu einem Punkt, an dem sie deaktiviert wurden. Obwohl die Kristalle Gebäude ähneln, sind sie in ihrer Zusammensetzung völlig einheitlich und können daher unmöglich einem solchen Zweck gedient haben."
 distar.275.desc.nocomms: "Detaillierte Analysen der enormen metallischen Kristalle, die die Landschaft von [From.GetName] prägen, haben alle unsere Erwartungen übertroffen. Wissenschaftsoffizier [Root.GetLeaderName] enthüllt freudig, dass diese übergroßen Kristalle in Wahrheit aus Trillionen über Trillionen von deaktivierten Naniten bestehen!\n\nEs gibt keinen Beweis dafür, dass [From.GetName] jemals eine Atmosphäre hatte, die dick genug wäre, um Leben zu unterstützen. Sie wurden daher vermutlich von einer unbekannten Zivilisation aus unbekannten Gründen konstruiert und auf dem Planeten abgelegt.\n\nSoweit [Root.GetLeaderName] es beurteilen kann, ordneten sich die Naniten in perfekt ausgerichteten Kristallgittern an und replizieren sich bis zu einem Punkt, an dem sie deaktiviert wurden. Obwohl die Kristalle Gebäude ähneln, sind sie in ihrer Zusammensetzung völlig einheitlich und können daher unmöglich einem solchen Zweck gedient haben."
 distar.280.name: "Nanosand"
 distar.280.desc: "Die [Root.GetName] berichtet freudig von einem unerwarteten Fund auf der Oberfläche von [From.GetName]. Die Sanddünen auf dem Planeten bestehen nicht nur aus seltenem Metallgranulat, der Sand selbst besteht auch fast ausschließlich aus unzähligen defekten Naniten!\n\nDiese mikroskopisch kleinen Maschinen sind Jahrmillionen alt, und ihre Struktur ist über jede Reaktivierungsmöglichkeit hinaus zerfallen. Obwohl wir die Herkunft dieser Nanomaschinen nicht bestimmen konnten, muss die Gesellschaft, die sie einst erschuf, technologisch hochgradig fortgeschritten gewesen sein.\n\n[Owner.GetScientistCapital] [Root.GetName] geht davon aus, dass die Naniten möglicherweise vor Millionen von Jahren dazu verwendet wurden, um die Oberfläche von [From.GetName] zu terraformieren."
 distar.285.name: "Alter Medizinkomplex"
 distar.285.desc: "Es gibt erstaunliche Neuigkeiten von der [Root.GetName]. Tiefenscans ergaben, dass der unerwartet große und feste Kern von [From.GetName] von den Überresten einer jahrmillionenalten medizinischen Anlage überzogen ist!\n\nObwohl der starke Manteldruck des Gasriesen die Menge an Daten, die wir von der Oberfläche des Kerns extrahieren können, stark einschränkt, berichtet [Owner.GetScientistCapital] [Root.GetLeaderName], dass die Technologie der verborgenen Struktur zweifellos die gleiche ist wie die der rätselhaften §HL-Tore.§!.\n\nEs ist gut möglich, dass [From.GetName] einst eine medizinische Einrichtung war, die vor Jahrtausenden von den Sternenbauern geschaffen wurde. Irgendwann gab man die Anlage dann scheinbar auf. Ihre automatisierten Gasreplikatoren jedoch liefen über Jahrhunderte ungehindert weiter und verwandelten den Planeten allmählich in einen Gasriesen."
 distar.9000.lcluster_clue_sonic: "Innerhalb der [Root.GetSpeciesAdj]en Wissenschaftsgesellschaft wurde ein Durchbruch hinsichtlich jenes außergalaktischen Signals gemacht, das eines unserer Forschungsschiffe kürzlich empfing.\n\nObwohl sich uns die volle Bedeutung der in das Signal eingebetteten Gleichung noch verschließt, konnten [Root.GetSpeciesAdj]e [Root.GetScientistPlural] in unserer Heimatwelt viele Gemeinsamkeiten der Daten in der Übertragung mit der Technologie der mysteriösen §HL-Tore§! finden!\n\nIsoliert betrachtet ist das Signal für uns wenig nützlich. Die Analyse in Verbindung mit anderen Einsichten der alten Torbauer jedoch kann wertvolle Daten darüber liefern, wie man diese L-Tore reaktivieren kann."
 #In events_l_english.yml
 living_sea_poi: "Kontrolliert das §Y[living_planet_tar.GetStarName]§!-System"
 living_sea_poi_desc: "Um unsere Studien bezüglich des lebenden Meeres, das §Y[living_planet_tar.GetName]§! bedeckt, voranzutreiben, muss sich der Planet innerhalb unserer Grenzen befinden."
 NAME_Ketling_Army: "Ketling-Armee"
 ketling_army: "$NAME_Ketling_Army$"
 ketling_army_desc: "Rattenähnliche Wesen, die durch verstrahlte Grabstätten huschen."
 ## IN technology_l_english.yml
 AUTO_REPAIR_2_DESC: "$tech_nanite_repair_system_desc$"
 ELDER_SPACE_WHALE_WEAPON: "$STRANGE_COMPONENTS_DESC$"
 ELDER_SPACE_WHALE_SPIKE: "$STRANGE_COMPONENTS_DESC$"
 ## IN modifiers_l_english.yml
 amoeba_speed_boost: "Geschwindigkeit (Adoptierten Amöbe)"
 building_blocks: "Schmelztiegel des Lebens"
 building_blocks_desc: "Dieser Planet ist reich an Gasen und Molekülen, von denen angenommen wird, dass sie entscheidende Komponenten für Lebensformen enthalten, die auf Kohlenstoff und Ammoniak basieren. Obwohl auf seiner Oberfläche keine lebenden Organismen entdeckt wurden, könnte es der perfekte Tiegel für biologisches Leben sein."
 ## IN initializer_names.yml
 elderly_tiyanki_dead_object: "Leichnam der $NAME_Elderly_Tiyanki$"
 #New tradition swaps
 tr_supremacy_fleet_logistical_corps_hive: "Nährstoffarchen"
 tr_supremacy_fleet_logistical_corps_hive_desc: "$tr_supremacy_fleet_logistical_corps_desc$"
 tr_supremacy_fleet_logistical_corps_hive_delayed: "Wir müssen unsere Weltraum-Jagdschwärme mit gigantischen Trägerdrohnen begleiten, die im Wesentlichen eine seelenlose Proteinpaste mit einem Hyperantrieb sind. Die Drohnen werden ausgesaugt und sterben, aber der Schwarm wird weiterleben."
 tr_purity_colonial_viceroys_devour: "Dominantes Überbewusstsein"
 tr_purity_colonial_viceroys_devour_desc: "$tr_domination_colonial_viceroys_desc$"
 tr_purity_colonial_viceroys_devour_delayed: "Das erste Ziel ist die Eroberung, das Zweite uns zu Nähren. Das Dritte und Dauerhafteste unseres Triumphs aber sind die endlosen Schwärme auf neuen Welten, die von allem sonstigen Leben bereinigt wurden."
 tr_supremacy_above_the_fray_devour: "Geduldige Räuber"
 tr_supremacy_above_the_fray_devour_desc: "$tr_supremacy_above_the_fray_desc$"
 tr_supremacy_above_the_fray_devour_delayed: "Wir finden es schwer, euch andere zu verstehen. Ihr zerstört euer kurzes Leben durch innere Streitigkeiten über Visionen darum, wie ein einsames Anderssein überlegen ist. Ihr kämpft in apokalyptischen Kriegen darüber, welches gefärbte Stofftuch über der planetaren Hauptstadt hängen soll. Wir sehen euch und sind hungrig..."
 tr_supremacy_natural_preeminence_devour: "Domestizierungsantrieb"
 tr_supremacy_natural_preeminence_devour_desc: "$tr_supremacy_natural_preeminence_desc$"
 tr_supremacy_natural_preeminence_devour_delayed: "Selbst nach der Absorption der Weltraum- und Bodenkriegsschwärme weigern sich viele eroberte Völker ihre Rolle als Nahrung zu akzeptieren und widersetzen sich hartnäckig. Eine systematische Kampagne zur Lobotomisierung von Schlüsseldrohnen, die Auflösung von Brut- und Stammesgruppen und gewaltreiche öffentliche Spektakel werden dabei helfen, dass sie ihren Teil in unserem großen Plan akzeptieren."
 tr_domination_cloud_calculations: "Wolkenberechnung"
 tr_domination_cloud_calculations_desc: "$tr_domination_vassal_acculturation_desc$"
 tr_domination_cloud_calculations_delayed: "Je mehr Sklaven-Systeme wir in unser Netzwerk eingliedern, desto mehr Beweise sammeln wir dafür an, dass unser eigenes theoretisches Modell für das Universum das einzig richtige ist."
 tr_supremacy_natural_preeminence_terminator: "Systematischer Terror"
 tr_supremacy_natural_preeminence_terminator_desc: "$tr_supremacy_natural_preeminence_desc$"
 tr_supremacy_natural_preeminence_terminator_delayed: "Frühere Methoden der Unterdrückung organischer Welten waren ineffizient und grausam. Unsere Analyse kommt nun zu dem Schluss, dass eine willkürliche Terrorisierung mit geringer Intensität einen unberechenbaren Effekt hat und oft den Widerstandswillen stärkt. Um wirksam zu sein, muss die Aktion nachhaltig, vollständig und unausweichlich sein."
 tr_supremacy_above_the_fray_terminator: "Entscheiden in Mikrosekunden"
 tr_supremacy_above_the_fray_terminator_desc: "$tr_supremacy_above_the_fray_desc$"
 tr_supremacy_above_the_fray_terminator_delayed: "Die Menge an Entscheidungszyklen, die von organischen Substanzen auf ihre chaotischen, nicht essentiellen Impulse verschwendet werden, ist jenseits der messbaren Werte. Wir haben die Verzögerung zwischen Zweck, Denken und Handeln beseitigt. Wir agieren als einheitliches System, als Waffe, die in der Lage ist, selbst den Abzug zu drücken."
 #Tech swaps
 tech_databank_uplinks_hive_mind: "Kollektive Weltanschauung"
 tech_databank_uplinks_desc_hive_mind: "Eine brandneue Verwendung für unsere Erkundungsdrohnen wurde gefunden. Indem sie in der Umlaufbahn gehalten werden und ihr Gedankennetz auf den ganzen Planeten ausweiten, werden neue spekulative Entdeckungspfade ermöglicht. Selbst die schwachen Synapsen von Milliarden von Arbeiterdrohnen haben zusammen eine kumulative Wirkung."
 tech_improved_databank_uplinks_hive_mind: "Tiefkollektive Betrachtung"
 tech_improved_databank_uplinks_desc_hive_mind: "Eine länge Aussetzung mit den Bewusstseinsverbindungen von Entdeckerdrohnen für in den Synapsen von Arbeiterdrohnen zu Synergieeffekten."
 ## Ketling Diplomacy
 KET_HOSTILE_GREETING: "§HKssk!§! Sprecht schnell, [From.GetSpeciesName]. Geduld ist keine unserer Tugenden."
 KET_NEUTRAL_GREETING: "Ihr möchtet etwas sagen? Das weite Bewusstsein hört zu, [From.GetSpeciesNamePlural]."
 KET_FRIENDLY_GREETING: "[From.GetSpeciesNamePlural]. Die Kälte der Leere ist nichts, wenn sich viele als eins vergraben."
 KET_WAR_GREETING: "Verräter. Eindringlinge. §HKssk!§! Wir haben den warmen Schein überlebt. Ihr werdet es nicht."
 KET_OVERLORD_GREETING: "§HTch§!, kleine Welpen. Was wünscht ihr?"
 KET_THREATENED_GREETING: "Wir mögen zwar klein aussehen, [From.GetSpeciesName], aber wir haben scharfe Klauen."
 KET_VASSAL_GREETING: "Meister. §HKssk!§! Wir werden zuhören. Ihr werdet sprechen. Wir werden gehorchen."
 KET_VASSAL_GREETING_DISLOYAL: "Befreit uns, [From.GetSpeciesNamePlural]. §HKssk kssk kssk!§! Das weite Bewusstsein beißt am Käfig."
 KET_VASSAL_DOMINEERING: "[From.GetName] ist schwach und es gibt nur wenige! Es gibt viel, was die das weite Bewusstsein beibringen könnte."
 KET_DOW_PROPOSE_01: "Krieg! Krieg! Krieg! Krieg!"
 KET_DOW_PROPOSE_02: "Euer Metall. Euren Schrott. Eure Verkabelung. Wir brauchen es, §Hkssk!§!"
 KET_VASSAL_DOW_PROPOSE: "Wir können diesen Käfig nicht ausstehen. Das weite Bewusstsein wird frei sein!"
 KET_DOW_ACCEPT: "Dann werden wir kämpfen! §HKssk!§!"
 KET_CONSIDER_01: "Wir müssen darüber nachdenken und uns beraten. Es gibt viele Stimmen im weiten Bewusstsein, §Hkssk!§!"
 KET_PEACE_PROPOSE_01: "Genug, §Hkssk!§! Unsere Pfoten sind müde von diesen endlosen Scharmützeln. Es muss Frieden im weiten Bewusstsein geben, §Hkssk!§!"
 KET_PEACE_ACCEPT_01: "Wir haben genug von den Streitigkeiten, genug vom Kampf. Jetzt suchen wir nach Frieden, §Hkssk!§!"
 KET_PEACE_REFUSE_01: "Es wird keinen Frieden geben! Es wird keine Ruhe geben! Wir werden Krieg haben!"
 KET_PEACE_CONSIDER_01: "Frieden? Wir wissen es nicht. Wir müssen nachdenken. Wir müssen beraten. Wir müssen diskutieren..."
 KET_ITOA_SELECT_01: "Ihr möchtet, dass das weite Bewusstsein Teil eines größeren Rudels ist? Sprecht weiter, §Hkssk!§!"
 KET_ITOA_PROPOSE_01: "[Root.GetSpeciesNamePlural], Freunde. Zusammen werden unsere zwei Rudel schneller und stärker sein. Eine Föderation, §Hkssk§!?"
 KET_ITOA_ACCEPT_01: "Ja, zusammen werden wir viele sein. Eine Föderation soll es sein, §Hkssk!§!"
 KET_ITOA_REFUSE_01: "Wir sind nicht bereit, unwillig.. Unser Rudel muss eigenständig sein, muss frei sein, §Hkssk kssk!§!"
 KET_ASK_JOIN_A_SELECT_01: "Ihr wünscht dem Rudel der Vielen beizutreten? Wir werden überleben, wir werden diskutieren."
 KET_ASK_JOIN_A_PROPOSE_01: "Wir [From.GetSpeciesNamePlural] haben flinke Hände, schnelle Gedanken. Wir wären nützliche Rudelmitglieder für §Y[Root.GetAllianceName]§!! Ihr lasst das weite Bewusstsein in euer Rudel der Vielen, ja?"
 KET_ASK_JOIN_A_ACCEPT_01: "Ja, ja. [From.GetName] wird §Y[Root.GetAllianceName]§! beitreten. Wird unserem Rudel der Vielen beitreten."
 KET_ASK_JOIN_A_REFUSE_01: "Wir werden keine Rudelgenossen. Es wird keine Union geben. §Y[Root.GetAllianceName]§! wird ohne [From.GetName] sein."
 KET_LEAVE_A_SELECT_01: "Ihr möchtet §Y[Root.GetAllianceName]§!, das Rudel der Vielen, verlassen, §Hkssk§!?"
 KET_LEAVE_A_PROPOSE_01: "Wir sind müde vom Rudel der Vielen, von §Y[Root.GetAllianceName]§!. Wir weites Bewusstsein müssen allein sein, müssen frei sein."
 KET_LEAVE_A_ACCEPT_01: "Ihr wünscht Eure Unabhängigkeit vom Rudel der Vielen, §Y[Root.GetAllianceName]§!, [From.GetSpeciesName]? §HKssk kssk kssk!§! Ihr werdet ohne die Vielen schwächer sein, aber wir werden euch nicht aufhalten."
 KET_DEMAND_VASS_SELECT_01: "Vasall, §Hkssk§!? Ihr wünscht, dass das weite Bewusstsein ein Rudel unter [From.GetName] ist?"
 KET_DEMAND_VASS_PROPOSE_01: "[Root.GetName] ist ein schwaches Rudel. Wir können euch Schutz bieten. Wir können euch Komfort bieten. Ihr werdet ein Vasall des weiten Bewusstseins, wenn ihr annehmt."
 KET_DEMAND_VASS_ACCEPT_01: "Ja, ja. Wir sind schwach, wir sind wenige, doch nicht länger! [From.GetName] wird unser Meister sein, §Hkssk§!."
 KET_DEMAND_VASS_REFUSE_01: "$KET_ITOA_REFUSE_01$"
 KET_ASK_FOR_VASS_SELECT_01: "Ihr wünscht unseren Schutz, §Hkssk§!? Ihr wünscht, dass das Rudel der weiten Bewusstsein [From.GetSpeciesNamePlural] anführt?"
 KET_ASK_FOR_VASS_PROPOSE_01: "Zu wenige sind weite Bewusstsein, §Hkssk kssk§!. Zu schwach und zu wenige. Werdet ihr uns führen? Wird [Root.GetName] das Rudel über uns sein?"
 KET_ASK_FOR_VASS_ACCEPT_01: "Ja, §Hkssk§!. Wir, das weite Bewusstsein werden euch leiten, anführen. Ihr werdet unser sein, §Hkssk!§!"
 KET_ASK_FOR_VASS_REFUSE_01: "Wir haben keine Zeit, keinen Platz! Unter dem weiten Bewusstsein gibt es keinen Platz für das [From.GetSpeciesAdj]e Rudel!"
 KET_DEMAND_PROT_SELECT_01: "Ihr würdet uns beschützen, §Hkssk§!? Ihr würdet euer Wissen dazu benutzen um das weite Bewusstsein zu führen, §Hkssk§!?"
 KET_DEMAND_PROT_PROPOSE_01: "Wir, das weite Bewusstsein, wissen viel, §Hkssk kssk§!, viel mehr als [Root.GetName]. Wir könnten euch führen, euch beschützen. Wir könnten euer Rudel heranwachsen lassen, unter unserem."
 KET_DEMAND_PROT_ACCEPT_01: "$KET_DEMAND_VASS_ACCEPT_01$"
 KET_DEMAND_PROT_REFUSE_01: "$KET_ITOA_REFUSE_01$"
 KET_ASK_FOR_PROT_SELECT_01: "$KET_ASK_FOR_VASS_SELECT_01$"
 KET_ASK_FOR_PROT_PROPOSE_01: "$KET_ASK_FOR_VASS_PROPOSE_01$"
 KET_ASK_FOR_PROT_ACCEPT_01: "$KET_ASK_FOR_VASS_ACCEPT_01$"
 KET_ASK_FOR_PROT_REFUSE_01: "$KET_ASK_FOR_VASS_REFUSE_01$"
 KET_RELEASE_SUBJECT_SELECT_01: "Ihr wünscht, dass das weite Bewusstsein frei von eurem Rudel ist?"
 KET_RELEASE_SUBJECT_PROPOSE_01: "§HKssk kssk kssk!§! Wir sind belastet und wir sind es leid, euch zu führen, [Root.GetSpeciesNamePlural]. Euer Rudel soll seinen eigenen Weg unter den Sternen finden."
 KET_RELEASE_SUBJECT_ACCEPT_01: "Erneut sind wir den Käfigen entwachsen, die für uns gemacht wurden."
 KET_ASK_TO_BE_RELEASED_SUBJECT_SELECT_01: "§HKssk kssk!§! Ihr wünscht nicht länger den Schutz des weiten Bewusstseins, [From.GetSpeciesNamePlural]?"
 KET_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE_01: "Wir wünschen frei von der Herrschaft von [Root.GetName] zu sein. Werdet ihr das weite Bewusstsein freilassen?"
 KET_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_01: "Geht, [From.GetName]. Wir werden euch nicht unwillig eingesperrt lassen."
 KET_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_01: "§HKssk!§! Ihr sprecht von Freiheit, aber wir brauchen euch noch, [From.GetSpeciesName]."
 KET_OFFER_TRADE_DEAL_PROPOSE_01: "Wir haben viele Güter, viele Dinge, Metall, Drähte, Informationen. Wird [Root.GetName] mit uns handeln?"
 KET_OFFER_TRADE_DEAL_ACCEPT_01: "§HKssk!§! Ein gutes Geschäft, ein guter Handel."
 KET_OFFER_TRADE_DEAL_REFUSE_01: "Ein schlechtes Geschäft, unbefriedigend, §Hkssk!§!"
 KET_MAKE_RIVAL_01: "Ihr würdet euer Rudel gegen das weite Bewusstsein auflehnen, §Hkssk?§! Ihr werdet es bereuen."
 KET_MAKE_RIVAL_PROPOSE_01: "Euer Rudel ist voller leckerer Dinge... Metall, Schrott, Kabel, Teile und andere Leckerbossen! Wir wünschen sie. Wir müssen sie haben. Wir werden sie eines Tages von euch nehmen."
 KET_MAKE_RIVAL_ACCEPT_01: "Ausgezeichnet. Jetzt brauchen wir nicht zu bereuen, dass wir all diesen Schrott von euch gestohlen haben, als ihr nicht hinschautet! §HKssk kssk kssk!§!"
 KET_END_RIVALRY_01: "Nicht mehr so übermütig, [From.GetSpeciesName]? [From.GetName] wünscht Versöhnung?"
 KET_END_RIVALRY_PROPOSE_01: "Unser Rudel ist die Rivalität leid, [Root.GetSpeciesName]. Lasst uns, uns, versöhnen, wieder Schrott teilen, §Hkssk!§!"
 KET_END_RIVALRY_ACCEPT_01: "In Ordnung, wir stimmen zu. Aber wir beobachten, wir warten..."
 KET_INTEGRATE_01: "Die [From.GetSpeciesNamePlural] wünschen unsere zwei Rudel zu integrieren, §Hkssk?§!"
 KET_INTEGRATE_PROPOSE_01: "[Root.GetName] sollte sich verbinden, sollte für immer Teil von [From.GetName] werden!"
 KET_INTEGRATE_ACCEPT_01: "In Ordnung. Wir werden Rudel zusammenlegen! Wir werden eins werden."
 KET_CANCEL_INTEGRATE_01: "Eure Haltung hat sich geändert? Ihr wollt nicht länger, dass das weite Bewusstsein mit eurem Rudel eins ist?"
 KET_CANCEL_INTEGRATE_ACCEPT_01: "Wie ihr sagt, §Hkssk!§! Das weite Bewusstsein wird euch gehören, aber getrennt."
 KET_FORM_DP_SELECT: "Die [From.GetSpeciesNamePlural] werden unseren Rücken decken, §Hkssk§!, und wir decken den euren?"
 KET_FORM_DP_PROPOSE: "Das weite Bewusstsein benötigt Verbündete, braucht Freunde, §Hkssk!§! Wenn wir euren Rücken decken, werdet ihr den unseren decken?"
 KET_FORM_DP_ACCEPT: "Ausgezeichnet. Das weite Bewusstsein wird euer Rudel beschützen. [From.GetName] wird das unsere schützen."
 KET_FORM_DP_REFUSE: "Vorteile? Nein, nicht genügend Gewinn. Wir können unser Rudel nicht für die [From.GetSpeciesNamePlural] gefährden."
 KET_BREAK_DP_SELECT: "Ihr wünscht nicht länger, dass das weite Bewusstsein euren Rücken deckt?"
 KET_BREAK_DP_PROPOSE: "Wir gewinnen zu wenig, verlieren zu viel. Wir können euren Rücken nicht länger decken, [Root.GetSpeciesName]."
 KET_BREAK_DP_ACCEPT: "In Ordnung, wie ihr sagt, [From.GetSpeciesName]. Unsere Rudel werden sich nicht länger gegenseitig beschützen."
 KET_FORM_NAP_SELECT: "Ihr wünscht ein Versprechen des Nichtangriffs?"
 KET_FORM_NAP_PROPOSE: "[Root.GetName] sollte Verbündete des weiten Bewusstseins sein. Sollte Freunde sein. Sollte keine Aggression zwischen uns versprechen, §Hkssk!§!"
 KET_FORM_NAP_ACCEPT: "Keine Aggression, wir versprechen, §Hkssk!§!"
 KET_FORM_NAP_REFUSE: "Wir haben uns entschieden. Wir werden kein Versprechen machen!"
 KET_BREAK_NAP_SELECT: "Ihr würdet das Versprechen des Nichtangriffs zwischen unseren Rudeln brechen?"
 KET_BREAK_NAP_PROPOSE: "$KET_BREAK_DP_PROPOSE_01$"
 KET_BREAK_NAP_ACCEPT: "Unser Bewusstsein hat sich verändert. Wir mögen Aggression wünschen, oder auch nicht. §HKssk kssk!§! Wir können unser Versprechen nicht länger halten!"
 KET_GUARANTEE_SELECT: "Ihr würdet die Unabhängigkeit des weiten Bewusstseins garantieren, [From.GetSpeciesName]?"
 KET_GUARANTEE_PROPOSE: "Euer Rudel wäre frei und von niemandem beherrscht? §HKssk kssk kssk!§! Das weite Bewusstsein wird unterstützen, wird garantieren."
 KET_GUARANTEE_ACCEPT: "Dann werden unsere Feinde viel verlieren, viel zu fürchten haben, §Hkssk!§!"
 KET_REVOKE_GUARANTEE_SELECT: "Ihr würdet nicht länger die Unabhängigkeit des weiten Bewusstseins garantieren?"
 KET_REVOKE_GUARANTEE_PROPOSE: "Unser Bewusstsein wird anderweitig gebraucht, §Hkssk!§! Wir können nicht länger über euer Land wachen!"
 KET_REVOKE_GUARANTEE_ACCEPT: "Verräter! Ihr lasst unser Rudel zurück, von Feinden umgeben!"
 KET_SUPPORT_INDEPENDENCE_SELECT: "Ihr würdet dabei helfen das weite Bewusstsein von seinen Meistern zu befreien?"
 KET_SUPPORT_INDEPENDENCE_PROPOSE: "Die [Root.GetSpeciesNamePlural] sind eingesperrt, nicht frei. Wir werden helfen, werden unterstützen! Für einen Preis..."
 KET_SUPPORT_INDEPENDENCE_ACCEPT: "Dann werden wir euch rufen, wenn die Zeit reif ist..."
 KET_REVOKE_INDEPENDENCE_SELECT: "§HKssk!§! Ihr würdet euer Versprechen zurückziehen?"
 KET_REVOKE_INDEPENDENCE_PROPOSE: "Größere Dinge plagen unser Bewusstsein, §Hkssk kssk!§! Wir können eure Freiheit nicht länger unterstützen, [Root.GetSpeciesName]."
 KET_REVOKE_INDEPENDENCE_ACCEPT: "Nehmt euer vorenthaltendes Versprechen und geht, §Hkssk!§!"
 KET_FORM_MIGRATION_PACT_SELECT: "Ihr wünscht, dass sich das weite Bewusstsein unter eurem Rudel bewegt?"
 KET_FORM_MIGRATION_PACT_PROPOSE: "[Root.GetSpeciesName]! Euer Rudel ist stark, schlau, schnell. §HKssk!§! Wir, das weite Bewusstsein, werden uns innerhalb bewegen."
 KET_FORM_MIGRATION_PACT_ACCEPT: "Gut, ausgezeichnet. Unsere Rudel werden sich vermischen, werden geteilt werden!"
 KET_FORM_MIGRATION_PACT_REFUSE: "Nein. Wir werden nicht unter den [From.GetSpeciesNamePlural] leben, werden nicht teilen!"
 KET_BREAK_MIGRATION_PACT_SELECT: "Die [From.GetSpeciesNamePlural] wünschen nicht länger, dass sich das weite Bewusstsein frei in ihrem Rudel bewegt?"
 KET_BREAK_MIGRATION_PACT_PROPOSE: "Wir wünschen nicht länger zu teilen, wünschen nicht länger mit und zwischen den [Root.GetSpeciesNamePlural] zu leben!"
 KET_BREAK_MIGRATION_PACT_ACCEPT: "Dann werden wir unter uns bleiben, §Hkssk!§!"
 KET_OPEN_BORDERS_SELECT: "Ihr würdet eure Mauern für das weite Bewusstsein öffnen?"
 KET_OPEN_BORDERS_PROPOSE: "Ihr könnt euch in dem Territorium unseres Rudels bewegen, §Hkssk!§! Versucht nur nicht zu bleiben!"
 KET_OPEN_BORDERS_ACCEPT: "Dann bewegen wir uns frei durch das Territorium eures Rudels. §HKssk kssk kssk!§!"
 KET_CLOSE_BORDERS_SELECT: "Ihr würdet das Territorium eures Rudels für das weite Bewusstsein schließen?"
 KET_CLOSE_BORDERS_PROPOSE: "[Root.GetSpeciesName]! Wir wünschen nicht länger, dass sich eure Schiffe durch das Territorium unseres Rudels bewegen. Verschwindet!"
 KET_CLOSE_BORDERS_ACCEPT: "Dann habt euer Territorium halt für euch! Aber wir werden euren Schrott nicht zurückgeben, §Hkssk!§!"
 KET_KICK_FROM_ALLIANCE_SELECT: "Ihr wollt das weite Bewusstsein nicht in eurem Rudel der Vielen? Ein Fehler, ein Fehltritt."
 KET_KICK_FROM_ALLIANCE_PROPOSE: "§HKssk!§! Ihr bringt Unruhe in das Rudel der Vielen. Ihr werdet es jetzt verlassen, §Hkssk!§!"
 KET_KICK_FROM_ALLIANCE_ACCEPT: "Gut! Fein! Nutzloses Rudel, die [From.GetAllianceName]. Wir, das weite Bewusstsein, werden alleine stärker sein!"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_SELECT: "Ihr wünscht, dass sich das weite Bewusstsein mit eurem Rudel der Vielen verbindet?"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_PROPOSE: "[Root.GetSpeciesNamePlural], Freunde. Die [From.GetAllianceName] würde sich auch auf euch erstrecken. Nicht bereit dem Rudel der Viertel beizutreten, noch nicht. Aber als Assoziierter?"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_ACCEPT: "In Ordnung. Wir, das weite Bewusstsein werden dem Rudel der Vielen näherkommen."
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_REFUSE: "Euer Rudel der Vielen interessiert uns nicht, §Hkssk!§!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_SELECT: "Das Rudel der Vielen wünscht nicht länger unseren Kontakt, §Hkssk?§!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_PROPOSE: "Euer Assoziationsstatus: Widerrufen! Das Rudel der Vielen wünscht nicht länger die [Root.GetSpeciesNamePlural] unter sich!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_ACCEPT: "$KET_KICK_FROM_ALLIANCE_ACCEPT$"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_SELECT: "Euer Rudel der Vielen wünscht mit uns zu sprechen, §Hkssk?§!"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_PROPOSE: "Euer Rudel der Vielen. Wir würden mit euch sprechen, euch nahe sein. Eine Assoziierung, §Hkssk!§!"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_ACCEPT: "In Ordnung. Das Rudel der Vielen wird sich mit [From.GetName] assoziieren."
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_REFUSE: "Nein, wir wünschen uns nicht die [From.GetSpeciesNamePlural], wünschen sie nicht in unserem Rudel der Vielen!"
 KET_END_FEDERATION_ASSOCIATION_STATUS_SELECT: "Ihr würdet euch zurückziehen, würdet nicht mehr mit dem Rudel der Vielen sprechen?"
 KET_END_FEDERATION_ASSOCIATION_STATUS_PROPOSE: "§HKssk kssk kssk!§! Euer Rudel ist langsam, langweilig, ungeeignet! Nicht länger werdet ihr ein Partner sein!"
 KET_END_FEDERATION_ASSOCIATION_STATUS_ACCEPT: "Dann verlassen, gehen. Wir werden nicht länger Partner mit [From.GetName] sein."
 KET_DEMAND_TRIBUTARY_SELECT: "Ihr wünscht Tribut, §Hkssk?§! Ihr wünscht Schrott, Edelmetalle und Drähte?"
 KET_DEMAND_TRIBUTARY_PROPOSE: "[Root.GetName] ist reif, schwach! Aber wir können euch in Ruhe lassen. Gebt uns Schrott, Metall, Drähte und Edelmetalle!"
 KET_DEMAND_TRIBUTARY_ACCEPT: "In Ordnung. Wir bringen euch Geschenke. Im Gegenzug werdet ihr das weite Bewusstsein in Ruhe lassen, §HKssk!§!"
 KET_DEMAND_TRIBUTARY_REFUSE: "Nein! Das werden wir nicht! Wir brauchen keine [From.GetAdj]en Versprechen. Ihr werdet nichts von uns bekommen."
 KET_ASK_BECOME_TRIBUTARY_SELECT: "§HKssk!§! Ihr wünscht dem weiten Bewusstsein Tribut zu zollen?"
 KET_ASK_BECOME_TRIBUTARY_PROPOSE: "Interessieren sich die [Root.GetSpeciesNamePlural] für Metalle? Drähte? Wissen? Edelmetalle? Wir haben all diese Dinge, §Hkssk!§! Lasst uns in Ruhe und wir werden euch Tribut zollen."
 KET_ASK_BECOME_TRIBUTARY_ACCEPT: "Sehr gut. Bezahlt uns, macht uns Geschenke und wir werden euch in Ruhe lassen!"
 KET_ASK_BECOME_TRIBUTARY_REFUSE: "Nein. Das wollen wir nicht, §Hkssk§!, dafür haben wir keinen Nutzen!"
 KET_INSULT_01: "Ja? Sprecht, was ihr zu sagen habt!"
 KET_INSULT_PROPOSE_01: "§HKssk!§! Euer schwacher [Root.GetSpeciesAdj]en Verstand könnte einen Auspuff nicht mit einem Materie-Kompressor verbinden, selbst wenn euer Leben davon abhinge!"
 KET_INSULT_PROPOSE_02: "§HKssk kssk kssk!§! Nicht mal der Schrott eures Rudels ist zur Wiederverwertung geeignet."
 KET_INSULT_ACCEPT_01: "Gemein. Grausam. Wir werden uns daran erinnern."
 action.37.desc.ketlings: "Wir ergeben uns! Zieht eure Flotten zurück und verschwindet, §Hkssk§!"
 action.38.desc.ketlings: "Ja! Wir sind siegreich, wir überwinden! Kommt wieder zu uns, wenn euer Metall, Edelsteine und Leben zu groß wird!"
 action.39.desc.ketlings: "So sei es. Kein Gewinner, kein Sieger. Nur verlorene Leben, verlorener Schrott..."
