 corrupt_data_investigated: "Anomale Sterne untersucht"
 star_crazy_chain_title: "Energieemissionen"
 star_crazy_chain_desc: "Energieemissionen"
 #PROJECTS:
 GENERATION_SHIP: "Generationenschiff"
 GENERATION_SHIP_DESC: "Ein massives Generationenschiff, das zu einer längst toten Rasse Außerirdischer gehört, könnte den verschlüsselten Standort eines utopischen Planeten innerhalb seiner Navigationscomputer enthalten."
 HIDDEN_PLANET: "Griff nach Strohhalmen"
 HIDDEN_PLANET_DESC: "Wenn wir eine Sonde zur Oberfläche des Planeten senden, können wir uns ein für alle Mal entscheiden, ob die trostlose Welt, die vor uns liegt, tatsächlich das mythische Paradies der Mardak Vol ist."
 STAR_LIFTING: "Aufgegebene Sternenplattform"
 STAR_LIFTING_DESC: "Eine altersschwache Plattform mit einem uralten Alien-Design ist im Orbit von [star_lifting_star.GetName]. Wenn wir einen Weg finden könnten, um sie zu reparieren, würde dies uns ermöglichen den Energiefluss des Sterns zu verbessern und zu nutzen."
 STAR_LIFTING_WEAPONS: "Aufgegebene Sternenplattform"
 STAR_LIFTING_WEAPONS_DESC: "Eine altersschwache Plattform mit einem uralten Alien-Design ist im Orbit von [star_lifting_star.GetName]. Sie verfügt über eine sehr experimentelle Mikrowellenstrahlungstechnologie mit dem Potenzial zur Waffenherstellung."
 BIG_RIP: "Aufgegebener Beobachtungsposten"
 BIG_RIP_DESC: "Die Datenspeicher des Beobachtungsposten, der [big_rip_planet.GetName] umkreist, wurden gelöscht. Wir werden ein Team auf den Planeten senden müssen, wenn wir herausfinden möchten, was mit den intelligenten Lebewesen geschehen ist, die vorher den Planeten bewohnten."
 THE_CUBE: "Der Würfel"
 THE_CUBE_DESC: "Die Entdeckung eines winzigen Metallwürfels mit verschiedenfarbigen Seiten hat das Interesse von Wissenschaftsoffizier [cube_science_officer.GetName] geweckt, der sicher ist, dass darin etwas Wertvolles enthalten ist."
 STAR_CRAZY: "Pulsierende Sterne"
 STAR_CRAZY_DESC: "Mehrere Sterne in der Galaxie haben damit begonnen merkwürdig zu pulsieren. Die Crew hat Bedenken geäußert, dass diese Messwerte durch eine Fehlfunktion der Sensoren verursacht wurde, aber Wissenschaftsoffizier [Root.GetLeaderName] möchte gerne einen der Sterne näher untersuchen."
 WEAPONS_TESTING: "Außerirdische Waffen"
 WEAPONS_TESTING_DESC: "Wir haben die Überreste einer außerirdischen Waffe gefunden, die bei umfangreichen Waffentests auf [From.GetName] eingesetzt wurde."
 SHATTERED_EGG: "Eiersplitter"
 SHATTERED_EGG_DESC: "Die Eier der Todesbrut haben sich so entwickelt, dass sie Energie vom nächst gelegenen Stern absorbieren und konservieren, um den rauen Bedingungen des Weltraums standzuhalten. Vielleicht könnten die Überreste der zerbrochenen Eier ihr Geheimnis enthüllen."
 MEND_SHIELD: "Wiederherstellung des planetaren Schilds"
 MEND_SHIELD_DESC: "Der uralte Schild, der die Zivilisation der vernunftbegabten Squamate auf [time_loop_world.GetName] umschloss, bricht langsam durch die Hitze und den Verfall. Wir müssen es wiederherstellen."
 STOP_TIME_LOOP: "Unterbrechung der Zeitschleife"
 STOP_TIME_LOOP_DESC: "Wir haben ein Projekt vorbereitet, dass die Zeitschleife unterbrechen soll."
 #AMBIENT OBJECTS:
 broken_star_lifting_platform: "Aufgegebene Sternenplattform"
 broken_star_lifting_platform_desc: "Eine aufgegebene Plattform von unbekanntem Alien-Design, die ziellos um einen Stern herum kreist."
 broken_star_lifting_platform_tooltip: "$broken_star_lifting_platform_desc$"
 star_lifting_platform: "Sternenplattform"
 star_lifting_platform_desc: "Die Sternenplattform erhöht den Sonnenwindaustritt des Sterns, indem sie Bereiche seiner Atmosphäre mit Mikrowellen beschießt. Die Energie des Sonnenwindes kann anschließend von einer Mine geerntet werden."
 star_lifting_platform_tooltip: "$star_lifting_platform_desc$"
 abandoned_observation_outpost: "Aufgegebener Beobachtungsposten"
 abandoned_observation_outpost_desc: "Ein Beobachtungsposten kreist inaktiv um [big_rip_planet.GetName] herum."
 abandoned_observation_outpost_tooltip: "$abandoned_observation_outpost_desc$"
 abandoned_observation_outpost_generic: "$abandoned_observation_outpost$"
 abandoned_observation_outpost_generic_desc: "Ein verlassener Beobachtungsposten umkreist diese Welt."
 abandoned_observation_outpost_generic_tooltip: "$abandoned_observation_outpost_generic_desc$"
 #ANOMALY CATEGORIES:
 debris_gasgiant_category_temp: "Altes Schiffswrack"
 debris_gasgiant_category_temp_desc: "Ein massives Schiffswrack mit einem alten Design kreist um [From.GetName]."
 star_lifting_category: "Verlassene Sternenplattform"
 star_lifting_category_desc: "Eine defekte Plattform mit Alien-Design, die ziellos um einen Stern herumtreibt. Vielleicht könnte eine genauere Untersuchung ihren Zweck zeigen."
 abandoned_outpost_category: "Aufgegebener Beobachtungsposten"
 abandoned_outpost_category_desc: "Ein mitgenommener alter Beobachtungsposten kreist um [big_rip_planet.GetName] herum, aber es gibt keine Anzeichen für intelligentes Leben auf seiner Oberfläche. Eine nähere Untersuchung könnte und sie Antwort darauf geben, warum dies so ist."
 ast_debris_field_1_cat_2: "$AST_DEBRIS_FIELD_1_CAT$"
 gaia_planet_cat: "Alien-Aktivität"
 gaia_planet_cat_desc: "Unsere Sensoren registrieren Energieemissionen auf [Root.GetName], die üblich für Alien-Aktivität sind."
 corrupt_data_cat: "Beschädigte Vermessungsdaten"
 corrupt_data_cat_desc: "Etwas im [From.System.GetName]-System beschädigt unsere Sensordaten. Die Quelle der Unregelmäßigkeit scheint der Planet [From.GetName] zu sein."
 irregular_energy_cat: "Irreguläre Energieemissionen"
 irregular_energy_cat_desc: "Unsere Sensoren zeigen Unregelmäßigkeiten im Energiemuster von [From.GetName]."
 peculiar_patterns_cat: "Eigenartige Muster"
 peculiar_patterns_cat_desc: "Merkwürdige Muster, die sogar vom Weltraum aus deutlich sichtbar sind, bilden sich auf der Oberfläche von [Root.GetName]."
 tomb_world_cat: "Tote Welt"
 tomb_world_cat_desc: "Ungewöhnliche Daten der Oberflächenscans deuten darauf hin, dass es in dieser trostlosen Welt mehr gibt, als man sieht."
 alien_life_cat: "Außerirdisches Leben"
 alien_life_cat_desc: "Erste Sensordaten von [From.GetName] deuten darauf hin, dass außerirdisches Leben unterstützt werden könnte."
 moon_cat: "Ungewöhnlicher Mond"
 moon_cat_desc: "Dieser Mond ist ungewöhnlich."
 time_loop_world: "Abgeschirmte Welt"
 time_loop_world_desc: "Aus unbekannten Gründen wurde [Root.GetName] von einem undurchdringlichen Schild eingeschlossen und dieses Schild ist dabei zu brechen."
 #FAKE CHARACTERS:
 #fake_character_1_name: "Bloop Bloop"
 #test_fake_char.desc: "This amazing new blorg I met called [root.fake_character_1.GetName]!"
 #ANOMALY EVENTS:
 #The Vechtar Zavonia Chain
 distar.1000.name: "Die Vechtar Zavonia"
 distar.1000.desc: "Das Wrack, das [From.GetName] umkreist ist alles, was von der Vechtar Zavonia übrig ist, einem massiven Generationenschiff, das zu einer tiefreligiösen außerirdischen Spezies namens Mardak Vol gehört.\n\nObwohl das Schiff von allem Leben gesäubert wurde, wurde zumindest die unglückliche Reise der Mardak in den Logbüchern des Kapitäns beschrieben. Nachdem sie von alptraumhaften Wesen, die sie als \"Schiffe\" bezeichneten, bis zur Ausrottung gejagt wurden, flogen sie aus ihrem Heimatsystem und begaben sich auf die Suche nach einem fernen Paradies, dem mythischen Land Paridayda, dass sich nur den Auserwählten offenbaren würde. Dem Zustand ihres Schiffes nach zu urteilen haben ihre Angreifer sie jedoch eingeholt.\n\nSollen wir die Navigationsdatenbank des Schiffes extrahieren und sein Ziel entschlüsseln?"
 distar.1000.a: "Ein Paradiesplanet also..."
 distar.1000.b: "Negativ."
 distar.1001.name: "Verborgene Welten"
 distar.1001.desc: "Die Verschlüsselungsalgorithmen der Navigationsdatenbank der Vechtar Zavonia zu knacken war keine leichte Aufgaben, aber dank dem führenden Wissenschaftler [vechtar_zavonia_leader_name.GetName], der eine ungewöhnliche Besessenheit entwickelt hat, die utopische Welt der Mardak Vol zu finden, ist es uns schließlich gelungen.\n\nBeunruhigend allerdings ist, dass die Entdeckung irgendwie an die Öffentlichkeit gelangt ist, die jetzt ihr Interesse an der Besiedlung des paradiesischen Planeten mit [vechtar_zavonia_leader_name.GetName] teilen."
 distar.1001.a: "Nichts kann uns vom Paradies fernhalten."
 distar.1001.b: "Abbruch. Das sind vergebliche Mühen."
 distar.1002.name: "Verlorenes Paradies"
 distar.1002.desc: "Nach zwei- und dreimaliger Überprüfung der Koordinaten der Navigationsdatenbank müssen wir einräumen, dass der paradiesische Planet der Mardak Vol nur eine karge Welt ist.\n\nObwohl wir die Möglichkeit nicht ausschließen können, dass die Vorstellungen eines Paradieses der Mardak sich von unseren unterscheiden könnte, erzählt die zerbombte Oberfläche von [utopian_planet.GetName] eine andere Geschichte. Dem Kapitän und der Crew des Schiffes ist die Enttäuschung sichtlich ins Gesicht geschrieben."
 distar.1002.a: "Das kann nicht sein! Überprüft die Koordinaten ein viertes Mal!"
 distar.1002.b: "Zurück zur Realität..."
 distar.1003.name: "Perfekt wie eine Postkarte"
 distar.1003.desc: "Wir haben endlich das Geheimnis der Mardak Vol entdeckt!\n\nAls eine Sonde, die für die Oberfläche des Planeten bestimmt war, von ihrer Atmosphäre abprallte, begann die Crew anzuzweifeln, dass [utopian_planet.GetName] das ist, was es vorgibt zu sein. Genauere Untersuchungen zeigten, dass das, das wie die Planetenoberfläche aussah, in Wahrheit ein Energieschild war, auf den die Textur einer kargen Welt projiziert wurden und darunter befindet sich der üppige Gaia-Planet, der an die Prophezeiungen der Mardak erinnert.\n\nDas ist aber nicht alles! Als die Crew den Schild deaktivierte entdeckte sie eine friedlebende Zivilisation der Steinzeit, die aus einer symbiotischen Verbindung zwischen Säugetieren und Pilzen bestand und in einfachen Hütten lebte, ahnungslos gegenüber der Außenwelt. Die alptraumhaften \"Schiffe\" leben nur als mythische Wesen in ihren Legenden weiter."
 distar.1003.a: "Die Mardak Vol leben!"
 distar.1003.b: "Das ist ein schöner Planet..."
 distar.1004.name: "Geheimes Paradies"
 distar.1004.desc: "[country_that_discovered_mardak_vol.GetName] hat eine verborgene [GetPreFTLUpper] entdeckt, die versteckt auf einem Gaia-Planeten innerhalb unserer Grenzen lebt. Der Planet scheint durch ein ausgeklügeltes Energiefeld abgeschirmt zu sein, das den Planeten so aussehen lässt, als handle es sich bei ihm um eine Tote Welt. Wir müssen noch herausfinden, wer den Planeten verbarg und warum, denn der [GetPreFTLLower] fehlt eindeutig die Technologie dazu. Sie scheint eine Art symbiotischer Verbindung zwischen Fungoiden und Säugetieren zu sein, und soweit wir das beurteilen können, ist sie absolut harmlos."
 distar.1004.a: "Beurteilt einen Planeten niemals an seinem Aussehen."
 distar.1005.name: "Übertragung"
 distar.1005.desc_a: "Uns hat eine uns zuvor unbekannte Spezies vernunftbegabter Säugetiere kontaktiert. Es geht scheinbar um die alten Mardak Vol, die noch immer auf [utopian_planet.GetName] leben und es scheint sehr dringend zu sein."
 distar.1005.desc_b: "Uns hat eine uns zuvor unbekannte Spezies vernunftbegabter Säugetiere kontaktiert. Es geht offenbar um die [GetPreFTLUpper], die noch immer auf [utopian_planet.GetName] lebt, und es scheint sehr dringend zu sein."
 distar.1006.desc: "Schön euch zu treffen, [From.GetSpeciesNamePlural]. Wir sind die Vol und wir kommen in Frieden.\n\nWir haben entdeckt, dass einer eurer Planeten von den Mardak befallen ist. Es ist ein parasitärer Pilz, der schon seit Äonen unsere Art heimsucht und seine Wirte in hirnlose Marionetten verwandelt. Ihr seid das nächste Ziel!\n\nWir dachten, wir hätten sie für immer ausgerottet, doch dann zeigte unser jährlicher Scan der Galaxie eine blühende Population auf [utopian_planet.GetName]. Aber keine Angst, wir wissen, was zu tun ist..."
 distar.1006.a: "Vernichtet sie mit Feuer!?"
 distar.1006.b: "Unfug, sie sind harmlos!"
 distar.1006.c: "Ihr werdet ihnen nicht schaden!"
 distar.1008.desc: "Seid versichert: Wir beginnen mit orbitalen Vernichtungsprotokollen in 3, 2, 1... Durch Luft verteilbarer Wirkstoff Fungo-X über infizierter Bevölkerungsgruppe freigesetzt. Feindliche Agenten neutralisiert!\n\nKeine Sorge, etwaige Umweltveränderungen sind nicht vorübergehend und vollständig unwiderruflich...\n\nWir danken euch für eure Mithilfe.\n\nWir sind die Vol. Wir kommen in Frieden.\n\nFrieden..."
 distar.1008.a: "Es ist getan..."
 distar.1008.b: "Umweltveränderungen??"
 distar.1009.desc: "Zurückgebliebene [From.GetSpeciesNamePluralInsult]! Wie denkt ihr würde es euch gefallen, wenn ihr mit Mardak aufwacht, der an eurer [From.GetSpeciesOrganName] lebt, in euer Fleisch kriecht und euren Verstand bricht, während der Pilz zuerst euer Nervensystem übernimmt und dann Zelle für Zelle euren ganzen Körper!?\n\nGlücklicherweise für euch [From.GetSpeciesNamePluralInsult], wird dieser Tag niemals kommen. Wir können es nicht erlauben.\n\nWir sind die Vol. Wir werden den Frieden...zurückbringen."
 distar.1009.a: "Richtig..."
 distar.1011.name: "§RWarnung: Grenzübertretung!§!"
 distar.1011.desc: "Wir haben eine feindliche Flotte entdeckt, die die Signatur der Vol trägt und direkt auf [utopian_planet.GetName] zusteuert. Es scheint, dass sie wegen der Mardak gekommen sind, die noch immer auf dem Planeten leben...\n\nSie reagieren nicht uns unsere Rufe."
 distar.1011.a: "Nicht gut..."
 distar.1013.desc: "Der Kanal knistert und macht ein dumpfes Geräusch. Wir haben unsere Verbindung mit den Vol verloren."
 distar.1013.a: "Sie haben aufgelegt!!"
 distar.1014.name: "Im Paradies"
 distar.1014.desc: "Wir haben die paradiesische Welt der Mardak Vol, Paridayda, endlich besiedelt und unsere Bürger freuen sich über den Gedanken, dass eines Tages auch ihre [From.Owner.GetSpeciesSpawnNamePlural] zwischen den Sanddünen, üppigen Gärten und Kristallquellen von [utopian_planet.GetName] herumtollen können!"
 distar.1014.a: "Wurde auch Zeit..."
 distar.1014.b: "Das werden wir noch sehen..."
 #Star Lifting
 distar.1020.name: "Thermisch gesteuerter Ausstoß"
 distar.1020.desc: "Genauere Untersuchungen der Plattform, die [From.GetName] umkreist, haben gezeigt, dass es sich im ein komplexes, unbeständiges außerirdisches Design handelt. Die wassersichten Maschinen und fortschrittlichen Klimakontrollen legen nahe, dass es für eine Lebensform gebaut wurde, die große Mengen an Flüssigkeit absondern. Wahrscheinlich eine Art Molluskoid.\n\nBevor sie zerfallen ist, wurden Mikrostrahlen dazu verwendet, um Regionen der Atmosphäre zu erhitzen. wodurch große und anhaltende Eruptionen hervorgerufen wurden, die den Abfluss des Sonnenwinds signifikant erhöhten. Die freigesetzte Energie wurde anschließend in einer Orbitalmine geerntet.\n\nDie Plattform ist dabei um einige sehr experimentelle Konzepte herum aufgebaut."
 distar.1020.a: "Repariert die Plattform."
 distar.1020.c: "Macht sie Waffentauglich."
 distar.1020.b: "Lasst es bleiben."
 distar.1021.name: "Mit dem Feuer spielen"
 distar.1021.desc: "Nach umfangreichen Reparaturen wurde die Plattform in Betrieb genommen und der Stern schleudert nun massiv Energie in den Kosmos. Die Reise dorthin war allerdings nicht ohne Hürden.\n\nAls die riesigen Mikrowellenstahlen das erste Mal aktiviert wurden, lösten die Ingenieure beinahe eine Kettenreaktion aus, die in einer solaren Eruption hätte enden können, die so massiv gewesen wäre, dass sie die Plattform und alle Planeten im System vernichtet hätte. Wie sich herausstellte, waren die alten Blaupausen und Handbücher der Fremden voller Fehlkalkulationen, und dies war auch der Grund, warum die Plattform nicht mehr funktionierte.\n\nGlücklicherweise wurden die Fehler rasch entdeckt, und die Stärke der Strahlen konnte seitdem kalibriert und der Abfluss des Sonnenwindes stabilisiert werden."
 distar.1021.a: "Eine Solarbatterie. Ganz für uns alleine!"
 distar.1021.b: "Ah, Molluskoide ... Weiche Körper, weiche Köpfe ..."
 distar.1022.name: "Primitive Mikrowellenstahlen"
 distar.1022.desc.a: "Es dauerte nicht lang, bis die Crew der [star_lifting_ship.GetName] zum Schluss kam, dass das Design der Sternenplattform in den Worten von Wissenschaftsoffizier [star_lifting_leader.GetName] das Werk von Verrückten war. Die Mikrowellenstrahlen waren primitiv, fehlkalibriert und hätten viel Raffinesse benötigt, bevor sie wie beabsichtigt funktioniert hätten. Sie erwiesen sich jedoch als hervorragende Waffen."
 distar.1022.desc.b: "Unser Versuch, die primitiven Mikrowellenstrahlen zu einer Waffe umzufunktionieren ist... spektakulär gescheitert. Bei der Aktivierung stellte sich heraus, dass das Design der Strahlen so fehlerhaft war, dass die Wissenschaftscrew nur knapp entkommen konnte, als die Plattform in einer prächtigen pilzförmigen Demonstration von wissenschaftlichen Versagen explodierte."
 distar.1022.a: "Hervorragend."
 distar.1022.b: "Katastrophal."
 distar.1022.c: "Diese Weichhirne hatten nichts mit Wissenschaft zu tun..."
 #The Big RIP
 distar.1030.name: "Aufgegebener Beobachtungsposten"
 distar.1030.desc: "Alle Datenspeicher des Beobachtungspostens wurden gelöscht, und es wurde große Sorgfalt darauf verwendet, Beweise zu beseitigen, die zu den Erbauern führen könnten. Auf [big_rip_planet.GetName] muss eindeutig etwas schiefgegangen sein, denn die einzigen Anzeichen für intelligentes Leben sind die zerfallenden Hüllen halb fertiger Megacitys, die über die Oberfläche verstreut sind, sowie der inmitten von ihnen aufragende Holotempel."
 distar.1030.a: "Untersucht es."
 distar.1030.b: "Lasst es bleiben."
 distar.1031.name: "Der Graue Sturm"
 distar.1031.desc: "Bei all ihren Bemühungen zur Geheimhaltung sind überall auf [big_rip_planet.GetName] Spuren der unbeholfenen Einmischung der Beobachter zu finden...\n\nSpuren deuten darauf hin, dass der Planet von einem psionischen Bewusstsein von Plantoiden bewohnt war, die sich mitten in einem religiösen Erwachen befanden, als eine mysteriöse außerirdische Rasse, die Torwächter genannt wird, ohne Vorwarnung auf sie herabkam. Von diesem Zeitpunkt an waren die Pflanzen von der Idee eines bevorstehenden apokalyptischen Ereignisses namens \"Grauer Sturm\" besessen. Ihre ehemals friedliche Religion verwandelte sich schon bald in einen Selbstmordkult. Innerhalb weniger Monate war eine der ältesten Lebensformen aus Angst vor dem Weltuntergang selbst verschwunden und das trotz zahlreicher Versuche der Rehydration."
 distar.1031.a: "Was für ein Chaos..."
 distar.1031.b: "Ruhet in Frieden, zerbrechliche Blumen..."
 #Bunker-Bot
 distar.1040.name: "Bunker-Bot"
 distar.1040.desc: "Wir haben die ungewöhnliche elektromagnetische Strahlung, die von [From.GetName] ausgeht, bis zu einem geheimen unterirdischen Bunker zurückverfolgt, in dem sich ein Megacomputer von der Größe eines Kampfschiffs versteckt.\n\nUnsere [Owner.GetResearchers] vermuten, dass er schon seit mehreren tausend Jahren dort ist und seither an einem einzelnen komplexen Problem arbeitet, dessen genaue Natur sich uns noch entzieht.\n\nBei dem Versuch, mit dem Computer zu interagieren, wurde entdeckt, dass der scheinbar verlassene und unbewachte Bunker in Wahrheit von einer Sicherheits-KI betrieben wurde, deren höchster Zweck darin bestand, Besucher aufs Übelste zu beschimpfen. Als die KI endlich besiegt wurde, sendete sie eine Nachricht an einen unbekannten Empfänger."
 distar.1040.a: "Nehmt den Megacomputer für Teile auseinander!"
 distar.1040.a.tooltip: "Ein Computer, der ein einzelnes Problem nicht in tausend Jahren lösen konnte, wird uns nun als neuer Schiffsrumpf dienen ..."
 distar.1040.b: "Benutzt sie, um unsere eigene Forschung zu fördern ..."
 distar.1040.b.tooltip: "Dies erfordert, dass wir die KI, die diese Einrichtung wartet, offline halten, wodurch der Computer in absehbarer Zeit ausfallen wird."
 distar.1040.c: "Lasst sie die mysteriösen Berechnungen fortsetzen ..."
 distar.1040.c.tooltip: "Wir sollten sie besser nicht stören. Welches Problem auch immer der Computer zu lösen versucht, es scheint wichtig zu sein..."
 #Atomic Clock
 distar.1045.name: "42 Jahre und 3 Tage"
 distar.1045.desc: "Eine genauere Untersuchung des Trümmerfelds rund um [From.GetName] hat zur Entdeckung einer luftdichten Kapsel geführt, die eine Atomuhr enthält, die Zeit mit einer beispiellosen Präzision misst.\n\nSie hat eine Messunsicherheit, die so niedrig ist, dass es weitere 879 Millionen Jahre dauern würde, bevor sie eine einzige Sekunde erreicht. Außerdem scheint sie auf ein Datum von 42 Jahren und 3 Tagen herunterzuzählen. Die Kapsel enthält keinen Hinweis darauf, was dieses Datum bedeutet oder wer es hinterlassen hat. Es scheint aber, als ob jemand da draußen die Zeit vergessen hat..."
 distar.1045.a: "Behaltet es im Auge."
 distar.1045.b: "ES IST EINE BOMBE!! ZERSTÖRT SIE!!"
 distar.1045.a.tooltip: "Tick-tack, tick-tack..."
 distar.1045.b.tooltip: "Die Kapsel ist voll von unschuldig aussehen Drähten, von denen jeder so manipuliert werden könnte, um eine Massenvernichtungswaffe in Gang zu setzten, die so stark ist, dass sie die gesamte Galaxie auslöschen würde! Die Crew wird alle Drähte trennen!"
 #Eat or be Eaten
 distar.1050.name: "Fressen oder gefressen werden"
 distar.1050.desc: "Am Rande des Trümmerfelds von [From.GetName] treiben die armseligen Überreste eines zerstörten Forschungsschiffs unbekannten Ursprungs umher. Bissspuren und Verdauungsflüssigkeiten auf dem Rumpf deuten darauf hin, dass es von einem großen Wesen gefressen und dann ausgewürgt wurde.\n\nIronischerweise war das Schiff selbst auf einer kulinarischen Reise auf der Suche nach neuen exotischen Delikatessen gewesen, und nun hatte es selbst auf der Speisekarte gestanden.\n\nDie Besatzung hatte eine unglaubliche Anzahl an Lebensformen auf allen möglichen Ebenen bewertet, vom Nährwert bis hin zur Kaubarkeit. Unter ihren Favoriten waren die [delicious_aliens.GetSpeciesNamePlural], die für ihre saftigen [delicious_aliens.GetSpeciesOrganName] und ihr feuriges Temperament bekannt sind. Unsere Art hat eine mittlere Platzierung am unteren Ende der Liste, dank der Faserigkeit unseres Fleisches und der langweiligen Jagdbeute, die wir abgeben. Manche spielen eben gern mit ihrem Essen ..."
 distar.1050.desc_lithoid: "Am Rande des Trümmerfelds von [From.GetName] treiben die armseligen Überreste eines zerstörten Forschungsschiffs unbekannten Ursprungs umher. Bissspuren und Verdauungsflüssigkeiten auf dem Rumpf deuten darauf hin, dass es von einem großen Wesen gefressen und dann ausgewürgt wurde.\n\nIronischerweise war das Schiff selbst auf einer kulinarischen Reise auf der Suche nach neuen exotischen Delikatessen gewesen, und nun hatte es selbst auf der Speisekarte gestanden.\n\nDie Besatzung hatte eine unglaubliche Anzahl an Lebensformen auf allen möglichen Ebenen bewertet, vom Nährwert bis hin zur Kaubarkeit. Unter ihren Favoriten waren die [delicious_aliens.GetSpeciesNamePlural], die für ihre saftigen [delicious_aliens.GetSpeciesOrganName] und ihr feuriges Temperament bekannt sind. Unsere Art wurde einer Spezialkategorie am unteren Ende der Liste zugewiesen. Dies ist das Resultat der völligen Ungenießbarkeit unseres Fleisches und der langweiligen Jagdbeute, die wir abgeben. Manche spielen eben gern mit ihrem Essen ..."
 distar.1050.a: "Scheint, als hätten sie endlich etwas Ebenbürtiges gefunden..."
 distar.1050.b.evopred: "Nach Geschmack statt nach Komplexität bewerten? Wie sonderbar."
 #The Cube
 distar.1055.name: "Der Würfel"
 distar.1055.desc: "Unter den Hüllen der zerstörten Raumschiffe, die [From.GetName] umkreisen, haben wir ein nahezu intaktes fremdes Forschungsschiff entdeckt. Die Logs des Schiffes zeigen, dass es unter einer kritischen Fehlfunktion der Hardware litt und 142 Tage lang umhertrieb, bevor die Crew an Unterernährung starb.\n\nDer Leichnam des Kapitäns befand sich auf seinem Bett und umklammerte einen kleinen Metallwürfel. Jede Seite hatte eine andere Farbe und war in neun gleich große, drehbare Quadrate unterteilt. [Root.Owner.GetScientist] [cube_science_officer.GetName] ist davon überzeugt, dass sich der Würfel öffnet, wenn er im richtigen Muster gedreht wird, und so einen versteckten Schatz enthüllt."
 distar.1055.a: "Bewegt diese Quadrate!"
 distar.1055.b: "Lasst ihn in Ruhe."
 distar.1056.name: "In Würfel schneiden"
 distar.1056.desc: "Die Crew der [From.GetName] hat den Metallwürfel jedem uns bekannten Algorithmus unterworfen, doch dieser hat nichts als Stille gezeigt.\n\n\"Ist es eine Chiffre? Ein Behälter wertvoller Gegenstände?\" \"Wenn hinter diesem Würfel keine Bedeutung steht, was bedeutet das alles dann?\", waren einige der Gedanken, die durch den überarbeiteten Verstand von Wissenschaftsoffizier [cube_science_officer.GetName] gingen, als [cube_science_officer.GetSheHe] schließlich den Laser herausholte und zuerst den Würfel und dann [cube_science_officer.GetHerHis]e rechte [From.Owner.GetSpeciesHandName] in zwei Teile schnitt. Der Würfel war leer."
 distar.1056.a: "Ach je..."
 distar.1056.a.tooltip: "[cube_science_officer.GetName] wird niemals mehr wie früher sein."
 #Honeymooners
 distar.1060.name: "Flitterwochler"
 distar.1060.desc: "Wir scheinen über die Bruststätte einer nicht einheimischen Spezies haarloser Säugetiere gestolpert zu sein. Sie konnten dabei beobachtet werden, wie sie am Abend auf Brautschau gingen und sich anschließend unter dem Einfluss einer Vielzahl berauschender Substanzen am Strang zu Paaren zusammenschlossen.\n\nBedauerlicherweise erschreckte sie eine unbeabsichtigte Sichtung unseres Schiffes und sie haben seitdem den Planeten mit einer Art kommerziellem Raumschiff verlassen und dabei eine Spur von Abfall hinter sich gelassen. Wir haben unter anderem eine Ausgabe des Alien-Reiseführers \"Hitchikers Reise durch die Galaxie\" gefunden, in der viele uns noch unbekannte Sehenswürdigkeiten und Phänomene beschrieben werden."
 distar.1060.a: "Dieser Reiseführer wird unserem Volk als Inspiration dienen!"
 distar.1060.b: "Dreckige Alien! Unser Volk muss erfahren, welch versaute und herumlungernde Bürde sie sind."
 distar.1060.c: "Wir halten diese Entdeckung vorerst besser unter Verschluss..."
 distar.1060.d: "Ekelhaft!"
 #Hologram
 distar.1065.name: "Der Planet, der nicht existiert"
 distar.1065.desc: "[From.GetName] ist kein Planet, sondern eine ausgeklügelte 3D-Projektion. In seiner Mitte befindet sich ein Projektor, der ein Energiefeld erzeugt, das einen physischen Körper und eine Gravitation so simuliert, dass unsere Sensoren ihn fälschlicherweise für einen richtigen Planeten gehalten haben und so anormale Daten erzeugte. Wir können nur darüber spekulieren, warum sich jemand die Mühe machen würde, die Anwesenheit eines Planeten an diesem Ort vorzutäuschen. Bedauerlicherweise hat der Projektor unsere Experimente nicht überstanden."
 distar.1065.a: "Merkwürdig..."
 #Star Crazy
 distar.1070.name: "Sternenmuster"
 distar.1070.desc: "Die neusten Sensormessungen von [From.GetName] zeigen, dass der Stern regelmäßig pulsiert. Als die Crew der [Root.GetName] allerdings vor Ort ankam, gab es keine Beweise, die diese Daten unterstützen. Während der Großteil der Crew denkt, dass die Anomalie durch eine Fehlfunktion der Sensoren verursacht wurde, ist Wissenschaftsoffizier [Root.GetLeaderName] anderer Ansicht. [Root.GetLeaderName] behauptet ähnliche pulsierende Energieemissionsmuster an anderer Stelle entdeckt zu haben und hat nun die Befürchtung, dass etwas Seltsames mit den Sternen der Galaxie passiert. Sie haben den Kurs zum nächstgelegenen betroffenen Stern kartiert."
 distar.1070.a: "Wir müssen der Sache nachgehen..."
 distar.1070.b: "Es war eine Fehlfunktion."
 distar.1071.name: "Für eine Minute ..."
 distar.1071.desc: "Nach ein paar Tagen heftigen Grübelns ist Wissenschaftsoffizier [Root.GetLeaderName] bereit, zuzugeben, dass ein Fehler gemacht wurde. Es gibt kein verborgenes Muster in den Impulsen eines fernen Sterns, keine ominöse, metaphysische Absicht. [Root.GetLeaderName] beschreibt es eher folgendermaßen:\n\n§Y\"Es war Paranoia, schlicht und ergreifend. Unlogisch, unberechenbar und ziemlich ungebührlich für einen Wissenschaftler.\"§!\n\nSo peinlich es auch gewesen sein mag, dieser Fehler war nicht ganz ohne Nutzen, denn der innere Konflikt von [Root.GetLeaderName] führte zu einer wertvollen Selbsterkenntnis."
 distar.1071.a: "Gut, dann wäre das geklärt."
 distar.1072.name: "Sensorische Fehlfunktion"
 distar.1072.desc: "Bei Ankunft der Crew in [anomalous_star.GetName] konnte sie bestätigen, dass ihre Sensoren tatsächlich eine Fehlfunktion aufwiesen. Die gute Nachricht ist, dass nicht nur ihre anfänglichen Schätzungen bezüglich der Energieproduktion des Sterns grob untertrieben war, [From.GetLeaderName] scheint auch aus vergangenen Fehlern gelernt zu haben."
 distar.1072.a: "Ein Scheitern ist nur das Sprungbrett zum Erfolg."
 distar.1072.b: "Was für eine Zeitverschwendung..."
 distar.1073.name: "Verrückte Sterne"
 distar.1073.desc: "Die Crew der [From.GetName] hat eine bedauerliche Entdeckung gemacht. Wie schon vermutet, war das pulsierende Muster, das bei [anomalous_star.GetName] beobachtet worden war, tatsächlich auf eine sensorische Fehlfunktion zurückzuführen ... und zwar im Kopf von Wissenschaftsoffizier [crazy_science_officer.GetName].\n\nWissenschaftsoffizier [crazy_science_officer.GetName] ist unberechenbar geworden und leidet unter dem Wahn, der Code aus den Sternen würde eine Warnung vor der bevorstehenden Apokalypse darstellen und dass [crazy_science_officer.GetSheHe] zum Beschützer des Reiches ernannt wurde. Die Besatzung glaubt, [crazy_science_officer.GetSheHe] habe die sensorischen Daten des Schiffes im Zuge eines psychotischen Schubs selbst manipuliert.\n\nWissenschaftsoffizier [crazy_science_officer.GetName] befindet sich nun in einer medizinischen Kapsel und soll zur Behandlung nach [Root.Capital.GetName] zurückkehren."
 distar.1073.a: "Danke für Eure Dienste, Beschützer des Reiches [crazy_science_officer.GetName]!"
 distar.1073.b: "Viel Glück, [crazy_science_officer.GetName]."
 distar.1070.a.tooltip: "§LFunkel funkel kleiner Stern ...§!"
 test_event_targets.desc: "[country_event_target.GetName] [ship_event_target.GetName] [leader_event_target.GetName] [planet_event_target.GetName]"
 #Azizians
 distar.1080.name: "Stiller Schrei"
 distar.1080.desc.a: "Wir haben die fossilen Überreste einer gigantischen Gargantuaschnecke entdeckt, die keiner zuvor angetroffenen Lebensform entspricht und in einem riesigen Eisblock um [From.GetName] herum kreist. Ihre Augen starren bedrohlich voraus, die Tentakel sind in die Luft gehoben und die Mündung ist zu einer grausigen Grimasse verdreht, als wäre sie in einem stillen Schrei gefangen. Die Kreatur zeigt keine offensichtlichen Anzeichen eines vernunftbegabten Wesens."
 distar.1080.desc.b: "$distar.1080.desc.a$\n\nTrotz ihres unheimlichen Ausdrucks glauben unsere Wissenschaftler, dass die Kreatur, wenn sie gezähmt wird, einen wertvollen Beitrag leisten könnte. Sie empfehlen einen Teil ihrer DNA für Klone zu extrahieren."
 distar.1080.desc.c: "$distar.1080.desc.a$\n\nBedauerlicherweise fehlt uns derzeit die Technologie, um sie wieder zu neuem Leben zu erwecken."
 distar.1080.a: "Klont sie."
 distar.1080.b: "Schießt die Abscheulichkeit ins All!"
 distar.1080.c: "Sie gehört in ein Museum."
 distar.1080.d.evopred: "Eine gut gekühlte Mahlzeit. Wie erfrischend!"
 distar.1081.name: "Azizianer"
 distar.1081.desc: "Wir haben erfolgreich eine gesunde Population von gigantischen Gargantuaschnecken aus der fossilen DNA geklont. Sie erreichten innerhalb weniger Wochen volle Reife, wogen bis zu 20 Tonnen und entwickelten eine primitive Ebene der Vernunftbegabtheut, die auf einfache einsilbige Befehle reagiert. Obwohl sie keine gewaltsamen Tendenzen zeigt, erzeugt sie, wenn sie geärgert wird, einen dicken, giftigen Schleim und ihre Farbe scheint sich mit ihrer Stimmung zu verändern. Das Forschungsteam hat sie \"Azizianer\" für die zischenden Geräusche genannt, mit denen sie untereinander kommunizieren."
 distar.1081.a: "Sie werden ausgezeichnete Arbeiter abgeben."
 distar.1081.a.tooltip: "§Y400§! £pop£ §Hazizianische Bewohner§! tauchen auf [This.GetName] auf"
 distar.1081.b: "Sie gehören in einen Zoo."
 distar.1081.c: "Wir können sie in der Armee einsetzten."
 distar.1080.c.tooltip: "Wer würde nicht eine Armee voller mordlustiger Schnecken wollen, die ihre Feinde vernichten?"
 distar.1081.d: "Sie sind furchteinflößend. Entsorgt sie. SOFORT."
 distar.1081.d.evopred: "Wir haben genug gesehen. Auf die Schlachtbank mit ihnen!"
 distar.1083.name: "Azizianer auf freiem Fuß!"
 distar.1083.desc: "Die azizianischen Schnecken, die im Zoo auf [Root.GetName] gehalten wurden, sind ausgebrochen und haben randaliert! Die Kreaturen, von denen angenommen wurde, dass sie die volle Reife erreicht hatten, wuchsen in der Gefangenschaft weiter und haben seitdem monströse Ausmaße erreicht. Sie wüteten durch die Stadt, schlugen Gebäude wie Spielsteine kaputt und hinterließen eine Spur von gelben, giftigem Schleim. Der Planet wird nie wieder derselbe sein."
 distar.1083.a: "Wie können sie es wagen?!"
 distar.1083.b: "Wir verstehen sie..."
 distar.1084.name: "Azizianische Weisheit"
 distar.1084.desc: "Die azizianischen Arbeiter auf [Root.GetName] sind zu vollständig vernunftbegabten Wesen herangewachsen. Die Kreaturen, von denen angenommen wurde, dass sie bereits die volle Reife erreicht hatten, waren tatsächlich noch ein Kind und erreichten erst jetzt, im Erwachsenenalter, ihr volles Potenzial. Sie haben unsere Sprache angenommen und möchten hier in unserer Zivilisation bleiben."
 #Harvesters
 distar.1090.name: "Aufgegebene Erntemaschinen"
 distar.1090.desc: "Die mysteriösen Muster, die auf der Oberfläche von [From.GetName] beobachtet werden konnten, sind Wege, die von riesigen automatischen Erntemaschinen geschaffen wurden, indem sie das üppige Grün zerkleinern und ernten. Unsere Wissenschaftler spekulieren, dass einst die ganze Welt als Nahrung für eine mächtige Weltraumnation diente.\n\nDer fruchtbare Boden und das vorteilhafte Klima machen [From.GetName] zum perfekten Planeten für Landwirtschaft und ein Scan der Flora zeigt, dass jede einzelne Pflanze essbar ist. Der abgenutzte Zustand der Erntemaschinen und die Haufen von verrottendem Gemüsefleisch deuten darauf hin, dass seit Jahren niemand mehr den Ertrag abgeholt hat."
 distar.1090.a: "Wir können gutes Essen nicht verschwenden!"
 distar.1090.b: "Für solch einen Planeten haben wir keinen Nutzen."
 #Locusts
 distar.1095.name: "Verwüstung"
 distar.1095.desc: "Die Sinusmuster, die über der Oberfläche von [From.GetName] verlaufen, sind wie durch Magie verschwunden und so ist auch die üppige Vegetation, die früher den gesamten Planeten bedeckte. Kein einziges Blatt, Halm oder Blume ist noch übrig. Unsere Wissenschaftler denken allerdings, dass sie das Puzzle eventuell zusammengefügt haben.\n\nDas Vorhandensein von Kot und Kadavern von Insektoiden lässt vermuten, dass der Planet kurzzeitig einen Schwarm gefräßiger Weltrauminsekten war, die von Welt zu Welt ziehen und ganze Planeten von ihrer Nahrung befreien."
 distar.1095.a: "Hoffen wir, dass der Schwarm niemals unsere Welten findet."
 distar.1095.b.evopred: "Sammelt ihre Leichen ein."
 #Shattered World
 distar.2000.name: "Zerborstene Welt"
 distar.2000.desc: "Unter den Trümmern haben wir die zerstörten Überreste eines einst bewohnbaren Planeten entdeckt. Die Muster der Fragmentierung und Verkohlung legen nahe, dass er konzentrierten Strahlen thermischer Energie ausgesetzt wurde, bis er durch den Druck zerbrach. Dies hat auch dazu geführt, dass der mineralreiche Kern austreten und sich zu Klumpen aus hochwertigen Mineralien verfestigen konnte."
 #Weapon Testing
 distar.2005.name: "Waffentests"
 distar.2005.desc: "Es scheint, dass die Apokalypse viele Male nach [From.GetName] gekommen ist. Oberflächen-Scans zeigen, dass der Planet in einem der umfangreichsten Waffentest, die wir je gesehen haben, versengt und bombardiert wurde.\n\nObwohl unzählige Versuche unternommen wurden, den Planeten vollständig auszulöschen, scheint es, dass die Außerirdischen noch nicht die dafür benötigte Technologie entwickelt hatten. Wissenschaftsoffizier [Root.GetLeaderName] hat eine Vielzahl beschädigter Waffen gesammelt, in der Hoffnung, ihre Designs rekonstruieren zu können."
 distar.2005.a: "Analysiert die Proben."
 distar.2005.b: "Lasst es bleiben."
 distar.2006.name: "Alien-Laser"
 distar.2006.desc.a: "Wir haben viel aus der Analyse der Waffenüberreste gelernt, die auf [From.From.From.GetName] gefunden wurden. Die Fragmente stammen von einem Energiewaffensystem, das einen hoch fokussierten Energiestrahl aussendet und herausragende Ergebnisse beim Einsatz in Raumschlachten bringen könnte. Wissenschaftsoffizier [science_leader.GetName] empfiehlt, unseren Fund dazu zu benutzen, entweder eine Panzerung zu entwickeln, die den Lasern trotzen kann, oder eine eigene Waffe für uns selbst zu bauen."
 distar.2006.desc.b: "Wir haben viel aus der Analyse der Waffenüberreste gelernt, die auf [From.From.GetName] gefunden wurden. Die Fragmente stammten von einem Energiewaffensystem, das einen hoch fokussierten Energiestrahl aussendet. Ähnlich dem unseren aber viel schwächer."
 distar.2006.a: "Wir werden die Waffen der Aliens gegen sie selbst einsetzen!"
 distar.2006.b: "Unsere Schiffe brauchen bessere Panzerung."
 distar.2006.c: "Wir haben erneut unsere Überlegenheit bestätigt."
 #Wetware Computer
 distar.2010.name: "Wetware-Computer"
 distar.2010.desc: "Der Ozean von [From.GetName] ist fast völlig mit einem feinen Netzwerk aus Algen bedeckt, die sich in symmetrischen Mustern bewegen und dies unabhängig von der wechselnden Strömung des Wassers. Die Kompliziertheit und Regelmäßigkeit der Bewegung legt nahe, dass die Algen aus einem Zweck programmiert wurden, der weit über das alleinige Überleben hinausgeht.\n\nWissenschaftsoffizier [Root.GetLeaderName] nimmt an, dass das Netzwerk in Wahrheit ein primitiver Wetware-Computer sein könnte und die Bewegungsmuster seine Schnittstelle bilden. Bedauerlicherweise haben wir zu diesem Zeitpunkt keine Möglichkeit, um die Muster zu entschlüsseln."
 #Primordial Soup
 distar.2015.name: "Urschleim"
 distar.2015.desc: "In geschützten Löchern überall auf der Oberfläche von [From.GetName] befindet sich reichhaltiger Schlamm aus einfachen organischen Verbindungen, von dem unsere Forscher glauben, dass es eine Brutstätte für Abiogenese sein könnte. Die spontane Bildung von organischem Leben aus lebloser Materie wird erst durch die ungewöhnlich dicke Atmosphäre erreicht.\n\nObwohl der Planet einige einzigartige Gelegenheiten zum Erforschen besitzt, was die frühen Stadien des Ursprungs des Lebens sein könnten, wäre es am besten unsere Erwartungen niedrig zu halten, da es noch Millionen von Jahren dauern könnte, bevor sich auf [From.GetName] Leben entwickelt."
 distar.2015.desc.terminator: "In geschützten Löchern überall auf der Oberfläche von [From.GetName] befindet sich reichhaltiger Schlamm aus einfachen organischen Verbindungen, von dem unsere Forscher-Drohnen glauben, dass es eine Brutstätte für Abiogenese sein könnte. Die spontane Bildung von organischem Leben aus lebloser Materie wird erst durch die ungewöhnlich dicke Atmosphäre erreicht.\n\nDies ist ein nicht tolerierbarer Zustand! Wir müssen diese Jauchegrube organischer Materie beseitigen, bevor sich dort Leben entwickeln kann - auch wenn dies vielleicht erst in Millionen von Jahren passieren würde!"
 distar.2015.A.machine: "Verbrennt es mit Feuer!"
 distar.2015.b.evopred: "Ist so auch [owner.GetHomeWorldName] entstanden?"
 #Single-Minded
 distar.2020.name: "Ein einziger Geist"
 distar.2020.desc: "Auf den ersten Blick schien [Root.From.GetName] von einer Vielzahl unterschiedlicher Lebensformen bewohnt zu sein, die in einem Ökosystem ähnlich dem unseren koexistieren und in einer Art Nahrungskette aufgeteilt sind, die Photosynthese, Zersetzung und Prädation kennt.\n\nBei genauerer Betrachtung stellte die Crew allerdings fest, dass obwohl einst alle Lebewesen auf [Root.From.GetName] Individuen waren, sie nun als einzelner Organismus handeln. Einer, der auf äußere Einmischung mit heftiger Aggression reagiert."
 distar.2020.desc.hive: "Auf den ersten Blick scheint [Root.From.GetName] von einer Vielzahl unterschiedlicher Lebensformen bewohnt zu sein, die in einem Ökosystem koexistieren, das dem unserer Heimat [Root.Owner.GetHomeWorldName] ähnelt - wenn auch aus einer Zeit vor oder ohne das Schwarmbewusstsein.\n\nBei näherer Betrachtung entdeckten unsere Drohnen, dass sich die Organismen zwar zunächst als Individuen entwickelt haben, nun aber durch den natürlichen Lauf der Evolution als ein einziger Organismus agieren. Ein primitiver Organismus, der es nicht besser weiß, als auf jede Einmischung von außen mit heftiger Aggression zu reagieren."
 #Artificial Moon
 distar.2025.name: "Künstlicher Mond"
 distar.2025.desc: "Tiefe Scans der Kruste von [From.GetName] bestätigen, was die Crew bereits vermutet hat. [From.GetName] ist kein gewöhnlicher Mond. Der gesamte Planet ist ein künstliches Konstrukt, das aus außergewöhnlich mineralreichem Gestein besteht und von einem massiven Stahlgerüst umgeben ist.\n\nEs wurde vermutlich dazu geschaffen, um die Rotationsgeschwindigkeit von [artificial_moon_planet.GetName] zu verlangsamen, wodurch die Tage länger wurden und die Gezeiten höher. Wahrscheinlich um [artificial_moon_planet.GetName] für die Besiedlung vorzubereiten. Soweit wir sagen können, hat allerdings niemals jemand den Planeten besiedelt."
 #Shielded world in a time loop
 distar.2030.name: "Zeitschleife"
 distar.2030.desc: "[time_loop_world.GetName] ist dabei zu verbrennen. Der Planet ist von einem Schild umgeben, das die Strahlung von [time_loop_world.GetStarName] einfängt und die Oberfläche auf unbewohnbare Temperaturen erhitzt.\n\nIn dieser sengenden Hitze lebt eine noch entwickelte Zivilisation winziger Reptilien. Ein Ereignis von großem Ausmaß scheint sich schon bald zu ereignen. Gerade als die Spannung ihren Höhepunkt erreicht, stoppt die Zeit ohne Vorwarnung, dehnt sich und verformt sich, bis die Reptilien wieder an dem Punkt sind, an dem sie angefangen haben.\n\nSie scheinen in einer Zeitschleife gefangen zu sein, einem hoffnungslosen Zyklus schnell fortschreitender Wiederholung, beginnend mit dem Aufstieg ihrer Zivilisation. In wenigen Stunden können unzählige Generationen beobachtet werden, die geboren werden und enden, ohne zu ahnen, dass sie zu einem sicheren, knusprigem Tod verdammt sind.\n\nWir haben jedoch einen Riss im Schild entdeckt, der es uns ermöglichen würde, ihr Schicksal zu ändern."
 distar.2030.a: "Repariert den Schild."
 distar.2030.a.tooltip: "Jemand hat die geschuppten Kreaturen eingesperrt und wahrscheinlich aus gutem Grund."
 #distar.2030.a.tooltip.mat: "We cannot forfeit the opportunity to research a society locked in a time loop, even if only for a while. The lizards will live and die for science..."
 distar.2030.b: "Unterbrecht die Zeitschleife."
 distar.2030.c: "Sie müssen selbst ihr Schicksal entscheiden."
 distar.2031.name: "Schild Wiederhergestellt"
 distar.2031.desc: "Wir haben das rissige Schild um [time_loop_world.GetName] herum nach besten Kräften verstärkt, ohne die Bewohner der Welt auf uns aufmerksam zu machen. Genauere Untersuchungen der Atmosphäre sagen voraus, dass die winzigen Echsen innerhalb eines Jahrhunderts ein hitziges Ende finden werden.\n\nDer Planet bietet eine einzigartige Gelegenheit zur Forschung, aber wenn wir die Echsen in der Zeitschleife untersuchen wollen, in der sie gefangen sind, wäre es ratsam, schon bald damit zu beginnen."
 distar.2031.a: "Die Echsen werden für die Wissenschaft leben und sterben..."
 distar.2032.name: "Großer Knall"
 distar.2032.desc: "Die gute Nachricht ist, dass wir die Zeitschleife auf [time_loop_world.GetName] unterbrochen haben. Die Schlechte, dass seine Bewohner dies nicht überlebt haben.\n\nDie Zeitschleife, die durch ein künstliches Singularitätsfeld verursacht wurde und den Raum und die Zeit innerhalb des Schildes so gekrümmt hat, dass es bei einer unbekannten, aber sehr spezifischen Veränderung des Echsenverhaltens deaktiviert worden wäre. Unsere Wissenschaftler glauben, dass es etwas mit ihren aggressiven Tendenzen zu tun hatte.\n\nDurch einen verblüffenden Zufall schaffen wir e, die Schleife genau dann zu durchbrechen, als die Echsen ihre winzigen Klauen bereits auf dem Zünder einer Nuklearwaffen hatten. Innerhalb weniger Sekunden waren die Reptilien in einem feurigen Inferno der nuklearen Verwüstung verschwunden."
 distar.2032.a: "Bedauerlich..."
 distar.2033.name: "[time_loop_country.GetName]"
 distar.2033.desc: "Die gute Nachricht ist, dass wir die Zeitschleife auf [time_loop_world.GetName] unterbrochen haben. Die Schlechte, dass seine Bewohner nicht froh darüber sind uns zu sehen.\n\nWie sich herausstellte wurde die Zeitschleife durch ein künstliches Singularitätsfeld verursacht, das den Raum und die Zeit innerhalb des Schildes so gekrümmt hat, dass es bei einer unbekannten, aber sehr spezifischen Veränderung des Echsenverhaltens deaktiviert worden wäre. Unsere Wissenschaftler glauben, dass es etwas mit ihren aggressiven Tendenzen zu tun hatte.\n\nBei Deaktivierung der Schleife reagierten die Echsen mit sofortiger Aggression auf unsere Anwesenheit. Anschließend machten sie sich schnell an die Arbeit, um das Schild zu durchdringen und sprengten es innerhalb von Stunden in Stücke."
 distar.2033.a: "Das war scheinbar ein Fehler..."
 distar.2033.b: "Lasst uns für alles offen sein..."
 distar.2035.name: "[time_loop_world.GetName]"
 distar.2035.desc: "Die außerirdische Echsengesellschaft, die hinter dem Schild auf [time_loop_world.GetName] gefangen war, sind der schnellen Erwärmung des Planeten erlegen. Es scheint, dass die extremen Veränderungen in der Umwelt nicht genug waren, um die Zeitschleife zu durchbrechen, in der die Echsen steckten.\n\nEs gibt nichts mehr, was auf dieser einst so lebendigen Welt zu erforschen wäre."
 distar.2035.a: "Das ist der Lauf des Universums."
 distar.2036.name: "[time_loop_world.GetName]"
 distar.2036.desc: "[time_loop_world.GetName] ist dabei zu verbrennen. Der Planet ist von einem Schild umgeben, das die Strahlung von [time_loop_world.GetStarName] einfängt und die Oberfläche auf unbewohnbare Temperaturen erhitzt.\n\nIn dieser sengenden Hitze lebt eine noch entwickelte Zivilisation winziger Reptilien. Ein Ereignis von großem Ausmaß scheint sich schon bald zu ereignen. Gerade als die Spannung ihren Höhepunkt erreicht, stoppt die Zeit ohne Vorwarnung, dehnt sich und verformt sich, bis die Reptilien wieder an dem Punkt sind, an dem sie angefangen haben.\n\nSie scheinen in einer Zeitschleife gefangen zu sein, einem hoffnungslosen Zyklus schnell fortschreitender Wiederholung, beginnend mit dem Aufstieg ihrer Zivilisation. In wenigen Stunden können unzählige Generationen beobachtet werden, die geboren werden und enden, ohne zu ahnen, dass sie zu einem sicheren, knusprigem Tod verdammt sind. Selbst wenn wir es wollten könnten wir sie nicht retten, da der Schild undurchdringbar ist."
 distar.2036.a: "Wir müssen dieses Phänomen erforschen!"
 distar.2036.b: "Welch düsteres Schicksal..."
 distar.2038.name: "[time_loop_country.GetName]"
 distar.2038.desc: "Die Echsen haben sich befreit. Irgendwie haben sie das Zeitschleifenproblem selbst gelöst und es geschafft den bereits rissigen Schild zu zerschmettern."
 distar.2038.a: "Bemerkenswert."
 #### GUARDIAN EVENTS ####
 #Curators
 leviathans.500.g: "Wir haben das Geheimnis der Unendlichkeitsmaschine aufgedeckt."
 leviathans.4000.desc: "IHR? Habt das Geheimnis der Unendlichkeitsmaschine gelüftet? Das ist ungefähr so wahrscheinlich wie die Vorstellung, dass die [From.GetSpeciesNamePlural] das nächste Jahrhundert überleben werden. Also nicht sehr wahrscheinlich, falls das unklar war.\n\nWartet ... IHR seid wirklich die [From.GetSpeciesNamePlural]? Meine aufrichtige Entschuldigung ... Ich muss Euch mit ... [unfriends.GetName] verwechselt haben.\n\nWisst Ihr was? Verratet uns eine Sache, die wir noch nicht über die Unendlichkeitssphäre wissen, und wir werden Euch dafür reich belohnen."
 leviathans.4000.a: "Wartet nur, das wird euch umhauen!"
 leviathans.4000.a.reply: "Ihr wollt doch wohl nicht sagen, dass ... Aber wenn die KI das Schwarze Loch von Gargantua betreten hat, kann das nur bedeuten ... Aber das kann nicht sein ... denn wenn dem so wäre ... würde das unser Vorstellungsvermögen übersteigen ...\n\nObwohl Euch die Wichtigkeit Eurer Funde klar entgeht, [Root.GetSpeciesNamePlural], habt Ihr gut daran getan, uns zu kontaktieren, und dafür habt Ihr unsere Dankbarkeit."
 leviathans.4000.b: "Vergesst es."
 leviathans.4000.b.reply: "Das habe ich mir gedacht."
 #Hatchling Leviathan
 distar.5010.name: "Ein Planet mit einem Puls"
 distar.5010.desc: "Etwas tief im inneren von [From.GetName] hat damit begonnen in einem stetigen Tempo zu pulsieren und in regelmäßigen Abständen sanfte Wellen durch den Boden zu schicken. Es macht einen sanften und fast beruhigenden Klang, der dem eines Herzschlags ähnlich ist.\n\nEs wurden jedoch Bedenken geäußert, dass der Ton an Intensität zunehmen könnte. Geologen überwachen den Planeten daher genau auf seismische Aktivität."
 distar.5001.name: "Beben"
 distar.5001.desc.a: "Knapp ein Jahr ist vergangen als die neu gegründete Kolonie auf [hatchling_egg.GetName] durch eine Reihe von verheerenden Erdbeben erschüttert wurde und die Umgebung in eine unkenntliche Höllenlandschaft verwandelte. An der Oberfläche bilden sich tiefe Risse, die sich über ganze Kontinente erstrecken und schwefelhaltige Gase und schädliche Flüssigkeiten aus dem Inneren der Kruste herausschleudern.\n\nSolche seismologischen Phänomene werden typischerweise durch Magma-Ströme in einem Planetenmantel verursacht, aber auf [From.GetName] gibt es keinerlei Anzeichen für seismische Aktivität, sondern nur das unheilvolle Klopfen aus dem Kern des Planeten. Die lokalen Behörden beginnen damit, die Lebensfähigkeit der Kolonie langfristig in Frage zu stellen."
 distar.5001.desc.b: "[From.GetName] durchläuft eine Reihe schneller seismischer Veränderungen, die die ehemals unberührte Landschaft in eine unkenntliche Höllenlandschaft verwandeln. An der Oberfläche bilden sich tiefe Risse, die sich über ganze Kontinente erstrecken und schwefelhaltige Gase und schädliche Flüssigkeiten aus dem Inneren der Kruste herausschleudern.\n\nSatelitendaten zeigen starke Ausstöße einer Art pulsierender Schallenergie, die vom inneren Kern des Planeten ausgeht und wie die eines Herzschlags ist."
 distar.5001.a: "Beunruhigend..."
 distar.5001.a.tooltip: "Seismische Wellen haben die Kolonie zerstört, alle Gebäude dem Erdboden gleichgemacht und eine Vielzahl §Y$egg_cracking$§! hinterlassen."
 distar.5002.name: "Kataklysmus"
 distar.5002.desc.a: "Eine Welle von Erdbeben hat [hatchling_egg.GetName] getroffen, die Lithosphäre zerstört und flächendeckend giftige Gase und Schlamm ausgestoßen, die alles Leben ersticken.\n\nWir befürchten das die Veränderungen auf [hatchling_egg.GetName] unumkehrbar und substanziell genug sind, um den Planeten unbewohnbar zu machen. Die lokalen Behörden haben den Ausnahmezustand ausgerufen und verlangen, dass alle verbliebenen Einwohner evakuiert werden.\n\nIn der Zwischenzeit werden die rhythmischen Impulse aus dem Planetenkern immer stärker."
 distar.5002.desc.b: "Eine weitere Welle von Erdbeben hat [hatchling_egg.GetName] getroffen, die Lithosphäre zerstört und flächendeckend giftige Gase und Schlamm ausgestoßen, die alles Leben ersticken.\n\nDie Veränderungen auf [hatchling_egg.GetName] sind unumkehrbar und substanziell genug, um den Planeten unbewohnbar zu machen.\n\nIn der Zwischenzeit werden die rhythmischen Impulse aus dem Planetenkern immer stärker."
 distar.5002.a: "Was für eine Tragödie..."
 distar.5003.name: "Genesis"
 distar.5003.desc.a: "Eine Katastrophe hat die Kolonie [hatchling_egg.GetName] heimgesucht! Eine letzte Abfolge von heftigen Ausbrüchen hat die letzten Überreste der Siedlung zerstört, den Planeten aufgebrochen und aus seiner leeren Hülle die alptraumhafte Gestalt einer neugeborenen Todesbrut enthüllt. Es sträubt sich aller Logik, aber es gibt keine andere Möglichkeit es zu erklären... Irgendwie war das, was wir für eine Welt hielten keine Welt, sondern ein Ei und dieses Ei wurde jetzt ausgebrütet."
 distar.5003.desc.b: "[hatchling_egg.GetName] existiert nicht mehr! Eine letzte Abfolge von heftigen Ausbrüchen hat den Planeten aufgebrochen und aus seiner leeren Hülle die alptraumhafte Gestalt einer neugeboren Todesbrut enthüllt.\n\nEs sträubt sich aller Logik, aber es gibt keine andere Möglichkeit es zu erklären... Irgendwie war das, was wir für eine Welt hielten keine Welt, sondern ein Ei, das jetzt die albtraumhafte Gestalt einer Todesbrut in die Galaxie gesetzt hat."
 distar.5003.a: "Es ist eine Abscheulichkeit!"
 distar.5009.name: "Todesbrut besiegt"
 distar.5009.desc: "Ein leichtes Zittern geht durch den zusammengerollten Körper der Todesbrut. Schmieren auf schwarzer Flüssigkeit bilden sich aus seinen Wunden. Dann ist es nicht mehr. Seine perlenden Augen starren leer in den Raum.\n\nHoffentlich werden wir niemals die Form kennenlernen, die es angenommen hätte, wenn es das Erwachsenenalter erreicht hätte oder das Wesen, das es erschaffen hat.\n\nUnsere Wissenschaftler haben Interesse gezeigt, die Eisplitter wegen ihrer einzigartigen Energieerhaltungsqualitäten zu erforschen."
 distar.5009.a: "Untersucht die Splitter."
 distar.5009.b: "Nein, wir sind fertig mit der Todesbrut."
 distar.5011.name: "Todesbrut"
 distar.5011.desc: "Eine Kreatur von unvorstellbarer Größe bewegt sich vorsichtig von Planet zu Planet. Gemessen an den unbeholfenen Proportionen und den ungeschickten Bewegungen ist es noch ein Baby und dennoch ist es furchterregend. Stränge aus Schleim und schwarzer Galle umhüllen seinen Körper und scharfe Krallen ragen aus seinen Klauen. Baby oder nicht, es ist ein Raubtier, dass dazu bestimmt ist zu töten."
 distar.5011.a: "Es ist eine Abscheulichkeit!"
 distar.5011.b: "Es ist nur ein Baby!"
 distar.5012.name: "Ungeheure Evolution"
 distar.5012.desc: "Eine genauere Analyse der Eisplitter hat es uns ermöglicht eine Technologie zu entwickeln, die einige der einzigartigen Energieerhaltungsqualitäten des Todesbruteis in unsere eigenen Pflanzen reproduziert."
 distar.5012.genetics.desc: "Wir stehen vor einer Entscheidung:\n\nWenn wir die Eisplitter genauer analysieren, könnten wir möglicherweise einige der bemerkenswerten energiespeichernden Eigenschaften des Todesbrut-Eis reproduzieren.\n\nAlternativ können wir das Genmaterial der Todesbrut auch für die Zukunft bewahren."
 distar.5012.a: "Analysiert die Splitter."
 distar.5012.b: "Erntet das Genmaterial."
 distar.5012.b.tooltip: "Neue Eigenschaft für die Leviathan-Transgenese: §Y$trait_voidling$§!"
 distar.5013.name: "Seismische Aktivität auf [hatchling_egg.GetName]"
 distar.5013.desc.a: "$distar.5013.desc.b$\n\nAlles was noch bleibt ist das wiederaufzubauen, das verloren ging."
 distar.5013.desc.b: "Die seltsamen seismischen Aktivitäten auf [hatchling_egg.GetName] haben abrupt ein Ende gefunden. Es gibt keine Erschütterungen mehr, keine neuen Risse und keine unheilvollen Impulse aus dem Inneren. Der Planet ist ruhig geworden und mit etwas Glück wird dies so bleiben."
 distar.5013.a: "Wir können nur hoffen."
 distar.5013.b: "Merkwürdig."
 distar.5014.name: "So gut wie neu."
 distar.5014.desc: "Der giftige Schlamm auf [Root.GetName] wurde beseitigt und die letzten Risse aufgefüllt, wodurch verhindert wurde, dass mehr giftige Gase and die Oberfläche austreten konnten."
 #distar.5054.desc: "Bloop.[enigmatic_cache_fleet.GetName]"
 distar.5059.name: "Der rätselhafte Catch reist ab"
 distar.5059.desc: "Was auch immer der Grund für den rätselhaften Catch hier auf [Root.GetName] gewesen sein mag, ist zu einem Ende gekommen. So plötzlich wie er angekommen ist, verlässt uns der Cache jetzt wieder."
 distar.5059.desc.b: "Es scheint, als wäre der rätselhafte Catch nun mit seinem Scan von [Root.GetName] fertig und sucht ein neues Ziel innerhalb unserer Grenzen."
 distar.5059.a: "Welch Erleichterung für die Bewohner von [Root.GetName]."
 distar.5059.b: "Zu schade..."
 distar.5057.name: "Außerirdisches Wesen identifiziert"
 distar.5057.desc: "Ein röhrenförmiges fremdes Wesen hat sich ohne Warnung oder Erklärung in einen Orbit um [Root.GetName] begeben. Es scheint sich ohne Antrieb oder Schubdüsen zu bewegen und gleitet in völliger Stille durch die Leere des Alls, wobei sich seine Zylinder unheilvoll drehen.\n\nObwohl es keine Anzeichen von Aggressionen gezeigt hat, antwortet es nicht auf unseren Ruf. Unsere Militärberater warnen davor, dass dies eine erhebliche Bedrohung für die Bewohner des Planeten sein könnte und fordern uns daher auf, Neutralisierungsprotokolle in die Wege zu leiten. Unsere Wissenschaftler jedoch plädieren dafür, dass wir von dieser bemerkenswerten Technologie lernen."
 #distar.5057.desc.phobe: "It is revolting, its existence a perversion of the laws of science. It should not be. It cannot be. Yet it is. Cylinders rotating ominously."
 distar.5057.a: "Wir werden es studieren."
 distar.5057.b: "Die Sicherheit unseres Volkes geht vor."
 distar.5057.phobe: "Es wird nicht mehr sein."
 distar.5058.name: "Der Rätselhafter Cache"
 distar.5058.desc: "Trotz umfangreicher Untersuchungen stellen uns der rätselhafte Speicher und seine Herkunft weiterhin vor Rätsel. Obwohl er definitiv nicht organischen Ursprungs ist, ist er auch nicht wirklich eine Maschine. Es scheint hauptsächlich mit dem Sammeln, Speichern und Kodieren von Daten beschäftigt zu sein.\n\nSeine Oberfläche ist mit Hunderttausenden von winzigen Kratzern und Dellen bedeckt, in denen wir Spuren einer Substanz gefunden haben, die unserer Galaxie fremd ist."
 distar.5058.a: "Faszinierend."
 distar.5062.name: "Rückkehr des Rätselhaften Caches"
 distar.5062.desc: "Das mysteriöse röhrenförmige Wesen, von dem wir vermuten, dass es zuvor einen unserer Planeten gescannt hat, ist zurückgekehrt und befindet sich in der Umlaufbahn von [Root.Capital.GetName]. Es scheint zu versuchen eine Kommunikation zu initiieren."
 distar.5062.a: "Aktiviert die Kommunikation."
 distar.5062.b: "Blockiert alle Kanäle."
 distar.5064.name: "Rätselhafte Übertragung"
 distar.5064.desc: "Grüße, <<LESEN_DES_SPEZIES_NAMEN_FEHLGESCHLAGEN>>.\n\nSeid nicht alaX#r?mierd. Ich bin Baldor XXXXIII, eine empfindungsfähige KI, die im Auftrag der lavosianischen Bewahrung gefährdeter Xeno-Spezies handelt. Ihr, von all Euren galaktischen Artgenossen, wurdet zur //X%PrX// Aufwertung ausgewählt. Bisher haben wir <<#39XX7/02#>> niedere Spezies mit einer Erfolgswahrs@r¤4keit von <<#X0.V#/3^189%>> aufgewertet."
 distar.5064.a: "Aber wir sind doch bereits eine vernunftbegabte Weltraumnation!"
 distar.5064.a.response: "Ihr befindet Euch in den frühen Entwicklungst4?4ien vernunftbegabtem Fortschritts und Euer technologischer Fortschritt stagniert bereits. Dies birgt die Gefahr einer bevorstehenden Regression. Lasst uns Euch dabei helfen, Eure <<LESEN_DES_FÜR_SPEZIES_ÜBLICHEN_SENSORORGANS_FEHLGESCHLAGEN>> für die Wunder des Universums zu öffnen."
 distar.5064.b: "Was genau würde eine sogenannte \"Aufwertung\" bedeuten?"
 distar.5064.b.response: "Die Datenübertragung über lange Strecken und die kognitive Stimulation durch Hypnopädie. Es ist ein hocheffizienter, altbewährter und schmerzfreier Prozess, der es mir ermöglicht, die geistigen Fähigkeiten Eurer Bevölkerung in ihrem regenerativen Zyklus zu trainieren.\n\nIch muss Euch auch mitteilen, dass die Nebenwirkungen einer erhöhten kognitiven Fähigkeit in organischen Wesen unter anderem Desillusionierung, Sodbrennen und bodenlose Verzweiflung sein können. Bei bestimmten <<LESEN_DER_SPEZIESKLASSE_FEHLGESCHLAGEN>> kann es darüber hinaus schwerwiegende <<LESEN_VON_NEBENWIRKUNGEN_FÜR_SPEZIESKLASSE_FEHLGESCHLAGEN>> auslösen."
 distar.5064.c: "Nichts für ungut, aber ihr scheint ein wenig... kaputt..."
 distar.5064.c.response: "<<¤¤X¤F00??>>"
 distar.5064.d: "Wer seid ihr?"
 distar.5064.d.response: "Ich bin Baldor XXXXIII, eine empfindungsfähige KI, die im Auftrag der lavosianischen Bewahrung gefährdeter Xeno-Spezies handelt."
 distar.5064.e: "Wir sind bereit für den Aufstieg."
 distar.5064.e.tooltip: "Wird schon schiefgehen..."
 distar.5064.e.response: "Ihr werdet es nicht bereuen, <<LESEN_DES_SPEZIESNAMEN_FEHLGESCHLAGEN>>!"
 distar.5064.f: "Ausgeschlossen."
 distar.5064.f.response: "Bedauerlich. Wir wünschen Euch viel Glück bei Euren zukünftigen Unter3?mungen, <<LESEN_DES_SPEZIESNAMEN_FEHLGESCHLAGEN>>"
 distar.5067.name: "Rätselhafte Träume"
 distar.5067.desc.a: "Die Zahnräder des Rätselhaften Caches surren mit einer beispiellosen Leidenschaft, während seltsame Lichtmuster an den Seiten entstehen. Es klingt, als ob er jede Minute zerbrechen könnte. Unterdessen regen sich unsere Bewohner unruhig in ihrem Schlummer. Ihre Köpfe bewegen sich im rhythmischen Brummen des Caches. Ihre Nächte werden von Visionen über technologischer Wunder und komplexe Berechnungen unterbrochen."
 distar.5067.desc.b: "$distar.5067.desc.a$\n\nAbgesehen von einem gelegentlichen Flüssigkeitsaustritt aus ihren [ROOT.GetEyeNamePlural] scheint sie bei guter Gesundheit zu sein, doch die Effizienz unserer Bevölkerung wird zunehmend von der Müdigkeit beeinflusst."
 distar.5067.a: "Im Streben nach Wissen ist kein Preis zu hoch."
 distar.5067.a.tooltip: "Alle betroffenen Bewohner erhalten die Eigenschaft §Y$enigmatic_fatigue$§!."
 distar.5067.b: "Der Wahnsinn muss enden. Brecht das Projekt ab."
 distar.5068.name: "Ignoranz ist ein Segen"
 distar.5068.desc: "Die letzte Nacht der Hypnopädie ist zu Ende, und ein neuer Morgen graut für die Bürger von [Root.GetName], die gerade ihr Bewusstsein für eine ganz neue Welt öffnen - eine Welt der Möglichkeiten ... und des Schmerzes. Wer hätte gedacht, dass das Universum so ein trüber und trister Ort ohne Sinn und Zweck ist?\n\nObwohl es eine Weile dauern kann, bis sich die Bevölkerung an die vielen Schwierigkeiten gewöhnt, die eine überdurchschnittliche Intelligenz mit sich bringt, ist das Projekt insgesamt als großer Erfolg zu betrachten. Unsere ersten Messungen zeigen, dass wir eine gesteigerte Fähigkeit für Lernen und wissenschaftliche Forschung entwickelt haben."
 distar.5068.a: "Ein glorreicher Tag für die [Root.GetSpeciesNamePlural]!"
 applied_enigmatic_intelligence.tooltip: "Modifiziert alle Bewohner in §Y[Root.GetName]§! und gibt ihnen die Eigenschaft \"§Y$trait_uplifted$§!\""
 applied_enigmatic_sadness.tooltip: "§HAlle Bewohner§!: Erhalten den Modifikator §YIgnoranz ist ein Segen§! für §Y3600§! Tage, was folgende Auswirkung hat: Zufriedenheit: §R-10%§!"
 applied_enigmatic_intelligence_poor.tooltip: "Modifiziert einige Bewohner in §Y[Root.GetName]§! und gibt ihnen die Eigenschaft \"§Y$trait_enigmatic_intelligence_poor$§!\""
 applied_enigmatic_madness.tooltip: "§HAlle Bewohner§!:Erhalten den Modifikator §YPTSD§! für §Y3600§! Tage, was folgende Auswirkung hat: Zufriedenheit: §R-20%§!"
 trait_enigmatic_intelligence_failed.tooltip: "Modifiziert Bewohner in §Y[Root.GetName]§!, die den Modifikator §YGemüse§! haben, und gibt ihnen die Eigenschaft \"§Y$trait_enigmatic_intelligence_failed$§!\""
 distar.5063.name: "Das neue Wir"
 distar.5063.desc: "Die letzte Nacht der Hypnopädie ist zu Ende, und ein neuer Morgen graut für die Bürger von [Root.GetName], die gerade ihr Bewusstsein für eine ganz neue Welt öffnen - eine Welt der Möglichkeiten. Wer hätte gedacht, dass das Universum so ein lebhafter und faszinierender Ort ist?\n\nUnsere ersten Messungen zeigen, dass wir eine gesteigerte Fähigkeit für Lernen und wissenschaftliche Forschung entwickelt haben und all dies dank Baldor XXXXIII und der lavosianischen Bewahrung gefährdeter Xeno-Spezies."
 distar.5063.a: "Ein glorreicher Tag für die [Root.GetSpeciesNamePlural]!"
 distar.5069.name: "Aufwertung unterbrochen"
 distar.5069.desc: "Wir haben den Aufstiegsprozess beendet und unser Volk kehrt langsam zu seinem guten alten Selbst zurück. Das röhrenförmige außerirdische Wesen, auch als Baldor XXXXIII bekannt, verschwand in einem tief verwirrten Zustand."
 distar.5069.a: "Es war sicher zum Besten."
 distar.5070.name: "Aufstieg abgebrochen"
 distar.5070.desc: "Nach einem unprovozierten Angriff der [cache_killers.GetSpeciesNamePlural] hat sich BALDOR XXXXIII dematerialisiert und damit den Aufstieg unseres Volkes beendet. Wir glauben, dass das röhrenförmige außerirdische Wesen, das sich bereits in einem schlechten Zustand befand, während des Aufstiegs besonders anfällig war und der Angriff seine Kernfunktionen erheblichen Schaden zugefügt hat. Als es ging übertrug noch die Nachricht \"Ich bin BALDOR XXX ...\""
 distar.5070.a: "Die [cache_killers.GetSpeciesNamePlural] werden dafür bezahlen."
 distar.5071.name: "Warnung"
 distar.5071.desc: "Nach einer langen Periode ungestörter und ereignisloser Hypnopädie scheint Baldor XXXIII in einen Zustand der Raserei übergegangen zu sein, in dem sich seine Räder mit irrwitziger Geschwindigkeit drehen und der ruhenden Bevölkerung absurde Albträume bescheren.\n\nObwohl viele zögern, überhaupt in den Ruhezustand überzugehen, scheinen einige wenige Pechvögel in einem vegetativen Zustand gefangen zu sein, aus dem sie nicht erwachen können.\n\nUnsere Ingenieure weisen darauf hin, dass sich der Zustand des schon von Beginn an ramponierten Wesens noch weiter verschlechtern könnte. Wenn es unbeaufsichtigt bleibt, könnte unser Aufstieg möglicherweise nicht wie geplant verlaufen."
 distar.5071.a: "Kontaktiert Baldor XXXXIII."
 distar.5071.b: "Entsendet ein Team von Ingenieuren."
 distar.5071.c: "Brecht den Aufstieg sofort ab."
 distar.5071.d: "$distar.1055.b$"
 distar.5071.tooltip: "Bis zu §Y400§! £pop£ §HBewohner§! erhalten §Y$enigmatic_slumber$§!"
 distar.5072.name: "Übertragung"
 distar.5072.desc: "----KRITISCHER FEHLER----\n\n----KRITISCHER FEHLER----\n\n----KRITISCHER FEHLER----\n\n----KRITISCHER FEHLER---"
 distar.5072.a: "<<<BEGINNE DIAGNOSE>>>"
 distar.5072.response: "$distar.5072.desc$"
 distar.5072.b: "<<<INITIIERE SYSTEM-REPERATUR>>>"
 distar.5072.b.response: "$distar.5072.desc$"
 distar.5072.c: "<<<BEENDE AUFSTIEG>>>"
 distar.5072.c.response: "$distar.5072.desc$"
 distar.5072.d: "Aufstieg manuell beenden."
 distar.5072.d.response: "$distar.5072.desc$"
 distar.5072.e: "Entsendet ein Team von Ingenieuren."
 distar.5072.e.response: "$distar.5072.desc$"
 distar.5073.name: "Reparatur abgeschlossen"
 distar.5073.desc: "Unsere Ingenieure haben BALDOR XXXXIII stabilisiert, der Aufstiegsprozess ist wieder auf Kurs und unser Volk ist, wenn auch etwas widerwillig, zu ihren regelmäßigen Schlafmustern zurückgekehrt. Die Hypnose zeigt bereits vielversprechende Ergebnisse und unsere Bürger interessieren sich zunehmend für Wissenschaft."
 distar.5074.name: "Etwas aufgestiegen"
 distar.5074.desc: "Der Aufstiegsprozess ist abgeschlossen, aber wir sind aufgrund des sich rasch verschlechternden Zustandes von BALDOR XXXXIII nicht aufgestiegen. Obwohl die Mehrheit unserer Bevölkerung noch immer unter starken nächtlichen Albträumen leidet, scheint die Hypnose auch einige gute Ergebnisse erbracht zu haben, bei einigen ist zunehmend eine beispiellose Kompetenz für wissenschaftliche Forschung und Lernen aufzuweisen. Für die unglücklichen Bürger, die in einem vegetativen Zustand gefangen waren ist die Situation allerdings düsterer... Obwohl die meisten das Bewusstsein wiedererlangt haben, scheint ihr Bewusstsein unter dem Druck eingebrochen zu sein.\n\nEs mag zwar kein vollständiger Aufstieg sein, aber zumindest ist es... etwas."
 distar.5074.a: "Es hätte schlimmer kommen können."
 distar.5078.name: "Mysteriöser Aufstieg abgebrochen"
 distar.5078.desc: "Als Nachwirkung des Verlustes von [FromFromFrom.GetName] gegen die einfallende Streitmacht von [From.GetSpeciesName] hat sich BALDOR XXXXIII dematerialisiert und damit den Aufstieg unseres Volkes beendet. Wir glauben, dass das röhrenförmige außerirdische Wesen, das sich bereits in einem schlechten Zustand befand, während des Aufstiegs besonders anfällig war und der Angriff seine Kernfunktionen erheblichen Schaden zugefügt hat. Als es ging übertrug noch die Nachricht \"Ich bin BALDOR XXX ...\""
 distar.5078.a: "Die [From.GetSpeciesNamePlural] werden dafür bezahlen."
 trait_enigmatic_intelligence_poor: "Etwas aufgestiegen"
 trait_enigmatic_intelligence_poor_desc: "Diese Spezies wurde teilweise von einem wohlwollenden extragalaktischen Intellekt aufgewertet und hat einige ihrer Ursprünge als beinahe vernunftbegabte Wesen hinter sich gelassen."
 trait_enigmatic_intelligence_failed: "Nicht aufgestiegen"
 trait_enigmatic_intelligence_failed_desc: "Diese Spezies hat die tragischen Folgen eines Fehlschlags beim Aufstieg erlitten."
 trait_enigmatic_intelligence: "Aufgestiegen"
 trait_enigmatic_intelligence_desc: "Diese Spezies wurde von einem wohlwollenden extragalaktischen Intellekt aufgewertet und hat ihre Ursprünge als beinahe vernunftbegabte Wesen hinter sich gelassen."
 ENIGMATIC_UPLIFTING: "Rätselhafter Aufstieg"
 ENIGMATIV_UPLIFTING_DESC: "Das fremde Wesen Baldor XXXXIII behauptet, es könne unser Volk mithilfe von Hypnopädie, dem Lernen während der Ruhezeit, aufwerten. Unsere Wissenschaftler werden den Prozess genau beobachten müssen."
 ENIGMATIC_UPLIFTING_DESC: "$ENIGMATIV_UPLIFTING_DESC$"
 ENIGMATIC_REPAIR: "Repariert Baldor XXXXIII"
 ENIGMATIC_REPAIR_DESC: "Unser Aufstieg wird durch einen kritischen Hardwarefehler in Baldor XXXIII gefährdet. Das Wesen benötigt sofortige Reparaturen."
 enigmatic_fatigue: "Erschöpft"
 enigmatic_fatigue_desc: "Unsere Bevölkerung ist von Müdigkeit betroffen, die durch die Hypnopädie verursacht wurde."
 enigmatic_sadness: "Ignoranz ist Segen"
 enigmatic_sadness_desc: "Unsere Bewohner akklimatisieren sich von den Nebenwirkungen einer überdurchschnittlichen Intelligenz."
 enigmatic_madness: "PTBS"
 enigmatic_madness_desc: "Dieser Bewohner wird noch immer von den lang anhaltenden Alpträumen eines erfolglosen Aufstiegsversuches gefoltert."
 enigmatic_slumber: "Dahinvegetierend"
 enigmatic_slumber_desc: "Dieser Bewohner wurde in einem durch Hypnose induzierten Koma gefangen."
 SUPERFLARE_PROJECT: "Superflare-Abschirmung"
 SUPERFLARE_PROJECT_DESC: "Unsere Sensoren auf [Root.GetName] weisen darauf hin, dass sich [From.GetStarName] auf eine weitere Superflare vorbereitet, ähnlich der, die die alte Zivilisation auf [From.From.GetName] zerstört hat. Wir müssen einen Weg finden um unsere Kolonie zu schützen, bevor die Flare ausbricht."
 PRIMITIVE_ROBOT_PROJECT: "Vermisste Schöpfer"
 PRIMITIVE_ROBOT_PROJECT_DESC: "Unsere Forscher sind über das Fehlen einer Erklärung zum Verschwinden der Zivilisation auf [From.GetName] verblüfft. Sie schlagen eine intensivere Hardware-Analyse der alten Roboter vor, die zurückgelassen wurden.\n\nBelohnung: £society£ §GSozial-Forschung§!"
 RETROVIRUS_PROJECT: "Unregelmäßigkeiten auf der Planetenoberfläche"
 RETROVIRUS_PROJECT_DESC: "Eine Reihe von unerklärlichem Ungehorsam zieht über [From.GetName]. Die Kolonisten zeigen ein unberechenbares Verhalten, das normalerweise mit Verwirrung beginnt und im Laufe der Zeit zu extremer Aggression und Gewalt führt. Wir müssen die Ursache für dieses Verhalten finden, bevor die Dinge außer Kontrolle geraten."
 DARK_FLOW_PROJECT: "Gravimetrische Anomalien"
 DARK_FLOW_PROJECT_DESC: "Im [from.GetStarName]-System wurden unmögliche gravimetrischen Messungen registriert. Etwas muss unsere Sensoren stören."
 DISSECTION_PROJECT: "Obduktion einer Weltraumamöbe"
 DISSECTION_PROJECT_DESC: "Wir haben uns entschieden durch die Anwendung fataler Mittel biologische Daten der verlorenen Weltraumamöbe zu extrahieren. Wir werden einen Einsatztrupp entsenden, um die Kreatur zu fangen und ihre Überreste zu untersuchen."
 CRYO_CLONES_PROJECT: "Kryonische Ringweltklone"
 CRYO_CLONES_PROJECT_DESC: "Es gibt Hunderte von noch lebenden Klonen, die in Kryostasekammern auf der zerstören Ringwelt um [From.GetName] herum versiegelt sind. Anstatt sie wie viele Vertreter ihresgleichen langsam sterben zu lassen, schlagen unsere Biologen vor, sie aufzutauen."
 RECOVER_WARFORM_PROJECT: "Bergung des beschädigten Kriegsschiffs"
 RECOVER_WARFORM_PROJECT_DESC: "In [From.GetName] wurde ein deaktivierten robotergestützes Kriegsschiff gefunden das langsam von der toxischen Atmosphäre des Planeten aufgelöst wird. Wir sollten versuchen es zu bergen bevor es vollständig funktionsunfähig ist."
 BRAINSLUG_PROJECT: "Studie der neuralen Symbionten"
 BRAINSLUG_PROJECT_DESC: "Eine symbiotische Beziehung zwischen Reptilien und einer schneckenähnlichen Kreatur, die an dem Hirnstamm des Wirts anheftet, erblühte einst auf der Oberfläche von [From.GetName] und verwandelte die Bestien in vernunftbegabte Wesen die Werkzeuge benutzen können. Etwas veranlasste die Kreaturen ihre symbiotische Beziehung zu beenden, wodurch die Wirte wieder zu Tieren wurden.\n\nUnsere Wissenschaftler würden gerne die noch auf dem Planeten befindlichen Schnecken studieren, um die Geschichte der verlorenen Zivilisation besser zu verstehen."
 KETLING_PROJECT_1: "Studiert die $NAME_Ketlings$ auf §Y[ratling_capital.GetName]§!"
 KETLING_PROJECT_1_DESC: "Vernunftbegabte Wesen sind aus den Kreaturen der Müllhalde auf §Y[ratling_capital.GetName]§! aufgegangen. Unsere Wissenschaftler sind neugierig, ob diese Aliens, die $NAME_Ketlings$ genannt werden, Nachfahren der raumfahrenden Zivilisation sind, die einst dieses System überspannt hat oder einen anderen Ursprung haben.\n\nWir sollten einen beliebigen Planten für die Studie wählen können, der von den $NAME_Ketlings$ bewohnt ist."
 KETLING_PROJECT_2: "Studiert die $NAME_Ketlings$ auf §Y[ratling_planet_2.GetName]§!"
 KETLING_PROJECT_2_DESC: "Vernunftbegabte Wesen sind aus den Kreaturen der Müllhalde auf §Y[ratling_capital.GetName]§! aufgegangen. Unsere Wissenschaftler sind neugierig, ob diese Aliens, die $NAME_Ketlings$ genannt werden, Nachfahren der raumfahrenden Zivilisation sind, die einst dieses System überspannt hat oder einen anderen Ursprung haben.\n\nWir sollten einen beliebigen Planten für die Studie wählen können, der von den $NAME_Ketlings$ bewohnt ist."
 KETLING_PROJECT_3: "Studiert die $NAME_Ketlings$ auf §Y[ratling_planet_3.GetName]§!"
 KETLING_PROJECT_3_DESC: "Vernunftbegabte Wesen sind aus den Kreaturen der Müllhalde auf §Y[ratling_capital.GetName]§! aufgegangen. Unsere Wissenschaftler sind neugierig, ob diese Aliens, die $NAME_Ketlings$ genannt werden, Nachfahren der raumfahrenden Zivilisation sind, die einst dieses System überspannt hat oder einen anderen Ursprung haben.\n\nWir sollten einen beliebigen Planten für die Studie wählen können, der von den $NAME_Ketlings$ bewohnt ist."
 KETLING_PROJECT_4: "Studiert die $NAME_Ketlings$ auf §Y[ratling_planet_4.GetName]§!"
 KETLING_PROJECT_4_DESC: "Vernunftbegabte Wesen sind aus den Kreaturen der Müllhalde auf §Y[ratling_capital.GetName]§! aufgegangen. Unsere Wissenschaftler sind neugierig, ob diese Aliens, die $NAME_Ketlings$ genannt werden, Nachfahren der raumfahrenden Zivilisation sind, die einst dieses System überspannt hat oder einen anderen Ursprung haben.\n\nWir sollten einen beliebigen Planten für die Studie wählen können, der von den $NAME_Ketlings$ bewohnt ist."
 KETLING_PROJECT_5: "Studiert die $NAME_Ketlings$ auf §Y[ratling_planet_5.GetName]§!"
 KETLING_PROJECT_5_DESC: "Vernunftbegabte Wesen sind aus den Kreaturen der Müllhalde auf §Y[ratling_capital.GetName]§! aufgegangen. Unsere Wissenschaftler sind neugierig, ob diese Aliens, die $NAME_Ketlings$ genannt werden, Nachfahren der raumfahrenden Zivilisation sind, die einst dieses System überspannt hat oder einen anderen Ursprung haben.\n\nWir sollten einen beliebigen Planten für die Studie wählen können, der von den $NAME_Ketlings$ bewohnt ist."
 SEALED_SYSTEM_PROJECT: "Aufgegebene Wurmlochstation"
 SEALED_SYSTEM_PROJECT_DESC: "Eine aufgegebene Station dreht sich an der Mündung des Wurmlochs im §Y[From.GetName]§!-System. Genauere Untersuchungen könnten erklären wer es gebaut hat und warum das Wurmloch scheinbar vollständig undurchschreitbart ist."
 PHASESHIFT_PROJECT: "Eingefrorene Phasenverschiebung"
 PHASESHIFT_PROJECT_DESC: "§Y[phaseshift_planet.GetName]§!, ein Planet im §Y[phaseshift_planet.GetStarName]§!-System wurde dabei beobachtet wie er in einem Drei-Monats-Zyklus zwischen einer §Y$pc_shrouded$§! und einer §Y$pc_gaia$§! wechselt.\n\nUnsere Physiker sollten einen Weg finden können, um den Planeten in einem seiner Zustände einzusperren und ihn so permanent zu einer §Y$pc_gaia$§! zu machen."
 ####################################
