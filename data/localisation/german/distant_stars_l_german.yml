 tech_nanite_flak_batteries: "Naniten-Flak-Batterie"
 tech_nanite_flak_batteries_desc: "Diese Flak-Batterien sind verbesserte Entwürfe der bisherigen Flak-Batterien und der Fluch eines jeden Kampfpiloten. Indem sie mit Naniten gefüllte Kartätschen abschießen, fressen sie sich durch jedes Trägergeschwader."
