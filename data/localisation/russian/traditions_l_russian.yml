 tr_enmity_match_effect: "Если соперник превосходит в военном плане:\n$t$Стоимость строительства кораблей: §G-5%§!\n$t$Скорость строительства кораблей: §G+10%§!\nЕсли соперник превосходит в технологическом плане:\n$t$Содержание исследователя: §G-15%§!\n$t$Скорость строительства научных лабораторий: §G+100%§!\nЕсли соперник превосходит в экономическом плане:\n$t$Продуктивность [GetWorkerPlural_lower]: §G+10%§!"
