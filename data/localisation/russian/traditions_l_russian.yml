 tr_unyielding_fortress_doctrine_machine: "Охранные подпрограммы"
 tr_unyielding_fortress_doctrine_machine_delayed: "Наши алгоритмы никогда не смогут полностью предсказать поведение несинтетических созданий. Мы должны оставаться начеку, чтобы никто не смог застать нас врасплох."
 tr_unyielding_fortress_doctrine_machine_nemesis: "$tr_unyielding_fortress_doctrine_machine$"
 tr_unyielding_fortress_doctrine_machine_nemesis_delayed: "$tr_unyielding_fortress_doctrine_machine_delayed$"
