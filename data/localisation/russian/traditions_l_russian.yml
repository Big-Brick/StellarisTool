 tr_politics_persistent_petitioners: "Настойчивые просители"
 tr_politics_persistent_petitioners_desc: "После принятия резолюции другого государства мы получаем §G+25%§! к £diplo_weight£ дипломатическому весу, пока не будет принята одна из наших резолюций."
