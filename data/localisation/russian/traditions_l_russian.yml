 ap_galactic_wonders: "Галактические чудеса"
 ap_interstellar_dominion: "Межзвездная власть"
 ap_eternal_vigilance: "Вечное бдение"
 ap_eternal_vigilance_desc: "Проявлять слабость значит напрашиваться на атаку. Цена вторжения к нам должна быть настолько высокой, чтобы как можно меньше врагов были готовы ее заплатить."
 ap_eternal_vigilance_tt: "Каждые полгода на орбите §Yкосмической базы§! будет строиться §Yоборонительная платформа§! в соответствии с нашей политикой §YВечного бдения§!вплоть до §Y50%§! вместимости"
 policy_eternal_vigilance_policy: "$ap_eternal_vigilance$"
 policy_eternal_vigilance_policy_desc: "Сила щита определяется тем, кто его держит."
 eternal_vigilance_full_spending: "Полное финансирование"
 eternal_vigilance_full_spending_name: "$eternal_vigilance_full_spending$"
 eternal_vigilance_full_spending_desc: "Необходимо защитить все космические базы. Не жалейте ресурсов.\nАвтоматически строить §Yоборонительные платформы§! вокруг всех §Yкосмических баз§!"
 eternal_vigilance_half_spending: "Частичное финансирование"
 eternal_vigilance_half_spending_name: "$eternal_vigilance_half_spending$"
 eternal_vigilance_half_spending_desc: "Следует поддерживать только наши самые мощные укрепления.\nАвтоматически строить §Yоборонительные платформы§! вокруг §Yбаз-бастионов§!"
 eternal_vigilance_no_spending: "Без финансирования"
 eternal_vigilance_no_spending_name: "$eternal_vigilance_no_spending$"
 eternal_vigilance_no_spending_desc: "Наша оборона не нуждается в дополнительном усилении.\nНе строить §Yоборонительные платформы§! автоматически вокруг каких-либо §Yкосмических баз§!"
 ap_grasp_the_void: "Освоение пустоты"
 ap_grasp_the_void_desc: "Обширные просторы галактики таят безграничные богатства для тех государств, которые знают, как воспользоваться этим пространством."
 ap_engineered_evolution_desc: "Природная эволюция слишком медлительна, поэтому полагаться на природу неэффективно. Почему бы не ускорить наступление будущего нашей расы?"
 ap_the_flesh_is_weak_desc: "Пределы и ограничения наших слабых органических тел просто неприемлемы. Чтобы раскрыть весь свой потенциала, мы будем использовать кибернетические имплантаты."
 ap_synthetic_evolution_desc: "Пора отринуть несовершенные органические сосуды, в которых томится наш разум. Переместив нейронные схемы в синтетические тела, мы перейдем на новую ступень бытия."
 ap_mind_over_matter_desc: "[GetMindOverMatterDesc]"
 ap_mind_over_matter_desc_organic: "Мы используем лишь небольшую часть потенциала нашего мозга. Скрытые псионические способности нашей расы только начинают проявляться у отдельных [GetIndividualNamePlural&gen]."
 ap_mind_over_matter_desc_machine: "Мы используем лишь небольшую часть потенциала наших процессоров. Скрытые псионические способности наших схем только начинают проявляться у отдельных [GetIndividualNamePlural&gen]."
 ap_synthetic_age: "Синтетическая эра"
 ap_synthetic_age_desc: "Век органиков пришел и ушел, будущее галактики принадлежит машинам. Это рассвет эры синтетиков."
 synthetic_age_tooltip: "$access_tradition_tree$ «['tradition_category:tradition_synthetics']»\n$UNLOCKS_AGENDA$ «$council_agenda_agenda_synthetic_age_name$», что добавляет технологии модификации машин в список доступных."
 synthetic_age_tooltip_machine_age: "Начинается инцидент §Y«$situation_transformation$»§!, открывающий деревья традиций «['tradition_category:tradition_modularity']», «['tradition_category:tradition_virtuality']» или «['tradition_category:tradition_nanotech']».$TABBED_NEW_LINE$- $REQUIRES_TRADITION_SLOT$\n$UNLOCKS_AGENDA$ «$council_agenda_agenda_synthetic_age_name$», что добавляет технологии модификации машин в список доступных."
 ap_machine_worlds: "Миры Машин"
 ap_machine_worlds_desc: "Мы сделаем из наших миров зеркальное отражение нас самих, заменив хрупкость биологии на неизменное совершенство металла."
 ap_hive_worlds: "Миры улья"
 ap_hive_worlds_desc: "Мы создадим живые миры, каждый из которых станет такой же частью улья, как и трутни, что их населяют."
 hive_world: "Мир улья"
 ap_shared_destiny: "Общая судьба"
 ap_shared_destiny_desc: "Достигая все новых высот, нельзя забывать о тех, кто верно служил нам. Славное будущее нашего государства всегда имело смысл только если оно разделено с другими."
 ap_shared_destiny_effect: "Наши §Yподданные§! не теряют $r_loyalty_lower$ из-за множества подданных."
 ap_world_shaper_desc: "Процесс тщательного формирования и изменения экосистемы целой планеты в нечто иное не так уж сильно отличается от работы скульптора, лепящего статую из глины."
 ap_master_builders_desc: "Строительство мегасооружения требует беспрецедентного количества ресурсов и планирования. Мы открываем новые горизонты в области макроинженерии."
 ap_imperial_prerogative_desc: "По мере того как наша цивилизация продолжает расти, должно расширяться и ее пульсирующее сердце. Под наше прямое управление перейдет еще больше систем."
 ap_one_vision_desc: "Настоящего единства можно достичь лишь когда у государства и его граждан одни и те же конечные цели. Ведь дом, в котором нет согласия, долго не выстоит."
 ap_consecrated_worlds_desc: "Галактика — это место для множества святынь, и некоторые из них более очевидны, чем другие. Будучи смертными, мы стараемся постичь истинную природу вселенной."
 ap_galactic_force_projection_desc: "Флотилия — это инструмент, посредством которого выражается воля нашего государства. Жить нам или умереть — все зависит от ее мощи."
 ap_defender_of_the_galaxy_desc: "В то время как звездные империи погрязли в мелких склоках, невообразимо могучие зловещие силы готовятся выступить против всей разумной жизни. Кто же нас защитит?"
 ap_galactic_contender_desc: "Угасшие империи цепляются за остатки своих дряхлых цивилизаций, вечно дрожа перед более молодыми и энергичными расами вокруг. Их время давно прошло."
 ap_technological_ascendancy_desc: "Теперь в нашем распоряжении есть технологии, которые всего несколько поколений назад были бы неотличимы от магии. Началась новая эра технологического прогресса."
 ap_mastery_of_nature_desc: "Хотя мы давно подчинили природу родного мира, инопланетные биомы, с которыми мы с тех пор столкнулись, бросают нам новый вызов. И с ними мы тоже справимся."
 ap_voidborn_desc: "Мы адаптировались к постоянной жизни в глубинах космоса, снизив потребности в инфраструктуре и обеспечив больше места в орбитальных поселениях для других нужд."
 ap_voidborn_habitat_effect: "Можно строить улучшенные сооружения для жилья в §Yорбитальных поселениях§!\n— Для £zone£ базовой специализации районов в §Yорбитальных поселениях§! больше не нужны §Yтехнологии§!"
 ap_the_circle_of_life_desc: "Массивное кольцеобразное мегасооружение с искусственными средами обитания, построенное вокруг звезды. Теоретически это вполне выполнимо…"
 ap_galactic_wonders_desc: "Мегасооружения по праву считаются чудом нашего времени. Всего несколько поколений назад проект такого масштаба было невозможно даже вообразить."
 ap_interstellar_dominion_desc: "Звезды манят нас, и мы следуем их зову. Ничто не остановит нас на этом пути."
 ap_colossus: "Проект «Колосс»"
 ap_colossus_desc: "Проект «Колосс» позволит нам вселять ужас и сдерживать противников. Самый грандиозный корабль из тех, что можно вообразить, и оружие, способное уничтожать целые миры."
 ap_enigmatic_engineering: "Загадочные технологии"
 ap_enigmatic_engineering_desc: "Не технологии должны решать проблемы, а язык, который возносит нас над обыденностью. Низшие умы просто не в состоянии понять наши достижения."
 ap_enigmatic_engineering_cloaking: "$ap_enigmatic_engineering$"
 ap_enigmatic_engineering_cloaking_desc: "$ap_enigmatic_engineering_desc$"
 ap_nihilistic_acquisition: "Нигилистическое овладение"
 ap_nihilistic_acquisition_desc: "Понятие самоопределения не может быть нравственным абсолютом. Глобальные цели явно перевешивают индивидуальные проблемы."
 ap_transcendent_learning: "Трансцендентное обучение"
 ap_transcendent_learning_desc: "Наше общество должно сменить подход к обучению, и благодаря новым методам наши самые умные и светлые головы ждут небывалые достижения."
 ap_galactic_wonders_utopia: "$ap_galactic_wonders$"
 ap_galactic_wonders_utopia_desc: "$ap_galactic_wonders_desc$"
 ap_galactic_wonders_megacorp: "$ap_galactic_wonders$"
 ap_galactic_wonders_megacorp_desc: "$ap_galactic_wonders_desc$"
 ap_galactic_wonders_utopia_and_megacorp: "$ap_galactic_wonders$"
 ap_galactic_wonders_utopia_and_megacorp_desc: "$ap_galactic_wonders_desc$"
 ap_grasp_the_void_tech_effect: "§YТехнологии сверхсветовых путешествий§! теперь встречаются в §Y1.5§! раза чаще, чем обычно."
 requires_not_shroudwalker_apprentice: "$TRIGGER_FAIL$Не должно быть происхождения §Y$origin_shroudwalker_apprentice$§!."
 ap_organo_machine_interfacing: "Взаимодействие органик-​машина"
 ap_organo_machine_interfacing_desc: "$ap_the_flesh_is_weak_desc$"
 organo_machine_interfacing_tooltip: "- Открывается дерево традиций §Y$tradition_cybernetics$§!.$TABBED_NEW_LINE$- $REQUIRES_TRADITION_SLOT$\n$UNLOCKS_AGENDA$ $council_agenda_agenda_organo_machine_interfacing_name$, что добавляет технологии кибернетики в список доступных."
 requires_technology_integrated_cybernetics: "$TRIGGER_FAIL$Требуется технология £engineering£ §Y$tech_integrated_cybernetics$§!."
 ap_organo_machine_interfacing_assimilator: "$ap_organo_machine_interfacing$"
 ap_organo_machine_interfacing_assimilator_desc: "Пределы и ограничения, налагаемые на нас нашими создателями, просто неприемлемы. Чтобы достичь полного потенциала, мы должны соединить органику и машину."
 ap_mechromancy: "Мехромантия"
 ap_mechromancy_desc: "Биологические формы жизни — просто еще один вид машин. Мы можем простимулировать соответствующие синапсы и воскресить этих существ в своих интересах."
 ap_mechromancy_tt: "Побежденных органических левиафанов иногда можно воскресить.\nПодвергнутые геноциду разумные биологические и литоидные £pop£ поселения можно с вероятностью 33% возродить в виде зомби-киборгов.\n$reanimator_effect_desc$"
