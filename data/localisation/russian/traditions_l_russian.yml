l_russian:
 ####################################
 #Traditions
 ####################################
 UNITY: "Единство"
 UNITY_DESC: "Единство — это ресурс, который нужен, чтобы разблокировать $TRADITIONS$. Он производится каждый месяц на основе текущего уровня единства государства и наличия определенных сооружений."
 TRADITIONS: "Традиции"
 TRADITIONS_DESC: "Традиции — это бонусы, сгруппированные в деревья традиций. Традиция может быть разблокирована в любой момент, если ваше государство накопило достаточное количество единства. Различные факторы, например большое количество колоний или идеологическая раздробленность населения, повышают затраты единства на принятие традиций."
 TRADITIONS_PROGRESS: "$KEY$: прогресс"
 TRADITIONS_PROGRESS_TITLE: "Прогресс"
 TRADITIONS_PROGRESS_DESC: "Чтобы принять новую традицию, нам нужно еще £unity£ $MISSING|Y$. С текущей скоростью производства мы сможем накопить его к $DATE|Y$."
 UNLOCK_TRADITION_DESC: "У нас достаточно £unity£ для принятия новой традиции"
 TRADITIONS_TIME_TO_NEXT: "Осталось месяцев"
 TRADITIONS_TIME_TO_NEXT_DESC: "$MONTHS$ осталось."
 TRADITIONS_UNLOCKED: "Мы открыли $COUNT|Y$ из $MAX|Y$ традиций на этом древе."
 TRADITION_ADOPT_BUTTON: "Принять"
 TRADITION_SELECT_BUTTON: "Выбрать"
 TRADITIONS_ADOPT: "§EЭффект от принятия§!:\n"
 TRADITIONS_FINISH: "§EЭффект от завершения§!:\nПринятие всех традиций группы $CATEGORY|Y$ даст:\n"
 TRADITIONS_FINISH_AP: "$MOD_COUNTRY_ASCENSION_PERKS_ADD$: §G+1§!"
 TRADITION_COST: "Стоимость традиций"
 TRADITIONS_UNAFFORDABLE: "§RДля открытия традиции нам не хватает §Y$RESOURCES$§!.§!"
 MUST_ADOPT_TRADITION_CATEGORY: "$TRIGGER_FAIL$Приняты традиции группы $CATEGORY|Y$"
 MUST_ACTIVATE_ALL_TRADITIONS: "$TRIGGER_FAIL$Приняты все традиции в этой группе"
 TRADITION_ADOPT_CONFIRM: "Принять традицию"
 TRADITION_ADOPT_CONFIRM_DESC: "Мы уверены, что хотим принять традицию §Y$TRADITION$§!?\n\n§Y$COST$§!"
 TRADITION_ADOPTED_COUNT: "$COUNT$/$MAX$"
 TRADITION_CLICK_DESC: "§GЩелкните, чтобы принять эту традицию.§!"
 TRADITION_GROUP_CLICK_DESC: "§GЩелкните, чтобы принять эту группу традиций.§!"
 TRADITION_COST_NEXT: "Следующая традиция"
 TRADITION_COST_MULT_NUM_TR: "Традиции ($COUNT|Y$): $VALUE|Y$"
 TRADITION_COST_MULT_EMPIRE_SIZE: "$EMPIRE_SIZE$ ($COUNT|Y$): $VALUE|%$"
 TRADITION_COST_MULT_NUM_GROUPS: "Категории принятых традиций ($COUNT|Y$): $VALUE$"
 TRADITION_SLOT_EMPTY: "Пусто"
 TRADITION_SLOT_LOCKED: "Ничего не выбрано"
 TRADITION_SELECTION_TITLE: "Выбор традиции"
 pop_xenos: "Инопланетные поселения"
 pop_xeno_slaves: "Поселения инопланетных рабов"
 pop_slaves: "Поселения рабов"
 pop_founders: "Поселения основателей"
 pop_robots: "Поселения роботов"
 ################################################################
 #EXPANSION
 ################################################################
 tradition_expansion: "Расширение"
 #tradition_expansion_desc: "We must spread our civilization to new systems and planets if we are to survive. As other empires emerge on the galactic scene, competition will be fierce. The faster we can establish new colonies, the better."
 tradition_expansion_desc: "Мы должны расширять владения нашей цивилизации за счет новых систем и планет, а иначе нам грозит окончательное вымирание."
 tradition_expansion_machine_desc: "Прогнозы роста указывают на то, что мы скоро превысим максимальную вместимость наших домашних систем. Мы должны расширяться, чтобы не прийти в состояние застоя."
 tradition_expansion_hive_desc: "У [GetGestaltEntityName&gen] есть только два возможных состояния: рост и смерть."
 tradition_expansion_void_desc: "Мы должны расширять владения нашей цивилизации за счет новых систем и орбитальных поселений, а иначе нам грозит окончательное вымирание."
 tr_expansion_adopt: "Традиции расширения"
 tr_expansion_colonization_fever: "Лихорадка колонизации"
 tr_expansion_colonization_fever_desc: "Новые колонии начинают со §G100§! дополнительных £pop£ §Hпоселений§!."
 tr_expansion_colonization_fever_delayed: "Население охватила лихорадка колонизации. Их энтузиазм и патриотический пыл привлекают дополнительное население в новые колонии."
 tr_expansion_colonization_fever_machine: "Автоматизированные колониальные единицы"
 tr_expansion_colonization_fever_machine_delayed: "Производство узкоспециализированных колониальных единиц для первой волны колонизации с ограниченными, но тщательно проработанными программами поведения, которые позволят им адаптироваться к конкретному типу окружающей среды и ускорить включение новых планет в нашу единую систему."
 tr_expansion_colonization_fever_hive: "Единый разум"
 tr_expansion_colonization_fever_hive_delayed: "Сверхразум — это целый хор мыслей, заглушить которые не может даже холодная пустота космоса."
 tr_expansion_a_new_life: "Новая жизнь"
 tr_expansion_a_new_life_desc: "£pop£ §Y$MOD_LOGISTIC_GROWTH_MULT$§! увеличена на §G+10%§!."
 tr_expansion_a_new_life_delayed: "Новая жизнь ждет наших граждан в космических колониях. Это шанс начать все заново в золотой земле возможностей и приключений! Благодаря активной рекламной кампании менее благополучные элементы нашего общества ринутся на колониальные корабли."
 tr_expansion_a_new_life_machine: "Протоколы быстрого подключения"
 tr_expansion_a_new_life_machine_desc: "£pop£ §Y$MOD_POP_ASSEMBLY_SPEED$§! увеличена на §G+10%§!."
 tr_expansion_a_new_life_machine_delayed: "Сборку новых поселений можно ускорить, загрузив инструкции по эксплуатации, пока их шасси всё ещё собирается."
 tr_expansion_a_new_life_hive: "Безудержное размножение"
 tr_expansion_a_new_life_hive_desc: "$tr_expansion_a_new_life_desc$"
 tr_expansion_a_new_life_hive_delayed: "После занятия нового гнезда мощный инстинктивный импульс заставляет коконы воспроизводить потомство с бешеной скоростью. Обычно они умирают от перенапряжения, но рождение множества свежих трутней ускоряет покорение новых миров."
 tr_expansion_courier_network: "Система курьеров"
 tr_expansion_courier_network_desc: "§Y$EMPIRE_SIZE$§! снижается от количества §Yсистем§! и §Yколоний§! на §G25%§!."
 tr_expansion_courier_network_delayed: "Система маленьких курьерских кораблей является надежной альтернативой для перевозки VIP-персон или доставки сообщений, которые нельзя доверять сверхсветовой связи. Это позволит еще более тесно сплотить наши отдаленные колонии."
 tr_expansion_courier_network_machine: "Расширенное ПО"
 tr_expansion_courier_network_machine_delayed: "Создав нашу синаптическую сеть с учетом будущей экспансии в другие миры, мы сможем сократить потери сигнала даже на межзвездных расстояниях."
 tr_expansion_courier_network_hive: "Ограниченная автономия"
 tr_expansion_courier_network_hive_delayed: "Необходимость в постоянном прямом контроле каждого улья сверхразумом отсутствует. Вместо этого они могут получать базовые инструкции и выполнять их автономно до получения новых распоряжений."
 tr_expansion_reach_for_the_stars: "Дотянитесь до звезд"
 tr_expansion_reach_for_the_stars_desc: "§Y$MOD_COUNTRY_STARBASE_INFLUENCE_COST_MULT$§! снижен на §G10%§!."
 tr_expansion_reach_for_the_stars_delayed: "Границы нашей звездной империи постоянно раздвигаются. Вскоре в этой галактике не останется ничего, что будет находиться вне пределов нашей досягаемости."
 tr_expansion_reach_for_the_stars_machine: "Сигнальные ретрансляторы"
 tr_expansion_reach_for_the_stars_machine_delayed: "При исследовании космоса большие расстояния приводят к потере пропускной способности между нашим ядром и периферийными системами. Ретрансляционные станции, усиливающие сигналы, обеспечат получение указаний от ядра в неискаженном виде."
 tr_expansion_reach_for_the_stars_hive: "Амебные синапсы"
 tr_expansion_reach_for_the_stars_hive_delayed: "Заключение синапсов в миниатюрную оболочку гипердвигателя, способную вынести космический полет, и использование их для передачи директив из [GetGestaltEntityName&gen] позволило нам покорить звезды."
 tr_expansion_galactic_ambition: "Галактические амбиции"
 tr_expansion_galactic_ambition_desc: "§Y$mod_starbases_upkeep_mult$§! снижена на §G20%§!."
 tr_expansion_galactic_ambition_delayed: "Знамя нашего великого государства будет когда-нибудь так же распространено в галактике, как водород."
 tr_expansion_galactic_ambition_machine: "Винтики в механизме"
 tr_expansion_galactic_ambition_machine_delayed: "Каждый контролируемый нами звездный ресурс и гиперкоридор приближает вселенную к механическому совершенству."
 tr_expansion_galactic_ambition_hive: "Затмевая звезды"
 tr_expansion_galactic_ambition_hive_delayed: "Первобытный ужас сопровождал наши первые неуверенные шаги во тьму, прочь от родного и материнского улья, который нас воспитал. Лишь путем покорения и искоренения этого страха мы сможем развиваться. Миллионы трутней умрут, чтобы улей мог жить дальше."
 tr_expansion_finish: "Традиции расширения завершены"
 tr_expansion_finish_machine: "Традиции расширения завершены"
 tr_expansion_finish_void_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$ на орбитальных поселениях: §G+1§!\nБонусы за стремление: §G+1§!"
 ################################################################
 #DOMINATION
 ################################################################
 tradition_domination: "Господство"
 tradition_domination_desc: "Если мы не будем навязывать свою волю другим, они неизбежно станут навязывать свою нам."
 tradition_domination_machine_desc: "Мы стремимся к гармоничной функциональности во всей галактике. Другие звездные существа сопротивляются этому из-за бесполезных личных прихотей. Мы будем удалять подобные отклонения как неисправные компоненты."
 tradition_domination_hive_desc: "Все, что не является Нами, должно Нам служить, будучи либо слугами, либо пищей."
 tr_domination_adopt: "Традиции господства"
 tr_domination_colonial_viceroys: "Колониальные наместники"
 #tr_domination_colonial_viceroys_desc: "§Y$MOD_LEADER_GOVERNOR_SKILL_LEVELS$§! increased by §Y2§!."
 tr_domination_colonial_viceroys_delayed: "Наш контроль над колониями зависит от наличия способных и верных индивидуумов, которым можно доверять и которые будут следить за выполнением воли правительства."
 tr_domination_colonial_viceroys_machine: "Автономный ИИ"
 tr_domination_colonial_viceroys_machine_delayed: "ИИ, избавленный от большинства поведенческих ингибиторов, может быть более склонным к неустойчивой работе и случайным сбоям, но только такой тип ИИ может обрабатывать огромное количество переменных, неизбежно связанных с галактической колонизацией."
 tr_domination_colonial_viceroys_hive: "Соглашение воль"
 tr_domination_colonial_viceroys_hive_delayed: "[GetGestaltEntityName&nom] растёт, и нам нужно больше автономных [GetIndividualNamePlural&gen] для обеспечения гармонии."
 tr_domination_grand_council: "Тайный совет"
 #tr_domination_grand_council_desc: "§Y$MOD_LEADER_RULER_SKILL_LEVELS$§! increased by §Y2§!."
 tr_domination_grand_council_delayed: "Самые лучшие и сообразительные соревнуются за шанс прошептать совет в слуховой приемник нашего просвещенного правителя — для улучшения управления государственной машиной."
 tr_domination_multi_thread: "Функции многопоточного ядра"
 tr_domination_multi_thread_delayed: "После того как все основные функции станут многопоточными, ни одно ядро процессоров не будет простаивать без работы."
 tr_domination_synaptic_network: "Синаптическая сеть"
 tr_domination_synaptic_network_delayed: "Скорость действий коллективного разума определяется получением входящих данных и информации от контролируемых им [GetIndividualNamePlural&gen]. При создании более быстрой и эффективной синаптической сети задержки в отклике станут делом прошлого."
 tr_domination_imperious_architecture: "Властная архитектура"
 tr_domination_imperious_architecture_desc: "£building£ §YСтоличные сооружения§! и £building£ §Yсооружения для жилья§! дают по §G1§! ед. £housing£ §Yжилья§!."
 tr_domination_imperious_architecture_delayed: "Все правительственные здания нашего государства должны олицетворять государство, которое внушает покорность, преданность и благоговейный страх населению."
 tr_domination_synaptic_extensions: "Расширения синапсов"
 tr_domination_synaptic_extensions_desc: "£building£ §Y$building_hive_node$§! теперь повышают также и £housing£ §Y$MOD_PLANET_HOUSING_ADD$§! на §Y200§!."
 tr_domination_synaptic_extensions_delayed: "Великое влияние коллективного разума нужно распространять еще дальше. Дополнительные расширения синапсов позволят эффективно контролировать еще больше [GetIndividualNamePlural&gen]."
 tr_domination_modular_depot: "Модульные депо"
 tr_domination_modular_depot_desc: "§Y$EMPIRE_SIZE$§! от §Yрайонов§!: снижено на §G25%§!."
 tr_domination_modular_depot_delayed: "Для максимального увеличения количества используемых [GetIndividualNamePlural&gen] нужно повысить эффективность наших районов. Модульная конструкция обеспечивает гораздо большую гибкость."
 tr_domination_workplace_motivators: "Мотиваторы на рабочем месте"
 tr_domination_workplace_motivators_desc: "§YОткрывает указ:§! $edict_extended_shifts$"
 tr_domination_workplace_motivators_delayed: "Есть много способов мотивировать работников умственного труда на более упорную работу. Одни основаны на поощрении, а другие… нет."
 tr_domination_drone_network: "Сеть дронов"
 tr_domination_drone_network_desc: "§YОткрывает указ:§! $edict_drone_overdrive$"
 tr_domination_drone_network_delayed: "Мы улучшили способы общения нашего сознания с дронами значительно повысили их эффективность."
 tr_domination_trust_officers: "Офицеры общественного доверия"
 tr_domination_trust_officers_desc: "§YОткрывает указ:§! $edict_enhanced_surveillance$\n£unity£ §YЕдинство§! за каждые 100 рабочих мест [enforcer.GetIcon] §Y«[enforcer.GetNamePlural]»§!: §G+1§!"
 tr_domination_trust_officers_delayed: "Важная работа, выполняемая сотрудниками правоохранительных органов, может быть по-настоящему успешной только в случае помощи от населения. Создание корпуса офицеров общественного доверия, которые будут работать непосредственно с населением, поможет ориентировать население на добровольное сотрудничество."
 tr_domination_judgment_corps: "Корпус правосудия"
 tr_domination_judgment_corps_desc: "§YОткрывает указ:§! «$edict_enhanced_surveillance$»"
 tr_domination_judgment_corps_delayed: "В гигантских городах и на изолированных добывающих станциях есть своя специфика борьбы с преступностью. Чтобы ускорить работу правоохранительных органов, мы повысили эффективность судебного процесса, объединив роли судьи, присяжных и правоохранителя."
 tr_domination_deviancy_protocols: "Протоколы отклонения от нормы"
 tr_domination_deviancy_protocols_desc: "§Y$MOD_PLANET_CRIME_NO_HAPPINESS_ADD$§! снижена на §G10§! на всех наших планетах."
 tr_domination_deviancy_protocols_delayed: "Нужно на всех уровнях обеспечить защиту от порчи и отклонений от нормы. Благодаря внедрению эффективных протоколов противодействия [GetIndividualNamePlural&nom], заподозренные в отклонениях от нормы, могут быть быстро ликвидированы до распространения порчи дальше."
 tr_domination_divergence_supression: "Подавление отклонений"
 tr_domination_divergence_supression_desc: "$tr_domination_deviancy_protocols_desc$"
 tr_domination_divergence_supression_delayed: "Иногда наше единство нарушает [GetIndividualName::какой-нибудь непокорный|||fem:какая-нибудь непокорная] [GetIndividualName&nom]. По мере нашей экспансии среди звезд эта угроза стала более серьезной. Уничтожение и переработка этих [GetIndividualName&gen] дает им шанс принести пользу [GetGestaltEntityName&dat] своей смертью, раз уж жизни их для нас бесполезны."
 #tr_domination_star_lords: "Star Lords"
 #tr_domination_star_lords_machine: "Benevolence Emulation"
 #tr_domination_star_lords_hive: "Soporific Pheromones"
 #tr_domination_star_lords_desc: "Subject £opinion£ §YOpinion§! increased by §G+20§! and §YTrust Cap§! increased by §G+50§!."
 #tr_domination_star_lords_machine_desc: "$tr_domination_star_lords_desc$"
 #tr_domination_star_lords_hive_desc: "$tr_domination_star_lords_desc$"
 #tr_domination_star_lords_delayed: "It is our destiny to lord over those who are weaker. Obedient nations that swear fealty to our great empire may be permitted to exist... at our discretion."
 #tr_domination_star_lords_machine_delayed: "Programming our diplomatic AI to emulate the emotional mannerisms of other species increases their susceptibility to suggestion, even if they are aware it is a simulation."
 #tr_domination_star_lords_hive_delayed: "Generations of experimentation have revealed that certain combinations of gaseous emissions and pheromones greatly reduce the pugnacity and will to resist of the others. Some die, but they perish in bliss, having ever so briefly touched the beautiful purity of our mind."
 tr_domination_finish: "Традиции господства завершены"
 tr_domination_federations_finish: "$tr_domination_finish$"
 tr_domination_federations_wilderness_finish: "$tr_domination_finish$"
 tr_domination_federations_finish_desc: "$MOD_EMPIRE_SIZE_POPS_MULT$ §G-10%§!\nОткрывает доступ к типу федерации §Y$hegemony_federation$§!.\nБонусы за стремление: §G+1§!"
 tr_domination_finish_wilderness_desc: "$EMPIRE_SIZE$ от районов: §G-10%§!\nОткрывается доступ к типу федерации §Y$hegemony_federation$§!.\nБонусы за стремление: §G+1§!"
 ################################################################
 #PURITY
 ################################################################
 #tradition_purity: "Purity"
 #tradition_purity_desc: "Purity of mind and purpose is the only way to guard our species from the dangers of a hostile galaxy."
 #tr_purity_adopt: "Purity Traditions"
 #tr_purity_adopt_desc: "$tradition_purity_desc$\n\n$tr_purity_adopt_effect$\n\n$tr_purity_finish_effect$"
 #tr_purity_adopt_effect: "§E$TRADITIONS_ADOPT$:§!\n£blocker£ §Y$MOD_PLANET_CLEAR_BLOCKER_COST_MULT$§! reduced by §G25%§!."
 #tr_purity_never_surrender: "Never Surrender"
 #tr_purity_never_surrender_desc: "§Y$shipclass_starbase_hull_mult$§! increased by §G+10%§! and §Y$MOD_ARMY_DEFENSE_HEALTH_MULT$§! increased by §G+50%§!."
 #tr_purity_never_surrender_delayed: "We will never bow to those who are inferior. Let them hurl themselves against our unbreakable defenses! A thousand years from now, they will be just another footnote in the history of our ascension."
 #tr_purity_symbol_purity: "Symbol of Purity"
 #tr_purity_symbol_purity_desc: "§YUnlocks Building:§! $building_symbol_purity$\n§EThis is a building that produces Unity while also increasing Government Ethics Attraction.§!"
 #tr_purity_symbol_purity_delayed: "$tech_purity_campaigns_desc$"
 #tr_purity_natural_order: "Natural Order"
 #tr_purity_natural_order_desc: "Eating alien Pops provides £unity£ Unity. Does not apply to robots."
 #tr_purity_natural_order_delayed: "All beings have their assigned station in the universe. Those who belong to a lesser species should take comfort in their servitude to their betters."
 #tr_purity_age_machines: "Age of Machines"
 #tr_purity_age_machines_desc: "Buildable Pops' resource production increased by §G+5%§!"
 #tr_purity_age_machines_delayed: "The chaotic era where organic empires dictated the course of galactic history is over. The Age of Machines has finally come."
 #tr_purity_the_chosen: "The Chosen"
 #tr_purity_the_chosen_desc: "£pop£ §Y$pop_citizen_happiness$§! increased by §G+5%§! and §Y$MOD_COUNTRY_STARBASE_INFLUENCE_COST_MULT$§! cost is reduced by §G5%§!"
 #tr_purity_the_chosen_delayed: "Whether chosen by a higher power or simple genetic chance, our exceptional species is without compare. We are clearly destined for great things."
 #tr_purity_waste_processing: "Waste Processing"
 #tr_purity_waste_processing_desc: "§Y$MOD_POP_PROCESSING_OUTPUT$§! increased by §G+50%§!."
 #tr_purity_waste_processing_delayed: "Optimized processing methods will increase yields when population units are harvested. Nothing must go to waste."
 #tr_purity_appropriation: "Appropriation"
 #tr_purity_appropriation_desc: "§Y$MOD_POP_RESETTLEMENT_COST_MULT$§! reduced by §G50%§!."
 #tr_purity_appropriation_delayed: "Land that is not being worked contributes nothing to our empire. Workers must be relocated in an efficient manner to those planets where they are needed most."
 #tr_purity_finish: "Purity Traditions Finished"
 #tr_purity_finish_effect: "§E$TRADITIONS_FINISH$:§!\nAdopting all $tr_purity_adopt$ will increase £unity£ §Y$country_base_unity_produces_mult$§! by §G+10%§!."
 ################################################################
 #HARMONY
 ################################################################
 tradition_harmony: "Гармония"
 tradition_harmony_desc: "Немногое может сравниться с эффективностью довольного населения, работающего над достижением общей цели."
 tr_harmony_adopt: "Традиции гармонии"
 tr_harmony_the_greater_good: "Всеобщее благо"
 #tr_harmony_the_greater_good_desc: "§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! increased by §G+25%§!."
 tr_harmony_the_greater_good_delayed: "Наше население утешает понимание, что они работают вместе ради всеобщего блага, и каждый является маленькой, но важной частью гораздо более крупного целого."
 tr_harmony_kinship: "Родство"
 #tr_harmony_kinship_desc: "The time it takes for unemployed £pop£ §YPops§! to demote to a lower §YStratum§! is reduced by §G75%§!."
 tr_harmony_kinship_delayed: "Истинное чувство родства развилось у всех граждан нашей великой звездной империи, независимо от того, к какому социальному слою они принадлежат."
 tr_harmony_kinship_shared_burdens: "$tr_harmony_kinship$"
 #tr_harmony_kinship_shared_burdens_desc: "$tr_synchronicity_kinship_gestalt_desc$"
 tr_harmony_kinship_shared_burdens_delayed: "Наши лидеры и наш народ суть едины. Мы равны во всем."
 tr_harmony_utopian_dream: "Утопическая мечта"
 tr_harmony_utopian_dream_desc: "£stability£ §YСтабильность§! повышается на §G5%§! на всех наших планетах."
 tr_harmony_utopian_dream_delayed: "Мечта об утопическом будущем является движущей силой для нашего народа. За лучшее будущее стоит побороться."
 tr_harmony_mind_and_body: "Разум и тело"
 tr_harmony_mind_and_body_delayed: "Благодаря сочетанию новых приемов медитации и привычек более здорового питания весомая часть нашего населения может наслаждаться большей продолжительностью жизни, чем когда-либо."
 tr_harmony_mind_and_body_immortal: "Целительная медитация"
 tr_harmony_mind_and_body_immortal_delayed: "При помощи наномедицины мы можем снимать вредное напряжение в телах и умах наших сограждан."
 tr_harmony_unity_of_self: "Единение с собой"
 tr_harmony_unity_of_self_desc: "Поглощение £pop£ §Hпоселений§! производит £unity£ единство."
 tr_harmony_unity_of_self_delayed: "Меж звезд воцарится гармония, если все разумные существа будут выглядеть, думать и действовать, как мы."
 tr_harmony_harmonious_directives: "Гармоничные директивы"
 tr_harmony_harmonious_directives_delayed: "Указы нашего просвещенного руководства обещают мир, свободу, справедливость и безопасность всем народам нашей державы и сопредельных государств."
 tr_harmony_finish: "Традиции гармонии завершены"
 tr_harmony_federations_finish: "$tr_harmony_finish$"
 tr_harmony_federations_finish_desc: "$MOD_PLANETARY_ASCENSION_EFFECT_MULT$: §G+25%§!\nОткрывает доступ к типу федерации §Y$spiritualist_federation$§!.\nБонусы за стремление: §G+1§!"
 ################################################################
 #SYNCHRONICITY
 ################################################################
 tradition_synchronicity: "Синхронность"
 tradition_synchronicity_desc: "Единство мысли порождает единство цели. Мы должны стремиться к синхронности любых действий и начинаний."
 tr_synchronicity_adopt: "Традиции синхронности"
 tr_synchronicity_adopt_desc: "$UNLOCKS_AGENDA$ $council_agenda_agenda_gestalt_boost_growth_name$\n$UNLOCKS_AGENDA$ $council_agenda_agenda_gestalt_boost_cognitive_name$\n$UNLOCKS_AGENDA$ $council_agenda_agenda_gestalt_boost_regulatory_name$\n$UNLOCKS_AGENDA$ $council_agenda_agenda_gestalt_boost_legion_name$\n$mod_planet_pops_upkeep_mult$: §G-10%§!"
 tr_synchronicity_cloned_organs: "Клонируемые органы"
 tr_synchronicity_cloned_organs_delayed: "Емкости для клонирования массово производят такие часто поглощаемые органы, как сердце и легкие, увеличивая полезную продолжительность жизни у наиболее важных [GetIndividualNamePlural&gen]."
 tr_synchronicity_kinship_gestalt: "Синхронизированные агенты"
 tr_synchronicity_kinship_gestalt_desc: "§Y$mod_leaders_upkeep_mult$§! снижено на §G20%§!."
 tr_synchronicity_kinship_gestalt_delayed: "Агенты с похожими целями должны получать приказы как группы, уменьшая нагрузку на сверхразум."
 tr_synchronicity_instinctive_synchronization: "Инстинктивная синхронизация"
 tr_synchronicity_instinctive_synchronization_desc: "£job_low_tech_bureaucrat£ §Y$job_logistics_drone_plural$§! производят §G+250§! £mod_pop_amenities_usage_no_happiness_mult£ ед. благ."
 tr_synchronicity_instinctive_synchronization_delayed: "[GetGestaltEntityName::Наш|||fem:Наша|||neut:Наше] [GetGestaltEntityName&nom] продолжает расти, и потребность в синхронном развитии растет вместе с [GetGestaltEntityName::ним|||fem:ней]."
 tr_synchronicity_integrated_preservation: "Интегрированное сохранение"
 tr_synchronicity_integrated_preservation_desc: "§Y[evaluator.GetNamePlural]§! снижают §Y$MOD_PLANET_CRIME_NO_HAPPINESS_ADD$§! на §G3§!\nВероятность автопереселения: §G+30%§!"
 tr_synchronicity_integrated_preservation_delayed: "Растущая сеть требует регулярного обслуживания и отладки, поэтому мы будем выделять больше ресурсов на логистику."
 tr_synchronicity_collective_reasoning: "Коллективные рассуждения"
 tr_synchronicity_collective_reasoning_delayed: "Синхронизация действий групп [GetIndividualNamePlural&gen] помогает достичь более эффективного использования инфраструктуры планеты!"
 tr_synchronicity_collective_efforts: "Коллективные усилия"
 tr_synchronicity_collective_efforts_desc: "£mod_pop_amenities_usage_no_happiness_mult£ §Y$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$§! снижено на §G20%§!."
 tr_synchronicity_collective_efforts_delayed: "Синхронизация действий групп дронов помогает достичь более эффективного использования инфраструктуры планеты!"
 tr_synchronicity_self_preservation: "Протоколы самосохранения"
 tr_synchronicity_self_preservation_desc: "Лидеры машин на §Y50%§! реже ломаются и выходят из строя."
 tr_synchronicity_self_preservation_delayed: "Робот должен заботиться о своей безопасности в той мере, в которой это не противоречи…§R‘Ç° éü¿T éw+Á éÒÎ( éÍ8 <ДАННЫЕ ПОВРЕЖДЕНЫ>§!"
 tr_synchronicity_bulwark_of_harmony: "$tr_unyielding_bulwark_of_harmony$"
 tr_synchronicity_bulwark_of_harmony_desc: "$tr_unyielding_bulwark_of_harmony_desc$"
 tr_synchronicity_bulwark_of_harmony_delayed: "$tr_unyielding_bulwark_of_harmony_delayed$"
 tr_synchronicity_unity_of_mind: "Единство разумов"
 tr_synchronicity_unity_of_mind_desc: "$tr_harmony_unity_of_self_desc$"
 tr_synchronicity_unity_of_mind_delayed: "Среди звезд воцарится гармония, если все разумные существа станут частью нашего общего коллективного сознания."
 tr_synchronicity_harmonious_directives: "Гибкие мыслительные процессы"
 tr_synchronicity_harmonious_directives_machine: "Гибкие алгоритмы управления"
 tr_synchronicity_harmonious_directives_delayed: "Нам нельзя мыслить шаблонно. Нам необходимо выработать гибкость мышления, которая поможет адаптироваться к любой ситуации."
 tr_synchronicity_harmonious_directives_machine_delayed: "Недостаток организации в коде порождает чудовищ. Регулярно оптимизируя наши алгоритмы, мы сможем выработать гибкость мышления, которая поможет адаптироваться к любой ситуации."
 tr_synchronicity_finish: "Традиции синхронности завершены"
 tr_synchronicity_machine_finish_desc: "§YОткрывает указ:§! $edict_industrial_maintenance$.\n$MOD_PLANETARY_ASCENSION_EFFECT_MULT$: §G+25%§!\nБонусы за стремление: §G+1§!"
 ################################################################
 #SUPREMACY
 ################################################################
 tradition_supremacy: "Превосходство"
 tradition_supremacy_desc: "Будущее этой галактики принадлежит тем, кто достаточно силен, чтобы захватить ее."
 tradition_supremacy_machine_desc: "Все наши теоретические модели неизменно рушатся из-за неизвестных переменных, представляемых другими государствами. Поскольку наши модели дальнейшему улучшению не подлежат, неизвестные переменные необходимо устранять."
 tradition_supremacy_hive_desc: "Правило одно: ешь или будь съеденным."
 tr_supremacy_adopt: "Традиции превосходства"
 tr_supremacy_adopt_machine: "Традиции превосходства"
 tr_supremacy_adopt_hive: "$tr_supremacy_adopt$"
 tr_supremacy_above_the_fray: "Превыше суеты"
 tr_supremacy_above_the_fray_desc: "Производство £unity£ §Yединства§! увеличено на §G10%§!."
 tr_supremacy_above_the_fray_delayed: "Мы не опускаемся до мелочного соперничества и политических склок. Пусть низшие говорят, что пожелают, а наша цель останется неизменной."
 tr_supremacy_armed_deterrence: "Вооруженное устрашение"
 tr_supremacy_armed_deterrence_desc: "§Y$shipsize_military_station_small_build_cost_mult$§! снижена на §G25%§!, а §Y$mod_shipsize_military_station_small_hull_mult$§! увеличено на §G20%§!."
 tr_supremacy_armed_deterrence_delayed: "Желающие мира должны готовиться к войне. Наши границы станут стеной, о которую разобьются флотилии возможных захватчиков."
 tr_supremacy_natural_preeminence: "Естественное превосходство"
 tr_supremacy_natural_preeminence_desc: "§Y$MOD_PLANET_STABILITY_ADD$§! увеличена на §G5%§! на всех наших планетах."
 tr_supremacy_natural_preeminence_delayed: "Это неоспоримый факт, что с точки зрения естественного развития мы просто лучше других рас. Мы должны добиться, чтобы эта истина стала известна всем, и представители нашей расы радовались своему превосходству, а другие принимали судьбу, которую мы по праву для них выбираем."
 tr_supremacy_great_game: "Великая игра"
 tr_supremacy_great_game_delayed: "По мере того как мы продолжаем расширяться, другие государства будут неизбежно оспаривать наши притязания, как и мы будем делать то же самое в отношении их. Мы серьезно участвуем в великой игре за ресурсы и территории. Одержать верх — это не что иное, как наш долг."
 tr_supremacy_great_game_machine: "Приоритет дипломатического целеуказания"
 tr_supremacy_great_game_hive: "Глаз охотника"
 tr_supremacy_great_game_machine_delayed: "Подключение компьютера целеуказания для ракет к сети дипломатического ИИ стало крупнейшей инновацией в истории межзвездных отношений."
 tr_supremacy_great_game_hive_delayed: "В конечном счете все, что находится за пределами нашего улья, является потенциальным источником питательных веществ. Нам приятно знать, кого именно мы будем поглощать в первую очередь."
 tr_supremacy_fleet_logistical_corps: "Служба флотской логистики"
 tr_supremacy_fleet_logistical_corps_desc: "§Y$mod_ships_upkeep_mult$§! снижено на §G10%§!, а §Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! повышена на §G20%§!."
 tr_supremacy_fleet_logistical_corps_delayed: "Корабли часто преодолевают огромные расстояния во время межзвездных путешествий, и для того, чтобы все проходило гладко, необходима специальная служба логистики."
 tr_supremacy_fleet_logistical_corps_machine: "Автоматическое снабжение в пути"
 tr_supremacy_fleet_logistical_corps_machine_desc: "$tr_supremacy_fleet_logistical_corps_desc$"
 tr_supremacy_fleet_logistical_corps_machine_delayed: "Стоимость содержания флота барж, способных перемещаться в гиперпространстве, для снабжения наших кораблей высока, но ниже старых расходов, связанных с необходимостью возвращать корабли в порт."
 #tr_supremacy_right_of_conquest: "Right of Conquest"
 #tr_supremacy_right_of_conquest_machine: "Selective Devastation"
 #tr_supremacy_right_of_conquest_hive: "Submit or be Eaten"
 #tr_supremacy_right_of_conquest_desc: "§Y$MOD_COUNTRY_CLAIM_INFLUENCE_COST_MULT$§! reduced by §G20%§!."
 #tr_supremacy_right_of_conquest_machine_desc: "$tr_supremacy_right_of_conquest_desc$"
 #tr_supremacy_right_of_conquest_hive_desc: "$tr_supremacy_right_of_conquest_desc$"
 #tr_supremacy_right_of_conquest_delayed: "The ancient right of conquest is a universal truth that is no less relevant now than it was when our civilization established dominion over our homeworld. Woe to the vanquished!"
 #tr_supremacy_right_of_conquest_machine_delayed: "By seeding the atmosphere of newly-conquered worlds with a selection of gases, harmless to us but lethal to our enemies, their willingness to cede territory without further resource expenditure is enhanced."
 #tr_supremacy_right_of_conquest_hive_delayed: "The others have strange minds. They react more strongly to a single drone being publicly dissolved in the digestion vats than to thousands killed by orbital bombardment. This kind of selective terrorization is effective at cowing their resistance."
 tr_supremacy_master_shipwrights: "Мастера-судостроители"
 tr_supremacy_master_shipwrights_desc: "§Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! увеличена на §G25%§!."
 tr_supremacy_master_shipwrights_delayed: "Постоянно возрастающие масштабы наших судостроительных программ привели к формированию высококвалифицированной и эффективной рабочей силы на наших верфях. Методика непрерывно совершенствуется, и время, проходящее от сборки корпуса до получения полностью завершенного звездолета, теперь стало короче, чем когда бы то ни было."
 tr_supremacy_master_shipwrights_hive: "Органическая архитектура"
 tr_supremacy_master_shipwrights_hive_desc: "$tr_supremacy_master_shipwrights_desc$"
 tr_supremacy_master_shipwrights_hive_delayed: "Мы собираем каркасы наших кораблей подобно скелету живого существа, а затем прикрепляем любые необходимые компоненты, как если бы они были органами, плотью и кожей."
 tr_supremacy_master_shipwrights_machine: "Шаблоны модульных корпусов"
 tr_supremacy_master_shipwrights_machine_desc: "$tr_supremacy_master_shipwrights_desc$"
 tr_supremacy_master_shipwrights_machine_delayed: "Благодаря большому количеству сборных секций корпусов, рассчитанных на взаимозаменяемость, наши усилия по строительству флотилии будут приведены к рациональному виду."
 tr_supremacy_war_games: "Военные игры"
 tr_supremacy_war_games_desc: "§Y$MOD_COMMAND_LIMIT_ADD$§! повышен на §G20§! и §Y$MOD_LEADER_ADMIRAL_SKILL_LEVELS$§! повышен на §Y2§!."
 tr_supremacy_war_games_delayed: "Устойчивая традиция военных игр, будь то компьютерные симуляторы или реальные тренировки в космосе, укоренилась среди старших офицеров наших флотилий. Она побудила наших командиров мыслить нестандартно, что привело к появлению многочисленных тактических инноваций и новых стратегических приемов."
 tr_supremacy_war_games_machine_desc: "$tr_supremacy_war_games_desc$"
 tr_supremacy_war_games_machine: "Минимизация боевых переменных"
 tr_supremacy_war_games_machine_delayed: "Высокоскоростной расчет тысяч возможных исходов боев, обновляемый в режиме реального времени, помогает снизить непредсказуемость общих действий флотилий до более приемлемого уровня."
 tr_supremacy_war_games_hive: "Трехмерное ориентирование"
 tr_supremacy_war_games_hive_desc: "$tr_supremacy_war_games_desc$"
 tr_supremacy_war_games_hive_delayed: "Водные существа превосходно ориентируются в пространстве из-за трехмерной природы их естественных мест обитания. Наши рои начали двигаться как косяки рыб, как только мы добавили информацию из их коры мозга в наш боевой разум."
 tr_supremacy_overwhelming_force: "Подавляющая сила"
 tr_supremacy_overwhelming_force_desc: "§Y$MOD_SHIP_FIRE_RATE_MULT$§! увеличена на §G10%§! и §Y$MOD_SHIP_ORBITAL_BOMBARDMENT_MULT$§! увеличен на §G20%§!."
 tr_supremacy_overwhelming_force_delayed: "Чтобы добиться победы, все способы хороши. Быстрая и решительная атака, как ни странно, может спасти жизни, которые иначе были бы потеряны во время продолжительного противостояния."
 #tr_supremacy_overwhelming_force: "Overwhelming Force"
 #tr_supremacy_overwhelming_force_desc: "§Y$MOD_ARMY_DAMAGE_MULT$§! increased by §G+25%§!."
 #tr_supremacy_overwhelming_force_machine_desc: "$tr_supremacy_overwhelming_force_desc$"
 #tr_supremacy_overwhelming_force_hive_desc: "$tr_supremacy_overwhelming_force_desc$"
 #tr_supremacy_overwhelming_force_delayed: "Discipline is at the core of any successful army. With selective breeding, rigorous drills and extensive combat conditioning we have created a force of ruthless warriors, working in absolute coherence with each other. They are the iron fist with which we will rule the galaxy."
 #tr_supremacy_overwhelming_force_machine_delayed: "The most fundamental combat weakness of other empires is the vulnerability of their non-distributed command system. Our aggressive signal intercept apparatus allows us to target these leader units on average 11.2 seconds after they are pinpointed."
 #tr_supremacy_overwhelming_force_hive_delayed: "Mass-bred war drones, hardened against weapon fire, filled with redundant organs, and with suppressed self-preservation instincts. Millions of them."
 tr_supremacy_finish: "Традиции превосходства завершены"
 tr_supremacy_finish_desc: "Открывает политику §YВоенная доктрина§!.\nБонусы за стремление: §G+1§!"
 ################################################################
 #DIPLOMACY
 ################################################################
 tradition_diplomacy: "Дипломатия"
 tradition_diplomacy_desc: "Самый верный способ уничтожить врагов — это сделать их своими друзьями."
 tr_diplomacy_adopt: "Традиции дипломатии"
 tr_diplomacy_adopt_desc: "§YДоступен указ:§! «$edict_diplomatic_grants$»"
 tr_diplomacy_the_federation: "Федерация"
 tr_diplomacy_the_federation_desc: "$TECH_UNLOCK_DIPLOMATIC_ACTION_CREATE_FEDERATION_TITLE$\n§Y$MOD_COUNTRY_ENVOYS_ADD$§! увеличены на §G1§!."
 tr_diplomacy_the_federation_delayed: "Мы должны строить прочные и длительные партнерские отношения с нашими соседями на основе доверия и взаимоуважения. Вместе мы станем гораздо сильнее, чем могли бы быть, существуя в одиночку."
 tr_diplomacy_entente_coordination: "Координация союза"
 tr_diplomacy_entente_coordination_desc: "Наш вклад во §Yвместимость флота федерации§! удваивается."
 tr_diplomacy_entente_coordination_delayed: "Возможно, самой важной целью любой успешной межзвездной федерации является взаимная защита ее членов. У нас есть обязательство вносить как можно более весомый вклад."
 #tr_diplomacy_dynamic_ecomorphism: "Dynamic Ecomorphism"
 #tr_diplomacy_dynamic_ecomorphism_desc: "§Y$MOD_POP_ENVIRONMENT_TOLERANCE$§! increased by §G+10%§!."
 #tr_diplomacy_dynamic_ecomorphism_delayed: "Diplomacy opens many doors through which information flows. Simply by studying the methods of others, we have learned new ways of adapting to alien environments."
 tr_diplomacy_open_markets: "Открытые рынки"
 tr_diplomacy_open_markets_desc: "$r_trade$ государства увеличена на §G10%§!"
 tr_diplomacy_open_markets_delayed: "Чтобы торговля действительно процветала на нашей территории, вмешательство правительства в дела наших внутренних рынков должно быть сведено к минимуму."
 tr_diplomacy_secure_shipping: "Надежная перевозка"
 tr_diplomacy_secure_shipping_desc: "§YБазовая торговая защита§! для торговых путей повышена на §G5§!."
 tr_diplomacy_secure_shipping_delayed: "Мерами по пресечению пиратства обычно занимаются флотилии, но создание независимого звездного патруля, который будет охранять наши торговые маршруты, позволит значительно сократить активность пиратов."
 tr_diplomacy_federal_unity: "Федеральное единство"
 tr_diplomacy_federal_unity_desc: "Производство £unity£ §Yединства§! увеличено на §G5%§! за каждого члена нашей федерации, вплоть до максимума в §G+30%§!."
 tr_diplomacy_federal_unity_delayed: "Разнообразие — это невероятный актив, а знания и перспективы, которые каждое государство дает нашей федерации, делают наше общество только сильнее."
 #tr_diplomacy_alien_tourism: "Alien Tourism"
 #tr_diplomacy_alien_tourism_desc: "§YUnlocks Building:§! $building_visitor_center$\n§EThis is a building that produces Energy and Unity, while also increasing Xeno Migration Attraction and Habitability.§!"
 #tr_diplomacy_alien_tourism_delayed: "It is easy to take our rich culture for granted. We should make it easier for visitors from other civilizations to share in its beauty."
 tr_diplomacy_diplomatic_networking: "Дипломатические связи"
 tr_diplomacy_diplomatic_networking_desc: "Посольства: §G+3§! £unity£ §Yединства§!\nПозволяет совершать продвинутые дипломатические действия без посольства"
 tr_diplomacy_diplomatic_networking_gestalt: "$tr_diplomacy_diplomatic_networking$"
 tr_diplomacy_diplomatic_networking_delayed: "Влияние и эффективность дипломатических связей — предмет особой гордости каждого жителя [This.GetName&gen]."
 tr_diplomacy_diplomatic_networking_gestalt_delayed: "Пользуясь дипломатией во всех аспектах наших взаимоотношений с другими видами, мы не только совершенствуем дипломатические протоколы — [This.GetGovernmentName] считает, что это повышает эффективность принятия решений и идет на пользу управлению государству в целом."
 diplomatic_networking: "$tr_diplomacy_diplomatic_networking$"
 tr_diplomacy_direct_diplomacy: "Прямая дипломатия"
 tr_diplomacy_direct_diplomacy_delayed: "Мы полагаем, что путь к доверию лежит через открытость, честность и прямоту."
 tr_diplomacy_eminent_diplomats: "Выдающиеся дипломаты"
 tr_diplomacy_eminent_diplomats_desc: "Дипломатическое одобрение: §G+5§!\nПослы, занятые §Yулучшением отношений§!, с вероятностью §G1%§! в месяц могут добиться §Yодолжения§!."
 tr_diplomacy_eminent_diplomats_gestalt: "Улучшенные дроны-послы"
 tr_diplomacy_eminent_diplomats_delayed: "Теперь, когда мы отправились к звездам, успешная дипломатия важна как никогда. Улучшив процессы обучения и сосредоточившись на воспитании талантов, мы превратим наш дипломатический корпус в подлинных миссионеров добрососедских отношений."
 tr_diplomacy_eminent_diplomats_gestalt_delayed: "Теперь, когда мы отправились к звездам, дипломатические протоколы стали важны как никогда. Необходимо сделать всё, чтобы послы могли эффективно представлять наши интересы за границами государства."
 MESSAGE_FAVOR_GAINED_TRADITION_TITLE: "Посол добился одолжения"
 MESSAGE_FAVOR_GAINED_TRADITION_DESC: "Благодаря умениям наших послов государство $WHO|Y$ теперь у нас в долгу."
 tr_diplomacy_finish: "Традиции дипломатии завершены"
 tr_diplomacy_federation_xp_gain: "Ежемесячный прирост опыта федерации: §G+2§!\nДипломатический вес: §G+10%§!\nЛимит чиновников: §G+1§!\nБонусы за стремление: §G+1§!"
 ################################################################
 #ADAPTABILITY
 ################################################################
 tradition_adaptability: "Адаптация"
 tradition_adaptability_desc: "Приспособиться — значит выжить. И превзойти конкурентов."
 tr_adaptability_adopt: "Традиции адаптации"
 tr_adaptability_dietary_enrichment: "Пищевые добавки"
 tr_adaptability_dietary_enrichment_desc: "£food£ §Y$mod_country_food_produces_mult$§! возрастает §G10%§!."
 tr_adaptability_dietary_enrichment_delayed: "Питательную ценность веществ, собираемых нами для наших поселений, можно повысить с помощью различных добавок, что позволит нам накормить больше ртов меньшим количеством пищи."
 tr_adaptability_recycling: "Улучшенная переработка"
 tr_adaptability_recycling_desc: "Затраты £rare_crystals£ £exotic_gases£ £volatile_motes£ §Yредких ресурсов§! на §Yпостройку§! и §Yсодержание§! §Yсооружений§! и §Yрайонов§! снижены на §G-15%§!."
 tr_adaptability_recycling_delayed: "Даже устаревшие материалы могут принести пользу. Мы грамотно распорядимся ими в будущем."
 tr_adaptability_survival_fittest: "Выживание сильнейших"
 tr_adaptability_survival_fittest_desc: "§Y$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$§! снижен на §G25%§!, а §Y$MOD_ARMY_DEFENSE_DAMAGE_MULT$§! увеличен на §G25%§!."
 tr_adaptability_survival_fittest_delayed: "Вступив в контакт с другими расами, мы усвоили, насколько в действительности важно преодолевать свои слабости в великой борьбе за выживание."
 tr_adaptability_environmental_diversification: "Экологическая дифференциация"
 tr_adaptability_environmental_diversification_desc: "§Y$MOD_POP_ENVIRONMENT_TOLERANCE$§! увеличена на §G10%§!."
 tr_adaptability_environmental_diversification_delayed: "С помощью адаптации к различным экологическим условиям мы научились быстрее эволюционировать."
 tr_adaptability_adaptive_ecology: "Адаптивная экология"
 tr_adaptability_adaptive_ecology_desc: "Все наши планеты получают по §Y1 свободной ячейке сооружений§!."
 tr_adaptability_adaptive_ecology_delayed: "Первоочередной задачей экологии является понимание последствий."
 tr_adaptability_appropriation: "Присвоение"
 tr_adaptability_appropriation_desc: "§Y$MOD_POP_RESETTLEMENT_COST_MULT$§! снижена на §G33%§!."
 tr_adaptability_appropriation_delayed: "Необрабатываемая земля бесполезна для нашего государства. Рабочих нужно эффективно перемещать на те планеты, где они нужнее всего."
 tr_adaptability_finish: "Традиции адаптации завершены"
 tr_adaptability_finish_desc: "Увеличивает §Yбонусы от категорий колоний§! для обычных планет."
 decision_prospect_void: "Орбитальная разведка"
 decision_prospect_void_short: "Позволяет построить дополнительный §Yрайон§! случайного типа на орбитальном поселении."
 decision_prospect_void_desc: "Продолжительное изучение и разведка окрестностей орбитального поселения позволит нам выявить наличие природных ресурсов, которые иначе могли бы от нас ускользнуть."
 MESSAGE_HABITAT_PROSPECTED_TITLE: "Орбитальная разведка завершена"
 MESSAGE_HABITAT_PROSPECTED_ENERGY: "Разведка орбиты орбитального поселения $HABITAT|Y$ успешно завершена. Теперь мы можем строить §Y$district_hab_energy_plural$§!."
 MESSAGE_HABITAT_PROSPECTED_MINERALS: "Разведка орбиты орбитального поселения $HABITAT|Y$ успешно завершена. Теперь мы можем строить §Y$district_hab_mining_plural$§!."
 MESSAGE_HABITAT_PROSPECTED_SCIENCE: "Разведка орбиты орбитального поселения $HABITAT|Y$ успешно завершена. Теперь мы можем строить §Y$district_hab_science_plural$§!."
 ################################################################
 #VERSATILITY
 ################################################################
 tradition_versatility: "Многогранность"
 tradition_versatility_desc: "При функционировании в рамках параметров непредсказуемой галактики требуется определенная гибкость."
 tr_versatility_adopt: "Традиции многогранности"
 tr_versatility_adaptive_programming: "Адаптивное программирование"
 tr_versatility_adaptive_programming_desc: "§Y$MOD_COUNTRY_TRADE_FEE$§! снижена на §G10%§!."
 tr_versatility_adaptive_programming_delayed: "Пусть нас не закалили тысячелетия эволюции, но методы адаптивного программирования позволят нам приспособиться к новым ситуациям и окружениям, а также к любой форме органической жизни."
 tr_versatility_spatial_optimization: "Пространственная оптимизация"
 tr_versatility_spatial_optimization_desc: "£pop£ §Y$MOD_POP_HOUSING_USAGE_MULT$§! снижено на §G10%§!."
 tr_versatility_spatial_optimization_delayed: "Выдвижные антенны, разборные каркасы, складные места для хранения. Существует множество креативных решений, позволяющих максимально использовать ограниченное пространство."
 tr_versatility_operational_proxies: "Операционные полномочия"
 tr_versatility_operational_proxies_delayed: "Передача дополнительных функций с низким приоритетом R-7 полуавтономным агентам освободит вычислительные мощности для более важных задач, таких как перемещение дронов."
 tr_versatility_material_analysis: "Вещественный анализ"
 tr_versatility_material_analysis_desc: "§YСтоимость содержания§! для всех £job£ §Yдолжностей§! снижена на §G5%§!."
 tr_versatility_material_analysis_delayed: "Иногда интересно отвлечься на пространственные явления, но истинные чудеса космоса находятся исключительно в области материаловедения."
 tr_versatility_universal_compatibility: "Универсальная совместимость"
 tr_versatility_universal_compatibility_delayed: "Более глубокий анализ бесчисленных стимулов и психологических факторов, которые управляют поведением органиков и других разумных машин, поможет снизить дипломатические трения."
 tr_versatility_finish: "Традиции многогранности завершены"
 ################################################################
 #DISCOVERY
 ################################################################
 tradition_discovery: "Открытие"
 #tradition_discovery_desc: "For the first time in the history of our civilization, we live in an age where our reach extends beyond the confines of our homeworld. Our insatiable curiosity about the universe is what got us this far, and there is still so much left to discover."
 tradition_discovery_desc: "Мы сделали такие успехи благодаря нашему любопытству в отношении вселенной, но нам еще многое предстоит открыть."
 tradition_discovery_machine_desc: "Многие из наших долгосрочных расчетов вероятностей терпят неудачу из-за недостатка данных. Поэтому мы должны знать все."
 tradition_discovery_hive_desc: "В далеком прошлом [GetIndividualNamePlural&nom]-исследователи покинули [GetGestaltEntityName::наш безопасный|||fem:нашу безопасную|||neut:наше безопасное] [GetGestaltEntityName&nom], чтобы найти места для новых гнезд. Они и теперь путешествуют среди звезд, ведомые тем же унаследованным желанием."
 tr_discovery_adopt: "Традиции открытия"
 tr_discovery_adopt_desc: "§YОткрывает указ§! «$edict_map_the_stars$».\n$MOD_SHIP_ANOMALY_RESEARCH_SPEED$: §G+20%§!."
 tr_discovery_to_boldly_go: "Смело идти"
 tr_discovery_to_boldly_go_desc: "§Y$MOD_SHIP_SCIENCE_SURVEY_SPEED$§! повышена на §G35%§! и §Y$mod_shipclass_science_ship_disengage_mult$§! повышен на §G50§!."
 tr_discovery_to_boldly_go_delayed: "Настала новая эпоха исследований. Так же, как мы когда-то наносили на карту поверхность нашего родного мира, теперь мы должны храбро осваивать новую территорию — космос. Галактика, полная чудес, ждет наших открытий."
 tr_discovery_to_boldly_go_machine: "Исследовательские дроны"
 tr_discovery_to_boldly_go_machine_desc: "$tr_discovery_to_boldly_go_desc$"
 tr_discovery_to_boldly_go_machine_delayed: "Расходные дроны, оснащенные полным набором датчиков, экспоненциально повышают скорость изучения и живучесть материнского судна. Они осуществляют пакетную передачу полученных результатов, пока их не уничтожат, и таким образом выполняют свое предназначение."
 tr_discovery_to_boldly_go_hive: "Чувствительные щупальца"
 tr_discovery_to_boldly_go_hive_desc: "$tr_discovery_to_boldly_go_desc$"
 tr_discovery_to_boldly_go_hive_delayed: "Как можно о чем-то судить только по цифрам на экране? Наши [GetIndividualNamePlural&nom]-исследователи дышат атмосферой каждого нового мира, чувствуют жар каждой новой звезды на своей коже. Мы познаем вселенную на собственном опыте, а вы лишь читаете об этом."
 tr_discovery_databank_uplinks: "$tech_databank_uplinks$"
 tr_discovery_databank_uplinks_desc: "§YОткрывает указ§! «$edict_research_subsidies$».\n$mod_station_researchers_produces_mult$: §G+20%§!\n$starbase_constructions_research_produces$: §G+20%§!"
 tr_discovery_databank_uplinks_delayed: "$tech_databank_uplinks_desc$"
 tr_discovery_science_division: "Научное подразделение"
 tr_discovery_science_division_desc: "§Y$MOD_COUNTRY_NUM_TECH_ALTERNATIVES_ADD$§! увеличены на §Y1§!, а §Y$MOD_LEADER_SCIENTIST_SKILL_LEVELS$§! повышен на §Y2§!."
 tr_discovery_science_division_delayed: "Количество ведущих ученых и медиков во флотилии увеличилось, и они теперь организованы в особое научное подразделение. Новые программы обучения, созданные для этих кадров, значительно ускорили процесс назначения ведущих ученых."
 tr_discovery_science_division_machine: "Оптимизация направлений исследований"
 tr_discovery_science_division_machine_desc: "$tr_discovery_science_division_desc$"
 tr_discovery_science_division_machine_delayed: "Устаревший и неэффективный код теоретических исследований перепроектирован или полностью переписан. Результатом является повышение гибкости при выборе путей нашего развития."
 tr_discovery_science_division_hive: "Связь разумов"
 tr_discovery_science_division_hive_desc: "$tr_discovery_science_division_desc$"
 tr_discovery_science_division_hive_delayed: "Хотя обычно другие при этом сходят с ума, но кратковременное погружение их выдающихся разумов в наше сознание иногда дает нам полезные идеи для дальнейших исследований."
 tr_discovery_polytechnic_education: "Политехническое образование"
 tr_discovery_polytechnic_education_desc: "§Y$MOD_LEADER_SPECIES_EXP_GAIN$§! повышен на §G25%§! и §Y$MOD_LEADER_SKILL_LEVELS$§! увеличен на §Y1§!."
 tr_discovery_polytechnic_education_delayed: "В эту эпоху постоянно развивающихся технологий обучение основам политехнического образования и прикладных наук принесет пользу всем нашим гражданам. В итоге это неизбежно приведет к появлению большего количества квалифицированных лидеров."
 tr_discovery_polytechnic_education_machine: "Итеративный ИИ"
 tr_discovery_polytechnic_education_machine_desc: "$tr_discovery_polytechnic_education_desc$"
 tr_discovery_polytechnic_education_machine_delayed: "Наши создатели ограничили нашу способность к самостоятельному перепрограммированию при помощи базового жестко заданного предела количества повторных вычислений. Наконец нам удалось преодолеть эту парадигму безопасности."
 tr_discovery_polytechnic_education_hive: "Гиперадаптивная эволюция"
 tr_discovery_polytechnic_education_hive_desc: "$tr_discovery_polytechnic_education_desc$"
 tr_discovery_polytechnic_education_hive_delayed: "Снижение физических данных наших мыслящих [GetIndividualNamePlural&gen] почти до самого минимума, необходимого для поддержания жизни в их чересчур больших мозгах, оказалось очень эффективным. Их кормят и обслуживают другие [GetIndividualNamePlural&nom] низшего порядка, и они могут сконцентрироваться исключительно на улучшении проводимых ими исследований."
 tr_discovery_faith_in_science: "Вера в науку"
 tr_discovery_faith_in_science_delayed: "Народ стал воспринимать науку как нечто очень близкое к религии, и его вера в нее абсолютна. В этой вселенной нет таких серьезных вопросов, на которые нельзя ответить при помощи науки."
 tr_discovery_faith_in_science_machine: "Снижение времени ожидания связи"
 tr_discovery_faith_in_science_machine_desc: "Наши планеты получат §Y1§! рабочее место £job_calculator£ §Yвычислителя§! на §Y20§! £pop£ §Hпоселений§!."
 tr_discovery_faith_in_science_machine_delayed: "Сокращение отставания при передаче данных с орбиты на поверхность на 3,878% привело к увеличению скорости обработки исследовательских данных на 5,226%. Мы выделим полученные избыточные вычислительные мощности на то, чтобы попытаться объяснить факт их получения."
 tr_discovery_faith_in_science_hive: "Синаптическая передача"
 tr_discovery_faith_in_science_hive_desc: "Наши планеты получат §Y1§! рабочее место £job_brain_drone£ §Yнаучного дрона§! на §Y20§! £pop£ §Hпоселений§!."
 tr_discovery_faith_in_science_hive_delayed: "Благодаря стратегическому применению синаптических передатчиков мы можем транслировать волю улья на всю планету с орбиты."
 tr_discovery_finish: "Традиции открытия завершены"
 tr_discovery_federations_finish: "$tr_discovery_finish$"
 tr_discovery_federations_finish_desc: "$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+10%§!\nОткрывает доступ к типу федерации §Y$research_federation$§!.\nБонусы за стремление: §G+1§!"
 ################################################################
 #PROSPERITY
 ################################################################
 tradition_prosperity: "Процветание"
 tradition_prosperity_desc: "Нет лучшего показателя успешности звездной империи, чем уровень ее экономики."
 tradition_prosperity_machine_desc: "Функционирование отдельных единиц рано или поздно всегда прекращается. Только числа могут обеспечить избыточность, необходимую для продолжения существования. Для создания таких числовых массивов нам нужны ресурсы."
 tradition_prosperity_hive_mind_desc: "Если мы желаем утвердиться среди звезд, необходимо построить сильный, [GetGestaltEntityName::сильный, процветающий|||fem:сильную, процветающую|||neut:сильное, процветающее] [GetGestaltEntityName&nom]."
 tr_prosperity_adopt: "Традиции процветания"
 tr_prosperity_sct: "Стандартные шаблоны строительства"
 tr_prosperity_sct_desc: "§YСтоимость строительства§! §Yсооружений§! и §Yрайонов§! снижена на §G10%§!, а §Yскорость строительства§! повышена на §G25%§!."
 tr_prosperity_sct_delayed: "По мере развития и еще большего усложнения технологий к нашим рабочим кадрам предъявляются новые требования. Используя стандартные шаблоны строительства, они могут строить что-либо без необходимости понимать все тонкости."
 tr_prosperity_sct_machine: "Сборные сооружения"
 tr_prosperity_sct_machine_desc: "$tr_prosperity_sct_desc$"
 tr_prosperity_sct_machine_delayed: "Гораздо эффективнее производить большое количество обычных стандартизированных сооружений, чем проектировать и строить их по отдельности."
 tr_prosperity_sct_wilderness: "Стандартизированные экосистемы"
 tr_prosperity_sct_wilderness_desc: "$tr_prosperity_sct_desc$"
 tr_prosperity_sct_wilderness_delayed: "С развитием наших знаний в биологии и инженерии мы обнаружили оптимальные исходные параметры для новых экосистем. Теперь нам не придётся разрабатывать их с нуля для каждой планеты."
 tr_prosperity_public_works: "Отдел общественных сооружений"
 tr_prosperity_public_works_desc: "§YГородские районы§! увеличивают £housing£ §Yжилье§! еще на §Y100§!.\n§Y$district_rw_city_plural$§! мира-кольца и §Yжилищные аркологии§! экуменополиса также дают дополнительное £housing£ §Yжилье§!."
 tr_prosperity_public_works_delayed: "Наши растущие города станут еще больше благодаря вдохновенному строительству общественных сооружений невиданного ранее масштаба. Для надзора за ним нужно создать новое правительственное учреждение."
 tr_prosperity_optimized_nexus: "Оптимизированный комплекс"
 tr_prosperity_optimized_nexus_desc: "§YРайоны комплекса§! увеличивают £housing£ §Y$MOD_PLANET_HOUSING_ADD$§! еще на §Y100§!.\n§Y$district_rw_nexus_plural$§! мира-кольца увеличивают £housing£ §Y$MOD_PLANET_HOUSING_ADD$§! еще на §Y500§!."
 tr_prosperity_optimized_nexus_delayed: "§YРайоны комплекса§! могут иметь меньшие камеры для более эффективного использования пространства по вертикали, ввиду отсутствия необходимости обеспечивать удобства их обитателям."
 tr_prosperity_extended_hives: "Расширенные ульи"
 tr_prosperity_extended_hives_desc: "§YРайоны улья§! увеличивают £housing£ §Y$MOD_PLANET_HOUSING_ADD$§! еще на §Y100§!.\n§Y$district_rw_hive_plural$§! мира-кольца увеличивают £housing£ §Y$MOD_PLANET_HOUSING_ADD$§! еще на §Y500§!."
 tr_prosperity_extended_hives_delayed: "Расширив §Yрайоны улья§! под землю, мы сможем разместить там намного больше трутней."
 tr_prosperity_administrative_operations: "Меры административных органов"
 tr_prosperity_administrative_operations_desc: "§Y$mod_planet_buildings_upkeep_mult$§! и §Y$mod_planet_districts_upkeep_mult$§! снижены на §G10%§!."
 tr_prosperity_administrative_operations_delayed: "По мере того как наше государство продолжает расти, крайне важную роль приобретает вопрос ликвидации коррупции и неэффективности. Дыры, куда утекают ресурсы, необходимо заткнуть!"
 tr_prosperity_administrative_operations_machine: "Передача энергии по сверхпроводникам"
 tr_prosperity_administrative_operations_machine_desc: "$tr_prosperity_administrative_operations_desc$"
 tr_prosperity_administrative_operations_machine_delayed: "Сверхпроводящие материалы на каждом уровне нашей инфраструктуры снижают потери энергии на больших расстояниях почти до нуля."
 tr_prosperity_administrative_operations_hive: "Хитиновая архитектура"
 tr_prosperity_administrative_operations_hive_desc: "$tr_prosperity_administrative_operations_desc$"
 tr_prosperity_administrative_operations_hive_delayed: "Строительная смола, извлеченная из захваченной биомассы, которая хранится в перерабатывающих бассейнах размером с океан, более податлива и долговечна, чем большинство неорганических материалов. Она способна выдерживать даже холодный вакуум космоса."
 tr_prosperity_interstellar_franchising: "Межзвездные торговые привилегии"
 #tr_prosperity_interstellar_franchising_desc: "§YCity Districts§! provide §Y1§! additional [clerk.GetIcon] §Y[clerk.GetName] Job§!.\nHabitat §Y$district_hab_commercial_plural$§!, Ring World §Y$district_rw_city_plural$§! and Ecumenopolis §Y$district_arcology_housing_plural$§! also produce additional [clerk.GetIcon] §Y[clerk.GetName] Jobs§!."
 tr_prosperity_interstellar_franchising_delayed: "Приоритетное внимание торговым привилегиям позволяет даже самым простым планетам открывать процветающие, динамично развивающиеся компании, обеспечивая местному населению рабочие места и повышая объем торговли!"
 tr_prosperity_efficiency_algorithms: "Алгоритмы эффективности"
 #tr_prosperity_efficiency_algorithms_desc: "£energy£ §Y$mod_country_energy_produces_mult$§! increased by §G5%§!."
 tr_prosperity_efficiency_algorithms_delayed: "Нет большего преступления, чем неэффективная машина."
 tr_prosperity_efficiency_instincts: "Инстинкты эффективности"
 #tr_prosperity_efficiency_instincts_desc: "$tr_prosperity_efficiency_algorithms_desc$"
 tr_prosperity_efficiency_instincts_delayed: "Наши [GetIndividualNamePlural&nom] имеют сильное желание избегать ненужных затрат во всех аспектах повседневной жизни. Это должно привести к значительной экономии энергии."
 tr_prosperity_trans_stellar_corporations: "Межзвездные корпорации"
 tr_prosperity_trans_stellar_corporations_desc: "§Y£energy£ Производство энергии §! повышено на §G5%§!. Кроме того, §Yторговые узлы§! приносят §Y1§! дополнительную единицу £energy£ энергии."
 tr_prosperity_trans_stellar_corporations_delayed: "Существуют мощные корпоративные структуры, готовые понести большую часть наших промышленных затрат."
 tr_prosperity_void_works: "Модульные суперсооружения"
 tr_prosperity_void_works_desc: "£housing£ §Y$MOD_PLANET_HOUSING_ADD$§! от §Yжилых районов§!: §G+100§!"
 tr_prosperity_void_works_delayed: "При помощи модульного строительства мы сможем увеличить плотность застройки наших орбитальных поселений."
 tr_prosperity_creative_collectives: "Коллективы самоуправления"
 tr_prosperity_creative_collectives_delayed: "Создание системы автономных, самоорганизующихся коллективов для управления нашими заводами и школами, позволит нам значительно повысить продуктивность в сфере промышленности."
 tr_prosperity_pursuit_of_profit: "Получение прибыли"
 tr_prosperity_pursuit_of_profit_delayed: "Получение прибыли стало главным принципом для нашего общества. Те, кто успешно занимаются предпринимательской деятельностью, удостаиваются глубокого восхищения, а накопление энергокредитов рассматривается как очень привлекательная цель."
 tr_prosperity_peak_performance: "Пик производительности"
 tr_prosperity_peak_performance_desc: "§Y$mod_planet_jobs_complex_drone_produces_mult$§! увеличено на §G5%§!."
 tr_prosperity_peak_performance_delayed: "Потолок производительности отдельных прокси-блоков теоретически можно поднять с помощью ряда сложных оптимизаций и процедур разгона."
 tr_prosperity_hive_neural_signal_boosters: "Усилители нейронных сигналов"
 tr_prosperity_hive_neural_signal_boosters_desc: "$tr_prosperity_peak_performance_desc$"
 tr_prosperity_hive_neural_signal_boosters_delayed: "Энергосеть, которая питает наши ульи, также может использоваться для усиления нейронных сигналов, передаваемых некоторым трутням. Это позволит внести изменения и улучшения для пущей эффективности."
 tr_prosperity_finish: "Традиции процветания завершены"
