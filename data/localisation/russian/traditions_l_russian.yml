 tradition_unyielding: "Упорство"
 tradition_unyielding_desc: "Галактика велика и полна угроз."
 tr_unyielding_adopt: "Традиции упорства"
 tr_unyielding_finish: "Традиции упорства завершены"
 #tr_unyielding_finish_desc: "§M(Not implemented yet)§!\nAscension Perks Unlocked: §G+1§!"
 tr_unyielding_federations_finish: "$tr_unyielding_finish$"
 tr_unyielding_federations_finish_desc: "$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_MULT$§G+50%§!\n$mod_starbases_upkeep_mult$§G−20%§!\nОткрывает доступ к типу федерации §Y$military_federation$§!.\nПозволяет выбрать бонус за стремление £unity£ ['ascension_perk:ap_eternal_vigilance'].\nБонусы за стремление: §G+1§!"
 tr_unyielding_resistance_is_frugal: "Сопротивление уместно"
 tr_unyielding_resistance_is_frugal_desc: "£defense_army£ §YОборонительные армии§! теперь производят §Y0.5§! £unity£ единства."
 tr_unyielding_resistance_is_frugal_hive: "$tr_unyielding_resistance_is_frugal$"
