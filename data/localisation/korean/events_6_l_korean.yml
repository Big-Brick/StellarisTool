 #Intemporal Orb
 INTEMPORAL_ORB_CAT: "구체"
 INTEMPORAL_ORB_CAT_DESC: "구체 형태로 강력하게 응축된 에너지를 발견했습니다. 조사를 권고합니다."
 ## Event: Concentrated Energy
 anomaly.7105.name: "응축 에너지"
 anomaly.7105.desc: "[From.GetName]에서 기록된 이 특이한 에너지 수치는 어떤 작고 푸른 구체에서 나오고 있었습니다. [Owner.GetScientistPlural]들의 보고에 따르면, 감지기에 극성이 역전된 타키온이 검출되었다고 합니다.\n\n이 구체 주변의 땅에는 여러 기호가 새겨져 있습니다. 아마 예전에 존재했던 문명이 새긴 듯합니다. 이들이 지시를 남긴 것인지, 아니면 경고를 남긴 것인지는 확실하지 않습니다.\n\n기호 전체를 번역하려면 아직 멀었지만, 각 기호는 시간의 측정, 그리고 [Solar_System.GetName] 성계에 존재하는 천체의 상대적 위치와 관련된 것으로 보입니다."
 anomaly.7105.a.standard: "구체를 연구하세요."
 anomaly.7105.a.devouring: "구체를 먹어 치웁시다."
 anomaly.7105.b: "너무 위험합니다. 그대로 두세요!"
 ## Event: Local Time Reversal
 anomaly.7110.name: "국지적 시간 역전"
 anomaly.7110.desc: "[FromFrom.GetName]에서 발견한 푸른 에너지 구체가 사라졌습니다. 주변 지역을 스캔했지만, 이 신기한 구체는 흔적도 보이지 않습니다. 더 당황스러운 점은, 땅에 새겨진 기호들이 마치 원래부터 없었던 양 사라졌다는 것입니다.\n\n현장의 타키온 수치가 비정상적으로 높았다는 점을 근거로, [Owner.GetScientistPlural]들은 구체와 기호들이 시간을 거슬러 올라갔다는 가설을 제시했습니다."
 ## Event: Timeless
 anomaly.7115.name: "강처럼 흐르는 시간"
 ### Regular empires are non-gestalt empires with a non-robot scientist
 anomaly.7115.desc.regular: "[FromFrom.GetName]에서 작업 중이던 [Root.GetLeaderName]의 몸이 푸른 구체에 스쳤습니다.\n\n[Root.GetLeaderName] 담당관이 이후에 설명한 바에 따르면, 그 순간 시간이 강처럼 무한한 미래와 과거로 뻗어 나가는 환상이 보였다고 합니다. 그러더니 푸른색 에너지가 시간의 강줄기에서 원호를 그리며 뻗어 나와 자기 몸으로 들어갔다는 겁니다. 다른 [Owner.GetScientistPlural]들의 측정 결과로는 1초도 채 되지 않는 순간이었지만, [Root.GetLeaderName]에게는 한 시간이 넘는 것처럼 느껴졌습니다.\n\n환상이 끝난 뒤, [Root.GetLeaderName]에게는 자신이 더 이상 시간의 영향을 받지 않을 것이라는 확신이 생겼습니다. [Root.GetLeaderName] 담당관은 이렇게 얻은 무한한 시간을 이용해 홀로 우주를 탐사하겠다고 합니다."
 ### Scientist is already immortal
 anomaly.7115.desc.immortal: "[FromFrom.GetName]에서 작업 중이던 초급 [Owner.GetScientist] [intemporal_leader.GetName]의 몸이 푸른 구체에 스쳤습니다.\n\n[intemporal_leader.GetName] 담당관이 이후에 설명한 바에 따르면, 그 순간 시간이 강처럼 무한한 미래와 과거로 뻗어 나가는 환상이 보였다고 합니다. 그러더니 푸른색 에너지가 시간의 강줄기에서 원호를 그리며 뻗어 나와 자기 몸으로 들어갔다는 겁니다. 다른 [Owner.GetScientistPlural]들의 측정 결과로는 1초도 채 되지 않는 순간이었지만, [intemporal_leader.GetName]에게는 한 시간이 넘는 것처럼 느껴졌습니다.\n\n환상이 끝난 뒤, [intemporal_leader.GetName]에게는 자신이 더 이상 시간의 영향을 받지 않을 것이라는 확신이 생겼습니다. [intemporal_leader.GetName] 담당관은 이렇게 얻은 무한한 시간을 이용해 홀로 우주를 탐사하겠다고 합니다."
 ### Empire is a gestalt consciousness (hive or machine intelligence)
 anomaly.7115.desc.hive: "[FromFrom.GetName]에서 작업 중이던 [Root.GetLeaderName]의 몸이 푸른 구체에 스쳤습니다.\n\n그 순간 [Root.GetLeaderName] 담당관은 시간이 강처럼 무한한 미래와 과거로 뻗어 나가는 환상을 보았습니다. 그러더니 푸른색 에너지가 시간의 강줄기에서 원호를 그리며 뻗어 나와 담당관의 몸으로 들어갔습니다. 다른 [Owner.GetScientistPlural]들의 측정 결과로는 1초도 채 되지 않는 순간이었지만, [Root.GetLeaderName]에게는 한 시간이 넘는 것처럼 느껴졌습니다.\n\n환상이 끝난 뒤, 우리는 [Root.GetLeaderName] 담당관이 더 이상 시간의 영향을 받지 않을 것이라는 확신이 생겼습니다. 이번 일로 [Root.GetLeaderName] 담당관을 통해 얻은 무한한 시간을 우주 탐사에 활용할 수 있습니다."
 ### Empire is devouring swarm
 anomaly.7115.desc.devouring: "[Root.GetLeaderName] 담당관이 [FromFrom.GetName]에 있는 푸른 구체를 먹었습니다.\n\n그 순간 [Root.GetLeaderName] 담당관은 시간이 강처럼 무한한 미래와 과거로 뻗어 나가는 환상을 보았습니다. 그러더니 푸른색 에너지가 시간의 강줄기에서 원호를 그리며 뻗어 나와 담당관의 몸으로 들어갔습니다. 다른 [Owner.GetScientistPlural]들의 측정 결과로는 1초도 채 되지 않는 순간이었지만, [Root.GetLeaderName]에게는 한 시간이 넘는 것처럼 느껴졌습니다.\n\n환상이 끝난 뒤, 우리는 [Root.GetLeaderName] 담당관이 더 이상 시간의 영향을 받지 않을 것이라는 확신이 생겼습니다. 이번 일로 [Root.GetLeaderName] 담당관을 통해 얻은 무한한 시간을 우주 탐사에 활용할 수 있습니다."
 anomaly.7115.a: "안전한 여행 되길!"
 anomaly.7115.a.regular.tt: "[intemporal_leader.GetName]에게 소형 함선을 주어 홀로 우주를 탐험하게 합니다.\n[From.GetName](을)를 이끌 새 §H과학자§!를 배정해야 합니다."
 anomaly.7115.a.immortal.tt: "[intemporal_leader.GetName]에게 소형 함선을 주어 홀로 우주를 탐험하게 합니다."
 anomaly.7115.b.regular: "안 됩니다. 근무지를 이탈하지 마세요."
 anomaly.7115.b.immortal: "안 됩니다. 승진이나 받으세요."
 anomaly.7115.b.regular.tt: "[intemporal_leader.GetName](이)가 현재 직책을 유지합니다."
 anomaly.7115.b.immortal.tt: "[intemporal_leader.GetName](을)를 새 §H과학자§!로 모집할 수 있게 됩니다."
 ## Event: The Return
 anomaly.7120.name: "귀환"
 anomaly.7120.desc.regular: "[Root.Capital.GetName] 근처에 접근 중인 함선이 장거리 스캔에 감지되었습니다. 함선의 거리가 가까워지자, 우리 제국에서 백 년 전에 사용하던 함선의 설계임을 확인할 수 있었습니다.\n\n교신을 통해 이 함선의 함장이 푸른 에너지 구체로 인해 시간의 흐름과의 연결이 끊겼던 [Owner.GetScientist], [intemporal_explorer.GetName]임을 확인했습니다.\n\n[intemporal_explorer.GetName](은)는 중성자별의 충돌과 시공간 역중력장에 관한 이야기를 쏟아 내더니, 함선을 몰고 다시 어둠 속으로 사라졌습니다. 물리학자들에게 확인해 보니 놀랍게도 [intemporal_explorer.GetName]의 말은 대부분 검증이 가능할 뿐만 아니라, 실제로 획기적인 내용을 담고 있었습니다.\n\n[intemporal_explorer.GetName]의 신체는 시간이 흘렀음에도 전혀 변하지 않았으며, 우리 제국의 현재 기술 수준으로도 그 푸른 구체의 원리는 설명할 수 없습니다. 무슨 사고라도 당하지 않는 한, [intemporal_explorer.GetName]의 우주 탐사는 시간의 끝까지 계속될 것입니다."
 anomaly.7120.desc.hive: "[Root.Capital.GetName] 근처에 접근 중인 함선이 장거리 스캔에 감지되었습니다. 함선의 거리가 가까워지자, 우리 제국에서 백 년 전에 사용하던 함선의 설계임을 확인할 수 있었습니다. 이 함선의 함장은 푸른 에너지 구체로 인해 시간의 흐름과의 연결이 끊겼던 [Owner.GetScientist], [intemporal_explorer.GetName]이었습니다.\n\n다시금 집단과 연결된 [Owner.GetScientist]의 지식이 흘러들어왔습니다. 그 안에는 충돌하는 중성자별과 시공간 역중력장을 담은 감각 인상이 포함되어 있었습니다. 전송이 끝나자, 함선은 다시 어둠 속으로 사라졌습니다. 물리학 [Owner.GetScientistPlural]들에게 확인해 보니 놀랍게도 [intemporal_explorer.GetName]의 데이터는 대부분 검증이 가능할 뿐만 아니라, 실제로 획기적인 내용을 담고 있었습니다.\n\n[intemporal_explorer.GetName]의 신체는 시간이 흘렀음에도 전혀 변하지 않았으며, 우리 제국의 현재 기술 수준으로도 그 푸른 구체의 원리는 설명할 수 없습니다. 무슨 사고라도 당하지 않는 한, [intemporal_explorer.GetName]의 우주 탐사는 시간의 끝까지 계속될 것입니다."
 DATA_DIAMOND_CAT: "얇은 얼음"
 DATA_DIAMOND_CAT_DESC: "[From.GetName]에 얇은 얼음층으로 덮여 있는 비정상적으로 거대한 크리스탈 매장지가 있습니다. 또한 희미한 신호가 감지됩니다."
 DATA_DIAMOND_PROJECT: "[From.GetName] 크리스탈 매장지 연구"
 DATA_DIAMOND_PROJECT_DESC: "[From.GetName]의 크리스탈에서 흥미롭지만 혼란스러운 신호가 방출되고 있습니다. 추가 조사를 권고합니다."
 anomaly.3145.name: "시추 망상"
 anomaly.3145.desc: "[From.GetName]의 얼음층을 시추하기 위해 드릴을 설치한 [Root.GetLeaderName]에게 강렬한 감각이 엄습했습니다. 다친 곳은 없지만, 순간적으로 처음 보는 외계 종족에 관한 시각적, 후각적 환각이 어지럽게 밀려왔다고 합니다.\n\n이 기이한 크리스탈 매장지를 더 자세하게 조사하기 위한 특별 프로젝트를 준비했습니다."
 anomaly.3145.a: "당황스럽군요."
 anomaly.3150.name: "데이터 다이아몬드"
 anomaly.3150.desc: "얼음 아래에 있는 크리스탈은 행성 질량의 대부분을 차지하고 있습니다. 표본 조사 결과, 인위적으로 밀도를 높인 이 크리스탈의 격자는 데이터 저장에 쓰였던 것으로 보입니다. 크리스탈에 저장된 지식은 우리 제국의 데이터베이스를 모두 합친 것보다 몇 배는 더 많을 것으로 추정됩니다.\n\n이 크리스탈을 만든 존재들은 사이오닉 공명을 이용해 데이터를 각인했을 가능성이 높습니다. 이 크리스탈에 매료된 [Root.GetLeaderName] 담당관은 자신이 감독할 테니 행성 표면에 자동 연구 기지를 건설해 달라고 요청했습니다."
 anomaly.3150.a: "궤도에서 연구해도 충분합니다."
 anomaly.3150.b: "어디 열심히 해 보세요, [Root.GetLeaderName] 담당관."
 anomaly.3150.c: "크리스탈에서 자원을 채취하세요."
 anomaly.3165.name: "낭비하면 안 될 물건"
 anomaly.3165.desc: "자동 연구 기지가 거의 완공될 무렵, 크리스탈에서 갑자기 에너지가 급격히 활성화되면서 [Root.GetLeaderName] 담당관이 사망했습니다. 그런데 얼마 지나지 않아 자신이 [Root.GetLeaderName]임을 주장하는 자로부터 자율 통신이 도착했습니다.\n\n[Root.GetLeaderName]의 신경계는 복구가 불가능할 정도로 손상되었지만, 의식은 크리스탈 안에 갇혔다는 것입니다. 이 새로운 상황을 최대한 이용해, [Root.GetLeaderName](은)는 앞으로 이 크리스탈 데이터베이스를 연구하는 데 힘을 보태겠다고 합니다."
 anomaly.3165.a: "달콤씁쓸한 결말이군요."
 anomaly.3150.a.tooltip: "소형 연구 매장지가 [FromFromFrom.GetName]에 추가됩니다."
 anomaly.3150.b.tooltip: "대형 연구 매장지가 [FromFromFrom.GetName]에 추가되지만, [Root.GetLeaderName](이)가 위험해질 수 있습니다."
 anomaly.3150.c.tooltip: "희귀 크리스탈 매장지가 [FromFromFrom.GetName]에 추가됩니다. 적절한 기술만 있다면 크리스탈을 채굴할 수 있을 것입니다."
 ###Event: Holding Pattern
 #Modifiers
 reassured_tracking: "고마운 추적"
 reassured_tracking_desc: "중앙 집중형 추적 시스템이 주민들을 살피고 있습니다. 전반적인 불안감은 아직 남아 있지만, 무언가 조치가 취해지고 있다는 생각에 식민지는 안정적으로 유지되고 있습니다."
 collective_autophobia: "집단 고독 공포증"
 collective_autophobia_desc: "이 식민지 주민들은 자신이 실종될 수 있다는 집단적 공포에 사로잡혔습니다. 주민들이 서로 가까이 붙어 있으려 하는 바람에 일상적인 업무의 속도가 느려졌습니다."
 freed_stasis_criminals: "풀려난 정지장 수감 범죄자"
 freed_stasis_criminals_desc: "풀려난 죄수는 대부분 구제 불능의 범죄자들이었습니다. 이들이 느낀 문화 충격으로 인해 재통합 시도가 난항을 겪고 있으며, 범죄율 또한 치솟았습니다."
 freed_stasis_dissidents: "풀려난 정지장 수감 정치범"
 freed_stasis_dissidents_desc: "풀려난 죄수는 대부분 반체제 정치범이었습니다. 이들은 자신들의 예술과 문화를 식민지 주민들과 열정적으로 나누고 있습니다."
 #Events
 colony.9900.name: "결근"
 colony.9900.desc: "최근 들어 [Root.GetName]에서 [Owner.GetColonistPlural](이)가 실종되는 사건이 연달아 발생하고 있습니다. 각 사건에서 나타나는 유일한 공통점은 실종 당시 피해자가 홀로 있었다는 점입니다. 실종 소식이 퍼져 나가면서, 혼자서 다니면 안 된다는 공포가 식민지 전체를 사로잡았습니다. 이러한 불안감으로 인해 일상 업무에 상당한 문제가 발생하고 있습니다."
 colony.9900.a: "추적 절차를 실시하세요."
 colony.9900.a.tooltip: "[Root.GetName]에서 §Y100§! £pop£ §H팝§!이 실종되었습니다. 고가의 추적 시스템을 활용해 이번 사건을 파헤칠 것입니다."
 colony.9900.b: "당황할 필요 없습니다."
 colony.9900.b.tooltip: "[Root.GetName]에서 §Y100§! £pop£ §H팝§!이 실종되었습니다."
 colony.9905.name: "행운의 스캔"
 colony.9905.desc.a: "[Root.GetName]에 도입한 추적 시스템 덕분에 중요한 단서를 찾았습니다.\n\n[Owner.GetColonistPlural] 실종 사건이 또 한 번 발생했을 때, 실종자의 마지막 위치가 찍힌 곳을 빠르게 스캔했는데, 각 지점에서 붕괴 중인 하전 입자의 잔류가 발견된 것입니다.\n\n이에 우리는 이 입자의 정체를 파악하고 이번 [Owner.GetColonistPlural] 실종 사건과의 관련성을 드러내기 위한 특별 프로젝트를 수립했습니다."
 colony.9905.desc.b: "[Root.GetName]에서 뜻하지 않은 돌파구를 찾았습니다! 가장 최근에 실종된 [Owner.GetColonistPlural]의 위치를 찾아낸 것입니다. 해당 지역을 상세 스캔한 결과, 붕괴 중인 하전 입자의 잔류가 발견됐습니다.\n\n이에 우리는 이 입자의 정체를 파악하고 이번 [Owner.GetColonistPlural] 실종 사건과의 관련성을 드러내기 위한 특별 프로젝트를 수립했습니다."
 colony.9905.a: "끝까지 파헤쳐 봅시다."
 colony.9905.a.tooltip: "[Root.GetName]에서 또 하나의 팝이 사라집니다."
 colony.9910.name: "정지 패턴"
 colony.9910.desc: "잔류 입자를 참고삼아 성계 전체를 스캔한 결과, [Root.GetName]의 위성에서 이러한 입자의 증거를 발견할 수 있었습니다.\n\n위성 표면을 수색하자, 수백 년 동안 먼지 아래 묻힌 소형 에어록이 몇 개 발견되었습니다. 에어록으로 들어가니 관리 사무소 단지와 장거리 물질 전송기, 고도로 발달한 정지장 포드망에 연결된 역장 조작 장치 등이 버려진 채 남아 있었습니다.\n\n포드 안에는 수많은 이들이 정지장에 갇혀 있었는데, 이 중에는 우리 개척지에서 사라진 주민들도 있었습니다. 이 시설은 틀림없이 형무소였을 것입니다. 다만 주민들이 이곳에 납치된 이유와 주민들을 꺼낼 수 있는 방법은 아직까지는 알 수 없습니다."
 colony.9910.a: "반가운 소식이군요."
 colony.9915.name: "위성 탈출"
 colony.9915.desc: "실상은 음모론과 거리가 멀었습니다. 실종됐던 [Owner.GetColonistPlural]들은 컴퓨터 오류 때문에 갇힌 것이었습니다.\n\n컴퓨터 오류로 형무소의 낡은 전송기가 다시 가동되어, 우리 [Owner.GetColonistPlural]들을 무작위로 골라 죄수로 인식한 것입니다. 이 시설을 만든 존재들은 정지장 포드를 죄수를 수용할 뿐만 아니라 재교육하는 용도로도 사용했습니다. 우리 주민들을 꺼내는 일은 비교적 수월했지만, 원래 있던 죄수 중 상당수는 아직 정지장에 갇혀 있습니다. 이들을 풀어 줄 수는 있지만, 형무소 기록이 없어 이들이 과거에 어떤 범죄를 저질렀는지 알 수 없습니다.\n\n이들을 풀어 주는 대신, 형무소를 복원하고 특별 교도관에게 전송기 관리를 일임할 수도 있습니다."
 colony.9915.a: "반항하는 [Owner.GetColonistPlural]들을 다룰 때 유용한 장치로군요."
 colony.9915.a.tooltip: "실종됐던 [Owner.GetColonistPlural]들이 돌아오고, 정상적으로 작동하는 정지장 형무소가 생깁니다."
 colony.9915.b: "누구도 이런 감옥에 가둬서는 안 됩니다."
 colony.9915.b.tooltip: "사라졌던 [Owner.GetColonistPlural]들이 돌아오고, 형무소를 폐쇄합니다. 나머지 죄수들을 풀어 주면서, 식민지에 부정적인 영향이 나타날 수 있습니다."
 colony.9915.c: "점진적인 석방 계획을 수립하세요."
 colony.9915.c.tooltip: "풀려난 죄수들이 식민지에 원활하게 적응할 수 있도록, 이들을 개별적으로 추적하고 지원합니다."
 colony.9915.d: "음식을 포장까지 해 놨다고? 잘됐군."
 colony.9915.d.tooltip: "사라졌던 [Owner.GetColonistPlural]들이 돌아옵니다. 형무소는 식품 공장으로 개조해, 군체가 안에 갇힌 죄수들을 먹이로 섭취할 수 있도록 합니다."
 colony.9920.name: "나쁜 이웃"
 colony.9920.desc: "[Root.GetName]에서 풀려난 죄수들은 대부분 구제 불능의 범죄자들이었습니다. 범죄자 집단이 갑자기 풀려나자, 식민지에 각종 문제가 발생하고 있습니다."
 colony.9920.a: "안타깝군요."
 colony.9925.name: "선한 이웃 나쁜 이웃"
 colony.9925.desc: "[Root.GetName]에서 풀려난 죄수 중에는 구제 불능인 범죄자들도 있었지만 예술가, 작가, 음악가 등 반체제 정치범도 있었습니다.\n\n문화 예술계에 종사하던 죄수들은 자신들의 지식을 기꺼이 나누어 주었지만, 달리 할 일을 찾지 못한 범죄자들은 결국 예전 생활로 돌아가고 말았습니다."
 colony.9925.a: "그렇군요."
 colony.9930.name: "선한 이웃"
 colony.9930.desc: "[Root.GetName]에서 풀려난 죄수들은 대부분 작가, 예술가, 음악가 등 반체제 정치범이었습니다.\n\n드디어 자유를 찾은 이들은 자신들의 문화와 지식을 기꺼이 우리와 나누고 있습니다."
 colony.9930.a: "훌륭하군요."
 #Scripted Loc
 colonist_key: "개척민"
 colonists_key: "개척민"
 #Deposit
 d_stasis_prison: "정지장 형무소"
 d_stasis_prison_desc: "이 행성의 위성에 버려져 있는 형무소에는 고도로 발달한 정지장 포드가 망처럼 연결되어 있습니다. 죄수들은 그 안에 정지된 상태로 갇혀 탈출이 불가능합니다."
 d_prisoner_intergration: "체계적 통합"
 d_prisoner_intergration_desc: "정지장에 갇힌 죄수들은 한꺼번에 풀어 줘서는 안 됩니다. 죄수들을 하나하나씩 심사하면, 이들이 우리 사회에 온전히 통합될 수 있게 조치를 취할 수 있습니다."
 d_meals_in_pods: "포장육"
 d_meals_in_pods_desc: "정지장에 갇힌 죄수들은 먹기 좋게 포장된 음식이나 다름없습니다."
 #Special Project
 STASIS_PRISON_PROJECT: "입자의 수수께끼"
 STASIS_PRISON_PROJECT_DESC: "[Root.GetName]에서 [Owner.GetColonistPlural] 실종 사건이 연달아 발생했습니다. 조사 결과, 독특한 방식으로 전하를 띄고 있는 입자가 발견되었습니다. 이제부터 모든 정보를 동원해 사라진 [Owner.GetColonistPluralCap]들을 찾을 것입니다."
 #Jobs
 job_stasis_warden: "정지장 교도관"
 job_stasis_warden_plural: "정지장 교도관"
 job_stasis_warden_desc: "교도관은 정지장 형무소를 관리하고, 사라질 범죄자들을 표시합니다."
 mod_job_stasis_warden_add: "$job_stasis_warden$ 직업"
 mod_job_stasis_warden_per_pop: "$VALUE$팝마다 $job_stasis_warden$ 직업 §G+1§!"
 mod_job_stasis_warden_per_pop_short: "\n$VALUE$ £pop£마다 £job_researcher£ §G+1§!"
 job_stasis_warden_drone: "정지장 교도관 드론"
 job_stasis_warden_drone_plural: "정지장 교도관 드론"
 job_stasis_warden_drone_desc: "교도관 드론은 정지장 형무소를 관리하고, 사라질 일탈 드론을 표시합니다."
 mod_job_stasis_warden_drone_add: "$job_stasis_warden_drone$ 직업"
 mod_job_stasis_warden_drone_per_pop: "$VALUE$팝마다 $job_stasis_warden_drone$ 직업 §G+1§!"
 mod_job_stasis_warden_drone_per_pop_short: "\n$VALUE$ £pop£마다 £job_researcher£ §G+1§!"
 ## Event: Junkyard Orbit
 colony.9310.name: "쓰레기장이 된 궤도"
 colony.9310.desc: "[planet.GetName]에서 현지 행성의 폐기물 관리 역량을 잘못 파악했다는 보고가 들어왔습니다. 여러 개의 거대 매립지가 서로 연결되어, 통행이 불가능한 하나의 폐기물 지대가 된 것입니다. 폐기물 지대는 인구 밀집 지역의 가장자리까지 뻗어 있습니다.\n\n주민들은 '일시적인 조치'라면서, 폐기물을 대량으로 행성 궤도에 보내기 시작했습니다."
 colony.9310.a: "걱정스럽군요."
 colony.9310.a.tooltip: "쓰레기를 치우라고 하세요. 당장."
 colony.9315.name: "하늘을 뒤덮은 잔해"
 colony.9315.desc: "사고가 발생했습니다.\n\n치명적인 오류가 발생해 [planet.GetName] 궤도상의 폐기물 포드들이 서로 충돌하면서, 대량의 잔해가 대기권 하층부에 진입한 것입니다. 그 결과 행성의 우주 항행 능력이 제한되었고, 우주 쓰레기가 계속 부서지면서 상황은 더욱 악화될 것으로 추정됩니다. 잔해 수거 작전을 개시한다 해도 많은 시간과 비용이 들어갈 것입니다."
 colony.9315.a: "궤도를 청소하세요."
 colony.9315.a.tooltip: "특수 처리반을 투입합니다."
 colony.9315.b: "우주는 넓습니다. 쓰레기 조금 버린다고 큰일 안 나요."
 colony.9315.b.tooltip: "은하계에는 쓰레기보다 시급한 일이 많습니다."
 colony.9315.c: "위기 사태를 선포하세요."
 colony.9315.c.tooltip: "우리가 가진 힘을 총동원해서 반드시 잔해를 수거해야 합니다."
 colony.9320.name: "궤도 대청소 완료"
 colony.9320.desc: "역사적인 날입니다! [planet.GetName]의 우주 폐기물 수거원들이 드디어 마지막 근무를 마쳤습니다. 현재, [planet.GetName] 주변의 폐기물 고리는 이곳을 지나가는 함선에 심각한 위협이 되지 않을 정도로 크게 줄어들었습니다.\n\n앞으로는 지금보다 소규모로 수거 작업을 계속 진행할 예정입니다. 궤도에서 폐기물을 완전히 수거할 수는 없을지 모르지만, 적어도 최악의 상황은 벗어났습니다."
 colony.9320.a: "드디어 정상으로 돌아가겠군요."
 colony.9325.name: "비행 불가"
 colony.9325.desc: "[Planet.GetName] 궤도상의 우주 폐기물 이탈 문제를 대수롭지 않게 생각했지만, 사태가 급격하게 악화되었습니다.\n\n식민지 과학자들이 주장한 대로 우주 폐기물 조각들이 서로 부딪혀 행성 주변에 미세 폐기물의 고리를 만들어 낸 것입니다. 이로 인해 부수적 피해 없이는 자원과 사람을 식민지 안팎으로 운송하기가 심각하게 어려워졌습니다."
 colony.9325.a: "어라?"
 colony.9330.name: "별똥별"
 colony.9330.desc: "[Planet.GetName] 궤도상의 우주 폐기물 이탈 문제를 대수롭지 않게 넘겼는데, 문제가 저절로 해결된 듯합니다.\n\n행성의 강력한 중력에 이끌린 폐기물이 대기권과 만나 불타면서, 수천 개의 '별똥별'이 대규모로 떨어진 것입니다. 밤에 주민들이 모여 이 진귀한 장관을 감상하는 일은 이제 일상사가 되었습니다."
 colony.9330.a: "다들 별똥별이나 구경합시다."
 colony.9335.name: "맑아진 하늘"
 colony.9335.desc: "우주 폐기물 수거원들이 마지막 작업을 마치는 날, [planet.GetName]에서는 역사적인 자축의 물결이 퍼져나갔습니다.\n\n행성 주변을 둘러싸고 있던 폐기물 고리가 드디어 사라진 것입니다. 이번 성공으로 인해, 앞으로도 수거 작업을 진행함으로써 후손들에게 맑은 하늘을 선사하자는 방안이 대대적인 지지를 받고 있습니다."
 colony.9335.a: "정말로 중대한 날이군요."
 orbital_cleanup: "궤도 대청소"
 orbital_cleanup_DESC: "대기권 하층에서 충돌 사고가 발생하면서, [Root.GetName] 궤도가 우주 폐기물로 뒤덮이고 말았습니다. 이어지는 연쇄 효과로 행성에 진입할 수 없게 되기 전에 반드시 폐기물을 수거해야 합니다."
 orbital_cleanup_intense: "집중 궤도 대청소"
 orbital_cleanup_intense_DESC: "대기권 하층에서 충돌 사고가 발생하면서, [Root.GetName] 궤도가 우주 폐기물로 뒤덮이고 말았습니다. 주민들의 미래를 위해, 어떤 대가를 치르더라도 폐기물을 철저히 없애야 합니다."
 job_astrogarbage_collector: "우주 폐기물 수거원"
 job_astrogarbage_collector_plural: "우주 폐기물 수거원"
 job_astrogarbage_collector_desc: "행성 궤도에서 우주 폐기물을 수거하는 특수 처리반입니다."
