 #Deposit and Job
 d_myrmeku_power_farms: "미르메쿠 발전소"
 d_myrmeku_power_farms_desc: "이 작은 곤충들로 우리가 사용할 에너지를 생산합니다."
 job_myrmeku_power_farmer: "미르메쿠 발전 설비 기사"
