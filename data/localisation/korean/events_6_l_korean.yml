 d_astrogarbage_collector: "우주 폐기물 처리반"
 d_astrogarbage_collector_desc: "이 행성은 궤도상의 폐기물을 줄여 우주 항행 능력을 유지하려 하고 있습니다."
 d_sprawling_landfill_blocker: "확산하는 매립지"
 d_sprawling_landfill_blocker_desc: "끝이 보이지 않는 쓰레기 언덕이 지정된 매립 구역을 벗어나 계속 확장되고 있습니다."
 trash_rings: "폐기물 고리"
 trash_rings_desc: "이 행성은 우주 폐기물 고리로 둘러싸여 있습니다."
 ground_locked: "비행 불가"
 ground_locked_desc: "이 행성은 저궤도에서 심각한 우주 폐기물 충돌이 발생해, 추후 공지 시까지 어떠한 함선도 궤도를 통과할 수 없습니다."
 clear_skies: "맑아진 하늘"
 clear_skies_desc: "이 행성은 최근에 위험한 우주 폐기물을 치워, 맑은 하늘을 되찾았습니다. 이제 원하는 대로 행성 안팎을 오갈 수 있습니다."
 shooting_stars: "별똥별"
 shooting_stars_desc: "이 행성은 우주 폐기물이 궤도상에서 불타 버리면서, 주기적으로 유성우가 발생하고 있습니다."
 ### MYRMEKU
 #Event Chain
