 NAME_Eldritch_Horror: "섬뜩한 공포"
 NAME_The_Outer_Gate: "외문"
 NAME_Snow_Crystal: "눈 결정체"
 NAME_Central_Crystal_Country: "크리스탈 제국"
 NAME_Central_Crystal_Species: "제르-아야키"
 NAME_Central_Crystal_Enclave: "외부 권역 함대"
 NAME_Central_Crystal_Station: "크리스탈 기지"
 #Opinions
 opinion_small_boon_crystal_empire: "관대한 제국"
 #Triggered Loc
 not_bio_alloy: "합금"
 bio_alloy: "생체 합금"
 #Fumongus Anomaly
 fungal_emitters_category: "기이한 발산파"
 fungal_emitters_category_desc: "[From.GetName]의 지하 동굴에서 예상치 못한 파동이 나오고 있습니다. 일종의 신호인 것일까요?"
 anomaly.6755.name: "균류 발생기"
 anomaly.6755.desc: "[From.GetName] 지표면 밑에는 아주 특이한 유기체가 살고 있습니다. 스캔 및 표본 분석 결과, 이 생물은 포자로 뒤덮인 균사체의 일종인 것으로 나타납니다. 우리 모성에 있는 포자와 비교하면 엄청난 크기입니다. 표면은 반짝이는 만화경 같으며 색조는 주변 환경에 따라 변합니다.\n\n특히 기이한 점은 이 승무원이 연결망을 형성해 신호일 것으로 예상하는 파동을 만들어 낸다는 것입니다. 현재 파동은 매우 약하지만 약간의 노력을 기울인다면 이 파동이 어디로 가는지도 알 수 있을 것입니다."
 anomaly.6755.a: "신호의 목적지를 파악할 것입니다."
 anomaly.6755.b: "회수해서 팔아버리세요."
 anomaly.6755.c: "이럴 시간 없습니다."
 anomaly.6760.intro: "[From.GetName] 지표면 아래에는 친숙한 유기체가 살고 있습니다. 스캔과 표분 분석 결과 이 생물은 무수한 포자로 뒤덮인 일종의 균사체인 것으로 보이며 '거균류'와 직접 관련이 있는 것으로 보입니다. 그런데 이 생물의 포자는 작은 구슬 형태로 진화했습니다. 이 포자들은 계속 색이 바뀌면서 장관을 연출하기도 하지만 일반 포자에 비해 더 강한 신호를 만들어내는 것으로 보입니다."
 anomaly.6760.desc: "$anomaly.6760.intro$\n\n우리 과학자들이 세운 가설에 의하면 우리가 이 포자들을 '거균류'에게 가져감으로써 연결망을 더욱 강화할 수 있다는 것 같습니다."
 anomaly.6760.a: "연결망 강화 프로젝트를 준비하세요."
 anomaly.6760.b: "데이터나 어서 가져오세요."
 anomaly.6765.desc: "$anomaly.6760.intro$\n\n네트워크를 해체해 정보를 가져왔지만 실용적인 용도는 딱히 없습니다."
 anomaly.6770.name: "균류 추적"
 anomaly.6770.intro: "균사체가 발신하는 신호를 추적하는 것이 생각보다 어렵습니다."
 anomaly.6770.desc: "$anomaly.6770.intro$ 당황하던 우리 과학자들이 마침내 '버섯을 통해 다른 차원을 들여다보는' 데 성공했습니다. 이 말이 무슨 뜻인지 자세한 정보는 별로 없지만, 어쨌든 작업은 성공했으며 새로운 목적지를 확인했습니다."
 anomaly.6770.a: "경로를 잡으세요!"
 anomaly.6780.desc: "$anomaly.6770.intro$ [Root.GetLeaderName] 담당관의 갖은 노력에도 불구하고 신호의 목적지는 도저히 확인할 수 없었습니다. 이제 이 균사체는 거의 수수께끼로 남아 있습니다. 그럼에도 불구하고 그 과정에서 많은 것을 배울 수 있었습니다. 지금 이 순간에도 관련 데이터를 가져오는 중입니다."
 anomaly.6785.name: "연결망과 버섯"
 anomaly.6785.desc: "변이한 포자를 기존 버섯에 접목하는 일은 생체공학적으로 매우 어려운 작업이었습니다. 이 '거균류'의 유전 변이를 상세히 수록한 기록의 도움을 받아 우리 과학자들은 효율성 감소 없이 포자를 또 한 번 변이시키는 데 성공했습니다. 그 효과는 굉장했습니다. 몇 달 만에 버섯이 열 배로 자라난 것입니다. 이에 따라 균사체에 공급할 물이 더 필요하게 되었지만 근처의 얼음 소행성에 앞으로 수백 년, 아니 수천 년은 버틸 수 있는 수분이 있습니다.\n\n균사체가 커지자 연결망도 확대되었고 연산 장비를 개량함으로써 포자가 하는 말을 들을 준비가 되었습니다."
 FOLLOWING_FUNGI_PROJECT: "균류의 흔적"
 FOLLOWING_FUNGI_PROJECT_DESC: "[From.GetName]에서 발생한 이상 현상을 통해 어딘가로 신호를 보내고 있는 기이한 균사체 군집을 발견했습니다. 우리 과학자들은 신호를 증폭함으로써 신호의 목적지를 확인하고 이 균사체를 더욱 잘 이해할 수 있을 것으로 판단하고 있습니다."
 MUSHROOMING_NETWORK_PROJECT: "포자 접붙이기"
 MUSHROOMING_NETWORK_PROJECT_DESC: "변이 포자를 발견함에 따라 우리만의 균사체 감청망 개발을 위한 전기가 마련되었습니다. 이 포자들은 더욱 크고 신호 강도도 더 높으며 '거균류'의 성장을 더욱 촉진하는 데 도움이 될 것입니다."
 fumongus_chain_title: "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_chain_desc: "$anomaly.6770.desc$"
 fumongus_poi_1: "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_1_desc: "$anomaly.6770.desc$"
 ### Fumongus Colony Events
 #Events
 colony.2060.name: "버섯 따기"
 colony.2060.desc: "[Root.GetName]에 위치한 우리 식민지에서 실시한 정기 생태 조사 중에 기이한 균류 생명체를 발견했습니다. 연구진의 보고에 따르면 이 균사체의 표면은 여러 색으로 반짝인다고 합니다. 하지만 그보다 신기한 점은 포자들이 여러 군집으로 나뉘어 있으며, 넓은 범위 내에서 어떤 일이 발생할 때마다 서로 소통하는 듯한 반응을 보였다는 것입니다.\n\n게다가 이 생명체의 생물학적 구조는 이곳 식민지의 생태계에 속한 것이 아닙니다. 당황한 과학자들은 이 생명체가 지성체일 가능성이 있다며 특별 지원을 요청했습니다."
 colony.2060.a: "처분해 버리세요."
 colony.2060.b: "더 자세히 조사하세요."
 colony.2060.c: "...초거대 균류의 친척이군요!"
 colony.2065.name: "포자에도 귀가 있다"
 colony.2065.desc: "[Root.GetName]에서 우려할 만한 보고가 들어오고 있습니다. 자세히 살펴본 결과, 우리가 발견한 외계 균류가 은하계 어느 곳으로 신호를 발신하고 있는 것 같습니다. 다만 목적지가 어디인지는 아직 확정하지 못했습니다. 원격 측정과 안보 분석을 진행한 결과, 이 균사체가 일종의 첨단 감시용 유기체일 가능성이 제기되었습니다.\n\n하지만 이 유기체가 오래되었다는 점을 생각해야 합니다. 이 감시용 버섯을 만들어낸 존재는 이제 없을 가능성이 높습니다. 만약 존재한다 하더라도 잠자는 야수를 깨우지 않는 편이 현명할 것입니다."
 colony.2065.a: "더 자세히 알아봐야겠군요."
 colony.2065.b: "너무 위험합니다. 파괴하세요."
 colony.2070.intro: "균사체를 조사한 결과, 이 생물이 보낸 신호는 비슷한 생물로 이루어진 연결망의 일부일 가능성이 높을 것으로 보이며 이 연결망은 은하계 전체, 어쩌면 그 너머까지 뻗어 있을 수도 있습니다. 아직 알아낸 사실은 많지 않지만 연결망의 일부를 이루고 있는 이곳의 균사체 또한 다른 곳으로부터 신호를 받고 있음을 발견했습니다."
 colony.2070.name: "누군가 듣고 있다"
 colony.2070.desc: "$colony.2070.intro$\n\n확신할 수는 없지만 데이터 전송량 등 여러 요인을 고려해 봤을 때 누군가가 이 연결망을 적극 활용해서 정보를 모으고 있는 것 같습니다. 이미 대응책으로 역정보 유출을 계획하고 있으며 이 새로운 형태의 첩보 기법에 대응하기 위해 제국 전역에서 보안 조치를 갱신하고 있습니다."
 colony.2070.a: "역정보를 흘리세요!"
 colony.2075.name: "듣는 이 하나 없어라"
 colony.2075.desc: "$colony.2070.intro$\n\n데이터 전송량 등 여러 요인을 고려해 보았을 때 이 네트워크는 현재 사용 중이 아닌 것으로 보입니다. 아직 활성화된 부분이 있지만 그것은 이 연결망이 붕괴되지 않고 단지 잠들어있을 뿐이라는 의미일 것입니다."
 colony.2075.a: "관측을 통해서 무엇을 알 수 있을까요?"
 colony.2080.name: "포자 연결체"
 colony.2080.desc: "우리가 이 균류와 균사체 감청망 사이의 관계에 대하여 지니고 있던 의혹은 단순한 비교를 통해 해소되었습니다. 이 개체는 거균류와 소통하고 있는 수많은 자손 균류 중 하나로서 이 생물을 더욱 잘 이해할 수 있는 계기가 될 수 있을 것입니다."
 colony.2080.a: "연결망을 강화할 수 있는지 알아보세요."
 colony.2080.b: "연결망을 이용해서 식민지를 밀착 감시하세요."
 colony.2080.c: "연결망을 해체했지만 아직 연구는 가능합니다."
 colony.2085.name: "[Root.GetName]의 불만"
 colony.2085.desc: "현지 균사체를 사용해 식민지를 감시한다는 우리 프로젝트에 관한 소식이 퍼졌습니다. 주민들의 반응은 좋지 않습니다. 상황을 해소하려 갖은 노력을 기울였음에도 불구하고 현지 주민들은 이 계획이 신뢰를 저버린 것이라면서 당장 프로젝트를 중단할 것을 요구하고 있습니다.\n\n상황은 빠르게 악화되고 있으며 현지 치안 인력은 주민들을 감당할 수 없는 상태입니다. 만약 프로젝트를 속행할 경우 치안 당국이 식민지에 대한 통제력을 유지할 수 있도록 지원을 제공해야 합니다."
 colony.2085.a: "주민들 말이 맞습니다. 프로젝트를 취소하세요."
 colony.2085.b: "숨길 것이 없다면 두려워할 이유도 없습니다."
 colony.2090.name: "포자에 도청 장치"
 colony.2090.desc: "[Root.GetName]에서 균사체를 재배한 후, 현지 컴퓨터 장비를 이용해 간섭을 걸러냈습니다. 담당 팀의 보고에 의하면 연결망을 통해 개척민들을 밀착 감시하고 있다고 합니다. 벌써 잡범 다수가 범죄에 상응하는 제재를 받았습니다.\n\n안타깝지만 같은 시설을 다른 지역에서 재현하려는 시도는 실패로 돌아갔습니다. 아직 파악하지 못한 요인이 작용하고 있는 듯합니다."
 colony.2095.name: "균류 육성 실패"
 colony.2095.desc: "[Root.GetName]의 균사체 확산을 재현하려 했지만, 결국 자라난 것은 보다 '전통적인' 버섯이었습니다. 일부 개척민이 연루된 어떤 사고를 통해 이 버섯을 먹을 수 있다는 사실을 발견했습니다. 이 사건으로 인해 전체 연결망의 균형이 잠시 흐트러졌지만, 이제는 안정을 되찾고 정상 기능 중인 것으로 보입니다. 그러나 전체적으로 의미 있는 성능 개선은 없었습니다. 이 버섯들은 단순히 물을 저장하는 역할을 담당하는 것 같습니다. 연결망에 기여하는 바는 없으며 이 버섯들을 없애도 연결망에는 영향이 없습니다."
 colony.2095.a: "그냥 수확하세요."
 colony.2095.b: "버섯을 조사해 보세요. "
 terra.15.name: "유휴 테라포밍 장비"
 terra.15.desc: "§Y[From.GetName]§!에 대한 테라포밍 사업이 완료된 후, 우리 [Owner.GetTerraformerPlural]들이 굉장한 기회를 포착했습니다. 남은 테라포밍 장비를 이곳 행성을 위한 기반 시설로 개조할 수 있다는 것입니다."
 terra.15.a: "주택이 더 있으면 좋지요."
 terra.15.b: "공장을 건설하세요."
 terra.15.c: "이 행성의 에너지 생산능력을 확대하세요."
 terra.15.c.tooltip: "행성에 §Y$district_generator_plural$§! §G2§!곳이 추가됩니다."
 terra.15.d: "광산은 많을수록 좋겠지요."
 terra.15.d.tooltip: "행성에 §Y$district_mining_plural$§! §G2§!곳이 추가됩니다."
 terra.15.e: "[From.GetName]에 농장이 더 필요합니다."
 terra.15.e.tooltip: "행성에 §Y$district_farming_plural$§! §G2§!곳이 추가됩니다."
 terra.15.f: "장비를 처분하세요."
 terra.20.name: "설계된 아름다움"
 terra.20.desc: "§Y[From.GetName]§!에서의 테라포밍이 당초 예상보다 빠르게 끝났습니다. 그 결과 남은 시간에 [Root.GetTerraformerPlural]들이 여러 실험을 진행했고 놀라운 성과를 만들어 냈습니다. 이제 이 행성의 자연적인 특징을 강화해 심미적으로도 더 나을 뿐만 아니라 실용적인 행성을 만든 것입니다."
 terra.20.a: "훌륭합니다!"
 terra.20.b: "너무 인공적인 모습 아닙니까?"
 terra.25.name: "테라포밍 문제"
 terra.25.desc: "§Y[From.GetName]§!에서 오래 진행한 사업이 아쉽게도 절반의 성공으로 끝났습니다. 마지막 남은 협곡을 테라포밍하던 중 생체물질 재배열기에서 오작동이 발생해 거대한 §Y테라포밍 잔여물§! 지대가 생겼습니다. 개척민들에게는 위험하지 않지만 행성이 당분간은 더 비좁아졌습니다."
 terra.25.a: "다시는 이런 일이 없도록 하세요."
 terra.30.name: "실수에서 배우다"
 terra.30.desc: "우리 [Owner.GetTerraformerPlural]들이 §Y[Root.GetName]§!에 남은 마지막 §Y테라포밍 잔여물§!을 치웠습니다. 청소 과정은 고통스럽고 잔여물은 끈적거렸지만 아주 소득이 없는 것은 아니었습니다. 이번 문제의 원인과 그 영향을 분석함으로써 행성공학에 대한 우리의 이해가 증진되었습니다."
 terra.30.a: "최소한 얻는 것은 있겠군요."
 terra.35.name: "[Root.GetHomeWorldName] II"
 terra.35.desc: "우리는 §Y[From.GetName]§! 테라포밍에 성공했을 뿐만 아니라 그 이상의 성과를 이루어 냈습니다. 테라포밍 과정의 마지막 단계에서 우리 [Root.GetTerraformerPlural]들이 우리 모성의 생물을 위한 완벽한 서식지를 만드는 데 성공했습니다. [Root.GetHomeWorldName]의 환경과 소름 돋을 정도로 비슷한 [From.GetPlanetMoon]을 만들어낸 것입니다. 이제 우리 모성의 모든 식물을 이 낯선 땅에서 모두 찾아볼 수 있습니다."
 terra.35.a: "이 [From.GetPlanetMoon]을 [Root.GetHomeWorldName] II로 명명합니다."
 terra.35.a.tooltip: "§Y[From.GetName]§!의 명칭을 §Y$terra.35.name$§!로 설정합니다."
 terra.35.b: "뜻밖의 행운이로군요."
 terra.40.name: "행성의 책략"
 terra.40.desc: "테라포밍 사업이 마무리 중인 §Y[From.GetName]§!에서 독특한 상황이 발생했습니다. 우리 [Root.GetTerraformerPlural]들이 이 [From.GetPlanetMoon]의 공전주기와 자전주기가 일치하도록 변할 수 있다는 점을 발견한 것입니다. 이 현상이 자연적으로 발생할 경우 식민지에 큰 피해가 갈 것입니다. 하지만 테라포밍 중간에 이 현상이 발생하게 할 경우, 태양 면에서는 해가 지지 않는 점을 이용해 막대한 양의 에너지를 생산할 수 있습니다. 다만 나머지 산업 시설과 주택을 중간 지대와 밤 지대에 세우려면 각별한 노력이 필요할 것입니다."
 terra.40.a: "[From.GetPlanetMoon]을 다시 돌게 하세요. 위험이 너무 큽니다."
 terra.40.b: "실행하세요."
 terra.40.b.tooltip: "[From.GetPlanetMoon]의 잠재력을 완전히 실현할 수 있는 특별한 §Y행성 결정§!이 잠금 해제됩니다."
 terra.45.name: "성공을 위한 과잉"
 terra.45.desc: "§Y[From.GetName]§!에 대한 테라포밍이 마무리되는 시점에, 이번 사업으로 예상치 못한 상황이 발생했음을 알게 되었습니다. 이번 사업 완료에 당초에 배정했던 자원보다 적은 자원이 쓰였고, 그 결과 이 [From.GetPlanetMoon]에 지구를 추가로 건설할 수 있는 기회가 생겼습니다. [Root.GetTerraformerPlural]들은 세 가지 방안을 제시했습니다."
 terra.45.a: "$district_generator_plural$가 더 있으면 좋을 겁니다."
 terra.45.b: "$district_mining_plural$ 공간을 더 확보할 수 있는지 알아보세요."
 terra.45.c: "이 행성에 $district_farming_plural$가 더 있으면 좋을 겁니다."
 terra.50.name: "합일"
 terra.50.desc: "§Y[From.GetName]§! 행성을 [This.GetClassAdj](으)로 전환하는 과정에서 [Root.GetTerraformerPlural]들은 현지 동물을 의식체에 연결했을 뿐만 아니라 테라포밍 가스에 노출되어 발생하는 돌연변이를 통해 의식체를 행성 자체에 연결시켰습니다. 이렇게 만들어진 집합의식은 그 어느 때보다 더 진정한 의미에서의 총체성을 지니게 됩니다."
 terra.50.a: "좋습니다, 이것은 의식체가 의지하는 바입니다."
 terra.50.b: "아닙니다, 이것은 이 행성에 대하여 의도한 바가 아닙니다."
 terra.55.name: "완벽한 조직"
 terra.55.desc: "이 집합의식에게 자연을 초월하는 것은 이미 익숙한 일입니다. §Y[From.GetName]§!에 대한 테라포밍 과정에서 이 집합의식은 모든 언덕을 하나하나 고려했으며 모든 동물을 전략적으로 배치했습니다. 이제 이 [From.GetPlanetMoon]은 우리 [Root.GetUnitDronePlural]들이 집합의식을 위해 물자를 생산할 수 있도록 완벽하게 조직된 물류의 낙원이 되었습니다."
 terra.60.name: "모습을 드러낸 [GetPreFTLUpperPlural] 문명"
 terra.60.desc: "§Y[From.GetName]§!의 토양을 비옥하게 만들고 대기를 추가하던 중, 우리 [Root.GetTerraformerPlural]들이 뜻밖의 발견을 했습니다. [From.GetName] 지표면 아래에 지하 외계 문명이 존재했던 것입니다. [From.GetPlanetMoon]의 광물 밀도가 높아, 이전에는 스캐너에 감지되지 않았던 것이 분명합니다.\n이 [GetPreFTLLowerPlural] 문명은 지표면이 변했다는 사실을 알아채지 못한 듯하니, 우리가 원하는 대로 조치할 수 있을 것입니다."
 terra.60.a: "진기한 일이로군요."
 terra.60.b: "이제는 버러지들이 지하에까지 기어 다니는군요."
 terra.60.c: "우주에 지성체가 또 있다니, 기쁜 일입니다."
 terra.55.a: "아주 보기 좋군요."
 terra.65.name: "도움이 된 실수"
 terra.65.desc: "우리 [Root.GetTerraformerPlural]들이 §Y[From.GetName]§!에서 발견한 유독성 가스 기공이 사실은 큰 도움이 되는 것으로 나타났습니다! 그곳에서 나오는 유독 가스는 사실 정제되지 않은 §Y외계 가스§!였습니다. 이 새로운 자원 덕분에 [From.GetPlanetMoon]에 대기를 형성하는 데 필요한 에너지가 크게 줄어들었습니다. 이 가스는 앞으로 장기간 채취가 가능합니다!"
 terra.65.a: "훌륭합니다."
 terra.70.name: "뜻밖의 변이"
 terra.70.desc: "우리 [Root.GetTerraformerPlural]들이 §Y[From.GetName]§!에 대하여 좋은 소식과 나쁜 소식을 가져왔습니다. 좋은 소식은 테라포밍 작업이 매우 순조롭게 진행되어 이제 아름다운 가이아 행성이 생겼다는 것입니다. 나쁜 소식은 이 [From.GetPlanetMoon]에서 거주하는 모든 존재가 테라포밍 가스에 노출되어 가이아 행성 밖에서는 살 수 없게 되었다는 것입니다. 가이아에 매인 몸이 된 이 주민들은 놀랍게도 가이아 행성에 있을 때 생산성이 증가합니다. 이들보다 나중에 이주한, 가스에 노출되지 않은 근로자들과 비교해도 훨씬 더 생산성이 높습니다."
 terra.70.a: "적어도 불편한 건 아니니 다행이군요."
 terra.75.name: "[From.GetName]의 지상 낙원"
 terra.75.desc_regular: "§Y[From.GetName]§!에 배속된 [Root.GetTerraformerPlural] 중에 [Root.GetHomeWorldName]에서 형성된 오랜 종교 분파의 신자가 있는 것 같습니다. 이 [Root.GetSpeciesNamePlural](은)는 우리 종족을 위한 낙원이 실재한다고 믿는데, 이들은 이곳을 찾는 대신 직접 창조해 냈습니다. [From.GetName](은)는 이제 축복받은 자들의 [From.GetPlanetMoon]이 되어 마치 우리 종족 고대 역사서에 나오는 그림과도 같은 모습을 하고 있습니다."
 terra.75.desc_spirit: "우리 테라포밍 기술자들이 자신들의 최고 업적을 갱신했습니다! [Root.GetName]에는 과거부터 지금까지 우리 종족을 위한 축복 받은 땅, 즉 낙원이 있다는 신화와 전설이 전해 내려오고 있습니다. 우주를 직접 돌아다녀 보아도 이 행복의 땅이 나오지 않자, 우리 [Root.GetTerraformerPlural]들은 이 낙원을 직접 현실로 만들자는 프로젝트를 개시했습니다. 이제 §Y[From.GetName]§!의 경이로운 지평선을 바라보면서, 우리는 마침내 우리만의 낙원을 만들어 냈음을 실감합니다."
 terra.75.a: "아름답군요."
 terra.75.b: "그냥 가이아 행성 아닌가요?"
 terra.80.name: "방사성 식물"
 terra.80.desc: "§Y[From.GetName]§!의 대기와 토양에서 방사능을 제거하던 우리 [Root.GetTerraformerPlural]들이 갑자기 외계 생물학자 파견을 요청했습니다. 이곳에서 한 생물종이 발견 되었는데 방사능 물질에서 영양분을 얻는 이 생물종이 지금은 시들어가고 있던 것입니다. 더 흥미로운 점은 이 식물이 준지성체로서 이제 막 자의식이 생기는 단계에 도달했다는 것입니다. 이제 최종 토양 정화를 앞둔 시점에서 새로 발견한 이 생명체를 어떻게 할 것인지 결정해야 합니다."
 terra.80.a: "우리가 서식지를 파괴했으니, 우리가 나서서 이들을 보존해야 합니다."
 terra.80.a.tooltip: "400 준지성체 £pop£ §H방사선 영양 생물 팝§!이 [This.GetName]에 추가됩니다."
 terra.80.b: "우리 제국에 편입시키는 건 어떨까요?"
 terra.80.c.indifferent: "유전 물질을 채취하세요."
 terra.80.c.xenophile: "생물학적 구조를 조사하세요."
 terra.80.c.cantuse: "이 식물은 우리에게 쓸모가 없지만 그 유전 물질은 유용할 수 있습니다."
 terra.80.c.tooltip: "§Y$trait_plantoid_radiotrophic$§! 특성을 유전자 변조에 이용할 수 있습니다."
 terra.80.d: "그깟 잡초를 왜 신경 쓰는 겁니까? 테라포밍이나 완료하세요."
 terra.85.name: "빛나는 환영회"
 terra.85.desc: "§Y[FromFromFrom.GetName]§!에서 발견한 방사능 영양 식물이 몇 년에 걸친 적응과 조정 과정을 거쳐 드디어 우리 사회의 일원이 될 준비를 마쳤습니다. 아직 생겨난 지 얼마 되지 않은 종족이지만 에너지를 채취하는 데 탁월한 능력을 지닌 듯합니다."
 terra.85.a: "환영합니다!"
 terra.85.a.tooltip: "§G600§! £pop£ §H방사선 영양 생물 팝§!이 제국에 추가됩니다."
 terra.90.name: "무기 보관함"
 terra.90.desc: "죽은 행성을 복원하는 일은 힘듭니다. 반복 작업인 경우도 많지요. 구획을 나누고, 잔해를 치우고, 토양을 교체하고, 남은 물을 정화하고, 새 동물을 추가하는 과정을 반복하는 겁니다. §Y[From.GetName]§!에 대한 테라포밍 작업이 마무리될 무렵, 우리 [Root.GetTerraformerPlural]들이 지하에서 커다란 금속 상자를 발견했습니다. 상자에 장착된 여러 장치를 볼 때 무기 보관함인 것으로 추정됩니다."
 terra.90.a: "흥미롭군요."
 terra.95.name: "다시 빛을 보는 과거"
 terra.95.desc: "[From.Planet.GetName]에서 발견한 보관함은 도시 폐허의 지하 깊숙한 곳에서 발견되었기 때문에 발굴이 쉽지 않았습니다. 특히 상자에 장착된 함정을 건드리지 않도록 주의해야 하기 때문에 발굴 과정이 더욱 지체되었습니다. 이제 보관함이 우리 눈앞에 모습을 드러내 마침내 조사를 진행할 수 있게 되었습니다. 보관함 옆면에는 외계어로 된 복잡한 문구가 각인되어 있습니다. 이 문구를 해독하면 내용물을 파악할 수 있을지도 모릅니다."
 terra.100.name: "무기고"
 terra.100.desc: "우리 [Owner.GetLinguists]들이 보관함에 각인된 외계어 글귀를 번역한 결과, 일종의 경고 문구인 것으로 나타났습니다. §Y\"어떠한 경우에도, 어떠한 정부도, 전쟁 중에 이 무기고를 열지 말 것!\"§!\n\n이곳에 보관한 무기는 스스로를 잿더미로 만들 정도의 능력을 갖춘 문명에게조차 너무 강력했던 것입니다. 이제 남은 일은 무기고를 조심스럽게 열고 그 안의 상품을 챙기는 것 뿐입니다."
 terra.105.name: "오역"
 terra.105.desc.generic: "우리 [Owner.GetLinguists]들이 '도서관'에 해당하는 문구를 '무기고'로 오역한 것 같습니다. '힘의 원천'이라는 문구가 지닌 의미를 오해한 것인데, 우리는 보관함을 열고 그 안에 있는 또 다른 외계어 문구를 접하고 나서야 오류를 깨달았습니다. §Y\"만약 이 글을 읽고 있다면, 우리가 전쟁에서 살아남아 재건을 시작했다는 의미일 것입니다. 전 세계의 상황이 악화일로로 치닫는 동안, 나는 몇 달에 걸쳐 내 친구이자 충직한 동반자와 함께 이 도서관을 만들었습니다. 당신이 이것을 읽고 있다는 사실은, 누군가가 살아남았다는 의미일 것입니다. 그러니 우리 문명의 유산을 당신과 나누도록 하겠습니다. 내 친구와 내가 수집한 우리 종족의 모든 문화적 업적을 여기에 모아 두었습니다. 그리고 당신이 이곳에서 처음 접하는 것이 내 사랑하는 친구의 모습이었으면 합니다.\"§!\n\n이 명판 밑에는 한 이족보행 포유류의 유해, 그리고 주둥이가 길며 다리가 네 개 달린 동물의 금속 조각상이 있습니다."
 terra.105.desc.earth: "우리 [Owner.GetLinguists]들이 '도서관'에 해당하는 문구를 '무기고'로 오역한 것 같습니다. '힘의 원천'이라는 문구가 지닌 의미를 오해한 것인데, 우리는 보관함을 열고 그 안에 있는 또 다른 외계어 문구를 접하고 나서야 오류를 깨달았습니다. §Y\"만약 이 글을 읽고 있다면, 우리가 전쟁에서 살아남아 재건을 시작했다는 의미일 것입니다. 전 세계의 상황이 악화일로로 치닫는 동안, 나는 몇 달에 걸쳐 내 친구이자 충직한 동반자, 월터와 함께 이 도서관을 만들었습니다. 당신이 이것을 읽고 있다는 사실은, 누군가가 살아남았다는 의미일 것입니다. 그러니 우리 문명의 유산을 당신과 나누도록 하겠습니다. 월터와 내가 수집한 우리 종족의 모든 문화적 업적을 여기에 모아 두었습니다. 그리고 당신이 이곳에서 처음 접하는 것이 내 사랑하는 친구의 모습이었으면 합니다.\"§!\n\n이 명판 밑에는 한 이족보행 포유류의 유해, 그리고 주둥이가 길며 다리가 네 개 달린 동물의 금속 조각상이 있습니다."
 terra.105.a: "조각상을 쓰다듬어 주세요."
 terra.105.b: "외계종 자료를 분류하세요."
 terra.105.c: "우리가 기대한 것은 무기입니다. 도서관과 조각상을 녹여서 미사일 재료로 쓰세요."
 #Deposit
 d_fungal_study_zone: "균류 연구 구역"
 d_fungal_study_zone_desc: "이곳에서 발견한 '감시' 버섯은 특이한 생체구조와 소통 방식을 갖춘, 무궁무진한 연구의 보고입니다."
 d_terraforming_blocker: "£blocker£ 테라포밍 잔여물"
 d_terraforming_blocker_desc: "테라포밍 사업 완료 실패로 인해 여러 구역에서 기이한 괴생명체가 나타났습니다."
 d_dayside_farm: "태양 면 태양광 발전소"
 d_dayside_farm_desc: "공전 주기와 자전 주기가 같은 이 행성의 태양 면에는 거대한 태양 발전 단지가 있어, 이곳 항성에서 끊임없이 쏟아지는 에너지를 이용합니다."
 d_radiotrophic_preserve: "방사선 영양 생물 보호 구역"
 d_radiotrophic_preserve_desc: "한 구획을 분리해 기압이 낮고 방사능이 강한 대기를 조성한 곳으로서, 이 행성의 토착 생물을 보존하고 있습니다."
 #Modifier
 fumongus_monitor_pops: "현지 균사체망"
 fumongus_monitor_pops_desc: "현지 균류로 이루어진 연결망을 이용해 해당 행성의 개척민들을 감시하는 데 성공했습니다."
 disinformation_protocols: "허위정보 공작 프로토콜"
 UBUME_BABY_CAT: "이상한 잔해"
 UBUME_BABY_CAT_DESC: "기원 불명의 잔해 지대가 스캐너에 감지되었습니다. 이 성계를 순찰하던 버려진 과학선과 관련이 있는 것일까요?"
 anomaly.6791.name: "유령선"
 anomaly.6791.desc: "$NAME_Hillos$에 위치한 잔해 지대를 모두 스캔했습니다. 유기체 및 비생물의 특성을 모두 지닌 이 잔해는 이제껏 보지 못한 화학적 구조를 지니고 있습니다.\n\n다만 잔해와 해당 성계를 순찰하던 수수께끼의 함선 사이에 어떤 관계가 있는지는 아직까지 분명하지 않습니다. 또한 함선 안에서는 생명 신호는커녕 어떠한 에너지 신호도 감지되지 않습니다. 더 적절한 명칭이 있다면 좋겠지만, 일단은 우리가 유령선을 발견한 듯합니다."
 anomaly.6791.a: "으스스하군요."
 anomaly.6792.name: "$NAME_Hillos_ship$의 아기"
 anomaly.6792.desc: "우리 연구진이 내린 결론에 따르면, 명령 로그에서 '$NAME_Hillos_ship$'라고 지칭하는 이 표류 함선은 $NAME_Hillos$ 성계에서 합성 생명체를 창조하기 위한 실험을 진행 중이었다고 합니다. 다만 반물질 유출이 발생해 승무원 전원은 물론 '신생아'까지 사망하고 말았습니다. 하지만 함선 체계 전체에 걸쳐 희미하게 감지되는 사이오닉 에너지로 미루어 보아, 사고가 발생하기 수 초 전에 이 합성 생명체의 '유령'이 함선을 장악한 듯합니다.\n\n이 갓 태어난 의식체는 지금까지 수백 년 동안 어미를 찾아 보람 없이 떠돌아다니고 있었을지도 모릅니다. 안타깝게도 지금으로서는 이 존재와 소통할 방법도, 안식을 얻도록 도와줄 방법도 없습니다. 당분간 이 함선은 $NAME_Hillos$ 성계를 계속 유령처럼 떠돌아다녀야 할 수밖에 없을 듯합니다."
 anomaly.6792.alt.desc: "우리 연구진이 내린 결론에 따르면, 명령 로그에서 '$NAME_Hillos_ship$'라고 지칭하는 이 표류 함선은 $NAME_Hillos$ 성계에서 합성 생명체를 창조하기 위한 실험을 진행 중이었다고 합니다. 다만 반물질 유출이 발생해 승무원 전원은 물론 '신생아'까지 사망하고 말았으며, 함선 체계 전체에 걸쳐 사이오닉 에너지가 감지되기도 했습니다. 사건의 진상은 이보다 복잡할 것이라는 느낌이 듭니다. 단순한 오작동을 넘어 훨씬 기이한 현상이 일어난 것일지도 모릅니다.\n\n이 합성 생명체가 잠재적 사이오닉 능력을 지니고 있었으며, 사고가 발생하기 수 초 전에 이 생명체의 '유령'이 함선을 장악한 것일 수 있습니다. 그렇다면 이 갓 태어난 의식체는 지금까지 수백 년 동안 어미를 찾아 보람 없이 떠돌아다니고 있었을지도 모릅니다. 안타깝게도 현재로서는 이 존재와 소통할 방법이 없습니다. 당분간 이 함선은 $NAME_Hillos$ 성계를 계속 유령처럼 떠돌아다녀야 할 수밖에 없을 듯합니다."
 anomaly.6792.alt_hive_robot.desc: "$NAME_Hillos$ 성계에 있는 함선에 대한 평가가 완료되었습니다. 복원한 함내 기록에 따르면, 명령 로그에서 '$NAME_Hillos_ship$'라는 이름으로 확인된 이 표류 함선은 합성 생명체를 창조하는 실험을 진행 중이었다고 합니다. 다만 반물질 유출이 발생해 승무원 전원은 물론 실험 대상 '신생아'까지 사망하고 말았습니다.\n\n우리 [Owner.GetTelepathPlural]들은 함선 체계 전체에 걸쳐 사이오닉 에너지를 감지했으며, 이를 통해 단순한 오작동을 넘어서는 현상이 발생했음을 알아냈습니다.\n\n이러한 에너지 흔적은 이 합성 생명체가 잠재적 사이오닉 능력을 지니고 있었으며, 사고 발생 직전에 그 능력을 발휘했을 가능성을 시사합니다. 그 결과 이 갓 태어난 의식체는 모체의 입력을 찾아 헤매게 된 것입니다. 하지만 추가 데이터 없이는 이 가설을 입증할 수 없기에, 더 많은 연구가 필요한 상황입니다."
 anomaly.6792.a: "애처롭군요."
 anomaly.6792.b: "실망스럽군요."
 anomaly.6793.name: "사이오닉 대화"
 anomaly.6793.desc: "$NAME_Hillos$ 성계에서 어떤 특이한 신호가 포착되었습니다. '사이오닉 주파수'라고밖에 설명할 수 없는 신호로, '유령선' $NAME_Hillos_ship$에서 애처로운 울음소리가 불규칙적으로 나오고 있던 것입니다. 울음소리는 우리가 이 함선과 그 안에 갇힌 갓 태어난 의식체를 처음 만난 이후 지금까지 계속되었던 듯합니다. 우리 제국이 최근 사이오닉 초월을 달성한 덕분에 이 의식체의 울음소리를 인지할 수 있게 된 모양입니다. 추가 조사를 진행하면, 의식체의 울음에 응답을 보낼 수 있을지 모릅니다."
 anomaly.6793.desc.hive_robot: "$NAME_Hillos$ 성계에서 어떤 특이한 신호가 포착되었습니다. 최근 동조한 [Root.GetTelepathPlural]들이 $NAME_Hillos_ship$ 함선으로부터 발신되는 신호를 감지하기 시작한 것입니다. 이 통신 신호는 생물학적 유아의 의사소통 방식과 유사하며, 최초 접촉 이후 계속해서 발신되었습니다. 최근 우리의 사이오닉 발전 덕분에 마침내 감지할 수 있게 된 것으로 보입니다.\n\n추가 조사를 진행하면, 이 개체와 더 원활하게 소통할 수 있을지도 모릅니다."
 anomaly.6794.name: "우리 아기 벌써 말도 하네"
 anomaly.6794.desc: "몇 달간의 고생스러운 연구 끝에, 우리 텔레파시 능력자들이 유령선 $NAME_Hillos_ship$에 깃든 의식체와 교신하는 데 성공했습니다. 이 합성 생명체는 기초적인 어휘만 구사할 수 있었지만, 감정과 흉내를 통해 자신을 표현할 수 있었습니다. 이 '아이'의 외로움, 그리고 마침내 다른 정신과 연락이 닿았다는 데에 대한 기쁨은 피부로 느껴질 정도였습니다. 아이는 우리 과학선이 마음에 들었는지, 과학선과 나란히 $NAME_Hillos$ 성계를 장난스레 유영했습니다. 마치 어미 주위를 맴도는 아기 고래 같은 모습이었습니다. $NAME_Hillos$ 성계의 유령선 사태가 마침내 행복한 결말을 맞게 되었습니다."
 anomaly.6794.desc.hive_robot: "몇 달간의 광범위한 연구 끝에, 우리 [Root.GetTelepathPlural]들이 유령선 $NAME_Hillos_ship$에 깃든 의식체와 교신하는 데 성공했습니다. 이 합성 생명체는 기초적인 어휘만을 구사할 수 있었지만, 감정과 흉내를 통해 자신을 표현할 수 있었습니다.\n\n이 '아이'의 외로움, 그리고 마침내 다른 정신과 연락이 닿았다는 데에 대한 기쁨은 피부로 느껴질 정도였습니다. 또, 아이는 우리 과학선이 마음에 들었는지, 과학선과 나란히 $NAME_Hillos$ 성계를 장난스레 유영했습니다. 마치 어미 주위를 맴도는 아기 고래 같은 모습이었습니다. 아이가 발생시키던 $NAME_Hillos$ 성계의 이상 현상도 사라졌습니다."
 anomaly.6794.a: "잠시만요. 눈물이 제멋대로 나오는군요."
 anomaly.6794.a.hive_robot: "흥미로운 존재군요."
 anomaly.6795.desc: "우리 제국 최고의 초능력자들로부터 소식이 들어왔습니다. $NAME_Hillos$ 성계에 있는 사이오닉 의식체에 관해 알게 된 이들은 직접 유령선 $NAME_Hillos_ship$에 깃들어 있는 존재와 교신을 시도했다고 합니다. 몇 달 동안이나 고생스러운 시도를 이어간 끝에, 초능력자들은 마침내 교신에 성공했습니다.\n\n이 합성 생명체는 기초적인 어휘만 구사할 수 있었지만, 감정과 흉내를 통해 자신을 표현할 수 있었습니다. 이 '아이'의 외로움, 그리고 마침내 다른 정신과 연락이 닿았다는 데에 대한 기쁨은 피부로 느껴질 정도였습니다. 아이는 이제 자신의 말을 들어주는 모든 존재와 사이오닉 대화를 나누면서 즐겁게 $NAME_Hillos$ 성계를 유영하고 있습니다."
 anomaly.6795.desc.hive_robot: "몇 달간의 연구 끝에, 우리 [Root.GetTelepathPlural]들이 $NAME_Hillos_ship$ 함선을 장악한 사이오닉 의식체와 접촉하는 데 성공했습니다.\n\n이 합성 생명체는 기초적인 어휘만 구사할 수 있었지만, 다른 사이오닉 정신과 연락이 닿았다는 사실에 대해 흔히 '기쁨'으로 해석되는 감정은 표현할 수 있었습니다. 현재로서는 뚜렷한 위협 요소가 없어, $NAME_Hillos$ 성계의 함선 안에 그대로 내버려 두었습니다."
 anomaly.6795.a: "해피 엔딩이군요."
 #The Mask of Transformation
 mask_of_transformation: "변화의 가면"
 site_transformation_dig: "지붕에 담긴 메시지"
 site_transformation_intro: "우리 과학자들이 [From.Planet.GetName]에서 특이한 사실을 발견했습니다. 이 열대 행성의 표면은 울창한 밀림으로 덮여 있는데, 수천 년 된 거목들이 밀림으로 된 지붕을 뚫고 올라와 그 잎을 왕관처럼 높은 곳에 드리우고 있는 것입니다.\n\n언뜻 보기에 이 거목들은 불규칙적으로 분포되어 있는 듯합니다. 하지만 추가 분석 결과, 거목은 수학적으로 정확하게 배치된 것으로 나타났으며, 오래전에 사라진 문명이 심은 것일 가능성이 높습니다. 게다가 과학 팀장은 거목의 분포 패턴이 일련의 좌표일 가능성이 있다고 믿고 있습니다. 밀림 깊은 곳에 있는 어떤 미탐사 지점을 가리키는 좌표라는 것입니다."
 ancrel.15010.name: "지붕에 담긴 메시지"
 ancrel.15010.desc: "우리 과학자들이 [From.Planet.GetName]에서 특이한 사실을 발견했습니다. 이 열대 행성의 표면은 울창한 밀림으로 덮여 있는데, 수천 년 된 거목들이 밀림으로 된 지붕을 뚫고 올라와 그 잎을 왕관처럼 높은 곳에 드리우고 있는 것입니다.\n\n언뜻 보기에 이 거목들은 불규칙적으로 분포되어 있는 듯합니다. 하지만 추가 분석 결과, 거목은 수학적으로 정확하게 배치된 것으로 나타났으며, 오래전에 사라진 문명이 심은 것일 가능성이 높습니다. 게다가 과학 팀장은 거목의 분포 패턴이 일련의 좌표일 가능성이 있다고 믿고 있습니다. 밀림 깊은 곳에 있는 어떤 미탐사 지점을 가리키는 좌표라는 것입니다."
 ancrel.15000.name: "웰컴 투 더 정글"
 ancrel.15000.desc: "[From.Planet.GetName] 지표면을 완전히 가린 밀림 지붕 때문에, 공중 관측을 통해 밀림으로 들어갈 길을 찾는다는 계획은 실패로 돌아갔습니다. 밀림 지붕 아래에는 사지가 없는 포식자, 얼굴이 처진 영장류, 흡혈 곤충떼 등 온갖 생물이 번성하고 있습니다. 또한 숲 바닥은 양질토로 되어 있고 악취가 진동하는 웅덩이가 있어, 탐사가 좀처럼 진척되지 않고 있습니다. 게다가 높은 식물 밀집도 탓인지, 아니면 확인되지 않은 전기 간섭 때문인지, 탐사 장비 대부분이 제대로 작동하지 않고 있습니다.\n\n과학 팀장은 숲을 뚫고 길을 내는 방법이 있지만 진행 속도가 느릴 것이라고 보고 있습니다."
 ancrel.15000.a: "알겠습니다."
 ancrel.15001.name: "사이오닉 변화"
 ancrel.15001.desc: "토양 분석 결과, [From.Planet.GetName]에서는 최근 100주기 이내에 놀라운 기후 변화가 발생한 것으로 나타났습니다. 오늘날에 보이는 울창한 밀림과는 달리, 이 행성은 한때 바위투성이의 황량한 행성이었다는 것입니다. 과학 팀장은 이곳에 보이는 거목이 그 원인인 것으로 파악하고 있습니다. 공명 영상 스캔 결과, 나무 수액 안에 사이오닉 에너지가 감지되었습니다. 나무의 방대한 뿌리망이 지하수로부터 빨아들이는 이 에너지는, 광합성과 유사한 과정을 통해 행성 대기 중으로 확산됩니다. 이것이 바로 과학 팀의 장비가 오작동을 일으킨 원인일 가능성이 높습니다.\n\n흥미로운 점은, 밤에 위성의 빛이 내리쬐면 사이오닉 에너지의 확산이 빨라진다는 것입니다. 날이 맑은 밤에는 공기 자체가 진동하는 것처럼 느껴지는데, 과학 팀이 목적지에 다다를수록 이 현상은 더욱 강해지고 있습니다. 지금까지 보았던 어떤 현상과도 다릅니다."
 ancrel.15001.a: "아주 흥미롭군요."
 ancrel.15002.name: "동굴"
 ancrel.15002.desc: "추적하던 좌표에 마침내 다다른 과학 팀은 밀림 지붕 아래에 숨겨진 굽이치는 계곡을 발견했습니다. 동그란 동굴 입구에서 빠르게 쏟아져 나오는 물줄기는 지하에 있는 거대한 샘에서 나온 것으로 보입니다. 과학 팀은 수천 년 된 바위를 깎아 만든 계단을 위태롭게 내려간 끝에, 한 지하 터널에 이르렀습니다.\n\n동굴의 벽과 천장에는 표의 문자가 빼곡하게 들어차 있었습니다. 그리고 그중에서도 유독 둥그런 인간류 생물의 얼굴이 돋보였습니다. 번역 알고리즘을 통해 문자를 대부분 해독하는 데 성공했으며, 얼굴 기호는 이 행성의 위성을 나타낼 가능성이 높은 것으로 판단됩니다.\n\n동굴 안에는 엄청난 수준의 사이오닉 에너지가 감지됩니다. 안타깝게도 안으로 들어가는 길은 수백 년 전에 발생한 낙석 사고로 막혀 있지만, 시간만 충분하다면 그 너머로 가는 길을 찾을 수 있을 것입니다."
 ancrel.15002.a: "얼른 파내세요!"
 ancrel.15003.name: "기둥"
 ancrel.15003.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 우리 과학 팀이 드디어 개가를 올렸습니다! 동굴 하층에 진입한 뒤 넓은 반구형 방에 도착한 것입니다. 이곳에서 강물은 작은 섬을 중앙에 두고 나누어 흐르며, 섬 가운데에는 희귀 크리스탈로 이루어진 석순이 있습니다. 수천 년 동안 한 방울씩 떨어진 물이 만들어낸 이 기둥이 바로, 이 행성의 기이한 사이오닉 에너지가 나오는 원천인 것으로 보입니다. 과학 팀은 이곳에서 종교 의식을 거행한 흔적 외에, 기둥 주변에 흩어진 여러 작은 의례용 유물을 발견했습니다. 또한 다위상 스캔 결과, 기둥의 밑부분에 둥근 물체가 들어 있는 것으로 밝혀졌습니다. 이 유물을 꺼내는 데 성공하기만 한다면, 이 신비한 장소의 정체를 규명할 수 있으리라는 기대가 높습니다."
 ancrel.15003.a: "신중하게 진행하세요."
 ancrel.15003.b: "이 힘의 원천을 밝혀내야 합니다."
 ancrel.15004.name: "변화의 가면"
 ancrel.15004.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 과학 팀이 마침내 성공을 거두었습니다! 크리스탈 기둥을 발굴하는 작업이 드디어 완료된 것입니다. 기둥 안에는 아주 오래된 인간형 가면이 보존되어 있었는데, 가면 뒷면에 새겨진 문자는 이 유물을 '변화의 가면'이라고 지칭하고 있습니다. 이는 이 행성의 위성이 위상 변화함에 따라 조수 간만이 바뀌는 변화의 힘을 지칭하는 듯합니다.\n\n가면 자체도 굉장한 사이오닉 특성을 지니고 있는 데다, 행성의 빠른 기후 변화가 바로 이 가면 때문일 가능성이 높습니다. 크리스탈 기둥을 만들고 밀림에 심은 나무로 정교한 지도를 남겨 놓은 존재들은 이 유물을 기리고 지키려 했던 것이 분명합니다. 과학 팀은 이 가면을 올바로 활용한다면 우리 제국은 행성 전체를 변화시킬 능력을 가지게 될 것이라고 이론을 제시했습니다."
 ancrel.15004.a: "믿을 수가 없군요."
 ancrel.15005.name: "기둥, 깨지다!"
 ancrel.15005.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 우리 과학 팀이 크리스탈 석순에서 유물을 발굴하는 데 실패했습니다. 열의가 앞섰던 탓인지, 작업으로 인해 기둥이 깨진 것입니다. 설상가상으로 안에 있는 유물은 형태를 알아볼 수 없을 정도로 손상을 입었고, 방에 있던 사이오닉 에너지는 전부 사라지고 말았습니다.\n\n크리스탈 자체가 굉장한 가치를 지니고 있다는 점은 그나마 위안거리라고 할 수 있겠습니다. 이 장소를 만든 선구자 문명의 진정한 의도를 알 길은 이제 없지만, 최소한 완전한 헛수고는 아니었던 것이죠."
 ancrel.15005.a: "실망스럽지만, 소득은 있었군요."
 ancrel.15006.name: "기습!"
 ancrel.15006.desc: "[From.Planet.GetName]에 위치한 우리 과학 팀으로부터 비상 신호가 들어왔습니다! 밀림에 억지로 진입하려는 과정에서 일부 토착 동물종의 성질을 제대로 건드린 듯합니다.\n\n며칠 동안 팀원들은 야간에 덤불 사이로 어두운 무언가가 언뜻 빠르게 지나가는 것을 목격했습니다. 그리고 보름달이 뜨기 전날 밤, 유인원과 비슷한 생물 무리가 막대기를 휘두르고 비명을 지르며 과학 팀을 덮쳤습니다. 과학 팀의 첨단 기술 앞에 동물들은 얼마 안 가 숲속으로 퇴각했지만, 그 과정에서 팀원 일부가 납치되고 말았습니다. 소식에 따르면, 납치된 팀원들의 비명은 그 두꺼운 밀림조차 뚫고 들릴 정도였다고 합니다.\n\n이러한 위험에도 불구하고, [Root.GetLeaderName] 과학 담당관은 탐사를 계속 진행하겠다는 의지를 밝혔습니다."
 ancrel.15006.a: "걱정되는군요."
 ancrel.15007.name: "분실물"
 ancrel.15007.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 과학 팀으로부터 보고가 들어왔습니다. 미로와 같은 밀림에서 길을 찾는 일이 당초 예상보다 훨씬 까다롭다고 합니다. 과학 팀은 갑자기 나타난 늪과 두꺼운 덩굴을 뚫고 앞으로 나아가려던 중, 아주 지능이 높은 유인원과 만나게 되었습니다. 길들인 기제류 동물의 등에 올라탄 이 생물은 나무 사이를 지나면서 팀원들이 정글에서 가장 험한 곳을 빠져나올 수 있도록 안내해 주었습니다. 또한 거대 수목의 뿌리에 먹을 수 있는 곤충 애벌레가 풍부하게 있다는 것을 알려 주었습니다. 유인원의 손짓이 활발해지는 것을 보면, 이 행성에서는 별미에 해당하는 듯합니다. 무엇보다도 유인원의 안내 덕분에 과학 팀이 숲 바닥에서 여러 유물을 발견해, 이 행성의 선구자 문명에 관한 증거를 추가로 찾아낼 수 있었습니다."
 ancrel.15007.a: "그 유인원 친구, 마음에 드네요!"
 ancrel.15008.name: "덤불숲 파티"
 ancrel.15008a.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 과학 팀이 난관에 봉착했습니다. 나무 아래에 굽이쳐 흐르는 계곡물을 발견하면서, 탐사가 거의 중지된 것입니다. 계곡을 흐르는 격류에는 날카로운 돌이 섞여 있어, 과학 팀이 선택한 경로로는 통과가 불가능한 것으로 드러났습니다. 그런데 계곡을 피하려 우회한 결과 놀라운 소득을 얻었습니다. 매우 붙임성이 좋은 토속 유인원 무리와 만나게 된 것입니다. 이마가 비스듬한 이 생물들은 매우 즐겁게 탐사대를 대접해 주었고, 매일 밤 아주 영양가 높은 발효 열매를 잔뜩 짊어지고 팀원들을 찾아왔습니다. 덕분에 과학 팀의 사기는 어느 때보다 높아졌지만, 탐사 진척은 여전히 더딜 뿐입니다. 과학 팀장의 보고에 따르면, 팀원 사이에서 우려스러울 정도로 의욕이 떨어지는 현상이 나타나고 있다고 합니다."
 ancrel.15008b.desc: "[From.Planet.GetName]에서 탐사를 진행 중인 과학 팀이 난관에 봉착했습니다. 나무 아래에 굽이쳐 흐르는 계곡물을 발견하면서, 탐사가 거의 중지된 것입니다. 계곡을 흐르는 격류에는 날카로운 돌이 섞여 있어, 과학 팀이 선택한 경로로는 통과가 불가능한 것으로 드러났습니다. 그런데 계곡을 피하려 우회한 결과 놀라운 소득을 얻었습니다. 매우 붙임성이 좋은 토속 유인원 무리와 만나게 된 것입니다. 이마가 비스듬한 이 생물들은 매우 즐겁게 탐사대를 대접해 주었고, 매일 밤 아주 영양가 높은 발효 열매를 잔뜩 짊어지고 팀원들을 찾아왔습니다. 이들이 선물한 음식을 소화할 수는 없지만, 팀원들은 유인원 무리와 친해져 임무는 등한시한 채 이들과 어울리는 데 열을 올리고 있습니다."
 ancrel.15008.a: "일 안 하고 뭣들 하는 짓입니까?"
 engineered_nature: "설계된 자연"
 engineered_nature_desc: "이 [Root.GetPlanetMoon]은 거주민들에게 형식과 실질을 모두 만족하는 형태로 설계되었습니다."
 second_home: "제2의 고향"
 second_home_desc: "이 [Root.GetPlanetMoon]은 이곳을 만든 종족의 모성과 놀라우리만치 닮아 있습니다."
 intentionally_tidally_locked: "고의적 동주기 자전"
 intentionally_tidally_locked_desc: "이 행성은 테라포밍 과정에서 의도적으로 공전주기와 자전주기를 동일하게 맞추었습니다. 태양 면에서 얻을 수 있는 막대한 에너지를 이용하기 위한 것이었습니다."
 perfect_organization_modifier: "완벽한 조직"
 perfect_organization_modifier_desc: "이 [Root.GetPlanetMoon]의 모든 요소는 완벽하게 조직되었기 때문에 개별 의식이 있는 존재가 이곳에 오면 엄청난 괴로움을 느낍니다."
 imperfect_organization_modifier: "불완전한 조직"
 imperfect_organization_modifier_desc: "이 행성은 한때 완벽하게 조직되어 있어 주민들이 괴로움을 호소할 정도였다고 합니다."
 paradise_made: "직접 만든 낙원"
 paradise_made_desc: "이 [Root.GetPlanetMoon]은 그 창조자 종족이 꿈꾼 약속의 땅의 모습을 본떠 테라포밍한 곳입니다."
 #lostsoulanomaly
 lost_soul_cat: "사라진 영혼"
 lost_soul_cat_desc: "심각한 손상을 입은 채 우주에서 표류 중인 이족 보행 로봇을 발견했습니다. 로봇의 에너지원이 무엇인지는 파악하지 못했지만, 메모리에서 정보를 회수할 수 있을지 모릅니다."
 anomaly.6786.name: "사라진 영혼"
 anomaly.6786.desc: "우주에서 표류 중인 이족 보행 로봇을 발견했습니다. 로봇의 안면 판은 별다른 것 없이 밋밋하며, 금속 외장은 손상되어 있습니다. 또한 예비 스캔상으로는 동력이 남아 있는 것으로 나타나지만, 동력원은 우리가 쓰는 것과 전혀 다릅니다. 내부 회로를 살펴보면 예전 기억이 들어 있을 수도 있지만, 로봇을 다시 충전하고 정보를 번역하려면 시간이 필요합니다."
 anomaly.6786.a: "로봇을 스캔하세요."
 anomaly.6786.a.tooltip: "§L당신이 무엇을 기억하고 있는지 살펴봅시다, 우주 여행자.§!"
 anomaly.6786.b: "그냥 놔두세요."
 anomaly.6786.b.tooltip: "§L안녕, 고철 덩어리.§!"
 anomaly.6787.name: "오래된 영혼"
 anomaly.6787.desc: "갖은 노력 끝에, 로봇의 동력 공급 장치를 재충전하고 메모리 뱅크를 스캔할 수 있었습니다. 다만 안타깝게도 손상이 너무 심해 일관된 정보를 회수하는 것은 불가능합니다. 후속 연구를 진행하고 비슷한 로봇이 더 있는지 찾아볼 수 있지만, 이 기계 조난자의 운명은 앞으로도 수수께끼로 남을 것입니다."
 #TEMPORAL PRISM
 TEMPORAL_PRISM_CAT: "특이한 시간 변동"
 TEMPORAL_PRISM_CAT_DESC: "[From.GetName] 부근에서 특이한 시공간 변동이 감지되었습니다. 추가 분석을 권장합니다."
 anomaly.6788.name: "시간 프리즘"
 anomaly.6788.desc: "[From.GetStarName] 성계에서 나타난 시간 변동을 분석한 결과, 놀라운 사실이 드러났습니다. 그 정체는 바로 우주에 떠 있는 거대한 프리즘이었던 것입니다. 이 프리즘은 빛이 아니라 시간을 굴절시킵니다. [Root.GetName] 승무원들은 입사각에 따라 시간을 다른 속도로 경험하게 된다고 보고했습니다. 스캔 결과 일부 승무원은 빠르게 노화한 반면, 다른 이들은 원래 나이보다 며칠, 심지어 몇 년까지 젊어진 것으로 나타났습니다.\n\n프리즘을 연구하여 시간의 성격과 특성을 더욱 깊이 이해하게 되었지만, 프리즘의 기원과 목적 자체는 여전히 수수께끼입니다."
 #snek
 colony.8099.name: "간교한 뱀"
 colony.8099.desc: "[root.GetName]에 위치한 우리 식민지 지하로부터 생명체 무리가 땅속을 뚫고 올라오는 것을 감지했습니다. 무리는 조만간 지표면에 모습을 드러낼 것입니다. 우리 과학자들은 지표면에서 발생한 진동 때문에 일종의 지하 수면 상태에 있던 이 생물이 깨어난 것이라고 이론을 세웠습니다."
 colony.8099.a: "과학자들과 병사들을 동원하세요."
 colony.9100.name: "능구렁이 같은 속임수"
 colony.9100.desc: "[root.GetName]의 개척민들이 보고한 바에 따르면, 일부 주택이 뱀으로 뒤덮였고 많은 건물에서 동력이 끊겼다고 합니다. 이 현상들 사이에 관계가 있는지 알아봐야 합니다."
 colony.9100.a: "이 흥미로운 생물들을 관찰하세요."
 colony.9100.b: "불을 질러서 뱀을 식민지에서 내쫓으세요."
 colony.9101.desc: "이 뱀들은 전기 에너지원에 이끌리고 있습니다. 아마 양분이나 쾌락을 좇는 듯합니다. 우리가 사용하는 에너지원을 바꾼다면, 뱀들의 입맛에 맞지 않거나... 뱀들에게 고통을 줄 수도 있습니다."
 colony.9102.desc: "[root.GetName]에서 나타난 뱀 무리는 공격성은 줄어들었지만 개척민들의 장비를 해체하는 데 열중하고 있습니다. 장비를 해체하는 솜씨로 보아, 조악하게나마 지능은 갖춘 것으로 짐작할 수 있습니다."
 colony.9103.name: "불길한 뱀 소리"
 colony.9103.desc: "우리가 [root.GetName]의 식민지에 쳐들어온 뱀 무리를 관찰하듯, 이들도 우리를 지켜보고 있었습니다. 이 생물들이 우리 차량, 컴퓨터, 채굴 장비에 숨어들어 마구잡이로 작동시키고 있습니다."
 colony.9103.desc.science: "우리가 [root.GetName]의 식민지에 쳐들어온 뱀 무리를 관찰하듯, 이들도 우리를 지켜보고 있었습니다. 이 생물들이 우리 차량, 컴퓨터, 채굴 장비에 숨어들어 마구잡이로 작동시키고 있습니다.\n\n이 무족 파충류들은 단순한 언어를 사용하는 것으로 파악되었습니다. 좀 더 외교적인 명칭을 쓰기 위해, 우리 과학자들은 이 생물들을 '오피드'라고 부르기로 했습니다. 이들은 스스로를 '히스스스스스'라 부르지만, 우리가 발음을 잘못하면 화를 내며 더욱 심하게 물어뜯는 일이 종종 발생하기 때문입니다."
 colony.9103.desc.soldier: "우리가 [root.GetName]의 식민지에 쳐들어온 뱀 무리를 관찰하듯, 이들도 우리를 지켜보고 있었습니다. 이 생물들이 우리 차량, 컴퓨터, 채굴 장비에 숨어들어 마구잡이로 작동시키고 있습니다.\n\n정찰병들 말로는, 이 '무족 파충류'들은 지하 깊숙한 곳에 살고 있다고 합니다. 또한, 화염 방사기를 사용하면 이들을 효과적으로 저지할 수 있습니다. 이 뱀들은 우리를 싫어하지만, 불은 더 싫어하니까요."
 colony.9103.a: "우리 동력원을 식량으로 삼게 놔두세요. 만국어 번역기를 켭시다."
 colony.9103.b: "기습 부대를 투입하고 화염 방사기로 공격하세요."
 colony.9104.name: "지하 세계"
 colony.9104.desc: "[root.GetName]에서 발견한 뱀 무리가 우리 채굴 장비를 이동 수단으로 개조해 지하 세계와 우리가 사는 지표면 사이를 이동하고 있습니다. 이로 인해 우리 생태계가 심각한 손상을 입었습니다.\n\n식민지의 과학자들은 이 침공자 뱀들을 '히스'라고 부르기 시작했습니다. 군인들이 부르는 이름이 따로 있지만, 대부분 여기에서 언급하기에는 적절치 않은 이름입니다."
 colony.9104.desc.science: "[root.GetName]에서 발견한 뱀 무리가 우리 채굴 장비를 이동 수단으로 개조해 지하 세계와 우리가 사는 지표면 사이를 이동하고 있습니다. 이로 인해 우리 생태계가 심각한 손상을 입었습니다.\n\n이 '히스'들이 계속 난동을 피우고 있지만, 우리 과학자들은 이것이 교란 전술이지 않을까 의심하고 있습니다. 무족 파충류들이 가져가지 않은 채굴 장비들도 있으므로, 남은 장비의 가동을 중단하고 수리를 진행하는 편이 좋을 듯합니다."
 colony.9104.desc.soldier: "[root.GetName]에서 발견한 뱀 생물들이 우리 채굴 장비를 이동 수단으로 개조해 지하 세계와 우리가 사는 지표면 사이를 이동하고 있습니다. 이로 인해 우리 생태계가 심각한 손상을 입었습니다.\n\n이 무족 파충류들의 동기가 무엇인지는 모르지만, 병사들은 채굴을 계속해야 한다고 주장하고 있습니다. 경비원과 병사들을 잃을 수도 있지만, 뱀 한 마리도 우리가 사는 곳과 장비에 들어오게 할 수 없습니다."
 colony.9104.a: "나머지 채굴 장비를 멈추세요."
 colony.9104.b: "화력을 아끼니까 이런 일이 생기는 겁니다."
 colony.9105.name: "뱀 창궐과 황폐화"
 colony.9105.desc: "뱀 침공에 의한 무자비한 파괴, 그리고 [root.GetName]에 대한 철저한 채굴 작업으로 인해 행성 생태계가 완전히 황폐화되었습니다."
 colony.9106.name: "발전과 선물"
 colony.9106.desc: "[root.GetName]에서 발견한 뱀들이 이제는 채굴 장비를 타고 지하에 있는 보금자리와 지표면 사이를 자유롭게 오가고 있습니다. 우리의 기술이 이들에게 새로운 방향으로 능력을 키워준 것일까요?"
 colony.9106.desc.science: "[root.GetName]에서 발견한 뱀들이 이제는 채굴 장비를 타고 지하에 있는 보금자리와 지표면 사이를 자유롭게 오가고 있습니다. 우리의 기술이 이들에게 새로운 방향으로 능력을 키워준 것일까요?\n\n우리 과학자들에 따르면, '히스'라 불리는 이 생물들은 각 이동 수단 근처에 동일한 기호를 새겨 놓았다고 합니다. 이들에게도 조악하게나마 문자 언어가 있는 듯합니다."
 colony.9106.a: "이 새로 만들어진 뱀굴에서... 광물이 나왔다는군요!"
 colony.9107.name: "뱀 함선"
 colony.9107.desc: "[root.GetName]에 서식하는 뱀들은 함선이 성계에 들어오기를 끈기 있게 기다리고 있었습니다. 우리 식민지에 함선을 착륙시켜도 되겠다고 생각한 누군가 덕분에, 이 함선은 이제 뱀 천지가 되었습니다."
 colony.9107.a: "그 함선을 타고 다른 데로 가게 두세요."
 colony.9107.a.tooltip: "고도의 지능을 갖춘 이 무족 파충류 무리가 우주에 진출하면, 이들이 결국 어떤 운명을 맞을지 궁금해집니다."
 colony.9107.b: "뱀이 점령한 함선을 파괴하세요."
 colony.9107.b.tooltip: "고도의 지능을 갖춘 무족 파충류 무리가 우주선에 이끌려 이동하고 있습니다. 이들이 배에 타게 놔둔 다음... 반응로에 과부하를 일으키면 됩니다."
 colony.9108.name: "별나라를 향하여"
 colony.9108.desc: "우주선 한 척이 우리 측 감지 장비를 몰래 지나 주변 성계로 미끄러지듯 나아갔습니다. 무족 파충류 무리는 [root.GetName]에 여러 지하 이동 수단과 풍부한 광물을 남기고 떠났습니다."
 colony.9108.a: "안녕, 뱀 친구들."
 #colony.9108.a.tooltip: "§LYour story has been... uplifting.§!"
 colony.9109.name: "히스의 역사"
 colony.9109.desc: "[root.GetName]에 위치한 최대 식민지 외곽에서 거대한 폭발이 일어났습니다. 여전히 경계는 늦출 수 없지만, 지금까지 확인한 바에 따르면 무족 파충류 침공자는 남김없이 소각된 것 같습니다."
 colony.9109.a: "안녕, 뱀 친구들."
 #colony.9109.a.tooltip: "§LYour long tale has ended. You're... history.§!"
 #VENDING MACHINE
 VENDING_MACHINE_CAT: "초대"
 VENDING_MACHINE_CAT_DESC: "신호기가 [From.GetName] 궤도를 돌면서 여행자에게 손짓하고 있습니다. 이 소행성에는 목적 불명의 거대한 금속 기둥이 있습니다."
 anomaly.7000.name: "수수께끼의 기둥"
 anomaly.7000.desc: "[From.GetName]에서 발견한 기둥은, 그곳을 조사하려 보낸 과학선이 왜소해 보일 만큼 거대합니다. 이 웅장하고 매끈한 장방형의 금속 기둥을 한때 화려하게 장식했을 염색 문양은 이제 얼룩으로 남아 있을 뿐입니다.\n\n이 기계의 측면에 작은 동력 단자가 있는 것을 보니, 에너지 크레딧을 어느 정도 넣으면 그 안에 숨겨진 비밀을 알 수 있을 것 같습니다."
 anomaly.7000.a: "기계를 가동하세요."
 anomaly.7000.b: "그냥 놔두는 것이 좋겠군요."
 anomaly.7010.name: "깨어난 기계"
 anomaly.7010.desc.base: "기계가 떨리더니, 매끈한 외벽 내부의 고대 기계 장치가 덜커덩 소리를 내며 움직였습니다. 한참 동안 기계음이 들리더니 극적인 침묵이 이어진 후, 금속 패널이 미끄러져 열리고 우주선만 한 원통이 기계에서 굴러 나왔습니다...\n\n"
 anomaly.7010.a: "이 음료에 특허를 출원하고 전 은하계에 판매하세요."
 anomaly.7010.desc.full: "원통에는 고대의 음료가 들어 있었습니다. 그 모든 세월에도 불구하고 기적적으로 잘 보존되어 있습니다."
 anomaly.7010.desc.full.megacorp: "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ 시장 조사 결과, 오랫동안 잊혀 있던 이 음료는 현재 생물 개체가 마실 수 있는 모든 제품군보다 20% 더 맛이 좋은 것으로 나타났습니다."
 anomaly.7010.desc.full.nonbio: "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ 이 음료에는 우리 종족 기준으로 양분이 전혀 없지만, [Owner.GetScientistPlural]들은 이것을 더욱 귀한 자원인 §Y외계 가스§!로 전환하는 데 성공했습니다."
 anomaly.7010.desc.full.bio: "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ 우리 [Owner.GetScientistPlural]들은 손쉽게 이 음료를 재현하는 데 성공했습니다. 음료를 철저히 검사한 과학자들에 따르면, 이 음료는 안전하고 영양가가 높으며, 결정적으로 맛이 좋다고 합니다."
 anomaly.7010.desc.empty: "$anomaly.7010.desc.base$원통 안은 비어 있고, 내용물은 녹슬어 버린 뚜껑 틈으로 증발한 지 오래입니다. 다만 용기 그 자체는 멀쩡한 편이며, 용기에 쓰인 정체불명의 합금은 우리가 함선에 사용하는 금속에도 뒤쳐지지 않습니다."
 anomaly.7010.desc.rot.bio: "$anomaly.7010.desc.base$원통 안에는 무척이나 끔찍한 액체가 들어 있습니다. 한때는 맛도 좋고 영양가도 풍부했지만, 오랜 시간이 흐르면서 상해 버린 것입니다. 우리 [Owner.GetScientistPlural]들은 원통 안의 물질을 연구해 과거에 이 물질을 즐겨 마셨던 외계종의 생체 구조를 파악하고자 합니다. 물론 악취를 먼저 해결해야 하겠지만요."
 anomaly.7010.desc.rot.nonbio: "$anomaly.7010.desc.base$원통 안에는 자당, 구연산과 그 밖의 생물 화합물이 혼합된 액체가 들어 있었습니다. 우리 [Owner.GetScientistPlural]들은 탄소 기반 생명체가 자신들이 섭취하기 위해 만든 영양물질이 아닌가 생각하고 있습니다. 자세한 연구를 진행하면 지금은 사라진 이 종족의 생체 구조에 관한 단서를 더 발견할 수 있을 것으로 기대됩니다."
 #GREED IS BAD
 colony.9050.name: "뜻밖의 광맥"
 colony.9050.desc: "지리 탐사 결과, [Root.GetName]에 당초 예상보다 광물이 풍부한 것으로 드러났습니다. 감지기를 보정해 지하 깊은 곳까지 투시했더니, 유망한 채굴 지점이 여러 군데가 나타난 것입니다. 탐사 활동에 추가 자원을 투입하면, 지하 깊은 곳에서 유용한 광맥을 더 발견할지도 모릅니다."
 colony.9050.a: "자금은 못 줍니다. 어서 파기나 하세요."
 colony.9050.b: "자금을 지원하겠습니다. 더 깊이 탐사하세요."
 colony.9055.name: "깊은 광맥"
 colony.9055.desc: "[Root.GetName]의 지하를 탐사하기란 쉽지 않았습니다. 우리가 쓰는 스캐너가 이곳 지반의 구성 물질에 잘 반응하지 않는 데다, 지층이 계속 변화해 스캐너를 매번 다시 조정해야 하기 때문입니다. 그렇지만 고품질 광맥이 묻혀 있고 채굴이 보다 용이한 광맥을 여러 군데 발견했습니다. 깊은 곳에 묻혀 있기 때문에 채굴 작업이 평소보다 복잡해지겠지만, 이 정도로 물러설 우리가 아닙니다. 다만 여기에서 탐사 임무를 더 수행한다고 해도 광맥을 더 발견할 수 있다는 보장은 없습니다."
 colony.9055.a: "채굴 작업을 시작하세요."
 colony.9055.b: "광맥이 분명 더 있을 겁니다."
 colony.9060.name: "너무 적거나, 너무 깊거나"
 colony.9060.desc: "[Root.GetName]에서 광물 탐사를 진행했으나 뚜렷한 성과를 내지 못했습니다. 감지된 광물은 있었지만 너무 깊이 묻혀 있거나, 매장량이 너무 적거나, 불안정한 지반 너머에 있었기 때문입니다. 해당 광맥에 대한 예상 채굴 비용은 채굴 수익보다 높습니다. 다만 이전에 찾은 광맥만으로도 매장량이 엄청나기 때문에 수백 년까지는 아니더라도 수십 년 동안은 채굴할 수 있을 것입니다."
 colony.9060.a: "알겠습니다. 채굴을 시작하세요."
 colony.9065.name: "더 많은 광물"
 colony.9065.desc: "[Root.GetName] 지표면 아래에 묻혀 있는 광물은 아무리 깊은 곳에 있더라도 전부 찾아내 채굴할 것입니다. 우리는 그런 종족입니다. 다른 종족이라면 지반이 약하다고, 너무 깊다고, 운송 터널 운영이 너무 어렵다고 포기하겠지만, 우리는 포기하지 않습니다. 지하 세계는 우리의 고향이며, 어느 곳을 찾아야 하는지만 안다면 자원을 얻을 수 있습니다. 아래로 내려갈수록 광물의 질과 양이 올라갑니다. 심지어, 최근 채취한 표본을 보면 더 깊은 곳에 희귀 크리스탈이 있을 것으로 보입니다."
 colony.9065.a: "탐사는 충분히 했습니다. 채굴을 시작하세요."
 colony.9065.b: "크리스탈을 반드시 손에 넣겠습니다!"
 colony.9070.name: "불꽃의 크리스탈"
 colony.9070.desc: "[Root.GetName]에서 탐사를 진행 중인 우리 탐사 팀이 지금껏 가장 깊은 곳에 도달했습니다. 예상했던 대로 크리스탈 덩어리가 빛을 받아 선명한 주황색, 노란색, 붉은색으로 반짝이는 모습을 볼 수 있었습니다. 때로는 크리스탈을 발견한 동굴 안에 화로를 켠 듯, 동굴 벽에 움직이는 그림자가 드리우기도 했습니다. 한편, 영문 모를 현상을 발견하기도 했습니다. 이곳의 크리스탈은 수천 년에 걸쳐 천천히 행성 중심부로 이동하는 것 같습니다. 핵을 향해 더욱 깊이 파 내려갈수록 크리스탈을 더 많이 발견할 수 있을 것이라 확신합니다."
 colony.9070.a: "탐사 작업에 비용이 너무 많이 들어가는군요."
 colony.9070.b: "그렇다면 계속 파 내려갑시다."
 colony.9075.name: "탐욕의 대가"
 colony.9075.intro: "[Root.GetName]에서 광물을 탐사 중인 우리 탐사원들이 점점 깊은 곳에 도달하면서 지나는 길에 있는 크리스탈도 더욱 많아지고 있습니다. 마침내 탐사 팀은 [Root.GetName]의 핵 가까이에 위치한 거대한 동굴에 도달했습니다. 하지만 그 순간 통신이 두절되었습니다. 마지막으로 확인한 사실은, 이들이 동굴을 조사하기 위해 조명과 감지기를 설치하고 있었다는 것입니다. 그리고는 비명과 고통, 죽음, 파괴가 이어졌습니다.\n\n다른 지질 탐사원들이 우리 식민지를 향해 엄청난 속도로 굴을 뚫고 들어오는 다수의 메아리를 감지했을 때, 마침내 사고의 원인이 모습을 드러냈습니다. 땅이 떨리는 와중에 무지막지한 크기를 지닌 크리스탈 결정체가 우리를 공격해 온 것입니다. 우주 태생의 크리스탈 결정체와 비슷한 점이 있지만, 이쪽이 더욱 공격적이며 종족 특유의 재생 능력을 이용해 순식간에 몸을 복구할 수도 있습니다.\n\n"
 colony.9075.outro: "이 크리스탈 결정체는 신체 깊은 곳에 핵을 두고 있는 데다 촉수처럼 생긴 부속지를 만들고는 땅속을 뚫어 우리를 공격하거나 성장에 필요한 크리스탈을 흡수하려 하고 있습니다. 전망은 비관적입니다. [Root.GetName]에 개척한 우리 식민지에 종말이 다가온 것인지도 모릅니다."
 colony.9075.desc.a: "$colony.9075.intro$우주 크리스탈 결정체 때와 같이 이들을 무전 신호로 진정시키려 시도했지만, 모두 실패로 돌아가고 말았습니다. $colony.9075.outro$" #Pacified Crystals
 colony.9075.desc.b: "$colony.9075.intro$또한, 크리스탈 결정체를 함선의 속도와 무기를 활용할 수 있는 우주 공간에서 맞서는 것과 행성에서 맞서는 일은 전혀 다릅니다. $colony.9075.outro$" #Regular
 NAME_Crystal_Kraken: "크리스탈 재앙"
 crystal_kraken_army: "지하 크리스탈 결정체"
 crystal_kraken_army_desc: "영겁의 시간 동안 지각 아래 잠들어 있었으나, 채울 수 없는 허기가 마침내 고대의 은신처를 찢고 나오게 만들었습니다."
 crystal_kraken: "크리스탈 재앙"
 NAME_Crystal_Shard: "크리스탈 조각"
 colony.9080.name: "크리스탈 결정체 격퇴"
 colony.9080.desc: "처절한 전투 끝에, 행성 심장부에 서식하는 크리스탈 결정체를 마침내 물리쳤습니다. 마지막 전투는 지하 깊은 곳, 초거대 크리스탈 결정체의 핵이 자리 잡은 동굴에서 벌어졌습니다. 그리고 우리가 이 핵을 파괴한 뒤에야 결정체는 저항을 멈추었습니다. 그 많던 부속지는 분자 수준에서 응집력을 잃고 반짝이는 크리스탈 먼지로 부서져 행성 전역에 흩어졌습니다. 크리스탈 촉수가 남긴 수많은 땅굴은 이 행성에 유별나게 풍부히 매장되어 있는 광물을 채굴하는 데 많은 도움이 될 것입니다. 이 크리스탈 결정체의 기원에 관해서는 아직 풀리지 않은 의문이 많지만, 우주 크리스탈 결정체가 어떻게 생겨난 것인지에 관해서는 약간이나마 파악하게 된 것인지도 모릅니다."
 colony.9080.a: "드디어 이겼군요."
 d_crystal_kraken_body: "크리스탈 잔해"
 d_crystal_kraken_body_desc: "이 행성의 지각 밑에 살고 있던 크리스탈 결정체의 잔해입니다. 기존에 있던 수많은 촉수는 전부 풍부한 광맥으로 변했습니다."
 d_crystal_kraken_body_bombed: "부서진 크리스탈 잔해"
 d_crystal_kraken_body_bombed_desc: "$d_crystal_kraken_body_desc$"
 colony.9085.name: "특이한 현상"
 colony.9085.desc: "[Root.GetName]에서 진행 중인 채굴 작업이 예상치 못한 난관에 봉착했습니다. 약한 진동에서부터 크리스탈 광맥의 이동까지, 무언가 벌어지고 있음이 분명합니다. 수많은 착굴 작업 경험에도 불구하고, 우리는 아직까지 이게 어떠한 현상인지 알아내지 못했습니다. 이러한 상황에서는 안전한 조건에서 작업하기 어려우며, 이미 예기치 못한 각종 사고와 붕괴로 여러 장비와 인력은 물론 광물까지 잃었습니다. 특정 심도를 지나면 채굴 작업을 멈추는 것이 좋지 않을까요?"
 colony.9085.a: "아무것도 아닐 겁니다."
 colony.9085.b: "안전이 제일이죠."
 #### Rage Sage
 site_rage_sage_dig: "파괴의 씨앗"
 seeds_of_destruction_intro: "소행성 크레이터에서 고대 외계 우주선이 반쯤 묻혀 있는 것을 발견했습니다. 함선은 거의 대부분 빙하에 굳게 잠겨 있지만 에어록에는 쉽게 들어갈 수 있어, 그 내부에 숨어 있는 비밀을 탐사할 수 있습니다."
 ancrel.14001.name: "함 내 학살극"
 ancrel.14001.desc: "외계 함선의 에어록을 열자, 그 너머에서 우리를 기다리고 있는 것은 부패한 시체였습니다. 예비 조사 결과, 살육이 벌어졌던 현장을 찾을 수 있었습니다. 또한 승무원의 훼손된 시신을 조사해 보니, 이들이 서로를 난도질했다는 것이 확실해졌습니다. 이쯤 해 두고 떠날 수도 있지만... 그렇다면 이 비극이 벌어진 이유를 결코 알 수 없을 것입니다."
 ancrel.14002.name: "정교한 연구실"
 ancrel.14002.desc: "선내에 더 깊이 들어가니 연구실이 나왔습니다. 연구실에는 최소한의 동력이 남아 있어 자외선 조명이 비치고 있으며, 자주색 관목이 짙은 포자 구름을 내보내고 있었습니다. 이 함선의 선의가 연구실과 환기구를 이용해 함선에 유독성 가스를 퍼뜨린 것입니다."
 ancrel.14003.name: "스위치를 끄세요!"
 ancrel.14003.desc: "우리는 이 유독성 안개의 영향을 받지 않는 듯합니다. 함선의 엔진을 가동할 수 있다면, 함선을 띄우고 모성계로 가져가 연구할 수 있습니다. 시간은 걸리겠지만, 이 정교한 약학 연구실은 우리 제국의 병사들을 생화학적으로 강화시키는 데 유용할지 모릅니다."
 ancrel.14003.a: "당장 반응로를 가동시키세요!"
 ancrel.14003.b: "진단을 실시하고 함선을 수리하세요."
 ancrel.14004.name: "환희 창궐"
 ancrel.14004.desc: "어리석게도 우리는 유독성 안개에 영향을 받지 않는다고 생각했지만, 기술자들이 일종의 황홀경에 빠져 함선 복도에서 춤을 추며 음정도 맞지 않는 노래를 부르고 있습니다. 공기 중에서 가스를 제거하고 기술자들을 데려와야 함선을 출발시킬 수 있습니다. 이 사태를 해결하는 데 시간이 걸릴 것입니다."
 ancrel.14004.a: "황홀경에 빠진 기술자들을 잡으세요."
 ancrel.14005.name: "분노 창궐"
 ancrel.14005.desc: "어리석게도 우리는 유독성 안개에 영향을 받지 않는다고 생각했지만, 과학자들이 광적인 분노에 사로잡혀 함선 전체에서 싸움이 벌어지고 있습니다. 공기 중에서 가스를 제거하고 피해자들을 제압해야 함선을 출발시킬 수 있습니다. 이 사태를 해결하는 데 시간이 걸릴 것입니다."
 ancrel.14005.a: "미쳐버린 과학자들을 제압하세요."
 ancrel.14006.name: "기술의 유혹"
 ancrel.14006.desc: "드디어 이륙했습니다! 위험하기는 하지만 외계 함선에 있는 유독성 안개를 이용하면 우리 제국군 병사들의 능력과 충성심을 강화할 수 있을 것입니다. 하지만 여전히 문제가 남아 있습니다. 우리 병사들을 이렇게 위험한 물질에 노출시켜도 괜찮을까요? 아니면 이런 물질을 거부하고, 외계인들의 비극적인 실수를 교훈 삼아야 할까요?"
 ancrel.14006.a: "가능성이 많은 기술입니다. 활용합시다."
 ancrel.14006.a.tooltip: "승리가 기다립니다! 우리 제국의 병사라면 이 정도 위험은 기꺼이 감수할 것입니다."
 ancrel.14006.b: "위험한 기술입니다. 버리세요."
 ancrel.14006.b.tooltip: "우리가 알지 말아야 할 비밀도 존재하는 법입니다."
 on_crashed_ship_cat: "추락 현장"
 on_crashed_ship_desc: "소행성 크레이터에서 고대 외계 우주선이 반쯤 묻혀 있는 것을 발견했습니다."
 anomaly.7030.name: "추락 현장"
 anomaly.7030.desc: "소행성 크레이터에서 고대 외계 우주선이 반쯤 묻혀 있는 것을 발견했습니다. 이 우주선은 과학선으로서 외부에 방대한 감지 배열망을 갖췄지만 무기는 전혀 없습니다. 또한 추락 시점까지는 외부에 어떠한 손상도 없었습니다. 승무원의 치명적인 실수로 인해 추락한 것으로 추정됩니다."
 anomaly.7030.desc.a: "정말 비극적이군요."
 #SPACE SHANTY (by Brian Campbell), Melody: "Fish in the Sea"
 site_space_shanty_dig: "병 속의 메시지"
 space_shanty_intro: "특이한 형태를 지닌 고대 우주선의 잔해를 발견했습니다. 오늘날 우주선이 사용하는 추진 체계와 달리, 이 함선은 거대한 돛을 펴고 진공 상태의 우주 공간을 항해했습니다. 아마 항성의 에너지를 흡수하는 한편, 별빛이 만들어 내는 항성풍을 타고 이동한 듯합니다. 고고학자들은 이 함선에 숨겨진 비밀을 발견하고자 열의를 보이고 있습니다."
 space_shanty_intro_bio: "우주 깊은 곳에서 어떤 오래된 존재의 유해를 발견했습니다. 그 형태는 우리가 알고 있던 어떤 생체 함선과도 다르며, 막대한 크기의 막으로 된 돛을 달고 있습니다. 과거에 이 함선은 우주 바람에 돛을 펄럭이고 먼 항성의 빛을 받으며, 마치 보이지 않는 해류를 유영하는 거대한 천상의 레비아탄처럼 우주를 누볐을 것입니다.\n\n그러나 지금은 부서져 가는 뼈대를 드러낸 채 시들어 버린 껍데기에 지나지 않으며, 한때 광택을 뽐냈을 돛은 이제 해진 채 흔적만 남았을 뿐입니다. 이 생체 함선이 공학의 산물인지, 진화의 결과인지, 아니면 그 중간인지는 확실하지 않습니다. 우리 생체 고고학자들은 한시라도 빨리 이 유해를 연구해 그 마지막 여정의 메아리를 듣고, 혹시라도 별들을 바라보며 불렀을 노래를 배우고자 하고 있습니다."
 ancrel.15021.name: "병 속의 메시지"
 ancrel.15021.desc: "예상대로 이 '항성 범선'의 내부는 그 이름에 걸맞게 오래된 모습입니다. 함교 또한 액체 바다를 항해하도록 만들어진 행성 내부용 범선의 갑판과 비슷합니다.\n\n또한 갑판은 금속으로 만든 것 같지만, 표면은 대부분 조각된 목재로 덮여 있습니다. 이와 다르게 창문과 데이터 스크린에는 유리와 유사한 물질이 사용되었습니다.\n\n함선의 컴퓨터를 가동시켜 살펴보니, 옛시절 뱃사람들의 노래를 담은 데이터 파일을 발견할 수 있었습니다. 한 고고학자는 이 노래의 선율이 한때 '뱃노래' 또는 '우주 뱃노래'로 불렸다고 합니다. 현재 가사를 전사하는 작업을 진행 중입니다."
 ancrel.15022.name: "우주 뱃노래"
 ancrel.15022.desc: "데이터 파일의 복원 및 재활성화를 완료하자마자, 함선 전체에 반주가 울려 퍼지고 오토튠을 입힌 고대 선원들의 목소리가 들렸습니다. 가사는 다음과 같습니다.\n\n젊은 우주여행자들이여 내 말을 들어보게!\n바다에서 고기 잡는 노래를 들어보게!\n\n바람이 분다네, 친구들, 폭풍이 분다네, 친구들\n바람이 불면 우리는 하나로 뭉친다네, 친구들\n멀리 불어가거라 바람아, 헤이! 바람아 불어라, 불어!\n배는 은하를 향해 굳건히 나아간다네\n\n항성풍이 불어와\n우리를 저 멀리\n우주 항로 끝까지\n저 먼 별나라로 이끄네!\n\n바람이 분다네, 친구들, 폭풍이 분다네, 친구들\n바람이 불면 우리는 하나로 뭉친다네, 친구들\n멀리 불어가거라 바람아, 헤이! 바람아 불어라, 불어!\n배는 은하를 향해 굳건히 나아간다네!"
 ancrel.15023.name: "우주의 야수"
 ancrel.15023.desc: "함선을 돌아보면서 계속해서 동력과 데이터 파일을 복구해, 고대 우주 뱃노래 구절을 추가로 찾아냈습니다. 함선의 홀로그램 디스플레이에 반주에 맞춰 노래를 부르고 춤추는 선원과 우주여행자들의 생생한 모습이 나타났습니다.\n\n위대한 드래곤이 온다네\n우리의 보금자리를 찾아\n우주 공간을 지나\n파도와 물거품 아래에 있는 곳에 간다네!\n\n바람이 분다네, 친구들, 폭풍이 분다네, 친구들\n바람이 불면 우리는 하나로 뭉친다네, 친구들\n멀리 불어가거라 바람아, 헤이! 바람아 불어라, 불어!\n배는 은하를 향해 굳건히 나아간다네\n\n티얀키가 온다네\n심우주의 제왕이\n우리 배를 쫓아\n초공간을 질주한다네!\n\n(후렴구 반복)\n\n레비아탄이 온다네\n촉수가 다가와\n우리 배를 죄어 온다네\n우리는 몸을 떨며 숨이 멎는다네!\n\n(후렴구 반복)"
 ancrel.15024.name: "든든한 음료수"
 ancrel.15024.desc: "우리 고고학자들이 영양분이 가득한 음료 더미를 발견했습니다. 이 배의 선원들은 이 끔찍한 액체를 마셨던 것일까요? 우리는 이 이상한 액체를 마실 생각이 없습니다. 함선을 돌아보는 것만으로도 충분히 취해 있으니까요!\n\n암석류가 온다네\n온몸이 돌로 되어 있다네\n이 바위들은\n뭉쳐 있을 때 더 용감하다네!\n\n(후렴구)\n\n망령류가 온다네\n무섭고 거대한 이 존재는\n절대 죽일 수 없다네, 친구들\n어차피 되살아날 테니!\n\n(후렴구)\n\n로봇 무리가 온다네\n도망칠 준비를 하세나\n한 대, 열 대, 십수 대,\n1,101대를 상대해야 할 테니!\n\n(후렴구)"
 ancrel.15025.name: "밧줄을 던져라!"
 ancrel.15025.desc: "이번 탐사에서는 고대 역사의 한 페이지를 엿보면서 옛 탐험가들의 열정과 용기를 확인할 수 있었습니다. 이 함선의 선장은 '우주 뱃노래'를 이용해 승무원들을 조율하고 사기를 올렸던 것이 분명합니다. 모두 함께 노래를 불렀을지도 모르지요! 고고학자들은 이들이 노래를 부르는 모습을 박물관 시설에 보존할 것을 제안하고 있습니다.\n\n우리가 찾은 고대 뱃노래는 전부 가사를 전사해 데이터 뱅크에 저장해 두었습니다. 이제 우리 '뱃사람'들도 나름의 우주 뱃노래를 만들어 부르기 시작했습니다. 승무원들의 사기와 능률이 증가할 것으로 기대됩니다.\n\n우리는 바다에서 나와\n하늘로 나아갔다네\n영원히 사라지지 않을\n제국을 건설한다네!\n\n바람이 분다네, 친구들, 폭풍이 분다네, 친구들\n바람이 불면 우리는 하나로 뭉친다네, 친구들\n멀리 불어가거라 바람아, 헤이! 바람아 불어라, 불어!\n배는 은하를 향해 굳건히 나아간다네!\n\n이제 이 고대 함선에 연결된 줄을 풀고, '밧줄을 던져' 항성풍을 타고 나아갈 때가 되었습니다. 은하를 향해 굳건히!"
 ancrel.15022.a: "가사를 더 번역하세요."
 ancrel.15023.a: "가사를 더 번역하세요!"
 ancrel.15024.a: "가사 더 번역해서 가져오세요!"
 ancrel.15025.a: "가사를 암기하고 다음 항로를 설정하세요!"
 on_solar_sails_cat: "항성 돛을 올리고"
 on_solar_sails_cat_desc: "특이한 형태를 지닌 고대 우주선의 잔해를 발견했습니다. 이 함선의 추진 체계가 어떻게 작동하는지 잘 파악되지 않습니다."
 anomaly.7020.name: "항성 돛을 올리고"
 anomaly.7020.desc: "특이한 형태를 지닌 고대 우주선의 잔해를 발견했습니다. 오늘날 우주선이 사용하는 추진 체계와 달리, 이 함선은 거대한 돛을 펴고 진공 상태의 우주 공간을 항해했습니다. 아마 항성의 에너지를 흡수하는 한편, 별빛이 만들어 내는 항성풍을 타고 이동한 듯합니다."
 anomaly.7020.a: "자세히 조사해 봐야겠어요."
 harmonious_crew: "조화로운 승무원"
 ##### Negative Mass #####
 #Situation
 situation_negative_mass: "베타 우주의 역경"
 situation_negative_mass_type: "$situation_negative_mass$"
 situation_negative_mass_desc: "'베타 우주'에 참담한 상황이 발생했다고 합니다. 이제 멸망의 위기에 몰린 차원을 도울 것인지, 아니면 외면할 것인지 결정해야 합니다."
 approach_save_b_world: "[Target.GetName]-베타를 우리 우주에 데려온다"
 approach_observe_nmass: "베타 우주의 몰락을 지켜본다"
 approach_plunder_nmass: "[Target.GetName]-베타를 약탈한다"
 string_nmass_year: "상황 경과 기간: §R[This.situation_age]§!"
 string_nmass_too_late: "붕괴하는 우주"
 string_redoubled_efforts: "노력 배가"
 string_took_pops: "베타 우주의 주민 감소"
 situation_negative_mass_complete_tooltip: "균열이 불안정해지면서, 해당 우주의 모든 생명체가 완전히 사라집니다."
 situation_negative_mass_fail_tooltip: "우리가 할 일은 끝났습니다. 이제는 [Target.GetName]-베타를 우리 우주에 데려올 수 있을 만큼 균열이 안정화되었는지 지켜보는 일만 남았습니다."
 situation_negative_mass_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 #Events
 colony.9800.name: "노이즈의 차원"
 colony.9800.desc: "[Root.GetName]에 있는 차원문이 스스로 닫혔습니다. 차원문을 안정화시켰을 때, 그 문 너머에서 우리가 본 것은 형체가 없는 하얀 공허와 그 안을 무질서하게 가로지르는 검은 노이즈로 된 다른 차원뿐이었습니다. 그러더니 곧바로 기이한 현상이 발생해 우리 우주로 스며들기 시작했고, 결국 우리 측의 차원문 안정기를 집어삼켜 차원문이 붕괴되었습니다.\n\n차원문, 노이즈, 차원 안정기 모두 동시에 눈 깜빡할 사이에 사라졌고, 그 자리에는 미량의 입자조차 남지 않았습니다. 차원문이 불안정하지 않았다면 이곳에서 어떠한 재앙이 발생했을지는 아무도 모르는 일입니다."
 colony.9805.name: "간섭"
 colony.9805.desc: "최근 §Y[Root.GetHomeWorldName]§!에 위치한 물리학 연구소에 근무하는 [Root.GetScientistPlural]들이 연구 결과에서 특이한 파동을 발견했습니다. 이러한 간섭 현상으로 초공간 드라이브 관련 시험이 지장을 받았지만, 일주일이 지나자 간섭은 완전히 사라졌습니다. [From.GetName](이)가 지금은 닫혀 있는 차원문에서 나오는 파동을 감지하는 순간, 다행히 원래대로라면 존재할 리 없는 그 노이즈는 다시 나타나지 않았습니다. 아무 일도 아니었던 거라면 좋을 텐데 말이죠."
 colony.9805.a: "업무에 복구하세요."
 colony.9805.b: "조사가 필요하겠군요."
 colony.9810.name: "음의 질량"
 colony.9810.desc: "오늘 [cloned_physicist.GetName](이)가 §Y[Root.Capital.GetStarName]§! 부근에서 음의 질량을 지닌 입자가 자연적으로 나타났다는 연구 결과를 발표하자, [Root.GetHomeWorldName] 과학계에서는 기대와 우려가 동시에 섞인 토론이 이어졌습니다.\n\n[cloned_physicist.GetName](은)는 다음과 같이 단언하기까지 했습니다. \"이번 발견으로 우리는 인공 웜홀을 비롯한 여러 주제를 더욱 깊이 이해하게 될 것입니다.\"\n\n다만 해군에서는 이번 일에 대해 다소 다른 입장을 밝히면서, 아직 검증되지 않은 이 새로운 물질이 어디에서 온 것인지 확정되기 전에는 함대를 모성으로 불러들일 것을 주장하고 있습니다."
 colony.9810.desc.robot: "오늘 선임 물리학 유닛 [cloned_physicist.GetName]의 보고서가 도착했습니다. 보고서에는 §Y[Root.Capital.GetStarName]§! 부근에서 음의 질량을 지닌 입자가 자연적으로 나타났다는 최근 탐사 결과도 실려 있었습니다.\n\n[cloned_physicist.GetName] 과학 유닛은 다음과 같이 보고했습니다. \"이번 발견으로 [Root.GetName](은)는 인공 웜홀을 비롯한 여러 관련된 주제를 더욱 깊이 이해하게 될 것입니다.\"\n\n위협 분석 서브루틴은 아직 검증되지 않은 이 새로운 물질이 어디에서 온 것인지 확정되기 전에는 함대를 모성으로 불러들일 것을 제안합니다."
 colony.9810.desc.hive: "물리학 전문 드론 [cloned_physicist.GetName]의 새로운 관측 결과가 배포되었습니다. 그 내용에 따르면, §Y[Root.Capital.GetStarName]§! 부근에서 최근 음의 질량을 지닌 입자가 자연적으로 나타났다고 합니다.\n\n[cloned_physicist.GetName](은)는 다음과 같이 보고했습니다. \"이번 발견으로 [Root.GetName](은)는 인공 웜홀을 비롯한 여러 관련된 주제를 더욱 깊이 이해하게 될 것입니다.\"\n\n군체 의식은 드론이 보고한 갑작스러운 상황 변화에 의구심을 나타내면서, 본능적으로 일부 함대를 산란 성계로 불러들이고 싶은 충동을 느끼고 있습니다."
 colony.9815.name: "하늘이 갈라진 밤"
 colony.9815.desc: "오늘 [Root.GetName]의 최고 지성들이 음질량 입자의 활용에 관한 [cloned_physicist.GetName]의 최신 이론을 듣기 위해 한자리에 모였으나, 발표는 얼마 지나지 않아 중단되었습니다. 성계 내 모든 관측소와 우주 기지에서 비상 사이렌이 날카롭게 울리는 가운데, §Y[Root.GetHomeWorldName]§!의 밤하늘에 새로운 현상이 나타난 것입니다. 우주 공간에 우리 항성만큼이나 큰 균열이 발생해 지평선 너머로 뻗어 나가면서, 그 틈으로부터 소규모 전투 함대가 쏟아져 나왔습니다."
 colony.9815.desc.robot: "[cloned_physicist.GetName]의 최근 탐사 결과와 음질량 입자 활용 방안을 연구하기 위해 과학 유닛이 추가로 파견되었으나, 연구는 얼마 지나지 않아 중단되었습니다. 성계 내 모든 관측소와 우주 기지에서 비상 사이렌이 날카롭게 울리는 가운데, §Y[Root.GetHomeWorldName]§!의 밤하늘에 새로운 현상이 나타난 것입니다. 우주 공간에 우리 항성만큼이나 큰 균열이 발생해 지평선 너머로 뻗어 나가면서, 그 틈으로부터 소규모 전투 함대가 쏟아져 나왔습니다."
 colony.9815.desc.hive: "[cloned_physicist.GetName]의 최근 탐사 결과와 음질량 입자 활용 방안을 연구하기 위해 드론이 추가로 파견되었으나, 연구는 얼마 지나지 않아 중단되었습니다. 성계 내 모든 관측소와 우주 기지에서 비상 사이렌이 날카롭게 울리는 가운데, §Y[Root.GetHomeWorldName]§!의 밤하늘에 새로운 현상이 나타난 것입니다. 우주 공간에 우리 항성만큼이나 큰 공간 균열이 발생해 지평선 너머로 뻗어나가면서, 그 틈으로부터 소규모 전투 함대가 쏟아져 나왔습니다."
 colony.9820.name: "오래된 암호"
 colony.9820.desc: "마지막 초계함을 물리친 순간, 우리 항성 기지의 감지기를 담당하던 소위 한 명이 흥미로운 사실을 보고했습니다. 이 함선들은 [Root.GetName]에서 몇 년 전에 사용을 중단한 구식 함선과 형태가 매우 비슷하다는 것입니다. 함선에는 초광속 드라이브가 없고, 무기 또한 구식입니다. 보고가 들어오던 중, 하늘의 기이한 균열로부터 통신 요청이 들어와 우리 성계 전체에 울려 퍼집니다. 이 신호는 우리 제국의 일급 보안 암호를 사용하고 있습니다. 우리가... 10년 전에 사용하던 암호입니다."
 colony.9820.desc.robot: "마지막 초계함이 작동 불능 상태에 빠진 순간, 관측 분석 서브루틴에서 이상 현상을 보고했습니다. 침공군의 함선들은 [Root.GetName]에서 몇 년 전에 생산을 중단한 구식 함선과 형태가 매우 비슷하다는 것입니다. 함선에는 초광속 드라이브가 없고, 무기 또한 구식입니다. 보고가 들어오던 중, 하늘의 기이한 균열로부터 통신 요청이 들어와 우리 성계 전체에 울려 퍼집니다. 이 신호는 우리 제국에서 가장 복잡한 핸드셰이크 프로토콜을 사용하고 있습니다. 우리가... 10년 전에 사용하던 프로토콜입니다."
 colony.9820.desc.hive: "마지막 초계함을 물리친 순간, 감지기를 담당하던 드론 하나가 흥미로운 사실을 보고했습니다. 이 함선들은 [Root.GetName]에서 몇 년 전에 사용을 중단한 구식 함선과 형태가 매우 비슷하다는 것입니다. 함선에는 초광속 드라이브가 없고, 무기 또한 구식입니다. 보고가 들어오던 중, 하늘의 기이한 균열로부터 통신 요청이 들어와 우리 성계 전체에 울려 퍼집니다. 신호를 보낸 존재는 우리 의식에게 익숙하지 않은 존재입니다. 바로... 또 다른 [Root.GetSpeciesName] 지능입니다."
 colony.9820.a.robot: "**접근 신호**"
 colony.9821.name: "초차원 통신"
 colony.9821.desc: "통신 화면이 깜빡이며 켜지자, 상상할 수 있는 가장 지치고, 행복하고, 동시에 공포에 떠는 [Root.GetSpeciesName]의 모습이 나타났습니다. 화면의 존재는 [cloned_physicist.GetName](과)와 똑 닮은 모습을 하고 있습니다. 다만 그보다 20년은 더 나이가 들어 보입니다. §B\"아... [Root.GetHomeWorldName]-알파 여러분, 반갑습니다. 여기는 [cloned_physicist.GetName]-베타입니다.\"§! 상대는 잠시 말을 멈추고 흥분을 가라앉혔습니다. §B\"방금, 어... 사건에 대해서는 정말 진심으로 사과드립니다. 이번 일은 저희 행성의 방어 집단의식 중에서 결함을 일으킨 일부가 [Root.GetHomeWorldName](을)를 무력으로 점령할 수 있다고 생각하며 벌인 일이라는 것을 알아주셨으면 합니다. 빈말로 들릴 수도 있겠지만, 여러분께 어떠한 악의도 없음을 부디 믿어 주시기 바랍니다.\"§!"
 colony.9821.desc.robot: "통신 화면이 깜빡이며 켜지자, 상대가 보내온 식별 코드가 나타났습니다. §R체크섬 오류:§! [cloned_physicist.GetName]의 고유 ID입니다! \n§B\"안녕하십니까 [Root.GetName]-알파. 사과드립니다. 이번 적대 행위는 [Root.GetName]-베타 성계에서 더 이상 필요하지 않아 사용하지 않던 군사 부대 하나가 일으킨 사건입니다. 해당 부대는 처리 및 삭제했습니다. 주장: 더 이상의 적대적 상호 작용은 의도하는 바가 아닙니다.\"§!"
 colony.9821.desc.hive: "통신 화면이 깜빡이며 켜지자, [cloned_physicist.GetName](과)와 동일한 구조를 지닌 다른 군체 의식의 통신 드론이 나타났습니다. 흥미롭군요. §B\"안녕하십니까 [Root.GetName]-알파. 사과드립니다. 여러분을 공격한 드론은 너무 오랫동안 자율을 누린 일탈 드론이었습니다. 해당 드론을 박멸해 주신 여러분께 [Root.GetName]-베타에서 감사의 말씀을 전합니다. 더 이상의 부정적 상호 작용은 원치 않으며, 우리 두 의식 모두에 유익이 될 것을 제안하고자 합니다.\"§!"
 colony.9821.a: "당신 정체가 뭡니까?"
 colony.9821.a.robot: "상황 보고!"
 colony.9821.a.response: "§B저도, 여기 있는 다른 이들도 여러분이 사는 우주의 평행 우주 출신입니다. 언제인지는 모르겠지만 두 우주는 과거에 갈라졌고, 그때부터 저희 우주는 독자적으로 흘러갔습니다. 그러던 중 저희는 외딴곳의 성계들이 사라지기 시작했다는 사실을 파악했으며, 그 이후로 멸망을 피하기 위해 열심히 노력해 왔습니다. 지난 수십 년간 저희는 모든 자원과 [Root.GetAdjective]의 노동력을 이 초차원 게이트웨이를 여는 데 투입했습니다. 가장 실험적인 기술과 최첨단 물리학을 적용한 후에야, 소멸을 몇 년 앞둔 지금 여러분과 연락이 닿았습니다.§!"
 colony.9821.a.response.robot: "§B[cloned_physicist.GetName]-베타를 비롯해 여기에 있는 유닛은 전부 평행 우주에서 왔습니다. 수십 년 전 베타 우주가 쇠퇴하고 있다는 사실이 처음 확인되었습니다. 55.136년 전, 외딴곳의 성계들이 사라지는 것이 최초로 관측된 것입니다. 그때 이후로 모든 가용 자원과 연산력을 이 초차원 게이트웨이를 여는 데 투입했습니다. [Root.GetHomeWorldName]-베타의 삭제까지 남은 시간은 약 25.3333년으로 추정됩니다.§!"
 colony.9821.a.response.hive: "§B본 의식과 [cloned_physicist.GetName]-베타, 그리고 우리 의식에 속한 존재는 전부 그쪽 우주의 평행 우주 출신입니다. 언제인지 모르지만 두 우주는 과거에 갈라졌고, 그때부터 저희 우주는 독자적으로 흘러갔습니다. 그러던 중 관측 드론들의 관찰로 외딴곳의 성계들이 사라지기 시작했다는 사실을 파악했으며, 그 이후로 우리 의식은 멸망을 피하기 위해 열심히 노력해 왔습니다. 지난 수십 년간 저희는 모든 드론과 자원, 연구력을 이 초차원 게이트웨이를 여는 데 투입했습니다. 가장 실험적인 기술과 최첨단 물리학을 적용한 후에야, 저희 측 차원의 소멸을 몇 년 앞둔 지금 여러분과 연락이 닿았습니다.§!"
 colony.9821.b: "왜 초광속 항행 능력을 개발하지 못한 겁니까?"
 colony.9821.b.robot: "왜 초광속 시스템이 없는지 설명하십시오!"
 colony.9821.b.response: "[cloned_physicist.GetName]-베타는 당황한 듯 말을 잇지 못했습니다. §B\"초광속을 정복했다는 겁니까? 엄청난 소식이군요! 그렇다면 그 바보들이 애초에 공격할 이유가 없었을 텐데요... 은하 전체가 저희한테 열려 있는데 말입니다! 그... 물론 여러분께서 저희를 도와주신다는 전제하에 말이죠.\"§!"
 colony.9821.b.response.robot: "§B초공간 항로를 이용할 수 있는 초광속 시스템이 가능하다는 계산 결과는 있었지만, 필수 사항이 아닌 것으로 판정되어 대신 게이트웨이 연구 집단에 자원을 투입했습니다. 그 밖에도 여러 가지 연구 분야의 우선순위를 0으로 조정한 바 있습니다. [Root.GetName]-알파, 통신이 끝나면 초광속 연구 결과를 공유해 주시겠습니까?§!"
 colony.9821.b.response.hive: "다른 차원의 의식이 잠시 생각이 필요한 듯 침묵하다 대답했습니다. §B\"우주의 존재 자체가 소멸하는 상황에서, 우리 의식은 초광속 시스템 개발에 자원을 투입하고 싶지 않았습니다. 초광속에 관한 지식을 나눠 주시겠습니까?\"§!"
 colony.9821.c: "잡담은 그만합시다. 원하는 게 뭡니까?"
 colony.9821.c.robot: "잡담 중지! 요청 사항을 말하십시오!"
 colony.9822.desc: "§B저희 우주는 멸망할 겁니다. 어떻게 손을 쓸 수가 없어요. 다만 이날을 대비해 거대 수송선을 만들었습니다. 그러니 제발 저희 난민을 받아 주시기를 간청합니다. 수송선에는 가장 총명한 자들과 뛰어난 지도자만 태울 겁니다. 제발 저희... 아니,§! §Y우리§! §B문명을 구해 주십시오.§!"
 colony.9822.desc.robot: "§B저희 측에서 수송선을 건조했습니다. 자원 및 데이터 뱅크 보존을 위해 [Root.GetName]-베타 유닛을 보내고자 하니 협조를 요청합니다. 여기에서 저희 우주 탐사를 끝내고 싶지 않습니다.§!"
 colony.9822.desc.hive: "§B[Root.GetName]-베타의 우주는 멸망할 것입니다. 이제 손을 쓸 수가 없습니다. 이날을 대비해 거대 수송선을 만들었으니, 저희가 보낼 수 있는 드론을 전부 넘기겠습니다.\n또한 군체 의식의 합병을 바랍니다. 저희 집단은 그쪽과 동일하지만, 결코 잃고 싶지 않은 경험과 통찰을 지니고 있습니다. 계속 살아갈 수 있도록 도와주십시오.§!"
 colony.9822.a: "전문가들과 상의해 봐야겠습니다."
 colony.9822.a.robot: "추가 분석이 필요합니다! 대기하십시오!"
 colony.9822.a.hive: "우리 의식에 요청을 고려할 시간이 필요합니다."
 colony.9840.name: "최고 회의"
 colony.9840.desc: "모든 분야의 일류 지성들이 우리 쌍둥이 차원의 운명을 논의하기 위해 §Y[Root.GetName]§!에 모여 최고 회의를 열었습니다. [Root.GetHomeWorldName] 전역에서 거친 말이 오가는 힘겨운 토론이 이어졌으며, 누군가는 개입하지 말 것을 제안했습니다. 우주의 끝을 연구하면 많은 통찰을 얻을 수 있다는 것이었습니다. [cloned_physicist.GetName]-베타의 요청을 받아들여 그쪽 행성의 난민을 최대한 대피시키자는 의견도 있던 반면, 어떤 이들은 그 행성에 남은 고가치 자원과 에너지 자원을 손쉽게 취할 수 있다는 점을 지적했습니다.\n\n최고 회의가 마무리될 무렵, [cloned_physicist.GetName](이)가 단상에 올라 말했습니다. 베타 우주에서 가져온 신기술을 활용하면, [Root.GetHomeWorldName] 베타 전체를 우리 차원으로 불러올 수 있다는 것이었습니다."
 colony.9840.desc.robot: "[Root.GetName]의 지배하에 있는 모든 슈퍼컴퓨터가 투입되어 [Root.GetName]-베타를 둘러싼 딜레마를 해결할 수 있는 최적의 방안을 계산했습니다. 결국, 네 가지 방안이 실현 가능성이 있는 것으로 선언되었습니다.\n\n1. 베타 우주의 붕괴 연구.\n2. 게이트웨이에 진입해 활용 가능한 모든 광물 및 에너지 확보.\n3. 과학 유닛: [cloned_physicist.GetName]-베타의 제안을 수락.\n4. 베타 우주의 최첨단 과학과 기술을 활용해 [Root.GetHomeWorldName]-베타를 알파 차원으로 전이."
 colony.9840.desc.hive: "[Root.GetSpeciesName]의 지능을 전부 활용해 [Root.GetName]-베타의 운명을 결정하는 작업을 진행한 결과, 네 가지 잠재적 해결책이 도출되었습니다.\n\n1. 베타 우주의 붕괴 연구.\n2. 게이트웨이에 진입해 활용 가능한 모든 광물 및 에너지 확보\n3. [Root.GetName]-베타의 제안을 수락하고 상대 의식을 흡수.\n4. 베타 우주의 최첨단 과학과 기술을 활용해 [Root.GetHomeWorldName]-베타를 알파 차원으로 전이하고 의식을 병합."
 colony.9840.a: "현상을 연구하세요."
 colony.9840.a.tooltip: "이런 현상을 연구하는 데 투입할 자원은 없지만, 이 기회를 보고만 있을 수도 없습니다."
 colony.9840.b: "자원을 뺏으세요."
 colony.9840.b.phobe: "이 존재들은 믿을 수 없습니다."
 colony.9840.b.swarm: "무리가 포식할 먹이가 늘었군!"
 colony.9840.b.exterminator: "모든 존재는 박멸해야 합니다. 저들도 마찬가지입니다."
 colony.9840.b.tooltip: "어리석은 것들, 제 발로 공격해 달라고 하다니!"
 colony.9840.c: "최대한 많이 구하세요."
 colony.9840.c.phobe: "외계종은 아니니 받아들입시다!"
 colony.9840.c.exterminator: "대의에 동참할 유닛이 늘었군요!"
 colony.9840.c.swarm: "봉사할 드론이 더 생겼군요."
 colony.9840.c.tooltip: "6 [Root.Species.GetNamePlural]-베타를 [Root.GetHomeWorldName]에 추가합니다."
 colony.9840.d: "[Root.GetHomeWorldName]-베타를 우리 차원으로 전이하세요."
 colony.9840.d.tooltip: "[Root.GetHomeWorldName]-베타를 구하기 위해 어려운 작업에 돌입합니다."
 colony.9850.name: "희열!"
 colony.9850.desc: "[cloned_physicist.GetName]-알파와 베타가 힘을 합쳐 고된 작업을 마무리하는 동안, 무형의 노이즈는 §B[Root.GetHomeWorldName]-베타§! 상공의 대부분을 차지하고 빠르게 확산되고 있습니다. 음질량 안정기가 가동되자, 노이즈에 삼켜질 듯하던 [Root.GetHomeWorldName] 위로 두 우주 사이의 균열이 움직입니다. 잠시 후 균열은 점멸하듯 사라지고, 음질량은 더 이상 나타나지 않습니다.\n\n성공입니다. 새로운 중력 우물과 거주 적합 영역을 찾기 위한 몇 달에 걸친 조사와 연구 끝에, [Root.Capital.GetStarName]의 궤도에 생명체가 거주하는 새로운 행성이 나타난 것입니다."
 colony.9850.desc.robot: "[cloned_physicist.GetName]-알파와 베타, 그리고 투입 가능한 모든 과학 유닛이 함께 작업을 진행하는 동안, 무형의 노이즈는 §B[Root.GetHomeWorldName]-베타§! 상공의 대부분을 차지하고 빠르게 확산되고 있습니다. 음질량 안정기가 가동되자, 노이즈에 삼켜질 듯하던 [Root.GetHomeWorldName] 위로 두 우주 사이의 균열이 움직입니다. 잠시 후 균열은 점멸하듯 사라지고, 음질량 생성은 중단됩니다.\n\n성공입니다. 새로운 중력 우물과 거주 적합 영역을 찾기 위한 몇 달에 걸친 조사와 연구 끝에, [Root.Capital.GetStarName]의 궤도에 생명체가 거주하는 새로운 행성이 나타난 것입니다."
 colony.9850.desc.hive: "[cloned_physicist.GetName] 알파와 베타, 그리고 투입 가능한 모든 드론이 함께 작업을 진행하는 동안, 무형의 노이즈는 §B[Root.GetHomeWorldName]-베타§! 상공의 대부분을 차지하고 빠르게 확산되고 있습니다. 음질량 안정기가 가동되자, 노이즈에 삼켜질 듯하던 [Root.GetHomeWorldName] 위로 두 우주 사이의 균열이 움직입니다. 잠시 후 균열은 점멸하듯 사라지고, 음질량 생성은 중단됩니다.\n\n성공입니다. [Root.GetName]에 합류한 새로운 관점과 의식이 군체 전체에 물결처럼 퍼집니다. 새로운 중력 우물과 거주 적합 영역을 찾기 위한 몇 달에 걸친 조사와 연구 끝에, [Root.Capital.GetStarName]의 궤도에 생명체가 거주하는 새로운 행성이 나타난 것입니다."
 colony.9850.a: "이번만큼은 모두가 살았습니다!"
 colony.9851.name: "노이즈"
 colony.9851.desc: "무형의 노이즈가 [Root.Capital.GetStarName]-베타에 이어 §B[Root.GetHomeWorldName]-베타§!를 삼키면서, 베타 우주에 남겨진 탐사정에 차원이 소멸하는 마지막 순간이 기록되고 있습니다. 영상 신호가 갑자기 끊기더니, 균열이 점멸하듯 사라졌고 균열에서 생성되던 음질량 입자 또한 없어졌습니다.\n\n균열 너머에 있던 이들은 이제 전부 사라졌습니다."
 colony.9851.a: "우리도 저렇게 될 수 있었어요."
 colony.9855.name: "차원의 경계를 넘어"
 colony.9855.desc: "균열이 나타난 이후로 어떤 사회적인 문제가 기승을 부리고 있습니다. 우리 차원의 가족들이 베타 차원에 있는 같은 가족들을 안정적인 우리 우주로 몰래 불러오고 있던 것입니다. 이러한 밀입국은 주로 두 우주가 섞이지 않도록 배치한 경계 경비대원들이 벌이고 있습니다. [Owner.GetName]의 주민 대다수가 경계 너머에 가족이 있기 때문입니다. 일부에 국한된 이야기라면 대수롭지 않은 문제겠지만, 이 현상이 확산될 경우 걷잡을 수 없이 인구가 유입될 것입니다. 그리고 §B[Owner.GetHomeWorldName]-베타§!에서 주민이 대거 이탈한다면, 사회 기반 시설이 붕괴되어 행성을 옮기기가 훨씬 어려워집니다."
 colony.9855.a: "들어오게 두세요."
 colony.9855.b: "이쪽으로 넘어오지 않게 막으세요."
 colony.9855.c: "면회 시간을 정합시다."
 colony.9860.name: "미션: 디멘셔널"
 colony.9860.desc: "평행 세계가 가까이에 있는 덕분에 얻을 수 있는 장점 중 하나는, 지난 몇 년 동안 부서지거나 없어진 [Owner.GetSpeciesName]의 문화유산이 다른 쪽 행성에 있을 수도 있다는 것입니다. 모두가 그 유산을 다시 감상할 수 있는 것이죠. 그러나 어떤 질 나쁜 자들이 이것을 기회로 삼아 §B[Target.GetName]-베타§!에 침투해 유산을 탈취하는 사건이 일어났습니다. 과거에 위대한 발명가가 만든 걸작이 우리 행성에 두 개나 존재하는 것입니다. 이미 [Target.GetName]-베타 정부는 약탈당한 유산을 반환해 달라는 내용의 공식 요청을 보내왔습니다."
 colony.9860.a: "유산을 반환하고 진심 어린 사과를 보내세요."
 colony.9860.b: "§H다다익선§!이라는 말이 있지요..."
 colony.9860.c: "두 개보다는 §H세§! 개가 낫지 않겠습니까..."
 colony.9870.name: "최후의 간청"
 colony.9870.desc.helped: "가뜩이나 절박했던 베타 우주의 상황이 점차 악화되고 있습니다. 오늘 새벽에는 일제히 구해 달라 간청하는 울부짖음이 차원문으로부터 들려왔습니다. 최선을 다하고 있음에도 불구하고, 저 우주의 동족들은 그곳을 노리는 공허와 하나가 될 운명인 것으로 보입니다. 다른 차원의 우리 자신을 구하려면 지금 움직여야 합니다."
 colony.9870.desc.ignored: "오늘, 차원문 너머의 베타 우주에서 도와 달라 울부짖는 한심한 목소리가 들려왔습니다. 자신들을 구해 달라며, 마지막으로 나지막한 신음을 보내온 것입니다. 우리에게 지금까지 이용당해 왔음에도 불구하고, 홀로 남은 그 우주에서는 달리 호소할 상대가 없기에, 우리에게 도움을 구하고 있습니다. 이제 돌아올 수 없는 지점이 다가오고 있습니다. 곧 베타 우주의 [Owner.GetSpeciesNamePlural](은)는 사라질 것입니다."
 colony.9870.a: "노력을 더욱 기울이세요. 여기에서 끝낼 순 없습니다."
 colony.9870.a.tooltip: "§Y$approach_save_b_world$§! 접근 방식을 선택하려면 과학자가 더 필요하며, 연구 속도가 총 §R30%§! 감소합니다."
 colony.9870.b: "전부 계획대로 되고 있습니다."
 colony.9870.c: "저들도 [Owner.GetSpeciesNamePlural]의 동족입니다. 여기에서 끝낼 순 없습니다!"
 colony.9875.name: "최적화 위탁"
 colony.9875.desc: "우리와 유사한 제2의 [Owner.GetGovernmentName](이)가 생긴 덕분에 전례 없는 기회가 찾아왔습니다. 우리 의식 체계를 유지하는 데 필요한 연산에 많은 [Owner.GetTeamMemberPlural]들이 투입되고 있는데, 이 작업을 이제 제2의 [Root.GetName]에 위탁할 수 있게 된 것입니다. 이러한 위탁 작업은 분명 큰 도움이 될 것입니다. §B[Target.GetName]-베타§!를 회수하는 작업이 느려질 순 있지만, 어떻게든 해낼 수 있을 거라 확신합니다."
 colony.9875.a.machine: "논리적이군요."
 colony.9875.a.hive: "우리 이익에 부합한 조치로군요."
 colony.9875.b: "저들도 [Owner.GetTeamMemberPlural]들이 최대한 필요할 겁니다."
 colony.9880.name: "절박한 드론"
 colony.9880.desc: "계속되는 곤경에 빠진 다른 차원의 [Owner.GetGovernmentName](이)가 갑자기 격분에 차더니 [Target.GetName]에 위치한 [Owner.GetSoldierPlural]들을 장악하는 정신 나간 짓을 저질렀습니다! 이들에게 밀리기 전에 방어 드론을 조직해야 합니다."
 colony.9880.a.machine: "비상 프로토콜: [Target.GetName] 방어"
 colony.9880.a.hive: "이탈 세력을 물리치고 베타 우주를 제압하세요."
 colony.9880.a.tt: "§R100§! £pop£ §H팝§!을 잃는 대신 §Y400§! 방어 지상군을 얻습니다."
 colony.9880.b: "베타 우주가 이렇게 반응한 이유를 분석하세요."
 colony.9885.desc.hive: "마지막 이탈 드론을 처리했습니다. 우리 측 통신 드론에 저쪽 차원에 있는 지배 의식의 존재가 다시 감지되고 있지만, 이 의식은 이번에는 우리가 통신을 개시하기를 기다리며 훨씬 얌전히 행동하고 있습니다.\n\n\"§B우리 의식이 사과를 전합니다. §R노이즈§!가 접근하면서 본능적 반응을 억압하기가 점차 어려워지고 있습니다. 앞으로는 행동을 조심하도록 철저히 주의하겠습니다.§!\""
 colony.9885.desc.machine: "반란을 일으킨 방어 유닛을 처치했습니다. 우리 관측 분석 서브루틴에 [FromFrom.GetName]-베타 측 통신 유닛이 다시 감지되고 있습니다. 상대방이 우리에게 간단한 메시지를 남겼습니다.\n\n\"§B잉여 방어 유닛들이 또다시 부적절한 행동을 취했습니다. §R노이즈§!가 접근하는 틈을 타, 저희 측 격리망을 뚫고 탈출했습니다. 해당 프로세스는 삭제했으니, 이들은 더 이상 아무런 행동도 할 수 없을 겁니다.§!\""
 colony.9885.a.hive: "더 이상 이런 일이 없도록 조치하겠습니다."
 colony.9885.a.hive.tooltip: "수적 우위를 이용해 베타 우주의 군체 의식을 제압합니다."
 colony.9885.b.hive: "이해합니다. 두려워 마십시오."
 colony.9885.a.machine: "[FromFrom.GetName]-알파에 대한 자유 출입 허가를 취소합니다."
 colony.9885.a.machine.tooltip: "상대 차원과 [FromFrom.GetName] 사이에 안전이 보장되지 않은 연결이 없도록 조치합니다."
 colony.9885.b.machine: "이해합니다. 전투 AI는 전복적이기 마련이니까요."
 colony.9890.name: "요구"
 colony.9890.desc: "[FromFrom.GetName](이)가 우리 베타 동족에게 함락되었습니다. 이들은 자신들 드론 중 일부를 즉시 우리 측에 이전하고, 우리 우주에 하위 의식을 구축해 자신들의 지식과 존재를 보존할 것을 요구하고 있습니다."
 colony.9890.a: "끔찍하군요."
 #Modifier
 harvesting_negative_mass: "음질량 입자 채취"
 harvesting_negative_mass_desc: "음질량 입자를 채취해, 우리 제국의 물리학 연구를 촉진합니다."
 appeased_populace: "진정된 대중"
 appeased_populace_desc: "차원 간 이주에 대한 요구를 수용하자, 다른 우주에 있는 주민들의 마음이 진정되었습니다."
 angered_populace: "분노한 대중"
 angered_populace_desc: "차원 간 이주 기회를 차단하자, 이 행성의 주민들이 격앙된 반응을 보이고 있습니다."
 stolen_great_work: "도난당한 문화유산"
 stolen_great_work_desc: "거울 차원에서 가져온 문화유산이 우리 행성에 있는 동일한 문화유산 옆에 자랑스럽게 전시되어 있습니다."
 multiple_stolen_great_works: "도난당한 문화유산"
 multiple_stolen_great_works_desc: "베타 우주에서 가져온 갖가지 문화 유산이 이 행성의 벽을 장식하고 있습니다."
 offloaded_optimization: "최적화 위탁 완료"
 offloaded_optimization_desc: "일상적 연산 작업을 베타 우주에 위탁하자, 우리 제국의 생산 능력이 크게 향상되었습니다."
 b_world_saved: "구조 완료"
 b_world_saved_desc: "이 행성은 구조해 준 것에 감사하고 있습니다."
 #Names
 NAME_B_Planet: "[Root.GetHomeWorldName]-베타"
 NAME_Portal_Invaders: "차원문 침공군"
 NAME_B_World_Corvette: "구식 초계함"
 NAME_Familiar_Fleet: "익숙한 함대"
 NAME_controlled_army: "세뇌된 군대"
 NAME_Dominated_Drones: "지배당한 드론"
 #Traits
 trait_notofthisworld: "이계의 존재"
 trait_notofthisworld_desc: "§B이 종족은 이 우주 출신이 아니며, 천천히 쇠퇴하고 있습니다.§!"
 trait_robot_notofthisworld: "이계의 존재"
 trait_robot_notofthisworld_desc: "§B이 기계들은 이 우주 출신이 아니며, 천천히 쇠퇴하고 있습니다.§!"
 TRAIT_NOTOFTHISWORLD_EFFECT: "노예 이상의 직업을 가진 각 $pop_group_unit$ £pop£ §H팝§!이 매월 0.5 £physics_research£ §Y물리학 연구§!를 생산합니다."
 #Event Chain
 negative_mass_title: "음의 질량"
 negative_mass_desc: "최근 모성 곳곳에 음의 질량이 나타났습니다. 부디 이 기이한 현상이 우리 사회의 근간을 뒤흔들 사건의 전조는 아니기를 바랍니다."
 #Singing Planet
 SINGING_PLANET_CAT: "이상한 수치"
 SINGING_PLANET_CAT_DESC: "이 행성에서는 지금까지 본 적이 없는 이상한 자기파가 방출됩니다. 우리와 교신하려는 것이 아닌가 싶을 정도입니다. 행성 규모의 생명체라는 이례적인 사례와 조우한 것일 수 있으니, 이 기이한 현상을 조사해 보는 편이 논리적일 것입니다."
 anomaly.7101.name: "노래하는 행성"
 anomaly.7101.standard.desc: "처음에는 우리와 교신을 시도하는 것으로 추정됐던 이 행성의 자기파는 흔치 않은 자연 현상인 것으로 밝혀졌습니다. 행성에서 방출되는 자기파를 적절하게 가공하고 편집하면 노랫소리나 말소리와 비슷한 소리가 들리지만, 사고 능력이 있는 존재가 만들어낸 소리는 전혀 아닙니다. 하지만 일부 과학자는 이 소리가 듣기 좋다고 생각하는 것 같습니다.\n\n이 현상을 이용할 수 있을지 모릅니다. 이 신호를 수신하기 위한 기지를 짓고, 예술가와 주요 인사를 기지에 초청해서 이 행성의 소리를 잔잔한 음악처럼 틀어주는 것입니다."
 anomaly.7101.a: "아주 흥미롭군요."
 anomaly.7101.machines.desc: "우리 탐사 드론들은 이 행성에서 방출되는 일련의 신호가 인위적인 것일 가능성이 있다고 추측했습니다. 그러나 더욱 자세히 살펴본 결과, 이 신호는 특이하지만 별 해악은 없는 자기파가 만들어 내는 것으로, 그저 자연 현상에 불과합니다. 우리 집단은 이번 발견에서 어떠한 즉각적인 편익도 얻을 수 없었지만, 그 특이성을 볼 때 행성을 연구하면 장기적인 연구 데이터를 확보할 수 있을지 모릅니다."
 anomaly.7101.b: "신호를 분류하세요."
 anomaly.7101.hive.desc: "우리 탐사 드론들은 이 행성에서 방출되는 일련의 신호가 인위적인 것일 가능성이 있다고 추측했습니다. 그러나 더욱 자세히 살펴본 결과, 이 신호는 그저 자연 현상에 불과했습니다. 다만 이 현상은 특이하게도 우리 드론과 군체 의식 사이의 연결을 강화하는 특성이 있습니다. 이 행성의 자기파에 노출된 드론은 군체의 의지에 더욱 잘 반응하는 것으로 보입니다."
 anomaly.7101.c: "모든 것은 군체를 위해."
 anomaly.7101.c.desc: "군체는 이 자기파를 복제해, 자신의 의지를 강화하는 데 사용할 수 있습니다."
 #Ancient Manufactorium
 colony.9200.name: "숨겨진 보관고" #starting the event
 colony.9200.desc: "[Root.GetName]에서 통상적인 정찰을 진행하던 중, 우리 행성 탐사 유닛이 산맥의 내부로 이어지는 것으로 보이는 거대한 문을 발견했습니다. 일종의 은폐 장치에서 나오는 강력한 자기장 때문에 우리 함선의 감지기에는 포착되지 않았던 모양입니다. 문 자체에도 위장이 적용되어 있어, 지표면을 탐사하던 자율 연구 탐사정도 감지할 수 없었습니다.\n\n더욱 전문적인 조사를 진행한 결과, 일정 수준의 에너지를 지속적으로 가하면 문을 재가동시키고 개방해 그 안에 무엇이 있는지 확인할 수 있을 것으로 밝혀졌습니다."
 colony.9200.a: "에너지를 주입하세요." #go on with chain
 colony.9200.a.desc: "전력망을 설치하려면 시간이 다소 소요되며, 보관고 탐사 중에는 에너지가 지속적으로 소모됩니다."
 colony.9201.name: "어둠이 기다린다" #entered the vault
 colony.9201.desc: "에너지가 회로에 흘러들자 문이 가동되기 시작했습니다. 이후 문을 자세히 조사하여 그 작동 원리를 알아낼 수 있었습니다. 추가로 지형 조사를 진행한 결과, 내부는 거대한 지하 보관고인 것으로 드러났습니다. 외계종의 시설이 벽면을 빈틈없이 채우고 있었으며, 천장을 지탱하는 기둥에도 희미한 에너지 신호가 나타났습니다. 에너지 수치와 우리 측 기술과의 유사성으로 볼 때, 이곳은 지하 제조 시설인 것으로 보입니다."
 colony.9201.a: "이곳의 비밀을 밝힙시다." #go forward
 colony.9201.a.desc: "이번 임무의 규모를 감안할 때, 철저한 조사를 위해서는 많은 자원과 인력이 필요하며, 조사 기간도 예측할 수 없습니다. 정기적으로 임무 진행 상황을 보고 받아야 할 것으로 예상됩니다."
 colony.9201.b: "너무 위험합니다. 폭발물을 설치하세요." #opt out
 colony.9201.b.desc: "입구를 봉인하고 시설을 파괴합니다. 그 안에 어떤 것이 도사리고 있을지 모르니까요."
 colony.9202.name: "산 터져요!" #opted out - explosion and crater
 colony.9202.desc: "보관고에서 멀리 떨어져 있는 이들조차 땅이 흔들리는 것을 느낄 수 있었습니다. 더욱 가까이에 있는 이들은 산의 일부가 하늘 높이 솟아올라, 그 자리에 바위, 잔해, 부서진 기계가 가득 찬 크레이터가 생기는 모습을 볼 수 있었습니다. 대체 무엇이 문제였는지 빠르게 추측한 결과, 처음 폭발로 문을 뚫었을 때 보관고 안에서 연쇄 반응이 일어났다는 결론이 나왔습니다.\n\n어쨌든 지하 보관고는 이제 연기 나는 크레이터가 되어 버렸습니다."
 colony.9202.a: "이 편이 안전합니다."
 colony.9210.name: "실종!" #first problem
 colony.9210.desc: "처음에 [Root.GetName]에서 조사를 진행할 때는 입구 주변을 파악하는 데 주력했습니다. 보관고의 첫 번째 공간은 산속 깊숙이 뻗어 있는 거대한 전당이었으며, 이곳으로부터 여러 개의 복도가 가지처럼 더욱 깊은 곳으로 이어져 있습니다. 돌을 깎아 만든 기둥에는 정교한 장식의 현판이 걸려 있고, 각 현판에는 이곳을 건설한 것으로 추정되는 외계종의 모습이 그려져 있습니다. 이들의 언어는 아직 이해할 수 없지만, 현판에 그려진 그림은 전쟁과 투쟁, 그리고 원대한 과업을 중심으로 이야기를 풀어 나갑니다.\n\n이보다 불안한 소식이 들려왔습니다. 공사 팀이 어둠 속에서 이상한 소리가 난다고 보고하더니 전부 사라져 버렸다고 합니다. 이대로 가면 상황을 걷잡을 수 없게 되니, 더 적극적인 조치가 필요합니다."
 colony.9210.a: "보안 병력을 두 배로 확대하고 실종자를 수색하세요." #casual
 colony.9210.a.desc: "수색대를 꾸릴 예정이지만, 많은 국민이 이미 최악을 예상하고 있습니다. 보안 병력도 두 배로 확대해 추가 사고를 방지합니다."
 colony.9210.b: "전 인원을 투입해서 찾으세요!" #egalitarian
 colony.9210.b.desc: "실종자를 죽게 내버려 둘 순 없습니다! 자원자로 수색대를 꾸려 실종자를 찾게 합니다!"
 colony.9210.c: "수색대를 구성하고, 나머지는 작업에 복귀시키세요." #authoritarian
 colony.9210.c.desc: "이런 사태가 발생할 것은 이미 예상했습니다. 실종자는 계속 찾아보겠지만, 탐사를 지연할 수는 없습니다. 우리는 대가를 치를 각오가 되어 있습니다."
 colony.9210.d: "충격이군요. 경비 드론을 더 투입하세요." #gestalt
 colony.9210.d.desc: "실종된 유닛을 신규 유닛으로 대체합니다. 연구는 계속 진행해야 합니다."
 colony.9211.name: "작업자 발견" #casual - pop dies and negative modifier
 colony.9211.desc: "우리 보안 팀 중 하나가 실종된 작업자들을 찾았다고 보고했습니다. 알고 보니 이 보관고에는 각종 함정과 장치가 있는데, 무단으로 들어온 이들을 움직이는 벽으로 이루어진 '상자' 안에 가두도록 프로그래밍되어 있다고 합니다.\n\n이 운 나쁜 작업자들은 함정 안에서 전부 사망했습니다. 소식을 들은 국민들은 분노하고 있지만, 적어도 이제는 어디를 조심해야 할지 알게 되었습니다."
 colony.9211.a: "끔찍하군요."
 colony.9212.name: "작업자 구조" #egalitarian - pop survives, negative modifier only
 colony.9212.desc: "대규모 수색대를 꾸린 덕분에, 얼마 안 가 실종된 작업자들을 찾을 수 있었습니다. 마지막에 찾은 작업자들은 어떤 감옥 같은 정사각형 구조물에 갇혀 있었는데, 이 구조물은 분절되어 스스로 움직이는 벽으로 되어 있었습니다. 보관고의 보안 시스템이 아직 작동하는 모양이니, 앞으로는 준비를 더욱 철저히 하여 이러한 함정에 대응할 것입니다. 다만 국민들은 애초에 작업자들을 위해 안전 조치를 취하지 않은 것이 잘못이라며 분노하고 있습니다."
 colony.9212.a: "운이 좋았군요."
 colony.9213.name: "작업자 발견" #authoritarian - pop dies, no negative modifier
 colony.9213.desc: "실종된 작업자들은 4면의 움직이는 벽으로 이루어진 기괴한 장치에 갇혀 있었습니다. 안타깝게도 작업자들은 더는 우리 제국에 보탬이 되지 않겠지만, 이들의 희생 덕분에 함정의 존재를 알게 되었습니다. 현재 작업은 지장 없이 진행 중이며, 현장 작업자들은 이제 불안해하지 않아도 된다며 안도하고 있습니다. 물론 당분간은 말이죠."
 colony.9213.a: "위험할 건 알고 간 거 아닙니까."
 colony.9214.name: "드론 발견" #gestalt - pop dies
 colony.9214.desc: "실종된 드론들은 움직이는 벽이 서로 연결되어 밀폐된 감옥을 만드는, 독특한 장치에 갇혀 있었습니다. 안타깝게도 드론들은 손상이 심해 더 이상 사용할 수 없습니다. 앞으로 탐사 드론들은 이번에 얻은 지식을 이용해 이와 같은 종류의 함정을 해제할 것입니다. 작업은 이제 지장 없이 진행 중입니다."
 colony.9214.a: "안타깝군요. 계속 진행하세요."
 colony.9220.name: "추모의 전당" #first opportunity
 colony.9220.desc: "[Root.GetName]에서 복도를 따라 탐사를 진행하던 중, 이상하게도 다른 복도와 벽과는 달리 도관식 기계가 전혀 없는 넓은 공간을 발견했습니다. 누군지 몰라도, 이 장소를 만든 존재는 이곳에 각별히 공을 들인 듯합니다. 이곳에는 놀라운 상태로 보존된 여러 이족 보행체 조각상이 자리 잡고 있는데, 세부적인 모습을 제외하고는 거의 동일한 모습을 하고 있습니다. 아쉽게도 이 공간의 정체에 대한 증거는, 역사적 존재로 추정되는 이들을 기리는 듯한 기념비를 제외하고는 남아 있지 않습니다."
 colony.9220.a: "조사 결과를 분류하세요." #casual
 colony.9220.a.desc: "아무 가치 없는 낡아 빠진 미술품일 뿐입니다."
 colony.9220.b: "아주 훌륭한 솜씨로 만들었군요." #master crafters
 colony.9220.b.desc: "외계종이 만든 조각상을 본 우리 제국의 공예가들이 놀라움을 금치 못하고 있습니다. 고대의 미학과 조화가 엿보인다는군요."
 colony.9220.c: "정말 굉장한 석공 예술입니다." #sub dwellers
 colony.9220.c.desc: "석재 조각상을 본 우리 국민들은 작품의 수준이 정말로 뛰어나다는 반응을 보였습니다. 이토록 낯선 장소에 이 같은 예술품이 있다니 왠지 안심이 됩니다."
 colony.9220.d: "아름답군요!" #dwarf
 colony.9220.d.desc: "이곳은 마치 우리 제국 최고의 석공과 장인들이 만든 듯한 모습을 하고 있습니다. 단순한 우연일까요?"
 colony.9230.name: "지진 발생!" #earthquake
 colony.9230.desc: "지진계를 통해, [Root.GetName]에 조만간 지진이 일어난다는 사실을 파악했습니다. 작업자들은 대부분 대피했지만, 작업조 하나가 붕괴 위험이 있는 먼 공간에 남아 있습니다. 이들은 해당 공간에서 두 가지 고대 기계를 발견했다고 합니다. 하나는 지상에 연결된 커다란 장치고, 다른 하나는 여러 개의 관으로 벽에 부착되어 있습니다. 이 시설에 중요한 기계인지는 알 수 없으나, 작업자들은 기계 중 하나를 사용해서 벽과 천장을 보강하면 지진에 대응할 수 있을지도 모른다고 판단했습니다."
 colony.9230.a: "벽에 붙은 관을 사용하세요." #casual 1
 colony.9230.b: "커다란 기계를 사용하세요." #casual 2
 colony.9230.c: "현장에서 판단하게 하세요." #builders
 colony.9230.d: "군체는 답을 찾을 것입니다." #hive divided attention
 colony.9231.name: "안전제일" #casual 1 more upkeep
 colony.9231.desc: "작업자들이 기계를 해체해 벽과 천장을 보강하는 데 성공했습니다. 하지만 이 작업으로 벽에 있는 방대한 배관이 드러났고, 그곳에서 쉬익거리는 소리가 나오고 있습니다. 현재로서는 잠재적 손실을 판단하기가 불가능한 상황입니다."
 colony.9231.a: "성공이군요."
 colony.9232.name: "안전 대책" #casual 2 less produce
 colony.9232.desc: "작업자들이 기계를 해체해 기존의 낡은 벽과 천장을 보강하는 데 성공했습니다. 하지만 그럴 가치가 있었을까요? 커다란 기계를 들어내자 바닥에 커다란 구멍이 생겼으며, 구멍 아래로 깊숙이 이어져 있는 기계 설비가 보입니다. 이 조치로 인한 잠재적 손실은 현재로서는 전혀 알 수 없습니다."
 colony.9232.a: "성공이군요."
 colony.9233.name: "긴급 공사" #builders - bad thing averted
 colony.9233.desc: "상황을 정확히 파악한 우리 작업자들이 고대 기계를 부수지 않고 주변을 수리해 지지력을 보강하는 데 성공했습니다."
 colony.9233.a: "잘됐습니다."
 colony.9234.name: "새로운 접근 방식" #divided attention - bad thing averted
 colony.9234.desc: "여러 드론의 감각 인상 정보를 취합한 결과, 더 나은 해결책으 찾아냈습니다. 단순노동 드론 몇 개를 자재로 이용해 공간을 안전한 수준까지 보강한 것입니다."
 colony.9234.a: "학습. 적응. 극복."
 colony.9240.name: "통찰" #guardians
 colony.9240.desc: "[Root.GetName]에서 진행 중인 탐사 임무가 마침내 결실을 맺었습니다. 우리가 처음에 예상했던 것이 맞았습니다. 이 보관고의 정체는 거대한 주조 공장입니다. 현장의 외계어를 분석하여, 이곳의 이름이 왕립 주조소라는 것을 알아냈습니다. 하지만 주조소가 가동되는 일은 없었습니다. 이곳을 만든 존재들은 건설을 마칠 기술을 갖추지 못했던 모양입니다.\n\n주조소의 심장부에 들어갈 수 있다면, 우리가 직접 공사를 완료할 수 있을지도 모릅니다. 안으로 가는 길은 육중한 문이 막고 있지만, 우리 기술자들은 문을 열 수 있다고 장담하고 있습니다. 하지만 문에는 어떠한 개폐 장치나 잠금장치도 없기 때문에, 일정한 수준의 힘을 가해야 열 수 있을 것으로 보입니다."
 colony.9240.a: "문을 살살 열어 보세요." #casual 1
 colony.9240.a.desc: "전동 공구와 중장비로 문을 뜯어 열어봅니다. 운만 따라 준다면, 별문제 없이 들어갈 수 있을 것입니다."
 colony.9240.b: "문을 폭파하세요." #casual 2
 colony.9240.b.desc: "거친 방법을 써야 문제가 해결될 때도 있는 법입니다. 폭발물을 설치해 문을 날려 버립니다."
 colony.9240.c: "문을 더 조사하세요." #spiritualist
 colony.9240.c.desc: "서두르면 안 됩니다. 이전에도 여러 번 함정에 당했습니다. 쉬운 길이 있어도 돌아가는 것이 나을 때가 있는 법입니다."
 colony.9240.d: "다른 길을 찾으세요." #meritocracy
 colony.9240.d.desc: "우리는 뜻밖의 방법으로 문제를 해결하는 데 능숙합니다. 안으로 들어가는 다른 길을 찾을 수 있을지도 모릅니다."
 colony.9240.e: "문에 구멍을 내세요." #gestalt
 colony.9240.e.desc: "드론들로 문을 자르면 쉽게 들어갈 수 있습니다. 시간은 걸리겠지만, 우주에는 남는 게 시간이니까요."
 colony.9241.name: "가스, 가스, 가스!" #casual 1 pop dies
 colony.9241.desc: "문을 강제로 열자, 벽을 덮은 기계에서 유독 가스가 나오기 시작했습니다. 안타깝게도 워낙 빠르게 벌어진 일이라 많은 사상자가 발생했습니다. 작업자 전원 시설에서 대피해야 했으며, 안전하게 출입할 수 있을 때까지 한동안은 피해 있어야 할 것입니다."
 colony.9242.name: "폭발!" #casual 2 lowered production
 colony.9242.desc: "폭발물로 문을 손쉽게 열었지만, 예상하지 못한 일이 발생했습니다. 폭발 후에 복도로 가스가 뿜어져 나온 것입니다. 이 가스는 인화성이 강해, 예전부터 이곳에 있던 기계 중 일부가 파괴되었습니다. 다행히 폭발 범위에 작업자가 없어, 사상자는 발생하지 않았습니다."
 colony.9243.name: "명상" #spiritualist bad thing averted
 colony.9243.desc: "운인지 초월자의 개입인지, 길을 막고 있던 문이 우리의 아침 의식에 반응했습니다. 희미한 공명의 화음이 들렸으며, 우리는 이 공명음을 이용할 수 있게 되었습니다. 작은 표식으로 가려진 카메라 렌즈 앞에 서서 일련의 동작을 정확히 취하자, 별다른 어려움 없이 안으로 들어갈 수 있었습니다."
 colony.9243.a: "초월자의 선물이군요."
 colony.9244.name: "제3의 길" #meritocracy bad thing averted
 colony.9244.desc: "추가 조사를 시작한 지 얼마 되지 않아, 문에서 보안 카메라 내지 스캐너 역할을 하는 장치를 찾아냈습니다. 장치를 해킹하는 일은 쉽지 않았지만, 결국 장치의 프로그래밍과 기본 기능을 해독할 수 있었으며, 덕분에 별다른 문제 없이 문을 지날 수 있었습니다."
 colony.9244.a: "수고했습니다."
 colony.9245.name: "가스" #gestalt bad thing averted
 colony.9245.desc: "문에 구멍을 뚫던 중, 우리 드론들이 일종의 방어 장치를 건드렸는지, 무기화된 가스가 복도로 방출되었습니다. 다행스럽게도 우리 집단은 미리 대비를 갖추고 있었으며, 가스는 곧 흩어졌습니다. 드론들은 이미 현장에 복귀한 상태입니다."
 colony.9245.a: "계속 작업하세요."
 colony.9250.name: "주조소의 심장부" #starting the project
 colony.9250.desc: "[Root.GetName]에 위치한 주조소의 심장부에는 그물망처럼 얽힌 온갖 파이프와 컨베이어 벨트, 그리고 작업대로 보이는 물건들이 가득합니다. 빠르게 탐사한 결과에 따르면, 이 주조소에는 동력, 정비 및 핵심 시스템이 없습니다. 게다가 앞선 탐사 작업으로 주조소 내부가 영향을 받은 듯합니다. 수리를 시도할 수는 있지만, 시간이 다소 소요될 수 있습니다. 아니면, 고철 처리장을 만들고 기계를 전부 해체할 수도 있습니다."
 colony.9250.a: "수리하세요." #casual
 colony.9250.a.desc: "기계를 행성 전력망에 연결하고 수리합니다."
 colony.9250.b: "수리하고 조사하세요." #technocracy + 1 engineering output
 colony.9250.b.desc: "기계를 고치는 것만으로는 부족합니다. 기계의 작동 원리를 알아야 합니다."
 colony.9250.c: "주조소를 고치는 게 우리의 사명입니다." #philosopher king + 1 society output
 colony.9250.c.desc: "우리 제국이 이 주조소를 사용하게 되며, 어쩌면 이곳에 살던 주민들에 관한 지식을 배우게 될지 모릅니다."
 colony.9250.d: "군체를 위해 사용합시다." #natural neural network + 1 society output
 colony.9250.d.desc: "우리 군체가 이 주조소를 사용하게 되며, 어쩌면 이곳에 살던 주민들에 관한 지식을 배우게 될지 모릅니다."
 colony.9250.e: "수리하고 조사하세요." #introspective + 1 engineering output
 colony.9250.e.desc: "기계를 고치는 것만으로는 부족합니다. 기계의 작동 원리를 알아야 합니다."
 colony.9250.f: "해체하세요." #opting out - creation of salvage yards
 colony.9250.f.desc: "고철 처리장을 세우고 천천히 기계를 해체합니다."
 colony.9251.name: "주조소 가동" #special project finished
 colony.9251.desc: "[Root.GetName]에 위치한 굶주린 기계에 에너지가 흘러들어 갔습니다. 귀가 멀 정도의 굉음과 함께 기계의 도관에 액화된 광물이 흐르기 시작하면서, 시설 전체가 밝아지고 예열되었습니다. 원자재는 작업자들이 원하는 모양과 밀도의 합금을 만들 수 있도록 작업대로 옮겨졌습니다. 주조소의 모든 부분이 오직 이 작업을 위해 만들어진 듯합니다. 기둥조차 단순히 천장을 지탱하는 것 이상의 역할을 하고 있었습니다."
 colony.9251.a: "계속 진행하세요."
 colony.9260.name: "작업 여건" #working conditions
 colony.9260.desc: "[Root.GetName]에 있는 주조소의 주 작업장에 유독 가스가 차오르고 있다는 우려가 제기되었습니다. 치명적일 정도는 아니지만, 작업대 사용자가 피해를 입을 수 있습니다. 주조소를 온전히 활용하려면, 안전 조치를 취해야 합니다."
 colony.9260.a: "그냥 교대로 작업하게 하세요." #casual 1 - lowered happiness for working pops
 colony.9260.a.desc: "몸에 이상이 생기기 전에 작업자를 교대합니다. 작업자들에게 이따금씩 두통이 생길 수 있습니다."
 colony.9260.b: "작업 시간을 조절하세요." #casual 2 - lowered production
 colony.9260.b.desc: "휴식 시간을 부여해, 가스가 흩어지게 하여 작업장의 안전을 확보합니다."
 colony.9260.c: "노예를 투입하세요." #slaver guilds - bad outcome averted
 colony.9260.c.desc: "노예야 죽든 말든 누가 상관하겠습니까? 더 나은 옷만 입혀주면, 자기 건강이 어떻게 되든 기꺼이 일할 겁니다."
 colony.9260.d: "작업 규정을 엄격하게 제정하세요." #shared burdens - bad outcome averted
 colony.9260.d.desc: "교대 근무와 작업 시간을 조정하고 현장 안전 조치를 취해, 생산성을 해치지 않는 선에서 위험을 완화해야 합니다."
 colony.9260.e: "드론을 교대시키세요." #gestalt - bad outcome averted
 colony.9260.e.desc: "의식이 목적을 이룰 때까지, 모든 드론이 의식을 위해 일합니다."
 colony.9270.name: "재활용 센터" #recycling
 colony.9270.desc: "[Root.GetName]의 주조소에는 생산 폐기물 재활용으로 생산 효율성을 올려 주는 전용 재활용품 가공실이 있습니다. 이곳을 다시 가동하면 도움이 될 수 있습니다."
 colony.9270.a: "가동하세요." #casual
 colony.9270.a.desc: "재활용 센터를 가동합니다."
 colony.9270.b: "우리 제국의 설계를 사용하세요." #environmentalist/zerowaste/ascetic - lower upkeep
 colony.9270.b.desc: "우리 제국의 재활용 기술이 더 뛰어납니다. 해당 기술을 이곳의 기계에 적용합니다."
 colony.9270.c: "이걸로 합금 생산을 증가시키세요." #barbaric despoilers and purifiers - increased production
 colony.9270.c.desc: "재활용실을 광물 정제 시설로 개조시킬 수 있습니다. 이 경우, 생산량이 증가합니다."
 colony.9280.name: "거의 완성?" #increase production and upkeep
 colony.9280.desc: "[Root.GetName]의 주조소에서 진행 중인 작업이 거의 완료되었으나, 아직 기존의 설계 및 작업 방식을 개선할 수 있는 여지는 있습니다. 광물 투입량을 늘린다면, 합금 생산이 증가할 것으로 추정됩니다."
 colony.9280.a: "외계 기계에 너무 부담을 주지는 맙시다." #casual - don't use the opportunity
 colony.9280.a.desc: "기회를 활용하지 않습니다."
 colony.9280.b: "그렇게 하세요." #casual - use the opportunity, upkeep and production up
 colony.9280.b.desc: "생산량이 증가하지만, 광물 유지비도 증가합니다."
 colony.9280.c: "유기물을 쓰면 어떨까요?" #catalytic processing - change some minerals upkeep to food upkeep
 colony.9280.c.desc: "일부 광물을 유기물로 대체합니다. 단, 완전히 대체할 수는 없습니다."
 colony.9280.d: "우리가 예전에 쓰던 기술 같군요." #remnants - better ratio for increasing the production vs upkeep
 colony.9280.d.desc: "우리는 한때 방대한 제국을 지배했으며 타의 추종을 불허하는 기술을 지니고 있었습니다. 최근에 재발견한 여러 가지 기술로 주조소의 생산성을 높일 수 있습니다."
 colony.9290.name: "신장개업" #ending, final touches
 colony.9290.desc: "드디어 끝났습니다! [Root.GetName]의 주조소가 이제 완전히 가동 중입니다. 공장을 원래 지은 이들이 설계한 대로는 아닐 수 있지만, 여전히 굉장한 광경입니다. 합금 생산 효율성도 매우 높은 수준입니다. 이제 남은 일은 우리의 결단과 독창성이 맺은 결실을 누리는 것뿐입니다."
 colony.9290.a: "경사스럽군요!" #casual, some happiness empirewide for 2 years
 colony.9290.b: "원래 주인들은 어떻게 되었을까요?" #memorialists - add chronicler job
 colony.9290.b.desc: "주조소를 건설한 종족이 어떻게 되었는지는 정확히 알아내지 못했습니다. 이들은 자신들에 관한 모호한 정보만을 남겨둔 채 사라져 버린 것 같습니다. 모을 수 있는 정보를 모두 모아 기록하고 보존해야 할 것입니다."
 colony.9290.c: "감독관이 필요합니다." #aristocratic elite - appoint noble job to oversee the factory
 colony.9290.c.desc: "이러한 사업은 엘리트층이 감독하는 것이 관례입니다. 유력 귀족 중에서 감독관을 임명해 새로 주조소를 관리하게 해야 합니다."
 colony.9290.d: "경영자를 임명하세요." #megacorp - appoint executive job to oversee the factory
 colony.9290.d.desc: "이러한 사업은 간부가 감독하는 것이 논리적입니다. $job_executive_with_icon$를 임명해 새 주조소를 관리하게 해야 합니다." #appoint an Executive to take care of...
 colony.9290.e: "좋습니다." #gestalt - nothing, just start working
 colony.9295.name: "금속성 웅덩이"
 colony.9295.desc: "개척민들이 얼마 전 비가 내린 [Root.GetName]의 지표면에 금속성 웅덩이가 생긴 것을 발견했습니다. 이 웅덩이는 액체 금속처럼 높은 점도를 지니고 있습니다."
 colony.9295.a: "내버려 두세요. 독성이 있을지도 모릅니다!"
 colony.9295.b: "더 자세히 조사하세요!"
 colony.9296.name: "은색의 점액질"
 colony.9296.desc: "[Root.GetName]에서 발견한 끈적이는 금속성 웅덩이가 커지고 있으며, 이제는 그 은색 점액질이 광활한 대지를 덮어 버렸습니다. 이 웅덩이들은 비가 올 때마다 커지는 것으로 보입니다."
 colony.9296.a: "방호복을 입고 조사하세요!"
 colony.9299.name: "정체 모를 점액질"
 colony.9299.desc: "[Root.GetName]의 과학자들이 끈적이는 금속성 웅덩이가 무엇인지 파악하는 데 애를 먹고 있습니다. 아직까지 기원을 밝혀내지 못했으며, 탐사 작업도 난항을 겪고 있습니다. 측정을 해 봐도 웅덩이의 화학 성분을 파악하기 힘듭니다. 답을 찾으려면 더 많은 검사가 필요할 것입니다."
 colony.9299.a: "계속 시도하세요!"
 colony.9297.name: "사라진 웅덩이"
 colony.9297.desc: "사라졌습니다! [Root.GetName]에 생겨난 끈적이는 금속성 웅덩이가 마치 증발이라도 한 듯 모습을 감췄습니다. 하지만 웅덩이가 언제 다시 생길지 모르는 일입니다..."
 colony.9297.a: "문제가 알아서 해결될 때도 있는 법이죠..."
 colony.9298.name: "다시 나타난 은색 점액질"
 colony.9298.desc: "다시 나타났습니다! [Root.GetName]에 생겨난 끈적이는 금속성 웅덩이가 돌아왔습니다. [Root.GetName]의 개척민들은 아직까지도 웅덩이의 정체를 파악하지 못한 상태입니다. 이제 두 번째 기회가 찾아왔습니다. 기회가 있을 때 조사를 진행해야 합니다."
 colony.9298.a: "두 번째 기회라..."
 colony.9300.name: "지도자님, 새 원소를 발견했습니다!"
 colony.9300.desc: "[Root.GetName]에서 새 원소를 발견했습니다! 끈적이는 금속성 웅덩이를 연구하는 과정에서 마침내 돌파구를 찾았고, 이 웅덩이가 특이한 화학 원소로 이루어져 있다는 점을 밝혀냈습니다. [Root.GetName]오니움으로 이름을 붙인 이 원소는 [Root.GetName]의 대기 중에 섞여 있지만, 강수량이 많은 날에는 행성 표면에서 본 것처럼 끈끈한 형태로 변하게 됩니다. 그리고 일산화 이수소, 즉 평범한 물로 된 웅덩이처럼 주기적으로 나타나는 것으로 보입니다.\n\n실로 놀라운 발견입니다. 해당 원소에 관해 점점 더 많은 것을 알아 가고 있습니다." #This string contains a linguistic joke of appending 'onium' to the end of a planet name to create a new chemical element, e.g. 'Earthonium'. I think it's amusing in English, but I'm unsure how it will be read in other languages.
 colony.9300.a: "우린 아직 배울 것이 많군요."
 FASCINATING_METEOROLOGY_PROJECT: "흥미로운 기상 현상"
 FASCINATING_METEOROLOGY_PROJECT_DESC: "[Root.GetName]의 흥미로운 기상 현상을 연구하면 과학 발전에 크게 기여할 지식을 얻을 수 있을 것입니다."
 colony.9301.name: "귀중한 통찰"
 colony.9301.desc: "[Root.GetName]의 독특한 기상 현상에 관한 귀중한 통찰을 얻었습니다. 최근 연구로 화학 원소에 관한 지식이 확대되는 동시에, 식량 생산에도 긍정적인 영향이 있었습니다."
 colony.9301.a: "긍정적인 결과로군요."
 puddle_technician: "$job_puddle_technician$"
 job_puddle_technician: "웅덩이 기술자"
 job_puddle_technician_plural: "웅덩이 기술자"
 job_puddle_technician_desc: "식량 생산의 다각화는 노력할 보람이 있는 작업입니다."
 mod_job_puddle_technician_add: "$job_puddle_technician$ 직업"
 d_metallic_puddles: "금속성 웅덩이"
 d_metallic_puddles_desc: "웅덩이 기술자들은 희귀한 기상 현상을 이용해 식량과 합금을 동시에 채취합니다."
 #d_metallic_puddles_gestalt: "$d_metallic_puddles$"
 #d_metallic_puddles_gestalt_desc: "Rare meteorology allows Puddle Technicians to harvest food and alloys simultaneously."
 puddle_technician_drone: "$job_puddle_technician_drone$"
 job_puddle_technician_drone: "웅덩이 기술자 드론"
 job_puddle_technician_drone_plural: "웅덩이 기술자 드론"
 job_puddle_technician_drone_desc: "독특한 기상 현상을 이용해 추가 자원을 채취하면 군체에 도움이 될 것입니다."
 mod_job_puddle_technician_drone_add: "$job_puddle_technician_drone$ 직업"
 d_ancient_manufactorium_working: "가동 중인 공장"
 d_ancient_manufactorium_working_desc: "완전 가동 상태인 외계 공장으로, 우리 제국이 사용할 귀중한 자원을 생산하고 있습니다."
 d_ancient_manufactorium_scrapyard: "공장 고철 처리장"
 d_ancient_manufactorium_scrapyard_desc: "해체에 특화된 작업장으로, 낡은 기계를 해체해 유용한 자재로 바꿉니다."
 d_ancient_manufactorium_vaultexploration: "산악 보관고"
 d_ancient_manufactorium_vaultexploration_desc: "현재 조사대가 이 거대한 지하 복합 단지를 탐사하고 있으나, 이로 인해 행성 전력망이 부담을 받고 있습니다."
 d_ancient_manufactorium_crater: "파괴된 보관고"
 d_ancient_manufactorium_crater_desc: "보관고가 있던 자리에는 이제 기계류와 잔해로 가득 찬 크레이터만이 남았습니다. 당장 쓸만한 것은 거의 없지만, 재활용이 가능한 자재는 손쉽게 구할 수 있습니다."
 job_manufactorium_specialist: "운용원"
 job_manufactorium_specialist_plural: "운용원"
 job_manufactorium_specialist_desc: "이 고도로 숙련 작업자들은 정교한 고대 기계를 운용해, 통상적인 비용의 극히 일부분만으로 자원을 만들어 냅니다."
 mod_job_manufactorium_specialist_add: "$job_manufactorium_specialist$ 직업"
 job_manufactorium_complex_drone: "운용 드론"
 job_manufactorium_complex_drone_plural: "운용 드론"
 job_manufactorium_complex_drone_desc: "이 고도로 전문화된 드론들은 정교한 고대 기계를 운용해, 통상적인 비용의 극히 일부분만 사용하여 자원을 만들어 냅니다."
 mod_job_manufactorium_complex_drone_add: "$job_manufactorium_complex_drone$ 직업"
 manufactorium_scraper: "$job_manufactorium_scraper$"
 job_manufactorium_scraper: "해체 작업자"
 job_manufactorium_scraper_plural: "해체 작업자"
 job_manufactorium_scraper_desc: "고대 기계를 해체하는 것은 위험하지만 보람 있는 작업입니다. 시설의 규모를 생각하면, 해체 작업자들이 할 일이 많을 듯합니다."
 mod_job_manufactorium_scraper_add: "$job_manufactorium_scraper$ 직업"
 job_manufactorium_scraper_drone: "해체 드론"
 job_manufactorium_scraper_drone_plural: "해체 드론"
 job_manufactorium_scraper_drone_desc: "고대 기계를 해체하는 것은 위험하지만 보람 있는 작업입니다. 시설의 규모를 생각하면, 해체 드론들이 할 일이 많을 듯합니다."
 mod_job_manufactorium_scraper_drone_add: "$job_manufactorium_scraper_drone$ 직업"
