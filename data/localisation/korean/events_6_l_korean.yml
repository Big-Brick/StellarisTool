 #Planet Modifiers
 planet_myrmeku_attacks: "미르메쿠 공격"
 planet_myrmeku_attacks_desc: "[Owner.GetColonistPluralCapital]들이 소형 곤충에 습격당했습니다."
 planet_myrmeku_seal_colony: "$planet_myrmeku_attacks$"
 planet_myrmeku_seal_colony_desc: "현지 소형 곤충을 막기 위한 특별 조치를 취해, 모든 건물을 봉쇄했습니다."
 planet_myrmeku_upgrade_robots: "$planet_myrmeku_attacks$"
 planet_myrmeku_upgrade_robots_desc: "[Owner.GetColonistPluralCapital]에 내부 기계 장치를 보호하기 위한 추가 보호층을 설치했습니다."
 planet_myrmeku_pest_control: "$planet_myrmeku_attacks$"
 planet_myrmeku_pest_control_desc: "지표면의 곤충 군집을 박멸하는 작업을 최우선 과제로 삼았습니다."
 planet_myrmeku_lured: "자원 우회"
 planet_myrmeku_lured_desc: "메모리 칩 절연 물질을 해당 영역 전역에 배포했습니다."
 #Special Project
 MYRMEKU_STUDY_PROJECT: "미르메쿠 조사"
 MYRMEKU_STUDY_PROJECT_DESC: "[myrmeku_planet.GetName]에서 미르메쿠를 조사해, 그 왕성한 활동력을 유용하게 활용할 수 있는 방법을 알아봅니다."
 #Events
 colony.9350.name: "미르메쿠 활동"
 colony.9350.desc: "§Y[Root.GetName]§!에 정착한 이후로 절지류 동물의 활동이 증가한 것이 파악되었습니다. 특히 작은 크기의 군집형 곤충인 일명 '미르메쿠'가 예상외의 번식력을 보이고 있습니다.\n\n미르메쿠가 만든 지하 군집이 대륙 전역에 대규모로 확산되고 있지만, 아직까지 이렇다 할 문제는 없습니다. 미르메쿠들이 지상에 있는 무언가를 찾는 것인지, 지하에 있는 모종의 존재로부터 도망치고 것인지는 아직 알려지지 않았습니다."
 colony.9350.a.mem_vault: "지식의 보고에 '미르메쿠' 항목을 추가합시다." #Civic Vaults of Knowledge
 colony.9350.a.exp_prot: "아주 흥미로운 생물이군요." #Civic Exploration Protocols
 colony.9355.name: "[Owner.GetColonistPluralCapital] 습격"
 colony.9355.desc: "§Y[Root.GetName]§!에 있는 [Owner.GetColonistPlural]들이 잔혹한 습격을 당했습니다! 군집에 너무 가까이 다가간 [Owner.GetColonistPlural]들을 미르메쿠 무리가 덮쳤고, 이들의 골격에 있는 틈으로 기어들어 가 순식간에 제압한 것입니다.\n\n희생된 [Owner.GetColonistPlural]들은 즉시 해체했지만, 이 곤충들의 목적을 확실히 밝혀 줄 데이터는 나오지 않았습니다. 미르메쿠의 울퉁불퉁한 외골격은 자성을 띠어 우리 내부 회로를 손상시키며, 미르메쿠 두 마리가 서로 접촉하면 작은 전기 스파크가 생깁니다. 두 가지 모두 우리에게 심각한 장애를 유발할 수 있습니다.\n\n이렇게 [Owner.GetColonistPlural]들을 잃는 바람에 [Root.GetPlanetMoon]의 발전이 저해되고 있습니다. 반드시 조치를 취해야 합니다."
 colony.9355.a: "해결책을 찾으세요."
 colony.9360.name: "메모리 포식자"
 colony.9360.desc: "미르메쿠 군집이 굉장한 속도로 정착지 근처에 광범위한 구조물들을 세웠습니다. 그리고 이제는 경계를 넘어 우리 주거 시설 내부까지 공격하기 시작했습니다.\n\n다수의 미르메쿠 표본을 해부한 결과, 미르메쿠가 우리에게 관심을 가지는 섬뜩한 이유가 드러났습니다. 이 곤충이 우리 §Y메모리 칩§!에 쓰이는 절연 소재를 먹이로 섭취했던 것입니다.\n\n메모리 회로는 교체와 백업이 가능하기 때문에 희생자들은 단기적인 피해를 볼 뿐이지만, 부품 교체로 인해 신규 [Owner.GetColonistPlural]의 생산이 지연됩니다."
 colony.9360.a: "식민지를 봉쇄하세요."
 colony.9360.a.tt: "건물 보전에 주력합니다.\n\n§Y$planet_myrmeku_attacks$§! 보정치를 다음으로 변경:\n기계식 팝 조립 속도: §R-10%§!\n행성 기반 시설 건설 속도: §R-10%§!"
 colony.9360.b: "주민들의 신체를 개량하세요."
 colony.9360.b.tt: "[Owner.GetColonistPlural] 보전에 주력합니다.\n\n§Y$planet_myrmeku_attacks$§! 보정치를 다음으로 변경:\n기계식 팝 조립 속도: §R-10%§!\n로봇 유지비: §R+10%§!"
 colony.9360.c: "미르메쿠 군집을 파괴하세요."
 colony.9360.c.tt: "공격이야말로 최선의 방어입니다.\n\n§Y$planet_myrmeku_attacks$§! 보정치를 다음으로 변경:\n기계식 팝 조립 속도: §R-30%§!\n\n"
 colony.9360.d.org_repro: "곤충들을 잡아들이세요." #Civic Organic Reprocessing
 colony.9360.d.tt: "우리는 어떤 유기체든 활용할 방법을 찾습니다.\n\n§Y$planet_myrmeku_attacks$§! 보정치를 다음으로 변경:\n기계식 팝 조립 속도: §R-30%§!\n\n"
 colony.9360.e.purifier: "행성의 생명체를 전부 없애 버리세요." #Civic Determined Exterminator
 colony.9360.e.tt: "이 경우, 미르메쿠가 멸종합니다."
 colony.9365.desc: "해충 방역"
 colony.9365.desc.seal_colony: "미르메쿠의 침입을 막기 위해 §Y[Root.GetName]§! 식민지의 모든 건물을 봉쇄했습니다.\n\n새로 짓는 건물은 물론 기존 건물에도 입구에 자력으로 미르메쿠를 포획할 수 있는 금속 띠를 장착했습니다. 그러나 건물 밖에서는 [Owner.GetColonistPlural]들이 여전히 미르메쿠의 희생양이 되고 있습니다."
 colony.9365.desc.upgrade_robots: "메모리 칩 외장에 보호층을 추가하는 업그레이드 키트를 개발하고 현장 검증까지 완료했습니다.\n\n하지만 미르메쿠는 턱이 매우 강력해서, 충분한 개체 수와 시간만 있으면 어떤 물질이든 먹어 치울 수 있습니다."
 colony.9365.desc.pest_control: "미르메쿠를 박멸하기 위해, 정찰대를 보내 서식지를 찾게 했습니다. 지상에 있는 서식지는 화염과 폭발물로 쉽게 부술 수 있었지만, 지하 군집은 땅속 깊이 들어가 있어 미르메쿠를 완전히 박멸하기는 어려웠습니다.\n\n설상가상으로 이번 작업 중에 더 많은 수의 [Owner.GetColonistPlural]을 잃고 말았습니다."
 colony.9365.desc.harvest: "미르메쿠를 방역하기 위해, 군집 근처에 생체 물질 채집기를 설치했습니다. 지상에 있는 서식지는 쉽게 채집이 가능했지만, 지하 군집은 땅속 깊이 들어가 있어 이들을 미르메쿠를 완전히 박멸하기는 어려웠습니다.\n\n설상가상으로 이번 작업 중에 더 많은 수의 [Owner.GetColonistPlural]을 잃고 말았습니다."
 colony.9365.a: "더 나은 해결책이 필요합니다."
 colony.9370.name: "핵이라는 선택지"
 colony.9370.desc: "§Y[Root.GetName]§!에서 생명체를 말살하기 위한 준비를 모두 마쳤습니다.\n\n이번 작업 중에 궤도에서 [Root.GetPlanetMoon]을 관찰하면, 지표면에서 유기적 복합체가 사라지는 모습을 감상할 수 있을 것입니다."
 colony.9370.a: "웅장하겠군요."
 colony.9375.name: "분석 서브루틴 제안"
 colony.9375.desc: "계속된 조치에도 불구하고 미르메쿠 사태는 끝이 보이지 않습니다. 아직도 막대한 수의 곤충이 [Root.GetName] 전역에 들끓고 있어, 이동이나 개척지 바깥에서의 활동이 어려운 실정입니다. 우리 분석 서브루틴은 향후 상황에 관한 모의실험을 실시해, 다음과 같은 대책을 제안했습니다.\n\n대책 A: 메모리 절연 소재를 개척지와 멀리 떨어진 곳에 공중 투하해 미르메쿠를 유인하고, 쓰러진 [Owner.GetColonistPlural]들은 재활용한다.\n\n대책 B: 미르메쿠를 조사해 그 왕성한 활동력을 유용하게 활용할 방법을 찾는다."
 colony.9375.a: "유인합시다."
 colony.9375.a.tt: "§Y$planet_myrmeku_attacks$§! 보정치를 다음으로 변경:\n로봇 유지비: §R+5%§!\n\n"
 colony.9375.b: "조사합시다."
 colony.9380.name: "엄청난 결과"
 colony.9380.desc: "미르메쿠 조사를 마무리했습니다. 사전에 조정한 자성체를 미르메쿠 군집의 입구 근처에 놓자, 미르메쿠 외골격의 자성과 반응해 우리가 사용할 수 있는 전기가 생성되었습니다.\n\n또한, 조사 결과 미르메쿠는 현지 행성의 자기장을 따라 움직이는 것으로 나타났습니다. 따라서 메모리 칩에 자성을 제거한 보호층을 설치하면 칩을 보호할 수 있을 것입니다."
 colony.9380.a: "기발한 생각이군요."
 ## Event: Glacial Crisis
 colony.7230.name: "빙하 위기"
 colony.7230.desc: "[planet.GetName]의 최신 기후 보고서에서 우려스러운 결론이 나왔습니다. 이유는 알 수 없으나 그 얼어붙은 행성의 표면 온도가 놀라운 속도로 상승하고 있습니다.\n\n생태계가 급격히 악화되는 원인을 파악하지 못한다면, 행성의 광대한 빙하가 녹아내리는 재앙이 닥치고 말 것입니다."
 colony.7230.a: "행성이 뜨거워지는 이유를 알아내세요."
 colony.7230.a.tooltip: "원인이 무엇일까요?"
 colony.7230.b: "걱정할 필요 없습니다."
 colony.7235.name: "갈라진 얼음"
 colony.7235.desc: "[flooding_planet.GetName]의 기온 상승이 급격히 가속화되고 있습니다. 이에 따라 얼음 표면층에 상당한 균열이 생겨, 지표면 밑에 광활한 대양이 드러나고 있습니다.\n\n다행히도 탐사를 통해 이 현상을 일으켰을 법한 원인을 밝혀냈습니다. 우리의 존재 때문에 행성을 보호하는 고유한 대기 보호막의 심각한 취약점이 노출되기 시작하면서 붕괴 위기에 처한 것입니다. 엄격하게 생산량을 억제하는 조치를 시행하면 생태계에 주는 영향을 최소화할 수 있습니다. 그것만으로 문제가 해결될지도 모릅니다."
 colony.7235.a: "생산 목표를 수정하세요."
 colony.7235.b: "이만 빙하기를 끝낼 때가 됐습니다."
 colony.7235.b.tooltip: "엔진을 돌려라!"
 colony.7240.name: "핵 용해"
 colony.7240.desc: "[flooding_planet.GetName]에서 생산으로 인한 배출을 제한하려는 시도는 아직 희망적인 결과를 얻지 못했습니다. 진행 중인 생태 위기를 해결하는 데는 아주 조금밖에 성공하지 못했고, 해수면 상승으로 인해 지리적 저지대가 위험한 상황입니다.\n\n아직 인구 밀집 지역은 즉각적인 영향을 받진 않고 있지만, 행성 전체가 녹아내리는 사태를 피할 길이 없어 보입니다."
 colony.7240.a: "피해를 줄이도록 노력하세요."
 colony.7240.b: "비상사태를 선포하세요!"
 colony.7240.b.tooltip: "해결책을 찾을 때까지 모든 생산을 중단합니다."
 colony.7245.name: "광활한 범람원"
 colony.7245.desc: "[flooding_planet.GetName]의 급속히 악화되는 생태계를 방치한 결과, 상황은 전례 없는 대격변으로 치닫고 있습니다.\n\n광대한 빙상이 붕괴되면서 거대한 바다가 생겨났고, 엄청난 파괴와 변동을 남겼습니다. 홍수 방벽을 건설해 남은 도시를 보호할 수는 있지만, 앞으로 또 어떤 사태가 벌어질지 전혀 예측할 수 없는 상태입니다."
 colony.7245.a: "행성이 범람하고 있습니다!"
 colony.7247.name: "영구 동토의 비밀"
 colony.7247.desc: "[flooding_planet.GetName] 행성이 계속해서 녹아내리는 가운데 영구 동토층 아래에서 흥미로운 것이 발견되었습니다. 놀랍도록 풍부한 광물과 희귀 자원이 매장되어 있는 극지 저장층이 엄청난 부와 가능성을 품은 채 우리에게 손짓하고 있습니다."
 colony.7247.a: "횡재로군. 시추를 시작하세요!"
 colony.7247.b: "영구 동토층에 더 이상 피해를 줄 순 없습니다."
 colony.7247.b.tooltip: "상황을 더 악화시킬 수는 없습니다."
 colony.7250.name: "해동된 병원체"
 colony.7250.desc: "[flooding_planet.GetName]의 극지방 채굴 기지에서 당혹스러운 일이 발생했습니다. 작업자들이 돌연 의식을 잃고 쓰러지는 바람에 안전을 위해 엄격한 출입 금지 조치를 시행해야 했습니다.\n\n초기 조사에 따르면 얼음이 녹아내리면서 그 속에 잠자고 있던 바이러스가 깨어난 것으로 추정됩니다. 이 깨어난 병원체의 실체와 특성은 아직 불확실한 상태라, 지금도 풀리지 않은 수많은 의문과 씨름하는 중입니다. 어디까지 전염되는지, 얼마나 치명적인지 아직 밝혀진 바가 없습니다."
 colony.7250.a: "위험의 싹을 자릅시다. 구역을 소독하세요."
 colony.7250.b: "격리 상태를 유지하세요."
 colony.7255.name: "극지의 보물"
 colony.7255.desc: "[flooding_planet.GetName] 극지방의 깊은 공동에서 어떤 채굴 팀이 기념비적인 발견을 해냈습니다. 눈과 얼음층 아래에 숨어 있던, 장엄한 빙하를 연상시키는 거대 크리스탈을 찾아낸 것입니다.\n\n오랜 세월 동안 엄청난 압력을 견디며 형성된 이 특별한 크리스탈은 우리가 아직 발견하지 못한 무한한 가능성을 나타내고 있습니다."
 colony.7255.a: "정말 놀라운 발견이군요."
 colony.7260.name: "기후 안정화"
 colony.7260.desc: "환경을 되살릴 방안을 찾아냈습니다.\n\n연료가 연소될 때 생성되는 무해한 부산물이 [flooding_planet.GetName]의 박테리아 구름과 접촉하면 서서히 부작용을 일으킵니다. 우리는 이 구름이 태양광을 막는 역할을 함으로써 행성의 자연적인 생체 리듬을 유지하는 데 중요한 역할을 한다는 사실을 알게 되었습니다. 박테리아가 점차 감소하기 시작하면서 우리는 의도치 않게 배출로 인한 영향을 악화시킨 것입니다.\n\n이 새로운 지식으로 무장한 우리는 균형을 회복하고자 신속하게 단호한 조치를 취했습니다."
 colony.7260.a: "마침내 기후가 다시 안정됐군요."
 colony.7265.name: "빙하기의 종말"
 colony.7265.desc: "마지막 남은 [flooding_planet.GetName]의 빙하가 바다로 가라앉으면서 새로운 기후의 시대가 열렸습니다. 영구 동토층이 사라지면서 미개발 자원으로 가득 찬 광활한 수중 영역이 드러났습니다."
 colony.7265.a: "해변으로 떠날 시간이군요."
 PLANET_MELTDOWN_PROJECT: "기후 위기"
 PLANET_MELTDOWN_PROJECT_DESC: "[flooding_planet.GetName]의 기후가 빠르게 악화되고 있습니다. 돌이킬 수 없기 전에 그 이유를 알아내야 합니다."
 MELTING_RESEARCH_PROJECT: "녹아내리는 표면"
 MELTING_RESEARCH_PROJECT_DESC: "[flooding_planet.GetName]의 기온이 걱정될 정도로 빠르게 상승하고 있습니다. 이에 따라 발생하는 새로운 문제를 해결하기 위해 [Root.GetScientistPlural]들의 연구 범위를 확장해야 합니다."
 active_melting: "수위 상승"
 active_melting_desc: "이 행성의 얼음 표면이 매서운 속도로 녹아내리고 있습니다."
 boosted_melting: "눈덩이 효과"
 boosted_melting_desc: "행성의 만년설이 녹는 것을 앞당기기 위해 산업 배출량을 늘렸습니다."
 halted_production: "생산 중단"
 halted_production_desc: "행성의 취약한 환경을 보호하기 위해 산업이 미치는 영향을 제한했습니다."
 ecological_emergency: "생태계 비상사태"
 ecological_emergency_desc: "이 행성은 환경 연구가 끝날 때까지 생산을 완전히 중단했습니다."
 ancient_plague: "고대 바이러스"
 ancient_plague_desc: "이 행성은 영구 동토층이 녹으며 깨어난 고대 병원체의 먹잇감이 되었습니다."
 cruel_actions: "살인적 예방 조치"
 cruel_actions_desc: "안전을 명분으로 고대 전염병에 걸린 개척민을 죽였습니다."
 d_floodplains: "커지는 범람원"
 d_floodplains_desc: "해수면이 급격히 상승하면서 행성의 대부분이 침수되었습니다."
 d_crystalline_glacier: "결정화된 빙원"
 d_crystalline_glacier_desc: "이 얼음에 덮인 푸른 크리스탈은 한때 원시 빙하의 심장이었습니다."
 d_mineral_seabed: "풍요로운 해저"
 d_mineral_seabed_desc: "해저에 양질의 광물이 풍부합니다."
 mineral_diver: "$job_mineral_diver$"
 job_mineral_diver: "심해 잠수부"
 job_mineral_diver_plural: "심해 잠수부"
 job_mineral_diver_desc: "깊은 바다에서 가라앉은 광물을 회수하는 심해 전문가입니다."
 job_mineral_diver_add: "$job_mineral_diver$ 직업"
 job_mineral_diver_per_pop: "$VALUE$팝마다 $job_mineral_diver$ 직업 §G+1§!"
 job_mineral_diver_per_pop_short: "\n$VALUE$ £pop£마다 [miner.GetIcon] §G+1§!"
 mod_job_mineral_diver_add: "$job_mineral_diver$ 직업"
 mod_job_mineral_diver_per_pop: "$VALUE$팝마다 $job_mineral_diver$ 직업 §G+1§!"
 mod_job_mineral_diver_per_pop_short: "\n$VALUE$ £pop£마다 [miner.GetIcon] §G+1§!"
 miner_is_mineral_diver_tt: "$job_miner_plural_with_icon$(이)가 [miner.GetIcon] $job_mineral_diver_plural$로 전환"
 job_mineral_diver_drone: "수중 드론"
 job_mineral_diver_drone_plural: "수중 드론"
 job_mineral_diver_drone_desc: "심해에서 가라앉은 광물을 채취하기 위해 엄청난 압력을 견딜 수 있는 채굴용 드론입니다."
 mod_job_mineral_diver_drone_add: "$job_mineral_diver_drone$ 직업"
 mod_job_mineral_diver_drone_per_pop: "$VALUE$팝마다 $job_mineral_diver_drone$ 직업 §G+1§!"
 mod_job_mineral_diver_drone_per_pop_short: "\n$VALUE$ £pop£마다 [mining_drone.GetIcon] §G+1§!"
 job_mineral_diver_drone_add: "$job_mineral_diver_drone$ 직업"
 job_mineral_diver_drone_per_pop: "$VALUE$팝마다 $job_mineral_diver_drone$ 직업 §G+1§!"
 job_mineral_diver_drone_per_pop_short: "\n$VALUE$ £pop£마다 [mining_drone.GetIcon] §G+1§!"
 ## Event Chain: Rapid Desertification
 RAPID_DESERTIFICATION_CAT: "급속한 사막화"
 RAPID_DESERTIFICATION_CAT_DESC: "[From.Planet.GetName]의 식생이 급격히 감소하는 모습을 항공 사진으로 촬영한 결과, 지표면에 미확인 생명체가 서식하고 있음이 밝혀졌습니다."
 anomaly.7135.name: "외계 동물 식별"
 anomaly.7135.desc: "[desertling_planet.GetName]에서 생명체를 발견했습니다. 비지성체 소형 포유류가 대규모로 무리를 지어 온 행성을 누비고 있습니다.\n\n과학자들이 '데저트링'이라고 명명한 이 생명체의 개체 수는 무시무시한 속도로 증가해 이미 행성의 수용 능력을 넘어섰고, 이에 생태계가 급속도로 악화되고 있습니다."
 anomaly.7135.a: "어째서 이런 일이 발생했는지 조사하세요."
 anomaly.7135.b: "개입하지 않는 게 좋겠군요."
 anomaly.7135.b.tooltip: "멀리서 상황을 예의 주시하세요."
 RAPID_DESERTIFICATION_PROJECT: "포화된 생태계"
 RAPID_DESERTIFICATION_PROJECT_DESC: "[desertling_planet.Planet.GetName] 행성이 빠르게 늘어나는 포유류 때문에 과밀화되고 있습니다. 적절한 지원이 있다면 과학자들이 이 비지성체 종의 기원과 능력에 관해 알아낼 수 있을 것입니다."
 anomaly.7140.name: "침입종"
 anomaly.7140.desc: "[desertling_planet.GetName]의 데저트링을 연구하던 과학자들이 중대한 사실을 발견했습니다. 이 종은 행성 어느 곳에나 존재하지만 정작 그것과 일치하는 화석 기록이 전혀 없습니다. 이 생태계 침입자들은 비교적 짧은 기간 동안 극심한 환경 피해를 입혔으며, 외부적 요인으로 이 행성에 유입됐을 가능성이 높습니다.\n\n시급히 개입할 필요성이 분명해졌습니다. 조치를 취하지 않으면 이 생물들은 행성의 남은 자연 생태계를 파괴할 것입니다."
 anomaly.7140.a: "최대한 많은 동물을 입양하도록 하죠."
 anomaly.7140.a.tooltip: "저 생물이 저지른 일에 책임을 집니다."
 anomaly.7140.b: "개체 수 통제를 시행하세요."
 anomaly.7140.b.tooltip: "선별된 유전자 변형으로 성장을 억제할 수 있을 것 같습니다..."
 anomaly.7140.c: "짐승들을 박멸하세요."
 anomaly.7140.c.tooltip: "무슨 수를 써서라도 행성을 지켜야 합니다."
 anomaly.7140.d: "일부 동물을 가축으로 데려가겠습니다."
 anomaly.7140.d.tooltip: "모든 행성에 노예 둘을 데려갑니다."
 POPULATION_CONTROL_PROJECT: "개체 수 통제"
 POPULATION_CONTROL_PROJECT_DESC: "[desertling_planet.GetName]의 생태계를 보존하려면 침입종의 기하급수적인 개체 수 증가를 억제해야 합니다. 실행 가능한 해결책을 찾으려면 과학자들에게 시간과 자원이 필요합니다."
 anomaly.7145.name: "멸종 사태"
 anomaly.7145.base: "기하급수적으로 번식하는 포유류의 창궐에 압도당했다는 소식이 전해졌습니다. 모든 식물이 뿌리까지 삼켜진 황량한 풍경에는 정적만이 감돕니다.\n\n기근이 진행되자, 이 잡식성 포유류들은 굶주림으로 죽거나 동족에게 잡아먹혀 침묵만을 지킬 뿐입니다."
 anomaly.7145.desc: "[desertling_planet.GetName](이)가 $anomaly.7145.base$"
 anomaly.7145.b.desc: "[desertling_planet.GetName](이)가 $anomaly.7145.base$"
 anomaly.7145.a: "적어도 더는 고통받지 않겠군요."
 anomaly.7145.b: "우리 식민지가 파괴됐군요."
 anomaly.7150.name: "되살아난 자연"
 anomaly.7150.desc: "[desertling_planet.GetName]의 데저트링을 중성화하고 유전적으로 변형시키는 고된 노력 끝에 마침내 데저트링의 개체 수가 지속 가능한 수준으로 감소했습니다.\n\n닥치는 대로 풀을 뜯던 어마어마한 수의 동물이 없어지면서 섬세한 균형이 나타났습니다. 자연이 빠르게 회복되며, 황량했던 사막에 새싹이 돋기 시작합니다."
 anomaly.7150.a: "숨겨진 낙원이 되었군요."
 anomaly.7155.name: "붉은 사막"
 anomaly.7155.desc: "마침내 [desertling_planet.GetName]의 설치류가 남김없이 죽었습니다. 녀석들의 침입에서 행성을 구하려는 각고의 노력 끝에 모래는 핏빛으로 물들었지만, 벌써 녹색 새싹이 돋아나기 시작했습니다. 우리는 늦지 않았습니다."
 anomaly.7155.a: "꼭 필요한 일이었습니다."
 colony.7160.name: "국민적 보물"
 colony.7160.desc: "우리 행성에 데저트링을 데려왔을 때만 해도 이런 결과가 나올지 아무도 예상하지 못했습니다. 이 동물은 우리 삶에 자연스럽게 적응해 제국 전역의 가정에서 사랑받는 동반자가 되었습니다.\n\n너무나 빠른 적응 속도를 보고 이 동물이 이전에 길들여진 적이 있었을 것이라는 추측이 제기되었습니다. 타고난 친근감의 원인이 무엇이든, 그러한 추측은 이 특별한 생명체를 더욱 매력적으로 만들어 줄 뿐입니다."
 colony.7160.a: "어떻게 보면 녀석들이 우릴 구한 셈이군요."
 colony.7165.name: "성가신 동물"
 colony.7165.desc: "심각한 소식입니다. 데저트링 몇 마리가 이송 중 탈출해 야생에서 빠르게 공동체를 형성하고 있다고 합니다. 환경이 붕괴되는 것을 막으려면 신속히 대처해야 합니다."
 colony.7165.a: "그 짐승들을 사냥하세요!"
 colony.7165.b: "벽으로 둘러싸인 보호 구역을 건설하세요."
 colony.7170.name: "포유류 개체 수 안정화"
 colony.7170.desc: "데저트링의 증식을 억제하는 데 어느 정도 성공했지만, 유감스럽게도 그 미꾸라지 같은 녀석들을 완전히 퇴치하지는 못했습니다. 언제든 상황이 반전될 수 있기 때문에 계속 주시하는 것이 중요합니다."
 colony.7170.a: "사냥을 계속하세요."
 colony.7175.name: "걷잡을 수 없는 확산"
 colony.7175.desc: "데저트링의 증식을 통제하려는 시도는 실패로 돌아갔습니다. 이 게걸스러운 생명체들은 이미 땅속 깊은 곳까지 파고들어 우리가 제거하는 속도보다 더 빠르게 대형 군집을 확장하고 있습니다. 군대가 막대한 양의 폭발물과 유독 가스를 사용하도록 허용하지 않는 한 우리는 이 전투에서 패배할 것입니다."
 colony.7175.a: "그만 이 동물들을 받아들입시다..."
 colony.7175.b: "한낱 쥐새끼들한테 질 수는 없습니다."
 colony.7175.b.tooltip: "필요하다면 행성 전체를 파괴하겠습니다."
 job_alien_hunter: "외계종 사냥꾼"
 job_alien_hunter_plural: "외계종 사냥꾼"
 job_alien_hunter_desc: "외계 동물을 사냥하는 특수 임무 부대입니다."
 job_alien_hunter_add: "$job_alien_hunter$ 직업"
 job_alien_hunter_per_pop: "$VALUE$팝마다 $job_alien_hunter$ 직업 §G+1§!"
 mod_job_alien_hunter_add: "$job_alien_hunter$ 직업"
 mod_job_alien_hunter_per_pop: "$VALUE$팝마다 $job_alien_hunter$ 직업 §G+1§!"
 mod_job_alien_hunter_per_pop_short: "\n$VALUE$ £pop£마다 £job_alien_hunter£ §G+1§!"
 d_desertling_infestation: "침입성 동물"
 d_desertling_infestation_desc: "외계의 포유류 침입종입니다."
 d_red_desert: "붉은 사막"
 d_red_desert_desc: "광활한 사막이 피비린내 나는 희생으로 붉게 물들었습니다."
 d_alien_sanctuary: "외계 사파리"
 d_alien_sanctuary_desc: "외계 동물을 위해 지어진 보호 구역으로, 관광객들은 이곳에서 특별한 종과 교감할 수 있습니다."
 rodent_war: "극단적 박멸"
 rodent_war_desc: "이 행성에 파고든 침입성 외계 동물을 박멸하는 임무를 군대에 맡겼습니다."
 alien_infestation: "외계종 창궐"
 alien_infestation_desc: "이 행성은 빠르게 번식하는 외계 동물로 득시글합니다."
 adopted_aliens: "외계종 길들이기"
 adopted_aliens_desc: "이 행성은 외계 동물을 길들이고자 외계 반려동물 입양 프로젝트에 참여했습니다."
 national_pets: "뜻밖의 유대"
 national_pets_desc: "우리가 입양하기로 결정한 데저트링은 완전히 길들여진 것으로 판정되었으며, 전 국민의 사랑을 받고 있습니다."
 trait_presapient_unintelligent: "우둔함"
 trait_presapient_unintelligent_desc: "§H이 생물은 아주 단순한 일도 해내지 못합니다. 녀석들의 유일한 능력은 놀라운 번식 속도뿐입니다.§!"
 rapid_desertification_species: "데저트링"
 #Closing Aperture
 BREACHSEALER_CAT: "우주 균열 감지"
 BREACHSEALER_CAT_DESC: "어둑어둑한 셋돔 성계에는 우주 공간에 균열이 하나 위치해 있습니다. 이상한 점은 이뿐만이 아닙니다. 누군가 혹은 무언가 균열을 고치고 있기라도 한 듯, 균열이 점점 줄어들고 있는 것입니다."
 anomaly.7200.name: "닫혀지는 구멍"
 anomaly.7200.desc: "셋돔 성계에서는 괴상한 광경을 볼 수 있습니다. 소용돌이치는 행성들은 어둠에 둘러싸여 있고, 그 근처 우주 공간에는 항성의 빛을 빨아들이는 균열이 어마어마한 크기의 주둥아리처럼 펼쳐져 있습니다.\n\n미행성들은 겉으로 보기에 자연적으로 배치된 것 같지만, 추가 분석을 통해 이 천체들이 치밀한 계산에 의해 나열되었다는 점을 알 수 있었습니다. 수천 년 전, 어떤 무시무시한 힘이 셋돔 성계의 천체를 특수한 패턴으로 정렬한 덕분에 균열의 영향을 줄일 수 있었을 뿐만 아니라 균열이 은하계 다른 곳으로 퍼지지 않도록 막기까지 했다는 것입니다.\n\n우리는 때마침 경사스러운 순간에 이곳에 왔습니다. 역사적인 위업이 곧 완료될 것이며, 머지않아 성계가 복구될 것입니다."
 anomaly.7200.a: "우리 은하계를 고쳐 주셔서 고맙습니다."
 #Geocentric Experiment
 NAME_Orrery_Site: "천문 모형 현장"
 GEOCENTRIC_EXPERIMENT_CAT: "천문 모형"
 GEOCENTRIC_EXPERIMENT_CAT_DESC: "[from.Solar_System.GetName] 성계 전체에 걸쳐 특이한 중력 수치가 감지되고 있습니다. 이 수치는 내측 소행성대부터 성계 중심부의 외딴 행성까지 넓은 범위에 걸쳐 맥동 중입니다."
 anomaly.8000.name: "$GEOCENTRIC_EXPERIMENT_CAT$"
 anomaly.8000.desc: "[from.Solar_System.GetName] 성계의 중력은 소행성대에 위치한 §Y$sr_dark_matter$§! 방출기에 의해 안정적으로 유지되고 있습니다. 방출기는 중심 행성에 있는 슈퍼컴퓨터가 제어합니다. 이 중앙 컴퓨터의 기록에 따르면, 현지 성계 전체가 어떤 고대 문명이 지은 중력 조작 실험장이었던 것으로 보입니다."
 anomaly.8000.tt: "§Y$GRAVITY_STABILIZER$ 소행성§!마다 §Y$d_physics_1$§! 및 §Y$d_dark_matter_deposit_1$§! 추가"
 anomaly.8000.b: "기계를 해체하세요."
 anomaly.8000.b.tt: "§R좋지 않은 생각입니다§!"
 GRAVITY_STABILIZER: "중력 조작기"
 NAME_GRAVITY_STABILIZER_I: "$GRAVITY_STABILIZER$ I"
 NAME_GRAVITY_STABILIZER_II: "$GRAVITY_STABILIZER$ II"
 NAME_GRAVITY_STABILIZER_III: "$GRAVITY_STABILIZER$ III"
 NAME_GRAVITY_STABILIZER_IIII: "$GRAVITY_STABILIZER$ IIII"
 d_geocentric_experiment: "천문 모형 슈퍼컴퓨터"
 d_geocentric_experiment_desc: "천문 모형의 중력 붕괴를 막아 온 슈퍼컴퓨터입니다."
 #Mysterious Rocks Formation
 MYSTERIOUS_ROCK_CAT: "수수께끼의 암석 형상"
 MYSTERIOUS_ROCK_CAT_DESC: "[From.GetName](을)를 조사하던 중, 불모의 행성이라 여겨졌던 곳에서 기이한 암석 형상을 발견했습니다."
 anomaly.2000.name: "기이한 암석"
 anomaly.2000.start.desc: "[From.GetName]에 대한 지속적인 탐사는 답보다 더 많은 의문을 남겼습니다. 표면에는 기괴할 정도로 생생한 조각상들이 널려 있으며, 그 표정은 소리 없는 고통 속에 굳어 있습니다."
 anomaly.2000.default.desc: "$anomaly.2000.start.desc$\n\n이에 대한 과학자들의 의견은 분분합니다. 일부는 이 형상들이 한때 살아 있던 존재였지만 알 수 없는 힘에 의해 돌로 변한 것이라 믿으며, 다른 이들은 오래전에 잊힌 문명이 숭배하던 신을 나타낸 것이라 생각합니다. 더 신중한 몇몇은 이 조각상들이 경의의 표시가 아닌 경고라고 해석합니다. 감히 행성을 건드리는 자들에게 보내는 단호한 메시지일지도 모른다는 것입니다."
 anomaly.2000.hive.desc: "$anomaly.2000.start.desc$\n\n이에 대한 다양한 생각이 우리 집단의식을 채웁니다. 어쩌면 이 형상들은 한때 살아 있던 존재였지만 알 수 없는 힘에 돌로 변한 것일지도 모릅니다. 아니면 오래전에 잊힌 문명이 숭배하던 신을 나타낸 것일 수도 있습니다. 이 조각상들이 경의의 표시가 아닌 경고일 수도 있다는 의견도 있습니다. 감히 행성을 건드리는 자들에게 보내는 단호한 메시지일지도 모른다는 것입니다."
 anomaly.2000.a: "연구를 이어가세요."
 anomaly.2000.b: "계속 조사하세요."
 anomaly.2005.desc: "[From.GetName]의 승무원들이 추가 조사를 진행한 결과, 이 조각상들은 암석류와 매우 유사한 고대 종족의 잔재로 밝혀졌습니다. 한때 그 형태를 유지하던 본질은 이미 오래전에 쇠퇴했고, 이들은 행성의 악천후에 노출되어 서서히 가루로 무너져 가며 [From.GetName]의 가혹한 바람 속에 역사의 잔해를 흩뿌리고 있습니다."
 anomaly.2005.a: "아주 흥미롭군요."
 anomaly.2006.desc: "[From.GetName]의 승무원들이 추가 조사를 진행하던 중, 갑작스러운 돌풍이 연구 현장을 휩쓸었습니다. 불안정했던 암석 조각상은 결국 먼지로 부서져, 내부에 품고 있던 수수께끼의 흔적이 모두 지워지고 말았습니다. 분석할 증거가 사라져 명확한 결론을 도출할 수 없게 되었으니, 조사는 중단할 수밖에 없겠습니다."
 anomaly.2006.a: "안타깝군요."
 GROTESQUE_ROCK_PROJECT: "기이한 암석 형상 탐사"
 GROTESQUE_ROCK_PROJECT_DESC: "[From.GetName] 표면에서 기이한 암석 형상을 발견했습니다. 이 불모의 행성에 왜 이런 암석층이 남아 있는지 밝히기 위해 추가 연구가 필요합니다."
 ## Icy Flowers
 ICY_FLOWERS_CAT: "차가운 발견"
 ICY_FLOWERS_CAT_DESC: "[From.GetName](을)를 뒤덮은 두꺼운 빙하 층을 반복해서 스캔했으나, 불규칙한 데이터와 예상치 못한 간섭 패턴이 발생했습니다. 얼음 아래의 무언가가 계속해서 장비에 교란을 일으키고 있습니다. 추가 조사를 권고합니다."
 anomaly.2010.name: "식물의 낙원"
 anomaly.2010.desc: "[From.GetName]의 얼음 지각 아래에서의 발굴 작업 도중 거대한 지하 동굴을 발견했습니다. 놀랍게도, 이 숨겨진 온실에는 하나의 생태계가 번성하고 있었습니다. 행성 표면의 적대적인 환경으로부터 격리된 채 얼음의 보호를 받으며 많은 동식물이 자라나고 있는 것입니다. 동굴의 안정된 미기후는 지열 분출구 덕분에 유지되는 것으로 보입니다."
 anomaly.2010.a: "이곳에는 살펴볼 것이 많군요."
 anomaly.2010.b: "프로젝트를 종료하세요."
 anomaly.2015.name: "확률을 뛰어넘다"
 anomaly.2015.desc: "동굴 깊숙한 곳에서 광활한 꽃밭을 마주했습니다. 관찰을 시작한 순간 온 들판이 한번에 만개하며 동굴 내부를 찬란한 생체 발광으로 환하게 물들였습니다. 식물학 분석에 따르면 이 종은 1억 년에 한 번, 매우 정밀한 환경이 맞아떨어질 때만 개화한다고 합니다.\n\n우리의 도착과 이 현상이 맞물린 것은 확률적으로는 설명할 수 없는 일이지만, 단순한 우연이든 그 이상의 무언가가 존재하든, 놀라운 경험이었던 것만큼은 틀림없습니다."
 anomaly.2015.a: "놀라운 발견이군요."
 anomaly.2020.name: "탐사할 수 없는 비밀들"
 anomaly.2020.desc: "동굴 내부 깊은 곳으로 내려가던 중, 뜻밖의 지진 활동이 구조를 불안정하게 만들었습니다. 갑작스러운 지각 떨림이 벽을 타고 퍼지며 곧 있을 붕괴를 예고한 것입니다. 빠르게 악화하는 상황에 우리는 즉시 대피 절차를 시행했으며, 동굴 안쪽의 비밀을 탐사하지 못한 채 떠날 수밖에 없었습니다."
 anomaly.2020.a: "안타깝군요."
 BOTANICAL_GARDEN_PROJECT: "이 식물의 낙원을 탐사하세요."
 BOTANICAL_GARDEN_PROJECT_DESC: "[From.GetName]의 얼음 지각 아래에는 거대한 지하 동굴이 있습니다. 우리는 이 놀라운 환경을 더 깊이 연구하기 위해 탐사대를 파견하고자 합니다."
 ## A Court of Blossoms
 colony.10000.name: "기이한 발자국"
 colony.10000.desc: "[Root.GetName]의 외딴 농업 기지에서 보고가 들어왔습니다. 몇몇 [Owner.GetFarmerPlural]들이 흔적도 없이 사라졌다는 것입니다. 기이하게도 주거지는 평소 모습 그대로였으며, 거대한 발자국만이 주변 토양에 선명하게 남아 있었다고 합니다.\n\n이 발자국은 행성 탐사에서 확인된 그 어떤 생명체의 것과도 다릅니다. 사족 보행을 하고, 발가락은 폭이 넓고 발톱이 달렸으며, 깊이로 보아 그 주인은 상당한 체중을 지닌 듯합니다. 개척민들은 우리가 정체불명의 포식자를 상대하게 된 것이 아닐지 우려하고 있습니다."
 colony.10000.a: "계속 조사하세요!"
 colony.10000.b: "쓸데없는 추측일 뿐입니다. 일이나 하라고 하세요."
 colony.10005.name: "죽은 괴물"
 colony.10005.desc: "황야로의 원정은 고된 여정이었지만, 끝내 결실을 보았습니다. 며칠간 생물의 흔적을 추적한 끝에 탐사대는 처참히 파괴된 현장에 도착했습니다. 야수의 거대한 사체는 두껍게 발달한 키틴질 외골격과 가시 돋친 척추 능선, 그리고 구부러진 침이 달린 마디진 꼬리를 드러내고 있었고, 온몸은 다수의 관통 상흔으로 뚫려 있었습니다.\n\n그 너머, 생체 발광 덩굴로 이루어진 강력한 위장막 아래에서 우리 장비가 고대의 정원을 감지했습니다. 그곳은 담쟁이덩굴이 얽힌 대리석 기둥과 매끈한 흑요석 통로로 장식되어 있었습니다. 탐사대가 조심스럽게 접근하자 정원의 관리인들이 모습을 드러냈습니다. 인간류 종족으로, 품위 있는 태도와 은은한 빛을 띤 피부를 지닌 존재들이었습니다. 조화로워 보이는 외형과는 반대로, 꽃과 덩굴은 강력한 베일이 되어 이들을 보호하고 있었습니다. 빛나는 막을 뚫고 나아가야만 그 너머에 사는 이들에게 닿을 수 있을 것입니다."
 colony.10005.a: "막을 뚫어 보도록 하죠."
 colony.10010.name: "계속되는 실종"
 colony.10010.desc: "실종 사건의 빈도가 더욱 증가하고 있습니다. 이번에는 발자국이 주거지를 스쳐 지나간 것에서 끝나지 않고, 정면으로 짓밟고 지나갔습니다. 그 결과 온 건물이 무시무시한 힘에 산산조각 나고 말았습니다. 저항의 흔적이 남은 것으로 보아 희생자들은 산 채로 끌려갔으며, 순순히 당하지는 않은 듯합니다.\n\n이제 개척민들은 단순한 불안이 아니라 공포에 휩싸였습니다. 이미 몇몇 가족은 땅을 버리고 식민지 중앙으로 피신을 떠났습니다."
 colony.10010.a: "이 만행을 저지른 존재를 찾아내야 합니다."
 colony.10010.b: "폭력은 삶의 일부에 지나지 않습니다."
 colony.10015.name: "꽃의 궁정"
 colony.10015.desc: "꽃의 궁정의 이름으로 여행자 여러분을 환영합니다. 저는 탐페리온 왕입니다. 동족들은 저를 '황금심장'이라고 부릅니다. 저는 힘이 아니라 전통과 의식을 통해 이곳을 다스리는 군주입니다. 이 세계의 수호자이자, 아나타리라 불리는 백성들의 목자로서 여러분 앞에 서 있습니다. 제 말이 여러분의 언어로 들려 놀라셨습니까? 두려워하지 마십시오. 우리는 여러분이 [Root.GetName]에 이주했을 때부터 여러분을 연구해 왔습니다. 우리의 장막을 뚫고 들어올 수 있었다면 참으로 강대한 민족이 틀림없습니다. 여러분을 만나게 되어 영광입니다."
 colony.10015.a.question: "꽃의 궁정이 무엇이죠?"
 colony.10015.a.answer: "우리는 영원한 개화와 번영의 궁정입니다. 우리의 문화는 무기나 지배를 통해서가 아니라, 모든 구성원의 내면에 자리한 상호 이해와 온정으로 이루어진 조화에서 자부심을 느낍니다. 꽃의 궁정에서 전통은 단순한 과거의 잔재가 아니라 따라야 할 법이기도 합니다. 우리와 이야기를 나누고, 노래를 부르며, 곡식을 나눈다는 것은 서로 이해를 주고받으며 우리 삶의 방식을 엿보는 길과도 같습니다."
 colony.10015.b.question: "괴물에 대해 아는 것이 있습니까?"
 colony.10015.b.answer: "여러분이 만난 존재는 위대한 수호자로, 한때 우리를 지켜 주던 존재였습니다. 그러나 시간이 지나며 수호자는 뇌를 잠식한 신경 동충하초에 감염되어, 정신은 비어 버리고 본래의 목적은 타락하고 말았습니다. 우리는 분노가 아닌 애도의 마음으로 그 고통을 끝내 주었습니다. 그것은 외계의 괴물이 아니라, 한때 우리의 일부였던 존재였습니다."
 colony.10015.c.question: "우리한테 뭘 원하는 뭡니까?"
 colony.10015.c.answer: "우리의 의식과 제례, 주문, 그리고 생각하고 꿈꾸는 식물과의 공생이 여러분에게 낯설게 느껴질 수 있습니다. 그러나 우리와의 공존은 아무에게나 허락되는 것이 아니며, 배우기를 거부하는 자는 그에 상응하는 결과를 겪게 될 것입니다. 우리가 제안하는 것은 굴복이나 통제가 아닌, 상호 이해와 수용입니다. 원하신다면, 일종의 기념이기도 하지요. 이것이야말로 우리 민족이 정의하는 조화의 가장 순수한 본질입니다. 만약 우리와 함께 이 길을 걸으신다면, 여러분이 혼자가 되는 일은 없을 겁니다."
 colony.10015.a: "우리는 배우기 위해 왔습니다."
 colony.10015.b: "우리는 식민지를 세우기 위해 온 겁니다."
 colony.10016.name: "$colony.10015.name$"
 colony.10016.desc: "꽃의 궁정을 대표하여, 여러분의 협조에 깊은 감사를 표합니다. 보내시는 이는 우리의 일원으로서 따뜻하게 맞이할 것이며, 부족한 것이 없도록 지원하겠습니다."
 colony.10016.a: "알겠습니다."
 colony.10017.name: "$colony.10015.name$"
 colony.10017.desc: "좋을 대로 하십시오. 당신들이 결정을 내린 것처럼 우리 또한 결정을 내렸습니다. 제가 드릴 수 있는 조언은 모두 전했으니, 이제 당신들의 선택이 가져올 결과를 감당해야 할 겁니다."
 colony.10017.a: "이어질 일에 대비합시다."
 colony.10020.name: "습격"
 colony.10020.desc: "어떠한 예고도 없이, 탐페리온 왕이 살아 있는 덩굴과 생체 발광 꽃으로 만든 제례용 갑옷을 두르고 정원의 심장부에서 모습을 드러냈습니다. 그가 식민지 가장자리를 따라 한 걸음씩 내디딜 때마다 마치 행성 자체가 깨어나는 듯했습니다. 덩굴이 토양 속에서 꿈틀거렸고, 꽃잎은 칼날처럼 펼쳐졌습니다. 황금빛 꽃가루가 공기 중에 자욱하게 퍼져, 미세하게 빛나는 입자들이 통풍구와 폐 속으로 스며들었습니다. 단 몇 시간 만에 수많은 생명이 이를 견디지 못하고 발작과 광기, 그리고 죽음을 맞이했습니다.\n\n결국 그를 제압한 건 식민지의 자동화된 방어 시설이었습니다. 탐페리온 왕은 한마디 말조차 없이 쓰러졌으며, 그 마지막 시선에는 증오가 아닌 깊고 엄숙한 실망이 담겨 있었다고 전해집니다.\n\n탐사대는 한때 꽃의 궁정이 있던 자리에 이제 숲만 남아 있는 것을 확인했습니다. 마치 왕국이 스스로 땅속으로 들어가, 그 비밀과 슬픔까지 모두 가져간 듯했습니다."
 colony.10020.a: "씁쓸한 결말이군요."
 colony.10025.name: "아나타리의 일원"
 colony.10025.desc: "우리는 아나타리의 방식에 깊이 빠져들었습니다. 의례에 참여하고 아나타리만의 독특한 의식과 조화를 이루면서, 점차 일정한 패턴이 드러나고 의미가 뿌리를 내리기 시작했습니다.\n\n장수와 다산을 기리는 야간 제례를 함께하는 동안, 아나타리인들은 억눌려 온 역사의 단편을 조금씩 드러내기 시작했습니다. 주민들은 한때 행성을 뒤덮었던 고대의 끈질긴 재앙에 관해 이야기했으며, 그것이 아직까지도 아나타리를 지배하고 있다고 전했습니다."
 colony.10025.a: "논의할 사안이 많아 보이는군요."
 colony.10026.name: "탐페리온 왕"
 colony.10026.desc: "그대들이 이 땅에 발을 디디기 훨씬 이전, 우리 아나타리는 고귀한 관리자로서 이 행성을 보살폈습니다. 우리는 행성의 숨결에 맞춰 형태를 빚고, 생태계를 이끌며 흐름을 조절하고, 무한한 인내심으로 정원을 가꾸듯 살아 있는 행성을 돌봤습니다. 그러나 균형에는 언제나 도전이 따르기 마련이었습니다."
 colony.10026.a.question: "무엇이 균형을 깨뜨린 거죠?"
 colony.10026.a.answer: "역사의 뿌리 아래서, 우리가 '어둠의 불멸자'라고 부르는 존재가 나타난 것입니다. 태어나지도, 속박되지도 않은 이 힘은 처음에는 평화로운 존재처럼 보였기에, 우리는 상호 교류를 기대하며 문을 열고 말았습니다. 그러나 국경 안으로 들어온 이 존재는 그 즉시 모든 힘을 쏟아 우리를 순식간에 노예로 만들었습니다. 이제 우리는 안에서부터 썩어 가고 있으며, 천천히 시들어 가고 있습니다."
 colony.10026.b.question: "우리가 어떤 역할을 하면 됩니까?"
 colony.10026.b.answer: "여러분, 다시 말해 [Owner.GetSpeciesNamePlural]들은 우리가 오래전에 잃어버린 힘을 지니고 있습니다. 바로 우리의 역사에 얽매이지 않은 생명력입니다. 그러니 군주가 아닌, 한때 존재했던 모든 것들의 잔재로서 요청하겠습니다. 우리를 도와주시겠습니까? 이 존재의 근원은 한 주기가 지날수록 커지고 있으며, 아나타리가 이 재앙을 얼마나 더 견딜 수 있을지 모르겠습니다."
 colony.10026.c.question: "우리가 할 일은요?"
 colony.10026.c.answer: "여러분은 어둠의 불멸자를 마주해야 합니다. 오래전 한 위대한 영웅이 시도했으나 목숨을 잃고 말았지요. 하지만 그는 죽으면서 그 정수의 일부를 분리했습니다. 어쩌면 그 조각을 해독하여 [Root.GetName] 어딘가에 있는 불멸자를 찾아낼 수 있을지도 모릅니다. 여러분의 기술이라면 그 존재를 드러낼 수 있을 겁니다.\n\n협력만이 유일한 생존의 길입니다. 기억하십시오. 실패한다면 아나타리의 멸망이나 식민지의 종말만으로 끝나지 않을 겁니다. 그 존재를 통제하지 못한다면 행성 자체를 삼켜 버릴 수도 있습니다."
 colony.10026.a: "어둠의 불멸자를 막아야 합니다."
 colony.10026.b: "이 자칭 왕이라는 자는 믿을 수가 없군요."
 colony.10027.name: "의심의 씨앗"
 colony.10027.desc: "처음에는 평화로운 교류로 시작되었던 것이 점차 미묘해지고 불안한 양상을 띠고 있습니다. 아나타리 의식에 참여한 뒤로 보고가 지연되고, 기억이 파편화되며 수면에 이상이 생기는 일이 잦아졌습니다. 탐페리온 왕은 여전히 정중하지만, 의식의 진정한 목적을 묻는 말에는 점점 대답하기를 꺼리고 있습니다. 왕의 설명은 시적이며, 직접적인 대답을 주지 않는 경우가 잦습니다. 심지어 '황금심장'이라는 그의 칭호조차 아나타리 교리에서 찾아볼 수 없었습니다. 이런 상황에서 일부는 이 의식이 단순한 문화적 유대를 넘어, 심리 조정을 위한 도구로 사용되는 거라고 추정합니다.\n\n방법이 무엇이든 그 효과는 분명합니다. 우리는 점점 탐페리온 왕과 아나타리인들에게 동조되고 있습니다. 왕이 어둠의 불멸자에 대해 말할 때면, 외국의 간청이 아니라 마치 가장 가까운 동료를 돕는 신성한 의무처럼 느껴집니다."
 colony.10027.a: "당연히 돕겠습니다."
 colony.10027.b: "이 말도 안 되는 짓을 그만두게 하세요!"
 colony.10030.name: "죽음 너머에 있는 것"
 colony.10030.desc: "우리의 행동은 빨랐고, 신속히 민병 강습대를 보내 꽃의 궁정에 침투시켰습니다. 탐페리온 왕은 정원에서 명상 중이었으나, 쉽게 쓰러지지는 않았습니다. 목격자들은 끔찍한 식물의 분노를 목격했다고 전합니다. 그건 돌에서 덩굴이 솟구치고, 꽃으로 된 형체가 강철을 찢으며 달려드는 장면이었습니다. 왕이 쓰러질 때쯤, 정원은 빛나는 피와 재로 뒤덮여 있었습니다.\n\n우리를 놀라게 한 건 정원 아래 남은 것들이었습니다. 생물학적 보물고와도 같은 그곳에는 고대의 지식과 식물 공학 기술, 그리고 수많은 수확 주기를 거치며 축적된 유전자 저장고가 존재했습니다. 고대의 관리자로부터 풀려난 이 토양은 행성의 그 어떤 땅보다도 비옥합니다. 우리는 어쩌면 지금 풍요의 황금기로 들어서고 있는지도 모릅니다."
 colony.10030.a: "다른 방법이 없었습니다."
 A_CRYPTIC_ESSENCE_PROJECT: "정수 연구"
 A_CRYPTIC_ESSENCE_PROJECT_DESC: "탐페리온 왕이 우리에게 어둠의 불멸자의 조각을 맡겼습니다. 그 본질을 연구함으로써, 우리는 어둠의 불멸자의 은신처와 아나타리에 대한 그 존재의 지배를 끊을 방법을 찾을 수 있을 것입니다."
 THE_CRYPTIC_ESSENCE_PROJECT: "$A_CRYPTIC_ESSENCE_PROJECT$"
 THE_CRYPTIC_ESSENCE_PROJECT_DESC: "$A_CRYPTIC_ESSENCE_PROJECT_DESC$"
 colony.10035.name: "어둠의 불멸자"
 colony.10035.desc: "과학자들이 정수를 성공적으로 해석해, 어둠의 불멸자의 위치를 외딴 산의 정상으로 특정했습니다. 곧 탐사대가 산의 고원에 도착했을 때, 그곳에는 이미 누군가가 자리하고 있었습니다.\n\n중심부에는 시련을 내리는 자이자 어둠의 불멸자가 우뚝 서 있었습니다. 기원조차 이해할 수 없는 그 존재의 형체는 플라즈마, 연기, 뼈, 그리고 활성화된 사이오닉 물질이 불안정하게 융합한 모습이었습니다. 그 목소리는 소리를 거치지 않고 현장에 있는 모든 탐사대원의 신경 구조에 직접 닿았습니다.\n\n'나에게 복종하러 온 것이냐, 작은 [Owner.GetSpeciesNamePluralInsult]들아.' 존재는 느릿하게, 조롱이 담긴 목소리로 말했습니다. '아나타리는 나의 가장 귀중한 소유물이다. 그러나 너희에게 기회를 주겠다. 내 시련을 마주하고 나에게 인정을 받을 자격이 있음을 증명해 보아라.'"
 colony.10035.a: "도전을 받아들이겠습니다."
 colony.10035.a.tt: "용기의 시련을 시작합니다."
 colony.10035.b: "도전은 무슨. 지금 바로 공격하세요."
 colony.10040.name: "용기의 시련"
 colony.10040.desc: "한 명의 개척민이 어둠의 불멸자의 인도를 따라 산속 깊은 동굴로 이동했습니다. 동굴의 가장 어두운 구석에는 거대한 괴수가 기다리고 있었습니다. 말도 안 되게 거대한 갑각류를 닮은 그 괴수의 껍데기는 기이한 광물과 고대의 합금으로 반짝였습니다. 괴수는 마치 자신의 영역을 지키려는 듯, 놀라울 정도의 지능을 짐작하게 하는 섬뜩한 움직임을 보였습니다."
 colony.10040.a: "괴수를 죽이세요."
 colony.10040.a.militarist: "괴수를 태워 죽이세요."
 colony.10040.b: "괴수를 속여 봅시다."
 colony.10045.name: "용기의 시련 성공"
 colony.10045.desc: "선출된 개척민이 깊은 어둠에 잠긴 동굴로 뛰어들었고, 강철과 껍데기가 맞부딪쳤습니다.\n\n거대한 갑각류 괴수는 즉시 반응했고, 집게발로 돌을 갈라내며 육중한 몸집으로 산을 뒤흔들었습니다. 하지만 개척민은 준비가 되어 있었습니다. 좁은 통로로 괴수를 유인하고, 미리 파악해 둔 관절과 감각 기관을 정확히 공격한 것입니다.\n\n먼지가 가라앉자 괴수는 더 이상 움직이지 않았고, 마지막 경련은 천둥처럼 산을 울렸습니다. 개척민은 피와 먼지로 뒤덮인 채로 동굴을 빠져나왔습니다.\n\n어둠의 불멸자는 개척민의 무모한 용기를 인정하는 듯, 느릿하게 고개를 끄덕였습니다. 그렇게 용기의 시련이 완료되었습니다."
 colony.10045.a: "계속 진행하세요..."
 colony.10045.a.tt: "지혜의 시련을 시작합니다."
 colony.10046.name: "$colony.10045.name$"
 colony.10046.desc: "전투는 결코 현실적인 선택이 아니었습니다. 대신 개척민은 갑각류 괴수의 움직임을 관찰하여, 그것이 빛을 싫어하고 진동에 극도로 민감하며, 무엇보다 시력이 없다는 사실을 확인했습니다. 괴수는 오직 소리에만 반응했으며, 반향을 감지하고 반사적으로 공격하는 행동을 반복하고 있었습니다. 이에 개척민은 정면 대결이 아닌 속임수를 준비했습니다.\n\n개척민은 여러 개의 돌을 동굴 중앙 기둥에 던졌습니다. 소리가 울려 퍼지자, 괴수는 즉시 반응해 소리의 근원지를 향해 돌진했습니다.\n\n괴수의 공격을 받은 중앙 기둥이 부서지고 동굴 천장이 무너지자, 개척민은 좁은 틈새로 피신해 낙석으로부터 몸을 보호했습니다. 그렇게 갑각류 괴수는 수 톤의 바위 아래 매장되어 갇히고, 이내 침묵했습니다.\n\n어둠의 불멸자는 개척민의 기지와 영리함을 인정하는 듯 보였습니다. 용기의 시련이 성공적으로 완료된 것입니다."
 colony.10047.name: "용기의 시련 실패"
 colony.10047.desc: "괴수의 집게발이 번개처럼 빠르게 움직였고, 동굴의 어둠 속에서 윙윙거리는 소리가 희미하게 울려 퍼졌습니다. 모든 움직임이 흐릿하게 스쳐 지나가고, 한 번 내리칠 때마다 저주파 진동이 돌을 흔들었습니다.\n\n개척민은 모든 선택지를 고민하며 신중하게 움직였습니다. 괴수를 속이거나 유인하고, 타격을 시도하거나 주의를 분산시키는 방법이 있었습니다. 그러나 괴수는 예상보다 빠르게 적응했습니다. 이어진 공격은 정확히 명중했고, 분노한 괴수의 생체 발광으로 순간 동굴이 밝게 빛났습니다.\n\n먼지가 가라앉자 개척민은 시체가 되어 쓰러져 있었습니다. 우리는 시련에 실패했습니다."
 colony.10047.a: "적어도 용기는 있었군요."
 colony.10050.name: "지혜의 시련"
 colony.10050.desc: "알아듣기 힘든 떨리는 소리가 동굴 안에서 피어오르더니, 곧 바위 그 자체가 말하는 듯한 목소리가 들립니다.\n\n§H'나는 정복도, 법도 아닌 침묵 속에서 태어났다네.\n말하지 않은 맹세, 그 오래된 원한이 사라져 가네.\n나를 움직이는 기계도, 나를 지휘하는 정신도 없지만\n그럼에도 나는 보이지 않는 손으로 별들을 다스리네.\n나를 아는 자는 적지만, 변화는 모두가 느꼈으니\n한때 혼돈이 지배하던 곳에는 이제 고요함만이 가득하네.'§!"
 colony.10050.a: "정답은 '승격'입니다."
 colony.10050.b: "정답은 '은하의 조화'입니다."
 colony.10055.name: "지혜의 시련 실패"
 colony.10055.desc: "개척민이 [Owner.Species.GetMouthName] 밖으로 그 말을 내뱉자, 빛이 희미해졌습니다. 어둠의 불멸자의 목소리가 고요를 가르며 울립니다. '[Owner.GetSpeciesNameInsult]. 모든 것이 단순한 권력욕으로만 해결될 수 있는 것은 아니다.'\n\n그 순간 개척민은 무기도, 불길도 아닌 압력과 침묵에 강타당했습니다. 비명도 지르지 못하고 쓰러진 개척민은 통째로 동굴 속으로 삼켜지고 말았습니다. 우리는 시련에 실패했습니다."
 colony.10060.name: "지혜의 시련 성공"
 colony.10060.desc: "개척민은 자신의 답이 맞았기를 바라며 입을 다물었습니다. 동의하는 듯 동굴이 진동했고, 어둠의 불멸자는 만족한 듯 보였습니다.\n\n'이해했구나. 모든 시련이 힘이나 권력에 관한 것은 아니다. 어떤 시련은 단지 마음을 열 용기만을 요구하지.'\n\n수수께끼가 사라지자, 부드러운 빛이 방을 가득 채웁니다. 시련이 성공적으로 끝났고, 앞으로 나아갈 길이 열렸습니다."
 colony.10060.a: "계속 나아갑시다..."
 colony.10060.a.tt: "희생의 시련을 시작합니다."
 colony.10065.name: "희생의 시련"
 colony.10065.desc: "개척민이 시련을 마주하기 위해 앞으로 나섰고, 거대한 어둠의 단상 위로 들어 올려졌습니다. 중앙에는 두 개의 흑요석 의자와 낮고 긴 탁자가 놓여 있었고, 그 위에는 우아하게 휘어진 검이 있었습니다. 개척민이 [Owner.Species.GetHandName](을)를 들어 검을 잡자, 그것은 힘을 머금은 듯 희미하게 윙윙거렸습니다.\n\n한쪽 의자에는 탐페리온 왕이 앉아 있었으며, 평범한 밧줄이 아닌 원초적 힘으로 이루어진 빛나는 줄로 묶인 채였습니다. 왕의 표정에는 두려움도 평화도 아닌, 오직 고요함만이 담겨 있어 그 감정을 알기 어려웠습니다. 다른 의자는 비어 있었습니다.\n\n그때 목소리가 개척민의 의식 안에 다시 한번 울려 퍼졌습니다.\n\n'이 검은 많은 왕과 비겁한 자의 피를 맛보았다.' 어둠의 불멸자가 속삭입니다. '이 시련을 통과하려면 한 생명을 거두어야 한다. 아나타리 지도자의 심장을 취하든, 스스로를 희생하든 선택은 너의 몫이다. 선택을 그르치면... 시련은 끝날 것이다.'"
 colony.10065.a: "왕이여, 안녕히 가시길."
 colony.10065.b: "개척민이 희생하게 합시다."
 colony.10070.name: "희생의 시련 성공"
 colony.10070.desc: "개척민은 어떠한 소리도, 미동도 없이 묶여 있는 탐페리온 왕 앞에 섰습니다. 흑요석 탁자 위에는 검이 기다리고 있었고, 어둠의 불멸자는 어떠한 신호도 없이 그저 지켜보기만 했습니다.\n\n개척민은 검을 집어 들고 탐페리온 왕의 가슴에 정확히, 빠르고 단호하게 찔러 넣었습니다. 왕은 비명을 지르지 않았습니다. 오직 먼 곳의 종소리를 닮은 부드러운 금속성 울림만이 들릴 뿐이었습니다.\n\n탐페리온 왕은 눈을 들어 차분한 시선을 보냈습니다. 검은 자루 끝까지 박혔지만, 뚫은 것은 살점이 아닌 완전히 다른 무언가였습니다. 왕의 가슴이 희미하게 빛나며, 황금빛으로 고동쳤습니다. 탐페리온 왕은 진정한 의미로 '황금심장'이었던 것입니다...\n\n왕을 묶고 있던 줄이 녹아 사라지고, 단상도 희미해졌습니다. 어둠의 불멸자가 다시금 우리 의식에 말을 겁니다. '나아가라.'"
 colony.10070.a: "놀라운 결과로군요."
 colony.10075.name: "희생의 시련 실패"
 colony.10075.desc: "개척민은 칼을 손에 쥔 채 탐페리온 왕을 바라보았습니다. 왕은 고요히 앉아 있었고, 그 부드러운 시선에는 간청도 허락도 담겨 있지 않았습니다. 주저하던 개척민은 검을 자신에게 돌렸습니다.\n\n날카로운 숨이 새어 나오고, 개척민은 쓰러졌으며, 떨어진 검이 흑요석 바닥에 부딪히는 소리가 울렸습니다. 선택은 명확했습니다. 아나타리 지도자를 살리고, 그 무거운 짐을 혼자 짊어진 것입니다.\n\n그러나 들려온 어둠의 불멸자의 목소리에는 분노도, 승리감도 없었습니다. '자비가 곧 면죄는 아니다. 이 검은 결코 스스로를 위한 것이 아니었다.'\n\n탐페리온 왕의 얼굴에는 조용한 눈물이 흘렀습니다. 최선의 의도로 행했지만, 아나타리의 운명을 막아 버리고 만 것입니다...\n시련은 영광이 아닌 슬픔으로 끝났습니다. 개척민은 죽었고, 앞으로 나아갈 길도 막혔습니다."
 colony.10080.name: "가장 깊은 욕망"
 colony.10080.desc: "처음 봤을 때 그대로, 이해할 수 없는 존재인 어둠의 불멸자가 우리 앞에 서 있었습니다. 그 형상은 돌에 비친 실루엣처럼 거대하면서도 불분명했고, 마치 우리의 현실과 겨우 맞닿은 다른 차원에 속한 듯했습니다. 그 어떤 소리도 나지 않았습니다. 대신 그 존재는 우리의 의식 안에 피어올랐고, 모든 생각이 말이 아닌 필연으로 전달되었습니다.\n\n정적 속에서 어둠의 불멸자가 부드러우며, 거의 만족감에 가까운 생각을 보냅니다. '작은 [Owner.GetSpeciesNamePlural]들아, 너희가 마음에 들었다. 내게 감명을 주었구나. 말해라, 원하는 것이 무엇이냐?'"
 colony.10080.a: "이 행성을 떠나십시오. 영원히."
 colony.10080.b: "아나타리를 제거해 주십시오."
 colony.10081.name: "거대한 성공"
 colony.10081.desc: "잠시 정적이 흘렀습니다. 생각과 시간을 가로지르는 침묵이었지만, 곧 조용한 합의가 이루어졌습니다. '아나타리는 더 이상 내가 감시해야 할 존재가 아니다.' 어둠의 불멸자가 말했습니다. '이제 속박된 것은 너희다.' 그 말과 함께, 불멸자는 사라졌습니다. 빛도 소리도 없이, 단지 공기 속의 변화와 거대한 무언가가 떠났다는 느낌만 남았습니다.\n\n첫 조우 이후의 주기들을 지나며 개척민들과 아나타리 간 종족 간 융합은 더욱 깊어졌습니다. 농작물이 풍성하게 자랐으며, 도시는 땅과 조화를 이루며 솟아올랐습니다. 식물과 기술이 나란히 공존했습니다. 수 세기 만에 처음으로 [Root.GetName](은)는 번영했고, 더 이상 갈등에 짓눌리지 않으며, 평화를 위해 재조정되었습니다."
 colony.10081.a: "훌륭한 성공입니다."
 colony.10082.name: "황금색 꽃잎의 비"
 colony.10082.desc: "'좋다.'\n\n어둠의 불멸자가 우리 의식에서 물러나자, 무언가가 근본적으로 변했습니다. 개척민들은 척추 깊숙한 곳으로부터 불길한 요동을 느꼈고, 행성 전역에서 아나타리들이 쓰러지기 시작했습니다. 비명도, 몸부림도 없었습니다. 마치 꽃잎이 산들바람에 떨어지는 듯한, 옷자락이 먼지에 파묻히는 부드러운 바스락거림만이 들려올 뿐이었습니다.\n\n가장 마지막까지 남아 있었던 이는 동굴 안의 탐페리온 왕이었습니다. 왕의 눈에는 [Owner.GetSpeciesNamePlural]에 대한 완전한 배신감과 실망만이 담겨 있었습니다. 손을 들거나, 살려 달라 빌지도 않았습니다. 왕의 소매에서 한 송이 황금색 꽃이 동굴 바닥으로 떨어졌고, 머지않아 그도 사라졌습니다. 애도도, 안도도 없었습니다. 단지 과거의 흔적만이 사라졌습니다. 그저 민족 하나, 노래 하나, 문명 하나가 [Root.GetName]에서 자취를 감춘 것뿐입니다.\n\n어둠의 불멸자는 만족한 듯 보였습니다."
 colony.10082.a: "처음부터 필요 없었던 자들입니다."
 colony.10085.name: "거대한 실패"
 colony.10085.desc: "개척민들은 아나타리와 가까워지는 길을 걸었지만, 그것만으로는 충분하지 않았습니다. 시련은 실패했고, 어둠의 불멸자는 여전히 존재하며, 그 위세는 마치 땅 위에 퍼진 재앙처럼 드리워져 있었습니다.\n\n탐페리온 왕은 친구가 아닌, 다시 한번 어둠의 불멸자에게 봉사하는 존재로서 꽃의 궁정으로 돌아가야 했습니다. 부서진 왕국의 부서진 왕인 것입니다. 우리 개척민들은 행성에 남을 수 있었지만, 그것은 그저 허용될 뿐이었으며 다시 신뢰를 얻는 일은 없었습니다.\n\n'그들을 자유롭게 하려 했구나, [Owner.GetSpeciesNamePluralInsult].' 어둠의 불멸자가 우리 머릿속에서 말합니다. '그러나 너희는 자격이 없었다.'"
 colony.10085.a: "더 잃을 것도 없으니, 공격을 준비하세요."
 colony.10085.b: "아나타리를 제거해 주십시오. 우리가 당신의 충실한 하인이 되겠습니다."
 colony.10085.c: "식민지로 돌아갑시다."
 colony.10086.name: "전쟁만이 유일한 길"
 colony.10086.desc: "우리는 어둠의 불멸자의 힘이 엄청나다는 것을 알고 있었습니다. 그렇기에 우리의 공격은 즉각적이었고 거칠었습니다. 동굴이 흔들렸고, 불멸자는 속이 뒤틀리는 비명을 내질렀습니다.\n\n군대가 큰 피해를 입기는 했지만, 우리는 불멸자를 제압할 수 있었습니다. 동굴은 울부짖었고, 공기는 뼈가 부러지는 듯한 소리를 냈습니다. 이내 어둠의 불멸자가 사라졌습니다.\n\n그 후, 탐페리온 왕은 살아남은 이들을 맞이했습니다. 왕은 개척민들에게 다가와 깊이 고개를 숙였습니다. 많은 것을 잃었지만, 악몽은 끝났습니다."
 colony.10086.a: "결국 행성에 구원을 가져왔군요."
 colony.10087.name: "하인의 길"
 colony.10087.desc: "행성 전역에서 아나타리의 존재가 흔들리기 시작했습니다. 살과 뼈, 그리고 기억까지, 아나타리를 구성하던 모든 것이 서서히 사라져 갔습니다. 탐페리온 왕이 마지막으로 사라졌으며, 끝이 다가왔을 때 그는 아무 말도 하지 않았습니다. 개척민들은 왕의 최후에는 빛의 섬광과 황금색 꽃잎의 후광이 있었다고 보고했습니다.\n\n남은 것은 오직 어둠의 불멸자뿐이었습니다. 우리는 불멸자가 우리 의식 속 공간에 자리 잡는 것을 느꼈습니다. 어둠의 불멸자로부터 우리에게, 그리고 과거로부터 현재로, 어둡고 오래된 무언가가 꿈틀거리며 우리 안으로 스며들었습니다. 그 과정은 느리지만 완전했습니다.\n\n이제 우리 개척민들은 단순한 [Owner.GetSpeciesNamePlural](이)가 아니라, 무언가 다른 존재가 되었습니다. 무언가... 새로운 존재 말입니다."
 colony.10087.a: "운명을 받아들이겠습니다."
 colony.10090.name: "모든 생명에는 끝이 있다"
 colony.10090.desc: "거대한 존재가 그림자 속에서 모습을 드러냈습니다. 짐승도, 기계도 아닌 더 기이한 무언가였으며, 그 형상은 녹아내리는 기하학적 구조와 부글거리는 그림자 사이를 오갔습니다. 존재는 소통하려 하지 않았고, 그저 모든 것을 삼킬 뿐이었습니다.\n\n건물이 무너지고, 개척민들은 산산조각 나 공기 속으로 흩어지거나 보이지 않는 압력에 짓이겨졌습니다. 수 시간 만에, 행성에는 황폐화된 평원 위에서 낮게 울리는 웅웅거리는 소리만 남았습니다.\n\n그러고는 나타났던 것만큼 갑자기 괴수가 사라졌습니다. 그을린 행성 위에는 죽음과 파괴의 흔적만이 남았습니다."
 colony.10090.a: "두려운 힘이군요..."
 colony.10090.a.tt: "[Root.GetName]의 인구 50%가 사망했으며, 나머지 절반은 황폐화되었습니다."
 colony.10095.name: "우연인가 운명인가?"
 colony.10095.desc: "우리 순찰대가 [Root.GetName] 주변 숲에서 그을린 피부와 검게 탄 뼈, 그리고 원초적인 공포로 굳어진 표정을 한 기괴한 시체들을 발견했다고 보고했습니다. 현장에서는 아무런 무기도 발견되지 않았고, 어떤 충돌의 흔적도 없었습니다. 단지 근처 식생에 남은 흔적으로부터 극심한 열과 국소적인 중력 이상 현상이 발생했던 사실을 알 수 있었습니다.\n\n그곳에서 사냥을 벌인 존재가 무엇이었든 간에 지금은 사라졌으며, 행성이 이에 반응하기 시작했습니다. 시들었던 식물이 눈부신 풍요 속에서 다시 피어나고 토착 동물이 조심스러운 조화를 이루며 돌아왔습니다. 비옥한 토양은 이전에는 볼 수 없던 풍작을 약속하는 듯합니다.\n\n현재로서 식민지는 안전합니다."
 colony.10095.a: "운이 좋았군요."
