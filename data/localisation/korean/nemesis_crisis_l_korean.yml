 ### menp_undertaker: "Undertaker"
 ### menp_undertaker_desc: "'Death' is such a strong word. We are merely returning their matter to its initial state."
 ### crisis_perks_destruction_undertaker_unlock: "Purge §Y50§! £pop£ Pops to unlock this $crisis_perk$."
 ### undertaker_passive: "Purging generates £menace£ Menace."
 ### undertaker_active: "Purging speed is greatly increased, and generates £alloy£ Alloys."
 ### menp_ship-chipper: "Ship-chipper"
 ### menp_ship-chipper_desc: "All these metal constructs moving about in orderly fashion... It needs to stop."
 ### crisis_perks_destruction_ship-chipper_unlock: "Destroy 100 ships in order to unlock this $crisis_perk$."
 ### menp_ship-chipper_passive: "Your fleets take -25% damage in combat."
 ### menp_ship-chipper_active: "Your fleets have +50% weapon damage."
 ### menp_death_from_above: "Death From Above"
 ### menp_death_from_above_desc: "No place to run, no place to hide. In fact, no 'place' at all."
 ### crisis_perks_destruction_death_from_above_unlock: "Destroy 10 buildings through bombardment to unlock this $crisis_perk$."
 ### menp_death_from_above_passive: "When bombarding, Planet Devastation is 20% faster."
 ### menp_death_from_above_active: "Unlocks Armageddon Bombardment."
 crisis_perks_supremacy_privateering_title: "사략 활동"
 crisis_perks_supremacy_privateering_desc: "직접 공격한다고요?! 안 될 말씀입니다. 우리를 대신해 일을 수행해주는 이들이 있습니다."
 crisis_perks_supremacy_privateering_unlock: "이 $crisis_perk$을 잠금 해제하려면 총 4개의 약탈자 함대를 고용해야 합니다."
 crisis_perks_supremacy_privateering_passive: "약탈자 계약이 30% 더 오래 지속됩니다."
 crisis_perks_supremacy_privateering_active: "약탈자 계약 비용이 50% 저렴해집니다."
 crisis_perks_supremacy_primus_inter_pares_title: "동등한 자 중 제1인자"
 crisis_perks_supremacy_primus_inter_pares_desc: "그들은 우리와 동등합니다. 그들도 이 의견에 동의할 것이며, 동의하지 않을 경우..."
 crisis_perks_supremacy_primus_inter_pares_unlock: "최소 3개의 다른 회원국이 있는 패권 연방의 의장이 되십시오."
 crisis_perks_supremacy_primus_inter_pares_passive: "연방 회원국당 §G연방 함대 수용력 +5§!."
 crisis_perks_supremacy_primus_inter_pares_active: "연방 결속도가 3 증가합니다."
 crisis_perks_supremacy_support_is_mandatory_title: "지원은 의무"
 crisis_perks_supremacy_support_is_mandatory_desc: "그래, 우리 요구에 반대하는 건 너희의 자유다. 하지만 만약 반대한다면, 너희를 몰살할 것이다."
 crisis_perks_supremacy_support_is_mandatory_unlock: "이 $crisis_perk$을 잠금 해제하려면 최소 4개의 속국을 당신 제국 휘하에 두어야 합니다."
 crisis_perks_supremacy_support_is_mandatory_passive: "각 속국이 매월 10% 더 많은 £energy£ 에너지와 £mineral£ 광물을 제공합니다."
 crisis_perks_supremacy_support_is_mandatory_active: "당신 제국 휘하의 속국 하나당 20의 함대 수용력을 얻습니다"
 crisis_perks_deception_lord_of_red_tape_title: "번문욕례의 제왕"
 crisis_perks_deception_lord_of_red_tape_desc: "간단합니다! 연방 서식 68-XM을 작성한 뒤 늦어도 21일까지 11-B 부서에 제출하고, 사본 3부를 요청하여..."
 crisis_perks_deception_lord_of_red_tape_unlock: "이 $crisis_perk$을 잠금 해제하려면 3개의 제재안을 은하 공동체에 제안하십시오."
 crisis_perks_deception_lord_of_red_tape_passive: "결의안의 £influence£ 영향력 비용이 20% 감소합니다."
 crisis_perks_deception_lord_of_red_tape_active: "은하 공동체 법 §P'위반'§!에 대한 면책 특권을 얻습니다."
 crisis_perks_deception_dance_puppets_title: "춤춰라, 꼭두각시들아!"
 crisis_perks_deception_dance_puppets_desc: "방법은 잘 알고 있겠죠? 당신은 날 도와주고, 난 당신의 목숨을 살려주고."
 crisis_perks_deception_dance_puppets_unlock: "이 $crisis_perk$을 잠금 해제하려면 20 £favor£ 호의를 요청하십시오."
 crisis_perks_deception_dance_puppets_passive: "§R £favor£ 호의마다 -10% 외교적 영향력.§!"
 crisis_perks_deception_dance_puppets_active: "£favor£ 호의 요청이 £influence£ 영향력을 소모하지 않습니다."
 crisis_perks_deception_shadowplay_title: "그림자 연극"
 crisis_perks_deception_shadowplay_desc: "당신이 우리에 대해 알고 있다면, 그건 모두 우리가 알려주었기 때문입니다. 우리는 당신의 '모든 것'을 알고 있습니다."
 crisis_perks_deception_shadowplay_unlock: "이$crisis_perk$을 잠금 해제하려면 §H작전을 10회§! 완료하십시오."
 crisis_perks_deception_shadowplay_passive: "첩보 활동이 20% 빠르게 진행되고, 비용이 20% 저렴해집니다."
 crisis_perks_deception_shadowplay_active: "다른 제국에 대한 §G20 정보§!를 얻습니다."
