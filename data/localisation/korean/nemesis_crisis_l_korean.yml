 menace_crisis_description_title: "은하적 천벌"
 menace_crisis_description_intro: "은하 공동체 내에서 유구한 역사를 연구하던 자들은, 오랜 세월에 걸쳐 앞으로 다가올 §R위기§!를 예언했습니다. 위기는 모든 지성체를 향한 실존적 위험이며, 이를 극복하기 위해서는 모두가 단결해 공동의 목표를 추구하고 희생을 치러야 합니다. 하지만 우리는 이것이 극복할 수 있는 개념인지조차 알지 못합니다.\n\n이런 위기에 대해 말할 때, 보편적으로 꼽히는 것들은 타 은하에서 온 포식자의 침공, 은하에 존재하는 기계 지능의 보잘것없는 반란, 다른 차원에서 온 존재들과의 승계권 전쟁과 같이 상상에 불과한 것들이었습니다만...\n\n이제 §R우리§!가 그 위기가 될 존재였다는 게 확실해졌습니다."
 menace_crisis_description: "$menace_crisis_description_intro$\n\n우리의 행위가 무한한 에너지가 있는 다른 차원에 반향을 만들어 냈습니다. 이제 이 에너지를 끌어올 방법만 발견한다면, 온 은하계를 무릎 꿇릴 수 있습니다."
 menace_crisis_howto_title: "위협과 엔진"
 menace_crisis_howto: "§H위기 목표§!를 진행하면 £menace£ §H위협§!이 생성됩니다. 이를 통해 우리 제국의 파괴적 잠재력을 실현하고 에테르페이직 엔진 거대 구조물을 완성해 은하계에 새 시대를 열 수 있습니다."
