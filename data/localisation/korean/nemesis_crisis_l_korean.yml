 menacing_actions_supremacy_vassalize_empire_title: "제국 속국화"
 menacing_actions_supremacy_vassalize_empire_desc: "제국을 속국으로 만들면 §H100§!의 £menace£ 위협이 발생합니다."
 menacing_actions_supremacy_invade_primitives_title: "원시 행성 침공"
 menacing_actions_supremacy_invade_primitives_desc: "원시 행성을 침공하면 £pop£ 팝마다 §H1§!의 £menace£ 위협이 발생합니다."
 menacing_actions_supremacy_sent_marauders_title: "약탈자 습격 보내기"
 menacing_actions_supremacy_sent_marauders_desc: "약탈자 습격을 보내면 £pop£ 팝마다 §H50§!의 £menace£ 위협이 발생합니다."
 #Menacing Actions - Deception
 menacing_actions_deception_force_resolution_title: "반대를 무릅쓴 제안 강요"
 menacing_actions_deception_force_resolution_desc: "다수의 투표자들이 반대함에도 불구하고 제안을 강요하면 §H5§!의 £menace£ 위협이 발생합니다."
