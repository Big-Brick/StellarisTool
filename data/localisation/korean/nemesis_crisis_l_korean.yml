l_korean:
 #Ascension Perk name
 ap_become_the_crisis: "은하적 천벌"
 ap_become_the_crisis_desc: "모든 대업에는 희생이 따르기 마련입니다. 은하의 나머지 존재는 이해하지 못할 수도 있지만, 결국 복종하게 될 것입니다."
