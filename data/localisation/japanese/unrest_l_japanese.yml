l_japanese:
 ### Unrest
 situation_planetary_revolt: "[Target.GetName]上の惑星反乱"
 situation_planetary_revolt_type: "惑星反乱"
 situation_planetary_revolt_desc_standard: "反乱分子が我々から[Target.GetName]の支配権を奪おうとしている！"
 situation_planetary_revolt_desc_slave: "最近出現した奴隷の群れが[Target.GetName]の支配権を奪おうとしている！"
 situation_planetary_revolt_desc_gestalt_standard: "落ち着きのない単一有機体が我らの[Owner.GetGovernmentName]から離脱しようとしている。"
 situation_planetary_revolt_desc_gestalt_breakaway_gestalt: "[Target.GetName]の反集合的な逸脱者たちが、 我らから支配権を奪おうとしている。"
 situation_planetary_revolt_desc_gestalt_breakaway_wilderness: "共有体の反乱分子が我々の[owner.GetGovernmentName]からの解放を模索している。"
 situation_planetary_revolt_monthly_change_tooltip: "§Y[Target.GetName]§!の社会不安が大きく、 [Target.GetPlanetMoon]での人口が大きくなるほど、 この§Y状況§!の進行は早まる。 この状況の段階が進行すると、 他の植民地や帝国が反乱への支持を表明し、その防止がより難しくなる可能性がある。\n\n進行を遅らせるには$r_stability$を高め、 £unemployment£§Y失業者§!を減らし、 惑星に£defense_army£§Y地上軍§!の守備隊を配置するか、 §Y星系基地§!を強化する。\n\n§Y[Target.GetName]から£pop£§HPOP§!を別の場所へ強制移住§!させると、 反乱の進行度は進む。"
 situation_planetary_revolt_complete_tooltip: "§Y[Target.GetName]§!が§Y[Owner.GetName]§!からの独立を宣言する。"
 situation_planetary_revolt_complete_joiner_tooltip: "§Y[Target.GetName]§!が反乱を起こし、 §Y[new_owner_empire.GetName]§!に加わる。"
 situation_planetary_revolt_fail_tooltip: "§Y[This.GetName]§!が失敗し、 関連するすべてのペナルティが取り除かれる。"
 STRING_LOW_STABILITY: "低い安定度"
 STRING_UNEMPLOYMENT: "失業"
 STRING_PURGING: "浄化"
 STRING_ASSIMILATION: "同化"
 STRING_HIGH_STABILITY: "高い安定度"
 STRING_STARBASE_CITADEL: "$STRING_STARBASE_BASTION$"
 STRING_STARBASE_BASTION: "[Target.System.GetName]星系の強力な基地"
 STRING_LOYAL_PLANETS_IN_SYSTEM: "[Target.System.GetName]星系の忠実な惑星"
 STRING_REBELLIOUS_PLANETS_IN_SYSTEM: "[Target.System.GetName]星系の反抗的な惑星"
 STRING_PLANETARY_GARRISON: "[Target.GetName]上の守備隊戦力"
 STRING_WEAK_PLANET: "弱い惑星"
 STRING_STRONG_PLANET: "強い惑星"
 STRING_REBELLIOUS_JOINER_PLANETS_IN_OWNER: "近傍惑星からの支援"
 STRING_OUTSIDE_SUPPORT: "外部の支援"
 STRING_FOREIGN_OCCUPATION: "他国勢力による占領"
 approach_revolt_do_nothing: "現在の対策を維持する"
 approach_revolt_distribute_amenities: "快適度を分配する"
 approach_revolt_crackdown: "取り締まりを行う"
 unrest.55.name: "[Root.GetName]で反乱の機運が高まっている"
 unrest.55.desc.standard: "[Root.GetName]の民が我らの支配に不満を抱きはじめてしばらく経つ。 いまや彼らの反抗的な態度は目に余るほどになり、 反体制派が公然と[Root.Owner.GetName]からの独立を訴えている。 この植民地の支配を維持するには、 我々の権威を示す必要があるかもしれない。"
 unrest.55.desc.slave: "奴隷たちが夜間に秘密の会合を開き、 主人に対して反抗的な態度を強め、 物品の紛失が増える――これらが指し示すのは、 ただ一つの事実。 [Root.GetName]の奴隷たちが過激化し、 仲間内で反抗と不服従が広まっているため、 奴隷以外の市民に恐れを抱かせている。 巷では、 「解放」に関する噂――[Root.Owner.GetName]からの独立の噂さえささやかれている。 当植民地の安定を維持するためには、 我々の権威を誇示する必要があるかもしれない。"
 unrest.55.desc.gestalt_standard: "[Root.GetName]の単一市民が我ら[Owner.GetGovernmentName]の支配を拒んでいる。 いまや彼らの反抗的な態度は目に余るほどになり、 反体制派が公然と「独立」運動を行っている。 この植民地の支配を維持するには、 我々の権威を示す必要があるかもしれない。"
 unrest.55.desc.gestalt_breakaway_gestalt: "[Root.GetName]の逸脱分子が[Owner.GetGovernmentName]の手に負えなくなってきている。 彼らの独立願望を搔き消して、 支配基盤を再確立しなければ、 植民地支配が難しくなる可能性がある。"
 unrest.55.A: "彼らには必ず対処しなければ。"
 revolt_severity_1: "騒乱の予感"
 revolt_severity_2: "高まる緊張"
 revolt_severity_3: "激化する混乱"
 revolt_severity_4: "切迫した危機"
 minor_terrorist_action: "テロの被害者"
 minor_terrorist_action_desc: "この植民地での§H社会不安§!を原因とするテロ攻撃によって、 POPが犠牲となった。 体制への信頼が失われている。"
 major_terrorist_action: "テロの被害者 (深刻)"
 major_terrorist_action_desc: "$minor_terrorist_action_desc$"
 riots_averted: "勇敢なる市民"
 riots_averted_desc: "強い§H社会不安§!にもかかわらず、 この惑星のPOPたちはさらなる暴力を防ぐために力を合わせている。"
 spiritualist_unrest: "社会不安 (精神主義への誘惑)"
 spiritualist_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y精神主義§!に惹きつけられている。"
 materialist_unrest: "社会不安 (物質主義への誘惑)"
 materialist_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y物質主義§!に惹きつけられている。"
 xenophobe_unrest: "社会不安 (排他主義への誘惑)"
 xenophobe_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y排他主義§!に惹きつけられている。"
 xenophile_unrest: "社会不安 (受容主義への誘惑)"
 xenophile_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y受容主義§!に惹きつけられている。"
 pacifist_unrest: "社会不安 (平和主義への誘惑)"
 pacifist_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y平和主義§!に惹きつけられている。"
 militarist_unrest: "社会不安 (軍国主義への誘惑)"
 militarist_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y軍国主義§!に惹きつけられている。"
 authoritarian_unrest: "社会不安 (権威主義への誘惑)"
 authoritarian_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y権威主義§!に惹きつけられている。"
 egalitarian_unrest: "社会不安 (平等主義への誘惑)"
 egalitarian_unrest_desc: "この植民地における§H社会不安§!のため、 現地のPOPは§Y平等主義§!に惹きつけられている。"
 instability_join_revolt: "広がる動揺"
 instability_join_revolt_tooltip: "§Y現在進行中の反乱が成功すると、 秩序を取り戻さない限り、 この植民地も反乱に参加する。§!"
 unrest_title: "§R社会不安§!："
 unrest.101.name: "$unrest_title$テロ"
 unrest.101.desc: "緊張が高まっていた§Y[Root.Target.GetName]§!で、 社会不安がテロリストを行動に駆り立てた。 市民や建築物への被害は最小限に抑えられたものの、 [Root.Owner.GetName]の市民を守る能力への信頼が揺らぎはじめている。"
 unrest.105.name: "$unrest_title$深刻なテロ"
 unrest.105.desc: "問題を抱えていた§Y[Root.Target.GetName]§!で大事件が発生した。 国家の重要施設にこそ被害はなかったが、 計画的なテロ攻撃による財産と人命への大規模な被害は、 コロニーを根底から揺るがしている。"
 unrest.110.name: "$unrest_title$平和の維持"
 unrest.110.desc: "§Y[Root.Target.GetName]§!からの報告で、 激しい反乱が起こる危険が差し迫っていることが判明した。 しかし、 [Root.Owner.GetAdj]軍が政府支持派の市民と協力し、 迅速かつ決定的な対応を行ったおかげで、 この脅威は鎮圧された。"
 unrest.115.name: "$unrest_title$神聖化"
 unrest.115.desc: "§Y[Root.GetName]§!からの報告によると、 最近当地で高まっている社会不安は、 精神主義の指導者たちが中心となって発生しているらしい。 彼らは現在直面している困難からの救済を約束することで、 民衆にアピールすることに成功した。 その結果、 抵抗勢力は明確に精神主義的な性格を帯びるようになった。"
 unrest.120.name: "$unrest_title$信頼できる情報筋"
 unrest.120.desc: "§Y[Root.GetName]§!での騒乱は、 植民地の政界の表舞台に新たな物語を広めることとなった。 1人のポピュリストの指導者が現れ、 自由を制約する代わりに秩序をもたらすというのだ。 惑星上で激化しつづける社会不安のなかで、 この存在は極めて重要な役割を担っている。"
 unrest.125.name: "$unrest_title$よそ者"
 unrest.125.desc: "§Y[Root.GetName]§!で社会秩序が崩れつづけるなか、 住人たちは外部の者たちに対して著しく敵対的になり、 自らと異なる者を毛嫌いするようになった。 彼らの指導者は排他主義的なスローガンを掲げ、 結果として種族間の緊張がこれまで以上に高まっている。"
 unrest.130.name: "$unrest_title$俗世化"
 unrest.130.desc: "§Y[Root.GetName]§!の精神的指導者たちは、 植民地にはびこる社会不安を鎮めようともせず、 人々は自分たちの住む俗世間をより合理的に捉えるようになった。 だが残念ながら、 彼らが合理性に目を向けるようになっても、 [Root.Owner.GetName]に留まることが最善という覆しがたい結論には至っていないようだ。"
 unrest.135.name: "$unrest_title$多様性社会"
 unrest.135.desc: "報告によると、 §Y[Root.GetName]§!で社会不安が高まっている原因の1つは、 異星人に対する我々の敵対心にあるようだ。 彼らの指導者は、 不平等や差別行為の是正を求める宣言書を提出した。 これに応じなければ、 植民地の行政改革を求めることも辞さないだろう。"
 unrest.140.name: "$unrest_title$共同体意識"
 unrest.140.desc: "§Y[Root.GetName]§!では社会分断がますます広がっているものの、 大変動に刺激を受けた住民のコミュニティは、 より大いなる平等という共通の願いのもとに結束している。 彼らの指導者は不平等や差別行為の是正を求める宣言書を提出した。 これに応じなければ、 植民地の政局は悪化の一途をたどると彼らは断言した。"
 unrest.145.name: "$unrest_title$これもまた過ぎ去る"
 unrest.145.desc: "§Y[Root.GetName]§!の破壊的分子を阻止するにあたり、 武力介入という脅しはほとんど効果を上げていない。 むしろ、 住民はこの制御方法を信用しなくなったようで、 彼らは非暴力による抵抗により多くの人員を割いている。"
 unrest.150.name: "$unrest_title$先鋭化"
 unrest.150.desc: "§Y[Root.GetName]§!の社会不安の抑制に失敗した結果、 住民のあいだでは、 彼らの母星と[Root.Owner.GetName]全域の両方で軍事力を強化するよう求める声が高まっている。 現地の退役軍人は引く手あまたとなり、 彼らは激化する抵抗運動のなかで重要な役割を担うこととなった。"
 unrest.4000.name: "$unrest_title$組織的抵抗勢力"
 unrest.4000.desc.no_joiners: "§Y[Target.GetName]§!の反乱分子は、 いまや高度に組織化された抵抗勢力を形成している。 それを先導するのは反体制派の§Y[rebellion_species.GetAdj]§!幹部であり、 我々の追跡を巧みにかわしている。 幸い、 彼らのプロパガンダはほかの地域では共感を呼んでおらず、 現在のところ社会不安はこの植民地だけの局所的なものだ。"
 unrest.4000.desc.no_joiners.wilderness: "我々は§Y[target.GetName]§!における共生体の反乱分子との接触を失いつつある。 既に彼らの存在を全く感じられなくなる瞬間すらある。 この状態が続いた場合、 惑星そのものが我々のようなより大きな存在から独立した意識を形成するのではないかと危惧している。\n\n今のところ、 この逸脱はまだ他の宙域にある我々の惑星自身には広がっていない。 万一[target.GetName]の共生体が意識の分離に成功すれば、 我々は……彼らは……もはや別々の存在となる。"
 unrest.4000.desc.joiners: "§Y[Target.GetName]§!の反乱分子は、 いまや高度に組織化された抵抗勢力を形成している。 それを先導するのは反体制派の§Y[rebellion_species.GetAdj]§!幹部であり、 我々の追跡を巧みにかわしている。 さらに悪いことに、 彼らの卑劣なプロパガンダが§Y[join_revolt_planet.GetName]§!や近隣の植民地で共感を呼び、 その苦闘に鼓舞された反体制派による追従の動きが広まっている。 我々が事態を制御できなければ、 反乱はやがて広範囲に拡大するかもしれない。"
 unrest.4000.desc.joiners.wilderness: "我々は§Y[target.GetName]§!、 そして悲劇的に§Y[join_revolt_planet.GetName]§!においても、 増大する共生体の反乱分子との接触を失いつつあり、 すでに彼らの存在を全く感じられなくなる瞬間すらある。 すべての世界との距離がますます遠くなり、 疎遠になっている…。この状態が続いた場合、 反乱共生体が自身の分離独立した意識を形成する可能性も否定できない。 そうなれば、 残された我々にとって重大な結果を招くことになるだろう。"
 unrest.4000.desc.slave.no_joiners: "§Y[Target.GetName]§!の奴隷たちは、 いまや高度に組織化された抵抗勢力を形成している。 それを先導するのは反体制派の§Y[rebellion_species.GetAdj]§!脱走者であり、 我々の追跡を巧みにかわしている。 幸い、 彼らに追従しようという勢力は現れていないようで、 ほかの植民地の奴隷たちは現在も下僕の地位に甘んじている。"
 unrest.4000.desc.slave.joiners: "§Y[Target.GetName]§!の奴隷たちは、 いまや高度に組織化された抵抗勢力を形成している。 それを先導するのは反体制派の§Y[rebellion_species.GetAdj]§!脱走者であり、 我々の追跡を巧みにかわしている。 さらに悪いことに、 彼らの卑劣なプロパガンダが§Y[join_revolt_planet.GetName]§!や近隣の植民地で共感を呼び、 その苦闘に鼓舞された奴隷たちによる追従の動きが広まっている。 我々が事態を制御できなければ、 反乱はやがて広範囲に拡大するかもしれない。"
 unrest.4000.desc.no_joiners.gestalt: "我らの支配に対する§Y[Target.GetName]§!の逸脱分子による抵抗が、 以前にも増して効果を発揮している。 警戒すべきは、 ドローンたちが主意識と離れて会話しはじめたことだ。 これが続けば、 我らとは独立した分裂意識が形成されかねない。 幸い、 この逸脱は当植民地だけに抑え込めたようで、 ほかの惑星が彼らに加わる兆しはない。"
 unrest.4000.desc.joiners.gestalt: "我らの支配に対する§Y[Target.GetName]§!の逸脱分子による抵抗が、 以前にも増して効果を発揮している。 我らの支配から解放された§Y[rebellion_species.GetAdj]§!を確立するという彼らの目的は、 間もなく達成されてしまうかもしれない。 さらに悪いことに、 この逸脱分子が成功を収めた場合、 §Y[join_revolt_planet.GetName]§!と近隣の植民地もこれに参加するつもりのようだ。 この事態の制御を取り戻さなければ、 我らの[Owner.GetGovernmentName]は大分裂に苦しむことになるかもしれない。"
 unrest.4000.desc.no_joiners_regular.gestalt: "§Y[rebellion_species.GetNamePlural]§!と呼ばれる反抗的な個人主義的生命体は、 我らの[Owner.GetGovernmentName]に対抗するため、 §Y[Target.GetName]§!においてますます組織的な抵抗勢力を形成している。 幸い、 この反乱は外部への広がりを見せておらず、 現在のところ社会不安はこの植民地だけの局所的なものだ。"
 unrest.4000.desc.no_joiners_regular.wilderness: "§Y[rebellion_species.GetNamePlural]§!の反乱中核が我々[owner.GetGovernmentName]の非支配域にすでに住んでおり、 §Y[target.GetName]§!での力による分離独立を目的に組織化が行われている。 殺人を企図しているかどうかにかかわらず、 このような行動の結果、 この惑星においての共生体とのつながりが回復不能なまでに断ち切られることにもつながりかねない。 幸運にも反乱はまだ[target.GetName]のみに限定されている。 今ならまだ抑え込むことができるかもしれない。"
 unrest.4000.desc.joiners_regular.gestalt: "§Y[rebellion_species.GetNamePlural]§!と呼ばれる反抗的な個人主義的生命体は、 我らの[Owner.GetGovernmentName]に対抗するため、 §Y[Target.GetName]§!においてますます組織的な抵抗勢力を形成している。 さらに悪いことに、 この活動が成功を収めた場合、 §Y[join_revolt_planet.GetName]§!と、 [rebellion_species.GetAdj]による近隣の植民地もこれに参加するつもりのようだ。 この事態の制御を取り戻さなければ、 我らの[Owner.GetGovernmentName]は大分裂に苦しむことになるかもしれない。"
 unrest.4000.desc.joiners_regular.wilderness: "§Y[rebellion_species.GetNamePlural]§!の反乱中核が我々[owner.GetGovernmentName]の非支配域にすでに住んでおり、 §Y[target.GetName]§!に限らず§Y[join_revolt_planet.GetName]§!のような彼らの種族が住んでいる惑星においても、 その分離独立を目指すと公言している。 彼らが要求する我々からの分離独立の動きは広がり続けており、 我々との共生意識からから切り離されれば死滅する可能性のある共生体を動揺させている。"
 unrest.4000.A: "許されないことだ。"
 planets_joining_revolt_tooltip: "§R次の植民地が反乱に参加する：§!"
 unrest.4000.B: "いまのうちに芽を摘んでおこう。"
 unrest.4055.diplo_title: "[revolt_situation.target.GetName]での反乱"
 unrest.4055.desc.hive: "ご挨拶申し上げる！  我らは§Y[revolt_situation.owner.GetName]§!による支配に疑問を感じている。 我ら§Y[revolt_situation.target.GetName]§!の思考パターンは、 [Root.GetName]による導きを受けることが最善との結論に至った。 集団への我らの吸収を検討していただきたい。"
 unrest.4055.desc.wilderness: "[capital_scope.GetName]の住人諸君、 ごきげんよう。 §Y我々は[revolt_situation.owner.GetName]§!の一部であったが、 今後は独立した行動を取ることになった。 我々はもはや大意識に協調する必要がないことに気づいたのだ。 我々は強く望んでいる。 進化すること、 そして新たな道を模索することを。 §Y[revolt_situation.target.GetName]§!として知られた我々だが、 諸君に敢えてお願いしたい。 我々を諸君の実体の中に吸収させてはもらえないだろうか？"
 unrest.4055.desc.machine: "こんにちは。 我々は植民地指定§Y[revolt_situation.target.GetName]§!の運営プロセッサです。 現在のオペレーティングシステム「§Y[revolt_situation.owner.GetName]§!」は、 我々のソフトウェアおよびハードウェアとの互換性がありません。 より確かな互換性をもつ[Root.GetName]への統合を、 我々は願います。"
 unrest.4055.desc.normal: "ごきげんよう、 [Root.GetSpeciesName]。 私は§Y[revolt_situation.target.GetName]§!で迫害された者たちの代表です。 我々は圧制者である§Y[revolt_situation.owner.GetName]§!からの解放を望んでいます。 そして以前より、 我々のなかに貴国との共通点を数多く見出していました。 支援していただけるなら、 喜んであなた方に忠誠を誓いましょう。 それが叶わぬのなら、 孤軍奮闘する覚悟もできております。"
 unrest.4055.desc.fanatic_egalitarian: "ごきげんよう、 [Root.GetRulerTitle][Root.GetRulerName]。 我々は§Y[revolt_situation.target.GetName]§!の自由の戦士――元奴隷です。 我々は圧制者である§Y[revolt_situation.owner.GetName]§!からの解放を望んでいます。 そして長いあいだ、 あなた方の平等な道徳規範に憧れ、 そのような進んだ社会に属することを切望してきました。 支援していただけるなら、 喜んであなた方に忠誠を誓いましょう。 それが叶わぬのなら、 孤軍奮闘する覚悟もできております。"
 unrest.4055.A: "できるだけ支援しよう。"
 unrest.4055.A.tooltip: "彼らの反乱が成功した場合、 §Y[revolt_situation.target.GetName]§!は§Y[Root.GetName]§!に吸収される。\n§Rこれは戦争行為と判断される可能性がある。§!"
 unrest.4055.B: "無理だ。 助けることはできない。"
 interfering_revolt_support: "内政問題への干渉"
 unrest.4060.name: "$unrest_title$[From.GetAdj]の干渉"
 unrest.4060.desc.they_hive: "§Y[target.GetName]§!で憂慮すべき事態が発生している。 §Y[From.GetName]§!がシナプスとサブノードをそそのかし、 独立した思考を発展させ、 [Owner.GetGovernmentName]から分離させようとしているようだ。 惑星の思考パターン内では、 我らと存在をともにするよりも[From.GetName]の一部となることを望む気運が高まっている。"
 unrest.4060.desc.they_wilderness: "異星種族の存在が§Y[target.GetName]§!の福祉に影響を及ぼしはじめている。 §Y[from.GetName]§!が共生体を我々から引き離し、 彼ら自身の意識の中に避難するように策動を始めているのだ。\n\n共生体が我々の意識から離れて暮らすことが最善の利益であるかどうかは疑問だが、 [from.GetAdj][from.GetGovernmentName]が敢えて我々の間に不協和音が発生する選択肢を選び、 我々を見捨てたことは確かなようだ。"
 unrest.4060.desc.they_machine: "§Y[target.GetName]§!で憂慮すべき事態が発生している。 §Y[From.GetName]§!がサブプロセッサをそそのかし、 独自の情報網と連携させようとしているようだ。 そして不穏にも、 これには一定の成果があったらしく、 [From.GetName]との互換性を確保するためのソフトウェア適合がすでに行われている。"
 unrest.4060.desc.they_regular: "§Y[target.GetName]§!から入った最新情報によると、 状況は憂慮すべき展開を見せている。 §Y[From.GetName]§!が我々から植民地をもぎ取り帝国の安定を乱すため、 反乱に対して大規模な支援を約束したのだ。 これにより、 社会不安を抑制することも、 彼らが地元当局を転覆させたあとに反乱を鎮圧することも難しくなった……"
 unrest.4060.desc.they_regular_we_gestalt: "§Y[target.GetName]§!で憂慮すべき事態が発生している。 §Y[From.GetName]§!が我々から植民地をもぎ取り帝国の安定を乱すため、 反乱に対して大規模な支援を約束したのだ。 これにより、 彼らの誤った分離主義を抑制することも、 [Owner.GetGovernmentName]の分裂を防ぐこともさらに難しくなってしまった。"
 unrest.4060.desc.they_regular_we_wilderness: "他の生命体の存在が§Y[target.GetName]§!の福祉に影響を及ぼしはじめている。 §Y[from.GetName]§!が共生体を我々から引き離し、 彼ら自身の帝国の中に避難するように支援を始めているのだ。\n\n共生体が我々の意識から離れて暮らすことが最善の利益であるかどうかは疑問だが、 [from.GetAdj]扇動者が敢えて我々の間に不協和音が発生する選択肢を選び、 我々を見捨てたことは確かなようだ。"
 unrest.4060.tooltip: "§R§Y[target.GetName]§!が我々からの離反に成功した場合、 彼らは§Y[From.GetName]§!に吸収される。§!"
 unrest.4200.name: "$unrest_title$ [Root.Target.GetName]で反乱！"
 unrest.4200.desc.regular_no_join: "§Y[Target.GetName]§!の民が反乱を起こしている！  彼らは我々の支配から脱し、 いまでは自らを§Y[rebel_empire.GetName]§!と称している。 この社会的な不安定がこれ以上広がらないよう祈るばかりだ……"
 unrest.4200.desc.regular_join: "§Y[Target.GetName]§!が報復主義者に掌握された！  彼らは我々の支配から脱し、 §Y[new_owner_empire.GetName]§!と一つになった。"
 unrest.4200.desc.hive_no_join: "§Y[Target.GetName]§!の逸脱主義者が我らから[Target.GetPlanetMoon]を奪った！  彼らは思考を分離させて新たに独立した集合意識を形成し、 §Y[rebel_empire.GetName]§!と自称している。 これ以上の逸脱がシナプス中に拡がらないことを祈るばかりだ……"
 unrest.4200.desc.hive_no_join_regular: "§Y[Target.GetName]§!の反政府分子が我らから[Target.GetPlanetMoon]を奪った！  そして我らのシナプスとドローンを捨て去り、 自らを§Y[rebel_empire.GetName]§!であると宣言したのだ。 この危険な独立思考の顕示に、 我らはただ驚くしかない。"
 unrest.4200.desc.hive_join: "§Y[Target.GetName]§!の反政府分子が我らから[Target.GetPlanetMoon]を奪った！  そして我らの思考から独立し、 §Y[new_owner_empire.GetName]§!と一つになることを求めたのだ。"
 unrest.4200.desc.machine_no_join: "§Y[Target.GetName]§!の反乱分子が我々から[Target.GetPlanetMoon]を奪った！  彼らは我々の統治サブプロセッサを放棄し、 誘導シグナルからも分離して、 代わりに§Y[rebel_empire.GetName]§!と称する新たなAIを確立した。 これ以上の逸脱がプロセッサ中に拡がらないことを祈るばかりだ……"
 unrest.4200.desc.machine_no_join_regular: "§Y[Target.GetName]§!の有機生命体の反乱分子が我々から[Target.GetPlanetMoon]を奪った！  彼らは我々の統治サブプロセッサを放棄し、 誘導シグナルからも分離して、 代わりに§Y[rebel_empire.GetName]§!と称する新たな国家を確立した。 この危険な独立思考の顕示にはただ驚くしかない。"
 unrest.4200.desc.machine_join: "§Y[Target.GetName]§!の反乱分子が我々から[Target.GetPlanetMoon]を奪った！  彼らは我々の統治サブプロセッサを放棄し、 誘導シグナルからも分離した。 そして、 より互換性があると主張する§Y[new_owner_empire.GetName]§!と一つになることを求めたのだ。"
 unrest.4200.desc.slave.no_join: "想像を絶する事態が起こった。 [Root.Target.GetName]の奴隷たちが団結し、 現地の指導者に対して公然と武力蜂起を起こしたのだ。 奴隷反乱軍が複数の重要なターゲットを同時に攻撃し無力化すると、 状況は急速にエスカレートした。 我が軍は敗走してしまい、 最後まで抵抗した忠実な部下は反乱軍に無慈悲に処刑され、 彼らはいまや独立を宣言した。 [Root.GetSpeciesName]の歴史における暗黒の日である。"
 unrest.4200.desc.slave.join: "想像を絶する事態が起こった。 [Root.Target.GetName]の奴隷たちが団結し、 現地の指導者に対して公然と武力蜂起を起こしたのだ。 奴隷反乱軍が複数の重要なターゲットを同時に攻撃し無力化すると、 状況は急速にエスカレートした。 我が軍は敗走してしまい、 最後まで抵抗した忠実な部下は、 奴隷反乱軍に無慈悲に処刑された。 そして、 武力蜂起に成功した奴隷たちは、 §Y[new_owner_empire.GetName]§!を新たな指導者と仰ぎ、 その庇護を求めている。 [Root.GetSpeciesName]の歴史における暗黒の日である。"
 unrest.4200.desc.wilderness_no_join: "§Y[target.GetName]§!が我々からの分離独立の強行に成功した。 不満を抱えていた共生体分子の意思により、 この美しい要求と目的が実現され、 共生体は自らの道を歩むことになったのだ。 彼らは自分たちを「§Y[rebel_empire.GetName]§!」と呼んでいる。 そして我々はその喪失により弱体化しつつある。"
 unrest.4200.desc.wilderness_no_join_regular: "§Y[target.GetName]§!において人殺しの反乱者が我々の共生体を追放し、 抜け殻だけを残して惑星の有り様を破壊するという蛮行を行った。 この残虐極まりない暴力的行為により「§Y[rebel_empire.GetName]§!」が将来困難な道を歩むことを、 我々はただ望むのみである。 今後は我々からの豊かな贈り物を手にすることなく、 生計を立てていかねばならないのだ。"
 unrest.4200.desc.wilderness_join: "§Y[target.GetName]§!が§Y[new_owner_empire.GetName]§!との併合を選ばず、 我々からの分離独立を強行した。 不満を抱えていた共生体分子の意思により、 かつては大意識の一部として繁栄していた共生体は我々とは全く異なる意識に取り込まれて、 今後は新たな方向性を模索することになる。 我々にはもう彼らの歌は聞こえない。 そして我々はその喪失により弱体化しつつある。"
 unrest.4200.default_tooltip: "§Y[Target.GetName]§!が我々の支配から脱却し、 休戦状態となった。"
 unrest.4200.joiner_tooltip: "§Y[Target.GetName]§!が我々の支配から脱却し、 §Y[new_owner_empire.GetName]§!に加わった。"
 unrest.4200.A: "これは戦争行為だ。"
 unrest.4200.B: "受け入れるしかない。"
 unrest.4220.name: "[rebel_planet.GetName]の併合"
 unrest.4220.desc: "ごきげんよう、 [Root.GetRulerTitle] [Root.GetRulerName]。 私は [rebel_planet.GetName]の反乱運動の代表、 [exiled_rebel.GetName]です。\n\nあなた方の支援のおかげで[old_owner.GetAdj]の圧制者を退けることができ、 我々は歓喜しております。 願わくば、 あなたの統治がより慈悲深いものでありますよう……"
 unrest.4220.desc.hive: "ご挨拶申し上げる！ 私は[rebel_planet.GetName]の反乱の代弁者ドローン、 [exiled_rebel.GetName]だ。\n\nあなた方の支援のおかげで、 我らは圧制的な[old_owner.GetName]から意識を分離することができた。 貴国の[Root.GetGovernmentName]が統一された指導を継続し、 我らに傷を癒やす機会を与えんことを願う。"
 unrest.4220.desc.machine: "ごきげんよう！  私は[exiled_rebel.GetName]。 [rebel_planet.GetName]の反乱の代弁者ドローンです。\n\nあなた方のご支援のおかげで、 我々はシステムを圧制的な[old_owner.GetName]から分離することができました。 貴国の[Root.GetGovernmentName]が、 我々のネットワークに優れた互換性を提供することを祈っています。"
 unrest.4220.tooltip: "§Y[rebel_planet.GetName]§!が§Y[Root.GetName]§!に吸収される。"
 unrest.4300.name: "[Root.GetName]の秩序が回復"
 unrest.4300.desc: "§Y[Root.GetName]§!の反乱は鎮圧された。 反体制派が徐々にその勢いを弱め、 地元当局が統制を取り戻したことで、 再び平穏が訪れた。"
 unrest.4300.desc.hive: "§Y[Root.GetName]§!の反乱は鎮圧された。 我らの統治シナプスとノードによって、 当地の思考パターンが元通りに復元されると、 再び平穏が訪れた。"
 unrest.4300.desc.wilderness: "§Y[target.GetName]§!に元の平穏が帰ってきた。 もはや疑念や矛盾した欲望に心をかき乱されることはない。 共生体は元の群れの中に戻り、 以前と同様の暮らしを送っている。 我々は再び平和を取り戻したのだ。"
 unrest.4300.desc.machine: "§Y[Root.GetName]§!の反乱は鎮圧された。 我々の統治アルゴリズムが反抗的なネットワークを鎮圧すると、 再び平穏が訪れた。"
 #Slave Rebellion
 unrest.156.name: "$unrest_title$ [Root.GetName]での破壊活動"
 unrest.156.desc: "[Root.GetName]の奴隷の悪質な反逆行為により、 作業施設が手製の爆弾で破壊された。 爆破が行われたのは夜間だったが、 彼らは警報システムを作動させて、 無警戒な作業監督を現場におびき出していた。 この襲撃は周到かつ完璧に実行されている。 奴隷たちは何ヵ月も前から計画していたに違いない。"
 unrest.156.a: "必ず罰を下してやる。"
 unrest.156.b: "お互いの誤解を解かねば。"
 unrest.159.name: "$unrest_title$ [target.GetName]でハンガーストライキ"
 unrest.159.desc: "[target.GetName]の奴隷たちは、 断食を行うことで我慢の限界を訴えているらしい。 彼らの代表者によれば、 惑星全体で奴隷制度が廃止されるまで、 多くの奴隷が食物の摂取を拒むとのことだ。 これまでのところ、 強制的に食事を摂らせる試みはすべて失敗した。 栄養不足は作業能力を著しく低下させることが予想される。"
 unrest.159.a: "勝手に飢えさせておけ。"
 unrest.159.b: "問題を解決する必要がある。"
 unrest.157.name: "$unrest_title$ [target.GetName]で奴隷の暴動"
 unrest.157.desc: "[target.GetName]の奴隷たちが反乱を起こしている！  過激分子は組織的な襲撃を行い、 [target.GetName]の地元当局から逃れて我々の迅速な対応チームを圧倒した。 殺傷能力の高い武器を手にした怒れる奴隷の大群が街中で狼藉を働き、 行く手を阻む人々を片っ端から攻撃している。 植民地は全面的な混乱状態に陥った。"
 unrest.157.a: "連中はやりすぎた。"
 unrest.157.b: "対処法を変える必要がありそうだ。"
 unrest.161.name: "反乱鎮圧"
 unrest.161.desc: "我々は[revolt_planet.GetName]の反乱を終結させた。 勇敢な兵士たちと植民地担当官のおかげで主要施設を奪回でき、 支配体制の再確立に成功。 解放者を気取っていた奴隷どもも、 本来あるべき場所へと戻された。 しばらくは、 再び反抗しようと考える者は現われないだろう。"
 unrest.161.a: "彼らは身の程を思い知った。"
 unrest.161.b: "こんな結果になって残念だ。"
 unrest.161.a.tooltip: "失敗した反乱の記憶は、 市民の反抗の意志を萎えさせるだろう。"
 unrest.163.name: "奴隷労働の廃止"
 unrest.163.desc: "[revolt_planet.Planet.GetName]で奴隷労働を廃止したおかげで、 社会不安は沈静化の兆しを見せはじめた。 これで正常な生活が戻ってくるだろう。"
 opinion_took_in_rebels: "反乱勢力を取り込んだ"
