 DELVING_RITUAL: "Ritual de Mergulho"
 DELVING_RITUAL_DESC: "Os preparativos necessários para realizar um Ritual de Mergulho e acessar o §HVéu§! foram feitos por §Y[shroudwalker_enclave_country.GetName]§! em nosso nome. Ainda não sabemos o que nos aguarda."
 MINDWARDENS_THE_FIRST_ENCLAVE: "O Primeiro Enclave"
 MINDWARDENS_THE_FIRST_ENCLAVE_DESC: "Estamos prontos para construir um §H\"$gov_mindwarden_enclave$\"§! independente, dedicado à nossa missão de erradicar a infecção psiônica em toda a galáxia.\n\nAssim que for construída, essa instalação poderá oferecer serviços antipsiônicos àqueles que precisarem, além de nos fornecer uma parte dos recursos da receita e materiais obtidos."
