 war_goal_wg_proxy_war: "Guerra por Procuração"
 war_goal_wg_proxy_war_desc: "A guerra acontece por meio de rumores hostis e sussurros ocultos. Ao vencer, o atacante obtém o controle de quaisquer sistemas reivindicados e gera §Y33%§! menos de §YAmeaça§! para cada sistema conquistado."
 shroud.5055.title: "$proxy_war_busted_modifier$"
 shroud.5055.desc.common: "Fomos enganados.\n\nNossos agentes de inteligência interceptaram comunicações secretas de §H[from.GetName]§!. Elas revelaram seu plano para nos lançar em uma guerra por procuração.\n\nEles negaram veementemente qualquer envolvimento, mas o dano à nossa relação já estava feito."
 shroud.5055.desc.galactic: "$shroud.5055.desc.common$ Notícias sobre a falsidade deles se espalharam rapidamente, afetando negativamente a reputação de [from.GetName] por toda a galáxia."
 shroud.5060.title: "$proxy_war_busted_modifier$"
 shroud.5060.desc.common: "Embora tenhamos conseguido induzir um conflito, a operação não saiu totalmente como planejado. As comunicações de um de nossos agentes foram interceptadas, revelando nossas ações secretas para todas as partes envolvidas.\n\nNossas tentativas de explicar foram inefetivas."
 shroud.5060.desc.galactic: "$shroud.5060.desc.common$ Esse evento prejudicou nossas relações com os beligerantes, e o escândalo manchou nossa reputação em uma escala galáctica."
 shroud.5060.desc.default: "$shroud.5060.desc.common$ Esse evento prejudicou significativamente nossas relações com os beligerantes."
 shroud.5060.a.tt: "Impérios envolvidos na §YGuerra por Procuração§! tiveram sua opinião sobre nós alterada em: §R-200§!"
 proxy_war_busted_modifier: "Guerra por Procuração Revelada"
 proxy_war_busted_modifier_desc: "As maquinações que causaram a guerra por procuração foram descobertas pelas partes envolvidas no conflito. Isso prejudicou gravemente a nossa reputação."
 opinion_proxy_war_busted: "$proxy_war_busted_modifier$"
 PROXY_WAR_BUSTED_MESSAGE_TYPE_TITLE: "$proxy_war_busted_modifier$"
 PROXY_WAR_BUSTED_MESSAGE_TYPE_DESC: "Os beligerantes envolvidos descobriram que nós causamos a guerra por procuração.\n$shroud.5060.a.tt$"
 PROXY_WAR_REVEALED_MESSAGE_TYPE_TITLE: "$proxy_war_busted_modifier$"
 PROXY_WAR_REVEALED_MESSAGE_TYPE_DESC: "Descobrimos que autoridades de §H$INSTIGATOR$§! planejaram nos lançar em uma guerra por procuração.\nNossa opinião sobre §H$INSTIGATOR$§! mudou em: §R-200§!"
