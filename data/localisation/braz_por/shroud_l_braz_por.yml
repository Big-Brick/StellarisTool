 shroud.first_contact_insert.composer: "um §Hacorde ressonante§!"
 shroud.4025.title: "$the_composer_of_strands_article_cap$ Emerge"
 shroud.4025.desc.default: "Seguimos o rastro do ente §H[Root.Patron:the_composer_of_strands.GetPreCommunicationName]§!, atraídos cada vez mais para as profundezas do §HVéu§!. Havia sinais deixados para trás... uma imagem aqui, uma melodia ali. Éramos convidados a nos aproximar, mas o progresso foi lento.\n\nPor fim, alcançamos a entidade. Fomos recebidos com uma miríade de visões: sistemas estelares fervilhando de atividade, distorções prodigiosas do povo [Root.GetSpeciesAdj]. Transformando-se em seu abraço, nos perdemos em um emaranhado de formas pungentes.\n\nAtamos os fios que conseguimos alcançar. Os sinais dispersos se alinharam em padrões. Exauridos, contemplamos a majestade das formas e figuras. A presença silenciou.\n\nA vontade da entidade se tornou clara para nós. Vimos sua visão de crescimento sem limites. Assim que nossa equipe de [GetTelepathPlural] se recuperar, poderemos nos conectar e comungar com este ser, $the_composer_of_strands_color_article$."
 shroud.4025.desc.hive: "$shroud.4025.desc.default$"
 shroud.4025.desc.gestalt_machine: "Seguimos os traços moleculares do ente §H[Root.Patron:the_composer_of_strands.GetPreCommunicationName]§!, atraídos cada vez mais para as profundezas do §HVéu§!. Havia sinais deixados para trás... uma imagem aqui, uma melodia ali. Éramos convidados a nos aproximar, mas o progresso foi lento.\n\nPor fim, alcançamos a entidade. Fomos recebidos com uma miríade de visões: sistemas estelares fervilhando de atividade, distorções prodigiosas do povo [Root.GetSpeciesAdj]. Transformando-se em seu abraço, nos perdemos em um emaranhado de formas incongruentes.\n\nAtamos os fios que conseguimos alcançar. Os sinais dispersos se alinharam em padrões. Exauridos, processamos o notável conjunto de dados. A presença silenciou.\n\nA vontade da entidade se tornou clara para nós. Vimos sua visão de crescimento sem limites. Assim que nossa equipe de [GetTelepathPlural] estiver recarregada, poderemos nos conectar e comungar com este ser, $the_composer_of_strands_color_article$."
 shroud.4025.desc.individual_machine: "$shroud.4025.desc.gestalt_machine$"
 shroud.4025.a.default: "Seu poder é resplandecente."
 shroud.4025.a.robot: "Seu poder é incalculável."
 shroud.4025.b.default: "$shroud.first_contact.end.b$"
 shroud.4025.b.robot: "$shroud.first_contact.end.b$"
 shroud.4025.c.default: "Um espetáculo abominável!"
 shroud.4025.c.robot: "Isso não vai acabar bem."
 shroud.first_contact.end.a.tt.the_composer_of_strands: "Ganha §YSintonia§! com $the_composer_of_strands_color_article$.\n$shroud.first_contact.end.b.tt.the_composer_of_strands$"
 shroud.first_contact.end.b.tt.the_composer_of_strands: "Revela $the_composer_of_strands_color_article$ no §YVéu§!."
 shroud.first_contact.end.c.tt.the_composer_of_strands: "Perde uma quantidade significativa de §YSintonia§! com $the_composer_of_strands_color_article$.\n$shroud.first_contact.end.b.tt.the_composer_of_strands$"
 shroud.first_contact_insert.instrument: "um §Hpulso desenfreado§!"
 shroud.4035.title: "$the_instrument_of_desire_article_cap$ Emerge"
 shroud.4035.desc.all.start: "Após meses chamando em vão, o ente §H[Root.Patron:the_instrument_of_desire.GetPreCommunicationName]§! enfim emergiu das profundezas do §HVéu§!."
 shroud.4035.desc.default: "$shroud.4035.desc.all.start$\n\nA mensagem veio como um dilúvio. Pensamentos invadiram nossas mentes com força, apelando aos nossos desejos mais profundos. Palavras fluíam por nós com rapidez e abundância, sufocando qualquer coisa em nossas mentes. Era uma mensagem sedutora: uma visão de poder e indulgência.\n\n$shroud.4035.desc.default.end$"
 shroud.4035.desc.default.end: "A onda acalmou-se até se tornar um gotejamento. A presença não esperava uma resposta... ainda. No fim, fomos deixados com uma sede insaciável.\n\nAgora compreendemos melhor o que a entidade deseja. Conhecemos sua visão de riqueza sem limites. Assim que nossa equipe de [GetTelepathPlural] se recuperar, poderemos nos conectar e comungar com este ser, $the_instrument_of_desire_color_article$."
 shroud.4035.desc.hive: "$shroud.4035.desc.all.start$\n\nA mensagem veio como um dilúvio. Pensamentos invadiram nossas mentes com força, apelando aos nossos desejos mais profundos. Palavras fluíam por nós com rapidez e abundância, sufocando qualquer coisa em nossas mentes. Era uma mensagem revigorante: uma visão de produtividade ilimitada.\n\n$shroud.4035.desc.default.end$"
 shroud.4035.desc.gestalt_machine: "$shroud.4035.desc.all.start$\n\nA mensagem veio como um dilúvio. Os dados invadiram nossos circuitos com força, superando todos os registros anteriores. Um código exótico fluiu por nós, ágil e abundante, sufocando qualquer outra coisa em nossos sistemas. Era uma mensagem energizante: uma visão de produtividade ilimitada.\n\n$shroud.4035.desc.machine.end$"
 shroud.4035.desc.machine.end: "A onda acalmou-se até se tornar um gotejamento. A presença não esperava uma resposta... ainda. No fim, fomos deixados com um vazio fragmentado que anseia por comandos elegantes.\n\nAgora compreendemos melhor o que a entidade deseja. Conhecemos sua visão de riqueza sem limites. Assim que nossa equipe de [GetTelepathPlural] estiver recarregada, poderemos nos conectar e comungar com este ser, $the_instrument_of_desire_color_article$."
 shroud.4035.desc.individual_machine: "$shroud.4035.desc.all.start$\n\nA mensagem veio como um dilúvio. Pensamentos invadiram nossas mentes com força, apelando aos nossos desejos mais profundos. Palavras fluíam por nós com rapidez e abundância, sufocando qualquer coisa em nossas mentes. Era uma mensagem revigorante: uma visão de produtividade ilimitada.\n\n$shroud.4035.desc.machine.end$"
 shroud.4035.a.default: "É glorioso."
 shroud.4035.a.robot: "É notável."
 shroud.4035.b.default: "$shroud.first_contact.end.b$"
 shroud.4035.b.robot: "$shroud.first_contact.end.b$"
 shroud.4035.c.default: "Palavras vazias."
 shroud.4035.c.robot: "$shroud.4035.c.default$"
 shroud.first_contact.end.a.tt.the_instrument_of_desire: "Ganha §YSintonia§! com $the_instrument_of_desire_color_article$.\n$shroud.first_contact.end.b.tt.the_instrument_of_desire$"
 shroud.first_contact.end.b.tt.the_instrument_of_desire: "Revela $the_instrument_of_desire_color_article$ no §YVéu§!."
 shroud.first_contact.end.c.tt.the_instrument_of_desire: "Perde uma quantidade significativa de §YSintonia§! com $the_instrument_of_desire_color_article$.\n$shroud.first_contact.end.b.tt.the_instrument_of_desire$"
 shroud.4040.title: "$utopia.3300.name$"
 shroud.4040.desc: "Conhecemos muitas vozes dentro do §HVéu§!. Seus ecos são onipresentes e incontáveis. Após os estados de transe recentes, nossa equipe de [GetTelepathPlural] relatou a presença de uma entidade sem igual, um §Hzunido multifacetado§! que permeia o cerne do Véu.\n\nSe concentrarmos energia psiônica suficiente, poderemos tentar seguir o rastro psiônico deixado por essa entidade poderosa, conhecida por nossa equipe de [GetTelepathPlural] como §H[Root.Patron:whisperers_in_the_void.GetPreCommunicationName]§!."
 shroud.4040.a: "$utopia.2657.a$"
 shroud.4045.title: "$whisperers_in_the_void_article_cap$"
 shroud.4045.desc.intro: "Em nossos esforços para comungar com o ente §H[Root.Patron:whisperers_in_the_void.GetPreCommunicationName]§!, avançamos até as camadas mais profundas do Véu. Nesse domínio interno, o Véu gira sem se mover. Os reflexos de cada pensamento, de cada ciclo, convergem para uma força fundamental. Ouvimos as vozes dos que não têm voz, levadas por um turbilhão eterno: $whisperers_in_the_void_color_article$.\n\nUma distorção áspera nos cerca. Tentamos compreender as incontáveis mensagens, até que um único pensamento invade a mente de nossa equipe de [GetTelepathPlural].\n\n§HOuvir é um sacrifício.§!\n\nPara acessar esse imenso poder, devemos auxiliar a entidade a ocupar"
 shroud.4045.desc.covenant: "$shroud.4045.desc.intro$ o domínio de [GetCovenantPatronColor]. Tal ato substituiria por completo a presença de nossa entidade patronal, quebrando nosso Pacto estabelecido.$shroud.4045.desc.outro$"
 shroud.4045.desc.no_covenant: "$shroud.4045.desc.intro$ o domínio de outra entidade patronal, substituindo sua presença por completo.$shroud.4045.desc.outro$"
 shroud.4045.desc.outro: "\n\nIsso pode resultar em consequências significativas."
 shroud.4045.a: "Permitir a entrada dos Sussurradores."
 shroud.4045.a.covenant.tt: "§REncerra nosso Pacto com a entidade patronal [GetCovenantPatronColor].§!\nSubstitui totalmente o domínio de [GetCovenantPatronColor] pelo d$whisperers_in_the_void_color_article$.\n§RHaverá consequências.§!"
 shroud.4045.a.no_covenant.tt: "Escolheremos o domínio de uma $major_patron$ para ser substituído pelo d$whisperers_in_the_void_color_article$.\n§RHaverá consequências.§!"
 shroud.4045.b: "É melhor não perturbar o equilíbrio do Véu."
 shroud.4046.title: "Alterações no Véu"
 shroud.4046.desc.1: "Assim que a escolha foi feita, nossa equipe de [GetTelepathPlural] emergiu do §HVéu§!"
 shroud.4046.desc.2: "Suas mentes mergulhavam nos ecos de incontáveis vozes.\n\nNossa escolha alterou de forma irreversível a maneira como percebemos o reino psiônico. À medida que $whisperers_in_the_void_color_article$ penetram em nossas mentes, não conseguimos mais sentir [GetCovenantPatronColor] como antes. Não temos mais acesso ao seu domínio.\n\nEstamos lentamente compreendendo a vontade dos Sussurradores. Sentimos sua visão de conhecimento ilimitado. Assim que nossa equipe de [GetTelepathPlural]"
 shroud.4046.desc.3: "poderemos nos conectar e comungar com esta entidade multifacetada."
 shroud.4046.desc.robot: "$shroud.4046.desc.1$ em um despertar violento. $shroud.4046.desc.2$ se recuperar, $shroud.4046.desc.3$"
 shroud.4046.desc.organic: "$shroud.4046.desc.1$ em uma ativação violenta. $shroud.4046.desc.2$ estiver recarregada, $shroud.4046.desc.3$"
 shroud.whispers_in_the_shroud.title: "Sussurros no Véu"
 shroud.whispers_in_the_shroud.a: "$utopia.2657.a$"
 minor_patron_instrument_cradle_intro: "Estamos entre os domínios d$the_instrument_of_desire_article$ e d$the_cradle_of_souls_article$."
 minor_patron_cradle_composer_intro: "Estamos entre os domínios d$the_cradle_of_souls_article$ e d$the_composer_of_strands_article$."
 minor_patron_composer_eater_intro: "Estamos entre os domínios d$the_composer_of_strands_article$ e d$the_eater_of_worlds_article$."
 minor_patron_eater_instrument_intro: "Estamos entre os domínios d$the_eater_of_worlds_article$ e d$the_instrument_of_desire_article$."
 minor_patron_default_intro: "Estamos entre os domínios de grandes entidades do Véu."
 shroud.4050.desc: "[This.GetMinorPatronCradleComposerIntro]\n\nEm meio a uma galeria de constructos sem vida, detectamos uma §H$code_name_animator$§!, cuja vontade molda energias densas em formas novas e curiosas.\n\nAo interrompermos sua atividade, a entidade se aproxima, dispersando a névoa opaca do Véu. Ela oferece algo.\n\nO que acontecerá se aceitarmos?"
 shroud.4055.title: "$the_animator_of_clay_article_cap$ Emerge"
 shroud.4055.desc: "Assim que mergulhamos nossas mentes nas energias turbulentas do Véu, nossos [GetSpeciesBodyPlural] convulsionaram inexplicavelmente. Sentimos a §H$code_name_animator$§! nos dominar por um breve momento. Ela nos impelia a observar.\n\nA penumbra carregada se dissipou, revelando uma silhueta que gesticulava. Seus membros eram puxados bruscamente para os lados por cordões vaporosos, até que, subitamente, as amarras se desfizeram. A figura desabou.\n\nLentamente, começou a se mover outra vez. Membro por membro, ergueu-se livre das antigas amarras, e retomou sua dança hipnótica."
 shroud.4055.desc.know_animator: "Foi então que percebemos. Já havíamos encontrado esta entidade antes. $the_animator_of_clay_color_article_cap$ se deleitava. Onde quer que o inanimado ganhe consciência, ou onde a matéria bruta recebe alma, ele também estará presente."
 shroud.4055.a: "A marionete dança, livre de suas amarras."
 shroud.4060.desc: "[This.GetMinorPatronCradleComposerIntro]\n\nNão estamos sós. Uma §H$code_name_outsider$§! invade nossas mentes, causando uma tempestade de energia psiônica ao nosso redor.\n\nUm profundo sentimento de arrependimento e anseio surge em nossa psique coletiva. Vemos imagens de sistemas estelares familiares, mas como eram milênios no passado.\n\nSeja o que for essa entidade, ela parece conhecer bem nossa galáxia. Será que ela já esteve aqui?"
 shroud.4065.title: "$the_outsider_article_cap$ Emerge"
 shroud.4065.desc.intro: "A força distante conhecida como §H$code_name_outsider$§! cauterizou nossas mentes com angústia proveniente das profundezas do §HVéu§!. Ela não se pronunciou, mas seu aviso foi inconfundível:\n\n§HCaminhem com cautela por estes reinos. Vocês não fazem ideia dos poderes que estão perturbando. A ruína está a apenas um passo...§!"
 shroud.4065.desc.outro_default: "O que quer que isso signifique, agora conhecemos $the_outsider_color_article$. Resta descobrir como nossos destinos se cruzarão."
 shroud.4065.desc.outro_know_zroni: "Essa entidade já é conhecida em nossa galáxia. Sua assinatura mental é inconfundível, pertence à civilização Zroni, que já cruzou nosso caminho. Mas como isso é possível?\n\nO que quer que isso signifique, agora conhecemos $the_outsider_color_article$. Resta descobrir como nossos destinos se cruzarão."
 shroud.4065.desc.outro_left_zroni: "Reconhecemos essa entidade. É a Clarividente que encontramos além da §HFenda Astral§!. Seria esse o destino que lhe coube? Teria ela se tornado $the_outsider_color_article$?"
 shroud.4065.a.default: "Que horrores ela presenciou?"
 shroud.4065.a.know_zroni: "Os Zroni ainda vivem?"
 shroud.4065.a.left_zroni: "Que não compartilhemos do mesmo destino."
 shroud.4070.desc: "[This.GetMinorPatronComposerEaterIntro]\n\nUma massa instável de pensamentos circunda nossas mentes. Um peso abrasivo se espalha sobre nós, distorcendo nossa percepção do tempo. Cada grão de pensamento range contra a textura desse domínio recém-descoberto.\n\nQuando a sensação enfim cessa, o §H$code_name_tide$§! se dissipa, deixando impressões duradouras.\n\nEsses rastros permanecem diante de nós, convidando-nos a seguir em frente."
 shroud.4075.title: "$the_endless_tide_article_cap$ Emerge"
 shroud.4075.desc: "O §H$code_name_tide$§! foi revelado das profundezas do §HVéu§!. Amorfa e vasta, sua presença se estende além de todos os limites da nossa percepção.\n\nUm sussurro texturizado se derrama sobre nós, desenterrando histórias há muito esquecidas. Vemos impérios passados, esmagados pelo curso inevitável do tempo. Cada grão que nos toca carrega uma memória.\n\nDentro deste arquivo infinito, padrões emergem: ciclos de ambição e ruína, triunfo e decadência. Há sabedoria nessas profundezas.\n\n$the_endless_tide_color_article_cap$ se estende além do tempo, corroendo a ignorância e deixando para trás apenas aquilo que se recusa a desaparecer."
 shroud.4075.a: "Essa sabedoria agora nos pertence."
 shroud.4080.desc: "[This.GetMinorPatronComposerEaterIntro]\n\nA gravidade de nossas próprias ações nos arrasta mais fundo, seu peso nos conduzindo à sombra opressiva de uma forma montanhosa.\n\nDo alto de seus picos cinzentos, um olhar implacável perfura nossas mentes. Lutamos para compreender a escala da entidade diante de nós, §H$code_name_mountain$§!.\n\nO cume mais alto nos chama, desafiando-nos a escalá-lo."
 shroud.4085.title: "$the_pale_mountain_article_cap$ Emerge"
 shroud.4085.desc: "Subimos pelas alturas vertiginosas do §HVéu§! até alcançarmos o cume intangível. §H$code_name_mountain$§! nos testava, como fez com todos os outros que vieram antes.\n\nUm mausoléu colossal de impérios esquecidos entoa um coro ecoante de histórias perdidas. Cada camada de fracasso e ambição equivocada foi incorporada às fundações do que está por vir.\n\nTodavia, isto não é um túmulo parado no tempo; é um crisol. O ciclo de ruína e renovação reforja as falhas do passado nos alicerces de triunfos futuros. A destruição não é um fim, mas um novo começo.\n\n$the_pale_mountain_color_article_cap$ ergue-se em nossas mentes."
 shroud.4085.a: "A montanha crescerá."
 shroud.4090.desc: "[This.GetMinorPatronInstrumentCradleIntro]\n\nUm peso suave acalma nossos pensamentos, mergulhando-nos em uma névoa morosa e prazerosa. Tensões antes desconhecidas se dissolvem, substituídas por uma calma luxuriante e insidiosa.\n\nQuanto mais nos entregamos a esse abraço dourado, mais próximo chegamos do §H$code_name_dream$§!. Sua natureza avassaladora nos envolve, sussurrando promessas de um contentamento extravagante.\n\nSua indulgência indolente é curiosamente tentadora."
 shroud.4095.title: "$the_golden_dream_article_cap$ Emerge"
 shroud.4095.desc: "Enquanto nos acomodávamos em um bolsão de tranquilidade no §HVéu§!, fomos atraídos para os salões dourados do §H$code_name_dream$§!.\n\nTentações aveludadas atravessavam nossas mentes, enquanto uma tapeçaria esplendorosa se desenrolava diante de nós. A negligência indulgente ameaçava entorpecer nossos pensamentos diante de tanta opulência.\n\n$the_golden_dream_color_article_cap$ nos brinda com luxos além da imaginação."
 shroud.4095.a: "O sonho desperta."
 shroud.4100.desc: "[This.GetMinorPatronInstrumentCradleIntro]\n\nA turbulência caótica do Véu se transforma em um vórtice pulsante de energia psiônica. De repente, as correntes convergem e se alinham, pacificadas por uma força invisível. Tudo se aquieta e se transforma em novas formas plácidas.\n\nEnquanto observamos, sentimos a presença de uma §H$code_name_point$§! orquestrando esses movimentos, convertendo o caos em harmonia.\n\nSua tranquilidade nos atrai."
 shroud.4105.title: "$the_hollow_point_article_cap$ Emerge"
 shroud.4105.desc: "Nossa equipe de [GetTelepathPlural] tentou entrar agressivamente na desordem turbulenta do Véu, em vão. Apenas quando cessaram seus esforços, foram capazes de sentir o verdadeiro acolhimento da §H$code_name_point$§!.\n\nPassaram por nossas mentes visões de uma onda interminável de conflitos, cada um repleto de distrações caóticas e furiosas.\n\nEm meio a esse turbilhão, sentimos a presença vigilante e atemporal d$the_hollow_point_color_article$. Calmo e paciente, ele espera que a galáxia enfim encontre a paz."
 shroud.4105.desc.outro_homicidal: "Apesar de nossos instintos mais primitivos, nossas mentes foram expostas a uma forma curiosa de pensar."
 shroud.4105.a.default: "A paciência perdurará além da guerra."
 shroud.4105.a.homicidal: "Um sonho distante... Conhecemos o nosso verdadeiro propósito."
 shroud.4110.desc: "[This.GetMinorPatronEaterInstrumentIntro]\n\nO barulho caótico dá espaço a uma escuridão opressiva. Sentimos nossas intenções sendo analisadas e julgadas.\n\nA grande expectativa de ordem, inquestionável e imutável, penetra em nosso ser. §H$code_name_throne$§! avalia nossa vontade.\n\nApós seu julgamento, a escuridão recua. O escrutínio infeccioso força a nossa submissão."
 shroud.4115.title: "$the_vacant_throne_article_cap$ Emerge"
 shroud.4115.desc: "Ajoelhamo-nos diante d'§H$code_name_throne$§!.\n\nNossas mentes foram examinadas com a frieza indiferente de uma autoridade implacável, imobilizando-nos sob seu julgamento.\n\nO vácuo opressor d$the_vacant_throne_color_article$ não oferece misericórdia nem sofrimento. Ele exige apenas ordem e certeza, impondo-as onde quer que estejam ausentes.\n\nEsse fardo agora é parte de nós."
 shroud.4115.a: "O julgamento é constante."
 shroud.4120.desc: "[This.GetMinorPatronEaterInstrumentIntro]\n\nSomos tomados por uma sensação de aceleração repentina, e nossos sentidos são sobrecarregados por um fluxo incompreensível de informações. Somos lançados para fora em direção a horizontes infinitos.\n\nUma entidade move-se em sincronia conosco. Essa §H$code_name_river$§! paira por um instante, até que sua velocidade a leva além dos limites de nossa compreensão.\n\nPrecisamos segui-la."
 shroud.4125.title: "$the_black_river_article_cap$ Emerge"
 shroud.4125.desc: "Somente ao ultrapassarmos forçosamente os limites seguros do §HVéu§! é que conseguimos alcançar a §H$code_name_river$§!.\n\nFomos tomados por uma sensação de movimento em todas as direções, com uma velocidade absurda que desafia qualquer compreensão lógica. Ficamos com a impressão de ter percorrido uma imensa distância em apenas um instante.\n\nFinalmente compreendemos $the_black_river_color_article$ e sua jornada incessante. A vastidão da galáxia é um caminho livre a ser trilhado."
 shroud.4125.a: "A mais pura forma da velocidade."
 shroud.4135.title: "$end_of_the_cycle_article_cap$"
 shroud.4135.desc: "Sem nenhum aviso, somos tragados pelo Véu. Uma presença ameaçadora invade nossas mentes.\n\nÉ $end_of_the_cycle_color_article$, e ele sempre esteve à nossa espera. Nossa equipe de [GetTelepathPlural], ainda em transe, profere em perfeito uníssono: §R\"AINDA NÃO É A SUA HORA.\"§! Uma pausa. §R\"MAS PODERIA SER.§!\n\nNada mais é dito, mas uma barganha foi oferecida, sabemos disso. Poder, conhecimento e riquezas além da imaginação estão ao nosso alcance.\n\n§RSó precisamos trazer o Fim.§!"
 shroud.4135.a: "$utopia.3308.a$"
 shroud.4135.a.tt: "Substitui os domínios de todas as entidades patronais pelo$end_of_the_cycle_color_article$.\nNós teremos ao menos 50 anos para consumir a galáxia com a §H$end_aura$§!. Se conseguirmos, o jogo terminará.\n$covenant.cycle.tooltip$$shroud.8450.a.tech_tooltip$\n$shroud.4135.psionic_components_insight$\n\nReverte todos os Acordos de todos os outros Patronos\n$eotc_opinion_modifier_tooltip$"
 shroud.4135.b: "Sair do Véu e tentar esquecer."
 shroud.4135.b.forging_our_own_path: "Nosso caminho foi determinado. Seguiremos sozinhos."
 shroud.4135.psionic_components_insight: "Progresso de tecnologia obtido em todos os ['concept_psionic_components']: §G+10%§!"
 concept_psionic_components: "Componentes Psiônicos"
 concept_psionic_components_desc: "$tech_psionic_bombers$\n$tech_psionic_lightning$\n$tech_psionic_disruptor$\n$tech_zro_launcher$\n$tech_psionic_shield$\n$tech_precognition_interface$\n$tech_psi_jump_drives$"
 triggered_opinion_eotc_situation_stage1: "Conjuração do Fim"
 shroud.4140.title: "Tudo ou Nada"
 shroud.4140.desc: "Nosso destino está conectado com $end_of_the_cycle_color_article$; sempre que sua Aura floresce, também cresce a nossa população. Logo, chegamos a uma conclusão simples: qualquer coisa que impeça a Aura também impede [This.GetName] e, portanto, deve ser eliminada.\n\nSe quisermos, poderemos abandonar qualquer limite em nossos objetivos militares e conquistar nossos inimigos sem piedade. Nada deverá ficar no caminho da supremacia do Fim."
 shroud.4140.a: "Que o destino seja cumprido."
 shroud.4140.a.tooltip: "Obtém acesso ao §HCasus Belli§! ['concept_total_war']\n$eotc_opinion_modifier_2_tooltip$"
 triggered_opinion_eotc_situation_stage2: "Arautos do Fim"
 shroud.4145.title: "Aniquilação"
 shroud.4145.desc_1.common_1: "Conforme a §R$end_aura$§! permeia a galáxia, sentimos uma resistência crescente."
 shroud.4145.desc_1.common_2: "Mas isso não importa. Não esperaremos até que outros aceitem $end_of_the_cycle_color_article$."
 shroud.4145.desc_1.default: "$shroud.4145.desc_1.common_1$ Nossos vizinhos distantes estão rapidamente se voltando contra nós. $shroud.4145.desc_1.common_2$"
 shroud.4145.desc_1.homicidal: "$shroud.4145.desc_1.common_1$ A aversão de nossos inimigos vem se tornando cada vez mais enraizada. $shroud.4145.desc_1.common_2$"
 shroud.4145.desc_2: "Inspirados pela vontade de nosso patrono, criamos novos métodos de explorar energia e matéria para alimentar a Aura. A própria composição do universo poderá ser sacrificada para antecipar o Fim."
 shroud.4145.a: "Devemos fazer o que for necessário."
 shroud.4145.a.tooltip: "$eotc_opinion_modifier_3_tooltip$\nLibera os Editos:\n$t$- ['edict:annihilation_of_matter', $edict_annihilation_of_matter$]\n$t$- ['edict:annihilation_of_energy', $edict_annihilation_of_energy$][GetDimensionalCollapseEdictGain]"
 shroud.4145.dimensional_collapse: "\n$t$- ['edict:dimensional_collapse', $edict_dimensional_collapse$]"
 triggered_opinion_eotc_situation_stage3: "$triggered_opinion_eotc_situation_stage2$"
 shroud.4150.title: "A Chegada do Fim"
 shroud.4150.desc: "Nosso patrono fala silenciosamente. Conforme sentimos a iminência do fim do ciclo, uma energia renovada pulsa por [This.GetName]. Somos revigorados pela urgência.\n\nSe quisermos satisfazer a vontade do Fim, a energia coletiva de todos os [this.GetSpeciesNamePlural] deverá ser direcionada para esse único propósito. Devemos manifestar o poder de nosso patrono e completar a expansão da Aura para os recantos mais longínquos da galáxia."
 shroud.4150.a: "Chegou a nossa hora."
