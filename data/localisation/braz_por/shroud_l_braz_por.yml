 shroud.4970.desc.2: "Todos os seres conscientes, vivos ou mecânicos, foram erradicados. Todos os planetas tornaram-se uma carcaça desolada. Até mesmo as estrelas emitiram sua última luz.\n\nApesar disso, em nossos momentos finais, tudo o que conseguimos perceber foi uma voz em nossas mentes...\n\n§R\"O FIM DERRADEIRO.\"§!"
