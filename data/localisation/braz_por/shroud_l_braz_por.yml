 shroud.3.diplo_title: "$utopia.3000.name$"
 shroud.10.name: "Uma Aliança contra a Rainha"
 shroud.10.desc.intro: "O Véu reverbera com uma ferocidade sem precedentes. Enormes espirais de energia se contorcem e se agitam pelo éter.\n\nEm meio ao caos pulsante, ressoam ecos psiônicos da Rainha Sintética. Infinita e onipotente, ela brinca com a galáxia na palma da mão."
 shroud.10.desc.outro: "Mas por quê? Teria ciência de uma fraqueza que desconhecemos? Será que nos ajudará se pedirmos?\n\nAo concentrarmos nossas mentes no Animador, sentimos sua impaciência. É provável que tenhamos apenas uma chance de pedir seu auxílio. Serão necessárias enormes quantidades de §HEnergia§! e §H$sr_zro$§! para esse esforço."
 shroud.10.desc: "$shroud.10.desc.intro$\n\nNão somos os únicos a observá-la. De um ponto oculto, a entidade conhecida como $the_animator_of_clay_color_article$ contempla atentamente, impassível diante do poder ilimitado da rainha.\n\n$shroud.10.desc.outro$"
 shroud.10.desc.1: "$shroud.10.desc.intro$\n\nNão somos os únicos a observá-la. De um ponto oculto, $the_animator_of_clay_color_article$ contempla atentamente, impassível diante do poder ilimitado da rainha.\n\n$shroud.10.desc.outro$"
