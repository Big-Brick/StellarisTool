 tech_covenant_cradle: "$CRADLE_MARK$"
 tech_covenant_cradle_desc: "$tech_covenant_composer_desc$"
 leader_trait_cradle_chosen: "Escolhido do Berço"
 leader_trait_cradle_chosen_desc: "$leader_trait_whisperers_chosen_desc$"
 leader_trait_shroudshaper: "Modelador do Véu"
 leader_trait_shroudshaper_desc: "Este líder é um ser imortal que possui um poder psiônico incrível, moldando o Véu de acordo com nossa vontade."
 COVENANT_EFFECTS: "§EEfeitos do Pacto:§!"
 COVENANT_EATER: "§HPacto da Comedora§!"
 covenant_eater_desc: "Nosso Pacto com $the_eater_of_worlds_article$ desperta em nós um apetite voraz por conquista e destruição."
 COVENANT_CRADLE: "§HPacto do Berço§!"
 covenant_cradle_desc: "Nosso Pacto com $the_cradle_of_souls_article$ irradia pela galáxia, influenciando os outros a nos tratar com cordialidade."
 covenant_cradle_tt: "[GetCradleCovenantTooltip]"
 covenant_cradle_bonus_tt: "$covenant_cradle_telepath_tt$\n$covenant_cradle_no_bonus_tt$"
 covenant_cradle_no_bonus_tt: "Manutenção de Empregos quando um império dentro de nossa §H$PSIONIC_AURA$§! tem opinião abaixo de Neutra: §R+[GetCradleCovenantUpkeepMult]%§!"
 COVENANT_INSTRUMENT: "§HPacto do Instrumento§!"
 covenant_instrument_desc: "Nosso Pacto com $the_instrument_of_desire_article$ satura nossas mentes com visões de indulgência, nos atraindo cada vez mais para um paraíso mental."
 COVENANT_COMPOSER: "§HPacto da Compositora§!"
 covenant_composer_desc: "Nosso Pacto com $the_composer_of_strands_article$ floresce dentro de nós, espalhando nossas raízes para transformar a galáxia."
 COVENANT_WITV: "§HPacto dos Sussurradores§!"
 covenant_whisperers_desc: "Nosso Pacto com $whisperers_in_the_void_article$ nos preenche com a sabedoria acumulada de segredos obtidos nos domínios mais profundos do Véu."
 COVENANT_EOTC: "§HPacto d'$NAME_The_End$§!"
