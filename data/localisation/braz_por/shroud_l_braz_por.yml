 #==========================
 # Entropy Drinkers
 civic_tooltip_not_entropy_drinkers: "NÃO possui o Componente Cívico ['concept_entropy_drinkers_civics']"
 civic_entropy_drinkers: "Sugadores de Entropia"
 civic_entropy_drinkers_desc: "$civic_ap_blockade_tt$\n\nEsta sociedade drena metabolismo valioso da população ociosa por meio de conexões psíquicas parasitárias. Uma vez coletada, essa energia poderá ser redistribuída às classes mais importantes."
 civic_entropy_drinkers_effects: "Habilita os seguintes §H$EDICTS$§!:$TABBED_NEW_LINE$- ['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$- ['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$- ['edict:psychic_feast',$edict_psychic_feast$]\nPode construir: £building£['building:building_lifecrypt_1'].\nLíderes começam com a característica ['concept_leader_trait_psionic']."
 civic_entropy_drinkers_machine: "Extratores de Energia"
 civic_entropy_drinkers_machine_desc: "$civic_ap_blockade_tt$\n\nA alocação adequada de energia é essencial para garantir a máxima eficiência da grande máquina. Todas as unidades são projetadas com esse propósito em mente, permitindo uma sobrecarga periódica dos nódulos críticos quando necessário."
 civic_entropy_drinkers_machine_effects: "Habilita os seguintes §H$EDICTS$§!:$TABBED_NEW_LINE$- ['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$- ['edict:sanguine_council_machine',$edict_sanguine_council_machine$]$TABBED_NEW_LINE$- ['edict:psychic_feast',$edict_psychic_feast$]\nPode construir: £building£['building:building_lifecrypt_machine_1'].\nLíderes começam com a característica ['concept_leader_trait_psionic']."
 civic_entropy_drinkers_machine_modifier: "- $mod_country_base_energy_produces_mult$ de £pop£ Pops: §G+0.1%§!"
 civic_entropy_drinkers_hive_mind: "Casta Parasitária"
 civic_entropy_drinkers_hive_mind_desc: "$civic_ap_blockade_tt$\n\nEste coletivo reaproveita o metabolismo valioso de drones inferiores por meio de conexões psíquicas parasitárias. Uma vez coletada, essa energia poderá ser redistribuída às castas mais importantes."
 civic_entropy_drinkers_hive_mind_effects: "Habilita os seguintes §H$EDICTS$§!:$TABBED_NEW_LINE$- ['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$- ['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$- ['edict:psychic_feast',$edict_psychic_feast$]\nPode construir: £building£['building:building_lifecrypt_hive_mind_1'].\nLíderes começam com a característica ['concept_leader_trait_psionic']."
 civic_entropy_drinkers_hive_mind_modifier: "$civic_entropy_drinkers_machine_modifier$"
 civic_entropy_drinkers_corporate: "Vampiros Corporativos"
 civic_entropy_drinkers_corporate_desc: "$civic_ap_blockade_tt$\n\nEsta $gov_megacorporation$ drena metabolismo valioso da população ociosa por meio de conexões psíquicas parasitárias. Uma vez coletada, essa energia poderá ser redistribuída para o gerenciamento sênior."
 civic_entropy_drinkers_corporate_effects: "Habilita os seguintes §H$EDICTS$§!:$TABBED_NEW_LINE$- ['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$- ['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$- ['edict:psychic_feast',$edict_psychic_feast$]\nPode construir: £building£['building:building_lifecrypt_corporate_1'].\nLíderes começam com a característica ['concept_leader_trait_psionic'].\nO £building£ §Y$building_executive_retreat$§! $megacorp_civic_branch_office_building_effect$"
 # Superstitious Beliefs
 civic_tooltip_not_superstitious_beliefs: "NÃO possui o Componente Cívico ['concept_superstitious_beliefs_civics']"
 civic_superstitious_beliefs_desc_common: "Cerimônias apropriadas devem ser realizadas antes de cada grande decisão, possibilitando a harmonia com as forças invisíveis que moldam o destino."
 civic_superstitious_beliefs_common_effects: "Habilita ['edict:galactic_dowsing',$edict_galactic_dowsing$]\nA cada 13 anos, o ['concept_sb_cycle'] muda.\nEventos de Sorte irão beneficiar ou prejudicar o seu império."
 civic_superstitious_beliefs: "Crenças Supersticiosas"
 civic_superstitious_beliefs_desc: "Esta sociedade afirma ter descoberto um mecanismo ritualístico para prever o futuro, utilizando reconhecimento de padrões esotéricos e análise de anomalias cíclicas. $civic_superstitious_beliefs_desc_common$"
 civic_superstitious_beliefs_effects: "Substitui:\n$t$- £job_priest£ $job_priest_plural$ por £job_superstitious_beliefs_priest£ $job_superstitious_beliefs_priest_plural$\n$t$- £job_high_priest£ $job_high_priest_plural$ por £job_superstitious_beliefs_high_priest£ $job_superstitious_beliefs_high_priest_plural$\n$civic_superstitious_beliefs_common_effects$"
 civic_machine_superstitious_beliefs: "Decifradores de Padrões"
 civic_machine_superstitious_beliefs_desc: "Este império maquinário afirma ser capaz de resolver o desconhecido, utilizando reconhecimento de padrões esotéricos e análise de anomalias cíclicas. Alinhamentos celestes são estudados antes de cada grande decisão para assegurar o melhor resultado previsto possível."
 civic_machine_superstitious_beliefs_effects: "$civic_superstitious_beliefs_common_effects$"
 civic_hive_superstitious_beliefs: "Nexus do Zodíaco"
 civic_hive_superstitious_beliefs_desc: "Este coletivo afirma ter descoberto um mecanismo ritualístico para prever o futuro, utilizando reconhecimento de padrões esotéricos e análise de anomalias cíclicas. $civic_superstitious_beliefs_desc_common$"
 civic_hive_superstitious_beliefs_effects: "$civic_superstitious_beliefs_common_effects$"
 civic_corporate_superstitious_beliefs: "Empreendimento de Sorte"
 civic_corporate_superstitious_beliefs_desc: "Esta corporação afirma ter descoberto um mecanismo ritualístico para prever o futuro, utilizando reconhecimento de padrões esotéricos e análise de anomalias cíclicas. Para maximizar os resultados, ganhos e perdas futuras são avaliados em conjunto com os indicadores-chave de desempenho dos alinhamentos celestes ideais."
 civic_corporate_superstitious_beliefs_effects: "Substitui:\n$t$- £job_priest£ $job_priest_plural$ por £job_superstitious_beliefs_priest_corporate£ $job_superstitious_beliefs_priest_corporate_plural$\n$t$- £job_high_priest£ $job_high_priest_plural$ por £job_superstitious_beliefs_high_priest_corporate£ $job_superstitious_beliefs_high_priest_corporate_plural$\n$civic_superstitious_beliefs_common_effects$"
 # Twisted Experimenters
 civic_twisted_experimenters: "Sentença Experimental"
 civic_twisted_experimenters_desc: "Nesta sociedade, o processo judicial e a busca pelo conhecimento caminham lado a lado. Em sigilo absoluto, pesquisadores conduzem experimentos cruéis em cobaias retiradas do submundo do crime. Fatalidades ocasionais são consideradas o preço do progresso."
 civic_twisted_experimenters_effects: "Começa com a situação ['concept_experimental_testing'], que concede conhecimento de tecnologia ao ser concluída.\nPode construir e já inicia com: £building£['building:building_experimentation_chambers_1'].\nTodos os escravos não Maquinários ganham acesso ao emprego de escravo ['concept_slave_orderly'].\nAcesso ao ['concept_slave_army']: §Y$abomination_army$§!"
 civic_twisted_experimenters_hive_mind: "Consciência Corretiva"
 civic_twisted_experimenters_hive_mind_desc: "Desviantes deste coletivo são usados como cobaias em pesquisas científicas inéditas, sem qualquer restrição de métodos. Isso permite que drones problemáticos ainda tenham algum valor como ativos descartáveis."
 civic_twisted_experimenters_hive_mind_effects: "Começa com a situação ['concept_experimental_testing_hive_mind'], que concede conhecimento de tecnologia ao ser concluída.\nPode construir e já inicia com: £building£['building:building_experimentation_chambers_1']."
 civic_twisted_experimenters_corporate: "P&D Judicial"
 civic_twisted_experimenters_corporate_desc: "Esta $gov_megacorporation$ implementou uma iniciativa inovadora para reduzir ineficiências judiciais enquanto maximiza a inovação científica. Cidadãos problemáticos são realocados para projetos de pesquisa experimentais, passando por testes rigorosos em nome do progresso tecnológico. As taxas de fatalidade permanecem dentro dos parâmetros previstos."
 civic_twisted_experimenters_corporate_effects: "Começa com a situação ['concept_experimental_testing_corporate'], que concede conhecimento de tecnologia ao ser concluída.\nPode construir e já inicia com: £building£['building:building_experimentation_chambers_1'].\nPode construir o $BRANCH_OFFICE_BUILDING$ £building£ ['concept_building_carceral_test_facility'].\nTodos os escravos não Maquinários ganham acesso ao emprego de escravo.\nAcesso ao ['concept_slave_army']: §Y$abomination_army$§!"
 experimenters_we_will_learn_1: "Vamos aprender muito com isso."
 experimenters_we_will_learn_2: "Uma nova forma de experimentação."
 experimenters_we_will_learn_3: "Novos parâmetros de teste. Fascinante."
 experimenters_tragic_lesson_1: "Vamos aprender muito com essa tragédia."
 experimenters_tragic_lesson_2: "É uma tragédia... mas também uma oportunidade para novos experimentos."
 experimenters_tragic_lesson_3: "Uma lição trágica, mas os dados serão valiosos."
 experimenters_ermerging_crime_1: "Um ambiente assim oferece às nossas equipes de [GetExperimentalEngineerPlural] amplas oportunidades para novos experimentos."
 experimenters_ermerging_crime_2: "No mínimo, tais atos criminosos nos concedem amplas oportunidades para explorar novas e empolgantes frentes de pesquisa científica."
 experimenters_ermerging_crime_3: "Essas condições emergentes nos proporcionarão uma série de novas oportunidades de experimentação."
 experimenters_ermerging_crime_4: "Ambientes como esse são uma excelente fonte de cobaias para nossas equipes de [GetExperimentalEngineerPlural]."
 # Secret Societies
 civic_tooltip_not_secret_societies: "NÃO possui um Componente Cívico de ['concept_secret_societies_civics']"
 civic_secret_societies: "Sociedades Secretas"
 civic_secret_societies_desc: "Um grupo de figuras secretas e influentes tece intrincadas tramas políticas nos bastidores desta sociedade, mesclando assuntos internos com questões de outros mundos."
 civic_secret_societies_effects: "['concept_ss_factions'] clandestinas surgirão após o contato com outros impérios.\nComeça com a habilidade de conduzir ['concept_proxy_wars'].\n$job_bureaucrat_plural_with_icon$ produzirão $i_unity$ a cada §YGuerra por Procuração§! ativa e bem-sucedida.\nComeça em ['concept_first_contact'] com dois impérios vizinhos.\n$INFILTRATION_LEVEL$ ganho em impérios depois do §Y$first_contact$§!: §G+$@secret_society_infiltration_gain|0$§!"
 civic_secret_societies_corporate: "Cartel Influente"
 civic_secret_societies_corporate_desc: "Os escritórios mais poderosos desta $gov_megacorporation$ conduzem operações extraplanetárias, revelando apenas o necessário. Se você precisa perguntar, então não é da sua conta."
 civic_secret_societies_corporate_effects: "['Concept_ss_factions'] clandestinas surgirão após o contato com outros impérios.\nComeça com a habilidade de conduzir ['concept_proxy_wars'].\n$job_bureaucrat_plural_with_icon$ produzirão $i_unity$ a cada §YGuerra por Procuração§! ativa e bem-sucedida.\nComeça em ['concept_first_contact'] com dois impérios vizinhos.\n$INFILTRATION_LEVEL$ ganho em impérios depois do §Y$first_contact$§!: §G+$@secret_society_infiltration_gain|0$§!\nA £building£ §Y$building_corporate_embassy$§! $megacorp_civic_branch_office_building_effect$"
 shroud.5012.title: "Surgimento de Sociedades Secretas"
 shroud.5012.desc: "Nossas suspeitas foram justificadas. Os governos [first_neighbor.GetAdjective] e [second_neighbor.GetAdjective] confirmaram que foram contactados através de canais não oficiais antes que as comunicações formais se iniciassem.\n\nEssas §HFacções§! agora surgem de nossas próprias sombras e revelam sua existência. Conhecidas como §H$pft_the_curtain$§!, §H$pft_the_masquerade$§! e §H$pft_the_grand_dance$§!, essas organizações uma vez secretas agora pedem abertamente um diálogo formal conosco.\n\nO que querem, e como elas sabem o que sabem, talvez nunca venhamos a entender. Pode ser de nosso interesse operar de acordo com suas exigências."
 shroud.5012.a: "E assim a dança começa..."
 shroud.5012.tt: "§YFacções de Sociedades Secretas§! surgirão em breve:\n$t$§H$pft_the_curtain$§!\n$t$§H$pft_the_masquerade$§!\n$t$§H$pft_the_grand_dance$§!"
 shroud.5013.title: "Contatos Estranhos"
 shroud.5013.desc: "Existem aqueles entre nós que operam nas sombras da diplomacia. Suspeitamos que seu alcance não está limitado ao nosso mundo natal.\n\nApesar de termos acabado de nos aventurar pelas estrelas, estabelecemos contato com outras formas de vida muito facilmente. Isso parece mais do que uma mera coincidência. Suspeitamos que essas relações interestelares sejam fruto das ações de §HFacções§! secretas que já estão profundamente infiltradas em nossa sociedade.\n\nTalvez, quando aprendermos mais sobre esses seres, aqueles que vivem nas nossas sombras se revelarão."
 shroud.5013.a: "Eles estão conosco ou contra nós?"
