 SHROUD_SHAPING_PROJECT: "Moldando o Véu"
 SHROUD_SHAPING_PROJECT_DESC: "Incontáveis entidades habitam o §HVéu§!, e cada uma concentra imenso poder. Elas exigem um vínculo irreversível antes de concederem suas maiores bênçãos.\n\nNo entanto, vislumbramos um caminho alternativo. Nossa equipe psiônica de [GetResearchers] acredita ser possível canalizar pequenas quantidades de energia de cada entidade e moldar o Véu à nossa própria vontade, sem vincular nossa psique a uma única Entidade Patronal."
 EXPLORE_BORDER_SYSTEM: "Explorando [exiled_system_border.GetName]"
 EXPLORE_BORDER_SYSTEM_DESC: "Imagens de longa distância mostram uma explosão recente de estranhos fluxos de energia no sistema §H[exiled_system_border.GetName]§!, que se correlaciona com leituras irregulares produzidas por nossa $building_ancient_ward_1$ em [Owner.GetHomeWorldName].\n\nSe quisermos compreender esse fenômeno, precisaremos explorar [exiled_system_border.GetName]."
