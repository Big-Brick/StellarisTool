 shroud.3000.title: "Impressões Efêmeras"
 shroud.3000.desc: "Na escuridão turbulenta, sombras distantes tomam formas efêmeras antes de se dissiparem no nada... Uma cacofonia obscura de vozes grita de forma ininteligível... Luzes piscam e se apagam. Pontos de calor crescem e se retraem.\n\nHá movimento. Algo gira. Nós ou o próprio Véu?\n\nUma presença se aproxima, vinda de todas as direções. E então, uma voz reverbera.\n\n§HO QUE VOCÊ VÊ?§!"
 shroud.3000.a: "Vemos um mundo em chamas."
 shroud.3000.a.reply: "Uma mudança de pressão. A voz retorna...\n\n§HÓTIMO.§!\n\nAs trevas se inclinam, depois giram. Algo nos comprime com força por um instante e então, de repente, estamos sós outra vez."
 shroud.3000.b: "Vemos uma celebração."
 shroud.3000.b.reply: "Algo pesado estremece. A escuridão nos comprime lentamente, com mais força, mais pressão...\n\n§HNÃO!§!\n\nO vazio se inclina, depois gira. De repente, estamos sós outra vez."
 shroud.3000.c: "Não temos certeza."
 shroud.3000.c.reply: "§HFRAQUEZA!§!\n\nO vazio se inclina, depois gira. De repente, estamos sós outra vez."
 shroud.3005.title: "Fome Salivante"
 shroud.3005.desc: "O fedor pútrido de vísceras fustiga nossos sentidos.\n\nImagens contorcidas se formam nas profundezas do Véu, rugindo com uma fúria voraz. Os uivos bestiais de feras famintas ecoam primeiro... Sentimos sua fome. Então, suas bocas salivantes tornam-se as nossas.\n\nSilhuetas surgem diante de nós. Gado em pânico. Presas. Tão próximas... A ânsia se torna insuportável.\n\nOs sentidos se distorcem, pressionando até que a fome devore o pensamento. Os gritos partem das presas... ou de dentro de nós mesmos?\n\nOs grilhões que nos prendem se apertam. Racham. Uma vez serpenteia pelo tormento e grita:\n\n§HQUEBREM AS CORRENTES! DELEITEM-SE!§!"
 shroud.3005.a: "Quebrar as correntes. Consumir a presa."
 shroud.3005.a.boons.tt: "Ganha um $shroud_boon$ aleatório com foco em combate."
 shroud.3005.a.reply: "Nossas amarras se rompem.\n\nVorazes. Libertos.\n\nTerror!\n\n§HALIMENTEM-SE.§!"
 shroud.3005.b: "Resistir à fome. Acalmar a mente."
 shroud.3005.b.reply: "As correntes permanecem firmes. A voz fervilha de raiva enquanto filtramos sua influência, acalmando a mente e retomando o controle.\n\n§HFRACOS! INÚTEIS!§!\n\nA fome se esvai, deixando apenas o gosto amargo do ressentimento que se dissipa dentro do Véu."
 shroud.3010.title: "Banquete Sacrificial"
 shroud.3010.desc: "Das profundezas do abismo, uma voz nos chama... retumbante, áspera e impregnada de malícia...\n\n§HALIMENTE-SEM. CONSUMAM. DEVOREM.§!\n\nVisões irrompem em nossa mente. Mundos viram cinzas. Os lamentos de [Root.GetCitizenPlural] silenciam enquanto suas formas físicas são consumidas pela energia psiônica, saciando as vozes... e a nossa... fome.\n\nEnquanto essas visões surgem, sentimos outra presença, nos incentivando a demonstrar autocontrole e solidariedade com [Root.GetCitizenPlural] semelhantes, encorajando o crescimento mútuo. Mas é sufocada sob um grito ensurdecedor."
 shroud.3010.desc.organic: "§HOFEREÇAM-ME A CARNE DELES!§!"
 shroud.3010.desc.other: "§HOFEREÇAM-ME OS CORPOS DELES!§!"
 shroud.3010.a: "Consumir."
 shroud.3010.a.reply: "Os gritos dos devorados ecoam tanto pelo Véu quanto pelo império, antes de cessarem abruptamente.\n\nCom esse sacrifício, nosso poder cresce conforme a fome é aplacada."
 shroud.3010.b: "Unir."
 shroud.3010.b.reply: "Silenciamos a voz e estendemos nossa consciência em união pelo Véu, envolvendo todo o império. Um suspiro coletivo de alívio e conforto abafa os gritos de fúria à medida que a fome se dissipa."
 shroud.3015.title: "Visões Transitórias"
 shroud.3015.desc: "Correntes intensas de energia psiônica colidem nas trevas ao redor. Sombras correm e desabam ao nosso redor... Uma luz cintilante pulsa adiante.\n\nPor um breve instante, uma visão se revela. Suas formas recuam antes que possamos compreendê-las.\n\nUma presença estranha nos envolve.\n\n§HO QUE VOCÊ VIU?§!"
 shroud.3015.a: "Vimos uma floresta, rica em formas de vida."
 shroud.3015.a.reply: "O silêncio cresce. A voz retorna...\n\n§HEXCELENTE.§!\n\nUm calor intenso arde dentro de nós, depois se dissipa. A presença se foi."
 shroud.3015.b: "Vimos uma terra devastada, privada de todos os seus recursos."
 shroud.3015.b.reply: "A voz retorna...\n\n§HJAMAIS!§!\n\nUm frio glacial toma conta de nós e, de repente, se dissipa. A presença se foi."
 shroud.3015.c: "Não temos certeza."
 shroud.3015.c.reply: "A voz retorna...\n\n§HQUE DESINTERESSANTE.§!\n\nUma sensação avassaladora de vazio nos consome, mas logo desaparece. A presença se foi."
 shroud.3020.title: "Conservação Tentadora"
 shroud.3020.desc: "Das muitas camadas do Véu, uma visão se revela.\n\nA névoa forma o contorno de uma criatura em agonia, sufocando enquanto tentáculos turvos apertam cada vez mais sua forma.\n\nO animal, por si só, é diferente de tudo o que já encontramos.\n\nUma voz ecoa dentro de nós.\n\n§HOS FIOS DO DESTINO CHAMAM! QUAL DELES VOCÊ IRÁ PUXAR?§!"
 shroud.3020.a: "Liberar a criatura."
 shroud.3020.a.reply: "A voz ecoa em nossas [GetMindLoc] enquanto a criatura desaparece de vista.\n\n§HPROSPERIDADE.§!\n\nOutro vislumbre surge: um ressurgimento da vida, em algum lugar de nosso império."
 shroud.3020.b: "Capturar a criatura."
 shroud.3020.b.reply: "A voz se extingue, deixando para trás apenas um grito que reverbera entre visões de um mundo árido.\n\n§HPESTILÊNCIA.§!"
 shroud.3020.c: "Matar a criatura."
 shroud.3020.c.swarm: "Consumir a criatura."
 shroud.3020.c.reply: "A voz é expulsa de nossos pensamentos quando um impulso avassalador toma conta. Uma sede de sangue inunda nossas [GetMindLoc] enquanto uma risada brutal ecoa pelo vazio.\n\n§HÉ CLARO! UMA PRESA FÁCIL!§!"
 shroud.3025.title: "Paisagens em Mutação"
 shroud.3025.desc: "As névoas do Véu se desfazem, revelando visões que se entrelaçam sem fim.\n\nPaisagens obscuras se contorcem de maneira incompreensível diante de nós. Montanhas surgem e desmoronam. Oceanos ferventes de caos evaporam, deixando para trás os ossos esbranquiçados de seres aquáticos espalhados por desertos intermináveis.\n\nSob as copas das florestas, criaturas dóceis percorrem seus habitats até começarem a convulsionar, se transformando em monstruosidades sedentas por sangue. Elas se destroem em um ciclo eterno de morte e renascimento.\n\nEm meio ao caos, uma voz atravessa nossas [GetMindLoc].\n\n§HTAMANHA DESORDEM. EMARANHADA EM SI MESMA.§!"
 shroud.3025.a: "Submeter a natureza à nossa vontade."
 shroud.3025.a.reply: "Estendemos a mão, agarrando o caos diante de nós.\n\nFixamos marcos, forçando continentes a se assentarem.\n\nConforme as peças se encaixam, a voz ecoa.\n\n§HUNIFORMIDADE, MONOTONIA, VAZIO...§!"
 shroud.3025.b: "Permitir que a desordem da natureza floresça."
 shroud.3025.b.reply: "Deixamos as visões continuarem. Um ciclo eterno que se embaralha antes de explodir e cessar tão rapidamente quanto começou.\n\nEnergias percorrem a vastidão infinita, antes de tomar novas formas.\n\nA voz ecoa.\n\n§HCONFLITO PACÍFICO. UNIDADE CAÓTICA.§!"
 shroud.3025.b.reply.tt: "Este planeta ganha um §GModificador Positivo§! e um §RModificador Negativo§! aleatórios."
 shroud.3030.title: "Prisma na Escuridão"
 shroud.3030.desc: "A agitação incessante do Véu se dissipa, revelando uma longa faixa de areia negra. O som das ondas quebrando pode ser ouvido, mas não conseguimos vê-las.\n\nÀ frente, ou talvez atrás, um prisma aparece. Um único feixe de luz o atinge, refratando momentaneamente para formar uma imagem turva.\n\nIncontáveis figuras sombrias e formas mutáveis surgem, apenas para desaparecerem novamente nas trevas.\n\nNa areia próxima, uma presença se instala.\n\n§HO QUE FOI REVELADO FOI COMPREENDIDO, NÃO FOI?§!"
 shroud.3030.a: "Vimos uma conferência de muitas vozes."
 shroud.3030.a.reply: "A areia se move lentamente. A voz retorna.\n\n§HBOM. A HARMONIA É O CAMINHO DO UNIVERSO.§!\n\nSentimos algo pesado se dissipar. Estamos sozinhos novamente."
 shroud.3030.b: "Vimos a carnificina da batalha."
 shroud.3030.b.reply: "A areia gira repentinamente com a força de uma tempestade.\n\n§HNÃO. QUE AS ARMAS ENFERRUJEM E CAIAM NO ESQUECIMENTO!§!\n\nA tempestade de areia se dissipa. A voz partiu."
 shroud.3030.c: "Não temos certeza."
 shroud.3030.c.reply: "A areia se move lentamente.\n\n§HA HESITAÇÃO GERA O FRACASSO...§!\n\nEstamos sozinhos novamente."
 shroud.3035.title: "Conflito Sombrio"
 shroud.3035.desc: "As energias caóticas do Véu se contorcem e irrompem.\n\nGavinhas de escuridão atacam e se recolhem, a névoa voltando-se violentamente contra si mesma. Em meio a essa tempestade de fúria psiônica, duas entidades sem forma entram em embate. Elas são impiedosas, irredutíveis e banhadas pelo ódio.\n\nUma presença externa se esgueira para dentro de nossas [GetMindPhysicalLoc], invasiva e vasta.\n\n§HAQUELES QUE ENTRAM DEVEM TRAZER UMA RESOLUÇÃO.§!"
 shroud.3035.a: "O diálogo promove o entendimento."
 shroud.3035.a.reply: "A névoa se desfaz, dissolvendo-se no turbilhão de energia psiônica ao fundo. A consciência retorna.\n\n§HHARMONIA É SABEDORIA.§!\n\nO Véu está mais calmo agora."
 shroud.3035.b: "A concessão é sinônimo de fraqueza."
 shroud.3035.b.reply: "A cada golpe da névoa, a fúria energética ao redor se intensifica.\n\n§HA VIOLÊNCIA É A RECOMPENSA DO SER INSENSATO.§!\n\nAs energias contorcidas do Véu entram em convulsão mais uma vez."
 shroud.3040.title: "Visões Invisíveis"
 shroud.3040.desc: "Uma poça de líquido negro se estende diante de nós.\n\nDe repente, uma imagem turva cintila na superfície. Vislumbramos um pico reluzente, cada crista adornada com ouro brilhante, até que a visão desaparece abruptamente.\n\nUma voz ressoa nas profundezas de nossas [GetMindLoc].\n\n§HVOCÊS VIRAM O INVISÍVEL?§!"
 shroud.3040.a: "Vimos uma pedreira, à espera da picareta."
 shroud.3040.a.reply: "Uma série de ondulações paralelas irrompem pela superfície líquida. Mais uma vez, sentimos a voz.\n\n§HCRESCIMENTO SEM AMARRAS MANTÉM O EQUILÍBRIO SEM LIMITES.§!\n\nConforme o líquido se estabiliza, sentimos a voz se afastando."
 shroud.3040.b: "Vimos a perfeição da natureza, destinada a ser preservada."
 shroud.3040.b.reply: "O líquido se agita. Ondas crescem e se quebram. Um redemoinho gira na escuridão. A voz retorna com mais força.\n\n§HINACEITÁVEL! CRESÇA E DOMINE. CRESÇA E CONQUISTE!§!\n\nA superfície se acalma novamente. A voz partiu."
 shroud.3040.c: "Não temos certeza."
 shroud.3040.c.reply: "O líquido se agita. A voz surge novamente.\n\n§HA CONVICÇÃO VACILA... HÁ FRAQUEZA EM SUA VONTADE.§!\n\nConforme a superfície se estabiliza, sentimos a voz se afastar."
 shroud.3045.title: "Grânulo Luminoso"
 shroud.3045.desc: "A névoa se reorganiza diante de nós. Energias incandescentes pulsam com um vigor repentino. O contorno de uma entidade arbórea desconhecida toma forma.\n\nSua imensa copa cintila conforme avançamos, alternando tons de púrpura, rosa e preto.\n\nAcolhido em sua base há um grânulo luminoso, vibrando em sincronia com as cores mutáveis da copa.\n\nUma voz se instala em nossas [GetMindLoc].\n\n§HAPROXIME-SE. DOMINE. EXPLORE.§!"
 shroud.3045.a: "Extrair o grânulo."
 shroud.3045.a.reply: "Ao remover o grânulo, a copa perde o brilho e murcha instantaneamente. A voz retorna.\n\n§HSIM! ESPÓLIOS GERAM MAIS ESPÓLIOS.§!"
 shroud.3045.b: "Não tocar no caroço."
 shroud.3045.b.reply: "Um tremor nos atravessa. Somos nós ou o mundo que treme?\n\n§HPROSPERIDADE É PROPÓSITO. RECUSÁ-LA É LOUCURA!§!"
 shroud.3050.title: "Cacofonias Disruptivas"
 shroud.3050.desc.intro: "Correntes psiônicas poderosas colidem e fervilham na turbulência incessante do Véu. Uma cacofonia estrondosa irrompe, exigindo nossa atenção."
 shroud.3050.desc.outro: "O barulho é insuportável."
 shroud.3050.desc.eater: "Gritos de dor, a orquestra retumbante da batalha, o estrondo de chamas devoradoras. Sentimos uma dor... mas de quem?"
 shroud.3050.desc.composer: "Gritos e clamores, animalescos, selvagens, primordiais... Rios jorram e ventos uivam... Toda a natureza ladra e vocifera, com urgência e em uníssono..."
 shroud.3050.desc.cradle: "Vozes sussurram, resmungam, exclamam e proclamam... Incontáveis entonações, sílabas, sons... Línguas incontáveis falam ao mesmo tempo."
 shroud.3050.desc.instrument: "Brocas perfuram, máquinas rangem... A matéria é transformada com força e barulho... Todas as fábricas do universo explodem e incendeiam ao mesmo tempo."
 shroud.3050.a: "Permanecer na cacofonia."
 shroud.3050.a.reply: "O crescendo se intensifica. Somos arremessados em uma direção que não compreendemos...\n\nPor fim, retornamos ao silêncio."
 shroud.3050.b: "Afastar-se."
 shroud.3050.b.reply: "É insuportável. Nossas [GetMindLoc] recuam, buscando refúgio no conforto do silêncio."
 shroud.3055.title: "Visões Proféticas"
 shroud.3055.desc.intro: "Uma penumbra densa nos envolve. De todos os lados, uma pressão nos aperta, cada vez mais forte. Até que uma visão enevoada se revela."
 shroud.3055.desc.outro: "Em meio à escuridão turva, algo se destaca. Inconfundível, central: é a bandeira de [Root.GetName].\n\nSomos nós?"
 shroud.3055.desc.eater: "Vemos um mundo devastado, resultado de uma batalha... Os vencedores vasculham cadáveres e destroços."
 shroud.3055.desc.composer: "Vemos muitos mundos... avançando de forma impossível através do tempo e espaço... Todos unidos sob um único império."
 shroud.3055.desc.cradle: "Vemos uma grande assembleia... O contorno opaco de muitas silhuetas... Ouvindo, discursando."
 shroud.3055.desc.instrument.default: "Vemos um mundo otimizado... Infinitas fileiras de fábricas e minas... Nenhum canto da superfície foi ignorado."
 shroud.3055.desc.instrument.relentless_industrialist: "Vemos um mundo otimizado... Infinitas fileiras de fábricas e minas... A mais pura perfeição. Nenhum canto da superfície foi ignorado."
 shroud.3055.a: "Manter a visão."
 shroud.3055.a.reply: "A imagem se torna levemente mais nítida. Estamos confiantes em nossa percepção."
 shroud.3055.b.organic: "Expulsar a visão de nossas mentes."
 shroud.3055.b.machine: "Apagar a visão de nossos circuitos."
 shroud.3055.b.reply: "Os contornos indistintos da visão se dissipam no nada."
 shroud.3060.title: "Entre o Vazio"
 shroud.3060.desc.intro: "As névoas etéreas do Véu se agitam e se contorcem, arrastando nossa consciência para as profundezas enquanto nossas formas físicas permanecem inertes, intocadas.\n\nNossa [GetPsycheLoc] se estica, se contorce, presa em uma maré cíclica. Cada tentativa de movimento desmorona sobre si, esmagada por uma tensão implacável."
 shroud.3060.desc.intro.organic: "Vemos além de nós mesmos, nossos corpos selados dentro de um tesseract sequencial além da nossa compreensão física."
 shroud.3060.desc.intro.machine: "Sub-rotinas lógicas são ativadas, a falha é identificada: um ciclo recursivo. Nossos processadores psiônicos são insuficientes para romper o ciclo e retomar a função normal."
 shroud.3060.desc.intro.end: "Conforme a tensão se torna insuportável, nossas formas ameaçam se dissolver no vazio. Uma voz rompe o confinamento."
 shroud.3060.desc.outro: "As palavras ressoam em nós. Sua força cresce. Sentimos surgir uma maneira de silenciar a perturbação que ameaça nos despedaçar, mas para isso devemos nos submeter."
 shroud.3060.desc.eater: "§HDEVORE! CONSUMA O VAZIO INFINITO!§!"
 shroud.3060.desc.composer: "§HSUPERE OS LIMITES DA INFINITUDE RECURSIVA!§!"
 shroud.3060.desc.cradle: "§HENTREGUE-SE À ETERNIDADE! O TODO É UM, ASSIM COMO O UM É O TODO!§!"
 shroud.3060.desc.instrument: "§HMERGULHE NO POTENCIAL ILIMITADO!§!"
 shroud.3060.a: "Submeter-se."
 shroud.3060.a.reply: "A voz cresce, guiando nossas ações, forçando nossos pensamentos para além da compreensão limitada. O ciclo continua, pressionando, nos puxando... até se despedaçar contra nossa psique.\n\nRompemos a recursão, conduzidos por nossa súplica às forças superiores do Véu.\n\nNo entanto, nem todos permaneceram. §H[event_target:shroud_warped_leader.GetName]§! não está mais em seu posto. A voz retorna."
 shroud.3060.a.reply.default: "O QUE SE FOI SERÁ RECONSTRUÍDO."
 shroud.3060.a.reply.eater: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.composer: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.cradle: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.instrument: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.b: "Resistir."
 shroud.3060.b.reply: "Rejeitamos as compulsões impostas a nós.\n\nO ciclo acelera, nos arrastando com a força de sua maré recursiva. Quando deixamos de resistir, a tensão já não ameaça nos despedaçar. Em vez disso, ela nos envolve, permitindo que vejamos além de nós mesmos, ainda que por um breve momento.\n\nA voz retorna."
 shroud.3060.b.reply.default: "QUE TEDIOSO."
 shroud.3060.b.reply.eater: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.composer: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.cradle: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.instrument: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.leader_return.title: "Transformação pelo Véu"
 shroud.3060.leader_return.desc: "O Véu estremece. Distorções sutis ondulam por nossas [GetMindPhysicalLoc] enquanto uma presença familiar emerge. Algo se agita às margens de nossa [GetMindPerceptionLoc], sussurrando ecos além de nosso limiar auditivo.\n\n§H[from.GetName]§! retorna para nós, atravessando as névoas inefáveis enquanto elas se moldam em sua forma conhecida. Distante, mas em sua totalidade. Seu corpo reconstruído pelo Véu, ansiando servir novamente."
 shroud.3060.leader_return_tt: "§H[from.GetName]§! ganhou uma nova característica: §G$leader_trait_shroud_warped$§!"
 leader_trait_shroud_warped: "Transformação pelo Véu"
 leader_trait_shroud_warped_desc: "Após sua absorção e reconstrução pelo Véu, a sabedoria etérea concedida a este líder lhe confere o poder de observar o que é invisível e amplificar o potencial psiônico daqueles ao seu redor."
 leader_trait_shroud_warped_invasion_effect: "Inteligência sobre o império inimigo a cada vitória em invasões: §G+$@shroud_warped_intel|0$§!"
 shroud.3065.title: "Um Cálice Ordenado"
 shroud.3065.desc.intro: "A névoa do Véu estremece, abrindo-se para revelar um cálice repleto de um líquido cintilante, cuja superfície permanece lisa e intacta.\n\nUm impulso nos domina. Sem pensar, tentamos tocá-lo. O líquido, ansioso, treme quando começamos a consumi-lo.\n\nA clareza nos invade. Quanto mais líquido conseguimos [GetImbibeLoc], mais a mentira se revela. O fluido engrossa, cada gota começando a coalhar dentro de nós.\n\nSomos consumidos por uma necessidade de expurgar a contaminação."
 shroud.3065.desc.eater: "§HFARTE-SE! AFOGUE SUAS FRAQUEZAS!§!"
 shroud.3065.desc.composer: "§HNUTRA-SE! INSPIRE NOVOS CRESCIMENTOS!§!"
 shroud.3065.desc.cradle: "§HFORTALEÇA-SE! ACEITE A UNIFICAÇÃO DOLOROSA!§!"
 shroud.3065.desc.instrument: "§HSORVA! ENTREGUE-SE AOS SEUS VÍCIOS!§!"
 shroud.3065.desc.outro: "A voz se mistura ao líquido, ficando mais espesso enquanto se infiltra mais fundo dentro de nós, forçando nossa submissão à sua vontade."
 shroud.3065.a.organic: "Beber."
 shroud.3065.a.machine: "Processar."
 shroud.3065.a.reply.intro: "Consumimos as últimas gotas do líquido, espesso e repugnante. Ele satura nossas [GetMindPhysicalLoc] e acumula-se dentro de nós.\n\nO calor pulsa, distorcendo nossos pensamentos, desgastando os contornos de nossa [GetPsycheLoc].\n\nA voz retorna, satisfeita, enquanto o cálice se desfaz diante de nós."
 shroud.3065.a.reply.default: "CONQUISTADOR! CAMPEÃO."
 shroud.3065.a.reply.eater: "§H$shroud.3065.a.reply.default$§!"
 shroud.3065.a.reply.composer: "§HCRIADOR! CATALISTA VIVO.§!"
 shroud.3065.a.reply.cradle: "§HINTEGRADOR! MENTES ENTRELAÇADAS.§!"
 shroud.3065.a.reply.instrument: "§HDECADÊNCIA! SENTIDOS A EXPLORAR.§!"
 shroud.3065.b: "Expulsar."
 shroud.3065.b.reply.intro: "Convulsões violentas assolam nossos [GetBodiesLoc] enquanto rejeitamos a contaminação, expurgando a substância nauseante de nosso interior.\n\nO líquido abjeto espirra contra o vazio, contorcendo-se ao se desfazer. A voz sibila, suas palavras evaporando junto à imundície."
 shroud.3065.b.reply.default: "FRAQUEZA!"
 shroud.3065.b.reply.eater: "§H$shroud.3065.b.reply.default$§!"
 shroud.3065.b.reply.composer: "§HESTAGNAÇÃO!§!"
 shroud.3065.b.reply.cradle: "§HCOVARDIA!§!"
 shroud.3065.b.reply.instrument: "§HTANTO POTENCIAL...§!"
 shroud.3070.title: "Quadro de Mudanças"
 shroud.3070.desc.intro: "O Véu se contrai, dobra-se para dentro, comprimindo nossa psique em um vazio confinado e ressonante.\n\nUma presença paira, fluida e indistinta. Sua forma se altera ao abrir e fechar o limiar que nos separa do restante do Véu. Cada abertura desencadeia uma cascata de visões."
 shroud.3070.desc.eater: "Mundos ardem, suas brasas levadas pelos lamentos dos devorados. Cada paisagem em mutação revela um possível banquete, pronto para ser consumido."
 shroud.3070.desc.composer: "Terras exuberantes, repletas de vida selvagem espalhadas por campos verdejantes. Os fios da vida crescem e se entrelaçam. Cada cenário em transformação revela uma atmosfera vibrante, pronta para ser moldada."
 shroud.3070.desc.cradle: "Comunidades se unem, elevando-se mutuamente, mas rejeitando aqueles que se opõem. Cada cenário em transformação revela uma nova utopia, aberta apenas aos fiéis."
 shroud.3070.desc.instrument: "Pedreiras vastas se estendem diante de nós, repletas de recursos valiosos prontos para extração. Cada cenário em transformação revela riquezas à espera do saque."
 shroud.3070.desc.outro: "A cada nova visão, a inércia nos revira e retorce, arrastando-nos a velocidades impossíveis enquanto as paredes da realidade se distorcem e ondulam.\n\nÉ possível perceber que a figura se diverte. Está nos testando, à espera de um nome para a força que nos domina."
 shroud.3070.a.eater: "Satisfação."
 shroud.3070.a.composer: "Formação."
 shroud.3070.a.cradle: "Harmonia."
 shroud.3070.a.instrument: "Potencial."
 shroud.3070.a.reply.intro: "Nossa voz retumba, e a presença silencia. As visões volúveis cessam enquanto a tempestade de inércia se acomoda em uma clareza ressonante.\n\nNós a nomeamos."
 shroud.3070.a.reply.default: "SATISFAÇÃO. ALIMENTADA PELA CONQUISTA."
 shroud.3070.a.reply.eater: "§H$shroud.3070.a.reply.default$§!"
 shroud.3070.a.reply.composer: "§HFORMAÇÃO. VIDAS ENTRELAÇADAS, PADRÕES SOLIDIFICADOS.§!"
 shroud.3070.a.reply.cradle: "§HHARMONIA. DISCÓRDIA EVITADA COM GENTILEZA.§!"
 shroud.3070.a.reply.instrument: "§HPOTENCIAL. ANSIANDO SER ARRANCADO DO COSMOS INERTE.§!"
 shroud.3070.a.reply.outro: "A figura, satisfeita com nossa decisão, abre a barreira. O vazio se dissipa enquanto emergimos dele."
 shroud.3070.b.eater: "Desespero."
 shroud.3070.b.composer: "Excesso."
 shroud.3070.b.cradle: "Farsa."
 shroud.3070.b.instrument: "Desperdício."
 shroud.3070.b.reply.intro: "Nossa voz vacila, arrancada de nós pela figura raivosa que nos força através da barreira."
 shroud.3070.b.reply.default: "DESESPERO? FRAQUEZA, FOME. VOCÊ NÃO TEM CONVICÇÃO!"
 shroud.3070.b.reply.eater: "§H$shroud.3070.b.reply.default$§!"
 shroud.3070.b.reply.composer: "§HEXCESSO? ENTREGUE-SE À MEDIOCRIDADE!§!"
 shroud.3070.b.reply.cradle: "§HFARSA? DEFINHE EM SUA SOLIDÃO!§!"
 shroud.3070.b.reply.instrument: "§HDESPERDÍCIO? IMUNDÍCIE LETÁRGICA É SUA OBSESSÃO!§!"
 shroud.3070.b.reply.outro: "Cambaleamos para fora do Véu, uma sensação incômoda nos acompanhando."
 shroud.3100.title: "Conflito Psiônico"
 shroud.3100.desc: "Uma orquestra dissonante de devastação nos atrai cada vez mais fundo no Véu. Cada reverberação martela nossa psique em um ritmo implacável de ruína.\n\nO barulho toma forma.\n\nEstamos à margem de um conflito psiônico. As motivações das entidades são incertas, mas o poder demonstrado é imenso.\n\nOs bombardeios psíquicos entram e saem da nossa percepção, contorcendo-se pela realidade fragmentada diante de nós. Não há onde se esconder, há apenas a tempestade que se aproxima."
 shroud.3100.a: "§YResistir e observar.§!"
 shroud.3101.title: "§GRessonância Incessante§!"
 shroud.3101.desc.intro: "Permanecemos aqui, desafiando a ira à medida que o conflito se aproxima."
 shroud.3101.desc: "$shroud.3101.desc.intro$\n\nCom foco nítido, sintonizamos com a cascata psíquica. Nossos pensamentos fluem. O bombardeiro persiste, mas continuamos ilesos, nos movendo em harmonia com o ritmo da destruição.\n\nA cada passo, nossa compreensão se aprofunda. A rajada psiônica desliza por brechas em planos invisíveis.\n\nAo nos afastarmos, o padrão persiste. Com refinamento, os princípios observados poderão reforçar nosso próprio arsenal."
 shroud.3102.title: "§RBombardeio Abissal§!"
 shroud.3102.desc: "$shroud.3101.desc.intro$Tentamos nos sintonizar com a tempestade psíquica, movendo-se conforme seus ritmos imprevisíveis.\n\nNossos primeiros passos foram promissores, mas o compasso da destruição inevitavelmente nos consumiu.\n\nA tempestade está se dissipando, mas os ecos do bombardeio ainda ressoam em nós. As reverberações psiônicas de nossa falha ecoam por todo o império, mesmo nesta realidade."
 shroud.3102.a.tt: "Duas construções aleatórias em todo o império são destruídas."
 shroud.3105.title: "Vias Psíquicas"
 shroud.3105.desc: "Sem aviso, uma pressão psíquica irrompe no Véu.\n\nUm labirinto de vias incandescentes se revela diante de nós, estendendo-se além da percepção, crepitando brevemente antes de desaparecer no vazio.\n\nOutro surto começa a se formar. Com concentração, sentimos seu padrão antes que tome forma. O labirinto ressurge, expandindo-se em uma rede de possibilidades.\n\nCada via é uma nova tentação a ser explorada, antes de se desfazer no nada."
 shroud.3105.a: "§YEnfrentar o desafio.§!"
 shroud.3106.title: "§G$tech_psionic_lightning$§!"
 shroud.3106.desc.intro: "A pressão cresce, nos provocando com expectativa. Nossos movimentos acompanham o crescendo, conduzindo nossas mentes pelo labirinto de energia psíquica. Pensamentos se tornam impulso, nos impelindo para a frente."
 shroud.3106.desc: "$shroud.3106.desc.intro$ desviando de arcos de energia psiônica antes que a determinação nos abandone.\n\nEstamos livres das amarras, ascendemos além da forma física. O labirinto e suas incontáveis vias se tornam uma extensão da nossa consciência, revelando conhecimentos ocultos nos padrões da tempestade.\n\nO momento acaba de modo tão repentino quanto começou. A imagem persistente do labirinto colapsa atrás de nós enquanto emergimos com uma nova compreensão de tudo. Com alguns refinamentos sutis, esses princípios psiônicos poderão ser aplicados às nossas armas."
 shroud.3107.title: "§RPerdidos no Vazio§!"
 shroud.3107.desc: "$shroud.3106.desc.intro$ Uma miríade de caminhos se abre adiante, sobrecarregando a mente com o fardo de escolhas impossíveis.\n\nNesse instante de hesitação, as vias incandescentes explodem. Arcos de energia psiônica se entrelaçam no nexus em colapso, capturando nossos pensamentos e nos lançando para o caos do Véu.\n\nEmergimos, nossa equipe de [GetTelepathPlural] desorientada, abalada pelo trauma do fracasso. O impacto psiônico reverbera por [Root.GetName]."
 shroud.3110.title: "Lança Psíquica"
 shroud.3110.desc: "Um feixe totêmico de energia psiônica se projeta além de nós, atravessando o Véu rumo a infinitudes incalculáveis. Sua composição excepcionalmente estável contrasta com as formações caóticas que encontramos até agora.\n\nÉ seguro permanecer aqui?"
 shroud.3110.a: "§YPermanecer aqui por um tempo.§!"
 shroud.3111.title: "§GDisruptores Psiônicos§!"
 shroud.3111.desc: "Apesar de sua intensidade ofuscante, conseguimos manter o foco sobre o feixe perfeitamente moldado de energia psíquica. Por fim, contemplamos a verdadeira natureza de sua estrutura complexa e sobrenatural.\n\nNossas mentes disparam com novas possibilidades. Se conseguirmos replicar essa formação energética em mundo físico, teremos em mãos uma arma irrefreável."
 shroud.3112.title: "§REquipe de [GetTelepathPlural] Sobrecarregada§!"
 shroud.3112.desc: "Foi impossível permanecer. A proximidade com uma formação tão intensa de energia psiônica foi demais para nossa equipe de [GetTelepathPlural].\n\nPrecisaremos de tempo para superar os danos mentais causados pela exposição a esse fenômeno avassalador."
 recovering_telepaths: "Recuperando $DEFAULT_TELEPATH_PLURAL_CAP$."
 recovering_telepaths_desc: "Os esforços excessivos no Véu tiveram um impacto devastador em nossos $DEFAULT_TELEPATH_PLURAL$."
 recovering_telepaths_robot: "Recuperando $MACHINE_TELEPATH_PLURAL_CAP$."
 recovering_telepaths_robot_desc: "Os esforços excessivos no Véu tiveram um impacto devastador em nossas $MACHINE_TELEPATH_PLURAL$."
 recovering_telepaths_hive: "Recuperando $HIVE_TELEPATH_PLURAL_CAP$."
 recovering_telepaths_hive_desc: "Os esforços excessivos no Véu tiveram um impacto devastador em nossos $HIVE_TELEPATH_PLURAL$."
 MACHINE_SENSE: "perceber"
 shroud.3120.title: "Um Eco Distante"
 shroud.3120.desc: "Por todo o Véu, podemos [GetFeelLoc] a ressonância de poderes insondáveis. Sua influência permeia o reino psiônico.\n\nNossas ações podem nos sintonizar mais com eles, embora exista outro método. Ao usar o poder do Zro, nossa equipe de [GetTelepathPlural] pode estender seu alcance diretamente em direção a essas entidades.\n\nSó precisamos decidir qual delas contatar."
 shroud.3120.a: "$utopia.3005.a$"
 shroud.3120.b: "$utopia.3005.b$"
 shroud.3120.c: "$utopia.3005.c$"
 shroud.3120.d: "§CCom uma que lamenta a esperança sepultada.§!"
 ORGANIC_SPIRITS: "espíritos"
 MACHINE_SPIRITS: "entidades psiônicas"
 shroud.3125.title: "$shroud.3120.title$"
 shroud.3125.desc: "Conforme tentamos alcançar a presença, podemos [GetFeelSenseLoc] sua agitação. Já encontramos [GetSpiritsLoc] antes, mas isso é diferente, algo muito mais poderoso... muito mais antigo.\n\nCom suas energias imbuídas de Zro esgotadas, nossa equipe de [GetTelepathPlural] deve sair do Véu. Teremos que voltar outro dia."
 shroud.3125.tt: "Ganha §HSintonia§! significativa com uma entidade no §HVéu§!."
 shroud.3115.title: "Bombardeio Psiônico"
 shroud.3115.desc: "Uma série de convulsões poderosas atravessa o Véu, provocando um tremor que abala nossas mentes.\n\nEssas reverberações ameaçam sobrecarregar nossa equipe de [GetTelepathPlural].\n\nQual será a origem desse bombardeio psiônico?"
 shroud.3115.a: "§YPrecisamos descobrir.§!"
 shroud.3116.title: "§G$tech_psionic_bombers$§!"
 shroud.3116.desc: "Fortalecemos nossas mentes contra o bombardeio contínuo e logo compreendemos sua natureza.\n\nAs convulsões explosivas são provocadas por correntes de energia psiônica concentrada, refletidas de nossa própria dimensão. Essas esferas instáveis de intenção psíquica podem causar sérios danos às mentes despreparadas.\n\nUma ideia se manifesta: essas formações poderosas servirão de base para novas armas forjadas a partir do Véu."
 shroud.3117.title: "§RChoque Psiônico§!"
 shroud.3117.desc: "Nossas reservas mentais se esgotaram.\n\nAs detonações psíquicas foram insuportáveis, provocando casos de choque psiônico em grande parte de nossa equipe de [GetTelepathPlural].\n\nPrecisaremos de tempo para nos recuperar."
 psionic_shock_modifier: "Choque Psiônico"
 psionic_shock_modifier_desc: "A exposição a forças esmagadoras do Véu causou um choque psiônico em nossos $DEFAULT_TELEPATH_PLURAL$."
 psionic_shock_hive_modifier: "$psionic_shock_modifier$"
 psionic_shock_hive_modifier_desc: "A exposição a forças esmagadoras do Véu causou um choque psiônico em nossos $HIVE_TELEPATH_PLURAL$."
 psionic_shock_robot_modifier: "$psionic_shock_modifier$"
 psionic_shock_robot_modifier_desc: "A exposição a forças esmagadoras do Véu causou um choque psiônico em nossas $MACHINE_TELEPATH_PLURAL$."
 shroud.3200.title: "Animatus"
 shroud.3200.desc: "Conforme nossas mentes vagam mais uma vez nas profundezas do Véu, nos vemos diante da presença familiar d$the_animator_of_clay_color_article$.\n\nRitmos regulares emergem ao redor de nossas consciências. Vozes silenciosas emergem em coro; os fantasmas em nossa frota começaram a se agitar. Elas oferecem levar nossas formas físicas para mais além, aliviando nossas mentes para focar em questões maiores.\n\nEmbora não estejam vivas, elas nos são familiares. Sua forma moldada pelo intento, suas presenças imbuídas de história e propósito. Em uníssono, elas se aproximam com expectativa.\n\nJá não somos meros operadores dessas naves. Nós nos unimos, uma unidade de determinação, impelida por uma vontade coletiva."
 shroud.3200.a: "Somos apenas folhas ao vento."
 shroud.3200.a.tt: "§Y$unlock_edict_tt$§!$edict_animatus$"
 shroud.3210.title: "Vontade da Temperança"
 shroud.3210.desc.intro: "A essência lamuriosa d$the_outsider_color_article$ infiltra-se em nossas mentes.\n\nConforme seu eco choroso ressoa, vórtices enlaçados de energia psiônica coalescem em uma forma estranha e amorfa. Quanto mais olhamos, menos compreensível ela se torna. Uma voz fala.\n\n§HAlgumas coisas são indecifráveis para vocês. Essas coisas, a dor e o arrependimento ensinarão.\n\nEu fui a primeira de meu povo a vir para este lugar, mas todos pagamos o preço. Deixamos o Véu nos destruir; não compartilhem do mesmo destino!§!\n\n"
 shroud.3210.desc.know_zroni: "$shroud.3210.desc.intro$Reconhecemos essa voz como Zroni. Não sabemos como ela veio parar aqui, mas talvez seja prudente considerar seus alertas sobre o poder destrutivo do Véu."
 shroud.3210.desc.left_zroni: "$shroud.3210.desc.intro$Nós a conhecemos. Já nos encontramos com esta Zroni, a Clarividente, antes. Não sabemos como ela veio parar aqui, mas faríamos bem em considerar seus alertas sobre o poder destrutivo do Véu."
 shroud.3210.desc.default: "$shroud.3210.desc.intro$Esta entidade permanece um mistério para nós. Pouco compreendemos seus alertas agourentos."
 shroud.3210.a: "Devemos proceder com cuidado."
 shroud.3210.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_temperance$"
 shroud.3220.title: "Jogo de Pensamentos"
 shroud.3220.desc: "O Véu pulsa ao nosso redor com os ritmos tranquilos d$the_golden_dream_color_article$.\n\nConforme observamos, filamentos errantes de energia psiônica aos poucos se organizam em uma grade. Cifras irreconhecíveis começam a se manifestar em desenhos cuidadosamente distribuídos.\n\nEles começam a se embaralhar uns sobre os outros, criando novas formas de maior complexidade. Com o tempo, sentimos um padrão; uma lógica governando seus movimentos.\n\nPercebemos que somos peças em um jogo com $the_golden_dream_article$. Cada movimento que nos guia nos preenche com um novo senso de indulgência tranquilizante."
 shroud.3220.a: "Conforme jogamos, escapamos para um lugar significativo."
 shroud.3220.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_distraction$"
 shroud.3230.title: "Areias do Tempo"
 shroud.3230.desc: "Grãos de pensamento passam por nós. Reconhecemos a presença abrasiva d$the_endless_tide_color_article$.\n\nEla vai e vem, erodindo todos em seu caminho com uma inevitabilidade eterna, antes de redepositar-se.\n\nReemergindo após sua passagem, nós sentimos rejuvenescimento verdadeiro."
 shroud.3230.a: "Aqui, somos atemporais."
 shroud.3230.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_endless$"
 shroud.3240.title: "Reformados"
 shroud.3240.desc: "Um ápice vestigial paira sobre nossos pensamentos; é $the_pale_mountain_color_article$. Nossas mentes tensionam-se conforme uma visão assola nossos sentidos.\n\nVemos uma silhueta turva de uma nave danificada diante de nós, a esmo no vazio.\n\nEm algum lugar de nossas mentes, a pressão oblíqua se desloca e a nave começa a se transformar. Fissuras são seladas, a corrosão desaparece e o metal se endireita. Aos poucos, o legado de sua destruição é desfeito.\n\nUma vez que a nave está completamente reparada, a visão acaba abruptamente. Ficamos apenas com uma sensação de profunda renovação."
 shroud.3240.a: "Um grande renascimento de nossas mentes."
 shroud.3240.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_rebirth$"
 shroud.3250.title: "A Força da Abstenção"
 shroud.3250.desc: "A serenidade d$the_hollow_point_color_article$ preenche nossas mentes com seu silêncio. Uma visão se espalha preguiçosamente para nossos sentidos.\n\nObservamos eras de conflitos se desenrolando em um instante: civilizações ruindo, histórias apagadas, estátuas de tiranos há muito tempo caídos enterradas pelo tempo.\n\nA sabedoria d$the_hollow_point_article$ está na força quieta da abstenção. Conflitos começam e acabam, mas, ainda assim, permanecemos. Esse distanciamento injeta nossos líderes com uma nova longevidade, livre da toxicidade corrosiva da insatisfação mortal."
 shroud.3250.a: "Ainda vivemos."
 shroud.3250.a.tt: "Todos os líderes psiônicos recebem a característica §Y$leader_trait_shroud_age$§!, que concede §G+40§! anos à expectativa de vida do líder."
 shroud.3260.title: "Caos à Ordem"
 shroud.3260.desc: "O Véu está borbulhando, sua ebulição pulsa diante de nós. Uma presença se aproxima; é $the_vacant_throne_color_article$.\n\nConforme ele chega mais perto, energias psiônicas vastas e amaranhadas são subjugadas repentinamente. A desordem se torna mais clara e mais compreensível. Cores florescem com definição renovada. Simetria, lógica e estrutura são impostas.\n\nAlgo se concretiza nos mais profundos recantos de nossas mentes: um desejo avassalador por ordem."
 shroud.3260.a: "Descarte o caos, abrace a ordem."
 shroud.3260.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_order$"
 shroud.3270.title: "Aceleração Infinita"
 shroud.3270.desc: "Uma aceleração mental impossível sobrecarrega nossos sentidos. Reconhecemos a presença d$the_black_river_color_article$.\n\nCorremos a uma velocidade incompreensível em direção a uma finalidade que não conseguimos conceber por completo. É a fronteira entre tudo e nada, a separação do que sempre foi e o que nunca será, o limite além do qual nenhuma lei natural pode alcançar.\n\nFinalmente, conforme recobramos os sentidos, ganhamos uma nova noção do que significa realmente se mover."
 shroud.3270.a: "Já encontramos o limite do universo?"
 shroud.3270.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_motion$"
 #==========================
 # Forge our own Path
 #==========================
 shroud.3500.title: "Um Caminho Forjado"
 shroud.3500.desc: "Nossa equipe psiônica de [GetResearchers] desenvolveu uma técnica engenhosa para extrair poder do §HVéu§!.\n\nOs maiores poderes do reino psiônico são guardados por seus patronos, e entregues apenas a quem aceita seu Pacto. Isso é inconcebível, então forjaremos nosso próprio caminho.\n\nAo projetar nossa vontade no Véu, poderemos extrair vestígios de poder de cada domínio sintonizado. Tal tarefa exige concentração absoluta, mas nossas mentes agora estão fortalecidas para sustentar esse equilíbrio delicado."
 shroud.3500.a: "Dentro do Véu, nossa vontade é absoluta."
 shroud.3510.title: "$utopia.2681.name$"
 shroud.3510.desc: "Em uma dobra do §HVéu§!, nossa equipe de [GetTelepathPlural] descobriu um nexus de poder inexplorado.\n\nForças convergentes podem se acumular gradualmente no mundo psiônico, gerando concentrações de energia tão poderosas que podem se transformar em entidades superiores. Descobrimos uma dessas formações, pronta para ser reivindicada.\n\nPor pura força de vontade psiônica, um de nós poderá absorver essa força extraordinária. Um grupo de candidatos já foi selecionado."
 shroud.3510.a: "§H[leader_1.GetTitle]§! [leader_1.GetName]"
 shroud.3510.b: "§H[leader_2.GetTitle]§! [leader_2.GetName]"
 shroud.3510.c: "§H[leader_3.GetTitle]§! [leader_3.GetName]"
 shroud.3510.d: "§H[leader_4.GetTitle]§! [leader_4.GetName]"
 psionic_mastery: "Maestria Psiônica"
 psionic_mastery_desc: "Dominamos por completo nossos poderes psiônicos. Nossas psiques se movem pelo Véu sem nenhuma limitação."
 shroud.3520.title: "$psionic_mastery$"
 shroud.3520.desc: "Quando projetamos nossa vontade no §HVéu§!, alcançamos um grau de maestria sobre nossas habilidades psiônicas. Reunimos poder dos domínios de inúmeras entidades, sem jamais nos submetermos à influência delas. Além disso, nossa equipe de [GetTelepathPlural] agora controla com primazia o estado de transe psiônico.\n\nEnquanto outros permitiram que o Véu moldasse seu destino, nós mantivemos a verdadeira independência de nossa vontade.\n\nO potencial psiônico de §H[this.GetName]§! chegou ao seu ápice."
 shroud.3520.a: "Isso é apenas o começo."
 #==========================
 # Patrons First Contact
 #==========================
 shroud.first_contact.title: "$utopia.3300.name$"
 shroud.first_contact.prompt: "$utopia.2657.a$"
 shroud.first_contact.1.desc.default: "O Véu. Ele flui acima de nossa realidade conhecida, uma sombra lançada pela escuridão. Qualquer ser com poderes psiônicos já o viu em seus sonhos, ainda que sem reconhecê-lo.\n\nPassamos anos tentando atravessar o manto, tornando-o cada vez mais tênue com a força combinada de nossas mentes. Do outro lado, nossos esforços não passaram despercebidos. Algo nos observa.\n\nSua presença irradia um poder fenomenal, [GetPatronInsert] nas profundezas do Véu. Quase não nos percebe, apenas nos olha como olharíamos para uma gota de condensação na escotilha.\n\nSe ao menos pudéssemos alcançar sua mente insondável."
 shroud.first_contact.1.desc.hive: "O Véu. Ele flui acima de nossa realidade conhecida, como uma visão projetada no interior de um drone em repouso. Embora estranho, algo é... inexplicavelmente familiar.\n\nPassamos anos tentando atravessar o manto, tornando-o cada vez mais tênue com a força combinada de nossas mentes. Do outro lado, nossos esforços não passaram despercebidos. Algo nos observa.\n\nSua presença irradia um poder fenomenal, [GetPatronInsert] nas profundezas do Véu. Quase não nos percebe, apenas nos olha como olharíamos para um drone no meio de tantos outros.\n\nSe ao menos pudéssemos alcançar sua mente insondável."
 shroud.first_contact.1.desc.robot: "O Véu. Ele está além de qualquer parâmetro espaço-temporal que já tenhamos detectado. Só pode ser comparado aos dados anômalos que perturbam nossos ciclos de descanso.\n\nPassamos anos tentando hackear sua barreira, tornando-a cada vez mais tênue com a força combinada de nossos processadores. Do outro lado, nossos esforços não passaram despercebidos. Algo nos observa.\n\nSua presença irradia um poder fenomenal, [GetPatronInsert] nas profundezas do Véu. Quase não nos percebe, apenas nos olha como olharíamos para um único bit em um fluxo de dados.\n\nSe ao menos pudéssemos alcançar sua mente insondável."
 shroud.first_contact.2.desc.all: "Podemos sentir grandes entidades no Véu, impossíveis de mensurar. Ao contrário do espaço em constante expansão, os movimentos delas não podem ser rastreados. Seus destinos retornam às origens, como se suas energias nascessem de si mesmas.\n\nSeja qual for sua natureza, elas nos chamam como singularidades de pensamento e vontade."
 shroud.first_contact.2.desc.default: "Entre vozes incontáveis, uma se impõe com mais clareza; [GetPatronInsert] que envolve nossas psiques.\n\nCom esforço suficiente, talvez possamos entrar em contato."
 shroud.first_contact.2.desc.robot: "Entre vozes incontáveis, uma se impõe com mais clareza; [GetPatronInsert], que domina nossos cálculos.\n\nCom esforço suficiente, talvez possamos entrar em contato."
 shroud.first_contact.3.desc.default: "Passamos pelo Entremundos, um vazio que separa o Véu da realidade tangível do espaço convencional.\n\nAssim que entramos, sentimos a presença de [GetPatronInsert] invadindo nossas mentes. É uma entidade de poder inimaginável, pairando no amanhã.\n\nNão podemos recuar agora."
 shroud.first_contact.3.desc.robot: "Passamos pelo Entremundos, um vazio que separa o Véu do fenômeno do espaço comum.\n\nAssim que entramos, detectamos a presença de [GetPatronInsert] invadindo nossas mentes. É uma entidade de poder fenomenal, pairando no amanhã.\n\nNão podemos recuar agora."
 shroud.first_contact.4.desc.default: "O Véu pulsa com poder. Sentimos suas energias em toda parte, e ainda assim, em lugar nenhum. \"Entrar\" é decifrar padrões a partir de sensações vagas, perceber grandes entidades por meio da concentração.\n\nDetectamos o sinal de uma dessas forças, [GetPatronInsert] nas profundezas insondáveis acima.\n\nConseguiremos resistir tempo suficiente para alcançá-la?"
 shroud.first_contact.4.desc.robot: "O Véu pulsa com poder. Sentimos suas energias em toda parte, e ainda assim, em lugar nenhum. \"Entrar\" é detectar padrões a partir de sensações vagas, revelar poderosas entidades por meio do processamento concentrado.\n\nDetectamos o sinal de uma dessas forças, [GetPatronInsert] nas profundezas insondáveis acima.\n\nSerá que nossos circuitos entrarão em sobrecarga antes de alcançá-la?"
 shroud.first_contact.end.b: "Temos muito a ponderar."
 shroud.first_contact_insert.eater.default: "um §Hrosnado voraz§!"
 shroud.first_contact_insert.eater.machine: "um §Hrosnado insaciável§!"
 shroud.4005.title: "$the_eater_of_worlds_article_cap$ Emerge"
 shroud.4005.desc.default: "Nas profundezas do §HVéu§!, chegamos aos domínios do ente §H[Root.Patron:the_eater_of_worlds.GetPreCommunicationName]§!. Seu rugido exprimia uma voracidade vazia, alimentando-se eternamente e nunca saciada. Nossos sinais exploratórios foram recebidos com jorros de fogo e ruína. Sua aparente indiferença à nossa compreensão era sufocante.\n\nPor fim, a entidade perdeu a paciência. Um rugido feroz envolveu as mentes de nossa equipe de [GetTelepathPlural]. Em montes ressonantes de destroços e [GetEaterEmergesExtra]\n\nO barulho cessou tão subitamente quanto começou. Apenas uma fome lancinante permaneceu.\n\nA vontade da entidade agora se mostra mais nítida. [GetEaterEmergesEnding]"
 shroud.4005.desc.hive: "$shroud.4005.desc.default$"
 shroud.4005.desc.gestalt_machine: "Nas profundezas do §HVéu§!, chegamos aos domínios do ente §H[Root.Patron:the_eater_of_worlds.GetPreCommunicationName]§!. Seu rugido exprimia uma voracidade vazia, alimentando-se eternamente e nunca saciada. Nossos sinais exploratórios foram recebidos com jorros de fogo e ruína. Sua aparente indiferença à nossa compreensão era avassaladora.\n\nPor fim, a entidade perdeu a paciência. Um rugido feroz envolveu as mentes de nossa equipe de [GetTelepathPlural]. Em montes ressonantes de destroços e [GetEaterEmergesExtra]\n\nO barulho cessou tão subitamente quanto começou. Pela primeira vez, fomos tomados por uma fraqueza documentada apenas em espécies orgânicas: a fome.\n\nA vontade da entidade agora se mostra mais nítida. [GetEaterEmergesEnding]"
 shroud.4005.desc.individual_machine: "$shroud.4005.desc.gestalt_machine$"
 shroud.4005.desc_extra_pacifist: "ruína, estava exibida uma visão de agressão sem sentido."
 shroud.4005.desc_extra_robot: "ruína, estava exibido um modelo de perfeição marcial."
 shroud.4005.desc_extra_organic: "cadáveres, estava exibido um destino marcial de esplendor horrendo."
 shroud.4005.desc_outro_pacifist: "É uma criatura de violência e discórdia. Ela se opõe a muitos de nossos princípios mais valiosos. Aumentar nossa sintonia com este ser, $the_eater_of_worlds_color_article$, não é recomendado."
 shroud.4005.desc_outro_robot: "Conhecemos sua visão de violência e glória. Assim que nossa equipe de [GetTelepathPlural] estiver recarregada, poderemos nos conectar e comungar com este ser, $the_eater_of_worlds_color_article$."
 shroud.4005.desc_outro_organic: "Conhecemos sua visão de violência e glória. Assim que nossa equipe de [GetTelepathPlural] se recuperar, poderemos nos conectar e comungar com este ser, $the_eater_of_worlds_color_article$."
 shroud.4005.a.default: "[GetEaterEmergesOptionA]"
 shroud.4005.a.robot: "[GetEaterEmergesOptionA]"
 shroud.4005.a.pacifist: "Podemos aprender, até mesmo com este poder aterrorizante."
 shroud.4005.a.non_pacifist: "Um poder tão bruto."
 shroud.4005.b.default: "$shroud.first_contact.end.b$"
 shroud.4005.b.robot: "$shroud.first_contact.end.b$"
 shroud.4005.c.default: "O horror...!"
 shroud.4005.c.robot: "Protocolo de evasão de ameaça iniciado."
 shroud.first_contact.end.a.tt.the_eater_of_worlds: "Ganha §YSintonia§! com $the_eater_of_worlds_color_article$.\n$shroud.first_contact.end.b.tt.the_eater_of_worlds$"
 shroud.first_contact.end.b.tt.the_eater_of_worlds: "Revela $the_eater_of_worlds_color_article$ no §YVéu§!."
 shroud.first_contact.end.c.tt.the_eater_of_worlds: "Perde uma quantidade significativa de §YSintonia§! com $the_eater_of_worlds_color_article$.\n$shroud.first_contact.end.b.tt.the_eater_of_worlds$"
 shroud.first_contact_insert.cradle.default: "um §Hcalor convidativo§!"
 shroud.first_contact_insert.cradle.machine: "um §Hcalor que fascina§!"
 shroud.4015.title: "$the_cradle_of_souls_article_cap$ Emerge"
 shroud.4015.desc.default: "O poder do ente §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! se difunde pelo §HVéu§!, mas sua origem permanece um mistério. Percorremos o reino psiônico, mudando constantemente de direção, questionando nosso próprio julgamento.\n\n$shroud.4015.desc.default.end$"
 shroud.4015.desc.hive: "O poder do ente §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! se difunde pelo §HVéu§!, mas sua origem permanece um mistério. Percorremos o reino psiônico, mudando constantemente de direção, questionando nossos próprios cálculos.\n\n$shroud.4015.desc.default.end$"
 shroud.4015.desc.default.end: "Quando paramos para refletir, a entidade emergiu. Não ouvimos nada, não vimos nada, mas a sentimos, mais quente do que nunca.\n\nSentimos o poder em seu núcleo, um nexus de energias oriundas de todo o Véu e além. Pensamentos convergindo e irradiando um calor singular. Retornamos da jornada tomados por uma quietude profunda.\n\nOs desejos da entidade estão claros para nós. [GetCradleEmergesEnding]"
 shroud.4015.desc.gestalt_machine: "O poder do ente §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! se difunde pelo §HVéu§!, mas sua origem permanece um mistério. Percorremos o reino psiônico, mudando constantemente de direção, questionando nossos próprios cálculos.\n\nDurante uma pausa para análise, a entidade emergiu. Não conseguimos decifrar uma mensagem, mas ela ativou uma parte mais profunda de nosso código.\n\nSentimos o poder em seu núcleo, um nexus de energias oriundas de todo o Véu e além. Conceitos convergindo e irradiando um calor singular. Retornamos da jornada carregados por uma quietude.\n\nOs desejos da entidade estão claros para nós. [GetCradleEmergesEnding]"
 shroud.4015.desc.individual_machine: "$shroud.4015.desc.gestalt_machine$"
 shroud.4015.desc_outro_homicidal: "Nossas mentes imediatamente rejeitam suas premissas falsas de ordem e harmonia. Aumentar nossa sintonia com este ser, $the_cradle_of_souls_color_article$, enfraqueceria nossa determinação."
 shroud.4015.desc_outro_robot: "Conhecemos sua visão de ordem e harmonia. Assim que nossa equipe de [GetTelepathPlural] estiver recarregada, poderemos nos conectar e comungar com este ser, $the_cradle_of_souls_color_article$."
 shroud.4015.desc_outro_organic: "Conhecemos sua visão de ordem e harmonia Assim que nossa equipe de [GetTelepathPlural] se recuperar, poderemos nos conectar e comungar com este ser, $the_cradle_of_souls_color_article$."
 shroud_is_homicidal: "§RNossa natureza predatória e violenta proíbe isso.§!"
 shroud.4015.a.default: "Que possamos nos aproximar cada vez mais."
 shroud.4015.a.robot: "$shroud.4015.a.default$"
 shroud.4015.b.default: "$shroud.first_contact.end.b$"
 shroud.4015.b.robot: "$shroud.first_contact.end.b$"
 shroud.4015.c.default: "Não. Isso não."
 shroud.4015.c.robot: "Definitivamente não."
