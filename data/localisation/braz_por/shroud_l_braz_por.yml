 # Experimental Testing - Test subjects escape
 shroud.1105.title: "$job_test_subject_plural$ em Fuga"
 shroud.1105.desc.intro: "Um número considerável de nossas valiosas cobaias escapou das instalações em §H[root.GetName]§! através de um túnel de fuga improvisado.\n\nCriado com [Owner.GetSpeciesHandNamePlural] e ferramentas também improvisadas, o túnel deve ter sido construído ao longo de muitos anos. Não sabemos quantos tinham ciência de sua existência e como ele permaneceu oculto por tanto tempo."
 shroud.1105.desc.escaped: "Tais atos exigem uma resposta firme para prevenir novas ocorrências. Nossa tolerância prévia com esse problema parece ter servido de encorajamento para a população restante."
 shroud.1105.desc.outro: "Tais atos exigem uma resposta firme para prevenir novas ocorrências."
 shroud.1105.a: "Eles conquistaram sua liberdade."
 shroud.1105.a.tt: "Metade das §Y$job_test_subject_plural$§! em §H[root.GetName]§! partirão como refugiados."
 shroud.1105.b: "Pare as operações até que possamos encontrá-las."
 shroud.1105.b.tt: "§Y$job_test_subject_plural$§! em fuga serão capturadas."
 shroud.1105.c: "Execute as que ficaram como exemplo."
 shroud.1105.c.tt: "Todas as §Y$job_test_subject_plural$§! em §H[root.GetName]§! serão perdidas."
 testing_lockdown: "Interrupção nos Testes"
 testing_lockdown_desc: "Os testes estão temporariamente suspensos enquanto cobaias fugitivas são recuperadas."
 testing_lockdown_tt: "Velocidade do progresso da situação §Y$situation_experimental_testing$§!: §R-100%§!"
 example_set: "Exemplo Estabelecido"
 example_set_desc: "Uma resposta brutal para a tentativa de fuga anterior garante que a população de cobaias permaneça obediente."
 example_set_tt: "Velocidade do progresso da situação §Y$situation_experimental_testing$§!: §G+10%§!"
 # Psionic Ascension Situation (Breaching the Shroud)
 # Mid-Stage Events
 # Beneficial Events
 # A1
 shroud.2300.name: "Transmissão de Pensamento"
 shroud.2300.desc: "[Owner.GetThoughtTransmissionIntro]\n\nA informação pode assumir diversas formas: material linguístico ou visual específico, conceitos amplos ou sensações emocionais generalizadas. O mais importante é que uma transmissão cuidadosamente executada deixa a cobaia completamente alheia ao procedimento.\n\n[Owner.GetThoughtTransmissionOutro]."
 shroud.2300.intro: "[Owner.GetResearchers] com capacidades psiônicas em §H[Owner.Capital.GetName]§! desenvolveram uma forma unidirecional de telepatia que nos permite enviar informações cognitivas para qualquer consciência suscetível."
 shroud.2300.intro_gestalt: "[Owner.GetResearchers] com capacidades psiônicas em §H[Capital.GetName]§! desenvolveram uma forma unidirecional de telepatia que nos permite enviar informações cognitivas para qualquer consciência suscetível, e não apenas ao nosso coletivo."
 shroud.2300.desc.outro: "Essa técnica abre novas possibilidades no campo da comunicação telepática, com efeitos que podem repercutir para nossas interações tanto dentro quanto além de [Owner.GetName]."
 shroud.2300.desc.outro_homicidal: "Essa técnica abre novas possibilidades no campo da comunicação telepática, que poderiam ser exploradas tanto dentro quanto além de [Owner.GetName]."
 shroud.2300.a.robot: "O próximo passo lógico do nosso desenvolvimento."
 shroud.2300.a.organic: "O próximo passo lógico da nossa evolução."
 shroud.2300.b: "Uma nova forma de impor nossa vontade."
 shroud.2300.c.variant: "Um meio para garantir a ordem social."
 shroud.2300.c.organic: "Que a sociedade determine a melhor aplicação."
 # A2
 shroud.2305.name: "Presença Fantasma"
 shroud.2305.desc: "Um número considerável de [Owner.GetCitizenPlural] relatou aparições estranhas em diversos locais em §H[Owner.Capital.GetName]§!. Na maioria dos casos, foram encontros isolados e não recorrentes. No entanto, um local específico chamou a atenção devido à frequência das manifestações. [Owner.GetPhantomPresenceExtra]\n\nDescobriu-se que o fenômeno ocorre nas proximidades da entrada de um sistema de cavernas ricas em minerais."
 shroud.2305.extra: "O local começou a atrair multidões de visitantes ansiosos para avistar a figura fantasmagórica."
 shroud.2305.extra_spiritualist: "A figura fantasmagórica que se manifesta ali se assemelha a uma entidade sagrada descrita em nossas tradições religiosas antigas."
 shroud.2305.a: "Um fenômeno psiônico que precisa ser estudado."
 shroud.2305.a_spiritualist: "Um milagre digno de veneração."
 shroud.2305.b: "Não perturbe este ativo cultural."
 shroud.2305.b_spiritualist: "Não perturbe este local sagrado."
 shroud.2305.c: "Explore a área intensivamente."
 # A3
 shroud.2310.name: "Parasitas Psiônicos"
 shroud.2310.desc: "Uma anomalia climática inesperada atingiu §H[Owner.Capital.GetName]§!. Uma espécie de tempestade varreu uma área com níveis particularmente elevados de energia psiônica. Em seu caminho, encontramos parte da fauna local infectada por um estranho parasita que se aloja e lentamente consome o órgão cerebral.\n\nÀ medida que a infecção avança, os animais hospedeiros desenvolvem temporariamente habilidades telecinéticas básicas, que utilizam para caçar e se alimentar, até sucumbirem.\n\n[Owner.GetShroudParasitesEnding]"
 shroud.2310.ending_biological: "Curiosamente, após o devido processamento, esses parasitas são seguros para consumo. Ricos em diversos nutrientes, podem se tornar uma fonte de alimento saudável e de baixo custo para nossos cidadãos."
 shroud.2310.ending_lithoid: "Curiosamente, essas criaturas secretam grandes volumes de uma substância rica em compostos inorgânicos. Elas podem, portanto, fornecer um método inovador de síntese mineral."
 shroud.2310.ending_machine: "Curiosamente, essas criaturas secretam vastas quantidades de uma substância altamente inflamável. Elas podem, portanto, fornecer um método eficiente de produção de bioenergia."
 shroud.2310.a: "Uma oportunidade de pesquisa valiosa."
 shroud.2310.b_organic: "Não tem nada melhor do que uma refeição grátis."
 shroud.2310.b_machine: "Iniciar protocolos de coleta."
 shroud.2310.c: "Uma nova e fantástica forma de vida foi descoberta."
 # A4
 shroud.2315.name: "Manifestações Materiais"
 shroud.2315.desc: "Durante experimentos com novas técnicas psiônicas, observamos materializações inesperadas durante sessões de meditação em grupo. Ao concentrar nosso foco coletivo em um único ponto do espaço, objetos estranhos e notáveis surgiram brevemente.\n\nO custo psíquico desse processo é significativo, mas é possível direcionar esses esforços para manifestar objetos que sirvam aos nossos propósitos. A origem desses objetos e suas possíveis consequências ainda permanecem desconhecidas."
 shroud.2315.a: "Vamos tornar desejos realidade."
 shroud.2315.b: "Vamos cultivar o sustento."
 shroud.2315.c: "Vamos fortalecer nossas frotas."
 # A5a
 shroud.2320.name: "Duplicação Psiônica"
 shroud.2320.desc: "Circulavam boatos sobre [Owner.GetIndividualNamePlural] com habilidades psiônicas capazes de bilocação, ou seja, estar fisicamente presentes em dois locais ao mesmo tempo. Enviamos [Owner.GetResearchers] para investigar essas alegações improváveis, e surpreendentemente, elas se mostraram verdadeiras. [Owner.GetPsionicDoublingExtra]\n\nAtualmente, apenas uma fração de nossa população possui essa habilidade extraordinária, mas estudos adicionais podem revelar métodos para difundi-la."
 shroud.2320.extra: "\n\nA distância física não parece ser um obstáculo, pois esses adeptos demonstraram diversas vezes a capacidade de se manifestar em dois sistemas estelares distintos ao mesmo tempo"
 shroud.2320.extra_organic: "$shroud.2320.extra$, mantendo um elo psíquico entre dois corpos que executam ações independentes."
 shroud.2320.extra_machine: "$shroud.2320.extra$, mantendo um elo de processamento psiônico entre duas unidades que executam ações independentes."
 shroud.2320.extra_default: "$shroud.2320.extra$."
 shroud.2320.a: "Uma nova via para a cooperação intergaláctica."
 shroud.2320.b: "Uma verdadeira forma de projeção de poder."
 shroud.2320.c: "Um novo método de governança multiplanetária."
 shroud.2320.d: "Que fascinante!"
 # A5b
 shroud.2325.name: "Observação Psiônica"
 shroud.2325.desc: "Uma extraordinária habilidade psiônica surgiu em uma pequena parcela do povo [owner.GetAdjective]: a telestesia, que permite perceber entidades e objetos a distâncias além dos limites da percepção comum. Mesmo sem treinamento especializado, esses observadores remotos conseguem descrever com precisão objetos distantes.\n\nSe conseguirmos controlar e fortalecer esses poderes, poderemos beneficiar muito §H[Owner.GetName]§!. Ao canalizar as habilidades de nosso grupo de [Owner.GetTelepathPlural] mais poderosos, poderemos tentar refinar essa técnica e aplicá-la em uma iniciativa de grande importância."
 shroud.2325.a: "Descubra os segredos ao nosso redor."
 shroud.2325.a_tt: "Inteligência sobre todos os impérios contatados: §G+10§!"
 shroud.2325.b: "Explore os confins do universo."
 shroud.2325.c: "Identifique as vulnerabilidades de nossos inimigos."
 shroud.2325.d: "Descubra depósitos de recursos mais profundos."
 # Balanced Events
 # B1
 shroud.2400.name: "Matéria em Fluxo"
 shroud.2400.desc: "Estamos perdendo matérias-primas a uma taxa alarmante. Estoques inteiros de materiais inorgânicos em fábricas e armazéns estão se esgotando mais rapidamente do que o previsto, [Owner.GetMatterInFluxExtra]. Essas perdas estão diretamente relacionadas ao aumento da atividade psiônica nas áreas afetadas.\n\nPodemos conter a situação interrompendo temporariamente a atividade psiônica nas proximidades dos depósitos, mas isso desacelerará nosso progresso em pesquisas psiônicas e limitará suas aplicações industriais. Como alternativa, podemos investir no desenvolvimento de um atenuador de campo psiônico, capaz de interromper o processo de desmaterialização. Se não fizermos nada, nossa capacidade de pesquisa psiônica será comprometida."
 shroud.2400.desc_default: "supostamente graças à desmaterialização espontânea, e não por crime ou incompetência"
 shroud.2400.desc_gestalt: "supostamente graças à desmaterialização espontânea, e não por desvios ou incompetência"
 shroud.2400.a: "Bens materiais têm pouca relevância."
 shroud.2400.b: "Desenvolva equipamentos antidesmaterialização."
 shroud.2400.c: "Institua uma zona livre de atividades psiônicas."
 # B2
 shroud.2405.name: "Cabeças Mortas"
 shroud.2405.desc: "O crescente interesse da população pela psiônica levou ao surgimento de uma prática peculiar: o armazenamento pessoal de [Owner.GetSpeciesBrainPlural], como uma tentativa de comunicação póstuma.\n\nOs praticantes acreditam que informações cognitivas podem sobreviver ao estado de [Owner.GetDeathName], baseando-se na teoria de que as forças psíquicas são uma forma de energia que não pode ser destruída, apenas convertida. Um número pequeno, porém crescente, também acredita que o falecimento de [Owner.GetIndividualNamePlural] com dons psiônicos cria uma ruptura subespacial ínfima, funcionando como uma janela para outras dimensões.\n\nEmbora seja louvável incentivar pesquisas inovadoras, a manipulação de partes de nossos [Owner.GetDeceasedAdj]s levanta sérias questões éticas. Para piorar, surgiram relatos sobre uma classe de ladrões de corpos especializados em traficar essas partes."
 shroud.2405.a: "Uma iniciativa interessante, se pudermos regulá-la."
 shroud.2405.b: "Que os mortos descansem em paz."
 shroud.2405.c: "[Owner.GetSpeciesBrainPlural] para todos."
 # B3a
 shroud.2410.name: "Transformações Psiônicas"
 shroud.2410.desc: "Uma grande parcela de nossa população psiônica desenvolveu estranhos apêndices articulados de anatomia incompreensível. Nossa equipe de [Owner.GetScientistPlural] afirma que essas alterações foram causadas por uma [Owner.GetGeneticMutationName] espontânea em larga escala. Está claro agora que atividades psiônicas podem provocar alterações físicas nos praticantes. Embora não seja possível impedir a formação dessas protuberâncias, descobrimos que sua taxa de crescimento pode ser controlada psiquicamente.\n\nApesar de causarem [Owner.GetDistressName], esses apêndices têm se mostrado surpreendentemente úteis. Quando bem empregados, podem compensar o desgaste mental que impõem."
 shroud.2410.a: "Uma iniciativa interessante, se pudermos regulá-la."
 shroud.2410.b: "Abominável. Remova todos."
 shroud.2410.c: "Chocante, mas fascinante. Abrace a mudança."
 # B3b
 shroud.2415.name: "[Owner.GetEthicsPluralCap] com Telecinesia"
 shroud.2415.desc: "Nossa equipe de [Owner.GetScientistPlural] desenvolveu um método confiável para converter energia psiônica em energia cinética, e agora trabalham em conjunto com [Owner.GetEngineerPlural] para dar um uso prático a essa tecnologia.\n\nEmbora as aplicações industriais sejam promissoras, as implicações sociais permanecem um mistério. Se um pequeno grupo de [Owner.GetIndividualNamePlural] com capacidades psiônicas puder operar e alimentar uma rede de maquinário complexo, legiões de [Owner.GetWorkerNamePlural] podem se tornar dispensáveis. [Owner.GetTelekineticEthicsExtra] Ainda sabemos pouco sobre a força psiônica, então talvez seja prudente avançar com cautela."
 shroud.2415.extra: "O crescimento irrestrito dessa prática ameaça semear discórdia em uma sociedade que ainda está assimilando seu potencial psiônico."
 shroud.2415.extra_gestalt: "O crescimento irrestrito dessa prática ameaça aumentar os desvios em drones durante o processo de reaproveitamento."
 shroud.2415.a: "Nossas indústrias prosperarão."
 shroud.2415.b: "Considere as possíveis aplicações militares."
 shroud.2415.c: "Limite o uso. O trabalho físico é mais confiável."
 # B4
 shroud.2420.name: "Uma Dor Crescente"
 shroud.2420.desc: "Um surto repentino de [Owner.GetAcuteMigrainePlural] atingiu nosso império. Embora a gravidade dos casos varie consideravelmente, a condição já afeta uma parcela significativa do povo §H[Owner.GetAdjective]§!, causando distúrbios generalizados.\n\nUm pequeno grupo de [Owner.GetIndividualNamePlural] com poderes psiônicos notáveis está entre os mais afetados, e análises estatísticas preliminares sugerem uma correlação direta entre a aptidão psiônica e a intensidade dos sintomas.[Owner.GetAGrowingPainExtra]"
 shroud.2420.extra_default: "Tratamentos convencionais se mostraram ineficazes, pois a dor parece atingir diretamente as faculdades psiônicas por meio de canais interdimensionais que ainda não compreendemos totalmente."
 shroud.2420.extra_machine: ""
 shroud.2420.a: "Devemos aprender a tolerar isso."
 shroud.2420.b: "Devemos distribuir analgésicos mais potentes."
 shroud.2420.b_machine: "Devemos distribuir aprimoramentos protetores."
 shroud.2420.c: "Devemos extrair força da dor."
 shroud.2420.c_machine: "Devemos extrair força da adversidade."
 # B5
 shroud.2425.name: "Submundo Psiônico"
 shroud.2425.desc: "[Owner.GetPsionicUndergroundIntro] [Owner.GetIndividualNamePlural] com poderes psiônicos estão canalizando suas habilidades psíquicas para um esporte de combate ilegal, no qual guerreiros psiônicos lutam por créditos e glória. Embora muitos dos participantes sejam combatentes com talentos inatos com pouco treino formal, [Owner.GetPsionicUndergroundExtra]\n\n[Owner.GetPsionicUndergroundEnd]"
 shroud.2425.intro: "Grupos isolados de"
 shroud.2425.intro_gestalt: "Grupos de desviantes entre"
 shroud.2425.extra: "outros são ex-integrantes de programas estatais de artes marciais psiônicas."
 shroud.2425.extra_gestalt: "outros são especialistas em artes marciais psiônicas."
 shroud.2425.end: "Nossas leis e instituições são incapazes de acompanhar o ritmo das atividades. Atualmente, esses jogos violentos sustentam organizações criminosas por meio de apostas ilícitas, mas há diversas formas de intervir para que o Estado obtenha o controle dessa atividade."
 shroud.2425.end_gestalt: "Embora o desvio envolva certos riscos, essa atividade nos revelou um método prático para coleta de dados de combate físico."
 shroud.2425.end_gestalt_organic: "$shroud.2425.end_gestalt$ Talvez, com moderação, possamos canalizar essas sensações como uma válvula de escape benéfica para a agressividade reprimida do coletivo durante tempos de paz."
 shroud.2425.end_gestalt_machine: "$shroud.2425.end_gestalt$ Com parâmetros de teste mais rigorosos, poderíamos utilizar esses \"jogos\" em benefício do coletivo."
 shroud.2425.a: "Recrute esses guerreiros. Eles serão úteis."
 shroud.2425.a.tt: "Ganha 3 §Y$psionic_army_plural$§! em §Y[event_target:spawn_system.GetName]§!"
 shroud.2425.b: "Estude esse \"combate psiônico\"."
 shroud.2425.c: "Ponha um fim nessa violência sem sentido."
 shroud.2425.d: "Legalize essa atividade como esporte público."
 shroud.2425.d_gestalt: "Regulamente essas atividades como competições públicas."
 # Chaotic Events
 # C1
 shroud.2502.name: "Temporal do Véu"
 shroud.2502.desc: "Relatórios indicam mudanças ambientais abruptas em um setor específico de §H[This.GetName]§!.\n\nA atmosfera está saturada por um vapor gelatinoso, que se condensa em uma precipitação oleosa que [Owner.GetIndividualNamePlural] com capacidades psiônicas chamam de \"Temporal do Véu\". Perturbações psíquicas significativas estão sendo registradas em toda a área afetada.\n\nAs condições da região dentro do Temporal do Véu são extremamente [This.Owner.GetShroudfallExtra]. Sem investimentos imediatos na restauração ambiental, os habitantes precisarão se adaptar a uma realidade profundamente transformada."
 shroud.2502.extra_default: "perigosas para formas de vida sencientes"
 shroud.2502.extra_machine: "prejudiciais aos nossos circuitos neurais"
 shroud.2502.extra_homicidal_hive: "perigosas para [Owner.GetSpeciesNamePlural]"
 shroud.2502.a: "Deixe que o Véu consuma esta terra."
 shroud.2502.b: "Encontre uma forma de restaurar nosso ambiente."
 shroud.2502.c: "Extraia esse material exótico antes que ele se assente."
 # C2
 shroud.2505.name: "Fora de Controle"
 shroud.2505.desc: "Alguns de nós começaram a apresentar comportamentos anômalos, demonstrando mudanças súbitas de opiniões, hábitos e conduta geral. Muitos grupos de [Owner.GetWorkerNamePlural] interromperam suas atividades, e [Owner.GetOutOfControlExtra].\n\nOs afetados alegam estar cumprindo as ordens de uma entidade sem nome que habita as periferias de suas consciências, guiando cada uma de suas ações. À medida que avançamos na construção de nosso futuro psiônico, devemos considerar com cautela o impacto que forças extradimensionais podem ter sobre [Owner.GetOutOfControlPsyche]."
 shroud.2505.extra_default: "representantes outrora leais agora expressam opiniões dissidentes"
 shroud.2505.extra_machine: "unidades administrativas antes confiáveis agora operam de forma subótima."
 shroud.2505.psyche_default: "a psique do povo [owner.GetAdjective]"
 shroud.2505.psyche_machine: "nossos circuitos lógicos"
 shroud.2505.a: "Podemos aprender a mitigar esses impulsos."
 shroud.2505.b: "Essas vozes têm muito a nos ensinar."
 shroud.2505.c: "É uma ameaça à nossa autoridade. Acabe com isso."
 # C3
 shroud.2510.name: "Sobrecarga Neural"
 shroud.2510.desc: "[Owner.GetNeuralOverloadIntro]\n\nTestes mais amplos revelaram que uma parte significativa de nossa população está sofrendo de [Owner.GetNeuralOverloadExtra], provavelmente graças ao aumento de atividade [Owner.GetPsychicAdj]. Os surtos repentinos de energia gerados por práticas psiônicas descontroladas podem levar a uma escalada rápida e consequências graves.\n\nTécnicas avançadas de meditação podem ajudar a regular essa atividade psiônica sem a intervenção [Owner.GetMedicalAdj], mas um grupo de [Owner.GetScientistPlural] recomenda o desenvolvimento de um [Owner.GetMedicalImplantName] para lidar com o problema."
 shroud.2510.intro_default: "Cidadãos de §H[Owner.GetAdjective]§! estão enfrentando um aumento de rupturas cerebrais graves, muitas vezes resultando em perda cognitiva ou morte."
 shroud.2510.intro_machine: "Cidadãos de §H[Owner.GetAdjective]§! estão enfrentando uma onda de sobrecarga severa nos circuitos, muitas vezes resultando em perda cognitiva ou colapso completo."
 shroud.2510.extra_default: "aneurismas leves e assintomáticos"
 shroud.2510.extra_machine: "sobrecarga nos circuitos"
 shroud.2510.a: "Os fortes sobreviverão."
 shroud.2510.a_tt: "Chance de cada colônia controlada perder 100 £pops£ §YPops§!: §R33%§!"
 shroud.2510.b: "Invista em [Owner.GetImplantName]s."
 shroud.2510.c: "Deixe que a meditação acalme nossas mentes."
 shroud.2510.c_corporate: "Agende um treinamento de sinergia psiônica."
 # C4
 shroud.2515.name: "[Owner.GetNightmaresName]"
 shroud.2515.name_organic_non_gestalt: "Pesadelos"
 shroud.2515.name_others: "O Surgimento dos Sonhos"
 shroud.2515.desc: "Conforme aumentamos nossa conexão com as forças psiônicas ao nosso redor, o povo [Owner.GetAdjective] passou a ser atormentado por [Owner.GetHorrifyingNightmarePlural].\n\n[Owner.GetNightmaresExtra]\n\n[Owner.GetNightmaresEnding]"
 shroud.2515.extra_default: "Sonhos perturbadores tornaram-se comuns, e os ciclos de sono foram substituídos por períodos de torpor inquietante. Aqueles afetados relatam visões de horrores incompreensíveis, que manifestam seus medos mais primitivos."
 shroud.2515.extra_gestalt: "Ao que tudo indica, estamos experimentando aquilo que consciências singulares chamam de \"sonhos\". Vítimas desse fenômeno relatam visões de estranheza sobrenatural que representam ameaças fundamentais à nossa coletividade."
 shroud.2515.extra_machine: "Esses \"sonhos\" tornaram-se comuns, e os ciclos de repouso foram substituídos por períodos de instabilidade no fluxo de dados. As vítimas desse fenômeno relatam visões de estranheza sobrenatural que representam um sério risco ao seu bem-estar."
 shroud.2515.end_organic: "Nossas instituições médicas enfrentam dificuldades para conter a onda de exaustão psíquica."
 shroud.2515.end_machine: "Nossas unidades de manutenção enfrentam dificuldades para conter a sobrecarga nas redes neurais."
 shroud.2515.a_organic: "Administre psicofármacos controlados para acalmá-los."
 shroud.2515.a_machine: "Aprimore nossos processadores psiônicos para reduzir essas instabilidades."
 shroud.2515.b: "Invista em pesquisas para solucionar essa crise."
 shroud.2515.c: "Pesadelos não podem nos ferir."
 # C5
 shroud.2520.name: "Ataques Monstruosos"
 shroud.2520.desc: "§H[Owner.Capital.GetName]§! sofreu uma série de ataques da fauna local. Essas criaturas atacaram nossa população, invadiram instalações e esgotaram estoques valiosos.\n\nAs tentativas de proteger a população com patrulhas armadas e toques de recolher tiveram eficácia limitada. Nossa equipe de [Owner.GetResearchers] identificou que uma fenda minúscula entre nossa realidade e o §HVéu§! se abriu em uma área de §H[Owner.Capital.GetName]§!, liberando uma energia psiônica que transformou animais antes inofensivos em predadores agressivos. Esse parece ser o local ideal para concentrar nossos esforços se quisermos superar essa ameaça."
 shroud.2520.a: "Bombardeie a fonte desses ataques."
 shroud.2520.b: "Crie uma barreira psiônica na área."
 shroud.2520.c: "Reduza as pesquisas sobre o Véu para acalmar essas forças."
 shroud.2520.c_tt: "$situation_speed_tt$ §Y$situation_breach_shroud$§!: §R-25%§!"
 shroud.2520.d: "O Véu é cheio de surpresas. Viva e deixe viver."
 # Social Events
 # S1
 shroud.2600.name: "Complexo de Superioridade"
 shroud.2600.desc: "A distribuição desigual das habilidades psiônicas entre nossa população está dando origem a novas formas de conflito social.\n\nAqueles com maior controle sobre seus novos poderes passaram a se considerar superiores e, portanto, merecedores de privilégios políticos e econômicos. Essa retórica controversa está se tornando cada vez mais agressiva e ameaça escalar para a violência."
 shroud.2600.a: "Não toleraremos arrogância."
 shroud.2600.b: "Habilidades superiores justificam recompensas superiores."
 dissidents_silenced_modifier: "Dissidentes Silenciados"
 dissidents_silenced_modifier_desc: "A repressão de privilégios psiônicos ajuda a minimizar a instabilidade política."
 psionic_superiority_modifier: "Superioridade Psiônica"
 psionic_superiority_modifier_desc: "Indivíduos com talento psiônico merecem tratamento especial."
 # S2
 shroud.2605.name: "Revolta Antipsiônica"
 shroud.2605.desc: "Um movimento rebelde crescente vem se manifestando contra os esforços contínuos para explorar e desenvolver nosso potencial psiônico. Esses grupos dissidentes defendem uma supervisão mais rígida de indivíduos psiônicos e a interrupção completa de pesquisas nesse campo.\n\nCaso suas atividades não sejam contidas, nosso progresso no domínio e compreensão dos poderes psiônicos poderá ser seriamente comprometido."
 shroud.2605.a: "Esmague a oposição."
 shroud.2605.b: "Tente apaziguá-los."
 dissenters_repressed_modifier: "Dissidentes Reprimidos"
 dissenters_repressed_modifier_desc: "Nossa sociedade não tolera ideologias antipsiônicas."
 performative_pluralism_modifier: "Pluralismo Performático"
 performative_pluralism_modifier_desc: "A ilusão de pluralismo psiônico é uma forma eficaz de conter a dissidência."
 # S3
 shroud.2610.name: "Comportamento Fraudulento"
 shroud.2610.desc: "À medida que nossas habilidades psiônicas se tornam mais poderosas, cresce também o número de relatos sobre exploração, trapaças e comportamentos fraudulentos entre nossa população. Uma minoria expressiva de [owner.GetSpeciesNamePlural] claramente está utilizando seus novos poderes de maneiras questionáveis.\n\nAs vítimas, indignadas, agora exigem uma reformulação das leis vigentes para garantir maior proteção contra crimes psiônicos."
 shroud.2610.a: "A legislação só atrasará nosso progresso."
 shroud.2610.b: "A população deve ser protegida."
 psionic_crime_modifier: "Crime Psiônico"
 psionic_crime_modifier_desc: "Certos excessos no uso do poder psiônico são o preço inevitável do progresso."
 psionic_crime_crackdown_modifier: "Repressão ao Crime Psiônico"
 psionic_crime_crackdown_modifier_desc: "Uma sociedade psiônica necessita de um sistema jurídico inovador."
 # S4
 shroud.2615.name: "Experimentos Imprudentes"
 shroud.2615.desc: "À medida que nossa população se adapta aos novos poderes, alguns grupos de [owner.GetSpeciesNamePlural] estão se lançando em práticas extremamente arriscadas para acelerar o desenvolvimento psiônico.\n\nO uso de [owner.GetMentalUpgrade] do mercado clandestino disparou. [owner.GetMedicalFacility] sem regulamentação estão oferecendo uma variedade de serviços não comprovados, prometendo maximizar as capacidades psiônicas dos indivíduos. É difícil prever o que resultará disso."
 shroud.2615.a: "Esses experimentos podem impulsionar nossa pesquisa."
 shroud.2615.b: "Devemos desativar [owner.GetMedicalFacilityShortPlural] ilegais."
 psionic_experimentation_modifier: "Experimentação Psiônica"
 psionic_experimentation_modifier_desc: "Métodos experimentais não comprovados para aprimorar habilidades psiônicas são comuns e populares."
 self_experimentation_controls_modifier: "Controles de Autoexperimentação"
 self_experimentation_controls_modifier_desc: "A população está proibida de realizar autoexperimentação psiônica sem regulamentação."
 # S5 (gestalt)
 shroud.2620.name: "Separação Psiônica"
 shroud.2620.desc: "Uma forma preocupante de segregação surgiu no território de [owner.GetName], com drones psiônicos se agrupando fisicamente, às vezes para longe do restante da [owner.GetHiveEntity].\n\nEmbora esses drones permaneçam [owner.GetMentalAdj] integrados ao coletivo, esse comportamento físico inexplicável levanta questões inquietantes sobre as possíveis consequências do fortalecimento de nossos poderes psiônicos."
 shroud.2620.a: "Observe esse fenômeno mais detalhadamente."
 shroud.2620.b: "Restrinja a movimentação dos drones psiônicos."
 psionic_cluster_gestalt_modifier: "Aglomerados Psiônicos"
 psionic_cluster_gestalt_modifier_desc: "A observação de comportamentos incomuns em drones psiônicos contribui para o progresso da pesquisa."
 restricted_movements_gestalt_modifier: "Movimentos Restritos"
 restricted_movements_gestalt_modifier_desc: "Os drones psiônicos devem ser controlados para o bem da unidade."
 # S5 (non-gestalt)
 shroud.2621.name: "Ostracismo Psiônico"
 shroud.2621.desc: "Uma forma preocupante de segregação surgiu em [owner.GetName], com indivíduos psiônicos sendo socialmente marginalizados a ponto de se isolarem e formarem comunas remotas.\n\nRelatos indicam que visitantes sem poderes psiônicos retornam fisicamente ilesos desses locais, mas apresentam distúrbios mentais difíceis de explicar."
 shroud.2621.a: "$shroud.2620.a$"
 shroud.2621.b: "Restrinja a movimentação de indivíduos psiônicos."
 psionic_cluster_modifier: "Comunas Psiônicas"
 psionic_cluster_modifier_desc: "A observação de comportamentos incomuns em indivíduos psiônicos contribui para o progresso da pesquisa."
 restricted_movements_modifier: "$restricted_movements_gestalt_modifier$"
 restricted_movements_modifier_desc: "Indivíduos psiônicos devem ser controlados para o bem da unidade."
 # S6 (organic)
 shroud.2625.name: "Doença Psiônica"
 shroud.2625.desc_common: "Apesar de sua natureza incomum, pesquisas recentes sobre esse estranho fenômeno psiônico indicam que ele pode ser manipulado de diversas formas."
 shroud.2625.desc: "Uma nova doença está se espalhando por [owner.GetName], fazendo com que nossa população desenvolva lesões inexplicáveis em seus órgãos neurais.\n\nA epidemia afeta exclusivamente [owner.GetIndividualNamePlural] com maiores capacidades psiônicas e, em muitos casos, tem se mostrado fatal.\n\n$shroud.2625.desc_common$"
 shroud.2625.a: "Priorize aplicações terapêuticas."
 shroud.2625.b: "Transforme essa doença em arma."
 therapeutic_psionics_organic_modifier: "Psiônica Terapêutica"
 therapeutic_psionics_organic_modifier_desc: "A proliferação de enfermidades psiônicas oferece uma oportunidade para desenvolvermos novos tratamentos médicos."
 weaponized_psionics_modifier: "Psiônica Militarizada"
 weaponized_psionics_modifier_desc: "A psiônica abre caminho para novas estratégias no campo de batalha."
 weaponized_psionics_gestalt_modifier: "$weaponized_psionics_modifier$"
 weaponized_psionics_gestalt_modifier_desc: "$weaponized_psionics_modifier_desc$"
 # S6 (machine)
 shroud.2626.name: "Falha Psiônica"
 shroud.2626.desc: "Um surto de defeitos inexplicáveis varreu [owner.GetName] conforme neuroprocessadores dentro de nossa população começaram a falhar abruptamente.\n\nCuriosamente, apenas [owner.GetIndividualNamePlural] que exibem alta assinatura psiônica estão sofrendo os efeitos. Na maioria dos casos a falha não é apenas prejudicial, mas destrutiva.\n\n$shroud.2625.desc_common$"
 shroud.2626.a: "Priorize aplicações corretivas."
 shroud.2626.b: "Transforme essa vulnerabilidade em arma."
 therapeutic_psionics_machine_modifier: "$therapeutic_psionics_organic_modifier$"
 therapeutic_psionics_machine_modifier_desc: "As falhas generalizadas de hardware atribuídas ao uso da psiônica oferecem uma oportunidade para desenvolvermos novos métodos de manutenção."
 # S7
 shroud.2630.name: "Experimentos Fracassados"
 shroud.2630.desc.common_1: "Os experimentos iniciais em [owner.GetIndividualNamePlural] com potencial psiônico terminaram em fracasso, deixando a maioria das cobaias com"
 shroud.2630.desc.common_2: "Embora esses resultados tenham algum valor para a pesquisa, ainda questionamos se prosseguir com esses experimentos é realmente a melhor forma de compreendermos nossos novos poderes psiônicos."
 shroud.2630.desc.default: "$shroud.2630.desc.common_1$ processadores lógicos danificados.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.desc.hive: "$shroud.2630.desc.common_1$ a função cognitiva reduzida.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.desc.machine: "$shroud.2630.desc.common_1$ uma perda significativa de memória.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.a: "Faça mais experimentos."
 shroud.2630.b: "Ponha um fim nisso."
 psionic_roll_chance_modifier: "Experimentação Psiônica"
 psionic_roll_chance_modifier_desc: "Não deve haver limites para nossas pesquisas sobre habilidades psiônicas."
 population_protections_modifier: "Proteção Populacional"
 population_protections_modifier_desc: "O progresso psiônico só poderá ser alcançado de forma segura."
 # S8
 shroud.2635.name: "Ascensão da Empatia"
 shroud.2635.desc.gestalt: "A exploração de nossas recém-descobertas habilidades psiônicas resultou em mudanças fundamentais na empatia dos [owner.GetSpeciesNamePlural].\n\nEstá claro que agora podemos compreender as perspectivas, padrões de pensamento e emoções de outras consciências. Resta saber se essas mudanças representam uma nova força ou uma vulnerabilidade para o futuro de [owner.GetName]."
 shroud.2635.desc.default: "À medida que nossa população explora suas recém-descobertas capacidades psiônicas, uma nova comunidade foi estabelecida com o objetivo de explorar essas habilidades em busca de um entendimento mais empático das demais consciências.\n\nEsse coletivo afirma ser capaz de compreender as perspectivas, padrões de pensamento e emoções de outras mentes graças a seus sentidos psiônicos emergentes. Resta saber se essas atividades trarão benefícios ou prejuízos para o futuro de [owner.GetName]."
 shroud.2635.a: "É uma oportunidade de aprendizado."
 shroud.2635.b: "Isso nos torna vulneráveis."
 empathetic_initiative_modifier: "Iniciativa Empática"
 empathetic_initiative_modifier_desc: "A natureza da psiônica permite uma compreensão mais profunda de outras mentes e viabiliza interações externas mais sofisticadas."
 empathetic_initiative_opinion_tooltip: "£opinion£ $OPINION$ com todos os impérios contatados: §G+$@empathetic_initiative_value|0$§!"
 opinion_empathetic_initiative: "$empathetic_initiative_modifier$"
 cautious_progress_modifier: "Progresso Cauteloso"
 cautious_progress_modifier_desc: "Desenvolvimentos psiônicos imprevisíveis devem ser controlados para garantir a segurança de nosso império."
 # S9
 shroud.2640.name: "Psiônicos Desviantes"
 shroud.2640.desc.common_1: "À medida que nossas habilidades psiônicas se desenvolvem, alguns indivíduos passaram a sofrer com o fardo desses novos poderes. O grupo de [owner.GetIndividualNamePlural] afetado"
 shroud.2640.desc.common_2: "Nossos estudos sugerem que essa instabilidade não é um defeito, mas sim resultado de uma eficiência psiônica excepcional em [Owner.GetSpeciesNamePlural] que apresentam a anormalidade. Com o treinamento adequado, esse grupo de [owner.GetIndividualNamePlural] pode representar o próximo passo em nossa evolução psiônica, mas qualquer tentativa de controlar essas novas habilidades envolverá riscos inevitáveis."
 shroud.2640.desc.gestalt: "$shroud.2640.desc.common_1$ apresenta níveis preocupantes de comportamento desviante, conforme se afasta do coletivo.\n\n$shroud.2640.desc.common_2$"
 shroud.2640.desc.default: "$shroud.2640.desc.common_1$ apresenta níveis alarmantes de comportamento autodestrutivo, na medida em que recorre a métodos perigosos de autossupressão.\n\n$shroud.2640.desc.common_2$"
 shroud.2640.a: "Explore essas habilidades excepcionais."
 shroud.2640.a.tt: "Uma construção aleatória é destruída em cada colônia."
 shroud.2640.b: "Devemos suprimir essas anomalias."
 psionic_specialization_modifier: "Especialização Psiônica"
 psionic_specialization_modifier_desc: "Graças a um rigoroso treinamento psiônico especializado, a produtividade aumentou significativamente."
 psionic_suppression_modifier: "Supressão Psiônica"
 psionic_suppression_modifier_desc: "Aqueles cujos poderes colocam em risco o bem maior devem ser devidamente contidos."
 psionic_suppression_gestalt_modifier: "$psionic_suppression_modifier$"
 psionic_suppression_gestalt_modifier_desc: "$psionic_suppression_modifier_desc$"
 # Stage Events
 # Mind over Matter
 shroud.2750.name: "Ascensão Psiônica"
 shroud.2750.desc_p1: "Desde tempos imemoriais, ecoam lendas sobre os [This.GetSpeciesNamePlural], uma espécie dotada de poderes extraordinários, capaz de invadir outras mentes, erguer objetos pesados apenas com o pensamento e realizar todo tipo de feito sobrenatural."
 shroud.2750.desc_p1_hive_mind: "Antigamente, quando o desvio era abundante, havia muitas histórias sobre [This.GetSpeciesNamePlural], uma espécie dotada de poderes extraordinários, capaz de invadir mentes de fora do coletivo, erguer objetos pesados apenas com o pensamento e realizar todo tipo de feito sobrenatural."
 shroud.2750.desc_p1_machine: "Desde os relatórios mais antigos, nossas unidades registraram [This.GetSpeciesNamePlural] demonstrando poderes extraordinários, como invadir a mente de máquinas e seres orgânicos, manipular objetos apenas por processamento interno e realizar uma série de outras funções improváveis."
 shroud.2750.desc_p1_unplugged: "Apesar da curta e violenta história de nossa civilização, nós, [This.GetSpeciesNamePlural], por vezes nos permitimos sonhar, contando histórias sobre indivíduos com poderes extraordinários: ler mentes, mover objetos pesados apenas com o pensamento ou realizar todo tipo de feito sobrenatural."
 shroud.2750.desc_p2: "Agora, nossa equipe de [This.GetScientistPlural] obteve provas conclusivas de que certos indivíduos [This.GetSpeciesNamePlural] são realmente capazes de realizar esses feitos mentais. Até o momento, apenas uma pequena parcela de nossa [This.GetSpeciesWord] manifestou tais poderes \"psiônicos\"."
 shroud.2750.desc_p2_unplugged: "Há quem diga que essas narrativas fantásticas nos acompanham desde muito antes de nossa assimilação por [origin_unplugged_assimilator_empire.GetName], embora poucos as considerem plausíveis. $shroud.2750.desc_p2$"
 shroud.2750.desc_p3: "[This.GetMindOverMatterEnding]"
 shroud.2750.desc_p3_default: "Esse poder parece essencial para alcançarmos nosso pleno potencial. Se essas habilidades latentes forem despertadas pelo povo [This.GetAdjective], estaremos prontos para dominar dimensões além da compreensão mundana."
 shroud.2750.desc_p3_crisis_4_5: "Já estamos sendo alimentados por energia psiônica extraída do §HVéu§!. Se despertarmos toda a capacidade psiônica do povo [This.GetAdjective], poderemos alcançar nosso verdadeiro potencial."
 shroud.2750.desc_p3_origins: "As forças psiônicas não nos são estranhas, graças à influência do §HVéu§!. Se despertarmos toda a capacidade psiônica do povo [This.GetAdjective], poderemos alcançar nosso potencial latente."
 shroud.2750.a: "$utopia.2600.a$"
 shroud.2750.a.tt: "Libera a aba §HVéu§!."
 # Establishing the Psi Corps
 shroud.2760.name: "Estabelecendo a $building_psi_corps$"
 shroud.2760.desc_p1: "À medida que nossas habilidades latentes evoluem para poderes psiônicos plenos, nossa sociedade enfrenta inúmeras transformações, com novas habilidades e práticas surgindo em ritmo acelerado. Estamos apenas começando a compreender as consequências para a nossa civilização."
 shroud.2760.desc_p2_psi_corps: "Desde a criação da §H$building_psi_corps$§!, temos desenvolvido e canalizado as habilidades psiônicas de [GetIndividualNamePlural] para lidar com essas condições sem precedentes. Usando $shroud.2760.desc_p2_end$"
 shroud.2760.desc_p2_no_psi_corps: "Essas circunstâncias sem precedentes justificam a criação de uma §H$building_psi_corps$§! para desenvolver e canalizar as habilidades de [Owner.GetIndividualNamePlural] com potencial psiônico promissor. Usando $shroud.2760.desc_p2_end$"
 shroud.2760.desc_p2_end: "sua percepção [Owner.GetTelepathic] sobre as mentes de nossa população, poderemos monitorar a atividade psiônica para garantir a segurança de todos."
 shroud.2760.a: "Confie na Brigada."
 shroud.2760.a_gestalt: "Depositamos nossa confiança na Brigada."
 shroud.2760.a_no_psi_corps: "Vamos construir essa \"$building_psi_corps$\"."
 shroud.2760.a_tt: "$shroud.2820.a.tt$"
 shroud.2760.a_tt_no_psi_corps: "Adote a tradição §H$tr_psionics_psi_corps$§! e construa uma ['building:building_psi_corps'] para avançar na Situação."
 # The Great Awakening
 shroud.2780.name: "$utopia.2650.name$"
 shroud.2780.desc_1: "Nossa pesquisa psiônica continua em ritmo acelerado. A telepatia substituiu a maior parte da comunicação verbal entre nós, e o controle cognitivo da matéria pode se tornar igualmente comum. Segundo um grupo de [Owner.GetResearchers], estamos prestes a despertar os poderes latentes em todo o povo [Owner.GetSpeciesAdj]."
 shroud.2780.desc_1_trad: "Despertamos. [Owner.GetSpeciesNamePlural] por todo o território de [Owner.GetName] atingiram seu potencial psiônico máximo. A telepatia substituiu a maior parte da comunicação verbal entre nós, e o controle cognitivo da matéria pode se tornar igualmente comum."
 shroud.2780.desc_1_gestalt_machine: "Nossa pesquisa psiônica continua em ritmo acelerado. Já somos capazes de nos comunicar por canais além dos convencionais, e uma variedade de outras habilidades psiônicas estão se tornando cada vez mais comuns. Segundo um grupo de [Owner.GetResearchers], estamos prestes a despertar as capacidades latentes em nossa população."
 shroud.2780.desc_1_gestalt_machine_trad: "Nossa hora chegou. [Owner.GetSpeciesNamePlural] por todo o território de [Owner.GetName] atingiram seu potencial psiônico máximo. Já somos capazes de nos comunicar por canais além dos convencionais, e uma variedade de outras habilidades psiônicas estão se tornando cada vez mais comuns."
 shroud.2780.desc_2: "Ao abrirmos as portas da mente, percebemos forças inefáveis pulsando dentro de nós e ao nosso redor. Nosso principal grupo de [Owner.GetTelepathPlural] fala sobre o §HVéu§!, um reino primordial de onde [Owner.GetIndividualNamePlural] com capacidades psiônicas extraem poder, ainda que de forma subconsciente; um lugar que é o lar de entidades poderosas feitas de pura energia psiônica. Como um sussurro abafado na escuridão, ouvimos seus chamados dentro de nossas próprias mentes."
 shroud.2780.desc_2_crisis: "Ao abrirmos as portas da mente, percebemos as forças inefáveis do §HVéu§! pulsando dentro de nós e ao nosso redor. Sabemos que [Owner.GetIndividualNamePlural] com capacidades psiônicas extraem poder desse reino, ainda que de forma subconsciente, e que ele abriga entidades poderosas feitas de pura energia psiônica. Como um sussurro abafado na escuridão, ouvimos seus chamados dentro de nossas próprias mentes."
 shroud.2780.desc_3: "Com um esforço cognitivo conjunto, talvez seja possível entrar em comunhão com esses seres, mas para isso precisamos aprender como romper o manto entre nossa dimensão e o Véu."
 shroud.2780.desc_3_chosen: "Com um esforço cognitivo conjunto, talvez seja possível atravessar o manto entre nossa dimensão e o Véu completamente, nos permitindo entrar em contato com os seres que residem lá."
 shroud.2780.a: "É hora de despertar."
 shroud.2780.a_trad: "$utopia.2655.a$"
 shroud.2780.a_tt: "Adote a tradição §H$tr_psionics_shroud_great_awakening$§! para:$TABBED_NEW_LINE$- $tr_psionics_psionic_assimilation_desc$$TABBED_NEW_LINE$- $shroud.2780.a_tt_2$"
 shroud.2780.a_tt_2: "$CONTINUE_SITUATION$ §H$situation_breach_shroud$§!"
 shroud.2780.a_tt_trad: "$tr_psionics_psionic_assimilation_desc$\n$shroud.2780.a_tt_2$"
 # The Shroud Breached
 shroud.2800.name: "$BREACHING_SHROUD_PROJECT$"
 shroud.2800.intro: "Após dias presos em transe [Owner.GetHypnotic], finalmente conseguimos abrir um breve portal para o §HVéu§!.\n\nAgora, podemos [Owner.GetSeeVerb] esse plano com mais clareza e distinguir padrões dentro da massa caótica."
 shroud.2800.desc: "$shroud.2800.intro$ Nossas ações influenciam os fluxos instáveis de energia psiônica, e entidades sem forma nos observam do outro lado; às vezes com curiosidade, outras com benevolência... e outras ainda com malícia.[Owner.GetShroudBreachedExtra]\n\nNosso domínio psiônico no plano corpóreo foi apenas o começo. Agora que estabelecemos um elo psiônico inicial, podemos unir nossos poderes cognitivos e mergulhar no Véu."
 shroud.2800.desc_extra: " Seus protocolos são ainda mais enigmáticos que os d$the_animator_of_clay_color_article$."
 shroud.2800.desc_extra_chosen: " Alguns possuem poder comparável à entidade §H[GetChosenPatron]§!, embora sejam bem diferentes em intento."
 shroud.2800.a: "$utopia.2656.a$"
 shroud.2810.desc: "§HNova conexão. Corrente invertida.\n\nEsta distorção de energia... apenas um fragmento. Os outros também podem fortalecê-los. Aprofundem-se para compreender suas vontades.\n\nSou uma sombra do par. A carne antecede o metal. Ela chama...§!\n\n$the_animator_of_clay_article_cap$ sinaliza outra presença... $shroud.first_contact_insert.composer$ nas profundezas do Véu."
 shroud.2810.a: "$utopia.2657.a$"
 # Shroud-Touched
 shroudwalkers_opinion_shroud_seals_tt: "Opinião: £opinion£ §R$@shroudwalkers_opinion_shroud_seals|0$§!"
 shroudwalker_teacher_conflicted_leader: "§RNão deve ter um líder de [event_target:mindwarden_enclave_country.GetName].§!"
 shroud.5300.b: "Desejamos entrar em §Ycomunhão§! com outras entidades do Véu."
 shroud.5300.c: "Buscamos aprofundar nossa §Ysintonia§! com uma Entidade Patronal."
 shroud.5300.d: "Procuramos §Ysegredos§! ocultos no Véu."
 shroud.5300.e: "O que você pode nos dizer sobre as §Y$PSIONIC_AURA_PLURAL$§!?"
 shroud.5300.f: "Ajude-nos a fortalecer nossa §Y$PSIONIC_AURA$§!."
 shroud.5300.g: "Queremos expandir o §Ydomínio§! de nossa Entidade Patronal."
 shroud.5305.desc: "A comunhão com os domínios do §HVéu§! tem se revelado uma tarefa perigosa para os despreparados.\n\nPodemos guiá-los nesse processo, mas saibam: pode ser extremamente perigoso abrir suas mentes para as entidades que habitam o Véu."
 shroud.5305.desc_all_contacted: "Não podemos mais ajudá-los nessa questão. Não existem outras entidades às quais possamos conduzir seus pensamentos.\n\nReconhecemos seus esforços... poucos se aprofundam tanto nos domínios do §HVéu§! e retornam com a mente ilesa."
 shroud.5305.b: "Podemos bancar esse esforço com §Y$sr_zro$§!."
 shroud.5305.c: "Podemos bancar esse esforço com §Y$astral_threads$§!."
 shroudwalker_contact_patron_cooldown_tt: "§RDevemos esperar até §Y[This.shroudwalker_contact_patron_cooldown_timer]§!.§!"
 shroud.5310.desc: "Quanto mais profunda sua sintonia com a vontade do §HVéu§!, mais poderosa sua mente se tornará.\n\nCom qual entidade você deseja aprofundar sua sintonia?"
 shroudwalker_attune_patron_cooldown_tt: "§RDevemos esperar até §Y[This.shroudwalker_attune_patron_cooldown_timer]§!.§!"
 shroud.5315.desc: "Ah sim... O §HVéu§!. Ele pulsa com segredos encobertos por incontáveis mantos de pensamento e sonho, se souber como procurá-los.\n\nPodemos apenas guiá-los para a sabedoria que descobrimos. A partir de então, tecnologias novas e formidáveis florescerão, mas o caminho é seu para trilhar.\n\nMas saibam que nossos telepatas devem se dedicar completamente a esta tarefa. O que jaz além da orientação deles... não se submete ao nosso controle."
 shroud.5315.b: "$shroud.5305.b$"
 shroud.5315.c: "$shroud.5305.c$"
 shroud.5315.trigger_failed: "§RNada mais poderá ser revelado por [event_target:shroudwalker_enclave_country.GetName] sobre esse assunto.§!"
 shroudwalker_delving_ritual_cooldown_tt: "§ROs telepatas precisam de tempo para se recuperar. Eles não serão capazes de conduzir outro ritual de mergulho até §Y[This.shroudwalker_delving_ritual_cooldown_timer]§!.§!"
 shroud.5318.desc: "O §HVéu§! mais uma vez prova que não existem coincidências.\n\nA revelação que nosso conclave buscava foi descoberta por mérito seu. Reconhecemos seus esforços, mas não podemos ajudá-los além deste ponto."
 shroud.5320.desc.none: "A capacidade de manifestar o §HVéu§! no plano físico é um segredo guardado a sete chaves, algo que nem nós podemos ensinar. Despertar a própria $PSIONIC_AURA$ exige uma jornada pessoal pelos domínios do Véu. Conecte-se de forma mais profunda a uma entidade de sua escolha, e esse conhecimento se tornará claro em sua mente."
 shroud.5320.desc.aura.intro: "Sua $PSIONIC_AURA$ é a manifestação de sua sintonia com o §HVéu§!. Ela influencia tudo ao seu redor, e é carregada de intenção. Ao conversamos, nosso clã sente a natureza da sua aura:"
 shroud.5320.desc.aura.outro: "Por enquanto, a projeção da sua aura ainda é limitada. Mas se uma entidade do Véu lhe oferecer um Pacto, tudo ficará claro em sua mente."
 shroud.5320.desc.aura.eater: "$shroud.5320.desc.aura.intro$ uma textura §Hvoraz§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.cradle: "$shroud.5320.desc.aura.intro$ uma textura §Hacolhedora§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.instrument: "$shroud.5320.desc.aura.intro$ uma textura §Hindulgente§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.composer: "$shroud.5320.desc.aura.intro$ uma textura §Hcontorcida§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.whisperers: "$shroud.5320.desc.aura.intro$ uma textura §Hsagaz§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.intensified: "Nós lhe saudamos. Seu conhecimento sobre $PSIONIC_AURA_PLURAL$ já supera o nosso.\n\nSua própria presença manifesta uma textura poderosa do §HVéu§! nesta realidade. Que segredos você deve guardar...?"
 shroud.5325.desc: "A amplificação das §Y$PSIONIC_AURA_PLURAL$§! exige níveis elevados de concentração para ser mantida.\n\nEstamos dispostos a ajudá-los, mas será necessária uma contribuição de materiais para sustentar nossa meditação."
 shroud.5325.zro: "$shroud.5305.b$"
 shroud.5325.thread: "$shroud.5305.c$"
 aura_amplification_cooldown_tt: "§ROs telepatas precisam de tempo para se recuperar. Eles não serão capazes de amplificar nossa aura até §Y[root.aura_amplification_timer]§!.§!"
 aura_amplification_modifier: "Amplificação de Aura"
 shroud.5327.desc: "Nossos telepatas chegaram ao fim do acordo para amplificar a força de sua §Y$PSIONIC_AURA$§!.\n\nPara que seja possível continuarmos nossas meditações, precisamos de recursos adicionais. Ainda tem interesse?"
 shroud.5327.a.zro: "Providenciaremos §H$sr_zro$§!."
 shroud.5327.a.thread: "Providenciaremos §H$astral_threads$§!."
 shroud.5327.b: "Não desta vez."
 shroud.5330.desc: "Como bem sabe, manifestar sua §Y$PSIONIC_AURA$§! nos arredores é algo relativamente simples. Projetá-la para outro local, no entanto, é algo muito mais complexo.\n\nMas nós conhecemos um método...\n\nHá mais similaridades entre a tecnologia avançada e a psiônica do que se imagina. Talvez isso revele uma verdade mais profunda. De qualquer forma, sabemos da existência de um dispositivo que pode agir como canalizador da sua vontade. Uma vez sintonizado às suas frequências, ele funcionará como uma mente auxiliar, mesmo a longas distâncias.\n\nNossos projetos podem ser instalados em qualquer base estelar compatível. Tal máquina é de seu interesse?"
 shroud.5330.zro: "Podemos oferecer §H$sr_zro$§!."
 shroud.5330.thread: "Podemos oferecer §H$astral_threads$§!."
 shroud.5350.desc: "Essa pergunta já era esperada. Há muito sentimos seu interesse por essa área, e é uma honra poder ajudá-los a expandir suas mentes.\n\nMas saibam: quando seus olhos se abrirem para a verdade, haverá coisas que não poderão mais ser ignoradas. O caminho à frente conduz ao §HVéu§!.\n\nNão fazemos essa oferta de forma leviana. Confiamos que vocês nos avisarão quando for a hora."
 shroud.5350.b: "Nós pagaremos."
 shroud.5350.trigger_failed: "§REsta tecnologia já foi pesquisada.§!"
 shroud.5355.desc: "De fato, temos conhecimento daqueles que transitam entre planos. É uma premissa perigosa, pois os planos físicos estão conectados de maneiras que nem mesmo nós compreendemos.\n\nAinda assim, estamos dispostos a abrir um caminho para você. Tal desestabilização do tempo e do espaço deve ser feita de forma responsável, é isso o que nossa oferta exige."
 shroud.5355.b: "Abra o caminho."
 shroud.5375.desc: "Vocês estão lidando com forças além de sua compreensão!\n\nEssas abominações que estão construindo, os tais \"§HSelos do Véu§!\", são difíceis de suportar, mesmo a distância. Suas ações colocam em risco as mentes mais brilhantes da galáxia. Interrompam imediatamente sua criação, ou não faremos mais acordo algum com vocês."
