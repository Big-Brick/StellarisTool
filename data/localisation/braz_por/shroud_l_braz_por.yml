 shroud.1510.title: "$PSIONIC_AURA$ em Conflito"
 shroud.1510.desc: "Nossa §H$PSIONIC_AURA$§! no sistema [from.GetName] está em conflito com uma Aura oposta, originada no sistema vizinho [fromfrom.GetName]. Nossa equipe psiônica de [GetResearchers] previu esse tipo de comportamento, mas é a primeira vez que presenciamos o fenômeno em ação.\n\nEm teoria, a Aura mais potente, aquela projetada com maior intensidade, enfraquecerá gradualmente a força adversária. Se essa disputa levar à extinção total de um dos lados, a Aura dominante poderá se expandir e ocupar o sistema vazio.\n\nÉ uma verdadeira batalha de mentes."
 shroud.1510.a: "Nossa vontade triunfará."
 shroud.1550.title: "O Poder da Vontade"
 shroud.1550.desc.common_1: "Nossas incursões no §HVéu§! vêm provocando manifestações de energia no espaço observável. Embora significativos, esses efeitos têm sido intermitentes e isolados."
 shroud.1550.desc.common_2: "Nossas ações reverberam através do Véu, atraindo a atenção de seres de imenso poder. Se conquistarmos o favor dessas entidades, poderemos canalizar sua energia psiônica para a realidade corpórea. Nossa equipe de [GetTelepathPlural] especula que a \"aura\" resultante fortalecerá nosso império,"
 shroud.1550.desc_1.knows: "$shroud.1550.desc.common_1$ As §H\"$PSIONIC_AURA_PLURAL$\"§! apresentam um meio de transformar essa influência em um fluxo constante."
 shroud.1550.desc_1.default: "$shroud.1550.desc.common_1$ A teoria das §H\"$PSIONIC_AURA_PLURAL$\"§! apresentam um meio de transformar essa influência em um fluxo constante."
 shroud.1550.desc.knows: "$shroud.1550.desc_1.knows$\n\n$shroud.1550.desc.common_2$ bem como nossos aliados, enquanto enfraquece aqueles que se opõem a nós, conforme já observamos anteriormente."
 shroud.1550.desc.knows.homicidal: "$shroud.1550.desc_1.knows$\n\n$shroud.1550.desc.common_2$ enquanto enfraquece aqueles que se opõem a nós, conforme já observamos anteriormente."
 shroud.1550.desc.default: "$shroud.1550.desc_1.default$\n\n$shroud.1550.desc.common_2$ bem como nossos aliados, enquanto enfraquece aqueles que se opõem a nós."
 shroud.1550.desc.default.homicidal: "$shroud.1550.desc_1.default$\n\n$shroud.1550.desc.common_2$ enquanto enfraquece aqueles que se opõem a nós."
