 # Eater of Worlds
 shroud.4500.title: "$utopia.3304.name$"
 shroud.4500.desc.default: "[GetEaterCovenantProposedEvent]"
 shroud.4500.desc.hive: "$shroud.4500.desc.default$"
 shroud.4500.desc.gestalt_machine: "$shroud.4500.desc.default$"
 shroud.4500.desc.individual_machine: "$shroud.4500.desc.default$"
 shroud.4500.desc.1: "Enquanto avançamos pelo Véu, sentimos a fome insaciável de uma entidade taciturna. "
 shroud.4500.desc.pacifist: "$shroud.4500.desc.1$$utopia.3306.desc.2$\n\nSua impaciência é ameaçadora. Será que nossas mentes conseguiriam abraçar tal monstruosidade?"
 shroud.4500.desc.non_pacifist: "$shroud.4500.desc.1$$utopia.3306.desc.2$\n\nEla parece impaciente para começar."
 shroud.4500.a: "Formar um Pacto com $the_eater_of_worlds_color_article$."
 shroud.4505.desc.intro: "Está feito. Firmamos um Pacto com $the_eater_of_worlds_color_article$. Sua vontade agora pulsa por todo o território de §H[Root.GetName]§!."
 shroud.4505.desc.outro: "Ao selarmos nosso acordo, a Comedora cobrou seu tributo: toda a população de uma de nossas cidades desapareceu subitamente. Um pequeno preço a se pagar – a menos que a Comedora sinta fome novamente."
 shroud.4505.desc.default: "$shroud.4505.desc.intro$\n\n[GetEaterCovenantFormedDesc]\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc.hive: "$shroud.4505.desc.intro$\n\n[GetEaterCovenantFormedDesc]\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc.gestalt_machine: "$shroud.4505.desc.hive$"
 shroud.4505.desc.individual_machine: "$shroud.4505.desc.intro$\n\nAs mudanças em nossa sociedade já são detectáveis. Nossas unidades militares estão cada vez mais concentradas na batalha. Em tempos de paz, devem estar constantemente envolvidas em simulações de combate para evitar que sua inquietação se torne selvageria.\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc_2_pacifist: "Mudanças em nossa sociedade já estão sendo percebidas. Nossas mentes estão em conflito, com um viés para a batalha. Essa dissonância cognitiva está causando grande desconforto entre nossa população normalmente pacífica. Será que fizemos a escolha correta?"
 shroud.4505.desc_2_organic_non_gestalt: "As mudanças em nossa sociedade já são perceptíveis. Nossas Forças Armadas estão cada vez mais sedentas por combate. Em tempos de paz, devem estar constantemente envolvidas em treinamentos intensos para evitar que sua inquietação se torne selvageria."
 shroud.4505.desc_2_machine_non_gestalt: "As mudanças em nossa sociedade já são detectáveis. Nossas unidades militares estão cada vez mais concentradas na batalha. Em tempos de paz, devem estar constantemente envolvidas em simulações de combate para evitar que sua inquietação se torne selvageria."
 shroud.4505.desc_2_gestalt: "As mudanças em nossa sociedade já são detectáveis. Nossos grupos de [GetIndividualNamePlural] militares estão cada vez mais concentrados na batalha. Em tempos de paz, devem estar constantemente envolvidos em simulações de combate para evitar um estado de agressividade indevida."
 shroud.4505.a.default: "Esperamos que não."
 shroud.4505.a.gestalt: "Valeu a pena."
 shroud.4510.desc.intro: "Já se passou algum tempo desde que estabelecemos as bases de um Pacto com "
 shroud.4510.desc.outro: "Nosso vínculo continua fraco, e ainda temos a possibilidade de encerrá-lo – ou de fortalecê-lo.\n\nNossa equipe de [GetTelepathPlural] determinou que fazer o juramento nos permitirá extrair ativamente os poderes concedidos por nossa entidade patronal, assim como prover aprimoramentos para nossas frotas e $PSIONIC_AURA$."
 shroud.4510.desc: "$shroud.4510.desc.intro$$the_eater_of_worlds_color_article$$shroud.4510.desc.outro$"
 shroud.4510.b: "Renegar $the_eater_of_worlds_color_article$."
 shroud_eater_covenant_chain_title: "$eater_covenant_chain_title$"
 shroud_eater_covenant_chain_desc.intro: "Criamos um vínculo com uma entidade do Véu conhecida como $the_eater_of_worlds_color_article$. Insaciável, ela nos concede fragmentos de seu poder, por um preço.\n\nSegundo nossa equipe de [GetTelepathPlural], poderemos fortalecer essa ligação se passarmos a agir conforme a vontade de nossa entidade patronal."
 shroud_eater_covenant_chain_desc: "$shroud_eater_covenant_chain_desc.intro$\n\nA Comedora está faminta. Ela anseia pela guerra, o doce sabor do conflito e do lamento."
 shroud_eater_covenant_chain_begin: "$eater_covenant_chain_begin$"
 shroud_eater_covenant_chain_end: "$eater_covenant_chain_end$"
 robot_shroud_eater_covenant_chain_title: "$shroud_eater_covenant_chain_title$"
 robot_shroud_eater_covenant_chain_desc: "$shroud_eater_covenant_chain_desc.intro$\n\nA Comedora está faminta. Ela anseia pela guerra, o doce sabor do fogo e da ruína."
 # Instrument of Desire
 shroud.4550.title: "$utopia.3304.name$"
 shroud.4550.desc.default: "Assim que entramos no Véu, uma presença nos contatou. Seus pensamentos se enroscam e serpenteiam ao redor das mentes de nossa equipe de [GetTelepathPlural], barganhando, persuadindo. É $the_instrument_of_desire_color_article$, e ele nos oferece riqueza, poder, prestígio... tudo o que já desejamos. Tudo o que um dia desejaremos.\n\nO preço? Irrelevante, uma mera formalidade. Ele só deseja o nosso bem. Irá nos ajudar, guiar, moldar nossas ambições e sonhos.\n\n§HBasta aceitá-lo em nossos corações.§!\n\nEle tem certeza de que diremos sim. Como poderíamos recusar?"
 shroud.4550.desc.hive: "$shroud.4550.desc.default$"
 shroud.4550.desc.gestalt_machine: "Assim que entramos no Véu, uma presença nos contatou. Seus pensamentos se enroscam e serpenteiam ao redor dos circuitos de nossa equipe de [GetTelepathPlural], barganhando, persuadindo. É $the_instrument_of_desire_color_article$, e ele nos oferece riqueza, poder, prestígio... tudo o que já desejamos. Tudo o que um dia desejaremos.\n\nO preço? Irrelevante, uma mera formalidade. Ele só deseja o nosso bem. Irá nos ajudar, guiar, moldar nossas ambições e sonhos.\n\n§HBasta aceitá-lo em nossos mainframes.§!\n\nEle tem certeza de que diremos sim. Como poderíamos recusar?"
 shroud.4550.desc.individual_machine: "$shroud.4550.desc.gestalt_machine$"
 shroud.4550.a: "Formar um Pacto com $the_instrument_of_desire_color_article$."
 shroud.4555.desc.intro: "Está feito. Firmamos um Pacto com $the_instrument_of_desire_color_article$. Sua vontade agora pulsa por todo o território de §H[Root.GetName]§!."
 shroud.4555.desc.outro: "Este é o preço de nosso vínculo. Segundo nossa equipe de [GetTelepathPlural], as maiores bênçãos do Instrumento ainda estão por vir."
 shroud.4555.desc.default: "$shroud.4555.desc.intro$\n\nJá é possível notar as consequências do acordo. Enquanto aguardamos a prometida era de ouro rica e próspera, o povo deixou de se contentar com o mínimo para viver. [Root.GetSpeciesNamePlural] agora anseiam por todo tipo de bem material, o que gera uma nova pressão sobre nossa economia.\n\n$shroud.4555.desc.outro$"
 shroud.4555.desc.hive: "$shroud.4555.desc.intro$\n\nJá é possível detectar as consequências do acordo. Enquanto aguardamos a prometida era de ouro de produtividade incomparável, as necessidades básicas de nossos drones aumentaram. [Root.GetSpeciesNamePlural] em toda parte agora exigem uma gama de bens não essenciais, o que gera uma nova pressão sobre nossa economia.\n\n$shroud.4555.desc.outro$"
 shroud.4555.desc.gestalt_machine: "$shroud.4555.desc.hive$"
 shroud.4555.desc.individual_machine: "$shroud.4555.desc.default$"
 shroud.4555.a.default: "Resta-nos torcer para que estejam certos."
 shroud.4555.a.gestalt: "Confiamos que estejam certos."
 shroud.4560.desc: "$shroud.4510.desc.intro$$the_instrument_of_desire_color_article$$shroud.4510.desc.outro$"
 shroud.4560.b: "Renegar $the_instrument_of_desire_color_article$."
 shroud_instrument_covenant_chain_title: "$instrument_covenant_chain_title$"
 shroud_instrument_covenant_chain_desc.intro: "Criamos um vínculo com uma entidade do Véu conhecida como §HInstrumento de Desejo§!. Atencioso, ele nos concede migalhas de seu poder, por um preço. E tudo indica que há mais por vir.\n\nSegundo nossa equipe de [GetTelepathPlural], poderemos fortalecer essa ligação se passarmos a agir conforme a vontade de nossa entidade patronal."
 shroud_instrument_covenant_chain_desc: "$shroud_instrument_covenant_chain_desc.intro$\n\nO Instrumento anseia pelo desejo. Prazeres indulgentes, decadência e escravidão definem a essência do Instrumento."
 shroud_instrument_covenant_chain_begin: "$instrument_covenant_chain_begin$"
 shroud_instrument_covenant_chain_end: "$instrument_covenant_chain_end$"
 robot_shroud_instrument_covenant_chain_title: "$shroud_instrument_covenant_chain_title$"
 robot_shroud_instrument_covenant_chain_desc: "$shroud_instrument_covenant_chain_desc.intro$\n\nO Instrumento anseia pelo desejo. Consumo desenfreado, exploração e escravidão definem a essência do Instrumento."
 # Cradle of Souls
 shroud.4600.title: "$utopia.3304.name$"
 shroud.4600.desc.default: "[GetCradleCovenantProposedDesc]"
 shroud.4600.desc.hive: "$shroud.4600.desc.default$"
 shroud.4600.desc.gestalt_machine: "$shroud.4600.desc.default$"
 shroud.4600.desc.individual_machine: "$shroud.4600.desc.default$"
 shroud.4600.desc_homicidal: "Conforme nos aprofundamos no Véu, uma presença invade nossa visão interior. O brilho predominante ofusca todo o resto. É $the_cradle_of_souls_color_article$ e ele queima em nosso âmago.\n\nEle exige nada menos que concessão em escala galáctica, uma paz abjeta entre seres incompatíveis. Ele promete que um grande poder nos espera, se aceitarmos essa visão detestável.\n\n§HSe ao menos deixássemos que ele moldasse novos horizontes.§!\n\nA luz do Berço é implacável e seu poder é inegável. Poderiam nossas mentes abraçar tal coisa? Ou isso enfraquecerá nossa determinação?"
 shroud.4600.desc_non_homicidal: "À medida que nossas mentes mergulham no Véu, uma presença desperta dentro de nós. Sentimos um brilho que toca todas as coisas, irradiando ordem e equilíbrio. É $the_cradle_of_souls_color_article$, e algo nele nos toca profundamente.\n\nSeu desejo é nada menos que a paz duradoura, uma galáxia livre do caos. Se compartilharmos de sua visão, ele poderá nos tornar arautos da harmonia. Sua promessa é a de um laço de confiança inabalável.\n\n§HBasta permitirmos que ele molde nossos horizontes.§!\n\nAs esperanças do Berço recaem sobre nós."
 shroud.4600.a: "Formar um Pacto com $the_cradle_of_souls_color_article$."
 shroud.4605.intro: "Está feito. Firmamos um Pacto com $the_cradle_of_souls_color_article$. Sua vontade agora pulsa por todo o território de §H[Root.GetName]§!."
 shroud.4605.desc.default: "$shroud.4605.desc.non_gestalt$"
 shroud.4605.desc.gestalt: "$shroud.4605.intro$\n\n[GetCradleCovenantFormedDesc]"
 shroud.4605.desc.non_gestalt: "$shroud.4605.intro$\n\n[GetCradleCovenantFormedDesc]"
 shroud.4605.desc.hive: "$shroud.4605.desc.gestalt$"
 shroud.4605.desc.gestalt_machine: "$shroud.4605.desc.gestalt$"
 shroud.4605.desc.individual_machine: "$shroud.4605.desc.non_gestalt$"
 shroud.4605.desc_outro_homicidal: "O impacto na psique do povo [Root.GetSpeciesAdj] já é inquestionável. As mentes de incontáveis [Root.GetIndividualPlural] foram corrompidas por pensamentos de paz galáctica, causando uma profunda dissonância em nossa sociedade.\n\nDe acordo com nossa equipe de [GetTelepathPlural], as bênçãos dessa barganha ainda estão por vir. Até lá, um conflito terrível assola nossas mentes. O que fizemos com nós mesmos?"
 shroud.4605.desc_outro_gestalt: "O impacto na psique do povo [Root.GetSpeciesAdj] já é perceptível. Enquanto buscamos relações pacíficas por toda a galáxia, qualquer discórdia com nossos vizinhos causará distúrbios na consciência coletiva.\n\nEsse pequeno transtorno é o preço de nosso vínculo. Segundo nossa equipe de [GetTelepathPlural], as maiores bênçãos do Berço ainda estão por vir."
 shroud.4605.desc_outro_non_gestalt: "O impacto na psique do povo [Root.GetSpeciesAdj] já é aparente. Enquanto ansiamos por relações pacíficas por toda a galáxia, qualquer discórdia com nossos vizinhos causará angústia a toda a população.\n\nEsse pequeno transtorno é o preço de nosso vínculo. Segundo nossa equipe de [GetTelepathPlural], as maiores bênçãos do Berço ainda estão por vir."
 shroud.4605.a.default: "[GetCradleCovenantFormedOption]"
 shroud.4605.a.gestalt: "[GetCradleCovenantFormedOption]"
 shroud.4605.opt.a.default: "Resta-nos torcer para que estejam certos."
 shroud.4605.opt.a.gestalt: "Confiamos que estão certos."
 shroud.4605.opt.a.homicidal: "Por enquanto, só podemos resistir."
 shroud.4610.desc: "$shroud.4510.desc.intro$$the_cradle_of_souls_color_article$$shroud.4510.desc.outro$"
 shroud.4610.b: "Renegar $the_cradle_of_souls_color_article$."
 shroud_cradle_covenant_chain_title: "$the_cradle_of_souls$"
 shroud_cradle_covenant_chain_desc: "Criamos um vínculo com uma entidade do Véu conhecida como $the_cradle_of_souls_color_article$. Harmonioso, ele nos concede fragmentos de seu poder, por um preço.\n\nSegundo nossa equipe de [GetTelepathPlural], poderemos fortalecer essa ligação se passarmos a agir conforme a vontade de nossa entidade patronal.\n\nO Berço anseia por uma galáxia livre do caos e do conflito, onde todos os seres se alinham em prol de um único propósito: a paz. O equilíbrio perfeito é a única solução."
 shroud_cradle_covenant_chain_begin: "$BEGINS_EVENT_CHAIN$ §Y$shroud_cradle_covenant_chain_title$§!"
 shroud_cradle_covenant_chain_end: "$ENDS_EVENT_CHAIN$ §Y$shroud_cradle_covenant_chain_title$§!"
 robot_shroud_cradle_covenant_chain_title: "$shroud_cradle_covenant_chain_title$"
 robot_shroud_cradle_covenant_chain_desc: "$shroud_cradle_covenant_chain_desc$"
 # Composer of Strands
 shroud.4650.title: "$utopia.3304.name$"
 shroud.4650.desc.default: "Uma presença nos aguarda no Véu, acolhendo-nos com uma familiaridade cordial. Sua comunicação não se dá por meio de palavras, mas de visões, conceitos, ideais. Ela se infiltra na mente de nossa equipe de [GetTelepathPlural] com tanta delicadeza que parece sempre ter estado ali. Uma série de imagens se manifesta.\n\nEssa presença, conhecida como $the_composer_of_strands_color_article$, observa nossas formas orgânicas com curiosidade. Ela nos mostra diversas maneiras de cultivá-las, transformá-las. Aprimorá-las. Evoluí-las.\n\n§HBasta aceitarmos sua essência em nossa carne.§!\n\nEla aguarda nossa resposta com paciência e afeto. Como uma mãe zelosa à espera de seu filho favorito."
 shroud.4650.desc.hive: "$shroud.4650.desc.default$"
 shroud.4650.desc.gestalt_machine: "Uma presença nos aguarda no Véu, acolhendo-nos com uma familiaridade cordial. Sua comunicação não se dá por meio de palavras, mas por visões, conceitos, ideais. Ela se infiltra nos circuitos de nossa equipe de [GetTelepathPlural] com tanta delicadeza que parece sempre ter estado ali. Uma série de imagens se manifesta.\n\nEssa presença, conhecida como $the_composer_of_strands_color_article$, observa nossas formas mecânicas com curiosidade. Ela nos mostra diversas maneiras de adaptá-las, transformá-las. Aprimorá-las. Evoluí-las.\n\n§HBasta aceitarmos sua essência em nossos componentes.§!\n\nEla aguarda nossa resposta com paciência e afeto. Como uma mãe zelosa à espera de seu filho favorito."
 shroud.4650.desc.individual_machine: "$shroud.4650.desc.gestalt_machine$"
 shroud.4650.a: "Formar um Pacto com $the_composer_of_strands_color_article$."
 shroud.4655.desc.intro: "Está feito. Firmamos um Pacto com $the_composer_of_strands_color_article$. Sua vontade agora pulsa por todo o território de §H[Root.GetName]§!."
 shroud.4655.desc.outro: "Está claro que abrimos mão de parte do controle sobre a forma do povo [Root.GetSpeciesAdj], agora sujeita à vontade de nossa entidade patronal.\n\nUm pequeno sacrifício diante do vínculo recém-formado. Segundo nossa equipe de [GetTelepathPlural], as maiores bênçãos da Compositora ainda estão por vir."
 shroud.4655.desc.default: "$shroud.4655.desc.intro$\n\nNossa equipe de [GetScientistPlural] já detectou padrões anômalos na estrutura genética das amostras do povo [Root.GetSpeciesAdj], como se muitas gerações de mudanças evolutivas tivessem ocorrido da noite para o dia. $shroud.4655.desc.outro$"
 shroud.4655.desc.hive: "$shroud.4655.desc.default$"
 shroud.4655.desc.individual_machine: "$shroud.4655.desc.intro$\n\nNossa equipe de [GetScientistPlural] já detectou padrões anômalos na estrutura molecular das amostras de circuitos do povo [Root.GetSpeciesAdj], como se muitas gerações de aprimoramentos de sistema tivessem ocorrido da noite para o dia. $shroud.4655.desc.outro$"
 shroud.4655.desc.gestalt_machine: "$shroud.4655.desc.individual_machine$"
 shroud.4655.a.default: "$covenant.composer.option$"
 shroud.4655.a.gestalt: "Este é o preço do poder."
 shroud.4660.desc: "$shroud.4510.desc.intro$$the_composer_of_strands_color_article$$shroud.4510.desc.outro$"
 shroud.4660.b: "Renegar $the_composer_of_strands_color_article$."
 shroud_composer_covenant_chain_title: "$composer_covenant_chain_title$"
 shroud_composer_covenant_chain_desc.intro: "Criamos um vínculo com uma entidade do Véu conhecida como $the_composer_of_strands_color_article$. Acolhedora, ela nos concede fragmentos de seu poder, por um preço. E tudo indica que há mais por vir.\n\nSegundo nossa equipe de [GetTelepathPlural], poderemos fortalecer ainda mais essa ligação se passarmos a agir conforme a vontade de nossa entidade patronal."
 shroud_composer_covenant_chain_desc: "$shroud_composer_covenant_chain_desc.intro$\n\nA Compositora deseja manipular a genética e libertar a carne das amarras da evolução. Ela prega o respeito à vida e à natureza, e nos conta sobre a santidade da carne."
 shroud_composer_covenant_chain_begin: "$composer_covenant_chain_begin$"
 shroud_composer_covenant_chain_end: "$composer_covenant_chain_end$"
 robot_shroud_composer_covenant_chain_title: "$shroud_composer_covenant_chain_title$"
 robot_shroud_composer_covenant_chain_desc: "$shroud_composer_covenant_chain_desc.intro$\n\nA Compositora deseja manipular a forma física e estimular um crescimento além dos limites naturais. Ela prega o respeito à vida e à natureza, e nos conta sobre a santidade da carne."
 # Whisperers in the Void
 shroud.4700.title: "$utopia.3304.name$"
 shroud.4700.desc: "$utopia.3304.desc.shroud$"
 shroud.4700.a: "Formar um Pacto com $whisperers_in_the_void_color_article$."
 shroud.4700.b: "$shroud.reject_covenant$"
 shroud_whisperers_in_the_void_covenant_formed_effect: "$t$£unity£ $mod_country_base_unity_produces_add$: §R-15%§!"
 shroud.4705.desc.intro: "Está feito. Firmamos um Pacto com $whisperers_in_the_void_color_article$. Sua vontade agora pulsa por todo o território de §H[root.GetName]§!.\n\nA influência de nossa nova entidade patronal se consolidou rapidamente."
 shroud.4705.desc.outro: "Este é o preço de um vínculo tão poderoso. Segundo nossa equipe de [GetTelepathPlural], as maiores bênçãos dos Sussurradores ainda estão por vir. A comunhão direta com uma entidade psiônica tão magnífica certamente valerá o esforço."
 shroud.4705.desc.gestalt: "$shroud.4705.desc.intro$ Enquanto nosso coletivo aguarda um fluxo de conhecimento oculto, sentimos nossos pensamentos se partindo em padrões divergentes. A harmonia constante em nossas faculdades cognitivas agora se vê sobreposta por uma crescente discórdia de vozes internas.\n\n$shroud.4705.desc.outro$"
 shroud.4705.desc.non_gestalt: "$shroud.4705.desc.intro$ Quanto mais buscamos conhecimentos ocultos, mais as ideias e opiniões em nossa sociedade se tornam divergentes. Uma discórdia de vozes internas desgasta nossas psiques, ameaçando o bem-estar mental de todos os [root.GetSpeciesNamePlural].\n\n$shroud.4705.desc.outro$"
 shroud.4705.desc.default: "$shroud.4705.desc.non_gestalt$"
 shroud.4705.desc.hive: "$shroud.4705.desc.gestalt$"
 shroud.4705.desc.gestalt_machine: "$shroud.4705.desc.gestalt$"
 shroud.4705.desc.individual_machine: "$shroud.4705.desc.non_gestalt$"
 shroud.4705.a.default: "Podemos lidar com isso."
 shroud.4705.a.gestalt: "$shroud.4705.a.default$"
 shroud.4710.title: "$utopia.2658.name$"
 shroud.4710.desc: "$shroud.4510.desc.intro$$whisperers_in_the_void_color_article$$shroud.4510.desc.outro$"
 shroud.4710.a: "$utopia.2658.a$"
 shroud.4710.b: "Renegar $whisperers_in_the_void_color_article$."
 shroud_whisperers_in_the_void_covenant_accepted_effect: "$t$£research£ Pesquisa Mensal a cada $pop_group_unit$ $telepath_type_plural_with_icon$: $@telepath_whisperers_research|0=+$"
 # End of the Cycle
 shroud.4715.desc.intro: "Está feito. Firmamos um Pacto com $end_of_the_cycle_color_article$. Ao selarmos o acordo, nossa equipe de [GetTelepathPlural] proferiu em uníssono: §R\"O FIM COMEÇA.\"§!"
 shroud.4715.desc.default: "$shroud.4715.desc.intro$\n\nE então, silêncio. Um silêncio imensurável que invadiu as mentes de todo o povo [root.GetSpeciesAdj]. Onde antes fervilhavam as energias multiformes do §HVéu§! dentro de nossas consciências, o reino psiônico agora foi tomado por um silêncio sepulcral.\n\nResta-nos apenas contemplar as consequências do que provocamos."
 shroud.4715.desc.hive: "$shroud.4715.desc.intro$\n\nE então, silêncio. Um silêncio imensurável que invadiu as mentes de todo o povo [root.GetSpeciesAdj]. Onde antes fervilhavam as energias multiformes do §HVéu§! pelo [GetBrainName], o reino psiônico agora jaz inerte, quase inexistente.\n\nResta-nos apenas estimar as consequências do que provocamos."
 shroud.4715.desc.gestalt_machine: "$shroud.4715.desc.default$"
 shroud.4715.desc.individual_machine: "$shroud.4715.desc.default$"
 shroud.4715.a.default: "Que sua vontade seja misericordiosa."
 shroud.4715.a.gestalt: "$shroud.4715.a.default$"
 shroud_whisperers_covenant_chain_title: "$whisperers_covenant_chain_title$"
 shroud_whisperers_covenant_chain_desc: "Criamos um vínculo com uma entidade do Véu conhecida como $whisperers_in_the_void_color_article$. Insondáveis, eles prometem nos conceder fragmentos de seu poder, por um preço.\n\nSegundo nossa equipe de [GetTelepathPlural], poderemos fortalecer essa ligação se passarmos a agir conforme a vontade de nossa entidade patronal.\n\nOs Sussurradores apreciam novos conhecimentos, segredos silenciosos e conspirações. Encontram êxtase na simples alegria de uma mente transbordando, prestes a se romper."
 shroud_whisperers_covenant_chain_begin: "$whisperers_covenant_chain_begin$"
 shroud_whisperers_covenant_chain_end: "$whisperers_covenant_chain_end$"
 robot_shroud_whisperers_covenant_chain_title: "$shroud_whisperers_covenant_chain_title$"
 robot_shroud_whisperers_covenant_chain_desc: "$shroud_whisperers_covenant_chain_desc$"
 shroud.11110.title: "O Ciclo Continua"
 shroud.11110.desc: "Os §HSussurradores§! se agitam intensamente, suas vozes obscurecendo tudo em nossas psiques. Querem comungar, ansiosos para abarrotar nossas mentes com conhecimento.\n\nHá uma escolha irrevogável a ser feita."
 shroud.11110.a: "Absorver $the_eater_of_worlds_article$."
 shroud.11110.b: "Absorver $the_cradle_of_souls_article$."
 shroud.11110.c: "Absorver $the_instrument_of_desire_article$."
 shroud.11110.d: "Absorver $the_composer_of_strands_article$."
 shroud.11120.title: "A Vingança de [GetBetrayedPatronColour]"
 shroud.11120.title.eater: "A Vingança de $the_eater_of_worlds_color_article$"
 shroud.11120.title.cradle: "A Vingança de $the_cradle_of_souls_color_article$"
 shroud.11120.title.instrument: "A Vingança de $the_instrument_of_desire_color_article$"
 shroud.11120.title.composer: "A Vingança de $the_composer_of_strands_color_article$"
 shroud.11120.desc: "Assim que nossa equipe de [GetTelepathPlural] emergiu do §HVéu§!, descobrimos que nossa traição provocou uma retaliação poderosa de [GetBetrayedPatronColour].\n\nUm $SHROUD_TUNNEL_GALACTIC$ surgiu perto de §H[event_target:selected_planet_for_revenge.GetName]§!, agora um mundo reduzido a intermináveis terras devastadas. Nós [GetFeltLoc] uma fúria palpável além do túnel. Está claro que nossa antiga entidade patronal está se preparando para a vingança."
 shroud.11120.a: "Precisamos preparar nossas defesas."
 shroud.11120.a.tt: "§H[event_target:selected_planet_for_revenge.GetName]§! se torna um §Y$pc_shrouded$§!.\nUm $SHROUD_TUNNEL_GALACTIC$ aparece perto do planeta."
 shroud_tunnel_object: "$SHROUD_TUNNEL_GALACTIC$"
 shroud.11130.title: "Vingança Furiosa"
 shroud.11130.desc_common: "Um §Y$NAME_Psionic_Avatar$§! emergiu do $SHROUD_TUNNEL_GALACTIC$ no sistema [event_target:spawn_system.GetName]. É uma manifestação da ira de [GetBetrayedPatronColour], que agora avança para [capital_scope.GetName]."
 shroud.11130.desc_success: "Conseguimos reunir nossas forças contra a ameaça emergente. Nossas naves emitiram ondas de energia psiônica pelo $SHROUD_TUNNEL_GALACTIC$, enfraquecendo a entidade hostil enquanto ela invadia nossa realidade."
 shroud.11130.success_tt: "O $NAME_Psionic_Avatar$ emerge com metade da força."
 shroud.11250.title: "O Fim"
 shroud.11250.desc: "Ao mergulharmos no transe, nossas mentes se deparam com silêncio absoluto. Jamais sentimos o Véu tão inerte.\n\nO vazio está mudo.\n\nTudo se foi."
 shroud.11250.a: "Este deve ser o Fim."
 shroud.11255.title: "O Renascimento de [owner.GetName]"
 shroud.11255.desc: "Fizemos grandes esforços para nos recuperarmos depois da destruição acarretada pel$end_of_the_cycle_color_article$. Para isso, reconstruímos um §H$starbase_outpost$§! no sistema §H[solar_system.Star.GetStarName]§!, marcando um novo começo para [owner.GetName]."
