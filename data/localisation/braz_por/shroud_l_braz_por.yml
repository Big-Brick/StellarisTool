l_braz_por:
 ##################################
 # ENGLISH LOCALISATION - Shroud #
 ##################################
 SHROUD_TITLE: "Shadows of the Shroud"
 ap_interdimensional_processing: "Processamento Interdimensional"
 ap_interdimensional_processing_desc: "Nossa capacidade de processamento é limitada quando restrita a apenas três dimensões físicas. Há vantagens em levar nossa rede para espaços além do vazio."
 requires_not_ap_interdimensional_processing: "$TRIGGER_FAIL$Talvez não tenha a Regalia da Ascensão §Y$ap_interdimensional_processing$§!."
 vo_psionic_voice: "Psiônico"
 #==========================
 # Advanced Governments
 #==========================
 shroud.7099.name: "Respostas Psiônicas"
 shroud.7099.desc: "Nossos pensamentos se movem pelo §HVéu§! com uma nova intenção. Conforme forçamos, ele força de volta. De início, interpretamos isso como resistência à nossa presença, mas agora entendemos que o Véu está nos fazendo perguntas.\n\nEmbora confusas em seu significado, essas perguntas não são triviais. De acordo com nossa equipe de [GetTelepathPlural], as respostas que dermos influenciarão o futuro de nossa sociedade."
 shroud.7099.a: "Precisamos responder."
 # Shroud Songs events
 shroud.7100.title: "Canção do Véu: [GetRolledShroudSongName]"
 shroud.7100.desc.common: "Uma imagem se forma em nossos [GetMindEyeLoc]. Podemos ver §H[GetRolledShroudSongName]§!.\n\n§P[GetRolledShroudSongDesc]§!"
 shroud.7100.desc: "Nossa conexão com o §HVéu§! é forte; estaremos prontos para atender ao seu chamado. A mensagem chega em frases ritmadas. O Véu canta para nós.\n\n$shroud.7100.desc.common$"
 shroud.7100.a: "[GetRolledShroudSongOptionA]"
 shroud.7100.b: "[GetRolledShroudSongOptionB]"
 shroud.7100.tt: "O Véu aguarda nossa resposta..."
 shroud.7105.desc: "Algo invisível se move, e com um sussurro outro pensamento nasce.\n\n$shroud.7100.desc.common$"
 shroud.7105.tt: "O Véu anseia por nossa resposta..."
 shroud.7110.desc: "Um coro surge em nossos pensamentos! Algo é escolhido não por acaso, mas por algo mais velho.\n\n$shroud.7100.desc.common$"
 shroud.7110.tt: "O Véu estremece de ansiedade pela nossa resposta..."
 shroud_song.1.name: "Estrelas"
 shroud_song.1.desc: "Para aqueles que buscam conhecimento, o processo de existir é um caminho para o entendimento."
 shroud_song.1.a: "O saber jaz além de nossos sentidos."
 shroud_song.1.b: "O conhecimento está ao nosso alcance."
 shroud_song.2.name: "Luz"
 shroud_song.2.desc: "O Entremundos é a superfície de um oceano, um vazio infinitesimal que acorrenta o Véu. Aqui, é possível vislumbrar a verdade."
 shroud_song.2.a: "A verdade está nas profundezas."
 shroud_song.2.b: "A superfície reflete a verdade."
 shroud_song.3.name: "Vida"
 shroud_song.3.desc: "Sempre que floresce, a vida é efêmera.\nOnde quer que cresçam, os vivos são frágeis."
 shroud_song.3.a.default: "No Véu não haverá vida ou morte."
 shroud_song.3.a.machine: "Nossa existência está além da vida."
 shroud_song.3.b.default: "É isso que nos torna especiais."
 shroud_song.3.b.machine: "Nós ainda nasceremos."
 shroud_song.3.b.homicidal: "Tudo que é frágil é dispensável."
 shroud_song.4.name: "Mente"
 shroud_song.4.desc: "A mente é uma fonte, e o pensamento flui pelo tempo e o espaço. Nós escorremos para outras dimensões."
 shroud_song.4.a: "Seguiremos a correnteza."
 shroud_song.4.b: "Cavaremos um poço."
 shroud_song.5.name: "Linhas"
 shroud_song.5.desc: "O efeito de qualquer causa pode ser previsto. Para descobrir o destino das coisas, é necessário apenas antecipar as linhas."
 shroud_song.5.a: "Nós traçamos as linhas em sonhos."
 shroud_song.5.b: "Essas linhas devem ser calculadas."
 shroud_song.6.name: "Morte"
 shroud_song.6.desc: "Na morte, estrelas podem brilhar mais do que galáxias. Essas coisas também perecerão."
 shroud_song.6.a.default: "A morte não mais nos preocupará."
 shroud_song.6.a.machine: "Nós desconhecemos a morte."
 shroud_song.6.b.default: "Todas as coisas morrem. Poucas sobrevivem."
 shroud_song.6.b.machine: "Primeiro, é necessário viver para que se possa morrer."
 shroud_song.7.name: "O Vazio"
 shroud_song.7.desc: "O caos reina onde as galáxias se aglomeram. O vazio é uma promessa de tranquilidade."
 shroud_song.7.a: "Nós somos a calmaria."
 shroud_song.7.b: "Nós somos o caos."
 shroud_song.8.name: "A Dobra"
 shroud_song.8.desc: "Uma ponte pode reduzir qualquer distância, e qualquer ponte pode ser reduzida a nada."
 shroud_song.8.a: "Atravessamos para chegar ao outro lado."
 shroud_song.8.b: "Atravessamos com a esperança de voltar."
 shroud_song.9.name: "Gravidade"
 shroud_song.9.desc: "Todo empurrão vem acompanhado de um puxão."
 shroud_song.9.a: "Empurrar."
 shroud_song.9.b: "Puxar."
 shroud_song.10.name: "A Nebulosa"
 shroud_song.10.desc: "Uma estrela morre, derramando poeira; a poeira forma uma nuvem.\nDa nuvem, uma estrela é formada; o destino da estrela é a poeira."
 shroud_song.10.a: "O ciclo não tem fim."
 shroud_song.10.b: "Tudo deve acabar."
 shroud_song.11.name: "O Cometa"
 shroud_song.11.desc: "Exploradores buscam o desconhecido; a exploração, então, os cega."
 shroud_song.11.a: "O Véu não tem limites."
 shroud_song.11.b: "O Véu expande nossos limites."
 shroud_song.12.name: "O Buraco Negro"
 shroud_song.12.desc: "O que há dentro não se pode conhecer. O mergulho não deixa escapatória."
 shroud_song.12.a: "Engula-nos por completo."
 shroud_song.12.b: "Manteremos distância."
 shroud_song.13.name: "Energia"
 shroud_song.13.desc: "Um objeto em movimento escolhe repousar. Qual deveria ser sua punição?"
 shroud_song.13.a: "Quem somos nós para julgar?"
 shroud_song.13.b: "Uma reação oposta e de igual intensidade."
 shroud.7120.name: "Transcendência Psiônica"
 shroud.7120.desc.common: "O §HVéu§! silencia, mas um peso psíquico cai sobre nossa sociedade. As respostas que demos abriram novas oportunidades, se quisermos abraçá-las."
 shroud.7120.desc: "$shroud.7120.desc.common$\n\nNossas mentes ascendidas estão preparadas para mais transformações. O veículo que serve como suporte às necessidades físicas da mente pode se tornar muito menos importante.\n\nSe continuarmos por este caminho, nossa população poderá transcender suas preocupações com problemas materiais e se comprometer à existência parcial dentro do Véu. Uma capacidade reduzida de esforço físico será um preço pequeno a se pagar em troca de ganhos na acuidade mental."
 shroud.7120.a.default: "Abracemos a transcendência psiônica."
 shroud.7120.a.gestalt: "A transcendência psiônica é ideal para o coletivo."
 shroud.7120.a.tt: "$change_auth_tt$ [GetTranscendedAuthority]"
 shroud.7120.b.default: "Podemos prosperar sem tais mudanças."
 shroud.7120.b.machine: "Mudanças operacionais negadas."
 shroud.7121.name: "Canções do Véu"
 shroud.7121.desc: "$shroud.7120.desc.common$\n\nNossas formas ascendidas detêm grande potencial nessa dimensão corpórea. Continuamos ficando mais fortes com infusões de energia psiônica e somos capazes de direcionar esse poder para toda a nossa sociedade.\n\nNão apenas cantaríamos as canções do Véu, mas também as canalizaríamos para nosso [GetGovBehaviourLoc]."
 shroud.7121.a: "Deixe que as canções do Véu nos guiem."
 shroud.7121.a.tt: "$change_auth_tt$ [GetCorporealAuthority]"
 # Transcendent
 transcendent_trait_common_tt: "A Característica de Espécie §Y$trait_psionic$§! concede efeitos adicionais:$TABBED_NEW_LINE$- Eficiência de Emprego de $pop_cat_ruler_plural$ e [GetSpecialist]: §G+10%§!$TABBED_NEW_LINE$- Eficiência de Emprego de [GetWorker]: §R-10%§!"
 transcendent_trait_tt: "$mod_psionic_aura_hyperlane_range_add$: §G+2§!\n$transcendent_trait_common_tt$\nA Característica de Líder ['concept_leader_trait_psionic'] concede efeitos adicionais: $TABBED_NEW_LINE$- §G+$@transcendent_psionic_leader_speed_mult|0%$§! de Velocidade de Interesse do Conselho $TABBED_NEW_LINE$- $MOD_LEADER_LIFESPAN_ADD$: §G+60§! $TABBED_NEW_LINE$- Efeitos não transcedentais são aumentados em §G+50%§!"
 auth_shroud_democratic_transcendent: "Democracia Transcendental"
 auth_shroud_democratic_transcendent_desc: "Todas as mentes transcendentes são de igual valor no Véu, enquanto eleições garantem igualdade na dimensão corpórea. Votando com cédulas psiônicas, cidadãos elegem seus representantes para o conclave governante, que busca consenso por meio da contemplação telepática."
 transcendent_democratic_tt: "$transcendent_trait_tt$\n$mod_pop_factions_produces_mult$: §G+40%§!\n$MOD_LEADER_LIFESPAN_ADD$: §G+20 anos§!\n$mod_negative_traits_leader$: §G-1§!"
 gov_shroud_transcendent_democracy: "$auth_shroud_democratic_transcendent$"
 gov_shroud_transcendent_democracy_desc: "$auth_shroud_democratic_transcendent_desc$"
 auth_shroud_oligarchic_transcendent: "Aristocracia Transcendental"
 auth_shroud_oligarchic_transcendent_desc: "As profundezas mais distantes do Véu são reservadas para as mentes mais poderosas entre nós. O tempo que leva para sintonizar com esses domínios é levado em consideração em seus mandatos."
 transcendent_oligarchic_tt: "$transcendent_trait_tt$\n$MOD_LEADER_SKILL_ADD$: §G+1§!\n$MOD_LEADER_COUNCILOR_EXP_GAIN$: §G+25%§!\n$mod_leaders_upkeep_mult$: §G-25%§!\n$MOD_ELECTION_TERM_YEARS_ADD$: §Y+20§!\n$mod_planet_telepaths_produces_mult$: $@transcendent_oligarchic_telepath|0=+%$ por §Y5§! anos após cada eleição."
 gov_shroud_transcendent_oligarchy: "$auth_shroud_oligarchic_transcendent$"
 gov_shroud_transcendent_oligarchy_desc: "$auth_shroud_oligarchic_transcendent_desc$"
 transcendent_oligarchic_election_modifier: "$auth_shroud_oligarchic_transcendent$"
 auth_shroud_dictatorial_transcendent: "Teocracia Transcendental"
 auth_shroud_dictatorial_transcendent_desc: "É hora de aceitar a verdade: o grande governante é um deus ascendido. Através do poder do Véu ele vê e sabe tudo."
 auth_shroud_dictatorial_transcendent_tt: "$transcendent_trait_tt$\n§H$EDICT_FUND$§! de [telepath.GetName]: +1\n£job_politician£ $job_politician_plural$ são substituídos por ['concept_high_priest']\n$mod_planet_bureaucrats_produces_mult$: §G+15%§!\n$mod_planet_enforcers_produces_mult$: §G+15%§!\n$mod_pop_ethic_spiritualist_attraction_mult$: §G+50%§!"
 gov_shroud_transcendent_dictatorial: "$auth_shroud_dictatorial_transcendent$"
 gov_shroud_transcendent_dictatorial_desc: "$auth_shroud_dictatorial_transcendent_desc$"
 auth_shroud_imperial_transcendent: "Imperium Transcendental"
 auth_shroud_imperial_transcendent_desc: "O governante eleva nossa presença a uma dimensão maior. O poder bruto do Véu escorre da vontade de nossa linhagem imperial para as mentes necessitadas da população."
 auth_shroud_imperial_transcendent_tt: "$transcendent_trait_tt$\nO $imperial_heir$ ganha efeitos adicionais:$TABBED_NEW_LINE$$scientist_plural_with_icon$ - §YHabilidade de Fenda Astral§! e §YArqueológica§!: $@transcendent_imperial_heir_skill|0=+$$TABBED_NEW_LINE$$official_plural_with_icon$ - $i_stability$: $@transcendent_imperial_heir_stability|0=+$$TABBED_NEW_LINE$$commander_plural_with_icon$ - §Y$HITPOINTS$§! e §Y$MOD_SHIP_SPEED_MULT$§!: $@transcendent_imperial_heir_mult|0=+%$\nSempre que o £leader£ §Y$imperial_ruler$§! ou §YHerdeiro§! sobe de nível, ganha $i_unity$\n$MOD_ENVOY_IMPROVE_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_HARM_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_ATTUNEMENT_MULT$: §G+50%§!\n$MOD_PLANET_CRIME_ADD$: §R+20§!"
 gov_shroud_transcendent_imperial: "$auth_shroud_imperial_transcendent$"
 gov_shroud_transcendent_imperial_desc: "$auth_shroud_imperial_transcendent_desc$"
 councilor_ruler_imperial_transcendent: "$imperial_ruler$"
 councilor_ruler_imperial_transcendent_desc: "$imperial_ruler_desc$"
 auth_shroud_corporate_transcendent: "Empresa Transcendental"
 auth_shroud_corporate_transcendent_desc: "O corpo empresarial transcendente avança com suas principais metas em primeiro plano. Através das sombras no Véu, a empresa pode sondar as mentes dos investidores e competidores, criando oportunidades para estratégias de gestão psiônicas."
 auth_shroud_corporate_transcendent_tt: "$transcendent_trait_tt$\n$i_trade_value$ de [telepath.GetName]: §G+$@corporate_government_telepaths_trade_value_mult|0%$§!\n$MOD_INTEL_DECRYPTION_ADD$: §G+1§!\n$mod_operations_influence_cost_mult$: §G-20%§!\n$MOD_BRANCH_OFFICE_VALUE_MULT$: §G+20%§!\n$MOD_COUNTRY_ENVOYS_ADD$: §G+1§!"
 gov_shroud_transcendent_corporate: "$auth_shroud_corporate_transcendent$"
 gov_shroud_transcendent_corporate_desc: "$auth_shroud_corporate_transcendent_desc$"
 auth_shroud_hive_transcendent: "Mentetérea Transcendental"
 auth_shroud_hive_transcendent_desc: "Movendo-se como uma unidade, este coletivo se sente mais à vontade no Véu do que em suas formas físicas. Cada jornada além do manto aumenta a sabedoria combinada dessa nova Mentetérea."
 transcendent_hive_mind_tt: "$transcendent_trait_tt$\n§YLíderes§! ganham §Y$@transcendent_hive_mind_leader_exp|0$§! de experiência após $DELVE$.\n$MOD_PLANET_STABILITY_MULT$: §G+10%§!\n$mod_planet_jobs_complex_drone_produces_mult$: §G+10%§!\n$MOD_EMPIRE_SIZE_MULT$: §G-10%§!\n$MOD_POP_ENVIRONMENT_TOLERANCE$: §R-10%§!"
 gov_shroud_transcendent_hive: "$auth_shroud_hive_transcendent$"
 gov_shroud_transcendent_hive_desc: "$auth_shroud_hive_transcendent_desc$"
 auth_shroud_machine_transcendent: "Mainframe Transcendental"
 auth_shroud_machine_transcendent_desc: "A maior parte desta rede de processamento foi movida para dentro do Véu, onde cálculos podem ser feitos em níveis de velocidade nunca antes vistos. Operações de sistema no plano mundano agora são consideradas desajeitadas e obsoletas."
 transcendent_machine_tt: "$transcendent_trait_tt$\n$@transcendent_machine_research_per_attunement|2=+%$ de Velocidade de Pesquisa para cada Ponto de Sintonia\nGanha Pesquisa de £physics_research£ £society_research£ £engineering_research£ aleatória sempre que você §Y$DELVE$§!\nManutenção de §YSub-Rotinas§! a cada $pop_group_unit$ $job_telepath_swap_plural_with_icon$: $@transcendent_machine_calculator_upkeep|0=-%$\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!\n£pop£ Pops com a característica ['trait:trait_robot_psionic'] ganham $@transcendent_machine_pop_upkeep|0=-%$ de Manutenção\n$mod_station_researchers_produces_mult$: §R-20%§!"
 gov_shroud_transcendent_machine: "$auth_shroud_machine_transcendent$"
 gov_shroud_transcendent_machine_desc: "$auth_shroud_machine_transcendent_desc$"
 transcendent_machine_research_modifier: "$auth_shroud_machine_transcendent$"
 AUTH_HIVE_MIND_GENEMODDING_ASCENDED: "É possível modificar £pop£ §HPops§! para se tornarem compatíveis com uma §HMente-Colmeia§!"
 MOD_ENVOY_ATTUNEMENT_MULT: "Sintonia com o Véu de Emissário"
 REMOVE_FROM_EMPIRE_COUNCIL_EFFECT: "Remover do Conselho"
 # Corporeal
 corporeal_trait_tt: "$MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$: §G+25%§!\n$AVAILABLE_POLICIES$ ['policy:psionic_choir',$policy_psionic_choir$]"
 auth_shroud_democratic_corporeal: "União Espiritual"
 auth_shroud_democratic_corporeal_desc: "As energias do Véu estão distribuídas pelo império democraticamente, diminuindo o fardo da vida corpórea e trazendo todos os cidadãos para um senso de unidade física maior."
 corporeal_democratic_tt: "$corporeal_trait_tt$\nFelicidade dos Pops Psiônicos: $@corporeal_democratic_psionic_happiness|0=+%$\n$mod_pop_factions_produces_mult$: §G+10%§!\n$MOD_EMPIRE_SIZE_PSIONIC_POPS_MULT$: §G-10%§!\n$mod_planet_jobs_unity_produces_mult$: §G+10%§!\n$MOD_POP_POLITICAL_POWER$: §G+50%§!"
 gov_shroud_corporeal_democracy: "$auth_shroud_democratic_corporeal$"
 gov_shroud_corporeal_democracy_desc: "$auth_shroud_democratic_corporeal_desc$"
 auth_shroud_oligarchic_corporeal: "Prodigiocracia"
 auth_shroud_oligarchic_corporeal_desc: "Ao iniciar o treino psíquico de nossos líderes na juventude, eles podem ser moldados em um quadro de telepatas de elite, capazes de usar habilidades psiônicas que só podemos imaginar."
 corporeal_oligarchic_tt: "$corporeal_trait_tt$\n$MOD_LEADER_INITIAL_SKILL$: §G+2§!\n$mod_leaders_upkeep_mult$: §G-25%§!\n$mod_leader_recruitment_age$: §G-15§!\n§YLíderes§! começam com uma §Rcaracterística negativa§! adicional."
 gov_shroud_corporeal_oligarchy: "$auth_shroud_oligarchic_corporeal$"
 gov_shroud_corporeal_oligarchy_desc: "$auth_shroud_oligarchic_corporeal_desc$"
 auth_shroud_dictatorial_corporeal: "Autocracia Consagrada"
 auth_shroud_dictatorial_corporeal_desc: "O grande governante incorpora os poderes do Véu em forma física, transformando energia psiônica em poderio governamental. Nada pode ficar no caminho de seu maior objetivo."
 auth_shroud_dictatorial_corporeal_tt: "$corporeal_trait_tt$\n+1 §H$EDICT_FUND$§! por telepata\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!\n$MOD_COUNCIL_AGENDA_COOLDOWN_MULT$: §G-25%§!\n$mod_planet_bureaucrats_upkeep_mult$: §G-25%§!"
 gov_shroud_corporeal_dictatorial: "$auth_shroud_dictatorial_corporeal$"
 gov_shroud_corporeal_dictatorial_desc: "$auth_shroud_dictatorial_corporeal_desc$"
 auth_shroud_imperial_corporeal: "Imperium Vitalis"
 auth_shroud_imperial_corporeal_desc: "A linhagem imperial é um canal de vitalidade do Véu. Esse poder é canalizado para melhorar a forma física do governante e seus herdeiros, graças à generosidade da população solícita."
 auth_shroud_imperial_corporeal_tt: "$corporeal_trait_tt$\nO §Y$imperial_heir$§! ganha $@corporeal_imperial_heir_xp|0+$ de §YEXP§! sempre que assume o trono\n$MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$ a cada $pop_group_unit$ $job_telepath_swap_plural_with_icon$: $@corporeal_imperial_telepath_effectiveness|0=+%$\n$MOD_ENVOY_IMPROVE_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_HARM_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_ATTUNEMENT_MULT$: §G+50%§!\n$MOD_RULER_SKILL_ADD$: §G+2§!\n$MOD_COUNCILOR_SKILL_ADD$: §G+1§!\n$MOD_LEADER_LIFESPAN_ADD$: §G+10 anos§!\n$mod_psionic_pop_bonus_workforce_mult$: §R-20%§!\n$MOD_LOGISTIC_GROWTH_MULT$: §R-5%§!\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §R-5%§!"
 gov_shroud_corporeal_imperial: "$auth_shroud_imperial_corporeal$"
 gov_shroud_corporeal_imperial_desc: "$auth_shroud_imperial_corporeal_desc$"
 auth_shroud_corporate_corporeal: "Conselho de Médiuns"
 auth_shroud_corporate_corporeal_desc: "Seria tolice desperdiçar as vantagens mentais que o Véu proporciona. Esta corporação é conhecida por estabelecer $building_psionic_offices$ em civilizações vizinhas, aumentando a margem de lucro de acordos de comércio estrangeiros."
 auth_shroud_corporate_corporeal_tt: "$corporeal_trait_tt$\n$r_trade$ a cada $pop_group_unit$ $job_telepath_swap_plural_with_icon$: §G+$@corporate_government_telepaths_trade_value_mult|0%$§!\n$AVAILABLE_HOLDINGS$ ['building:building_psionic_offices']\n$mod_planet_branch_offices_influence_cost_mult$: §G-40%§!\n$mod_council_agenda_early_activation_cost_mult$: §G-25%§!\n$MOD_COUNCIL_AGENDA_COOLDOWN_MULT$: §G-25%§!\n$MOD_LEADER_SPECIES_EXP_GAIN$: §G+25%§!"
 gov_shroud_corporeal_corporate: "$auth_shroud_corporate_corporeal$"
 gov_shroud_corporeal_corporate_desc: "$auth_shroud_corporate_corporeal_desc$"
 auth_shroud_hive_corporeal: "Nexus Psiônico"
 auth_shroud_hive_corporeal_desc: "A força de nossa sintonia com o Véu ressoa pelas formas físicas de nosso coletivo."
 corporeal_hive_mind_tt: "$corporeal_trait_tt$\n$@corporeal_hive_mind_job_upkeep_per_attunement|2=-%$ de $mod_planet_jobs_upkeep_mult$ para cada Ponto de Sintonia\n$MOD_PLANET_STABILITY_MULT$: §G+10%§!\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+30%§!\n$MOD_COUNCIL_AGENDA_FINISHING_EFFECT_DURATION_MULT$: §G+30%§!"
 gov_shroud_corporeal_hive: "$auth_shroud_hive_corporeal$"
 gov_shroud_corporeal_hive_desc: "$auth_shroud_hive_corporeal_desc$"
 corporeal_hive_mind_upkeep_modifier: "$auth_shroud_hive_corporeal$"
 auth_shroud_machine_corporeal: "Rede Psiônica"
 auth_shroud_machine_corporeal_desc: "Ao entremear suas redes através das correntes veladas do Véu, essas máquinas conseguem realizar transferências de dados praticamente instantâneas. Com cada byte imbuído com intento psiônico potente, essa configuração é capaz de influenciar imensamente o espaço físico ao seu redor."
 corporeal_machine_tt: "$corporeal_trait_tt$\n$MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$ a cada $pop_group_unit$ $job_telepath_drone_swap_with_icon$: $@corporeal_machine_aura_effectiveness|0=+%$\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!\n$mod_pop_cat_complex_drone_bonus_workforce_mult$: §G+10%§!\n$mod_leaders_upkeep_mult$: §G-50%§!\n$mod_planet_bureaucrats_upkeep_mult$: §R+30%§!"
 gov_shroud_corporeal_machine: "$auth_shroud_machine_corporeal$"
 gov_shroud_corporeal_machine_desc: "$auth_shroud_machine_corporeal_desc$"
