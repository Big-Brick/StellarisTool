 # Mindwardens
 #==========================
 MINDWARDEN: "Mentemestra"
 MINDWARDEN_plural: "Mentemestras"
 MINDWARDEN_hand_plural: "$HUM_hand_plural$"
 MINDWARDEN_ENCLAVE: "$MINDWARDEN$"
 MINDWARDEN_ENCLAVE_plural: "$MINDWARDEN_plural$"
 starbase_mindwarden: "$MINDWARDEN$"
 starbase_mindwarden_plural: "$MINDWARDEN_plural$"
 gov_mindwarden_enclave: "Enclave Mentemestra"
 gov_mindwarden_enclave_desc: "Motivada por uma profunda antipatia em relação ao Véu, esta organização oferece serviços e tecnologias para neutralizar os efeitos poderosos das práticas psiônicas."
 civic_mindwarden_enclave: "$ENCLAVE_MINDWARDEN$"
 civic_mindwarden_enclave_desc: ""
 enclave_mindwarden_station: "Estação $MINDWARDEN$"
 enclave_mindwarden_station_plural: "Estações $MINDWARDEN$s"
 leader_trait_iron_will: "Vontade de Ferro"
 leader_trait_iron_will_desc: "Um comandante habilidoso dos $MINDWARDEN_plural$, renomado por sua especialidade em fortificações pesadas e resistência psíquica."
 shroud.4190.name: "Aproximação de $PSIONIC_AURA$"
 shroud.4190.desc.intro: "Há algum tempo, nossa equipe de [GetScientistPlural] observou um fenômeno incomum: sistemas estelares distantes imersos em fluxos de energia de origem desconhecida, que gradualmente se espalham para outros sistemas."
 shroud.4190.desc: "$shroud.4190.desc.intro$ Esse fenômeno recebeu o nome de §H\"$PSIONIC_AURA_PLURAL$\"§!, com base em teorias não confirmadas sobre suas origens. Até o momento, não sabemos ao certo se representam uma ameaça.\n\nUma dessas Auras foi detectada no sistema §H[from.GetName]§!, e poderá cruzar nossas fronteiras se continuar se expandindo."
 shroud.4190.desc_mindwarden: "Se as teorias sobre a origem psiônica desse fenômeno estiverem corretas, talvez a liderança de §H[event_target:mindwarden_enclave_country.GetName]§! conheça métodos para neutralizar seus efeitos."
 shroud.4190.a: "Poderemos conhecer seus efeitos em breve."
 shroud.4191.name: "$shroud.4190.name$"
 shroud.4191.desc_1.common: "Detectamos altas concentrações de energia psiônica no sistema §H[from.GetName]§!. Ao ouvir os ecos do §HVéu§!, nossa equipe de [GetTelepathPlural] relatou que esse fenômeno foi causado pelas atividades psiônicas"
 shroud.4191.desc_1.default: "$shroud.4191.desc_1.common$ de uma civilização alienígena."
 shroud.4191.desc_1.contact: "$shroud.4191.desc_1.common$ de §H[fromfrom.GetName]§!."
 shroud.4191.desc_2.common: "matéria e consciência na realidade física. Nossas observações demonstram que essas Auras podem se espalhar entre sistemas estelares."
 shroud.4191.desc_2.default: "Denominada §H\"$PSIONIC_AURA$\"§!, ela emana da vontade de uma poderosa entidade do Véu, influenciando $shroud.4191.desc_2.common$"
 shroud.4191.desc_2.knows_aura: "Aparentemente, esse império desenvolveu métodos para canalizar uma §H$PSIONIC_AURA$§!, que emana do Véu e influencia $shroud.4191.desc_2.common$"
 shroud.4191.desc_3.common: "esperamos que tenha um efeito [GetPositiveRivalAdj] em nosso território, desde que nossas relações com o emissor permaneçam inalteradas."
 shroud.4191.desc_3.default: "Segundo nossa equipe de [GetTelepathPlural], a aura irradia com intenção [GetBenevolentRivalAdj], então $shroud.4191.desc_3.common$"
 shroud.4191.desc_3.contact: "Dadas as nossas relações [GetLessThanRivalAdj] favoráveis com [fromfrom.GetName], $shroud.4191.desc_3.common$"
 shroud.4191.a.rival_organic: "$WORRYING$"
 shroud.4191.a.rival_default: "Um desenvolvimento aquém do esperado."
 shroud.4191.a.organic: "Um presente do Véu."
 shroud.4191.a.default: "Um fenômeno interessante."
 shroud.mindwarden.back: "$enclave.410.a$"
 shroud.4205.name: "[event_target:mindwarden_enclave_country.GetName]"
 shroud.4205.common: "Saudações. Dirijo-me a você em nome de [event_target:mindwarden_enclave_country.GetName]."
 shroud.4205.desc: "$shroud.4205.common$\n\nNossa missão é defender a galáxia da ameaça do §HVéu§! e todos aqueles que disseminam seus efeitos nocivos. Acreditamos em mentes livres de invasões e em uma galáxia protegida contra as forças psiônicas.\n\nSegundo nossas leituras psiônicas, você não contribui com essas ameaças. Excelente. Será um prazer auxiliá-los contra qualquer um que contribua.\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.end: "Se precisar de serviços militares antipsiônicos ou desejar descartar §H$zro_lower$§!, estamos à disposição para ajudar."
 shroud.4205.desc.return: "Boas-vindas novamente. Nossa colaboração contínua é apreciada por [event_target:mindwarden_enclave_country.GetName].\n\nNossas leituras psiônicas são claras. O §HVéu§! ainda não maculou você. Ótimo, ótimo...\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.eotc: "Estes são tempos difíceis. Apesar de nossos esforços, $end_of_the_cycle_color_article$ está sobre nós. Sua manifestação terrível nos persegue pelas estrelas...\n\n$shroud.4205.desc.eotc.end$"
 shroud.4205.desc.eotc.end: "Chegou a hora de nos unirmos e prevenirmos um apocalipse psiônico."
 shroud.4205.desc.merc_first: "Companheiros Mentemestras, trazemos boas novas: a fundação do primeiro §H$gov_mindwarden_enclave$§! está concluída. $shroud.shared_combating_the_shroud$"
 shroud.4205.desc.merc_more: "Companheiros Mentemestras, trazemos boas novas: a fundação de nosso §H$gov_mindwarden_enclave$§! está concluída. $shroud.shared_combating_the_shroud$"
 shroud.4205.desc.merc_back: "Bem-vindos novamente, companheiros Mentemestras. Nossa colaboração contínua é apreciada por §H[mindwarden_enclave_country.GetName]§!.\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.return_beginning: "$shroud.4205.desc.end$"
 shroud.4205.desc.return_beginning.eotc: "$shroud.4205.desc.eotc.end$"
 shroud.4205.a: "O que é o Véu?"
 shroud.4205.b: "Gostaríamos de falar sobre o §I$sr_zro$§!."
 shroud.4205.c: "O que pode ser feito a respeito das §Y$PSIONIC_AURA_PLURAL$§!?"
 shroud.4205.d: "Conhecemos um bom alvo psiônico..."
 shroud.4205.e: "Precisamos de ajuda com £crime£ §Y[GetCrimeDeviancy]§! em nosso território."
 shroud.4205.ef: "Precisamos de §Yassistência logística§!."
 shroud.4205.f: "Seus soldados seriam de grande ajuda para nós."
 shroud.4205.g: "Estariam dispostos a nos enviar um §YComandante Mentemestra§!?"
 shroud.4205.h: "Queremos falar sobre $end_of_the_cycle_article$."
 shroud.4205.i: "Como seus §Ypatronos fundadores§!, temos uma proposta."
 shroud.shared_combating_the_shroud: "A partir de hoje, o comando de §H[mindwarden_enclave_country.GetName]§! continuará o trabalho vital de combate ao §HVéu§! e a todas as formas de transgressão psiônica.\n\nSe necessário, temos plena capacidade de prestar serviços antipsiônicos, desde o descarte de §H$zro_lower$§! até recrutamento militar, com rapidez e eficiência."
 shroud.4210.desc: "O §HVéu§! pode ser descrito como uma dimensão de realidade que existe além da percepção comum. É composto inteiramente de energia §H\"psiônica\"§! hostil. Ainda que invisível para muitos, permeia toda a nossa galáxia física.\n\nAs energias do Véu podem se manifestar no plano físico por meio da atividade cognitiva de seres sencientes. Essas forças são extremamente perigosas e imprevisíveis.\n\nPara garantir a segurança da população, são necessárias medidas de proteção contra o Véu. E com isso, estamos prontos para ajudar."
 shroud.shared_text_shroud_seal: "Essas máquinas sofisticadas dissipam gradualmente qualquer $PSIONIC_AURA$ até que seja completamente suprimida, tanto no sistema de origem quanto naqueles conectados por hiperestradas."
 shroud.4230.desc: "Existem dois métodos principais para suprimir §H$PSIONIC_AURA_PLURAL$§!.\n\nConstruir um §H$building_psionic_suppressor$§! em um planeta reduzirá gradualmente a intensidade da Aura em todo o sistema estelar e impedirá qualquer novo avanço.\n\nUma solução ainda mais poderosa é um §H$SHROUD_SEAL$§!. $shroud.shared_text_shroud_seal$"
 shroud.4230.a: "Deixa para lá."
 shroud.4230.b: "Queremos aprender a §Y$tech_psionic_suppression$§!."
 shroud.4231.desc: "Com prazer. Os dados serão transmitidos imediatamente.\n\nQue essas tecnologias tragam paz diante da escória psiônica."
 mindwarden_encourage_raid: "Pagar para que os [event_target:mindwarden_enclave_country.species.GetNamePlural] ataquem um império psiônico que conhecemos."
 shroud.4240.need_psionics: "Contato estabelecido com um império §Y$trait_psionic$§!."
 shroud.4240.desc: "É mesmo? Pois jamais haverá segurança ou paz verdadeira enquanto eles contaminam a galáxia com energia psiônica...\n\nUma incursão direcionada demonstraria claramente nossa oposição a essas práticas perigosas. Com seu apoio financeiro, estamos dispostos a realizar tal operação.\n\nInforme-nos o alvo, se estiver de acordo."
 shroud.4240.a: "Na verdade, esquece."
 shroud.4240.b: "§I[event_target:raid_target_1.GetName]§!"
 shroud.4240.c: "§I[event_target:raid_target_2.GetName]§!"
 shroud.4240.d: "§I[event_target:raid_target_3.GetName]§!"
 shroud.4240.e: "§I[event_target:raid_target_4.GetName]§!"
 mindwarden_raid_cooldown_tt: "§RNão poderemos solicitar outro ataque dos Mentemestras até §Y[root.mindwarden_raid_timer]§!.§!"
 mindwarden_hire_raid: "Pagar as autoridades de [event_target:mindwarden_enclave_country.GetName] para que enviem uma frota de incursão para atacar este império."
 shroud.4245.desc: "Ah, sim. Estamos cientes das práticas psiônicas deles. Uma demonstração de força se faz necessária.\n\nAgradecemos pelo apoio. A operação começará em breve."
 mindwarden_raider_modifier: "Incursor Antipsiônico Mentemestra"
 shroud.4246.name: "Incursão do $gov_mindwarden_enclave$"
 shroud.4246.common_1: "Comunicações interceptadas indicam que eles foram contratados por uma potência rival para atacar nossos sistemas."
 shroud.4246.common_2: "estão transmitindo uma mensagem em canal aberto, direcionada a nós."
 shroud.4246.desc: "Uma frota militar dos §H[event_target:mindwarden_enclave_country.GetSpeciesNamePlural]§! está se aproximando de nossas fronteiras! $shroud.4246.common_1$ Eles $shroud.4246.common_2$"
 shroud.4247.desc: "Uma frota de uma potência militar até então desconhecida está se aproximando de nossas fronteiras! $shroud.4246.common_1$ Identificam-se como os §H[event_target:mindwarden_enclave_country.GetSpeciesNamePlural]§!, e $shroud.4246.common_2$"
 NAME_Mindwarden_Corvette: "Zelote"
 NAME_Mindwarden_Frigate: "Sentinela"
 NAME_Mindwarden_Destroyer: "Inquisidora"
 NAME_Mindwarden_Cruiser: "Exorcista"
 NAME_Mindwarden_Battleship: "Purificadora"
 NAME_Mindwarden_Titan: "Julgadora"
 mindwarden_defense_modifier: "Força de Defesa Mentemestra"
 shroud.4250.desc: "Excelente. Confiar o $zro_lower$ a nós viabiliza pesquisas cruciais sobre essa substância poderosa e amplamente explorada – pesquisas essas que beneficiarão toda a galáxia.\n\nÉ por isso que nosso câmbio está bem acima do padrão galáctico."
 shroud.4250.a: "$shroud.mindwarden.back$"
 shroud.4250.b: "O que é §I$sr_zro$§!?"
 shroud.4250.c: "Doar £sr_zro£ §I$sr_zro$§!."
 mindwarden_zro_explanation: "Vende até 100 de §Y$sr_zro$§! por 5 vezes o valor padrão do $resolution_category_galactic_market$."
 mindwarden_zro_cooldown_tt: "§RNão será possível dar $sr_zro$ aos Mentemestras até §Y[root.mindwarden_zro_timer]§!.§!"
 shroud.4251.desc: "§Y$sr_zro$§! é uma substância rara e altamente instável, cujos efeitos são difíceis de controlar e prever. Intencionalmente ou não, pode provocar explosões violentas de energia, capazes de causar destruição em grande escala.\n\nEssas propriedades resultam de reações com o §HVéu§!, tornando-o popular entre praticantes de artes psiônicas. Alguns chegam a ingeri-lo como droga.\n\nBuscamos compreender melhor o $zro_lower$ e desenvolver métodos para seu descarte seguro. Por isso, recompensamos generosamente toda remessa entregue a nós."
 shroud.4255.desc: "Agradecemos a sua contribuição."
 shroud.4260.desc: "Então permita-nos oferecer uma §Y$decision_thought_police$§! eficaz, que pode detectar intenções [GetCriminalDeviant] antes que se convertam em ações.\n\nSuas técnicas foram desenvolvidas como alternativa segura às práticas psiônicas, utilizando técnicas científicas para monitorar a atividade cognitiva da população. Com isso, é possível oferecer diagnósticos mentais sem recorrer às perigosas energias do §HVéu§!."
 shroud.4260.a: "$shroud.mindwarden.back$"
 shroud.4260.b: "Recrutar a §I$decision_thought_police$§!."
 mindwarden_decision_cooldown_tt: "§RNão será possível solicitar isso até §Y[root.mindwarden_decision_timer]§!.§!"
 mindwarden_decision_explanation: "Libera uma £decision£ §YDecisão Planetária§!: §Y$decision_thought_police$§!"
 shroud.4262.desc: "Excelente. Acreditamos que você achará seus métodos bastante eficazes."
 shroud.4265.desc: "De fato. Nossas colaborações já revelaram alguns pontos de suas estratégias de mobilização militar que podem ser melhorados.\n\nPor favor, não tomem isso como um insulto. Nós simplesmente nos especializamos nessas áreas. Ficaríamos honrados em prestar assistência a parceiros tão estimados nesses assuntos, caso ofereçam uma compensação adequada."
 shroud.4265.a: "$shroud.mindwarden.back$"
 shroud.4265.b: "Negócio fechado."
 mindwarden_logistics_cooldown_tt: "§RNão poderemos pedir mais assistência logística aos Mentemestras até §Y[root.mindwarden_logistics_timer]§!.§!"
 shroud.4267.desc: "Saudações, estimados parceiros.\n\nNosso contrato para auxílio nas operações logísticas de suas frotas expirou. Estamos mais do que dispostos a continuar essa parceria, caso julguem proveitoso."
 shroud.4267.a: "Vamos continuar nossa parceria."
 shroud.4267.b: "Precisamos recusar, por enquanto."
 shroud.4266.desc: "Muito bem. Nossas operações de apoio de frota começarão imediatamente."
 shroud.4270.desc: "Nossas $NAME_Mindwarden_Army$ são excelentes tropas de choque, equipadas para enfrentar ameaças diversas, com especial eficácia contra oponentes psiônicos.\n\nEstamos certos de que sua utilidade justificará o custo."
 shroud.4270.a: "$shroud.mindwarden.back$"
 shroud.4270.b: "Contratar §I$mindwarden_army$§!."
 mindwarden_army_cooldown_tt: "§RNão será possível solicitar um novo exército dos Mentemestras até §Y[root.mindwarden_army_timer]§!.§!"
 mindwarden_army_explanation: "Recruta um exército de §Y$mindwarden_army$§!, que chegará via $transport$ em seu sistema capital."
 shroud.4271.desc: "É o seu dia de sorte. Uma de nossas companhias já está preparada para o envio. Espere a chegada da nave de transporte em breve."
 shroud.4280.desc: "Teremos o maior prazer.\n\nUma liderança eficaz é a chave para combater o §HVéu§!, e nossos Mentemestras dominam a arte da supressão psiônica por meio de uma governança firme."
 shroud.4280.a: "$shroud.mindwarden.back$"
 shroud.4280.b: "Contratar um §I$subclass_commander_governor$§!."
 mindwarden_commander_explanation: "\nContrataremos um $subclass_commander_governor$ Mentemestra de Nível 5."
 unlocks_mindwarden_council_position: "\n§ELibera a Posição no Conselho:§!\n§H$t$$councilor_mindwarden$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$mod_country_unity_produces_mult$: §G+1%§!\n$ttt$$planet_crime$: §G-1%§!\n$ttt$$MOD_PSIONIC_AURA_RESISTANCE_MULT$: §G+5%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$commander_with_icon$\n\n$COUNCIL_POSITION_REQUIREMENTS$$councilor_mindwarden_conditional_tooltip$"
 mindwarden_commander_already_bought: "§RNós já adquirimos os serviços de um $subclass_commander_governor$ Mentemestra.§!"
 mindwarden_commander_conflicted_leader: "§RNão deve ter um líder de [event_target:shroudwalker_enclave_country.GetName].§!"
 mindwarden_commander_cooldown_tt: "§RNão poderemos solicitar outro líder dos Mentemestras até §Y[root.mindwarden_commander_timer]§!.§!"
 mindwarden_commander_desc: "Recrutado de um $gov_mindwarden_enclave$, este líder adota uma postura inflexível contra atividades psiônicas, protegendo a população dos efeitos nocivos do Véu."
 mindwarden_commander_catch_phrase: "Onde o Véu penetra, a ferida deve ser cauterizada."
 shroud.4281.desc: "Uma sábia decisão. Que sua liderança mantenha a população segura por muitos anos."
 shroud.4286.name: "Ataque contra [FROM.GetName]"
 mindwarden_farewell: "§L\"Seu recente ataque a um $gov_mindwarden_enclave$ passou dos limites. Continuar operando em seu território seria, sob qualquer perspectiva ética ou moral, indefensável. Recomendo fortemente que cessem essas hostilidades sem sentido, mas quaisquer que sejam suas decisões futuras, não permanecerei aqui para facilitá-las.\"§!"
 shroud.4286.desc: "$enclave.8000.start$\n\n$mindwarden_farewell$\n\n$enclave.8000.end$"
 shroud.4286.desc.councilor: "$enclave.8000.start$\n\n$mindwarden_farewell$\n\n$enclave.8000.councilor_end$"
 shroud.4290.desc: "Um problema grave, de fato. Não há escória na galáxia pior do que $end_of_the_cycle_color_article$."
 shroud.4290.a: "$marauder.31.e$"
 shroud.4290.b: "O que é $end_of_the_cycle_color_article$?"
 shroud.4290.b.response: "De acordo com nosso departamento de inteligência, $end_of_the_cycle_color_article$ é uma força cataclísmica que se origina do interior do §HVéu§!. Seu poder pode se manifestar na realidade física graças à cumplicidade de invasores de mentes com sede de poder.\n\nO Fim inflige ruína sobre a galáxia por meio do §R$NAME_Reckoning$§!, um ser violento composto de energia psiônica. Seu objetivo é a completa aniquilação da existência."
 shroud.4290.c: "Como podemos derrotar o §R$NAME_Reckoning$§!?"
 shroud.4290.d: "Queremos aprender as §Y$mindwarden_tactics_modifier$§!."
 shroud.4291.desc: "Que vocês triunfem contra esse grande perigo. Ele ameaça a existência de todos que fazem desta galáxia seu lar."
 shroud.4292.desc: "Desenvolvemos um algoritmo que melhora suas ofensivas contra o §R$NAME_Reckoning$§!. Ele ajusta os sistemas de mira das armas para aumentar a eficácia contra esse tipo específico de entidade psiônica.\n\nEm seu estado atual, cada implementação do código requer uma extensa refatoração de compatibilidade com cada infraestrutura militar. Portanto, esse é um serviço premium, mas achamos que vocês concordarão com o valor do investimento."
 mindwarden_tactics_modifier: "Táticas dos Mentemestras"
 shroud.4295.desc: "$shroud.4205.common$\n\nInicialmente, estávamos preocupados com os relatos sobre seus \"$building_materiality_engine_plural$\". No entanto, após uma análise mais profunda, consideramos esses dispositivos uma solução promissora para a exploração não psiônica do chamado §H\"Véu\"§!.\n\nIncentivamos a ampliação dessa tecnologia e aguardamos futuras oportunidades de cooperação."
 mindwarden_opinion_materiality_engine_tt: "Opinião: £opinion£ §G+$@mindwarden_opinion_materiality_engine|0$§!"
 shroud.4300.desc: "Dirijo-me a você como representante de [mindwarden_enclave_country.GetName].\n\nDe acordo com nossas leituras psiônicas, todo o território de [Root.GetName] foi irremediavelmente corrompido pelo §HVéu§!.\n\nSuas ações selaram seu destino, e nós vamos antecipá-lo."
 shroud.4300.a: "Por que temem o Véu?"
 shroud.4310.desc: "Não o tememos. Nem os seus agentes corrompidos, pois sabemos como combatê-los.\n\nNão espero que vocês, uma sociedade enlouquecida por sua influência, consigam compreender."
 shroud.4320.desc.psionic: "Não basta contaminar a galáxia com energia psiônica?"
 shroud.4320.desc.default: "Somos uma força da ordem nesta galáxia. O que vocês ganhariam nos atacando? Não permaneceremos parados diante de sua hostilidade."
 shroud.4320.desc.common: "Até que confirmem uma interrupção incondicional dos ataques, não há nada a ser discutido."
 shroud.4340.desc: "Estamos cientes de seus acordos com §H[shroudwalker_enclave_country.GetName]§!. Suas ações não apenas legitimam suas transgressões, como também contribuem para a disseminação da corrupção do §HVéu§!.\n\nEnquanto forem aliados deles, não prestaremos nenhum serviço a vocês."
 shroud.4350.desc: "§HNão conseguimos restabelecer contato com [mindwarden_enclave_country.GetName] desde a destruição de sua instalação.\n\nAo sintonizarmos seu canal, ouvimos apenas o silêncio do vazio do espaço.§!"
 enclave_opinion_tt: "Opinião: £opinion£ §G+$@positive_opinion|0$§!"
 mindwarden_rival_opinion_tt: "Opinião a respeito de [event_target:shroudwalker_enclave_country.GetName]: £opinion£ §R$@negative_opinion|0$§!"
 shroudwalker_rival_opinion_tt: "Opinião a respeito de [event_target:mindwarden_enclave_country.GetName]: £opinion£ §R$@negative_opinion|0$§!"
 shroud.4405.title: "$gov_mindwarden_enclave$ Destruído"
 shroud.4405.desc_common: "Nossa ofensiva contra o sistema [mindwarden_enclave_system.GetName] foi um sucesso. Este é o fim de §H[mindwarden_enclave_country.GetName]§!."
 shroud.4405.desc.default: "$shroud.4405.desc_common$ Apesar de não nos importarmos com as práticas que tanto desprezavam, sua cruzada contra o §H\"Véu\"§! representava uma doutrina pseudocientífica que não merece espaço em nossa galáxia."
 shroud.4405.desc.psionic: "$shroud.4405.desc_common$ Eles não espalharão mais discursos ignorantes sobre os perigos do §HVéu§!, e os atenuadores psiônicos de sua estação agora são apenas destroços."
 shroud.4405.desc_end: "Nossa vitória foi um triunfo duplo, pois conseguimos recuperar uma quantidade considerável de recursos dos destroços da estação inimiga."
 shroud.4406.title: "$gov_mindwarden_enclave$ Destruído"
 shroud.4406.desc_common: "Recebemos relatos da erradicação de §H[mindwarden_enclave_country.GetName]§! no sistema [mindwarden_enclave_system.GetName]. O $gov_mindwarden_enclave$ foi incapaz de resistir à investida de §H[mindwarden_destroyer.GetName]§!, que aniquilou sua estação e não deixou nenhum sobrevivente."
 shroud.4406.desc.psionic: "A galáxia está livre do tormento causado pela cruzada antipsiônica deles, contanto que ninguém surja para sucedê-los."
 shroud.4406.desc.default: "Por ora, a galáxia terá que se virar sem os serviços antipsiônicos que eles prestavam."
 shroud.4406.a: "Já vai tarde."
 shroud.6855.desc: "Por favor, saibam que somos gratos por manter uma cooperação estreita com [root.GetName]. Nossas histórias e objetivos estão conectados para sempre."
 shroud.6855.desc.1: "Somos eternamente gratos por sua contribuição para [mindwarden_enclave_country.GetName]. Que nossos laços sejam inabaláveis enquanto houver ameaças psiônicas."
 shroud.6855.desc.2: "Tenha certeza de que seu próximo pagamento de participação nos lucros será feito de forma pontual."
 shroud.6855.b: "Queremos ajudar a expandir seu enclave."
 shroud.6855.b.timeout: "O enclave está atualmente recrutando novos oficiais e tripulação. Melhorias operacionais adicionais só poderão ser implementadas após §Y[mindwarden_enclave_country.upgraded_station_timer]§!."
 shroud.6855.c: "Queremos compartilhar nossa tecnologia com vocês."
 shroud.6855.c.timeout: "O enclave ainda está incorporando a tecnologia que fornecemos anteriormente. Poderemos compartilhar novos avanços após §Y[mindwarden_enclave_country.updating_databanks_timer]§!."
 shroud.6855.d: "Queremos contratar a §Yfrota§! para nossos próprios propósitos."
 shroud.6855.e: "$enclave.205.b$"
 shroud.6855.f: "Pretendemos aumentar nossa capacidade de Enclaves Mentemestras."
 shroud.6855.f.timeout: "Ainda estamos implementando as mudanças infraestruturais relacionadas aos enclaves. Não poderemos aumentar novamente nossa capacidade de Enclaves Mentemestras até §Y[mindwarden_enclave_country.mindwarden_enclave_capacity_bought_timer]§!."
 shroud.6860.1.desc: "Com mais financiamento, poderíamos expandir bastante nossa operação. Poderíamos aumentar o número e as capacidades de nossas frotas e recrutar pesquisadores para desenvolver nossas tecnologias de proteção mental. No fim, toda a galáxia se beneficiaria de seu patrocínio."
 shroud.6860.2.desc: "Precisamos ficar atentos à ameaça variada dos psiônicos. Sua doação generosa nos permitirá ampliar significativamente nossas operações para que elas possam corresponder ao desafio."
 shroud.6860.3.desc: "Avançamos bastante, mas ainda é cedo para descansar. Com mais recursos à nossa disposição, as frotas de [mindwarden_enclave_country.GetName] podem ser despachadas para locais mais distantes da galáxia, protegendo ainda mais mentes da praga psiônica."
 shroud.6860.4.desc: "Seu patrocínio definiu nossa jornada desde o princípio, e nossos objetivos compartilhados continuam os mesmos: preservar o bem-estar mental por meio da erradicação completa de todos os seres psiônicos. Com a sua ajuda, estamos cada vez mais próximos desse objetivo."
 shroud.6860.5.desc: "Se você investir em nossas operações mais uma vez, poderemos nos tornar a maior força antipsiônica da galáxia; o bastião supremo contra a invasão mental para todas as nações entre as estrelas."
 shroud.6860.b: "Temos um acordo, então."
 shroud.6861.desc: "Agradeço. Temos orgulho de trabalhar com vocês para proteger a integridade psíquica de todos os seres inteligentes."
 shroud.6865.desc: "Um empreendimento admirável. Quanto mais $ENCLAVE_MINDWARDEN_PLURAL$ houver na galáxia, mais seguras todas as mentes estarão de uma invasão.\n\nNós podemos oferecer conselhos sobre como melhorar sua eficiência infraestrutural para permitir o estabelecimento e a administração de mais enclaves."
 shroud.6865.b.tt: "$mindwarden_enclave_capacity$: §G+1§!"
 shroud.6870.desc: "Apreciamos sua boa vontade em compartilhar os frutos de sua pesquisa. Qualquer conhecimento que oferecer nos ajudará a aumentar a proteção contra ameaças psiônicas na galáxia."
 shroud.6875.desc: "Ficaríamos honrados em ajudar. As frotas de [mindwarden_enclave_country.GetName] são a vanguarda da tecnologia e táticas antipsiônicas; nenhum agressor invasor de mentes terá chances contra nós. Cada uma é liderada por um comandante com treinamento especial em operações contra oponentes psiônicos."
 mindwarden_tt_hirefleet: "Controle a §YFrota Mentemestra§! deste enclave por 10 anos."
 shroud.6876.desc: "Temos certeza de que a §H[mercenary_fleet.GetName]§! será uma ferramenta efetiva em combater aqueles que brincam com o poder destrutivo dos psiônicos."
 mindwarden_tt_managefleet: "Cancela ou prolonga nosso contrato com a §YFrota Mentemestra§!."
 shroud.6880.desc: "Certamente. Esperamos que a §H[mercenary_fleet.GetName]§! tenha se mostrado uma adição valiosa às suas forças. Deseja cessar ou prolongar o contrato?"
 shroud.6880.a: "$marauder.31.e$"
 shroud.6881.desc: "Muito bem. O contrato foi anulado e a §H[mercenary_fleet.GetName]§! retornará para nós imediatamente. Nossas frotas estarão disponíveis para contratação sempre que você as requisitar."
 #======================
 # Mindwardens origin
 #======================
 origin_mindwardens: "$MINDWARDEN_plural$"
 origin_mindwardens_desc: "$CHALLENGING_ORIGIN$§RATENÇÃO: bloqueia acesso à ['concept_psionic_ascension'].§!\n\nOs ancestrais desta civilização foram atormentados por forças de outros mundos que invadiam suas mentes, levando-os a direcionar esforços e recursos para o desenvolvimento de tecnologias antipsiônicas.\n\nSeus dispositivos antigos ainda estão funcionais, mas não foram testados contra as ameaças psiônicas oriundas dos confins da galáxia."
 origin_tooltip_mindwardens_effects: "- $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering£ ['technology:tech_starbase_3']\n- $HOME_SYSTEM$ Inicia com um §H$tech_starbase_3$§!.\n- $HOMEWORLD$ £building£ ['building:building_ancient_ward_1']\n- Ganha acesso ao §HCasus Belli§! §Y$casus_belli_cb_psionics_containment$§! contra impérios ascendidos psionicamente.\n- §Y$FE_GUARANTEED_COLONIES$§! não aparecem.\n- §Y$ENCLAVE_MINDWARDEN_PLURAL$§! não são gerados no início do jogo."
 SPECIES_CLASS_MUST_USE_ORIGIN_MINDWARDENS: "Requer a §YOrigem ['civic:origin_mindwardens']§!"
 START_SCREEN_MINDWARDENS: "Os registros de nossos ancestrais relatam uma praga psíquica que devastou [GetHomeWorldName]. Forças de outro mundo atacaram suas mentes, e uma radiação devastadora se espalhou pela atmosfera; tudo isso incentivado por praticantes da Psiônica do povo [GetSpeciesAdj].\n\nEm resposta a essas ameaças, nossos ancestrais construíram a $building_ancient_ward_1$ para se proteger contra os invasores mentais. De simples manutenção, essa estrutura venerável se mostrou suficientemente forte para defender os [GetSpeciesNamePlural] da influência psiônica, e sua tecnologia central serviu de base para o desenvolvimento de outras defesas mentais.\n\nAgora, enquanto nossa civilização se prepara para se aventurar além da órbita de [capital_scope.System.GetName], enfrentamos o desconhecido. Que ameaças psíquicas nos aguardam nos misteriosos confins do espaço?"
 mindwarden_system_init_NAME: "$origin_mindwardens$"
 mindwarden_system_init_DESC: "Este sempre será o sistema inicial ao usar a origem $origin_mindwardens$.\n\n$system_initializer_DESC$"
 mindwarden_sol_system_init_NAME: "$origin_mindwardens$ (Sol)"
 mindwarden_sol_system_init_DESC: "Sistema inicial opcional para a origem $origin_mindwardens$, que usa Sol como base.\n\n$system_initializer_DESC$"
 building_ancient_ward_1: "Barreira Ancestral"
 building_ancient_ward_1_desc: "Esta estrutura ancestral utiliza uma matriz de atenuadores psiônicos para isolar todo o planeta contra forças invasoras de mente."
 building_ancient_ward_2: "Barreira Suprema"
 building_ancient_ward_2_desc: "Esta estrutura ancestral foi aprimorada com atenuadores psiônicos reforçados, capazes de proteger contra $PSIONIC_AURA_PLURAL$ em todo o sistema estelar."
 psionic_auras_immunity: "Dissipa progressivamente §Y$PSIONIC_AURA_PLURAL$§! no sistema"
 mindwarden_aura_immunity: ""
 war_goal_wg_end_threat_psionics: "$war_goal_wg_end_threat$"
 war_goal_wg_end_threat_psionics_desc: "A guerra é travada para defender a galáxia contra as ameaças da infecção psiônica."
 casus_belli_cb_psionics_containment: "Confinamento Psiônico"
 NAME_Exiled: "Coro do Sonhador"
 EXILED_SYSTEM_01: "Romash"
 EXILED_SYSTEM_02: "Joroqhi"
 EXILED_SYSTEM_03: "Plenxix"
 EXILED_SYSTEM_04: "Gherribla"
