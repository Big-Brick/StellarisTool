 shroud.4950.title: "Aura Malévola"
 shroud.4950.desc.1: "Nossos dados indicam que esta Aura possui efeitos extremamente nocivos. Sem contramedidas, sua propagação por toda a galáxia será rápida."
 shroud.4950.desc.2: "Detectamos uma $PSIONIC_AURA$ poderosa no sistema §H[from.GetName]§!"
 shroud.4950.desc.3.intro: "$shroud.4950.desc.2$. Segundo nossa equipe de [GetTelepathPlural], a emissão que emana do §HVéu§! é causada pelas atividades psiônicas de"
 shroud.4950.desc.3.default: "$shroud.4950.desc.3.intro$ uma civilização alienígena."
 shroud.4950.desc.3.contact: "$shroud.4950.desc.3.intro$ §H[fromfrom.GetName]§!."
 shroud.4950.desc.4: "$shroud.4190.desc.intro$ Essa §H\"$PSIONIC_AURA$\"§!, assim chamada devido à sua origem presumida, foi detectada no sistema §H[from.GetName]§!."
 shroud.4950.desc.5.intro: "$shroud.4950.desc.2$, cuja origem foi rastreada até o interior das fronteiras de"
 shroud.4950.desc.5.default: "$shroud.4950.desc.5.intro$ uma civilização alienígena."
 shroud.4950.desc.5.contact: "$shroud.4950.desc.5.intro$ §H[fromfrom.GetName]§!."
 shroud.4950.a: "$grand_archive.1100.a$"
 shroud.4955.title: "Um Pressentimento Sombrio"
 shroud.4955.desc.1: "Uma percepção de calamidade iminente agita nossa população."
 shroud.4955.desc.1.gestalt: "$shroud.4955.desc.1$ Nossa equipe de [GetTelepathPlural] detectou uma perturbação simultânea nas energias do §HVéu§!."
 shroud.4955.desc.1.non_gestalt: "$shroud.4955.desc.1$ Segundo nossa equipe de [GetTelepathPlural], até mesmo o §HVéu§! demonstra um desconforto incomum, como se suas forças tremessem em apreensão silenciosa."
 shroud.4955.desc.2.intro: "Nos últimos anos, presenciamos um aumento de eventos catastróficos por toda a galáxia."
 shroud.4955.desc.2.outro: "À medida que detectamos fenômenos cada vez mais estranhos, nossa equipe de [GetResearchers] prevê distúrbios ainda piores no futuro próximo."
 shroud.4955.desc.2.contact_aura: "$shroud.4955.desc.2.intro$ Fomos testemunhas do crescimento inexplicável de §H[from.GetName]§!. Observamos também o avanço de uma §H$PSIONIC_AURA$§! hostil. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.contact_no_aura: "$shroud.4955.desc.2.intro$ Fomos testemunhas do crescimento inexplicável de §H[from.GetName]§!. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.no_contact_aura: "$shroud.4955.desc.2.intro$ Observamos também o avanço de uma §H$PSIONIC_AURA$§! hostil. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.no_contact_no_aura: "$shroud.4955.desc.2.intro$ $shroud.4955.desc.2.outro$"
 shroud.4955.desc.3: "Não sabemos exatamente o que se aproxima, mas sentimos sua vinda com absoluta certeza."
 shroud.4955.a: "Devemos nos preparar para o pior."
 shroud.4955.a.tt: "Se a §H$end_aura$§! cobrir a galáxia, o jogo chegará ao fim."
 shroud.4960.title: "Ameaça Psiônica"
 shroud.4960.desc.1.intro: "A §H$PSIONIC_AURA$§! malévola emitida por"
 shroud.4960.desc.1.outro: "se espalhou pela galáxia em um ritmo alarmante. De acordo com as observações de nossa equipe de [GetResearchers], ela tem causado efeitos adversos em inúmeros sistemas estelares."
 shroud.4960.desc.1.contact: "$shroud.4960.desc.1.intro$ §H[from.GetName]§! $shroud.4960.desc.1.outro$"
 shroud.4960.desc.1.no_contact: "$shroud.4960.desc.1.intro$ uma civilização alienígena desconhecida $shroud.4960.desc.1.outro$"
 shroud.4960.desc.2: "Segundo nossos dados mais recentes, ela já tomou metade da galáxia conectada por hiperestradas. A força por trás desse fenômeno parece determinada a causar destruição em escala galáctica – e se não for contida, é provável que alcance seu objetivo."
 shroud.4960.a: "Ela deve ser contida."
 shroud.4960.a.tt: "Pode declarar ['concept_total_war'] contra §H[from.GetName]§!.\n$shroud.4955.a.tt$"
 shroud.4965.title: "Colapso Iminente"
 shroud.4965.desc.1.intro: "A §H$PSIONIC_AURA$§! devastadora emitida por"
 shroud.4965.desc.1.outro: "continua a se espalhar pela galáxia. Atualmente, ocupa a maioria dos sistemas estelares."
 shroud.4965.desc.1.contact: "$shroud.4960.desc.1.intro$ §H[from.GetName]§! $shroud.4960.desc.1.outro$"
 shroud.4965.desc.1.no_contact: "$shroud.4960.desc.1.intro$ uma civilização alienígena desconhecida $shroud.4960.desc.1.outro$"
 shroud.4965.desc.2: "Sem contramedidas rápidas e eficazes, enfrentaremos uma catástrofe galáctica."
 shroud.4965.a: "Esta é a batalha final."
