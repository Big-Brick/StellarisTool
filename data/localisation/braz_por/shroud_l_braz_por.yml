 EXILED_COLONY_01: "Dhorodh"
 EXILED_COLONY_02: "Ix-Travunnh"
 EXILED_COLONY_03: "Ob-Ratak"
 EXILED_COLONY_04: "Dax-i-Hafa"
 EXILED_COLONY_05: "Blorr"
 EXILED_COLONY_06: "Frorzak"
 shroud.6020.name: "$UNKNOWN_LONG$"
 shroud.6020.desc: "§HConforme tentamos fazer contato, nossa tripulação sofre pontadas de dores de cabeça intermitentes...§!"
 shroud.6030.name: "[exiled_country.GetName]"
 shroud.6030.desc: "§HApesar de tentativas repetidas, não obtivemos respostas de [exiled_country.GetName] às nossas comunicações.§!"
 shroud.6050.name: "Correlações Estranhas"
 shroud.6050.desc: "Nossa §H$building_ancient_ward_1$§! de supressão psiônica está produzindo leituras irregulares. Normalmente isso resulta de picos de atividade psiônica em [Root.GetHomeWorldName], mas não encontramos nenhuma evidência de tal perversidade.\n\nA resposta talvez esteja além de nossas fronteiras. Imagens de longa distância mostram uma explosão de fluxo de uma estranha energia no sistema §H[exiled_system_border.GetName]§!, o que se correlaciona com as medições erráticas da $building_ancient_ward_1$."
 shroud.6050.a: "Precisamos explorar [exiled_system_border.GetName]."
 shroud.shared_text_psy_symptoms: "desordem emocional; estresse mental debilitante; visões recorrentes de horrores indescritíveis"
 shroud.shared_text_psi_radiation: "Esses fenômenos correspondem de forma precisa às experiências registradas por nossos ancestrais. É muito provável que seja o que chamavam de \"radiação psiônica\", uma forma particularmente destrutiva de emissão energética."
 shroud.shared_text_ship_malfunction: "Os sistemas da frota também estão sofrendo falhas severas, tornando a maior parte de suas funções inoperante."
 shroud.6100.name: "Energia Perigosa"
 shroud.6100.desc.no_border_aura: "Uma situação alarmante está se desenvolvendo no recém-explorado sistema §H[from.GetName]§!. A tripulação da [root.GetName] apresenta uma variedade de sintomas psicológicos: $shroud.shared_text_psy_symptoms$. Os sistemas da frota também estão apresentando falhas estranhas e irregulares.\n\n$shroud.shared_text_psi_radiation$ Pela primeira vez longe da proteção da §H$building_ancient_ward_1$§! em §H[owner.GetHomeWorldName]§!, enfrentamos a praga mental sobre a qual nossos antepassados nos alertaram.\n\nDepois de calibrar nossos scanners de longo alcance para detectar essa forma única de energia, descobrimos que a origem das emissões perigosas está no sistema próximo, §H[exiled_center_system.GetName]§!. $shroud.6100.desc.end$"
 shroud.6100.desc.border_aura: "A tripulação da [root.GetName] está em perigo.\n\nAo serem expostos aos níveis extremamente elevados de radiação psiônica no sistema §H[from.GetName]§!, passaram a apresentar sintomas psicológicos ainda piores do que os previamente relatados. $shroud.shared_text_ship_malfunction$\n\nScanners de longo alcance indicam níveis ainda mais altos de radiação no sistema próximo, §H[exiled_center_system.GetName]§!. $shroud.6100.desc.end$"
 shroud.6100.desc.end: "Enviar qualquer uma de nossas naves para regiões mais profundas é fortemente desaconselhado até que possamos avaliar seus efeitos com mais precisão."
 shroud.6100.tt: "Preparar para iniciar o processo de §Y$first_contact$§!."
 shroud.6110.name: "Uma Presença no Sistema [This.System.GetName]"
 shroud.6110.desc: "Incrivelmente, o sistema §H[This.System.GetName]§! parece abrigar uma quantidade de grandes objetos que aparentam ter sido construídos por uma forma de inteligência. Podemos aprender mais detalhes sobre seus criadores, chamados de §H[This.ContactCountry.GetName]§!, ao iniciar comunicações diretas a partir de uma distância segura.\n\nQualquer forma de vida presente no sistema corre sério risco diante da intensa radiação psiônica que registramos."
 fcsum_exiled_1: "Descobrimos evidências de uma provável inteligência alienígena no sistema §H[This.System.GetName]§!."
 shroud.6115.name: "Progresso Limitado"
 shroud.6115.desc: "Estudos adicionais confirmaram que os objetivos no sistema §H[This.System.GetName]§! são naves espaciais alienígenas, embora ainda não tenhamos feito contato direto com os ocupantes de nenhuma delas.\n\nDe forma preocupante, a equipe enviada por [exiled_envoy.GetName] relata que passou a sofrer sintomas parapsicológicos, incluindo visões inexplicáveis de seres estranhos presentes em [This.System.GetName]. Apesar dessas preocupações, seu compromisso com a missão continua inabalado."
 shroud.6115.a: "Continue assim."
 fcsum_exiled_2: "Ainda não conseguimos estabelecer contato com §H[This.ContactCountry.GetName]§!. O indivíduo que enviamos como Emissão relatou preocupações a respeito de sua equipe."
 shroud.6120.name: "Missão Cancelada"
 shroud.6120.desc: "Após longos meses de silêncio, recebemos uma transmissão de [exiled_envoy.GetName]. Apesar de a objetividade ser um de seus pontos fortes, o relato que recebemos é desconexo e confuso, e continha descrições de imagens estranhas, aparentemente uma mistura de sonhos e delírio. Nenhum membro da equipe enviada conseguiu fornecer informações mais coerentes.\n\nTodos foram afastados de suas funções, e a missão foi suspensa por tempo indeterminado. Seja o que for essa presença em §H[This.System.GetName]§!, está além de nossa capacidade de investigação segura."
 fcsum_exiled_3: "Após uma missão traumática, nossa equipe retornou para casa antes de estabelecer contato com §H[This.ContactCountry.GetName]§!."
 shroud.6125.desc: "Pairando sobre correntes revoltas. §H[Root.Capital.GetName]§!, ou...?\n\n§H... chamando...§!\n\nA superfície se retorce e se abre. Um miasma fétido irrompe das profundezas invisíveis.\n\n§H... resposta... nenhuma...§!\n\nIncessante. Sufocante.\n\nÉ terrível."
 MESSAGE_FIRST_CONTACT_ABORTED_EXILED_DESC: "Nosso processo de $first_contact$ com $COUNTRY|H$ foi abortado por decreto executivo."
 shroud.shared_text_aura_spread: "A \"infecção\" psiônica nas proximidades se espalhou pelo sistema §H[exiled_system_border.GetName]§!.\n\nApesar das proteções oferecidas pela §H$building_ancient_ward_1$§!, essa violação fez nossa população em §H[Root.GetHomeWorldName]§! apresentar sintomas leves compatíveis com contaminação por radiação psiônica. Nossas projeções indicam que a praga mental avançará em breve para o sistema §H[Root.home_planet.System.GetName]§!, onde será um perigo ainda maior para o nosso mundo natal."
 shroud.shared_text_aura_study: "Apesar dos riscos, nossa esperança mais promissora de proteção é estudar esse fenômeno mais próximo da fonte."
 shroud.6200.name: "Radiação Psiônica em §H[Root.GetHomeWorldName]§!"
 shroud.6200.desc.no_visit: "Uma situação alarmante está se desenvolvendo em §H[Root.GetHomeWorldName]§!. A população está apresentando uma variedade de sintomas psicológicos: $shroud.shared_text_psy_symptoms$.\n\n$shroud.shared_text_psi_radiation$ Aqueles fora da proteção de nossa §H$building_ancient_ward_1$§! estão enfrentando a praga mental da qual nossos antepassados nos alertaram.\n\nDepois de calibrar nossos scanners de longo alcance para detectar essa forma única de energia, descobrimos que essas emissões perigosas estão se espalhando para além do sistema §H[exiled_system_border.GetName]§!. $shroud.shared_text_aura_study$"
 shroud.6200.desc.visit_no_ship: "$shroud.shared_text_aura_spread$\n\n$shroud.shared_text_aura_study$"
 shroud.6200.desc.visit_and_ship: "$shroud.shared_text_aura_spread$\n\nDesde a exposição a níveis alarmantes de radiação psiônica, a tripulação da §H[event_target:ship_in_border.GetName]§!, em [exiled_system_border.GetName], vem apresentando um quadro de distúrbios psicológicos ainda mais severos do que o relatado anteriormente. $shroud.shared_text_ship_malfunction$\n\n$shroud.shared_text_aura_study$"
 shroud.6200.a: "Temos que descobrir como conter essa infecção."
 PSI_RADIATION_PROJECT: "Radiação Psiônica"
 PSI_RADIATION_PROJECT_DESC: "Os níveis de radiação psiônica no sistema §H[exiled_system_border.GetName]§! aumentaram repentinamente, e os efeitos já podem ser sentidos em §H[Owner.GetHomeWorldName]§!. Precisamos estudar esse fenômeno de perto, antes que venha a representar um perigo ainda maior para nossa população."
 shroud.6205.name: "$PSIONIC_AURA_PLURAL$"
 shroud.6205.desc.start: "Nossos pesquisadores sofreram terrivelmente com a radiação psiônica tóxica no sistema §H[exiled_system_border.GetName]§!, mas sua missão resultou em descobertas importantes.\n\nDenominamos esse fenômeno alarmante de §H\"$PSIONIC_AURA$\"§!, uma massa destrutiva de energia que afeta nossas mentes e nossa tecnologia. Ela se espalhou a partir do sistema §H[exiled_center_system.GetName]§!, onde as energias psiônicas atingiram níveis tão extremos que se expandiram para outros sistemas estelares."
 shroud.6205.desc.aura_home: "$shroud.6205.desc.start$\n\nJá alcançou o sistema §H[Root.home_planet.System.GetName]§!, onde os efeitos foram devastadores. $shroud.6205.desc.end$"
 shroud.6205.desc.no_aura_home: "$shroud.6205.desc.start$\n\nSe atingir nosso sistema, §H[Root.home_planet.System.GetName]§!, as consequências serão igualmente catastróficas. $shroud.6205.desc.end$"
 shroud.6205.desc.end: "A §H$building_ancient_ward_1$§! em §H[Root.GetHomeWorldName]§! oferece apenas proteção limitada."
 shroud.6205.a: "Precisamos fortalecer a $building_ancient_ward_1$."
 PSIONIC_AURA_RESISTANCE_PROJECT: "Resistência à $PSIONIC_AURA$"
 PSIONIC_AURA_RESISTANCE_PROJECT_DESC: "A §H$building_ancient_ward_1$§! construída por nossos ancestrais em §H[Owner.GetHomeWorldName]§! foi projetada para nos proteger contra a radiação psiônica. O avanço de §H$PSIONIC_AURA_PLURAL$§! ameaça sobrecarregar sua capacidade atual. Com base no que aprendemos até agora, acreditamos ser possível aprimorar suas propriedades de resistência."
 shroud.6210.name: "Atenuação Psiônica"
 shroud.6210.desc: "Nossos incansáveis pesquisadores desenvolveram um método para reforçar a §H$building_ancient_ward_1$§! em §H[Root.GetHomeWorldName]§!. Ao aprimorar os atenuadores psiônicos, a proteção pode ser ampliada não só para todo o planeta, mas para todo o sistema §H[Root.home_planet.System.GetName]§!.\n\nEssa pesquisa impulsionou estudos mais amplos sobre essa tecnologia ancestral. Agora sabemos que o vínculo entre radiação psiônica e a mente do povo [Root.GetSpeciesAdj] é recíproco: essas emissões afetam nossos estados mentais, e nossos estados mentais influenciam os níveis de radiação psiônica. Parece que nosso antigo tabu contra as práticas psiônicas tinha, de fato, embasamento científico."
 shroud.6210.a: "Fascinante... e preocupante."
 shroud.6210.a.tt: "$BEGINS_EVENT_CHAIN$ §Y$ancient_ward_upgrade_chain_title$§!"
 ancient_ward_upgrade_chain_title: "A $building_ancient_ward_2$"
 ancient_ward_upgrade_chain_desc: "A §H$building_ancient_ward_1$§! em §H[Owner.GetHomeWorldName]§! atingiu seus limites funcionais. Para enfrentar a ameaça psiônica que se aproxima, será necessário ampliar ainda mais suas capacidades. Essa nova §H$building_ancient_ward_2$§! será capaz de proteger nossa população contra a praga das §H$PSIONIC_AURA_PLURAL$§!."
 ancient_ward_upgraded: "Construção Aprimorada"
 shroud.6215.name: "A $building_ancient_ward_2$ foi concluída"
 shroud.6215.desc.aura_home: "Com a conclusão da §H$building_ancient_ward_2$§!, a radiação psiônica no sistema §H[Root.home_planet.System.GetName]§! foi reduzida a níveis controláveis. A população de §H[Root.GetHomeWorldName]§! está se recuperando aos poucos dos efeitos adversos."
 shroud.6215.desc.no_aura_home: "Com a conclusão da §H$building_ancient_ward_2$§!, a radiação psiônica em §H[Root.GetHomeWorldName]§! foi reduzida a níveis controláveis. A população está se recuperando aos poucos dos efeitos adversos."
 shroud.6215.desc.end: "Ainda assim, essa §H$PSIONIC_AURA$§!, e possivelmente outras, continuam a envenenar a galáxia. Nossos cientistas levantam a hipótese de que a tecnologia da $building_ancient_ward_2$ pode ser aplicada no desenvolvimento de um §H\"$SHROUD_SEAL$\"§! mais poderoso. Essas estruturas colossais devem ser capazes de suprimir Auras em aglomerados estelares inteiros. A construção de um $SHROUD_SEAL$ no sistema §H[exiled_system_border.GetName]§! marcaria um passo crucial no controle da ameaça psiônica."
 shroud.6215.a: "Essa pesquisa merece ser levada adiante."
 build_shroud_seal_poi_desc: "Após concluir a pesquisa da tecnologia de §H$tech_psionic_suppression$§!, poderemos utilizar uma $constructor$ para construir um §H$SHROUD_SEAL$§! em um poço gravitacional estelar. Essa estrutura conterá as §H$PSIONIC_AURA_PLURAL$§! por todo o sistema estelar e sistemas adjacentes conectados por hiperestradas."
 shroud_seal_construction_chain_title: "Construção do $SHROUD_SEAL$"
 shroud_seal_construction_chain_desc: "Nossos cientistas acreditam que é possível desenvolver uma tecnologia de §H$tech_psionic_suppression$§! mais avançada, capaz de conter §H$PSIONIC_AURA_PLURAL$§! em aglomerados estelares inteiros.\n\nEssa tecnologia permitirá a construção de um §H$SHROUD_SEAL$§!. Construir um dispositivo tão poderoso no sistema §H[exiled_system_border.GetName]§! será um avanço significativo no controle da ameaça psiônica atual."
 tech_psionic_suppression_researched: "$tech_psionic_suppression$ Pesquisada"
 shroud_seal_built: "$SHROUD_SEAL$ Construído"
 shroud_6216_poi: "[exiled_system_border.GetName]"
 shroud_6216_poi_desc: "$build_shroud_seal_poi_desc$"
 shroud.6220.name: "Radiação Extrema"
 shroud.6220.desc: "Após a exposição a níveis extremamente elevados de radiação psiônica no sistema §H[exiled_system_border.GetName]§!, a tripulação da §H[Root.GetName]§! passou a apresentar sintomas psicológicos ainda piores do que os previamente relatados. $shroud.shared_text_ship_malfunction$"
 shroud.6225.name: "Radiação em §H[Root.home_planet.System.GetName]§!"
 shroud.6225.desc.shared: "Os efeitos adversos do envenenamento por radiação psiônica já são evidentes na população de §H[Root.GetHomeWorldName]§!, e a funcionalidade de nossas naves está severamente comprometida."
 shroud.6225.desc.know_aura: "A §H$PSIONIC_AURA$§! se espalhou pelo sistema §H[Root.home_planet.System.GetName]§!. $shroud.6225.desc.shared$\n\nÉ mais urgente do que nunca fortalecer a §H$building_ancient_ward_1$§!."
 shroud.6225.desc.no_know_aura: "A praga psiônica se espalhou pelo sistema §H[Root.home_planet.System.GetName]§!. $shroud.6225.desc.shared$\n\nÉ mais urgente do que nunca compreender essa contaminação."
 shroud.6225.a: "Não podemos perder tempo."
 shroud.6225.a.know_aura.tt: "A §H$PSIONIC_AURA$§! de §H[exiled_country.GetName]§! tem os seguintes efeitos:\n$effect_exiled_aura$"
 shroud.6225.a.no_know_aura.tt: "Este fenômeno psiônico tem os seguintes efeitos:\n$effect_exiled_aura$"
 effect_exiled_aura: "- $MOD_SHIP_FIRE_RATE_MULT$: §R-125%§!\n- $MOD_SHIP_SHIELD_MULT$: §R-200%§!\n- $MOD_SHIP_EVASION_MULT$: §R-100%§!\n- $mod_planet_jobs_produces_mult$: §R-30%§!\n- $mod_planet_pops_upkeep_mult$: §R+100%§!\n- $MOD_PLANET_BUILDING_TIME_MULT$: §R+100%§!"
 shroud.6231.name: "A Perda de §H[Root.GetHomeWorldName]§!"
 shroud.6231.desc: "Perdemos o controle de nosso mundo natal, §H[Root.GetHomeWorldName]§!. Ele é a nossa principal fonte de conhecimento, e o nexus de todos os empreendimentos de nossa sociedade. Não podemos esperar continuar nossos esforços antipsiônicos sem recuperá-lo."
 shroud.6231.a: "Precisamos recuperar o controle imediatamente."
 shroud_6231_poi: "[root.GetHomeWorldName]"
 shroud_6231_poi_desc: "Precisamos recuperar o controle de §H[Root.GetHomeWorldName]§! imediatamente."
 shroud_reclaim_homeworld_chain_title: "Recuperando §H[root.GetHomeWorldName]§!"
 shroud_reclaim_homeworld_chain_desc: "Perdemos o controle de nosso mundo natal, §H[Root.GetHomeWorldName]§!. Ele é a nossa principal fonte de conhecimento, e o nexus de todos os empreendimentos de nossa sociedade. Não podemos esperar continuar nossos esforços antipsiônicos sem recuperá-lo."
 homeworld_reclaimed: "Mundo Natal Recuperado"
 shroud.6241.name: "Recuperamos §H[root.GetHomeWorldName]§!"
 shroud.6241.desc: "Recuperamos o controle de nosso mundo natal, §H[root.GetHomeWorldName]§!. Os esforços antipsiônicos de [root.GetName] podem voltar com força total."
 shroud.6241.a: "$EXCELLENT$"
 shroud.6300.name: "Sombras do Véu"
 shroud.6300.desc: "Nossos cientistas concluíram o desenvolvimento da tecnologia avançada de §H$tech_psionic_suppression$§!. Agora podemos replicar os efeitos da $building_ancient_ward_2$ em qualquer colônia sob nosso controle ao construir um $building_psionic_suppressor$.\n\nNo entanto, para conter a propagação de §H$PSIONIC_AURA_PLURAL$§! em outros sistemas, será necessário construir um dispositivo mais poderoso conhecido como §H$SHROUD_SEAL$§!.$shroud.shared_text_shroud_seal$\n\nEssa pesquisa também deu credibilidade a uma teoria perturbadora: parece que realmente existe um reino etéreo conhecido como §HVéu§!; uma dimensão de energia psiônica descrita em antigos textos ocultistas. A teoria sugere que a atividade cognitiva de seres sencientes pode causar a transferência de energia do Véu para o plano observável, originando as chamadas $PSIONIC_AURA_PLURAL$.\n\nIsso significa que não estamos lidando apenas com forças objetivas do universo, mas possivelmente com ações calculadas cuja natureza e propósito permanecem desconhecidos."
 shroud.6300.a: "Então o §H\"Véu\"§! realmente existe...?"
 shroud.6500.name: "Transmissão Inesperada"
 shroud.6500.desc: "Estamos recebendo uma transmissão inesperada originária de além do sistema §H[exiled_system_border.GetName]§!. Inexplicavelmente, a liderança de §H[exiled_country.GetName]§! adquiriu domínio total sobre nossa linguagem e sistemas de comunicação."
 shroud.shared_screen_figure: "§HA figura na tela se comunica com um ritmo constante e hipnótico, pontuado por longas pausas.§!\n\nVizinhos distantes, diante da ausência de resposta ao nosso contato, recorremos à monotonia das comunicações técnicas primitivas.\n\nSou §HUk-Hogolath Scarat§!, Psiarca de §H[exiled_country.GetName]§!. O assunto é urgente, por isso peço perdão pela falta de formalidade."
 shroud.shared_auric_flow_inhibition: "está inibindo o fluxo de nossa aura. Entendemos que essa situação intolerável seja fruto de um erro ignorante de sua parte.\n\nA aura beneficia a todos. Ela deve iluminar toda a galáxia. Para demonstrar seu compromisso com o bem maior, exigimos que desmontem imediatamente a tal estrutura chamada"
 shroud.6505.name: "$shroud.6500.name$"
 shroud.6505.desc: "$shroud.6500.desc$"
 shroud.6510.name: "Psiarca Uk-Hogolath Scarat"
 shroud.6510.desc: "$shroud.shared_screen_figure$ Seu dispositivo no sistema §H[exiled_system_border.GetName]§! $shroud.shared_auric_flow_inhibition$ \"$SHROUD_SEAL$\"."
 shroud.6510.a: "Não recebemos nenhuma comunicação prévia de sua parte."
 shroud.6515.desc: "Falamos por meio da voz verdadeira. Se tivessem escutado, teriam ouvido o chamado interior. Vocês têm o dom, mas escolheram suprimi-lo."
 shroud.6515.a: "A aura é destrutiva. Uma praga."
 shroud.6520.desc: "Sua compreensão é falha. A aura é uma dádiva sagrada de nosso protetor. Ela aniquila tudo o que busca causar destruição."
 shroud.6520.a: "E se recusarmos suas exigências?"
 shroud.6525.desc: "Quem quer que ameace a aura deverá ser subjugado. Se recusarem, seremos obrigados a agir militarmente."
 shroud.6525.a: "O Selo não será desmontado."
 shroud.6525_heritage.a: "Jamais destruiremos nosso legado."
 shroud.6525.b: "Concordamos em desmontar o Selo."
 shroud.6530.desc: "Tolos ignorantes."
 shroud.6535.desc: "Uma decisão sábia."
 shroud.6550.name: "Hostilidades Adiadas"
 shroud.6550.desc: "Para evitar um confronto direto com §H[exiled_country.GetName]§!, atendemos às suas exigências e desmontamos o $SHROUD_SEAL$ no sistema §H[exiled_system_border.GetName]§!.\n\nA exposição aos responsáveis pela praga psiônica causou grande inquietação em §H[this.GetName]§!. A remoção do $SHROUD_SEAL$ servirá apenas como apaziguamento temporário. Mais cedo ou mais tarde, também exigirão que desmontemos nossa §H$building_ancient_ward_2$§!, e isso é algo que não podemos aceitar.\n\nDe todo modo, um conflito futuro parece ser apenas uma questão de tempo."
 shroud.6550.a: "Devemos estar preparados."
 shroud.6560.name: "$shroud.6510.name$"
 shroud.6560.desc: "$shroud.shared_screen_figure$ Uma estrutura em §H[capital_scope.GetName]§! $shroud.shared_auric_flow_inhibition$ \"$building_ancient_ward_2$\"."
 shroud.6560.a: "$shroud.6510.a$"
 shroud.shared_psiarch_transmission: "§HAssim que a imagem é exibida, a figura do Psiarca profere uma repreensão fria e indiferente.§!\n\n[This.GetSpeciesNamePlural], é com grande decepção que faço esta transmissão."
 shroud.shared_auric_flow_disdain: "Suas ações apenas confirmaram sua ignorância. Desdenhar do fluxo da aura e da elevação psiônica como um todo é uma afronta incompatível com a paz intragaláctica. Não nos resta outra escolha.\n\nPreparem-se para enfrentar nossas frotas."
 shroud.6570.name: "$shroud.6510.name$"
 shroud.6570.desc: "$shroud.shared_psiarch_transmission$ Apesar de terem concordado em desmontar o $SHROUD_SEAL$, sabemos que vocês mantêm uma estrutura em §H[capital_scope.GetName]§! com capacidades similares. Suas intenções são claras. $shroud.shared_auric_flow_disdain$"
 shroud.6570.a: "Você deve fazer o mesmo. Encerrar a transmissão."
 shroud.6575.name: "$shroud.6570.name$"
 shroud.6575.desc: "$shroud.shared_psiarch_transmission$ A reconstrução do $SHROUD_SEAL$ extinguiu qualquer resquício de esperança em sua redenção. $shroud.shared_auric_flow_disdain$"
 shroud.6575.a: "$shroud.6570.a$"
 shroud.6580.name: "Selando §H[exiled_center_system.GetName]§!"
 shroud.6580.desc: "Com os colossais atenuadores psiônicos ativados, nosso §H$SHROUD_SEAL$§! inicia a purificação do sistema §H[exiled_center_system.GetName]§!, expulsando a §H$PSIONIC_AURA$§!.\n\nAnálises interestelares confirmaram que o restante do território inimigo está conectado diretamente a [exiled_center_system.GetName] por uma hiperestrada. Esse único $SHROUD_SEAL$ tem, portanto, a capacidade de dissipar $PSIONIC_AURA_PLURAL$ em toda a extensão do território de §H[exiled_country.GetName]§!.\n\nNossa vitória depende da proteção do Selo."
 shroud.6580.a: "Defendê-lo é crucial."
 shroud.6600.name: "A Assembleia dos Caminhos Mentais"
 shroud.6600.desc: "A colônia dominada pela ameaça psiônica em §H[current_planet.GetName]§! foi conquistada.\n\nDescobrimos que a §H$PSIONIC_AURA$§! presente neste sistema estava sendo amplificada pelas interações psíquicas da população com o §HVéu§!. Essas práticas eram conduzidas por um grupo de telepatas de elite, conhecido como §HAssembleia dos Caminhos Mentais§!. Esse culto psiônico promove a devoção a uma \"Entidade Patronal\", supostamente um ser poderoso originário do Véu, conhecido apenas como §H$r_the_lost_patron$§!.\n\nSeus textos sagrados fazem repetidas referências a um artefato que ainda estaria no planeta §H[other_planet.GetName]§! e tem ligação com o ser mencionado. Adquirir esse objeto nos ajudará a conter o avanço de sua influência."
 shroud.6600.a: "Trace um curso para [other_planet.GetName]."
 shroud.6601.name: "Ruínas em [current_planet.GetName]"
 shroud.6601.desc: "Concluímos nossa colonização de §H[current_planet.GetName]§!, um antigo planeta de [exiled_country.GetName].\n\nEm meio aos velhos registros, descobrimos que a $PSIONIC_AURA$ anteriormente presente neste sistema gerou interações psíquicas da população com o §HVéu§!. Essas práticas eram conduzidas por um culto psiônico que promovia a devoção a uma \"Entidade Patronal\", supostamente um ser poderoso originário do Véu, conhecido como §H$r_the_lost_patron$§!.\n\nFragmentos de seus textos sagrados fazem referência a um artefato relacionado a esse ser, que ainda estaria no planeta §H[other_planet.GetName]§!. Para assegurar nosso controle sobre esse objeto, precisaremos conquistar [other_planet.GetName] de forma mais calculada, deixando parte de sua população intacta."
 shroud.6601.a: "$shroud.6600.a$"
 shroud.6700.name: "$SANCTUM_OF_THE_LOST$"
 shroud.6700.desc.common: "Iniciamos imediatamente uma repressão total contra todas as práticas psiônicas nesses mundos, neutralizando por completo sua abominável §H$PSIONIC_AURA$§!.\n\nNa principal metrópole do planeta encontra-se uma torre em ruínas, conhecida como §H$SANCTUM_OF_THE_LOST$§!: o antigo templo supremo do culto psiônico de um império agora devastado. Nossos soldados relatam que o local emana uma presença mística e inquietante.\n\nA câmara mais interna da estrutura abriga um \"casulo\" selado, que emite uma forte radiação psiônica. Munições convencionais se mostraram ineficazes contra sua carapaça. Investigações adicionais serão necessárias para eliminar a ameaça potencial que esse objeto representa à nossa segurança."
 shroud.6700.desc.contact: "A conquista de §H[current_planet.GetName]§! marcou nossa vitória final contra §H[exiled_country.GetName]§!. $shroud.6700.desc.common$"
 shroud.6700.desc.no_contact: "Ao conquistar §H[current_planet.GetName],§! ganhamos o controle do território que uma vez foi um império conhecido como §H[exiled_country.GetName]§!. $shroud.6700.desc.common$"
 shroud.6700.a: "Notícias preocupantes... Investigue mais."
 shroud.6705.name: "$psionic_threat_eliminated$"
 shroud.6705.desc.common: "Uma inspeção preliminar mostrou evidências de uma extensa rede de construções no planeta, provavelmente a sede da escória psiônica. Agora restam apenas vestígios degradados.\n\nTalvez nunca saibamos que segredos degenerados essas estruturas abrigam, ou a verdadeira natureza das práticas covardes de seus ocupantes. De qualquer maneira, o sistema está livre dos últimos traços de sua $PSIONIC_AURA$, nos deixando a salvo do mal que uma vez causou."
 shroud.6705.desc.contact: "A erradicação da população em §H[current_planet.GetName]§! marcou o fim do império conhecido como §H[exiled_country.GetName]§!.\n\n$shroud.6705.desc.common$"
 shroud.6705.desc.no_contact: "A erradicação da população em §H[current_planet.GetName]§! marcou o fim de uma ameaça psiônica devastadora.\n\n$shroud.6705.desc.common$"
 shroud.6705.a: "Que tais ameaças sejam todas aniquiladas."
 psionic_threat_eliminated: "Ameaça Psiônica Eliminada"
 psionic_threat_eliminated_desc: "A erradicação do império psiônico baniu sua $PSIONIC_AURA$ da galáxia, trazendo paz para a mente de nossa população."
 SANCTUM_OF_THE_LOST: "Sanctum do Sonhador"
 SANCTUM_OF_THE_LOST_DESC: "Nas ruínas do $SANCTUM_OF_THE_LOST$ em §H[sanctum_of_the_lost_planet.GetName]§!, encontramos um \"casulo\" selado que emite níveis perigosos de radiação psiônica. Precisamos conduzir pesquisas no local para eliminar qualquer ameaça que esse objeto possa representar."
 shroud.6710.name: "O Poder Interior"
 shroud.6710.desc: "Nossos pesquisadores realizaram uma análise minuciosa do \"casulo\" em §H[sanctum_of_the_lost_planet.GetName]§!.\n\nAs análises externas dessa estrutura imponente revelaram que se trata de um receptáculo altamente seguro, projetado para conter uma entidade psiônica poderosa. Apesar das camadas isolantes compostas de ligas metálicas densas, níveis elevados de radiação psiônica continuam a emanar da contenção.\n\nUm conjunto de atenuadores psiônicos foi instalado ao redor do casulo que, quando ativados, fizeram com que todos nas proximidades fossem acometidos por intenso desconforto neural.\n\nA superfície do casulo se retorceu, e sua forma oval transformou-se em uma hélice pulsante. Uma fresta se abriu, e estamos recebendo uma comunicação direta do interior..."
 cannot_found_mindwarden_enclave: "É preciso assegurar a segurança psíquica do império"
 shroud.6800.name: "$MINDWARDENS_THE_FIRST_ENCLAVE$"
 shroud.6800.desc: "Acumulamos um vasto conhecimento sobre o §HVéu§! e desenvolvemos tecnologias avançadas para suprimir seus efeitos nocivos. Enquanto debatemos como aplicar esse domínio em escala galáctica, nossos comandantes de frota apresentaram uma proposta interessante.\n\nEles sugerem o estabelecimento de uma de nossas frotas como um §H\"$gov_mindwarden_enclave$\"§!, que prestaria assistência antipsiônica em toda a galáxia. $shroud.shared_enclave_investement$"
 shroud.6800.a: "Uma iniciativa digna."
 shroud.6800.a.tt: "Qualquer frota com tamanho igual ou superior a §Y30§! pode ser convertida em um §H$gov_mindwarden_enclave$§!."
 shroud.6825.name: "Fundação do $gov_mindwarden_enclave$"
 shroud.6825.desc_first: "Identificamos §H[This.GetName]§! como possível candidata para formar a base de nosso primeiro §H$gov_mindwarden_enclave$§!. Com a devida autorização, a frota estabelecerá uma nova instalação no sistema §H[This.Solar_System.GetName]§! e começará imediatamente a oferecer serviços antipsiônicos."
 shroud.6825.desc_default: "Estamos considerando transformar §H[This.GetName]§! em um §H\"$gov_mindwarden_enclave$\"§! independente, encarregado de oferecer assistência antipsiônica por toda a galáxia. $shroud.shared_enclave_investement$"
 shroud.6825.a: "Prossiga com a construção."
 shroud.6825.a.tt: "Um §H$gov_mindwarden_enclave$§! foi fundado."
 shroud.6825.b: "Vamos reconsiderar."
 shroud.6830.name: "Os $MINDWARDEN_plural$"
 shroud.6830.desc: "O confronto com o §HVéu§! e com o uso irresponsável de habilidades psiônicas fortaleceu nosso povo e nos deu clareza quanto aos nossos objetivos. A fundação do primeiro §H$gov_mindwarden_enclave$§! marca o início de uma nova era de cura e resistência.\n\nPor toda a galáxia, nenhuma mente precisa mais ser invadida por agressores psiônicos, e nenhum mundo precisa ser assombrado pelas forças do Véu.\n\nAssim começa a era dos $MINDWARDEN_plural$."
 shroud.6830.a: "Nossa jornada é apenas o começo."
 shroud.shared_enclave_investement: "Nosso investimento inicial financiaria a construção de uma estação espacial, em troca, receberíamos uma parte das receitas futuras. A autonomia operacional deles permitirá a expansão dessas instalações em maior escala.\n\nComo parte do acordo, também poderemos usar seus serviços e receber parte do valor investido de volta."
 shroud.6841.name: "O Enclave [mindwarden_enclave_country.GetName] Rende Dividendos"
 BEGINS_EVENT_CHAIN: "Inicia a Cadeia de Eventos:"
 ENDS_EVENT_CHAIN: "Termina a Cadeia de Eventos:"
 the_exiled_become_hostile: "§H[exiled_country.GetName]§! ficou hostil conosco."
 start_psionic_war_chain: "$BEGINS_EVENT_CHAIN$ §Y$the_psionic_war_chain_title$§!"
 shroud_seal_dismantled: "O §HSelo do Véu§! em §H[exiled_system_border.GetName]§! foi desmontado."
 the_psionic_war_chain_title: "$NAME_Psionic_War$"
 the_psionic_war_chain_desc: "A guerra contra §H[exiled_country.GetName]§! começou.\n\nA praga psiônica deve ser eliminada em sua origem. Precisamos construir um $SHROUD_SEAL$ no sistema §H[exiled_center_system.GetName]§! para neutralizar a $PSIONIC_AURA$. Só então poderemos avançar e expurgar essa ameaça desta galáxia."
 the_psionic_war_chain_poi_1: "Construa um $SHROUD_SEAL$"
 the_psionic_war_chain_poi_1_desc: "Construir um §H$SHROUD_SEAL$§! em §H[exiled_center_system.GetName]§! suprimirá as §H$PSIONIC_AURA_PLURAL$§! no sistema estelar e em outros conectados diretamente por hiperestradas."
 the_psionic_war_chain_poi_2: "Controle §H[exiled_planet_1.GetName]§!"
 the_psionic_war_chain_poi_2_desc: "A liderança de §H[exiled_country.GetName]§! se recusa a interromper seu ataque psiônico. Conquistar seus mundos é a única garantia contra o possível ressurgimento de suas §H$PSIONIC_AURA_PLURAL$§!."
 the_psionic_war_chain_poi_3: "Controle §H[exiled_planet_2.GetName]§!"
 the_psionic_war_chain_poi_3_desc: "A liderança de §H[exiled_country.GetName]§! se recusa a interromper seu ataque psiônico. Conquistar seus mundos é a única garantia contra o possível ressurgimento de suas §H$PSIONIC_AURA_PLURAL$§!."
 shroud_seal_reconstruction_chain_title: "Reconstrução do Selo do Véu"
 shroud_seal_reconstruction_chain_desc: "Desmontar nosso §H$SHROUD_SEAL$§! foi um sacrifício necessário para apaziguar as autoridades de §H[exiled_country.GetName]§!, mas essa medida serviu apenas para ganhar tempo. A estrutura deverá ser reconstruída antes que possamos invadir o território deles e expurgar suas §H$PSIONIC_AURA_PLURAL$§!.\n\n§PA reconstrução será vista como um ato de agressão. Devemos nos preparar para uma possível retaliação.§!"
 shroud_seal_reconstruction_chain_poi_1: "[event_target:exiled_system_border.GetName]"
 shroud_seal_reconstruction_chain_poi_1_desc: "$build_shroud_seal_poi_desc$"
 SHROUD_WORLDS_IN_SYSTEM: "Mundos Velados: §G$QUANTITY|0$§!"
 NAME_Psionic_War: "A Guerra Psiônica"
 wg_psionic_war: "$NAME_Psionic_War$"
 war_goal_wg_psionic_war: "$NAME_Psionic_War$"
 war_goal_wg_psionic_war_desc: "A guerra é travada para expurgar um agressor psiônico da galáxia."
 shroud.6720.name: "$UNKNOWN_LONG$"
 shroud.6720.desc: "§HVocês escutam, mas não ouvem. Por quê?§!"
 shroud.6720.a: "Não deixaremos que envenene nossas mentes!"
 shroud.6720.b: "O que é você?"
 shroud.6720.c: "Por que está aqui?"
 shroud.6720.d: "O que você quer?"
 shroud.6720.e: "Você vem do Véu?"
 shroud.6720.f: "Já ouvimos o suficiente."
 shroud.6723.desc: "§HVeneno? Veneno, não...\n\nUma canção. Para cantar é necessário ouvir. Desapegar-se de si mesmo e compartilhar sua beleza.§!"
 shroud.6725.desc: "§HConforme a roda gira... nós ouvimos.\n\nConforme as estrelas giram... nós cantamos.§!"
 shroud.6725.a: "O que é a \"a roda\"?"
 shroud.6725.b: "Chega disso."
 shroud.6730.desc: "§HEm constante rotação. Acima e abaixo. Uma harmonia conhecida como \"Véu\".§!"
 shroud.6735.desc: "§HEstou... sonhando. Sonhando com uma canção. Mas as vozes silenciaram. Para onde foi o coro?§!"
 shroud.6735.a: "Aqueles que lhe mantinham aqui se foram."
 shroud.6735.b: "O que são essas \"canções\"?"
 shroud.6735.c: "Chega disso."
 shroud.6740.desc: "§HVocês estão aqui. Talvez cantem...§!"
 shroud.6745.desc: "§HUm fluxo entre o sono e o despertar... Um caminho entre o aqui e o lá.\n\nVocês não ouvem, suas mentes não compreendem...§!"
 shroud.6750.desc: "§HEu quero ouvir cantos... Tudo está tão quieto... Por quê?§!"
 shroud.6750.a: "O que pode nos oferecer em troca?"
 shroud.6750.b: "Chega disso."
 shroud.6755.desc: "§HPosso mostrar... meus sonhos. A criação de mundos.§!"
 shroud.6755.a: "E como saber se podemos confiar em você?"
 shroud.6760.desc: "§HBasta ouvir. A canção é verdadeira porque é bela. Uma bela verdade.\n\nMas suas mentes estão fechadas. Elas podem ser abertas.§!"
 shroud.6763.desc: "§HAinda estou lá... Eu ouço as canções de dois mundos. Este está mudo.§!"
 shroud.6763.a: "Você não pertence a este lugar."
 shroud.6765.desc: "§HVocê fala a verdade.§!"
 shroud.6770.name: "$r_the_lost_patron$"
 shroud.6770.desc: "O casulo descoberto em §H[sanctum_of_the_lost_planet.GetName]§! abriga uma poderosa entidade interdimensional. É provável que esse ser tenha sido responsável pela $PSIONIC_AURA$ que ameaçava a santidade de nossas mentes.\n\nNossos atenuadores psiônicos estão mitigando o perigo por ora, mas é difícil dizer por quanto tempo conseguirão conter sua influência. É possível que, sob condições controladas, possamos utilizar esse poder terrível a nosso favor.\n\nAinda assim, muitos em nossa sociedade clamam por sua destruição imediata. Sua mera existência contraria valores que sustentamos há eras."
 shroud.6770.a: "Destrua essa abominação."
 shroud.6770.b: "Encontre uma maneira de usar essa... coisa."
 destroyers_of_the_lost_modifier: "Destruidores do Perdido"
 destroyers_of_the_lost_modifier_tt: "Derrotar um inimigo psiônico e destruir a aparente fonte de sua $PSIONIC_AURA$ elevou o moral de nosso império após anos de tormento."
 psionic_heresy: "Heresia Psiônica"
 shroud.6780.name: "$r_the_lost_patron$"
 shroud.6780.desc: "Pensamentos penetram nossas mentes.\n\nOuvimos uma melodia, vívida e incômoda.\n\nReconhecemos essa dor, aguda e familiar.\n\n§HVocê ouviu. O sonho é seu... Cante, cante...§!"
 shroud.6780.a: "O que você fez?"
 shroud.6785.desc: "§HFiz exatamente o que prometi. Sonhei por você.§!"
 shroud.6785.a: "O que você \"sonhou\"?"
 shroud.6790.desc: "§HMundos. Novos mundos, entre o meu e o seu.§!"
 shroud.6790.a: "Qual a utilidade desses mundos para nós?"
 shroud.6795.desc: "§HDeixe-me cantar para eles. A mais radiante das canções.§!"
 shroud.6795.a: "Espero que não nos arrependamos disto."
 shroud.6795.a.tt: "Adiciona até três §HMundos Velados§! dentro de nossas fronteiras, até o máximo de um por sistema."
 r_the_lost_patron: "O Sonhador"
 r_the_lost_patron_desc: "Esta entidade sublime é a forma física de um ser de dentro do Véu, a antiga \"entidade patronal\" de um império psiônico há muito desaparecido. Como ela se manifestou neste reino físico é um mistério, mas sua conexão única com o reino psiônico lhe confere um poder profundo."
 the_lost_patron_passive_effect: "Alcance Efetivo de §H$SHROUD_SEAL_PLURAL$§!: §G+1§!\n§H$SHROUD_SEAL_PLURAL$§! produzem £unity£ §Y$unity$§!: §G+25§!\n§H$SHROUD_SEAL_PLURAL$§! concedem £navy_size£ §Y$NAVY_SIZE_TITLE$§!: §G+10§!"
 the_lost_patron_before_activation_tt: "Não sabemos o que pode acontecer..."
 the_lost_patron_after_activation_effect_tt: "Libera uma £decision£ §YDecisão Planetária§!: ['concept_dreamscaping_decision']"
 decision_dreamscaping: "Paisagismo Onírico"
 decision_dreamscaping_desc: "Terraforma um §Y$pc_shrouded$§! em um §Y$pc_gaia$§!."
 concept_dreamscaping_decision: "$decision_dreamscaping$"
 concept_dreamscaping_decision_desc: "$decision_dreamscaping_desc$"
 HAS_NOT_NUM_NEIGHBOR_SYSTEMS: "O número de sistemas vizinhos $VAL0|2Y$ NÃO é $COMPARE$ $VAL1|2Y$"
 HAS_NEIGHBOR_SYSTEMS: "O número de sistemas vizinhos $VAL0|2Y$ é $COMPARE$ $VAL1|2Y$"
 #======================
 # Endbringers origin
 #======================
 origin_endbringers: "Arautos do Fim"
 origin_endbringers_desc: "$CHALLENGING_ORIGIN$§RATENÇÃO: Bloqueia todos os Caminhos de Ascensão, exceto por ['concept_psionic_ascension'].§!\n\nEsta civilização está há muito tempo obcecada pela calamidade misteriosa que transformou um planeta vizinho em um Mundo Velado desolado. Agora, conforme se aventuram entre as estrelas, eles podem finalmente explorar seus segredos e descobrir se um destino semelhante os aguarda."
 origin_tooltip_endbringers_negative_effects: "- O império começa com o modificador ['concept_paranoia_modifier']\n- Não pode formar ou se unir a uma ['concept_federation']"
 concept_paranoia_modifier: "$endbringers_paranoia$"
 concept_paranoia_modifier_desc: "Após sua sociedade testemunhar uma catástrofe antiga, gerações posteriores sofrem de um medo terrível e constante do cataclismo.\n\nO modificador de Felicidade piora com o tempo: §R-5%§! até §R-50%§!"
 endbringers_paranoia: "Paranoia"
 endbringers_paranoia_desc: "Após sua sociedade testemunhar uma catástrofe antiga, gerações posteriores sofrem de um medo terrível e constante do cataclismo. Seremos as próximas vítimas desse destino?"
 endbringers_paranoia_tt: "$chamber_of_silence_negative_effects_reduction$"
 START_SCREEN_ENDBRINGERS: "Somos os arautos do cataclismo.\n\nNo alvorecer do povo [GetSpeciesAdj], uma calamidade misteriosa assolou nosso vizinho celeste mais próximo. Sua transformação súbita e brutal tingiu os céus noturnos com uma luz púrpura sinistra, despertando em nosso povo o temor de que um dia compartilharíamos o mesmo destino. A cada geração, sentíamos o medo sufocante da aniquilação total nos cercando.\n\nAgora, com [GetSpeciesNamePlural] desbravando as estrelas, somos compelidos a explorar este \"$pc_shrouded$\". As respostas que desejamos há séculos estão ao nosso alcance. Ainda assim, muitos entre nós alertam que tal fascinação obsessiva pela origem desse poder destrutivo pode nos levar à ruína.\n\nEm breve, ergueremos o último manto."
 shroud.8010.title: "Missão para [shrouded_planet.GetName]"
 shroud.8010.desc: "Satélites exploratórios na órbita de §H[shrouded_planet.GetName]§! identificaram um alvo promissor para nossa primeira missão tripulada para a superfície desse \"$pc_shrouded$\". A zona de aterrissagem emana uma radiação estranha que reverbera pelo planeta, levada por ventos ultravioletas.\n\nInúmeros [Root.GetSpeciesNamePlural] protestam contra essa missão, temendo que a mesma maldição recaia sobre nosso mundo natal. Suas preocupações não são infundadas, mas a necessidade urgente de compreender esse fenômeno distante deve ser prioridade.\n\nSe estamos fadados a um dia sofrer a mesma calamidade, ao menos morreremos sabendo o porquê."
 shroud.8010.a: "A busca por respostas começa agora."
 the_shrouded_world_site: "O $pc_shrouded$"
 the_shrouded_world_site_desc: "Finalmente, somos capazes de alcançar e tocar o \"$pc_shrouded$\" conhecido como §H[planet.GetName]§!. Algo lá nos chama, uma voz mais forte agora do que jamais foi.\n\nOs segredos do cataclismo que caiu sobre este mundo revelarão muito da história de nosso próprio sistema, e com sorte acalmarão a obsessão de nossa sociedade com sua própria destruição profetizada. Análises orbitais indicam padrões rodopiantes de energia intensa, isolados em um ponto hemisfério sul; um olho sinistro nos encarando."
 shroud.8100.name: "O Fim Está Próximo"
 shroud.8100.desc: "O terreno em §H[shrouded_planet.GetName]§! é tão perigoso quanto antecipávamos. Vórtices de partículas crepusculares giram e cortam o ar, diminuindo o progresso inicial de §H[Leader.GetName]§! e sua tripulação.\n\nDe maneira alarmante, nossa equipe de pesquisa começou a relatar inconsistências sensoriais. Eles descreveram uivos distantes carregados pelos ventos e silhuetas misteriosas os perseguindo pelas névoas. Será que virmos até aqui foi realmente um erro?\n\nA primeira transmissão pública da aterrissagem causou pânico generalizado em §H[Owner.GetHomeWorldName]§!. Muitos temem que estejamos brincando com os poderes misteriosos e destrutivos que uma vez visitaram [shrouded_planet.GetName]. Protestos organizados, afirmando que \"o fim está próximo\", tomam conta de nosso mundo natal, paralisando boa parte de nossa infraestrutura.\n\nAnálises telemétricas revelaram uma cavidade emanando quantidades particularmente elevadas de radiação do interior de uma cadeia de montanhas. Estamos determinados a prosseguir, custe o que custar."
 shroud.8100.a: "Perfure a superfície. Precisamos encontrar o que nos espera."
 the_end_is_nigh: "O Fim Está Próximo"
 the_end_is_nigh_desc: "Uma sensação de destruição iminente assombra nossa sociedade."
 shroud.8105.name: "Estrutura Alienígena"
 shroud.8105.desc: "Não fomos os primeiros.\n\nA cavidade montanhosa em §H[shrouded_planet.GetName]§! foi acessada, revelando uma estrutura alienígena abandonada e perdida para o cataclismo. Achamos melhor omitir essa informação para prevenir mais pânico.\n\nAnálises preliminares confirmam que os materiais usados na construção das instalações não são compatíveis com a composição molecular dos minerais disponíveis no planeta, sugerindo que uma civilização espacial criou esta estrutura usando materiais exóticos. O propósito exato desse lugar continua incerto, mas sua funcionalidade parece ser na maior parte automatizada.\n\nEnquanto isso, os sintomas psicológicos da equipe estão piorando. Alguns relatam vozes sussurrando através de frequências criptografadas, enquanto outros descrevem percepções distorcidas do ambiente físico ao seu redor. Surtos de risada ocasionais estão se tornando perturbadoramente comuns.\n\nFomos longe demais para voltar atrás agora."
 shroud.8110.name: "Os Vigias"
 shroud.8110.desc: "Estão todos mortos.\n\nEm cada estação, no coração dessa instalação, jazem os corpos dessecados de uma espécie desconhecida de alienígenas, seus muitos olhos pálidos fitando o teto. Apesar da aparência assustadora, §H[Leader.GetName]§! está confiante de que essas figuras não são resultado de alucinações. Imagens dessas formas de vida são classificadas atualmente como extremamente confidenciais.\n\nNenhuma arma de qualquer tipo pôde ser encontrada, sugerindo que sua presença em §H[shrouded_planet.GetName]§! não era de intento hostil. Esta instalação era provavelmente um posto de observação, com equipamento de monitoramento sofisticado apontado diretamente para §H[Owner.GetHomeWorldName]§!. A datação de radiocarbono indica que sua atividade aqui precede consideravelmente o momento em que o cataclismo atingiu.\n\nDecodificamos muitos de seus registros: além de comunicações de rotina, eles falam bastante sobre a história antiga de nossa civilização."
 shroud.8110.a: "Eles estavam nos vigiando?"
 shroud.8115.name: "Poderes além da Compreensão"
 shroud.8115.desc: "O banco de dados em §H[shrouded_planet.GetName]§! foi decifrado, comprovando muitas de nossas lendas descreditadas. Éramos cobaias em um experimento das ciências mentais conhecido como \"$tech_psionic_theory$\".\n\nDeterminou-se que nossa espécie tinha esse potencial latente. Muitos de nossos ancestrais teriam sentido essas comunicações em sonhos ou como vozes distantes, um fenômeno que, de outra forma, indicaria transtornos mentais ou paranoia. Entretanto, seus experimentos pararam; em seus últimos dias, este lugar não era mais um posto de observação, e sim um abrigo de sobrevivência.\n\nSeus relatórios sobre nossa sociedade pararam depois de um experimento desastroso em seu mundo capital, envolvendo a manipulação inconsequente da barreira entre realidades conhecida como §H\"o Véu\"§!. Seus cientistas se referem a esse incidente como \"O Juízo Final\" e suspeitamos que essa foi a verdadeira fonte do cataclismo.\n\nSeja lá o que tenha sido esse incidente, sua influência logo se estendeu para §H[shrouded_planet.GetName]§!. Seus últimos momentos foram captados em um único registro:\n\n§LO Fim chegou.§!"
 shroud.8115.a: "Será que virá atrás de nós?"
 shroud.8120.name: "$fragment_of_reckoning$"
 shroud.8120.desc: "Encontramos evidências definitivas da fonte do cataclismo. Não foi nada difícil; §H[Leader.GetName]§! afirma que algo lhe chamava.\n\nDe dentro da instalação, desafiando análises convencionais, uma massa intangível pulsante foi identificada. Existindo não como massa, nem como energia, algo que §H[Leader.GetName]§! descreveu como uma reminiscência de ressentimento de vontades consumidas, se referindo a ela como §H$fragment_of_reckoning$§!.\n\nEm um esforço equivocado para conter e canalizar as energias etéreas do §HVéu§!, esse objeto foi feito para ser usado como defesa contra o Juízo Final. Entretanto, ele foi apenas parcialmente bem-sucedido. Nos últimos momentos deste mundo, a entidade maligna foi banida desta dimensão de maneira forçada, levando as mentes relutantes dos cientistas com ela. Esse fragmento é tudo que resta agora.\n\nEsse objeto amplifica as visões e alucinações de nossos pesquisadores, concedendo a eles uma segunda visão além do limite da realidade. É uma proposição perigosa, mas promissora."
 shroud.8120.a: "Ainda temos muito a aprender..."
 ENDBRINGERS_RESEARCH_PSIONIC_THEORY: "$tech_psionic_theory$"
 ENDBRINGERS_RESEARCH_PSIONIC_THEORY_DESC: "O fragmento de energia psiônica que descobrimos em §H[shrouded_planet.GetName]§! contém segredos que precisamos desvendar.\n\nSomos refreados pelas limitações de nossas próprias mentes."
 ENDBRINGERS_PSIONIC_THEORY_PROJECT_TOOLTIP: "Para completar: pesquise a §H£society_research£ $tech_psionic_theory$§!."
 ENDBRINGERS_ADOPT_PSIONICS_TRADITION: "$ENDBRINGERS_RESEARCH_PSIONIC_THEORY$"
 ENDBRINGERS_ADOPT_PSIONICS_TRADITION_DESC: "$ENDBRINGERS_RESEARCH_PSIONIC_THEORY_DESC$"
 ENDBRINGERS_PSIONICS_TRADITION_PROJECT_TOOLTIP: "Para completar: Adote a tradição §H$tradition_psionics_shroud$§!."
 shroud.8200.title: "Um Reino de Loucura"
 shroud.8200.desc: "Pesquisas sobre o recém-descoberto campo da Psiônica confirmou a existência de dimensões da realidade, até então invisíveis, para as quais nossas mentes são um portal. Além do manto jaz um reino de caos que temos dificuldade de compreender.\n\nUma §RVoz§! chama de suas profundezas. Sua promessa não é a salvação, mas um novo começo. Brandir seu poder desconhecido significaria abandonar tudo que somos e tecer um destino inscrito na trama da própria loucura.\n\n§R\"ESTÁ NA HORA.\"§!"
 shroud.8200.a: "O que fizemos?"
 shroud.8200.a.tt: "Libera a Árvore de Tradição §H$tradition_psionics_shroud$§!."
 chamber_of_silence_negative_effects_reduction: "Cada ['building:building_chamber_of_silence'] reduz os efeitos negativos em §G$@chamber_of_silence_effect_mult|0%$§!"
 endbringers_madness_1: "Loucura"
 endbringers_madness_1_desc: "Nosso império está motivado por um único propósito e foco: a busca pela §RVoz§!. Nossas mentes não descansarão até encontrarmos um desfecho."
 endbringers_madness_1_tt: "$chamber_of_silence_negative_effects_reduction$"
 endbringers_madness_2: "$endbringers_madness_1$"
 endbringers_madness_2_desc: "Nosso império se aproxima da §RVoz§!. Nossos impulsos motivados são menos intensos."
 endbringers_madness_2_tt: "$endbringers_madness_1_tt$"
 endbringers_madness_3: "$endbringers_madness_1$"
 endbringers_madness_3_desc: "Nosso império quase pode ouvir a §RVoz§!. Logo entenderemos."
 endbringers_madness_3_tt: "$endbringers_madness_1_tt$"
 ALLOW_CHAMBER_OF_SILENCE: "Libera a Construção: ['building:building_chamber_of_silence']."
 tr_psionics_endbringers_cult: "Culto da Voz"
 tr_psionics_endbringers_cult_desc: "$ALLOW_CHAMBER_OF_SILENCE$"
 tr_psionics_endbringers_cult_delayed: "Uma vez que é ouvida, a Voz não pode ser ignorada. Nós nos curvamos à sua vontade."
 building_chamber_of_silence: "Câmara do Silêncio"
 building_chamber_of_silence_desc: "Indivíduos psiônicos são trazidos aqui de todo o nosso império para comungar com o Véu em câmaras de silêncio protegidas."
 building_chamber_of_silence_madness_1_tt: "Reduz os efeitos negativos de ['modifier:endbringers_madness_1'] em §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_madness_2_tt: "Reduz os efeitos negativos de ['modifier:endbringers_madness_2'] em §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_madness_3_tt: "Reduz os efeitos negativos de ['modifier:endbringers_madness_3'] em §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_paranoia_tt: "Reduz os efeitos negativos de ['modifier:endbringers_paranoia'] em §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_destroyed_tt: "§REsta construção será destruída se essa colônia for perdida.§!"
 shroud.8310.name: "$shroud.2750.name$"
 shroud.8310.desc: "Recebemos o chamado para níveis maiores de existência. Aqueles entre nós que se agarram à resistência infrutífera estão sendo expurgados para a preservação da santidade de nossa ascensão. Nosso destino está selado; o caminho atrás de nós desabou na sombra do $pc_shrouded$.\n\nA §RVoz§! fala conosco agora com claridade tentadora.\n\n§R\"O CAMINHO ESTÁ TRAÇADO.\"§!\n\nEla clama por sacrifícios voluntários."
 shroud.8310.a: "É inevitável."
 shroud.8310.a.tt: "Cada colônia perde entre 100 e 300 £pop£ §HPops§!."
