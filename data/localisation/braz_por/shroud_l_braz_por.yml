 civic_ap_blockade_tt: "§RATENÇÃO: Bloqueia todos os Caminhos de Ascensão, exceto ['concept_psionic_ascension'].§!"
 civic_chosen: "Os Escolhidos"
 civic_chosen_desc: "$civic_ap_blockade_tt$\n\nInfluenciada pelo Véu em seus primórdios, esta sociedade firmou um pacto de patronagem com uma entidade poderosa."
 civic_chosen_effects: "- Começa o jogo em contato com uma §IEntidade Patronal do Véu§!.\n- $ADDITIONAL_TECHNOLOGIES_STRING$ £society£ ['technology:tech_psionic_aura']"
 civic_chosen_effects_additional: "- Ganha $i_unity$ com base na ['concept_attunement'] com o Véu."
 civic_hive_chosen: "Muitos Escolhidos"
 civic_hive_chosen_desc: "$civic_ap_blockade_tt$\n\nInfluenciado pelo Véu em seus primórdios, este coletivo firmou um pacto de patronagem com uma entidade poderosa."
 civic_machine_chosen: "Rede de Apóstolos"
 civic_machine_chosen_desc: "$civic_ap_blockade_tt$\n\nInfluenciadas pelo Véu em seus primórdios, estas máquinas foram programadas com um pacto de patronagem firmado com uma entidade poderosa."
 civic_corporate_chosen: "Executivos Escolhidos"
 civic_corporate_chosen_desc: "$civic_ap_blockade_tt$\n\nDesde sua fundação, esta corporação deve seu sucesso a uma entidade misteriosa do Véu, mantendo com ela um pacto de patronagem."
