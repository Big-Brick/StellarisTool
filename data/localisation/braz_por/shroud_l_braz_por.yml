 COMPLETE_PATRON_FIRST_CONTACT: "Revela a entidade patronal $PATRON$ no §YVéu§!, acessível pelo menu §YContatos§!."
 shroud.11225.title: "Um Desaparecimento Repentino"
 shroud.11225.desc.common_1: "Em um instante, tudo se foi.\n\nA §R$end_aura$§! maligna presente em nossos sistemas de repente desapareceu, levando tudo embora consigo. Estrelas inteiras colapsaram em buracos negros, planetas desapareceram e um grande silêncio paira em seu lugar."
 shroud.11225.desc.common_2: "Talvez nunca saibamos qual insanidade convocou tamanho poder destrutivo."
 shroud.11225.desc.default: "$shroud.11225.desc.common_1$\n\n$shroud.11225.desc.common_2$"
 shroud.11225.desc.mitigated: "$shroud.11225.desc.common_1$ Parece que nossos esforços para repelir a aura diminuíram seus efeitos, preservando o pouco que conseguimos.\n\n$shroud.11225.desc.common_2$"
 shroud.11225.a: "Como isso é possível?"
 SPECIAL_PROJECT_CALLING: "Chamado do Conhecimento"
 SPECIAL_PROJECT_CALLING_DESC: "$whisperers_in_the_void_color_article_cap$ anseiam por conhecimento além dos limites do pensamento convencional. Ao conferir ao nosso grupo de [Owner.GetResearchers] amplos poderes para concentrar seus esforços em áreas esotéricas de estudo, poderemos satisfazer o fervor dos Sussurradores."
 physics_technology_CALLING_PROJECT: "$SPECIAL_PROJECT_CALLING$"
 physics_technology_CALLING_PROJECT_DESC: "$SPECIAL_PROJECT_CALLING_DESC$"
 society_technology_CALLING_PROJECT: "$SPECIAL_PROJECT_CALLING$"
 society_technology_CALLING_PROJECT_DESC: "$SPECIAL_PROJECT_CALLING_DESC$"
 engineering_technology_CALLING_PROJECT: "$SPECIAL_PROJECT_CALLING$"
 engineering_technology_CALLING_PROJECT_DESC: "$SPECIAL_PROJECT_CALLING_DESC$"
 RECKONING_ARRIVAL_PROJECT: "Enfrentando o Juízo Final"
 RECKONING_ARRIVAL_PROJECT_DESC: "A galáxia está sob ameaça de uma entidade imensamente poderosa conhecida como §R$NAME_Reckoning$§!. Feita de pura energia, ela surgiu repentinamente e iniciou uma campanha de destruição.\n\nAs informações reunidas até o momento indicam que essa entidade é um inimigo diferente de tudo o que já enfrentamos. Se quisermos ter alguma chance, deveremos iniciar uma pesquisa emergencial para determinar métodos mais eficazes de combate."
 shroud.11235.title: "$RECKONING_ARRIVAL_PROJECT$"
 shroud.11235.desc: "Nossa equipe de [GetScientistPlural] concluiu uma pesquisa detalhada sobre a poderosa entidade conhecida como §R$NAME_Reckoning$§!.\n\nCom base em suas descobertas, determinamos um método eficaz de enfrentá-la com a tecnologia atualmente disponível: a energia que compõe o $NAME_Reckoning$ pode ser deteriorada usando uma forma modificada de armamento projetado para atravessar escudos de energia.\n\nApesar de sua imensa força, agora temos uma chance real de confrontar essa ameaça."
 shroud.11235.a: "$extreme_frontiers.1531.i$"
 RECKONING_VULNERABILITY_PROJECT: "Deve Haver Uma Fraqueza"
 RECKONING_VULNERABILITY_PROJECT_DESC: "Apesar de nossa derrota, o confronto com o §R$NAME_Reckoning$§! forneceu dados inestimáveis para estudos.\n\nAo dedicar recursos à pesquisa dessa misteriosa entidade de energia, poderemos identificar suas vulnerabilidades e desenvolver métodos de ataque mais eficazes."
 shroud.11240.title: "Aprendendo com a Derrota"
 shroud.11240.desc: "O §R$NAME_Reckoning$§! provou ser uma força além da capacidade de nossas frotas. Apesar da derrota, o confronto nos proporcionou dados valiosos sobre essa entidade misteriosa de energia; informações que só seriam possíveis por meio do combate direto.\n\nUma análise preliminar indica que reunimos dados suficientes para simular a composição da entidade. Com mais estudos, poderemos identificar suas vulnerabilidades e refinar nossos ataques."
 shroud.11240.a: "Deve haver uma fraqueza."
 shroud.11245.title: "A Fraqueza do $NAME_Reckoning$"
 shroud.11245.desc.1: "Nossa equipe de [GetScientistPlural] fez uma descoberta significativa em suas pesquisas sobre a entidade de energia conhecida como §R$NAME_Reckoning$§!."
 shroud.11245.desc.2.intro: "A entidade não apenas emergiu"
 shroud.11245.desc.2.outro: "Utilizando uma classe de lasers com propriedades de \"supressão psiônica\", nossas frotas poderão interromper essa conexão, tornando sua forma física vulnerável a ataques."
 shroud.11245.desc.2.psionic: "$shroud.11245.desc.2.intro$ do §HVéu§!, como também mantém sua força defensiva por meio de um elo transdimensional com o reino psiônico. $shroud.11245.desc.2.outro$"
 shroud.11245.desc.2.non_psionic: "$shroud.11245.desc.2.intro$ de outra dimensão da realidade, como também mantém sua força defensiva por meio de um misterioso elo transdimensional. $shroud.11245.desc.2.outro$"
 reckoning_insight_modifier: "Compreendendo o Juízo Final"
 reckoning_insight_modifier_desc: "Graças a uma pesquisa extensa, determinamos um método eficaz de causar dano ao $NAME_Reckoning$ utilizando uma versão modificada de nosso armamento atual."
 reckoning_vulnerability_modifier: "A Fraqueza do Juízo Final"
 reckoning_vulnerability_modifier_desc: "Utilizando os dados obtidos em nosso encontro anterior com o Juízo Final, descobrimos um meio de amplificar o dano de nossos ataques com a ajuda de lasers de \"supressão psiônica\"."
