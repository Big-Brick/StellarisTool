 #==========================
 # Tutorials
 #==========================
 TUTORIAL_SHROUD_TAB_TITLE: "Tutorial: $THE_SHROUD_TITLE$"
 TUTORIAL_SHROUD_TAB_DESC: "Esta é a aba do §SVéu§!. O painel à esquerda mostra a posição de nosso império no Véu, representado pelos §Sdomínios§! de quatro entidades psiônicas conhecidas como §SPatronos§!.\n\nNossa posição é determinada pela §S$concept_attunement$§!, que é obtida quando uma ação no plano físico agrada um Patrono. Ganhe $concept_attunement$ para começar o processo de revelar a identidade de um Patrono. Uma vez revelada, clique no domínio do Patrono para abrir o painel do Patrono.\n\nClique em §S$DELVE$§! ou no centro do painel à esquerda para adentrar o Véu e explorar o reino psiônico. Enquanto exploramos, o que descobriremos pode ser influenciado pela posição de nossa $concept_attunement$ dentro dos domínios."
 TUTORIAL_SHROUD_PATRON_TITLE: "Tutorial: Entidades Patronais do Véu"
 TUTORIAL_SHROUD_PATRON_DESC: "O painel do §SPatrono§! fornece informações e opções relacionadas à Entidade Patronal do Véu. Conclua os objetivos fornecidos por §S$concept_callings$§! e §S$concept_deeds$§! para ganhar §S$concept_attunement$§! com essa entidade em particular.\n\nAumente a $concept_attunement$ para liberar §S$PASSIVE_ACCORDS$§!, que fornecem vantagens para nosso império. Ganhe $concept_attunement$ suficiente para que um Patrono comece o processo de formar um §SPacto§!, que concede ainda mais benefícios substanciais."
 TUTORIAL_SHROUD_COVENANT_TITLE: "Tutorial: Pactos"
 TUTORIAL_SHROUD_COVENANT_DESC: "Confirmar um §SPacto§! com uma Entidade Patronal do Véu concede acesso a §S$ACTIVE_ACCORDS$§!. $tutorial.shroud_covenant.shared$"
 tutorial.shroud_covenant.shared: "Clique no ícone $ACTIVE_ACCORD$ para ativar seus efeitos ao custo de £sr_zro£ §S$sr_zro$§!. Isso pode ser feito no painel principal do Véu ou no painel individual do Patrono.\n\nDepois da ativação, um $ACTIVE_ACCORD$ requer um período de recarga antes que possa ser ativado novamente."
 TUTORIAL_SHROUD_SHAPING_TITLE: "Tutorial: Moldando Véu"
 TUTORIAL_SHROUD_SHAPING_DESC: "Agora temos os meios para ganhar certos poderes que normalmente requerem um §SPacto§! com um §SPatrono§!.\n\nDepois que liberarmos ambos os §S$PASSIVE_ACCORDS$§! de nosso Patrono, ganharemos acesso a um §S$ACTIVE_ACCORD$§!. $tutorial.shroud_covenant.shared$"
 tutorial.2600.name: "Tutorial: $PSIONIC_AURA_PLURAL$"
 tutorial.2600.desc: "Nossas colônias com populações psiônicas agora têm a habilidade de emitir uma §S$PSIONIC_AURA$§!. Essa Aura é extraída da §SEntidade Patronal do Véu§! com a qual nós temos atualmente a maior §S$concept_attunement$§!.\n\n$PSIONIC_AURA_PLURAL$ têm diversos efeitos em nosso império e podem afetar impérios hostis ou amigáveis. Para expandir nossa Aura para mais sistemas, precisaremos nos sintonizar completamente com um Patrono para liberar a tecnologia £research£ §S$tech_aura_intensification$§!.\n\nPara ver os efeitos de nossa $PSIONIC_AURA$, abra a aba §SVéu§! ou selecione o ícone da Aura no painel inferior central na £interface£ §SVisão do Sistema§!."
 tutorial.2610.name: "Tutorial: $tech_aura_intensification$"
 tutorial.2610.desc: "Nossa §S$PSIONIC_AURA$§! agora pode ganhar §SIntensidade§! e se espalhar para outros sistemas.\n\n$PSIONIC_AURA_PLURAL$ podem alcançar três limiares de Intensidade, com efeitos diferentes. Se uma $PSIONIC_AURA$ alcançar um novo nível de Intensidade ou maximizá-la, ela tentará se espalhar para sistemas adjacentes. A maior parte das $PSIONIC_AURA_PLURAL$ tem um limite de distância até onde pode se espalhar a partir de sua fonte.\n\nA Intensidade da Aura pode ser aumentada de muitas formas, como altas populações com a característica $trait_psionic$, níveis de £happiness£ §SFelicidade§!, Empregos de £job_telepath£ [GetTelepathCap] e Governadores Psíquicos ou £leader£ Líderes de £sector£ Setores."
 tutorial.2620.name: "Tutorial: Conflito de Auras"
 tutorial.2620.desc: "Nossa §S$PSIONIC_AURA$§! encontrou outra Aura em um sistema conectado adjacente. Quando isso ocorre, as duas Auras podem competir para determinar qual se espalhará para o outro sistema.\n\nEsse processo depende do ganho de §SIntensidade§! mensal de cada uma das Auras, que pode ser visto ao mover o cursor sobre o ícone de Aura no painel inferior central da £interface£ §SVisão do Sistema§!."
 #==========================
 # Technologies
 #==========================
 tech_psionic_aura: "$PSIONIC_AURA$"
 tech_psionic_aura_desc: "Emanações psiônicas do Véu manifestam o favor de uma entidade para a realidade corpórea. Um império sintonizado a uma Entidade Patronal do Véu emitirá uma $PSIONIC_AURA$ a partir de onde suas populações psiônicas estão concentradas."
 feature_unlock_psionic_aura: "$PSIONIC_AURA_PLURAL$"
 feature_unlock_psionic_aura_desc: "Permite a um império sintonizar-se a uma Entidade Patronal do Véu para emitir uma $PSIONIC_AURA$ a partir de onde suas populações psiônicas estão concentradas."
 psionic_aura_delve_success_tt: "Chance de sucesso enquanto mergulha no Véu: §G+$@delve_success_tier_1|0$%§!"
 tech_aura_intensification: "Intensificação de $PSIONIC_AURA$"
 tech_aura_intensification_desc: "Emanações psiônicas do Véu anseiam por se expandir. Com essa nova compreensão, as $PSIONIC_AURA_PLURAL$ de um império podem aumentar em intensidade e se propagar através dos sistemas estelares, trazendo benefícios para aliados e desvantagens para inimigos."
 feature_allow_psionic_aura_intensity_spread: "Propagação de $PSIONIC_AURA$"
 feature_allow_psionic_aura_intensity_spread_desc: "Permite que $PSIONIC_AURA_PLURAL$ se propaguem para sistemas vizinhos, até §Y[Owner.GetAuraHyperlaneRange]§! hiperestradas a partir da fonte de emissão."
 feature_allow_psionic_aura_intensity_growth: "Crescimento de $PSIONIC_AURA$"
 feature_allow_psionic_aura_intensity_growth_desc: "Permite que $PSIONIC_AURA_PLURAL$ cresçam em intensidade."
 aura_intensification_delve_success_tt: "Chance de sucesso enquanto mergulha no Véu: §G+$@delve_success_tier_2|0$%§!"
 tech_psionic_suppression: "Supressão Psiônica"
 tech_psionic_suppression_desc: "Dispositivos que enfraquecem a energia psiônica são tão difíceis de construir quanto são de compreender, tamanha é a complexidade de lidar com forças extradimensionais."
 tech_psionic_suppression_feature_tt: "$i_unlocks_feature$ Libera a capacidade de construir §YSelos do Véu§! e §YSupressores Psiônico§!."
 tech_aura_resonation: "Ressonância da Aura"
 tech_aura_resonation_desc: "Há uma forma de projetar $PSIONIC_AURA_PLURAL$ além de mundos populados. Com a adição de um $sm_aura_emitter$, até mesmo uma base estelar pode se tornar um canal para emanações psiônicas do Véu."
 tech_materiality_engine: "$building_materiality_engine$"
 tech_materiality_engine_desc: "$building_materiality_engine_desc$"
 tech_psionic_bombers: "Bombardeiros Psiônicos"
 tech_psionic_bombers_desc: "Esta nave pequena e ágil é especializada no disparo de cargas concentradas de energia Psiônica. Quanto maior o alvo, maior a ressonância que sua explosão alcança."
 tech_bio_psionic_bombers: "$tech_psionic_bombers$"
 tech_psionic_lightning: "Relâmpago Psiônico"
 tech_psionic_lightning_desc: "Ao estabelecer uma conexão psiônica temporária entre uma nave e outra, uma carga direta de poder metal poderá ser liberada com efeitos devastadores. Tal energia bruta é capaz de confundir sistemas de naves e influenciar as mentes da tripulação."
 tech_bio_psionic_lightning: "$tech_psionic_lightning$"
 ship_terrify_tt: "Chance de ['concept_terrify'] naves militares por £time£ §Y5-10§! dias, baseado no tamanho da nave afetada."
 concept_terrify: "Aterrorizar"
 concept_terrify_desc: "Naves aterrorizadas interrompem o ataque e fogem de seus atacantes."
 tech_psionic_disruptor: "Disruptores Psiônicos"
 tech_psionic_disruptor_desc: "Estes disruptores altamente avançados disparam uma lança de energia psiônica poderosa através do casco dos inimigos, permitindo a inutilização precisa de armamento hostil."
 tech_bio_psionic_disruptor: "$tech_psionic_disruptor$"
 tech_zro_launcher: "Lançadores de Zro"
 tech_zro_launcher_desc: "Estes projéteis concentrados de $zro_lower$ podem ser dispersos livremente através de escudos inimigos, atravessando múltiplas realidades. Uma vez que o contato é feito com um objeto físico, os efeitos são exponencialmente devastadores."
