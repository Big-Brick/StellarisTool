 shroud_seal_MEGASTRUCTURE_DETAILS: "O §Y$SHROUD_SEAL$§! enfraquece §Y$PSIONIC_AURA_PLURAL$§! próximas e reduz a eficácia de §YComponentes de Nave Psiônicos§!."
