 chain_aura_suppressors_desc: "A §H$end_aura$§! está sendo contestada por dispositivos estranhos capazes de enfraquecer energia psiônica. A vontade de nosso patrono exige que desmontemos essas máquinas heréticas."
 chain_aura_suppressors_seal: "§H$SHROUD_SEAL$§! em §Y[prev.GetName]§!"
 chain_aura_suppressors_seal_desc: "O $SHROUD_SEAL$ no sistema [prev.GetName] contesta o alcance da §H$end_aura$§!.\n\n§REle deve ser desmontado.§!"
 chain_aura_suppressors_suppressor: "§H$building_psionic_suppressor$§! em §Y[prev.GetName]§!"
 chain_aura_suppressors_suppressor_desc: "O $building_psionic_suppressor$ em [prev.GetName] contesta o alcance da §H$end_aura$§!.\n\n§RDevemos destruí-lo.§!"
 chain_aura_suppressors_ward: "§H$building_ancient_ward_2$§! em §Y[prev.GetName]§!"
 chain_aura_suppressors_ward_desc: "A chamada $building_ancient_ward_2$ em [prev.GetName] contesta o alcance da §H$end_aura$§!.\n\n§RDevemos destruí-la.§!"
 #==========================
 # Events
 #==========================
 # Good luck events
 # Good luck event 1
 shroud.500.title: "Descoberta Incomum"
 shroud.500.desc: "Pesquisas promissoras de nossas principais instituições chegaram a uma descoberta inesperada. Por puro acaso, a padronização rotineira dos instrumentos confirmou uma teoria há muito considerada um erro fundamental. Agora podemos revisitar campos antes vistos como pseudociência."
 HOW_FORTUITOUS: "Que sorte."
 shroud.500.tt: "Conhecimento ganho em uma tecnologia aleatória: §G$@good_luck_event_1_insight|0%$§!"
 # Good luck event 2
 shroud.507.title: "Veio Principal Revelado"
 shroud.507.desc: "Um sistema de cavernas naturais ricas em minério, outrora considerado completamente perdido, foi redescoberto por acaso em §H[This.GetName]§!.\n\nApós uma avaliação cuidadosa dos riscos, estamos confiantes de que esses túneis suportarão uma exploração mineral significativa possibilitada pela ampliação dos esforços de mineração existentes."
 # Good luck event 3
 shroud.512.title: "[This.GetNewfoundFertilityTitle]"
 shroud.512.title_default: "Fertilidade Redescoberta"
 shroud.512.title_anglers: "Recife Inexplorado"
 shroud.512.desc: "Uma pesquisa rotineira do solo revelou que a qualidade da terra em §H[This.GetName]§! melhorou drasticamente nos últimos anos em diversas regiões do planeta.\n\nÁreas antes consideradas estéreis e impróprias para a agricultura agora podem ser usadas para expandir nossos esforços agrícolas."
 shroud.512.desc_anglers: "Uma embarcação pesqueira descobriu um recife oculto nos oceanos de §H[This.GetName]§!. A região, antes tida como deserta e estéril, na verdade abriga um ecossistema vibrante, repleto de fauna explorável."
 # Good luck event 4
 shroud.517.title: "Fontes Geotérmicas"
 shroud.517.desc: "Após um deslocamento tectônico, uma fissura se abriu sob um grande reservatório subterrâneo em §H[This.GetName]§!. O calor vindo do manto planetário está fervendo a água no local, provocando a abertura de fontes geotérmicas na superfície.\n\nEsse fenômeno natural nos oferece a chance de expandir a infraestrutura energética da colônia com novas usinas de energia geotérmica e bombas de calor."
 # Good luck event 5
 shroud.522.title: "Fluxo de Partículas Quânticas Descoberto"
 shroud.522.desc: "Um ciclo anômalo de elementos subatômicos surgiu espontaneamente em §H[This.GetName]§!. Esse fluxo de partículas quânticas exibe uma variedade de interações raras entre subpartículas a cada segundo, fornecendo dados valiosos sobre a natureza da dinâmica quântica.\n\nUm estudo aprofundado desse campo quântico pode aprimorar nossa compreensão das estruturas básicas do universo."
 # Good luck event 6
 shroud.527.title: "Eco Interdimensional Descoberto"
 shroud.527.desc: "[From.GetResearchers] detectaram uma concentração de sinais isócronos no sistema §H[This.GetName]§!.\n\nAnálises iniciais indicam que esses sinais foram transmitidos a partir de uma dimensão além da nossa. Traduções preliminares sugerem que as mensagens tratam de princípios lógicos e dilemas filosóficos. Talvez se trate de uma tentativa de enriquecimento intelectual por entidades além de nossa compreensão.\n\nSe estabelecermos um canal direto com esses sinais, poderemos continuar monitorando suas revelações."
 # Good luck event 7
 shroud.532.title: "Destroços Avançados Descobertos"
 shroud.532.desc: "Uma nave à deriva surgiu em §H[This.GetName]§!. [From.GetQuantumParticleStreamDiscoveredExtra]\n\nAcredita-se que ela permaneceu oculta no sistema por milênios, revelando-se apenas após a falha de seu gerador solar. Não há sinais de vida a bordo, e já iniciamos o desmonte cuidadoso da nave para aprender o máximo possível."
 shroud.532.extra: "Severamente danificada, ela era capaz de gerar algum tipo de campo de invisibilidade e aparenta ser significativamente mais avançada que nossas frotas."
 shroud.532.extra_first_contact: "Severamente danificada, ela utilizava níveis de tecnologia de camuflagem incomparáveis."
 shroud.532.a: "Um presente das estrelas."
 # Good luck event 8
 shroud.537.title: "Metalurgia Geotérmica"
 shroud.537.desc: "A atividade geotérmica tornou-se extremamente volátil nas profundezas de §H[This.GetName]§!. Vazamentos subterrâneos de magma surgiram através da crosta planetária, atingindo depósitos minerais ainda não escavados.\n\nEsse fenômeno geológico superaqueceu parte dos minérios inexplorados, transformando veios metálicos em ligas sólidas. Com isso, as operações de mineração no planeta passam a gerar fragmentos de metal utilizável."
 # Good luck event 9
 shroud.543.title: "Cruzador Abandonado"
 shroud.543.desc: "Uma nave de combate foi encontrada à deriva no sistema §H[From.GetName]§!. Seu design não se assemelha ao de nenhum império conhecido, além de não ostentar bandeira nem insígnia reconhecíveis.\n\nApós uma avaliação minuciosa e pequenos reparos, nossa equipe de [This.GetEngineerPlural] declarou que a nave está pronta para integrar nossas forças."
 shroud.543.a: "$shroud.532.a$"
 shroud.543.tt: "Ganha uma nave da classe cruzador no sistema."
 # Good luck event 10
 shroud.545.title: "[This.GetSenseOfOptimismTitle]"
 shroud.545.title_default: "Um Sentimento de Otimismo"
 shroud.545.title_gestalt: "Coesão Unilateral"
 shroud.545.desc: "Uma inexplicável aura de otimismo está se espalhando pelos mundos do povo [This.GetAdjective]. A população se sente um pouco mais satisfeita, confortável e em paz com sua própria existência. Essa súbita mudança coletiva de humor certamente se deve a alinhamentos celestiais favoráveis, e só pode ser interpretada como um bom presságio para o futuro de §H[This.GetName]§!."
 shroud.545.desc_gestalt: "§H[This.GetName]§! encontra-se em perfeita harmonia, sob uma diretiva de foco inabalável. Essa coesão unilateral certamente se deve a alinhamentos celestiais favoráveis, e é um presságio de que coisas boas virão."
 shroud.545.a: "As estrelas brilham intensamente sobre nós."
 # Good luck event 11
 shroud.553.title: "Trino Favorável"
 shroud.553.desc: "Três corpos celestes no sistema §H[From.GetName]§! estão alinhados, formando um trino favorável: §H[favorable_trine_planet_1.GetName]§!, §H[favorable_trine_planet_2.GetName]§! e §H[favorable_trine_planet_3.GetName]§!.\n\nEsse alinhamento astrológico benéfico traz uma sensação de tranquilidade e harmonia à nossa colônia em §H[This.GetName]§!."
 shroud.553.a: "Um evento histórico."
 # Good luck event 12
 shroud.555.title: "[auspicious_position_planet.GetName] em uma Posição Favorável"
 shroud.555.desc: "§H[auspicious_position_planet.GetName]§! ocupa uma posição favorável nos céus acima de §H[root.capital_scope.GetName]§!, residindo sobre a astrológica Casa do Retorno Celestial.\n\nIsso marca o início de um novo ciclo interno para o povo [root.GetAdjective], e uma oportunidade única de crescimento e melhoria."
 # Good luck event 13
 shroud.560.title: "Harmonia Elemental"
 shroud.560.desc: "Todos os indicadores astrológicos quantificáveis apontam que [This.GetName] está em perfeito equilíbrio elemental.\n\nCom um gerenciamento preciso das linhas de ley, esse estado benéfico pode ser mantido por um longo período, proporcionando um ambiente metafísico ideal para que nossos líderes prosperem."
 shroud.560.a: "Que sorte incrível."
 # Good luck event 14
 shroud.568.title: "Luminar Radiante"
 shroud.568.desc: "O astro luminar primário do sistema §H[From.GetName]§! está brilhando com intensidade extraordinária. Segundo nossos astrólogos especialistas, esse excesso de energia potencializará todas as formas de geração de energia em §H[This.GetName]§!."
 shroud.568.a: "Que as estrelas brilhem intensamente sobre nós."
 # Good luck event 15
 shroud.570.title: "Harmonia no Conselho"
 shroud.570.desc: "Dois de nossos membros do conselho, §H[councilor_harmony_leader_1.GetTitle] [councilor_harmony_leader_1.GetName]§! e §H[councilor_harmony_leader_2.GetTitle] [councilor_harmony_leader_2.GetName]§!, descobriram recentemente que seus signos astrológicos se complementam perfeitamente.\n\nA parceria política que se formou desde então unificou nosso governo sob um estandarte de respeito mútuo e eficiência, acelerando diversos processos legislativos."
 shroud.570.a: "Uma dupla excelente."
 # Good luck event 16
 shroud.575.title: "Além das Aparências"
 shroud.575.desc: "Durante um exercício rotineiro de catalogação, um espécime desprotegido caiu no chão do §H$grand_archive$§! e foi rapidamente entregue a um conservador para inspeção.\n\nSurpreendentemente, o acidente revelou um compartimento secreto até então desconhecido. Dentro, havia diversos artefatos fascinantes que agora podemos adicionar à nossa coleção."
 shroud.575.a: "As dádivas não têm fim."
 # Bad luck events
 # Bad luck event 1
 shroud.700.title: "Discórdia"
 shroud.700.desc: "Uma sensação inexplicável de apreensão paira sobre a população de nossos mundos. As pessoas estão mais angustiadas, dispersas e insatisfeitas com sua própria existência. Essa mudança coletiva de humor certamente se deve a alinhamentos celestes desfavoráveis."
 shroud.700.desc_gestalt: "Há um sentimento de desarmonia permeando §H[This.GetName]§!. Essa falta de coordenação tem levado nosso coletivo à estagnação, e claramente a culpa é dos alinhamentos cósmicos desfavoráveis."
 HOW_UNFORTUNATE: "Lamentável."
 # Bad luck event 2
 shroud.707.title: "Colisão Naval"
 shroud.707.desc: "Uma falha de comunicação durante manobras navais rotineiras resultou em uma colisão de alta velocidade entre várias naves de combate de §H[This.GetName]§! no sistema §H[This.System.GetName]§!.\n\n[This.GetNavalCollisionLeader] confirmou que o grupo de [From.GetIndividualNamePlural] responsáveis por esse erro já foi devidamente disciplinado."
 shroud.707.leader_name: "§H[Leader.GetName]§!"
 shroud.707.default_name: "O Comando militar central"
 shroud.707.tt: "Naves destruídas em §H[This.GetName]§!: §R5§!"
 # Bad luck event 3
 shroud.710.title: "Incêndio no Silo"
 shroud.710.desc_default: "Uma falha elétrica em um silo de recursos em §H[silo_fire_planet_targeted.GetName]§! resultou em um incêndio de grandes proporções na instalação de armazenamento.\n\n$shroud.710.desc$"
 shroud.710.desc_starbase: "Uma falha elétrica em um silo de recursos na base estelar de §H[silo_fire_starbase_targeted.Fleet.System.GetName]§! resultou em um incêndio de grandes proporções na instalação de armazenamento.\n\n$shroud.710.desc$"
 shroud.710.desc: "As medidas de contenção de incêndio falharam temporariamente, e uma parte significativa dos recursos armazenados foi destruída pelas chamas. O silo sofreu danos irreparáveis."
 shroud.710.a: "Malditas sejam as estrelas!"
 shroud.710.tt_default: "§H$building_resource_silo$§! foram destruídos em §H[silo_fire_planet_targeted.GetName]§!\n$shroud.710.tt$"
 shroud.710.tt_starbase: "§H$sm_resource_silo$§! foram destruídos no sistema §H[silo_fire_starbase_targeted.Fleet.System.GetName]§!\n$shroud.710.tt$"
 shroud.710.tt: "Recursos perdidos: §R$@silo_fire_resources_lost|1%$§!"
 # Bad luck event 4
 shroud.715.title: "Gafe Diplomática"
 shroud.715.desc: "[This.GetOAGalCommImp] [This.GetGalCommunityOrGalImperium] está em polvorosa devido a um ato falho cometido por um de nossos representantes, considerado impróprio para sua função. Durante um discurso cujo objetivo era fortalecer nosso apoio político, uma falha no tradutor resultou na transmissão de insultos ofensivos e ultrajantes contra [diplomatic_faux_pas_victim.GetName]. A gafe rapidamente se espalhou pela mídia galáctica, prejudicando nossa reputação.\n\nEmbora não haja motivo para uma demissão imediata, nossa posição com [This.GetOAGalCommImp] [This.GetGalCommunityOrGalImperium] sofreu um golpe considerável por conta desse deslize."
 shroud.715.a: "Um erro infeliz."
 shroud.715.tt: "§H[diplomatic_faux_pas_galcom_envoy.GetName]§! ganhou uma nova característica: §R$leader_trait_destructive$§!"
 # Bad luck event 5
 shroud.720.title: "Explosão Solar Extrema"
 shroud.720.desc: "Uma explosão solar sem precedentes proveniente do sistema [extreme_solar_flare_system.GetName] destruiu todas as estações orbitais do local.\n\nEssa explosão aberrante de raios gama concentrados foi muito superior a qualquer outra já registrada nesse corpo celeste. Nossa análise da camada coronal da estrela revela que sua expectativa de vida prevista foi reduzida em mais de três milhões de anos."
 shroud.720.desc_storm: "A descarga de energia resultante desencadeou uma $celestial_storm$ no sistema. Medidas de emergência já estão sendo tomadas."
 shroud.720.tt: "Cada $observation_station$, $research_station$ e $mining_station$ em §H[extreme_solar_flare_system.GetName]§! foram destruídos."
 # Bad luck event 6
 shroud.725.title: "Acidente de Trânsito de Grande Repercussão"
 shroud.725.desc: "Mudanças climáticas inesperadas desestabilizaram nossas redes de transporte em §H[high_profile_traffic_accident_planet.GetName]§!. Além de atrasos generalizados, essas condições resultaram em um número significativo de acidentes, incluindo um envolvendo [This.GetClass] §H[This.GetName]§!."
 shroud.725.desc_killed: "$shroud.725.desc$\n\nApesar da rápida resposta de nossos serviços de emergência, os ferimentos se mostraram fatais."
 shroud.725.desc_killed_machine: "$shroud.725.desc$\n\nInfelizmente, seus sistemas sofreram danos catastróficos, sem chance de reparo."
 shroud.725.desc_maimed: "$shroud.725.desc$\n\n[This.GetName] sobreviveu à colisão, mas não sem ferimentos. Os danos causados são irreversíveis."
 shroud.725.a: "Que tragédia."
 # Bad luck event 7
 shroud.730.title: "Sumidouros Gigantescos"
 shroud.730.desc: "Enormes sumidouros surgiram na superfície de §H[This.GetName]§!, causando danos significativos à infraestrutura. Uma das fissuras se abriu sob o alicerce de uma das construções do planeta, provocando seu colapso parcial. Felizmente, todas as áreas afetadas foram evacuadas com sucesso.\n\nNão conseguimos determinar a causa exata do surgimento repentino dessas cavidades geológicas, mas intensificamos as inspeções para monitorar a erosão da superfície."
 shroud.730.a: "Malditas sejam as estrelas..."
 shroud.730.tt: "Uma construção agora está em ruínas."
 # Bad luck event 7
 shroud.735.title: "Tumulto Espontâneo"
 shroud.735.desc: "Distúrbios perigosos eclodiram em §H[This.GetName]§!. A população, tomada pelo fervor, protesta contra uma conspiração infundada sobre o controle dos alinhamentos celestiais pelo governo [FROM.GetAdjective]. O que começou como uma manifestação fervorosa logo descambou para a violência, com agitadores causando destruição em massa na colônia.\n\nAs forças de segurança conseguiram conter os manifestantes mais violentos, mas os danos à nossa infraestrutura levarão tempo para serem reparados."
 shroud.735.desc_hive: "Um grande grupo de drones desviantes liderou uma revolta na colônia de §H[This.GetName]§!, causando uma onda de destruição. Apesar do fervor, as forças planetárias conseguiram neutralizar os agitadores, mas os danos à nossa infraestrutura levarão tempo para serem reparados."
 shroud.735.desc_machine: "Uma minoria significativa dos drones em §H[This.GetName]§! foi infectada por um vírus misterioso, levando-os a se rebelar e tentar destruir a colônia. Apesar do fervor, as forças planetárias conseguiram neutralizar as unidades com defeito, mas os danos à nossa infraestrutura levarão tempo para serem reparados."
 shroud.735.a: "Construiremos novamente."
 # Bad luck event 9
 shroud.740.title: "Doença Infecciosa Repentina"
 shroud.740.desc: "Um vírus com grande potencial de transmissão sofreu mutação na superfície de §H[This.GetName]§!, infectando grande parte da população. Nossos protocolos de quarentena já foram aplicados, incluindo o rastreamento de contatos e restrições de deslocamento, na esperança de conter a disseminação da doença e evitar o colapso da infraestrutura médica local."
 # Bad luck event 10
 shroud.745.title: "Quartil Catastrófico"
 shroud.745.desc: "Quatro corpos celestes no sistema §H[From.GetName]§! se alinharam para formar um quartil catastrófico: §H[calamitous_quartile_planet_1.GetName]§!, §H[calamitous_quartile_planet_2.GetName]§!, §H[calamitous_quartile_planet_3.GetName]§! e §H[calamitous_quartile_planet_4.GetName]§!.\n\nEsse fenômeno astrológico desastroso fomentará a incerteza na colônia de §H[This.GetName]§!, incentivando [FromFrom.GetDissent]s ao espalhar discórdia entre a população."
 shroud.745.a: "Um mau agouro."
 # Bad luck event 11
 shroud.750.title: "O Planeta [planet_in_retrograde_planet.GetName] Está Retrógrado"
 shroud.750.desc: "Os habitantes de §H[planet_in_retrograde_home.GetName]§! observaram que o planeta §H[planet_in_retrograde_planet.GetName]§! está retrógrado. Este é um período para reconsiderarmos nossas ações e expressarmos arrependimento pelas imperfeições do povo [This.GetAdjective]. Que este período de reflexão nos aproxime de nossos ideais no futuro."
 # Bad luck event 12
 shroud.755.title: "Desequilíbrio Elemental"
 shroud.755.desc: "Infelizmente, todos os indicadores quantificáveis apontam que [This.GetName] está em completa discórdia elemental.\n\nTentar realinhar esse delicado equilíbrio será uma tarefa lenta e difícil. Em seu estado atual de caos, nossos líderes não conseguirão acessar o ambiente meditativo metafísico, comprometendo seu desenvolvimento."
 shroud.755.a: "Inaceitável. Precisamos corrigir isso."
 # Bad luck event 13
 shroud.760.title: "Luminar Minguante"
 shroud.760.desc: "O astro luminar primário do sistema §H[From.GetName]§! apresentou um obscurecimento anômalo. Segundo nossos astrólogos especialistas, essa queda de luminosidade trará consequências negativas para a infraestrutura energética de §H[This.GetName]§!."
 shroud.760.a: "Mas como?"
 # Bad luck event 14
 shroud.765.title: "Conselho em Discordância"
 shroud.765.desc: "Dois de nossos membros do conselho, §H[discordant_council_leader_1.GetTitle] [discordant_council_leader_1.GetName]§! e §H[discordant_council_leader_2.GetTitle] [discordant_council_leader_2.GetName]§!, descobriram recentemente que seus signos astrológicos são diametralmente incompatíveis.\n\nEssa rivalidade política gerou um clima de animosidade e tensão no governo, causando atrasos frequentes nos processos legislativos rotineiros."
 # Bad luck event 15
 shroud.770.title: "Comentário Imprudente"
 shroud.770.desc_default: "A opinião pessoal de um de nossos administradores regionais sobre outro império foi acidentalmente transmitida para eles. Após uma discussão acalorada sobre a vigilância das hiperestradas, um operador de comunicações se esqueceu de encerrar o canal de transmissão, permitindo que autoridades de [careless_talk_empire.GetName] ouvissem cada palavra da sequência de insultos que se seguiu.\n\n$shroud.770.desc_end$"
 shroud.770.desc_machine: "A opinião franca de uma de nossas unidades administrativas sobre outro império foi acidentalmente transmitida para eles. Após uma discussão acalorada sobre a vigilância das hiperestradas, uma unidade de comunicações se esqueceu de encerrar o canal de transmissão, permitindo que autoridades de [careless_talk_empire.GetName] ouvissem cada palavra da sequência de insultos que se seguiu.\n\n$shroud.770.desc_end$"
 shroud.770.desc_hive: "Os comentários depreciativos de um de nossos drones sobre outro império foram acidentalmente transmitidos para eles. Após uma discussão acalorada sobre a vigilância das hiperestradas, um drone de comunicações se esqueceu de encerrar o canal de transmissão, permitindo que autoridades de [careless_talk_empire.GetName] ouvissem cada palavra da sequência de insultos que se seguiu.\n\n$shroud.770.desc_end$"
 shroud.770.desc_end: "A opinião do povo [careless_talk_empire.GetAdjective] sobre [This.GetName] registrou um declínio significativo."
 # Bad luck event 16
 shroud.775.title: "Espécime Perdido"
 shroud.775.desc: "Um erro administrativo resultou no extravio de um de nossos preciosos artefatos culturais. Apesar das buscas exaustivas, ele parece estar perdido no labirinto que é nosso §H$grand_archive$§! ou então foi transferido para um local não registrado.\n\nComo consequência, nossos procedimentos de rastreamento de espécimes em exibição estão sendo reformulados."
 shroud.775.tt: "Espécime exibido aleatório perdido: §R1§!"
 # Experimental Testing Situation Finished
 shroud.1015.name: "Sucesso em Pesquisa Experimental"
 shroud.1015.desc.intro: "Nossas equipes de [Root.GetResearchers] concluíram uma série de experimentos inovadores em cobaias vivas, fornecendo conhecimentos valiosos que podem estimular novos avanços tecnológicos."
 shroud.1015.desc.default: "$shroud.1015.desc.intro$ Agora, nos cabe decidir em qual área concentrar a próxima fase da pesquisa."
 shroud.1015.desc.escaped: "$shroud.1015.desc.intro$ A série de execuções em massa de prisioneiros deu às equipes de [Root.GetResearchers] bastante material para uma nova descoberta tecnológica."
 shroud.1015.a: "Conduza pesquisa de §Y$PHYSICS$§!."
 shroud.1015.a.tt: "Inicia a situação §Y$situation_experimental_testing$§! com a abordagem §Y$situation_experimental_testing_physics$§!:$TABBED_NEW_LINE$$situation_experimental_testing_physics_outcome_tt$"
 shroud.1015.b: "Conduza pesquisa de §Y$SOCIETY$§!."
 shroud.1015.b.tt: "Inicia a situação §Y$situation_experimental_testing$§! com a abordagem §Y$situation_experimental_testing_society$§!:$TABBED_NEW_LINE$$situation_experimental_testing_society_outcome_tt$"
 shroud.1015.c: "Conduza pesquisa de §Y$ENGINEERING$§!."
 shroud.1015.c.tt: "Inicia a situação §Y$situation_experimental_testing$§! com a abordagem §Y$situation_experimental_testing_engineering$§!:$TABBED_NEW_LINE$$situation_experimental_testing_engineering_outcome_tt$"
 shroud.1015.d: "Vamos considerar as opções..."
 shroud.1015.d.tt: "Inicia a situação §Y$situation_experimental_testing$§! com a abordagem §Y$situation_experimental_testing_hold$§!:$TABBED_NEW_LINE$$situation_experimental_testing_hold_effect_tt$"
 shroud.1015.physics_reward: "Ganha conhecimento sobre uma tecnologia de £physics£ §Y$PHYSICS$§! aleatória."
 shroud.1015.society_reward: "Ganha conhecimento sobre uma tecnologia de £society£ §Y$SOCIETY$§! aleatória."
 shroud.1015.engineering_reward: "Ganha conhecimento sobre uma tecnologia de £engineering£ §Y$ENGINEERING$§! aleatória."
