 resolution_galactic_focus_repeal_crisis_malevolent_aura_desc: "Já chega. O império alvo não deve mais ser o foco coletivo de nossos esforços defensivos. Hostilidades com membros da Comunidade devem cessar imediatamente."
 resolution_galactic_focus_crisis_malevolent_aura: "Foco: Aura Malévola"
