 civic_tooltip_not_chosen: "NÃO possui o Componente Cívico ['concept_chosen_civics']"
 concept_chosen_civics: "Os Escolhidos"
 concept_chosen_civics_desc: "Componentes Cívicos de $concept_chosen_civics$ consistem em\n- ['civic:civic_chosen']$NEW_LINE$- ['civic:civic_hive_chosen']$NEW_LINE$- ['civic:civic_machine_chosen']$NEW_LINE$- ['civic:civic_corporate_chosen']"
 shroud.5105.title: "Os Escolhidos"
 shroud.5105.desc: "Ela sempre nos acompanhou... uma conexão etérea com uma entidade que não podemos definir nem compreender.\n\n[This.GetTheChosenP2]\n\nDesde os primeiros registros de nossa história, essa presença misteriosa sempre esteve lá. Que ela nos escolheu, disso não há dúvida... mas o motivo permanece obscuro.\n\nQue nome devemos dar a tal [This.GetSensation]?"
 shroud.5105.desc_p2: "Sentimos sua presença em nossos pensamentos mais profundos. Sempre ali, além de nosso alcance. Em nossas mentes, é ao mesmo tempo uma certeza e uma impossibilidade."
 shroud.5105.desc_p2_machine: "Detectamos sua presença em nossos cálculos mais complexos. Sempre ali, além de nosso alcance. Em nossos circuitos, é ao mesmo tempo uma certeza e uma impossibilidade."
 shroud.5105.a: "$the_composer_of_strands_article_cap$"
 shroud.5105.b: "$the_eater_of_worlds_article_cap$"
 shroud.5105.c: "$the_cradle_of_souls_article_cap$"
 shroud.5105.d: "$the_instrument_of_desire_article_cap$"
 shroud.5110.title: "Chamado de [GetChosenPatron]"
 shroud.5110.desc_common: "Ao longo de nossa história, a entidade indescritível conhecida como §H[GetChosenPatron]§! sempre esteve presente. Agora, diante da vasta imensidão da galáxia, podemos [GetFeelLoc] sua presença em nossas [GetMindPhysicalLoc] como nunca antes.\n\nSempre ali, nos atraindo. E nessa aproximação, percebemos pela primeira vez os contornos desse vazio profundo e misterioso em nossas próprias [GetMindLogicLoc]. A entidade [GetChosenPatron] chama"
 shroud.5110.desc_common_2: "Finalmente compreendemos como visitar esse domínio etéreo por iniciativa própria."
 shroud.5110.desc_organic: "$shroud.5110.desc_common$, nos tentando com experiências além de nossa compreensão.\n\n$shroud.5110.desc_common_2$"
 shroud.5110.desc_robot: "$shroud.5110.desc_common$, otimizando nossos parâmetros segundo princípios ainda desconhecidos.\n\n$shroud.5110.desc_common_2$"
 shroud.5110.a: "Nossos horizontes se expandem introspectivamente."
 shroud.5110.a.tt: "Ganha §YSintonia§! com esta entidade: $@chosen_patron_attunement_gift|0G$\nO painel §YVéu§! pode ser acessado pelo menu §YContatos§!."
 shroud.5115.title: "[GetChosenPatron]"
 shroud.5115.desc.intro: "O Véu. Ele flui acima de nossa realidade conhecida, uma sombra projetada pela escuridão.\n\nEmbora já tenhamos nos aventurado bastante nesse reino psiônico, nossas expedições iniciais foram apenas experimentais. Agora, depois de anos desgastando o manto entre as dimensões com nossas mentes combinadas, nós o sentimos de modo claro o suficiente para explorar com propósito.\n\nNo outro lado, nossos esforços não passaram despercebidos. A entidade §H[GetChosenPatron]§! nos aguarda."
 shroud.5115.desc.outro: "Neste turbilhão de inúmeras entidades, sua clareza é uma promessa."
 shroud.5115.desc.composer: "$shroud.5115.desc.intro$\n\n§HDESDOBRE. ENVOLVA. EXPANDA.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.eater: "FEEL$shroud.5115.desc.intro$\n\n§HSINTA A VERDADEIRA FOME.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.cradle: "$shroud.5115.desc.intro$\n\n§HREÚNAM-SE E RECEBAM.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.instrument: "$shroud.5115.desc.intro$\n\n§HCEDA AO DESEJO.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.a: "Nós voltaremos."
