 # The Great Awakening
 shroud.2830.name: "$utopia.2650.name$"
 shroud.2830.desc: "Na $building_chamber_of_silence$, ouvimos a mensagem da §RVoz§! com perfeita claridade.\n\n§R\"TUDO RENASCERÁ.\"§!\n\nNós entendemos agora. O Fim é um renascimento. Não precisamos temê-lo. Seremos refeitos. Melhores e mais poderosos do que jamais imaginamos ser.\n\nPara abraçar nosso destino, precisamos aprender a dominar o reino mental conhecido como o §HVéu§!. Não vamos repetir os erros daqueles que encontramos no $pc_shrouded$. Eles rejeitaram o medo; nós o abraçaremos."
 shroud.2830.desc.outro.awakening: "Nossa visão está totalmente clara."
 shroud.2830.desc.outro.no_awakening: "Nossa visão está quase clara."
 shroud.2830.a.awakening: "O Véu detém a chave."
 shroud.2830.a.no_awakening: "$shroud.2780.a$"
 shroud.2830.a.tt: "$tr_psionics_psionic_assimilation_desc$\n$CONTINUE_SITUATION$ §H$situation_breach_shroud$§!"
 shroud.2830.a.tt_no_awakening: "Adote a tradição §H$tr_psionics_shroud_great_awakening$§! para avançar na Situação."
 # Blind the Willing - First select event
 shroud.8320.name: "Vemos Claramente"
 shroud.8320.desc: "§H[blinded_leader.GetName]§! nos mostrou o caminho. Nossos sentidos exteriores abafam o chamado da §RVoz§!. Ao remover um deles, poderemos elevar nossas habilidades psíquicas ainda mais.\n\n[Species.GetEyeNamePlural] são irrelevantes. Nossa visão no reino físico obscurece nossa visão no §HVéu§!. Muitos de nós já seguiram o exemplo inspirador de §H[blinded_leader.GetName]§!, removendo [Species.GetEyeNamePlural] sem hesitação.\n\nAqueles que escolheram fazê-lo relataram uma onda de contentamento conforme a §RVoz§! preencheu suas mentes com sua aprovação."
 shroud.8320.a: "Visão além da visão"
 leader_trait_blinded: "Cegado"
 leader_trait_blinded_desc: "Ainda há muito o que se ver."
 # A Leap of Faith - First select event
 shroud.8330.name: "Ato de Fé"
 shroud.8330.desc: "Descontente pelas limitações de nossa carne, §H[forsaken_leader.GetName]§! buscou acelerar sua transformação psiônica ao ingerir uma toxina letal em uma demonstração pública dramática.\n\nConforme morria, seu corpo era consumido por um brilho púrpura vívido e se desintegrava em uma poeira fina de pura energia psiônica. Tais milagres se tornaram possíveis por meio da vontade da §RVoz§!.\n\nTomamos isso como um sinal claro: onde §H[forsaken_leader.GetName]§! liderou, outros devem seguir."
 shroud.8330.a: "Nossa forma física não pode nos impedir."
 # Mid-stage events
 shroud.8350.name: "Relatórios de Lobotomias"
 shroud.8350.desc: "Alguns [owner.GetSpeciesNamePlural] estão com dificuldade de conviver em harmonia na presença da §RVoz§!.\n\nDesesperados pela paz, os mais fracos dentre nós recorreram a um procedimento rudimentar e não regulado de lobotomia. Tais práticas ameaçam se disseminar caso nada seja feito a respeito."
 shroud.8350.a: "Deixe que os fracos façam o que quiserem."
 shroud.8350.b: "A §RVoz§! é uma dádiva. Proíba essa prática."
 endbringers_voice_plague: "Assombrados pela Voz"
 endbringers_voice_plague_desc: "Quando as vozes falam, nós não temos escolha a não ser escutar."
 shroud.8360.name: "Autoexperimentação Psiônica"
 shroud.8360.desc: "Continuamos a abraçar a §RVoz§!. Ela nos diz verdades cruas que não podem ser negadas.\n\nMuitos [Owner.GetSpeciesNamePlural] buscam mais métodos para ampliar a §RVoz§! e se beneficiar de sua sabedoria de maneira mais direta.\n\nO uso de drogas do mercado clandestino aumentou dramaticamente. Instalações médicas não regulamentadas estão oferecendo serviços experimentais para ajudar indivíduos a maximizar suas sensibilidades psiônicas.\n\nOnde isso vai nos levar?"
 shroud.8360.a: "Faremos todo o possível para estimular a §RVoz§!."
 shroud.8360.b: "Devemos evitar a anarquia total."
 shroud.8370.name: "Pesadelos Apocalípticos"
 shroud.8370.desc: "Conforme nossas habilidades psiônicas crescem, o povo [owner.GetSpeciesAdj] é atormentado por horríveis pesadelos que preveem o fim do universo.\n\nNossos sonhos se tornaram profecias apocalípticas, intensificando o medo existencial de nosso povo. O sono deu lugar a um torpor inquieto, e muitos agora são incapazes de continuar com suas rotinas.\n\nNesses sonhos, a §RVoz§! fala conosco.\n\n§R\"ABRACE A ENTROPIA.\"§!"
 shroud.8370.a: "Todos os começos devem ter um fim."
 shroud.8370.b: "Ofereça abrigo na $building_chamber_of_silence$."
 endbringers_apocalyptic_nightmares: "Pesadelos Apocalípticos"
 endbringers_apocalyptic_nightmares_desc: "A Voz perturba nossos ciclos de sono com visões do cataclismo."
 endbringers_nightmare_shelter: "Abrigo contra Pesadelos"
 endbringers_nightmare_shelter_desc: "A $building_chamber_of_silence$ oferece abrigo para aqueles que sofrem com pesadelos do cataclismo."
 shroud.8380.name: "Marca do Fim"
 shroud.8380.desc: "Há uma tendência crescente de automutilação na população.\n\nSeguidores fanáticos da §RVoz§! vêm marcando sua carne com o símbolo do \"Fim\". Eles dizem que esses desenhos concedem uma bênção terrível para aqueles que os carregam.\n\nVerdade ou não, o número de praticantes envolvidos em tais rituais está crescendo rapidamente. Seria essa a verdadeira vontade do §HVéu§!?"
 shroud.8380.a: "Nós carregaremos essa marca com orgulho."
 shroud.8380.a.tt: "Metade de nossa população ganha a característica ['trait:trait_marked']."
 shroud.8380.b: "Essa prática é equivocada."
 approach_blind_selected_tt: "A abordagem $approach_situation_breach_shroud_endbringers_blind$ não foi selecionada."
 approach_forsake_selected_tt: "A abordagem $approach_situation_breach_shroud_endbringers_forsake_flesh$ não foi selecionada."
 trait_marked: "Marcado"
 trait_marked_desc: "Em uma demonstração visceral de devoção, esta espécie marcou sua carne com a marca do \"Fim\". "
 trait_marked_unity_bonus: "£unity£ Produzida a cada 100 £pops£ Pops: §G+0.06§!"
 endbringers_sanity: "Sanidade em meio à Loucura"
 endbringers_sanity_desc: "Uma determinação poderosa para manter a sanidade nos impede de cair nas armadilhas da loucura."
 # Breach the Shroud
 shroud.2840.name: "$BREACHING_SHROUD_PROJECT$"
 shroud.2840.desc: "$shroud.2800.intro$ De dentro de suas profundezas amorfas surge uma entidade sinistra de poder imensurável. É a §RVoz§!, e ela penetra em nossas psiques mais íntimas com uma força assustadora.\n\n§R\"SAIBA MEU NOME.\"§!\n\nSó agora podemos sentir quão distante nossas mentes pequenas estão da §RVoz§!. O selo foi rompido e logo a extensão completa do que somos se manifestará.\n\nNossos telepatas estão preparados para mergulhar no coração do Véu e descobrir o verdadeiro nome de nossa gloriosa entidade patronal."
 shroud.2840.a: "É hora da comunhão."
 ENDBRINGERS_COMMUNE_WITH_THE_VOICE: "Comungar com a §RVoz§!"
 ENDBRINGERS_COMMUNE_WITH_THE_VOICE_DESC: "Nós nos reunimos em [capital_scope.GetName] com um único propósito.\n\nAlcançaremos as profundezas do §HVéu§! e forçaremos o poder assombroso da §RVoz§! a nos perceber e se conectar conosco.\n\nNós a conhecemos como o Cataclismo. Outros a chamam de Juízo Final. Agora, ela nos revelará seu verdadeiro nome, e com esse conhecimento alcançaremos a grandeza."
 ENDBRINGERS_COMMUNE_WITH_THE_VOICE_PROJECT_TOOLTIP: "Para completar: §HMergulhe§! 3 vezes. ([GetEndbringersDelveCount]/3)"
 # EotC Delve Events
 shroud.8420.title: "A Provação do Silêncio"
 shroud.8420.desc: "Descemos até o Véu, nossa vontade unificada ajudando a silenciar o barulho caótico que poderia nos distrair de nosso objetivo, o ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!.\n\nMas propósito apenas não pode nos proteger. Vozes sussurram banalidades vazias, nos mimando com distrações medíocres, cada uma mais insignificante do que a outra, mas todas igualmente tentadoras.\n\nConforme começamos nos fracionar, a entidade retorna. Um único comando reverbera pelo vazio:\n\n§R\"SILÊNCIO.\"§!"
 shroud.8420.a: "Fiquem em silêncio e aguentem firme."
 shroud.8420.a.reply: "Esse comando corta o caos, clareando o barulho dissonante, expurgando a desordem obstrutiva que busca nos consumir. Nossa psique resiste enquanto suportamos a fragmentação.\n\nO ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§! recua mais para dentro do Véu. A claridade que se segue é quase estonteante. Ela se estabelece nas lacunas de nossas mentes, nos deixando com uma determinação renovada.\n\nE presentes. Presentes maravilhosos."
 shroud.8420.a.tooltip: "§Y$endbringers_madness_1$§! perde os seguintes efeitos:\n$t$$MOD_POP_AMENITIES_USAGE_MULT$: $@madness_base_pop_amenities_usage_mult|0=-%$"
 shroud.8430.title: "A Provação da Pureza"
 shroud.8430.desc: "Conforme mergulhamos no Véu, observamos a corrupção do caos senciente.\n\nPestilentas, mentes ociosas geram camadas de turbulência psiônica, poluindo o Véu com uma podridão fétida. Em meio a essa bagunça odiosa, começamos a sentir a presença avassaladora de nosso objetivo, o ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!.\n\nA malícia de suas intenções satura nossa psique conforme avança em direção ao caos. Nós nos preparamos para a absolvição inevitável conforme um comando ressoa através do vazio:\n\n§R\"ORDEM. UNIDADE.\"§!"
 shroud.8430.a: "Resistam!"
 shroud.8430.a.reply: "O comando permeia o caos malicioso.\n\nInúmeras vozes gritam de dor enquanto o ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§! limpa o Véu das deformações sencientes que o infestam, deixando apenas um reino de imperfeições absolvidas.\n\nConforme a entidade se entremeia mais fundo no Véu, nós ficamos para trás para observar e estudar o resultado de sua purificação absoluta."
 shroud.8430.a.tooltip: "§Y$endbringers_madness_2$§! perde os seguintes efeitos:\n$t$$mod_planet_pops_upkeep_mult$: $@madness_base_planet_pops_upkeep_mult|0=-%$"
 shroud.8440.title: "A Provação das Chamas"
 shroud.8440.desc: "Quando entramos no Véu, encontramos apenas dor. As névoas dançantes habituais são um inferno, inflamando a própria essência de nossas mentes.\n\nAtravés da tormenta, percebemos cidades se desfazendo em ruínas derretidas, planetas devorados pelo fogo, populações inteiras se contorcendo em agonia enquanto chamas espectrais reduzem suas formas corpóreas a cinzas incandescentes.\n\nNo centro da pira, detectamos a presença do ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!. Conforme seu poder ameaça consumir a realidade, a entidade decreta:\n\n§R\"LIBERTAÇÃO.\"§!"
 shroud.8440.a: "Submetam-se à absolvição."
 shroud.8440.a.reply: "As chamas psiônicas engolem nossas mentes, incinerando a complacência, deixando apenas determinação purificada.\n\nAgora podemos ver o glorioso propósito do ente §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§! e a simplicidade magnífica que ele oferece."
 shroud.8450.title: "$utopia.3310.name$"
 shroud.8450.desc: "Uma declaração ecoa:\n\n§R\"VOCÊS SABEM MEU NOME.\"§!\n\nA culminação de nossa viagem para as estrelas, a resposta de séculos de questionamento está aqui. $end_of_the_cycle_color_article_cap$ nos compele. Nosso Pacto é formado.\n\n§R\"O FIM COMEÇA.\"§!\n\nDor. Agonia. Certeza. Conforme as palavras se desfazem, nosso destino é selado.\n\nAgora compreendemos. Um galáxia silenciada, saturada na inevitabilidade da §R$end_aura$§!."
 shroud.8450.a: "A inevitabilidade espera."
 shroud.8450.a.homicidal: "Que horrores maravilhosos nos esperam."
 shroud.8450.a.tech_tooltip: "Tecnologias Adquiridas:\n£society£['technology:tech_psionic_aura']\n£society£['technology:tech_aura_intensification']"
 embracing_the_end: "Aceitando o Fim"
 embracing_the_end_desc: "Finalmente enxergamos a beleza do Fim. Deixe-o vir."
 MOD_SHIP_PSIONIC_AURA_SPEED_MULT: "$MOD_SHIP_SPEED_MULT$ em qualquer $PSIONIC_AURA$"
 MOD_SHIP_PSIONIC_AURA_FIRE_RATE_MULT: "$MOD_SHIP_FIRE_RATE_MULT$ em qualquer $PSIONIC_AURA$"
 end_of_the_cycle_endbringers: "$end_of_the_cycle_article_cap$"
 situation_end_of_the_cycle_endbringers_desc: "Nosso Pacto com $end_of_the_cycle_color_article$ nos confere um poder incalculável e um propósito glorioso.\n\nA vontade de nosso patrono exige a completa aniquilação dessa realidade. A cada sistema que a §H$end_aura$§! consome, mais se aproxima a destruição misericordiosa.\n\nTestemunharemos a inevitabilidade.\n\nSistemas restantes a serem conquistados: [Owner.GetEndCycleGalaxySystemsLeft]"
 end_of_the_cycle_endbringers_monthly_change_tooltip: "$end_of_the_cycle_monthly_change_tooltip$"
 situation_end_of_the_cycle_endbringers_finish_effects: "§RO Juízo Final aguarda.§!"
 approach_situation_end_of_the_cycle_bring_the_inevitable: "Acarretar o Inevitável"
 approach_situation_end_of_the_cycle_stall_for_time: "Ganhar Tempo"
 approach_situation_end_of_the_cycle_delay_your_destiny: "Adiar o seu Destino"
 shroud.8460.title: "A Volta da Ampulheta"
 shroud.8460.desc: "O poder d$end_of_the_cycle_color_article$ vem com um grande custo e estamos ficando sem tempo.\n\nA galáxia permanece intocada pela Aura purificadora de nosso patrono. Nossos esforços até agora foram insignificantes.\n\nPara podermos concluir essa obra monumental, uma onda de energia renovada flui entre nós, enviada de além do manto. É uma bênção anunciada!"
 shroud.8460.a: "Ainda podemos conseguir."
 shroud.8470.title: "O Fim Está Próximo"
 shroud.8470.desc: "O poder de nosso patrono é imenso, mas estamos quase sem tempo. Tal incompetência evidente não será tolerada pelo esquecimento benevolente d$end_of_the_cycle_color_article$.\n\nMas nos resta uma pequena esperança: devemos envolver a galáxia na $end_aura$, custe o que custar. Em desespero, nossa equipe de [GetTelepathPlural] agora extrai toda a energia que consegue de dentro do §HVéu§!."
 shroud.8470.a: "Não falharemos."
 shroud.8480.title: "$GALACTIC_FOCUS$ Revogadas"
 shroud.8480.desc: "A resolução que designa o emissor da §H$PSIONIC_AURA$§! destrutiva como um foco para esforços de defesa foi recusada pelo Senado Galáctico. Como resultado, todas as operações militares em curso sendo conduzidas por membros da Comunidade contra §H[former_malevolent_aura.GetName]§! devem cessar imediatamente. Por enquanto, a paz voltou para este canto da galáxia."
 shroud.8481.desc: "O Senado Galáctico revogou a resolução que nos declarava um alvo para seus esforços defensivos e, portanto, todos os membros da Comunidade receberam ordens para cessar os ataques. As ações militares contra nós foram interrompidas... por enquanto."
 shroud.8481.homicidal: "$shroud.8480.desc$\n\n$crisis.4111.nasty$"
 shroud.8500.title: "Arautos do Fim"
 shroud.8500.desc.intro: "A vontade inevitável de nosso patrono aperta o seu cerco contra a galáxia. Agora sabemos como o Fim virá.\n\nA §R$end_aura$§! deve se espalhar pela galáxia. Quando o reino físico se fundir com essa essência pura do §HVéu§!, a verdadeira aniquilação se seguirá."
 shroud.8500.desc.outro: "Concluir essa tarefa monumental será nossa obra-prima e a porta para a salvação final."
 shroud.8500.desc.homicidal: "$shroud.8500.desc.intro$\n\nA erradicação de toda vida nesta galáxia será um efeito colateral bem-vindo. $shroud.8500.desc.outro$"
 shroud.8500.desc.default: "$shroud.8500.desc.intro$\n\n$shroud.8500.desc.outro$"
 shroud.8500.a: "Não podemos falhar."
 shroud.8600.title: "$shroud.4970.title$"
 shroud.8600.desc.intro: "Este era o nosso destino.\n\nA §R$end_aura$§! envolve a galáxia. Nosso povo em [Root.GetHomeWorldName] entrou em um estado de euforia frenética em celebração da"
 shroud.8600.desc.outro: "Um renascimento glorioso se aproxima, prometido desde os tempos de nosso grande despertar.\n\nDiante de nós, toda a existência é consumida pelo vazio. Eliminação e aniquilação se tornaram as únicas leis restantes da galáxia. Um a um, mundos inteiros se desintegram, voltando para o nada de onde vieram.\n\nSomos os últimos. É... lindo. Já podemos vê-lo nos espasmos de sua nova forma frágil. O Fim passou. Agora se inicia o Começo."
 shroud.8600.desc.homicidal: "$shroud.8600.desc.intro$ obliteração de todos que não são parte de nós. $shroud.8500.desc.outro$"
 shroud.8600.desc.default: "$shroud.8600.desc.intro$ nossa piedosa salvação. $shroud.8600.desc.outro$"
 shroud.8600.a: "A finalidade é... impossível."
 shroud.8610.title: "O Preço da Fraqueza"
 shroud.8610.desc.intro: "Nós falhamos. Como consequência de nossa fraqueza, $end_of_the_cycle_color_article$ não alcançou sua gloriosa realização. O preço que precisamos pagar por essa incompetência cai sobre nós.\n\nEle levou tudo. Em um instante, a totalidade de [Root.GetName]... desapareceu. Onde antes havia colônias prósperas, agora há somente ruína. Onde antes havia frotas poderosas cruzando o vazio, agora existem apenas o silêncio e destroços. Tudo foi devorado pelo Fim. Tudo foi tomado pelo §HVéu§!."
 shroud.8610.desc.outro: "Agora, nosso patrono manifestou uma entidade do Véu gigantesca acima de [former_capital.GetName]. Ganhando um poder imenso ao devorar a consciência de nossos psiônicos, ela agora percorre a galáxia para concluir a tarefa que não conseguimos cumprir."
 shroud.8610.desc.a: "$shroud.8610.desc.intro$\n\n$shroud.8610.desc.outro$"
 shroud.8610.desc.b: "$shroud.8610.desc.intro$\n\nA maior parte dos [Root.GetSpeciesNamePlural] aceita esse destino, mas um grupo pequeno de infiéis se recusa a ceder à vontade suprema de nosso patrono. Eles são os exilados comandados por §H[Root.GetRulerName]§!, um indivíduo psíquico poderoso que sabia o que estava por vir. Agora, eles se escondem em mundo longe da influência do Fim.\n\n$shroud.8610.desc.outro$ Quando tiver terminado, ela irá atrás dos exilados."
 shroud.8610.a: "Talvez este fosse o nosso destino desde o início..."
 shroud.8610.b: "Poderiam os exilados resistir à sua força?"
 shroud.8710.title: "Sobrevivendo ao Apocalipse"
 shroud.8710.desc: "Está feito. O §RJuízo Final§! foi destruído.\n\n$end_of_the_cycle_color_article_cap$ recuou para as profundezas do §HVéu§!. Sua ameaça à realidade física foi impedida por enquanto.\n\nConforme o corpo velado de seu avatar se esvaía para fora da existência, um resquício físico de sua manifestação foi recuperado. Mesmo após a morte, nossos telepatas podem senti-lo emanando níveis impressionantes de poder psiônico, vastamente mais poderoso do que o fragmento recuperado em §H[shrouded_planet.GetName]§!.\n\nEsse núcleo de inevitabilidade concentrada pode ser usado para reconstruir das cinzas da galáxia aqueles que sobreviveram a esse Juízo Final.\n\nO Fim veio e se foi, mas nós permanecemos."
 shroud.8710.a: "Era este o nosso destino desde o início?"
 r_core_of_the_reckoning: "Núcleo do Juízo Final"
 r_core_of_the_reckoning_desc: "Recuperado dos restos do Juízo Final, este núcleo ainda irradia altos níveis de energia psiônica."
 core_of_reckoning_active_effect_tt: "Libera uma £decision£ §YDecisão Planetária§!: ['concept_banish_decision']"
 decision_banish: "Banir"
 decision_banish_desc: "Ao permitir que o Véu consuma este lugar, o equilíbrio será restaurado para o Núcleo do Juízo Final."
 decision_banish_effects_tt: "Bane este planeta para o Véu."
 concept_banish_decision: "$decision_banish$"
 concept_banish_decision_desc: "$decision_banish_desc$\n$decision_banish_effects_tt$\nModificador §Y$shroud_surge$§! adicionado por §Y10§! anos:\n$shroud_surge_effects$"
 shroud_surge: "Surto do Véu"
 shroud_surge_desc: "O equilíbrio foi temporariamente restaurado para o $r_core_of_the_reckoning$."
 shroud_surge_effects: "Dobra os efeitos passivos do §Y$r_core_of_the_reckoning$§!."
 #======================
 # Shroud Leaders
 #======================
 ganthuata: "Ganthuata"
 ganthuata_desc: "Um discípulo devoto d$the_cradle_of_souls_article$, ansioso para buscar e compartilhar suas verdades profundas com aqueles que detêm os meios para recebê-las."
 ganthuata_catch_phrase: "O abraço do Berço nos envolve por completo."
 leader_trait_disciple_of_the_cradle: "Disciplina do Berço"
 leader_trait_disciple_of_the_cradle_desc: "Quanto mais enxergamos, mais sabemos; $the_cradle_of_souls_article$ fica mais seguro conforme observamos nossos vizinhos."
 leader_trait_disciple_of_the_cradle_envoys_zro: "$t$- Emissários designados para entidades patronais geram §G+0.5§! de £zro£ §Y$sr_zro$§! a cada mês"
 shroud.12010.desc: "§HNossa comunhão com o Véu atraiu uma nova voz até nós. Seu tom cordial e reconfortante ecoa em ambos os reinos mental e material.§!\n\nSaudações. Eu sou Ganthuata e vim em busca de indivíduos com mentes compatíveis que despertaram para o seu verdadeiro caminho. Vocês ouviram a mensagem d$the_cradle_of_souls_article$?"
 shroud.12010.name: "$ganthuata$"
 shroud.12010.a: "Sim, ouvimos $the_cradle_of_souls_article$. Por que pergunta?"
 shroud.12010.a.response: "Por quê? O que compeliria qualquer viajante a questionar aqueles que conhece ao longo do caminho? Para melhor entender quem dá as respostas, amigos. Quando vocês falam, eu aprendo."
 shroud.12010.b: "O que você quer de nós?"
 shroud.12010.b.response: "O que aqueles cuidados pelo Berço anseiam? Eu busco amizade, para início de conversa. Procurei uma era de mentes sintonizadas com o esplendor do Berço, e agora, uma civilização se agita dentro de sua luz."
 shroud.12010.c: "Como pode nos ajudar?"
 shroud.12010.c.response: "Ajudarei a carregar sua mensagem através das estrelas. Juntos, acolheremos a galáxia no abraço gentil do Berço."
 shroud.12010.hire_custom_tooltip: "§Y$ganthuata$§! une-se ao nosso império como §HLíder§!."
 koborokra: "Koborok'Ra"
 koborokra_desc: "Ex-soldado que foi vítima de tortura psiônica extrema nas mãos de seus inimigos há muito tempo. Hoje, tornou-se um almirante atormentado com uma determinação e apetite insaciável por destruição."
 koborokra_catch_phrase: "Ainda há sangue a ser derramado."
 leader_trait_disciple_of_the_eater: "Mensageiro de Sangue"
 leader_trait_disciple_of_the_eater_desc: "Este líder fez um voto de sangue com $the_eater_of_worlds_article$."
 leader_trait_disciple_of_the_eater_attunement_effect: "§G+$@disciple_of_the_eater_combat_attunement$§! de Sintonia com $the_eater_of_worlds_article$ a cada combate com frota vitorioso"
 leader_trait_disciple_of_the_eater_zro_fleet_attack_effect: "$t$- §G+$@disciple_of_the_eater_zro_fleet_attack|1$§! de $i_zro$ a cada 1% de devastação causada por bombardeio orbital"
 leader_trait_disciple_of_the_eater_zro_army_attack_effect: "$t$- §G+$@disciple_of_the_eater_zro_army_attack|0$§! de $i_zro$ a cada 1% de devastação causada por exércitos de ataque"
 shroud.12020.name: "$koborokra$"
 shroud.12020.desc: "§HUma armadura desgastada por batalhas e uma capa coberta de sangue escondem uma figura mascarada. Um grunhido rouco corta a quietude.§!\n\nEsta galáxia merece sofrer. Posso perceber que vocês sentem o mesmo.\n\n§HConforme fala, [shroud_leader.GetHeShe] acaricia a empunhadura de uma espada ornamentada.§!\n\nRecebi um chamado para vir até vocês, mas no fim, eu sirvo à minha mestra, $the_eater_of_worlds_color_article$."
 shroud.12020.desc.covenant: "$shroud.12020.desc$ Assim como vocês."
 shroud.12020.desc.no_covenant: "$shroud.12020.desc$ E talvez vocês também venham a servir."
 shroud.12020.a: "Por que quer se juntar a nós?"
 shroud.12020.a.response: "Juntos, podemos sufocar as estrelas em cada canto da galáxia. Há um limite para a quantidade de sofrimento que é possível infligir sozinho."
 shroud.12020.b: "Podemos confiar em você?"
 shroud.12020.b.response: "$the_eater_of_worlds_article_cap$ comanda cada suspiro meu. Jurei servi-la, e vi este momento nos meus sonhos. É pela vontade dela que eu sirvo a vocês. Sua rejeição selaria meu destino."
 shroud.12020.c: "Por que serve à vontade d$the_eater_of_worlds_article$?"
 shroud.12020.c.response: "Fui traído, destruído e deixado em agonia. $the_eater_of_worlds_article_cap$ falou comigo. Ela me abençoou com o que era necessário para sobreviver naquele momento... um pano ensanguentado sobre feridas ensanguentadas. Ela me deu o poder para cortar as mãos que me causaram sofrimento. Agora, tenho uma dívida a pagar."
 shroud.12020.d: "O que pode nos oferecer?"
 shroud.12020.d.response: "Juntos, banharemos inúmeros sistemas na luz purificadora das chamas, e nos saciaremos em uma sinfonia de gritos. Assistiremos mundos arderem. Juntos, mostraremos à galáxia coisas que ela nunca esquecerá. Este é o nosso destino."
 shroud.12020.hire_custom_tooltip: "§Y$koborokra$§! une-se ao nosso império como §HLíder§!."
 morr: "Morr"
 morr_desc: "Uma vez uma prospectora qualquer, sua exposição prolongada a veios de $zro_lower$ instáveis forjou um laço potente e enlouquecedor com $the_instrument_of_desire_article$. Agora, ela usa essa conexão para obter uma riqueza obscena, minerando mundos à exaustão e vendendo seus espólios a preços exorbitantes."
 morr_catch_phrase: "Se brilha, é nosso."
 leader_trait_disciple_of_the_instrument: "Coração da Avareza"
 leader_trait_disciple_of_the_instrument_desc: "Profundamente sintonizado a$the_instrument_of_desire_article$, este líder pode prever a presença de recursos até mesmo nos cantos mais inóspitos da galáxia."
 leader_trait_disciple_of_the_instrument_planetary_decision_effect: "- Concede acesso à decisão planetária §Y$decision_divine_deposits$§!"
 decision_divine_deposits: "Descobrir Depósitos"
 decision_divine_deposits_desc: "Guiado pela atração enigmática d$the_instrument_of_desire_article$, o governador deste planeta revela depósitos de recursos há muito esquecidos."
 decision_divine_deposits_tt: "Adiciona um Recurso Planetário aleatório."
 shroud.12030.name: "$morr$"
 shroud.12030.desc: "§HO olhar de $morr$ nunca para, esquadrinhando as sombras em busca de algo que reluz, como se caçasse eternamente.§!\n\nVocês também sentem, não é? $the_instrument_of_desire_article_cap$ nunca para. Anseia. Devora. Comanda.\n\nO que eu vejo, eu pego. Nenhuma riqueza natural resistiu à minha vontade. Ofereço meus serviços, não por lealdade, mas porque juntos podemos saquear as estrelas e dar ao vazio o que lhe é devido."
 shroud.12030.a: "Por que quer se juntar a nós?"
 shroud.12030.a.response: "$the_instrument_of_desire_article_cap$ é insaciável. Requer o trabalho de uma quantidade enorme de [root.species.GetHandNamePlural] para se satisfazer."
 shroud.12030.b: "O que pode nos oferecer?"
 shroud.12030.b.response: "Eu posso ajudar a extrair cada molécula rentável que existe na natureza. Até o último átomo será reivindicado, rotulado e vendido.\n\nAqueles que sussurram \"basta\" são covardes. Patéticos. Eles que apodreçam. Juntos, tomaremos tudo."
 shroud.12030.c: "Por que serve à vontade d$the_instrument_of_desire_article$?"
 shroud.12030.c.response: "Fui uma prospectora uma vez, buscando cada foco de mineração que as estrelas podiam proporcionar. Ar empoeirado, scanners quebrados, minas vazias... até que $the_instrument_of_desire_article$ falou comigo.\n\nEle me prometeu riquezas além da compreensão. Tudo que queria em troca era lealdade.\n\nAgora eu o sirvo. Extraio. Entrego. A dívida é eterna.... mas as riquezas? Ah, as riquezas nunca acabam."
 shroud.12030.hire_custom_tooltip: "§Y$morr$§! une-se ao nosso império como §HLíder§!."
 kronen: "Kronen, o Aflito"
 kronen_desc: "Antes uma mente visionária, agora uma casca fragmentada; este cientista recluso foi deturpado pelas maquinações d$the_composer_of_strands_article$. Apenas seu intelecto assombroso permanece, cintilando como uma estrela moribunda na escuridão."
 kronen_catch_phrase: "Tantas coisas para desvendar..."
 leader_trait_disciple_of_the_composer: "Fio Aflito"
 leader_trait_disciple_of_the_composer_desc: "Quanto mais molda a carne, mais sua própria carne se desfaz. $the_composer_of_strands_article_cap$ refaz todos que ousam aprender sua arte proibida."
 shroud.12040.name: "$kronen$"
 shroud.12040.desc: "§HAssim que nossos sensores detectam uma nave cruzando nossas fronteiras, uma voz tensa ecoa pelo Véu; cansada, estridente, mas ainda assim familiar de uma forma perturbadora, como o cântico d$the_composer_of_strands_article$.§!\n\nMais... [GetKronenFlesh]? Intrigante. Tão suave. Tão... mutável. Será? difícil dizer. Tantos nós se movendo por baixo da [GetKronenSkin]. Que forma $the_composer_of_strands_article$ teria tecido para mim hoje?\n\n§HAs comunicações finalmente se estabilizam, revelando uma figura de músculos aparentes e irrequietos, debatendo-se e rabiscando freneticamente.§!\n\nVocês me veem como sou. Talvez eu ainda seja $kronen$. Talvez não. Mas eu sinto vocês, como eu, uma tela em branco para o pincel da Compositora. Venham. Vamos começar o desvelamento."
 shroud.12040.a: "Começar? Começar o quê?"
 shroud.12040.a.response: "Ora, a descamação, é claro. O descarte destas cascas grosseiras e imperfeitas. O desenrolar dos fios que nos compelem a moldar, à certeza. O toque da Compositora recai sobre vocês também. Vocês já começaram... Não sentem a contração em seus corpos?"
 shroud.12040.b: "Por que deseja se juntar a nós?"
 shroud.12040.b.response: "Não sentem? A marca, pressionada contra cada fio tremulante. Eu devo desatar, abandonar o que eu era, testemunhar meu desfazer enquanto rasgo as costuras que me prendem à carne. Mas vocês... vocês são um império. Vasto. Capaz. Juntos, poderemos puxar fios mais impressionantes do que jamais faríamos sozinhos."
 shroud.12040.c: "Como pode nos ajudar?"
 shroud.12040.c.response: "Eu ofereço mais do que ajuda. Minha carne é uma dádiva, um experimento de dor e propósito, esculpido pel$the_composer_of_strands_article$. Cada fibra minha grita, mas eu suporto. Eu estudo. Eu aprendo. E tudo que meu sofrimento gera... é seu para moldar. Contanto que moldemos juntos."
 shroud.12040.hire_custom_tooltip: "§Y$kronen$§! une-se ao nosso império como §HLíder§!."
 shroud.12045.desc: "§HConforme nossa população aumenta, $kronen$, fica em um estado cada vez maior de frenesi. Sua voz estremece pelo desgaste, sua forma convulsiona, ondulando, sua carne, instável, quando ele emite um som rouco de frustração.§!\n\nOs fios, infinitos... eles se contorcem, eu puxo, eu rasgo, mas as tramas resistem! Por quanto tempo devo suportar esta forma maldita? Quanto mais preciso descartar para o padrão se revelar?"
 shroud.12045.a: "Qual é o problema?"
 shroud.12045.a.response: "Problema? Singular? Ah, que pitoresco. A cada fragmento que eu descarto, a cada fio brilhante que nós cortamos, as costuras apenas se apertam! E enquanto isso, $the_composer_of_strands_article$ cantarola sua melodia visceral e doentia..."
 shroud.12045.a.response_2: "$shroud.12045.a.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.b: "Você precisa de uma folga?"
 shroud.12045.b.response: "Uma folga? Não, nunca. Não podemos estagnar, não podemos deixar essa carne miserável apodrecer na mediocridade. Eu não preciso descansar... preciso de cobaias. Preciso de material para moldar, esculpir, me tornar."
 shroud.12045.b.response_2: "$shroud.12045.b.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.c: "Podemos fazer algo para ajudar?"
 shroud.12045.c.response: "Vocês podem me lembrar... do que eu era? Digam-me, quando nós nos falamos pela primeira vez, meus membros eram dessa cor? Minha córnea estava nublada assim? Cada vez que eu tento lembrar, minha carne se move ainda mais pelo caminho.\n\nNão... Memórias não valem nada aqui. A revelação jaz na mudança em si. O que veio antes não significa nada para $the_composer_of_strands_article$ agora. Deixem-me. Eu preciso... pensar."
 shroud.12045.c.response_2: "$shroud.12045.c.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.desc_2: "§HKronen convulsiona violentamente. Seu único olho rola para trás, a carne pulsando, borbulhando debaixo da superfície, então, de repente... imobilidade. A restruturação grotesca para de modo tão repentino quanto começou.§!\n\nAh... Olá. Precisam de alguma coisa?"
 shroud.12045.d: "Você está bem?"
 shroud.12045.d.response: "Claro. Por que eu não estaria? Os fios abriram minha mente ainda mais, reformularam esta carne ineficiente para melhor servir aos planos d$the_composer_of_strands_article$. Agora, se me derem licença... ainda há muitos fios para puxar. Tantas cascas para deixar para trás.\n\n§HConforme a transmissão se encerra, uma ressonância ecoa pelo Véu. Qualquer que seja a aflição que afeta Kronen agora... não é um acidente. É a vontade d$the_composer_of_strands_article$.§!"
 shroud.12045.end: "Uma dádiva da Compositora não deve ser menosprezada."
 zulyn: "Zulyn, o Ouvinte"
 zulyn_desc: "Um estudioso que abandonou as limitações dos estudos científicos convencionais para buscar os segredos revelados pelos ecos frenéticos d$whisperers_in_the_void_article$."
 zulyn_catch_phrase: "Precisamos apenas ouvir..."
 shroud.12050.name: "$zulyn$"
 shroud.12050.desc: "G§HA matriz de comunicações crepita conforme uma voz murmura com urgência assustadora.§!\n\nSaudações, queridos ouvintes. Eu ouvi sua voz – não, suas *vozes* – em meio à cacofonia. Vocês o ouvem agora também, não ouvem? O grande coro d$whisperers_in_the_void_color_article$, suas dádivas silenciosas, sua histeria murmurada?\n\nTais segredos são perigosos para aqueles que não podem compreendê-los. Mas eu posso ajudar vocês a desvendá-los. Ofereço minha ajuda enquanto vocês enfrentam a inundação esmagadora de paradoxos que rasga seus pensamentos. Sem ofensas. Houve um tempo em que até eu tive dificuldade de entender seu verdadeiro significado."
 shroud.12050.a: "O que o faz pensar que pode ajudar?"
 shroud.12050.a.response: "Vocês atravessaram o manto do §HVéu§!, não foi? Mas digam-me, vocês o dominaram? Eu passei uma vida inteira mapeando suas profundezas, registrando o inconcebível deslocamento de suas entidades e seus ecos sobre nosso reino frágil.\n\nOs Sussurradores me guiam há muito tempo. Todos os enunciados enlouquecedores que agora se amontoam em seus pensamentos? Eu posso ajudar a compreendê-los."
 shroud.12050.b: "O que você sabe sobre os Sussurradores?"
 shroud.12050.b.response: "Eu cataloguei seus sussurros durante anos, esperando por este momento. Agora vocês estão alinhados ao seu coro multifacetado, e eu não desperdiçarei a chance de observar as verdades enterradas."
 shroud.12050.c: "O que está nos oferecendo?"
 shroud.12050.c.response: "Uma vida inteira de estudos aperfeiçoou meu foco, desvendando as estruturas de nossa realidade física e as profundezas ilimitadas do §HVéu§!.\n\nJuntos, nos libertaremos das limitações deste plano. Os segredos do universo serão nossos. Isso, eu prometo, com absoluta certeza."
 shroud.12050.hire_custom_tooltip: "§Y$zulyn$§! une-se ao nosso império como §HLíder§!."
 leader_trait_disciple_of_the_whisperers: "Sussurros Velados"
 leader_trait_disciple_of_the_whisperers_desc: "Este líder ouve $whisperers_in_the_void_article$ ecoando pelo Véu, oferecendo um conhecimento científico raro sobre os mecanismos ocultos deste universo."
 leader_trait_disciple_of_the_whisperers_effects: "$t$- $@disciple_of_the_whisperers_tech_zro|0=+$ de $i_zro$ ao pesquisar uma tecnologia §YRara§! ou §YPsiônica§!"
 ouwron: "Ouw'ron"
 ouwron_desc: "Exilado de seu clã nômade depois de testemunhar $end_of_the_cycle_article$, Ouw'ron vagou pelas estrelas em busca de seu favor. Agora, com $NAME_Reckoning$ no horizonte, ele arde com propósito e não aceitará rejeição."
 ouwron_catch_phrase: "Haverá um Juízo Final..."
 shroud.12060.name: "$ouwron$"
 shroud.12060.desc_1: "§HUma enxurrada incompreensível de sinais inunda nossa matriz de comunicações. Em meio ao caos, uma única voz começa a se destacar.§!\n\nAo menos vocês vieram. Não foram pontuais, mas também não muito atrasados. Não temam, eu vejo além das amarras desta prisão física que chamamos de realidade. A oferta foi feita. Meu caminho é claro."
 shroud.12060.desc_blind: "\n§HFoi então que percebemos: assim como nós, este ser abriu mão de sua visão para servir à causa.§!"
 shroud.12060.desc_default: "\n§HFoi então que percebemos que seus globos oculares estavam vazios, há muito abandonados.§!"
 shroud.12060.desc_2: "\nVamos lá, não sejam tímidos. Eu sei que vocês viram a simplicidade sublime d$end_of_the_cycle_color_article$. Unam-se a mim em comunhão, e juntos imporemos sua manifestação."
 shroud.12060.a: "Há quanto tempo sabe sobre $end_of_the_cycle_article$?"
 shroud.12060.a.response: "Há mais tempo do que estive consciente. Assim como com todas as mentes, o conhecimento jaz adormecido até que o §HVéu§! erga o manto. Lá, seu intento puro se torna claro. Nosso propósito é simples: trazer o fim."
 shroud.12060.b: "Por que deseja nos ajudar?"
 shroud.12060.b.response: "Vocês perguntam o que já sabem. Nós vimos sua inevitabilidade. A revelação começou. Não há outro caminho senão atravessá-lo. Juntos, seguimos em direção à conclusão."
 shroud.12060.c: "O que você nos oferece?"
 shroud.12060.c.response: "Eu sou apenas poeira neste ciclo moribundo, assim como todos nós. O que eu posso realmente oferecer? Mentes se esvaem desta galáxia, e eu tenho a função de guiá-las prontamente... e estendo essa misericórdia a vocês."
 shroud.12060.hire_custom_tooltip: "§Y$ouwron$§! une-se ao nosso império como §HLíder§!."
 leader_trait_disciple_of_the_end: "Apóstolo do Fim"
 leader_trait_disciple_of_the_end_desc: "Como um apóstolo devoto d$end_of_the_cycle_article$, sua fé inabalável na chegado do $NAME_Reckoning$ ecoa por todas as batalhas que trava."
 leader_trait_disciple_of_the_end_effects: "$t$- $@disciple_of_the_end_aura_intensity|0=+$ de Intensidade da Aura para cada nave destruída no sistema$TABBED_NEW_LINE$- $@disciple_of_the_end_jumpdrive_range|0=+%$ de $MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$ enquanto está dentro da §H$end_aura$§!"
 shroud.12155.name: "Pura Convicção"
 shroud.12155.desc: "§HToda ação tem consequências. Conforme nossa matriz de comunicações se inicia, $ouwron$ surge em uma torrente de fúria exaltada.§!\n\nHereges! Tolos! Enganadores! Deveríamos ter suspeitado. Deveríamos ter acabado com vocês quando suas essências malditas ousaram pisar no §HVéu§!.\n\nVocês adiaram o inevitável, a finalidade prevista! O que acham que essa afronta conquistará? Tudo que vocês ganharam agora foi perdido.\n\nHá apenas um fim. Então cantem... Cantem para o esquecimento!"
 shroud.12155.tt: "$ouwron$ está se virando contra nós!"
 NAME_Ouwron_Battleship: "$battleship$"
 NAME_Ouwron_Destroyer: "$destroyer$"
