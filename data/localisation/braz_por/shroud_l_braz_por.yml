 # Establishing the Chamber of Silence
 shroud.2820.name: "Estabelecendo a $building_chamber_of_silence$"
 shroud.2820.desc.1: "Conforme nosso domínio psiônico aumenta, somos bombardeados por uma mistura de sussurros além do manto. A §RVoz§!, mais alta e clara do que nunca, abre caminho por essas correntes de pensamentos até as sombras de nossas mentes.\n\n§R\"ABRAM O CAMINHO.\"§!"
 shroud.2820.desc.2.intro: "Devemos filtrar o ruído."
 shroud.2820.desc.2.chamber: "$shroud.2820.desc.2.intro$ Construímos $shroud.2820.desc.2.outro$"
 shroud.2820.desc.2.no_chamber: "$shroud.2820.desc.2.intro$ Planos foram traçados para $shroud.2820.desc.2.outro$"
 shroud.2820.desc.2.outro: "uma instalação isolada onde nossos indivíduos com maior aptidão psiônica serão capazes de ouvir as instruções da §RVoz§! com claridade plena."
 shroud.2820.a.chamber: "Nossas mentes se abrem ainda mais."
 shroud.2820.a.no_chamber: "Vamos construir essa \"$building_chamber_of_silence$\"."
 CONTINUE_SITUATION: "Continua a §YSituação§!:"
