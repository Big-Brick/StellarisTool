 civic_tankbound_effects_base: "Adiciona a característica ['trait:trait_tankbound'].\nEmpregos de Trabalhador dos Distritos Rurais agora são totalmente §YAutomatizados§!.\nEmpregos de ['concept_colonist', $job_colonist$] são $SPECIALISTS$.\nComeça com conhecimento sobre a tecnologia ['technology:tech_assembly_pattern', £engineering£$tech_assembly_pattern$].\n£district£ Distritos §YUrbanos§! têm empregos de §Y$job_production_overseer_with_icon$§! adicionais."
