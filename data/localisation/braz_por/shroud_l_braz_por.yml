 # Eater of Worlds accords
 ACCORD_FRENZY: "Frenesi"
 ACCORD_FRENZY_desc: "$the_eater_of_worlds_article_cap$ inflama uma fúria frenética em nossas forças."
 ACCORD_HUNGER: "Fome"
 ACCORD_HUNGER_desc: "$the_eater_of_worlds_article_cap$ anseia por conflito."
 ACCORD_DOOM: "Perdição"
 ACCORD_DOOM_desc: "Lançaremos a vontade destrutiva d$the_eater_of_worlds_article$ sobre nosso inimigo mais odiado."
 ACCORD_DOOM_TT: "Entra automaticamente em ['concept_total_war'] contra o império vizinho, com o qual mantemos as piores relações.\nDetermina que todos os Pops desse império sejam expurgados como §H$purge_sacrifice$§!, com os seguintes efeitos: §R-1.000%§! de £happiness£ §Y$HAPPINESS$§!, §G+5§! de $i_unity$, §G+2§! de $i_zro$."
 ACCORD_DIGEST: "Digestão"
 ACCORD_DIGEST_desc: "O apetite interminável d$the_eater_of_worlds_article$ deve ser saciado."
 ACCORD_DIGEST_TT: "§Y$DEVASTATION$§! nos planetas do adversário de guerra dentro de nossa §H$PSIONIC_AURA$§!: §G+$@accord_digest_devastation|0$§!\n§Y$HULL$§! e §Y$ARMOR$§! das naves do adversário de guerra dentro de nossa §H$PSIONIC_AURA$§!: §G$@accord_digest_ship_malus|0%$§!\n$ACCORD_LOOSE_INTENSITY$"
 # Cradle of Souls accords
 ACCORD_CHARITY: "Confiança"
 ACCORD_CHARITY_desc: "A caridade contagiante d$the_cradle_of_souls_article$ faz com que outros confiem em nós."
 ACCORD_TRUST: "Visão"
 ACCORD_TRUST_desc: "$the_cradle_of_souls_article_cap$ fala com muitas bocas, e agora compartilhamos sua voz."
 ACCORD_THOUGHTBOND: "Vínculo Mental"
 ACCORD_THOUGHTBOND_desc: "$the_cradle_of_souls_article_cap$ concede uma harmonia de pensamento jamais vista."
 ACCORD_THOUGHTBOND_TT: "$mod_pop_factions_produces_mult$: §G+$@accord_thoughtbond_faction_output|0%$§! por §H$@accord_duration|0$§! anos"
 ACCORD_THOUGHTBOND_TT_gestalt: "$mod_planet_jobs_unity_produces_mult$: §G+$@accord_thoughtbond_unity_from_jobs|0%$§! por §H$@accord_duration|0$§! anos"
 ACCORD_FAVOR: "Favor"
 ACCORD_FAVOR_desc: "$the_cradle_of_souls_article_cap$ avalia a diplomacia pelo forte peso do mérito."
 ACCORD_FAVOR_TT: "Consome todos os Favores de outros impérios dentro de nossa §H$PSIONIC_AURA$§! e ganha Unidade e Influência para cada Favor.\n$ACCORD_LOOSE_INTENSITY$"
 # Composer of Strands accords
 ACCORD_LIFE: "Crescimento"
 ACCORD_LIFE_desc: "$the_composer_of_strands_article_cap$ dá frutos, e nós ainda semeamos."
 ACCORD_FERTILITY: "Vigor"
 ACCORD_FERTILITY_desc: "$the_composer_of_strands_article_cap$ nos abençoa com influência fértil."
 ACCORD_TRANSFORMATION: "Transformação"
 ACCORD_TRANSFORMATION_desc: "$the_composer_of_strands_article_cap$ esculpe mundos à sua vontade."
 ACCORD_TRANSFORMATION_TT: "Um mundo inabitável aleatório dentro de nossas fronteiras é transformado em um §H$pc_gaia$§! com tamanho §G$@accord_transformation_gaia_world_size|0$§!"
