 # End of the Cycle
 situation_end_of_the_cycle: "$name_eotc$"
 situation_end_of_the_cycle_desc: "Firmamos um Pacto com $end_of_the_cycle_color_article$, o que nos concedeu um poder avassalador. Segundo nossa equipe de [Owner.GetTelepathPlural], o custo desse acordo pode ser postergado por meio de um transe psiônico coletivo, mas apenas por algum tempo.\n\nA vontade de nosso patrono se manifesta em uma intensa $PSIONIC_AURA$. Para concretizarmos o Fim, precisamos garantir a expansão desta Aura. Conforme nossos números crescem e a força de nossas mentes aumenta, também aumentam o alcance e o poder de nossa Aura.\n\nSistemas restantes a serem conquistados: §Y[Owner.GetEndCycleGalaxySystemsLeft]§!"
 situation_end_of_the_cycle_effects_1: "Ao fim desta fase, receberemos o poder da §H$ACCORD_CREATION$§!.\n$eotc_opinion_modifier_tooltip$"
 situation_end_of_the_cycle_effects_2: "Ao fim desta fase, receberemos o poder da §H$ACCORD_DISTORTION$§!.\n$eotc_opinion_modifier_tooltip$\n$eotc_opinion_modifier_2_tooltip$"
 situation_end_of_the_cycle_effects_3: "Ao fim desta fase, receberemos o poder da §H$ACCORD_INTENSIFICATION$§!.\n$eotc_opinion_modifier_tooltip$\n$eotc_opinion_modifier_3_tooltip$"
 situation_end_of_the_cycle_effects_4: "Ao fim desta fase, o custo de nosso poder será revelado."
