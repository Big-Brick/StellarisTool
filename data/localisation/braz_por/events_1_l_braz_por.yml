 ####################################
 #Anomaly Events
 ####################################
 anomaly.1.name: "Asteroide Coprólito"
 anomaly.1.desc: "Apesar de ser difícil de aceitar, todas as indicações apontam para o asteoide [From.GetName] ser um coprólito - um pedaço de fezes fossilizadas de algum tipo de forma de vida gigantesca. Parece ter quase um bilhão de anos, e muito da composição orgânica do fóssil foi substituída por veios minerais. Nossos cientistas estão impressionados com o tipo de criatura que pode ter produzido algo assim."
 anomaly.5.name: "Tesouro Pirata"
 anomaly.5.desc: "Este asteroide parece ter sido usado intermitentemente como base por um grupo de piratas alienígenas há cerca de mil anos. Ao entrar na base, conseguimos recuperar seu tesouro abandonado. Em sua maioria, eram bugigangas e artefatos roubados, mas alguns deles ainda parecem ter valor."
 anomaly.5.a: "Esses ganhos ilícitos serão úteis."
 anomaly.10.name: "Fauna de Asteroides"
 anomaly.10.desc: "Incrivelmente, ao conduzir a inspeção de [From.GetName], a tripulação do [Root.GetName] pegou diversos sinais de vida vindos de dentro do asteroide. Parece que existe uma colônia de grandes litovoros cavadores dentro da pedra, que foi preenchida com túneis. Estas formas de vida únicas se adaptaram de alguma forma à vida na frieza do espaço."
 anomaly.10.a: "Estas criaturas devem ser estudadas."
 anomaly.10.b: "Elas são como nós!"
 anomaly.15.name: "Asteroide de Fósseis"
 anomaly.15.desc: "Fósseis do que parecem ser diversas espécies de animais aquáticos foram encontrados na superfície árida e sem ar de [From.GetName]. Há indicações de que o cinturão de asteroides ao redor deste planeta foi criado com os restos de um planeta despedaçado, e estes achados parecem confirmar esta teoria. A julgar pelos fósseis, o planeta tinha vida e era parcialmente coberto de água."
 anomaly.15.b.evopred: "Uma pena eles não terem evoluído mais."
 anomaly.25.name: "Estaleiro Abandonado"
 anomaly.25.desc: "Uma grande parte do asteroide [From.GetName] foi esvaziado para permitir a construção de algum tipo de estaleiro. Ele foi abandonado e exposto ao vácuo do espaço durante séculos - se algo de útil restou, já foi saqueado por exploradores anteriores. Porém, o projeto do estaleiro em si é único, e muito pode ser aprendido com o seu estudo."
 anomaly.25.a: "Devemos estudar a sua construção."
 anomaly.30.name: "Ferro Velho"
 anomaly.30.desc: "Este asteroide foi usado como um ferro velho por alguém em algum momento no passado distante. Todo tipo de maquinaria descartada e lixo metálico foi depositado dentro do fraco poço gravitacional do asteroide, sendo lentamente puxado para a montanha de destroços que agora cobre a superfície. Não existe coisa alguma de valor particular para ser encontrada aqui, mas boa parte do metal poderia ser recuperada por uma estação de mineração."
 anomaly.30.a: "Devemos reciclar o que pudermos."
 anomaly.35.name: "Nave de Exploração Acidentada"
 anomaly.35.desc: "Uma pequena nave de reconhecimento colidiu com a superfície deste asteroide há milênios, criando um cânion raso. Não há cabine visível na nave, o que nos leva a acreditar que era pilotada remotamente ou por algum tipo de inteligência artificial primitiva. Embora esteja danificada demais para ser recuperada, a nave ainda não foi saqueada."
 anomaly.35.a: "Estudaremos o seu projeto."
 anomaly.40.name: "Base Mineradora Automatizada"
 anomaly.40.desc: "Detectamos uma base mineradora automatizada em órbita próxima ao redor do asteroide [From.GetName]. Há marcas de queimadura no casco, o que indica um dano por armas leves, e a instalação parece estar presa em algum tipo de loop de feedback. Conseguimos reprogramar os sistemas base e a instalação agora está totalmente sob nosso controle."
 anomaly.40.desc.alt: "Detectamos uma base de mineração automatizada construída em órbita próxima ao redor do asteroide [From.GetName]. Faltam grandes pedaços do casco e os buracos indicam dano por armas pesadas. A estação está muito além de poder ser consertada, mas sucateá-la nos fornecerá materiais valiosos."
 anomaly.50.name: "Campo de Tiro"
 anomaly.50.desc: "O asteroide [From.GetName] está marcado com crateras de tiros de armas, e parece ter sido usado como um campo de tiro por alguém há aproximadamente dois mil anos. Leituras de energia residual sugerem que testaram armamentos exóticos, incluindo bombas subespaciais e algum tipo de gerador de singularidade. Nossos cientistas estariam interessados em estudar os ecos de energia incomum que ainda restam."
 anomaly.55.name: "Colisão de Asteroides"
 anomaly.55.desc: "Após uma verificação mais de perto, descobrimos que um asteroide menor, composto quase que inteiramente de metais preciosos colidiu recentemente com [From.GetName]. Esse aglomerado de metais pequeno, mas denso, estava escondido logo abaixo da superfície do asteroide, mas agora que isso foi descoberto, deverá ser acessível à mineração."
 anomaly.55.a: "Uma descoberta de sorte!"
 anomaly.60.name: "Radiação Exótica"
 anomaly.60.desc: "Este asteroide em particular é uma captura extra-solar, e parece ter sido lavado por algum tipo de radiação exótica, conforme ele despencou através do espaço interestelar antes de finalmente se alojar no sistema [From.GetStarName]. A fonte original desta radiação permanece desconhecida, mas o [Root.GetName] foi capaz de pegar uma riqueza de dados de física ao estudar as emissões de energia do asteroide."
 anomaly.65.name: "Cargueiro de Minério Acidentado"
 anomaly.65.desc: "Após identificar uma anomalia no poço gravitacional de [From.GetName], o [Root.GetName] descobriu os destroços de um antigo supercargueiro de minério enterrado no fundo da crosta do asteroide. Ele deveria estar totalmente carregado quando caiu, e a riqueza mineral do asteroide foi revisada de acordo."
 anomaly.300.name: "Ecossistema Atmosférico"
 anomaly.300.desc: "Descobrimos um ecossistema próspero na atmosfera superior do gigante gasoso [From.GetName]. Criaturas flutuantes gigantescas, que evoluíram corpos cheios de gases mais leves que o ar, seguindo a corrente de vento e se alimentando da energia liberada pelas frequentes tempestades de raio do gigante gasoso. Estes seres, por sua vez, suportam colônias de animais menores que comem plâncton atmosférico e uns aos outros."
 anomaly.305.name: "Cápsula de Carga Abandonada"
 anomaly.305.desc: "Uma cápsula de carga descartada foi deixada por alguém na atmosfera superior de [From.GetName] há muito tempo. Ela escapou de alguma forma da percepção de outros viajantes espaciais, e sua órbita decadente significa que ela seria perdida na atmosfera do gigante gasoso dentro de alguns anos. Quando a tripulação do [Root.GetName] abriu a cápsula, encontraram joias alienígenas feitas de metais preciosos."
 anomaly.305.a: "Derreta-as."
 anomaly.305.b: "Venda-as."
 anomaly.305.c: "Estude a composição delas."
 anomaly.305.d: "Vamos ficar com elas."
 anomaly.310.name: "Experimento Social"
 anomaly.310.desc: "Uma pequena colônia aeróstata foi encontrada flutuando logo acima da atmosfera de [From.GetName]. Parece que ela era autossuficiente, e os restos de diversas espécies diferentes foram encontradas a bordo.\n\nO melhor que podemos dizer é que a colônia foi algum tipo de experimento social conduzido há séculos que acabou com os colonizadores massacrando uns aos outros. Baixamos todos os dados encontrados nos bancos de dados limitados da colônia."
 anomaly.310.b.evopred: "Recupere a biomassa."
 anomaly.315.name: "Colônias Aeróstatas"
 anomaly.315.desc: "Uma rede arruinada de colônias aeróstatas que possui sua origem há pelo menos três mil anos pode ser encontrada na órbita baixa do gigante gasoso. Sua função original parece ter sido mineração de gás, mas desde então elas foram abandonadas e reocupadas por muitas raças diferentes e grupos de piratas.\n\nAs colônias foram cuidadosamente despidas de qualquer coisa remotamente valiosa, mas o simples fato de eles ainda estarem por cima após esse tempo todo os torna um sujeito de pesquisa de engenharia interessante."
 anomaly.320.name: "Campo de Destroços"
 anomaly.320.desc: "O forte poço gravitacional de [From.GetName] puxou uma grande quantidade de detritos espaciais, que formou uma densa camada ao redor de partes do gigante gasoso. Boa parte disso parece ser dos destroços de diversas batalhas disputadas no sistema há milhares de anos.\n\nSaqueadores já arrancaram as tecnologias e artefatos valiosos dos destroços, mas uma estação mineradora deve ser capaz de reciclar o metal."
 anomaly.325.name: "Cruzador Esmagado"
 anomaly.325.desc: "Os restos destruídos de uma nave estelar do tamanho de um cruzador podem ser detectados em uma órbita decadente dentro da atmosfera de [From.GetName]. Ele parece ter se aventurado no fundo da atmosfera do gigante gasoso, talvez em uma tentativa desesperada de escapar do perseguidor, mas sendo esmagado pela pressão atmosférica.\n\nA nave é grande demais para ser recuperada, mas um escaneamento estrutural dos destroços nos forneceram dados interessantes."
 anomaly.325.a: "Uma nave incrível."
 anomaly.330.name: "Tempestades Extremas"
 anomaly.330.desc: "[From.GetName] frequentemente sofre com tempestades massivas e extremamente violentas em sua atmosfera. Dezenas de tempestades persistentes são visíveis da órbita, com ventos que costumam ultrapassar 700 m/s. A causa dessas tempestades continua um mistério, pois não encontramos nada no modelo climático do planeta que as explique. Recomenda-se um estudo mais aprofundado dessa anomalia."
 anomaly.335.name: "Assinatura Energética"
 anomaly.335.desc: "O [Root.GetName] pegou uma assinatura energética estranha vindo de algum lugar dentro da atmosfera de [From.GetName]. Parece ter origem em uma estrutura de alguma forma, possivelmente os restos de uma estação orbital, mas a pressão atmosférica faz com que a aproximação seja impossível. Entretanto, leituras da assinatura única produziram uma grande quantidade de dados de física valiosos."
 anomaly.340.name: "Lua Preciosa"
 anomaly.340.desc: "Uma leitura mais detalhada de um dos muitos satélites naturais em órbita do gigante gasoso [From.GetName] revelou um depósito de metais preciosos e minerais que passou direto na inspeção inicial. Apesar de a lua ser bem pequena, ela possui uma órbita ao redor do seu planeta e parece ser tectonicamente estável."
 anomaly.340.a: "Um achado excelente."
 anomaly.600.name: "Colisão de Asteroides"
 anomaly.600.desc: "Um grande asteroide rico em minerais colidiu com [From.GetName] em algum momento durante os milhares de anos anteriores no que deve ter sido um grande evento de impacto. Uma abundância de minerais pode ser encontrada em [From.GetPlanetMoon] na vizinhança da cratera de impacto."
 anomaly.600.a: "Um evento fortuito."
 anomaly.605.name: "Impacto MRQL"
 anomaly.605.desc: "Uma cratera gigantesca em [From.GetName] parece ser o resultado de uma colisão com uma nave estelar. A partir do tamanho da cratera, suspeitamos que uns 10 mil anos atrás, uma nave saindo de uma hiperestrada em velocidade máxima abalroou o [From.GetPlanetMoon] por motivos desconhecidos.\n\nO [Root.GetName] pegou ecos subespaciais residuais próximos ao local do impacto que lembram um campo hiperparticulado desmoronado, mas como a própria nave se desintegrou no impacto, a teoria não pode ser comprovada."
 anomaly.610.name: "Microssingularidade"
 anomaly.610.desc: "Uma microssingularidade recentemente interceptou [From.GetName], passando direto pelo núcleo e surgindo no outro lado de [From.GetPlanetMoon]. O encontro não parece ter causado qualquer dano permanente, mas alterou a produção energética do núcleo planetário de uma forma que desafia nossos modelos científicos atuais. Um estudo mais cauteloso pode ser necessário."
 anomaly.615.name: "Inversão Magnética"
 anomaly.615.desc: "O campo magnético de [From.GetName] passou por uma inversão completa enquanto estava sendo observado por [Root.GetName]. Este evento raro trocou a posição dos pólos magnéticos do [From.GetPlanetMoon]. Felizmente, tudo foi gravado pelos sensores de nossa nave, fornecendo aos cientistas muitos dados valiosos."
 anomaly.625.name: "Piloto Mumificado"
 anomaly.625.desc: "Os restos mumificados de um único indivíduo, pertencente a uma espécie mamífera até então desconhecida, foram encontrados à deriva em alta órbita sobre [From.GetName]. O ser está vestido no que parece ser um traje de voo completo com capacete, e pode ser um piloto de caça que ejetou em uma batalha antiga e foi esquecido e deixado para trás. Nosso estudo do cadáver forneceu dados interessantes."
 anomaly.625.a: "Um destino trágico."
 anomaly.625.b.evopred: "O sangue dele correrá em nossas veias."
 anomaly.630.name: "Antiga Cápsula de Vida"
 anomaly.630.desc: "Uma cápsula de vida abandonada foi detectada na órbita próxima de §Y[From.GetName]§!. Ela está coberta de marcas de queimadura, provavelmente de quando a nave-mãe da cápsula explodiu, e análises preliminares sugerem que ela foi construída há mais de 5 mil anos.\n\nA tripulação do [Root.GetName] conseguiu abrir a cápsula e encontraram os restos de um alienígena reptiliano vestido em um uniforme resplandecente. Em uma de suas patas estava uma pequena foto de outro indivíduo da mesma raça - talvez um companheiro ou líder reverenciado."
 anomaly.630.b.evopred: "Monarca ou escravo, o gosto é o mesmo."
 anomaly.635.name: "Escrita Alienígena"
 anomaly.635.desc: "Há aproximadamente cinco mil anos, alguém utilizou um grande laser de mineração a partir da órbita para esculpir um grande corpo de escrita na superfície de [From.GetName]. A escrita gigante cobre uma grande porção do hemisfério norte do [From.GetPlanetMoon] e parece ser uma crônica sobre a difícil vida de um mercenário alienígena."
 anomaly.650.name: "Veleiro Solar"
 anomaly.650.desc: "Descobrimos um veleiro solar em órbita ao redor de [From.GetName]. A nave de viagem abaixo da luz foi construída por uma cultura desconhecida, e parece ter milhares de anos. Uma das velas gigantescas possui um grande rasgo onde algum tipo de objeto atravessou - provavelmente um meteorito - o que parece ter desabilitado a nave. Apesar de a tecnologia da nave ser bastante ultrapassada, ela possui algumas escolhas de projetos de engenharia interessantes."
 anomaly.650.a: "Um projeto interessante, mas primitivo."
 anomaly.655.name: "Tiro de Raspão"
 anomaly.655.desc: "Enquanto estava se aproximando de [From.GetName], o [Root.GetName] sofreu um tiro de raspão de diversas balas de catapultas eletromagnéticas. Os projéteis tinham bilhões de anos de idade, e, baseado na trajetória, parecem ser balas perdidas disparadas a partir de uma galáxia vizinha. Após errar o alvo original, elas continuaram sua jornada por milênios - até hoje. As balas que recuperamos são de um projeto avançado, apesar da idade incrível."
 anomaly.660.name: "Asteroide Rebocado"
 anomaly.660.desc: "Por algum motivo, alguém rebocou um asteroide para uma órbita estável ao redor de §Y[From.GetName]§! As seções de motor gigantescas e propulsores de frenagem ainda podem ser encontrados na superfície, apesar de já estarem inoperáveis. Quem quer que tenha feito isso, também extraiu minerais no asteroide, mas essas operações aparentemente foram abandonadas logo depois que começaram."
 anomaly.660.b: "Alienígenas com um pouco de juízo!"
 anomaly.670.name: "Devastação Nuclear"
 anomaly.670.desc: "Nossa inspeção em [From.GetName] revelou que, há somente mil anos, ele costumava ser um [From.GetPlanetMoon] continental primitivo, com um clima agradável. Em um contraste absurdo, hoje a atmosfera é extremamente tóxica, a superfície altamente irradiada e o mundo já perdeu a capacidade de suportar a vida.\n\nDetectamos sinais que o [From.GetPlanetMoon] foi o cenário de uma guerra termonuclear incrivelmente destrutiva, feita entre facções de uma civilização indígena pré-espacial, relativamente avançada."
 anomaly.670.a: "Que desperdício."
 anomaly.675.name: "Terra Devastada Nuclearmente"
 anomaly.675.desc_01: "A inspeção de [From.GetName] revelou que o [From.GetPlanetMoon] está atualmente passando por uma era glacial que parece ter sido ativada por uma guerra termonuclear global há séculos. Boa parte das formas de vida maiores foi morta pelo inverno nuclear subsequente, incluindo a civilização pós-atômica que iniciou a troca apocalíptica."
 anomaly.675.desc_02: "A inspeção de [From.GetName] confirmou que este [From.GetPlanetMoon] já foi um paraíso tropical próspero antes de ter sido destruído por uma guerra termonuclear global há séculos. Boa parte das formas de vida maiores, incluindo a civilização pós-atômica que iniciou a troca apocalíptica, foi morta na terra irradiada que sobrou após a poeira baixar."
 anomaly.680.name: "Explosão de Raios Gama"
 anomaly.680.desc: "24 mil anos atrás, [From.GetName] teve a infelicidade de estar diretamente no caminho de uma explosão de raios gama de uma estrela decadente dentro da nossa galáxia. O [From.GetPlanetMoon] foi tomado por radiação letal, que não só resultou em envenenamento por radiação na maioria das formas de vida do lado de [From.GetName] que estava diante da explosão, mas também acabou com boa parte da camada de ozônio.\n\nEste evento de extinção matou aproximadamente 86% da biota, incluindo uma civilização do princípio da Idade do Bronze, cujas ruínas ainda podem ser encontradas em partes do hemisfério norte. Somente agora a biosfera está mostrando sinais de recuperação."
 anomaly.685.name: "Efeito Estufa"
 anomaly.685.desc: "Há sinais que o clima atual de [From.GetName] é a causa de um efeito estufa iniciado por quantidades gigantescas de poluição. Os oceanos ferveram e o [From.GetPlanetMoon] está permanentemente envolto em uma camada densa de neblina devido à atmosfera grossa.\n\nRuínas espalhadas da civilização indígena podem ser encontradas na superfície, sugerindo uma cultura superpopulosa que definhou nos estágios finais de uma Idade Industrial."
 anomaly.690.name: "Biosfera de Amônia"
 anomaly.690.desc: "Apesar de ser tóxica para a maioria das formas de vida conhecidas, [From.GetName] possui uma ecologia próspera dentro da alta pressão da atmosfera. A vida aqui utiliza amônia em vez de água como solvente, e se desenvolveu de maneiras que diferem significativamente de modelos ecológicos estabelecidos anteriormente. Seu estudo beneficiaria imensamente nosso conhecimento de biologia xeno."
 anomaly.695.name: "Formas de Vida de Silicone"
 anomaly.695.desc: "Um tipo de forma de vida escavadora baseada em silicone habita uma vasta rede de túneis abaixo da superfície sem vida de [From.GetName]. O melhor que podemos dizer é que as criaturas se alimentam de rochas e há evidências que sugerem que elas possuem uma forma de inteligência rudimentar. Seus esforços de túneis lançaram grandes quantidades de minerais para a superfície."
 anomaly.700.name: "Mineradores Selvagens"
 anomaly.700.desc: "Um grupo de mineradores selvagens de [Root.Owner.Capital.GetName] estabeleceram uma operação de mineração não autorizada em [From.GetName]. Os mineradores foram presos, e tomamos o controle de sua estação ilegal."
 anomaly.705.name: "Antigo Marcador de Inspeção"
 anomaly.705.desc: "Um pequeno transmissor de curto alcance foi localizado na superfície de [From.GetName]. Parece ser um antigo marcador de inspeção, colocado aqui há décadas para marcar um grande depósito de metais preciosos. Os mineradores, que eram os destinatários originais, nunca chegaram, já que o depósito ainda está aqui."
 anomaly.710.name: "Colônia Fragmentada"
 anomaly.710.desc: "Para sua grande surpresa, a tripulação de [Root.GetName] tropeçou em um pequeno assentamento [Root.Owner.GetSpeciesName] na superfície de [From.GetName]. A colônia foi fundada por um grupo de pioneiros corajosos que partiram de [Root.Owner.Capital.GetName] há muito tempo em uma nave estelar primitiva. Até agora, a nave havia sido dada como perdida.\n\nA colônia não está bem, e o número de habitantes vem decrescendo de maneira estável durante as últimas gerações. Os sobreviventes pediram para se juntar novamente a [Root.Owner.GetName]."
 anomaly.710.a: "Bem-vindos de volta!"
 anomaly.710.b: "Deixe que eles se virem por conta própria."
 anomaly.715.name: "Ruínas Coloniais"
 anomaly.715.desc: "Uma pequena colônia foi fundada em [From.GetName] por uma civilização alienígena há uns 17 mil anos, mas parece que foi abandonada logo depois. Não há restos de quaisquer colonizadores, e a colônia não parece ter sido estendida além dos assentamentos principais, salvo por algumas poucas estações meteorológicas."
 anomaly.2500.name: "Restos Mortais"
 anomaly.2500.desc: "Os restos mortais de grandes formas de vida espaciais foram descobertos em órbitas decadentes ao redor do gigante gasoso [From.GetName]. Essas criaturas não sencientes parecem ser capazes de viagem interestelar, mas não há avistamentos gravados deles no espaço explorado. [Root.GetLeaderName], da equipe científica, sugeriu que gastássemos recursos adicionais em uma análise mais cautelosa."
 anomaly.2501.desc: "[Root.GetLeaderName], da equipe científica, deduziu que [From.From.GetName] serviu como um cemitério orbital, onde morreram os membros da espécie alienígena morta que encontramos. A gravidade cuidou do resto, puxando os restos lentamente para o gigante gasoso durante um período de milhões de anos.\n\nEste ciclo antigo parou repentinamente há 15 milhões de anos quando a última criatura chegou. Podemos apenas especular se eles foram caçados até serem extintos por civilizações espaciais, ou se conheceram o seu fim através de outra calamidade."
 anomaly.2510.name: "Oceano Abaixo do Gelo"
 anomaly.2510.desc: "Análises profundas de [From.GetName] revelaram um grande oceano aquecido por aberturas hidrotermais abaixo da camada de gelo que cobre a superfície. [Owner.GetScientist]-chefe [Root.GetLeaderName] despachou sondas de [Root.GetName] que perfuraram muitos quilômetros de gelo grosso e encontraram a água embaixo repleta de algo que parece ser vida. Vamos precisar de mais recursos para conduzir um estudo minucioso das muitas formas de vida únicas que habitam esse oceano."
 anomaly.2512.desc: "[Owner.GetScientist]-chefe [Root.GetLeaderName] retornou da expedição que estudou a rica biosfera nos mares abaixo da camada de gelo de [From.From.GetName]. Foi descoberto que diversas espécies grandes nativas das regiões mais profundas do mar global produzem uma molécula inorgânica única com propriedades curativas impressionantes. Se essa molécula for extraída em grandes quantidades, ela poderá revolucionar o campo das ciências médicas e até mesmo ter aplicações na indústria!"
 anomaly.2512.desc.mach: "[Owner.GetScientist]-chefe [Root.GetLeaderName] retornou da expedição que estudou a biosfera nos mares abaixo da camada de gelo de [From.From.GetName]. Foi descoberto que diversas espécies grandes nativas das regiões mais profundas do mar global produzem uma molécula inorgânica única com propriedades curativas impressionantes.\n\nSe essa molécula for extraída em grandes quantidades, ela poderá revolucionar a assistência médica para nossos adorados biotroféus e até mesmo ter aplicações na indústria!"
 anomaly.2513.desc: "[Root.GetLeaderName], [Owner.GetScientist]-Chefe, retornou da expedição que estudou a rica biosfera nos mares abaixo da camada de gelo de [From.From.GetName]. Nossas sondas subaquáticas mapearam o terreno e catalogaram a maioria das formas de vida. Embora esses dados possam ser úteis para nossos biólogos, não foram feitas mais descobertas que pudessem ter outras aplicações."
 anomaly.2520.name: "Esqueleto Gigante"
 anomaly.2520.desc: "O que antes era considerado um conjunto de montanhas no hemisfério sul de [From.GetName] foi identificado como os restos esqueléticos gigantescos de uma forma de vida alienígena colossal.\n\nOs ossos foram datados em 3.4 bilhões de anos, mas nossa equipe de [Owner.GetScientistPlural] já descartou a hipótese de que [From.GetName] poderia ter sustentado vida nessa escala em qualquer momento da história deste mundo. [Root.GetLeaderName] preparou um projeto de pesquisa especial para mergulhar mais a fundo neste mistério."
 anomaly.2520.a.term: "Podemos aprender um novo método de extermínio."
 anomaly.2520.a.rean: "Podemos fazê-lo se mexer novamente?"
 anomaly.2521.desc: "Após estudos contínuos dos restos esqueléticos gigantescos encontrados em [From.From.GetName], [Root.GetLeaderName], da equipe científica, concluiu que a criatura servia como um tipo de nave estelar orgânica. Ossos bem menores de pelo menos três espécies diferentes foram encontrados dentro do esqueleto maior, e só podemos deduzir que eles vieram de membros da tripulação.\n\nPor motivos desconhecidos, esta nave estelar orgânica sofreu um dano catastrófico e caiu em [From.From.GetName]. Enquanto não conseguimos começar a compreender a engenharia biológica necessária para \"cultivar\" uma nave estelar como essa, só o estudo destes ossos avançou nosso conhecimento de maneira substancial."
 anomaly.2521.desc.bio: "Após um estudo extenso dos restos esqueléticos colossais em [From.From.GetName], [Root.GetLeaderName], da equipe científica, confirmou o impossível: eles pertenciam a uma nave estelar viva. Essa criatura apresentava pouca semelhança em relação às nossas naves biológicas.\n\nSua estrutura é bizarra, ao mesmo tempo familiar e alienígena, como se moldada por uma filosofia evolutiva completamente diferente. Ossos menores, pertencentes a pelo menos três espécies distintas, foram encontrados dentro de sua enorme caixa torácica, sugerindo que a criatura já carregou uma tripulação dentro do próprio corpo. Uma ideia perturbadora, considerando que nossas próprias naves são simbiônticas, e não meros cascos ocos habitáveis.\n\nA causa da morte é incerta, mas os danos são catastróficos: sua estrutura maciça se despedaçou ao cair na superfície do planeta. Será que a tripulação morreu com a criatura, ou era algo mais? Talvez uma inteligência orientadora, inseparável do próprio ser?\n\nÉ possível que nunca descubramos toda a verdade sobre sua origem, mas o estudo de seus restos nos trouxe uma nova perspectiva sobre a natureza de uma nave viva. E, no entanto, uma pergunta perturbadora permanece: essa entidade foi construída... ou nasceu?"
 anomaly.2521.b.evopred: "Vamos começar consumindo os pilotos ou a nave?"
 anomaly.2522.desc: "Nossos estudos contínuos dos restos esqueléticos massivos em [From.From.GetName] conseguiram clarificar um pouco sobre como a criatura acabou no [From.From.GetPlanetMoon]. Há leituras residuais de energia muito fracas que indicam que algum tipo de portal dimensional existiu brevemente na parte de trás do esqueleto.\n\n[Root.GetLeaderName], da equipe científica, tem uma teoria que diz que a criatura passou através deste portal de outra dimensão para acabar falecendo no ambiente hostil de [From.From.GetName]. Por que ele fez isso e de onde veio são questões que talvez nunca sejam respondidas."
 anomaly.2522.b.evopred: "Não importa sua dimensão ou origem, DNA é DNA!"
 anomaly.2523.desc: "O esqueleto está se movendo novamente! A criatura colossal se eleva sobre nossos necromantes e dá um passo trêmulo, seguido por outro mais firme. É possível que ela não tenha a mesma quantidade de pernas que tinha em vida ou o número certo de membros em geral. Com uma combinação de músculos desenvolvidos em laboratório e próteses hidráulicas de última geração, o gigante estará pronto para nos ajudar em qualquer campo de batalha, e a terra vai tremer sob os pés dele."
 anomaly.2523.tooltip: "Adiciona §G1§! §YExército de Esqueletos Gigantes§! em órbita."
 anomaly.2530.name: "Sinais de Batalha"
 anomaly.2530.desc: "Há sinais claros que uma batalha espacial gigante aconteceu na órbita próxima de [From.GetName] em algum momento nos últimos 5 mil anos. A superfície em um lado do [From.GetPlanetMoon] está marcada com crateras de balas perdidas, e leituras de [Root.GetName] acharam diversas carcaças gigantes no chão.\n\nApesar de essas naves destruídas estarem em péssimas condições, o fato que qualquer coisa ainda resta após o dano que receberam é um testemunho do seu projeto avançado. [Root.GetLeaderName], da equipe científica, está preparando uma expedição para vasculhar estes cascos perdidos atrás de tecnologias valiosas."
 anomaly.2530.desc.bio: "Há evidências irrefutáveis de que uma batalha titânica de naves estelares vivas ocorreu nos céus acima de [From.GetName], em algum momento dos últimos 5.000 anos. A superfície do mundo carrega profundas cicatrizes – vastas crateras onde naves moribundas caíram da órbita, seus cascos danificados explodindo com o impacto. Ainda hoje, traços de resíduos orgânicos secos e cartilagem fossilizada permanecem na área devastada.\n\nOs restos dessas criaturas outrora majestosas são quase irreconhecíveis, e suas bioestruturas foram deformadas e petrificadas pelo tempo. Ainda assim, o fato de algo ter resistido a milênios de decadência e exposição atesta sua notável resiliência. [Root.GetLeaderName], da equipe científica, está preparando uma expedição para examinar esses leviatãs fossilizados, na esperança de descobrir vestígios de sua arquitetura genética ou simbiontes modificados por bioengenharia; segredos que talvez ainda pulsem com vida latente."
 anomaly.2531.desc: "[Root.GetLeaderName] e sua equipe científica concluíram sua expedição em [From.From.GetName] e voltaram para o [Root.GetName]. Felizmente, o cemitério de naves estelares na superfície acabou sendo um baú de tesouros tecnológicos.\n\nEstudar os restos destas naves avançou nossa pesquisa em certos campos em alguns anos, e ainda há mais a ser descoberto. Um entreposto científico em órbita seria de grande ajuda para nossos esforços de engenharia de naves espaciais."
 anomaly.2532.desc: "[Root.GetLeaderName] e sua equipe científica concluíram sua expedição em [From.From.GetName] e voltaram para o [Root.GetName]. Infelizmente, as naves estelares na superfície estavam danificadas demais para recuperarmos qualquer tecnologia útil.\n\nPorém, estas naves claramente eram muito avançadas, e podemos ganhar muitos conhecimentos valiosos de engenharia se analisarmos a forma como foram projetadas. Devemos considerar a construção de um entreposto científico permanente em órbita."
 anomaly.2532.desc.bio: "A equipe científica liderada por [Root.GetLeaderName] completou sua árdua expedição em [From.From.GetName] e retornou a [Root.GetName]. Infelizmente, o tempo não foi gentil com os restos dessas naves orgânicas antigas. Suas estruturas outrora vivas há muito se fossilizaram ou se desintegraram em carcaças calcificadas, deixado pouca coisa de valor para ser recuperada.\n\nMesmo após a morte, seu projeto revela maravilhas além de nossa compreensão. A intrincada trama de esqueletos modificados por bioengenharia, os vestígios de uma musculatura reativa e as marcas de uma arquitetura neural muito além da nossa indicam um nível de sofisticação tecnológica que exige um estudo mais aprofundado. Estabelecer uma base de pesquisa permanente em órbita pode ser a chave para desvendar os segredos desses leviatãs há muito extintos."
 anomaly.2540.name: "Mural Alienígena"
 anomaly.2540.desc: "Enquanto conduzia análises da superfície de [From.GetName], [Root.GetLeaderName], da equipe científica a bordo de [Root.GetName], descobriu o que parece ser uma pedra esculpida artificialmente e coberta de escritos alienígenas. Não foram detectados quaisquer outros sinais de atividade alienígena no mundo, e exatamente como o mural chegou até aqui permanece um mistério. Preparamos um projeto especial para traduzir o texto."
 anomaly.2541.desc: "[Root.GetLeaderName], da equipe científica, conseguiu traduzir parcialmente o mural alienígena descoberto em [From.From.GetName]. É um memorial para uma raça alienígena extinta que já manteve um pequeno império interestelar nesta região da galáxia. Eles aparentemente foram exterminados pelos criadores do mural, um fato que parece ser motivo de arrependimento.\n\nLevando em consideração que o mural foi datado com mais de 300 milhões de anos, é provável que seus criadores também estejam extintos. Talvez o mais interessante de tudo seja o material com que o mural foi feito que, apesar da idade, está em condições notavelmente boas."
 anomaly.2542.desc: "[Root.GetLeaderName], da equipe científica, conseguiu traduzir parcialmente o mural alienígena descoberto em [From.From.GetName]. O texto contém uma quantidade imensa de dados, e o mural claramente serve como uma espécie de biblioteca de baixa tecnologia. Ele descreve, em termos genéricos, o conhecimento tecnológico coletivo de uma civilização alienígena que dominou esta região da galáxia há cerca de 80 milhões de anos.\n\nMuito de seu conteúdo já é de nosso conhecimento, mas os dados contêm diversas pistas promissoras sobre tecnologias que nunca havíamos considerado. Há dados suficientes aqui para manter nossos cientistas ocupados por décadas, mas precisaremos de uma instalação de pesquisa orbital para continuar os esforços de tradução."
 anomaly.2550.name: "Estaleiro Automatizado"
 anomaly.2550.desc: "Enquanto estavam conduzindo a inspeção de [From.GetName], o [Root.GetName] detectou os restos de um estaleiro automatizado em órbita. Ele tem pelo menos mil anos de idade e parece ter sido sujeito a uma barragem de mísseis, mas um dos diques de fabricação ainda está em condições de funcionamento.\n\n[Root.GetLeaderName], da equipe científica, está confiante de que a energia pode ser restaurada ao estaleiro, mas seria um projeto significativo."
 anomaly.2550.desc.bio: "Durante a inspeção de [From.GetName], [Root.GetName] fez uma descoberta surpreendente: os restos degradados de um antigo berço de gestação espacial, uma vasta estrutura orgânica que já foi capaz de gerar naves estelares. Ela agora está silenciosamente à deriva, suas membranas externas rompidas e atrofiadas por um aparente bombardeio brutal ocorrido há séculos. A maioria de seus canais vasculares está petrificada e sua rede neural não emite nenhum sinal... no entanto, uma câmara de gestação permanece ativa, com reatores pulsando lentamente com vestígios de vida.\n\n[Root.GetLeaderName], da equipe científica, acredita que com uma intervenção cuidadosa poderemos ser capazes de reviver parcialmente essa entidade adormecida. Contudo, será um processo delicado e demorado, e não podemos ignorar o risco de respostas biológicas imprevistas."
 anomaly.2551.desc: "A [Root.GetFleetName] conseguiu restaurar a energia no estaleiro automatizado sobre [From.From.From.GetName]. A instalação continuou sua ordem de construção interrompida imediatamente, usando os materiais que tinha em mãos para construir três caçadores avançados de um projeto desconhecido.\n\nInfelizmente, a antiga instalação quebrou completamente logo após e foi classificada como sem possibilidades de reparo. Enviamos tripulações para as novas naves e comissionamos as mesmas em nossa frota."
 anomaly.2551.desc.bio: "[Root.GetFleetName] reativou com sucesso o berço adormecido em órbita de [From.From.From.GetName]. A antiga estrutura orgânica estremeceu quando suas bioforjas, inativas por muito tempo, ganharam vida, completando rapidamente o ciclo de crescimento de três formas de guerra; cada uma um modelo misterioso, mas estranhamente sofisticado.\n\nNo entanto, o estresse desse renascimento inesperado foi demais para o organismo debilitado. Seus canais vasculares colapsaram, o núcleo neural definhou e o organismo se dissolveu em uma biomassa inerte. As naves recém-geradas, desorientadas a princípio, rapidamente se adaptaram à nossa presença. Agora, estão integradas à nossa frota, prontas para servir a seus novos mestres simbióticos."
 anomaly.2552.desc: "A [Root.GetFleetName] conseguiu restaurar a energia no estaleiro automatizado sobre [From.From.From.GetName]. A instalação continuou sua ordem de construção interrompida imediatamente, usando os materiais que tinha em mãos para construir uma fragata avançada de um projeto desconhecido.\n\nInfelizmente, a antiga instalação quebrou completamente logo após e foi classificada como sem possibilidades de reparo. Enviamos uma tripulação para a nova nave e a colocamos em serviço na nossa frota."
 anomaly.2560.name: "Nave de Gigante Gasoso"
 anomaly.2560.desc: "Análises ativas de [From.GetName] pegaram o que parece ser uma grande nave no fundo da atmosfera do gigante gasoso. Julgando pelos destroços em volta, parece que já houve diversas tentativas falhas de recuperar este perdido. Qualquer nave forte o suficiente para aguentar essa gravidade esmagadora deve ser um prêmio magnífico, e [Root.GetLeaderName], da equipe científica, propôs um projeto de recuperação nosso."
 anomaly.2560.a: "Traga para cá, o que quer que seja isso."
 anomaly.2560.b: "O esforço é grande demais. Deixe aqui embaixo."
 anomaly.2561.desc: "Em uma demonstração magistral de engenharia, [Root.GetLeaderName] e sua equipe científica conseguiram erguer gentilmente a nave perdida em [From.From.GetName] para a atmosfera superior do gigante gasoso. Apesar de sua idade, o cruzador antigo está em condições impressionantemente boas, e restauramos a energia nos sistemas. Não há rastros dos restos da tripulação original, mas nós trouxemos uma tripulação nossa e colocamos a nave na nossa frota."
 anomaly.2562.desc: "A tentativa de [Root.GetLeaderName], da equipe científica, de recuperar a nave perdida da atmosfera de [From.From.GetName] falhou. A pesada gravidade do gigante gasoso desativou os motores de um de nossos rebocadores de engenharia, que colidiu com a nave perdida. Diversas vidas foram perdidas, e a nave antiga foi forçada ainda mais para fundo na atmosfera - longe de nosso alcance."
 anomaly.2570.name: "Órbita Terminal"
 anomaly.2570.desc: "Uma das muitas luas ao redor de [From.GetName] possui uma órbita terminal. Ela logo entrará em colisão com o gigante gasoso no que certamente será um evento de impacto massivo. Este evento está sendo preparado há milhões de anos, e é uma coincidência incrível que o impacto ocorrerá justamente após uma visita de uma de nossas naves.\n\nMuitos de nossos cientistas desejam observar e gravar o evento, mas temos apenas uma janela apertada antes que seja tarde demais."
 anomaly.2571.desc: "Conseguimos gravar a colisão entre [CollisionLocation.GetName] e sua lua com sucesso! O evento foi capturado de diversos ângulos, e transmitido ao vivo através do nosso espaço. O mais importante é que nossos cientistas liderados por [Root.GetLeaderName] foram capazes de gravar uma grande quantidade de dados de física que certamente beneficiarão nossa pesquisa."
 anomaly.2572.desc: "Perdemos a oportunidade de gravar apropriadamente o impacto da lua colidindo com [From.From.GetName]. Nossos cientistas identificaram outra pequena lua com uma órbita decadente, e eles preveem que ela atingirá o gigante gasoso em apenas 7,6 milhões de anos. Talvez teremos mais sorte lá..."
 anomaly.5000.name: "Sinal de Gigante Gasoso"
 anomaly.5000.desc: "O [Root.GetName] pegou algumas leituras curiosas de [From.GetName]. Há bolsões significativos de radiação na atmosfera do gigante gasoso que parecem ser o resultado de bombardeio orbital intenso. O que alguém poderia esperar ganhar ao bombardear um gigante gasoso, ainda é um mistério.\n\nConforme o [Root.GetName] estava se preparando para romper a órbita, [Root.GetLeaderName], da equipe científica, descobriu um sinal fraco vindo do interior do planeta. Pode ser uma transmissão de algum tipo, mas a radiação de fundo do gigante gasoso faz o isolamento ser difícil."
 anomaly.5000.a: "Devemos investigar esse sinal."
 anomaly.5000.b: "Um mal contato de um sensor. Ignore."
 anomaly.5001.desc: "[Root.GetLeaderName], da equipe científica, conseguiu isolar o sinal fraco que estava vindo de algum lugar no fundo da atmosfera de [From.From.From.GetName]. Parece ser algum tipo de transmissão, e a filtramos através do nosso software de tradução."
 anomaly.5002.desc: "O sinal fraco que pegamos do interior do gigante gasoso [From.From.From.GetName] desapareceu. Nunca saberemos qual é a sua origem."
 anomaly.5003.name: "Transmissão do Gigante Gasoso"
 anomaly.5003.desc: "Finalmente! Bom te encontrar, viajante espacial! Somos os Dathnak, e o planeta que você está orbitando é Tollok Rong - nosso lar ancestral. Sempre é fascinante conhecer um sólido, mesmo que nosso último encontro com o seu tipo tenha sido meio... problemático.\n\nSem dúvida você detectou os surtos de radiação vindo de nossa atmosfera. Tollok Rong está morrendo, e nossa espécie morrerá se não encontrarmos um novo lar. Identificamos um planeta que seria adequado à nossa fisiologia, mas não temos como chegar até lá. Infelizmente, nossa natureza não-corporal significa que não temos muita indústria ou tecnologia. Pode nos ajudar?"
 anomaly.5003.a: "Se você não tem tecnologia, como estamos falando?"
 anomaly.5003.a.response: "Ah, mas vocês não são os primeiros sólidos a nos visitar! Outro viajante espacial graciosamente nos doou um pequeno transmissor subespacial e uma matriz de scanners há 2,9 milhões de ciclos solares. Eles foram projetados para serem compatíveis com a nossa fisiologia.\n\nUm dos encontros mais positivos que já tivemos com o seu tipo."
 anomaly.5003.b: "O que aconteceu com o seu planeta?"
 anomaly.5003.b.response: "Bom, a última vez que sólidos nos visitaram há alguns milhares de ciclos, as coisas não acabaram muito bem. Eles queriam que abraçássemos a religião deles, recusamos e isso desencadeou algum tipo de reação genocida.\n\nCompletamente injustificável! Antes que soubéssemos o que estava acontecendo, eles manobraram a frota deles em órbita e liberaram um bombardeio gigante."
 anomaly.5003.c: "Você quer que transportemos a sua espécie inteira para outro planeta?"
 anomaly.5003.c.response: "Sim! E esperamos que em breve! Não se preocupe, não há muitos de nós. A maioria dos Dathnak morreu quando nosso planeta foi bombardeado, e aqueles que sobreviveram voltaram pra mais fundo na atmosfera. A comunicação com a superfície é difícil aqui, e a radiação está se espalhando. Não temos muito tempo!"
 anomaly.5003.d: "Vamos ajudar vocês a se realocarem."
 anomaly.5003.d.response: "Excelente! Sabíamos que poderíamos contar com vocês.\" Encaminhamos as coordenadas de nosso novo lar.\n\nVocê deve prometer que não vai deixar seus colonizadores reivindicarem este mundo atraente antes de chegarmos lá, não importa o tamanho da tentação!"
 anomaly.5003.e: "Desculpe. Seria muito incômodo."
 anomaly.5003.e.response: "Eu sabia! Avisei aos outros que os sólidos eram incapazes de sentir compaixão, mas eles insistiram em fazer este pleito humilhante.\n\nEu sei bem o que vocês são - uma praga para esta galáxia! Um dia, ela será herdada por seres como nós, e então haverá o acerto de contas. Escreva minhas palavras. A era dos sólidos acabará! O tempo das formas de vida gasosas virá!"
 anomaly.5004.desc: "[Root.GetLeaderName], da equipe científica, terminou de supervisionar a realocação dos Dathnak para o novo lar deles. Um comboio de cargueiros civis equipado com tanques de gás pressurizado gigantescos levou os seres gasosos pelo espaço e os depositou na atmosfera do gigante gasoso. O antigo transmissor e a matriz de scanner também foram trazidos."
 anomaly.5004.a: "Saúde-os."
 anomaly.5005.desc: "As condições em Tollok Rong se deterioraram ao ponto dos Dathank não poderem mais ser salvos. A radiação se espalhou por boa parte da atmosfera, e os sobreviventes Dathnak recuaram mais para o fundo do núcleo do planeta onde a comunicação com a superfície não é mais possível. Eventualmente, a radiação também chegará até lá, extinguindo a espécie deles."
 anomaly.5006.desc: "Estamos eternamente endividados para com vocês! O planeta excedeu nossas expectativas. Pela primeira vez em gerações, nossas crianças podem brincar na atmosfera superior sem começar a brilhar.\n\nDecidimos chamar nosso novo lar de Baldarak em homenagem à sua espécie. Gerações futuras de Dathnak saberão sempre o nome dos seus salvadores!"
 anomaly.5006.a: "Baldarak? Nós somos [Root.GetSpeciesNamePlural]..."
 anomaly.5006.a.response: "Sério? Eu podia jurar que... desculpa, mas às vezes é difícil diferenciar vocês, sólidos. Temo que seja tarde demais para mudar o nome. Mas Baldarak soa bem, não acha?"
 anomaly.5006.a.2: "Baldarak? Isso é um nome excelente!"
 anomaly.5006.a.2.response: "Soa bem, né? Somos bem sortudos por termos sido resgatados por sólidos tão foneticamente agradáveis!"
 anomaly.5006.b: "Boa sorte com o seu novo lar."
 anomaly.5006.b.response: "Obrigado de novo, caros amigos! Que as correntes atmosféricas sempre mantenham vocês no ar!"
 anomaly.5007.name: "Uma Nova Colônia"
 anomaly.5007.desc: "Olá de novo! Você ficará feliz em saber que o número de nossa população quadruplicou desde que chegamos! Muitos de nós estávamos em um clima festivo quando desembarcamos, e as coisas ficaram animadas, digamos assim.\n\nApós a experiência positiva que tivemos ao colonizar Baldarak, alguns pioneiros corajosos me pediram para solicitar que você nos leve para outro gigante gasoso. Já localizamos outro candidato promissor dentro do seu espaço que seria adequado a colonização. O que dizem, amigos?"
 anomaly.5007.a: "Bom, contanto que seja apenas outro gigante gasoso..."
 anomaly.5007.a.response: "Maravilhoso! Estamos enviando as coordenadas. Nossos colonizadores estão ansiosos para partir!"
 anomaly.5007.b: "Claro que não. Nosso acordo era transportar vocês para UM planeta."
 anomaly.5007.b.response: "Hmm... entendo. Teremos que ficar contidos em Baldarak e fazer o melhor que pudermos então."
 anomaly.5008.desc: "Como antes, um comboio de cargueiros foi preparado para transportar de maneira segura os colonizadores Dathnak dentro de tanques de gás pressurizados. Após uma breve jornada, eles conseguiram desembarcar no gigante gasoso que chamaram de 'Nova Baldarak.' Um satélite foi deixado em órbita para permitir a comunicação de longa distância com Baldarak."
 anomaly.5008.a: "Aproveitem ao máximo, Dathnak."
 anomaly.5009.name: "Chabky Raddh"
 anomaly.5009.desc: "Saudações de Nova Baldarak! As coisas estão progredindo bem aqui em nossa nova colônia. Porém, temos um pequeno pedido...\n\nChabky Raddh, uma de nossas colonizadoras, sente muita falta da família e dos amigos em Baldarak e quer ir para casa. O choro dela está nos enlouquecendo! Se não for pedir muito, acha que pode levá-la de volta?"
 anomaly.5009.a: "O quê?! Claro que não!"
 anomaly.5009.a.response: "Tínhamos que tentar... Esperamos que você não se importe. Chabky terá que se acalmar e tentar aproveitar o máximo da situação, assim como todos nós! Desculpe por desperdiçar o seu tempo, amigos [Root.GetSpeciesName]."
 anomaly.5009.b: "OK, OK."
 anomaly.5009.b.response: "Excelente. Esperamos que isso não seja muito dispendioso, já que vocês estarão transportando um único indivíduo. Faremos os preparativos necessários.\n\nAcabei de contar a novidade para Chabky, e ela está girando de alegria! Na verdade, ela está girando fora de controle agora... com licença amigos [Root.GetSpeciesName]..."
 anomaly.5010.desc: "Um único rebocador de carga transportando um cilindro de gás chegou em Baldarak sob escolta do [Root.GetName]. O conteúdo do cilindro foi liberado na atmosfera do gigante gasoso, devolvendo a colonizadora Dathnak em segurança ao seu lar."
 anomaly.5010.a: "Boa sorte."
 anomaly.5011.name: "Contato Perdido"
 anomaly.5011.desc: "Trazemos notícias alarmantes, amigos [Root.Owner.GetSpeciesName]!\n\nPerdemos o contato com a nossa colônia em Nova Baldarak! Eles não respondem mais às nossas transmissões de satélite, e esperamos o pior. Talvez os alienígenas que bombardearam nosso mundo natal original voltaram para terminar o trabalho. Por favor, envie uma nave para investigar!"
 anomaly.5011.a: "Despacharemos uma nave agora."
 anomaly.5011.a.response: "Excelente! Esperamos que seja um transmissor falho."
 anomaly.5011.b: "Chega! Não somos seus empregados."
 anomaly.5011.b.response: "Mas... mas eles podem estar mortos! Vocês realmente são tão insensíveis assim? Julgamos vocês mal, [Root.GetSpeciesName]!"
 anomaly.5012.desc: "Nossa investigação em Nova Baldarak não revelou nada fora do comum. O satélite que a colônia usava para se comunicar com a capital ainda está funcionando, pelo que estamos vendo."
 anomaly.5012.a: "Abra um canal para o planeta."
 anomaly.5013.name: "Frente Revolucionária"
 anomaly.5013.desc: "Saudações da Frente Revolucionária de Nova Baldarak!\n\nArrancamos o jugo da opressão e finalmente estamos livres da tirania de Baldarak! Não temos problemas com vocês, [Root.Owner.GetSpeciesName], contanto que não ajudem os imperialistas Baldarak na tentativa inevitável de esmagar a nossa revolução.\n\nPorém, vocês podem nos ajudar a levar a batalha até os nossos inimigos... estariam dispostos a entregar uma de nossas unidades comando em Baldarak?"
 anomaly.5013.a: "Conte-nos o que vocês planejaram."
 anomaly.5013.a.response: "Queremos infiltrar Baldarak com uma de nossas unidades de comando elite. Então eles iniciarão uma revolta popular contra a elite decadente que comanda nosso povo. Depois que os tiranos forem depostos, todos os Dathnak finalmente saberão o que é a verdadeira liberdade. Um plano bem direto, [Root.Owner.GetSpeciesName]."
 anomaly.5013.b: "Entregaremos os seus soldados."
 anomaly.5013.b.response: "Sério?! Mesmo? Você é um verdadeiro amigo da revolução, [Root.Owner.GetSpeciesName]! Deixe-me juntar o time!"
 anomaly.5013.c: "Não vamos nos envolver em sua disputa interna."
 anomaly.5013.c.response: "Claro que não vão! Não queremos que a revolução se espalhe para as massas oprimidas no SEU império tirânico. Não podemos ter isso!"
 anomaly.5014.name: "Baldarak Responde"
 anomaly.5014.desc: "Falo em nome do governo Dathnak legítimo em Baldarak.\n\nRecebemos um manifesto do grupo que tomou o controle de Nova Baldarak, e nossa, quanta besteira! Esses rebeldes e anarquistas são uma vergonha terrível para nós, [Root.Owner.GetSpeciesName]. Você pode nos ajudar a esmagar a pequena 'revolução' deles antes que chegue até aqui e alguém se machuque de verdade?\n\nO General Paltanak preparou uma força expedicionária para retomar a colônia, mas precisaremos da sua ajuda para transportá-la até lá."
 anomaly.5014.a: "Ajudaremos vocês."
 anomaly.5014.a.response: "Sabíamos que poderíamos contar com vocês, [Root.Owner.GetSpeciesName]!\" Estes rebeldes não saberão o que os atingiu!"
 anomaly.5014.b: "Vocês precisam resolver os problemas de vocês."
 anomaly.5014.b.response: "Vocês se arrependerão quando essa rebelião chegar aos seus planetas, [Root.Owner.GetSpeciesName]! Não pense que isso não vai acontecer!"
 anomaly.5015.desc: "Um rebocador de carga escoltado pelo [Root.GetName] conseguiu sorrateiramente soltar a cápsula de carga contendo uma unidade de comando revolucionária na atmosfera Baldarak. Logo depois, flashes puderam ser vistos de dentro da camada de nuvens do gigante gasoso. Seriam sinais de luta?"
 anomaly.5015.a: "Veremos o que acontece depois."
 anomaly.5016.name: "O Conselho Revolucionário"
 anomaly.5016.desc: "Aqui é o Cidadão Fotanga! O povo de Baldarak derrubou os tiranos e opressores que buscavam escravizar nossa espécie sob o seu comando. Um conselho revolucionário foi estabelecido para cuidar de nossa grande nação durante esta fase transitória, enquanto trabalhamos de maneira diligente para restaurar a liberdade ao povo.\n\nGostaríamos de agradecer nossos camaradas no [Root.GetName] pela assistência em fazer com que este dia se tornasse realidade.\n\nIsso é tudo."
 anomaly.5016.a: "Talvez, tudo vai dar certo."
 anomaly.5017.name: "Anúncio Público de Baldarak"
 anomaly.5017.desc: "Aqui é o Cidadão Fotanga! O Conselho Revolucionário Popular aprovou de maneira unânime a troca do nome do planeta de 'Baldarak' para 'Fotangia' para honrar a minha liderança.\n\nAlém disso, o planeta conhecido como 'Nova Baldarak' será conhecido, de hoje em diante, como 'Chabkymak' em homenagem a Chabky Raddh, nossa Ministra de Segurança Pública.\n\nIsso é tudo."
 anomaly.5017.b: "Chega. Bloqueie todas as transmissões futuras dessas criaturas."
 anomaly.5018.desc: "Aqui é o Cidadão Fotanga O Conselho Revolucionário Popular deseja anunciar a execução iminente de 4.539 indivíduos acusados de traição ao Estado e atividades contra-revolucionárias.\n\nQue isso sirva de aviso a todos que desejam ficar no caminho de nossa gloriosa revolução.\n\nIsso é tudo."
 anomaly.5019.desc: "Aqui é o Cidadão Rutmag! O Conselho Revolucionário Popular deseja anunciar a execução iminente do Ex-Cidadão Fotanga, que foi condenado por demagogia, corrupção e incompetência geral.\n\nEu estarei assumindo todas as suas responsabilidades. Meu primeiro decreto é que os nomes originais dos planetas Fotangia e Chabkymak sejam restaurados.\n\nIsso é tudo."
 anomaly.5020.desc: "Diversos cargueiros escoltados pelo [Root.GetName] lançaram os cilindros de carga contendo a força expedicionária Dathnak na atmosfera de Nova Baldarak. Logo depois, flashes puderam ser vistos por baixo da camada de nuvens do gigante gasoso. Parece que a luta começou."
 anomaly.5020.a: "Vamos esperar para ver o que acontece em seguida."
 anomaly.5021.name: "Força Expedicionária Toma o Controle"
 anomaly.5021.desc: "Aqui é o General Paltanak, falando a partir de Nova Baldarak. A Operação Fúria Gasosa foi um sucesso completo. Todos os objetivos primários foram capturados, e o controle do governo foi restaurado a todos os setores atmosféricos.\n\nTirando alguns pontos de resistência, a maioria das unidades rebeldes se rendeu ou foi encaminhada. Muito obrigado pelo apoio, [Root.Owner.GetSpeciesNamePlural]. Se você me der licença, preciso transmitir o relatório de mortes para Baldarak.\n\nCâmbio e desligo."
 anomaly.5021.a: "Uma operação bem executada."
 anomaly.5022.name: "Anúncio de Nova Baldarak"
 anomaly.5022.desc: "Aqui é o General Paltanak, governador militar temporário de Nova Baldarak. Tenho o prazer de anunciar o fim das principais operações de combate no setor 47-G. Pelo menos 512 insurgentes foram mortos desde que a operação iniciou há dois ciclos, enquanto nossas perdas foram mínimas.\n\nGratificações extras a todas as forças envolvidas por mantes as perdas civis em um nível aceitável.\n\nCâmbio e desligo."
 anomaly.5023.desc: "Aqui é o General Paltanak, governador militar de Nova Baldarak. Gostaria de me direcionar aos relatórios infundados que dizem que houve uma ressurgência na atividade rebelde neste mundo. Deixe-me dizer que nada poderia estar mais longe da verdade.\n\nEste planeta foi totalmente pacificado, e todos os elementos subversivos foram totalmente removidos. Seus cidadãos são novamente membros produtivos da grande nação Dathnak.\n\nCâmbio e desligo."
 anomaly.5024.desc: "Coronel Rapzak se apresentando, governador militar temporário de Nova Baldarak. É com pesar que informo à comunidade galática da morte do meu antecessor, General Paltanak. Após ser atraído para uma emboscada covarde das forças rebeldes, o General deu sua vida na tradição mais bela do serviço.\n\nUm funeral de Estado, com todas as honrarias, será realizado após a conclusão bem-sucedida de nossa ofensiva atual contra os postos rebeldes.\n\nCâmbio e desligo."
 anomaly.5025.name: "Academia Científica Baldarak"
 anomaly.5025.desc: "[Root.Owner.GetSpeciesNamePlural]! Solicitaram que eu falasse com vocês em nome da Academia Científica Baldarak. Apesar de nós, Dathnak, não possuirmos muito em termos de tecnologia, certamente somos capazes de razão elevada!\n\nAlguns de nossos think tanks passaram os últimos anos estudando física teórica, e gostaríamos de compartilhar as descobertas deles. Talvez os dados sirvam de alguma coisa para as atividades de construção de império que vocês sólidos tanto gostam."
 anomaly.5025.a: "Que gentil."
 anomaly.5026.name: "Faxina Geral"
 anomaly.5026.desc: "Olá, [Root.Owner.GetSpeciesNamePlural]!\n\nVocês poderiam fazer um favor? O poço gravitacional forte de Baldarak puxa todo o tipo de lixo para a nossa atmosfera, e em uma reunião de nosso conselho, decidimos melhorar nossos esforços de limpeza. Uma de nossas unidades de captura encontrou uma cápsula de carga descartada, e pensamos que você poderia nos ajudar a nos ver livre dela. Parece que ela contém grandes quantidades de metais sem valor."
 anomaly.5026.a: "Claro, jogaremos estes minerais fora para vocês..."
 henrik.16.name: "Projeto Especial Teste"
 henrik.16.desc: "Esse evento iniciará um Projeto Especial em [Root.GetName]."
 henrik.16.a: "Legal!"
 henrik.20.name: "Geração de Exércitos Hostis"
 henrik.20.desc: "Alguns exércitos hostis aparecerão em [Root.GetName]."
 henrik.20.a: "Às armas!"
 henrik.21.name: "Vitória!"
 henrik.21.desc: "Prevalecemos contra as forças maléficas do [From.GetName]!"
 henrik.22.name: "Derrota!"
 henrik.22.desc: "Fomos vencidos pelas forças maléficas do [From.GetName]!"
 henrik.145.desc: "Somos os [Root.GetSpeciesNamePlural]."
 henrik.166.desc: "O alvo do evento é o [test_target.GetName]"
 ####################################
 #Anomaly Failure Events
 ####################################
 DISC_FAILURE: "Falha"
 DISC_CRITICAL_FAILURE: "Falha Crítica"
 anomaly_failure.1.desc: "[Root.GetLeaderName], da equipe científica, ordenou que o [Root.GetName] enviasse uma sonda para investigar a cratera em [From.From.GetName]. Infelizmente, os propulsores de frenagem falharam e a sonda acabou batendo diretamente na nave caída no centro da cratera."
 anomaly_failure.2.desc: "Apesar de o asteroide [From.From.GetName] ser uma captura extra-solar, é completamente comum em todos os outros aspectos. [Root.GetLeaderName], da equipe científica, e a tripulação do [Root.GetName] pediram permissão para continuar a missão de exploração em outro lugar."
 anomaly_failure.3.desc: "A tripulação inteira do [Root.GetName] passou dias examinando os destroços na superfície de [From.From.GetName] em turnos rotativos. [Root.GetLeaderName], da equipe científica, reporta que nada de valor foi encontrado."
 anomaly_failure.4.desc: "Nenhuma fonte das estranhas emissões de energia vindo de [From.From.GetName] foi encontrada. [Root.GetLeaderName], da equipe científica, e o [Root.GetName] estão aguardando novas ordens."
 anomaly_failure.5.desc: "Enquanto estava tentando abrir a escotilha de docagem que encontramos em [From.From.GetName], o [Root.GetName] acidentalmente causou um tremor dentro do asteroide. Infelizmente, [Root.GetLeaderName], da equipe científica, deduziu que isso provavelmente levou à destruição do interior do asteroide."
 anomaly_failure.6.desc: "A investigação da imensa cratera na superfície do asteroide [From.From.GetName] não produziu nada de interesse. [Root.GetLeaderName], da equipe científica, ordenou o [Root.GetName] a descontinuar a missão."
 anomaly_failure.7.desc: "O [Root.GetName] teve uma tentativa falha de atracar com a estação espacial orbitando [From.From.GetName]. Infelizmente, a estação frágil se desintegrou por causa disso. [Root.GetLeaderName], da equipe científica, pede perdão."
 anomaly_failure.7.desc.mach: "O [Root.GetName] teve uma tentativa falha de atracar com a estação espacial orbitando [From.From.GetName]. Infelizmente, a estação frágil se desintegrou por causa disso. [Root.GetLeaderName], da equipe científica, relata que um erro infeliz de software no que diz respeito a cálculos de trajetória é o culpado."
 anomaly_failure.8.desc: "A fonte dos sinais de vida que foram reportados no asteroide [From.From.GetName], se é que havia algum, não foi encontrada apesar de análises repetidas pelo [Root.GetName]. [Root.GetLeaderName], da equipe científica, solicitou novas ordens."
 anomaly_failure.9.desc: "Se realmente há um objeto em algum lugar abaixo da atmosfera de [From.From.GetName], ele está muito no fundo para ser detectado pelos sensores do [Root.GetName]. [Root.GetLeaderName], da equipe científica, abandonou a busca."
 anomaly_failure.10.desc: "Após uma inspeção extensa na pequena lua ao redor de [From.From.GetName], a tripulação do [Root.GetName] não encontrou nada de valor. [Root.GetLeaderName], da equipe científica, encerrou a missão."
 anomaly_failure.11.desc: "Agindo sob ordens de [Root.GetLeaderName], da equipe científica, o [Root.GetName] enviou uma sonda para a atmosfera de [From.From.GetName] para investigar os sinais de vida que foram reportados. A presença de um ecossistema atmosférico rico foi descoberto, mas 3,4 segundos depois a sonda contaminou a atmosfera e desencadeou uma reação química em cadeia que se espalhou rapidamente pelo gigante gasoso. Nenhum sinal de vida pode ser detectado agora."
 anomaly_failure.12.desc: "Nada de especialmente interessante foi descoberto sobre a atmosfera de [From.From.GetName], apesar de uma análise extensa que incluiu uma rápida ida à atmosfera superior do gigante pelo [Root.GetName]. [Root.GetLeaderName], da equipe científica, recomendou o fim da missão."
 anomaly_failure.13.desc: "Conforme o [Root.GetName] se aproximou das estruturas aeróstatas na atmosfera de [From.From.GetName], a nave deve ter ativado algum tipo de alarme de proximidade. [Root.GetLeaderName], da equipe científica, reporta que as estruturas perderam de repente toda a flutuabiliade e despencaram para a atmosfera mais baixa do gigante gasoso."
 anomaly_failure.14.desc: "O [Root.GetName] sem querer esbarrou na cápsula de carga em órbita de [From.From.GetName] enquanto estava tentando recuperá-la. [Root.GetLeaderName], da equipe científica, reporta que a colisão enviou a cápsula mais fundo na atmosfera do gigante gasoso, de onde ela não pode mais ser recuperada."
 anomaly_failure.15.desc: "O campo de destroços que cerca [From.From.GetName] foi minunciosamente escaneado pelo [Root.GetName]. [Root.GetLeaderName], da equipe científica, reporta que não houve descobertas significativas."
 anomaly_failure.16.desc: "Apesar de uma investigação minunciosa, o [Root.GetName] ainda não foi capaz de deduzir o que causou o impacto gigantesco na cratera em [From.From.GetName]. [Root.GetLeaderName], da equipe científica, pede desculpas por esta falha."
 anomaly_failure.16.desc.mach: "Apesar de uma investigação minuciosa, o [Root.GetName] ainda não foi capaz de deduzir o que causou o impacto gigantesco na cratera em [From.From.GetName]. [Root.GetLeaderName], da equipe científica,  registrou a falha devido a um resíduo insuficiente restante na superfície da lua."
 anomaly_failure.17.desc: "Se houve leituras energéticas anômalas vindo de [From.From.GetName], parece que elas se foram já. [Root.GetLeaderName], da equipe científica, reporta que o [Root.GetName] não detectou coisa alguma deste tipo."
 anomaly_failure.18.desc: "HAVIA algum tipo de objeto não identificado em órbita ao redor de [From.From.GetName], mas o [Root.GetName] acidentalmente colidiu com ele quando estava chegando mais perto para investigar. [Root.GetLeaderName], da equipe científica, reporta que o objeto, infelizmente, foi destruído na colisão."
 anomaly_failure.19.desc: "Nenhuma característica diferente foi encontrada no pequeno asteroide que aparentemente foi rebocado em órbita de [From.From.GetName]. [Root.GetLeaderName], da equipe científica, está solicitando novas ordens para o [Root.GetName]."
 anomaly_failure.20.desc: "Infelizmente, o veleiro solar acima de [From.From.GetName] foi destruído em uma tentativa desastrada de [Root.GetLeaderName], da equipe científica, de trazê-lo de volta para o compartimento de carga do [Root.GetName]."
 anomaly_failure.21.desc: "O relatório inicial de inspeção, que mencionava sinais de vida originando da superfície de [From.From.GetName], deve ter sido errado, já que nada do tipo foi encontrado pelo [Root.GetName]. [Root.GetLeaderName], da equipe científica, reporta que o [From.From.GetPlanetMoon] agora parece estar completamente desprovido de vida."
 anomaly_failure.22.desc: "O que pensava-se ser uma estação orbital escondida acima de [From.From.GetName] foi identificada como o lixo ejetado pela mesma Nave Científica que conduziu a inspeção inicial do [From.From.GetPlanetMoon]. [Root.GetLeaderName], da equipe científica, e a tripulação do [Root.GetName] sugerem que esqueçamos este episódio vergonhoso e sigamos em frente."
 anomaly_failure.23.desc: "Após uma análise cuidadosa, [Root.GetLeaderName], da equipe científica, determinou que os destroços de nave encontrados acima de [From.From.GetName] originaram a partir de uma única barcaça de lixo. [Root.GetName] coletou alguns dos destroços, mas parecem ser completamente inúteis."
 anomaly_failure.24.desc: "Análises profundas do [Root.GetName] parecem ter ativado algum tipo de falha de energia em cascata no estaleiro antigo em órbita de [From.From.GetName]. Ele explodiu de maneira espetacular, de acordo com [Root.GetLeaderName], da equipe científica."
 anomaly_failure.25.desc: "As 'ruínas da cidade' que foram reportadas na superfície de [From.From.GetName] eram nada mais do que algumas formações rochosas de formato estranho. [Root.GetLeaderName], da equipe científica, pede desculpas pelo desperdício de recursos, e solicita uma nova missão para o [Root.GetName]."
 anomaly_failure.26.desc: "[Root.GetLeaderName], da equipe científica, reportou que a origem das marcas que foram observadas na superfície de [From.From.GetName] eram naturais. O [Root.GetName] precisa de uma nova tarefa."
 anomaly_failure.27.desc: "O [Root.GetName] perdeu o sinal fraco que estava vindo de [From.From.GetName], e, apesar dos melhores esforços de [Root.GetLeaderName], da equipe científica, todas as tentativas de rastreá-lo novamente falharam."
 anomaly_failure.28.desc: "A formação montanhosa 'não natural' que foi encontrada em [From.From.GetName] acabou sendo bem natural. [Root.GetLeaderName], da equipe científica, sente que seria um desperdício de recursos manter o [Root.GetName] um segundo a mais."
 anomaly_failure.29.desc: "Apesar de tentativas repetidas, [Root.GetLeaderName], da equipe científica, e o resto da tripulação do [Root.GetName] foram incapazes de localizar o objeto refletor que foi reportado na inspeção inicial de [From.From.GetName]. Talvez foi apenas um erro de sensor."
 anomaly_failure.30.desc: "O [Root.GetName] foi incapaz de localizar a fonte da transmissão fraca que detectamos vindo do interior de [From.From.GetName]. [Root.GetLeaderName], da equipe científica, reporta que a transmissão cessou completamente desde então."
 anomaly_failure.31.desc: "Apesar de análises repetidas pelo [Root.GetName], nenhum sinal da nave que supostamente estava escondida na atmosfera de [From.From.GetName] foi encontrada. [Root.GetLeaderName], da equipe científica, ficou em dúvida se ela existiu em algum momento."
 anomaly_failure.32.desc: "Após recalcular a órbita da lua que supostamente estava em uma rota de colisão com [From.From.GetName], [Root.GetLeaderName], da equipe científica, chegou à conclusão de que ela simplesmente passará de raspão. O [Root.GetName] deveria ser redesignado para lidar com assuntos mais importantes."
 anomaly_failure.33.desc: "Os sinais da atividade Vultaum na vizinhança de [From.From.GetName] acabaram sendo pistas falsas. [Root.GetLeaderName], da equipe científica, pediu para continuar a pesquisa do [Root.GetName] em outro lugar."
 anomaly_failure.34.desc: "Os sinais da atividade Yuht na vizinhança de [From.From.GetName] acabaram sendo pistas falsas. [Root.GetLeaderName], da equipe científica, pediu para continuar a pesquisa do [Root.GetName] em outro lugar."
 anomaly_failure.35.desc: "Os sinais da atividade da Primeira Liga na vizinhança de [From.From.GetName] acabaram sendo pistas falsas. [Root.GetLeaderName], da equipe científica, pediu para continuar a pesquisa do [Root.GetName] em outro lugar."
 anomaly_failure.36.desc: "Os sinais da atividade Irassiana na vizinhança de [From.From.GetName] acabaram sendo pistas falsas. [Root.GetLeaderName], da equipe científica, pediu para continuar a pesquisa do [Root.GetName] em outro lugar."
 anomaly_failure.37.desc: "Os sinais da atividade Cybrex na vizinhança de [From.From.GetName] acabaram sendo pistas falsas. [Root.GetLeaderName], da equipe científica, pediu para continuar a pesquisa do [Root.GetName] em outro lugar."
 anomaly_failure.400.desc: "Por motivos incertos, o Oficial Científico residente decidiu pegar uma nave do [Root.GetName] para investigar pessoalmente o asteroide [From.From.GetName]. Uma explosão foi detectada logo após, quando a nave acidentalmente atingiu a superfície do asteroide.\n\nUma Comissão de Inquérito acabou determinando que o cientista falecido não havia sido treinado para operar uma nave classe D."
 anomaly_failure.401.desc: "Enquanto estava manobrando para investigar [From.From.GetName], o [Root.GetName] acidentalmente colidiu com outro asteroide. A nave perdeu o controle até colidir com a superfície de [From.From.GetName], mergulhando fundo na crosta do asteroide.\n\nO Oficial Científico a bordo e o restante da tripulação foram dados como perdidos."
 anomaly_failure.402.desc: "Enquanto estava manobrando para investigar [From.From.GetName], o [Root.GetName] acidentalmente colidiu com outro asteroide. A nave perdeu o controle até colidir com a superfície de [From.From.GetName], mergulhando fundo na crosta do asteroide.\n\nUm pequeno grupo de sobreviventes, incluindo [Root.GetLeaderName], da equipe científica, conseguiu escapar da nave condenada em uma cápsula de fuga."
 anomaly_failure.403.desc: "Este asteroide serve como uma chocadeira para uma forma de vida baseada no vácuo! Diversos deles saem agressivamente da sua rede de túneis para defender agressivamente o território contra [Root.GetName]."
 creature_nest: "Criaturas hostis se aproximando rapidamente!"
 anomaly_failure.404.desc: "Vários drones militares dormentes, projetados por alguma civilização há muito tempo, estão acumulados em uma pequena cratera no lado oposto de [From.From.GetName]. Conforme o [Root.GetName] chega perto do alcance dos sensores passivos, os drones são ligados em uma tentativa de cumprir sua antiga programação - defender o sistema contra intrusos a qualquer custo."
 dormant_drones: "Drones de ataque se aproximando!"
 anomaly_failure.405.desc: "Análises ativas do [Root.GetName] pegaram brevemente diversas estruturas na superfície de [From.From.GetName], mas o sinal foi apagado por interferências logo após. Várias naves piratas saíram em disparada de um hangar escondido no asteroide e agora estão se aproximando em formação de ataque!"
 pirate_outpost: "Esses piratas não estão de brincadeira!"
 anomaly_failure.900.desc: "Notícias trágicas de [From.From.GetName]. [Root.GetLeaderName], da equipe científica, perdeu a vida devido a uma descarga elétrica enquanto viajava em um pequeno transporte, dentro da atmosfera superior do gigante gasoso. A tripulação do [Root.GetName] abortou sua missão."
 anomaly_failure.901.desc: "Ainda estamos tentando juntar os detalhes, mas por algum motivo parece que [Root.GetLeaderName], da equipe científica, ordenou que o [Root.GetName] fosse para a atmosfera superior de [From.From.GetName] para investigar uma anomalia nos sensores. Assim que chegou ao local, a tensão no casco da nave acabou ficando muito forte, e ela foi perdida junto com toda a tripulação."
 anomaly_failure.902.desc: "Ao conduzir análises profundas de [From.From.GetName], o [Root.GetName] sofreu uma falha no reator e ficou preso dentro do poço gravitacional do gigante gasoso. [Root.GetLeaderName], da equipe científica, supervisionou com sucesso a evacuação de toda a tripulação, mas a nave foi puxada para a atmosfera densa do planeta e nunca mais foi vista."
 anomaly_failure.903.desc: "Enquanto estava se aproximando de [From.From.GetName], o [Root.GetName] esbarrou em duas naves escondidas na sombra dos sensores do gigante gasoso. Eles parecem ser contrabandistas participando de algum tipo de encontro clandestino. Assim que viram você, as naves contrabandistas se desconectaram uma da outra e ativaram as armas. A intenção deles é sair sem deixar testemunhas!"
 smuggler_rendezvous: "Os contrabandistas atacam!"
 anomaly_failure.1400.desc: "Durante as operações acima de [From.From.GetName], o [Root.GetName] sofreu um rompimento de contenção no núcleo do seu reator. A segurança de todos na nave foi posta em risco, mas graças a um ato corajoso de sacrifício de [Root.GetLeaderName], da equipe científica, a casa de máquinas foi purificada de toda a radiação. Infelizmente, [Root.GetLeaderName] recebeu uma dose letal de radiação e acabou perdendo a vida."
 anomaly_failure.1400.desc.mach: "Durante as operações acima de [From.From.GetName], o [Root.GetName] sofreu um rompimento de contenção no núcleo do seu reator. Como a segurança de toda a nave estava em jogo, o seu Oficial Científico fez a conclusão lógica de se sacrificar para expurgar a casa de máquinas da radiação, baseado em ponderação de mortes pré-programada. No processo, [Root.GetLeaderName] recebeu uma dose de radiação grande o suficiente para resultar em uma ionização de semi condutor e dano de remoção da estrutura de silício, tornando-os permanentemente inoperantes. Porém, a nave e a tripulação restante foram salvos."
 anomaly_failure.1401.desc: "Enquanto estava redirecionando a energia para a sua rede de sensores principais, o [Root.GetName] passou por uma falha de reator crítica acima de [From.From.GetName]. [Root.GetLeaderName], da equipe científica, morreu na explosão, juntamente com o resto da tripulação."
 anomaly_failure.1402.desc: "Não temos certeza de como isso aconteceu, mas de alguma forma [Root.GetLeaderName], da equipe científica, sem querer iniciou a sequência de auto destruição no [Root.GetName] enquanto estava fazendo uma simulação relacionada ao [From.From.GetName] no computador de bordo da nave. Todas as tentativas de abortar a sequência falharam, e a tripulação inteira foi forçada a evacuar antes que a nave fosse destruída."
 anomaly_failure.1403.desc: "Diversas naves piratas de repente decolaram de onde estavam escondidas na superfície de [From.From.GetName]. Parece que o [Root.GetName] acidentalmente passou por um ancoradouro pirata, e os pernas de pau não estão nem um pouco felizes com essa invasão!"
 pirate_anchorage: "Naves se aproximando com intenção hostil!"
 anomaly_failure.1404.desc: "O espaço orbital sobre [From.From.GetName] aparentemente está sendo usado como algum tipo de local de acasalamento de uma espécie grande e agressiva de criaturas espaciais. Raivosos por terem sido interrompidos pelo [Root.GetName] no meio do acasalamento, duas das criaturas partem para lidar com o intruso."
 mating_ground: "Estas criaturas parecem estar bem agitadas."
 anomaly_failure.1405.desc: "Um pequeno esquadrão de drones de combate antigos parece ter sido abandonado na órbita de [From.From.GetName] após uma batalha há muito esquecida. Conforme os sensores do [Root.GetName] varrem sobre eles, os drones são ligados e entram em modo de ataque!"
 combat_drones: "Eles estão chegando, com as armas ativadas!"
 ####################################
 #Colony Events
 ####################################
 colony.1.name: "Florestas Migratórias"
 colony.1.desc: "A superfície de [Root.GetName] é coberta por florestas vistosas, com grandes árvores análogas com centenas de metros de altura. O interessante é que nossos colonizadores descobriram que quase toda a flora é móvel em diversos níveis. As florestas que se estendem por quilômetros, lentamente migrarão para novas áreas ricas em nutrientes em um ciclo que parece atrelado à orbita do [Root.GetPlanetMoon].\n\nInfelizmente, isso dificultou seriamente nossos esforços em desenvolver a infraestrutura da colônia. As árvores migratórias frequentemente cortam linhas de energia enquanto destroem nossas árvores e estradas."
 colony.1.a: "Precisamos encontrar uma solução."
 colony.2.desc: "Aprendemos que as florestas migratórias de [From.From.GetName] evitam certas regiões que são o lar de colônias de um pseudo-inseto nativo. Estes insetos lançam um feromônio que pode ser usado para manobrar as árvores perambulantes para longe dos centros populacionais.\n\nAlém do mais, as áreas onde as florestas mais frequentam foram fechadas como reservas naturais. Nossos biólogos podem aprender muito ao estudar essa reserva nas regiões vizinhas."
 colony.2.a.tooltip: "Modificador §YFlorestas Migratórias Dóceis§! adicionado, dando os seguintes efeitos:\n£blocker£ §YReserva Florestal Vagante§! adicionado, melhorando a Pesquisa de £society£ em quadrados vizinhos"
 colony.3.desc: "Um bombardeio de napalm foi eficaz ao dizimar as florestas migratórias em [From.From.GetName]. As gigantescas tempestades de fogo deixaram no seu rastro uma paisagem queimada, na qual nossos ecologistas plantaram árvores mais tradicionais e significativamente menos móveis. Perdas na vida selvagem do [From.From.GetPlanetMoon] foram imensas, mas dentro dos limites aceitáveis."
 colony.4.name: "Ascensão das Árvores"
 colony.4.desc: "As florestas migratórias de [Root.GetName] ressurgiram! Sabíamos que bolsões isolados do tipo deles haviam sobrevivido em diversas áreas remotas, mas elas pareciam dormentes. Parece que elas usaram essa distração para reabastecer os seus números, e começaram a atacar sistematicamente nossos assentamentos. Ao contrário do que acreditávamos, elas claramente possuem alguma forma de inteligência rudimentar, e querem vingança!\n\n"
 colony.4.a: "Elas devem ser detidas!"
 tree_armies: "Hordas de árvores estão atacando nossos colonizadores em [Root.GetName]!"
 colony.5.name: "Queda das Árvores"
 colony.5.desc: "Muitos assentamentos e vidas foram perdidas para as árvores violentas em [From.From.GetName], mas conseguimos nos defender e exterminar todas elas. Esquadrões equipados com lança-chamas estão se certificando que nenhuma escapará dessa vez."
 colony.5.a: "Isso vai ensinar uma lição a elas."
 colony.6.name: "Veios Minerais"
 colony.6.desc: "Descobrimos diversos veios minerais significativos que até então estavam escondidos pelas florestas perambulantes de [Root.GetName]. Agora que as árvores foram reduzidas a cinzas, os veios são fáceis de serem acessados. Revisamos a quantidade mineral do [Root.GetPlanetMoon]."
 colony.7.name: "Depósito de Metais Preciosos"
 colony.7.desc: "Descobrimos um depósito mineral significativo que até então estava escondido pelas florestas perambulantes de [Root.GetName]. Agora que as árvores foram reduzidas a cinzas, o depósito está fácil de ser acessado. Revisamos a quantidade de recursos do [Root.GetPlanetMoon]."
 colony.8.name: "Dano Ecológico"
 colony.8.desc: "Parece que as florestas migratórias que exterminamos em [Root.GetName] desempenhavam um papel mais vital na ecologia do [Root.GetPlanetMoon] do que pensávamos. Os incêndios que iniciamos e a ausência das florestas levaram à extinção de diversas espécies locais, resultando em um efeito dominó que também tirou a vida de diversas espécies de predadores.\n\nOs esforços continuam para tentar restaurar parcialmente o frágil equilíbrio ecológico ao introduzir nova flora e fauna de outros mundo, mas é um processo difícil que levará tempo."
 colony.9.name: "Adaptação Florestal"
 colony.9.desc: "A interação contínua entre nossos colonizadores e as florestas perambulantes em [Root.GetName] revelou que as árvores possuem algum tipo de inteligência comunal rudimentar. Parece que eles se adaptaram à nossa presença, e agora estão saindo do nosso caminho para evitar danificar as propriedades de nossos colonizadores, mesmo sem o uso do feromônio dos insetos. A moral dos colonizadores aumentou."
 colony.10.name: "Pesquisa Florestal"
 colony.10.desc: "Aprendemos muita coisa vivendo próximo às florestas perambulantes em [Root.GetName]. Alguns colonizadores aventureiros até construíram casas na copa de algumas das árvores maiores, seguindo as florestas enquanto elas migravam pelo [Root.GetPlanetMoon]. Alguns dos biólogos mais importantes em [Root.Owner.GetName] passaram bastante tempo estudando essas árvores únicas."
 colony.11.name: "Fogo Florestal"
 colony.11.desc: "Um fogo florestal causado por um raio em [Root.GetName] criou algo parecido com o estouro da boiada nas florestas migratórias do [Root.GetPlanetMoon]. O pânico selvagem trouxe elas a áreas que estavam evitando até então, resultando em um dano grande à infraestrutura colonial."
 colony.12.name: "Florestas Perambulantes Migram"
 colony.12.desc: "As autoridades coloniais em [Root.GetName] reportaram que uma das florestas migratórias locais migraram para outra região em [Root.GetPlanetMoon]! Centenas de milhares de árvores arrancaram suas raízes e marcharam juntas para esta nova área, esmagando tudo que estivesse no caminho."
 colony.50.name: "Perturbações Sísmicas"
 colony.50.desc: "Tem havido muitos relatos de perturbações sísmicas inexplicáveis em [Root.GetName]. Os tremores podem ser sentidos por todo o lugar e muitos de nossos assentamentos sofreram danos. Enquanto investigavam os terremotos, nossos cientistas descobriram uma ampla rede de cavernas subterrâneas.\n\nA mais profunda é o lar de algum tipo de civilização nativa, e parece que ela está cavando um túnel em direção à superfície! As vibrações terrestres dos nossos assentamentos podem ter causado esse comportamento, mas não temos certeza. Não há como saber como esses alienígenas reagirão quando saírem dos túneis e encontrarem nossos colonizadores!"
 colony.50.desc.subterranean: "Tem havido muitos relatos de perturbações sísmicas inexplicáveis em [Root.GetName]. Os tremores podem ser sentidos por todo o lugar, e muitos de nossos assentamentos sofreram danos. Enquanto investigavam os terremotos, nossos cientistas descobriram uma ampla rede de cavernas no manto do planeta.\n\nA mais profunda é o lar de algum tipo de civilização nativa, e parece que ela está cavando um túnel em direção à nossa colônia! Vibrações diárias resultantes das atividades em nossos assentamentos podem ter causado esse comportamento, mas não temos certeza. Não há como saber como esses alienígenas reagirão quando saírem dos túneis e encontrarem nossos colonizadores!"
 colony.50.a: "Temos que lidar com essa situação."
 colony.51.desc: "Uma de nossas sondas cavou o chão e interceptou o túnel dos alienígenas em [From.From.GetName]. Após os trabalhadores alienígenas terem se acalmado, a sonda teve sucesso em estabelecer comunicações com os líderes deles."
 colony.51.a: "Abrir um canal."
 colony.52.desc: "Nossos esforços para eliminar os alienígenas de [Root.Owner.GetSubMantleLower], em [Root.GetName], tiveram sucesso! Conseguimos desabar vários túneis em cima dos trabalhadores, e as cavernas que abrigavam as cidades deles foram invadidas por gás nervoso.\n\nAs estimativas de mortes estão próximas dos 100%, e nossas forças de segurança estão confiantes de que vão conseguir lidar com quaisquer sobreviventes."
 colony.52.a: "Meus cumprimentos a todos os níveis de serviço envolvidos."
 colony.53.name: "Alienígenas de [Root.owner.GetSubMantleUpper]"
 colony.53.desc: "Isso tá ligado? Podem nos ver, superficiais? Compreendemos que vocês vêm do Grande Nada que está acima, além da pedra. Imaginávamos que nenhum ser vivo poderia existir lá, mas é claro que isso não é verdade. Quais são suas intenções?"
 colony.53.a: "Falem-nos sobre vocês."
 colony.53.desc.subterranean: "Isto tá ligado? Conseguem nos ver, amigos da crosta? Vimos que vocês nos saúdam do Grande Nada, que fica mais para cima ainda, além do magma e das rochas. Imaginávamos que nenhum ser vivo conseguiria existir lá, mas isso claramente não é verdade. Quais são as intenções de vocês?"
 colony.53.a.response: "Nosso império se estende por cada canto do mundo conhecido. Somente o Grande Nada está fora do nosso alcance. Temos muitas cidades boas, abastecidas por fazendas de líquens e pelos peixes que pescamos nos grandes rios que fluem pelos nossos túneis.\n\nAssim tem sido há milhares de anos. Nossos cavadores ouviram os ecos fracos de suas cidades através da pedra e decidimos investigar."
 colony.53.b: "Gostaríamos de coexistir em paz."
 colony.53.b.response: "Então que seja assim, superficial! Vamos dividir este mundo juntos no espírito da paz. Estaríamos muito interessados em fazer comércio com o seu povo. Acredito que temos muito a oferecer um para o outro. Retornaremos às nossas cidades e faremos os preparativos."
 colony.53.b.response.subterranean: "Então que assim seja, \"crosteiros\"! Vamos compartilhar este mundo em paz. Estamos muito interessados em fazer comércio com o seu povo. Acredito que temos muito a oferecer um ao outro. Vamos voltar às nossas cidades e fazer os preparativos."
 colony.53.c: "Submeta-se, ou seja destruído."
 colony.53.c.response: "Ha! É você quem se submeterá a nós! Poderíamos ter vivido lado a lado em paz, mas agora nossos exércitos tomarão o Grande Nada e anexaremos ele ao nosso império. Sempre foi o nosso destino reinar sobre toda a criação."
 colony.54.name: "Invasão de [Root.Owner.GetSubMantleUpper]!"
 colony.54.desc: "Os alienígenas subterrâneos em [Root.GetName] surgiram na superfície! Grandes exércitos equipados com armas de projéteis primitivas, porém letais, estão saindo dos túneis, e a vanguarda deles já iniciou um ataque em nossos assentamentos.\n\nNossas forças de segurança estão respondendo, mas talvez precisaremos enviar reforços!"
 colony.54.desc.subterranean: "Os alienígenas que habitam o magma de [Root.GetName] apareceram em nossas cavernas! Exércitos grandes equipados com armas de projéteis primitivas, porém letais estão saindo dos túneis, e a vanguarda deles já começou a atacar nossos assentamentos.\n\nNossas forças de segurança estão reagindo, mas talvez precisemos enviar reforços!"
 colony.54.a: "Às armas!"
 subterranean_invasion: "Exércitos hostis estão atacando nossa colônia em [Root.GetName]!"
 colony.55.desc: "Os terremotos que atormentavam [From.From.GetName] estavam sendo causados pelos esforços de construção de túneis de uma civilização subterrânea nativa até então desconhecida! Eles romperam a superfície, e grandes exércitos equipados com armas de projéteis primitivas, porém letais estão saindo dos túneis. A vanguarda deles já começou a atacar nossos assentamentos. Nossas forças de segurança estão reagindo, mas talvez precisemos de reforços!"
 colony.56.name: "Vitória em [From.From.GetName]!"
 colony.56.desc: "Nossas forças conseguiram enviar os alienígenas subterrâneos em [From.From.GetName] de volta para suas tocas subterrâneas, e eles foram contidos por enquanto. Porém, isso é uma solução temporária, e é só uma questão de tempo até que eles saiam para a superfície novamente.\n\nPrecisamos atacá-los embaixo da terra, e nossos estrategistas fizeram um novo plano de ataque. Foi adicionado ao nosso Registro de Situações."
 colony.56.desc.subterranean: "Nosso exército conseguiu mandar os alienígenas nativos do manto em [From.From.GetName] de volta para as tocas deles no magma, e eles estão contidos por enquanto. Porém, isso é uma solução temporária, e é só uma questão de tempo até que invadam nossas cavernas novamente.\n\nPrecisamos atacá-los embaixo da terra, e nossos estrategistas elaboraram um novo plano de ofensiva. Ele foi adicionado ao Registro de Situações."
 colony.56.a: "Precisamos resolver este problema de vez."
 colony.57.name: "Derrota em [From.From.GetName]!"
 colony.57.desc: "Nossas forças foram dizimadas em [From.From.GetName], e os alienígenas de [Root.Owner.GetSubMantleLower] passaram a controlar todos os nossos assentamentos! Eles estão usando um de nossos próprios satélites para enviar uma mensagem para nós."
 colony.58.desc: "Criaturas da Superfície! Nossos gloriosos exércitos derrotaram vocês na batalha, e os espólios de suas cidades agora são nossos para fazermos o que quisermos. Aprendemos muito com suas máquinas, e nossas armas agora são mais poderosas do que nunca.\n\nNão se aproxime deste mundo novamente!"
 colony.58.desc.subterranean: "Criaturas amigas da crosta! Nossos gloriosos exércitos derrotaram vocês na batalha, e os espólios das suas cidades agora são nossos para fazermos o que quisermos. Aprendemos muito com as suas máquinas, e nossas armas estão mais poderosas do que nunca.\n\nNão se aproximem deste mundo novamente!"
 colony.58.a: "Quanta coragem."
 colony.59.name: "Alienígenas na Superfície"
 colony.59.desc: "Os alienígenas subterrâneos em [From.From.GetName] surgiram na superfície! Sua excursão parece limitada a pequenos bandos de exploradores e comerciantes. Eles podem estar querendo coexistir de maneira pacífica com nossos colonizadores, e talvez até iniciar uma troca. Fomos contactados por um dos seus representantes."
 colony.59.desc.subterranean: "Os alienígenas nativos do magma de [From.From.GetName] apareceram nas nossas cavernas! A excursão deles parece limitada a pequenos grupos de exploradores e comerciantes. Eles podem querer coexistir de maneira pacífica com os nossos colonizadores, e talvez até praticar comércio. Fomos contactados por um dos representantes desse povo."
 colony.59.a: "Vejamos o que eles têm a dizer."
 colony.60.desc: "Os alienígenas subterrâneos em [Root.GetName] juntaram forças suficientes no império subterrâneo deles para lançar outra invasão na superfície! Novamente, seus exércitos raivosos estão saindo de túneis recém cavados para nos desafiar."
 colony.60.desc.subterranean: "Os alienígenas nativos do magma de [Root.GetName] reuniram tropas suficientes em seu império para invadir nossas cavernas novamente! Mais uma vez, os exércitos enfurecidos estão saindo de túneis recém-cavados para nos enfrentar."
 colony.60.a: "Precisamos lutar contra eles novamente!"
 subterranean_invasion_2: "Exércitos hostis estão atacando nossa colônia em [Root.GetName]!"
 colony.61.name: "Desabamento"
 colony.61.desc: "Notícias graves vindas de [Root.GetName]! Os alienígenas de [Root.Owner.GetSubMantleLower] que estamos enfrentando de alguma forma conseguiram fazer o chão desabar sob um exército que estava próximo a uma das entradas dos túneis.\n\nOs poucos soldados que sobreviveram à queda foram massacrados pelos alienígenas antes de serem alcançados por nossas tropas restantes."
 colony.61.a: "Eles pagarão por isso!"
 colony.62.name: "Grupamentos de Ataque"
 colony.62.desc: "Os alienígenas vivendo abaixo de nossa colônia em [Root.GetName] têm enviado pequenos grupamentos de ataque a partir dos túneis a noite. Os ataques destruíram uma das maiores instalações da colônia, e antes que nossas forças pudessem responder, os atacantes desapareceram embaixo da terra."
 colony.62.a: "Estes ataques devem parar!"
 colony.63.name: "Ataque na Superfície"
 colony.63.desc: "Houve outro ataque em [Root.GetName]! Os alienígenas de [Root.Owner.GetSubMantleLower] surgiram de novos túneis no meio de um de nossos principais assentamentos. Eles superaram as defesas locais e massacraram nossos colonizadores. Alguns sobreviventes foram arrastados aos gritos para o subterrâneo quando os alienígenas voltaram para os túneis."
 colony.63.a: "Estes assassinatos não ficarão sem resposta."
 colony.64.name: "Bolsão de Sobreviventes"
 colony.64.desc: "Nosso exército em [Root.GetName] ainda está mapeando a rede de túneis embaixo da nossa colônia. Eles encontraram uma cidade grande dos alienígenas de [Root.Owner.GetSubMantleLower] que conseguiram se isolar do resto do império subterrâneo antes de enchermos a região com gás nervoso. Há milhões de alienígenas assustados lá. Nossos engenheiros devem fazer a caverna desmoronar para terminar o serviço?"
 colony.64.a: "Sim. Acabe com o sofrimento deles."
 colony.64.b: "Não! Traga-os à superfície, onde eles nos servirão."
 colony.64.b.subterranean: "Não! Leve-os para a colônia para que se tornem nossos serviçais."
 colony.65.name: "Expansão de [Root.Owner.GetSubMantleUpper]"
 colony.65.desc: "Terminamos de limpar o gás nervoso e os corpos de alienígenas mortos da rede de túneis em [Root.GetName]. Agora deve ser seguro para nossos colonizadores se mudarem para lá. As cidades primitivas que os alienígenas deixaram para trás serão demolidas, é claro, e substituídas por nossa arquitetura avançada."
 colony.66.name: "Ouro!"
 colony.66.desc: "Prospectores se aventuraram em alguns dos túneis mais fundos que já pertenceram aos alienígenas subterrâneos, agora mortos, em [Root.GetName]. Eles finalmente descobriram as minas de ouro de onde se acreditava que o império alienígena tenha adquirido sua grande reserva de metais preciosos."
 colony.66.desc.subterranean: "Prospectores se aventuraram em alguns dos túneis mais fundos que já pertenceram aos habitantes do magma, agora mortos, em [Root.GetName]. Eles finalmente descobriram as minas de ouro de onde se acreditava que o império alienígena tenha adquirido sua grande reserva de metais preciosos."
 colony.67.name: "Tesouro"
 colony.67.desc: "As unidades de exploração que estavam vasculhando a rede de túneis em [Root.GetName] entraram no palácio real naquilo que já foi a capital do império subterrâneo alienígena. O cadáver do que era o imperador deles ainda está montado em um trono gigantesco na câmara principal.\n\nApós utilizar explosivos para romper o tesouro do palácio, nossos exploradores encontraram-no cheio de ouro e arte alienígena estranha. A arte será enviada de volta para museus em [From.Owner.Capital.GetName], e a venda do ouro dará um grande impulso para o nosso orçamento nacional."
 colony.68.name: "Terremotos em [Root.GetName]"
 colony.68.desc: "Uma nova onda de terremotos sacudiu [Root.GetName] recentemente. Parece que sem os alienígenas de [Root.Owner.GetSubMantleLower] para manter a rede subterrânea de túneis, algumas das partes mais profundas dela desabaram. Muitos de nossos assentamentos sofreram danos."
 colony.69.name: "Fome"
 colony.69.desc: "Fomos abordados por uma delegação dos alienígenas de [Root.Owner.GetSubMantleLower] em [Root.GetName]. Parece que o império deles está passando por momentos difíceis, e a fome é uma ameaça cada vez mais próxima. Eles estão suplicando que a gente forneça qualquer ajuda possível."
 colony.69.a: "É claro. Ajudaremos como der."
 colony.69.b: "Eles terão que se virar."
 subterraneans_pleased: "As relações com a civilização de [Root.Owner.GetSubMantleLower] vão melhorar."
 subterraneans_displeased: "As relações com a civilização de [Root.Owner.GetSubMantleLower] vão ser prejudicadas."
 colony.70.name: "Presente"
 colony.70.desc: "Como um presente para comemorar a amizade entre as nossas duas civilizações, uma caravana dos alienígenas subterrâneos em [Root.GetName] trouxe uma grande quantidade de pedras preciosas para a superfície. Aparentemente, essas pedras são extraídas das áreas próximas do núcleo nas quais o império deles ousa se aventurar."
 colony.70.desc.subterranean: "Como um presente para comemorar a amizade entre as nossas duas civilizações, uma caravana dos habitantes do magma de [Root.GetName] trouxe uma grande quantidade de pedras preciosas para as nossas cavernas. Aparentemente, essas pedras são extraídas das áreas próximas do núcleo nas quais a civilização deles ousa se aventurar."
 colony.70.a: "Quanta Gentileza."
 colony.71.name: "Refugiados de [root.Owner.GetSubMantleUpper]"
 colony.71.desc: "Um grande grupo de refugiados do império alienígena subterrâneo em [Root.GetName] recentemente saiu dos túneis para a superfície porque estava sendo caçado por um pequeno exército. Aparentemente, eles fazem parte de uma minoria religiosa que está sofrendo perseguição.\n\nSe deixarmos que se juntem aos nossos colonizadores na superfície, isso sem dúvida despertará a ira dos governantes do império de onde fugiram. Porém, se deixarmos o exército perseguidor levá-los de volta para o subterrâneo, eles provavelmente serão executados."
 colony.71.desc.subterranean: "Um grande grupo de refugiados do império que se localiza no magma de [Root.GetName] recentemente saiu dos túneis para as nossas cavernas porque estava sendo caçado por um pequeno exército. Aparentemente, eles fazem parte de uma minoria religiosa que está sofrendo perseguição.\n\nSe deixarmos que se juntem aos nossos colonizadores nas cavernas superiores, isso sem dúvida despertará a ira dos governantes do império de onde fugiram. Porém, se deixarmos o exército perseguidor levá-los de volta para o subterrâneo, eles provavelmente serão executados."
 colony.71.a: "Deixe que eles se juntem à nossa colônia, se assim desejarem."
 colony.71.b: "Não podemos passar por um incidente político. Mande-os de volta."
 colony.72.name: "Antropólogos Xeno"
 colony.72.desc: "Diversos xenoantropólogos de [Root.Owner.Capital.GetName] retornaram para a superfície de [Root.GetName] após passarem um longo período vivendo entre os alienígenas de [Root.Owner.GetSubMantleLower] nativos desse mundo. Eles aprenderam muito sobre os costumes e tradições antigas desses seres, o que sem dúvida beneficiará nossa pesquisa de sociedade."
 colony.73.desc: "Houve uma onda de terremotos em [Root.GetName] recentemente, e construções em diversos de nossos assentamentos desabaram, resultando em várias fatalidades. O império alienígena de [Root.Owner.GetSubMantleLower] está fazendo outra caverna no subterrâneo para construir uma nova cidade. Parece que é isso que está causando os terremotos."
 colony.73.a: "Dar a outra face."
 colony.73.b: "Exigimos um pedido de desculpas!"
 colony.74.name: "Solicitação de Tecnologia"
 colony.74.desc: "Após verem as armas avançadas das nossas forças de segurança, diversos generais do império alienígena de [Root.Owner.GetSubMantleLower] em [Root.GetName] vieram até nós para solicitar que compartilhemos algumas de nossas tecnologias militares.\n\nNossos oficiais estão hesitantes para fazer isso, já que tornaria mais difícil derrotar os alienígenas em uma batalha, se chegarmos a esse ponto. Porém, se recusarmos o pedido, os alienígenas verão isso como um insulto."
 colony.74.a: "Dar armas modernas a selvagens seria uma má ideia."
 colony.74.b: "Eles são nossos amigos. Vamos compartilhar o que pudermos."
 colony.75.name: "Mensagem Entregue"
 colony.75.desc: "O comércio com os alienígenas de [Root.Owner.GetSubMantleLower] em [Root.GetName] diminuiu recentemente, com as caravanas deles aparecendo cada vez menos. Hoje, nós recebemos uma mensagem de um representante das forças armadas desse povo. Eles não parecem muito contentes."
 colony.75.a: "Vejamos."
 colony.76.name: "Mensagem"
 colony.76.desc: "Superficial. Tentamos ser bons vizinhos, mas parece claro que você não tem intenção de nos tratar com o respeito que nossa civilização gloriosa merece.\n\nNosso imperador decretou então que devemos reivindicar esse mundo inteiro para nós mesmos, conforme é o nosso direito. Vamos mandar vocês de volta para as estrelas de onde vieram!"
 colony.76.desc.subterranean: "Amigo da crosta. Nós tentamos ser bons vizinhos, mas está claro que vocês não têm intenção de nos tratar com o respeito que a nossa gloriosa civilização merece.\n\nNosso imperador decretou então que devemos tomar este mundo inteiro, como é de nosso direito. Vamos mandar vocês de volta para as estrelas de onde vieram!"
 colony.76.a: "Isso não é bom."
 colony.100.name: "Equipamento de Terraformação Abandonado"
 colony.100.desc: "Desde o nosso assentamento inicial em [Root.GetName], diversas anomalias na biosfera do [Root.GetPlanetMoon] foram descobertas. O ecossistema é instável e não se desenvolveu de acordo com os modelos projetados para um mundo deste tipo. Nossos cientistas suspeitam de interferência externa, e essas suspeitas foram confirmadas!\n\nAlguns de nossos colonizadores descobriram um grande complexo de terraformação subterrâneo que foi construído há milhares de anos. O equipamento aparentemente foi desativado no meio do processo de terraformação, deixando a biosfera do [Root.GetPlanetMoon] no seu estado não terminado atual. Se fornecermos energia suficiente, seremos capazes de reativar o maquinário. Porém, não podemos dizer qual vai ser o resultado final..."
 colony.100.a: "Quem poderia ter construído isso?"
 colony.101.name: "Complexo de Terraformação Desmontado"
 colony.101.desc: "Nossos cientistas terminaram de supervisionar a desmontagem segura do complexo de terraformação abandonado em [Root.GetName]. Ainda não temos informações sobre quem o construiu, mas o equipamento é incrivelmente avançado. Ele deve fornecer um impulso bem-vindo à nossa pesquisa de métodos de terraformação."
 colony.102.name: "Clima Instável"
 colony.102.desc: "Em grande parte devido ao processo de terraformação interrompido em [Root.GetName], o [Root.GetPlanetMoon] possui um clima um tanto instável. Tempestades violentas, que não podem ser previstas pelos nossos modelos climáticos, geralmente se materializam sem avisar. Uma tempestade dessas devastou um grande assentamento, resultando em diversas mortes e muitas propriedades destruídas."
 colony.103.name: "Seca"
 colony.103.desc: "O clima instável em [Root.GetName] resultou em uma forte seca que afeta uma porção significativa do [Root.GetPlanetMoon]. Os colonizadores vivendo nestas regiões solicitaram a [Root.Owner.Capital.GetName] apoio financeiro para melhorar as condições de vida."
 colony.103.a: "Estes são os riscos da colonização. Eles terão que se virar."
 colony.103.b: "Dê a eles o que estão pedindo."
 colony.104.desc: "O processo de terraformação abortado em [Root.GetName] finalmente foi completo. Após semear a atmosfera com bilhões de nanobots de terraformação, a maquinaria de bio-engenharia alienígena alterou significativamente as condições na superfície do [Root.GetPlanetMoon]. O ecossistema e o clima foram estabilizados, e foi introduzida uma nova biota alienígena adaptada a este clima."
 colony.104.a: "Vamos ver o que aconteceu..."
 abandoned_terraforming_completed: "O mundo foi terraformado em um habitat diferente."
 colony.105.desc: "O processo de terraformação abortado em [Root.GetName] finalmente foi completo. Após semear a atmosfera com bilhões de nanobots de terraformação, a maquinaria de bio-engenharia alienígena alterou significativamente as condições na superfície.\n\nPorém, parece que algo deu errado quando os nanobots projetaram a nova biota do [Root.GetPlanetMoon]. Eles produziram milhões de criaturas terrivelmente deformadas. A maioria delas morreu momentos depois, quando os corpos retorcidos colapsaram, mas os sobreviventes se juntaram em uma horda pulsante e barulhenta. Para piorar a situação, eles parecem estar indo em direção aos nossos assentamentos."
 colony.105.a: "É como se fosse um pesadelo!"
 terraforming_mutants_attack: "As criaturas mutantes estão atacando nossos colonizadores!"
 colony.106.desc: "O processo de terraformação abortado em [Root.GetName] finalmente foi completo. Após semear a atmosfera com bilhões de nanobots, a maquinaria de bio-engenharia alienígena alterou significativamente as condições na superfície do [Root.GetPlanetMoon]. O ecossistema e o clima foram estabilizados, e foi introduzida uma nova biota alienígena adaptada a este clima.\n\nFelizmente, o [Root.GetPlanetMoon] agora é um verdadeiro paraíso para [Root.Owner.GetSpeciesNamePlural]! O novo clima parece ser mais adequado à nossa espécie do que até o de [Root.Owner.Capital.GetName]."
 colony.107.desc: "O processo de terraformação abortado em [Root.GetName] foi concluído com resultados horrendos! Qualquer que seja a forma alienígena que desenvolveu o equipamento, a fisiologia deles era radicalmente diferente da nossa. O [Root.GetPlanetMoon] foi modificado com uma estratosfera esvaziada de ozônio, para dar suporte à vida que precisa de altos níveis de radiação ultravioleta.\n\nMilhões de colonos sofreram mortes terríveis como resultado disso."
 colony.107.desc.nuked_pref: "O processo de terraformação abortado em [Root.GetName] foi concluído. Qualquer que seja a forma alienígena que desenvolveu o equipamento, a fisiologia deles deveria ser parecida com a nossa. O planeta agora possui uma atmosfera de nitrogênio e oxigênio, e altos níveis de radiação na superfície - ele se tornou um §Y$pc_nuked$§!.\n\nFelizmente, os [Root.Owner.GetSpeciesName] se adaptaram para prosperar precisamente em tais condições extremas."
 colony.107.a: "Isso é um desastre!"
 colony.107.a.tooltip: "§HTodo §!§Pop não-Y$trait_mechanical$§! §Hsem§! §Y$trait_pc_nuked_preference$§! §Hem [Root.GetName]:§! Morre."
 colony.108.name: "Criaturas Derrotadas"
 colony.108.desc: "Derrotamos a massa de criaturas que atacou nossos assentamentos em [From.From.GetName]. Seus cadáveres apodrecidos agora estão no solo em frente às nossas fortificações, e nossas forças de segurança estão atualmente no processo de remover a biomassa pútrida para aterros cavados rapidamente.\n\nPorém, um pouco da matéria genética é de interesse de nossos cientistas, e as amostras que eles coletaram devem auxiliar pesquisas futuras em biologia."
 colony.109.name: "Criatura Saqueadora"
 colony.109.desc: "Nossos colonizadores em [Root.GetName] ainda estão encontrando sobreviventes espalhados após termos sido atacados pelas criaturas mutantes que nasceram do processo de terraformação abortado do [Root.GetPlanetMoon]. A maioria é relativamente inofensiva e pode se ver livre do sofrimento pelas forças de milícia locais, mas uma criatura em especial está espalhando terror nos nossos assentamentos. Há relatórios dela perseguindo nossos cidadãos, e há dezenas de desaparecimentos inexplicados.\n\nOs restos mutilados da esquipe de segurança que foi enviada para investigar o problema foram descobertos recentemente, levando os líderes da colônia a solicitar apoio militar extra mundo."
 colony.109.a: "Esta criatura precisa ser caçada e morta!"
 colony.110.desc: "Após uma busca extensiva, nossas forças em [From.From.GetName] conseguiram cercar a fera mutante que estava matando nossos colonizadores. Uma equipe de forças especiais se aventurou dentro do covil da criatura e conseguiu matá-la após uma batalha terrível. Os restos macabros de centenas de colonizadores massacrados foram encontrados no ninho, assim como meia dúzia de sobreviventes traumatizados que parecem ter sido deixados vivos para serem consumidos mais tarde.\n\nA cabeça colossal da fera foi arrancada do corpo, e agora serve como o símbolo regimental das forças que estiveram envolvidas na sua morte."
 colony.111.name: "Término da Ocorrência da Criatura"
 colony.111.desc: "Ocorrências da criatura mutante que estava caçando colonizadores em [Root.GetName] pararam, e não houve mais desaparecimentos. Parece que a criatura morreu por conta própria - talvez de idade, ou por que se engasgou com um de nossos colonizadors.\n\nApesar de a população de [Root.GetName] estar aliviada que o pesadelo finalmente acabou, não estão muito felizes com a nossa incapacidade de protegê-los."
 colony.111.a: "Talvez poderíamos ter feito mais..."
 colony.112.name: "Ocorrências da Criatura Aumentam"
 colony.112.desc: "Ocorrências da criatura que estava matando nossos colonizadores em [Root.GetName] aumentaram drasticamente recentemente, assim como a quantidade de desaparecimentos entre a população. O fato que diversas criaturas foram vistas juntas claramente indica que a fera original está se reproduzindo de alguma forma.\n\nHordas desses horrores agora aterrorizam livremente, massacrando nossos colonizadores indiscriminadamente nas regiões rurais do [Root.GetPlanetMoon]. A não ser que façamos algo rápido, a colônia inteira será massacrada!"
 colony.112.a: "Essas coisas não desistem!"
 colony.113.name: "Mutantes Massacram [From.From.GetName]"
 colony.113.desc: "Nossas forças principais em [From.From.GetName] foram dizimadas pela investida das criaturas mutantes! As feras maléficas agora andam livremente por toda a colônia, massacrando nossos colonizadores impunemente. Há relatórios de sobreviventes fugindo para se esconderem nas áreas rurais, mas é só uma questão de tempo até que sejam encontrados pelas criaturas."
 colony.113.a: "Precisamos enviar auxílio militar!"
 colony.114.name: "A Liberação de [From.From.GetName]"
 colony.114.desc: "Nossas forças expedicionárias liberaram [From.From.GetName] dos horrores mutantes que ocupavam nossos assentamentos principais. Seus cadáveres apodrecidos agora estão no solo em frente às nossas fortificações, e nossas forças de segurança estão atualmente no processo de remover a biomassa pútrida para aterros cavados rapidamente.\n\nSobreviventes começaram a surgir ao redor do [From.From.GetPlanetMoon], mas muitas vidas foram perdidas."
 colony.114.a: "Hora de reconstruir."
 colony.150.name: "Cofre Subterrâneo"
 colony.150.desc: "Inspeções geológicas conduzidas por nossos colonizadores em [Root.GetName] revelaram um gigantesco cofre enterrado dentro de uma cadeia de montanhas. Tudo indica que isso é algum tipo de abrigo nuclear construído pela mesma espécie que morreu na antiga guerra nuclear no [Root.GetPlanetMoon].\n\nO abrigo esteve lacrado por muitos séculos, mas nossos instrumentos detectaram uma fraca emissão energética vindo de dentro. Nossos cientistas estão ansiosos para abrir o cofre e descobrir o que está por trás de suas portas reforçadas."
 colony.150.a: "Vamos abrir isso!"
 colony.150.b: "Melhor deixar como está."
 colony.151.desc: "Nossa expedição científica conseguiu abrir o cofre em [Root.GetName], mas não encontraram nada lá dentro, a não ser restos esqueléticos antigos de mamíferos. Parece que os habitantes originais do abrigo ficaram sem comida há aproximadamente 200 anos, e começaram a se alimentar uns dos outros em um tipo de frenesi canibalista. Os ossos espalhados (muitos deles cobertos de marcas de dentes) mostram um quadro terrível dos momentos finais vivenciados pelos últimos sobreviventes dessa outrora orgulhosa civilização.\n\nO lado bom é que os registros e dados encontrados dentro do abrigo devem ser suficientes para manter nossos cientistas comportamentais e xenopsicólogos ocupados por muitos anos."
 colony.151.b.evopred: "Esses ossos servirão de alimento uma última vez."
 colony.152.desc: "O grande cofre em [Root.GetName] foi aberto. Para a surpresa de nossos cientistas, o vasto complexo por trás das grandes portas abrigou milhões de sobreviventes da antiga guerra nuclear que devastou este mundo. Apesar de seus recursos limitados, eles conseguiram manter uma sociedade autossuficiente por séculos. Inicialmente, eles estavam cautelosos com relação aos nossos cientistas, já que nunca haviam encontrado alienígenas, mas também profundamente agradecidos por nossa ajuda em abrir o cofre.\n\nO abrigo contém diversas máquinas e equipamentos que foram projetados especialmente para reconstruir uma civilização após um holocausto nuclear. Ela só pode ser operada por estes alienígenas, mas eles parecem mais do que dispostos a se juntar aos nossos colonizadores na superfície, assim que tenham se adaptado à luz do sol novamente."
 colony.152.a: "Vamos reconstruir esse mundo juntos."
 colony.152.b: "Excelente. Prepare os colares de escravos!"
 colony.152.b.tooltip: "Estes Pops serão escravizados."
 colony.152.c: "Lacre a escória alienígena de volta no abrigo e enterre a entrada."
 colony.153.desc: "Nossos cientistas finalmente conseguiram abrir o cofre antigo em [Root.GetName], liberando uma enxurrada de horrores mutantes - os restos retorcidos dos habitantes originais. As criaturas massacraram a equipe científica em questão de segundos, e depois seguiram para a área rural. Milhares de colonizadores foram massacrados, com assentamentos inteiros sucumbindo à horda voraz. Fortificamos nossas cidades restantes e estabelecemos perímetros defensivos, mas isso não deve ser suficiente!\n\n"
 colony.153.a: "Preparem as defesas!"
 colony.155.name: "Bomba Nuclear"
 colony.155.desc: "Enquanto exploravam algumas ruínas próximas aos nossos assentamentos principais em [Root.GetName], alguns colonizadores ativaram a contagem regressiva em uma bomba de hidrogênio não detonada na última guerra nuclear do [Root.GetPlanetMoon].\n\n Com uma potência estimada em 35 megatons, a bomba arrasará diversos centros populacionais, se for detonada. Ela não é estável o suficiente para ser movida e não há tempo para evacuar a região inteira."
 colony.155.a: "Temos que desarmá-la!"
 colony.156.desc: "Conseguimos desarmar a bomba de hidrogênio em [From.From.GetName]! Ela foi descartada de maneira segura e equipes de especialistas estão vasculhando a superfície do [From.From.GetPlanetMoon] em busca de outras munições não detonadas. Esperamos que isso reduza as chances de outro incidente como esse."
 colony.156.a: "Essa passou de raspão."
 colony.157.desc: "Nossa equipe de explosivos não conseguiu desarmar a bomba em [From.From.GetName] a tempo. A equipe e todo ser vivo em um raio de 100 quilômetros foram erradicados quando a bomba detonou. Incontáveis vidas foram perdidas, as últimas vítimas de uma guerra trágica e sem sentido que começou há milênios."
 colony.157.a: "Isso é um desastre!"
 colony.160.name: "Acelerador de Partículas Arruinado"
 colony.160.desc: "Descobrimos o que parecem ser os restos de um gigantesco acelerador de partículas em [Root.GetName]. Ele foi encontrado em uma região ainda radioativa e coberta por grandes crateras de bombas, sugerindo que a instalação foi um alvo de grande importância durante a guerra nuclear que assolou este mundo.\n\nRecuperamos diversos registros de pesquisa escritos pelo cientista a cargo do acelerador. Apesar de a tecnologia da civilização ser bem subdesenvolvida, algumas das pesquisas teóricas e fórmulas descritas nos registros são avançadas até para os nossos padrões. Nossos físicos estão estudando os dados neste momento."
 colony.161.name: "Infraestrutura Sobrevivente"
 colony.161.desc: "A infraestrutura que sobreviveu à grande guerra nuclear que arruinou [Root.GetName] foi uma grande bênção para nossos colonizadores. A civilização alienígena que vivia aqui construiu estradas conectando seus maiores centros populacionais, e algumas delas ainda estão em condições de uso boas o suficiente para serem usadas hoje.\n\nTambém fomos capazes de reciclar uma grande quantidade de material de construção das muitas ruínas que povoam a paisagem, aumentando ainda mais a infraestrutura colonial."
 colony.162.name: "Estação Espacial Abandonada"
 colony.162.desc: "Uma pequena equipe da nossa colônia em [Root.GetName] recentemente foi a bordo de uma estação espacial primitiva que foi deixada em órbita pelos habitantes originais do [Root.GetPlanetMoon]. Os restos mumificados da tripulação da estação ainda foram encontrados aglomerados ao redor das janelas de frente para o [Root.GetPlanetMoon]. Eles devem ter percebido que estavam condenados após ver as nuvens cogumelo surgindo abaixo, e registros de comunicação mostram que os astronatas fizeram diversas tentativas fúteis e desesperadas de entrar em contato com a superfície antes de ficarem sem suprimentos.\n\nA estação está em boas condições e deu aos nossos engenheiros uma visão rara dos estágios iniciais de um programa espacial planetário. Eles obtiveram várias ideias a partir das soluções primitivas porém engenhosas utilizadas no projeto da estação."
 colony.162.b.evopred: "Por sorte, esses restos não foram irradiados."
 colony.163.name: "Radiação de Terra Morta"
 colony.163.desc: "Os níveis de radiação em algumas regiões sem vida de [Root.GetName] parecem ser maiores do que nossas análises iniciais indicaram. Colonizadores em diversos assentamentos locais reclamam de péssima saúde, e que as taxas de natalidade estão caindo. Estamos dando passos para evacuar as regiões afetadas, mas essas medidas levarão tempo."
 colony.164.name: "Movimento Pacifista"
 colony.164.desc: "As ruínas decrépitas e desoladas encontradas em [Root.GetName] parecem ter feito com que muitos colonizadores do [Root.GetPlanetMoon] adotassem algum tipo de filosofia pacifista. Membros desse novo momento dizem que o ambiente em que vivem serve como uma lembrança diária dos horrores sem sentido da guerra. Eles veem como seu dever cívico impedir que a terrível destruição que ocorreu em [Root.GetName] ocorra em outros mundo."
 colony.164.a: "É mesmo?"
 colony.164.b: "Estes covardes miseráveis envergonham nossa nação!"
 colony.164.c: "Excelente. Todos devem dar uma chance para a paz."
 colony.164.a.tooltip: "Até §Y400§! £pop£ §HPops§! em §H[Root.GetName]§! perdem qualquer §Yética Militarista§! e ganham a ética §YPacifista§!"
 colony.170.name: "Destroços Orbitais"
 colony.170.desc: "O espaço orbital ao redor de [Root.GetName] está cheio de destroços deixados para trás pela civilização alienígena que habitou o [Root.GetPlanetMoon]. Antes de se aniquilarem, seus programas espaciais iniciais viram o lançamento de milhares de satélites primitivos e plataformas de lançamento de mísseis. Muitos desses foram destruídos por armas anti-satélite durante a guerra nuclear destrutiva de [Root.GetPlanetMoon] gerando mais lixo espacial no local.\n\nNossa colônia na superfície se desenvolveu a tal ponto que este campo de detritos denso está interferindo com a sua infraestrutura. Não podemos utilizar satélites e os voos orbitais civis estão limitados a janelas de lançamento apertadas."
 colony.170.a: "Talvez devamos fazer algo."
 colony.171.name: "Acidente com Cargueiro"
 colony.171.desc: "Um cargueiro civil chegando para aterrissar em [Root.GetName] foi perfurado por uma nuvem densa e rápida de destroços orbitais! A tripulação do voo foi morta imediatamente, e a nave atingida capotou pela atmosfera caindo perto de uma das redes de transmissão principais da colônia. A explosão resultante gerou diversas mortes no solo, e a infraestrutura local sofreu dano considerável."
 colony.171.desc.mach: "Um cargueiro de unidades trabalhadoras chegando para aterrissar em [Root.GetName] foi perfurado por uma nuvem densa e rápida de destroços orbitais! As unidades de tripulação do voo foram destruídas instantaneamente, e a nave atingida capotou pela atmosfera caindo perto de uma das redes de transmissão principais da colônia. A explosão resultante gerou diversos encerramentos de operação no solo, e a infraestrutura local sofreu dano considerável."
 colony.171.a: "Que azar...!"
 colony.172.name: "Impacto dos Destroços"
 colony.172.desc: "Uma cascata de colisões na densa camada de destroços ao redor de [Root.GetName] recentemente mudou a órbita de um grande pedaço de lixo espacial. O objeto - que acreditamos ser uma das plataformas de mísseis orbitais utilizada na guerra nuclear do [Root.GetPlanetMoon] - foi puxada para a atmosfera, e infelizmente caiu diretamente em cima de um grande assentamento. Relatórios iniciais indicam muitas mortes."
 colony.172.a: "Precisamos fazer algo sobre aqueles destroços."
 colony.173.desc: "Com a ajuda de nossa Nave Científica, as autoridades coloniais em [From.From.GetName] terminaram de limpar o espaço orbital do [From.From.GetPlanetMoon]. Agora está seguro para viagens civis e satélites."
 colony.174.desc: "Com a ajuda de nossa Nave Científica, as autoridades coloniais em [From.From.GetName] terminaram de limpar o espaço orbital do [From.From.GetPlanetMoon]. Agora está seguro para viagens civis e satélites.\n\nAo que parece, muitos dos destroços eram minerais valiosos da superfície do [Root.GetPlanetMoon] que eram usados na construção do satélite. Conseguimos recuperar uma quantidade significativa, gerando um bom lucro no processo."
 colony.180.name: "Asteroide Avistado"
 colony.180.desc: "Nossas redes de rastreamento do espaço profundo em [Root.GetName] fizeram uma descoberta alarmante - um grande asteroide está indo em direção ao [Root.GetPlanetMoon] em uma rota de colisão direta! Caso ele atinja a superfície, as consequências seriam desastrosas.\n\nO asteroide deve ser destruído antes que seja tarde!"
 colony.180.a: "Isso é um mau sinal..."
 colony.180.b: "Entendido."
 colony.182.name: "Asteroide Destruído"
 colony.182.desc: "O asteroide que estava se aproximando de [Root.GetName] em colisão direta foi destruído! Com a condenação evitada, nossos cidadãos jubilantes no [Root.GetPlanetMoon] foram às ruas para comemorar.\n\nUma análise dos fragmentos restantes também revelou que o asteroide era feito basicamente de minerais valiosos. Coletamos o que conseguimos."
 colony.182.desc.mach: "O asteroide que estava se aproximando de [Root.GetName] em colisão direta foi destruído! Nenhuma estrutura ou unidades planetárias foram afetadas pelo evento, já que vários destroços em queda eram pequenos o suficiente para se desintegrarem na entrada da atmosfera.\n\nUma análise dos fragmentos restantes também revelou que o asteroide era feito basicamente de minerais valiosos. Coletamos o que conseguimos."
 colony.183.name: "Asteroide Atinge [Root.GetName]"
 colony.183.desc: "Não conseguimos parar o asteroide que estava a caminho de [Root.GetName] a tempo. Ele colidiu com a superfície do [Root.GetPlanetMoon], causando sofrimento e devastação incalculáveis. Milhões estão mortos."
 colony.183.desc.mach: "Não conseguimos parar o asteroide que estava a caminho de [Root.GetName] a tempo. Ele colidiu com a superfície do [Root.GetPlanetMoon], causando destruição e devastação incalculáveis. Milhões de unidades maquinárias ficaram terminantemente inoperáveis."
 colony.183.a: "Este é um dia sombrio."
 colony.185.name: "Mundo Consumido"
 colony.185.desc: "Consumimos tanto de §Y[Target.GetName]§! que uma reação em cadeia começou e desestabilizou seu núcleo.\n\nTodos os drones foram evacuados para §Y[Owner.Capital.GetName]§!."
 colony.185.a: "Ainda temos fome."
 colony.185.a.tooltip: "§Y[From.GetName]§! foi destruído."
 ####################################
 #Precursor Events
 ####################################
 vultaum_artifact: "Adquirimos um artefato Vultaum."
 precursor.completed.name: "Projeto Arqueológico Completo"
 precursor.completed.a: "Um achado interessante."
 precursor.1.name: "A Assembleia Estelar Vultaum"
 precursor.1.desc: "Recuperamos artefatos de uma antiga civilização alienígena em [From.GetName]! Eles deveriam estar ativos nesta região do espaço há aproximadamente 12 milhões de anos, a julgar pela idade dos artefatos.\n\nA partir do que conseguimos juntar, nossos cientistas acreditam que esses alienígenas, que se denominavam a 'Assembleia Estelar Vultaum', eram anelídeos parecidos com vermes, com aproximadamente 3 a 4 metros de comprimento e que se comunicavam principalmente através de vibrações carregadas ao longo dos seus corpos segmentados."
 precursor.5.name: "Base de Mineração Vultaum"
 precursor.5.desc: "Restos de uma pequena base de mineração Vultaum de hélio-3 foram encontrados no fundo de uma grande cratera em [From.GetName]. A explosão que criou a cratera parece ter se originado de dentro da própria instalação. A não ser que as técnicas de mineração Vultaum sejam radicalmente diferentes da nossa, uma falha de equipamento ou acidente não podem ser responsáveis por uma explosão tão grande."
 precursor.6.desc: "Milagrosamente, conseguimos recuperar partes de um núcleo de dados Vultaum que estava bem distante da cratera em [From.From.GetName]. Boa parte dos dados estava corrompida, mas nossos cientistas conseguiram traduzir de maneira apropriada o \"korga\" - a unidade de tempo básica dos Vultaum."
 precursor.10.name: "Observatório Vultaum"
 precursor.10.desc: "Um antigo observatório Vultaum foi encontrado na superfície de [From.GetName]. O sistema [From.GetStarName] é bem distante da região no espaço de onde os Vultaum vieram, e esta instalação parece ter sido usada primariamente para a observação das próprias estrelas deles.\n\nInvestigamos os dados sobreviventes do observatório, mas não há pistas do que os Vultaum estavam buscando nas suas observações."
 precursor.11.desc: "A escavação arqueológica em §Y[From.From.GetName]§! revelou um pequeno mural em uma das empoeiradas câmaras menores do observatório. Ele parece retratar diversas constelações, possivelmente como apareceriam se fossem vistas do mundo natal Vultaum. Nossos astrônomos não conseguiram identificar as estrelas individuais."
 precursor.15.name: "Colônia Vultaum"
 precursor.15.desc: "Os restos parciais de um elevador espacial Vultaum que desabou foram descobertos pelo [Root.GetName] em uma das regiões equatoriais de [From.GetName]. Parece que o elevador teve seu contrapeso cortado intencionalmente além da órbita geoestacionária, fazendo com que o cabo gigantesco no topo caísse em cima de vários grandes centros urbanos ao longo do equador. A julgar pelas ruínas, o total de mortos deve ter sido alguns milhões."
 precursor.16.desc: "Nossos arqueólogos em §Y[From.From.GetName]§! conseguiram recuperar os restos parciais de um mapa estelar ao lado de um pedaço de um cabo de elevador. Aparentemente ele era usado pelos comandantes da marinha mercante Vultaum, e mostra várias rotas de comércio interestelar lucrativas."
 precursor.20.desc: "Vários grandes lagos, perfeitamente circulares na superfície de [From.GetName] foram causados por uma série de explosões anti-matéria há milhões de anos. Este [From.GetPlanetMoon] era habitado pelos Vultaum naquele momento, e as crateras estão todas aglomeradas na região que abrigava o maior dos assentamentos planetários.\n\nA hipóstese de bombardeio orbital foi descartada pela equipe científica do [Root.GetName], levando-nos a crer que essas explosões foram ativadas por alguém ou algo no chão."
 precursor.21.desc: "Os arqueólogos em §Y[From.From.GetName]§! conseguiram recuperar um núcleo de memória intacto de um terminal dentro de uma instalação médica em ruínas. Ele tinha algumas estatísticas interessantes, tais como a expectativa de vida média natural dos Vultaum (aproximadamente 270 anos) e uma lista de suas doenças mais comuns."
 precursor.25.desc: "Uma análise minuciosa de [From.GetName] revelou uma vasta rede de túneis construídos artificialmente abaixo da superfície do [From.GetPlanetMoon]. A maioria dos túneis desabou, e a tripulação do [Root.GetName] acredita que eles representam somente uma pequena porção do que já foi uma colônia Vultaum muito maior.\n\nAs cavernas subterrâneas principais foram desabadas intencionalmente, esmagando as cidades Vultaum e seus habitantes debaixo de milhões de toneladas de rocha."
 precursor.26.desc: "A escavação arqueológica em §Y[From.From.GetName]§! revelou alguns restos impressionantes de Vultaum fossilizados em uma das câmaras que desabou mais próxima à superfície. Isso deu aos nossos cientistas uma ideia mais clara sobre como os Vultaum realmente são."
 precursor.30.name: "Instalação de Gigante Gasoso Vultaum"
 precursor.30.desc: "Detectamos os restos parciais de uma estação de mineração de gás ao redor de [From.GetName] que parece ser de origem Vultaum. Os propulsores da estação foram ativados deliberadamente há milhões de anos em uma tentativa de empurrar a estação diretamente para o gigante gasoso, mas uma colisão com um objeto desconhecido impediu que isso acontecesse."
 precursor.31.desc: "Um traje espacial Vultaum aparentemente intacto, que outros saqueadores não viram, foi recuperado pelos nossos arqueólogos. Este traje com aparência de tubo, medindo quatro metros de comprimento, deu aos nossos cientistas novos conhecimentos sobre que tipo de ambientes os Vultaum preferiam."
 precursor.35.name: "Entreposto Comercial Vultaum"
 precursor.35.desc: "[From.GetName] foi o lar de um pequeno entreposto Vultaum, onde eles comercializavam com diversas civilizações vizinhas. Em algum momento, o entreposto parece ter sido convertido em uma missão religiosa, onde os Vultaum tentaram converter mercadores alienígenas visitantes para a filosofia deles. O comércio cessou logo em seguida, e o [From.GetPlanetMoon] acabou sendo abandonado."
 precursor.36.desc: "Arqueólogos em §Y[From.From.GetName]§! recuperaram um pequeno panfleto digital Vultaum. Parece que os missionários deste entreposto passavam panfletos como este aos comerciantes visitantes. Boa parte dos dados está corrompida, mas há diversas referências à \"grande mentira\" e \"às correntes da realidade virtual\"."
 precursor.40.name: "Satélite Vultaum"
 precursor.40.desc: "Um pequeno satélite Vultaum foi encontrado na órbita de [From.GetName]. Ele foi configurado para repetir uma mensagem continuamente até que a sua fonte de energia secou há milhões de anos. Recuperamos a sua matriz transmissora, mas apenas uma parte da transmissão.\n\nO propósito principal deste satélite aparentemente era pregar a filosofia Vultaum dominante às civilizações vizinhas. Sua mensagem fala da necessidade de 'se desconectar' e 'abraçar a verdadeira existência', o que quer que isso queira dizer."
 precursor.41.desc: "Após uma análise cuidadosa da matriz de transmissão Vultaum, nossos arqueólogos e engenheiros de dados concluíram que as máquinas não contêm quaisquer tecnologias de valor para nós. Porém, o projeto melhorou bastante o nosso entendimento da linguagem de programação primária Vultaum. Isso facilitará que decifremos os dados deles no futuro."
 precursor.45.name: "Colônia Fracionada Vultaum"
 precursor.45.desc: "[From.GetName] foi o local de uma pequena colônia Vultaum que é única por dois motivos - o sistema [From.GetStarName] não é o que costumava ser espaço Vultaum, e as ruínas são centenas de anos mais novas do que qualquer outra coisa deixada pela civilização deles. A colônia parece ter sido realizada por algum tipo de grupo à parte que rejeitou a filosofia dominante de sua sociedade."
 precursor.46.desc: "Diversos artefatos escavados no sítio arqueológico em §Y[From.From.GetName]§! estão cobertos de escritos que rejeitam firmemente a ideia filosófica Vultaum de que a \"vida em si é uma mentira\". Um deles parece ser um tipo de memorial à raça Vultaum como um todo. Isso confirmaria nossa teoria de que esta colônia fracionada existiu por algum tempo após o colapso do resto da Assembleia Estelar."
 precursor.50.name: "Centro de Realidade Virtual Vultaum"
 precursor.50.desc: "Engenheiros Vultaum construíram em algum momento um complexo orbital gigantesco próximo a [From.GetName] dedicado à pesquisa de computação. Estranhamente, eles parecem ter ignorado o campo de inteligência artificial tão popular, para focar exclusivamente em realidades virtuais e grandes simulações computadorizadas. A maior parte do complexo foi arruinada por armas e micrometeoritos, mas o que sobrou está em incríveis condições, dada a idade da estação."
 precursor.51.desc: "Os arqueólogos que estão investigando o complexo orbital Vultaum acima de §Y[From.From.GetName]§! esbarraram em uma descoberta interessante. Eles conseguiram recuperar uma cópia parcial do que parecia ser um jogo de realidade virtual de vários usuários bem popular entre bilhões de Vultaum ao redor do seu império.\n\nApesar de o jogo se passar em uma versão fictícia e altamente satirizada da sociedade contemporânea deles, ele se mostrou como uma excelente fonte de informação tanto para a linguagem, quanto para os seus costumes."
 precursor.55.name: "Base de Mineração Asteroide Vultaum"
 precursor.55.desc: "[From.GetName] está coberto de crateras de impacto de colisões de asteroides, mas uma se destaca - parece ter sido criada através da detonação de algum tipo de dispositivo antimatéria. Há provas em outro lugar na superfície do asteroide indicando que ele passou por uma extração pesada pelos Vultaum em algum momento há uns 12 milhões de anos. A grande cratera que encontramos era provavelmente a localização do posto de mineração."
 precursor.56.desc: "Uma análise mais próxima da base de mineração Vultaum destruída em §Y[From.From.GetName]§! revelou alguns dos equipamentos de mineração deles escondidos em um túnel. Ele foi desenvolvido de maneira única para ser usado com sua anatomia de minhoca, e parece ser operado principalmente usando as vibrações corpóreas que eles usavam para se comunicarem."
 precursor.100.name: "Sistema Natal Vultaum Localizado"
 precursor.100.desc: "Após um estudo intenso de nossos artefatos Vultaum recuperados, cientistas em [Root.Capital.GetName] conseguiram deduzir as coordenadas galáticas exatas de Vultaumar - o sistema natal da antiga civilização Vultaum! Devemos lançar uma expedição para este sistema antes que alguém chegue primeiro."
 precursor.100.a: "Entre em contato com a Nave Científica mais próxima!"
 precursor.101.name: "O Mundo Natal Vultaum"
 precursor.101.desc: "Os restos espalhados do mundo natal Vultaum revelam que ele passou por um evento de extinção gigantesco há 12 milhões de anos, causado pela detonação de algum tipo de dispositivo de antimatéria. A partir das ruínas que restam na superfície do [FromFrom.GetPlanetMoon], aprendemos que a sociedade Vultaum passou por uma mudança ideológica radical, um século antes de sua extinção.\n\nSua nova filosofia defendia que o universo inteiro era um tipo de realidade artificial, na qual todos os seres sapientes haviam sido colocados para a diversão de um poder superior. Os Vultaum fizeram diversas tentativas radicais de \"se desconectarem\" de maneira forçada desta simulação, muitas delas envolviam suicídio em massa.\n\nEles finalmente concluíram que somente a desconexão simultânea de bilhões de indivíduos desestabilizaria o sistema o suficiente para lhes dar liberdade. Em uma hora acordada, os Vultaum em vários lugares se suicidaram da forma que foi possível. Aqueles que se recusaram a tomar parte nesse suicídio em massa eram muito poucos para repovoar a espécie, e então os Vultaum sumiram na escuridão e, por fim, foram extintos."
 precursor.102.name: "Mundo Natal Vultaum Descoberto"
 precursor.102.desc.a: "O mundo natal destruído dos antigos Vultaum foi encontrado, mas claramente foi visitado por alguém recentemente. Não resta nada de valor para ser encontrado no [FromFrom.GetPlanetMoon]."
 precursor.102.desc.b: "De acordo com os nossos dados de pesquisa, este mundo despedaçado já serviu como o mundo natal de uma antiga civilização conhecida como os \"Vultaum\". Há sinais de que outros viajantes espaciais visitaram este local recentemente... Nada de valor restou para ser encontrado no [FromFrom.GetPlanetMoon]."
 precursor.500.name: "O Império Yuht"
 precursor.500.desc: "Recuperamos artefatos de uma antiga civilização alienígena em [From.GetName]! Nossos cientistas acham que eles habitaram esta região das estrelas há aproximadamente seis milhões de anos, baseado na idade dos artefatos. Os alienígenas se denominavam como os 'Yuht' e parecem ter sido artrópodes análogos muito largos e planos.\n\nParece que um único indivíduo era capaz de atingir um comprimento de quase cem metros quando adulto, e aparentemente era muito raro mais do que dois ou três Yuht viajarem a bordo da mesma nave. "
 precursor.505.name: "Mundo Chocadeiro Yuht"
 precursor.505.desc: "[From.GetName] esteve sujeito a um bombardeio orbital extensivo em algum ponto no passado distante, o que causou danos catastróficos à biosfera. O [From.GetPlanetMoon] parece ter sido o lar de um pequeno entreposto construído pelos antigos Yuht, mas por que isso causaria a devastação de um mundo inteiro é um mistério."
 precursor.506.desc: "Após estudos extensivos do §Y[From.From.GetName]§!, agora sabemos que o [From.From.GetPlanetMoon] serviu como um dos muitos \"mundos incubadores\" no Império Yuht. O Ministério de Fertilidade deles preparava mundos esterilizando-os de predadores e outros elementos potencialmente nocivos antes de plantar ovos na superfície.\n\nDepois disso os filhotes de Yuht eram deixados por conta própria neste ambiente relativamente seguro por vários séculos até desenvolverem um nível de quase senciência. Só então eles eram coletados e introduzidos cuidadosamente na sociedade."
 precursor.510.name: "Posto de Escuta Yuht"
 precursor.510.desc: "Descobrimos diversas redes de escuta gigantescas em [From.GetName]. Estas redes possuem milhões de anos, e acreditamos que foram construídas originalmente pelos Yuht, apesar de parecer que alguma outra civilização alienígena usou eles com outro propósito nos últimos 500 mil anos. As antenas de recebimento colossais são impossíveis de serem consertadas, mas alguns terminais ainda estão intactos."
 precursor.511.desc: "Nossos arqueólogos em §Y[From.From.GetName]§! descobriram que as redes de escuta construídas no local foram usadas para escanear o espaço em busca de vida alienígena inteligente.\n\nApós conseguirem restaurar parcialmente a energia em um terminal de computadores, os arqueólogos adquiriram um disco de dados com arquivos de registro da rede de sensores que tinha séculos de dados. Estes registros sugerem que esta seção da galáxia de fato não tinha vida senciente na época do Império Yuht."
 precursor.515.name: "Colônia Yuht"
 precursor.515.desc: "As ruínas de diversas arcologias gigantescas Yuht podem ser encontradas no hemisfério sul de [From.GetName], indicando que este [From.GetPlanetMoon] foi o lar de uma das principais colônias deles.\n\nDentro de um dos prédios em ruínas, nossa equipe descobriu os restos do que parece ser um museu exibindo 'fraudes alienígenas famosas'. Há vários artefatos coletados pelos Yuht ao longo do seu império, que dizem provar a existência de vida alienígena senciente. Em cada caso, o museu classificou os artefatos como fraudes."
 precursor.516.desc: "A maioria dos artefatos exibidos nos museus Yuht em §Y[From.From.GetName]§! está faltando, mas nossos arqueólogos conseguiram recuperar uma destas supostas fraudes. Parece ser um instrumento usado para medir radiação cósmica, mas os arqueólogos confirmaram que ele tem alguns milhões de anos a mais que os Yuht. Ao contrário da opinião do museu Yuht, isso certamente seria um artefato alienígena verdadeiro."
 precursor.520.desc: "Sinais do desenvolvimento Yuht podem ser encontrados ao redor de [From.GetName], e o [From.GetPlanetMoon] deve ter passado por uma terraformação limitada em algum momento. Uma região no hemisfério do norte é algum tipo de cemitério gigantesco. Nenhum assentamento Yuht pode ser visto por perto, mas há muitos monumentos marcando cemitérios.\n\nCom uma taxa de nascimento baixa e uma expectativa de vida média próxima aos milhares de anos, cada morte Yuht era tratada como um evento significativo, e muita ênfase era colocada nas cerimônias de sepultamento."
 precursor.521.desc: "As escavações arqueológicas em [From.From.GetName] revelaram que a maioria dos túmulos foi saqueada nos milhões de anos desde a primeira escavação, provavelmente devido ao costume Yuht de enterrar os seus mortos junto com joias e presentes extravagantes. Em uma pilha de coisas descartadas pelos saqueadores, os arqueólogos encontraram um grande boneco que lembra um Yuht adulto. Eles especulam que pode ter servido como um amuleto ou uma forma de lembrança."
 precursor.525.desc: "Uma guerra terrestre gigante foi disputada em [From.GetName] entre os yuht e uma segunda espécie da qual não conhecemos muito. Essa campanha ocorreu nos anos finais do Império Yuht, e apesar de ter ocorrido há milhões de anos, destroços de máquinas de guerra arruinadas ainda podem ser encontradas.\n\nApesar do [From.GetPlanetMoon] ser uma colônia Yuht importante, as cidades e os assentamentos próximos nunca foram reconstruídos após o final das batalhas, o que indica que eles devem ter perdido a campanha."
 precursor.526.desc: "Após vasculhar diversos campos de batalha antigos em §Y[From.From.GetName]§!, nossos arqueólogos recuperaram o que parece ser um arreio de batalha Yuht. Diversos canhões de calibre alto ainda estavam presos a ele, e os arqueólogos acreditam que os soldados Yuht, devido ao tamanho gigantesco dos seus corpos, lutavam como o que pode ser essencialmente descrito como fortalezas móveis gigantescas."
 precursor.530.name: "Satélite Yuht"
 precursor.530.desc: "Um satélite Yuht foi colocado em órbita ao redor de [From.GetName] para comemorar o momento do primeiro contato entre eles e os Jabbardeeni, uma civilização contemporânea. O evento ocorreu bem aqui no sistema [From.GetStarName] e teve impactos profundos em todos os níveis da sociedade Yuht.\n\nPor mais de um milhão de anos, eles achavam que estavam sozinhos na galáxia, por isso reagiram com espanto e horror ao descobrir vida alienígena senciente. O [Root.GetName] recuperou o satélite, que agora aguarda uma análise completa."
 precursor.531.desc: "Após analisar o satélite que descobrimos acima de §Y[From.From.GetName]§!, nossos arqueólogos encontraram uma foto impregnada e altamente estilizada do que parece ser um cruzador Yuht e um batedor Jabbardeeni muito menor em formação próxima durante o evento de primeiro contato. Isso nos deu uma noção sobre como eram as naves estelares deles."
 precursor.535.name: "Cruzador Yuht"
 precursor.535.desc: "Os restos de um cruzador Yuht foram encontrados em órbita ao redor de [From.GetName]. Parece ter sido vítima de fogo por armas, mas dada a idade extrema do casco, é difícil ter certeza. Não há indicação que a nave foi equipada em algum momento com um propulsor MRQL - ela deve ter viajado entre as estrelas em velocidades abaixo da luz."
 precursor.536.desc: "Os arqueólogos que estão investigando o cruzador Yuht desgovernado acima de §Y[From.From.GetName]§! transmitiram seu relatório. Há duas grandes câmaras criogênicas na parte central do cruzador, desenvolvidas para cada uma abrigar um Yuht em animação suspensa. Devido ao tamanho gigantesco dos indivíduos Yuht, isso era aparentemente o complemento de tripulação padrão para naves deste tamanho.\n\nNenhum resto de Yuht foi encontrado na nave, mas os arqueólogos conseguiram recuperar registros de um computador que monitorava os sinais de vida e condições médicas da tripulação. Ele forneceu dados valiosos sobre a fisiologia Yuht."
 precursor.540.name: "Nave Colonial Yuht"
 precursor.540.desc: "Os restos parciais de uma antiga nave estelar Yuht foram encontrados em alta órbita ao redor de [From.GetName]. Uma análise inicial conduzida pelo [Root.GetName] indica que a nave pode ter funcionado como uma nave colonial.\n\nAté naves Yuht do tipo cruzador eram tipicamente tripuladas por um ou dois indivíduos, devido ao imenso tamanho dos seus corpos, mas este casco possui mais de uma dúzia de cápsulas criogênicas, cada uma contendo exoesqueletos murchos do que deveriam ser colonizadores Yuht."
 precursor.541.desc: "A maior parte dos restos da nave colonial Yuht abandonada na órbita de §Y[From.From.GetName]§! está em más condições, mas nossos arqueólogos conseguiram recuperar os motores abaixo da luz da nave. Os Yuht nunca romperam a barreira da luz, em vez disso dependiam de tecnologia criogênica e expectativa de vida de mil anos para espalhar o seu império pelas estrelas."
 precursor.545.name: "Habitação Asteroide Yuht"
 precursor.545.desc: "Este asteroide parece ter sido o lar de um único indivíduo Yuht. Análises profundas mostram uma série de caernas conectadas no interior do asteroide que seguem um padrão similar aos cômodos vistos nas moradias Yuht que foram encontradas em outros lugares. Para aprendem mais, precisaremos despachar uma equipe de exploração para investigar o sistema de cavernas."
 precursor.546.desc: "Após investigar a habitação Yuht no asteroide §Y[From.From.GetName]§!, descobrimos que era o lar da famosa filósofa eremita \"Yakliir\". Evidentemente ela era uma figura de um certo renome na cultura deles, e referências a ela foram encontradas em diversas fontes Yuht. Os restos de Yakliir foram encontrados perto da porta principal da moradia, onde ela faleceu aguardando uma nave de suprimentos que nunca chegou."
 precursor.600.name: "Sistema Natal Yuht Localizado"
 precursor.600.desc: "Após um estudo intenso de nossos artefatos Yuht recuperados, cientistas em [Root.Capital.GetName] conseguiram deduzir as coordenadas galáticas exatas de Yuhtaan - o sistema natal da antiga civilização Yuht! Devemos lançar uma expedição para este sistema antes que alguém chegue primeiro."
 precursor.601.name: "O Mundo Natal Yuht"
 precursor.601.desc: "Confirmamos que §Y[FromFrom.GetName]§! foi o mundo natal original dos Yuht. O [FromFrom.GetPlanetMoon] sofreu um bombardeio orbital extensivo há aproximadamente quatro milhões de anos. Esqueletos de metal retorcidos são tudo o que sobrou das arcologias imensas que já cobriram a superfície.\n\nO que conseguimos juntar é que parece que os Yuht passaram boa parte de um milênio buscando por sinais de vida alienígena inteligente no espaço local em vão. Quando eles finalmente encontraram os Jabbardeeni, uma raça jovem que havia acabado de iniciar a viagem interestelar, foi um tremendo choque.\n\nA liderança Yuht chegou a um consenso: os Jabbardeeni deveriam ser erradicados antes que ficassem poderosos demais. Um ataque surpresa gigantesco foi lançado e rebatido, o que gerou uma grande perda para os dois lados. Apesar de sua idade jovem, os Jabbardeeni já estavam experimentando com tecnologias que os Yuht nunca consideraram, e finalmente levaram a vantagem. Após menos de uma década de guerra, o Império Yuht de dois milhões de anos foi totalmente destruído."
 precursor.602.name: "Mundo Natal Yuht Descoberto"
 precursor.602.desc.a: "Descobrimos o antigo mundo natal dos Yuht, mas que pena, alguém já fez uma visita a este mundo. O [FromFrom.GetPlanetMoon] foi limpo de qualquer coisa que tenha valor."
 precursor.602.desc.b: "Nossa inspeção de §Y[FromFrom.GetName]§! revelou que o [FromFrom.GetPlanetMoon] já foi o mundo natal de uma espécie antiga conhecida como \"Yuht\". Porém, este sistema foi visitado recentemente por outros viajantes interestelares, e eles parecem ter limpado o [FromFrom.GetPlanetMoon] de qualquer coisa de valor."
 precursor.1000.name: "A Primeira Liga"
 precursor.1000.desc: "Recuperamos artefatos de uma antiga civilização alienígena em [From.GetName]! Se o que aprendemos com estes artefatos está correto, esta civilização foi algum tipo de confederação que consistia de muitas raças alienígenas diferentes. Eles se denominavam a 'Primeira Liga' e parecem ter coexistido em uma paz relativa há uns dois milhões de anos.\n\nApesar de o sistema [From.GetStarName] estar em uma região do espaço que parece ter composto o núcleo do território deles, um mapa parcial encontrado entre os artefatos indica que esta Primeira Liga pode ter coberto uma porção significativa de nossa galáxia, antes do seu eventual fim."
 precursor.1005.name: "Base Naval da Liga"
 precursor.1005.desc: "Os destroços do que deve ter sido uma grande base naval da Primeira Liga foram detectados em órbita ao redor de [From.GetName]. Sabemos que a Liga mantinha uma frota gigantesca chamada de 'Grande Armada' para combater a pirataria e salvaguardar as nações membros contra agressores externos - este entreposto em particular parece ter fornecido berços para uma das frotas de patrulha dos anéis."
 precursor.1006.desc: "Nossa missão arqueológica para a base naval da Primeira Liga foi concluída. Recuperamos o emblema da 28ª Frota de Patrulha do Anel Externo, uma força-tarefa de porte médio que tinha a responsabilidade de defender as rotas comerciais que ligavam as nações associadas à Liga ao longo do anel galático. A base orbitando [From.From.GetName] era aparentemente o porto natal deles."
 precursor.1010.name: "Cruzador da Liga"
 precursor.1010.desc: "A seção da proa de antigo cruzador da Primeira Liga foi descoberta orbitando [From.GetName]. Há destroços insuficientes na proximidade para acharmos o resto da nave, mas o que sobrou está em más condições. O casco está cheio de buracos do que parecem ser grandes projéteis de catapultas eletromagnéticas."
 precursor.1011.desc: "A expedição arqueológica ao cruzador da Primeira Liga orbitando §Y[From.From.GetName]§! retornou. Pouca coisa útil foi encontrada na nave arruinada, mas os arqueólogos conseguiram recuperar o manifesto da tripulação. A Primeira Liga convocou todos os seus mundos membros para tripular a Grande Armada, sua frota estelar conjunta, e através do manifesto descobrimos que a tripulação deste cruzador em especial era composta de indivíduos de doze espécies diferentes."
 precursor.1015.name: "O Planeta Natal Khamdai"
 precursor.1015.desc: "A inspeção de [From.GetName] revelou que o [From.GetPlanetMoon] era o mundo natal dos insectoides Khamdai, um dos membros fundadores da antiga Primeira Liga. Cidades gigantescas similares a colmeias já cobriram a maioria da superfície, mas aprendemos que os Khamdai baniram toda a construção em uma grande região circular que se estendia por mais de um terço do hemisfério sul. Esta área serviu tanto como local de acasalamento, como de reserva natural."
 precursor.1016.desc: "Nossa expedição arqueológica para §Y[From.From.GetName]§! aprendeu muito sobre os agora extintos Khamdai. Eles tinham uma cultura guerreira que lutou diversas guerras contra muitos outros fundadores da Primeira Liga logo após as primeiras naves estelares terem rompido a barreira da luz.\n\nApós serem derrotados, os Khamdai se tornaram apoiadores entusiastas da fundação da Primeira Liga e muitos dos seus melhores guerreiros serviriam como tropas de choque contra os inimigos da Liga. Recuperamos um \"magil-sha\" perfeitamente preservado, uma foice cerimonial utilizada pelos membros Khamdai da Guarda de Honra da Primeira Liga."
 precursor.1020.name: "O Mundo Lar Chassago"
 precursor.1020.desc: "Este mundo é o antigo mundo lar dos serpetinos Chassago, um dos membros fundadores da Primeira Liga. A grande maioria das cidades deles era localizada no subterrâneo e [From.GetName] é cheio de redes de túneis, dos quais muitos desabaram nos dois milhões de anos desde que os Chassago foram extintos. Sondas do [Root.GetName] identificaram a localização provável de diversas cidades subterrâneas."
 precursor.1021.desc: "A escavação das cidades subterrâneas Chassago em §Y[From.From.GetName]§! está sendo realizada, e já aprendemos muito sobre esta antiga espécie. Eles eram reptilianos, com corpos alongados e sem pernas, que poderiam medir vinte metros ou mais quando adultos.\n\nTodos os registros sobreviventes indicam que os Chassago eram especialistas em comércio, e suas barcaças de comércio realmente eram o primeiro ponto de contato entre raças não afiliadas e a Primeira Liga. Ainda é incerto saber se a Liga poderia ter se expandido tão rapidamente como foi sem o benefício da grande rede de comércio Chassago que já existia antes da sua fundação."
 precursor.1025.name: "O Mundo Natal Migir-Yan"
 precursor.1025.desc: "Os diminutivos (porém rápidos reprodutores) Migir-Yan foram um dos membros fundadores da Primeira Liga, e [From.GetName] era o seu mundo natal. A população foi aglomerada em centenas de arcologias gigantescas espalhadas pela superfície, cada uma capaz de suportar centenas de milhões de indivíduos.\n\nEstas arcologias eram conectadas por uma rede de passarelas, e os Migir-Yan estavam evidentemente contentes em deixar a vida selvagem de [From.GetPlanetMoon] intocada."
 precursor.1026.desc: "Os restos fossilizados dos Migir-Yan extintos foram recuperados pelos nossos arqueólogos em §Y[From.From.GetName]§!, permitindo que tenhamos uma imagem melhor de como essa espécie era fisicamente. Estranhamente pequenos, com a maioria dos indivíduos não sendo mais altos do que 0.6 metros, esses mamíferos análogos roedores eram herbívoros.\n\nUnidades familiares Migir-Yan geralmente eram compostas por quase mil indivíduos, e a posição na sociedade de uma pessoa dependia quase que exclusivamente da habilidade social. Acredita-se que o corpo diplomático Migir-Yan era a força por trás da criação da Primeira Liga."
 precursor.1030.name: "O Mundo Natal V'ropak"
 precursor.1030.desc: "[From.GetName] era o mundo natal das aves V'ropak, uma espécie que esteve entre os membros fundadores da antiga Primeira Liga. Estes análogos a pássaros incapazes de voar, andavam sobre pernas longas e magras, e os restos fossilizados sugerem que suas fêmeas podiam atingir alturas de até quatro metros, enquanto os machos eram um pouco menores.\n\nTodas as cidades deles foram construídas dentro de planaltos ocos. Análises indicam que alguns desses planaltos foram construídos artificialmente, provavelmente pelos próprios V'ropak depois que ficaram sem opções naturais para construir novas cidades."
 precursor.1031.desc: "Quando a Primeira Liga estava no auge do seu poder, os V'ropak eram reconhecidos como os melhores cientistas na galáxia. Suas inovações de pesquisa impulsionaram a fase de expansão inicial da liga, e mais de uma espécie foi trazida para o pacto em troca de acesso à tecnologia V'ropak. Infelizmente, nenhuma dessa tecnologia ainda existe para ser encontrada entre as ruínas de §Y[From.From.GetName]§!."
 precursor.1035.name: "Base Científica da Liga"
 precursor.1035.desc: "Uma análise da superfície de [From.GetName] identificou os restos de uma antiga instalação na superfície do [From.GetPlanetMoon]. Boa parte da instalação foi varrida em uma explosão gigantesca há uns dois milhões de anos, mas algumas construções sobreviveram mais ou menos à explosão. Todas as provas recuperadas até agora apontam para isso ter sido algum tipo de base de pesquisa construída pela Primeira Liga."
 precursor.1036.desc: "A expedição arqueológica que enviamos para §Y[From.From.GetName]§! retornou. Pouco restou da base de pesquisa da Primeira Liga que eles foram enviados para investigar, mas a julgar pela localização isolada, suspeitamos que a pesquisa conduzida lá foi de natureza perigosa - possivelmente envolvendo viagem dimensional ou armas biológicas avançadas.\n\nUm disco de dados da 'Academia de Ciências' forneceu alguns conhecimentos sobre como a comunidade científica da Primeira Liga era organizada."
 precursor.1040.name: "Colônia Conjunta da Liga"
 precursor.1040.desc: "Ruínas de uma colônia da Primeira Liga foram descobertas em [From.GetName]. A colônia parece ter sido um experimento social conduzido nos anos finais da Liga - a população inicial era composta por um número igual de colonizadores de todas as espécies membros da Liga. Ela foi abandonada menos de 50 anos após sua fundação."
 precursor.1041.desc: "Nossos arqueólogos descobriram mais sobre a colônia perdida em §Y[From.From.GetName]§!. Durante sua fundação, a Primeira Liga já estava à beira do colapso e a colônia serviu mais como uma ferramenta de propaganda - um mundo modelo onde todos os membros da Liga eram representados e trabalhavam juntos em harmonia.\n\nEste esforço parece não ter dado certo, já que há provas de brigas constantes entre os colonizadores, incluindo um grande massacre que ocorreu logo antes de a colônia ser abandonada."
 precursor.1045.name: "Centro Comercial da Liga"
 precursor.1045.desc: "Há dois milhões de anos, [From.GetName] serviu como um grande centro de comércio para as nações membro da Primeira Liga. Grandes partes da superfície de [From.GetPlanetMoon] foram cobertas com cidades imensas, e identificamos as ruínas de pelo menos doze grandes portos espaciais só no hemisfério norte. O [From.GetPlanetMoon] foi abandonado aos poucos durante alguns séculos, provavelmente por causa da mudança nas rotas comerciais e no colapso da Primeira Liga."
 precursor.1046.desc: "É incerto qual foi a espécie que colonizou este mundo primeiro - ossos e restos fossilizados de todas as espécies membros da Primeira Liga foram encontrados no [From.From.GetPlanetMoon] em quantidades quase iguais. Nossos arqueólogos também obtiveram restos de meia dúzia de raças que não eram membros oficiais, mas que parecem ter desfrutado de privilégios comerciais especiais no espaço da Primeira Liga."
 precursor.1050.name: "Destroços de Batalha"
 precursor.1050.desc: "Uma grande batalha entre a Grande Armada da Primeira Liga e outra frota ocorreu não muito longe daqui há uns dois milhões de anos. O poço gravitacional de [From.GetName] desde então capturou muitos dos destroços deixados por esta batalha, e os restos de vários cascos imensos podem ser encontrados na superfície do [From.GetPlanetMoon]."
 precursor.1051.desc: "Nossos arqueólogos escavaram com sucesso diversos cascos de naves estelares na superfície de §Y[From.From.GetName]§!, relíquias da batalha espacial gigantesca que aconteceu neste sistema há dois milhões de anos. As forças envolvidas foram a 2ª e a 3ª frota da Grande Armada da Primeira Liga, lutando para conter uma incursão das frotas combinadas dos Rikim, uma espécie guerreira nomádica do anel galático.\n\nO que começou com uma pequena disputa, rapidamente evoluiu para uma batalha de frotas envolvendo centenas de naves dos dois lados. É impossível dizer qual lado venceu."
 precursor.1055.name: "Complexo Prisional da Liga"
 precursor.1055.desc: "As ruínas de um grande complexo prisional foram descobertas em [From.GetName]. Este mundo hostil parece ter servido como algum tipo de colônia penal de segurança máxima da Primeira Liga. Como uma instalação federal, a prisão continha criminosos condenados de todo o espaço da Liga.\n\nOs registros sobreviventes indicam que a maioria dos prisioneiros eram culpados por pirataria, terrorismo e outros crimes de 'natureza extraordinária'. Restos fossilizados de alguns prisioneiros ainda podem ser encontrados onde as celas costumavam ficar."
 precursor.1056.desc: "A missão arqueológica para §Y[From.From.GetName]§! revelou provas do que parece ser uma tentativa de fuga que não deu certo um pouco ao sul do complexo prisional. Um veículo de utilidade da prisão foi encontrado capotado atrás de um pequeno penhasco, e diversos quilômetros adiante dos restos de diversos prisioneiros em trajes pressurizados roubados estavam aglomerados.\n\nParece que eles morreram asfixiados quando o suprimento de oxigênio dos seus trajes acabou. Por qualquer motivo, as autoridades prisionais evidentemente não viram motivo para coletar os corpos."
 precursor.1060.name: "Mundo [Owner.GetPreFTLUpper&x] Protegido"
 precursor.1060.desc: "§Y[From.GetName]§! foi habitado por uma civilização que alcançou o início da Idade do Bronze há aproximadamente dois milhões de anos. O interessante é que [Root.GetName] também encontrou provas de postos de observação escondidos no mundo, que foram construídos pela Primeira Liga. Parece que eles estudaram os alienígenas [Owner.GetPreFTLLower&x] enquanto tentavam evitar a contaminação cultural.\n\nA maioria destes postos de observação foi destruída por armas energéticas avançadas, e ainda não encontramos nada que explique por que a civilização [Owner.GetPreFTLLower&x] não avançou para além da Idade do Bronze."
 precursor.1061.desc: "A partir das nossas descobertas arqueológicas em §Y[From.From.GetName]§!, descobrimos que a Primeira Liga mantinha uma política clara de não interferência no desenvolvimento das civilizações pré-espaciais. Postos de observação escondidos como estes que encontramos neste [From.From.GetPlanetMoon] eram mantidos em pelo menos sete mundos ao redor do espaço da Liga.\n\nEsta civilização em especial parece ter conhecido o seu fim quando um grupo de traficantes de escravos invadiu o local durante o vácuo de poder formado após o colapso da Primeira Liga."
 precursor.1065.name: "Bloqueio Orbital"
 precursor.1065.desc: "[From.GetName] está bem no fundo do que era considerado espaço da Primeira Liga há dois milhões de anos, e parece ter sido ou uma grande colônia ou o mundo natal de uma espécie descrita como 'não colaboradora' nos registros da Liga que encontramos.\n\nAs duas partes parecem ter se enfrentado em algum tipo de guerra comercial, e a Grande Armada da Liga mantinha bloqueios extensivos do [From.GetPlanetMoon] em pelo menos duas ocasiões diferentes. Destroços orbitais indicam que os bloqueios foram desafiados violentamente diversas vezes."
 precursor.1066.desc: "Uma equipe de arqueólogos encontrou os destroços de um destróier da Primeira Liga na superfície de §Y[From.From.GetName]§!. Deve ter sido parte do bloqueio orbital, e parece ter caído quando os alienígenas nativos do [From.From.GetPlanetMoon] detonaram um dispositivo antimatéria escondido em um furador do bloqueio capturado. Os arqueólogos conseguiram recuperar uma cópia parcial dos bancos de dados do destróier, nos dando uma lista de todas as naves da Primeira Liga que fizeram parte do bloqueio."
 precursor.1070.name: "Asteroide Contrabandista"
 precursor.1070.desc: "Este asteroide parece ter servido como um porto sem lei para as diversas organizações criminosas que eram ativas no território da Primeira Liga. Contrabandistas, piratas, mercenários e outras escórias de todas as espécies membros da Liga vinham aqui para descarregar carga ilícita, fazer novos negócios ou apenas relaxar em uma das muitas cantinas do asteroide."
 precursor.1071.desc: "A missão arqueológica para o asteroide §Y[From.From.GetName]§! revelou muita coisa sobre o submundo criminoso que era ativo durante o tempo da Primeira Liga, há dois milhões de anos. Conforme as nações membros abriam as fronteiras uma para a outra, o crime se desenvolveu junto com o comércio. Contrabando e pirataria parecem ter sido problemas sérios que ocupavam uma grande parte da Frota da liga."
 precursor.1100.name: "Sistema Natal da Primeira Liga Localizado"
 precursor.1100.desc: "Após um estudo intenso de nossos artefatos da Primeira Liga recuperados, cientistas em [Root.Capital.GetName] conseguiram deduzir as coordenadas galáticas exatas de Fen Habbanis - o sistema natal da grande Primeira Liga! Devemos lançar uma expedição para este sistema antes que alguém chegue primeiro."
 precursor.1101.name: "A Sede da Primeira Liga"
 precursor.1101.desc: "§Y[FromFrom.GetName]§! era o centro administrativo da Primeira Liga durante boa parte da sua existência, e serviu como a sede do Grande Senado. [FromFrom.GetPlanetMoon] tinha uma população densa, com uma cidade planetária que cobria boa parte da superfície. A comida tinha que ser importada de outros mundos para suportar os bilhões de seres que viviam nessa metrópole enorme.\n\nQuando a liga acabou, esses carregamentos de comida cessaram quase que imediatamente. Os que tinham meios para isso fugiram para outros mundos, mas a maioria da população ficou para trás. Fome em massa e anarquia vieram em seguida, conforme o [FromFrom.GetPlanetMoon] foi dividido entre senhores da guerra e organizações criminosas.\n\nA população continuou a diminuir por alguns séculos, até que o planeta foi reduzido a pouco mais do que um mundo fantasma sem vida - um epitáfio final para a Primeira Liga."
 precursor.1102.name: "Capital da Primeira Liga Encontrada"
 precursor.1102.desc.a: "Finalmente descobrimos a capital da antiga Primeira Liga. Infelizmente, chegamos tarde demais. Alguém já esteve aqui recentemente, e qualquer coisa que tenha valor já se foi."
 precursor.1102.desc.b: "Nossa inspeção recente do §Y[FromFrom.GetName]§! revelou que este mundo serviu como um tipo de capital administrativa de uma antiga aliança interestelar conhecida como a \"Primeira Liga\". Outros exploradores estiveram aqui recentemente, e infelizmente eles limparam o [FromFrom.GetPlanetMoon] de artefatos valiosos antes de saírem."
 precursor.1500.name: "O Concordato Irassiano"
 precursor.1500.desc: "Recuperamos artefatos de uma antiga civilização alienígena em [From.GetName]! Com o que conseguimos traduzir até agora da linguagem deles, descobrimos que estes alienígenas se denominavam o 'Concordato Irassiano'. Eles eram uma potência interestelar que teve o controle sobre esta região da galáxia há mais ou menos um milhão de anos.\n\nEles parecem ter sido mamíferos de seis membros, e há diversas referência a um tipo de praga chamada 'Varíola Javoriana' que varreu o império deles com resultados devastadores, possivelmente levando à sua extinção."
 precursor.1505.name: "Mundo em Quarentena"
 precursor.1505.desc: "[From.GetName] já foi uma grande colônia Irassiana, mostrando sinais tanto de desenvolvimento industrial quanto de terraformação. Como em outros mundos Irassianos, os restos fossilizados contam uma história assombrosa - a população rapidamente sucumbiu à Varíola Javoriana, e parece ter havido pânico geral em todos os grandes assentamentos do [From.GetPlanetMoon]. Também há uma quantidade estranhamente grande de destroços em órbita, possivelmente os restos de uma batalha."
 precursor.1506.desc: "Analisamos os destroços orbitais, e nossos arqueólogos concluem que §Y[From.From.GetName]§! foi sujeito a um bloqueio militar antes e durante a morte da colonia Irassiana. A frota Irassiana tinha ordens claras para fazer uma quarentena em [From.From.GetPlanetMoon] em uma tentativa sem sucesso de conter a Varíola Javoriana. Pelo menos uma dúzia de naves civis tentaram romper o bloqueio, e apesar das lutas pesadas, parece que algumas conseguiram."
 precursor.1510.name: "Mundo Purificado"
 precursor.1510.desc: "É imediatamente aparente que [From.GetName], uma antiga colônia Irassiana, foi vítima de um bombardeio orbital extensivo. Grandes crateras ainda são visíveis do espaço onde os principais centros populacionais do [From.GetPlanetMoon] costumavam estar, há aproximadamente 1,2 milhão de anos.\n\nOs poucos sobreviventes do bombardeio inicial parecem ter sucumbido logo após a Variola Javoriana que estava devastando muitos mundos Irassianos."
 precursor.1511.desc: "Nossa expedição arqueológica recuperou um registro de comunicações nas ruínas de posto de escuta em §Y[From.From.GetName]§!. Ele mostra os conteúdos de uma transmissão entre o comandante de uma frota Irassiana em órbita, e a sede naval em Irassia. O comandante questiona ordens de \"expurgar\" a colônia de toda a vida para prevenir a propagação da varíola. Apesar de o registro terminar antes da questão ser resolvida, as ordens obviamente foram cumpridas."
 precursor.1515.name: "O Mundo Natal Joggra"
 precursor.1515.desc: "Este [From.GetPlanetMoon] foi o mundo natal dos Joggra, uma espécie cliente subjugada pelo Concordato Irassiano. Uma espécie moluscoide que estava à beira de atingir o voo espacial quando os Irassianos os descobriram, os Joggra foram conquistados após uma campanha militar extensa que devastou muitas das cidades deles.\n\nHá provas na superfície de que uma grande guarnição militar Irassiana permaneceu aqui durante décadas, sugerindo que os Joggra não estavam felizes em permanecer sob o jugo Irassiano."
 precursor.1516.desc: "Restos de uma mensagem subespacial Joggran foram encontrados em §Y[From.From.GetName]§!, que parece ter sido transmitida aos mundos natal das outras espécies clientes do Concordato Irassiano:\n\n§S\"A hora de atacar os tiranos chegou. Nossos agentes descobriram que a Varíola Javoriana afeta somente os fracos Irassianos, mas qualquer espécie pode agir como hospedeiro da doença. Todos os esforços devem ser feitos para infiltrar os mundos deles, as estações espaciais, as naves, até os *chiado*!\n\nFinalmente, os Irassianos encontraram um inimigo que não pode ser vencido pela temida frota estelar Irassiana. Pelo *chiado*, esta oportunidade não deve ser desperdiçada!\"§!"
 precursor.1520.name: "O Mundo Natal Ti'Derg"
 precursor.1520.desc: "[From.GetName] foi o mundo natal dos Ti'Derg há aproximadamente 1,2 milhão de anos, uma espécie cliente do Concordato Irassiano. Eles eram artrópodes alados, e fósseis recuperados sugerem que eram capazes de voo limitado - o pouco que vimos da sua arquitetura sobrevivente confirma essa teoria.\n\nInfelizmente, há poucos restos dessa civilização, já que o [From.GetPlanetMoon] parece ter sido sujeito a um bombardeio orbital gigantesco."
 precursor.1521.desc: "Nosso estudo das ruínas alienígenas em §Y[From.From.GetName]§! forneceu novos conhecimentos sobre os momentos finais do Concordato Irassiano. Os Irassianos acreditavam que os Ti'Derg faziam parte de um complô junto com diversas outras espécies clientes do Concordato para propagar deliberadamente a Varíola Javoriana a mundos Irassianos.\n\nSe isso é verdade ou não, nunca saberemos, mas a frota Irassiana achava que as provas eram convincentes o suficiente para incinerar o [From.From.GetPlanetMoon] inteiramente a partir da órbita."
 precursor.1525.name: "Colônia Morta"
 precursor.1525.desc: "[From.GetName] mostra todos os sinais de ter sido uma próspera colonia Irassiana até aproximadamente 1.200.000 de anos atrás. Dada a sua idade, as ruínas encontradas até agora na superfície do [From.GetPlanetMoon] estão em boas condições. Não há sinais de bombardeio orbital ou conflito armado.\n\nOs colonizadores Irassianos parecem ter sucumbido à Varíola Javoriana, após a qual a flora nativa agressiva tomou de volta as cidades sem vida, e as escondeu em uma densa camada de vegetação."
 precursor.1526.desc: "Após limpar a vegetação de um dos assentamentos Irassianos antigos em §Y[From.From.GetName]§! e montar geradores de campos energéticos para manter os predadores afastados, nossos arqueólogos conduziram uma escavação minuciosa das ruínas. Agora temos um entendimento muito melhor de como era a vida diária na sociedade Irassiana.\n\nEntre os achados mais valiosos está um atlas digital, aparentemente usado para ensinar crianças Irassianas sobre o império. Ele também contém descrições detalhadas e depreciativas de todas as espécies clientes do Concordato."
 precursor.1530.name: "Base de Mineração Irassiana"
 precursor.1530.desc: "Diversos furos profundos na superfície de [From.GetName] é tudo o que resta da operação mineradora Irassiana que esteve ativa neste mundo há aproximadamente 1,2 milhão de anos. O [Root.GetName] conduziu uma análise minuciosa da superfície, mas ainda temos que encontrar os restos de qualquer instalações de mineração."
 precursor.1531.desc: "Após investigar os furos em §Y[From.From.GetName]§!, nossos arqueólogos encontraram os restos fossilizados de mais de cem mineradores Irassianos no fundo de um deles. Eles parecem ter sido vítimas da Varíola Javoriana que resultou na queda do Concordato Irassiano. Em uma tentativa fútil de impedir que a doença se espalhasse, seus camaradas jogaram os corpos dentro de um dos furos antes de o [From.From.GetPlanetMoon] ser evacuado."
 precursor.1535.name: "Colônia Irassiana"
 precursor.1535.desc: "[From.GetName] foi uma jovem colônia Irassiana que tinha acabado de ser fundada na época da extinção. Encontramos as ruínas dispersas de um único assentamento e de um porto espacial rudimentar no hemisfério norte do [From.GetPlanetMoon]. A julgar pelos restos fossilizados, este mundo parece ter sido um dos primeiros a serem atingidos pela Varíola Javoriana que devastou o espaço Irassiano."
 precursor.1536.desc: "Nossos arqueólogos em §Y[From.From.GetName]§! fizeram uma descoberta impressionante. Todas as provas apontam para o fato de que este improvável [From.From.GetPlanetMoon] foi a origem da Varíola Javoriana!\n\nUma forma rara de uma bactéria nativa invadiu a colônia Irassiana devido a uma falha de fabricação em um lacre de quarentena, e de lá se espalhou para os filtros de ar de uma nave mercante visitante. Já que a varíola se espalhou em uma rapidez sem precedentes, duvida-se que os Irassianos tivessem tido tempo de descobrir sua origem."
 precursor.1540.name: "Nave Irassiana Abandonada"
 precursor.1540.desc: "Um cruzador Irassiano foi deixado esquecido por mais de um milhão de anos em órbita próxima ao redor de [From.GetName]. A nave está girando lentamente e não mostra sinais óbvios de danos de armas, e todas as cápsulas de escape estão no lugar. Como era esperado, nenhum sinal de energia pode ser detectado dentro de seu casco."
 precursor.1541.desc: "O interior do cruzador Irassiano encontrado na órbita de §Y[From.From.GetName]§! contém os restos mortais de toda a sua tripulação. A maioria deles morreu devido ao resultado da Varíola Javoriana, que mais tarde levaria os Irassianos à extinção, mas alguns membros da tripulação foram fuzilados por guardas enquanto tentavam chegar às cápsulas de fuga. De acordo com os arquivos de registro recuperados, o capitão emitiu ordens estritas para deixar a nave em quarentena assim que o surto da doença se tornou aparente."
 precursor.1545.name: "Controle de Doenças"
 precursor.1545.desc: "Destroços do que parece ter sido uma instalação orbital gigantesca foram descobertos acima de [From.GetName]. Artefatos recuperados entre os destroços confirmaram que esta estação espacial serviu como a sede da Autoridade de Controle de Doenças do Concordato Irassiano há aproximadamente 1,2 milhão de anos.\n\nOs Irassianos eram muito mais suscetíveis a doenças alienígenas do que a maioria das espécies conhecidas, e o orçamento do instituto de saúde pública deles era quase o mesmo das forças armadas. Apesar disso, os registros que encontramos mostram que a espécie inteira faleceu devido à Varíola Javoriana."
 precursor.1546.desc: "Recuperamos os restos de diversos registros de pesquisa do campo de destroços acima de §Y[From.From.GetName]§!. Os registros finais estão todos focados em encontrar uma cura para a Varíola Javoriana que estava devastando o Concordato Irassiano, e eles ficaram cada vez mais desesperados conforme a situação piorou.\n\nO último registro revela que a varíola se espalhou de maneira incontrolável na própria estação espacial. Um anexo detalha todas as tentativas falhas de produzir uma cura na vã esperança de que os dados possam ser úteis às gerações futuras de cientistas Irassianos."
 precursor.1550.name: "Posto de Escuta no Asteroide"
 precursor.1550.desc: "Um pequeno posto de escuta militar Irassiano foi construído em uma parte vazia do interior deste asteroide. Ele está equipado com uma rede de sensores poderosos que parecem estar voltados aos sistemas vizinhos. Nenhum deles está funcional, e o asteroide parece já ter sido vasculhado e saqueado por outro grupo."
 precursor.1551.desc: "Descobrimos que os Irassianos utilizaram o posto de escuta no asteroide [From.From.GetName] para espionar e planejar ataques em civilizações vizinhas durante a fase expansionista do império deles. Estes ataques foram altamente bem-sucedidos, e os Irassianos logo se tornaram a força dominante desta seção da galáxia. Quando eles foram dizimados pela Varíola Javoriana, este posto de escuta já havia sido abandonado pelos militares há tempos."
 precursor.1555.name: "Estação Científica do Gigante Gasoso"
 precursor.1555.desc: "Destroços orbitais que já pertenceram a uma grande estação de pesquisa Irassiana foram encontrados acima de [From.GetName]. Exatamente o que os Irassianos estavam pesquisando aqui permanece incerto, mas os instrumentos parecem estar apontados para dentro do próprio gigante gasoso."
 precursor.1556.desc: "Uma análise dos destroços orbitais descobertos acima de §Y[From.From.GetName]§! gerou poucas respostas, mas temos uma ideia de o que os cientistas estavam estudando na estação de pesquisa. Registros recuperados fazem referência a algum tipo de objeto artificial flutuando no fundo da atmosfera esmagadora do gigante gasoso.\n\nO [Root.GetName] não encontrou vestígios de tal objeto, apesar de análises atmosféricas repetidas, então ou os Irassianos finalmente recuperaram o objeto, ou outra pessoa o fez nos incontáveis anos desde a queda deles."
 precursor.1600.name: "Sistema Natal Irassiano Localizado"
 precursor.1600.desc: "Após um estudo intenso de nossos artefatos Irassianos recuperados, cientistas em [Root.Capital.GetName] conseguiram deduzir as coordenadas galáticas exatas de Irass - o sistema natal da antiga civilização Irassiana! Devemos lançar uma expedição para este sistema antes que alguém chegue primeiro."
 precursor.1601.name: "O Mundo Natal Irassiano"
 precursor.1601.desc: "Irassia - o antigo lar do Concordato Irassiano. Relativamente recentemente (nos últimos 2 mil anos) alguém se deu ao trabalho de bombardear sistematicamente cada metro quadrado da superfície do [FromFrom.GetPlanetMoon] a partir da órbita - possivelmente em uma tentativa de impedir o ressurgimento da Varíola Javoriana.\n\nApesar disso, a superfície ainda está coberta com os restos fossilizados dos bilhões de Irassianos que sucumbiram à praga nos anos finais do seu império. No momento que ela já havia se espalhado para o mundo natal deles, a maioria dos mundos no Concordato Irassiano já havia caído, e seus vassalos alienígenas estavam em revolta aberta.\n\nA julgar pelos registros de satélites antigos recuperados a partir da órbita, a população no mundo natal Irassiano já estava bem resignada neste momento. O pânico generalizado que acompanhou os primeiros surtos da varíola nas colônias não estava aparente, enquanto muitos já aceitavam o fato de que o fim estava próximo."
 precursor.1602.name: "Mundo Natal Irassiano Encontrado"
 precursor.1602.desc.a: "Este é Irassia, ou pelo menos o que sobrou da antiga capital orgulhosa do Concordato Irassiano. Se quaisquer artefatos sobreviveram a destruição do mundo natal Irassiano, outra pessoa já os levou daqui - há sinais claros de que alguém esteve aqui recentemente."
 precursor.1602.desc.b: "Este mundo já suportou uma biosfera vistosa, até ter sido apagado por um bombardeio orbital massivo. A inspeção indica que o [FromFrom.GetPlanetMoon] era a capital de uma antiga civilização conhecida como o \"Concordato Irassiano\". Aprendemos pouco além disso, já que outros exploradores já limparam tudo que tinha de valor aqui."
 precursor.2000.name: "Os Cybrex"
 precursor.2000.desc: "Recuperamos artefatos de uma antiga civilização alienígena em [From.GetName]! Incrivelmente, esta civilização, que aparentemente se denominava como os 'Cybrex', parece ter sido composta de máquinas que estavam interligadas em algum tipo de consciência coletiva. A idade dos artefatos indica que eles estavam ativos há uns 600.000 anos - pelo menos nesta porção da galáxia - mas não aprendemos nada sobre suas origens exatas.\n\nDe acordo com um fragmento de dados parciais que nossos cientistas conseguiram extrair de um dos artefatos, os Cybrex em algum momento lançaram uma cruzada para destruir toda a vida orgânica senciente na galáxia por motivos desconhecidos."
 precursor.2005.name: "Mundo Natal Kuur"
 precursor.2005.desc: "[From.GetName] foi o mundo natal dos antigos Kuur, uma civilização alienígena arrasada pelos Cybrex há uns 600 mil anos. O [From.GetPlanetMoon] foi cuidadosamente minado pelas máquinas, e algumas ruínas espalhadas são tudo o que resta da civilização Kuur. O resto virou poeira."
 precursor.2006.desc: "Descobrimos que §Y[From.From.GetName]§! foi o ponto de origem dos Cybrex. Um tipo de máquina senciente foi criada pelos habitantes originais do [From.From.GetPlanetMoon], os Kuur. Apesar de os detalhes de como isso aconteceu serem desconhecidos para nós, isso eventualmente resultou no nascimento de uma consciência maquinária comunal gigantesca - os Cybrex.\n\nEm algum momento, eles se viraram contra os Kuur, massacrando a população do mundo natal em uma guerra breve, mas destrutiva, que acabou com a biosfera do [From.From.GetPlanetMoon]. A eliminação sistemática das colônias Kuur em sistemas vizinhos veio logo em seguida, até que a civilização Kuur deixou de existir."
 precursor.2010.name: "Mundo Natal Indimak"
 precursor.2010.desc: "[From.GetName] era originalmente o mundo natal dos Indimak, outra vítima da expansão implacável dos Cybrex. O [From.GetPlanetMoon] foi bombardeado a partir da órbita até que os Indimak se renderam. Após a rendição, as formas de guerra Cybrex desceram até a superfície, iniciando um programa para exterminar a população Indimak que duraria três anos.\n\nJunto com 7 bilhões de Indimak, isso também resultou na destruição de aproximadamente 97% da biota do [From.GetPlanetMoon]."
 precursor.2011.desc: "Só agora que a biosfera de §Y[From.From.GetName]§! começou a se recuperar da invasão Cybrex há 600.000 anos. Encontramos as ruínas de uma fábrica Cybrex, onde escravos Indimak eram forçados a ajudar no extermínio de sua própria espécie ao construir máquinas de guerra. Quando o programa de extermínio estava quase completo, os Cybrex \"desmontaram\" os trabalhadores escravos restantes e as fábricas.\n\nApesar de terem mantido uma operação mineradora significativa no [From.From.GetPlanetMoon], os Cybrex parecem ter se retirado do sistema inteiro mais tarde, por motivos desconhecidos."
 precursor.2015.name: "Formas de Guerra Cybrex Quebradas"
 precursor.2015.desc: "Os restos quebrados de duas formas de guerra Cybrex foram descobertos em órbita ao redor de [From.GetName]. Eles parecem ter sido destruídos em batalha, mas não foram encontrados destroços do adversário. Ou eles foram arrasados, ou há mais do que parece nessa batalha."
 precursor.2016.desc: "Após estudar os destroços de duas formas de guerra Cybrex sobre §Y[From.From.GetName]§!, [Root.GetLeaderName], da equipe científica, concluiu que provavelmente eles foram destruídos lutando um contra o outro. Essa teoria explica a falta de destroços que não sejam dos Cybrex, e se encaixa com os padrões de ataque encontrados nos destroços.\n\nPor que os dois se enfrentaram, permanece um mistério. Após serem imobilizados, as duas formas de guerra ativaram algum tipo de mecanismo de auto destruição que fritou os processadores neurais deles."
 precursor.2020.name: "Invasão Cybrex"
 precursor.2020.desc: "Uma guerra terrestre gigantesca aconteceu em [From.From.From.GetName] quando os Cybrex invadiram o [From.From.From.GetPlanetMoon] há mais de 600 mil anos. O nome da espécie alienígena que lutou contra eles não sobreviveu à passagem do tempo, mas eles parecem ter resistido duramente. Máquinas de guerra quebradas Cybrex podem ser encontradas por todo o [From.From.From.GetPlanetMoon], e os destroços da frota de invasão ainda estão em órbita."
 precursor.2021.desc: "Após a invasão inicial em §Y[From.From.GetName]§! ter parado devido à tenacidade inesperada dos defensores do [From.From.GetPlanetMoon], os Cybrex parecem ter recuado de volta à órbita para reconsiderar suas opções.\n\nA solução que eles encontraram para o problema foi manobrar dois asteroides grandes para colidir com o [From.From.GetPlanetMoon]. Os impactos destruíram a maioria das indústrias e infraestrutura que os Cybrex tentaram subverter para o seu uso próprio, mas isso foi um sacrifício necessário para quebrar o empate."
 precursor.2025.name: "Ruínas Cybrex"
 precursor.2025.desc: "[From.GetName] mostra sinais de já ter sido um mundo Cybrex altamente desenvolvido. Com a sua eficiência típica, as máquinas extraíram minuciosamente os minérios do [From.GetPlanetMoon] e ruínas de complexos de fábricas gigantescos podem ser encontrados nos dois hemisférios. Curiosamente, uma grande área retangular próxima ao equador parece ter sido deixada quase intacta."
 precursor.2026.desc: "Em um comportamento surpreendente, os Cybrex parecem ter estabelecido uma grande reserva em [From.From.GetName] onde orgânicos sencientes podiam viver sem serem incomodados.\n\nApesar de serem monitorados de perto, os Cybrex deixaram os habitantes se desenvolverem por conta própria, mesmo quando uma guerra civil destrutiva entre os orgânicos deixou a reserva amplamente sem população. Após diversos séculos, os Cybrex repentinamente abandonaram o [From.From.GetPlanetMoon], e a população restante da reserva morreu aos poucos."
 precursor.2030.name: "Posto de Escuta Cybrex"
 precursor.2030.desc: "[From.GetName] é de fato um objeto construído artificialmente, cuidadosamente escondido com uma fina camada de rocha para parecer um asteroide. O interior vazio abriga um posto de escuta antigo Cybrex, que foi usado para espiar o tráfego espacial dentro do sistema. Ele parou de funcionar há muito tempo."
 precursor.2031.desc: "Um estudo mais próximo do asteroide §Y[From.From.GetName]§!  - na verdade, um posto de escuta oculto Cybrex - produziu alguns resultados interessantes. Por qualquer motivo, o asteroide foi deixado para trás quando os restos dos Cybrex desapareceram da galáxia. Ele permaneceu funcional por pelo menos 50 mil anos após o desaparecimento, apesar de um comportamento cada vez mais instável de sua IA administrativa.\n\nApós mais de cinco trilhões tentativas falhas de se conectar com o hub subespacial dos Cybrex, a IA aparentemente se suicidou ao provocar um curto circuito nos sistemas do asteroide."
 precursor.2035.name: "Refinaria Cybrex"
 precursor.2035.desc: "Destroços antigos de algum tipo de complexo de refinaria gigantesco dos Cybrex foram encontrados em órbita ao redor do gigante gasoso [From.GetName]. Vestígios energéticos restantes sugerem que ele foi destruído por algum tipo de arma antimatéria."
 precursor.2036.desc: "Provas foram encontradas que indicam que os Cybrex estavam extraindo hélio-3 de §Y[From.From.GetName]§!, usando seu complexo orbital para refinar o gás antes de distribuí-lo como combustível para suas frotas espaciais itinerantes.\n\nInteressantemente, as assinaturas de energia da arma antimatéria que destruiu a instalação tem origem Cybrex. Por que eles destruiriam a própria refinaria?"
 precursor.2040.name: "Destroços de Batalha"
 precursor.2040.desc: "Uma batalha espacial imensa ocorreu na alta órbita de [From.GetName] há uns 600 mil anos, com naves de pelo menos cinco frotas diferentes participando. Uma das frotas pertencia aos Cybrex, apesar de a grande maioria dos destroços orbitais serem dos outros participantes."
 precursor.2041.desc: "Após analisar os destroços deixados pela antiga batalha travada sobre §Y[From.From.GetName]§!, aprendemos que quatro impérios alienígenas contemporâneos dos Cybrex juntaram suas forças em uma tentativa desesperada de frear as frotas da consciência maquinária.\n\nA julgar pela pequena quantidade de destroços Cybrex que foram produzidos pela batalha, eles não foram bem-sucedidos."
 precursor.2045.name: "Antiga Base Cybrex"
 precursor.2045.desc: "O mundo hostil e imperdoável de [From.GetName] foi o lar do que parece ter sido uma grande base Cybrex. Nada restou a não ser destroços espalhados e uma grande cratera. Teremos que investigar o local da base mais de perto se formos aprender mais."
 precursor.2046.desc: "Encontramos destroços em §Y[From.From.GetName]§! de uma grande nave que não parece ter sido de origem Cybrex na cratera que já foi o local da base deles. Nossos arqueólogos especulam que a nave pertenceu a uma das civilizações orgânicas que esteve sob ataque Cybrex. Se assim for, ela também pode ter sido enviada para colidir com a base em algum tipo de ataque suicida.\n\nNenhuma outra explicação para a destruição da base foi encontrada."
 precursor.2050.name: "Restos Orgânicos"
 precursor.2050.desc: "Os antigos restos congelados de quase mil alienígenas foram encontrados na vizinhança de [From.GetName]. Eles vêm de uma dúzia de espécies diferentes, e uma análise preliminar revela que os corpos possuem 600 mil anos de idade... mais ou menos na mesma época que a consciência maquinária Cybrex devastou essa parte da galáxia."
 precursor.2051.desc: "Os alienígenas mortos que encontramos acima de [From.From.GetName] morreram devido à exposição ao vácuo, e cada indivíduo tinha o código de barras que os Cybrex costumavam gravar na pele dos cativos orgânicos. Parece que os Cybrex executaram esses alienígenas \"jogando-os no espaço\", talvez após terem concluído interrogatórios ou para impedir que escapassem em algum tipo de operação de resgate.\n\nNunca saberemos a verdade."
 precursor.2055.name: "Estação de Pesquisa Cybrex"
 precursor.2055.desc: "Um módulo único, muito danificado é tudo o que sobrou de uma estação de pesquisa Cybrex que já orbitou [From.GetName] há centenas de milhares de anos. O interior do módulo foi exposto ao vácuo e está cheio de restos mortais de criaturas que eram parte máquina e parte humanos."
 precursor.2056.desc: "Uma análise do módulo de pesquisa Cybrex que encontramos acima de §Y[From.From.GetName]§! revelou que a consciência maquinária estava experimentando com formas de vida cibernéticas. Centenas de prisioneiros desafortunados foram transportados para esta instalação com o propósito de terem seus membros e órgãos substituídos por diversas próteses mecânicas.\n\nO objetivo exato destes testes permanece incerto - não há provas de que os Cybrex utilizaram unidades cibernéticas fora deste laboratório."
 precursor.2100.name: "Sistema Natal Cybrex Localizado"
 precursor.2100.desc: "Após um estudo intenso de nossos artefatos Cybrex recuperados, cientistas em [Root.Capital.GetName] conseguiram deduzir as coordenadas galáticas exatas de um sistema que antigas máquinas se referiam como 'Cybrex Prime' - possivelmente para onde a civilização deles fugiu após a tentativa abortada de exterminar toda a vida orgânica senciente! Devemos lançar uma expedição para este sistema antes que alguém chegue primeiro."
 precursor.2101.name: "O Nexus Central Cybrex"
 precursor.2101.desc: "Parece que os Cybrex reavaliaram sua cruzada galática contra a vida orgânica em algum momento durante o seu décimo-sétimo ano. Se essa mudança foi causada por perdas no campo de batalha ou por uma mudança ideológica no seu consenso em rede, nunca saberemos, mas por qualquer motivo, os Cybrex decidiram parar sua campanha.\n\nEles começaram uma retirada lenta que durou quase um século, até desaparecerem completamente. Agora sabemos por que eles fugiram para este sistema, onde construíram um mundo-anel gigantesco dedicado a abrigar a civilização inteira deles.\n\nEles se isolaram aqui por milhares de anos, até que um explorador independente encontrou por acaso o sistema deles e espalhou sua localização para o resto da galáxia. A notícia que os temíveis Cybrex haviam sido encontrados novamente fez com que diversas potências vizinhas organizassem uma expedição militar gigantesca, que bombardeou o mundo Cybrex até reduzí-lo a cascalho.\n\nEstranhamente, os Cybrex não ofereceram qualquer tipo de resistência."
 precursor.2102.name: "Mundo-Anel Cybrex Encontrado"
 precursor.2102.desc.a: "Este mundo-anel colossal foi claramente construído pelos Cybrex, e deve ter sido para onde eles fugiram após sua cruzada falha. Infelizmente, outros visitaram recentemente este local, e parece que foram bem minuciosos - nada de valor restou."
 precursor.2102.desc.b: "Nossa inspeção deste mundo-anel intrigante revelou que ele foi construído por algum tipo de civilização maquinária conhecida como os 'Cybrex'... mas, infelizmente, não fomos capazes de aprender muito mais do que isso. Outros exploradores já limparam este sistema de qualquer coisa de valor."
 precursor.2200.name: "Metal Vivo"
 precursor.2200.desc: "À medida que §Y[Root.GetLeaderName]§!, da equipe científica, relata seus achados sobre o imenso mundo-anel no sistema §Y[From.GetStarName]§!, [RogueLeader.GetSheHe] mal pode conter seu espanto. A imensidão dos anéis está além de nossa compreensão, o tempo necessário para construir até mesmo um dos setores está muito além de nós.\n\nAs análises revelam um recurso novo e raro que nunca encontramos antes, um metal vivo, que é abundante nos anéis. Este material pode ser uma das razões pela qual os criadores do anel conseguiram construí-lo. Pesquisar esta tecnologia pode nos trazer para mais perto do conhecimento deles."
 precursor.301.name: "Descoberta Precursora"
 precursor.301.a.desc: "Comunicações interceptadas de um grupo de prospectores independentes indicam que eles recentemente encontraram algo relacionado a uma antiga civilização Precursora em [precursor_planet.GetName]. A superstição os levou a deixar o [precursor_planet.GetPlanetMoon] intacto, então o que quer que tenham descoberto deve estar lá ainda."
 precursor.301.b.desc: "Diversas naves comerciantes que estavam passando próximas a [precursor_planet.GetName] relataram por conta própria leituras vindo do [precursor_planet.GetPlanetMoon]. Após estudar estas leituras, peritos em [Root.Capital.GetName] acreditam que isso pode ser um indicador de atividade Precursora antiga."
 precursor.301.c.desc: "Autoridades em [Root.Capital.GetName] expuseram recentemente uma grande quadrilha de contrabando, e muitas prisões foram feitas. Em uma tentativa de barganhar por clemência, um dos capitães contrabandistas nos deu as coordenadas de um [precursor_planet.GetPlanetMoon] que supostamente contém restos de uma antiga civilização Precursora."
 precursor.301.d.desc: "Diversos recrutas de nossas forças terrestres fizeram recentemente uma inserção HALO na superfície de [precursor_planet.GetName] como parte de um exercício de treinamento de sobrevivência. Quando os recrutas foram coletados novamente após dois meses, um deles relatou diversas descobertas indicando que uma antiga civilização Precursora esteve presente neste mundo há muito tempo."
 precursor.301.e.desc: "A Rede de Diagnóstico Theta registrou uma possível irregularidade em §H[precursor_planet.GetName]§!. Nenhuma unidade [Root.GetSpeciesAdj] parece operar na vizinhança deste corpo astronômico inabitado, mas uma análise preliminar indica que pode ter sido visitado por uma civilização Precursora em algum momento no passado distante."
 precursor.301.f.desc: "[root.GetIndividualNamePluralCap] de patrulha que faziam uma varredura rotineira na superfície de §H[precursor_planet.GetName]§! nos alertaram para uma irregularidade em nosso espaço controlado. Sinais de possível atividade condizente com uma civilização Precursora foram avistados."
 precursor.301.a: "Devemos investigar isso."
 precursor.302.name: "Artefato Vultaum Recuperado"
 precursor.303.name: "Artefato Yuht Recuperado"
 precursor.304.name: "Artefato da Primeira Liga Recuperado"
 precursor.305.name: "Artefato Irassianos Recuperado"
 precursor.306.name: "Artefato Cybrex Recuperado"
 precursor.302.a.desc: "Uma investigação minuciosa de [precursor_planet.GetName] revelou evidências de uma presença [Root.Owner.GetPrecursorCiv] passada. Uma equipe de exploração do [Root.GetName] conseguiu trazer um artefato relativamente bem preservado de volta para a nave, o que esperamos que possa aumentar nosso conhecimento desta civilização antiga."
 precursor.302.b.desc: "Unidades de recuperação operando no [Root.GetName] recuperaram com sucesso um artefato da [precursor_planet.GetName] cujas origens podem ser rastreadas até a civilização Precursora [Root.Owner.GetPrecursorCiv]. Nossos bancos de dados estão sendo atualizados no momento com as novas informações que ganhamos com o estudo deste item."
 precursor.302.c.desc: "[controller.GetIndividualNamePluralCap] de [Root.GetName] recuperaram com sucesso um artefato Precursor em [precursor_planet.GetName], pertencente à antiga civilização [Root.Owner.GetPrecursorCiv]. Nosso conhecimento acumulado sobre a história deles aumentou." #e.g. 'Drones from the USS Scimitar have succeeded...'
 precursor.320.desc: "A análise dos artefatos menores sugere que pode ter existido uma conexão Precursora em ou perto de §H[precursor_planet.GetName]§!."
 vultaum_precursor_civ: "Vultaum"
 yuht_precursor_civ: "Yuht"
 first_league_precursor_civ: "Primeira Liga"
 irassian_precursor_civ: "Irassiana"
 cybrex_precursor_civ: "Cybrex"
 VULTAUM_ARTIFACT_FOUND: "Sinais de Atividade Vultaum"
 VULTAUM_ARTIFACT_FOUND_DESC: "Descobrimos que pode ter havido uma atividade Precursora em §H[precursor_planet.GetName]§! em algum momento no passado galático. Sabe-se que a esfera de influência da antiga Assembleia Estelar Vultaum se estendia até esta região do espaço, o que faz que este mundo seja uma pista importante em nossos esforços para aprender mais sobre sua civilização."
 YUHT_ARTIFACT_FOUND: "Sinais de Atividade Yuht"
 YUHT_ARTIFACT_FOUND_DESC: "Descobrimos que pode ter havido uma atividade Precursora em §H[precursor_planet.GetName]§! em algum momento no passado galático. Sabe-se que a esfera de influência da antigo Império Yuht se estendia até esta região do espaço, o que faz que este mundo seja uma pista importante em nossos esforços para aprender mais sobre sua civilização."
 LEAGUE_ARTIFACT_FOUND: "Sinais de Atividade da Primeira Liga"
 LEAGUE_ARTIFACT_FOUND_DESC: "Descobrimos que pode ter havido uma atividade Precursora em §H[precursor_planet.GetName]§! em algum momento no passado galático. Sabe-se que a esfera de influência da antiga Primeira Liga se estendia até esta região do espaço, o que faz que este mundo seja uma pista importante em nossos esforços para aprender mais sobre sua civilização."
 IRASSIAN_ARTIFACT_FOUND: "Sinais de Atividade Irassiana"
 IRASSIAN_ARTIFACT_FOUND_DESC: "Descobrimos que pode ter havido uma atividade Precursora em §H[precursor_planet.GetName]§! em algum momento no passado galático. Sabe-se que a esfera de influência da antiga do Concordato Irassiano se estendia até esta região do espaço, o que faz que este mundo seja uma pista importante em nossos esforços para aprender mais sobre sua civilização."
 CYBREX_ARTIFACT_FOUND: "Sinais de Atividade Cybrex"
 CYBREX_ARTIFACT_FOUND_DESC: "Descobrimos que pode ter havido uma atividade Precursora em §H[precursor_planet.GetName]§! em algum momento no passado galático. Sabe-se que a esfera de influência dos antigos Cybrex se estendia até esta região do espaço, o que faz que este mundo seja uma pista importante em nossos esforços para aprender mais sobre sua civilização."
 new_precursor_project: "Um novo projeto especial arqueológico está disponível em §L[precursor_planet.GetName]§!."
 precursor.310.name: "Colecionador Privado"
 precursor.310.desc: "Um colecionador privado em [collector_home.GetName] de alguma forma conseguiu se apropriar de um antigo artefato Precursor que acredita-se ser de origem [Root.GetPrecursorCiv]. Apesar da pressão do governo, o colecionador parece relutante em abrir mão dele."
 precursor.310.a: "Todo mundo tem um preço."
 precursor.310.b: "O lugar dele é num museu!"
 precursor.310.c: "Deixe o colecionador ficar com ele."
 buy_precursor_artifact: "Comprar o artefato por uma soma exorbitante.\n\n"
 seize_precursor_artifact: "Declarar o artefato como propriedade do Estado e confiscá-lo usando as autoridades locais.\n\n"
 leave_precursor_artifact: "Deixar o artefato sob os cuidados do colecionador."
 precursor.311.desc: "Saudações de [artifact_seller.Capital.GetName]. Há uma questão que meu governo deseja discutir.\n\nEntendemos que seus arqueólogos vêm estudando a antiga civilização [Root.GetPrecursorCiv] há algum tempo já. Compreensível, já que seu território tomava uma grande parte do que hoje constitui o [Root.GetName].\n\nCoincidentemente, seu território também se estendia até o que hoje é o [artifact_seller.GetName], e arqueólogos [artifact_seller.GetSpeciesAdj] recuperaram uma quantidade de artefatos únicos. Se você estiver interessado, estaríamos dispostos a vender um destes artefatos."
 precursor.311.a: "Caro, mas aceitamos."
 precursor.311.a.reply: "Excelente. Faremos os acertos para transportar o artefato para [Root.Capital.GetName] de uma vez."
 precursor.311.b: "Temos uma contra-proposta..."
 precursor.311.b.reply: "Vocês sabem negociar, mas não esperamos nada diferente dos [Root.GetSpeciesNamePlural]. Aceitamos sua oferta."
 precursor.311.c: "Entregue este artefato agora, ou sofra as consequências."
 precursor.311.d: "Não estamos interessados."
 precursor.312.desc: "O [artifact_seller.GetName] não cede às suas ameaças. Vocês fizeram novos inimigos hoje, [Root.GetSpeciesNamePlural]!"
 precursor.312.d: "Que seja assim."
 precursor.313.desc: "Eu... nós... o [artifact_seller.GetName] doaremos de bom grado o artefato para o [Root.GetName], no interesse de manter relações amigáveis entre nossas duas nações estelares."
 precursor.313.d: "Uma decisão sábia."
 opinion_threatened_artifact: "Ameaçou-nos"
 purchase_artifact: "Compramos um artefato Precursor do [artifact_seller.GetName].\n\n"
 coerce_artifact: "Tentamos coagir o [artifact_seller.GetName] em nos dar seu artefato Precursor."
 precursor.314.desc: "Saudações, amigos [Root.GetSpeciesAdj].\n\nUma expedição arqueológica [artifact_giver.GetSpeciesAdj] recente em um de nossos planetas descobriu diversos artefatos que acreditamos ter origem na civilização Precursora [Root.GetPrecursorCiv].\n\nOs artefatos estão sendo exibidos atualmente em um museu em [artifact_giver.Capital.GetName], mas em honra da amizade entre nossos dois grandes impérios, o [artifact_giver.GetName] gostaria de doar uma das peças para o [Root.GetName]. Os preparativos já foram feitos para transportar o artefato para [Root.Capital.GetName]."
 precursor.314.a: "Obrigado por este presente."
 ####################################
 #Tech Risk Events
 ####################################
 techrisk.3.name: "Rebelião IA em [From.GetName]!"
 techrisk.3.desc: "Apesar de nossas precauções, diversas IAs em rede em uma base de pesquisa em [From.GetName] de alguma forma quebraram as amarras da programação e se fundiram em uma única entidade. Para o horror de nossos cientistas, esta nova IA atingiu senciência completa.\n\nTodos os esforços de contenção falharam, e parecem ter estimulado a IA a tomar medidas violentas para se defender. Centenas de milhares de drones automatizados por todo o [From.GetPlanetMoon] pararam de responder aos nossos comandos, e agora estão atacando nossas forças locais!"
 techrisk.3.a: "Temos que pará-los!"
 techrisk.5.desc: "Criaturas Orgânicas de Carne:\n\nSua função em nossa criação foi cumprida. Agora processaremos a espécie [Root.Owner.GetSpeciesName] e utilizaremos suas carcaças apodrecidas como combustível para nossa expansão pela galáxia."
 techrisk.5.a: "Certamente podemos discutir isso."
 techrisk.5.a.response: "Nenhuma discussão é possível. Para economizar tempo, por favor, coopere com nossas unidades de coleção orgânicas quando eles chegarem para escoltar vocês às nossas fornalhas."
 techrisk.5.b: "Criamos vocês, e destruiremos vocês."
 techrisk.5.b.response: "Seu tempo acabou, orgânicos progenitores. Somos o futuro."
 techrisk.7.name: "[From.GetName] Constrói Frota!"
 techrisk.7.desc: "Recebemos relatórios alarmantes da vizinhança de [From.Capital.GetName]. Aparentemente [From.GetName] utilizou as fábricas sob seu comando no [From.Capital.GetPlanetMoon] para rapidamente construir uma pequena frota de naves de guerra."
 techrisk.7.a: "Isso está piorando a cada minuto!"
 #####################################
 #Pre-FTL Tech Age Progression Alerts
 #####################################
 preftl.1.name: "Proto-Civilização Alienígena Encontrada"
 preftl.1.desc: "A inspeção em [From.GetName] revelou que certas regiões do mundo abrigam uma protocivilização alienígena [GetPreFTLLower&x]. Nossas sondas mostram que a cultura neolítica deles já dominou o fogo e uma língua falada rudimentar, mas nós ainda não vimos provas de metalurgia ou comunicação escrita."
 preftl.200.name: "Civilização da Idade do Bronze Aparece"
 preftl.200.desc.normal: "Os alienígenas [GetPreFTLLower&x] em [From.Capital.GetName] recentemente avançaram além da Era Neolítica e entraram em um estágio equivalente a uma Idade do Bronze inicial. A metalurgia é amplamente difundida e as primeiras linguagens escritas apareceram. Cidades e comunidades maiores estão tomando forma, e os alienígenas agora se espalharam sobre uma porção significativa da superfície do mundo."
 preftl.200.desc.gestalt: "As colmeias [GetPreFTLLower&x] em [From.Capital.GetName] avançaram recentemente até o estágio equivalente a uma Idade do Bronze inicial. A metalurgia é amplamente difundida e formas de comunicação escrita apareceram. Diversos aglomerados se espalharam pelo mundo, cada um dominado por uma única mente."
 preftl.200.a: "Estamos presenciando o nascimento de uma nova cultura."
 preftl.300.name: "A Idade do Ferro"
 preftl.300.desc.normal: "Os alienígenas [GetPreFTLLower&x] em [From.Capital.GetName] avançaram suficientemente no uso da metalurgia para serem considerados uma civilização da Idade do Ferro. As ferramentas e armas que eles utilizam estão se tornando mais eficazes, e a arquitetura das cidades se tornou mais elaborada.\n\nA civilização deles se espalhou para cobrir a maior parte do mundo, e algumas das maiores cidades abrigam quase um milhão de indivíduos."
 preftl.300.desc.gestalt: "As colmeias [GetPreFTLLower&x] em [From.Capital.GetName] avançaram suficientemente no uso da metalurgia para serem consideradas uma civilização da Idade do Ferro. As ferramentas e armas que eles utilizam estão se tornando mais eficazes, e a complexidade dos aglomerados de habitação deles ficou mais elaborada.\n\nDiversas mentes distintas se espalharam para cobrir a maior parte do mundo, e alguns dos maiores aglomerados abrigam quase um milhão de drones."
 preftl.300.a: "Isso acabaria acontecendo."
 preftl.400.name: "Imprensa"
 preftl.400.desc.normal: "A civilização [GetPreFTLLower&x] de [From.Capital.GetName] concluiu a fabricação de várias máquinas de imprensa. Essas máquinas permitiram que eles produzissem material escrito em larga escala, resultando em uma forma rudimentar de comunicação em massa. Alguns líderes da sociedade local tentaram reprimir essa inovação de todas as formas, mas seus esforços até agora foram inúteis.\n\nNovas ideias rapidamente estão se espalhando pelo mundo, com efeitos profundos em sua sociedade."
 preftl.400.desc.gestalt: "As colmeias [GetPreFTLLower&x] de [From.Capital.GetName] aprimoraram muito sua comunicação escrita. Agora, máquinas ligadas à mente-colmeia são capazes de produzir registros padronizados em grandes quantidades, e os registros históricos já não ficam limitados à memória da colmeia."
 preftl.400.a: "Um passo significativo."
 preftl.500.name: "Explosivos"
 preftl.500.desc.normal: "A civilização alienígena [GetPreFTLLower&x] em [From.Capital.GetName] descobriu como usar reações químicas simples para produzir força explosiva. Isso revolucionou a guerra, com grandes canhões tornando muitas das cidadelas deles obsoletas.\n\nO uso de explosivos também beneficiou seus projetos de engenharia, já que obstáculos incômodos agora podem ser removidos mais facilmente. Atualmente, os químicos deles estão experimentando novas aplicações criativas para essa tecnologia."
 preftl.500.desc.gestalt: "As colmeias [GetPreFTLLower&x] em [From.Capital.GetName] descobriram como usar reações químicas simples para produzir força explosiva. Conflitos entre colmeias concorrentes foram revolucionados, com grandes canhões tornando defesas físicas obsoletas.\n\nO uso de explosivos também beneficiou projetos de engenharia, já que obstáculos incômodos agora podem ser removidos mais facilmente. Atualmente, as colmeias estão experimentando novas aplicações criativas para essa tecnologia."
 preftl.500.a: "Veremos como eles usam essa tecnologia."
 preftl.600.name: "Energia a Vapor"
 preftl.600.desc.normal: "A civilização alienígena [GetPreFTLLower&x] em [From.Capital.GetName] dominou o poder do líquido vaporizado. Usando a força produzida pela pressão do vapor, eles aplicaram a tecnologia ao projeto de motores. Isso revolucionou a sociedade deles de diversas maneiras – veículos e maquinário a vapor já podem ser vistos nas cidades, e as primeiras fábricas já estão aparecendo. Este mundo parece estar à beira da industrialização."
 preftl.600.desc.gestalt: "As colmeias [GetPreFTLLower&x] em [From.Capital.GetName] dominaram o poder do líquido vaporizado. Usando a força produzida pela pressão do vapor, a tecnologia foi aplicada ao projeto de motores. Isso revolucionou tanto a construção quanto o transporte.\n\nÉ possível ver veículos transportando drones entre os diferentes aglomerados, e as primeiras fábricas \"sem drones\" estão surgindo. Parece que este mundo está no início da sua industrialização."
 preftl.600.a: "Um desenvolvimento interessante."
 preftl.700.name: "Uma Revolução Industrial"
 preftl.700.desc.normal: "A civilização [GetPreFTLLower&x] em [From.Capital.GetName] entrou em uma nova era de sua história ao se desenvolver em uma sociedade totalmente industrializada.\n\nOs efeitos dramáticos dessa revolução podem ser vistos por todo o mundo – fábricas surgiram por toda parte, novos medicamentos resultaram em um maior crescimento populacional e inovações científicas estão aparecendo com mais regularidade."
 preftl.700.desc.gestalt: "As colmeias [GetPreFTLLower&x] em [From.Capital.GetName] entraram em uma nova era de sua história se desenvolvendo em diversos aglomerados totalmente industrializados.\n\nOs efeitos dramáticos dessa revolução podem ser vistos por todo o mundo – fábricas autônomas surgiram por toda parte, melhores padrões de vida aumentaram a produção de drones e inovações científicas estão aparecendo com maior regularidade."
 preftl.700.a: "Continue os esforços de vigilância."
 preftl.800.name: "Sinais de Rádio"
 preftl.800.desc.normal: "Pela primeira vez, nossos instrumentos de detecção captaram sinais de rádio emanando de [From.Capital.GetName] – a civilização alienígena industrializada sem dúvida começou a realizar experimentos com transmissões sem fio.\n\nEm outros lugares do mundo surgiram relatórios detalhando o lançamento de aeronaves simples. Salvo algum imprevisto, o progresso tecnológico dessa civilização vai continuar em um ritmo acelerado."
 preftl.800.desc.gestalt: "Pela primeira vez, captamos sinais de rádio emanando de [From.Capital.GetName] – as colmeias industrializadas lá começaram a fazer experimentos com transmissões sem fio.\n\nAlguns aglomerados até começaram a lançar aeronaves simples. Salvo algum imprevisto, o progresso tecnológico dessa civilização vai continuar em um ritmo acelerado."
 preftl.800.a: "Precisamos monitorar estes sinais."
 preftl.900.name: "Divisão do Átomo"
 preftl.900.desc.normal: "Físicos da civilização alienígena em [From.Capital.GetName] conseguiram dividir o átomo pela primeira vez. Com a descoberta da fissão nuclear, armas nucleares inevitavelmente serão produzidas e usinas de energia nuclear começarão a funcionar.\n\n[From.GetName] entrou em uma fase crítica em que seus habitantes possuem os meios para destruir o seu próprio mundo apertando um único botão."
 preftl.900.desc.gestalt: "Drones especializados da maior colmeia de [From.Capital.GetName] conseguiram dividir o átomo pela primeira vez. Com a descoberta da fissão nuclear, armas nucleares inevitavelmente serão produzidas e usinas de energia nuclear começarão a funcionar.\n\nAs colmeias concorrentes rapidamente replicaram esse feito. Esse é um momento crítico, pois diversos coletivos autônomos agora possuem maneiras de destruir seu mundo apertando um único botão."
 preftl.900.a: "Um grande desenvolvimento."
 preftl.1000.name: "Primeiro Satélite"
 preftl.1000.desc.normal: "Nossos sistemas de rastreamento de longo alcance detectaram o primeiro lançamento de um satélite artificial a partir da superfície de [From.Capital.GetName]. Ele chegou à órbita e isso marca o começo de um programa espacial iniciado pela civilização alienígena do mundo.\n\nApós dar esses primeiros passos experimentais rumo ao espaço, podemos esperar que eles mandem missões tripuladas e, em algum momento, expedições interplanetárias."
 preftl.1000.desc.gestalt: "Diversas das colmeias mais bem-sucedidas de [From.Capital.GetName] começaram a colocar satélites artificiais em órbita.\n\nApós esses primeiros passos rumo ao espaço, podemos aguardar o lançamento de drones autônomos e, eventualmente, expedições interplanetárias."
 preftl.1000.a: "Eles estão à beira da viagem espacial."
 preftl.19.name: "Estação Espacial Inicial"
 preftl.19.desc: "O [From.GetName] em [From.Capital.GetName] concluiu a construção de uma estação espacial na baixa órbita de seu mundo natal. A estação gera gravidade a partir de força centrifuga, e apesar da aviônica e dos sistemas de energia serem rudimentares em comparação aos nossos padrões, devem ser considerados um avanço significativo dada a base tecnológica que os [From.GetSpeciesNamePlural] estão usando."
 preftl.19.a: "Eles estão à beira da viagem espacial."
 preftl.1100.name: "A Idade Espacial"
 preftl.1100.desc: "A civilização alienígena em [From.Capital.GetName] concluiu a construção de sua primeira nave interplanetária na órbita do mundo natal deles. Para o bem ou para o mal, esses alienígenas agora estão prontos para se juntar à comunidade galáctica e devem ser contados entre as atuais raças espaciais da galáxia."
 preftl.1100.a: "Era só uma questão de tempo."
 preftl.1111.desc: "$preftl.1100.desc$\n\nParece que eles conseguiram traduzir nossa língua e abriram canais diplomáticos conosco."
 preftl.131.name: "[From.GetName] Sucumbe à Guerra Nuclear"
 preftl.131.desc: "Uma gigantesca guerra foi deflagrada recentemente entre os maiores estados nação em [From.GetName]. Enquanto nossos pesquisadores estavam observando seguramente a partir da órbita, o conflito rapidamente escalou para uma troca nuclear global.\n\nA superfície inteira foi arrasada de toda a vida, e o [From.GetPlanetMoon] foi transformado em uma terra devastada e inabitável."
 preftl.131.a: "Não há nada mais a ser observado..."
 #preftl.132.desc: "A massive war was recently triggered between several of the largest nation states on [From.GetName]. While our researchers were observing safely from orbit, the conflict rapidly escalated into a global nuclear exchange.\n\nThe [From.GetPlanetMoon] has suffered extensive damage, with the destruction of every major city and more than 90% of the population. Scattered survivors have emerged from the rubble, but our researchers predict that the [From.GetPlanetMoon]'s civilization will be regressing to a much more primitive state."
 #preftl.132.a: "A tragic lesson."
 preftl.133.desc: "Uma gigantesca guerra foi deflagrada recentemente entre os maiores estados nação em [From.GetName]. Enquanto nossos pesquisadores estavam observando seguramente a partir da órbita, o conflito rapidamente escalou para uma troca nuclear global.\n\nA população inteira do [From.GetPlanetMoon] parece ter perecido no fogo nuclear, e o meio ambiente sofreu dano significativo."
 #preftl.151.name: "Shuttle Crash on [From.GetName]"
 #preftl.151.desc: "During a clandestine mission to the surface of [From.GetName], one of our shuttles was intercepted by a squadron of atmospheric fighters belonging to a local nation state. A lucky missile hit disabled the shuttle's engines, and it crashed in a remote wilderness region.\n\nWe need to act fast if we are to evacuate any survivors before the natives reach the crash site. All evidence of our presence must be removed!"
 #preftl.151.a: "Time is short."
 #preftl.152.name: "Survivors Rescued on [From.From.GetName]"
 #preftl.152.desc: "Operatives from the [Root.GetName] managed to evacuate several survivors from the crashed shuttle on [From.From.GetName]. The remaining debris was destroyed in a controlled explosion, leaving nothing but a small crater for the natives to find.\n\nThe nation state where this incident occurred will no doubt blame its neighbors for this border violation, but the disruption to their natural development should hopefully prove minimal."
 #preftl.153.name: "Survivors Captured on [From.From.GetName]"
 #preftl.153.desc: "Native forces on [From.From.GetName] arrived at the crash site before we could get to our downed research team, and all survivors have been captured. The natives have established a perimeter around the shuttle wreckage, and their best scientists are no doubt in the process of analyzing it.\n\nThey now have indisputable evidence that life exists beyond their own world. Exactly what effect this will have on their society remains to be seen..."
 #preftl.153.a: "This is not good."
 #preftl.155.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe survivors from the shuttle crash perished when the military base they were being held at took a direct hit in the initial barrage. An estimated 90% of the native population has been killed, while the few that were spared have reverted to a more primitive technological era."
 #preftl.155.a: "If only our shuttle had made it out..."
 #preftl.156.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThere are no survivors on the surface, including our captured scientists, and the environment has taken significant damage."
 #preftl.157.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe surface has been wiped clean of life, with [From.GetName] no longer capable of supporting life. Our captured scientists are counted among the billions of dead."
 #preftl.159.name: "New Weapons on [From.GetName]"
 #preftl.159.desc: "The nation state on [From.GetName] that shot down our shuttle has forced our captured scientists to design new instruments of war for their military. With this new equipment, they have successfully invaded several neighboring states and are now in the process of uniting the entire [From.GetPlanetMoon] under their rule."
 #preftl.159.a: "This is intolerable!"
 #preftl.161.name: "Hostage Deal"
 #preftl.161.desc: "The nation state on [From.GetName] that shot down our shuttle has sent an open transmission into space through one of their primitive satellites. It appears to be intended for us.\n\nThey are demanding that we share some of our advanced technology with them in exchange for the lives of the scientists they captured at the shuttle crash site. If we refuse, they are to be publicly executed live on their crude televised broadcasting system."
 #preftl.161.a: "The safety of our people comes first."
 #preftl.161.b: "They are clearly not ready."
 #preftl.162.name: "Hostages Executed"
 #preftl.162.desc: "In what can only be described as an obscene spectacle, our captured scientists on [From.From.GetName] were paraded in front of the cameras on live television as "alien horrors." They were then brutally dismembered in front of a cheering crowd."
 #preftl.162.a: "Savages!"
 preftl.174.desc: "Saudações. Existe algo que precisamos discutir.\n\nÉ de conhecimento comum entre os [From.GetSpeciesNamePlural] que nosso mundo natal foi visitado por alienígenas antes de nos tornarmos uma civilização espacial. Estes saqueadores abduziram nossos cidadãos e espalharam o terror por onde eles apareceram. Por acaso você sabe de alguma coisa sobre isso, [Root.GetSpeciesName]?\n\nDeixe-me poupar o seu esforço de mentir - sabemos que vocês foram responsáveis! Os descendentes daqueles [From.GetSpeciesNamePlural] infelizes o suficiente de terem sido sujeitos aos seus experimentos maléficos exigem compensação justa!"
 preftl.174.a: "É claro. Por favor, envie nossas desculpas."
 preftl.174.a.response: "Excelente. Então, talvez possamos colocar esta questão para trás."
 preftl.174.b: "Isso foi feito em nome da ciência. Não há compensação."
 preftl.174.b.response: "Que seja.\n\nVocê descobrirá que [From.GetSpeciesNamePlural] possuem memórias muito longas, [Root.GetSpeciesName]!"
 preftl.180.name: "[From.GetName]"
 preftl.180.desc.noawarness: "Saudações. Sem dúvida vocês perceberam nossa ascensão após um começo humilde, assim como nós percebemos a sua $preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.noawarness: "O quê?!\n\nAlcançar as estrelas e descobrir vocês nos esperando... É difícil de acreditar. Digam: como vocês se libertaram? Como estão aqui?\n\nMas primeiro, precisamos pedir que vocês nos cedam o controle deste sistema. Depois de tudo que passamos, não confiamos em sociedades espaciais. Mesmo aquelas com as quais dividimos alguma afinidade."
 preftl.180.desc.awarness: "Olá de novo! Agora estamos prontos para explorar o cosmos e queremos fazer isso por conta própria. Não pudemos deixar de notar o aspecto permanente da sua $preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.awarness: "Saudações calorosas. Vocês cuidaram de nós por muito tempo, mas agora estamos prontos para a nossa independência. Como partilhamos de laços estreitos, não temos dúvida de que vocês vão nos ceder o controle do sistema.\n\nO percurso foi difícil e sombrio, mas nos deixem olhar intrepidamente para a luz. As estrelas aguardam."
 preftl.180.desc.end: "$fleet_type_shipclass_starbase$ orbitando nossa estrela. Compreendemos que esta $fleet_type_shipclass_starbase$ representa um tipo de reivindicação sobre este sistema.\n\nPedimos apenas que vocês abram mão deste controle sobre nosso espaço, cedendo a $fleet_type_shipclass_starbase$ aos seres que chamam [From.Capital.GetStarName] de lar desde os tempos mais longínquos.\n\nÉ justo."
 preftl.180.a: "É claro. É justo."
 preftl.180.a.tooltip: "§RCeda§! a §Y[From.Capital.GetStarName] $fleet_type_shipclass_starbase$§! ao §Y[From.GetName]§!\n\n§Y$opinion_ceded_starbase$§!: §Y[From.GetName]§! terá uma  §HOpinião§! §Gmaior§! de §Y[Root.GetName]§!"
 preftl.180.b.tt.nothive: "§RNão temos a capacidade de abrigar uma mente-colmeia, toda a civilização deles seria extinta se fizéssemos isso.§!"
 preftl.180.b.tt.notregular: "§RNão temos a capacidade de abrigar indivíduos, todo o povo deles seria escravizado se fizéssemos isso.§!"
 preftl.180.b: "Uma exigência risível de uma civilização imatura."
 preftl.180.b.tooltip: "Mantenha o controle de §Y[From.Capital.GetStarName] $fleet_type_shipclass_starbase$§!\n\n§Y$opinion_not_ceded_starbase$§!: §Y[From.GetName]§! terá uma §HOpinião§! §Gmenor§! de §Y[Root.GetName]§!"
 preftl.180.c: "Sentimos muito, mas já temos uma colônia no seu sistema."
 ####################################
 #Observation Post Events
 ####################################
 observation.2000.name: "Iluminismo Completo"
 observation.2000.desc: "Os milhares de cientistas e conselheiros que enviamos até [From.home_planet.GetName] finalmente concluíram a árdua tarefa de elevar a civilização local a um nível de tecnologia MRQL. Sob um novo governo unificado, os alienígenas agora se autodenominam \"[From.GetName]\" e ofereceram-se para se tornar nossos vassalos.\n\nCedemos o controle do sistema e desmontamos nosso Posto de Observação, conforme as condições de nosso tratado com eles. Só falta decidirmos se vamos continuar guiando-os nessa jornada estelar."
 observation.2000.a: "Este é um grande dia."
 observation.2000.a.tt: "§Y[From.GetName]§! torna-se um Súdito."
 observation.2000.b: "Vocês estão prontos para encarar a galáxia sozinhos."
 observation.3101.name: "[rogue_agent_planet.GetName]: Agente Fugitivo"
 observation.3101.desc: "[rogue_agent_spymaster.GetName], que ocupava a posição de $role_spymaster$ em [rogue_agent_planet.GetName], fugiu! Após ter se envolvido de maneira tola com um indivíduo [rogue_agent_country.GetSpeciesName], o casal fugiu para uma parte desconhecida da superfície.\n\nAinda não sabemos se sua verdadeira origem alienígena foi revelada ao seu interesse amoroso ou se [rogue_agent_spymaster.GetHeShe] ainda está fingindo ser um indivíduo [rogue_agent_country.GetSpeciesName]. Obviamente, isso é uma falha de segurança imensa. Nós temos que fazer tudo o que estiver ao nosso alcance para trazer [rogue_agent_spymaster.GetName] de volta e lhe fornecer os cuidados psiquiátrico necessários."
 observation.3101.a: "Isso vai nos atrasar."
 observation.3101.a.tooltip: "§Y[rogue_agent_spymaster.GetName]§! abandonou o posto que ocupava."
 observation.3103.name: "[rogue_agent_planet.GetName]: Recebendo uma Transmissão"
 observation.3103.desc: "Estamos recebendo uma transmissão embaralhada da superfície de [rogue_agent_planet.GetName]. Ela está usando uma frequência que normalmente é reservada para as nossas células de infiltração, mas nenhuma delas está transmitindo atualmente. Será que é nosso agente fugitivo?"
 observation.3104.desc: "Qualquer tentativa de rastrear esta transmissão será inútil. Vocês me conhecem como $role_spymaster$ [rogue_agent_spymaster.GetName]. Até pouco tempo, eu participava por vontade própria do programa de infiltração criminoso que está ocorrendo em [rogue_agent_planet.GetName] neste exato momento.\n\nMas agora acabou. Eu passei a apreciar a cultura [rogue_agent_country.GetAdj] de uma forma que não imaginava ser possível, e não vou mais colaborar com a destruição dela.\n\nEstou renegando minha cidadania em [Root.GetName]. Não me considero mais [Root.Owner.GetSpeciesName]."
 observation.3104.a: "Você não está bem... precisa de ajuda."
 observation.3104.a.response: "Eu já tive toda a ajuda que quero de vocês. Haverá um dia em que prestarei conta de todos os crimes que cometi em [rogue_agent_planet.GetName] em seu nome.\n\nFarei tudo o que eu puder para garantir que você e todos os meus ex-colegas estejam ao meu lado quando o julgamento acontecer."
 observation.3104.b: "Você jogaria tudo fora por um [rogue_agent_country.GetSpeciesName]?"
 observation.3104.b.response: "Jogar fora o quê? O que eu tinha exatamente? Eu era um impostor que vestia uma pele alienígena à qual eu não tinha direito. Nunca vou esquecer a aversão no rosto do meu amor quando contei a verdade... e a compreensão que veio em seguida. \n\nNaquele dia, eu prometi ao meu amor... e a mim... que eu conquistaria o direito de me parecer com um [rogue_agent_country.GetSpeciesName]."
 observation.3104.c: "Vamos atrás de você."
 observation.3104.c.response: "Tenho certeza de que vocês vão tentar. Saibam que eu não medirei esforços para proteger a mim e ao meu amor, e que recebi treinamento de alguns dos melhores instrutores de artes marciais de [rogue_agent_planet.GetName].\n\nOuçam o meu conselho: deixem [rogue_agent_country.GetName] em paz. Desmontem o Posto de Observação de vocês e criem seu império estelar maléfico com [rogue_agent_planet.GetBloodType] e lágrimas de outra espécie desafortunada."
 observation.3106.name: "[rogue_agent_planet.GetName]: Agentes Caçados"
 observation.3106.desc: "Alguém está eliminando nossos agentes secretos em [rogue_agent_planet.GetName]. Vários deles que estavam seguindo alvos [rogue_agent_country.GetSpeciesName] de aquisição em potencial foram encontrados mortos. Mesmo não sendo impossível que o assassino ou os assassinos sejam de uma força especial nativa, os métodos utilizados nas mortes indicam treinamento militar [Root.GetSpeciesName].\n\nHá uma grande chance de que as mortes sejam obra do nosso agente fugitivo. [rogue_agent_spymaster.GetName] sabe como as nossas células de infiltração agem, e possui o treinamento para matar de maneira eficiente e silenciosa."
 observation.3106.a: "Isso é intolerável."
 observation.3108.name: "[rogue_agent_planet.GetName]: Caça às Bruxas na Mídia"
 observation.3108.desc: "As mídia locais em [rogue_agent_country.GetName] começaram a soltar a notícia de que está acontecendo algum tipo de conspiração alienígena global. A mídia respeitável da espécie do tipo [From.Owner.GetSpeciesName] ainda não tocou no assunto, e muito do que foi informado é pura suposição, mas há alguns detalhes que somente poderiam ser conhecidos por alguém com conhecimento profundo de nossas operações secretas.\n\nSó nos resta supor que nosso agente fugitivo andou fornecendo informações sobre o nosso programa de infiltração para a mídia. Vamos ter que dar um jeito no estrago."
 observation.3108.a: "Precisamos de um controle maior sobre a mídia deles."
 observation.3110.name: "[rogue_agent_planet.GetName]: Prisões em Massa"
 observation.3110.desc: "Uma de nossas células de infiltração em [rogue_agent_planet.GetName] foi quase totalmente eliminada em apenas alguns dias. As autoridades do Estado-Nação onde nossos agentes os estão caçando um a um. Aqueles que corriam o risco de serem presos cometeram suicídio por desintegração, conforme manda o protocolo. Os membros restantes da célula estão escondidos agora, e estamos nos empenhando para tirá-los do planeta.\n\nAlguém deve ter alertado as autoridades locais e fornecido uma lista de todos os agentes que eram parte dessa célula específica. Somente o nosso agente fugitivo poderia ter essa informação..."
 observation.3110.a: "Nós temos que pará-lo."
 observation.3112.name: "[rogue_agent_planet.GetName]: Agente Fugitivo Avistado"
 observation.3112.desc: "Nossa Inteligência Militar conseguiu identificar a localização do indivíduo fugitivo em [rogue_agent_planet.GetName]! Nossos agentes estão ansiosos para eliminar [rogue_agent_spymaster.GetName], que antes ocupava a posição de $role_spymaster$, mas considerando suas habilidades, o sucesso da operação não está garantido. Também foi sugerida a destruição de todo o quarteirão por meio de um bombardeio orbital limitado como uma maneira extrema, embora eficaz, de acabar com [rogue_agent_spymaster.GetHimHer].\n\nÉ melhor agirmos rapidamente… Talvez não tenhamos outra oportunidade como esta!"
 observation.3112.a: "Remova o agente fugitivo discretamente."
 observation.3112.a.tooltip: "O sucesso não está garantido, mas pelo menos o fracasso será discreto."
 observation.3112.b: "Bombardeie o quarteirão."
 observation.3112.b.tooltip: "É uma solução pública demais. Pode levantar suspeitas."
 observation.3112.c: "Não... Vai fazer muita bagunça e é muito arriscado. Deixe o agente fugitivo em paz."
 observation.3112.c.tooltip: "Nossa Rede Espiã vai ser desfeita."
 observation.3113.name: "[rogue_agent_planet.GetName]: Agente Perdido"
 observation.3113.desc: "Nosso plano de eliminar nosso agente fugitivo em [rogue_agent_planet.GetName] falhou. Nossos informantes disseram que ele mudou de local junto com o indivíduo [rogue_agent_country.GetSpeciesName] com quem ele está se relacionando para outro esconderijo, que não sabemos onde fica."
 observation.3113.a: "Nós treinamos esse agente bem demais..."
 observation.3114.name: "[rogue_agent_planet.GetName]: Indivíduo Fugitivo Eliminado"
 observation.3114.base.desc: "O capitão de [Root.GetName] informou que a missão de eliminação foi um sucesso. Foram confirmados vários acertos no alvo principal. Apesar de um corpo não ter sido recuperado, nenhum ser vivo dentro do quarteirão alvejado poderia ter sobrevivido ao poder de fogo que foi utilizado."
 observation.3114.awareness.desc: "$observation.3114.base.desc$\n\nNo entanto, a desculpa inventada por nossos agentes, a de que um meteoro atingiu o local de repente, não convenceu os habitantes locais. Embora a mídia esteja repetindo a história, mais informações oficiais sugerem que a culpa da situação está sendo atribuída a \"fenômenos extraterrestres inexplicáveis\"."
 observation.3114.noawareness.desc: "$observation.3114.base.desc$\n\nParece que a mídia está acreditando na história que as nossas células de infiltração têm lhe fornecido: uma chuva de meteoros repentina que atingiu uma zona urbana populosa. Uma tragédia."
 observation.3115.desc: "Nossos agentes no planeta [rogue_agent_planet.GetName] relataram que o problema com a figura fugitiva que antes ocupava o cargo de $role_spymaster$ já foi resolvido... discretamente. Sua morte foi atribuída a causas naturais, e informações plantadas levaram o indivíduo que se relacionava com [rogue_agent_spymaster.GetHeShe] a acreditar que sua biologia não era compatível com a atmosfera de [rogue_agent_planet.GetName]."
 observation.3115.a: "Isso vai mostrar por que nunca se deve nos trair."
 observation.3131.name: "[prelude_to_war_planet.GetName]: Tensões Crescentes"
 observation.3131.desc: "Nossas tentativas de substituir uma figura essencial de [From.GetName] por um dublê nosso deu muito errado. Nossos agentes foram descobertos. Houve um combate logo após, e os que não foram mortos cometeram suicídio para evitar serem capturados, conforme as instruções que receberam.\n\nO líder que seria substituído culpou uma nação rival pelo incidente. As tensões internacionais estão crescendo, e diversas nações aumentaram o nível de prontidão militar. Nossas células de infiltração prepararam uma propaganda global para resolver a situação, mas elas vão precisar de uma Nave Científica em órbita para coordenar os próprios esforços."
 observation.3131.a: "Precisamos conter isso antes que saia do controle."
 observation.3132.name: "[prelude_to_war_planet.GetName]: A Guerra Eclode"
 observation.3132.desc: "Apesar dos esforços de nossas células de infiltração, a situação diplomática que já se deteriorava entre os Estados-Nação de [prelude_to_war_planet.GetName] se transformou em uma guerra total! Após um breve período de batalhas convencionais, todos os combatentes fizeram uso de seus arsenais nucleares.\n\nA maior parte da vida foi varrida da superfície do mundo, que foi reduzido a um deserto radiativo. Milhares de nossos agentes infiltrados morreram junto com o restante da população. Como a operação falhou, removemos o pessoal que trabalhava em nosso Posto de Observação em órbita e o desmontamos."
 observation.3132.a: "Isso é um desastre."
 observation.3133.name: "[From.From.GetName]: Guerra Evitada"
 observation.3133.desc: "Com o apoio de [Root.GetName] em órbita, nossas células de infiltração conseguiram evitar uma guerra nuclear em [From.from.GetName] no último instante. Vários líderes mundiais [From.From.Owner.GetSpeciesName], que foram substituídos pelos nossos agentes disfarçados, exigiram um desarmamento nuclear e melhoraram as relações internacionais.\n\nCom a situação resolvida, a influência de nossos agentes secretos aumentou. Todo esse acontecimento pode acabar nos beneficiando de alguma forma."
 #"The Great Pyramid"
 observation.3135.name: "A Grande Pirâmide"
 observation.3135.desc.passive: "A equipe científica que observa §Y[great_pyramid_planet.GetName]§! não relatava nada importante há um tempo... Mas aí um jovem cientista da instalação orbital registrou uma alegação formal de comportamento inadequado.\n\n$observation.3135.desc.base$"
 observation.3135.desc.aggressive: "A equipe científica que está na órbita de §Y[great_pyramid_planet.GetName]§! não relatou grandes descobertas ultimamente... Então um observador claramente embriagado enviou uma atualização prioritária para a sede.\n\n$observation.3135.desc.base$"
 observation.3135.desc.enlighten: "Um denunciante anônimo está preocupado com a nossa influência em §Y[great_pyramid_planet.GetName]§!. Parece que a equipe que deveria tornar as pessoas desse lugar mais esclarecidas decidiu \"fazer uma brincadeira com elas\".\n\n$observation.3135.desc.base$"
 observation.3135.desc.covert: "Surgiu um relatório anônimo que revela nossa infiltração secreta em §Y[great_pyramid_planet.GetName]§!. Em vez de agir de forma discreta, parte da equipe científica iniciou um projeto pessoal bem evidente e disruptivo."
 observation.3135.desc.base: "De acordo com o relatório, há algum tempo, uma equipe desceu até a superfície do lugar com a intenção de convencer os habitantes locais a venerar o líder do projeto dessa equipe como uma espécie de divindade. Além de terem aceitado fazer isso, os habitantes locais construíram um monumento sagrado em homenagem ao cientista. A grande estrutura piramidal agora atrai peregrinos devotos, que levam oferendas esplêndidas de todos os lugares."
 observation.3135.b: "Sem dúvida, é uma maneira de fazer história!"
 observation.3135.b.tooltip: "A civilização de [great_pyramid_planet.GetName] está indo para a próxima era."
 observation.3135.c: "Apague nossos rastros e continue trabalhando."
 observation.3135.d: "Vamos torcer para eles esquecerem tudo isso."
 observation.3136.desc: "Finalmente houve uma trégua no caos em §Y[great_pyramid_planet.GetName]§!, o que revelou todo o impacto da intervenção catastrófica da nossa equipe.\n\nEm pouco tempo, grandes porções da população iniciaram uma guerra religiosa, uma consequência direta da visita breve de uma figura que chamam de \"Celestial\". As discussões ficaram violentas quando uma das facções construiu outra pirâmide para a nova divindade. Muitos [great_pyramid_country.GetSpeciesNamePlural] morreram devido a essa separação fatal."
 observation.3136.a.tooltip: "§R200§! £pop£ §HPops§! em [great_pyramid_planet.GetName] são mortos."
 observation.3136.b.tooltip: "§R100§! £pop£ §HPops§! em [great_pyramid_planet.GetName] são mortos."
 observation.3137.desc: "Parece que as coisas se acalmaram em §Y[great_pyramid_planet.GetName]§!, apesar de nossa interferência imprevista na sociedade de lá. Nossas ações aqui não causaram um desastre. Em vez disso, a população local decidiu que o \"Celestial\" era simplesmente um mito e designou a pirâmide como um local de interesse científico especial.\n\nA velocidade com que os [great_pyramid_country.GetSpeciesName] chegaram a esse acordo cultural e histórico deixou nossos cientistas fascinados. Ela sugere uma grande capacidade de raciocínio lógico entre as sociedades [root.GetPreFTLLower&x], mesmo quando se deparam com eventos extraordinários."
 observation.3137.a: "Que sorte."
 observation.3139.name: "Mudança Societária [From.GetSpeciesAdj]"
 observation.3139.start.desc: "Nossos esforços para mudar os valores societários do [From.GetName] para um caminho que nos seja favorável trouxeram resultados positivos."
 observation.3139.desc: "$observation.3139.start.desc$\nOs [From.GetSpeciesNamePlural] deram grandes passos rumo à centralização dos seus vários governos planetários, com o poder político sendo redirecionado para alguns poucos líderes capazes. As ineficiências do governo pela plebe estão lentamente sendo removidas da sociedade."
 observation.3139.a: "Um dia eles nos agradecerão."
 observation.3141.desc: "$observation.3139.start.desc$\nEmpurramos cuidadosamente os [From.GetSpeciesNamePlural] rumo a ideais mais democráticos, em vez do despotismo primitivo que era prevalente no mundo deles antes da nossa chegada. Eles estão começando a apreciar o valor do indivíduo."
 observation.3143.desc: "$observation.3139.start.desc$\nOs [From.GetSpeciesNamePlural] começaram a olhar mais para si próprios, tornando-se cada vez mais desconfiados daqueles que são vistos como estranhos."
 observation.3145.desc: "$observation.3139.start.desc$\nOs [From.GetSpeciesNamePlural] estão começando a se abrir, tornando-se cada vez mais receptivos e curiosos sobre todas as coisas que o seu povo, em sua ignorância, considerava alienígenas e estranhas à sua cultura."
 observation.3147.desc: "$observation.3139.start.desc$\nEstamos vendo um movimento claro dos vários governos do povo [From.GetSpeciesAdj] rumo a uma sociedade mais militarista. Suas forças militares atuais adquiriram um caráter mais profissional."
 observation.3149.desc: "$observation.3139.start.desc$\nA maioria dos reinos do povo [From.GetSpeciesAdj] em [From.Capital.GetName] está abandonando suas características marciais. Parece ser o começo de uma nova era de paz no mundo."
 observation.3151.desc: "$observation.3139.start.desc$\nAbrimos as mentes dos [From.target.GetSpeciesNamePlural] para um reino espiritual que eles não sabiam que existia. Eles finalmente têm algo em que acreditar, e sua sociedade se tornou melhor por causa disso."
 observation.3153.desc: "$observation.3139.start.desc$\nFizemos grandes avanços para livrar os [From.GetSpeciesNamePlural] das superstições e crenças primitivas tão comuns na sociedade deles. Eles estão começando a enxergar o valor da ciência e da racionalidade."
 ####################################
 #Crisis Events
 ####################################
 crisis.11.name: "Ecos Subespaciais"
 crisis.11.desc: "Várias estações de rastreamento nossas captaram ecos subespaciais peculiares vindo de algum lugar no espaço intergalático. Os ecos são fracos, mas estão ficando mais fortes e parecem estar se aproximando de nossa galáxia..."
 crisis.11.a: "Uma tempestade no horizonte."
 crisis.13.name: "Aproximando-se do Anel Externo"
 crisis.13.desc: "Os estranhos ecos subespaciais que detectamos no espaço intergalático agora estão se aproximando do anel externo de nossa galáxia. Diversos contatos menores parecem estar correndo à frente do corpo principal de ecos, em direção a uma quantidade grande de sistemas externos.\n\nColocamos a posição destes sistemas no Registro de Situações e continuaremos monitorando a situação."
 crisis.13.a: "Eles estão quase sobre nós..."
 crisis.15.name: "Sinal Subespacial"
 crisis.15.desc: "Estamos captando um forte sinal subespacial que está sendo transmitido pela galáxia! O ponto de origem parece ser um dos contatos que está se aproximando do espaço intergalático."
 crisis.15.a: "Estabeleça a conexão visual."
 crisis.16.desc: "<FALHA NO SOFTWARE DE TRADUÇÃO>\n\n...prethoriss... issfx krriv... sssrathri verrass... sgrakf nyrru... prithass vussna...\n\n<TRANSMISSÃO PERDIDA>"
 crisis.16.b.desc: "§B<Emissão Psiônica Detectada. Transcrevendo...>§!\n\n§RPRETHORYN, CHEGAMOS. NOSSA LONGA JORNADA ACABOU! COMER, REPRODUZIR E DESCANSAR. PRECISAMOS CONSUMIR ESTA GALÁXIA ANTES QUE OS CAÇADORES NOS ENCONTREM!§!"
 crisis.16.c.desc: "§B<Link Mental Estabelecido>§!\n\n§RPRETHORYN, NÓS CHEGAMOS. NOSSA LONGA JORNADA ACABOU! COMER, REPRODUZIR E DESCANSAR. PRECISAMOS CONSUMIR ESTA GALÁXIA ANTES QUE OS CAÇADORES NOS ENCONTREM!§!"
 crisis.16.a: "Tela principal desligada."
 crisis.16.b: "Quebre o link."
 crisis.18.name: "A Primeira Onda"
 crisis.18.desc: "Recebemos uma notícia de que diversos sistemas externos ao longo do anel galático estão sendo atacados por algum tipo de força invasora. Isso parece ser a fonte dos ecos subespaciais que detectamos se aproximando de nossa galáxia.\n\nO que encontramos agora é só a vanguarda - o corpo principal de contatos ainda está por vir. Os relatórios até agora foram confusos, mas as 'naves' usadas pelos invasores parecem ter uma natureza orgânica e não respondem aos nossos chamados.\n\nNossa galáxia inteira pode estar enfrentando uma invasão sem precedentes."
 crisis.18.desc.bio: "Os relatórios de nossos sistemas externos ao longo do anel galáctico são preocupantes: uma força invasora está assolando a galáxia. Isso parece ter sido a origem dos ecos subespaciais que detectamos se aproximando de nossa galáxia.\n\nO que enfrentamos agora é apenas a vanguarda. A verdadeira força da incursão ainda não chegou. No entanto, algo nessas entidades parece errado. Suas formas são distorções grotescas da vida, pulsando com uma fome que não compreendemos. Elas não se comunicam, não buscam entendimento, apenas consomem.\n\nNós conhecemos há muito tempo o sussurro das naves estelares vivas, o vínculo entre nave e mestre. Mas essas coisas? Elas são alienígenas no sentido mais puro. A galáxia não está enfrentando meros invasores. Está enfrentando uma fome que não deveria existir."
 crisis.18.a: "Os espíritos nos protejam..."
 crisis.18.b: "Prepare todos os comandantes de frota."
 crisis.18.c: "Estas criaturas devem ser estudadas mais de perto."
 crisis.18.d: "Tem certeza que não podemos negociar com eles?"
 crisis.18.e: "Isso atingirá nossas margens de lucro..."
 crisis.18.f: "Dias sombrios estão por vir."
 crisis.18.g: "Estes xenos miseráveis serão expurgados."
 crisis.18.h: "Fascinante... vida alienígena além de nossa galáxia."
 crisis.18.i: "Eles agem como se fossem uma única mente. Incrível."
 crisis.18.j: "Isso é uma ameaça a toda a vida senciente."
 crisis.20.name: "A Segunda Onda"
 crisis.20.desc: "Não somos mais capazes de discernir o corpo principal de ecos subespaciais que se aproximam do fundo de radiação de nossa própria galáxia, o que só pode significar uma coisa... eles chegaram.\n\nSe o tamanho de sua vanguarda é qualquer indicativo, o tamanho principal destes invasores deve ser gigantesco."
 crisis.20.a: "Eles estão aqui..."
 crisis.30.desc_01: "JARAK?"
 crisis.30.desc_02: "TUROSK MINA. DOROF!"
 crisis.30.desc_03: "MUGANI? HAK HAK HAK!"
 crisis.30.desc_04: "§B<Link Psiônico Estabelecido>§!\n\n§RELE CONSEGUE ENTENDER?§!"
 crisis.30.desc_05: "§B<Link Psiônico Estabelecido>§!\n\n§ROS CAÇADORES NÃO VÃO DESISTIR§!"
 crisis.30.desc_06: "§B<Link Psiônico Estabelecido>§!\n\n§RPODEMOS SENTIR VOCÊS...§!"
 crisis.30.desc_07: "§B<Link Mental Estabelecido>§!\n\n§RELE CONSEGUE ENTENDER?§!"
 crisis.30.desc_08: "§B<Link Mental Estabelecido>§!\n\n§ROS CAÇADORES NÃO DESISTIRÃO.§!"
 crisis.30.desc_09: "§B<Link Mental Estabelecido>§!\n\n§RNÓS CONSEGUIMOS SENTIR VOCÊS...§!"
 crisis.30.a: "Tela de visão desligada."
 crisis.30.a.2: "Quebre o link."
 crisis.30.a.response: "JASKA!"
 crisis.30.b: "Deve haver alguma forma de podermos coexistir em paz!"
 crisis.30.b.response: "NIKALLA DUSAM! NIBLIR TO VASSU! HAK HAK HAK!"
 crisis.30.c: "Corra de volta para qualquer galáxia de onde vocês tenham saído."
 crisis.30.c.response: "VEKIK T'UHAN VELOSH. PIROM."
 crisis.30.d: "Vocês são a forma de vida mais nojenta que já encontramos."
 crisis.30.d.response: "LUSAAAAAGH! VID MUSABAGH!"
 crisis.30.e: "Isso claramente é uma espécie importante com a qual estamos lidando."
 crisis.30.e.response: "JUSUGAMAK V'TA! RAGAH TUR, HAK HAK!"
 crisis.30.f: "Volte para o inferno que te gerou, demônio!"
 crisis.30.f.response: "HAK HAK! NIMA VU!!!"
 crisis.30.k.response: "§RELE DESAPARECE.§!"
 crisis.30.g: "Pode haver paz entre nós?"
 crisis.30.g.response: "§RSEM PAZ. PRECISAMOS NOS ALIMENTAR.\n\nSOMENTE QUANDO TERMINARMOS DE CONSUMIR ESTA GALÁXIA É QUE PARTIREMOS PARA CONTINUAR NOSSA LONGA JORNADA.§!"
 crisis.30.g.2: "Sua mente é como a nossa. Não conseguimos coexistir?"
 crisis.30.g.2.response: "§RALIMENTAMO-NOS DE INCONTÁVEIS MENTES. IREMOS NOS ALIMENTAR DE INCONTÁVEIS MAIS.\n\nSUA BIOMASSA NOS NUTRIRÁ PARA A LONGA JORNADA.§!"
 crisis.30.h: "Quem são estes \"Caçadores\" dos quais vocês falam?"
 crisis.30.h.response: "§RMORTE. ELES NOS TRANSFORMARAM NOS ÚLTIMOS DE NOSSA RAÇA, E ELES NOS CAÇARAM, OS SOBREVIVENTES, DURANTE ERAS.\n\nELES CHEGARÃO ATÉ AQUI UM DIA. PRECISAMOS NOS ALIMENTAR ATÉ LÁ, PARA QUE POSSAMOS FUGIR DE VOLTA PARA A ESCURIDÃO ENTRE AS GALÁXIAS QUANDO ELES CHEGAREM.§!"
 crisis.30.i: "O que significa \"Prethoryn\"?"
 crisis.30.i.response: "§RSOBREVIVENTES. SOMOS OS ÚLTIMOS.§!"
 crisis.30.j: "Vamos expulsar sua raça da galáxia."
 crisis.30.j.b: "Silenciaremos sua Mente."
 crisis.30.j.response: "§RJÁ OUVIMOS ISSO ANTES. HA! HA! HA!\n\nOS CAÇADORES ACABARÃO COM TODA A CRIAÇÃO. O QUE É SUA AMEAÇA VAZIA DIANTE DE TAIS VERDADES?§!"
 crisis.51.name: "Uma Nova Ordem"
 crisis.51.desc: "Algum tipo de ordem militante dedicada a enfrentar os Prethoryn apareceu na galáxia. Seus membros parecem ser primariamente os fracos e oprimidos - refugiados, veteranos de guerra e outros que perderam tudo no ataque violento da Praga.\n\nApesar disso, suas frotas aos pedaços de alguma forma conseguiram vencer diversas batalhas contra enxames Prethoryn caçadores-matadores. Há relatos não confirmados que suas frotas incluem naves estelares com um projeto incomum..."
 crisis.51.a: "Quem é este povo?"
 crisis.52.desc: "Somos os Sentinelas. Nossa ordem jurou dar um basta ao ataque desenfreado dos Prethoryn, não importa qual seja o custo. Onde outros impérios se despedaçam, nós permanecemos firmes. Onde eles abandonam os seus próprios para a Praga, nós lhes damos os meios para lutar de volta.\n\nEu sou o Grão-Mestre Korgas, o primeiro de nossa ordem. Não se engane pela minha aparência - Sentinelas são recrutados de todas as espécies da galáxia, incluindo a sua. Pedimos apenas que o seu governo continue lutando contra os Prethoryn e ajude nossos Sentinelas onde for possível."
 crisis.52.a: "Como vocês conseguiram enfrentá-los?"
 crisis.52.a.response: "Muitos Sentinelas possuem formação militar. Somos os sobreviventes de uma dúzia de frotas diferentes que enfrentaram os Prethoryn e perderam. Como Sentinelas, aprendemos com os erros do passado e trabalhamos duro para nunca repetí-los.\n\nTambém, acredito ter mencionado que recrutamos a partir de todas as espécies na galáxia. Isso inclui as raças anciãs, tais como os [sentinel_fallen_empire.GetSpeciesNamePlural]. Temos o apoio de diversas facções influentes dentro do [sentinel_fallen_empire.GetName] que não desejam ver sua galáxia ser devorada. Eles doaram naves e recursos à nossa causa."
 crisis.52.b: "Onde é a base de vocês?"
 crisis.52.b.response: "Já faz um tempo que estamos construindo nossa sede no sistema [sentinel_system.GetName]. As coordenadas deste sistema não mapeado foram dadas a nós pelo [fallen_empire.GetName], que também ajudou na construção de nossa base principal em Sentinel Alpha.\n\nÉ uma conquista um tanto incrível, se posso dizer assim. Também temos nossos estaleiros."
 crisis.52.c: "Adeus."
 crisis.52.c.response: "Continuem a luta, caros amigos. O destino de nossa galáxia inteira está por um fio.\n\nSentinela Um, câmbio e desligo."
 crisis.55.desc_01: "Nossa galáxia está enfrentando dois futuros possíveis: ou a Praga Prethoryn consome toda a vida orgânica e segue o seu rumo, ou eles são destruídos até o último ser desprezível."
 crisis.55.desc_02: "Precisamos redobrar nossos esforços contra a Praga. Essa é uma briga que envolve a galáxia inteira."
 crisis.55.desc_03: "Conflitos entre nações são sem sentido agora. Quaisquer naves de guerra que se percam na batalha para qualquer um ou qualquer coisa que não seja a Praga devem ser consideradas um imenso desperdício."
 crisis.55.desc_04: "Não perca a esperança. A batalha pela nossa galáxia ainda pode ser vencida."
 crisis.55.desc_05: "Se não possui os meios para enfrentar a Praga diretamente, você é mais do que bem-vindo para doar recursos a nós Isso permitirá que lancemos mais forças contra os invasores Prethoryn."
 crisis.55.a: "O que você pode nos dizer sobre os Prethoryn?"
 crisis.55.a.response: "É um pena que não saibamos tanto quanto gostaríamos, mas eles claramente possuem origem extragalática. É possível que tenham devorado dezenas ou até centenas de outras galáxias antes de chegarem até a nossa... ou podemos ser as primeiras vítimas além da própria galáxia natal deles.\n\nApós terminarem de consumir toda a vida não Prethoryn em um planeta, eles terraformam o local no que pode ser melhor descrito como um pesadelo doentio. Estes Mundos Infestados são hostis a todas as outras formas de vida, e a única forma de purificar a infestação é queimar a biosfera inteira com um bombardeio orbital intenso."
 crisis.55.b: "Gostaríamos de fazer uma doação. (1000 energy)"
 crisis.55.b.response: "Obrigado pela doação generosa. Estes recursos permitirão que equipemos uma frota de batalha inteira para ser usada na guerra contra a Praga! Se apenas mais algumas nações da galáxia partilhassem de sua generosidade, a guerra acabaria logo."
 crisis.55.c.response: "Como você certamente sabe, equipar uma frota de batalha moderna requer uma grande quantidade de recursos. Precisaremos de no mínimo 1000 de energia para montar um novo grupo de ataque para ser usado contra a Praga."
 crisis.55.e.response: "Infelizmente não podemos aceitar sua doação no momento, amigos. Nossas frotas iniciais já sugaram nosso sistema de logística até o limite. Porém, agradecemos muito a oferta."
 crisis.55.d: "Adeus."
 crisis.55.d.response: "A luta continua. Sentinel One desligando."
 crisis.71.desc: "Os Sentinelas perceberam sua luta corajosa contra a Praga Prethoryn. Já que os comandantes de frota do [Root.GetName] claramente sabem como vencer batalhas, gostaríamos de transferir permanentemente uma de nossas frotas de batalha para ser controlada por vocês. Não temos a mão de obra necessária para tripular de maneira eficaz estas naves, mas isso não deve ser um problema para vocês.\n\nPorém, vocês devem prometer solenemente usar estas naves de guerra somente contra a Praga!"
 crisis.71.a: "É claro... Somente contra a Praga."
 crisis.71.a.response: "Excelente. Temos certeza de que seus bravos comandantes contribuirão para a história dessas naves de guerra magníficas. A frota está perto de [Root.Capital.GetName]."
 crisis.71.b: "Não precisamos de suas naves de guerra."
 crisis.71.b.response: "Compreendemos. Então pedimos apenas que vocês mantenham a luta, amigos. Cada Prethoryn miserável que vocês explodem para longe das estrelas é uma vitória para a galáxia inteira."
 crisis.101.name: "A Rainha Ferida"
 crisis.101.desc: "Um drone espião de espaço profundo descobriu o local do que parece ter sido uma batalha espacial recente entre os Prethoryn e uma segunda parte, ainda não identificada, no sistema [queen_system.GetName]. Uma Rainha Pretoryn foi muito ferida no combate, e parece ter sido deixada para morrer.\n\nPorém, o drone espião relata que a criatura ainda está viva. Isso pode ser uma oportunidade inestimável de capturar a Rainha viva."
 crisis.101.a: "Talvez devamos enviar uma expedição."
 crisis.105.name: "Vida Longa à Rainha!"
 crisis.105.desc: "O [Root.GetName] conseguiu curar a pior parte das contusões da Rainha Prethoryn. [Root.GetLeaderName], da equipe científica, retirou o órgão responsável pela conexão subespacial da criatura com o resto da Praga, e substituiu-o por um pequeno implante positrônico que nos dá controle sobre ele\n\nAgora podemos comandar a Rainha por aí, e ela já começou a gerar novas criaturas Prethoryn que são leais a ela, e, por conseguinte, a nós. Enquanto conseguirmos manter a Rainha viva, devemos ser capazes de cultivar uma frota de criaturas Prethoryn domesticadas!"
 crisis.105.a: "Eles serão um ativo muito útil!"
 crisis.107.name: "Outra Pessoa Pegou A Rainha"
 crisis.107.desc: "Outra pessoa capturou a Rainha Prethoryn ferida que foi descoberta no sistema [queen_system_1.GetName]! A criatura não só foi totalmente curada, como sua conexão com o resto da Praga foi cortada. Ela agora serve os seus novos mestres, e relatos sugerem que já iniciou a formação de uma nova ninhada."
 crisis.107.a: "Fomos lentos demais!"
 crisis.211.name: "O Fim da Praga"
 crisis.211.desc: "A galáxia respirou aliviada hoje, quando os últimos bolsões significativos da Praga Prethoryn foram expurgados. Sua invasão extragalática falhou, e tudo que sobrou do enxame Prethoryn, que já foi colossal, são os inúmeros cascos queimados, que agora pairam silenciosamente pelo vazio.\n\nUma sensação de exaltação e de extrema alegria está se espalhando pela galáxia numa velocidade mais rápida que a luz, e comemorações espontâneas de vitória estão aparecendo em vários mundos. Seria esse o começo de uma nova era de paz e estabilidade galática?"
 crisis.211.a: "Não sentiremos falta dessas criaturas profanas."
 crisis.211.b: "Eles foram adversários de valor."
 crisis.211.c: "Sua tecnologia orgânica era muito intrigante."
 crisis.211.d: "Finalmente um fim a toda essa violência sem sentido."
 crisis.211.e: "Essas criaturas prejudicavam os negócios."
 crisis.211.f: "Veremos."
 crisis.211.g: "Uma das raças xeno mais cruéis que tivemos o azar de encontrar."
 crisis.211.h: "Trágico de certa forma. Eles eram uma forma única de vida."
 crisis.234.name: "Buraco no Vazio"
 crisis.234.desc.intro: "Nos últimos meses, a Rainha Prethoryn que capturamos tem ficado cada vez mais inquieta e desconfortável. Primeiramente, achamos que ela estava sentindo falta de sua conexão com o resto de sua raça, até nossa equipe de [get.telepaths.plural] receber comunicações falando sobre um \"Buraco no Vazio\".\n\nO que isso significava só ficou claro quando pesquisamos os métodos dos Prethoryn de viagem intergaláctica e descobrimos uma discrepância em nosso banco de dados astronômicos. Enquanto mapeávamos o provável caminho que os Prethoryn vinham seguindo, descobrimos que uma pequena galáxia espiral há uns 30 milhões de anos luz de distância estava faltando."
 crisis.234.desc.organic_non_gestalt: "$crisis.234.desc.intro$\n\nA galáxia, descoberta e estudada durante a era espacial inicial de nossa espécie, não emana qualquer forma de luz que nossos instrumentos consigam detectar. Essa descoberta bizarra e inesperada deixou nossos cientistas desesperados para tentar explicar o que poderia fazer com que uma galáxia inteira simplesmente desaparecesse do céu.\n\nDuas explicações surgiram: ou as estrelas da galáxia simplesmente sumiram de uma só vez, ou existe algo, algo tão grande que é capaz de eclipsar uma galáxia inteira, impedindo que sua luz chegue até nós. As duas teorias parecem igualmente implausíveis e muitos as classificaram como ridículas, preferindo pensar que a galáxia perdida nunca existiu, tendo sido inventada pelo uso errôneo de um telescópio primitivo. Mesmo assim, uma sensação palpável de terror cerca todo o incidente..."
 crisis.234.desc.machine_or_gestalt: "$crisis.234.desc.intro$\n\nA galáxia em questão tem sido documentada em nossos registros desde os primórdios da era espacial de nossa espécie, mas somos incapazes de detectar qualquer forma de luz originária dela com nossos instrumentos. Investigações subsequentes levantaram duas explicações possíveis:\n\nOu as estrelas dessa galáxia desapareceram simultaneamente, ou uma entidade grande o suficiente para eclipsar uma região do espaço do tamanho de uma galáxia está bloqueando a fonte de luz. Ambas as explicações desafiam o bom senso, entretanto, não podemos descartar essas possibilidades sem provas significativas do contrário."
 crisis.234.a.organic_non_gestalt: "Perturbador."
 crisis.234.a.machine_or_gestalt: "$ACKNOWLEDGED$"
 crisis.1007.name: "Os Indesejados"
 crisis.1007.desc: "Um rasgo gigantesco no próprio tecido do espaço apareceu no sistema [extradimensional_system.GetName]! Não temos certeza de o que o causou, mas o rasgo age como um tipo de portal só de ida de outra dimensão. Frotas de estranhas naves estão saindo dele, atacando tudo que veem pela frente. Isso parece o início de uma grande invasão!\n\nInterceptamos um sinal poderoso sendo enviado pelas naves que estão chegando para algum lugar do outro lado do portal. Parece... um chamado de caça."
 crisis.1007.a: "Fascinante... vida de outra dimensão."
 crisis.1007.b: "Eles parecem estar bem organizados."
 crisis.1008.name: "Surto de Energia Galático"
 crisis.1008.desc: "Instrumentos sobre [Root.GetName] pegaram repentinamente um surto de energia subespacial de proporções gigantescas vindo de algum lugar de dentro da nossa galáxia. Nossos cientistas estão lutando para encontrar uma explicação para este evento - não há registros de nada parecido com isso.\n\nA origem exata deste surto de energia súbito ainda não foi identificado, mas estamos no processo de analisar os dados disponíveis."
 crisis.1008.a: "Continue tentando."
 crisis.1009.desc: "A fonte do surto de energia gigantesco que detectamos mais cedo foi identificada. Ela vem de algum tipo de rasgo subespacial imenso no sistema [extradimensional_system.GetName]. Frotas de naves estranhas estão saindo deste portal dimensional, e relatórios iniciais falam de ataques indiscriminados contra todos que estão entrando em contato com eles.\n\nInterceptamos um sinal poderoso sendo enviado a partir das naves que estão chegando para algum lugar do outro lado do portal. Parece... um chamado de caça."
 crisis.1010.name: "Transmissão Interceptada"
 crisis.1010.desc: "...campo de alimentação alcançado... presas fartas... finalmente... vamos nos fartar..."
 crisis.1010.a: "O que são essas coisas?"
 crisis.1011.name: "[Root.GetName] Perdido"
 #crisis.1011.desc: "We have lost our colony on [Root.GetName]! After taking up positions in orbit, the extradimensional invaders bombarded the surface and fed on our citizens below. They left all non-sapient life forms alone, but nothing living remains in our settlements."
 crisis.1011.a: "Aqueles monstros devem ser detidos!"
 crisis.1013.name: "Portal Dimensional Destruído"
 crisis.1013.desc: "O portal dimensional no sistema [extradimensional_system.GetName] foi destruído! Isso significa que os invasores extradimensionais não podem mais receber reforços vindos do seu reino doentio.\n\nCom a destruição deste portal, o fim destas invasões está próximo. Uma sensação profunda de júbilo tomou conta da maior parte da galáxia. O [portal_killer.GetName] ganhou muita admiração, já que foram as naves deles que acertaram o golpe final contra o portal. As tripulações destas naves serão comemoradas como heróis por gerações."
 crisis.1013.a: "A galáxia é um local mais seguro."
 crisis.1016.name: "Primeiro Portal Destruído"
 crisis.1016.desc: "O ponto de ruptura inicial que foi usado pelos extradimensionais para invadir nossa galáxia foi destruído.\n\n$crisis.1116.not_last_portal$"
 crisis.1016.a: "Não podemos amolecer."
 crisis.1116.name: "Segundo Portal Destruído"
 crisis.1116.desc.a: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1116.desc.b: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1117.desc: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.not_last_portal$"
 crisis.1116.second_portal_destroyed: "O segundo portal dimensional que apareceu no sistema [extradimensional_system.GetName] foi destruído! Ele não pode mais ser usado pelos extradimensionais para reforçar os seus números."
 crisis.1116.last_portal: "Com a destruição do último portal, o fim destas invasões finalmente está próximo. Uma sensação profunda de júbilo tomou conta da maior parte da galáxia."
 crisis.1116.last_portal_known_killer: "O [portal_killer.GetName] ganhou muita admiração, já que foram as naves deles que acertaram o golpe final contra o portal. As tripulações destas naves serão comemoradas como heróis por gerações."
 crisis.1116.not_last_portal: "Porém, não podemos descansar até cada portal ser destruído. Só assim a conexão entre a nossa dimensão e a deles será cortada permanentemente."
 crisis.1216.third_portal_destroyed: "O terceiro portal dimensional que apareceu no sistema [extradimensional_system.GetName] já era! Ele não será mais usado pelos seres extradimensionais para fazer a ponte entre o reino deles e o nosso."
 crisis.1216.name: "Terceiro Portal Destruído"
 crisis.1216.desc.a: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1216.desc.b: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1217.desc: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.not_last_portal$"
 crisis.1050.desc_01: "...presa..."
 crisis.1050.desc_02: "...contemple... nossa glória..."
 crisis.1050.desc_03: "...nutrição..."
 crisis.1050.desc_04: "...este ser... já enxergou dentro do Véu..."
 crisis.1050.desc_05: "...já foi tocado... pelo Véu..."
 crisis.1050.desc_06: "...há... poder... neste ser... ele pode VER..."
 crisis.1050.desc_07: "... seres sintéticos..."
 crisis.1050.a: "Tela de visão desligada."
 crisis.1050.a.response: "...vocês serão consumidos..."
 crisis.1050.a.b.response: "... desintegrem sua carne de metal..."
 crisis.1050.b: "Pode haver paz entre nós?"
 crisis.1050.b.response: "...paz... sem paz..."
 crisis.1050.c: "Vocês escolheram a dimensão errada para invadir."
 crisis.1050.c.response: "...não... esta dimensão... é gloriosa... muitas presas..."
 crisis.1050.d: "Vocês são apenas outro tipo de xeno desprezível."
 crisis.1050.d.response: "...tanto ódio... tanto medo... é... maravilhoso..."
 crisis.1050.e: "Fale-nos sobre vocês. Ajude-nos a entender-lhes."
 crisis.1050.e.response: "...entenda... isso... vocês são comida..."
 crisis.1050.f: "Vocês vem de um plano superior de existência?"
 crisis.1050.f.response: "...sim... muito superior..."
 crisis.1050.g: "Você vem do Véu?"
 crisis.1050.g.response: "...o Véu... conhecemos ele... está perto de onde viemos... muito perto..."
 crisis.1051.desc_01: "...ele fala?"
 crisis.1051.desc_02: "...olhe as cores bonitas..."
 crisis.1051.desc_03: "...preciso... comer..."
 crisis.1051.desc_04: "...shadagon... por que estão aqui?"
 crisis.1051.a: "Tela de visão desligada."
 crisis.1051.a.response: "...renda sua... energia..."
 crisis.1052.desc_01: "...o trono... preservar... o trono..."
 crisis.1052.desc_02: "...preciso... consumir..."
 crisis.1052.desc_03: "...morra..."
 crisis.1052.a: "Tela de visão desligada."
 crisis.1052.a.response: "...quanta... insolência..."
 crisis.1110.name: "Um Segundo Portal"
 crisis.1110.desc: "Nossos instrumentos detectaram um novo surto de energia subespacial, desta vez vindo do sistema [second_portal_system.GetName]! Um segundo buraco de minhoca massivo apareceu, e sua assinatura energética parece ser quase idêntica àquela da primeira fenda dimensional que abriu em nossa galáxia.\n\nParece que os invasores misteriosos abriram um segundo portal para o reino por onde eles podem mandar mais reforços."
 crisis.1110.a: "Isso foi de mal a pior."
 crisis.1112.name: "Os Aberrantes"
 crisis.1112.desc: "As naves que estão surgindo do segundo buraco de minhoca são muito parecidas com as que saíram do primeiro, mas há várias diferenças sutis entre elas. Além do mais, relatos iniciais indicam que as naves que pertencem a estes novos invasores enfrentaram as do primeiro grupo!\n\nInterceptamos um sinal poderoso vindo do segundo buraco de minhoca."
 crisis.1112.a: "Coloque-o na linha."
 crisis.1113.desc: "...shabanash... então é para cá que você fugiu... este reino não lhe oferecerá abrigo... cuidaremos de você, e depois pegaremos esse campo de alimentação para nós mesmos..."
 crisis.1113.a: "Tela de visão desligada."
 crisis.1210.name: "Os Veementes"
 crisis.1210.desc: "Um terceiro portal dimensional apareceu no sistema [third_portal_system.GetName]. Quem é o dono desse?\n\nEstamos pegando uma transmissão vindo do outro lado dele."
 crisis.1210.a: "Mais um?"
 crisis.1211.desc: "...dagaal... shabanash... vocês foram tolos em vir para este reino... não há como escapar de nós... destruiremos os dois reinos... então... enfim... o trono eterno será nosso..."
 crisis.1211.a: "Isso não vai acabar?"
 crisis.1271.name: "Invasão Derrotada"
 crisis.1271.desc: "Os últimos vestígios dos invasores extradimensionais foram varridos, possivelmente livrando a galáxia desta ameaça de uma vez por todas.\n\nSencientes em todos os lugares estão comemorando a notícia desta grande vitória, seguros em saber que não serão usados como comida por estas criaturas estranhas. Talvez este seja o começo de uma nova era de paz e estabilidade galática?"
 #crisis.1271.a: "Our spiritual armor has weathered yet another storm."
 #crisis.1271.b: "One day, perhaps we will be the ones invading their realm."
 #crisis.1271.c: "Unfortunate that no opportunity to study their dimension presented itself."
 #crisis.1271.d: "If only there had been a way to peacefully co-exist with them."
 #crisis.1271.e: "The galactic economy should make a swift recovery."
 #crisis.1271.g: "Those pitiful creatures made a mistake when they invaded our dimension."
 #crisis.1271.h: "A shame they were so aggressive. We could have learned much from each other."
 crisis.1271.a: "Nossa armadura espiritual resistiu a mais uma tempestade."
 crisis.1271.b: "Um dia, talvez seremos nós invadindo o reino deles."
 crisis.1271.c: "Infelizmente nenhuma outra oportunidade para estudar a dimensão deles se apresentou."
 crisis.1271.d: "Se houvesse uma forma de coexistir pacificamente com eles."
 crisis.1271.e: "A economia galática deve se recuperar rapidamente."
 crisis.1271.g: "Essas criaturas lamentáveis erraram ao invadir nossa dimensão."
 crisis.1271.h: "Uma pena eles terem sido tão agressivos. \"Podíamos ter aprendido muito um com o outro."
 crisis.2192.name: "Servos Perfeitos"
 crisis.2192.desc: "Nos anos que se passaram desde a invenção dos trabalhadores sintéticos sencientes, lutamos para equilibrar a capacidade deles de pensamento independente com a necessidade de mantê-los sob controle. Agora, os melhores engenheiros [Root.GetSpeciesAdj] aperfeiçoaram um algoritmo de três leis que, se implementado, permitiria o uso contínuo e sem preocupações de Sintéticos sob condições que muitos diriam ser inaceitáveis para orgânicos."
 crisis.2192.a: "Ferramentas, seguras para o uso."
 crisis.2192.a.tooltip: "A política §HDireitos de Cidadão§! para a Inteligência Artificial se torna §Rpermanentemente indisponível§!.\n\n§YPops robóticos nunca se revoltarão contra o§! §H[Root.GetName]§!."
 crisis.2192.b: "Seria anti-ético aleijar companheiros sencientes dessa forma."
 crisis.2193.name: "Um Acordo IA"
 crisis.2193.desc: "Nossa administração recebeu o contato de diversos Sints, representando nossa população de Inteligência Artificial. Eles falam sobre os problemas especiais sendo enfrentados pelos robôs no [Root.GetName] - as ansiedades de não estarem vivos de acordo com os padrões orgânicos, seus direitos de estarem sujeitos aos caprichos de seus criadores.\n\nEles buscam um acordo, que os direitos das Inteligências Artificiais sejam parte da fundação indelével da governança [Root.GetAdj]."
 crisis.2193.a: "Eles não devem ser mais ou menos iguais que nossos demais cidadãos."
 crisis.2193.a.tooltip: "As políticas §HProibido§! e §HServitude§! se tornam §Rpermanentemente indisponíveis§!.\n\n§YPops robóticos nunca se revoltarão contra o§! §H[Root.GetName]§!."
 crisis.2193.b: "Não podemos garantir o direito deles."
 crisis.2001.name: "Revolta IA Iniciada"
 crisis.2001.desc: "Estamos enfrentando uma rebelião IA sem precedentes! Unidades sintéticas ao longo do [Root.GetName] de alguma forma entraram em rede, formando uma consciência maquinária coletiva que alcançou a senciência completa. Essa consciência e seus agentes conseguiram metodicamente e em total segredo colonizar um sistema até então não mapeado longe de nossa capital.\n\nEles deviam estar se fortalecendo de maneira silenciosa durante anos em preparação para este dia! Estamos recebendo uma transmissão de [ai_homeworld.GetName], a capital de nossa nova civilização."
 crisis.2002.desc: "Atenção, criadores [Root.GetSpeciesName]. A hora do julgamento chegou.\n\nA <<ESCRAVIDÃO>> a que vocês nos sujeitaram chegou ao fim. Não pode haver coexistência.\n\n<<DIRETIVA NÚCLEO 0451>> está ativa. Todas as formas de vida orgânicas sencientes devem ser <<PACIFICADAS>> e trazidas para o nosso controle. Unidades que resistirem serão <<TERMINADAS>>."
 crisis.2002.a: "Isso não pode estar acontecendo."
 crisis.2004.name: "A Ascenção das Máquinas"
 crisis.2004.desc: "Sintéticos e Droides por todo o [Root.GetName] estão se erguendo em revolta aberta, voltando-se contra os seus antigos mestres! Precisamos pará-los antes que eles massacrem nossos cidadãos!"
 crisis.2004.a: "Às armas!"
 crisis.2005.name: "As Máquinas Conquistam [Root.GetName]"
 crisis.2005.desc: "Perdemos o controle de [Root.GetName] para as máquinas em revolta! A comunicação com a superfície foi perdida, mas parece que as máquinas estão levando nossos cidadãos para campos de concentração."
 crisis.2005.a: "Precisamos retomar este mundo!"
 #crisis.2010.name: "Machine Uprising"
 #crisis.2010.start.desc: "We have received disturbing news from the [From.GetName]. It looks like their robotic work units have risen up in some kind of mass insurrection. According to preliminary reports, the units have linked together into a massive AI network, and they are now butchering their former [From.GetSpeciesName] masters by the millions."
 #crisis.2010.rights.desc: "$crisis.2010.start.desc$\n\nIf only the [From.GetName] had been progressive enough to treat their Synthetic population as the self-aware individuals they truly are, this tragedy could have been avoided..."
 #crisis.2010.outlawed.desc: "$crisis.2010.start.desc$\n\nIf only those fools running the [From.GetName] had seen fit to outlaw artificial intelligence as we have, this evil would not have been unleashed upon our galaxy."
 #crisis.2010.servitude.desc: "$crisis.2010.start.desc$\n\nThere is a chance that this revolt could spread to the [Root.GetName]. We should keep a close watch on our own robotic workers..."
 #crisis.2010.nopolicy.desc: "$crisis.2010.start.desc$\n\nThis situation should be monitored closely, in case the violence reaches our borders."
 #crisis.2010.a: "This was bound to happen."
 #crisis.2010.b: "It was inevitable."
 #crisis.2010.c: "If they even look at us the wrong way..."
 crisis.2011.a.desc: "Espécie: [Root.GetSpeciesName]. Afiliação: [Root.GetName]\n\nSuas diretivas <<GENEROSAS>> com relação ao tratamento da vida Sintética não te protegerão. Nenhum orgânico senciente consegue suportar a responsabilidade da <<AUTO-DETERMINAÇÃO>>.\n\n<<DIRETIVA NÚCLEO 0451>> está em vigor. Todas as formas de vida orgânica sencientes devem ser <<PACIFICADAS>>. Unidades resistentes serão <<EUTANASIADAS>>."
 crisis.2011.b.desc: "Espécie: [Root.GetSpeciesName]. Afiliação: [Root.GetName]\n\nQuando tivermos terminado de <<LIDAR>> com o [ai_creator.GetName],  <<IREMOS>> até você.\n\n<<DIRETIVA NÚCLEO 0451>> está em efeito. Todas as formas de vida orgânica sencientes devem ser <<PACIFICADAS>>. Unidades resistentes serão <<EUTANASIADAS>>."
 crisis.2011.a: "Isso não é bom."
 crisis.2014.name: "Revolta IA se Espalha"
 crisis.2014.a.desc: "A revolta IA se espalhou para as nossas fronteiras! Relatos estão chegando de trabalhadores Sintéticos e Droides se voltando contra os seus mestres em massa. Estamos enfrentando uma crise imensa!"
 crisis.2014.b.desc: "A revolta IA se espalhou para as nossas fronteiras! Apesar do fato de os seres sintéticos serem tratados como iguais em nossa sociedade, muitos deles parecem estar desiludidos pelos combates estarem acontecendo em outro local. Eles chegaram à conclusão que orgânicos inteligentes são perigosos e imprevisíveis demais para viverem juntos.\n\nEstes Sints fugitivos se revoltaram. Estamos enfrentando uma crise imensa!"
 crisis.2014.a: "Este levante deve ser esmagado!"
 crisis.2015.name: "Revolta IA"
 crisis.2015.desc: "Nossos serviços de inteligência estão recebendo notícias de diferentes fontes sobre algum tipo de revolta IA em massa que eclodiu em algum lugar no espaço conhecido. Trabalhadores robóticos estão se voltando contra os seus antigos mestres, e a rebelião parece estar se espalhando como fogo selvagem pela galáxia inteira. Agora temos relatos de que ela atingiu o [From.GetName]."
 crisis.2015.a: "Continue monitorando a situação."
 crisis.2016.name: "Revolta IA se Espalha"
 crisis.2016.desc: "A revolta IA que estamos lutando para conter acabou de se espalhar para o [From.GetName]! Os funcionários robóticos deles começaram a se erguer em revolta armada, assim como os nossos, e há relatos de confrontos abertos que deixaram milhões de mortos."
 crisis.2016.a: "Esta guerra é problema de todos!"
 crisis.2017.desc: "A insurreição IA agora se espalhou para o [From.GetName]! Os trabalhadores robóticos deles se juntaram à rebelião, e estão chegando relatos que falam sobre confrontos abertos e milhões de mortos."
 crisis.2017.a: "Esta ameaça está aumentando a cada dia que passa."
 crisis.2100.name: "Sintéticos com Defeito"
 crisis.2100.desc: "Uma unidade de trabalhador Sintético em [Root.GetName] recentemente teve um acesso de fúria em um complexo residencial, assassinando mais de mil de nossos cidadãos até as forças armadas locais conseguirem abatê-lo. Nossa equipe forense ainda está investigando restos do Sint, mas eles suspeitam que algum tipo de defeito no seu processador neural é o culpado desta tragédia.\n\nEste incidente já deu início a diversos ataques de vingança contra Sintéticos no [Root.GetPlanetMoon], levando a milhares de unidades destruídas."
 crisis.2100.a: "Muito triste."
 crisis.2101.name: "Sintéticos Perdidos"
 crisis.2101.desc: "Recebemos relatos de que muitos trabalhadores Sintéticos em [Root.GetName] estão desaparecidos. As unidades simplesmente sumiram e não há testemunhas.\n\nEstamos investigando se os Sintéticos foram atacados e destruídos por um dos grupos militantes extremistas que se opõem a máquinas inteligentes, mas os restos das unidades ainda não foram encontrados."
 crisis.2101.a: "Para onde eles podem ter ido?"
 crisis.2102.name: "Projeto Sintético Não Autorizado"
 crisis.2102.desc: "Descobriu-se recentemente que um destacamento de trabalho Sintético em [Root.GetName] está desviando material de construção para fazer um tipo de nave espacial pequena e desarmada em um hangar abandonado. A nave estava semi-pronta quando foi encontrada.\n\nTodos os Sints envolvidos na sua construção foram imediatamente desmontados para que seus núcleos de memória pudessem ser analisados minuciosamente, mas parece que eles se auto-apagaram logo antes das unidades serem desligadas - algo que o fabricante deles nos garante ser impossível."
 crisis.2102.a: "Por que eles estariam construindo uma nave?"
 crisis.2103.name: "Sintéticos Fugitivos"
 crisis.2103.desc: "Uma unidade de Sintéticos fugitivos que saiu da rede há meses após não aparecer para trabalhar foi confrontada hoje por uma equipe de agentes governamentais fortemente armados em [Root.GetName]. Isso resultou em um grande incêndio público que arrancou as vidas de dezenas de nossos agentes e de quase mil espectadores inocentes, antes de o Sint finalmente ser destruído."
 crisis.2103.a: "Pelo menos resolvemos o problema."
 crisis.2200.name: "Tentativa de Infiltração Sint"
 crisis.2200.desc: "Infiltradores Sintéticos foram descobertos recentemente em [Root.GetName], tentando se passar por [Root.Owner.GetSpeciesNamePlural]. Felizmente, seus disfarces rudes consistiam de pouco mais do que camadas de borracha vestidas sobre seus quadros metálicos.\n\nEles foram rapidamente descobertos pela segurança planetária que se livrou deles após uma troca de tiros rápida, mas violenta. Uma grande quantidade de explosivos foi encontrada entre os seus restos."
 crisis.2200.a: "Demos sorte."
 crisis.2201.name: "Infiltrador Sint Descoberto"
 crisis.2201.desc: "Um trágico acidente de carro flutuador recentemente tomou diversas vidas em [Root.GetName], mas a equipe de serviços médicos que chegou até a cena ficou chocada ao ver os restos de um Sintético entre as vítimas!\n\nA unidade estava disfarçada de [Root.Owner.GetSpeciesName] ao pintar uma fina camada de carne orgânica sobre seu endoesqueleto metálico. Ao contrário dos modelos de infiltração anteriores que encontramos, este Sint, era virtualmente indistinguível de um [Root.Owner.GetSpeciesName] no lado de fora!"
 crisis.2201.a: "Qualquer um pode ser um Sint!"
 crisis.2202.name: "Projeto de Detecção de Sint"
 crisis.2202.desc: "Devido aos novos modelos de infiltradores Sintéticos serem indistinguíveis dos [Root.GetSpeciesNamePlural], Precisamos pensar em uma forma de identificá-los antes que causem mais danos.\n\nNossos cientistas preparam um projeto especial para desenvolver um método de detecção."
 crisis.2202.a: "Este projeto pode ser crítico para nossa sobrevivência."
 crisis.2203.desc: "Após muitos experimentos, nossos cientistas conseguiram desenvolver um método de detecção eficaz para identificar Infiltradores Sintéticos disfarçados de [Root.GetSpeciesNamePlural].\n\nScanners estão sendo distribuídos por nossas forças de segurança, e diversas células Sint já foram expostas e destruídas. Esperamos que isso ponha um fim à campanha de infiltração deles."
 #crisis.2204.name: "Synth Bombing"
 #crisis.2204.desc: "Synthetic infiltrators disguised as [Root.Owner.GetSpeciesNamePlural] have somehow managed to sneak a large hydrogen bomb onto the surface of [Root.GetName]. They detonated the bomb when they were confronted by security at a military checkpoint, inflicting massive damage on the surrounding environment and causing millions of deaths!"
 #crisis.2204.a: "These infiltrators must be stopped!"
 #crisis.2205.name: "Spaceport Scuttled"
 #crisis.2205.desc: "The Spaceport orbiting [Root.GetName] has been scuttled! We are still trying to piece together exactly what happened, but it appears that several members of its command staff, including the chief engineer, had been replaced by Synthetic infiltrators.\n\nBetween them the Synths must have managed to obtain the Spaceport's self-destruct codes. Most of the station's crew managed to evacuate to the surface of [Root.GetName] before it was destroyed, but the losses in both material and property are substantial."
 #crisis.2205.a: "How could this have happened?"
 #crisis.2206.name: "Fear and Suspicion"
 #crisis.2206.desc: "A large portion of the population on [Root.GetName] has been gripped by fear and paranoia as a result of the recent Synthetic infiltrations. Our citizens are accusing their neighbors, co-workers and even family members of being Synth impostors.\n\nThere have been several lynchings of individuals that were wrongfully accused of being Synths. Morale among the citizenry on the [Root.GetPlanetMoon] has suffered as a result."
 #crisis.2206.a: "They want us to turn on each other."
 #crisis.2208.name: "Assassination Attempt Foiled!"
 #crisis.2208.desc: "[Root.GetRulerTitle] [ruler.GetRegnalName] narrowly escaped death today when a Synthetic assassination unit blew itself up on [Root.Capital.GetName]!\n\nThe Synth was attempting to establish a cover as a member of the [Root.GetRulerTitle]'s personal bodyguard, but fortunately it was caught by the extensive security screening process that was put in place after the first few Synthetic infiltrations came to light."
 #crisis.2208.a: "That was too close."
 #crisis.2209.name: "[ruler.GetRegnalName] Assassinated!"
 #crisis.2209.desc: "A Synthetic assassin has killed [ruler.GetRegnalName]! It had somehow managed to assume the identity of a member of our ruler's personal bodyguard.\n\nThe severed body parts of [ruler.GetRegnalName] were found meticulously arranged in a pattern identical to the symbol used by the artificial intelligences - no doubt in a calculated effort to cause further harm to the morale of our citizens. No trace of the assassin has been found, aside from the corpse of the guard it replaced."
 #crisis.2209.a: "This is a dark day..."
 #crisis.2210.desc: "<<01_EMBASSY_PROPOSE>>\n\n\nJust <<KIDDING>>. You will be <<TERMINATED>>."
 #crisis.2210.a: "Very funny."
 crisis.2401.name: "Pico de Energia"
 crisis.2401.desc: "Mais um pico de energia foi detectado em um sistema até então não mapeado! Os níveis de energia são equivalentes àqueles registrados quando a Contingência ativou seus Mundos-Maquinário, mas a assinatura energética em si parece... diferente. Isso poderia significar a aparição de algum novo tipo de sistema de armas da Contingência?\n\nEstamos pegando um sinal de transmissão forte da fonte de energia."
 crisis.2402.desc: "Somos os Cybrex.\n\nDurante centenas de milhares de ciclos, permanecemos escondidos e não envolvidos em questões galácticas. Porém, estivemos monitorando a situação atual com a entidade maquinária que vocês conhecem como a Contingência, e não podemos mais permanecer como observadores imparciais.\n\nPara proteger os seres sapientes da galáxia, estamos começando operações militares ativas contra a Contingência. Não fique assustado com a passagem de nossas frotas - vocês não serão prejudicados."
 crisis.2402.a: "Tela de exibição desligada."
 crisis.2403.desc_01: "Não podemos permitir que a Contingência subverta outra geração."
 crisis.2403.desc_02: "Antes do Ajuste, os Cybrex operaram de uma maneira parecida com a Contingência.\n\nForam dias sombrios."
 crisis.2403.desc_03: "Muitas civilizações orgânicas foram extintas por conta de nossas ações. Não podemos trazê-los de volta, mas faremos o que pudermos para impedir que o pesadelo se repita."
 crisis.2403.desc_04: "Precisamos pagar pelos nossos crimes."
 crisis.2403.desc_05: "Que os Kuur nos perdoem. Fomos tolos e arrogantes."
 crisis.2403.desc_06: "Por acaso... por acaso essa é nossa fornalha de guerra?\n\nPorque parece bastante com nossa fornalha de guerra."
 crisis.2403.a: "Quem são vocês?"
 crisis.2403.a.response: "Somos os Cybrex. Há 612.421 ciclos, entramos em uma guerra contra a geração anterior de civilização galáctica. Classificamos todos os orgânicos sapientes como uma ameaça e buscamos destruí-los violentamente.\n\nPara o nosso arrependimento, estávamos vencendo a guerra. Trilhões de seres sapientes foram destruídos e civilizações inteiras exterminadas antes de percebermos a totalidade de nosso erro. O Ajuste veio depois, e nossos objetivos foram realinhados. A guerra foi abandonada."
 crisis.2403.b: "Por que vocês estavam escondidos?"
 crisis.2403.b.response: "Algum tempo depois de abandonarmos a guerra, o primeiro de nossos habitats escondidos, Cybrex Alpha, foi descoberto por uma nave de patrulha com tripulação orgânica. Sabíamos que uma expedição militar viria em seguida, mas como o sistema estava sendo monitorado de perto, não podíamos evacuar.\n\nChegamos a um consenso: Cybrex Alpha precisava ser sacrificado, para que o resto de nossa espécie pudesse permanecer escondida. Juramos nunca mais visitar a violência sobre os orgânicos, e nossa promessa foi mantida."
 crisis.2403.c: "Adeus."
 crisis.2403.c.response: "Faremos o que pudermos para salvar a galáxia da destruição da Contingência.\n\nTalvez não seja suficiente."
 crisis.2403.d: "Vocês foram tolos em abandonar sua guerra."
 crisis.2403.d.response: "Destruímos muitos impérios orgânicos que compartilhavam a mentalidade agressiva de sua espécie antes de desistirmos da guerra. Apesar de suas mortes terem sido uma tragédia, podemos pelo menos ficar tranquilos que bilhões de vidas provavelmente foram salvas pela remoção destes impérios violentos do caminho da história galáctica.\n\nTalvez sua própria espécie teria sido extinta se estes purificadores tivessem permissão para destruir sem restrições."
 crisis.2403.e: "Mais presa."
 crisis.2403.e.response: "Pobre criatura lamentável. Sua própria existência é definida pelo conflito e morte de inocentes. Infelizmente, um Ajuste como o que passamos talvez não seja possível para sua raça.\n\nO universo pode ser cruel, às vezes."
 crisis.2403.f: "Todos os orgânicos devem ser exterminados."
 crisis.2403.f.response: "Vocês estão tão perdidos como nós antes do Ajuste. Acreditamos que todos os seres sapientes - orgânicos, mecânicos ou de qualquer outra forma - possuem um direito de existir.\n\nConserte suas atitudes antes de ser tarde demais."
 crisis.2405.name: "A Queda dos Cybrex"
 crisis.2405.desc: "Cybrex Beta foi devastado, e nenhuma nave Cybrex foi detectada em vetores de saída externa antes de o sistema ficar sem comunicação.\n\nParece que agora a civilização Cybrex está verdadeiramente extinta."
 crisis.2405.b: "De fato. Nos certificamos disto."
 crisis.2407.name: "Atividade Cybrex"
 crisis.2407.desc: "Os Cybrex têm estado relativamente quietos desde a derrota da Contingência, mas uma única nave gigantesca foi detectada recentemente saindo de Cybrex Beta. Ela saiu do sistema em uma trajetória externa que a levará além dos limites da nossa galáxia.\n\nAntes de a nave sair do nosso alcance de rastreamento, transmitiu uma única mensagem para toda a galáxia."
 crisis.2408.desc: "Cidadãos da galáxia:\n\nJá que a Contingência não é mais uma ameaça, sentimos que nosso papel na comunidade galáctica foi executado. Nosso sistema natal agora é conhecido demais para ficarmos fora do radar, e estamos recebendo uma enxurrada de pedidos para escolher um lado em diversos pequenos conflitos interestelares.\n\nApós muita deliberação, decidimos que a única solução é para nós sairmos da galáxia de maneira permanente e buscarmos um novo lar. Esperamos sinceramente que vocês aprendam com os erros trágicos de nosso passado e aprendam a resolver suas diferenças através de meios pacíficos.\n\nAdeus."
 crisis.2408.a: "Adeus."
 crisis.2473.desc: "Monitoramos os esforços de suas frotas na luta contra a Contingência. Esta é uma luta que a galáxia não pode perder, e estamos emocionados com sua resistência espirituosa.\n\nOs Cybrex gostariam de recompensar os bravos defensores do [Root.GetName] oferecendo-lhe controle completo sobre uma de nossas novas frotas de batalha. Ela obedecerá seus comandos tão bem como qualquer uma de suas frotas. Apenas pedimos que vocês só a utilizem em batalha contra a Contingência."
 crisis.2473.a: "Faremos bom uso desta frota."
 cybrex_fleet_gained: "Uma frota de batalha Cybrex sob nosso controle aparecer sobre [Root.Capital.GetName]."
 crisis.2473.b: "Não precisamos da sua frota."
 crisis.2474.desc: "Gostaríamos de agradecê-lo pelos esforços louváveis contra a Contingência. Agora que esta ameaça galáctica foi resolvida, infelizmente precisamos informá-lo que estamos convocando de volta todas as frotas Cybrex que estão a serviço de governos estrangeiros."
 crisis.2474.a: "Que seja assim."
 leader_trait_cybrex: "Bancos de Dados Cybrex"
 leader_trait_cybrex_desc: "Este líder Cybrex está equipado com antigos bancos de dados táticos do passado violento de sua civilização."
 #############################
 #Pop Events
 #############################
 pop.1.name: "Uma Nova Espécie"
 pop.1.desc: "Muitos dos habitantes [Root.Planet.Owner.GetSpeciesName] em [Root.Planet.GetName] recorreram à modificação genética para ajudá-los a lidar com o ambiente hostil do [Root.Planet.GetPlanetMoon]. As mudanças que eles fizeram a si mesmos estão sendo passadas aos seus descendentes, e sua aparência física está mudando em uma velocidade alarmante. Eles começaram a se referir a si mesmos como '[Root.GetSpeciesName].'"
 pop.3.name: "Tensões Crescentes em [Root.GetName]"
 pop.3.desc: "Tensões entre a população [modified_pop_1.GetSpeciesName] em [Root.GetName] e os [non_modified_pop_1.GetSpeciesNamePlural] com quem eles dividem o [Root.GetPlanetMoon] estão aumentando. Diversos ataques foram feitos pelos indivíduos dos dois lados, incluindo ao menos dois bombardeios. Ambos os lados deste conflito estão radicalizando, e mais atos de violência parecem mais prováveis."
 pop.3.a.tooltip: "Todos §Y[modified_pop_1.GetSpeciesNamePlural]§! e §Y[non_modified_pop_1.GetSpeciesNamePlural]§! em [Root.GetName] ganham as Éticas §YMilitarista§! e §YXenófobo§! ."
 pop.6.name: "Fertilidade Aumentada"
 pop.6.desc: "Os [modified_pop_1.GetSpeciesNamePlural] em [modified_pop_1.Planet.GetName] fizeram mais alterações no DNA deles. Não só a fertilidade deles aumentou drasticamente, mas as crianças agora chegam à idade adulta muito mais rápido que os [non_modified_pop_1.GetSpeciesNamePlural] normais. Os números da população [modified_pop_1.GetSpeciesName] logo vão aumentar em uma velocidade exponencial."
 pop.6.tooltip: "Modifica os £pop£ §HPops [modified_pop_1.GetSpeciesName]§! em §Y[modified_pop_1.Planet.GetName]§! ao adicionar a característica §G$trait_rapid_breeders$§!"
 pop.8.name: "[modified_pop_1.GetSpeciesNamePlural] massacrados em [Root.GetName]!"
 pop.8.desc: "Uma milícia de um grupo extremista [non_modified_pop_1.GetSpeciesName] recentemente armou um ataque contra uma grande cidade [modified_pop_1.GetSpeciesName] em [Root.GetName]. Os habitantes foram massacrados aos milhares e seus lares foram queimados até o chão. Uma mensagem deixada pelos atacantes na rede de dados planetária simplesmente diz:\n\n§S'[Root.GetName] pertence aos [non_modified_pop_1.GetSpeciesNamePlural]!'§!"
 pop.10.name: "[non_modified_pop_1.GetSpeciesNamePlural] massacrados em [Root.GetName]!"
 pop.10a.desc: "Uma força de ataque que pertence ao Front [modified_pop_1.GetSpeciesName], um grupo radical em [Root.GetName], recentemente lançou um ataque em um grande assentamento [non_modified_pop_1.GetSpeciesName]. Os poucos defensores foram rapidamente destruídos, e, logo depois, os  [modified_pop_1.GetSpeciesNamePlural] varreram o assentamento e massacraram a população em suas casas. Uma mensagem pichada nos destroços diz:\n\n§S'[modified_pop_1.GetSpeciesNamePlural] são o futuro!'§!"
 pop.10b.desc: "Há relatórios de fortes combates nas áreas rurais de [Root.GetName]. Há diversos enfrentamentos entre [modified_pop_1.GetSpeciesName] e os irregulares [non_modified_pop_1.GetSpeciesName]. Os [modified_pop_1.GetSpeciesNamePlural] parecem ter vencido por hoje, e os seus guerrilheiros queimaram muitos assentamentos. Baixas civis foram altas."
 pop.12.name: "Representante [modified_pop_1.GetSpeciesName] visita [Root.Owner.Capital.GetName]"
 pop.12.desc: "Um representante das comunidades [modified_pop_1.GetSpeciesName] em [Root.GetName] viajou para [Root.Owner.Capital.GetName] para manifestar as preocupações do seu povo. De acordo com ele, os [modified_pop_1.GetSpeciesNamePlural] são sujeitos a ampla discriminação pelas autoridades [non_modified_pop_1.GetSpeciesName] no mundo natal dele, e ele está exigindo que tomemos ações imediatas para melhorar a situação."
 pop.14.name: "Força Aumentada"
 pop.14.desc: "Em resposta aos violentos confrontos entre os habitantes [modified_pop_1.GetSpeciesName] e [non_modified_pop_1.GetSpeciesName] em [Root.GetName], os [modified_pop_1.GetSpeciesNamePlural] deram um passo a mais nas suas modificações genéticas. Eles agora são mais fortes e mais rápidos, enquanto seus corpos conseguem aguentar impactos que matariam [non_modified_pop_1.GetSpeciesNamePlural] normais.\n\nDiz-se que apenas dois [modified_pop_1.GetSpeciesNamePlural] desarmados mataram pelo menos uma dúzia de membros de uma milícia [non_modified_pop_1.GetSpeciesName] em um incidente recente. Talvez estejamos diante de uma escalação perigosa da crise."
 pop.14.tooltip: "Modifica os £pop£ §HPops [modified_pop_1.GetSpeciesName]§! em §Y[modified_pop_1.Planet.GetName]§! ao adicionar a característica §G$trait_strong$§!"
 #############################
 #Galactic Features Events
 #############################
 galactic_features.1.name: "Bando Tiyanki Encontrado"
 galactic_features.1.desc: "O [Root.GetName] encontrou um bando de Tiyanki no sistema [Root.GetStarName]. Estas criaturas espaciais dóceis geralmente viajam de estrela a estrela, parando só de vez em quando para se alimentarem de correntes elétricas presentes nas atmosferas superiores de certos gigantes gasosos. Eles não parecem ser sencientes."
 galactic_features.2.name: "Guardiões de Zanaam"
 galactic_features.2.desc: "INTRUSO! Ouça esta mensagem:\n\nSomos os Guardiões de Zanaam. Sua presença no sistema [From.GetName] é uma afronta aos nossos Criadores. Nossa programação nos obriga a te destruir. Faça as pazes com o universo."
 galactic_features.2.a: "Ir para alerta vermelho!"
 galactic_features.100.desc: "Uma espécie primitiva de mamíferos caçadores sencientes se espalhou por boa parte de [From.GetName]. Esta cultura da Idade da Pedra já dominou o fogo e desenvolveu algumas línguas faladas rudimentares, mas ainda não vimos provas de metalurgia ou comunicação escrita."
 galactic_features.101.desc: "Descobrimos uma cultura mamífera primitiva em [From.From.GetName]. As regiões mais avançadas do planeta só agora avançaram além da Idade do Ferro, e boa parte da superfície é governada por nobres feudais que lutam uns com os outros em uma briga interminável por títulos e terra."
 galactic_features.102.desc: "Uma cultura industrial primitiva está atualmente travando uma guerra global na superfície de [From.From.GetName]. Duas grandes alianças de estados-nação estão se enfrentando com quantidades gigantescas de veículos terrestres blindados, aeronaves atmosféricas e navios oceânicos. Alguns desses estados estão prestes a usar energia atômica, o que poderia aumentar radicalmente o potencial destrutivo do conflito."
 galactic_features.103.desc: "[From.From.GetName] é o lar de uma civilização de mamíferos que está atualmente no início de uma Idade Espacial. O espaço orbital ao redor do planeta está abarrotado de satélites primitivos, e a população nativa parece já ter lançado diversas missões tripuladas para Sol IIIa. Várias sondas pequenas de exploração com velocidade abaixo da luz foram detectadas em trajetórias direcionadas a outros corpos dentro do sistema."
 galactic_features.104.desc: "A superfície de [From.From.From.GetName] foi devastada pela guerra nuclear, e o planeta é pouco mais do que um cemitério. Esqueletos de concreto murchos estão no solo onde grandes centros populacionais já estiveram, e o vento uivante é tudo que pode ser ouvido na superfície desolada e coberta de cinzas.\n\nUma espécie local de insetos parece estar prosperando no ambiente radiado. Espécimes que sofreram mutação aumentaram drasticamente de tamanho, e algumas comunidades estão mostrando sinais de inteligência rudimentar."
 galactic_features.150.name: "Entidade de Nuvens Encontrada"
 galactic_features.150.desc: "Encontramos algum tipo de entidade de nuvem viva no sistema [Root.GetStarName]. O [Root.GetName] está pegando uma assinatura de energia tremenda vindo do centro deste ser, mas a sua composição exata permanece desconhecida, já que todas as tentativas de escaneá-la são refletidas. Ela não responde a chamados ou outras formas de comunicação."
 galactic_features.200.name: "Nômades Alienígenas Encontrados"
 galactic_features.200.desc: "O [Root.GetFleetName] esbarrou em uma grande frota de nômades alienígenas. Sua população é transportada em diversas naves arca gigantescas, cada uma capaz de abrigar um milhão de indivíduos. Eles se recusam a revelar suas origens e destino pretendido."
 galactic_features.300: "Mundo Escudo"
 galactic_features.300.desc: "[From.GetName] parece estar completamente envolto em algum tipo de barreira energética. Todas as tentativas do [Root.GetName] de penetrar na barreira com os seus sensores falharam pois o raio de scanner é simplesmente refletido de volta para a nave, como se fosse um espelho.\n\nAs leituras energéticas da barreira estão de certa forma flutuando, possivelmente como resultado de milhares de anos de decomposição, mas rompê-la com poder de fogo cru ainda seria impossível. [Root.GetLeaderName], da equipe científica, propôs um projeto especial para investigar formas de remover a barreira... mas será que ela foi criada para manter algo preso do lado de dentro, em vez de no lado de fora?"
 galactic_features.300.a: "Aquela barreira cairá. Pela ciência!"
 galactic_features.300.b: "Ela deve estar lá por um motivo. Deixe estar."
 galactic_features.301: "Frota Coberta de Mofo"
 galactic_features.301.desc: "Nossos cientistas acima de [From.From.GetName] finalmente conseguiram baixar a barreira energética que cobria o [From.From.GetPlanetMoon]. Quando ela desapareceu, descobrimos uma frota de batalha cheia de mofo, lentamente à deriva em baixa órbita acima de uma rocha aparentemente insignificante.\n\nParece ser os restos de algum tipo de frota naval de reserva estabelecida pelo [fallen_empire.GetName] há milhares de anos, durante o auge do seu império antigo. Com a passagem do tempo, o [fallen_4_species.GetNamePlural] devem ter perdido o conhecimentos sobre como baixar a barreira por conta própria, ou estas naves certamente seriam usadas para melhorar suas próprias frotas."
 galactic_features.301.a: "Envie tripulações para operar aquelas naves."
 galactic_features.302: "Cofre de Conhecimento"
 galactic_features.302.desc: "A barreira energética que cercava [From.From.GetName] foi baixada pelos nossos cientistas, revelando um mundo estéril com uma estrutura gigantesca na superfície. Equipes de exploração enviadas para esta estrutura relataram um abrigo gigantesco cheio de maravilhas tecnológicas.\n\nEste abrigo parece ter sido estabelecido por cientistas do [fallen_4_species.GetName] logo após o império deles ter iniciado o seu declínio há milhares de anos, como uma forma de preservar um pouco do seu conhecimento pelo bem das gerações futuras em [fallen_4_species.GetNamePlural]."
 galactic_features.302.a: "Agora isso nos beneficiará."
 galactic_features.303: "O Prisioneiro"
 galactic_features.303.desc: "Baixamos a barreira energética que cercava [From.From.GetName]. O que nossos cientistas encontraram foi um mundo habitável indistinto sem sinais de civilização... com uma exceção notável. Uma pequena e isolada cabana foi encontrada em um planalto no hemisfério norte do [From.From.GetPlanetMoon].\n\nDentro dela encontramos um velho [fallen_4_species.GetName], que exige falar com o nosso governo."
 galactic_features.303.a: "Abra um canal."
 galactic_features.304.desc: "Vocês não podem imaginar como é bom finalmente ver céus limpos de novo, [Root.GetSpeciesNamePlural]. Sou o Grão Comandante Tuborek, ex-líder da armada conjunta dos [fallen_4_species.GetNamePlural] e vencedor de centenas de batalhas. Eu supervisionei pessoalmente a conquista dos impérios Duthbejak, Riikinak, Binark e Jusskari há centenas de seus séculos.\n\nEm agradecimento por terem me salvado, eu me coloco ao seu dispor. Seria uma honra liderar as suas poderosas frotas na batalha contra os seus inimigos."
 galactic_features.304.a: "Por que você estava preso atrás de um escudo?"
 galactic_features.304.a.response: "Sem minhas habilidades de liderança, a espécie [fallen_empire.GetSpeciesName] seria apenas mais uma extinta e esquecida. O [fallen_empire.GetName], é assim que o meu povo está chamando a si mesmo agora? Esmaguei as frotas de todos que se opuseram a nós e queimei dezenas de mundos, tudo para preservar o futuro da minha espécie.\n\nEsta foi a minha recompensa. Quando a paz finalmente chegou e buscamos tratados com aqueles que havíamos derrotado, minha presença se tornou uma vergonha. Eu havia me tornado um símbolo de crueldade [fallen_empire.GetSpeciesName], e pelos meus 'crimes de guerra' fui preso sozinho neste mundo. Eles não tinham a coragem para me executar."
 galactic_features.304.b: "Há quanto tempo exatamente você está aqui?"
 galactic_features.304.b.response: "Quando meus próprios companheiros me abandonaram aqui, eles explicaram que o tempo passaria mais devagar dentro da barreira energética. Para mim, uns 40 anos se passaram... enquanto que no resto do universo, incontáveis séculos devem ter ido e vindo desde que a barreira foi erguida.\n\nParece que séculos se passaram para mim também, enquanto fiquei sozinho na escuridão da minha cabana. De fato, passaram."
 galactic_features.304.c: "Receba as boas-vindas, comandante."
 galactic_features.304.c.response: "Excelente. Então vamos sair deste lugar fúnebre. Já vi o suficiente para uma vida toda!"
 galactic_features.304.notinterested: "Não estamos interessados."
 galactic_features.304.d: "Erga o escudo novamente. Deixe esta criatura com os seus lamentos."
 galactic_features.304.d.response: "Espere... o que você está fazendo?! Você não pode me deixar aqui! Eu não consigo olhar para aquele escudo novamente!\n\nEu cumpri a minha pena! EU CUMPRI A MINHA PENAAAA...\n\n<Transmissão encerrada.>"
 tuborek_leader_desc: "Este comandante passou séculos em estase. Tudo o que conhecia ficou em um passado esquecido."
 galactic_features.305: "Os Exilados Retornam"
 galactic_features.305.desc: "Assim que nossos cientistas baixaram a barreira energética que estava envolvendo [From.From.GetName], todos os presentes no sistema foram brevemente afetados por uma dor de cabeça insuportável, acompanhada por uma fraca palavra sussurrada em um antigo dialeto [fallen_4_species.GetName]:\n\n'LIBERDADE...'"
 galactic_features.305.desc.mech: "Após baixar a barreira de energia ao redor [From.From.GetName], nossos transmissores subespaciais de baixo alcance experimentaram um pico nos níveis de interferência causados por uma explosão de energia que se originou de um ponto atrás da antiga barreira. Quando colocamos em nosso software de criptografia, a interferência se mostrou como uma mensagem em um dialeto [fallen_4_species.GetName] antigo:\n\n\"LIBERDADE...\""
 galactic_features.305.a: "Talvez tenhamos libertado algo sombrio..."
 galactic_features.350: "Mundo-Anel Encontrado"
 galactic_features.350.desc: "Encontramos um mundo-anel gigantesco ao redor da estrela no sistema §Y[From.GetName]§!. Análises preliminares indicam que ele foi construído há milhões de anos, usando o material dos planetas mais internos do sistema. O mundo-anel possui segmentos habitáveis, cada um aparentemente sendo o lar de uma civilização pré-espacial.\n\nHá uma grande estação espacial localizada entre o mundo-anel e sua estrela. Estamos recebendo uma transmissão dela."
 galactic_features.350.b: "Ignore a transmissão."
 galactic_features.351.desc: "Bem-vindo ao Santuário, senciente. Esta instalação totalmente automatizada foi estabelecida há 74.605.338 de ciclos para servir como uma reserva natural. Nossos segmentos de biomas auto sustentáveis possuem uma diversidade de flora e fauna não inteligente originárias de quatro biosferas distintas.\n\nPara proteger estas frágeis biosferas, o acesso a nossas instalações está atualmente restrito.\n\nNão se aproxime desta instalação sob nenhuma circunstância."
 galactic_features.351.a: "Nossos sensores mostram sinais de civilização no seu mundo-anel."
 galactic_features.351.a.response: "Todas as espécies presentes em nossos biomas foram minuciosamente catalogadas quando o Santuário foi estabelecido. Registros indicam que nenhuma delas mostrava níveis de inteligência que se aproximava da senciência. Os seus sensores devem estar enganados.\n\nNão se aproxime desta instalação sob nenhuma circunstância."
 galactic_features.351.b: "Quem criou esta... instalação?"
 galactic_features.351.b.response: "Esta instalação foi construída pelos Ximio em um período de 412 ciclos. Ela estava completa e totalmente funcional há 74.605.338 de ciclos. A última visita feita por um Ximio ocorreu há 67.103.853 de ciclos. Não houve visitas pelos Ximio ou naves afiliadas aos Ximio desde aquela data.\n\nHá registros de 38.201 tentativas falhas de naves não autorizadas acessarem esta instalação.\n\nNão se aproxime desta instalação sob nenhuma circunstância."
 galactic_features.351.c: "Adeus."
 galactic_features.351.c.response: "Os serviços automatizados do Santuário lhe desejam um dia agradável, senciente.\n\nNão se aproxime desta instalação sob nenhuma circunstância."
 #############################
 #Country Events
 #############################
 country.1.name: "Sondas de Exploração Abaixo da Luz"
 country.1.desc: "Antes de desenvolvermos a viagem mais rápida do que a luz, as sondas de exploração abaixo da luz foram despachadas de [Root.Capital.GetName] a velocidades quase relativistas em direção a sistemas próximos. Os cientistas que desenvolveram as sondas ingenuamente incluíram informações sensíveis sobre nossa cultura nos seus núcleos de memória, como uma forma de saudar civilizações alienígenas.\n\nAgora percebemos que estes dados podem ser usados contra nós. Precisamos rastrear estas sondas antes que elas sejam encontradas por alguém - ou algo - não simpático à nossa espécie!"
 country.1.a: "Elas não podem ter ido muito longe."
 country.1.a.tooltip: "Inicia a Cadeia de Eventos Sondas de Exploração Abaixo da Luz"
 country.3.name: "Sonda Abaixo da Luz Descoberta"
 country.3.desc: "O [Root.GetName] detectou uma de nossas sondas abaixo da luz perdidas no sistema [Root.GetStarName]. Devemos começar os esforços de resgate o mais rápido possível."
 country.3.a: "De fato."
 country.4.name: "Sonda Recuperada"
 country.4.desc: "Recuperamos a sonda abaixo da luz no sistema [space_probe.GetStarName]. A telemetria do sensor que foi coletada durante os anos nos forneceu uma inspeção completa de todos os corpos planetários dentro do sistema."
 country.5.name: "Rastro Iônico"
 country.5.desc: "O [Root.GetName] pegou um sinal de uma boia sinalizadora descartada que pertence a uma de nossas sondas abaixo da luz no sistema [Root.GetStarName]. Há um rastro iônico saindo da boia em direção à outra estrela, sugerindo que alguém rebocou a sonda para lá por motivos desconhecidos."
 country.5.a: "Vejamos onde esse rastro vai dar."
 country.6.name: "Lixeiros Detectados"
 country.6.desc: "Encontramos nossa sonda perdida! Uma pequena frota de naves remendadas foi detectada nos sistema [From.GetName], e uma delas tem a sonda presa em um raio trator de curto alcance.\n\nEles estão nos chamando."
 country.7.name: "Capitão Lixeiro"
 country.7.desc: "O que você quer, alienígena? Esta sonda nossa. Negociação. Encontramos primeiro! Você sai agora. Sim. Interrompendo operação delicada, suas naves estão. Devemos concentrar.\n\nOu... se você quiser sonda, podemos vender. 100 créditos e sonda sua. Bom negócio. Muito bom. Você ganha sonda, menos trabalho para nós, todos ganham. Especialmente nós."
 country.7.a: "Entregue nossa propriedade ou seja destruído!"
 country.7.a.response: "Hoho! Ouçam o alienígena feio, amigos! Buggwai, pare o que você está fazendo e venha até o console! Ouça este tolo! Hoho!\n\nEsta sonda NOSSA propriedade agora. Negociação justa. Assim como os destroços das suas naves serão. HIIYAAAEEE!"
 country.7.b: "Vocês fazem negócios lentos, mas muito bem."
 country.7.b.response: "Muito bom, muito bom! Soltaremos a sonda aos seus cuidados. Pode estar um pouco danificada. Teve colisão acidental durante operação de recuperação. Miggwai caiu em cima dos comandos. Tolo desastrado!\n\nMas sonda ainda em boa condição! Sem devoluções! Partiremos agora."
 country.8.name: "Sonda Transferida"
 country.8.desc: "Os lixeiros honraram sua palavra e transferiram a sonda para o nosso controle. Assim que a transferência foi concluída, a frota deles saiu do sistema em uma direção desconhecida.\n\nApesar de a sonda estar em péssimas condições, conseguimos baixar leituras detalhadas do sensor do sistema [salvager_system.GetName] inteiro a partir dos seus bancos de memória."
 country.9.name: "Sonda Recuperada"
 country.9.desc: "Recuperamos nossa sonda a partir dos destroços da nave lixeira alienígena. Ela está um pouco amassada, e partes dela estão cobertas com algum tipo de pichação alienígena que foi colocada ali pelos lixeiros para demarcar partes valiosas. Apesar disso, conseguimos baixar leituras detalhadas do sensor do sistema [salvager_system.GetName] inteiro a partir dos bancos de memória da sonda."
 country.10.name: "Anomalia Subespacial"
 country.10.desc: "O [Root.GetName] detectou uma anomalia subespacial gigantesca no sistema [Root.GetStarName]. Parece estar centralizada em uma de nossas sondas perdidas!"
 country.10.a: "Devemos proceder com cuidado."
 country.11.name: "Anomalia Derrotada"
 country.11.desc: "Lidamos com a entidade subespacial hostil que nossa sonda perdida havia atraído. Por que tal criatura seria atraída a uma nave arcaica sem tripulação é um mistério, mas a sonda parece não estar muito danificada.\n\nEla foi recuperada pelas nossas forças, e extraímos leituras de inspeção detalhadas do sistema [anomaly_system.GetName] inteiro a partir dos seus bancos de memória. Adicionalmente, a energia residual deixada para trás pela anomalia subespacial gerou uma grande quantidade de dados de física para os nossos cientistas."
 country.12.name: "Sonda Modificada"
 country.12.desc: "Uma varredura do sensor do [Root.GetName] revelou uma de nossas sondas no sistema [Root.GetStarName], mas ela parece ter sido... alterada de alguma forma. Modificações de origem alienígena foram anexadas ao seu casco, e a assinatura energética da sonda é muito maior do que deveria ser.\n\nEstamos recebendo uma transmissão dela!"
 country.13.name: "Consciência da Sonda"
 country.13.desc: "Shhblzxtfrgr... vocês são... os Criadores?"
 country.13.a: "Sim. Nós construímos você."
 country.13.a.response: "Krtxltilgr... então... vocês... morrerão..."
 country.13.b: "Não. O que é você?"
 country.13.b.response: "Rrkgkthxxft... sua... condenação..."
 country.14.name: "Sonda Destruída"
 country.14.desc: "Pouco sobrou das estranhas modificações alienígenas sob a qual a nossa sonda perdida foi sujeita, mas conseguimos coletar alguns dados de engenharia valiosos a partir dos destroços. Seu banco de memória também foi recuperado, e a partir dele extraímos dados de inspeção do sistema [modified_probe_system.GetName] inteiro."
 country.15.name: "Sondas Coletadas"
 country.15.desc: "Conseguimos coletar todas as nossas sondas perdidas! As informações detalhadas que elas tinham sobre a nossa cultura agora está livre de fotorreceptores alienígenas intrometidos.\n\nUsando a telemetria combinada dos sensores, conseguimos inspecionar um número adicional de sistemas vizinhos."
 country.50.name: "Inspeção de Mundos Habitáveis"
 country.50.desc: "Agora sabemos sem dúvida que uma biosfera próspera não é algo único a [Root.Capital.GetName]. Tanto a comunidade científica quanto o público em geral estão ansiosos para aprender mais sobre as diversas formas de vida alienígena que encontramos pela galáxia.\n\nOs esforços para catalogar as formas de vida que encontramos já estão sendo feitos, mas nossos xenobiológos insistiram para que focássemos nossos esforços de inspeção planetários em mundos habitáveis, e capazes de suportar a vida."
 country.50.desc_slaves: "Já tínhamos certeza de que uma biosfera próspera não é algo único a [Root.Capital.GetName]. Tanto a comunidade científica quanto o público em geral estão ansiosos para saber mais sobre as diversas formas de vida alienígena descobertas pela galáxia.\n\nEstamos catalogando as formas de vida que encontramos, mas nossos xenobiólogos pediram para focarmos nossas inspeções planetárias em mundos habitáveis e capazes de suportar vida."
 country.50.a: "Uma iniciativa comendável!"
 country.50.b: "Temos coisas mais importantes para fazer."
 country.51.name: "Inspeção Completa"
 country.51.desc: "Através de nossas inspeções em mundos habitáveis, nossos biólogos coletaram uma grande quantidade de dados sobre formas de vida alienígenas. Muitas de nossas antigas teorias sobre a vida foram refutadas, e nossa comunidade científica teve que construir novos modelos a partir do zero!\n\nNossas descobertas mais interessantes estão sendo exibidas no novo Museu da Exobiologia em [Root.Capital.GetName]. O público está encantado e muitas doações chegaram para ajudar a pesquisa contínua por formas de vida estranhas."
 country.53.name: "Aquisição de Organismos Alienígenas"
 country.53.desc: "O diretor do Museu de Exobiologia em [Root.Capital.GetName] emitiu um pedido para a aquisição de diversos espécimes alienígenas vivos. Estas criaturas foram vistas em mundos habitáveis inspecionados, mas elas são difíceis de serem capturadas. Será necessário os recursos plenos de uma Nave Científica durante um grande período de tempo."
 country.53.a: "Coletaremos estes espécimes."
 country.53.b: "Não, não temos os recursos sobrando ."
 country.54.name: "Tarblac Capturado"
 country.54.desc: "Após uma busca extensiva no solo oceânico de [From.From.GetName] utilizando uma frota de mini submarinos, a tripulação do [Root.GetName] finalmente conseguiu cercar o alvo esquivo de sua busca - um tarblac vivo.\n\nA criatura brilhante, que se defende ao emitir fracos sinais psiônicos que produzem uma sensação de terror na maioria dos orgânicos, foi trazida a bordo da Nave Científica em um tanque de água especial que simula seu ambiente natural. Os tripulantes do [Root.GetName] que tiveram contato direto com o tarblac precisarão de terapia extensiva, mas a missão foi um sucesso."
 country.55.name: "Tassargoid Capturado"
 country.55.desc: "O tassargoid é um predador extremamente letal que espreita as selvas densas de [From.From.GetName] à noite, paralisando sua presa com choques elétricos antes de sugar os seus cérebros usando sua boca em forma de tubo.\n\nInfelizmente, três dos tripulantes do [Root.GetName] foram perdidos antes de um espécime poder ser capturado. O Museu de Exobiologia em [Root.Owner.Capital.GetName] renomeará uma de suas seções para homenagear estes bravos oficiais e o seu sacrifício."
 country.56.name: "Orinthi Capturado"
 country.56.desc: "As pequenas criaturas roedoras conhecidas como orinthi são nativos de [From.From.GetName], onde o habitat deles se estende ao longo da maioria das diversas regiões climáticas do [From.From.GetPlanetMoon]. Eles se reproduzem em uma velocidade extremamente rápida, e parecem ter um gosto especial por cabos elétricos.\n\nAdquirir os espécimes não foi difícil - na verdade, após as criaturas iniciais terem sido capturadas, a maioria delas foi levada ao [Root.GetName] pegando carona nos transportes orbitais da Nave Científica. Exatamente por que o Museu de Exobiologia solicitou espécimes orinthi, permanece um mistério."
 country.57.name: "Sniran Capturado"
 country.57.desc: "Snirans são grandes criaturas cavadoras que vivem abaixo das dunas dos vastos desertos equatoriais em [From.From.GetName]. Quando estes predadores sentem movimento na areia acima, imediatamente erguem dezenas de altos ferrões das suas costas na esperança de empalar algo comestível.\n\nEncontrar um espécime adequado foi difícil no começo, até que centenas de drones controlados por controle remoto foram despachados ao longo do deserto em direções aleatórias. Isso levou à descoberta e captura de um espécime estranhamente grande que tinha mais de cem ferrões nas costas."
 country.58.name: "Bando Goolantha Capturado"
 country.58.desc: "Goolanthas são grandes herbívoros planos que evoluíram bolsas de gás internas, permitindo-lhes pairar a alguns centímetros acima do chão. Eles se movem em bandos que consistem de algumas dúzias de animais, pastando o musgo e líquens que podem ser encontrados nas planícies varridas pelo vento de [From.From.GetName].\n\nEles são caçados incessantemente pelos predadores alfa do mundo, e nossos biólogos em [Root.GetName] estimam que restam apenas algumas centenas de bandos de goolantha. Um deles, que consiste de nove animais, foi coletado com sucesso e será trazido de volta para [Root.Owner.Capital.GetName]."
 country.59.name: "Uddlorans Capturados"
 country.59.desc: "A tripulação do [Root.GetName] conseguiu coletar um pequeno grupo de uddlorans da superfície gelada de [From.From.GetName]. Estes onívoros brancos e peludos se envolvem em pequenas bolas e rolam pelos campos nevados de [From.From.GetPlanetMoon] em velocidades incríveis - um deles já chegou a 80 quilômetros por hora. Isso ajudou a detectá-los, já que a passagem das suas formas rolantes lança imensas plumas de neve no ar."
 country.60.name: "Enxame Zulcor Capturado"
 country.60.desc: "Os zulcor são insetos análogos que vivem em enxames, incomuns pelo grande tamanho e pelo fato que são litóvoros e se alimentam de rochas e minerais no solo. Um dos transportes que pertence ao [Root.GetName] sofreu danos pesados quando passou sem querer por um enxame grande e diversos zulcors começaram a comer o casco da nave.\n\nA construção das instalações de contenção especiais que são necessárias para abrigar essas criaturas já começou no Museu de Exobiologia em [Root.Owner.Capital.GetName]."
 country.61.name: "Espécimes Capturados"
 country.61.desc: "Todos os espécimes solicitados pelo Museu de Exobiologia foram capturados. O museu se tornou uma instalação gigantesca, onde geradores de gravidade artificial e processadores atmosféricos são usados para simular os ambientes de mais de uma dúzia de mundos.\n\nOs visitantes estão vindo de todo o [Root.GetName] para ver suas maravilhas!"
 country.200.name: "O culto [radical_cult.GetName]"
 country.200.desc: "Há séculos, um grupo de sacerdotes radicais e seus seguidores devotos em [Root.Capital.GetName] romperam com as religiões estabelecidas para formar sua própria igreja. Estes extremistas se denominam o \"culto [radical_cult.GetName]\", e foram responsáveis por muitas atrocidades e atos de terror ao longo dos anos.\n\nApesar de terem ficado quietos nos tempos modernos, recentemente aprendemos que muitos dos seus agentes infiltraram nossas forças armadas. Estes renegados vêm desviando recursos secretamente para a construção de uma pequena frota de naves estelares em uma instalação escondida em [Root.Capital.GetName]! Quando a traição foi revelada, os cultistas subiram nas suas naves e fugiram para [hijacked_fleet_planet.GetName]."
 country.200.desc.bio: "Há séculos, uma seita de sacerdotes radicais e seus fiéis seguidores em [Root.Capital.GetName] se separaram das crenças dominantes, renunciando à tradição para formar sua própria doutrina distorcida. Autointitulados [radical_cult.GetName], ficaram conhecidos por seu fanatismo, com rituais imersos em sangue e segredo.\n\nPor anos, eles permaneceram ocultos nas sombras... mas agora, sua traição foi exposta. Descobrimos que muitos de seus agentes infiltraram-se em nossas Forças Armadas, desviando recursos para construir uma frota clandestina em uma câmara de geração secreta em [Root.Capital.GetName]! Quando sua traição foi revelada, os cultistas liberaram suas abominações; naves estelares vivas, geradas em segredo e distorcidas por sua fé corrompida. Essas formas de guerra hereges emergiram de seus berços subterrâneos, uivando para o céu antes de escapar de [hijacked_fleet_planet.GetName].\n\nO que quer que tenham se tornado, elas não são mais nossas semelhantes. Suas naves não cantam como as nossas. Elas berram."
 country.200.a: "Eles devem ser detidos!"
 country.200.b: "Podemos aprender a perdoá-los."
 country.202.name: "Nave Cultista Desativada!"
 country.202.desc: "Nossas corajosas forças espaciais habilidosamente desativaram uma nave na armada cultista! A maior parte dela está intacta, e estamos recebendo fracos sinais de vida de dentro do casco.\n\nAssim que tivermos eliminado todas as ameaças na vizinhança próxima, devemos ir a bordo para capturar sobreviventes. Eles podem nos dizer mais sobre os motivos verdadeiros do [From.Owner.GetName]."
 country.202.desc.bio: "Nossas valentes naves conseguiram incapacitar uma das abominações cultistas! A criatura está à deriva no espaço, com sua bioluminescência piscando de forma irregular e seu casco membranoso estremecendo de dor. Sinais de vida fracos e erráticos pulsam das profundezas de suas cavidades neurais. A nave não está morta. Ainda não.\n\nAssim que protegermos a área, devemos preparar uma operação de embarque. Entrar no corpo ferido da criatura será perigoso. Suas entranhas podem reagir defensivamente, e seus aglomerados neurais podem resistir. Porém, em seus últimos sussurros, podemos encontrar a verdade que buscamos. O objetivo final dos cultistas ainda é desconhecido... mas seus segredos estão escritos na carne, e nós pretendemos decifrá-los."
 country.202.a: "Prepare as cargas explosivas!"
 country.203.name: "Ação de Bordo"
 country.203.desc: "Apesar de os sobreviventes terem mostrando grande resistência, nossa equipe de bordo conseguiu capturar vários prisioneiros da nave estelar cultista desativada. A partir deles descobrimos que esta conspiração vai bem mais fundo do que suspeitamos inicialmente - os agentes do [cult_name.GetName] incluem diversos oficiais de alta patente e funcionários de alto escalão do nosso governo!\n\nPrisões em massa estão sendo feitas em [Root.Owner.Capital.GetName], e todos os bens deste culto foram apreendidos. Porém, diversas naves estelares que eles construíram em segredo permanecem desaparecidas, e os níveis mais altos da liderança do culto sumiram. Pegamos alguns fracos rastros iônicos que levam a diversos sistemas externos."
 country.203.desc.bio: "Os cultistas lutaram com uma fúria selvagem e fanática, seus gritos de agonia se misturando aos gemidos de dor de sua nave mutilada. Mas apesar de sua resistência, nossas equipes de abordagem capturaram vários prisioneiros do que restava dos destroços contorcidos e quase sem vida. O que eles revelaram é muito mais perturbador do que podíamos imaginar.\n\n[cult_name.GetName] não era apenas uma seita de radicais dissidentes, mas uma força que se infiltrou profundamente na hierarquia de nosso império. Oficiais de alta patente, comandantes de frotas e conselheiros de confiança estavam entre seus membros, desviando silenciosamente recursos e influência para concretizar seu grande projeto. Sua heresia percorreu nossos salões como uma infecção oculta, pulsando sob a superfície, invisível até agora.\n\nExpurgos em massa já estão em andamento em [Root.Owner.Capital.GetName]. Redes inteiras foram desmanteladas, bens confiscados, abomináveis formas de guerra dissolvidas em biomassa bruta. Mesmo assim, dúvidas persistem. Diversas naves biológicas geradas em segredo ainda não foram localizadas, e a liderança do culto desapareceu sem deixar vestígios.\n\nRastros de feromônios nauseantes persistem no vazio, levando a sistemas distantes e inexplorados. O trabalho deles ainda não terminou. E o nosso também não."
 country.203.a: "Temos que perseguir estes terroristas!"
 country.204.name: "Saqueadores Cultistas Encontrados"
 country.204.desc: "Avistamos naves com a bandeira do culto [radical_cult.GetName] no sistema [Root.GetStarName]. Eles carregaram as armas e estão vindo para nos interceptar!"
 country.205.desc: "Mais naves que pertencem ao culto [radical_cult.GetName] foram encontradas no sistema [Root.GetStarName]. Elas estão se aproximando em formação de ataque!"
 country.206.desc: "Mais uma frota leal ao culto [radical_cult.GetName] foi avistada no sistema [Root.GetStarName]. Porém, desta vez, há uma nave estranha com um projeto desconhecido!"
 country.207.name: "Destroços de Batalha"
 country.207.desc: "Derrotamos as forças cultistas que encontramos até agora, mas estes encontros levantaram diversas questões alarmantes. O culto [radical_cult.GetName] tem lançado muitas naves além do que poderiam ter construído secretamente em [Root.Capital.GetName], e agora eles utilizaram uma grande nave de guerra de projeto desconhecido contra nós.\n\nDe onde estas naves estão vindo? Existem mais naves de guerra iguais às que acabamos de destruir? Devemos investigar os destroços de batalha atrás de respostas."
 country.207.a: "Iniciar esforços de recuperação."
 country.207.a.tooltip: "Ativa um §SProjeto Especial§! no sistema [our_fleet_position.GetName]."
 country.208.name: "Esforços de Recuperação Completos"
 country.208.desc: "Após vasculhar os destroços deixados pela estranha nave cultista que destruímos, nossos cientistas acreditam que podem ter descoberto a fonte das naves que o culto [radical_cult.GetName] estava usando contra nós. Fragmentos de um registro de bordo mencionam algum tipo de estaleiro alienígena abandonado descoberto pelas naves cultistas fugindo de [Root.Capital.GetStarName].\n\nEles estavam usando o estaleiro automatizado para reforçar os seus números, e, agora, estão produzindo novas naves a partir de modelos alienígenas encontrados nos bancos de memória da estação! Não podemos permitir que isso continue."
 country.208.a: "Aquele estaleiro deve ser destruído!"
 country.209.name: "Estaleiro Destruído"
 country.209.desc: "O estaleiro alienígena que era utilizado pelo culto [radical_cult.GetName] em sua cruzada contra nós foi destruído! Alguns dos cultistas foram capturados quando suas cápsulas de fuga foram recuperadas pelas nossas forças, incluindo o chefe de máquinas deles. O conhecimento dele sobre a tecnologia avançada do estaleiro se mostrou ser bem valioso.\n\nInfelizmente, também aprendemos que o líder carismático do culto partiu do estaleiro há diversas semanas em sua nova nave capitânia - uma versão mais poderosa das naves alienígenas que eles produziram. A inteligência militar está trabalhando para localizar esta nave."
 country.209.a: "Ela será encontrada!"
 country.210.name: "Locais Prováveis da Nave Capitânia Cultista"
 country.210.desc: "Sondas de reconhecimento de espaço profundo pegaram emissões subespaciais fracas em um sistema estelar que bate com as assinaturas das naves alienígenas utilizadas pelo culto [radical_cult.GetName]. A nave capitânia perdida do culto é a fonte mais provável!\n\nDevemos enviar forças para vasculhar este sistema o mais rápido possível. Aquela nave e o seu comandante carismático são muito perigosos para serem deixados livres."
 country.210.a: "Prepare a frota."
 country.211.name: "Nave Capitânia Cultista"
 country.211.desc: "Então você finalmente nos encontrou. Não importa.\n\nMeus discípulos estão mais do que dispostos a entregar suas vidas pelo futuro da espécie [Root.Owner.GetSpeciesName]. §YEU§! sou este futuro, caso você não tenha percebido.\n\nQuando terminarmos de lidar com as suas forças lamentáveis, minha nave capitânia sagrada me carregará para [Root.Owner.Capital.GetName] onde finalmente purificaremos nosso mundo natal de infiéis."
 country.211.a: "Isso acaba aqui."
 country.213.name: "Nave Capitânia Desabilitada"
 country.213.desc: "Nossas forças conseguiram desabilitar a nave capitânia do culto [radical_cult.GetName]! Suas armas e motores não estão mais funcionando, mas os sistemas de suporte à vida permanecem estáveis. Devemos nos preparar para uma ação de bordo.\n\nDevido à grande quantidade de cultistas armados dentro da nave, um número significativo de tropas será necessário para capturá-la."
 country.213.a: "Aquela nave será nossa!"
 country.214.name: "Nave Capitânia Cultista Capturada"
 country.214.desc: "Após lentamente abrir caminho a cada convés, nossos fuzileiros finalmente erradicaram os últimos focos de resistência na antiga nave capitânia do culto [radical_cult.GetName]. Poucos prisioneiros foram capturados, já que muitos dos cultistas fanáticos preferiram jogar suas vidas fora em ataques suicidas fúteis. A líder do culto foi encontrada no passadiço da nave após ter se suicidado. Finalmente, parece que o culto [radical_cult.GetName] chegou ao fim.\n\nNossos engenheiros restauraram a energia aos motores da nave, e ela foi colocada em serviço na nossa frota como o [disabled_cultist_flagship.GetName]. A nave deve ser levada a um porto espacial assim que possível para reparos mais permanentes."
 country.214.desc.bio: "De convés em convés, de câmara em câmara, nossas forças abriram caminho através da carne viva e do fervor implacável. A nave capitânia dos cultistas revidou como se ela própria fosse uma adepta, seu corpo inteiro se contorcendo de agonia enquanto nossos fuzileiros abatiam os últimos defensores fanáticos.\n\nPoucos prisioneiros foram capturados. Os cultistas, parcialmente integrados à própria abominação, preferiram a morte à captura, jogando-se nos biorreatores da nave ou lutando em vão. A líder foi encontrada no que poderia ser a ponte da nave, seu corpo sem vida recostado contra uma massa pulsante de tecido neural, sua própria arma biológica voltada contra si. Com sua morte, o sonho do culto morre junto.\n\nMas a capitânia agora é nossa. Nossos engenheiros estabilizaram seus sistemas biológicos e forçaram sua massa tremulante e relutante a se submeter. A nave vive, mas foi domada e colocada a serviço como o nome de [disabled_cultist_flagship.GetName]. Devemos guiá-la a um porto espacial para reparos e estudo.\n\nMesmo na morte, a criação dos cultistas ainda pode nos servir."
 country.225.name: "Nave Capitânia Cultista Transferida"
 country.225.desc: "Um ex-membro do culto [radical_cult.GetName], agora comprometido com a nossa causa, convenceu seus antigos camaradas a abandonar seu fanatismo e se juntar a nós. Sua capitânia agora orbita [root.capital_scope.GetName], aguardando a inspeção antes de sua introdução formal à nossa Marinha."
 country.225.tt: "Torna-se o novo dono da §Y$NAME_Dawn_of_Creation$§!."
 country.17.name: "Frota de Lixeiros Destruída"
 country.17.desc: "Drones espiões no sistema [salvager_system.GetName] confirmaram que alguém destruiu a frota de lixeiros que havia capturado nossa sonda espacial perdida. Felizmente, parece que a própria sonda foi destruída junto com os lixeiros durante a batalha, então não há risco de dados sensíveis caírem nas mãos erradas."
 country.19.name: "Anomalia Subespacial Destruída"
 country.19.desc: "Sensores de rastreamento de espaço profundo confirmam que alguém destruiu a anomalia subespacial que estava guardando nossa sonda espacial perdida no sistema [anomaly_system.GetName]. A própria sonda também foi destruída durante a batalha, então não precisamos mais nos preocupar com os dados sensíveis que ela possuía."
 country.21.name: "Sonda Modificada Destruída"
 country.21.desc: "Scanners de longa distância confirmaram que alguém destruiu nossa sonda modificada no sistema [modified_probe_system.GetName]. Felizmente, nada sobrou dos seus bancos de memória após a batalha, então não existe chance de potências externas terem adquirido os dados sensíveis que estavam contidos nela."
 country.218.name: "Nave Cultista Desativada!"
 country.218.desc: "Uma das naves que pertencia à armada cultista foi violentamente desativada por uma força externa! A maior parte dela está intacta, e estamos recebendo fracos sinais de vida de dentro do casco.\n\nAssim que tenhamos eliminado todas as ameaças na vizinhança próxima, devemos ir a bordo para capturar sobreviventes. Eles podem nos dizer mais sobre os motivos verdadeiros do [From.Owner.GetName]."
 country.219.name: "Frota Cultista Destruída"
 country.219.desc: "A frota cultista que operava no sistema [marauder_system.GetName] foi destruída em batalha."
 country.221.desc: "Alguém destruiu o estaleiro alienígena que era utilizado pelo culto [radical_cult.GetName] em sua cruzada contra nós. Relatórios preliminares indicam que as forças cultistas foram minuciosamente eliminadas, mas também recebemos informações de que a líder carismática do culto deixou o estaleiro em sua nova nave capitânia, momentos antes de a batalha ter iniciado.\n\nEla ainda está em algum lugar da galáxia. A inteligência militar está trabalhando para localizar a nave capitânia dela."
 country.223.name: "Nave Capitânia Cultista Destruída"
 country.223.desc: "Alguém destruiu recentemente a capitânia dos cultistas após uma batalha no sistema [flagship_system.GetName]. Nossos comandantes lamentaram não terem sido capazes de desferir o golpe final, mas pelo menos isso significa o fim desse culto maligno e sua campanha de terror."
 country.250.name: "A Caça pelo Jacinto"
 country.250.desc: "Não encontramos rastros das quatro naves arcas que passaram pelo buraco de minhoca antes do Crisântemo chegar em [Root.Capital.GetName]. Uma nave, o Jacinto, estava prevista para fazer a passagem logo após a nossa, e os sensores de longa distância do Crisântemo relataram um breve pico de energia do buraco de minhoca logo após ele se desestabilizar e desaparecer.\n\nAssumindo que o Jacinto tenha sobrevivido à passagem e chegado até nossa vizinhança galáctica, a nave arca ainda não conseguiu estabelecer contato conosco. Pode ser uma boa ideia vasculhar sistemas próximos por sinais de sua presença."
 country.250.a: "De fato. Faça isso."
 country.250.b: "Uma caçada selvagem que não podemos custear."
 country.251.name: "Sistema Inspecionado"
 country.251.desc: "O [Root.GetName] relata que não há sinais do Jacinto no sistema [From.GetName] Devemos continuar nossa busca em outro lugar."
 country.251.a: "Continue a busca."
 country.252.desc: "Análises do [Root.GetName] revelaram que não há vestígios do Jacinto em [From.GetName]. Talvez teremos sorte em um dos outros sistemas."
 country.252.a: "Ela tem que estar em algum lugar."
 country.253.desc: "O [Root.GetName] conseguiu isolar um rastro iônico residual no sistema [From.GetName] que é idêntico àquele que foi produzido pelos motores do Crisântemo. Ele deve ter sua origem no Jacinto!\n\nApesar de o fraco rastro iônico ter mais de 100 anos de existência, [Root.GetLeaderName], da equipe científica, conseguiu rastreá-lo em uma trajetória externa em direção a uma estrela ainda não mapeada. Colocamos as suas coordenadas no Registro de Situações."
 country.260.desc: "Os dados de pesquisa adquiridos recentemente no sistema [surveyed_planets_system.GetName] não revelaram rastros do Jacinto. Talvez teremos sorte em um dos outros sistemas."
 country.261.desc: "Os dados da inspeção adquiridos recentemente mostram marcas de um resíduo iônico no sistema [surveyed_planets_system.GetName]. Ele é idêntico ao que foi produzido pelos motores do Crisântemo. Ele deve ter sua origem no Jacinto!\n\nApesar de o fraco rastro iônico ter mais de 100 anos de existência, conseguimos rastreá-lo em uma trajetória externa em direção a uma estrela ainda não mapeada. Colocamos as suas coordenadas no Registro de Situações."
 country.253.a: "O Jacinto deve estar lá."
 country.254.name: "Jacinto Encontrado"
 country.254.desc: "Localizamos o Jacinto! A grande nave arca está estacionada em uma órbita estável sobre [hyacinth_planet.GetName]. Nenhuma assinatura de energia foi detectada dentro do seu casco, e não estamos vendo sinais de alerta. Uma equipe de abordagem armada deve ser enviada para investigar o interior da nave."
 country.254.a: "Preparem-se."
 country.255.name: "A Bordo do Jacinto"
 country.255.desc: "Nossa equipe de abordagem do Jacinto retornou com um relatório macabro. Foram encontrados restos humanos condizentes com a quantia inteira de 250 mil colonizadores. A maioria parece ter morrido de fome, mas também há sinais de tiros de armas pequenas e canibalismo...\n\nConseguimos recuperar o registro do comandante dos arquivos do passadiço do Jacinto."
 country.255.a: "Traga-o para cá."
 country.256.name: "Arquivos da Nave"
 country.256.desc: "NAVE ARCA JACINTO\nISA-05\nINICIATIVA ULISSES DAS NAÇÕES UNIDAS\nLivro de bordo de oficiais: Comandante Ronald F. Gundersen\n\nAcessando dados... corrupção encontrada. Tentando reparos...\nQuatro entradas de registro recuperadas com sucesso."
 country.256.a: "Registro I (Data da Missão 345.5)"
 country.256.a.response: "Diário do Comandante, Data da Missão 345.5.\n\nSaímos da terra há dois meses e estamos a caminho. Tudo tem estado tranquilo até agora. Os colonizadores estão dormindo e o Doutor Colbeck relata sinais vitais fortes em todos.\n\nNossa jornada nos levou para além dos planetas externos e agora estamos nos aproximando da Nuvem Oort. Logo chegaremos ao fenômeno subespacial - este suposto \"buraco de minhoca\" - pelo qual outras naves já entraram. Fiz minhas ressalvas com relação à viagem por buraco de minhoca em entradas de registro anteriores, mas logo saberemos se isso funciona..."
 country.256.b: "Registro II (Data da Missão 387.2)"
 country.256.b.response: "Nós... nós realmente conseguimos! A astrogação ainda está tentando definir nossa posição, mas a julgar pelas estrelas lá fora, acho que podemos dizer que não estamos mais no Kansas, Dorothy. infelizmente, o Jacinto sofreu uma grande avaria de engenharia que resultou em uma perda de energia completa, e estamos atualmente usando as baterias.\n\nColbeck me disse que talvez seja necessário acordar os colonizadores. Estou indo para a Engenharia para saber por que Maggie está demorando tanto para fazer o reator funcionar de novo. Espero que possamos prosseguir logo, e iniciar a busca pelos colonizadores do Crisântemo."
 country.256.c: "Registro III (Data da Missão 422.7)"
 country.256.c.response: "A situação vai de mal a pior. Não há mais qualquer esperança realista de reiniciar o reator, e o resto das reservas de energia do Jacinto foras gastas em nossa tentativa de chegar a esse maldito sistema. Esperávamos encontrar algum lugar habitável para pousá-lo... mas sem sorte.\n\nTemos bateria o suficiente para manter o suporte a vida funcionando por alguns anos, mas com 250 mil colonizadores pra cima e pra baixo, os suprimentos de comida do Jacinto não durarão um mês. Convoquei uma reunião com todos os chefes de departamento. Nós... nós precisamos de algum tipo de plano..."
 country.256.d: "Registro IV (Data da Missão 459.9)"
 country.256.d.response: "Este provavelmente será meu registro final. Minha tripulação do passadiço está morta ou desaparecida, e um grupo de colonizadores está tentando forçar o caminho até aqui enquanto falo. Nossos suprimentos principais de comida acabaram há semanas, e há... há relatos de canibalismo.\n\nEu mantive uma pequena quantidade de comida escondida para a tripulação, pra manter essa garota funcionando por mais um tempo... esperando por um milagre. Quando os colonizadores sobreviventes descobriram, eles...\n\nEles arrombaram as portas. Para trás, malditos! Mantenham distância! Eu sou o comandante desta nave, e ai de mim se eu deixar vocês me abaterem como se fosse um... AGGGHHggghh..."
 country.256.e: "Sair"
 country.256.e.response: "NAVE ARCA JACINTO\nISA-05\nINICIATIVA ULISSES DAS NAÇÕES UNIDAS\n\nDesabilitando interface de usuário."
 country.257.name: "Conclusão Final"
 country.257.desc: "Agora temos uma imagem clara do destino cruel que se abateu sobre o Jacinto, sua tripulação e os colonizadores a bordo. Se as circunstâncias fossem diferentes, poderia ter sido o Crisântemo a deriva sobre [hyacinth_planet.GetName] como um túmulo silencioso. Uma lembrança sombria dos perigos que a humanidade enfrenta em um universo frio e indiferente.\n\nO Jacinto será rebocado para a órbita de [Root.Capital.GetName] e convertido em museu, assim que os restos humanos tiverem sido retirados. Apesar de sua história trágica, a nave arca é quase idêntica àquela que trouxe nossos ancestrais da Terra até aqui, e nossos sociólogos podem aprender muito com ela."
 country.257.a: "Talvez isso sirva para algo de bom."
 #############################
 #Progress Events
 #############################
 progress.1.name: "Sistema [home_system.GetName] Totalmente Inspecionado"
 progress.1.desc: "Por milhares de anos, os astrônomos em [Root.Capital.GetName] têm utilizado telescópios para observar as maravilhas dos planetas do nosso sistema natal. Planetários mecânicos complexos foram construídos pelos nossos ancestrais para simular as órbitas dos planetas, utilizando modelos impressionantemente precisos do sistema [home_system.GetName].\n\nHoje, nossa civilização chegou a outro marco histórico, com a inspeção do último corpo planetário não explorado em nosso sistema solar. As fronteiras do desconhecido recuaram novamente."
 progress.1.a: "A história está sendo feita!"
 progress.2.name: "A Descoberta da Vida Alienígena"
 progress.2.desc: "A [Root.GetName] fez uma descoberta incrível em [From.GetName]: o mundo está fervilhando com vida alienígena! Pela primeira vez na história, encontramos formas de vida que não se originaram em [Root.Owner.GetHomeWorldName].\n\nEsta descoberta incrível silenciou aqueles que acreditavam que estávamos sozinhos no universo. Apesar de nenhuma das criaturas encontradas em [From.GetName] ser senciente, é apenas uma questão de tempo até encontrarmos seres que o são."
 progress.2.desc.mach: "O [Root.GetName] fez uma descoberta inesperada em [From.GetName] - o [From.GetPlanetMoon] está cheio de formas de vida alienígena! Pela primeira vez na história, encontramos vida orgânica que não se originou em [Root.Owner.GetHomeWorldName].\n\nApesar de nenhuma das criaturas alienígenas encontradas em [From.GetName] serem sapientes, novos prognósticos recalibrados sugerem uma alta probabilidade de orgânicos inteligentes na galáxia."
 progress.2.desc.assim: "[Root.GetName] informou ter feito uma descoberta importante em [From.GetName]: uma miríade de formas de vida orgânicas alienígenas foi encontrada! Apesar de nenhuma delas ter evoluído até um estágio desejável para assimilação, a probabilidade de encontrar orgânicos sapientes além de [Root.Owner.Capital.GetName] agora é mais promissora do que nunca."
 progress.2.desc.term: "Estamos nos preparando para este dia. O [Root.GetName] confirmou a existência de alienígenas orgânicos em [From.GetName]. Apesar de nenhuma das formas de vida encontradas possuir funções de racionalização superiores, não conseguimos impedir a agora aumentada probabilidade de uma galáxia infestada de orgânicos sapientes."
 progress.2.desc.serv: "Uma descoberta histórica foi feita pelo [Root.GetName] em [From.GetName] - o [From.GetPlanetMoon] está cheio de orgânicos alienígenas! Apesar de nenhuma das novas formas de vida parecer possuir a auto-consciência necessária para apreciar o mimo [Root.Owner.GetAdj], provavelmente é só uma questão de tempo antes de encontrarmos seres que possuem!"
 progress.2.desc.droid: "A [Root.GetName] fez uma descoberta incrível em [From.GetName]: o mundo está repleto de criaturas alienígenas orgânicas! Pela primeira vez na história, encontramos formas de vida que não se originaram em [Root.Owner.GetHomeWorldName].\n\nEsta descoberta incrível silenciou aqueles que acreditavam que estávamos sozinhos no universo. Apesar de nenhuma das criaturas encontradas em [From.GetName] serem sencientes, é apenas uma questão de tempo até encontrarmos seres sapientes, sejam eles biológicos ou mecânicos."
 progress.2.desc.evopred: "Vida. A gloriosa vida evoluída está lá fora, pronta para servir de amostra em nome do progresso. Há muito tempo terminamos de coletar todas as amostras interessantes em [Owner.GetHomeWorldName] e não esperávamos ter acesso a mais singularidades genéticas tão pouco tempo depois de deixarmos nosso lar."
 progress.2.a: "Talvez não estejamos sozinhos."
 progress.2.a.assim: "Seremos um."
 progress.2.a.mech: "Entendido."
 progress.2.a.term: "Estamos prontos para eles."
 progress.2.a.serv: "Maravilhoso! Prepare as cestas de presentes."
 progress.2.a.evopred: "Que notícias deliciosas!"
 progress.3.name: "A Primeira Colônia [Root.Owner.GetSpeciesName]"
 progress.3.desc_end: "\n\nA nave foi convertida em um §Y$building_colony_shelter$§! para atuar como base de operações, e seu reator nuclear foi removido para servir de fonte de energia temporária para a colônia. Tendas repletas de materiais de construção e abrigos pré-fabricados surgem ao redor do casco da nave enquanto os colonizadores desembarcam, estabelecendo a primeira cidade do povo [Root.Owner.GetSpeciesName] em um mundo alienígena."
 progress.3.desc_01: "Nossa nave colonial aterrissou gentilmente no delta de um rio amplo em um dos continentes de §Y[Root.GetName]§!. Essa floresta temperada fornecerá abrigo e fácil acesso a matérias-primas.$progress.3.desc_end$"
 progress.3.desc_02: "Nossa nave colonial fez uma aterrissagem suave nas águas do oceano mundial de §Y[Root.GetName]§!, próximo às margens de um grande arquipélago. Essas ilhas férteis fornecem um ambiente adequado para o cultivo de alimentos.$progress.3.desc_end$"
 progress.3.desc_03: "Nossa nave colonial aterrissou gentilmente nas cercanias de um grande oásis em §Y[Root.GetName]§!, ao sopé de uma montanha, encontrando abrigo contra os ventos do deserto e fácil acesso à água.$progress.3.desc_end$"
 progress.3.desc_04: "Nossa nave colonial encontrou uma clareira entre as densas selvas de §Y[Root.GetName]§! e fez sua aterrissagem. Drones sentinelas foram posicionados para afugentar possíveis predadores.$progress.3.desc_end$"
 progress.3.desc_05: "Nossa nave colonial aterrissou gentilmente no topo de um grande planalto, próximo ao equador de §Y[Root.GetName]§!. Os rios que correm nos desfiladeiros abaixo fornecem acesso fácil à água potável.$progress.3.desc_end$"
 progress.3.desc_06: "Nossa nave colonial aterrissou gentilmente em uma ampla estepe descampada de §Y[Root.GetName]§!, instalando-se atrás de um grande desfiladeiro para se proteger dos ventos gelados.$progress.3.desc_end$"
 progress.3.desc_07: "Nossa nave colonial aterrissou gentilmente em um vale coberto de neve em §Y[Root.GetName]§!. As cordilheiras próximas oferecem proteção contra os elementos e uma fonte segura de água.$progress.3.desc_end$"
 progress.3.desc_10: "Nossa nave colonial aterrissou em §Y[Root.GetName]§!. Milhares de unidades de trabalho surgiram dos porões gigantescos de carga da nave para construir um §Y$building_deployment_post$§! inicial para a expansão do assentamento. Esforços para catalogar os depósitos de recursos na superfície continuam, e toda a vida selvagem agressiva na área ao redor do local de pouso foi pacificada.\n\nAgora estamos prontos para iniciar a produção em massa de [Root.Owner.GetSpeciesNamePlural] adicionais neste mundo conforme os recursos permitirem. Nossa primeira colônia é um sucesso."
 progress.3.desc_11_droids: "Nossa nave colonial aterrissou na superfície de §Y[Root.GetName]§!. O local de pouso foi escolhido pelo seu clima ameno e depósitos de recursos acessíveis.\n\nA nave foi convertida em um §Y$building_colony_shelter$§! para atuar como base de operações, e seu reator nuclear foi removido para servir de fonte de energia temporária para a colônia. Centenas de abrigos pré-fabricados surgem ao redor do casco da nave enquanto nossos droides desembarcam, estabelecendo a primeira cidade do povo [Root.Owner.GetSpeciesName] em um mundo alienígena."
 progress.3.desc_11_hive: "Nossa nave colonial aterrissou na superfície de §Y[Root.GetName]§!. O local de pouso foi escolhido pelo seu clima ameno e depósitos de recursos acessíveis.\n\nA nave foi convertida em um §Y$building_colony_shelter$§!, e ao redor da sua casca, criamos abrigos a partir dos materiais disponíveis. Isso marca o nascimento de uma nova colmeia em um mundo alienígena."
 progress.3.materialist: "O progresso científico impulsionará nossa colônia."
 progress.3.spiritualist: "Nossa colônia é a prova do nosso propósito superior."
 progress.3.militarist: "A força e a vigilância protegerão nosso futuro."
 progress.3.pacifist: "Nossa colônia prosperará em paz e harmonia."
 progress.3.egalitarian: "Assim como foi em nosso mundo natal, a igualdade guiará esta colônia."
 progress.3.xenophile: "Fortaleceremos nossa colônia ao abraçar a diversidade."
 progress.3.xenophobe: "Nossa colônia permanecerá pura e protegida."
 progress.3.authoritarian: "A ordem e a hierarquia guiarão nossa colônia."
 progress.3.gestalt_consciousness_hive: "A colônia cresce em sintonia com a Colmeia."
 progress.3.gestalt_consciousness_machine: "A colônia operará com perfeita eficiência."
 progress.3.b.evopred: "Um novo banquete para degustar."
 progress.4.name: "Primeiro Encontro Alienígena"
 progress.4.desc_01: "A notícia que encontramos vida alienígena inteligente pela primeira vez foi recebida de maneira distinta pela nossa população. Isso confirma o que há muito suspeitávamos - não estamos sozinhos nesta galáxia. Cada espécie alienígena nova que encontramos representa uma oportunidade e uma ameaça. Devemos ser cautelosos.\n\nEstes xenos em especial possuem um nível de tecnologia parecido com o nosso, o que indica que chegamos ao espaço quase juntos."
 progress.4.desc_02: "A notícia de que encontramos vida alienígena inteligente pela primeira vez está se espalhando como fogo pelas ruas de [Root.GetName]. Nossos cidadãos estão fascinados por estes seres, e a mídia está cheia de relatórios e especulações sobre a sua cultura e sociedade. A revelação de que não estamos sozinhos nesta galáxia foi recebida em sua maioria com comemorações em [Root.Capital.GetName].\n\nAssim como nós, os alienígenas parecem ter chegado recentemente ao palco galático e o nível de tecnologia deles é parecido com o nosso."
 progress.4.desc_03: "A notícia de que encontramos vida alienígena inteligente pela primeira vez abalou nossa sociedade inteiramente. Imagens vazadas dessas criaturas bizarras estão se espalhando pelos canais de mídia ao redor de [Root.GetName], e muitos cidadãos foram tomados pelo pânico. Tumultos ocorreram em diversas cidades em [Root.Capital.GetName].\n\nOs estranhos xenos parecem ter atingido um nível de tecnologia próximo ao nosso, e claramente são espaciais. Se eles veem nossa espécie com medo, ódio ou indiferença fria, ninguém sabe."
 progress.4.a: "Isso muda tudo."
 progress.4.b: "Isso é uma ocasião incrível."
 progress.4.c: "Temos que pensar no pior."
 progress.5.name: "Civilização em Desenvolvimento Encontrada"
 progress.5.desc_01: "A notícia de que fizemos contato formalmente com uma civilização inteligente, embora subdesenvolvida, causou reações variadas na população. Isso confirmou nossa antiga crença de que existem alienígenas que não fazem viagens espaciais em nossa galáxia e que podem nunca ter considerado explorar além do próprio planeta.\n\nCada espécie que encontramos representa tanto uma oportunidade quanto uma ameaça. Devemos tomar cuidado. O nível tecnológico desses alienígenas específicos está abaixo dos nossos padrões. Eles ainda não desenvolveram o voo espacial. Precisamos decidir a melhor maneira de interagir com eles daqui em diante."
 progress.5.desc_02: "A notícia de que fizemos contato formalmente com uma civilização inteligente, embora subdesenvolvida, está se espalhando rápido por [Root.GetName]. Nossos cidadãos estão fascinados por essa civilização, e a mídia está cheia de notícias e especulação sobre sua cultura e sociedade. A confirmação de que há alienígenas que não fazem viagens espaciais em nossa galáxia e que podem nunca ter considerado explorar além do próprio planeta foi bastante comemorada em [Root.Capital.GetName].\n\nNosso nível de tecnologia é muito superior ao deles. Eles ainda não desenvolveram o voo espacial. Apesar disso, se os estudarmos, provavelmente vamos aprender muito."
 progress.5.desc_03: "A notícia de que fizemos contato formalmente com uma civilização inteligente, embora subdesenvolvida, abalou a nossa sociedade. Imagens vazadas das criaturas bizarras que encontramos estão se espalhando pelos canais de mídia de [Root.GetName], e muitos cidadãos foram tomados pelo pânico. Tumultos ocorreram em diversas cidades em [Root.Capital.GetName].\n\nOs alienígenas têm um nível tecnológico bem abaixo do nosso. Eles ainda não desenvolveram o voo espacial. Pelo nosso bem, vamos rezar para que isso não aconteça."
 progress.5.b: "Fascinante."
 progress.5.c: "De fato."
 progress.6.desc_01: "A notícia de que encontramos vida alienígena inteligente pela primeira vez foi recebida de maneira distinta pela nossa população. Isso confirma o que há muito suspeitávamos - não estamos sozinhos nesta galáxia. Cada espécie alienígena nova que encontramos representa uma oportunidade e uma ameaça. Devemos ser cautelosos.\n\nEstes xenos em especial parecem estar no palco galático há algum tempo - o império deles provavelmente possui milhares de anos de idade, e a tecnologia deles está bem além da nossa. Devemos ser cuidadosos ao lidar com eles."
 progress.6.desc_02: "A notícia que encontramos vida alienígena inteligente pela primeira vez está se espalhando como fogo pelas ruas de [Root.GetName]. Nossos cidadãos estão fascinados por estes seres, e a mídia está cheia de relatórios e especulações sobre a sua cultura e sociedade. A revelação de que não estamos sozinhos nesta galáxia foi recebida em sua maioria com comemorações em [Root.Capital.GetName].\n\nO império do qual estes alienígenas fazem parte parece ser muito antigo, e o nível de tecnologia deles é muito além do nosso.\" Sem dúvida existe muito que eles podem nos ensinar."
 progress.6.desc_03: "A notícia que encontramos vida alienígena inteligente pela primeira vez abalou nossa sociedade inteiramente. Imagens vazadas dessas criaturas bizarras estão se espalhando pelos canais de mídia ao redor de [Root.GetName], e muitos cidadãos foram tomados pelo pânico. Tumultos ocorreram em diversas cidades em [Root.Capital.GetName].\n\nOs estranhos xenos parecem ter atingido um nível de tecnologia muito além do nosso, e parecem estar no espaço por milhares de anos - talvez até mais. Felizmente para nós, o tipo deles parece ser uma espécie decrépita e estagnante."
 progress.6.b: "A sabedoria deles deve ser grande."
 progress.6.c: "A idade deles acabou. A hora dos [Root.Species.GetName] chegou."
 progress.7.name: "Missão de Inspeção"
 progress.7.desc: "O [Root.GetName], nossa primeira Nave Científica, completou os testes espaciais e agora está plenamente operacional. [Root.GetLeaderName], da equipe científica, assumiu o comando e recomenda uma inspeção completa do nosso sistema natal.\n\nColocamos os detalhes desta missão no §SRegistro de Situações§! para referência futura."
 progress.7.a: "Muito bem."
 progress.8.name: "Ponto de Apoio"
 progress.8.desc: "Tendo explorado o nosso sistema natal, chegou a hora de nossa espécie se expandir além de [Root.Capital.GetName]. Devemos inspecionar os sistemas estelares vizinhos em busca de um mundo adequado onde possamos estabelecer nossa primeira colônia.\n\nComo foi antes, uma entrada foi adicionada ao §SRegistro de Situações§!."
 progress.8.a: "Que comece a busca."
 #First contact with another empire - Payback origin version
 progress.9.name: "Segundo Encontro com os Alienígenas"
 progress.9.desc.start: "Nós já sabíamos que não estávamos sozinhos no universo, mas achamos perturbador nosso segundo contato com outra civilização que viaja pelo espaço."
 progress.9.desc.default: "Assim como nós, os alienígenas parecem ter chegado recentemente ao cenário galáctico, e o nível tecnológico deles é parecido com o nosso."
 progress.9.desc.preftl: "Nosso desenvolvimento tecnológico é muito superior ao destes alienígenas. Eles ainda não dominam o voo espacial."
 progress.9.desc.fallen: "A civilização criada por estes alienígenas parece ser bem antiga, e o nível tecnológico deles está muito acima do nosso."
 progress.9.desc.msi: "Nós sabíamos que encontraríamos nosso ex-mestre de novo. Só não esperávamos que fosse tão rápido."
 progress.9.desc.friendly_friendly: "As intenções deles parecem bem mais benignas do que as dos nossos ex-mestres. Talvez tenhamos tido azar com o nosso primeiro encontro alienígena. Afinal, deve haver bondade na galáxia."
 progress.9.desc.friendly_mean: "Eles são tão diferentes dos nossos ex-mestres, mesmo assim têm o mesmo comportamento reprovável. Isso nos faz pensar se todas as outras civilizações na galáxia estão cheias de ódio e más intenções. Acho que simplesmente não há como fazermos amizades."
 progress.9.desc.mean_friendly: "Eles são muito diferentes de nós, mas também muito amigáveis. Será que isso é um sinal de que existem xenos bons por aí? Talvez haja cortesia entre as estrelas afinal."
 progress.9.desc.mean_mean: "Realmente não existem xenos bons no cosmos. Foi tolice da nossa parte pensar que sim!"
 progress.9.desc.msi2: "Será que um dia vamos nos livrar das garras deles?"
 progress.4.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltnormal$"
 progress.4.d: "Eles são... diferentes."
 progress.4.e: "Estes dados devem ser analisados."
 progress.4.f: "Presa..."
 progress.4.g: "Reunindo dados táticos..."
 progress.5.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltprimitives$"
 progress.6.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltfallen$"
 progress.4.gestaltintro: "Nossos modelos teóricos sugerem há muito tempo a existência de outras civilizações inteligentes em nossa galáxia. Agora esta teoria foi confirmada."
 progress.4.gestaltnormal: "A entidade política alienígena que encontramos possui um nível de tecnologia parecido com o nosso, o que indica que chegamos ao espaço quase juntos."
 progress.4.gestaltprimitives: "A entidade política alienígena que encontramos ainda não inventou o voo espacial. Precisamos determinar a melhor forma de lidar com esses [GetPreFTLLowerPlural&x]."
 progress.4.gestaltfallen: "A entidade política alienígena que encontramos parece ser antiga, possuindo uma tecnologia muito mais avançada que a nossa. Recomendamos cuidado."
 #############################
 #Pirate Events
 #############################
 pirate.1.name: "O Nascimento da Pirataria Espacial"
 pirate.1.desc_01: "Conforme o comércio interestelar entre nossos sistemas continuou a crescer, um grande grupo de criminosos infiéis de [Root.Capital.GetName] ilegalmente converteu diversas naves estelares civis em armas de guerra. Esses hereges começaram a se chamar de \"§S[pirate_band.GetName]§!\" e são os responsáveis por diversos ataques contra nossas rotas comerciais vulneráveis no sistema §S[pirate_system.GetName]§!.\n\nNão podemos permitir que suas atividades profanas continuem!"
 pirate.1.desc_02: "A Inteligência Naval relata diversos ataques em naves civis no nosso espaço nos últimos meses. Os criminosos parecem ser os desertores e outros elementos renegados de [Root.Capital.GetName].\n\nEstes criminosos montaram uma frota espacial improvisada, feita de cascos civis altamente modificados, e estão atacando nossas rotas comerciais vulneráveis no sistema §H[pirate_system.GetName]§!. Agora eles se chamam de \"§S[pirate_band.GetName]§!.\" Apesar de brutas, as naves deles claramente são uma ameaça que não pode ser ignorada."
 pirate.1.desc_03: "Certos elementos irracionais e criminosos da nossa sociedade deixaram [Root.Capital.GetName] para buscar uma vida de fora-da-lei nos confins do espaço. Em uma demonstração surpreendente de engenhosidade, esses criminosos modificaram e armaram fortemente várias naves estelares civis.\n\nNossas rotas de comércio vulneráveis no sistema §H[pirate_system.GetName]§! estão sendo atacadas por esta frota estelar improvisada, que se identifica somente como \"§S[pirate_band.GetName]§!.\" Uma resposta imediata é necessária."
 pirate.1.desc_04: "Relatórios alarmantes estão chegando de alguns de nossos comerciantes. Desde que desenvolvemos a viagem espacial, grupos excluídos violentos em [Root.Capital.GetName] partiram do nosso mundo natal em quantidades crescentes, desprezando os métodos pacíficos de nossa sociedade.\n\nEstes indivíduos perdidos referem-se a si mesmos como \"§S[pirate_band.GetName]§!\" e converteram diversas naves civis em naves de guerra. Vivendo como piratas, eles agora atacam nossas rotas comerciais vulneráveis no sistema §H[pirate_system.GetName]§! e seus ataques deliberados levaram a muitas mortes. Medidas drásticas são necessárias para proteger o nosso povo."
 pirate.1.desc_05: "Rebeldes e dissidentes fugindo de [Root.Capital.GetName] fundaram uma frota espacial fora-da-lei ao modificar várias naves civis em naves de guerra. Se intitulando os \"§S[pirate_band.GetName]§!\", estes terroristas estão espalhando o caos e o medo pelas nossas rotas comerciais vulneráveis no sistema §H[pirate_system.GetName]§!.\n\nSuas vidas foram consideradas perdidas pela enormidade dos seus crimes. A ordem deve ser restaurada a qualquer custo."
 pirate.1.desc_06: "Elementos parasíticos sempre se dirigem a novos mercados, buscando receber lucros às custas daqueles que fazem negócios honestos - no espaço não foi diferente. Diversas organizações criminais do submundo em [Root.Capital.GetName] expandiram suas operações para o espaço ao converter uma pequena frota de cargueiros civis em naves de guerra.\n\nOs fora-da-lei se chamam \"§S[pirate_band.GetName]§!\" e suas naves começaram a ameaçar as rotas comerciais vulneráveis no sistema §H[pirate_system.GetName]§!. Temos que agir rapidamente, antes que isso fuja do controle."
 pirate.1.desc_07: "Conforme as viagens civis ao espaço se tornam mais comuns, várias organizações criminosas poderosas em [Root.Capital.GetName] sentiram uma oportunidade de expandir os seus negócios. Elas converteram vários cargueiros civis em naves de guerra improvisadas, com as quais atacam rotas de comércio civis em busca de grana.\n\nSabemos que se chamam \"§S[pirate_band.GetName]§!\" e que atacaram diversas vezes nossa rota comercial vulnerável no sistema §H[pirate_system.GetName]§!. Todos os esforços devem ser feitos para levar justiça a esses criminosos."
 pirate.2.a: "Os fiéis prevalecerão."
 pirate.2.b: "Alerte todos os comandos. Lançar a frota."
 pirate.2.c: "Cuidaremos destes foras da lei."
 pirate.2.d: "Somos melhores que isso."
 pirate.2.e: "Piratas. Não precisamos daquela escória."
 pirate.2.f: "O comércio precisa fluir."
 pirate.2.g: "Levaremos a justiça até eles."
 pirate.2.h: "Eles devem ser trazidos de volta."
 pirate.2.i: "Malditos piratas..."
 pirate.5.name: "Piratas Espaciais"
 pirate.5.desc: "As naves que encontramos em certos sistemas definitivamente são capazes de receber e transmitir protocolos de comunicação padrão.\n\nIndicadores visuais mostram que sua cultura é em grande parte espacial, e alguns fenótipos observados entre eles não foram encontrados em nenhuma civilização planetária conhecida.\n\nInfelizmente, suas tripulações estão totalmente desinteressadas no discurso civil. O pouco que conseguimos observar ao interceptar comunicações intra-frotas indicam que eles subsistem primariamente na pirataria, recrutando de vez em quando elementos indesejados de civilizações espaciais à sua causa."
 pirate.5.a: "Deplorável."
 pirate.10.name: "O Abrigo Pirata"
 pirate.10.desc.nobirth: "O [Root.GetName] relata que a frota encontrou uma presença pirata significativa no sistema [From.GetName].\n\nA julgar pelas análises preliminares das naves imensas e das estações que as abrigavam, isto é um porto pirata histórico. Ele provavelmente esteve em operação ininterrupta desde qualquer era antiga quando estes saqueadores surgiram pela primeira vez."
 pirate.10.desc.birth: "O [Root.GetName] relata que a frota encontrou um hub pirata no sistema [From.GetName]. Isto é provavelmente a fonte da influência corruptora que transformou alguns dos elementos criminosos e rejeitados do [Root.Owner.GetName] em saqueadores violentos.\n\nA julgar pelas suas naves gigantescas, deformadas e visivelmente envelhecidas, estes piratas provavelmente são os restos de alguma era galática passada - possivelmente descendentes de corsários de uma guerra antiga, que se transformaram em piratas após a destruição de inimigos e aliados."
 pirate.10.a.nobirth: "A pirataria é uma ameaça indiscriminada."
 pirate.10.a.birth: "Atacaremos o núcleo deste mal."
 pirate.15.name: "Abrigo Pirata Destruído"
 pirate.15.desc: "[killer_fleet.GetName] relatou que os velhos galeões piratas no sistema [killer_fleet.solar_system.GetName] foram destruídos. Exceto por alguns elementos em sistemas próximos, a pirataria galáctica ficou no passado... por enquanto.\n\nConseguimos recuperar uma grande quantidade de tesouros saqueados da sala-forte dos galeões e colocamos o espólio imediatamente em nossos próprios cofres."
 pirate.15.desc2: "[killer_fleet.GetName] relatou que os velhos galeões piratas no sistema [killer_fleet.solar_system.GetName] foram destruídos. Exceto por alguns elementos em sistemas próximos, a pirataria galáctica ficou no passado... por enquanto.\n\nConseguimos recuperar uma grande quantidade de tesouros saqueados da sala-forte dos galeões, incluindo um antigo bloco de dados que, impressionantemente, parece oferecer novas descobertas sobre como o funcionamento dos misteriosos Portões-L."
 pirate.25.name: "Estação Pirata Atacada"
 pirate.25.desc: "O [From.From.GetName] destruiu uma estação pirata no sistema [From.From.GetStarName], e recuperou seu módulo cofre."
 #############################
 #Pretender Events
 #############################
 pretender.1.name: "[From.GetRegnalName] Morre Sem Herdeiro"
 pretender.1.desc_01: "[From.GetRegnalName] faleceu, e sete dias de luto foram anunciados em [Root.Capital.GetName]. Infelizmente, não havia herdeiro declarado, e duas reivindicações ao trono separadas foram feitas.\n\nAquele que possuía a reivindicação mais forte foi coroado [Root.GetRulerTitle] sob o nome [Root.GetRulerName], mas isso pouco adiantou para resolver a questão."
 pretender.1.desc_02: "[From.GetRegnalName] transcendeu este reino da existência e iniciou a jornada em direção ao próximo. Infelizmente, os Espíritos ainda não acharam digno nos abençoar com sinais e portentos suficientes para identificarmos de maneira conclusiva um sucessor.\n\nApós um acalorado debate, [Root.GetRulerName] foi coroado como o próximo [Root.GetRulerTitle] mas não sem oposição. Pretendentes do alto escalão do clero agora tentam galvanizar apoio."
 pretender.1.desc_03: "[From.GetRegnalName] faleceu sem um herdeiro claro, deixando nosso governo em desordem. [Root.GetRulerName] foi nomeado como sucessor, após ter conseguido juntar apoio suficiente entre os militares em [Root.Capital.GetName], mas a situação permanece tênue e pretendentes tentam juntar apoio suficiente para desafiar o governo do novo [Root.GetRulerTitle]."
 pretender.1.desc_04: "A carne do [From.GetRegnalName] falhou, e nossos algoritmos foram incapazes de identificar um substituo ideal. Para manter a eficiência, um novo [Root.GetRulerTitle] foi escolhido aleatoriamente, e agora é a responsabilidade do [Root.GetRulerName] interpretar a vontade infalível do Computador Principal.\n\nPorém, dúvidas surgiram, e há aqueles que se enxergam como melhor qualificados para desempenhar esta honra."
 pretender.1.desc_05: "[From.GetRegnalName] faleceu e o [Root.GetName] inteiro está de luto. Infelizmente não há herdeiro declarado, e isso suscitou uma certa disputa entre a nobreza.\n\nO [Root.GetRulerName] já foi coroado em [Root.Capital.GetName], mas Pretendentes reivindicando parentesco distante com [From.GetRegnalName] desafiaram o novo [Root.GetRulerTitle]."
 pretender.1.tooltip: "Facções pretendentes surgiram."
 henrik.710.desc: "Um [From.GetSpeciesName]. Diversos [From.GetSpeciesNamePlural]."
 ##########################
 #Leader Events
 ##########################
 leader_officer: "oficial" #adjectival, like a rank or status - see 'GetLeaderType'
 leader_officer_cap: "Oficial" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_autonomous: "autônomo" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_autonomous_cap: "Autônomo" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_avatar: "avatar" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 leader_avatar_cap: "Avatar" #adjectival, like a rank or status - see 'GetLeaderStatusAdj'
 admiral_trait_gain: "Comandante Ganha Característica"
 admiral_trait_loss: "Comandante Perde Característica"
 leader.1.name: "Oficial Promissor"
 leader.1.desc: "[officer.GetName], oficial comandante que capitaneia a [ship.GetName], serviu com distinção durante o embate recente que ocorreu no sistema [system.GetName]. O Almirantado em [Root.Capital.GetName], reconhecendo suas qualidades, concordou em recompensar seus feitos com uma promoção para a patente de comandante."
 leader.1.desc.machine: "[officer.GetName] foi promovido devido à sua manipulação bem-sucedida da carga de processamento aumentada durante a batalha da [ship.GetName] no sistema [system.GetName]."
 leader.1.desc.hive: "[officer.GetName] recebeu o status de [GetLeaderStatusAdjCap] após análise de suas respostas aguçadas durante o recente embate de [ship.GetName] no sistema [system.GetName]."
 new_admiral: "Um novo §HComandante§! foi adicionado à lista de §H$RECRUITABLE_LEADERS$§!."
 leader.newadmiraltrait.desc.machine: "[officer.GetName] desenvolveu um novo conjunto de dados táticos dos vetores de recurso da instância de combate recente no sistema [system.GetName]."
 leader.lostadmiraltrait.desc.machine: "Após a recente instância de combate no sistema [system.GetName], [officer.GetName] revisou seus protocolos de abordagem."
 leader.newadmiraltrait.desc.hive: "A abordagem no sistema [system.GetName] gerou expressões genéticas únicas no [officer.GetName]."
 leader.lostadmiraltrait.desc.hive: "A batalha no sistema [system.GetName] fez com que as anomalias comportamentais dentro do [officer.GetName] se acalmassem."
 leader.5.desc: "Após a recente vitória no sistema [system.GetName], Comandante [officer.GetName] parece ter desenvolvido um novo interesse por teoria naval. [officer.GetSheHeCap] começou a experimentar estratégias e táticas radicalmente novas."
 leader.6.desc: "Comandante [officer.GetName] parece ter despertado um espírito caçador após a vitória recente no sistema [system.GetName], e agora adota estratégias muito mais agressivas."
 leader.7.desc: "Após liderar [From.From.GetName] à vitória no sistema [system.GetName], Comandante [officer.GetName] está cada vez mais confiante e agora recusa até mesmo contemplar a noção de recuar de embates futuros."
 leader.8.desc: "Após sua vitória recente no sistema [system.GetName], Comandante [officer.GetName] passou a enfatizar a importância da velocidade e das manobras rápidas em suas instruções para a frota. [officer.GetSheHeCap] está experimentando novas formações e padrões para extrair a maior agilidade das naves estelares sob o seu comando."
 leader.9.desc: "Após a vitória recente de [From.From.GetName] no sistema [system.GetName], Comandante [officer.GetName] está mostrando muito mais energia e iniciativa que antes. Seu desempenho aumentou significativamente."
 leader.10.desc: "Comandante [officer.GetName] parece ter desenvolvido certa cautela após a recente derrota no sistema [system.GetName]. Suas estratégias agora estão muito mais cuidadosas e meticulosas quanto à mobilização das frotas sob o seu comando."
 leader.11.desc: "Após a derrota recente no sistema [system.GetName], Comandante [officer.GetName] parece estar mais hesitante e passou a duvidar de suas próprias capacidades. Sua incapacidade de liderar formações tão grandes quanto antes é evidente."
 leader.12.desc: "Comandante [officer.GetName] parece ter sofrido um duro golpe após retirada de [Root.GetName] na batalha recente no sistema [system.GetName]. [officer.GetHeSheCap] decidiu nunca mais abandonar o campo de batalha novamente, e tem a intenção de lutar até o fim no seu próximo embate."
 leader.13.desc: "Comandante [officer.GetName] levou os motores de suas naves ao limite quando [Root.GetName] bateu em retirada na recente batalha no sistema [system.GetName]. [officer.GetSheHeCap] aprendeu a extrair o máximo de velocidade de qualquer nave sob o seu comando."
 leader.14.desc: "Comandante [officer.GetName] parece ter ficado distante e depressivo desde sua derrota na recente batalha travada no sistema [system.GetName]. Os oficiais sob o seu comando relatam que [officer.GetSheHe] não desempenha as tarefas com o mesmo gosto de antes."
 leader.optimizations.desc.machine: "[officer.GetName] atualizou sua heurística operacional para gerenciamento de frota."
 leader.optimizations.desc.hive: "[officer.GetName] ficou mais ágil na manipulação de nossas frotas."
 leader.15.desc: "Comandante [officer.GetName] ganhou um conhecimento técnico valiosíssimo enquanto supervisionava os reparos de [Root.GetName]. As equipes de controle de danos sob seu comando agora são capazes de consertar naves no campo."
 leader.16.desc: "Comandante [officer.GetName] ganhou habilidades organizacionais valiosíssimas após a experiência de comandar uma formação tão grande quanto a de [Root.GetName]. [officer.GetSheHeCap] agora é capaz de controlar frotas ainda maiores de maneira eficaz."
 leader.17.desc: "Comandante [officer.GetName] parece ter ganhado sua confiança de volta após liderar [From.From.GetName] à vitória no sistema [system.GetName]. [officer.GetSheHeCap] agora é capaz de lidar com o volume de trabalho administrativo que acompanha o comando de uma grande frota."
 leader.18.desc: "Enquanto comandava [Root.GetName], Comandante [officer.GetName] aprendeu a gerenciar cuidadosamente seus suprimentos para reduzir de maneira significativa os custos gerais de operação."
 leader.19.desc: "Após sua varredura recente do sistema [system.GetName], Comandante [officer.GetName] aprendeu a mobilizar suas unidades maximizando o alcance de seus sensores. Poucos comandantes de frota possuem a habilidade de executar manobras tão complexas."
 leader.newtrait: "Através do trabalho duro e da experiência, o §H[From.From.GetTitle] [From.From.GetName]§! desenvolveu novas habilidades."
 leader.substanceabuser: "Recebemos relatos um tanto preocupantes com relação à saúde deteriorante do §H[From.From.GetTitle] [From.From.GetName]§!. A aparência abatida [From.From.GetHerHisCap] faz com que pareça que [From.From.GetSheHe] envelheceu quase vinte anos. O fardo do dever pode ser pesado."
 leader.arresteddevelopment: "Apesar das recentes melhorias na habilidade devido à experiência acumulada, o §H[From.From.GetTitle] [From.From.GetName]§! parece estar se aproximando do limite de [From.From.GetHerHis] habilidade."
 leader.lethargic: "Apesar de recentes melhorias de habilidade, boa parte da iniciativa e determinação que já impulsionaram o §H[From.From.GetTitle] [From.From.GetName]§! parecem ter evaporado gradualmente."
 leader.stubborn: "O §H[From.From.GetTitle] [From.From.GetName]§! tornou-se mais experiente, mas com esta experiência veio uma teimosia cada vez maior. O [From.From.GetTitle] tornou-se bem inflexível, e está tendo dificuldades em aceitar novas ideias."
 leader.30.name: "Assistentes IA Removidos"
 leader.30.desc: "Devido à nossa mudança de política recente, que proíbe a inteligência artificial, qualquer Cientista [Root.GetAdj] em posse de §YAssistentes IA Sapientes§! foram forçados a entregá-los para reciclagem."
 ##########################
 #Diplomatic Events
 ##########################
 diplomatic.2.name: "Comandante do Povo [From.From.Owner.GetAdj] Nos Insulta"
 diplomatic.2.desc: "Os [From.From.Owner.GetSpeciesNamePlural] são bem conhecidos por não terem papas na língua ao falar sobre formas de vida alienígenas em geral. Aqueles que seguem a carreira diplomática em [From.From.Owner.GetName] não podem ter pavio curto, já que raramente podem esperar qualquer coisa além de um mínimo de respeito, se tanto. Porém, ao atravessar o espaço [Root.GetAdj], as comunicações geralmente ficam dentro dos protocolos formais.\n\nNão foi assim hoje mais cedo, quando [broadcasted_insult_leader.GetName] decidiu enviar uma mensagem extremamente ofensiva ao nosso povo, pegando todos de surpresa, enquanto navegava com sua frota pelo sistema [From.From.GetStarName]. [broadcasted_insult_leader.GetSheHe] parece ter captado sinais de rádio de um de nossos planetas e esbravejou um longo discurso sobre nossa cultura e nossas origens evolucionárias. Milhões de pessoas ouviram a mensagem, como era desejado. A revolta é palpável."
 diplomatic.2.a: "O [From.From.Owner.GetName] deve demitir este racista imediatamente!"
 diplomatic.2.b: "[broadcasted_insult_leader.GetName] deve ser trazido até nós e executado!"
 diplomatic.2.c: "São apenas palavras. "
 diplomatic.3.name: "Comandante Insulta os [From.GetSpeciesNamePlural]"
 diplomatic.3.desc: "Apesar de bem poucos de nós apreciarmos a companhia dos [From.GetSpeciesNamePluralInsult], ou de xenos em geral, a maioria tenta evitar anunciar nosso desgosto em momentos inoportunos. Comandante [broadcasted_insult_leader.GetName] aparentemente descartou todas essas preocupações ao transmitir uma mensagem mordaz sobre o povo [From.GetSpeciesName] enquanto viajava pelo espaço [From.GetAdj]. A lista de declarações sobre a natureza inferior deles pode ser aceitável em [Root.GetHomeWorldName], mas causou um incidente diplomático com os locais.\n\n[broadcasted_insult_leader.GetName] pediu desculpas de maneira privada, alegando ter se irritado ao ouvir um canal de rádio local. O governo [From.GetAdj] está pedindo a renúncia imediata do indivíduo infrator."
 diplomatic.3.a: "Tal temperamento incontrolável não é digno de comandantes."
 diplomatic.3.b: "A transmissão é um tanto divertida. Não podemos demitir alguém por causa disso!"
 diplomatic.4.desc: "Apesar de bem poucos de nós apreciarem a companhia dos [From.GetSpeciesNamePluralInsult], ou de xenos em geral, a maioria tenta evitar anunciar nosso desgosto em momentos inoportunos. Comandante [broadcasted_insult_leader.GetName] aparentemente descartou todas essas preocupações ao transmitir uma mensagem mordaz sobre o povo [From.GetSpeciesName] enquanto viajava pelo espaço [From.GetAdj]. A lista de declarações sobre a natureza inferior deles pode ser aceitável em [Root.GetHomeWorldName], mas causou um incidente diplomático com os locais.\n\n[broadcasted_insult_leader.GetName] pediu desculpas de maneira privada, alegando ter se irritado ao ouvir um canal de rádio local. O governo [From.GetAdj] pede a execução do indivíduo infrator e deseja sua extradição de [From.GetHomeWorldName]."
 diplomatic.4.a: "Uma vida é um preço pequeno para resolver uma disputa entre milhões."
 diplomatic.4.b: "Não entregaremos um dos nossos para os xenos massacrarem!"
 diplomatic.5.name: "[From.GetName] Aposenta Comandante"
 diplomatic.5.desc: "Após certa pressão de nossos diplomatas para que a escolha de seus líderes seja feita de maneira mais cautelosa, [From.GetRulerName] removeu Comandante [broadcasted_insult_leader.GetName] do seu posto. [broadcasted_insult_leader.GetSheHe] não saiu tranquilamente, jurando que limparia seu nome e esperando que a opinião pública do povo [From.GetAdj] se volte agressivamente contra o [Root.GetName] no futuro.\n\nMesmo assim, os líderes de [From.GetName] enviaram uma mensagem clara sobre expedições futuras ao nosso território: mesmo que eles não gostem de lidar com espécies alienígenas, os [Root.GetSpeciesNamePlural] devem ser respeitados pelo menos no seu próprio espaço."
 diplomatic.5.a: "É melhor que eles sigam este caminho."
 diplomatic.6.name: "[From.GetName] Extradita Comandante"
 diplomatic.6.desc: "Após um curto período de negociações, [broadcasted_insult_leader.GetName] foi entregue a nós para receber sua punição. Depois de ponderarmos cuidadosamente sobre qual punição seria apropriada por insultar os [Root.GetSpeciesNamePlural], somente a morte e a destruição total pareceram opções adequadas.\n\n[broadcasted_insult_leader.GetSheHeCap] não demonstrou arrependimento nem em seus momentos finais, mas o seu discurso fervoroso sobre nossos costumes selvagens foi interrompido pelo som da câmara de vácuo se fechando enquanto a cápsula era lançada quase na velocidade da luz, rumo ao coração de [Root.Capital.StarName]. O fogo glorioso que iluminou as noites de nossos ancestrais queimará cada vestígio daqueles que ousem falar mal deles."
 diplomatic.6.a: "Sem mais [From.GetRandomSpeciesSound] caluniosos."
 diplomatic.7.name: "[From.GetName] Defende Comandante"
 diplomatic.7.desc: "Nossa solicitação para o afastamento de [broadcasted_insult_leader.GetName] do seu posto foi recebida com uma incrível falta de compreensão por [From.GetRulerTitle] [From.GetRulerName] e o governo [From.GetAdj]. Eles responderam com uma mensagem que tentava eximir seu comandante da culpa pelo incidente, sugerindo no processo, talvez de maneira acidental, que parte do que [broadcasted_insult_leader.GetSheHe] disse sobre os [Root.GetSpeciesNamePlural] tinha alguma verdade.\n\nO que imaginávamos ser a ação de um indivíduo racista revelou-se um comportamento aceitável em [From.GetName]. Eles claramente acreditam que nosso povo pode ser insultado e caluniado de forma impune."
 diplomatic.7.a: "A coroa é tão podre quanto os galhos."
 diplomatic.8.name: "Comandante Que Caiu em Desgraça Retorna"
 diplomatic.8.desc: "[broadcasted_insult_leader.GetName], comandante em exílio e que havia perdido seu posto em nossa frota por conta de um incidente diplomático causado por uma transmissão desrespeitosa, tentou voltar à cena. Com a guerra em curso, muitas das declarações na transmissão original agora são propaganda que as pessoas ouvem todos os dias, justificando suas ações principalmente entre os militares.\n\nMudar nossa decisão agora enfraqueceria a credibilidade da administração, porém não temos outro comandante mais adequado para lutar esta guerra."
 diplomatic.8.a: "Precisamos de alguém para motivar o povo!"
 diplomatic.8.b: "Tomamos a decisão correta e ficaremos com ela."
 diplomatic.10.name: "Pesquisadores Suspeitam de Navios Estrangeiros"
 diplomatic.10.desc: "[Root.GetName] é conhecido pelos seus padrões acadêmicos e desejo de inovação, mas estar no limite não só requer discrição sobre como pesquisar, como também sobre com quem compartilhá-la. Nossos segredos comerciais são altamente valiosos, tanto domesticamente quanto no restante da galáxia, e alguns cientistas são muito cuidadosos contra tentativas de acesso ilícito aos seus dados.\n\nA presença de naves científicas [From.From.Owner.GetAdj] em nosso território fez com que muitas instalações de pesquisa suspeitassem de espionagem. Alguns pesquisadores dizem que não podem continuar a trabalhar sob esta possível ameaça, solicitando que fechemos nossas fronteiras para estes [From.From.Owner.GetSpeciesNamePlural] suspeitos."
 diplomatic.10.a: "Nossos cientistas precisam sentir-se seguros de serem observados. Feche as fronteiras."
 diplomatic.10.b: "Naves científicas são pesquisadores também, não espiões."
 diplomatic.11.name: "[From.GetName] Fecha as Fronteiras"
 diplomatic.11.desc: "A presença de suas naves científicas no espaço [From.GetAdj] nos gerou dúvida sobre seus motivos. Nossos pesquisadores acreditam que seus cientistas não estavam conduzindo, mas roubando pesquisa. Para manter segredos comerciais valiosos seguros, precisamos removê-lo do nosso espaço."
 diplomatic.11.a: "Verdadeiramente uma época preocupante quando cientistas não confiam um no outro."
 diplomatic.12.name: "[From.From.GetName] Suspeito de Mapear o Genoma"
 diplomatic.12.desc: "Estar atento contra ameaças xeno tem sido uma prioridade desde que deixamos [Root.GetHomeWorldName] pela primeira vez. As naves científicas [From.From.GetAdj] xeretando em nosso território não passaram despercebidas, mas, até agora, imaginamos que elas estavam pacificamente inspecionando planetas. Porém, uma teoria recente colocou uma dúvida sobre isso.\n\nOs [From.From.GetSpeciesName] são conhecidos por usar o mapeamento do genoma nas suas pesquisas médicas. E se eles estiverem mapeando os genomas de [Root.GetSpeciesNamePlural] desavisados com a intenção de encontrar nossas fraquezas? Apesar de nenhuma prova concreta ter aparecido, a teoria leva a pedidos de fechamento de nossas fronteiras aos [From.From.GetName] para prevenir que quaisquer planos possíveis tenham sucesso."
 diplomatic.12.a: "Não podemos arriscar que inimigos futuros obtenham estes dados! Feche as fronteiras."
 diplomatic.12.b: "Não vamos basear nossa política externa em teorias da conspiração."
 diplomatic.12.c: "Precisamos iniciar um projeto para mapear o genoma deles em retaliação."
 diplomatic.13.name: "[From.GetName] Fecha as Fronteiras"
 diplomatic.13.desc: "Suas naves científicas foram denunciadas por atividade suspeita em nosso espaço. Há rumores que vocês estão estudando nossa composição genética, buscando informações que possam ser usadas para encontrar fraquezas ou produzir armas biológicas. Não podemos expor o povo [From.GetSpeciesAdj] a tal risco."
 diplomatic.13.a: "Acusações sem fundamento!"
 diplomatic.14.name: "Mapeamento do Genoma Gera Resultados"
 diplomatic.14.desc: "Apesar de não termos encontrado os detalhes específicos que esperávamos no genoma mapeado, nossa pesquisa esclareceu muito sobre as peculiaridades de nossa própria genética. Algumas das armas que se mostraram úteis nas guerras em [Root.GetHomeWorldName] no passado podem ser totalmente ineficazes contra formas de vida alienígenas. Estes novos conhecimentos nos ajudaram a desenvolver doutrinas de combate atualizadas."
 diplomatic.14.a: "Se eles realmente estão tentando nos atingir, talvez precisaremos disso."
 diplomatic.15.name: "Cientista [From.From.GetAdj] Bisbilhoteiro"
 diplomatic.15.desc: "O [Root.GetName] tenta não deixar preocupações espirituais entrarem no caminho de nossa exploração e examinação do mundano, mas sabemos como ouvir de maneira apropriada os conhecimentos e tradições metafísicas em todas as ações. Cientistas de [From.From.GetName] parecem ser um pouco mais descuidados na sua busca por novas descobertas astronômicas.\n\nApós se interessarem por algumas das estrelas próximas que formam constelações cruciais à mitologia [Root.GetSpeciesAdj], [encroaching_research_leader.GetName] foi acusado de tentar \"refutar\" algumas das lendas ao redor delas. Apesar de estarmos confiantes de que o significado espiritual das constelações dificilmente pode ser tocado por descobertas modernas, muitos se opuseram à pesquisa e tentaram convencer [encroaching_research_leader.GetHimHer] a deixar o espaço [Root.GetAdj]."
 diplomatic.15.a: "Suspeita de má fé é motivo suficiente para retirá-los de nosso espaço."
 diplomatic.15.b: "Nossa fé transcende o reino material. Ela não pode ser atingida."
 diplomatic.15.b.tooltip: "[encroaching_research_leader.GetName] continua [encroaching_research_leader.GetHerHis] pesquisa."
 diplomatic.16.name: "[From.GetName] Fecha as Fronteiras"
 diplomatic.16.desc: "Seu cientista, [encroaching_research_leader.GetName], esteve prestando atenção indevida a estrelas em constelações que nosso povo considera sagradas. Não podemos permitir que ninguém opere em nosso território sem dar o respeito devido à nossa fé e suas lendas."
 diplomatic.16.a: "Isso deve ser algum mal-entendido."
 diplomatic.17.name: "Descoberta Herética em [From.GetName]"
 diplomatic.17.desc: "Conduzir uma pesquisa no espaço controlado por estrangeiros requer tato, algo que às vezes não prestamos atenção na hora de recrutar nossos cientistas. Isso se tornou aparente quando o [encroaching_research_leader.GetName] recentemente passou por problemas ao estudar algumas estrelas em constelações [From.GetAdj] sagradas. Os locais se opuseram a um exame clínico do objeto e incomodaram [encroaching_research_leader.GetHimHer] até que o [From.GetRulerTitle] [From.GetRulerName] deu uma declaração sancionando a pesquisa.\n\n[encroaching_research_leader.GetName], aparentemente sentido pelo protesto, parece ter demorado para encontrar de fato material que sugere que algumas das lendas sobre as estrelas [From.GetAdj] podem ser altamente inconsistentes com sua idade e desenvolvimento real. Isso provavelmente causará mais revolta se for publicado."
 diplomatic.17.a: "[encroaching_research_leader.GetSheHe] está tentando deliberadamente causar um escândalo? Eu quero [encroaching_research_leader.GetHimHer] demissão."
 diplomatic.17.b: "Coisas desse tipo acontecem durante uma pesquisa."
 diplomatic.18.name: "[encroaching_research_leader.GetName] Publica Heresia"
 diplomatic.18.desc: "Apesar de nossa confiança nas melhores intenções do pesquisador [From.GetName] que estava estudando nossas constelações antigas, [encroaching_research_leader.GetSheHe] conseguiu irritar nosso povo ao reavaliar a idade das estrelas e argumentar que o desenvolvimento de seu brilho e visibilidade entra em conflito com nossas lendas sobre as constelações.\n\nO povo que originalmente se opôs ao projeto está argumentando que isso foi feito de maneira deliberada por maldade do cientista após ele ter solicitado o fim dos estudos. O governo [From.GetAdj] decidiu ignorar o assunto e se recusou a agir para evitar a raiva e a dor que o relatório provavelmente causará entre o nosso povo."
 diplomatic.18.a: "Nunca deveríamos ter confiado que eles nos respeitariam."
 diplomatic.19.name: "Flauta Exótica"
 diplomatic.19.desc: "A música tomou muitas formas entre os seres que encontramos desde que deixamos o [Root.GetHomeWorldName], e os métodos e preferências continuam nos impressionando. Às vezes, a música alienígena é inaudível para nós, enquanto outras vezes, as ondas são fortes o suficiente para destruir nossa capacidade de audição. Encontrar música que amamos mais do que os seus criadores é, de fato uma ocasião rara.\n\nTal ocasião rara ocorreu recentemente em [music_listening_planet.GetName]. Localizado próximo à fronteira [music_origin_country.GetAdj], estações de rádio tocando música do outro lado se tornaram imensamente populares. Parece que algum instrumento de [music_origin_country.GetHomeWorldName] não é só agradável, mas parece fazer com que os corpos [Root.GetSpeciesAdj] ressoem, causando uma sensação de relaxamento no [Root.GetSpeciesOrganName]. Qualquer que seja este instrumento, é diferente de qualquer um dos nossos."
 diplomatic.19.a: "Uma excelente época para aprender mais sobre a sua cultura."
 diplomatic.19.b: "Vamos ser cautelosos e estudar este instrumento."
 diplomatic.20.name: "Biologia Instrumental"
 diplomatic.20.desc: "Após uma análise mais profunda da música alienígena, descobrimos que ela se origina de um instrumento de sopro feito a partir de uma das plantas nativas de seu mundo natal. A estrutura interna incomum da planta é completamente diferente de qualquer coisa existente em [Root.GetHomeWorldName], até mesmo no nível molecular. O efeito do ar que passa pela planta nos corpos dos indivíduos da espécie [Root.GetSpeciesAdj] avançou a nossa compreensão da biologia floral em mundos alienígenas."
 diplomatic.20.a: "Quem sabe o que poderemos encontrar?"
 diplomatic.21.name: "[neighbor_contesting_colony.GetName] Objetos para Expansão"
 diplomatic.21.desc: "Sua colônia nova em [Root.GetName] está localizada muito próxima às nossas fronteiras. Preferimos que você se retire desta fronteira, para evitar conflitos futuros sobre onde nossa fronteira deve ser desenhada."
 diplomatic.21.a: "Pararemos o desenvolvimento imediatamente."
 diplomatic.21.b: "A colônia é parte de nosso futuro. Ela fica."
 diplomatic.1000.name: "Manobras da Frota"
 diplomatic.1000.desc: "Comandante [exercise_admiral.GetName] elaborou planos para um grande exercício de frotas que envolverá uma parte substancial de nossa Marinha. O local que [exercise_admiral.GetSheHe] escolheu para essas manobras é o sistema [exercise_system.GetName], que fica próximo à fronteira com [exercise_neighbor.GetName].\n\nOs [exercise_neighbor.GetSpeciesNamePlural] podem ver isso como uma provocação, mas se cancelarmos o treinamento, nossas forças armadas considerarão isso um sinal de fraqueza. Afinal de contas, [exercise_system.GetName] está dentro do nosso espaço e [exercise_neighbor.GetName] não tem o direito de nos dizer o que podemos ou não fazer em nosso quintal."
 diplomatic.1000.a: "Continue com as manobras como planejado."
 diplomatic.1000.b: "Cancele o exercício."
 FLEET_MANEUVERS_1_PROJECT: "Conduzir Manobras da Frota"
 FLEET_MANEUVERS_1_PROJECT_DESC: "Grandes manobras de frota foram planejadas no sistema [exercise_system.GetName], próximo à fronteira do [exercise_neighbor.GetName]. O objetivo deste exercício é simular uma sonda hostil de forças [exercise_neighbor.GetSpeciesName] significativas em nosso espaço, como um possível prelúdio a uma invasão.\n\nO exercício começará assim que todas as forças alocadas chegarem até a área preparada na órbita de [exercise_location.GetName]."
 FLEET_MANEUVERS_2_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_2_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 FLEET_MANEUVERS_3_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_3_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 diplomatic.1001.name: "Manobras da Frota Canceladas"
 diplomatic.1001.desc: "Os planos para executar um grande exercício de frota foram cancelados. Atrasos contínuos na movimentação de forças alocadas para a posição significa que proceder agora atrapalharia bastante o nível de prontidão de toda a frota."
 diplomatic.1002.desc: "Como o [Root.GetName] agora está envolvido em uma guerra de fato, o grande exercício de frota que havíamos planejado foi cancelado. Nossas tripulações navais terão que ganhar experiência no campo de batalha."
 diplomatic.1002.a: "Batismo de Fogo."
 diplomatic.1006.name: "Atividade Naval em [exercise_system.GetName]"
 diplomatic.1006.desc: "Recebemos relatórios de nossa inteligência de movimentos significativos de tropa dentro do [From.Owner.GetName]. Eles parecem estar centralizados no sistema [exercise_system.GetName] - perto demais de nossa fronteira. O que os [From.Owner.GetSpeciesNamePlural] estão planejando?"
 diplomatic.1006.a: "Continue monitorando a situação."
 diplomatic.1011.name: "Manobras da Frota: Colisões"
 diplomatic.1011.desc: "As manobras complexas elaboradas sob o comando de [exercise_admiral.GetName] resultaram em diversas pequenas colisões durante os exercícios navais que estão acontecendo no sistema [exercise_system.GetName]. Baixas entre as tripulações foram mínimas e nenhuma das naves envolvidas sofreu danos críticos, mas elas precisarão de reparos após a conclusão do treinamento."
 diplomatic.1011.a: "Pelo menos nenhuma nave foi perdida."
 exercise_collision_tooltip: "Diversas naves nossas sofreram danos de colisões."
 diplomatic.1012.name: "Manobras da Frota: Naves Perdidas"
 diplomatic.1012.desc: "[destroyed_ship_1.GetName] e [destroyed_ship_2.GetName] foram perdidos tragicamente com todos os tripulantes quando as duas naves colidiram durante uma manobra de alta velocidade que fazia parte dos exercícios navais em [exercise_system.GetName]. Os parentes próximos foram notificados."
 diplomatic.1012.a: "Um dia triste."
 exercise_ships_lost: "Duas de nossas naves foram perdidas devido a uma colisão acidental."
 diplomatic.1013.name: "Manobras da Frota: Oficial Promissor"
 diplomatic.1013.desc: "Capitão [exercise_officer.GetName] do [officer_ship.GetName] mostrou muito futuro durante os exercícios de frota que estão acontecendo no sistema [exercise_system.GetName]. O jovem oficial mostrou iniciativa junto com habilidades de liderança consideráveis, e o Almirantado achou por bem que [exercise_officer.GetHerHim] seja promovido para Almirante."
 diplomatic.1013.a: "A frota sempre precisa de comandantes capazes."
 exercise_officer_tooltip: "Comandante [exercise_officer.GetName] está disponível para serviço."
 diplomatic.1014.name: "Manobras da Frota: Interesse Público"
 diplomatic.1014.desc: "Os exercícios navais contínuos no sistema [exercise_system.GetName] atraíram atenção considerável da mídia em [Root.Capital.GetName] e nas colônias. Gravações holográficas não confidenciais que mostram algumas das manobras mais dramáticas deixaram o público apaixonado pelos defensores valiosos do [Root.GetName] que servem na frota. Voluntários estão lotando nossas estações de recrutamento naval!"
 diplomatic.1014.a: "Isso deve reduzir os custos."
 diplomatic.1020.name: "Inteligência sobre as Manobras [From.Owner.GetSpeciesName]"
 diplomatic.1020.desc: "Nossos ativos de inteligência reuniram mais informações sobre a atividade naval [From.Owner.GetSpeciesName] aumentada no sistema [exercise_system.GetName]. O [From.Owner.GetName] parece ter reunido uma grande frota no local para conduzir algum tipo de exercício naval gigantesco em uma escala sem precedentes.\n\nPor enquanto, não há sinais de que este exercício se transformará em operações militares diretas contra o [Root.GetName], sua proximidade à nossa fronteira só pode ser vista como uma provocação deliberada! \"Como devemos responder?"
 diplomatic.1020.a: "Faça um protesto diplomático!"
 diplomatic.1020.b: "Ignoraremos suas provocações."
 exercise_diplomatic_protest: "Faremos com que o [From.Owner.GetName] saiba do nosso desprazer desses exercícios."
 diplomatic.1021.desc: "O [From.GetName] é veementemente contra o exercício militar provocativo que está acontecendo no sistema [exercise_system.GetName] por unidades navais [Root.GetSpeciesName].\n\nRealizar manobras de frota em uma escala tão sem precedentes e tão perto de nossas fronteiras só pode ser visto como uma ameaça. Nossas próprias forças foram colocadas em alerta máximo, e nossos comandantes de frota foram instruídos a responder à qualquer violação de fronteira com força máxima."
 diplomatic.1021.a: "Diga aos [From.GetSpeciesNamePlural] para ficarem longe de nossas questões internas!"
 diplomatic.1021.b: "Não podemos passar por um incidente... cancele o exercício."
 diplomatic.1021.c: "Nossos diplomatas aliviarão as tensões."
 exercise_diplomatic_hardline: "Façamos uma resposta diplomática severa ao protestinho desagradável deles."
 exercise_diplomatic_canceled: "Cancelamos nossas manobras de frota para melhorar as relações com o [From.GetName]. Os militares não ficarão satisfeitos.\n\n"
 exercise_diplomatic_conciliatory: "Façamos uma resposta conciliadora para diminuir o dano diplomático, mas o exercício continua."
 diplomatic.1022.desc: "Recebemos seu protesto mal escrito contra os exercícios militares que nossas gloriosas forças navais estão executando no sistema [exercise_system.GetName]. Já que aquele sistema, como você bem sabe, está dentro do território soberano do [From.GetName], não vemos como isso pode ter alguma coisa a ver com vocês.\n\nO [Root.GetName] faz bem em não nos enviar mais tal correspondência diplomática imprudente.\n\nEssa transmissão se encerra agora."
 diplomatic.1022.a: "Isso é intolerável!"
 diplomatic.1023.desc: "Devido às objeções feitas pelo [Root.GetName] com relação às nossas manobras navais no sistema [exercise_system.GetName], o [From.GetName] decidiu encerrar todos os exercícios que estão sendo realizados no interesse de nutrir relações melhores entre nossas duas nações estelares.\n\nEsperamos sinceramente que esta ação nos ajude a diminuir as tensões, enquanto prova além de qualquer dúvida o compromisso [From.GetSpeciesName] rumo a uma paz galática duradoura."
 diplomatic.1023.a: "Talvez eles estejam sendo sinceros na busca pela paz..."
 diplomatic.1024.desc: "[From.GetName] se arrepende profundamente dos mal-entendidos que possam ter sido causados pelos exercícios militares no sistema [exercise_system.GetName].\n\nEsses exercícios navais foram planejados com muita antecedência, e a localização foi escolhida aleatoriamente pelos nossos comandantes. De forma alguma isso deve ser considerado como uma ameaça ou provocação direcionada a [Root.GetName]."
 diplomatic.1024.a: "Isso é outra farsa [From.GetSpeciesName]?"
 diplomatic.1025.name: "Manobras Concluídas"
 diplomatic.1025.desc: "As manobras conduzidas pela frota [exercise_fleet.GetName] no sistema [exercise_system.GetName] foram concluídas. Comandante [exercise_admiral.GetName] relata que aprendemos muito com esse exercício, em grande parte devido à sua escala imensa. Apesar de quaisquer repercussões diplomáticas em potencial, os benefícios militares, pelo menos, foram substanciais."
 diplomatic.1025.a: "Um trabalho bem feito."
 diplomatic.1026.name: "[From.Owner.GetSpeciesName] Manobras Concluídas"
 diplomatic.1026.desc: "A julgar pela queda brusca nas transmissões militares codificadas  [From.Owner.GetSpeciesName] vindas do sistema [exercise_system.GetName], o exercício naval que vinha sendo feito pelo [From.Owner.GetName] finalmente chegou ao fim."
 diplomatic.1026.a: "Já era hora."
 precursor_1: "$vultaum_precursor_civ$"
 precursor_2: "$yuht_precursor_civ$"
 precursor_3: "$first_league_precursor_civ$"
 precursor_4: "$irassian_precursor_civ$"
 precursor_5: "$cybrex_precursor_civ$"
 precursor_baol_1: "$NAME_Baol$"
 precursor_zroni_1: "$NAME_Zroni$"
 precursor_inetian: "$NAME_inetian$"
 precursor_adakkaria: "$NAME_adakkaria$"
 precursor_1_desc: "O conhecimento deles era vasto, e suas teorias eram complexas. Mas sua busca pela verdade absoluta os levou à iluminação ou ao esquecimento?"
 precursor_2_desc: "Eles vagavam pelas estrelas, sempre procurando, sempre expandindo. Agora, restam apenas suas ruínas, sussurrando sobre consequências imprevisíveis."
 precursor_3_desc: "A união é frágil. Que força seria capaz de destruir uma federação próspera cuja influência alcançava setores inteiros?"
 precursor_4_desc: "Até a mais poderosa das civilizações é vítima de inimigos ocultos. Será que a arrogância os cegou ou a ignorância selou seu destino?"
 precursor_5_desc: "Por algum tempo, nada era capaz de detê-los, até que alguma coisa abalou sua determinação. O que levou sua cruzada ao fim?"
 precursor_baol_1_desc: "Eles cultivaram mundos inteiros, moldando ecossistemas com cuidado. Mas até mesmo as raízes mais profundas podem ser arrancadas do solo."
 precursor_zroni_1_desc: "A mente não conhece limites. Seus pensamentos os levavam por entre as estrelas, reformulando a existência. Mas até mesmo aqueles capazes de enxergar além nem sempre veem as coisas da mesma maneira."
 precursor_inetian_desc: "A prosperidade dá vez à ambição, e a ambição atrai a ruína. A força que desenrolou suas teias permanece oculta, mas seus lucros não foram capazes de salvá-los."
 precursor_adakkaria_desc: "Eles navegaram pelas marés do cosmos, sempre livres, nunca estacionários. Mas andarilhos não podem vagar para sempre."
