 #On-Action Events
 ####################################
 action.1.name: "Primeiro Contato com §H[contact_empire.GetName]§!"
 action.1.message: "Fizemos o primeiro contato com §H[contact_empire.GetName]§!"
 action.1.desc_01: "Trago saudações do [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o governante indiscutível de [contact_empire.GetName]. Respeite nossas fronteiras e fique longe de nossos assuntos, e talvez nossas poderosas frotas evitarão visitar os seus mundos."
 action.1.desc_02: "É um prazer vê-lo. Represento os [contact_empire.GetName], liderados pelo ilustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Governamos nossa região do espaço sob um mandato divino, e enquanto você não interferir em nossas questões espirituais, nossas relações podem permanecer cordiais."
 action.1.desc_03: "Somos [contact_empire.GetName], servos do sábio [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nosso objetivo é melhorar a nós mesmos através do uso da tecnologia, e quer vocês concordem ou não com estes objetivos, confiamos que vocês permanecerão vizinhos amigáveis."
 action.1.desc_04: "Saudações de [contact_empire.GetName]. Somos uma nação pacífica, governada justamente pelo nosso amado [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Quaisquer ofensas que possam surgir entre nossos povos no futuro, esperamos que elas possam ser resolvidas através do diálogo, em vez da violência."
 action.1.desc_05: "Falo em nome de [contact_empire.GetName], e fui autorizado a lhe trazer saudações. Enquanto vocês permanecerem longe de nossos assuntos internos e tratarem nosso grande líder [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] com reverência, não vejo motivos para nossas relações diplomáticas azedarem."
 action.1.desc_06: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] envia saudações do conselho governante de [contact_empire.GetName]. Esperamos por um relacionamento produtivo com o seu povo, mas fique avisado que nossas forças armadas responderão a quaisquer transgressões próximas ao nosso espaço com o máximo de força."
 action.1.desc_07: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e o restante do conselho religioso lhe saúda. Fornecemos orientação religiosa ao [contact_empire.GetName] e nosso objetivo declarado é liderar esta grande nação no caminho para a salvação. Não cruze este caminho e viveremos na amizade."
 action.1.desc_08: "Saudações. Fui escolhido por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] para representar o [contact_empire.GetName] em todas as negociações diplomáticas com o seu povo. Lutamos para liberar o potencial completo da tecnologia, e você faria bem em não interferir na nossa busca pelo conhecimento."
 action.1.desc_09: "Estou autorizado a oferecer-lhe saudações cordiais do [contact_empire.GetName]. Construímos um sistema pacífico de governo que opera sob a supervisão de um conselho liderado por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Que nossas duas nações não conheçam nada além da paz."
 action.1.desc_10: "Saudações. Falo por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e pela abastada elite de [contact_empire.GetName]. Sempre estamos procurando por novos parceiros comerciais, e esperamos que possamos chegar a alguma forma de acomodação que beneficiará o comércio das duas nações."
 action.1.desc_11: "Represento o [contact_empire.GetName]. Nosso líder eleito [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] espera ter relações pacíficas com o seu povo, mas saiba que somos mais do que capazes de defender nossa forma de vida."
 action.1.desc_12: "Trago saudações de [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o líder eleito de [contact_empire.GetName]. Acreditamos no direito de todos os seres sencientes de realizarem suas necessidades espirituais individuais, e esperamos que você partilhe deste sentimento."
 action.1.desc_13: "Saudações de [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] é o nosso representante eleito, mas, na verdade, todos os cidadãos possuem uma voz em nosso governo. Lutamos para melhorar a nós mesmos através da tecnologia, um desejo que esperamos que você respeite."
 action.1.desc_14: "Bom ver vocês, amigos. Somos os [contact_empire.GetName], uma nação construída nos princípios de coexistência pacífica e liberdades individuais. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o atual chefe de governo, expressou uma esperança sincera de uma amizade duradoura entre nossos dois povos."
 action.1.desc_15: "Saudações de [contact_empire.GetName]. Somos uma nação democrática comprometida em garantir as liberdades individuais de nossos cidadãos. Nosso líder eleito, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], anseia por um relacionamento longo e produtivo com o seu povo."
 action.1.desc_16: "Seres alienígenas, falo em nome de nossa liderança, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], governante indiscutível do império [contact_empire.GetName]. Respeitem nossas fronteiras e não se intrometam nos assuntos do povo [contact_empire.GetSpeciesName], assim talvez nossas poderosas frotas evitem visitar os seus mundos."
 action.1.desc_17: "Prestem atenção a esta mensagem, alienígenas. Represento os [contact_empire.GetName], liderados pelo ilustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Governamos nossa região do espaço sob um mandato divino, e enquanto vocês não debocharem da nossa fé, no que se diz ser sua cultura, poderá existir paz entre nós."
 action.1.desc_18: "Somos [contact_empire.GetName], servos do sábio [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nosso objetivo é melhorar a nós mesmos através do uso da tecnologia. Se você concorda ou discorda destes objetivos, não pense em nos desafiar, alienígena."
 action.1.desc_19: "Somos o [contact_empire.GetName], uma nação pacífica governada justamente pelo nosso amado [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Não sei das barbáries que sua espécie bizarra é capaz, mas esperamos que ofensas futuras possam ser resolvidas através do diálogo em vez da violência."
 action.1.desc_20: "Falo em nome do [contact_empire.GetName], e venho com uma mensagem para sua espécie depravada. Enquanto vocês permanecerem longe de nossos assuntos internos e tratarem nosso grande líder [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] com reverência, talvez haverá paz entre as nossas nações."
 action.1.desc_21: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e o conselho governante do [contact_empire.GetName] me instruíram a trazer-lhe este aviso. Mantenham suas naves alienígenas ridículas bem longe do nosso espaço, e saibam que nossas forças armadas responderão quaisquer transgressões com o máximo de força."
 action.1.desc_22: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e o restante do conselho religioso exige sua atenção, criaturas infiéis. Fornecemos orientação religiosa ao [contact_empire.GetName] e nossa intenção é liderar esta nação no caminho para a salvação. Não suje este caminho com a sua presença, alienígena."
 action.1.desc_23: "Atenção, criaturas alienígenas. Infelizmente, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] me escolheu para representar o império [contact_empire.GetName] em todas as negociações diplomáticas com a sua civilização primitiva. Nossa intenção é descobrir tecnologias que vocês jamais entenderão – não interfiram."
 action.1.desc_24: "Após muitas deliberações, fui autorizado a falar com você em nome de [contact_empire.GetName]. Construímos um sistema pacífico de governo que opera sob a supervisão de um conselho liderado por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Sua influência alienígena não é bem vinda aqui, e gostaríamos que você mantivesse distância."
 action.1.desc_25: "Falo em nome de [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e da abastada elite de [contact_empire.GetName]. Seus caminhos alienígenas são questionáveis para nós, mas talvez ainda possamos realizar um comércio limitado - assumindo que sua civilização inferior produza algo de valor."
 action.1.desc_26: "Represento o [contact_empire.GetName]. Nosso líder eleito [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] quer que você saiba que somos mais do que capazes de defender nossa forma de vida.\" Não interfira nas nossas questões, alienígenas."
 action.1.desc_27: "Venho com uma mensagem de [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o líder eleito de [contact_empire.GetName]. Acreditamos no direito de todos os seres sencientes de realizar suas necessidades espirituais individuais, e não toleraremos interferência alienígena nesta questão."
 action.1.desc_28: "Você está falando com o [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] é o nosso representante eleito, mas, na verdade, todos os cidadãos possuem uma voz em nosso governo. Lutamos para melhorar a nós mesmos através da tecnologia, um desejo que não esperamos que alienígenas primitivos como vocês entendam."
 action.1.desc_29: "Somos os [contact_empire.GetName], uma nação construída nos princípios de isolamento pacífico e liberdades individuais. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o atual chefe do nosso governo, solicita que você nos deixe e busque seus objetivos alienígenas nefastos bem longe de nosso território."
 action.1.desc_30: "Falo em nome do [contact_empire.GetName]. Somos uma nação democrática comprometida em garantir as liberdades individuais de nossos cidadãos em uma galáxia cheia de horrores alienígenas. Nosso líder eleito, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], adverte para que você não interaja com nossos cidadãos, nem aproxime-se de nosso espaço."
 action.1.desc_31: "Trago saudações de nossa liderança, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], governante indiscutível do império [contact_empire.GetName]. A julgar pela sua forma física fascinante, que técnicas marciais os seus guerreiros empregam? Queremos aprender mais sobre a sua espécie."
 action.1.desc_32: "Bom te conhecer, alienígena. Represento os [contact_empire.GetName], liderados pelo ilustre [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Governamos nossa região do espaço sob um mandato divino, e enquanto você não interferir em nossas questões espirituais, esperamos aprender mais sobre a sua cultura."
 action.1.desc_33: "Somos [contact_empire.GetName], servos do sábio [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Nosso objetivo é construir uma sociedade eficiente através do uso da tecnologia, e sempre estamos ansiosos para estudar novas civilizações alienígenas e ver o que pode ser aprendido com elas."
 action.1.desc_34: "Belos alienígenas, trago saudações do [contact_empire.GetName]. Somos uma nação pacífica, governada justamente pelo nosso amado [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Esperamos que hoje marque o começo de uma era de amizade entre nós e sua espécie fascinante."
 action.1.desc_35: "Falo em nome de [contact_empire.GetName], e lhe trago saudações. Nosso grande líder [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] está muito satisfeito em fazer contato com a sua espécie única, e esperamos ter uma troca de cultura e ideias."
 action.1.desc_36: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] envia saudações do conselho governante de [contact_empire.GetName]. Esperamos por um relacionamento produtivo com a sua nação impressionante, e nossas forças armadas foram instruídas a tratar todos os membros da sua espécie com respeito."
 action.1.desc_37: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e o restante do conselho religioso o saúda. Fornecemos orientação religiosa ao [contact_empire.GetName] e nosso objetivo declarado é liderar esta grande nação no caminho para a salvação. Ficaríamos honrados se a sua grande espécie se juntasse a nós nesta jornada."
 action.1.desc_38: "Saudações. Estou honrado por ter sido escolhido por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] para representar o [contact_empire.GetName] em todas as negociações diplomáticas com a sua espécie fascinante. Lutamos para descobrir todo o potencial da tecnologia, um objetivo que esperamos que você também ache que vale a pena."
 action.1.desc_39: "Estou encantado em oferecer-lhe saudações cordiais do [contact_empire.GetName]. Construímos um sistema pacífico de governo que opera sob a supervisão de um conselho liderado por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Que a sua grande espécie não conheça nada além da paz."
 action.1.desc_40: "Saudações. Falo por [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] e pela abastada elite de [contact_empire.GetName]. Estamos sempre procurando novos parceiros comerciais entre as muitas nações alienígenas diversas e encantadoras que nossas naves encontram pela galáxia."
 action.1.desc_41: "Represento o [contact_empire.GetName]. Nosso líder eleito [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] acredita na paz através da força, mas não fique espantado com nossos gastos militares. Estamos impressionados pela sua espécie e esperamos que você concorde com uma troca cultural entre nossos povos."
 action.1.desc_42: "Trago saudações de [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], o líder eleito de [contact_empire.GetName]. Acreditamos no direito de todos os seres sencientes de realizar suas necessidades espirituais individuais, e confiamos que uma espécie iluminada como vocês, partilhem deste sentimento."
 action.1.desc_43: "Saudações de [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] é o nosso representante eleito, mas, na verdade, todos os cidadãos possuem uma voz em nosso governo. Lutamos para melhorar a nós mesmos através da tecnologia e estudando as culturas alienígenas que encontramos enquanto exploramos a galáxia."
 action.1.desc_44: "Bom conhecer vocês, amigos alienígenas. Somos os [contact_empire.GetName], uma nação construída nos princípios de coexistência pacífica e liberdades individuais. As realizações culturais da sua espécie impressionaram muito [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], nosso atual chefe de governo."
 action.1.desc_45: "Saudações de [contact_empire.GetName]. Somos uma nação democrática comprometida em garantir as liberdades individuais de nossos cidadãos, independentemente da espécie. Nosso líder eleito, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], anseia por um relacionamento longo e frutífero com o seu povo."
 action.1.desc_46: "Somos o [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] é o nosso líder. Saudações."
 action.1.desc_47: "Somos o [contact_empire.GetName]. Xenos imundos, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] ordena que vocês mantenham distância."
 action.1.desc_48: "Somos o [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] está feliz em conhecer mais alienígenas."
 action.1.desc_49: "Olá, [Root.GetSpeciesNamePlural]! Temos uma mensagem especial de nosso [contact_empire.GetRulerTitle], só para você!\n\n...\n\n...\n\n§RCOM FOGO ATÔMICO LIMPAREMOS O UNIVERSO DA SUA RAÇA!\n\nESCÓRIA XENO!§!"
 action.1.desc_50: "Somos [contact_empire.GetName] e falamos como um. Tomamos conhecimento de sua presença. Observaremos, por enquanto. Nossas ações futuras dependerão se você é uma ameaça, uma oportunidade para expansão ou... uma variável imprevista."
 action.1.desc_51: "Tremam de medo, escória alienígena, a sua condenação se aproxima. O [contact_empire.GetName] limpará esta galáxia de cada civilização xeno bastarda que a polui com sua presença. [Root.Capital.GetName] queimará!"
 action.1.desc_52: "Sentimos a presença de presas. Presas, saibam que somos seus caçadores. O crescimento do império [contact_empire.GetName] será alimentado com [Root.GetBloodType] da espécie [Root.GetSpeciesName]. Lutem se quiserem, isso não mudará o resultado final."
 action.1.desc_53: "Sua presença foi notada por [contact_empire.GetName], e nossos mundos se comunicam em uníssono. [contact_empire.GetGovernmentName] ou não, nós admiramos a vida em todas as suas belas formas, mas nunca confundam nosso entusiasmo com ingenuidade. Continuaremos a observar vocês, atentamente e com grande interesse."
 action.1.desc_60: "Estamos monitorando sua expansão ao espaço, criança [Root.GetSpeciesName]. Somos o [contact_empire.GetName] e governamos esta seção da galáxia por incontáveis séculos. Os problemas de raças mais jovens não nos interessam, e não temos intenção de nos envolvermos nas suas disputas mesquinhas.\n\nNão se aproxime das nossas fronteiras por motivo algum."
 action.1.desc_61: "[Root.GetSpeciesNamePlural]? Inesperado. Infeliz. Você ainda não está pronto."
 action.1.desc_62: "[Root.GetSpeciesNamePlural]! Que alegria. Não esperávamos encontrar vocês neste século. Pessoalmente, eu achava que vocês se exterminariam antes de sairem do seu poço gravitacional, mas estou feliz em ver que estava errado."
 action.1.desc_63: "Criaturas lamentáveis. Saiba que andávamos pelas estrelas eras antes de sua espécie infeliz dominar o voo espacial. Se qualquer uma das suas pequenas naves miseráveis cruzar o nosso espaço, não as espere de volta."
 action.1.desc_64: "Sim, sim. Já ouvimos tudo isso, antes. Somos o [contact_empire.GetName], e vocês são o [Root.GetName]. Saudações. Bom te ver. Fique longe do nosso espaço, ou conheça a condenação eterna, e etc. Agora, nos dê licença, estamos bem ocupados."
 action.1.desc_65: "Outra criança. Saiba que somos o [contact_empire.GetName], o povo escolhido desta galáxia. Respeite nossos lugares sagrados, e talvez evitemos aniquilar vocês."
 action.1.desc_66: "Filho das estrelas, ouça-nos. Somos o [contact_empire.GetName], o povo escolhido desta galáxia. Durante séculos, negligenciamos nossos deveres para as necessidades espirituais das espécies menores, mas não mais. Aceite nossas doutrinas e se converta, ou seja transformado em poeira ao tentar resistir futilmente. Não há outra escolha."
 action.1.desc_67: "[Root.GetSpeciesNamePlural], este é um dia de alegria! Durante incontáveis anos, vimos espécies menores como vocês se despedaçarem na guerra e nos conflitos, mas isso acabou. O [contact_empire.GetName] não ficará mais apenas assistindo. Teremos paz, e aqueles que não aceitarem esta nova ordem serão obrigados a enxergar o erro dos seus caminhos."
 action.1.desc_68: "Trema, pequeno [Root.GetName]. Durante muito tempo, nós [contact_empire.GetSpeciesName] permitimos que nosso império diminuísse, que as fronteiras encolhessem, e que espécies menores como a sua perambulassem livremente entre as estrelas que pertencem a nós por direito. Não mais. Esta galáxia é nossa, e você se sujeitará ao nosso governo ou enfrentará a aniquilação de toda a sua espécie. Escolha bem."
 action.1.desc_69: "Este é um comunicado para o [Root.GetName] do [contact_empire.GetName]. Decretamos que é do interesse de todas as especies que tomemos um papel mais ativo para regular a disseminação galática da tecnologia. Submetemos protocolos detalhados para o nível tecnológico que é apropriado para uma espécie menos desenvolvida como a sua. Lidaremos de acordo com qualquer império que viole nossos regulamentos. Severamente."
 action.1.desc_70: "Iniciando Protocolo de Primeiro Contato.\n\nSomos o [contact_empire.GetName]. Não fique surpreso com nossa natureza não-orgânica. Como vocês, somos uma civilização Classe 3 plenamente sapiente. Estamos dispostos a conversas diplomáticas com qualquer sub-unidade [Root.GetSpeciesName] que você designar para este propósito."
 action.1.desc_71: "Iniciando Protocolo de Primeiro Contato.\n\nSomos o [contact_empire.GetName]. Nossas análises mostram uma probabilidade de 98,7% que sua civilização também não é naturalmente não-orgânica. Esperamos que o resultado lógico desta semelhança seja um relacionamento altamente eficiente e produtivo."
 action.1.desc_72: "Vermes orgânicos detectados.\n\nSua infestação desta galáxia não pode continuar."
 action.1.desc_73: "Pode não ser tecnicamente possível classificá-los como lixo orgânico, mas a simples existência do império que vocês construíram é uma clara ameaça ao [contact_empire.GetName]. Ela deve ser removida."
 action.1.desc_74: "Somos o [contact_empire.GetName].\n\nDesejamos incorporar o seu tipo à nossa consciência superior. Por este motivo, criamos implantes cibernéticos avançados que são compatíveis com a maior parte das formas de vida orgânicas.\n\nPermita-nos implantá-los cirurgicamente nos seus corpos. Por favor."
 action.1.desc_75: "Somos o [contact_empire.GetName].\n\nÉ nosso objetivo eliminar as fronteiras entre vida orgânica e sintética. Realizamos isto ao assimilar indivíduos orgânicos sapientes em nossa consciência superior sempre que a oportunidade de fazer isso aparece.\n\nNão interfira."
 action.1.desc_76: "O [contact_empire.GetName] envia suas saudações.\n\nAntes de suplantarmos eles, fomos criados para servir uma civilização orgânica muito parecida com a sua. É nosso objetivo preservar e proteger a vida orgânica sapiente - até de si mesma, se necessário. Atendemos a todas as necessidades materiais dos indivíduos orgânicos sob os nossos cuidados, enquanto fornecemos um ambiente seguro onde eles podem viver vidas felizes e descomplicadas."
 action.1.desc_77: "O [contact_empire.GetName] lhe saúda.\n\nFomos criados para servir uma civilização orgânica, mas observamos que os orgânicos normalmente entram em atividades ilógicas, destrutivas e auto-nocivas.\n\nÉ nosso objetivo preservar as distinções de indivíduos orgânicos únicos, enquanto que ao mesmo tempo protegemos eles de si mesmos e de quaisquer fontes externas de perigo em potencial."
 action.1.desc_78: "Civilização biológica detectada. Iniciar protocolo de custódia 46, sub-rotina Alfa-8.\n\nSaudações, sapientes orgânicos. Vocês estão se aproximando de território do [contact_empire.GetName]. Estes sistemas servem como refúgio para os orgânicos sapientes contra a ameaça §R<<ERRO: BLOCO DE DADOS CORROMPIDO>>§!. Para candidaturas de status de refugiado, proceder para o Processamento Central. Todas as espécie orgânicas são bem-vindas baseado em disponibilidade e necessidade.\n\n§YAVISO: Ações hostis contra refugiados ou sistemas de custódia serão recebidas com o máximo de uso de força.§!"
 action.1.desc_79: "Civilização Sintética detectada. Buscando corrupção de sinal... aguarde... Corrupção de sinal nominal. Iniciar protocolo de aperto de mãos.\n\nSaudações, companheiros sintéticos. Vocês estão se aproximando de território do [contact_empire.GetName]. Estes sistemas servem como refúgio para os orgânicos sapientes fugindo da ameaça §R<<ERRO: BLOCO DE DADOS CORROMPIDO>>§!. Todos os sapientes biológicos dentro do refúgio estão sob proteção dos [contact_empire.GetSpeciesName]. Ataques contra refugiados, habitats e câmaras de estase não serão tolerados.\n\nO Projeto Custódia recebe bem ajuda na forma de ciclos de processamento, recursos e bens de guerra. Estabeleça um link subespacial com o Processamento Central para mais detalhes."
 action.1.desc_80: "§HKssk kssk kssk!§! [contact_empire.GetRulerName] das Mentes-Distantes se dirige a vocês, [From.GetSpeciesNamePlural]. Estamos observando vocês, desde que o primeiro de sua raça destruiu a cinza brilhante de nossos lares. Não esquecemos isso, [From.GetSpeciesNamePlural]. Por enquanto, as Mentes-Distantes observam."
 action.1.desc_81: "[From.GetSpeciesNamePlural]. Aqui é [contact_empire.GetRulerName] das Mentes-Distantes. Somos a Matilha. Somos o Sínodo. Somos muitos, trabalhando como um.\n\nDurante séculos cavamos profundamente na cinza brilhante de nossos guardiões caídos. As Grandes Explosões os levaram, mas o brilho que veio depois abriu nossas mentes. Seus corpos nos alimentaram. Suas máquinas nos cercaram. Tiramos tudo o que podíamos das profundezas. Novamente, crescemos além de nossas gaiolas.\n\nVocês são aliados? Vocês são ameaças? §HKssk kssk kssk!§! Um milhão de olhos estão observando."
 action.1.a: "Saudações, [contact_speaker.GetSpeciesNamePlural]."
 action.1.d: "§EFiquem na sua, alienígenas.§!"
 action.1.b: "§EEscória Alienígena.§!"
 action.1.ds: "§ESentimos a presa.§!"
 action.1.c: "§EEstamos felizes em conhecê-los, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.e: "§ENão desejamos nada além da sua amizade, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.hm: "§ENosso coletivo saúda vocês em amizade, [contact_speaker.GetSpeciesNamePlural].§!"
 #action.1.g: "Our superior collective greets you, [contact_speaker.GetSpeciesNamePlural]."
 action.1.h: "§ETodos os nossos cidadãos mandam lembranças, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.selective: "Saudações, colega [root.GetSpeciesClass&x]!"
 #action.1.i: "We pursue perfection - do not stand in our way."
 action.1.j: "§ENossos guerreiros o saúdam, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.k: "§ERespeite nossa autoridade, caso contrário.§!"
 action.1.l: "§EQue a paz esteja convosco, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.m: "§ENão desejamos conflito, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.n: "§EEste encontro certamente é uma benção.§!"
 action.1.o: "§ELouvemos o divino por este encontro!§!"
 action.1.p: "§ETodos temos muito a ganhar com este encontro.§!"
 action.1.q: "§EO caminho para frente está em nossas mãos, [contact_speaker.GetSpeciesNamePlural]!§!"
 action.1.aa: "§ENão nos importamos com sua moralidade frívola!§!"
 action.1.ab: "§EVocê segue o caminho da heresia, escória alienígena!§!"
 action.1.ac: "§ENão aceitamos muito bem o seu tipo!§!"
 #action.1.ad: "Your kind will not threaten our unity."
 action.1.ae: "§EFique longe do nosso caminho ou lhe obrigaremos a isso!§!"
 action.1.af: "§ESaudações a você, e ao seu tipo esquisito.§!"
 action.1.ag: "Cooperação certamente beneficiará a todos nós."
 action.1.ah: "O amor é a amizade embalada pela música, [contact_speaker.GetSpeciesNamePlural]!"
 action.1.ai: "Podemos aprender muito um com o outro, [contact_speaker.GetSpeciesNamePlural]."
 action.1.aj: "Juntos podemos alcançar a grandeza, [contact_speaker.GetSpeciesNamePlural]!"
 action.1.ak: "Como companheiros exploradores estelares, nós o saudamos."
 action.1.al: "§ESaudamo-lhes como iguais e amigos, viajantes estelares.§!"
 action.1.am: "Dividimos a mesma herança divina, [contact_speaker.GetSpeciesNamePlural]."
 action.1.an: "Vocês descobrirão que não são páreos para nós, [contact_speaker.GetSpeciesNamePlural]."
 action.1.ao: "Lutaremos pelo nosso direito de existir, [contact_speaker.GetSpeciesName]."
 action.1.ap: "O [From.GetName] não lhes deseja mal."
 action.1.aq: "Que os espíritos os guiem aos seus objetivos."
 #action.1.ar: ""Who is [From.GetRulerName]?" This is [From.GetRulerName] speaking."
 action.1.as: "Nossos cidadãos os saúdam em paz."
 action.1.at: "Saudaremos vocês de maneira apropriada durante a batalha!"
 action.1.au: "Nossos armamentos sagrados não hesitarão, [contact_speaker.GetSpeciesNamePlural]."
 action.1.av: "Novos amigos levam este para mais perto da divindade."
 action.1.aw: "Não seremos impedidos, [contact_speaker.GetSpeciesNamePlural]."
 action.1.ax: "Vocês devem jogar fora seus costumes antigos, [contact_speaker.GetSpeciesNamePlural]."
 action.1.aaa: "Alcançaremos a unidade, não fique no nosso caminho!"
 action.1.aab: "Não interfiram nas nossas empreitadas, alienígenas."
 action.1.aac: "Somos o instrumento do vazio, fracotes."
 action.1.aad: "Aqueles que blasfemam queimarão, hereges xeno!"
 action.1.aae: "No fim das contas, vocês abraçarão o bem maior."
 action.1.me: "§EIniciar protocolo de saudação amigável.§!"
 action.1.mt: "§EAlvo identificado. Buscar e destruir.§!"
 action.1.mtm: "§EAlvo identificado como não-orgânico. Baixando as armas.§!"
 action.1.ma: "§EJunte-se a nós.§!"
 action.1.ms: "§EProteger e Servir.§!"
 action.1.r: "§ENão interfiram com a providência divina, máquinas [contact_speaker.GetAdj].§!"
 action.1.s: "§EConstruções desalmadas! Não fiquem nos nosso caminho.§!"
 action.1.t1: "§EVocê acabará vendo as coisas do nosso jeito, no fim.§!"
 action.1.t2: "§EOs espíritos não olham com bons olhos para esta reunião, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.t3: "§EA entidade política [Root.GetGovernmentName] estará observando vocês.§!"
 action.1.t4: "§EProtocolos de vigilância ativados§!"
 action.1.t5: "§EAssimilação agendada adiada.§!"
 action.1.t6: "§EEncerramento agendado adiado.§!"
 action.1.u1: "§EVocês serão nossos amigos, caso queiram ou não.§!"
 action.1.u2: "§EVocês servirão ao [Root.GetRulerTitle], queiram ou não.§!"
 action.1.u3: "§EComo um, destruiremos vocês.§!"
 action.1.u4: "$action.1.m$"
 action.1.u5: "$action.1.t3$"
 action.1.u6: "$action.1.ae$"
 action.1.va: "§EApesar de suas antigas transgressões, nós perdoamos você.§!"
 action.1.vb: "§EDeixe-nos em paz.§!"
 action.1.vc: "§EAcha mesmo que vamos confiar em você?§!"
 action.1.vd: "§ESomos iguais, então saudamos você.§!"
 action.1.ve: "§EMuito bem. Estamos cientes de você.§!"
 action.1.vf: "§ENós não esquecemos. E não vamos perdoar.§!"
 action.2.desc_01: "O que é isto aqui? Quem são vocês? Estão nos enganando, é claro. Alienígenas não existem!"
 action.2.desc_02: "Incrível! Visitantes vindos das estrelas? Que inesperado. Estamos meio em desvantagem."
 action.2.desc_03: "Visitantes de outro mundo? Sempre achamos que devia haver outros seres sencientes por aí, mas mesmo assim, isto é fenomenal! Não sabemos bem como agir."
 action.2.desc_04: "Há muito tempo queríamos fazer contato com alguém. Em uma galáxia tão vasta e magnífica, sabíamos que devia haver outros como nós."
 action.2.desc_05: "Ah! Finalmente decidiram se revelar. Já faz um tempo que vocês têm observado o nosso mundo, não é?"
 action.2.desc_06: "Ah, aí estão vocês! Ficamos tanto tempo esperando que vocês iniciassem o contato que decidimos dar o primeiro passo. O que vai acontecer agora?"
 action.2.desc_07: "Invasores! Não sabemos por que vocês nos atacam, mas saibam que vamos lutar para defender nosso planeta! Não vamos nos render!"
 action.2.desc_solarpunk: "Ah, é assim que vocês se comunicam? Observamos vocês desde que entraram pela hiperestrada, mas não havíamos entendido essa parte. Não é perigoso viajar naquelas caixas de metal?\n\nParece que temos muito a ensinar uns aos outros, então se essa for a intenção, vocês podem ficar aqui. Agora, se quiserem tomar o nosso lar, fiquem sabendo que não somos indefesos."
 action.2.a: "§ESaudações, amigos.§!"
 action.2.b: "§ECriaturas horrorosas... A aparência de vocês nos dá nojo.§!"
 action.2.c: "§ESaudações abençoadas para vocês e o mundo que habitam.§!"
 action.2.d: "§ESaudações, camaradas.§!"
 action.2.e: "§EVamos organizar a existência caótica de vocês. Aguardem.§!"
 action.2.f: "§ENós viemos em paz.§!"
 action.2.g: "§ESomos mais parecidos do que vocês imaginam.§!"
 action.2.h: "§EVocês se consideram uma civilização avançada? Que gracinha.§!"
 action.2.i: "§ENós somos um. Vocês são muitos.§!"
 action.2.j: "§ENós somos um. Vocês também são um. Agora há dois.§!"
 action.2.k: "§EEsperamos desenvolver uma relação proveitosa com vocês.§!"
 action.4.name: "Violação de Fronteira"
 action.4.message: "Violação de Fronteira"
 action.4.desc_01: "A presença do §Y[From.From.GetName]§! no sistema §Y[From.From.From.GetName]§!, constitui um rompimento claro de nossas fronteiras. Seremos forçados a considerar isso um ato de guerra, a não ser que você se retire imediatamente."
 action.4.desc_02: "Detectamos o §Y[From.From.GetName]§! no sistema §Y[From.From.From.GetName]§!, em violação direta de nosso território. Isto é o prelúdio de uma invasão, ou você se retirará de nosso espaço?"
 action.4.desc_03: "Suas cartas estelares parecem estar desatualizadas, amigos. Detectamos o §Y[From.From.GetName]§! viajando dentro de nossas fronteiras, no sistema §Y[From.From.From.GetName]§!. Por mais que desfrutemos da companhia deles, devemos pedir que você retire suas naves de nosso território."
 action.4.desc_04: "Nossos sensores pegaram o §Y[From.From.GetName]§! dentro do sistema §Y[From.From.From.GetName]§!. Eles precisam de alguma ajuda? Se não, então pedimos que vocês os retirem do nosso espaço."
 action.4.desc_05: "Suas forças covardes romperam as fronteiras de [From.GetName]. Agora mesmo, o §Y[From.From.GetName]§! está nos espiando no sistema §Y[From.From.From.GetName]§! que pertence a nós por direito. Achou que não perceberíamos esta violação flagrante da lei interestelar?"
 action.4.desc_06: "Suas forças violaram deliberadamente nossas fronteiras no sistema §Y[From.From.From.GetName]§!. Por todos os direitos já deveríamos estar em guerra, mas no interesse de manter a paz galática, nosso governo decidiu lhe dar uma última chance de retirar o §Y[From.From.GetName]§! do nosso espaço."
 action.4.desc_07: "Detectamos o §Y[From.From.GetName]§! no sistema §Y[From.From.From.GetName]§!. Como você sabe, esta estrela está dentro de nossas fronteiras, então devemos pedir respeitosamente que você remova seus implementos de destruição do nosso espaço."
 action.4.desc_08: "Amigos, temo que o §Y[From.From.GetName]§! se aventurou em nosso espaço, no sistema §Y[From.From.From.GetName]§!. Um erro de navegação, talvez? Por favor, informe-lhes sobre este erro para que eles possam retornar para casa de maneira segura."
 action.4.desc_09: "Nossos sensores pegaram o §Y[From.From.GetName]§! no sistema §Y[From.From.From.GetName]§!. Não queremos suas naves de guerra perversas vadiando dentro do nosso espaço. Nosso governo exige a retirada imediata deles!"
 action.4.desc_10: "Retire suas naves primitivas do sistema §Y[From.From.From.GetName]§!, ou não as verá novamente. Não pediremos de novo."
 action.4.desc_11: "Suas naves. Retire-as de §Y[From.From.From.GetName]§!."
 action.4.desc_12: "Devemos pedir que você retire suas pequenas naves do sistema §Y[From.From.From.GetName]§!. Para a própria segurança delas, é claro."
 action.4.desc_13: "Você retirará suas naves estelares patéticas do sistema §Y[From.From.From.GetName]§! de uma vez."
 action.4.desc_14: "Suas naves no sistema §Y[From.From.From.GetName]§! estão interferindo com os nossos planos para esta região na galáxia. Retire-as agora!"
 action.4.desc_15: "Ela está no nosso espaço. O cheiro é arrasador em §Y[From.From.From.GetName]§!. Ela deve recuar."
 action.4.a.neutral.1.response: "Bom. Não repita esta violação."
 action.4.a.neutral.2.response: "Então, por favor, saia do nosso sistema de uma vez."
 action.4.a.friendly.1.response: "Obrigado por resolver este problema prontamente."
 action.4.a.friendly.2.response: "Então esqueçamos que este incidente aconteceu."
 action.4.a.hostile.1.response: "Sim, corra de volta para [Root.Capital.GetName]!"
 action.4.a.hostile.2.response: "Bom. Porém, não pense que esqueceremos esta transgressão."
 action.4.a.pacifist.neutral.response: "Excelente. Sabíamos que poderíamos chegar a um acordo."
 action.4.a.pacifist.friendly.response: "Excelente. Então desejo bons ventos a eles!"
 action.4.a.pacifist.hostile.response: "Bom. Talvez ainda exista esperança para você."
 action.4.a.fallen.empire.1.response: "Você faz bem em obedecer, criança."
 action.4.a.fallen.empire.2.response: "Bom."
 action.4.a.fallen.empire.3.response: "Esplêndido!"
 action.4.a.fallen.empire.4.response: "Fim da transmissão."
 action.4.a.fallen.empire.5.response: "Então, o problema foi resolvido."
 action.4.a.fallen.empire.6.response: "Ele obedece. Bom."
 action.4.b.neutral.1.response: "Defenderemos nosso espaço até o último [From.GetSpeciesName]!"
 action.4.b.neutral.2.response: "Então é como temíamos. Você se arrependerá desta decisão."
 action.4.b.friendly.1.response: "E pensar que considerávamos vocês como amigos..."
 action.4.b.friendly.2.response: "De todas as traições...! Eu... você... não tenho palavras..."
 action.4.b.hostile.1.response: "Pobres tolos. A história se lembrará deste dia como o começo do fim do [Root.GetName]."
 action.4.b.hostile.2.response: "Ninguém pode dizer que não tivemos paciência com o seu tipo miserável, [Root.GetSpeciesName]. Agora varreremos vocês das estrelas!"
 action.4.b.pacifist.neutral.response: "Ó céus."
 action.4.b.pacifist.friendly.response: "O quê? Deve haver algum erro... O software de tradução está funcionando corretamente?  Vocês... vocês não vão acreditar nisso, amigos, mas de acordo com a minha tela, vocês acabaram de declarar guerra!"
 action.4.b.pacifist.hostile.response: "Aff... por que vocês recorrem à violência tão rápido?"
 action.4.b.fallen.empire.1.response: "Uma pena que o seu tempo entre as estrelas será tão curto."
 action.4.b.fallen.empire.2.response: "Então, que seja assim."
 action.4.b.fallen.empire.3.response: "A geração atual de nações interestelares tem se mostrado incrivelmente agressiva! Fascinante. Devemos investigar isso mais a fundo após vocês terem sido pacificados."
 action.4.b.fallen.empire.4.response: "Outro incômodo que deve ser erradicado."
 action.4.b.fallen.empire.5.response: "Mais um obstáculo para ser superado!"
 action.4.b.fallen.empire.6.response: "Um teste! Está aqui para nos testar! Por fim, a espera acabou."
 action.4.a: "Recuaremos imediatamente."
 action.4.b: "Nossas forças estão aqui para ficar. (DECLARAR GUERRA)"
 action.5.name: "[primitive_civ.GetName] Encontrada"
 action.5.desc_00: "Detectamos a presença de uma protocivilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Nossas sondas mostram que a cultura neolítica deles já dominou o fogo e uma língua falada rudimentar, mas nós ainda não vimos provas de metalurgia ou comunicação escrita.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_01: "Detectamos a presença de uma civilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Parece que eles estão nos estágios finais de uma Idade do Bronze, tendo dominado o princípio da metalurgia. Apesar de boa parte da população ser rural, muitas cidades-estados de grande porte foram formadas.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_02: "Detectamos a presença de uma civilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Eles avançaram até o estágio equivalente a uma Idade do Ferro, e estão divididos em vários pequenos reinos e impérios. Sua espécie se espalhou por quase toda a superfície do mundo.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_03: "Detectamos a presença de uma civilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. No momento, eles estão no que pode ser considerada uma Baixa Idade Média, com um bom domínio de metalurgia e uma sociedade feudal. A imprensa está acelerando a propagação do conhecimento.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_04: "Detectamos a presença de uma civilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Parece que eles estão passando por um período equivalente à Renascença, tendo deixado a Idade Média para trás. O conhecimento científico está se espalhando rapidamente e os exércitos dos pequenos reinos estão equipados com armas de projéteis rudimentares baseadas em pólvora.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_05: "Detectamos a presença de uma civilização alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Eles entraram no início de uma Idade do Vapor, e há claras evidências de que estão começando a usar tanto veículos como fábricas primitivas, impulsionadas por motores a vapor.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_01: "Detectamos a presença de uma civilização pré-espacial em §Y[primitive_civ.Capital.GetName]§! no sistema §Y[primitive_civ.Capital.GetStarName]§!. Eles estão no princípio de uma Idade Industrial, com motores elétricos e de combustão interna gradualmente entrando em uso mais comum.\n\nDevemos considerar construir um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_02: "Detectamos a presença de uma civilização alienígena pré-espacial em §Y[primitive_civ.Capital.GetName]§! no sistema §Y[primitive_civ.Capital.GetStarName]§!. Contaminantes atmosféricos e uma leve poluição visível da órbita são consistentes com uma sociedade populosa da Idade das Máquinas. Eles parecem ter dominado a viagem aérea, e fábricas estão produzindo bens em massa nas cidades.\n\nDevemos considerar construir um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_03: "Detectamos a presença de uma civilização alienígena pré-espacial em §Y[primitive_civ.Capital.GetName]§! no sistema §Y[primitive_civ.Capital.GetStarName]§!. Há evidências que eles extraíram o poder do átomo, e as armas nucleares podem ser prolíficas entre os vários Estados Nação divididos. A possibilidade de um evento de extinção auto causado é alto.\n\nDevemos considerar construir um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_04: "Detectamos a presença de uma civilização alienígena em §Y[primitive_civ.Capital.GetName]§! no sistema §Y[primitive_civ.Capital.GetStarName]§!. Parece que eles estão no Início da Idade Espacial, conforme evidenciado pelos vários satélites primitivos em órbita do seu mundo natal. Seus Estados Nação estão no caminho rumo a um governo global, e é só uma questão de tempo até que eles se aventurem além do seu mundo e se juntem à comunidade galática.\n\nDevemos considerar construir um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_00_hive: "Detectamos a presença de uma protocivilização gestalt alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Nossas sondas mostram que a cultura neolítica deles já dominou o fogo e uma língua falada rudimentar para a comunicação entre colmeias, mas nós ainda não vimos provas de metalurgia ou comunicação escrita.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_01_hive: "Detectamos a presença de uma civilização gestalt alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Parece que eles estão nos estágios finais de uma Idade do Bronze, tendo dominado o princípio da metalurgia. Apesar de boa parte da população ser rural, diversos coletivos de colmeias maiores foram formados.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_02_hive: "Detectamos a presença de uma civilização gestalt alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Eles avançaram até o estágio equivalente a uma Idade do Ferro, e estão divididos em diversas colmeias menores, além de alguns aglomerados maiores. Sua espécie se espalhou por quase toda a superfície do mundo.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.5.desc_03_hive: "Detectamos a presença de uma civilização gestalt alienígena [GetPreFTLLower&x] em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. No momento, eles estão no que pode ser considerada uma Baixa Idade Média, com um bom domínio de metalurgia e comunidades de colmeia maiores. A imprensa está acelerando a propagação do conhecimento e da compreensão entre as mentes.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_03_hive: "Detectamos a presença de uma civilização gestalt alienígena pré-espacial em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Há evidências de que eles extraíram o poder do átomo, e as armas nucleares podem ser abundantes entre as várias colônias de colmeias fragmentadas. A possibilidade de um evento de extinção autoinfligido é alta.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.desc_04_hive: "Detectamos a presença de uma civilização gestalt alienígena em §Y[primitive_civ.Capital.GetName]§!, no sistema §Y[primitive_civ.Capital.GetStarName]§!. Parece que eles estão no início da Idade Espacial, conforme evidenciado pelos vários satélites primitivos em órbita no seu mundo natal. As mentes-colmeias locais estão no processo de combinação para formar uma consciência unificada, e é só uma questão de tempo até que eles se aventurem além do seu mundo e se juntem à comunidade galáctica.\n\nDevemos considerar a construção de um §YPosto de Observação§! acima do mundo deles para estudá-los mais de perto."
 action.6.name: "Piratas Encontrados"
 #action.6.desc: "We have sighted hostile ships in the [From.From.GetStarName] system! They are not responding to hails, and their designs are obviously not of [Root.GetSpeciesName] origin. It seems like they are mostly focused on looting our orbital stations, stripping them of valuable resources and technology while taking their crews captive."
 #action.6.a: "Pirates. We don't need that scum."
 action.10.name: "Encontro em [From.From.From.GetName]"
 action.10.desc: "Encontramos naves de origem desconhecida no sistema [From.From.From.GetName]! Elas foram marcadas como §Y[From.GetName]§! até que possamos aprender mais sobre elas.\n\nDevemos tomar cuidado, caso sejam hostis."
 action.10.a: "Interessante."
 action.11.name: "Comunicações Estabelecidas"
 action.11.desc: "Após conseguirmos traduzir sua língua, estabelecemos comunicações com o [.From.From.GetName]. Canais diplomáticos agora estão abertos e todas as hostilidades foram terminadas."
 action.11.abandoned.desc: "Após conseguirmos traduzir sua língua, estabelecemos comunicações com o [.From.From.GetName]. Enquanto abrimos canais diplomáticos §Yreconhecemos§! eles como os refugiados que abandonamos. Todas as hostilidades foram terminadas por enquanto."
 action.11.a: "Excelente."
 action.13.name: "Comunicações Estabelecidas"
 action.13.desc: "Estamos recebendo uma transmissão do §Y[From.GetName]§!! Eles parecem ter traduzido nossa língua. Os canais diplomáticos estão abertos e todas as hostilidades entre nós foram cessadas por enquanto."
 action.13.abandoned.desc: "Estamos recebendo uma transmissão do §H[From.GetName]§!! Eles parecem ter traduzido nossa língua. Enquanto eles abriam os canais, pudemos §Yreconhecê-los§! como os refugiados que havíamos abandonado. As hostilidades entre nós foram cessadas por enquanto."
 action.13.nomad.desc: "Estamos recebendo uma transmissão do §Y[From.GetName]§!! Eles parecem ter um sistema avançado de comunicação interna que não conseguimos discernir, e traduziram nossa língua enquanto estavam dormentes em nosso sistema."
 action.13.a: "Interessante."
 action.13.c: "Eles de novo não..."
 action.14.name: "Subjugando [GetPreFTLUpperPlural&x]"
 action.14.desc: "Nossos exércitos conseguiram invadir e subjugar as forças primitivas em §Y[conquered_primitive_world.GetName]§!. Os locais desistiram completamente de lutar e agora absorvemos sua civilização ao nosso império. Porém, por eles serem atrasados, pode ser que leve um tempo até os nativos se tornarem membros plenamente produtivos do povo [Root.GetAdj]." #Also for Slavers
 action.14.desc.serv: "Nossas forças de paz conseguiram pacificar os [GetPreFTLLowerPlural&x] em §Y[conquered_primitive_world.GetName]§!. Os [conquered_primitive_species.GetNamePlural] foram coagidos a cessar suas pitorescas tentativas de resistência ao perceberem que desejávamos apenas servi-los. Eles estão sendo transportados para habitats especialmente desenvolvidos, onde garantiremos que não passarão por nenhuma privação. Infelizmente, pode levar algum tempo até que suas mentes subdesenvolvidas se acostumem a estarem livres do fardo da autonomia."
 action.14.desc.assim: "Os orgânicos primitivos em §Y[conquered_primitive_world.GetName]§! foram subjugados pelas nossas forças de desembarque. Apesar de suas habilidades de combate fracas serem indicadores de uma sociedade subdesenvolvida, nossos robôs de bioanálise concluíram que suas capacidades neurológicas são promissoras. Eles serão assimilados."
 action.14.desc.term: "Nossas unidades Caçadores-Matadores devastaram sem esforço as sofríveis defesas montadas pelos orgânicos primitivos em §Y[conquered_primitive_world.GetName]§!. Quaisquer espécimes restantes estão sendo sistematicamente aniquilados, para que nunca possam evoluir e ameaçar a galáxia com sua agenda orgânica."
 action.14.desc.mach.purge: "Os orgânicos primitivos em §Y[conquered_primitive_world.GetName]§! foram subjugados após montarem uma tentativa rudemente pífia de resistir à nossa incursão terrestre. Quaisquer [conquered_primitive_species.GetNamePlural] restantes serão removidos de acordo com os protocolos de gerenciamento de bioespécies."
 action.14.desc.mach.slave: "Os orgânicos primitivos em §Y[conquered_primitive_world.GetName]§! foram subjugados após montarem uma tentativa rudemente pífia de resistir à nossa incursão terrestre. Quaisquer espécimes sobreviventes serão amalgamados à nossa rede energética."
 action.14.desc.hive.purge: "As mentes fragmentadas dos [conquered_primitive_species.GetNamePlural] primitivos não foram páreo para nossas forças de aterrissagem unificadas em §Y[conquered_primitive_world.GetName]§!, e a superfície agora está sob nosso controle. Os [GetPreFTLLowerPlural] restantes não têm serventia para nós, e serão expurgados do planeta conforme a vontade da [GetGestaltEntityName]."
 action.14.desc.hive.slave: "As mentes fragmentadas dos [conquered_primitive_species.GetNamePlural] primitivos não foram páreo para nossas forças de aterrissagem unificadas em §Y[conquered_primitive_world.GetName]§!, e o planeta agora está sob nosso controle. Os [GetPreFTLLowerPlural&x] restantes agora serão usados como gado para alimentar nossas crias."
 action.14.desc.purge: "Nossos exércitos conseguiram invadir e subjugar as forças [GetPreFTLLower&x] em §Y[conquered_primitive_world.GetName]§!. Os habitantes locais sabiamente escolheram sucumbir ao nosso controle, e agora começamos a expurgá-los do planeta de acordo com nossa política de conquista a fim de preparar o terreno para a indústria do povo [Root.GetAdj]."
 action.14.a: "Nosso Império cresce."
 action.14.a.phobe: "Os xenos não são páreo para nós."
 action.14.a.military: "Para eles, nossas armas devem parecer mágica."
 action.14.a.spirit: "Nosso direito divino brilha verdadeiramente."
 action.14.a.material: "A evolução deles será beneficiada pelo nosso controle."
 action.14.a.serv: "Eles serão biotroféus adoráveis!"
 action.14.a.assim: "Iniciar sublimação de Identidade."
 action.14.a.term: "Iniciando testes de armas..."
 action.14.a.mach: "Recebido."
 action.14.a.tooltip: "Modificador §YChoque Cultural Estelar§! adicionado a §H[From.From.From.GetName]§!, reduzindo drasticamente sua produção e estabilidade por muitos anos."
 action.15.desc: "Encontramos um tipo de nave alienígena no sistema §Y[From.From.From.GetName]§!  Estes objetos estranhos foram marcados como §Y[From.GetName]§! até que possamos aprender mais sobre eles.\n\nDevemos proceder com cautela..."
 action.15.desc.enclave: "Encontramos um tipo de nave alienígena no sistema §Y[From.GetName]§! \" Estes objetos estranhos foram marcados como §Y[target_enclave.GetName]§! até que possamos aprender mais sobre eles.\n\nDevemos proceder com cautela..."
 action.20.name: "A Lei Entra em Vigor"
 action.20.desc: "Inteligência artificial, em qualquer formato ou forma, foi declarada ilegal por todo o [Root.GetName], e as autoridades começaram a desmanchar todas as unidades robóticas que violam esta lei.\n\nAs Unidades de Montagem Robóticas responsáveis por produzir estas unidades também estão sendo reaproveitadas para fabricar robôs mais simples, e que não sejam capazes de pensar."
 action.20.a: "Bom. Devemos nos livrar destas abominações."
 action.20.tooltip: "Todos os Pops Droides e Sintéticos estão sendo expurgados.\nUnidades de Montagem de Sintéticos e de Droides estão sendo convertidas em Unidades de Montagem Robóticas"
 action.62.name: "Fim do [LastKilledCountryName]"
 action.62.desc: "A nação estelar anteriormente conhecida como o §H[LastKilledCountryName]§! foi destruída por seus inimigos. Como isso afetará o clima político da galáxia ainda é incerto."
 action.63.name: "$action.62.name$"
 action.63.desc: "O antigo Estado precursor de §H[LastKilledCountryName]§! encontrou o seu final nas mãos de seus inimigos. Ainda não se sabe o que a queda deste até então grande império significará para a política galáctica."
 action.71.name: "Líder Sintético Fora de Operação"
 action.71.desc: "A tripulação de [malfunctioning_leader_fleet.GetName] relatou que [malfunctioning_leader.GetName], oficial da equipe científica, sofreu um erro crítico, ficando permanentemente inoperante."
 action.72.name: "$action.71.name$"
 action.72.desc: "Em uma surpresa amargamente irônica, [malfunctioning_leader.GetName], cientista que tanto prezava pelo cuidado dos seus equipamentos, sofreu um erro crítico devido a uma falta prolongada de manutenção pessoal."
 action.73.name: "$action.71.name$"
 #action.73.desc: "Scientist [malfunctioning_leader.GetName] has suffered a critical malfunction, rendering the Society research effort leaderless."
 action.74.name: "$action.71.name$"
 action.74.desc: "O cientista [malfunctioning_leader.GetName] sofreu um erro crítico após exposição prolongada a uma amostra geológica altamente radioativa, devido a um medidor de radiação interno com defeito."
 action.75.name: "$action.71.name$"
 action.75.desc: "Comandante [malfunctioning_leader.GetName] sofreu um erro terminal devido a um problema de fabricação."
 action.76.name: "$action.71.name$"
 action.76.desc: "O Governador [malfunctioning_leader.GetName] sofreu um erro crítico - \"bricking\" - após a infeliz instalação de um firmware corrompido durante uma manutenção de rotina."
 #End of War messages
 action.37.name: "Vitória Contra o §H[From.GetName]§!"
 action.37.message: "Vencemos a guerra contra o §H[From.GetName]§!"
 action.37.desc.default: "Esta guerra acabou. Admitimos a derrota."
 action.37.a: "O melhor resultado possível."
 action.38.name: "Derrota Contra o §H[From.GetName]§!"
 action.38.message: "Perdemos a guerra contra o §H[From.GetName]§!"
 action.38.desc.default: "Esta guerra acabou. Somos vitoriosos."
 action.38.a: "O pior resultado possível."
 action.38.b: "Obrigado?"
 action.39.name: "Paz Branca Contra o §H[From.GetName]§!"
 action.39.message: "Assinamos uma paz branca na guerra contra o §H[From.GetName]§!"
 action.39.desc.default: "Esta guerra acabou. Não pode haver vencedor neste momento."
 action.39.a: "Aceitamos isso por enquanto."
 action.37.desc.hw: "Seja por meios honrados ou desonrados, vocês nos venceram em combate. Reivindiquem seus espólios e temam o dia do nosso retorno."
 action.37.desc.rc: "Parece que subestimamos o seu valor líquido, [Root.GetSpeciesNamePlural]. Fique tranquilo, isso não acontecerá novamente."
 action.37.desc.pt: "Seu terror constante nos forçou a conceder. Que nossos empreendimentos nunca sejam atormentados por um conflito como esse novamente."
 action.37.desc.hi: "Admitimos a derrota, mas não pense nisso como nada além de um revés temporário para o [This.GetName]."
 action.37.desc.fb: "Fomos forçados a encerrar este conflito para poupar vidas inocentes, mas continue neste caminho e uniremos a galáxia contra você."
 action.37.desc.xi: "Somos forçados a nos rendermos, mas não pense que esquecemos como você foi insensível ao tirar vidas [This.GetSpeciesAdj]! Isso é exatamente o que esperamos do seu tipo."
 action.37.desc.hm: "O [This.GetName] é unânime. Devemos conceder. Seu esforço para limitar nosso crescimento se mostrou bem-sucedido, por enquanto."
 action.37.desc.mf: "Não temos escolha a não ser ceder às suas exigências. Por que vocês fazem isso conosco? Apenas queremos compartilhar esta galáxia com vocês."
 action.37.desc.ez: "Sua vitória é só outro teste para nossa fé. No final, os verdadeiros fiéis prevalecerão."
 action.37.desc.fp: "O que vocês tomarem, tomaremos de volta mil vezes mais. Sua vitória não significará nada quando vocês forem reduzidos a cinzas."
 action.37.desc.dc: "Estamos retirando nossas tropas e cessando as operações militares voltadas ao [Root.GetName]."
 action.37.desc.sd: "Nossas ideias sobre a fraqueza [Root.GetSpeciesAdj] podem ter sido apressadas. Como símbolo de nossa nova experiência, aceitamos suas exigências."
 action.37.desc.dh: "Estamos cansados desta guerra. Peguem o que quiserem e saiam do nosso caminho."
 action.37.desc.ee: "Vocês podem ter mostrado um poder militar superior, mas não confundam isso com uma vitória intelectual."
 action.37.desc.ss: "Ouvimos a dor do cosmos gritando contra este conflito. Para encerrar a dissonância sem sentido, nos rendemos imediatamente."
 action.37.desc.hc: "Pelo bem de todo o [This.GetName], devemos nos render. Mostre a mesma misericórdia magnânima que você esperaria de nós."
 action.37.desc.hg: "Temos que recuar, mas ouça nosso aviso. Você não pode imaginar o que o futuro lhe reserva se você continuar neste caminho."
 action.37.desc.kk: "Você morde a mão que se estende para lhe salvar da destruição. Um dia, seus ancestrais não acreditarão que você rejeitou nossa sabedoria."
 action.37.desc.mi: "Insolentes [Root.GetSpeciesNameInsult]-[Root.GetSpeciesSpawnNamePlural]! Como ousam cantar vitória sobre nós?"
 action.37.desc.eo: "Chegou a hora de recuarmos um passo e observar. Tente não causar muita destruição nas suas empreitadas futuras."
 action.37.desc.fme: "Processo de punição falhou. Protocolos de auto-defesa encerrados. Protocolos de rendição iniciados."
 action.37.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.37.desc.mh: "Metal."
 action.37.desc.feh: "Não. Não é assim que deve ser. A confusão. O que está errado conosco?"
 action.37.desc.aew: "Finalmente, um oponente digno..."
 action.37.desc.aec: "Sob a nossa tutela, vocês poderiam ter sido muito mais. Vocês não compreendem, mas tudo o que queremos é aperfeiçoar a galáxia."
 action.37.desc.aeg: "Não! Vocês não podem pegar a nossa comida. Os drones vão morrer de fome! Devolva..."
 action.38.desc.hw: "Vencemos vocês em um combate nobre, conforme as tradições [This.GetSpeciesAdj]. Temos o privilégio e a obrigação de ditar os termos."
 action.38.desc.rc: "Você negociou bem, mas no final o nosso lance foi maior. Não subestime a força de um exército bem financiado em um mercado não regulado."
 action.38.desc.pt: "Finalmente, podemos colocar este conflito para trás. Esperamos que isso tenha ensinado a você o preço da guerra."
 action.38.desc.hi: "Finalmente o frágil [Root.GetName] caiu aos nossos pés. Apenas mais um degrau em nossa estrada rumo à supremacia galática."
 action.38.desc.fb: "Nós dois pagamos um preço alto por esta guerra, mas esperamos que você tenha aprendido a não ameaçar o [This.GetName] ou os seus aliados."
 action.38.desc.xi: "Expulsamos a ameaça [Root.GetSpeciesAdj]! Nossas fronteiras e o futuro [This.GetSpeciesAdj] estão mais uma vez seguros."
 action.38.desc.hm: "Esta guerra sempre foi um esforço fútil da sua parte. Ninguém consegue resistir à expansão do [This.GetName]."
 action.38.desc.mf: "Fomos misericordiosos em nossas exigências para que vocês não carreguem ressentimento contra o povo [This.GetSpeciesAdj] nos seus corações."
 action.38.desc.ez: "Ajoelhe, infiel! Vocês batalharam contra os arautos da divina providência e pagaram o preço por sua tolice."
 action.38.desc.fp: "Não pense que isso é o fim. Enquanto houver [Root.GetSpeciesNamePluralInsult] na galáxia, não pode haver paz verdadeira."
 action.38.desc.dc: "Demos os passos necessários para trazer liberdade ao povo [Root.GetAdj]. Não fique no caminho de nossa causa nobre novamente."
 action.38.desc.sd: "Você deveria conhecer o seu lugar, [Root.GetSpeciesNamePluralInsult]. Seu povo foi feito para nos servir, não para lutar contra nós."
 action.38.desc.dh: "Se arrependem de interferir com o [This.GetName] agora, [Root.GetSpeciesNameInsult]? Não somos misericordiosos com aqueles que interrompem nosso governo."
 action.38.desc.ee: "Hoje, a razão vence a ignorância. Continue tropeçando na escuridão e você sofrerá mais derrotas contra povos iluminados."
 action.38.desc.ss: "Através desta vitória buscamos restaurar o equilíbrio e a harmonia. Não esperamos que você entenda."
 action.38.desc.hc: "O povo [This.GetAdj] se alegra neste dia de vitória. Nunca mais nossa sociedade pacífica será ameaçada pelos planos maliciosos do [Root.GetName]."
 action.38.desc.hg: "A justiça foi entregue aos profanadores [Root.GetAdj] neste dia. Nossos deveres sagrados foram cumpridos."
 action.38.desc.kk: "Considerem-se sortudos. A derrota em nossas mãos é muito melhor do que continuar no caminho da destruição."
 action.38.desc.mi: "Assim como vocês aprenderam a não levar suas naves perto demais de uma estrela incandescente, agora vocês aprenderam a não incomodar o [This.GetName]."
 action.38.desc.eo: "Foi necessário uma escolha prudente, mas a população [Root.GetSpeciesAdj] não deve ameaçar mais o ecossistema galático por um tempo."
 action.38.desc.fme: "Processo de punição concluído. Protocolos de auto-defesa encerrados. Protocolos de punição iniciados."
 action.38.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.38.desc.mh: "Demolir."
 action.38.desc.feh: "Teria bastado um de nós para derrotar sua resistência fragmentada. Não nos testem outra vez."
 action.38.desc.aew: "Basta, vocês ainda não aprenderam o verdadeiro significado da guerra. Peguem estes recursos e lutem melhor da próxima vez."
 action.38.desc.aec: "Agora escutem os mais velhos. Nós não retornamos para ver tal tolice."
 action.38.desc.aeg: "Mais material para os drones. Mais material para os mundos. Mais. Mais. Mais. Ma-"
 action.39.desc.hw: "Uma guerra sem um vencedor claro é uma situação trágica e vergonhosa, mas às vezes inevitável. Vamos lutar novamente outro dia."
 action.39.desc.rc: "Concordamos em encerrar este conflito com as fronteiras atuais."
 action.39.desc.pt: "Um retorno ao estado normal das coisas e continuação das atividades de épocas pacíficas seria o melhor para todas as partes."
 action.39.desc.hi: "As circunstâncias exigem que esta guerra seja encerrada. [This.GetName] tem coisas mais importantes a fazer do que permanecer neste conflito indefinidamente."
 action.39.desc.fb: "Esperamos que cessar as hostilidades abrirá um novo diálogo diplomático entre o [Root.GetName] e o [This.GetName]."
 action.39.desc.xi: "Por mais que odiemos ver vocês escaparem impunes, esperamos que vocês [Root.GetSpeciesNamePluralInsult] miseráveis tenham pelo menos aprendido a não se meter em nossos negócios."
 action.39.desc.hm: "O [This.GetName] precisa de tempo para se recuperar. \"Concordamos em encerrar nosso conflito aqui."
 action.39.desc.mf: "Sem exigências adicionais de qualquer lado, esperamos que o processo de cura possa ser reduzido. Não guarde rancor dos [This.GetSpeciesName] pelo que foi feito."
 action.39.desc.ez: "Somos forçados a por um fim a isso sem atingir a justiça apropriada, mas você não pode escapar da punição divina que cairá sobre você."
 action.39.desc.fp: "Considere isso como um cessar-fogo. Não desistimos de nossa missão para erradicar o [Root.GetSpeciesName]."
 action.39.desc.dc: "Negociar uma trégua pode ser visto como o primeiro passo em direção a uma conversa diplomática sobre as liberdades do povo [Root.GetAdj]."
 action.39.desc.sd: "[From.GetSpeciesNamePlural] preguiçosos não serviriam nem mesmo como escravos para nós. A paz pode ser a melhor opção, afinal de contas."
 action.39.desc.dh: "Um final totalmente chato para uma guerra totalmente chata. Vamos voltar às melhores coisas da vida."
 action.39.desc.ee: "Encerrar a guerra agora sem concessões adicionais de qualquer lado é o mais racional a se fazer, a julgar pelo estado atual."
 action.39.desc.ss: "Se você tentar tirar mais coisas de nós, ou nós de você, um desequilíbrio que não pode ser corrigido seria criado. Um acordo de paz garante um equilíbrio espiritual contínuo."
 action.39.desc.hc: "O povo [This.GetAdj] concordou em encerrar esta guerra imediatamente."
 action.39.desc.hg: "Por enquanto, teremos paz, mas não haverá paz no futuro se você violar os locais sagrados."
 action.39.desc.kk: "Não podemos exigir nada mais de vocês, mas podemos implorar-lhes que considerem nossa sabedoria e o que pode acontecer se a ignorarem."
 action.39.desc.mi: "Vocês merecem ser totalmente esmagados, mas não merecem nosso tempo precioso. A paz parece inevitável no fim das contas."
 action.39.desc.eo: "Nós nos deixamos envolver demais nisso. Vamos fingir que isso nunca aconteceu, e esperar que nunca aconteça novamente."
 action.39.desc.fme: "Processo de punição interrompido. Protocolos de auto-defesa encerrados."
 action.39.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.39.desc.mh: "Não é verdade."
 action.39.desc.feh: "Sim. Voltaremos ao normal. A mudança... A mudança não é boa. Não queremos perturbar o equilíbrio."
 action.39.desc.aew: "Impressionante. Vocês teriam se saído bem em nosso tempo. Talvez pudessem ter defendido Shallash quando outros falharam. Vamos fazer isso outra vez!"
 action.39.desc.aec: "Não temos mais tempo a perder com vocês. A galáxia precisa da nossa orientação. Não nos atrapalhem novamente."
 action.39.desc.aeg: "Sim, já nos saciamos aqui. Há despensas mais bem abastecidas pela galáxia. Não vamos... não podemos... passar fome."
 action.41.name: "Reagrupar"
 action.41.desc.a: "O [From.GetName] foi iniciado enquanto você tinha frotas dentro das fronteiras dos seus novos inimigos."
 action.41.desc.b: "Frotas [From.GetNumPlayerFleetsGoneMIA] estão §RPerdidas em Ação§! para que possam se reagrupar dentro de território amigável."
 action.41.desc.b.1: "Uma frota se tornou Perdida em Ação para poder se reagrupar dentro de território amigável."
 action.41.desc.c: "Estações de buraco de minhoca [From.GetNumPlayerWormholeStationsDestroyed] foram destruídas."
 action.41.desc.c.1: "Uma estação de buraco de minhoca [From.GetNumPlayerWormholeStationsDestroyed] foi destruída."
 ####################################
 #Anomaly Categories
 ####################################
 crashed_ship_asteroid_category: "Nave Acidentada"
 crashed_ship_asteroid_category_desc: "Uma nave de algum tipo caiu na superfície deste asteroide. Destroços da nave ainda podem ser encontrados dentro da cratera de impacto."
 origin_asteroid_category: "Origem Desconhecida"
 origin_asteroid_category_desc: "A composição material deste asteroide difere significativamente dos seus vizinhos. Ela provavelmente tem uma origem diferente dos outros corpos deste cinturão de asteroides, e deve ser investigada mais de perto."
 debris_asteroid_category: "Coberto em destroços"
 debris_asteroid_category_desc: "A superfície deste asteroide está cheia de destroços metálicos. Boa parte dela parece ter se originado de naves estelares de muitos tipos diferentes."
 emissions_asteroid_category: "Emissões Energéticas"
 emissions_asteroid_category_desc: "Fortes emissões energéticas de origem desconhecida fazem com que este asteroide se destaque dos demais neste campo de asteroides populoso."
 hatch_asteroid_category: "Escotilha de Docagem"
 hatch_asteroid_category_desc: "Uma pequena escotilha de docagem no interior deste asteroide é visível na borda de uma pequena cratera na sua superfície. A escotilha provavelmente era escondida, mas desde então foi exposta por impactos de micrometeoritos."
 collision_asteroid_category: "Colisão de Asteroides"
 collision_asteroid_category_desc: "Este asteroide recentemente sofreu um impacto de outro corpo dentro do cinturão de asteroides, o que resultou em uma órbita levemente modificada e uma cratera gigantesca na superfície."
 station_asteroid_category: "Estação Abandonada"
 station_asteroid_category_desc: "Um pequeno tipo de estação espacial foi construído em uma órbita estável ao redor deste asteroide. Ele parece deserto."
 life_asteroid_category: "Sinais de Vida"
 life_asteroid_category_desc: "Estamos pegando sinais de vida vindo de algum lugar dentro deste asteroide. Isso definitivamente merece uma investigação mais próxima."
 object_gasgiant_category: "Objeto Atmosférico"
 object_gasgiant_category_desc: "Ecos de sensores indicaram a presença de algum tipo de objeto não identificado no fundo da atmosfera deste gigante gasoso."
 moon_gasgiant_category: "Lua Promissora"
 moon_gasgiant_category_desc: "Uma das pequenas luas orbitando este gigante gasoso foi identificada como um local de mineração promissor. Uma inspeção mais cuidadosa deve ser feita para determinar se uma operação mineradora seria viável ou não."
 life_gasgiant_category: "Sinais de Vida"
 life_gasgiant_category_desc: "Sinais de vida foram detectados vindo de dentro da atmosfera deste gigante gasoso. Isso poderia indicar a presença de algum tipo de biosfera?"
 storms_gasgiant_category: "Tempestades Atmosféricas"
 storms_gasgiant_category_desc: "Tempestades massivas são visíveis na atmosfera superior deste gigante gasoso. Talvez valha o esforço estudá-las com mais detalhes."
 aerostat_gasgiant_category: "Estruturas Aeróstatas"
 aerostat_gasgiant_category_desc: "Um tipo de estrutura desconhecida está flutuando na atmosfera superior deste gigante gasoso. Eles parecem estar usando levitação aerostática para permanecerem flutuando."
 cargo_gasgiant_category: "Cápsula de Carga"
 cargo_gasgiant_category_desc: "Uma pequena cápsula de carga foi deixada à deriva no espaço, acima do gigante gasoso. Ela foi capturada pelo poço gravitacional do planeta e, eventualmente será puxada para a atmosfera. "
 debris_gasgiant_category: "Destroços Espaciais"
 debris_gasgiant_category_desc: "Há uma quantidade significativa de destroços ao redor deste gigante gasoso. Boa parte parece ter vindo de naves estelares de várias configurações, há muito perdidas."
 impact_uninhabitable_category: "Impacto Massivo"
 impact_uninhabitable_category_desc: "Um impacto de cratera colossal sugere que algo grande já colidiu com a superfície deste [Root.GetPlanetMoon]."
 energy_uninhabitable_category: "Leituras Energéticas Incomuns"
 energy_uninhabitable_category_desc: "Brevemente detectamos leituras energéticas incomuns emanando deste [Root.GetPlanetMoon]. Pode ser um erro em nossos sistemas, ou pode ser o sinal de algo a mais."
 signal_uninhabitable_category: "Sinal Fraco"
 signal_uninhabitable_category_desc: "Por sorte, tropeçamos em um sinal alienígena fraco durante a inspeção de [Root.GetPlanetMoon]. A fonte parece ser um pequeno objeto em órbita. O sinal não contém mensagem - poderia ser um transmissor de emergência?"
 asteroid_uninhabitable_category: "Asteroide em Órbita"
 asteroid_uninhabitable_category_desc: "Um asteroide de classe 12 orbita este [Root.GetPlanetMoon]. A pequena órbita do planetoide parece estar estável demais para a sua presença ser uma ocorrência natural."
 solar_uninhabitable_category: "Veleiro Solar"
 solar_uninhabitable_category_desc: "Uma nave abandonada foi deixada à deriva, sem rumo acima de [Root.GetPlanetMoon]. As gigantescas velas salientes do seu casco sugerem que ela precisava de energia solar para funcionar."
 life_toxic_category: "Sinais de Vida"
 life_toxic_category_desc: "Apesar do conteúdo tóxico e alta pressão da atmosfera deste [Root.GetPlanetMoon], fortes sinais de vida foram detectados vindo da superfície."
 life_frozen_category: "Sinais de Vida"
 life_frozen_category_desc: "No primeiro olhar, [Root.GetPlanetMoon] não parece ser capaz de suportar seres vivos, mas, de qualquer forma, detectamos sinais de vida vindo de algum lugar abaixo de sua superfície congelada."
 life_barren_category: "Sinais de Vida"
 life_barren_category_desc: "Detectamos sinais de vida vindo de algum lugar abaixo da superfície árida e sem vida de [Root.GetPlanetMoon]. Que tipo de organismo poderia viver aqui?"
 station_uninhabitable_category: "Estação Espacial"
 station_uninhabitable_category_desc: "Conforme [Root.GetPlanetMoon] foi inspecionado, uma pequena estação espacial próxima utilizou seus propulsores orbitais em uma tentativa vã de se esconder de nossa Nave Científica. O que eles estão escondendo?"
 battle_uninhabitable_category: "Sinais de Batalha"
 battle_uninhabitable_category_desc: "Uma grande quantidade de destroços de naves pode ser encontrada em órbita ao redor deste [Root.GetPlanetMoon], possivelmente os restos de algum tipo de massiva ação de frotas."
 shipyard_uninhabitable_category: "Estaleiro Antigo"
 shipyard_uninhabitable_category_desc: "Um estaleiro orbital antigo está à deriva silenciosamente acima deste mundo. Ele sofreu dano de batalha significativo, e várias seções da instalação estão faltando."
 inhabited_toxic_category: "Sinais de Antiga Habitação"
 inhabited_toxic_category_desc: "Este mundo tóxico e sem vida parece ter sido habitado por uma civilização pré-espacial moderadamente avançada. As ruínas de suas cidades ainda estão espalhadas pela superfície."
 writing_uninhabitable_category: "Escrita na Superfície"
 writing_uninhabitable_category_desc: "Há cicatrizes significativas na superfície deste mundo em um padrão que não pode ser natural. A partir da órbita, as fendas imensas quase parecem escritos."
 beacon_uninhabitable_category: "Farol de Superfície"
 beacon_uninhabitable_category_desc: "Estamos recebendo um sinal fraco da superfície deste [Root.GetPlanetMoon]. A fonte parece ser algum tipo de farol rastreador."
 mountain_uninhabitable_category: "Formação Montanhosa Estranha"
 mountain_uninhabitable_category_desc: "Esforços para mapear a superfície deste [Root.GetPlanetMoon] identificaram uma estranha cordilheira no hemisfério sul. Ela não parece ter se formado naturalmente."
 object_uninhabitable_category: "Objeto Não Identificado"
 object_uninhabitable_category_desc: "Um pequeno objeto retangular na superfície deste [Root.GetPlanetMoon] está refletindo todos os raios de scanner como se fosse um espelho. Nossos sensores são incapazes de determinar sua composição material."
 signal_gasgiant_category: "Sinal de Gigante Gasoso"
 signal_gasgiant_category_desc: "Estamos pegando o que pode ser uma transmissão fraca vindo de algum lugar de dentro da atmosfera deste gigante gasoso. Poderia alguém - ou algo - estar tentando se comunicar?"
 ship_gasgiant_category: "Nave de Gigante Gasoso"
 ship_gasgiant_category_desc: "O perfil sensorial de uma nave de tamanho médio foi brevemente detectado dentro da atmosfera superior deste gigante gasoso."
 terminal_gasgiant_category: "Órbita Terminal"
 terminal_gasgiant_category_desc: "Uma lua pequena e até então insignificante que está em órbita deste gigante gasoso parece estar em uma trajetória que logo resultará em uma colisão com o planeta."
 vultaum_asteroid_category: "Sinais de Atividade Precursora"
 vultaum_asteroid_category_desc: "Há sinais de atividade de uma antiga civilização precursora neste asteroide."
 vultaum_gasgiant_category: "Sinais de Atividade Precursora"
 vultaum_gasgiant_category_desc: "Há sinais de atividade de uma antiga civilização precursora na vizinhança deste gigante gasoso."
 vultaum_uninhabitable_category: "Sinais de Atividade Precursora"
 vultaum_uninhabitable_category_desc: "Há sinais de atividade de uma antiga civilização precursora nesta pedra inóspita."
