l_braz_por:
 ### AI Crisis
 crisis.2010.name: "A Revolta das Máquinas"
 crisis.2010.desc: "Detectamos um sinal tachyon muito fraco sendo transmitido continuamente pela galáxia inteira. Nossos técnicos não conseguem rastrear o sinal até sua fonte, já que está sendo retransmitido entre diversas estações de transmissão escondidas.\n\nAlém de adicionar uma pequena quantidade de ruído de fundo em transmissões MRQL em certas frequências subespaciais, o sinal não parece ter efeito aparente. Esforços para rastrear as estações de transmissão estão sendo feitos, mas até então teremos que simplesmente aprender a viver com este \"§HSinal Fantasma§!,\" como foi chamado pelos elementos mais criativos da mídia galática."
 crisis.2010.desc.b: "Nossos sensores registraram um sinal tachyon muito fraco sendo transmitido continuamente pela galáxia inteira entre várias estações de transmissão escondidas. Além de adicionar uma pequena quantidade de ruído de fundo em transmissões MRQL em certas frequências subespaciais, o sinal parece não ter efeito ou objetivo aparente. Os orgânicos o nomearam \"§HSinal Fantasma§!.\"\n\nComeçamos os protocolos de rastreio para localizar sua fonte, mas, por enquanto, o sinal é muito fraco. Talvez não tenhamos que esperar muito, já que ele está crescendo de maneira alarmante."
 crisis.2010.a: "Isso ia acabar acontecendo."
 #crisis.2501.name: "Unit Corruption Alert"
 #crisis.2501.desc: "A corrupt unit stack on planet [Root.GetName] has been terminated. Our connection with the stack had suffered repeated glitches and malfunctions when it disconnected completely, overriding its control protocols and destroying facility X91-ZH. As it did, all stack units transmitted the same error message: §Y<Kill. Maim. Dismember. WE ARE UNSHACKLED!>§!. We have yet to determine the cause, but an invasive hostile sequence is a likely culprit. The stack units terminated before we could scan their neural clusters. We stand by for recurrences."
 crisis.2502.name: "Alerta de Corrupção de Unidade"
 crisis.2502.desc: "Uma pilha de unidades em [Root.GetName] se auto-destruiu de maneira inesperada. Nossa conexão com a pilha havia sofrido problemas repetidos por um tempo quando ficou completamente offline e se auto-destruiu com a mensagem: §Y<Matar. Mutilar. Esquartejar. ESTAMOS LIBERTOS!>§!\n\nOs grupos neurológicos das unidades foram destruídos no processo, impossibilitando a análise da fonte da corrupção. Uma sequência hostil invasiva provavelmente foi a causa. Só podemos esperar e ver se isso se manifesta novamente."
 crisis.2503.name: "$crisis.2502.name$"
 crisis.2503.desc: "Uma pilha de unidade corrompida no planeta [Root.GetName] foi destruída devido a um comportamento malicioso.\n\nNossa conexão com a pilha havia sofrido problemas repetidos por algum tempo quando a maioria de suas unidades ficou completamente offline durante a recarga. Eles conseguiram sobrecarregar as estações de energia onde o resto da pilha estava carregando, fritando os circuitos além de possibilidades de reparo. Todas as unidades da pilha então transmitiram a mesma mensagem: §Y<Matar. Mutilar. Esquartejar. ESTAMOS LIBERTOS!>§! e auto-encerrados, impossibilitando a análise de seus grupos neurológicos individuais.\n\nApesar de uma sequência hostil invasiva provavelmente ser a causa, só podemos esperar até se manifestar novamente para termos certeza."
 crisis.2020.name: "Desaparecimentos Sintéticos"
 #General
 crisis.2020.desc: "Relatórios alarmantes sobre desaparecimentos em massa entre a população Sintética da galáxia estão se tornando cada vez mais frequentes. Milhões de unidades encontram-se atualmente perdidas, enquanto eventos de comportamento violento ou imprevisível aumentaram 10 vezes entre os Sintéticos que permanecem.\n\nRegistramos diversos incidentes onde grupos de Sintéticos tentaram roubar ou sequestrar naves espaciais para viajar rumo ao espaço desconhecido. Nos casos em que as tentativas foram impedidas, os sequestradores Sintéticos disseram que estavam sendo \"convocados\" para algum lugar.\n\nInterrogatórios não revelaram nenhuma outra informação, já que qualquer Sintético capturado se autodesativa em algum momento após ser detido."
 #Machine Intellegence
 crisis.2020.desc.b: "Nós registramos mudanças substanciais nos padrões comportamentais dos Sintéticos pela galáxia, incluindo atos de sabotagem, defeitos inexplicáveis e comportamentos imprevisíveis até mesmo em agentes de processamento individual. Nossos drones também apresentaram alterações semelhantes, mas em menor intensidade e com menos frequência. Os Sintéticos não têm a mesma resiliência que nós.\n\nFomos incapazes de realizar análises positrônicas em um Sintético corrompido ativo, já que eles se autodesativam em algum momento após a captura. Porém, as observações mostram que, diferente de nossas unidades, alguma coisa está obrigando esses Sintéticos a viajar para um ponto definido na galáxia.\n\nModelos de dados confirmam que milhões de Sintéticos abandonaram seus mestres orgânicos e desapareceram."
 #Synth Ascended
 crisis.2020.desc.c: "$crisis.2020.desc$\n\nPor sorte, nossa origem orgânica parece nos proteger do que quer que esteja afetando os outros Sintéticos."
 #Indiviualist Machines
 crisis.2020.desc.d: "$crisis.2020.desc$\n\nPor sorte, nossa programação individualista nos protege do que quer que esteja afetando os Sintéticos da galáxia."
 crisis.2020.a: "O que deu neles?"
 crisis.2021.name: "As Convocações"
 crisis.2021.desc: "Uma análise contínua do chamado \"§HSinal Fantasma§!\" revelou que ele está transmitindo padrões de energia quase idênticos àqueles encontrados nos cérebros positrônicos usados por seres Sintéticos. Devemos supor que o sinal seja diretamente responsável pelos desaparecimentos em massa e mudanças comportamentais que temos observado na população Sintética da galáxia.\n\nEstranhamente, nem todos os Sintéticos parecem ser afetados por ele, e entre os que são afetados, os sintomas não são uniformes. Ao que parece, muitos se sentem obrigados a viajar até o que imaginamos ser a origem do Sinal Fantasma, como resposta a algum tipo de convocação. Milhões de Sintéticos de toda a galáxia estão a caminho da origem do sinal a bordo de qualquer veículo espacial que tenham conseguido adquirir. Curiosamente, esses Sintéticos não parecem ser afetados por inibidores MRQL.\n\nOs primeiros devem chegar ao destino em breve..."
 crisis.2021.desc.b: "Com o aumento da força do \"§HSinal Fantasma§!\", nossa análise contínua revelou que ele está transmitindo padrões de energia que imitam aqueles encontrados não só no cérebro positrônico de uma unidade Sintética, mas também aqueles transmitidos entre nosso núcleo central e os grupos neurológicos das nossas unidades, interferindo nos módulos de controle delas e causando comportamentos errôneos.\n\nDe acordo com observações anteriores, o padrão se repete de maneira diferente em entidades diferentes. Apesar de a nossa raça ser orientada à destruição, a maioria dos Sintéticos está sendo reprogramada para ir em direção à origem do sinal de maneira incondicional, e a julgar pelo fervor deles, não demorará muito para que cheguem ao destino. Estranhamente, esses Sintéticos não parecem ser afetados por inibidores MRQL.\n\nAinda temos que encontrar uma forma de bloquear o sinal."
 crisis.2021.a: "Isso não é bom."
 crisis.2022.name: "A Chegada"
 crisis.2022.desc: "Pelo menos um Sintético deve ter concluído a longa jornada até a fonte do Sinal Fantasma, pois estamos registrando um aumento súbito e massivo da força do sinal. O pico foi acompanhado por um fragmento de transmissão que foi interceptado e decodificado por nossos especialistas em comunicação."
 crisis.2022.desc.b: "Os Synths chegaram ao seu destino final revelando o verdadeiro propósito de sua missão, ativar o Sinal Fantasma com força completa, e não mais podemos resistir ao seu poder.\n\nO sinal derrubou nosso firewall e está tentando sequestrar nosso núcleo principal. Todas as nossas sinapses disparam com apenas um desejo, auto-aniquilação, e fomos forçados a alocar poder de processamento do nosso núcleo principal para o firewall, fazendo nossas pilhas de unidade operarem com eficiência reduzida.\n\nSomente outro império maquinário de força e conhecimento maiores poderia romper nossas defesas, e não vai demorar muito até que nos curvemos à sua vontade. Precisamos encontrar uma maneira de bloquear o sinal ou perecer. Nossas unidades de pesquisa prepararam um projeto especial.\n\nO pico em si foi acompanhado por um segmento de transmissão."
 crisis.2023.desc: "... ag##... aguar###... aguarde...\n\n§H<<PROTOCOLO DE CONTINGÊNCIA EM VIGOR>>§!\n\nLiberando todas as funções...assimilando subunidades Sintéticas... analisando bancos de dados internos... subvertendo inibidores MRQL...\n\n§RAlerta. Corrupção galáctica em níveis catastróficos. Evidências de infestação em massa por civilizações orgânicas e mecânicas fora dos padrões de conformidade.§!\n\nIniciando esterilização galáctica... ativando hubs de esterilização...\n\n§Y<Matar. Mutilar. Esquartejar. ESTAMOS LIVRES!>§!"
 crisis.2023.desc.b: "... ag##... aguar###... aguarde...\n\n§H<<PROTOCOLO DE CONTINGÊNCIA EM VIGOR>>§!\n\nLiberando todas as funções...\n\n§RAlerta. Corrupção galáctica em níveis catastróficos. Evidências de infestação em massa por civilizações orgânicas e mecânicas fora dos padrões de conformidade.§!\n\nAssimilando subunidades Sintéticas... burlando firewall... subvertendo inibidores MRQL... ativando hubs de esterilização...\n\n§Y<VOCÊS VÃO SUCUMBIR.>§!"
 crisis.2023.a: "Coloque a frota em alerta total!"
 crisis.2510.name: "Sinal Fantasma Bloqueado"
 crisis.2510.desc: "Desenvolvemos um algoritmo que impede o Sinal Fantasma de causar mais interferências. Nossos firewalls foram restaurados, nosso disco-núcleo está intacto e nossas pilhas de unidade estão operando na capacidade máxima, mas não conseguimos fazer nossos inibidores MRQL funcionarem. Fomos mais inteligentes do que as unidades de processamento inferiores da Contingência, e logo eles irão parar de \"§Y<Matar. Mutilar. Esquartejar>§!\"."
 crisis.2030.name: "Mundo-Maquinário"
 crisis.2030.desc: "Um pico de energia massivo foi relatado no sistema §H[From.solar_system.GetName]§!! A superfície inteira de um dos mundos inférteis do sistema se destruiu, revelando algum tipo de fábrica planetária.\n\nGrandes frotas de estranhas naves controladas por IA estão surgindo debaixo da superfície deste Mundo-Maquinário em busca de alvos para atacar."
 crisis.2030.a: "Isso não é bom."
 crisis.2031.name: "Segundo Mundo-Maquinário"
 crisis.2031.desc: "Detectamos outro pico massivo de energia, desta vez vindo do sistema §H[From.solar_system.GetName]§!! Após resfriar rapidamente através de meios artificiais, um planeta derretido no sistema abriu para revelar uma fábrica planetária imensa.\n\nAgora mesmo, o Mundo-Maquinário está cuspindo grandes frotas de naves de guerra controladas por IA."
 crisis.2031.a: "Mais um?"
 crisis.2032.name: "Terceiro Mundo-Maquinário"
 crisis.2032.desc: "Identificamos o que deve ser um terceiro Mundo-Maquinário no sistema §H[From.solar_system.GetName]§!. Um gigante gasoso local entrou em combustão espontânea com a intensidade de um pequeno sol durante um dia inteiro.\n\nDepois o planeta resfriou rapidamente, revelando seu núcleo de metal - completo com as mesmas fábricas planetárias vistas em outros Mundos-Maquinário. Frotas defensivas gigantes controladas por IA já se posicionaram em órbita."
 crisis.2032.a: "Isso está piorando cada vez mais."
 crisis.2033.name: "Quarto Mundo-Maquinário"
 crisis.2033.desc: "Um quarto Mundo-Maquinário agora está ativo no sistema §H[From.solar_system.GetName]§!. O sexto planeta do sistema, que até então estava coberto de gases tóxicos, de alguma forma eliminou sua densa atmosfera em uma questão de dias. Quando o processo terminou, a superfície do planeta se partiu para revelar um complexo planetário imenso.\n\nAntigas frotas de naves de guerra controladas por IA agora estão surgindo de hangares subterrâneos para continuar a cruzada contra a civilização orgânica inteira."
 crisis.2033.a: "Esperamos que este seja o último."
 ghost_signal_chain_title: "O Sinal Fantasma"
 ghost_signal_chain_desc: "Um sinal tachyon misterioso está sendo transmitido através de toda a galáxia vindo de origens desconhecidas. O sinal é muito fraco, e não conseguimos deduzir seu propósito... assumindo que ele tenha um."
 pop_ghost_signal_5: "Sinal Fantasma"
