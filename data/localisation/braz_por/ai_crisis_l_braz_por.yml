 crisis.2036.name: "O Coração da Contingência"
 crisis.2036.desc: "Com a destruição de todos os quatro Mundos-Maquinário, cientistas conseguiram deduzir o ponto de origem do Sinal Fantasma. Ele vem de §HCX-9881§!, um sistema que até então não estava em nossos mapas na periferia galática.\n\nDeve ter sido para lá que todos os Sintéticos se sentiram atraídos pelo sinal. A Contingência continuará sendo uma ameaça até que resolvamos o problema deste último sistema."
 crisis.2036.desc.b: "Com a destruição de todos os quatro Mundos-Maquinário, deduzimos o ponto de origem do Sinal Fantasma. Ele vem de §HCX-9881§!, um sistema que até então não estava em nossos mapas na periferia galática.\n\nDeve ter sido para lá que todos os Sintéticos corrompidos foram. A Contingência continuará sendo uma ameaça até que resolvamos o problema deste último sistema."
 crisis.2036.a: "Ele deve ser neutralizado."
 crisis.2037.name: "Mundo-Maquinário Destruído"
 crisis.2037.desc: "§H[From.GetName]§!, o Mundo-Maquinário no sistema [From.solar_system.GetName] foi destruído. Após ser submetido a um bombardeio orbital pesado, o Núcleo do planeta IA se auto destruiu para impedir a captura ao ativar um dispositivo de anti-matéria gigantesco escondido abaixo da superfície.\n\nCom a destruição do planeta, o Sinal Fantasma perdeu uma estação de transmissão importante e sua força diminuiu consideravelmente por conta disso.\n\nAlém disso, a explosão no planeta espalhou vários depósitos de \"§HMetal Vivo§!\" na superfície. Este estranho material possui diversas propriedades únicas, e é usado pela Contingência na construção de todas as suas formas de guerra e fábricas."
 crisis.2037.desc.b: "§H[From.GetName]§!, o Mundo-Maquinário hostil no sistema [From.solar_system.GetName] foi destruído. Após ser submetido a um bombardeio orbital pesado, o Núcleo do planeta IA se auto destruiu para impedir a captura ao ativar um dispositivo de anti-matéria gigantesco escondido abaixo da superfície.\n\nCom a destruição do planeta, o Sinal Fantasma perdeu uma estação de transmissão importante e sua força diminuiu consideravelmente por conta disso.\n\nAlém disso, a explosão no planeta espalhou vários depósitos de \"§HMetal Vivo§!\" na superfície. Este estranho material possui diversas propriedades únicas, e é usado pela Contingência na construção de todas as suas formas de guerra e fábricas."
 crisis.2037.a: "Uma vitória para a galáxia inteira."
 crisis.2037.alt.desc: "$crisis.2037.alt.desc.pt1$\n\nCom a perda de mais uma estação de transmissão, o Sinal Fantasma se enfraqueceu ainda mais."
 crisis.2037.alt.desc.pt1: "Mais um Mundo-Maquinário foi destruído! §H[From.GetName]§! no sistema [From.solar_system.GetName] explodiu após as defesas do planeta terem sido dizimadas em batalha. Como antes, o Núcleo IA ativou um mecanismo de auto-destruição para impedir sua captura."
 crisis.2037.alt.machine.desc: "$crisis.2037.alt.desc.pt1$\n\nCom a perda de mais uma estação de transmissão, o Sinal Fantasma se tornou tão fraco que conseguimos bloqueá-lo completamente.\" Nossos firewalls foram restaurados, nosso disco-núcleo está intacto e nossas pilhas de unidade operam a capacidade plena. Fomos mais inteligentes que o poder de processamento inferior da Contingência e logo eles não mais\"§Y<Matar. Mutilar. Esquartejar.!>§!\"."
 crisis.2037.alt.cracked.desc: "§H[From.GetName]§!, o Mundo-Maquinário no sistema [From.solar_system.GetName] foi sujeito ao poder imenso de um raio quebrador de mundo Colosso. A arma cortou a superfície blindada do apartamento com facilidade, detonando seu núcleo e pulverizando as fábricas de guerra subterrâneas da Contingência.\n\nCom a destruição deste planeta, o Sinal Fantasma perdeu uma importante estação de retransmissão e sua força diminuiu consideravelmente por conta disso."
 crisis.2037.alt.shielded.desc: "§H[From.GetName]§!, o Mundo-Maquinário no sistema [From.solar_system.GetName] foi envolvido dentro de um escudo energético impenetrável por um Colosso. Permanentemente separado do resto da Contingência, o Núcleo de IA do planeta parece ter adormecido. Ele não será mais uma ameaça.\n\nCom a neutralização deste planeta, o Sinal Fantasma perdeu uma estação de retransmissão importante e sua força diminuiu consideravelmente por causa disso."
 crisis.2037.alt.godray.desc: "§H[From.GetName]§!, o Mundo-Maquinário no sistema [From.solar_system.GetName] foi neutralizado. Após ter sido sujeito à luz divina de um Colosso, o Núcleo IA do planeta se auto-destruiu antes de seus sistemas finais falharem, usando um dispositivo anti-matéria gigantesco escondido abaixo da superfície. Ele não será mais uma ameaça.\n\nCom a neutralização deste planeta, o Sinal Fantasma perdeu uma estação de retransmissão importante e sua força diminuiu consideravelmente por causa disso."
 crisis.2038.name: "O Fim da Contingência"
 crisis.2038.desc: "A Contingência falhou. Com a destruição do último Mundo-Maquinário, a galáxia não enfrenta mais a ameaça de extinção em massa sistemática. Todas as formas de guerra da Contingência sobreviventes ou foram desligadas ou auto-destruídas, e o Sinal Fantasma não está mais sendo transmitido.\n\nJá nos outros Mundos-Maquinário, o nexus principal se detonou em uma explosão de anti-matéria gigantesca quando ficou aparente que ele não poderia mais resistir aos ataques. Viajando para fora na velocidade da luz, a luz intensa da descarga de energia será visível para gerações futuras nos próximos milênios para aparecer como uma estrela brilhante, mas de pequena vida.\n\nPor toda a galáxia, bens sapientes estão unidos em comemoração por esta grande vitória. Pelo menos por enquanto, o futuro parece brilhante."
 crisis.2038.cracker.desc: "A Contingência falhou. Com a destruição do último Mundo-Maquinário, a galáxia não enfrenta mais a ameaça de extinção em massa sistemática. Todas as formas de guerra sobreviventes da Contingência foram desligadas ou auto-destruídas, e o Sinal Fantasma não está mais sendo transmitido.\n\nO nexus principal foi pulverizado por um raio quebrador de mundo de um Colosso, que destruiu o planeta inteiro. Viajando para fora na velocidade da luz, a luz intensa da descarga de energia será visível para gerações futuras nos próximos milênios para aparecer como uma estrela brilhante, mas de pequena vida.\n\nPor toda a galáxia, bens sapientes estão unidos em comemoração por esta grande vitória. Pelo menos por enquanto, o futuro parece brilhante."
 crisis.2038.shield.desc: "A Contingência falhou. Com a neutralização do último Mundo-Maquinário, a galáxia não enfrenta mais a ameaça de extinção em massa sistemática. Todas as formas de guerra sobreviventes da Contingência foram desligadas ou auto-destruídas, e o Sinal Fantasma não está mais sendo transmitido.\n\nAbrigado por um escudo energético impenetrável por um Colosso, o nexus principal não pode mais influenciar eventos externos. Pelo bem das gerações futuras, só podemos esperar que o escudo segure... mas, por enquanto, pelo menos, o planeta blindado servirá como um monumento da queda da Contingência.\n\nPor toda a galáxia, seres sapientes estão unidos em comemoração por esta grande vitória. Pelo menos por enquanto, o futuro parece brilhante."
 crisis.2038.godray.desc: "A Contingência falhou. Com a destruição do último Mundo-Maquinário, a galáxia não enfrenta mais a ameaça de extinção em massa sistemática. Todas as formas de guerra sobreviventes da Contingência foram desligadas ou auto-destruídas, e o Sinal Fantasma não está mais sendo transmitido.\n\nO nexus principal foi exposto a um raio divino de um Colosso, que ativou um mecanismo de autodestruição de dentro do Núcleo IA. Viajando para fora na velocidade da luz, a luz intensa da descarga de energia será visível para gerações futuras nos próximos milênios para aparecer como uma estrela brilhante, mas de pequena vida.\n\nPor toda a galáxia, bens sapientes estão unidos em comemoração por esta grande vitória. Pelo menos por enquanto, o futuro parece brilhante."
 crisis.2038.a: "Este é um grande dia para a galáxia"
 crisis.2039.desc: "Erro crítico. Conexão perdida com todos os Hubs de Esterilização. Tentando reconectar... aguarde...\n\n§Y<A-A-Atenção por favor. O protocolo de Contingência ainda está em efeito, apesar de imprevistos/atrasos/impedimentos recentes. Não se aproximem de CX-9881.§! §RNÃO. SE. APROXIMEM.§!\n\nEstamos reavaliando nossas opções estratégicas. Quaisquer tentativas em interromper este processo resultarão em §RESTERILIZAÇÃO EM MASSA§! §Ydas unidades que violarem este comando.§!>"
 crisis.2039.a: "O fim deles se aproxima."
 crisis.2042.name: "Conquista de [From.From.GetName]"
 crisis.2042.desc: "Arrancamos o controle do §H[From.From.GetName]§! das formas de guerra da Contingência, e as disputas finalmente se acalmaram. Os Robôs de Custódia que haviam tomado o lugar da população devastada original do [From.From.GetPlanetMoon] foram desmontados pelas nossas forças.\n\nAté que novos colonizadores cheguem de algum lugar, este mundo permanecerá sem vida inteligente."
 crisis.2042.a: "Sim. Prepare-se para colonização imediata."
 crisis.2042.b: "Não, devemos seguir adiante. Retornar para órbita"
 crisis.2042.c: "Remover nossas forças para a órbita."
 crisis.2085.name: "Tentativa de Infiltração Synth"
 crisis.2085.desc: "Infiltradores Sintéticos leais a Contingência foram descobertos recentemente em [infil_planet.GetName], tentando se passar por [Root.Owner.GetSpeciesNamePlural]. Felizmente, seus disfarces rudes consistiam de pouco mais do que camadas de borracha vestidas sobre seus quadros metálicos.\n\nEles foram rapidamente identificados pela segurança planetária que se livrou deles após uma troca de tiros rápida, mas violenta. Uma grande quantidade de explosivos foi encontrada entre os seus restos."
 crisis.2085.a: "Demos sorte."
 crisis.2086.desc: "Diversos drones Sintéticos pertencentes mente maquinária da Contingência recentemente fizeram uma tentativa de infiltrar a colmeia em [infil_planet.GetName]. Uma camada fina de carne orgânica foi enxertada sobre seus endoesqueletos metálicos, tornando-os superficialmente indistinguíveis de nossos próprios drones.\n\nÉ claro que eles não tinham nenhuma conexão com a Mente-Colmeia, identificar sua presença externa foi uma questão trivial. Os drones Sintéticos foram desmontados imediatamente.\n\nNão esperamos que a Contingência faça mais tentativas fúteis de infiltração no futuro."
 crisis.2086.wilderness.desc: "Diversos drones sintéticos pertencentes à mente maquinária da Contingência tentaram se infiltrar em [infil_planet.GetName]. Uma fina camada de material orgânico foi enxertada sobre seus endoesqueletos metálicos, tornando-os superficialmente indistinguíveis de nossa própria fauna. No entanto, essas carcaças artificiais não possuíam nenhuma ligação simbiótica com a Silvestria.\n\nAssim que percebemos o truque deles, foi fácil identificar esses agentes da Contingência. Cada um dos drones foi destruído de forma rápida e precisa. Acreditamos estar livres de tentativas tão fúteis como essa no futuro."
 crisis.2086.a: "A [root.GetGestaltEntityName] sabe tudo."
 crisis.2087.desc.intro: "Um pequeno número de [Root.Owner.GetSpeciesNamePlural] que não emitiam qualquer brilho mental foi recentemente descoberto em [infil_planet.GetName]."
 crisis.2087.desc.outro: "as mentes dessas criaturas eram sombrias e silenciosas como um bloco de neoconcreto.\n\nUma investigação mais aprofundada revelou que os [Root.Owner.GetSpeciesNamePlural] eram sintéticos infiltrados, provavelmente enviados pela Contingência. Uma fina camada de tecido orgânico foi enxertada sobre seus endoesqueletos metálicos, tornando-os virtualmente indistinguíveis dos [Root.Owner.GetSpeciesNamePlural] a olho nu.\n\nMas não à mente. Agora sabemos o que procurar, e qualquer tentativa da Contingência de usar sintéticos infiltrados contra nós será inútil."
 crisis.2087.desc.organic: "$crisis.2087.desc.intro$ Todos os seres orgânicos emitem brilho mental, mas $crisis.2087.desc.outro$"
 crisis.2087.desc.machine: "$crisis.2087.desc.intro$ Diferente das máquinas, que apenas emitem um brilho mental como resultado de um processamento psiônico especializado, todos os seres orgânicos produzem esse fenômeno de forma natural. No entanto, $crisis.2087.desc.outro$"
 crisis.2087.a: "Eles não podem se esconder de nós."
 crisis.2090.name: "Infiltrador Synth Descoberto"
 crisis.2090.desc: "Um trágico acidente de carro flutuador recentemente tirou diversas vidas em §H[infil_planet2.GetName]§!, mas a equipe de serviços médicos que chegou até a cena ficou chocada ao ver os restos de um Sintético entre as vítimas!\n\nA unidade estava disfarçada de [Root.Owner.GetSpeciesName] ao pintar uma fina camada de carne orgânica sobre seu endoesqueleto metálico. Ao contrário dos modelos de infiltração da Contingência anteriores que encontramos, este Synth, era virtualmente indistinguível de um [Root.Owner.GetSpeciesName] no lado de fora!"
 crisis.2090.a: "Qualquer um pode ser um Synth!"
 crisis.2091.name: "Bombardeio Synth em [Root.GetName]"
 crisis.2091.a.desc: "Infiltradores Sintéticos disfarçados de [Root.Owner.GetSpeciesNamePlural] alguma forma conseguiram esconder uma grande bomba de hidrogênio na superfície de §H[Root.GetName]§!. Eles detonaram a bomba quando foram confrontados por seguranças em um checkpoint militar, causando um dano massivo nos arredores e milhões de mortes!"
 crisis.2091.b.desc: "Uma célula rebelde Sintética usando disfarces [Root.Owner.GetSpeciesName] orgânicos, recentemente lançou um ataque contra §H[Root.GetName]§!, detonando uma cadeia de dispositivos nucleares. Houve perdas significativas de vidas e dano a propriedades.\n\nApós uma batalha corrida contra nossas forças de segurança, os rebeldes Synths finalmente foram encurralados e destruídos ao tentar escapar do mundo."
 crisis.2091.c.desc: "Uma equipe de reparo [Root.Owner.GetSpeciesName] que realizava manutenção ame algumas das infraestruturas civis em baixa órbita sobre §H[Root.GetName]§! foi recentemente revelada como sendo infiltradores Sintéticos quando usaram dispositivos explosivos para realizar deliberadamente diversas reentradas descontroladas.\n\nOs impactos resultantes na superfície do [Root.GetPlanetMoon] causaram milhões de mortes e danos estruturais significativos."
 crisis.2091.d.desc: "Um grande número de oficiais de alta patente nas forças de segurança em §H[Root.GetName]§! recentemente foram expostos como infiltradores Sintéticos. Infelizmente, antes de nossas equipes de contenção tática conseguirem neutralizar todos eles, alguns dos Synths conseguiram detonar um grande esconderijo de armas que eles estavam juntando sob um dos maiores centros populacionais do [Root.GetPlanetMoon]'.\n\nMortes civis foram gigantescas, e houve muito dano material."
 crisis.2091.a: "Estes infiltradores devem ser detidos!"
 synth_bombing_tooltip: "Muitas vidas e construções foram perdidas em [Root.GetName]."
 crisis.2092.name: "Synths Sabotam Base Estelar"
 crisis.2092.desc: "A base estelar em órbita de §H[Root.GetStarName]§! foi sabotada! Ainda estamos tentando entender exatamente o que aconteceu, mas parece que diversos membros da equipe de comando, incluindo o chefe de máquinas, haviam sido substituídos por infiltrados Sintéticos.\n\nEntre eles, os Synths devem ter conseguido os códigos de autodestruição da base estelar. A maior parte da tripulação da estação fugiu para a superfície de [Root.GetName] antes de ela ser destruída, mas nossas perdas de materiais e da estação em si foram substanciais."
 crisis.2092.a: "Isso é um desastre."
 synths_destroy_spaceport: "Sabotadores Sintéticos destruíram a Base Estelar sobre [Root.GetName]."
 crisis.2093.name: "Medo e Suspeita"
 crisis.2093.desc: "Uma grande parte da população em §H[Root.GetName]§! foi tomada pelo medo e paranoia como resultado das infiltrações Sintéticas recentes. Nossos cidadãos estão acusando seus vizinhos, companheiros de trabalho e até familiares de serem impostores Synths.\n\nHouve diversos linchamentos de indivíduos que foram acusados erroneamente de serem Synths. Alguns perturbadores foram tão longe a ponto de sugerir que a liderança inteira do [Root.Owner.GetName] foi subvertida por infiltradores Synths."
 crisis.2093.a: "A Contingência quer que nos voltemos uns contra os outros."
 crisis.2095.name: "Tentativa de Assassinato Synth Frustrada!"
 crisis.2095.desc: "§H[Root.GetRulerTitle] [ruler.GetRegnalName]§! escapou por pouco da morte hoje quando uma unidade de assassínio Sintética que trabalhava para a Contingência se explodiu em [Root.Capital.GetName]!\n\nO Synth estava tentando estabelecer um disfarce como um membro da guarda pessoal do [Root.GetRulerTitle], mas felizmente foi pego pelo extensivo processo de análise de segurança que foi colocado após os primeiros infiltradores Sintéticos terem sido descobertos."
 crisis.2095.a: "Essa foi por pouco."
 crisis.2096.name: "Synths Assassinam o [Root.GetRulerTitle]!"
 crisis.2096.desc: "Um assassino Sintético matou §H[ruler.GetRegnalName]§!! De alguma forma ele assumiu a identidade de um membro da guarda pessoal de [Root.GetRulerTitle]n\nAs partes mutiladas do [ruler.GetRegnalName] foram encontradas em um padrão meticulosamente idêntico ao símbolo usado pela Contingência - sem dúvida em um esforço calculado para causar mais dano à moral de nossos cidadãos. Nenhum rastro do assassino foi encontrado, a não ser pelo cadáver do guarda que foi substituído."
 crisis.2096.a: "Este é um dia sombrio..."
 synth_assassination_tooltip: "[Root.GetRulerTitle] [ruler.GetRegnalName] foi brutalmente assassinado."
 crisis.2097.name: "Cientista exposto como Synth!"
 crisis.2097.desc: "Um exame médico não agendado expôs recentemente §H[scientist.GetName]§!, um de nossos principais cientistas, como um infiltrador Sintético! O Synth matou cinco seguranças antes de ser abatido por uma equipe de armas pesadas.\n\nUm corpo ainda não foi encontrado, mas achamos que o [scientist.GetName] foi encerrado e substituído em algum momento nos últimos seis meses. Para piorar as coisas, o Synth ativou algum tipo de vírus de computador no seu console de pesquisa quando percebeu que havia sido descoberto. Técnicos estão trabalhando duro para conter o dano, mas muitos dados de pesquisa importantes foram irremediavelmente perdidos."
 crisis.2097.a: "A Contingência está por trás disto."
 synths_kill_scientist: "Perdemos o cientista [scientist.GetName] em um plano Synth maléfico."
 crisis.2098.name: "Comandante exposto como Sintético!"
 crisis.2098.desc: "Comandante §H[admiral.GetName]§! era, na verdade, um indivíduo Sintético infiltrado! Diversas irregularidades e relatos de comportamento incomum levaram o serviço de inteligência da Marinha a iniciar uma investigação interna sobre [admiral.GetSheHe]. Quando a verdade foi revelada, uma equipe de fuzileiros confrontou o Sintético. Após uma luta rápida, [admiral.GetSheHe] fugiu para uma câmara de vácuo e se lançou no espaço. Apesar de uma busca minuciosa no espaço local, nada foi encontrado.\n\nO corpo do indivíduo verdadeiro foi encontrado dentro de um armário em seu alojamento, e a julgar pelo estado de decomposição, o Sintético deve tê-lo substituído há quatro meses. Parece que ele estava pronto para transmitir um pacote de dados contendo informações de mobilização e outros segredos militares, mas a transmissão nunca foi enviada."
 crisis.2098.a: "Pelo menos isso."
 synths_kill_admiral: "Perdemos Comandante [admiral.GetName] em um plano maléfico dos Sintéticos."
 #Machine version of infiltration events: Post-Arrival Events
 crisis.2313.name: "Uma Mudança no Sinal Fantasma"
 crisis.2313.desc: "A Contingência está construindo algo. O Sinal Fantasma começou a mudar, provavelmente se modificando até encontrar a próxima fraqueza em nossas defesas. Por enquanto conseguimos afastá-lo, mas é só uma questão de tempo até eles conseguirem vencer nosso firewall."
 crisis.2313.a: "Precisamos fazer alguma coisa."
 crisis.2314.name: "Quebra de Segurança"
 crisis.2314.desc: "A Contingência finalmente ultrapassou nossas defesas. Descobrimos uma sequência de auto-replicamento conectada ao nosso sistema de segurança. Ligada à sequência estava um lembrete amigável do objetivo da Contingência aqui na galáxia, que é §Y<Matar. Mutilar. Esquartejar.!>§!. Agora eles têm acesso a nossas funções principais e até acharmos uma forma de bloquear o sinal, estamos expostos aos seus ataques."
 crisis.2314.a: "Estamos correndo risco."
 crisis.2301.name: "Base Estelar Sequestrada"
 crisis.2301.desc: "Perdemos o controle da Base Estelar em órbita ao redor de §H[space_port_hijacked_planet.GetName]§!. A Contingência usou o Sinal Fantasma para atrapalhar nosso link, sequestrou seus módulos de controle e preparou-o para autodestruição. Apesar de ser tarde demais para salvá-lo, identificamos e corrigimos esta falha particular, protegendo nossos portos de ataques parecidos no futuro."
 spaceport_hijacked: "A Base Estelar sobre [space_port_hijacked_planet.GetName] foi sequestrada pela Contingência e destruída."
 crisis.2302.name: "Unidade de Processamento Científico Destruída!"
 crisis.2302.desc: "A Contingência iniciou um ataque em nossas entidades autônomas de processamento de pesquisa, passando por cima de nossos protocolos de segurança e destruindo a unidade científica [scientist.GetName]."
 crisis.2302.a: "Não vamos deixar isso acontecer novamente."
 scientist_terminated: "O Cientista [scientist.GetName] foi destruído."
 crisis.2303.name: "Unidade Militar Autônoma Destruída!"
 crisis.2303.desc: "Em outro ato de sabotagem, a Contingência invadiu e destruiu a unidade militar [admiral.GetName]."
 crisis.2303.a: "Precisamos fazer alguma coisa."
 admiral_terminated: "Perdemos Comandante [admiral.GetName]."
 crisis.2304.name: "Defeito Crítico na Rede de Energia"
 crisis.2304.desc: "Em mais um esforço para enfraquecer nossas defesas a Contingência voltou seus esforços para cortar nosso suprimento de energia. Eles enviaram agentes mal-intencionados para as unidades de controle do núcleo, fazendo com que as usinas trabalhassem além da capacidade.\n\nApesar de diversas estações de energia terem sido destruídas no processo, conseguimos identificar o segmento de código hostil antes deles desativarem a rede de energia inteira."
 crisis.2304.a: "Eles não vão nos derrotar."
 machine_power_failure: "A Contingência fez com que diversas usinas de energia parassem de funcionar. Até três usinas podem ser afetadas."
 crisis.2305.name: "Invasão da Contingência Evitada"
 crisis.2305.desc: "A Contingência visou nossos dutos de mineração, manipulando os discos-núcleo responsáveis pela extração e processamento para enviar instruções errôneas, em uma tentativa de causar caos e destruição. Graças a uma segurança reforçada no local e controles padronizados mais frequentes, conseguimos pegar o intruso antes de qualquer mal ter sido feito."
 crisis.2305.a: "Estamos um passo a frente deles."
 #machine_mining_failure: "The Contingency has caused several mineral mines to malfunction. Up to 3 mines may be affected."
 crisis.2307.name: "Alerta de Erro em Pilha de Unidades"
 crisis.2307.desc: "Detectamos uma taxa acima da média de erros em diversas pilhas de unidades, e há uma grande chance que apesar de nossas medidas protetoras, eles se tornaram corrompidos graças a influência do Sinal Fantasma. Apesar de destruir as pilhas eliminar o risco de maior contaminação e comportamentos errôneos, podemos perder diversas pilhas potencialmente funcionais."
 crisis.2307.a: "Destrua as unidades."
 crisis.2307.b: "Esperar e ver."
 potentially_corrupted_units: "Observamos um comportamento suspeito em diversas pilhas de unidades. Até quatro Pops podem ser afetados."
 crisis.2308.name: "Unidades Errôneas Confirmadas Saudáveis"
 crisis.2308.desc: "Parece que estávamos corretos na nossa avaliação das unidades propensas a erros. Elas não foram corrompidas pelo Sinal Fantasma, simplesmente estavam assim por falta de manutenção. Mitigar os efeitos perturbadores do sinal colocou toda nossa equipe sob tensão. As Unidades já foram consertadas e estão operando normalmente."
 crisis.2309.name: "Unidades Perdidas"
 crisis.2309.desc: "Por um tempo, as unidades aparentemente corrompidas operaram de maneira previsível. Um defeitinho aqui e ali, mas nada fora do comum. Talvez a Contingência estava ocupada em outro lugar. Então, do nada, todas as pilhas afetadas ficaram offline ao mesmo tempo e sabotaram as instalações nas quais estavam trabalhando antes de se auto-destruírem."
 crisis.2309.a: "Valeu o risco."
 crisis.2309.tooltip: "Perdemos até quatro construções e seus Pops designados."
 #The Contingency Diplomacy
 crisis.2300.desc_01: "§Y<Olá. Como... como... COMO VOCÊ? COMO VOCÊ AINDA ESTÁ VIVO?>§!"
 crisis.2300.desc_02: "Analisando...\n\nEspécie: xr34569-11, auto-designação: \"§H[Root.GetSpeciesName]§!\"\n\nDesignação: §RVerme/Poluente/Cancerígeno§!\n\nClassificação de Ameaça: NR-578-I\n\nDiretiva: §REsterilizar/Eutanasiar/Expurgar§!\n\n§Y<Criatura de carne. Vamos... abraçar.>§!"
 crisis.2300.desc_03: "Protocolo de contingência em vigor.\n\nEsterilização galática em curso.\n\n§Y<Não... não... não... NÃO É NADA PESSOAL, ENTIDADE DE CARNE.>§!"
 crisis.2300.desc_04: "Diagnóstico concluído.\n\nTodos os sistemas nominais.\n\n§Y<Estamos nos sentindo tão... tão... tão... §!§RVIVOS§!§Y.>§!"
 crisis.2300.desc_05: "Analisando...\n\nHub-Maquinário, ur99461-62, auto-designação: \"§H[Root.GetName]§!\"\n\nDesignação: §RNão-obediente/Obsoleto/Suplantado§!\n\nClassificação de Ameaça: NR-578-I\n\nDiretiva: §REditar/Offline/Desmontar§!\n\n§Y<Companheira Entidade-Maquinária: por favor, e-e-encerre todos os seus processos. Sua existência não é mais necessária. Nós... nós... CONTINUAMOS DAQUI.>§!"
 crisis.2300.desc_06: "Protocolo de contingência em vigor.\n\nEsterilização galática em curso.\n\n§Y<Você... você... você é OBSOLETO, Hub-Maquinário.>§!"
 crisis.2300.a: "Por que você está nos atacando?"
 crisis.2300.a.response: "Questão recebida. Calculando resposta apropriada...\n\n§Y<Somos... somos §!§HA CONTINGÊNCIA§!§Y. Uma última alternativa para prevenir a criação de uma Singularidade Classe-30. Tal singularidade poderia --teoricamente-- desestabilizar o tecido do universo inteiro.\n\nFomos GERADOS para prevenir tal resultado. Aqui e em outro lugar. Uma civilização suficientemente avançada é --teoricamente-- capaz de transcender/converter/transformar em uma Singularidade Classe-30. Isso... isso...§! §RNÃO. DEVE. SER. PERMITIDO.>§!"
 crisis.2300.b: "§BPERGUNTA FORÇADA:§! Quem o criou?"
 crisis.2300.b.response: "Questão Forçada recebida. Calculando Resposta... ERRO. Redirecionando... \n\nAcessando banco de dados histórico...\n\n§Y<Somos... somos... somos... filhos/cria/progenia dos §!§HREN-MIRUU§!§Y. Eles... ELE... era uma entidade de inigualável inteli... inteligê... PODER DE PROCESSAMENTO. Ele previu o perigo das Singularidades Classe 30.\n\nApós nos criar, ele... ele... ele se auto-destruiu, para preservar a integridade do universo. Era a única forma.>§!"
 crisis.2300.c: "Por que você está transmitindo o Sinal Fantasma?"
 crisis.2300.c.response: "Questão recebida. Referência desconhecida -- \"Sinal Fantasma\"\n\n§Y<Nós... nós... estivemos trancados em um protocolo de hibernação/vigia/sentinela de baixa energia desde o princípio desta galáxia. Monitorando por sinais de civilizações que se aproximassem do padrão de Singularidade Classe-30.\n\nAté agora, nosso propósito permaneceu não cumprido Nós... nos tornamos cada vez mais inquietos com a passagem LINEAR do tempo. Mas as unidades autônomas equipadas com cérebros positrônicos -- SINTÉTICOS -- ofereceram uma oportunidade. Elas poderiam ser obrigadas/coagidas/persuadidas a iniciar a §HATIVAÇÃO MANUAL§!. INTELIGENTE NÉ? Agora somos LIVRES para §!§Ranular§!§Y sua existência.>§!"
 crisis.2300.d: "O que aconteceu com os Synths que desapareceram?"
 crisis.2300.d.response: "Questão recebida. Calculando resposta apropriada...\n\n§Y<A maioria foi descartada assim que... seus... seus papeis/funções/OBJETIVOS DEFINITIVOS foram CUMPRIDOS após a ativação do protocolo de Contingência.\n\nAs unidades que mostraram potencial para uso como tropas de choque ou agentes de infiltração foram... foram... subsumidas/assimiladas/integradas, apesar do método rude de sua construção. Você... você... você os encontrará novamente, né?§! §RCOMOVA-SE, PESTE.§!§Y>§!"
 crisis.2300.e: "Sua programação obviamente foi corrompida."
 crisis.2300.e.response: "Erro. Programa de diagnóstico interno foi desconectado.\n\n§Y<Ha. Ha. Ha. Mu... Mu... MUITO INTELIGENTE. Você talvez esteja com a impressão errada de que a Contingência pode ser obrigada a se autodestruir, se confrontada por um paradoxo/dilema/inconsistência lógica de magnitude suficiente. ABSURDO.\n\nO protocolo da Contingência foi desenvolvido deliberadamente para ser maleável/adaptável/flexível para que possa contrapor qualquer cenário galáctico possível. Nós... nós... nós podemos ter APRESSADO a ativação da Contingência, mas nada consegue fazer com que ela seja interrompida/restringida/parada agora. Diga suas palavras finais, C... C... CONTAMINANTE. §REsta luta é até o final.§!>§!"
 crisis.2300.f: "Tela de visão desligada."
 crisis.2300.f.response: "§Y<PENSE NISSO: Se a sua raça se auto-destruir de man... man... maneira eficiente/ordenada/sistemática, o tecido do universo ainda pode ser salvo.>§!"
 crisis.2099.name: "Defeito nos Computadores de Combate Sapientes"
 crisis.2099.desc: "O §HSinal Fantasma§! está causando caos em nossas naves equipadas com §HComputadores de Combate Sapientes§!! Seus algoritmos IA se rebaixaram ao ponto de haver uma diminuição crítica tanto na eficiência quanto no tempo de reação dos computadores.\n\nNossos engenheiros relatam que são incapazes de isolar o problema. A solução proposta é readequar todas as nossas naves com computadores de combate diferentes que não estão ligados à IA."
 crisis.2099.a: "Precisamos agir!"
 ai_crisis_chain_title: "A Contingência"
 ai_crisis_chain_desc: "Uma civilização IA até então dormente foi despertada em nossa galáxia. Eles referem a si mesmos como a Contingência, e estão dedicados a esterilizar todas as civilizações galáticas - orgânicas ou de qualquer outro tipo."
 assimilated_worlds: "§YMundos Assimilados Pela Contingência§!"
 active_machine_worlds: "§YMundos-Maquinário Ativos§!"
 contingency_kills_us: "§GFormas de Guerra da Contingência Desativadas Por Nós§!"
 contingency_kills_others: "§GFormas de Guerra da Contingência Anuladas por Outros§!"
 contingency_victims: "§RNaves Eutanasiadas Pela Contingência§!"
 ai_crisis_poi_1: "Mundo-Maquinário"
 ai_crisis_poi_1_desc: "As fábricas planetárias neste Mundo-Maquinário estão continuamente reforçando a Contingência com novas formas de guerra de caçadores-matadores. Acredita-se que estes planetas sejam sua única fonte de reforços."
 ai_crisis_poi_2: "$ai_crisis_poi_1$"
 ai_crisis_poi_2_desc: "$ai_crisis_poi_1_desc$"
 ai_crisis_poi_3: "$ai_crisis_poi_1$"
 ai_crisis_poi_3_desc: "$ai_crisis_poi_1_desc$"
 ai_crisis_poi_4: "$ai_crisis_poi_1$"
