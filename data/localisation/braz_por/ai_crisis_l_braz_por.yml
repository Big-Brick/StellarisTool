 ai_crisis_poi_5: "$ai_crisis_poi_1$"
 ai_crisis_poi_5_desc: "$ai_crisis_poi_1_desc$"
 AI_CRISIS_PROJECT: "Bloqueando o Sinal Fantasma"
 AI_CRISIS_PROJECT_DESC: "Precisamos encontrar uma forma de bloquear o Sinal Fantasma e impedí-lo de corromper nosso núcleo principal antes que seja tarde demais."
 ghost_signal_5: "Sinal Fantasma"
 ghost_signal_5_desc: "§LEste estranho sinal tachyon está tendo um efeito adverso nos seres Sintéticos por toda a galáxia.§!\n\n§YEfeito sobre Pops Sintéticos:§!\nProdução Mineral: §R-70%§!\nProdução de Energia: §R-70%§!\nProdução de Pesquisa: §R-70%§!\nProdução de Unidade: §R-70%§!\nAtração da Ética Governante: §R-70%§!\n\n§YNaves com Computadores de Combate Sapientes:§!\nTaxa de Disparos: §R-50%§!\nRastreamento: §R-5§!"
 ghost_signal_4: "$ghost_signal_5$"
 ghost_signal_4_desc: "§LEste estranho sinal tachyon está tendo um efeito adverso nos seres Sintéticos por toda a galáxia.§!\n\n§YEfeito sobre Pops Sintéticos:§!\nProdução Mineral: §R-55%§!\nProdução de Energia: §R-55%§!\nProdução de Pesquisa: §R-55%§!\nProdução de Unidade: §R-55%§!\nAtração da Ética Governante: §R-55%§!\n\n§YNaves com Computadores de Combate Sapientes:§!\nTaxa de Disparos: §R-40%§!\nRastreamento: §R-4§!"
 ghost_signal_3: "$ghost_signal_5$"
 ghost_signal_3_desc: "§LEste estranho sinal tachyon está tendo um efeito adverso nos seres Sintéticos por toda a galáxia.§!\n\n§YEfeito sobre Pops Sintéticos:§!\nProdução Mineral: §R-40%§!\nProdução de Energia: §R-40%§!\nProdução de Pesquisa: §R-40%§!\nProdução de Unidade: §R-40%§!\nAtração da Ética Governante: §R-40%§!\n\n§YNaves com Computadores de Combate Sapientes:§!\nTaxa de Disparos: §R-30%§!\nRastreamento: §R-3§!"
 ghost_signal_2: "$ghost_signal_5$"
